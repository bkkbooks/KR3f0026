body:
  text: 厯算全書卷五十四宣城梅文鼎撰三角法舉要卷五測量三角用法算例已具兹則舉髙深廣逺以徴諸實事亦與算例互相補備也一測髙一測逺一測斜坡一測深附隔水量田附解測量全義三角測髙第一術自平測髙假如有塔不知其髙距三十丈立表一丈用象限儀測得髙二十六度三十四分弱依切線術求得塔髙一十六丈一半徑一二戊角切線五三距塔根丙乙即戊丁三十丈四塔頂髙甲丁端是截算表以上十五丈加戊丙表一丈即丁乙共得塔髙十六丈甲乙凡用象限儀以垂線作角與用指尺同理指尺即窺衡亦曰窺管亦曰窺筒若戊丙表立於髙所當更加立處之髙以為塔髙省算法從表根丙平安象限以一邉指塔根乙一邉指癸乃順丙癸直線行至癸得三十丈與丙乙等復於癸平安象限作癸角與戊角等邉指丙尺指壬則壬丙逺即甲丁之髙亦加丁乙為塔髙論曰癸角同戊角丙癸同丙乙丙與乙並正角則兩句股形等立面與平面一也又術自丙向癸却行以象限平安邉指丙尺指乙求作戊之餘角得己丙之距即同甲丁之髙又省算法用有細分矩度自戊數至癸令其分如丙乙之距或兩倍三倍從癸數壬癸直線之分即甲丁之距也先以二分為丈或三分為丈今亦同之用矩度以垂線作角其用亦同三角測髙第二術平面則不知逺之髙法用重測假如有山頂欲測其髙而不知所距之逺依術立二表相距一丈二尺用象限儀測得髙六十度十九分退測後表得五十八度三十七分查其兩餘切線以相減得較數為法表距乘半徑為實算得山髙三十一丈一餘切線較四二半徑一三表距戊己一丈二尺四山髙甲丁三十丈加表一丈共三十一丈省算法用矩度假令先測指線交於辛後測指線交于庚成辛庚戊三角形法于兩指線中間以兩測表距即戊己變為分如壬癸小線引長之至丙即丙戊所當測髙論曰此即古人重表法也或隔水量山或於城外測城內之山並同三角測髙第三術從髙測髙又謂之因逺測髙假如人在山顛欲知此山之髙但知山左有橋離山半里用象限測橋得逺度一十八度二十六分强依切線法求得山髙一里半一甲角切線半徑一二半徑甲角餘切三二八三橋逺戊丁一百八十步四山髙甲丁五百四十步五尺省算法用矩度作壬癸線以當戊丁則己壬當甲丁三角測髙第四術從髙測不知逺之髙法用重測假如人在山上欲知本山之髙然又無可據之逺但山有樓或塔量得去山二十一丈以象限儀指定一處于樓下測得五十五度二十六分又于樓上測得五十三度五十分用餘切線求得山髙三百四十四丈五尺一兩餘切較四二二下一測餘切六八九三樓髙兩測之距二十一丈四山髙三百四十四丈五尺省算法用矩度上測交庚下測交辛成辛己庚三角形法于兩指線中間以上下兩測之距變為分如壬癸小線引長之至丙即壬丙當所測本山之髙三角測髙第五術若山上無兩髙可測則先測其弦但山上有兩所可以並見此物即可測矣甲乙為山上兩所不拘平斜但取直線任指一處如戊於甲於乙用器兩測之成甲乙戊形此形有甲乙兩角又有甲乙之距為兩角一邉可求甲戊邉法為戊角之正弦與甲乙邉若乙角之正弦與甲戊再用甲戊丁句股形為半徑與甲戊若甲角餘弦與甲丁即山之高也三角測髙第六術借兩逺測本山之髙有山不知其髙亦無距山之逺但山前有大樹從此樹向山而行相去一百八十五丈又有一樹人在山上可見兩樹如一直線即於山上以象限儀測此二樹一測逺樹四十三度三十二分一測近樹三十度七分用切線較得本山髙五百丈一切線較三七二半徑一三兩逺之較一百八十五丈四本山髙五百丈省算作壬癸小線當兩逺之距己戊而丙甲當本山髙甲丁三角測髙第七術用山之前後兩逺測髙甲為山顛可見戊己兩樹其樹與山參相直如山南樹直正子北樹直正午而不知其距但山外有路與此樹平行為庚辛其長三里如兩樹正南北此路亦自南向正北行即借庚辛之距為兩樹之距以兩切線并為法求之先從甲測巳得甲角一十七度四分又從甲測戊得甲角三十四度三十四分法為兩切線并與己戊若半徑與甲丁也一率兩切線并九九六二率半徑一三率己戊即庚辛三里求得四率甲丁三里四步又三之一强三角測髙第八術測山上之兩髙甲山上有塔如乙欲測其髙如乙甲之距於戊安儀器測乙測甲得其兩戊角之度一乙戊丁二甲戊丁各取其切線相減得較法為半徑比切線較若戊丁與乙甲省算法數戊丙之分以當戊丁作壬癸丙小線則壬癸之分即當乙甲用矩度亦同三角測髙第九術隔水測兩髙之橫距有甲乙兩髙在水外欲測其相距之逺任於丙用儀器以邉向丁窺筒指甲得甲丙丁角一百二十五度又指乙得乙丙丁角五十度次依丙丁直線行至丁得一百步再用儀器以邉向丙窺筒指甲得甲丁丙角三十九度又指乙得乙丁丙角一百零八度又甲丁乙角六十九度得三角形三一甲丁丙二乙丁丙三甲丁乙今算甲丁丙形有丁丙邉丁丙二角求甲丁邉一率甲角一十六度正弦二七五六四二率丁丙一百步三率丙角一百二十五度正弦八一九一五求得四率甲丁邉二百九十七步次乙丁丙形有丁丙邉丙丁二角求乙丁邉一率乙角二十二度正弦三七四六一二率丁丙邉一百步三率丙角五十度正弦七六六四求得四率乙丁邉二百四步末乙丁甲形有甲丁邉二百九十七步乙丁邉二百四步丁角六十九度先求甲角一率兩邉之總五百一步二率兩邉之較九十三步三率半外角五十五度半切線一四五五一求得四率半較角切線二七九查表得一十五度七分弱以減半外角得甲角四十度二十三分强次求甲乙邉一率甲角正弦六四七九二率乙丁邉二百四步三率丁角正弦九三三五九求得四率甲乙邉二百九十四步弱論曰此所測甲丁及乙丁皆斜距也或甲乙兩髙並在一山之上於山麓測之或甲乙分居兩峯於兩峯間平地測之或甲在水之東乙在水之西於一岸測之並同若用有度數之指尺並可用省算之法三角測髙第十術隔水測兩髙之直距有兩髙如乙與甲于戊于庚測之先以乙庚戊形求乙庚斜距次以甲庚戊形求甲庚斜距末以乙甲庚形有乙庚邉甲庚邉及庚角求乙甲邉即所求三角測髙第十一術若山之最髙顛為次髙所掩則用遞測山前後左右地勢不同則用環測環測者從髙測下與測深同太髙之山則用屢測癸極髙為甲次髙所掩則先測甲復從甲測癸謂之遞測乙丁與子丑居癸山之下為地平而各不等則從癸四面測之如測癸辛之髙以辛乙為地平又測癸戍之髙以戌子丑為地平則乙丁與子丑之較為戍辛謂之環測若山太髙太大則於乙測甲又於甲測癸或先測卯又測寅又測丑測子再從子丑測癸細細測之則真髙自見而地之髙下亦從可知矣謂之屢測三角測逺第一術平面測逺有所測之物如乙於甲立表安象限以邉指乙餘一邉對丁從甲乙直線上任取九步如丁於丁復安象限以邉對甲窺管指乙得丁角七十一度三十四分用切線算得乙距甲二十七步一半徑二丁角切線三丁甲四乙甲若欲知丁乙之距依句股法甲丁甲乙各自乘并而開方即得乙丁若徑求乙丁則為以半徑比丁角之割線若甲丁與丁乙也是為以句求弦省算用矩度自丁數自癸取丁癸之分如丁甲之距或以分當步或二分或三分當一步皆可作壬癸丁小句股則壬癸之分即乙甲也或一分當步或二分三分並如丁癸之例而丁壬亦即當丁乙若尺上有分數即徑取之若先從丁測測以測器向甲指尺向乙作丁角次依丁甲直線行至甲務令測器之一邉順丁甲直線餘一邉指乙則甲為正方角如前算之即得若甲非正方角則于丁甲直線上或前或後移測求為正方角乃止三角測逺第二術省算法人在甲欲測乙之逺於甲置儀器一邉向乙一邉向丁成正方角乃依甲丁直線行至丁以邉向甲窺管指乙作四十五度角即甲丁與甲乙等若用矩度以乙丁線正對方角則丁角為正方角之半而甲丁等乙甲論曰丁角為正方角之半則乙角亦正方角之半而句與股齊故但量甲丁即知甲乙又省算法於甲置儀器以邉向丁窺管指乙作六十度角順甲丁直線行至丁復作六十度角則甲丁等甲乙論曰甲角丁角俱六十度則乙角亦六十度矣故三邉俱等若丁不能到則於甲丁線上取丙以儀器二邉對甲對乙成正方角則甲丙為乙甲之半三角測逺第三術平面測逺用斜角人在甲測乙而兩旁無餘地可作句股則任指一可測之地如丁量得丁甲二十丈於丁安儀器以邉向甲窺筒指乙得丁角四十六度又於甲安儀器以邉指丁窺筒指乙得乙甲庚角二十一度加象限九十度得甲鈍角一百一十一度法為以乙角之正弦二十三度乃甲丁二角减半周之餘比丁甲若丁角之正弦與乙甲算得乙甲三十六丈八尺二寸若求乙丁則為以乙角之正弦比丁甲若甲角之正弦與乙丁算得乙丁四十七丈七尺八寸甲為鋭角法同省算法於儀器作壬甲線與乙丁平行作壬癸線與乙甲平行成壬癸甲小三角形與丁乙甲等則甲癸當甲丁而壬癸當甲乙又壬甲當乙丁用矩度同但于象限內作橫直分用同矩度論曰壬角既同乙角壬甲與乙丁平行壬癸與乙甲平行則作角必相等癸鈍角又同甲角則兩三角相似而比例等鋭角形於甲測乙用矩度之邉指丁作甲角另用一矩度其矩須於兩面紀度從丁測之以邉向甲窺筒指乙作丁角末移丁角作癸角於器上作壬癸線與乙丁平行則癸甲當丁甲而壬甲當乙甲壬癸當乙丁三角測逺第四術平面測逺借他線為比例甲乙為兩所順甲乙直線行任取若干步至丙又於丙任作直線至丁得若干步於丁安儀器以邉對甲窺衡指丙作丁角順此直線至戊復安儀器邉對乙衡指丙作戊角令與丁角等則丙丁比丁戊若丙甲與甲乙省算法於乙甲直線上取丙又從丙作丙戊直線截丁丙如乙丙於丁用象限窺乙作丁角再於戊窺甲作戊角令與丁角等則丁戊即甲乙又法甲置儀器指乙指丁作角以減半周成外角己戊為甲角之度丙庚戊為外角之度於丁置儀器指甲指乙使丁角如半外角之度但量甲丁即得甲乙論曰凡外角能兼內餘二角乙丁之度丁角既為外角之半則乙角亦外角之半矣角等者所對之邉亦等故甲丁等甲乙三角測逺第五術平面測逺借他形為比例法從甲測乙任立一表於丙從甲用儀器以邉向乙窺管指丙得甲角復於丁加儀器以邉向戊窺管指丙使丁丙甲為一直線而作丁角與甲角等乃順儀器邉取直線至戊令戊丙乙為一直線則丁丙與丁戊若丙甲與甲乙鈍角形句股形並同一理論曰丙戊丁與丙甲乙兩三角形相似以兩形之丙角為交角必相等而丁角又等甲角則戊角亦等乙角矣故其比例等三角測逺第六術省算有甲乙兩所欲測其距如前立丙表以器測得甲丙乙角之度又順乙丙直線行至戊令丙戊之距同甲丙而止再從戊行至丁從丁窺丙至甲成一直線於此直線上進退移測使乙丁丙角為乙丙甲角之半則但量丁戊即同乙甲甲為鈍角或丙為鈍角並同論曰甲丙與丙戊既相等乙丁丙角為乙丙甲外角之半則丙乙丁角亦外角之半是乙丙與丁丙亦等也而丙交角又等是甲丙乙三角形與戊丙丁形等角等邉也故丁戊即乙甲三角測逺第七術重測甲乙為兩所欲測其距而俱不能到則兩測之於戊於丁量得戊丁之距十六步半用器測得戊角五十度四十三分丁角三十六度一十分兩角之餘切線較五五為一率半徑一為二率戊丁十六步半為三率得四率為乙甲之距三十步若求戊甲之距以兩測之餘切較五五為一率先測戊角之餘切八一八為二率丁戊十六步半為三率得四率戊甲二十四步五四論曰此即古人重表測逺法也必丁戊甲直線與乙甲線橫直相遇使甲為正角其算始真假如乙甲正南北距則丁戊甲必正東西斯能橫直相交而成正角也三角測逺第八術分兩處重測乙岸在河東欲測其距西岸之逺如甲則任於甲之左右取丁戊兩所與甲參相直而距河適均測得丁角五十度四十三分戊角五十五度四十三分用兩角度之餘切線并一五為一率半徑一為二率丁戊之距九十六步為三率求得四率乙甲之距六十四步為兩岸闊論曰此法但取丁戊直距與河岸平行則不必預求甲㸃而自有乙甲之距為丁戊之垂線尤便於測河視用切線較更簡捷而穩當矣三角測逺第九術用髙測逺甲乙為兩所不知其逺而先知丁乙之髙於甲用儀器測丁乙之髙幾何度分即知甲乙法為半徑比甲角之餘切若丁乙髙與甲乙之逺若人在髙處如丁用髙測逺則為半徑比丁角之切線若丁乙與甲乙其理並同但於丁加儀器而用正切三角測逺第十術用不知之髙測逺欲知丁乙之逺而不能至乙乙之上有庚又不知庚乙之髙法用重測先於丁測之得丁角三十八度一十三分又依丁乙直線進至甲測之得甲角五十三度五十二分强兩餘切較五四一為一率丁角餘切一二七一為二率丁甲之距二十步為三率得四率丁乙四十七步三或丁後有餘地退後測之亦同省算作壬癸丙線以壬癸分當丁甲之距壬丙當丁乙之逺若人在髙處如庚於庚測丁測甲以求丁乙其法亦同但於庚施儀器而用正切法為以兩庚角之切線較比丁庚乙之切線若丁甲與丁乙三角測逺第十一術用髙上之髙測逺甲乙為兩所而乙之根為物所掩如山麓有小阜坡陀礨砢林木蔽虧或島嶼盤糾荻葦深阻難得真距若用兩測甲外又無餘地但取其髙處如戊為山顛山上又有石臺臺上有塔如丁丁戊之髙原有定距以此為用從甲測丁又測戊得兩角一丁甲乙二戊甲乙求其切線法為以切線較比半徑若丁戊與乙甲省算作壬癸丙小線以壬癸當丁戊則甲丙當甲乙矩度同若從髙測逺則於丁於戊兩用儀器測甲用丁戊兩角之餘切較以當丁戊而半徑當甲乙其理亦同三角測逺第十二術從髙測兩逺甲乙兩逺人從髙處測之於丁用儀器測甲測乙得兩丁角一甲丁丙二乙丁丙法為以半徑比兩角之切線較若丁丙髙與乙甲也又法既得兩角則移儀器窺戊作戊丁甲角如甲丁丙之倍度又移窺己作己丁乙角如乙丁丙之倍度則但量己戊即知乙甲三角測逺第十三術連測三逺丙乙為跨水長橋甲乙為橋端斜岸今於丁測橋之長并甲乙岸闊及其距丁之逺近法於丁安儀器以邉指戊衡指甲指乙指丙作丁角五一甲丁戊二乙丁戊三乙丁甲四戊丁丙五乙丁丙皆丁角而有大小次順儀器邉直行至戊得丁戊之距於戊復用儀器以邉指丁衡指丙指乙指甲作戊角三一丁戊丙二乙戊丙三甲戊丁皆戊角而有大小一甲丁戊形有丁角戊角有丁戊邉可求甲丁邉一乙丁戊形有丁角戊角有丁戊邉可求乙丁邉一戊丁丙形有戊角丁角有丁戊邉可求丁丙邉以上並二角一邉求餘邉得甲乙丙三處距丁之逺近一乙丁丙形有丙丁邉乙丁邉有丁角可求乙丙邉一乙丁甲形有甲丁邉乙丁邉有丁角可求乙甲邉以上並二邉一角求餘邉得岸闊與橋長三角測斜坡第一術斜坡上平面測兩所之距斜坡上有甲乙兩所欲量其相距之數任立丙表測得乙丙甲角度乃順甲丙直線進退窺乙至戊得乙戊丙角為乙丙甲角之半又橫過至丁從丁窺丙至乙成一直線順此直線進退窺甲至丁得甲丁丙角亦為丙角之半則丁戊即乙甲又法不必立表但任指一㸃為丙而於甲丙直線上任取己㸃乙丙直線上任取庚㸃作庚丙己三角形有己角庚角即知丙角末乃如上作丁戊兩角為丙角之半即所求論曰此因乙甲在斜面髙處而不能到故借用丁丙戊形測之以丁丙戊乙丙甲兩形相等故也何則丙交角既等而乙丙甲外角原兼有丙乙戊乙戊丙兩角之度戊角既分其半乙角亦半則兩角等而乙丙戊丙兩邉亦等矣凖此論之則甲丁丙角為丙外角之半者丁甲丙角亦必為丙外角之半而甲丙丁丙亦等矣兩形之角既等各兩邉又等則三邉俱等而戊丁即乙甲若甲乙兩所在下而丁戊兩測在上亦同三角測斜坡第二術斜坡測對山之斜髙對山之斜髙如甲戊乙於對山之斜坡測之如丙丁先量得丙丁之距於丙安儀器得丙角二一乙丙丁二戊丙丁於丁安儀器得丁角四一乙丁丙二乙丁戊三戊丁丙四乙丁甲成各三角形先用乙丙丁形有丙角丁角及丁丙邉測乙丁邉次用戊丙丁形有丙丁二角及丁丙邉測丁戊邉三用乙丁戊形有乙丁戊丁二邉及丁角測乙角及乙戊邉四用乙丁甲形有乙角丁角及乙丁邉測乙甲邉乙甲內減乙戊得戊甲邉乙戊甲為垂線之髙法同三角測斜坡第三術測對坡之斜髙及其巖洞從丙從丁測對面之斜坡戊甲及乙戊一乙丙丁形有丙丁兩測之距丙角丁角可求乙丁邉二戊丙丁形有丙丁邉丁角丙角可求丁戊丙戊二邉三乙丁戊形有乙丁邉戊丁邉丁角可求乙戊邉為所測對山上斜入之巖四丙丁甲形有丁角丙角丙丁邉可求丙甲邉五甲丙戊形有丙戊邉丙甲邉丙角可求戊甲邉為所測對坡斜髙或戊為髙處基址乙為房檐亦同三角測深第一術測井之深及濶甲乙為井口之濶於甲作垂線至丁或用磚石投之以識其處從乙測之得乙角成甲乙丁句股形即以甲乙井口為句得甲丁股為井之深既得乙丙深即甲丁即可用乙己戊形得己戊為底濶法以半徑當井深乙丙以兩乙角一戊乙丙二己乙丙之切線并當井底之濶己戊若不知井口則立表於井口如庚甲求庚甲二角成庚甲丁形測之三角測深第二術登兩山測谷深先於二山取甲乙之平而得其距數為橫線即可用三角形求丙丁垂線為谷之深與測髙同理亦可用以測髙也法為甲乙兩角之餘切線并比半徑若甲乙與丙丁論曰深與髙同理測深之法即測髙之法也存此數則以發其例有不盡者於測髙諸術詳之可也附隔水量田法甲乙丙丁田在水中不可得量于岸上戊庚兩處用儀器測之得諸三角形算得其邉一甲乙二乙丙三丙丁四丁甲次求乙丁對角線分為兩三角形一甲乙丁二丙乙丁末用和較法求得分形之兩垂線一甲癸二壬丙并兩垂線而半之以乘乙丁即得田積或用三較連乘法求三角形積并之亦同凡有平面形在峭壁懸崖之上及屋上承塵可以仰觀者並可以此法測之解測量全義一卷十二題加減法甲寅象限弧甲乙半徑全數為首率丙寅弧之正弦丙辛為一率丁寅弧之正弦丁庚為三率戊己為四率二三相乘為實首率為法法除實得四此本法也今以加減得之則不用乘除丙寅加丁寅即辰丙為辰寅總弧其餘弦辰卯即子癸丙寅內減丁寅為丑寅即丙丁存弧其餘弦癸丑以子癸減癸丑餘子丑平分之於壬為壬子或壬丑即四率其壬子壬丑皆與戊己等此因總弧不及象限故以兩餘弦相減甲寅象限弧甲乙半徑全數為首率丙寅弧之正弦丙辛為二率丁寅弧之正弦丁庚為三率戊己為四率以上皆與前同丙寅加丁寅即辰丙為辰寅總弧此總弧大於象限其餘弦卯辰即子癸丙寅內減丁寅即丙丑餘丑寅為存弧其餘弦丑癸以子癸加丑癸為子丑半之於壬分為壬子及壬丑二線皆與戊己同即為四率如所求此因總弧過象限故以兩餘弦相加今訂本書之訛甲寅皆象限弧甲乙半徑一為首率丙辛五九九九五為二率丁庚二五一為三率以三率法取之得一五四為四率今用加减法以丙辛線為正弦查其弧得丙寅三十六度五十二分亦以丁庚線為正弦查其弧得丁寅十四度二十九分以丙寅弧與丁寅弧相加得總弧辰寅五十一度二十一分其餘弦六二四五六如辰卯即子癸又以丙寅弧與丁寅弧相減得存弧丑寅二十二度二十三分其餘弦九二四六六如丑癸因總弧小於象限當以兩餘弦相減其較三一如子丑於丑癸內减子癸得之乃平分子丑於壬其數一五五為壬丑或壬子皆與戊己同即為四率此所得與三率所推但有微差而不相逺按此以加減代乘除依其法宜如此今刻本相減相并訛為并而相減又於相并之弧訛為五十度二十分相減之存弧訛為二十二度二十四分故其正弦皆訛而所得之四率只一四三一與三率所推不合矣又按以加減代乘除之法不過以明圖法之妙其中又有此用耳若以入算終不如乘除之便何也設問每多整數而正弦之數皆有畸零不能恰合一也先用設數求弧度必用中比例始得相合則於弧度亦有畸零二也弧度既有畸零則其查餘弦又必用中比例三也兩餘弦有用加之時有用減之時易至於訛四也及其所得四率以較三率法之所得終有尾數之差五也蓋論數學則宜造其微而施之於用則貴其簡易若可以簡易者而故引之繁重又何貴乎故曰不如乘除之便也觀設例之時便有訛錯如此則其不便於用亦可見矣又按此加減法即測量全義第七卷所言加減也其以總存兩餘弦相加減而半之者即初得數也然彼以兩正弦相乘得之此以加減得之而省一乘矣實弧三角中大法而彼但舉例而隱其圖姑示其端於此而又不直言其即弧度之初得數此皆譯書者祕惜之故耳向後二圖發明所以然之故甲寅象限弧乙丙半徑為首率丙寅弧之正弦丙辛為次率丙丑弧之正弦丑戊為三率辰丙弧同丙丑其正弦辰戊亦同丑戊得戊巳為四率丑壬及壬子並同論曰戊巳辰或丑壬戊亦同句股形與丙辛乙句股形相似故其比例等法為乙丙與丙辛若丑戊與丑壬也或辰戊與戊巳亦同又論曰凡兩十字垂線相交作句股則其形俱相似如辰丑線即丙丑及丙辰之正弦與丙乙半徑相交於戊㸃一十字也辰午線辰寅弧之正弦也丑癸線丑寅弧之餘弦相交於子㸃一十字也此兩十字相交而成諸句股形則俱相似矣故戊壬庚與丑壬戊相似而戊壬庚原與丙辛乙相似則丑壬戊與丙辛乙不得不為相似之形矣解曰乙丙首率半徑也丙辛正弦為次率其弧丙寅丑戊正弦為三率其弧丙丑丙丑既與丙辰同則以丙丑三率之弧也加丙寅次率之弧成辰寅總弧而辰卯則總弧之餘弦也以丙丑三率之弧减丙寅次率之弧其餘丑寅為存弧而丑癸則存弧之餘弦兩餘弦相減其較為子丑子癸同辰卯故以子癸减癸丑得較子丑子丑折半於壬而壬丑與壬子皆同戊巳是為所求之四率也如此以量法代算法的確不易但細數難分耳若以酉丙為過象限之大弧丙丑為小弧則酉丑為總弧其正弦丑丁餘弦丑癸即丁乙酉辰為存弧其正弦辰午餘弦辰卯即子癸算法略同但先所用者存弧之正弦小於總弧今則總弧正弦小於存弧正弦大則餘弦小正弦小則餘弦反大加減之用以小從大其理無二故其圖可通用也又按壬丑即初得數也兩正弦相乘以半徑除之者也乙亥即次得數也兩餘弦相乘以半徑除之者也今改用加減則以兩弧相并為總弧而相較之餘為存弧存總兩餘弦相加減而半之成初得數省兩正弦乘矣又以初得數去減餘弦成次得數省兩餘弦乘矣兩餘弦加減例凡總存二弧俱在象限內或俱出象限外則兩餘弦相減若存弧在象限內總弧在象限外則兩餘弦相加初得數減餘弧例凡存弧之正弦小於總弧即用存弧之餘弦在位以初得數減之餘為次得數若總弧之正弦小於存弧即用總弧之餘弦在位以初得數減之餘為次得數蓋弦小者餘弦大其餘弦內皆兼有初得次得兩數詳見環中黍尺甲寅象限弧乙丙半徑為首率丙寅弧之正弦丙辛為次率丙丑弧之正弦丑戊為三率辰丙弧同丙丑其正弦辰戊亦同丑戊求得戊巳為四率丑壬壬子並同以上皆與前圖同論曰凖前論丙辛乙句股形與丑壬戊句股形相似法為乙丙與丙辛若丑戊與丑壬也或辰戊與戊巳亦同解曰乙丙首率半徑全數也丙辛正弦為次率其弧丙寅丑戊正弦為三率其弧丙丑而丙丑三率即丙辰以加丙寅次率之弧成辰寅總弧而辰卯亦總弧之餘弦也以丙丑三率之弧減丙寅次率之弧其餘丑寅為存弧而丑癸則亦存弧之餘弦也兩餘弦相加成子丑子癸同辰卯皆總弧餘弦子丑折半於壬而壬丑同壬子亦同戊巳則所求之四率也厯算全書卷五十四
