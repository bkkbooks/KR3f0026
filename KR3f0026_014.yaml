body:
  text: 厯算全書卷十四宣城梅文鼎撰冬至攷唐宋金元六家算冬至本術唐開元大衍厯僧一行造演紀上元閼逢困敦之歳距開元十二年甲子積九千六百九十六萬一千七百四十算通法三千四十策實百一十一萬三百四十三策餘萬五千九百四十三策實乘積算曰中積分盈通法而一為積日爻數去之餘起甲子算外得天正中氣辰法七百六十即半辰法刻法三百四凡發斂加時各置其小餘以六爻乘之辰法而一為半辰之數不盡進位六約為分分滿刻法為刻命辰起子半算外唐宣明厯徐昻造通法曰統法策實曰章歳策餘曰通餘爻數曰紀法通紀法為分曰旬周章歳乘年曰通積分演紀上元甲子至長慶二年壬寅積七百七萬一百三十八算外統法八千四百章嵗三百六萬八千五十五通餘四萬四千五十五刻法八十四辰法七百半辰法三百五十宋崇寧紀元厯演紀上元上章執徐之歳距元符三年庚辰嵗積二千八百六十一萬三千四百六十算至崇寧五年丙戌歳積二千八百六十一萬三千四百六十六算日法七千二百九十辰法一千二百一十五半辰法六百七半刻法七百二十九期實二百六十六萬二千六百二十六歳周三百六十五日餘一千七百七十六旬周四十三萬七千四百紀法六十置積年期實乘之為氣積分滿旬周去之不滿日法而一為大餘命己卯即所求天正冬至日辰及餘其小餘倍之辰法而一為辰數不滿五因刻法而一為刻數勿菴法小餘進一位刻法收之為刻不盡為刻分刻加二退位得時金趙知微重修大明厯演紀上元甲子距大定二十年庚子八千八百六十三萬九千六百五十六年大定庚子即宋孝宗淳熈七年距元至元辛巳一百一年日法五千二百三十分歳實一百九十一萬二百二十四通餘二萬七千四百二十四旬周三十一萬三千八百紀法六十歳實乘積年為通積分旬周去之不滿日法約之為大餘命甲子辰法二千六百一十五半辰法一千三百七半刻法三百一十三秒八十凡小餘六因之辰法除之不盡刻法除之為刻宋統天厯演紀上元甲子歳距紹熈五年甲寅積三千八百三十至慶元己未歳積三千八百三十五至至元辛巳歳積三千九百一十七策法一萬二千歳分四百三十八萬二千九百一十餘六萬二九一氣差二十三萬七千八百一十一法通得一十九日八一七五斗分差一百二十七紀實七十二萬歳分乘積算氣差減之為氣汎積積算距算相減為距差斗分差乘之萬約萬約者萬分為分萬秒為秒也半以上收為秒半以下則棄之矣為躔差小分半以上從秒一復以距差乘之秒半以上從分一以減汎積為氣定積滿紀實去之餘如策法而一為大餘如其年無躔差及距差乘躔差不滿秒以上者以汎為定鼎按此即授時厯加減嵗餘法也積算減距算為距差者距紹熈甲寅為算也斗分差乘距差為躔差者百年加減一分也授時毎百年加減一分統天則一分零六秒弱復以距差乘躔差者百年加減一分竒而又以其距年乘之也假如百年授時加減積百分統天則百有六分弱減汎積為定者授時不立元明以當時所測截算為主故有上考下求之别而加減亦明統天則雖以當時所測截算為主而又立元故只用減所求在距算以後減之則冬至差而早早則其嵗實減矣所求在距算以前減之則冬至益早早則其嵗實加矣減之而歳實減人知之減之而嵗實加人不知之此算家轉換之法也若距差乘躔差不滿秒半以上者是所求正在紹熈前後百年内其嵗實平故無加減而以汎為定元授時厯許衡王恂郭守敬造不用積年據實測至元十八年辛巳嵗前天正冬至為元上考下求皆距此起算日法一萬分紀法六十萬嵗實三百六十五萬二四二五上考者毎百年長一分下求者毎百年消一分氣應五十五萬六百分距算乘嵗實為中積加氣應為通積滿紀法去之得數為天正冬至上考者以氣應減中積為通積滿紀法去之餘以減紀法得數為冬至並起甲子算外命其日辰小餘以十二乘之滿萬為一時命起子正滿五千又進一時命起子初算外得時不滿者以一千二百除之為刻春秋以來冬至日名六厯異同詳衍按春秋以來冬至多矣而所攷只此者以其測驗之可據也厯議原載四十八事今攷獻公在春秋前無信史可徴故刪之而以左傳僖公一條為首實四十七事也魯僖公五年丙寅歳正月辛亥朔旦冬至大衍厯積算九千六百九十六萬三百六十二中積分一百七兆六千五百九十二億五千九百二十二萬四千一百六十六冬至大餘四十七日小餘二千八百八十六辛亥日九十四刻太强亥正三刻宣明厯積算七百六萬八千六百六十二通積分二十一兆六千八百七十億四千三百七十九萬二千四百一十冬至大餘四十七日小餘五千六百一十辛亥日六十六刻太强申正初刻紀元厯積算二千八百六十一萬一千七百六氣積分七十六兆一千八百二十二億七千二百二十九萬九千九百五十六冬至大餘三十三日小餘六千一百八十六壬子日八十四刻太强戌正一刻統天厯積算一千九百八十二距差一千八百四十分躔差二十三八五減分四萬三千四百二十八氣汎積八十六億八千六百六十八萬九千八百九氣定積八十六億八千六百六十四萬六千三百七十一冬至大餘四十七日小餘二千三百七十一辛亥日一十九刻太强寅正三刻重修大明厯積算八千八百六十三萬七千八百二十二通積分一百六十九兆三千一百八十億九千四百八十九萬二千一百二十八冬至大餘四十八日小餘四千六百八十八壬子日八十九刻半强亥初二刻授時厯距算一千九百三十五歳餘二四四四中積分七十億六千七百四十七萬九一四通積分七十億六千六百九十二萬八五四冬至四十七萬一