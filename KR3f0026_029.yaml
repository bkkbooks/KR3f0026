body:
  text: 厯算全書卷二十六宣城梅文鼎撰交食蒙求卷一厯書有交食蒙求七政蒙引二目刻本逸去兹以諸家所用細草補之并稍為訂定以便初學日食一求諸平行首朔根檢二百恆年表本年下首朔等五種年根并紀日録之朔䇿用十三月表以所求某月五種朔策之數録于各年根下平朔以首朔日時與朔實及紀日并之滿二十四時進一日滿六十日去之太陽平引以太陽引根與朔策并之太隂平引以太隂引根與朔䇿并之交周平行以交周度根與朔策并之隨視其宮度宮二十度四十分內五宮九度二十分外六宮十一度二十分內十一宮十八度四十分外以上俱有食再于實交周詳之太陽經平行以太陽經度根與朔䇿并之二求日月相距日定均以太陽平引宫度檢一卷加減表如平引滿三十分進一度查之記加減號月定均以太陰平引宫度檢一卷加減表如平引滿三十分進一度查之記加減號距弧以日月定均同號相減異號相加即距弧距時以距弧度分于四行時表月距日橫行內檢取相當或近小數以減距弧得時視相當近小數本行上頂格所書時數録之即是其餘數再如法取之得時之分秒依上法用相當近小數取之并所得數即為距時隨定其加减號兩均相減者日大則減日小則加兩均相加者日大則加日小則減兩均一加一減者加減從日三求實引日引弧以距時時及分入四行時表取太陽平行兩數兩數謂時及分下同并之依距時加減號日實引置太陽平引以日引弧加減之即得月引弧檢四行時表取距時時分下太陰平引兩數并之依距時加減號月實引置太陰平引以月引弧加減之即得四復求日月相距日實均以日實引宫度檢一卷加減表如實引滿三十分進一度查之記加減號月實均以月實引宫度檢一卷加減表如實引滿三十分進一度查之記加減號實距弧以日月實均同減異加即得實距時以實距弧度分檢四行時表與前距時同加減號亦同前五求實朔實朔置平朔以實距時加減之即得如加滿二十四時者進一日不及減者借二十四時減之則退一日為實朔也六求實交周交周距弧檢四行時表以實距時時分取交周平行兩數并之即得依實距時加減號交周次平行置交周平行以交周距弧加減之即得實交周置月實均記加減號以加減交周次平行即得實交周隨視其宫度以辨食限凡陰厯宫十七度四十分以內五宫十二度二十分以外凡陽厯六宫八度二十分以內十一宫草一度四十分以外實交周入此限者並有日食七求躔離實度日距弧以實距時時分檢四行時表取太陽平行兩數并之即得依實距時加減號日次平行置太陽經度平行以日距弧加减之即得日實度置日實均記加減號以加減日次平行即日實度八求視朔加減時以日實度檢一卷加減時表如日實度滿三十分進一度取足記加減號視朔置實朔以加減時加減之即得九求徑距較數月距地以月實引查二卷視半徑表月距地數即得度取相近者用之月半徑查月距地下層有太陰之數即月半徑月半徑以日實引加減六宫檢視半徑表取太陽之數即得日實引在六宫以下加六宫如四宫則用十宫實引在六宫以上减六宫如十宫則用四宫并徑以日月二半徑并之即是月實行以月實引宫度滿三十分進一度查檢二卷太隂實行表度取相近者用之十求近時總時檢四卷九十度表九十度表一名黃平象限表其表隨地不同如在京師立算取四十度在江南取三十二度冬依極出地取本表用之以日實度取表第一行宫度得相對第二行幾時幾分另以視朔時分與十二時相加減得數以加入之即為總時總時過二十四時去之用其餘加減十二時法視朔在十二時以上減去十二時止用餘數視朔在十二時以下加上十二時用之日距限以總時時分入黃平象限本表第二行取其相對第三行九十度限下之宫度分用中比例得數與日實度相減即得日距限度分并東西號定東西法日實度大內減限度日在限東日實度小去減限度日在限西限距地髙以總時時分相對本表第五行限距天頂數置象限九十度減之餘數即限距地髙日赤道緯以日實度在三宫以下者加九宫在三宫以上者減去三宫用檢五卷太陽距赤緯表即得記書南北號日距地髙以日赤緯視朔時檢六卷髙弧表髙弧隨地不同各依北極髙度取用先以緯度或南或北之數檢右直行次以視朔檢上橫行其視朔滿十二時去之用其餘刻入表假如十二時三十三分止以三十三分作二刻入表不滿十二時則置十二時減之用其餘入表加減餘一時即作四刻月髙下差以九求月距地數及日距地髙度滿三十分進一度檢八卷太陽太陰視差表先以月距地數檢右直行次以日距地髙檢上橫行得數內減去本數上之太陽視差分秒即月髙下差兩圈交角用本求日距限限距地髙滿三十分進一度檢七卷交角表以限距地查左右直行以日距限檢上橫行用中比例取之得數以減象限即得定交角置交角加減白道角五度為定交角實交周是宫十一宫日距限在限西則減在限東則加若實交周是五宫六宫日距限在限西則加在限東則減時差用定交角月髙下差檢八卷時氣差表以定交角檢左右直行以月髙下差檢上橫行即得時差順度用上時差號逆度用下時差號近時距分月實行化秒為一率六十分為二率時差化秒為三率二三相乘一率除之即得零及半者收作一數近時置視朔以近時距分加減之即得日在限西則加限東則減如定交角大于象限則反其加減若適足象限則無時差即以視朔為食甚真時不用後法十一求真時近總時置總時以近時距分加減之即近總時日在限西則加限東則減日距限以近總時如前法取之記東西號限距地髙以近總時如前法取之日距地髙以日赤道緯及近時如前法檢髙弧表月髙下差以九求月距地及本求日距地如前法檢視差表兩圈交角以日距限限距地髙如前法檢交角表如前加减為定交角近時差以定交角度及月髙下差如前法檢時氣差表視行以近時差與先得時差相減為較若先得時差小以較減之若先得時差大以較加之即為視行又捷法倍先得時差內減去近時差得視行亦同真時距分以十求內先得時差化秒與近時距分相乘為實以視行化秒為法除之即得真時置視朔以真時距分加減之即真時亦以限西加限東減十二求考定真時真總時復置總時以真時距分加減之日在限西則加限東則减即真總時日距限限距地髙並以真總時查日距地髙以真時月髙下差兩圈交角定交角以上並如前法真時差氣差以本求定交角月髙下差如前法取時差表內得時差即得氣差以真時距分與月實行化秒相乘為實一小時化秒為法除之得數為真距度秒六十收為分食甚定時以所得真距度與本求真時差相較若相等者即用真時為食定時如此即不用後條距較考定法距較度分若真距度真時差相較有餘分即為距較度分差數秒不論距時損益分以真時距分與距較度分化秒相乘為實十求內先得時差化秒為法除之得數為距時損益分若真時差大于真距度則為益分真時差小于真距度則為損分須記損益分考定真時距分置真時距分以所得損益分如號損益之即是考定食甚時復置視朔時以考定真時距分加減之東減西加並如原號為考定食甚時十三求食分距時交周以實朔與真時相減得較數如前法取四行時表交周度即得限東為減號限西為加號定交周置實交周以距時交周加減之即得月實黃緯以定交周檢太陰距度表依中比例求之式如左假如定交周宫十度十四分求共黃緯一率全度六十分二率三百七秒三率小餘十四分四率七十一秒以所得四率七十一秒收為一分一十一秒如十度黃緯共得黃緯五十二分五十七秒其緯在北中比例加減法表上數前少後多者加前多後少者減辨月緯南北並視定交用是宫十五宫六宫一宫其緯在北南月視黃緯置月實黃緯以氣差加減之即得視緯凡月實緯在南以氣差加月實緯在北以氣差減若實緯在北而氣差大于實緯當以實緯轉減氣差為視緯其緯變北為南并徑減距置前并徑內減去一分再以月視緯減之即并徑減距如月視黃緯大于并徑不及減則不得食矣食分倍日半徑為一率十分為二率并徑減距為三率求得四率為食甚分秒十四求初虧時刻日食月行復圓同用以日實引檢八卷日食月行表分三表查五六七宫在最髙限取二三四八九十宫在中距限取一十一宫在髙衝限取如日實引滿十五度進一宫查之法以月實引宫檢直行如月實引滿十五度亦進一宫查之又以月視黃緯分檢上橫行取縱橫相遇之數即所求日食月行度分前總時以十二求真總時內減一時即前總時日距限記東西號若真時在限西而初虧限東則為異號限距地並以前總時如法求之日距地髙置真時內減一時如前法以日赤緯檢髙弧表月髙下差以九求月距地及本求日距地髙如前法檢視差表兩圈交角定交角以本求日距限及限距地檢交角表如前法求之前時差以本求定交角及月髙下差如前法檢時氣差表差分以前真時差相減併即差分法恆用減惟定交角過九十度則相併角其東西異號者恆相併惟定交過九十度則相减視行置月實行以差分加減之即得視行日在限西東前時差大則加減小則減加若差分用併者則恆減又若食甚真時定交角滿象限無真時差可較即用前時差減或初虧定交角滿象限無前時差即用真時差减並減實行為視行初虧距時分以本求視行化秒為一率一小時六十分為二率置日食月行分內減一分化秒為三率二三相乘為實一率為法除之得數即初虧距時以滿六十分為一時初虧時刻置真時即食甚內減去初虧距時分即初虧時刻十五求復圓時刻後總時用十二求真總時加一時即後總時日距限以後總時如前法求之記東西號若真時在限東復員在限西為異號限距地髙以後總時取之並如前法日距地髙用真時加一時以日赤緯檢髙弧表如前法月髙下差以月距地九求及本求日距地髙檢視差表如前法兩圈交角定交角以本求日距限限距地髙檢交角表如前法後時差以本求定交角及月髙下差檢時氣差表差分以後時差與真時差相減併得差分法同初虧視行置月實行以差分加減之即得視行日在限西東後時差大則減加小則加減若差分用併者恆減可又若食甚真時定交角滿象限無真時差較即用後時差或復員定交角滿象限無後時差亦即用真時差法恆用減與初虧同復圓距時分置日食月行分即初虧所用內減一分化秒為三率一小時六十分為二率本求視行化秒為一率二三相乘為實一率為法除之得復圓距時分滿六十為時復圓時刻置真時恆以復圓距時加之即得十六求宿度黃道宿度置日實宫命黃道宫名即食甚時黃道宫度宫起星紀以各宿黃道宿鈐近小者去減黃道宫度即得食甚時黃道宿度記寫宿名法以所求年距厯元戊辰之算乘嵗差五十一秒加入宿鈐然後減之如加嵗差後宿鈐轉大于食甚黃道不及減退一宿再如法減之如角宿不及減用軫宿是也赤道宫度以黃道宫度入一卷升度表對度取之黃道滿三十分進一度查即得所變食甚時赤道宫度記寫宫名或檢儀象志八卷取用亦同赤道宿度以所入宿黃道宫度并其宿南北緯度入儀象志八卷內如法求其宿赤道宫度置所得食甚時赤道宫度以本宿赤道宫度減之餘為食甚時赤道宿度又法以弧三角求之其法别具見補遺定日食方位食八分以上者初虧正西復圓正東不及八分者看月實黃緯號在南者初虧西南食甚正南復圓東南黃緯號在北者初虧西北食甚正北復圓東北宫至五宫為陰厯其號在北六宫至十一宫為陽厯其號在南又法不論東西南北惟以人所見日體上下左右為憑詳交㑹管見補遺帶食法求日有帶食若食在朝者初虧時刻在日出前食在暮者復圓時刻在日入後是有帶食也求帶食距分若帶食在朝者以日出時刻在暮者以日入時刻並與食甚時刻相減餘即為𢃄食距分辨食分進退凡日出入時刻在食甚前其所帶食分為進也食在朝為不見初虧尚可見食甚復圓日在暮為但見初虧不得見食甚復圓若日出入時刻在食甚後其所帶食分為退也食在朝為不見初虧食甚但見復圓食在暮為可見初虧食甚不見復圓若日出入時刻與食甚同則不用更求帶食分即以原算食分為日出入時刻所帶食分其食十分者為帶食既出入食在朝為不見初虧食在暮為不見復圓求帶食出入之分帶己退方進之分者以復圓初虧距分化秒為法並以帶食距分化秒日食月行化秒相乘為實實如法而一得數自乘又以月視黃緯化秒自乘并而開方得數收為分以六十秒為分得日出入時距緯以減并徑餘數以十分乘之為實太陽全徑為法除之得日出入時帶食之分算赤道宿度用弧三角法一求赤道緯度兩極距二十三度三十一分半為一邉本宿距星去黃極度為一邉二邉相加為總相減為較總弧較弧各取餘弦以總弧不過象限兩餘弦相減過象限相加並折半得初數又以黃道經度為對角取其矢黃道春分後三宫以正弦夏至後三宫以餘弦並與半徑相減為正矢秋分後三宫以正弦冬至後三宫以餘弦並與半徑相加為大矢以乘初數為實半徑為法除之得矢較以加較弧矢得赤道緯度矢矢與半徑相加減得本宿赤道緯度正弦加矢較後得數小于半徑則轉減半徑為正弦其緯在北若加後得數大于半徑則于內減去半徑為正弦其緯在南一求赤道經度以所得赤道緯度是北緯與象限相減南緯與象限相加為去北極度用與兩極距度相加為總相減為較總較各取餘弦以總弧不過象限兩餘弦相減過象限相加並折半為初數又以宿去黃極度取矢與較弧矢相減得較以乘半徑為實初數為法除之得角之矢與半徑相加减得本宿赤道經度之弦角之矢小于半徑為正矢其經度在南六宫若矢度大于半徑為大矢其經度在北六宫春分至秋分半周為北六宫所得為大矢當于得數內減半徑為赤道經度之弦春分後三宫為赤道正弦夏至後三宫為赤道餘弦秋分至春分半周為南六宫所得為正矢當置半徑以得數減之為赤道經度之弦春分後三宫為赤道正弦夏至後三宫為赤道餘弦作日食總圖法依舊法稍為酌定先定東西南北之向作正十字線其橫者黃道也以左為東以右為西其立者黃道經圈也以上為北以下為南次以十字交處為心太陽半徑為界規作圖形以象太陽光體太陽居十字正中則東西南北各正其位矣次定食限十字心為心太陽太陰兩半徑相并為度用太陽半徑原度以後量視緯亦同規作大圓于太陽之外是為食限太陰心到此圈界始得與太陽相切過此則不食也次求月道實交周在宫十一宫為月道由陽厯入陰厯也法于圓周上下各自南北線左旋數五度識之圓周並分三百六十度若實交周是五宫六宫為月道由陰厯入陽厯也則于圓周上下各自南北線右旋數五度識之並以所識聫為直線必過圓心是為月邉上經線也于此線上從圓心量至月視黃緯為度視緯在北自圓心向上量之視緯在南自圎心向下量之即食甚時月心所到㸃也于此㸃作橫線與月道經線相交如十字則自虧至復月行之道也此線兩端引長與大圈相割東西各有一㸃即為初虧復圓時月心所到之㸃也西為初虧東為復圓次考食分初虧食甚復圓三㸃各為心以太隂半徑為度作圓形以象月體即見初虧時太隂來掩太陽其邉相切復圓時太隂已離太陽其光初滿食甚時太陰心與太陽心相距最近食分最深若以太陽全徑分為十分則所掩分數惟此時與所算相符故謂之食甚也又初虧時或在日體正西或在西南西北復圓時或在日體正東或在東南東北食甚時或在日體正南或在正北或食十分則正相掩無南北並以太陽心為中論其南北東西一一皆如所算又或有時太隂全徑小于太陽全徑十秒以上兩心雖正相掩不能全食當依月徑于太陽光界之內規作太隂即見四面露光之象為金環食也辨日實度大小法凡論日食在限東西並以日實度大于黃平限度則食在限東若小于黃平限度則食在限西其法有三其一日實度與限度同在一宮之內即以度分之多少為大小假如限度在寶瓶宫十度日實度在寶瓶宫十五度是日實度大則內減限度得食在限東五度也若日實度在寶瓶宫七度是日實度小則置限度以日實度減減之得食在限西三度也其二日實度與限度不同宫則以一宫通作三十度然後相較假如限度在寶瓶宫十度日實度在雙魚宫十五度法以寶瓶宫十度作四十度寶瓶是一宫一宫者三十度也既原帶有三十度加入今限度十度共得限度四十度為自宫初度算起也以雙魚宫十五度作七十五度雙魚是二宫原帶有六七度加入今日實度十五度共得日實度七十五度亦自宫初度算起也相減得日實度大于限度三十五度為食在限東之距也若限度在寶瓶十度而日實度在磨羯十五度法以實瓶十度作四十度解見上與磨羯十五度相減磨羯是宫故只用本度亦是從宫初度起算得日實度小于限度二十五度為食在限西之距也其三日實度與限度不同宫而其宫相隔太逺如一在磨羯寶瓶雙魚一在天稱天蝎人馬則以加十二宫之法通之然後相較假如限度在天蝎十五度日實度在寶瓶十度相隔太逺天蝎是十宫寶瓶是一宫相隔九宫是太逺也法當于寶瓶加十二宫得十三宫十度內減天羯十宫餘三宫十度作一百度內又減天蝎宫原有十五度餘八十五度為日實度大于限度之距而食在限東又如限度在雙魚宫五度日實度在人馬宫二十五度雙魚是二宫人馬是十一宫相隔九宫法當于雙魚加十二宫得十四宫五度內減人馬十一宫餘三宫五度作九十五度內又減人馬宫原有二十五度餘七十度為日實度小于限度之距而食在限西凡限度為地平上黃道半周之最髙度日實度或在其東或在其西皆距限度在一象限內若過象限即在地平以下不得見食矣故無隔三宫以上之事然反有隔九宫以上者右旋一周之度畢于人馬十一宫而復起磨羯宫故以加十二宫之法通之而隔九宫以上者距度反近亦只在三宫以下為象限內而已厯算全書卷二十六
