body:
  text: 自序授時厯於日躔盈縮月離遲疾並云以算術垜積招差立算而今所傳九章諸書無此術也豈古有而今逸耶載考厯草並以盈縮日數離為六段各以段日除其假之積度得數乃相減為一差一差乂相減為二差則其數齊同乃緣此以生定差及平差立差定差者盈縮初日最大之差也於是以平差立差減之則為每日之定差矣若其布立成法則直以立差六者因之以為每日平立合差之差此兩法者若不相蒙而其術巧㑹從未有能言其故者余因李世德孝廉之疑而試為思之其中原委亦自曉然爰命孫瑴成衍為垜積之圖得書一卷幾何補編自序天學初函內有幾何原本六卷止於測面其七卷以後未經譯出蓋利氏既歾徐李云亡遂無有任此者耳然厯書中往往有雜引之處讀者或未之詳也壬申春月偶見館童屈篾為燈詫其為有法之形其製以六圈成一燈每圈勻為六折並周天六十度之通弦故知其為有法之形而可以求其比例然測量諸書皆未言及乃覆取測量全義量體諸率實考其作法根源法皆自楞剖至心即皆成錐體以求其分積則總積可知以補原書之未備而原書二十等面體之算嚮固疑其有誤者今乃徴其實數測量全義設二十等面體之邊一百則其容積五十二萬三八九今以法求之得容積二百一十八萬一八二八相差四倍又幾何原本理分中末線亦得其用法幾何原本理分中末線但有求作之法而莫知所用今依法求得十二等面及二十等面之體積因得其各體中稜線及輳心對角諸線之比例乂兩體互相容及兩體與立方立圓諸體相容各比例並以理分中末線為法乃知此線原非徒設則西人之術固了不異人意也爰命之曰幾何補編欽定四庫全書厯算全書卷十三宣城梅文鼎撰授時平立定三差詳說太陽行天有盈有縮立成以八十八日九十一刻就整為限者據盈厯言之此由測驗而得之也蓋自定氣冬至至定氣春分太陽行天一象限依古法以九十一度三一竒為象限該歷九十一日三十一刻有竒而今則不然每於冬至後八十八日九十一刻而太陽已到春分宿度故盈厯以此為限也夫八十八日九十一刻而行天一象限則於平行之外多行二度四十分竒也是為盈厯之大積差若縮厯即其不及之數必行至九十三日竒而後滿一象限也故縮厯之限多於盈厯日數其積差極數亦與盈厯同但此盈縮之差絶非平派或自多而漸少或由少而漸多何以能得其每日參差之數郭太史立為平立定三差法以齊其不齊可得每日細差及積差其理則出於垜積招差之法也定差者何曰所測盈縮初日最大之差也凡盈縮末日即同平行其盈縮之最多必在初日今欲求逐日之差必先求初日最大之差以為之凖則故曰定差也既有此最大之差即可以求逐日之差而逐日之差皆以漸而少法當用減故又有平差立差皆減法也然何以謂之平差曰平者平方也其差之增有類平方故以名之也差何以能若平方曰初日以後其盈縮漸減以至於平以常法論之數宜平派即用差分法足矣而合之測驗所得則又非平派也其近初日也所減甚少其近末日也所減驟多假如一日減平差一則二日宜減二而今則二日之平差增為四又初日平差一二日平差四則三日宜為七四日宜為十而今則三日之平差增為九四日增為十六故非平方垜積之加法不足以列其衰序也然則又何以為立差曰立者立方也差何以又若立方曰以平差合之測驗猶為未足故復設此以益之假如初日減平差一又帶減立差一至二日則平差四而所帶之立差非四也乃八也三限平差九而立差非九也乃二十七也蓋必如此而後與所測之盈縮相應其分為六段何也曰此求差之法也一二日間雖各有盈縮之差然差少則難辨積至半次其差始多而可見矣故各就其盈縮之日勻分之一年二十四定氣分四象限各有六氣故其分亦以六也既勻分六段矣又以後段連前段何也曰此所謂招差也雖勻分六段其差積仍難細分故惟於初段用本數以其盈縮多而易見也如盈厯初段積盈七千分是最多而易見也若末段必帶前段以其盈縮少而難真也如盈厯末段積差與第五段相減則其本段中只共盈七百四十九分數少難分故連前段論之借彼易見之差以顯難真之數此立法之意也以太陽盈差為例他倣此然則各段平差不幾混乎曰無慮也凡前多後少之積差合總數而勻分之即得最中之率如第六段之平差即第四十四日之盈加分以八十八日九二折半得四十四日四六即最中之處其本段平差二百七十餘分與之相應下倣此第五段之平差即第三十七日之盈加分第四段之平差即二十九日之盈加分第三段之平差即第二十二日之盈加分第二段之平差即第十四日八二之盈加分第一段之平差即第七日四一之盈加分其數各有歸著雖連前段原無牽混也然則又何以有一差二差曰一差者差之較也二差者較之較也曷言乎差之較曰各段平差是盈縮於平行之數也其數初段多而末段少各段一差是相鄰兩限盈縮之較也其數初段少而末段反多然則二者若是其相反歟曰非相反也乃相成也蓋惟其盈縮於平行之數既以漸而減則其盈縮自相差之數必以漸而增其法於前限平差內減次限平差即知前限之盈縮多於後限若干矣而此一差之數原非平派故初限次限之較最少而次限三限之較漸多三限四限之較又多四限五限更多至五限六限則多之極矣其多之極者何也盈縮之數近末限則驟減也此一差之前少後多正所以為盈縮之前多後少也然則二差又何以有齊數曰不齊者物之情也而不齊之中有所以不齊焉得其所以不齊斯可以齊其不齊矣今各限之一差不齊而前後兩一差相減則仍有齊數為二差是其不齊者差之較而其無不齊者較之較也較之較既為齊數則較數之不齊皆有倫而有脊矣故遂可據之以求定差也泛平積即用第一段平差何也曰今推定差初日之數也前所推第一段平差則第七日之數也故總第一段言之可曰平差而自初日言之但成泛積泛者對定之辭言必再有加減而後為定率也二差折半何也曰以分平差立差之實也蓋泛平積差既為初日盈加分多於七日之較則皆此七日中平差立差所積而成之者也而平差之數大立差之數小泛平積之大數皆平差所成而其中有六十九秒即半二差則立差所成故分出此數以便各求其數也平差除一次立差除兩次何也曰此平立之分也除一次者段日本數為法也除兩次者段日自乘為法也於是再以段日乘之則本數者如平方之自乘自乘者如立方之再乘矣平立合差何也曰次限少於初限之差也內有兩平差六立差之共數故謂之合差如盈厯以二分四十六秒為平差三十一微為立差今倍平差得四分九十二秒加入加分立差一秒八十六微共得四分九十三秒八十六微為平立合差是有兩平差六立差之數蓋加分立差原是六個立差也定差內又減一平差一立差為初日加分何也曰此初日加分之積少於定差之數也既以定差為初日加分矣而積又減此何也曰以定差為初日加分者乃初日最初之率也積滿一日則平差立差各有所減而特其減甚微故各祗一數如平方立方之起數以一也是故此一平差一立差者即初日平立合差也初日之平立合差何獨少耶曰准於平方立方之加法正相應也蓋平方幂積以自乘之積為等其數一四九十六二十五三十六四九六四八一也立方體積以再乘之積為等其數一八二十七六四百二十五二一六三四三五一二也而平立合差之數亦如之是故初日之盈縮積是於定差內減一平差一立差如平方立方之根一者積亦一也次日之盈縮積是於二定差內減四平差八立差如方根二者平積必四立積必八也三日之盈縮積是於三定差內減九平差二十七立差如方根三者平積必九立積二十七也四日之盈縮積是於四定差內減十六平差六十四立差如方根四者平積必十六立積必六十四也向後各限並同此推合而言之即皆逐日之平立合差也然則以一平差一立差較次日之四平差八立差固為小矣而以四平差八立差較三日之九平差二十七立差不更小乎何况以三較四則為九平差二十七立差與十六平差六十四立差其相差不更懸絶乎問次日之平立合差只兩平差六立差而今又云四平差八立差三日以後之平立合差只遞增六立差逐日遞增加分立差一秒八十六微是六個立差之數而今所云者三日有平差九立差二十七其說之不同如此必有一誤矣曰差之積類於平方立方者是總計其所減之數而每加加分立差者是分論其逐日所減之數也欲明此理仍當求諸少廣少廣者開方法也今夫平方以一四九十六二十五等為序者其幂積也若分而言之以一三五七九為序者其廉隅也以相挨兩平幂相減即得廉隅如一與四相減得三四與九相減得五九與十六相減得七十六與二十五相減得九是也廉隅即較也而遞增以二數者較之較也一三五七九皆遞增以二今夫立方以一八二七六四一二五為序者其體積也若分而言之以七十九三七六一為序者其廉隅也亦以相挨兩體積相減得之如一減八得七八減草七得十九草七減六十四得三十七六十四減一百二十五得六十一是也廉隅即較也而遞增以六者較之較也一增六得七七增二六得十九十九增三六得三十七三十七增四六得六一是故平立差之總積是初日以來所積之差也亦如平立方之幂積體積也平立差之加法是逐日遞增之較也亦如平立方之廉隅也合初日以來之加分即盈縮積度與定差較則其差如平立方之幂積體積也平差之序一四九十六二十五十立差之序一八二十七六四一二五若以本日之加分與定差較則其差如平立方之廉隅也平差之序一三五七九十立差之序七十九三十七六一若以本日之平立合差與初日較如平立方之廉積平差之增二四六八立差之增六十八三十六六十若以相近兩日之平立合差自相較如平立方之廉積相較平差之遞增皆二立差之遞增以六而再增十二為二六再增十八為三六再增二十四為四六也於定差內減平差立差各一為初日加分又於初日加分內減去二平差六立差是共減平差四本日實減三合初日所減之一則四立差八本日實減七合初日所減之一則八而為次日加分也又於次日平立合差內加入六立差為平立合差共二平差十二立差以減次日加分是共減去平差九本日實減平差五合前兩日所減四共九立差二十七本日實減立差十九合前日所減之八則二十七而為三日加分也又於三日之平立合差內加六立差為平立合差共二平差十八立差以減三日加分是共減去平差十六本日實減平差七合前三日所減之九則十六立差六十四本日實減立差三十七合前三日所減之二十七則六十四而為四日加分也故曰合初日以來之加分與定差較其差如平立方之幂積體積而以本日之加分即本日實減數與定差較則如廉隅也若論布立成法則不言定差但以初日加分為根以平立合差減初日加分為次日加分是於初日加分內減二平差六立差也又以六立差並入平立合差以減次日加分為三日加分是於次日加分內又減二平差十二立差於初日加分則為減四平差十八立差也又如上法再增六立差以減三日加分為四日加分是於三日加分內又減二平差十八立差於初日加分內則為減六平差三十六立差也故曰以平立合差與初日較若平立方之廉積而以相近兩日自相較如平立方之廉積相較也平方二廉故相加以二立方六廉故相加以六此倍平差六因立差為平立合差之理也平方之相加以二者始終不變立方之相加以六者每限遞增此向後立差遞增六數之理也盈縮招差圖說盈縮招差本為各一象限之法如盈厯則以八十八日九十一刻為象限縮厯則以九十三日七十一刻為象限今只作九限者舉此為例也其空格九行定差本數為實也其斜線以上平差立差之數為法也斜線以下空格之定差乃餘實也假如定差為一萬平差為一百立差為單一今求九限法以九限乘平差得九百又以九限乘立差二次得八十一並兩數九百八十一為法定差一萬為實法減實餘實九千一十九即九限末位所書之定差也於是再以九限為法乘餘實得八萬一千一百七十一為九限積數本法以九限乘定差得九萬為實另置平差以九限乘二次得八千一百置立差以九限乘三次得七百二十九並兩數得八千八百二十九為法以減實九萬得八萬一千一百七十一為九限積與前所得同本法是先乘後減用法是先減後乘其理一也初日減平差一庚也次日又減平差二甲也實減三並甲庚也合廉隅矣並計初日共減四合平方幂矣第三日又多減平差二乙也實減五並二甲二乙一庚也合廉隅矣並計前兩日共減九合平方幂矣第四日以後倣此推之中心甲一為初限所減立差即垜積形之頂加外圍六乙共七為次限所減立差平廉長廉各三隅一也並上層甲共八成根二之體積是為垜積形之第二層又加外圍丙十二共十九為三限所減立差三平廉共十二三長廉共六隅一也並上兩層共二十七合根三之體積是為垜積形之第三層又加外圍丁十八共三十七為四限所減立差三平廉共二十七三長廉共九隅一也並上三層共六十四合根四體積是為垜積形之第四層又加外圍戊二十四共六十一為五限所減立差三平廉共四十八三長廉十二隅一也並上三層共一百二十五合根五之體積是為垜積之第五層又加巳三十共九十一為六限立差其七十五為三平廉其十五為三長廉其一隅也並上層共二百一十六成體積是為垜積之第六層又加庚三十六共一百二十七為七限立差其百八為三平廉其十八為三長廉其一隅也並上層成體積三百四十三是為垜積之第七層又加辛四十二共一百六十九為八限立差其百四十七為三平廉其二十一為三長廉其一隅也並上層共五百一十二如體積是為垜積之第八層此姑以八層為式向後倣此推之因從甲頂平視故類六角平面其實如六角錐也立方廉隅而圖以錐形六角者以表其垜積招差之理也甲恆為隅朱書者長廉餘則平廉立方之平廉長廉各三離居三方則成六角六觚形以六抱一每層增六與立方加法同所異者六觚平面而立方必并其積故以堆垜象之若算六角堆垜但取其底之一面自乘再乘見積與立方同以斜立面觀之最上甲一次乙二次丙三丁四戊五己六庚七辛八其底之數各如其層之數如堆只三層則以三丙為底四層則四丁為底每多一層其各面之底必多一數若辛下再加一層為壬必九數也實計其每面六觚之數則甲一乙七丙十九丁三十七戊六十一己九十一庚一百二十七辛一百六十九前平視之圖乙為甲掩故但見外圍之六丙為乙掩故但見外圍十二餘皆若是也觀者當置身於髙處從甲頂俯視即得其理皆以外圍之數為下層多於上層之數合計其堆垜之積則甲一乙八丙二十七丁六十四戊一百二十五己二百一十六庚三百四十三辛五百一十二乙七並甲一成八丙十九並乙七甲一成二十七餘皆若是其堆垜之積皆如其層數之立方以底之一面餘乘又以層數乘之也問平差之根是以段日除積差而得則每日適得一平差今所減平差甚多殆非實數曰泛平積差是初日多於第七日之數亦據盈厯言之而平差之數既如段日則於日數為加倍盈厯段日十四日竒以此分積差為每日平差則平差共數亦十四竒於七日為加倍今倍減平差正合積差原數豈患其多曰若然又何以能合平方曰以本日實減之數與定差較但取其銷盡積差已足如第七日實減十三平差第八日實減十五平差七日有竒在其中半積差必當減盡故其法若平方之廉隅若合計初日以來減過平差與初日以來定差相較則所減之積皆如平方自乘觀圖自明如七日共數得四十九八日共數得六十四之類又如立差以段日自乘除泛立積差而得故其數亦略如段日之自乘而每日實減亦如立方之廉隅聊足以銷去積差本日尚有餘秒後一日竒減盡若合計初日以來共數則亦如立方再乘之積矣右圖以九限為例九限以後倣論定差設十萬平差設一千立差設單一如法以本日加法并之為平立合差如圖平差立差各有加法故當並用以平立合差減先日加分得本日加分合計從前加分為本日盈縮積或以本日加分加先日盈縮積得本日盈縮積亦同又簡法置定差內減平差立差各一為初日加分又即為第一日盈縮積别置平差倍之加入六立差為初日平立合差以後每於平立合差內加入六立差為次日平立合差餘同上用定差法以日數乘立差得數加入平差再以日數乘之得數乃置定差以得數減之用其餘為實復以日數乘之得本日盈縮積置相近兩盈縮積相減得加分又置相近兩加分相減得平立合差亦同定差本法置定差以日數乘之得數為實又以日數自乘用乘平差得數以日數再自乘用乘立差得數平立兩得數并之為法法減實得盈縮積餘同上厯算全書卷十三
