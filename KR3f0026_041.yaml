body:
  text: 厯算全書卷三十五宣城梅文鼎撰筆算卷二乘法以數生數是之謂乘數不能自生相得乃生故乘亦曰因生則不窮故乘有陻義生則日積故乘有載義有一位乘有多位乘或分一位曰因多位曰乘然古皆謂之乘今從古皆有法有實有得數凡實數縱列於右凡法數橫列於下縱橫相遇而得數生焉對者法數也斜行直行所所對者實數也而紀得數則以橫行定之或問實何以對斜行曰法有進行故得數斜升是故右第一行是法單位乘出之數也其次行則法十位乘出之數也又次而百而千視此矣故其乘得數不出斜格流此虛位也單十百千周迭居皆於臨時定之凡乘出數皆有本位有進位如有十數又有零數三四一十二四四一十六之類則紀零於本位本格之右方紀十於進位上一格之左方有十數無零數則紀十於進位而本位作五四成二十五六成三十之類有零數無十數則紀零於本位而進位作一一如一二二如四之類凡法實有空位則本位進位俱紀凡乘皆從法尾位起即右第一行對定實數相乘自下而上如畫卦之法右行乘畢挨乘左行每移一行必進上一位其各行中斜對實數自下而上皆如右行法凡法與實有空位則無可乘然必於本位進位各作以存其位若實尾有空位則於合總時補之凡各行乘訖必覆核之乃以併法合總而紀於左方以為得數實尾有幾皆作於總數之下凡乘訖定位皆於原實內尋原問每數為根以橫行對定得數命為法尾數則上下之位皆定凡數單乘單成單甲為本位戊為進位十乘十成百乙為本位已為進位百乘百成萬丙為本位庚為進位千乘千成百萬丁為本位辛為進位前圖可明定位又法法曰有本數有大數有小數如原問是每畝之價而原實恰止於畝數是本數也凡本數即用得數尾位命為法尾數是若原問是每畝之價而原實只有十畝或只有百畝大數也凡大數當於得數尾位下增然後於所增位命為法尾數若大幾位亦增幾皆增至每位止即命末為法尾數也若原問是每畝之價而原實不止於畝畝下𢃄有分釐是小數也凡小數當於得數之尾截去之原𢃄畸零幾位亦截去幾位然後命之即所截之上一位為法尾數是也凡乘畢恐其有誤宜用除法還原置得數為實以法數為法除之即得原實或置得數為實以實數為法除之亦得法數不則以九減七減試之尤捷先以法數如法九減之而紀其餘紀於右如甲次以實數亦九減之而其餘於左如乙再以左右兩減餘相乘得數仍九減之而紀其餘於上方如丙下末以得數亦九減之而紀其餘於方如丁丁丙相同即知無誤七減亦然先以法數實數各如法九減之而並紀其餘如甲與乙次以兩減餘相乘得數仍九減之而紀其餘如丙以上並居左方末以得數亦九減之而紀其餘于右方如丁二視丙丁相同即知無誤如甲乙者內有一即丙亦又或甲為一數即丙數同乙皆不用乘七減亦然一位乘式假如有熟田三千五百一十九畝每畝編銀六分問該若干答曰二百一十一兩一錢四分法從下起先以法數六乘實數九呼六九五十四紀四於於本位紀五於進位進乘實數一呼一六得六紀六於本位紀於進位進乘實數五呼五六成三十紀於本位紀三於進位進乘實數三呼三六一十八紀八於木位紀一於進位合乘畢以並法總定位法因原問是每畝科則就於右行原實內尋每畝數為定位之根橫對左行得數命法尾分則其餘皆定根是九畝橫對是四分則上位是錢又上是兩又上十兩又上是百兩定所得為二百一十一兩一錢四分兩位以上乘式假如有金九錢八分五釐每兩價銀八兩八錢問該若干答曰八兩六錢六分八釐先以法八錢乘實數五呼五八成四十紀於本位紀四於進位進乘實數八呼八八六十四紀四於本位紀六於進位進乘實數九呼八九七十二紀二於本位紀七於進位次進一位以法八兩乘實五呼五八成四十紀於本位進乘實八呼八八六十四紀四本位紀六進位進乘實九呼八九七十二紀二本位紀七進位總乘畢以併法合定位法原問每兩之價而實無兩當於實九錢上補作兩位為根以橫對得數定為法尾錢即上下之位俱定定位又法此小數也原問以每兩價為法而實有錢分釐共小三位即於得數截去尾三位定第四位為六錢法實減餘平列左上相乘而減之列左下得數減餘列右下以相同為定假如有錢三十萬零五百八十文每千賣銀九錢零五釐該若干答曰二百七十二兩零二分四釐九毫先以法數五乘實數八紀四次乘實數五紀二五次乘實數本位進一位俱紀次乘實數三紀五進一位以法數乘實無可乘於本位進位各紀以存其位法數九乘實又進一位以數八紀七二進乘實數五紀四五進乘兩紀進乘實數三紀二七乘畢以併法合總定位原問是每千之價當於原實內尋干位為根以對得數命為法尾釐則其餘皆定定位又法此亦小數也實有十丈於原問每干為小兩位當於得數截去末兩位定為法尾釐此即前問也因法有空位省不乘但於法首九錢起進二位乘之即得數無訛與前法同本宜進一位乘九錢今進兩位以合空位之數若法有兩空即進三位以上倣論假如星命家以年月日時配成八字以七百二十乘七百二十問共該若干答曰五十一萬八千四百如法乘訖併之得五一八四定一原問七百二十年月下每一數中各配七百二十日時宜於原實下補作單位為根以對得數定法尾十或用又法實數止於十大於每數一位乃大數也宜徑於得數增一位定法尾一解曰六十年各十二月則前四字七百二十六十日各十二時下四字亦七百二十故以相乘即能盡八字之變假如西厯天度每周三百六十今有星行天三百周該若干答曰一十萬零八千度依法乘訖用併法合總得一八定位原問是每周之度今實數是三百周當於原實下補作兩至每周位止以此為根橫對得數定法尾十度而得數空補作一上一位為百度位得數亦空又補作是得數無百無十也再上為千為萬為十萬定所得為一十萬八千或用又法星行三百周大於每周兩位乃大數也法徑於得數下增兩定末為法尾十度即得數皆定此先置三百六十為實而以三百周為法乘之也得數一八與前法同但變兩位乘為一位乘其用更簡定位用大數法以實止十度無每位徑於得數下補作一定為法尾百即得數定為十萬八千假如有珠子三分五釐每兩值銀二十四兩該若干答曰八錢四分依法乘而併之得八四定位原問珠每兩價今實數只有分乃進位作於錢位又上作於兩位兩為根橫對得數為法尾數兩而兩位空補作為八錢四分定所得定位又法此小數法也實有分釐在原問每兩下三位宜截去得數末三位定法尾數兩而得數只三位無可截乃補作於得數之上然後截之定為兩此與前條金價並畸零乘法也餘詳通分省乘法古謂之加法假如有漕糧三百六十石每石𢃄耗米四斗問正耗共若干答曰共五百四石此就身加法也原數即當得數不動只挨身加四先於六十石加四六二十四石又於三百石加三四一百二十石末用併法連原數併之合總凡加法定位依原數不須更求下同加法九試七試略同併法並合原數加數减餘列右共數減餘列左此及下條並九減七減俱無餘假如銀五十四兩每兩月息二分五釐今兩箇月共本息若干答曰共五十六兩七錢此因所加是分在兩下二位故隔位加又因每月二分半今兩箇月該五分故以五分為法先於四兩加二進於五十加二五末以併法連原數合總省乘又法古謂之求一乘法凡法數之首為一數者即原數不動而挨身加之與前兩條同也若法首非一數者以法變為一數則亦可挨加此為本非一數求而得之故名求一乘法也其法遇法首為二為三則折半用之而倍其實法首遇五六七八九則加倍用之而半其實法首遇四則取四之一用之而四其實如此則法首成一數可用省乘凡求一乘法定位亦於原實內尋每數為根以橫行對得數定之但此所對得數恆為法首位數若乘法則為法尾位數與此不同乃理勢之自然不可不知假如前條珠三分五釐價每兩值銀二十四兩用乘法得價銀八錢四分今以法數折半作一十二兩實數加倍作七分挨身加之所得正同而用加捷矣原數不動即用為法首一數所乘也七加挨身以法次位二與原數相乘呼二一十四本位紀一下位紀四加訖以併法合總亦連原數作數併之定位亦從原數七分上加兩尋每兩位為定位之根橫對左行總數得法首位是十兩下一位是兩俱空位補作兩再下一位即錢定所得為八錢四分又如前條錢三十萬五百八十文每千價九錢五釐以錢折半十五萬二百九十為實價加倍作一兩八錢一分為法原數借為得數不動挨以法去首位一只用八一身加之自下起於九加七二九於二加一六二其位無加於五加四五於實首一加八加訖合原數併總一定位尋原數千位為根橫對左行得數得法首兩位併乘法凡有數次乘者併為一次乘亦算家簡法舊謂之異乘同乘假如原本銀三千二百兩每兩一年獲息一錢五分六釐二毫五絲已經四年該息若干答曰二千兩法先以三千二百兩乘四年得一萬二千八百兩再以息銀乘之是併兩次乘為一次乘也截乘法凡乘法位多者截作數次乘之以便初學其法與併乘相反而其理相通假如有三十二人各給布六丈四尺共若干答曰二百四丈八尺先置六丈四尺以十六人為法用省乘就身加六得一百二丈四尺又二乘加倍合總二乘即三十二乘也解曰十六乘又定位凡就身加者原數即可定位如前條漕糧每石加四斗是也此條是十六加首行六四雖以原數當得數而六丈四尺已升為六十四丈矣時若加倍自是本位此在用算者臨消息之也或置三十二人以八丈乘兩次亦同解曰八乘二次即六十四乘也或置六丈四尺以四乘之得數又以八乘之所得亦同解曰四乘一次又八乘一次即三十二乘也除法以數剖數是之謂除除其原數以歸各數故除亦曰歸除與乘對理精用博近或謂之分義則淺矣有一位除有多位除或分一位曰歸多位曰除或曰歸除曰混歸然古皆曰除皆有法有實有得數得數一名商數實其物也法其則也法實在乘法或可互用而除法必須審定乘法以法與實相遇而生一數如陰陽相交而生物也故雖互用而其交之理不易其生之用亦不易也除法以實滿法而成一數如鎔金以就型也故曰實如法而一若倒用之則非矣實如法而一或變文曰如某數而一如用三除者省文曰以三而一言以三數成一數也而字皆連上為文或者不察遂竟以而一當除之字義失其㫖矣定法實訣凡審法實有二訣一曰先有定則即以定則為法其所除者必同名之物也如有定則之銀為法而除總銀以定則之米為法而除總米是也一曰先無定則而求定則須詳問意以所用求之者為法其所除者必異名之物也如以總米除總銀以總銀除總米是也何以為先有定則也以事明之如銀糴米而先知每米一石之銀若干是先有定則之銀也即以此定則之銀為法而以總銀為實以法除實則得總銀所糴之總米矣此為有總銀數又有米每石之銀數故以銀除銀而得總米若先知每銀一兩之米若干是先有定則之米也即以此定則之米為法而以總米為實以法除實則得總米所糶之總銀矣此為有總米數又有銀每兩之米數故以米除米而得總銀是皆所除者同名而所得者異名也又謂之以每數求總數凡以每數求總數者以每數為法每數即定則也以比例求之更明圖具左方何以為先無定則而求定則也如有總米又有總銀而無每數則當於問意詳之問者若欲知每米一石之銀是以米分銀也則以總米為法總銀為實問者若欲知每銀一兩之米是以銀分米也則以總銀為法總米為實是所除者異名而所得者亦異名也又謂之以總數求每數凡以總數求每數先無定則故必於問者之所求酌之亦有比例之理又捷法凡不動者為法動者為實何以明之如有總米總銀而欲知每米一石之銀則將變總銀為每米之銀是銀動而米不動也故以米為法若欲知每銀一兩之米則將變總米為每銀之米是米動而銀不動也故以銀為法其以每數求總數者先有定則不動即用為法尤為易見凡布算乘易而除難除法之難尤在法實法實無誤則思過半矣此乃珠算筆算所同也故首辨之如右若筆算除法更有宜知者數端具如後方一列位法實既辨即當列位其法先作兩直線自上而下平行相望約其間可容字兩行為率其長短則視位數多寡定之先以實數列於右直線之右自上而下依列位法書之次以法數列於右直線之左亦自上而下其千百十單皆與實相對或法數有千而實只有百者即對書於上一位餘皆倣此亦有實數無分秒而法數有之者亦對書於實尾之下次約實以求得數得數亦名商數以法約實紀其得數於左線之右視法首位是言如之數如三三如九之類則書於實之上一位而於實首添作以遙對之或法首位是言十之數如二六一十二之類則書於實首之對位其次商三商以上皆依此書之若書之而不相接輳是商數有空位也補作此定位之根慎不可錯次乘商數求應減之數以減原實以商得數與法數相呼乘之而紀數於左線之左皆以乘數之進位對商數紀之如二六一十二則以一十對商數書之如三三如九是為九則以九上之對商數書之他皆倣此乃遂以乘出數與右行原實對減周減法足減者於原實抹改之不足減者改商數其乘出數亦抹去便續商也次定得數之位先於法數之上一位作為識以對得數命為單位等而上之則十百千萬等而下之則分秒忽微皆從此定次命分除有不盡者以法命之用法數為母不盡之數為子命為幾分之幾次還原凡除法恐其有誤當以乘法還原用法數與得數相乘除有不盡者併入之即得原實又法仍以除法還原用得數為法轉除原實即復得法數除有不盡者以減原實為實然後除之又法以九減七減試之以法數九減七減皆用其所減之餘紀右再以得數如法減之紀其餘於左左右兩餘數相乘仍如法減之紀其餘於上方末以原實亦如法減之紀其餘於下方上下相同則無誤矣又簡法作直線於左方以應減之數依併法併之必合原實有不盡數亦併入之此法更簡更確按筆除原法以法實上下相疊不論數之何等謂十單分秒之等而但齊其尾殊缺條理又以得數橫續於法實之尾定位易淆今法與實皆用真數相對而宜減之數先列左方對減無誤即古人實如法而一之故了了分明據法首定位尤為簡快一位除式假如有額編地丁銀二百一十一兩一錢四分其科則每畝六分問原地若干答曰三千五百一十九畝審法實訣此為以每數求總數也其每數六分為先有之定則不動故以為法右併法還原即用原列應減之數併之必合原實是為簡法列位法如法作兩直線先以實數二一一一四列於右直線之右自上而下順布之次以法數六列於右直線之左因法係六分故與實分位相對商除法次以法數約實法是六實是二以六除二當合下位作草一除之商作三以乘法六呼三六一十八是言十之數將商得三以法首二書於左直線之右以乘得一八書於左直線之左因是言十之數以乘得進位一字對商數三字書之遂以此乘得一八用減法與原實二一對減先於實次位減八實係一不足減作㸃借上一數為十一減八餘三改書三於實一之右次於實首位減一實係二因借去一㸃只作一減盡作乃作線抹去二一存三亦於左作線抹去減數一八次商以六除三亦當合下位作三一除之商作五以乘法六呼五六成三十是言十之數將次商五對實三字書於初商之下亦以乘得三依法以三字為進位對次商五字書於左直線之左依法對減實三作仍作線抹去實三亦於左減數抹去三如六三商以六除一合下位作十一商作一呼一六是言如之數將三商一對實上位一字書於次商五之下依法以乘得六對所商一字書於左線之左以對減實一一以六減一不足減作㸃借上成十一減六餘五改書五於右抹去一一亦於左減數抹去六六除五亦合下位作五十四商作九呼六九末商以五十四是言十之數將商得九對實五字書於三商一之下依法以乘得五四對所商九字書左線之左以對減實五四恰盡俱改書而抹去五四左減數亦抹去共商得三五一九定位訣於右線法數六字上一位作為單位之識畝以橫對左得數九字定為單九畝進位是十又進百畝又進千畝命所得為三千五百一十九畝乘法還原以法六分乘得數三千五百一十九畝仍得原實見乘法除法還原以得數為法除原實仍得法數六分後條見試法九減得數無餘紀於左法數餘六紀於右左右相乘仍紀於上九減原實無餘紀於下皆凡位與他數相乘所得七減得數餘五紀左法數餘六紀右左右相乘仍以七減餘二紀於上七減原實餘二紀於下悮兩試皆上下相同知其不論曰除法以乘法還原猶之乘法以除法還原此舊法珠算所必需若除法以除法還原則舊所無也同文算指用九減七減試法可免還原頗稱巧捷今以併法代之則試法亦省故稱簡法焉兹各具一則用相參互以明算理握算者擇而用之可也法今定筆除只用簡法還原若筆乘仍用試多位除式假如有熟地三千五百一十九畝共徵銀二百一十一兩一錢四分問每畝科則若干答曰每畝六分審法實此以總數求每數也問者欲知每畝科則是將以總銀變為每銀銀數動地畝不動故以地為法銀為實列位法先以實數自上而下順布於右線之右次以法數對書於右線之左實首位是二百法首是三千法大於實一位故進一位列之凡進位列者皆不滿法商除法以法數約實法首是三實是二合兩位二一除之宜商七因法有次位須留餘地改商六以乘法三呼三六一十八是言十之數以商數六對實首二書於左直線之右以乘得一八書於左線之左遂以商數六遍乘法次位五呼五六成三十乘得三挨書於一八之下一位又以商數遍乘法第三位一呼一六如六乘得六挨書下一位又以商數六遍乘法末位九呼六九五十四乘得五四又挨書下一位如此遍乘法四位訖乃以乘出數為減數對減原實恰盡定位尋法首上一位為單位橫對左線得數上二位定為兩順下一位是錢此二位俱空補作再下是分定所得為六分此一次除盡例也又為法大實小故所得不能成整數兩為整數今所得是分在兩下二位若用乘法還原同前條還原法若用除法還原即前條除法此所定單位在得數之外乃借虛位以定實數下條同其故何也曰法是三千有零能滿此數始能成一兩故曰實如法而一今法大實小是實不滿法不能成一數所得者乃剖一整數而得其若干如此條所得乃百分兩之六也詳命分假如有銀八兩六錢六分八釐換金每金一兩該銀八兩八錢問換金若干答曰九錢八分五釐定法實訣此為以銀除銀金價八兩八錢是先有之定則不動就以為法如前法對列法實於右線之左右改退商九以乘法初商法八實八宜商一因無次商八得七二又乘法次位八亦得七二依法挨書遂以對減實三位八六六餘七四次商八以乘法八得六四乘法次八亦得六四依法書之遂以對減餘實七四八餘四四三商五以乘法八八得四四依法書之遂以對減餘實恰盡定位法數上一位為單位橫對得數上一位是兩定為兩九錢八分五釐法實首位同而法次位八大於實次位六故亦借虛位以定實數說在前條甪乘法還原見乘法第二條兩用除法還原以金九錢八分五釐為法除實得每價八兩八錢即畸零法也詳通分假如有銀四萬八千兩六十四人分之該若干答曰各七百五十兩假如有銀二百七十二兩二分四釐九毫每錢一千銀九錢五釐問錢若干答曰三十萬零五百八十文定法實此先有定則九錢五釐故以為法此法有位例也亦是得數有之例初商三以乘法九得二七法次位空無乘挨作以存其位再乘法末位五得一五各如式書之以對減原實二七二餘五字實空位無可商次商從實五起商作五以乘法九得四五法次位空亦作存位乘法末位五得二五如式書之以對減實五二四九餘七二四初商三乘九得二十七是言十之數宜對實首位二字書得數三次商五乘九得四十五亦是言十之數宜對餘實首位五字書得數五如此審定而書則乘出減實之數與實相對了了分明便知不誤然初商次商不相接續所差二位是得數有二空位也補作於初商次商之間以存得數之空位如是則次商之事畢之末商八以乘法九得七二法次位無乘盡亦作存法末位乘得四以對減餘七二四恰定位此因所問是每千之價故千即單數也從法上一位橫對定為千文之位上為萬又上十萬定所得為三十萬五百八十文若以數三十萬五百八十文為法除原實二百七十二兩二分四釐九毫亦復得九錢五釐為每千之價如後圖審法實此問錢價是以錢分銀故以總錢為法總銀為實列位之理所欲知者每千之價故以千為單以萬為十以十萬當百與原銀對列其書商數如式不錯則得無數之空位自明定位亦自舛說見前相還原此兩條互若以乘法還原並用乘法第三條命分法凡除法至單而止故曰實如法而一所謂一者即單一數也其有除至單數而仍有不盡之餘實或法之數本大於實皆不能成一整數則以法命之其法有二其一除之至盡如計輕重者不滿一兩則除之為若干錢若干分及釐毫絲忽前條法大實小及得數單下仍有數位者是也若授時厯萬分為度百秒為分及錢鈔論貫貫之下有百冇十有零文尤為易見其一以法數為分母不盡之數為分子命為幾分之幾如以三除五內除三數滿法成一整數餘實二不能成整則以此二數各剖為三分共成六分而以三除之各得二分是為三分之二也假如十九人分銀二百五十四兩問各若干答曰各十三兩零十九分之七以十九人為法除二百五十四兩各得一十三兩不盡七兩以法命之七其法以法十九命為分母不盡數為分子命為十九分兩之七不解曰一整兩各剖為十九分則盡之七兩共剖為一百三十三分以十九人分之各得七分并整數分數為每人分得一十三兩零十九分兩之七若用乘法還原法以十九人乘得數十三兩得共二百四十七兩加八不盡七兩共二百五十四兩合原實若用除法還原實法置原實內減不盡之數七兩餘二百四十七兩為每人十三兩為法法除實得十九人論曰古人只用命分後世乃有除之至盡之法然終不能盡如以十九人除七兩各得三錢六分八釐四毫二絲一忽終餘一忽故不如命分之簡妙如錢糧尾數一忽之下仍冇微纎等七位不等徒滋繁文無禆實用然亦終不能盡若命分之法只一語喝盡更無滲漏然後知古法為無弊省除法舊名定身除亦名減法凡法首位是一數者用之假如漕糧正耗共五百四石每正米一石除耗四斗問正米若干答曰三百六十石先以原數五定正數為三書直線左以應減耗數四乘所定正三得耗一十二併正三共得四二以減原數五餘八次以餘數八定正數為六書正數三之下以減耗四乘六得二十四併正六共得八四減餘數恰盡之即還原數或用合得數減數併加四亦同定位凡省除皆以原數定位省除又法古謂之求一除法凡定身除惟法首是一數者可用今以倍半之法求之則法首皆變為一數其法遇法首位是二是三法實皆折半遇四則折半兩次遇五六七八九法實皆加倍如此則法首位皆成一數假如前條六十四人分銀四萬八千兩用除法各得七百五十兩今以法實各折半兩次用定身除所得亦同先以法六十四折半作三十二又折半一十六為法實四萬八千折半作二萬四千又折半一萬二千為實用定身除法先以實首兩位一二定七為得數法去首位一不用只用六以乘得數七得四十二書左併得數七共一一二以減原實一二餘八次以餘實八定五為得數亦以法六乘得三挨書於左以減餘實八恰盡定位得數七對原實千因法是有十之數退一等作七百定所得為七百五十石假如十人七千即每人七百故法有十者退一位也凖此推之法有百退二位有千退三位萬以上倣此論之凡省除依原實定位當知此訣併除法舊名異除同除凡有當除數次者則以法相乘為法作一次除之亦簡法也如以四除之又以五除之又以七除之則以四乘五得二十又以七乘得一百四十共為法以除之是併數次除為一次除也假如經商獲利二千兩原本三千二百兩已經四年問每年每兩之息答曰每兩息一錢五分六釐二毫半法曰先以四年乘原本三千二百得一萬二千八百為總法本法宜以二千二百除二千得每兩之息再以四年除之得每年每兩之息今併兩次除為一次除足簡法也截除法與併除相反所以便初學凡除有法數位繁者或可以截為兩次除以從簡易假如五十六人分銀一千五百一十二兩各若干答曰各二十七兩此因法五十六是七八相乘之數故先以八除得一百八十九兩仍用為實再以七除之得二十七兩合問或先用七除得數二百一十六兩復以八除之亦得二十七兩為每人數右省除式也祇作一直線書原實於右紀得數於左而以九九數呼而減之不必另書減數凡法只一位者用此為便假如銅一百二十八斤價二十兩問每斤若干答曰每斤一錢五分六釐二毫半原法三位今用截除三次俱一位為法可用省除假如銀一千八十兩置田二百一十六畝問田價每畝若干答曰五兩原法三位今用六除三次亦同約分法凡命分有可約者以法約之古法曰可半者半之不可半者以少減多更相減損求其有等以等約之以等數除母子數則皆除盡西人謂之紐數假如八十一人分銀二十七兩問各數答曰各得三分兩之一法曰以八十一除二十七不能各得一兩依命分法八十一為分母二十七為分子命為八十一分兩之二十七又以法約之為三之一解曰八十一是三箇二十七若剖每兩為八十一分即各得其二十七分是三之一也分母八一約分法曰置分母八十一用遞減法以分子二十七減之餘五十四復以二十七減分子二七之仍餘二十七如是則兩數齊同是有等也即用此等數二十七為法轉除分母八減餘五四十一得三除分子得一如此則不用細分但以每兩均剖為三而各得其一分即三又減分子二七人共一兩也十四則用轉減法以子五四若分子是五仍餘二七轉減母八一餘草七又以母餘二十七轉減子五四亦餘草七是相等也就以此等數草七為法除母八一得三除子五四得二是為約得三之二假如米八十五石分結一百二人問各若干答曰各得六分石之五法曰人多米少不能各一石依命分法以一二為分母八五為分子命為一百二之八十五以法約之為六分之五約分法曰置分母一百二以分子八十五減之得餘十七用轉減法以餘十七減分子八十五餘六十八又遞減之餘五十一又減之餘三十四又減之餘亦十七是相等也就此等數十七為法轉除母數一百二得六除子數八十五得五約為六分之五十七八十五是解曰一百二是六箇五箇十七故曰六之五即六人共米五石也若以米每石均分六分八十五石共得五百一十分為實以一百二人為法除之得五是每分之五也所得為一石米中六厯算全書卷三十五
