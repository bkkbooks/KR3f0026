body:
  text: 厯算全書巻三十宣城梅文鼎撰籌算一作籌之度凡籌以牙為之或紙或竹片皆可長短任意以方正為度凡籌背面皆平分九行每行以曲線界之為兩半圓狀凡籌背面皆相對第一籌之隂即為第九便檢尋也二與八三與七四與六五與空位皆倣此共五類類各五籌當珠盤二十五位或更加之亦可外有開方大籌為平方立方之用詳見别巻籌式列左作籌之理凡籌每行以曲線界之成兩位其下為本位上為進位假如本位一兩則進位為十兩凡列兩籌則行内成三位下之進位與上之本位兩半圓合成一位故也列三籌則成四位列四籌則成五位五籌以上皆倣此凡籌有明數有暗數明數者籌面所有之數是也暗數者行數也假如第一行即為一數第二行即為二數凡籌與行數相因而成積數假如第二籌之第四行即為八數第九籌之第八行即為七二數籌算之資凡用籌算當先知併減二法今各具一則併法併者合也合衆散數為一總數也又謂之垜積其法先列散數自上而下對位列之千對千百對百十對十單對單以類相附列訖併為一總數其法從最下小數起自下而上如畫卦之法數滿十者進位作暗馬而本位書其零恐混原數故以此别之便覆核也假如有米三千四百八十石又五千六十八石又二萬六千九百石合之共幾何如圖散數三宗依法併之為一總數得三萬五千四百四十八石減積法減者去也于總數内減去幾何則知其仍餘幾何也減與併正相反減而剰者謂之減餘其法以應減去之數列左以原有之總數列右而對減之千對減千百對減百十對減十單對減單減而盡者抹去之減而不盡者改而書之本位無數可減合上位減之假如欲減八十而原數只有七十但其上位有一百則合而減之于一百七十内減八十仍餘九十假如有銀三十二萬五千三百一十兩支放過二十九萬五千三百五兩仍餘幾何依法減之仍餘三萬五兩十萬千百十兩如圖先于三十萬内減二十萬餘一十萬改三為一次減九萬而萬位無九合上位共一十二萬減之餘三萬抹去一二改書三次減五千次減三百皆減盡皆抹去之書作次減五兩而兩位無五于一十兩内減之抹去一改書五減訖餘二三凡算有乘有除乘者用併法除者用減法籌算之用凡算先别乘除乘除皆有法實實者現有之物也法者今所用以乘之除之之規則也凡籌算皆以實列位而以籌為法法有幾位則用幾籌如法有十係兩位則用兩籌法有百係三位則用三籌凡法實不可誤用唯乘法或可通融若除法必須細認俱詳後乘法勿菴氏曰凡理之可言者皆其有數者也數始於一相縁以至於無窮故曰一與一為二二與一為三自此以徃巧厯不能盡乘之義也故首乗法解曰乗者増加之義其數漸陞如乗髙而進也亦曰因言相因而多也珠算有因法有乗法在籌算總一乘法殊為簡易法曰凡兩數相乘任以一為實一為法假如以人數給糧或以人為實糧為法或以糧為實人為法皆可凡算先列實列書之于紙或粉板亦可依千百十零之位列之自左而右次以法數用籌乘之法有幾位則用幾籌假如法為六十四則用第六第四兩籌法為三百八十四則用第三第八第四共三籌凡乘皆從實末位最小數起視原實某數即於籌其行取數列之假如實是二則取第二行數凡列乘數皆自下而上如畫卦凡實有幾位挨次乗之但次乗之數必髙于前所列之數一位假如先乘者是單次乗者必是十故進位列之乗訖乃以併法併之合問又法凡法尾空位者省不乗但于併數之後補作圏于其下以存其位尤為簡捷如上圖乘訖併得三因法尾有空又補作一圏是為三則知所得三萬定位法見前又若田為一畝二分則所得為三合何也畝下有分故得數之三其尾又是勺下之分也此定位之精理須細審之一四二四四四五七五共九位因實尾空位無零年故也用省乘法加一于末位下共十位而以尾命為分得一十四萬二千四百四十四日五十七刻五十分合問除法勿菴氏曰天地之道盈虚消息而已無有盈而不虛無有消而不息乘者息也盈也除者消也虚也二者相反而不能相無其數每相當不失毫釐如相報也邵子曰算法雖多乘除盡之矣故除法次之解曰除者分物之法也原作幾何今作幾分分之則成各得之數而除去原數也有歸除有商除珠算任用籌算則獨用商除為便以意商量用之故曰商除法曰凡除以所分之物為實今欲作幾分分之為法法與實須審定倘一倒置則毫釐千里矣假如有糧若干分給若干人則當以糧為實以人之數為法除之盖糧數是所分之物人數是用以分之之法也若倒用以糧分人則所誤多矣凡法有幾位則用幾籌乃列實自上而下直書之視籌之第幾行中積數有與原實相同者或略少於實者用其數以減原實而得初商有不盡者如法再商或三商以上皆如之實盡而止餘實不滿法以法命之凡商數皆以籌之行數為其數假如所減是等第一行即商一數第二行即商二數書商數法曰凡書商數皆與減數第一位相對若所減第一位是則補作于原實首位上而對之此定位之根定位法曰除畢以商得數與原實對位求之皆于法首位之上一位命為單數程大位曰歸于法前得零古法實如法而一是也此有二法有法少實多者從原實内尋法首位認定逆轉上一位命為單數如米則為單石錢則為單文之類既得單數則上而十百千萬下而分秒忽微皆定矣此為正法有法反多實反少者乃變法也法從原實首位逆溯而上至法首位止又上一位命為單數此是虚位借之以求實數既得單數乃順下求之命所得為分秒之數初商除盡式法此欲分為七十二分也故以七二為假如太陽每法用兩籌嵗行天三百實三六如圖先列三百六十度六十度分為百十為實次簡兩籌行内有七十二候每三六與實相同用減候幾何度原實恰盡次查所簡答曰每候五度係籌之第五行商作五又查所減第一位是三將商數五對三字書之定位法曰此法少于實也宜于原實内尋十度位即法首位也法首再上一位為單度定所得為五度假令實是三千六百則所得為五十度如後圖定位法曰此亦法少于實也法亦于原實内尋法首十位再上一位為單位單位空補作圏再上一位是十度定所得為五十度用籌同而得數逈異定位之法所以當明也再商式法此欲分為一十二分也故以一二假如皇極經世為法用兩籌一元共一十二實如圖列實一元總數簡萬九千六百年一二九六籌第一行是一分為一十二會十萬千百十年二商作一數第一行故各幾何商一減實一十二萬答曰每㑹一萬餘九千六百不盡八百年再用籌如法除之又因所減數是一二故于原實首補作圏而以商得一對此位書之即所減籌上第一位也此定位之根不可錯須細審之簡兩籌第八行是九六與餘實相合再商八第八行故也減餘實九千六百恰盡此所減數亦是九六故以商得八進位書之以暗對其如此審定商數位置已知不錯而初商次商隔一位不相接是得數有空位也乃于其間補作圏為一八假如隔兩位則作兩圏三位以上倣此求之若非于商數審其位置鮮不誤矣此算中一大闗鍵也非此則不能定位定位訣曰此亦法少于實也從原實内尋法首十位再上一位是單年單位空補作圏又上一位是十十亦空亦補作圈又上一位是百知所得為八百年也知百知千萬矣定為一萬八百年假如黄鍾之法此欲分得二千一百八十實一十七萬七乃為一分故以二一八七千一百四十七為法用四籌七其分法二千一百八十七問若干分答曰八十一分二千一百八十七再商之簡籌第一行是二一八七正合餘實再商一除實恰盡次商一進位書暗對所減位定位訣從原實尋法首位千逆轉上一位得單分則餘位皆定按籌算原書于定位頗略又其為法原實横而商數縱各居其方不相依附定位頗難故雖厯書間有訛位今特詳之而兩兩直書于定位尤易亦足見余之非好為異也四商法假如有小珠三十四此欲分為九分有竒也以錢萬三千一百五十四為主則六分五釐是其竒零九分之分去聲故粒換得大珠重九錢以九六五為法用籌三根六分五釐每大珠一如後圖列實先簡籌第三錢換小珠幾何粒行二八九五略少于實商三減答曰每錢換三萬五實二十八萬九千五百餘實五萬三千六百千五百六十粒五十四以候續商次簡籌第五行是四八二五為略少于餘實商五減餘實四萬八千二百五十仍餘五千四百四以待第三商原實又簡籌第五行是四八二五為略少于餘實又商五減餘實四千八百二十五仍餘商數五百七十九知尚有第四商也又簡籌第六行是五七九與餘實恰合四次商數俱對首位商作六除餘實五百七十九恰盡定位訣從原實中尋法首單位逆轉上一位得單粒定所得為三萬五千五百六十粒命為大珠每錢所換小珠之數五園問曰法是錢數實是粒數不類也何定位亦如是準乎勿菴曰此定位之法所以的確不易也且錢與粒不類子疑之固矣抑知單與單之為一類乎葢所問是每錢若干故錢數為單位若問每分若干則法首錢數為十位得為三千五百五十六矣故定位須詳問意乃要訣也法有籌式法此欲分作九百七分也故以九七假如布二萬為法用三籌一千七百六如圖簡籌第二行十八丈給與一八一四商作二減實九百七人一萬八千一百四十餘三千六百各幾何二十八丈次簡第四行答曰每人二十四丈三六二八商四除實盡以上例皆法少于實故法首在原實中乃本法也以上兩例皆法多于實者其法首位或在原實中必原實首位也或不在原實中則在其原實上幾位也要之皆不能滿法其所得必為分秒乃通變之法也論曰除者分也吾欲作幾分分之則為法所分之物為實所分之物能如所欲分之數則為滿法滿法則成一整數假如三十六人分布而布有三十六丈則各人分得一丈古云實如法而一正謂此也程大位算法統宗曰歸扵法前得零其意亦同此立法之本意也乃有所分之物原少于所欲分之數是不滿法也既不滿法則不能成一整數而所分者皆分秒之數假如三十六人分布二十七丈則每人不能分一丈只各得七尺五寸是于一丈内得其七分五秒也然必先知整數然後可以知分秒故必于原實上虚擬一滿法之位若曰能如此則分得整數矣而今不能則所分得者皆分秒也于是視所擬整數虚位距商數若干位而命之若相差一位則得為十之一如兩有錢尺有寸隔位則為百之一如兩有分丈有寸此乃通變之法要其為法上得零則一而已矣又論曰此原實即不滿法也若餘實不滿法除之終不能盡則以命分之法御之詳後命分法法曰凡除法商數至單已極而有餘實不盡者不能成一整數也則以法命之此有二法一法即以除法為命分不盡之數為得分則云幾十幾分之幾解曰命分者以一整數擬作若干分而命之如滿此數則成一整數而今數少故命之也得分者今所僅有之數在命分數内得若干也命分者古謂之分母得分者古謂之分子假如古厯以九百四十分為日法每年三百六十五日又九百四十分日之二百三十五約為四之一約法見後一法除之至盡古厯家所謂退除為分秒是也單下有一位命為十分之幾有兩位命為百分之幾十幾三位則命分千四位則命分萬皆以除得數為得分假如授時厯法每嵗三百六十五日二千四百二十五分是以萬分為日即命分也式如後假如五尺為歩每方一歩積二十五尺今有積二百四十尺得若干步答曰九步又五分步之三如圖列實簡籌第九行是二二五商作九第九行故減實二百二十五尺餘一十五不盡以法命之命為九步又二十五分歩之一十五約為五之三約分法見後若用第二命分法再列餘實加位商之以得其分秒如後餘實下加一圈則一十五尺通為一百五十分可再商矣簡等第六行是一五商六分除餘實恰盡命分九歩六分即十分歩之六命分第二法與法多于實除法同故皆曰除分秒也若餘實為一十六尺則又不盡一尺法當於不盡一之下再加一圈為一使此一尺化為一百分而再除之得四釐共九歩六分四釐即百分歩之六十四約分法約分者約其繁以從簡也法曰母數子數平列相減而得其紐數即以紐數為法轉除兩原數而得其可約之分凡約分相減不拘左右但以少減多如左少右多則以左減右左多右少則以右減左若減之後或多者變而少則轉減之必減至左右相同無可減而止即紐數也若一減之即得紐數則不必轉減解曰紐數者互相減之餘數相等者也以此除兩數則皆可分乃兩數之樞紐若相減至盡而無紐數者則不可約假如母數二十五子數一十五約之若干畣曰五之三一先以十五復以一十五二五減二十五一轉減十五一一五餘一十一五餘五五復以五轉減一十餘五左右皆五即為紐數以紐數五為法轉除母二十五得五除子數一十五得三故曰五之三葢母數是五個五子數是三個五也此轉減例又如母數九百四十子數二百三十五約之若干畣曰四之一先以二百三十五減九百四十餘七百五又減之餘四百七十又減之餘二百三十五左右皆二百三十五即紐數也以紐數二百三十五轉除母數九百四十得四除子數二百三十五得一故曰四之一母數是四個二百三十五子數是一個二百三十五此不轉減例厯算全書巻三十
