body:
  text: 厯算全書卷二十宣城梅文鼎撰仰儀簡儀二銘補注仰儀按元史天文志簡儀之後繼以仰儀然簡儀紀載明析而弗録銘辭仰儀則僅存銘辭而弗詳制度蓋以銘中弗啻詳之也庚寅暮春真州友人以二銘見寄屬疏其義余受而讀之簡儀銘既足以補史志之闕仰儀銘與史亦多異同而異者較勝豈牧菴作銘後復有定夲耶爰據其夲以為之釋仍附録史志原文以資考訂焉不可形體莫天大也無競維人仰􅚚載也言天體之大夲不可以為之形似而今以虛坳似􅚚之器仰而肖之則以下半渾圓對覆幬之上半渾圓而周天度數悉載其中此人巧之足以代天工故曰無競維人也六尺為深自倍也兼深倍潔􅚚兊也􅚚形是半渾圓而其深六尺是渾圓之半徑也倍之為廣則渾圓之全徑也兼深與之度而又倍之渾圓之周也蓋仰儀之口圓徑一丈二尺周三丈六尺也兌為口故曰􅚚兌潔猶度也此雖亦徑一圍三古率然其器果圓則畸零在其中矣振溉不泄繚以澮也正位辨方曰子卦也􅚚口周圍為水渠環繞注水取平故曰振溉不泄繚以澮也􅚚口之面均列二十四方位而從子半起子午正則諸方皆正故曰正位辨方曰子卦也橫縮度中平斜載也斜起南極平􅚚鐓也度入聲縮直也仰儀象地平下半周之渾天其度必皆與地平上之天度相對待故先平度之從儀面之卯酉作弧線相聫必過儀心以橫剖􅚚形為二地平下卯酉半規也又直度之從儀面之子午作弧線相聨亦過儀心而直剖􅚚形為二地平下子午半規也兩半規交於儀心正中天在地平下正對天頂處也故曰衡縮度中然此所謂中乃平度之中其衡縮度之者並自地平之子午卯酉出弧線而會於地平下之中心若在天之度固自斜轉即非以此為中故既平度之復斜度之有兩種取中之法故曰平斜載也載猶再也斜度奈何曰宗南極也法於地平下子午半規勻分半周天度乃用此度自地平午數至南極入地度命為斜度之中心故曰斜起南極言緯度從此起􅚚鐓者􅚚之鐓即儀心也鐓徒對切矛戟底平者曰鐓曲禮進矛戟者前其鐓類篇矛戟柲下銅也儀類􅚚而形仰最坳深處為其底心故謂之鐓為地平下兩半規十字交處而下半渾圓之心平度以此為宗亦如斜度之宗南極故曰平􅚚鐓也蓋以此二句釋上二句也不言起省文小大必周入地畫也始周浸斷浸極外也此言斜度之法也斜畫之度既宗南極則其緯度之常隱不見者每度皆繞極環行而成圓象每度相去約一寸弱雖有大小皆全圓也近南極旁則小漸逺漸大每度相離一寸其圓徑之大小每度必加二寸故曰小大必周而明其為入地之畫也在南極常隱界內故也若過此以往則離極益逺緯度之圓益大其圓之在地平下者漸不能成全圓而其闕如玦以其漸出南極常隱界外也故曰始周浸斷浸極外也亦是以下句釋上句極入地深四十太也北九十一赤道齘也列刻五十六時配也儀設於元大都大都北極出地四十度太四分之三為太則南極入地亦然仰儀凖之近南極四十度內皆常隱界也若四十一度以上則所謂始周浸斷者也至於離南極一象限四分天周各九十一度竒為象限銘蓋舉成數也則為赤道之齘而居渾天腰圍矣齘齒相切之界縫也考工記函人衣之欲其無齘也仰觀經緯之度入算處並只一線故曰齘凡晝夜時刻並宗赤道赤道全周勻分百刻以配十二時仰儀赤道乃地平下半周故列刻五十配六時也六時者起卯正初刻畢酉初四刻皆晝時仰儀赤道半周居地平下而紀晝時者日光所射必在其衝也日在卯光必射酉日在午光必射子餘時亦皆若是衡竿加卦巽坤內也以負縮竿子午對也子元史作夲末旋機杖機杖元史作機板窽納芥也上下懸直與鐓會也視日漏光何度在也此仰儀上事件也巽東南坤西南所定􅚚口之卦位也橫竿之兩端加此二卦者以負直竿也直竿正與口為平面承之者必稍下故曰內也直竿加橫竿上如十字其夲在午而末指子故曰對也直竿必圓取其可以旋轉而竿末則方其形類板板之心為圓竅甚小僅可容芥子故曰窽納芥窽即竅也然必上下懸直以為之凖蓋直竿之長適如半徑其末端雖自午指子實不至子而納芥之竅正在􅚚口平圓之心於此懸繩取正則直線下垂亦正直􅚚底鐓心故曰與鐓會也既上下相應無豪髮之差殊則竅納芥處亦即為渾圓心矣凡所以為此者以取日光求真度也何則仰儀為􅚚形以象地平下之半天而所測者地平上之天也故必取其衝度以命之而渾圓上經緯之相衝必過其心兹也機板之竅既在渾圓之最中中央從此透日光以至􅚚底視其光之在何度分即可以知天上日躔之度分矣漏即透也暘谷朝賔夕餞昧也寒暑發斂驗進退也此詳言測日度之用也虞書分命羲仲宅嵎夷曰㿩谷寅賔出日分命和仲宅西曰昧谷寅餞內日此古人測日用里差之法也今有此器則隨地隨時可測日度即里差已在其中不必㿩谷昧谷而寅餞之用已全矣周禮以土圭致日日至之影尺有五寸為土中又取最長之影以定冬至此古人冬夏致日之法也今有此器以測日道之發南斂北日躔在赤道以南謂之發在赤道以北謂之斂皆以其逺近於北極而立之名則每日可知其進退之數二分前後黃赤斜交故緯度之進退速二至前後黃赤平行故緯度之進退緩細考之亦逐日各有差數不必待南至北至而可得真度視表影所測尤為親切矣薄蝕終起鑒生殺也以避赫曦奪目害也言仰儀又可以測交食也日月交食一曰薄蝕厯家之測驗莫大於交食而測算之難亦莫如交食是故測食者有食之分秒有食之時刻有食之方位必測其何時何刻於何方位初虧為食之起何時何刻於何方位復圓為食之終何時何刻於何方位食分最深為食之甚自虧至甚為食之進自甚至復為食之退凡此數者一一得其真數始可以驗厯之踈密以為治厯之資然太陽之光最盛難以目窺今得此器透芥子之光於儀底必成小小圓象而食分之淺深進退畢肖其中但蝕於左者光必闕於右蝕於右者光必闕於左上下亦然皆取其對衝方位而時刻亦真不煩他器矣古者日食修德月食修刑然春生秋殺之理固在寒暑發斂中而起虧進退尤測􅝚之精理此蓋與上文互見相明也南北之偏亦可槩也極淺十七林邑界也深五十二元史作五十竒鐵勒塞也淺赤道髙人所載也夏永冬短猶少差也深故赤平冬晝晦也夏則不沒永短最也載當作戴此言仰儀之法不特可施之大都而推之各方並可施用因舉二處以槩其餘也蓋時刻宗赤道赤道宗兩極而各方之人所居有南北北極之出地遂有髙卑而南極之入地因之有深淺則有地偏於南如林邑者其地在交趾之南是為最南故其見北極之髙只十七度即南極之入地亦只十七度而為最淺又有地偏於北如鐵勒者其地在朔漠之北是為最北故其見北極之髙至五十餘度即南極之入地亦五十餘度而為最深南極入地淺則赤道入地深而成立勢其赤道之半在地上者漸近天頂為人所戴故夏日亦不甚長冬日亦不甚短而永短之差少也南極入地深則赤道入地淺而成眠勢其赤道之半在地上者漸近地平繞地平轉故冬日甚短而或至晝晦夏晝甚長而日或不沒永短之最斯為極致也按元史鐵勒北極髙五十五度夏至晝七十刻夜三十刻北海北極髙六十五度夏至晝八十二刻夜十八刻未至於夏日不沒則冬亦不至晝晦然北海之北尚有其北北極有漸直人上之時逺徵之周髀所言近驗之西海所測夏不沒冬晝晦容當有之銘蓋因二方差度而遂以推極其變也二天之書曰渾蓋也一儀即揆何不悖也以指為告無煩喙也暗資以明疑者沛也智者是之膠者怪也此言仰儀之有禆於推步也渾天蓋天並古者測天之法蓋同出於一源傳久而分遂成岐指近代蓋天之説浸微惟周髀算經猶存十一於千百而習之者稀今得此器以肖地平下之天雖常隱不見之南極其度數皆如掌紋而渾天之理賴以益明即蓋天家所言七衡之説並可相通初無齟齬然後知渾蓋兩家實有先後一揆並行而不悖者矣所以者何也多言亂聽喙愈煩而心惑一儀惟肖指相授而目喻也由是而理之暗者資之以明從來疑義渙然氷釋雖其器創作或為膠固者之所怪而其理不易終為明智者之所服矣周髀算經云北極之左右物有朝生暮穫趙爽注曰北極之下從春分至秋分為晝從秋分至春分為夜是北極直人上而南極益深為人所履赤道平偃與地面平日遂有時而不沒地為永短之最觀於仰儀可信其理過者巧厯不億輩也非讓不為思不逮也將窺天眹造物愛也其有俟然昭聖代也泰山厲兮河如帶也黃金不磨悠久賴也鬼神禁訶庶勿壞也此承上文而深贊之也言古來巧厯不可數計然不知為此者豈其謙讓不遑乎無亦精思有所未及耳抑天道幽逺將造物者不欲以朕兆令人窺測而或有愛惜耶其或待人而行非時不顯故若有所俟必至聖代而始昭耶然則兹器也實振古所未有而兹器之在宇宙間亦當與天地而常存雖泰山如礪長河如𢃄而兹器也悠久賴之如黃金之不磨而鬼神且為之呵護以庶幾勿壞矣按史載斯銘引古六天之説而謂仰儀可衷其得失是等蓋天於宣夜諸家而歸重渾天也然郭太史有異方渾蓋圖固已觀其會通兹則並舉渾蓋且以仰儀信其揆之一蓋牧菴之厯學深矣愚故以斷其為重定之夲也學無止法理愈析益精古之人皆如是上海徐公之治西厯也開局後數年推宗郭法乃重於前惟公則明惟虛受益好學深思者其知所取法哉簡儀儀制詳元史兹約舉為銘而文章爾雅能略所詳詳所略與史相備因併釋之舊儀昆侖六合包外經緯縱橫天常邪帶三辰內循黃赤道交其中四遊俯仰鈞簫此將言簡儀而先述渾儀也昆侖即混淪古者渾天儀渾圓如球故曰舊儀昆侖也渾天儀有三重外第一重為六合儀有地平環平分草四方向有子午規卯酉規與地平相結於四正又自相結於天頂以象宇宙間四方上下之定位故曰六合包外經緯縱橫也又依北極出地於子午規上數其度分命為南北二極之樞兩樞間中分其度斜設一規南髙北下以象赤道之位而分時刻謂之天常規故又曰天常邪帶也內第二重為三辰儀亦有子午規卯酉規而相結於兩極各為樞軸以綴於六合儀之樞中分兩極間度設赤道規與天常相直又於赤道內外數南北二至日度斜設一規為黃道兩道斜交以紀宿度以分節氣而象天體故曰三辰內循黃赤道交也內第三重為四遊儀亦有圓規內設直距以帶橫簫橫簫有二並綴於直距而能運動故可以上下轉而周窺規樞在兩極又可以左右旋而遍測故曰其中四逰俯仰鈞簫也凡今改為皆析而異繇能疏明無窒於視此承上文而言作簡儀之大意也渾天儀經緯相結而重重相包今則析為單環以各盡其用故曰皆析而異各環無經緯相結作之既簡而各儀各測無重環掩映之患故曰疏明無窒於視也四遊兩軸二極是當南軸攸沓下乃天常維北欹傾取軸矩應鏤以百刻及時初正赤道上載周列經星三百六十五度竒贏此以下正言簡儀之製也簡儀之四遊環用法與渾儀之四遊同而厥製迥異原亦有經緯相結今只一環雖用雙環而左右平列無經緯相結即如一環又原在渾儀之內為第三重今取出在外而中分其環命為兩極北極樞軸連於上規之心南極樞軸在赤道環心故曰四遊兩軸二極是當南軸攸沓下乃天常也天常即百刻環與赤道相疊言天常不言赤道省文也上規貫北雲架柱之端赤道百刻疊置承以南雲架柱兩雲架柱斜倚之勢並凖赤道但言維北欹傾者省文互見也兩並欹傾則二軸相應如繩正指兩極而四遊環可以運動其勢恆與上下兩規作正方折其方中矩故曰取軸矩應此以上言四逰環也百刻環勻分百刻又勻分十二時時又分初正此二句言百刻環也赤道環疊於百刻環上故曰上載其環勻分十二次周天全度於中又細分二十八舍距度故曰周列經星三百六十五度竒贏也百刻環即六合儀上斜帶之天常赤道環即三辰儀之赤道然皆不用子午規而單環疊置此其異也地平安加立運所履錯列干隅若十二子地平環分二十四方位與渾儀同干八干甲乙丙丁庚辛壬癸隅四維乾坤艮巽十二子支辰子丑寅卯辰巳午未申酉戌亥也然彼為六合儀之一規此則獨用平環臥置以承立運故曰立運所履也立運環渾儀所無兹特設之以佐四逰之用其製亦平環分度而中分之為上下二樞上樞在北雲架柱之橫輄下樞在地平環中心二樞上下相應如垂繩之立而環以之運故謂之立運五環三旋四衡潔焉一四遊二百刻三赤道四地平五立運凡為環者五也旋運轉也五環之內百刻地平不動四遊赤道立運並能運轉是能旋者三也衡即橫簫古稱玉衡潔猶潔矩之潔用衡測天如算家之術潔而度之以得其度也簡儀之衡凡四而並施於旋環之上故曰五環三旋四衡潔焉也下文詳之兩綴窺距隨捩留遷欲知出地究兹立運去極幾何即遊是問兩者兩衡承上文四衡而分别言之先舉其兩也兩者維何一在立運環一在四遊環也窺窺管距直距捩關捩即樞軸也留遷者言或留或遷惟人所用也窺管綴於直距有樞軸以轉動隨其所測可以俯仰周窺此兩衡之所同也然各有其用欲知日月星辰何方出地及其距地平之髙下則惟立運可以測之若欲知其去北極逺近幾何度分惟四遊可以測之此又兩衡之所異也赤道重衡四弦末張上結北軸移景相望測日用一推星兼二定距入宿兩候齊視前云四衡而上文已詳其兩尚有二衡復於何施曰並在赤道環也赤道一環何以能施二衡曰凡衡之樞在腰而此二衡者並以赤道中心之南極軸為軸重疊交加可開可合故曰重衡也衡既相重故不曰窺衡而謂之界衡界衡之用在線不設窺管也用線奈何其法以線自衡樞間循衡底之渠貫衡端小孔上出至北極軸穿軸端所結線折而下行至衡之又一端入貫衡端小孔順衡底渠至衡中腰結之如此則一線折而成兩並自衡端上屬北極其勢斜直張而不弛半衡如句而線為之弦一衡首尾二線重衡則四線矣故曰四弦末張末指衡端張者狀其線之弦直也北軸即北極之軸穿線處也四弦線並起衡端而宗北極故又曰上結北軸也景謂日影移衡對日取前線之景正加後線則衡之首尾二線與太陽參直故曰移景相望也衡上二線既與太陽參直則界衡正對太陽衡端所指即太陽所到加時早晚時初時正何刻何分並可得之百刻環中具列其數則一衡已足故曰測日用一也測星之法移衡就星用目睨視取衡上二線與其星相參值則為正對與用日景同理但須二衡並測故曰推星兼二也二衡並測奈何曰二十八舍皆有距星以命初度若欲知各宿距度廣狹者法當以一衡正對距星又以一衡正對次宿距星則兩衡間赤道度分即夲宿赤道度分矣若欲知中外官星入宿深淺者法當以一衡對定所入宿距星復以一衡正對此星稽兩衡間赤道即得此星入宿度分矣既用二衡即亦可兩人並測故曰定距入宿兩候齊視也巍巍其髙莫莫其遙蕩蕩其大赫赫其昭步仞之間肆所賾考明乎制器運掌有道法簡而中用密不窮厯考古陳未有侔功猗與皇元發帝之藴畀厥羲和萬世其訓簡儀之製及其用法上文已明此則贊其制作之善歸美夲朝也言天道如斯髙逺乃今測諸步仞之間如示諸掌則制器有道耳其為法也簡而適中其為用也密而不窮歷考古制未有如我皇元斯器之善
