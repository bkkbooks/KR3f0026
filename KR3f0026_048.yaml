front:
  text: 比例尺式即度數尺也原名比例規以兩尺可開可合有似作圓之器故亦可云規
  hash: sha256:9d08f6dc44e11faa56e75601a572e8b1a74570dcf5b08ab277afb3e2d374a1b6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3f0026_WYG_048-1a, image: WYG0794/WYG0794-0826a.png}
body:
  text: 用薄銅板或厚紙或堅木黃楊木等作兩長股如圖任長一尺上下廣如長八之一兩股等長等廣股首上角為樞以樞心為心從心出各直線以尺大小定線數今折中作五線兩股兩面共十線可用十種比例之法線行相距之地取足書字而止尺首半規餘地以固樞也用時張翕遊移比例尺又式前式兩股相疊此式兩股相並股上兩用之際以為心規餘地以安樞其一規面與尺面平而空其中其一剡規而入於彼尺之空令密無罅也樞欲其無偏也兩尺並欲其無罅也樞心為心與兩尺之合線欲其中繩也張盡令兩首相就成一直線可作長尺或以兩尺橫直相得成一方角可作矩尺規式此本為畫圓之器尺算賴之以取底數蓋相須為用者也用銅或鐡亦如尺作兩股但尺式扁方此可圓也首為樞可張可翕末鋭以便于尺上取數也當其半腰綴一銅條橫貫之勢曲而長如割圓象限之弧與樞相應得數後用螺釘固之凡算例假如有言取某數為底線者並以規之兩鋭於平分線上量而得之其用底線為得數者並以規取兩尺上弦線相等之距于平分線上量而命之故規之兩鋭可當橫尺數度衍以橫尺比量反不如用規之便利而得數且真也第一平分線此線為諸線之根取數貴多尺大可作一千然過密又恐其不清也故以二百為率分法如設一直線欲作百分先平分之為二又平分之為四又于每一分內各五分之則已成二十分矣于是用更分法取元分四改為五分如甲乙丙有丙戊丁三㸃是元分之四也今復勻作五分加己庚辛壬四㸃則元分與次分之較如壬丙及巳戊皆元分五之一亦即設線百分之一分凖此為度而周布之即百分以成解曰元分為設線百分為二十分之一即每一分內函五分也今壬丙己戊既皆五分之一則甲壬己乙皆五分之四亦即百分之四也又丙辛庚戊皆三而辛丁丁庚皆二也任用一度參差作㸃互相考訂即成百分勻度矣每數至十至百皆作字記之或取元分六復五分之亦同何則元分一內函五分則元分四共函二十分故可以五分之若元分六即共函三十分故亦可五分之其理一也用法一凡設一直線任欲作幾分假如四分即以規量設線為度而數兩尺之各一百以為弦乃張尺以就度令設線度為兩弦之底置尺置尺者置不復動故亦可云定尺下倣此數兩尺之各二十五以為弦斂規取二十五兩㸃間之底以為度即所求分數即四分中一分也以此為度而分其線即成四分若求極微分如一百之一如上以一百為弦設線為底置尺次以九十九為弦取底比設線其較為百之一若欲設線內取零數如七之三即以七十為弦設線為底置尺次以三十為弦斂規取底即設線七之三謹按尺算上兩等邊三角形分之即兩句股也兩句聫為一線而在下直謂之底宜也若兩尺上數原係斜弦改而稱腰于義無取今直正其名曰弦用法二凡有線求幾倍之以十為弦設線為底置尺如求七倍以七十為弦取底即元線之七倍若求十四倍則倍得線或先取十倍更取四倍并之用法三有兩直線欲定其比例以大線為尺末之數尺百即百千即千置尺斂規取小線度于尺上進退就其兩弦等數如大線為一百小線為三十七即兩線之比例若一百與三十七可約者約之約法以兩大數約為兩小數其比例不異如一百與三十約為十與三用法四有兩數求相乘假如以七乘十三先以十㸃為弦取十三㸃為底置尺次檢七十之等弦取其底得九十一為所求乘數若以十為弦七為底置尺而檢一百三十㸃之底得數亦同論曰乘法與倍法相通故以七乘十三是以十三之數七倍之是七個十三也以十三乘七是以七數十三倍之是十三個七也故得數並同用法五有兩數求相除假如有數九十一七人分之即以本線七十為弦取九十一為底置尺次檢十㸃之弦取底必得十三為所求又法以九十一為弦用規取七十為底置尺斂規取一十為底進退求其等弦亦得十三如所求論曰算家最重法實今當以七人為法所分九十一數為實乃前法以法數七為弦實數九十一為底又法反之而所得並同何也曰異乘同除以先有之兩率為比例算今有之兩率雖曰三率實四率也徴之于尺則大弦與大底小弦與小底兩兩相比明明四率較若列睂故先有之兩率當弦則今所求者在底是以弦之比例例底也若先有之率當底則今所求者在弦是以底之例例弦也但四率中原缺一率比而得之固不必先審法實殊為簡易矣然則乘除一法乎曰凡四率中所缺之一率求而得之謂之得數乘則先缺者必大數也故得亦大數除則先缺者必小數也故得亦小數所不同者此耳是故乘除皆有四率得尺算而其理愈明亦諸家所未發也假如有銀九十六兩四人分之法以人數取四十分為底置銀數九十六兩為弦定尺斂規取一十分為底進退求其等弦得二十四兩為每人得數又法取銀數九十六兩為底置一百分為弦定尺斂規于二十五分等弦取其底亦得二十四兩為每人數又如有數一百二十三欲折取三分之一法以規取三十分為底置一百二十三等數為兩弦定尺斂規取一十數為底進退求其等數為弦必得四十一命為三分之一如所求用法六凡所求數大尺所不能具則退位取之假如有數一百二十欲加五倍即退一位取一十二為底以尺之一十㸃為兩弦定尺取兩弦五十㸃之底即五倍得六十進一位命所得為六百以一十二當一百二十是一而當十故進位命之也凡用尺算須得此通融之法又法以規取一十數為底于尺之一十二㸃為兩弦一十二以當一百二十是一當十也或二十四亦可為一當五定尺展規取五十數以當五倍為底進退求其等數之弦必得六十進位成六百假如有銀十三兩每兩換錢一千二百文法退二位以規取十二分當一千二百以尺上一數當一百為底置一十㸃即每兩之位為弦定尺然後尋一百三十㸃即十三兩之位為弦展規取其底得一百五十六分進二位命之得共錢一十五千六百又如有銀四兩每兩換錢九百六十文法作兩次乘先乘六十取六數為底置一十㸃為弦定尺展規取四十㸃之底得二十四次乘九百取九數為底置一十㸃為弦定尺展規取四十㸃之底得三十六進一位併之得三八四末增一為進位得三千八百四十文三二四六因每兩是九百六十故末位增三八四千百十文假如有數一百二十欲折取三分之一法以規取六十折半法也為底置九十分為弦定尺然後尋兩弦之三十分㸃即三之一取其底于本線比之必二十命所得為四十加倍法也先折半故得數加倍凡所用數在一十㸃以內近心難用則進位取之如前條所設宜用六數九數為底其㸃近心取數難清即進位作六十取數用之是進一位也但先進一位者得數後即退一位命其數此可于前假如中詳之用尺時有退位得數後進位命其數用尺時有進位得數後退位命其數其理相通故不另立假如或先進二位者得數亦退二位或先加倍者得數折半並同一法用法七凡四率法有中兩率同數者謂之連比例假如有大數三十六小數二十四再求一小數與此兩數為連比例法以大數為弦如辛甲小數為底如辛巳定尺再以辛巳底為弦如甲丁而取其底如丁戊其數必十六則三十六與念四之比例若念四與十六也其比例為三分損一若先有小數十六大數二十四而求連比例之大數則以小數為底如丁戊大數為弦如丁甲定尺再以丁甲弦為底如辛巳取其弦如辛甲其數必三十六則十六與念四若念四與三十六也其比例為三分增一他皆倣此原書有斷比例法今按斷比例即古法之異乘同除西法謂之三率前各條中用尺取數皆異乘同除之法故不更立例用法八凡句股形有句有股有弦共三件先有兩件而求其不知之一件法以尺作正角取之假如有句八尺股十五尺欲知其弦法以規量取八十㸃為底一端指尺上之六十四㸃一端指又一尺之四十八㸃以定尺則尺成正角乃于尺上取八十㸃為句又于一尺上取一百五十㸃為股張規以就所識句股之兩㸃必一百七十退一位得弦十七尺如所求取句股數時原進一位故所得弦數退一位命之說見前若先有弦十七尺股十五尺求其句則以規取一百七十㸃為句股之弦乃以規端指一百五十㸃以餘一端又于一尺上尋所指之㸃必八十也如上退位得句八尺或先有弦十七尺句八尺求其股亦以規取一百七十而一端指八十尋又一端之所指必得一百五十命一十五尺為股如所求凡雜三角形內無正角不可以句股算法先作角假如先有一角及角旁之兩邊求餘一邊法于平分線任用一籩如甲乙取數為底分圓線六十度為兩弦定尺以規取所設角之底為平分線上任用甲乙邊等度之底定尺則尺間角如所設如乙角乃于兩尺上依所設取角旁兩邊之數于兩尺各作識如甲乙丙乙遂用規取斜距之底如甲丙即得餘一邊如所求又法假如乙甲丙三角形有甲角五十三度七分甲乙邊五十六尺甲丙邊七十五尺而求乙丙邊法以規取一百分為分圓線上六十度之底斂規取五十三度强之底移于平分線上作百分之底定尺乃于尺上取五十六㸃如甲乙又一尺上取七十五㸃如甲丙乃以規取兩㸃斜距之底于尺上較之即得六十一尺如乙丙命為所求邉分圓線見後用法十有小圖欲改作大幾倍之圖用前倍法假如有小圖濶一尺二寸今欲展作五倍即取十二為十㸃之底定尺展規取五十㸃之底必得六十命為六尺如所求用法十一平圓形周徑相求法于平分線上作兩識以一百八十八半弱上為周六十為徑各書其號假如有徑七十一求周法以規取七十一加于徑㸃為底定尺展規取周㸃之底即得周二百二十三如所求以周求徑反此用之用法十二求理分中末線法于線上定三㸃于九十六定全分五十九又三之一為大分三十六又三之二為小分假如有一直線一百四十四欲分中末線即以設線加于全分㸃為底取其大小分㸃之底即得八十九强為大分五十五弱為小分按平線上既作周徑之號若又作此則太繁不如另作一線其上可寄五金線也又按原書全分七十二大分四十二又三之一小分二十七又三之二大有訛錯今改定以上十二用法姑舉其概其實平分線之用不止于是善用者自知之耳第二平方線舊名分面線凡平方形有積有邉積謂之也冪亦謂之面邊線亦謂之根即開平方法原為一百不平分今按若尺小欲其清則但為五十分亦可假如有積六千四百則以平分線之二十自乘得四百于積為十六倍之一若置二十分於一㸃為底求十六㸃之底則得方根八十或置于二㸃為底則求三十二㸃之底或置于三㸃為底則求四十八㸃之底皆同分法有二以算一以量以算分算法者自樞心甲任定一度命為十分如甲乙即平方積一百分之根今求加倍平方二百分之根為十四又念九之四即于甲乙線上加四分强如丙命甲丙為倍積之根求三倍則開平方三百分之根得十七又三十五之十一即又于甲乙線上加十分半弱如丁即甲丁為三倍積之根求四倍則平方四百之根二十即以甲乙倍之得甲戊為四倍積之根五六七以上並同按用方根表甚簡易以量分以任取之甲乙度作正方形如丙乙甲乃于乙甲橫邊引長之以當積數丙乙直邊引長之作垂線以當根數如求倍積之根即于橫線上截丁乙為甲乙之倍次平分甲丁於戊戊為心甲為界作半圈截垂線于巳即己乙為二百分之邊求三倍則乙丁三倍于甲乙四倍以上並同又捷法如前作句股形法定兩尺間成正方角如甲乃任于尺上取甲乙命為一㸃而又于一尺取甲丙度與甲乙相等即皆為一百之根次取乙丙底加于甲乙尺上為二百之根甲丁又自丁至丙作斜弦以加于甲乙尺上為三百之根甲戊又自戊至丙作弦以加于甲乙尺上為四百之根甲已如此遞加即得各方之根其加法俱從尺心起如求得丙乙即以丙加甲乙加丁成甲丁他皆倣此試法甲乙為一正方形之邊倍其度即四倍方積之邊否即不合三倍得九倍方積之邊四倍得十六五倍得二十五又取三倍之邊倍之即十二倍之邊四其三也再加一倍得二十七倍之邊九其三也再加倍得四十八倍之邊十六其三也再加倍得七十五倍之邊二十五其三也若以五倍之邊倍之得二十倍之邊四其五也再加倍得四十五倍之邊九其五也再加倍得八十倍之邊十六其五也如凡言倍其度者線上度也正方四百分之邊二十分甲乙正方一百分之邊十分其大為一倍也言幾倍方積者積數也如邊二十者積四百即尺上所書用法一有平方積求其邊即開平方法先其設數與某數能相為比例得幾倍如法求之假如有平方積一千二百二十五尺欲求其根以約分法求得二十五為設數四十九之一即以規于平分線取五㸃為平方線上一㸃之底定尺展規于四十九㸃取其底即得一邊三十五尺為平方根積二十五方根五加四十九倍為積一千二百二十五方根三十五或用四十九為設數一千二百二十五尺二十五之一即以規取七㸃為平方一㸃之底而取平方二十五㸃之底亦得方根三十五如所求積四十九方根七加二十五倍為積一千二百二十五則其方根三十五又法若無比例可求者但以十分為一㸃之底定尺有假如在用法七用法二凡同類之平面形可併為一大形或方或圓或三角多邊等形但形相似即為同類假如有平面正方四形求作一大正方形與之等積其第一形之冪積為二第二形之積為三第三形之積四有半第四形之積六又四之三法先併其積得十六叉四之一乃任取第一小形之邊為底二㸃為弦定尺若用第二形之邊為底定尺即用三㸃為弦而于十六㸃又四之一取其底為大形邊其面積與四形總數等若但有同類之形而不知面積亦不知邊數則先求其積之比例如甲乙丙丁方形四法以小形甲之邊為底平方線第一㸃為弦定尺次以乙形邊為底進退求等數得第二㸃外又五分之一即命其積為二又五之一此與小形一之比例不拘丈尺次丙形邊為底求得二又四之三丁形邊得四又六之五并諸數及甲形一得十又六十分之四十七約為五之四弱向元定尺上尋十㸃外十一㸃內之距取其五之四為等數之兩弦即十一弱用其底為大方形邊其面積與四形併數等此加形法也圓面及三角等面凡相似之形並可相併其法同上用法三平面形求作一同類之他形大于設形幾倍以設形之邉為一㸃之底定尺假如有正方形面積四百其邉二十今求别作一方形其容積大九倍法以設形邉二十為平方線一㸃之底定尺而取平方九㸃等數之底得六十如所求邉六十其方積三千六百以比設形積為大九倍用法四平面形求别作一同類之形為設形幾分之幾以設形之邉為命分定尺而于得分取數假如有平方形積三千六百其邉六十今求作小形為設形九之四法以設形邉六十為平方第九㸃之底定尺而取第四㸃之底得四十如所求邉四十其積一千六百以比設形積為九之四也九為命分四為得分此減積法也圓面三角等俱同一法用法五有兩數求中比例即三率連比例之第二率假如有二與八兩數求其中比例法先以大數為平方線八㸃之底而取二㸃之底得四如所求二與四如四與八皆加倍之比例故四為二與八之中率用法六有長方形求作正方形假如長方形橫二尺直八尺如上圖求得中比例之數為四尺以作正方形之邊則其面積與直形等直八尺橫二尺其積一十六尺方形各邊並四尺其積亦十六尺用法七有設積求其方根而不能與他數為比例則以一十數為比例假如平積二百五十五用十數比之為二十五倍半即取十數為平方線一㸃之底而取二十五㸃半之底得十六弱為方根十六自乘積二百五十六今只缺一小數故命之為十六弱第三更面線凡平面形方必中矩圓必中規其餘各形並等邊等角故皆為有法之形而可以相求分法置公積四三二九六四以開方得正方形之根六五八三邊形之根一千五邊形之根五二六邊形之根四八七邊形之根三四五八邊形之根二九九九邊形之根二六十邊形之根二三七十一邊形之根二一四十二邊形之根一九七圜徑七四二以本線為千平分而取各類之數從心至末取各數加本類之號用法一有平面積求各類之根凡三角及多邊各平面形其邊既等故並以形之一邊為根圓形則以徑為根法先以設數于平方線上求其正方根以此為度於更面線之正方號為底定尺次于各形之號取底即得所求各形邊假如有平面三等邊形積二千七百七十一寸欲求其邊法以設積于平方線上如法開其平方根依前卷用法七以設數為十數之二百七十七倍強各降一位命為一數之二十七倍又十之七强乃以一數為平方一㸃之底定尺而于其二十七㸃十之七强取底數得五寸二六進一位作五尺二寸半强以所得方根為更面線正方號之底定尺而取三等邊號之底得八尺為三等邊形根如所求用法二有平面形不同類欲相併為一大形法先以各形邊為更面線上各本號之底定尺而取其正方號之底作線為所變正方形之邊次以所變方邊于分面線上求其積數而併之為總積假如有甲三角乙五邊丙三形欲相併先以甲邊為三角號之底定尺而取其正方號之底作線于甲形內如此則甲形已變為正方下同書其數曰十次以乙邊為五邊號之底如前取其平方底向平方線求之得二十一半其法以甲邉為平方十㸃之底定尺而以乙所變方邊進退求等度之弦命之即于乙形作方底線書之次以丙圓徑為平圓號之底如前求得十六弱併三數得四十七半弱為總積此因三形之邉無數姑以小形命十數定尺而所得各方積並小形十數之比例若三形內先知一形之面積即用其所變方邉定尺則所得皆真數如上三形但知丙形之積十六或十六尺或十六寸等如法以丙形邉變方邊于平方線十六㸃為底定尺餘如上法求之亦必得甲為十數乙為二十一半總積四十七半但前條所得是比例之數比例雖同而尺有大小故以此所得為真數也末以總數于原定尺上尋平方線四十七㸃半處取其底度為平方邉則此大平方形與三形面積等若欲以總積為五邉形則以所得大平方邉為更面線正方號之底定尺而于五邉形之號取其底即所求五邊形之一邉若欲作三角或圓形並同一法用法三有平面形欲變為他形如上法以本形邉為本號之底定尺而取所求他形號之底假如有三角形欲改平圓則以所設三角形之邉加于本尺三角形之號為底定尺而取平圓號之底求其數命為平圓徑所作平圓必與所設三角形同積用法四有兩平面形不同類欲定其相較之比例如前法各以所設形變為平方假如有六邉形有圓形相較即如法各變為平方求其數平圓數二十六邉數三十六即平員為六邉形三十六之二十以二十減三十六得十六為兩形之較第四立方線舊名分體線無凡平方形如棊局其四邉橫直相等而高與厚之數立方則如方匱有橫有直又有髙而皆相等平方之積曰平積亦曰面積亦曰冪積如棊局中之細分方罫立方之積曰體積亦曰立積並如骰子之積纍成方舊圖誤以尺樞心甲書于一㸃上今改正甲乙一亦即一十則其內細數亦不平分舊圖作十平分亦誤今删去分法有二一以算一以量以算分從尺心甲任定一㸃為乙則甲乙之度當十分邉之積為一千十分自乘之再乘之即成一千假如立方一尺其積必千寸紀其號曰一次加一倍為立積二千開立方求其根得十二又三之一即于甲乙上加二又三之一為甲丙紀其號曰二再加一倍立積三千開立方得數紀三以上並同捷法取甲乙邉四分之一加甲乙成甲丙即倍體邉又取甲丙七分之一加甲丙成甲丁即三倍體邉又取甲丁十之一加甲丁成甲戊即四倍體邉再加如圖右加法與開立方數所差不逺然尾數不清難為定率姑存其意又捷法用立方表以量分如後圖作四率連比例而求其第二蓋元體之邉與倍體之邉為三加之比例也假如邉為一倍之則二若求平方面則復倍之為四是再加之比例也今求立方體必再倍之為八故曰三加三加者即四率連比例也幾何法曰第二線上之體與第一線上之體若四率連比例之第四與第一第一為元邉線第二為加倍之邉線第三以邉線自乘為加倍線上之面第四以邉線再自乘為加倍線上之體今開立方是以體積求邉線即是以第四率求第二率也假如有立方體積又有加倍之積法以兩積變為線元積如辛庚倍積如辛巳作壬巳辛庚長方形次于壬巳壬庚兩各引長之以形心戊為心作圈分截引長線于子于午作子午直線切辛角如不切辛角必漸試之令正相切乃止即辛庚一率午庚二率子巳三率己辛四率為四率連比例末用第二率午庚為倍積之一邊其體倍大于元積若辛巳為辛庚之三倍四倍則午庚邉上體積亦大于元積三倍四倍以上倣此解四率連比例之理試于辛㸃作卯辛為子午之垂線次用子壬度從午作卯午直線截卯辛線于卯又從卯作直線至子又從辛㸃引辛庚邉至辰引辛巳邉至丑成各句股形皆相似而比例等卯辛午句股形從辛正角作垂線至丑分為兩句股形則形相似而比例等為午丑辛形以午丑為句丑辛為股辛丑卯形以丑辛為句丑卯為股則午丑與丑辛若丑辛與丑卯為連比例也卯辛子句股形從辛正角作垂線至辰分兩句股形亦形相似而比例等卯辰辛形卯辰為句辰辛為股辛辰子形辰辛為句辰子為股則卯辰與辰辛若辰辛與辰子亦連比例也而辰辛即丑卯故合之成四率連比例一率辛庚即午丑二率午庚即丑辛亦即辰卯三率子巳即辛辰亦即丑卯四率己辛即辰子試法元體邊倍之即八倍體積之邉若三之即二十七倍之邉四之即六十四倍體積之邉五之即一百二十五倍體積之邉又取二倍邉倍之得十六八其二也再倍之得一二八倍體積之邉六十四其二也三加比例表平方立方同理即連比例第一率第二率第三率第四率按第一率為元數第二率為線即根數也第三率為面平方冪積也第四率為體立方積也開平方開立方並以積求根故所用者皆二率也比例規解乃云本線上量體任用其邉其根其面其對角線其軸皆可其說殊不可曉今删去用法一有立積求其根即開立方假如有立方積四萬法先求其與一千之比例則四萬與一千若四十與一即取十數為分體線上一㸃之底定尺而取四十㸃之底得三十四强即立方之根說見平方用法二有兩數求其雙中率謂有連比例之第一與第四而求其第二第三法以小數為一率用作本線一㸃之底而取大數之底為二率既有二率可求三率假如有兩數為三與二十四欲求其雙中率法約兩數之比例為一與八即以小數三為本線一㸃之底定尺而于八㸃取底得六為第二率末以二率四率依法求中率得十二為三率一率三二率六三率十二四率二十四用法三設一體求作同類之體大于設體為幾倍此乘體之法假如設立方體八千其邉二十求作加八倍之體為六萬四千問邉若干法以設體根二十為本線一㸃之底定尺而取八㸃之底得四十即大體邉如所求用法四有同類之體欲併為一法纍計其積而併之為總積求其根即得假如有三立方體甲容一十乙容十三又四之三丙容十七又四之一併得四十一即以甲容一十為本線一㸃之底定尺而取四十一㸃之底為總體邉如所求若設體無積數則以小體命為一十而求其比例然後併之用法五有兩同類之體求其比例與其較此分體之法假如甲丙兩立方體欲求其較而不知容積之數法以甲小體邉為一㸃之底定尺而以丙邉為底進退求其等數如所得為九即其比例為九與一以一減九其較八即于八㸃取底為較形之邉用法六有立方體欲别作一體為其幾分之幾假如有立方體欲另作一體為其八之五則以設體邉為本線八㸃之底定尺而于五㸃取底為邉作立方體即其容為設體八之五第五更體線舊名變體線體之有法者曰立方曰立圓曰四等面曰八等面曰十二等面曰二十等面凡六種外此皆不能為有法之體六等面體各面皆正方即立方也有十二棱八角測量全義曰設邊一百求其容為一渾圓體亦曰球體即立圓也幾何補編曰同徑之立方積與立圓積若六與三一四一五九二設徑一百求其容為五二三五九八此三角平面形相合而成有六稜四角測量全義曰設邊一百求其容為一一七四七二半此體各面亦皆三等邊形有十二稜六角測量全義曰設邊一百求其容為四七一四二五有竒此體各面皆五等邊有三十稜二十角測量全義曰設邊一百求其容為七六八六三八九此體各面亦皆三等邊有三十稜十二角按幾何補編二十等面體設邊一百其積二百一十八萬一八二八測量全義作邊一百容五二三八九相差四倍故今不用分法置公積百萬依算法開各類之根則立方六等面體之根為一百四等面體之根為二四八等面體之根為一二八半十二等面體之根為五半强二十等面體之根為七七圓球之徑為一二四原本十二等面根五二十等面根七六圓徑一二六今並依幾何補編改定因諸體中獨四等面體之根最大故本線用二四平分之從心數各類之根至本數加字用法一有各類之立體以積求根即開各類有法體之方法皆以設積于立方線求其根乃移置更體線求本號之根即得假如有十二等面體其積八千問邉若干法以一千之根十為立方一㸃之底定尺而取八㸃之底得二十為所變立方之根次以二十為本線上立方號之底而取十二等面號之底得一十强即十二等面之一邉他倣此用法二有各類之立體以根求積法先以所設根變為正方根乃于立方線求其積假如有二十等面體其邉三十一弱問積法以根三十一弱為本線二十等面號之底定尺而取立方號之底得四十弱為所變立方之邉次于立方線以一十為一㸃之底而以四十進退求等數得十六㸃命其積一萬六千如所求邉一十其積一千則邉四十積一萬六千用法三有不同類之體欲相併為一此以體相加之法並變為正方體積即可相併假如有三立體甲渾圓體徑一百二十四乙二十等面體邉七十七丙十二等面體邉五十半欲相併用前條法各以積變為立方積則三體之積皆一百萬併之得三百萬如所求用法四有不同類之兩體求其比例與其較此以體相减之法法各變為立方體即可相較以得其比例並同更面線法第六分圓線即各弧度之通弦也舊名分弦線亦曰分圈分法有二一以量一以算以量分法作半方形如甲乙丙令甲丙斜弦與本線等長以乙方角為心甲為界作象限弧如甲丁丙乃勻分之為九十度各識之次從甲㸃作直線至各度移入尺上識其號若尺小可作六十度即本線之長為六十度號若尺大可作一百八十度即本線之半為六十度號以算分法用正弦表倍之為倍度之通弦假如求六十度通弦即以三十度之正弦五倍之得一即六十度之通弦他皆若是試法十八為半周十之一即全圈二十之一也三十六為半周五之一即全圈十之一四十五為半周四之一即全圈八之七十二為半周五之二即全圈五之一九十為半周之半即全圈四之一謂之象限百二十度為半周三之二即全圈三之一用法一有圓徑求若干度之弧以半徑當六十度取之假如有甲乙丙全圈有甲丙徑求五十度之弧即以甲丙徑半之于丁以甲丁半徑為本線六十度之底定尺而取五十度之底如甲乙直線以切圓分即得甲戊乙弧為五十度如所求用法二若以弧問徑則反之如先有弧分如甲戊乙為五十度而問全徑法從弧兩端聫之作直線如甲乙用為本線五十度之底定尺而取六十度之底為半徑甲丁倍之得全徑甲丙用法三直線三角形求量角度法以角為心任用規截角旁兩線作通弦如法得角度假如甲丙乙三角形不知角法任用甲丁度以甲為心作虛圈截甲丙線于丁截甲乙線于戊次作丁戊直線次即用甲丁原度以乙為心如法截甲乙于辛截丙乙于庚作辛庚直線末以甲丁為六十度之底定尺乃用丁戊為底進退求其等度之號得甲角之度用辛庚為底亦得乙角之度合兩角減半周得丙角度如甲角六十五乙角四十則丙角必七十五用法四平面等邉形求其徑假如有五等邉平面形欲求徑作圖即對角輳心直線法以設邉為分圓線七十二度之底而取其六十度之底為半徑以作平圓末以原設邊為度分其周為五平分即成五等面如所求他等邉形並同五等邉形有一邉如丙乙如法求得乙甲半徑以甲為心乙為界作平圓而以丙乙邉度分其圓得丁戊己等㸃作線聫之即成五等邉形而所作圓即外切之圓第七正弦線舊名節氣線以其造平儀時有分節氣之用也然正弦在三角法中為用甚多不止一事不如直言正弦以免掛漏正弦線不平分亦近樞心大而漸小與分圓同分法全尺為一百平分尺大可作一千于正弦表取數從樞心至各度分之每十度加號簡法第一平分線可當此線其線兩傍一書平分號一書正弦號又法分圓線可當此線以分圓線兩度當正弦一度紀其號假如分圓六十度齘即紀正弦三十但分圓之號直書則正弦橫書以别之解曰凡正弦皆倍度分圓之半故其比例等然則分圓之一度即正弦之半度而半度亦可取用為尤便也如圖甲乙為通弦甲丙乙丙皆正弦用法一有設弧求其正弦法以九十度當半徑假如有七十五度之弧求正弦即以本圈半徑為正弦線九十度之底定尺而取七十五之底為正弦如所求用法二有弧度之正弦數求徑數則以前條反用之假如有七十五度之正弦數即用為本線七十五度之底定尺而取其九十度之底得半徑數用法三句股形有角度有弦求句求股法以弦當半徑正弦當句與股假如句股形之弦二丈有對句之角三十度即取平分線之二十當弦數為正弦線九十度之底而取三十度之底得一十即其句一丈又於其角之餘弦即六十度正弦取底得一十七又三之二弱即其股為一丈七尺三寸二分若以句求弦則反之如句一丈其句與弦所作之角為六十度其餘角三十度即取一十數為三十度之底定尺而取九十度之底得二十命其弦二丈用法四三角形以邉求角假如三角形有乙甲邉甲丙邉及丙角度而求乙角法以乙甲邉數為丙角正弦之底定尺而以甲丙邉為底進退求其等度取正弦線上號為乙角度如所求用法五三角形以角求邉假如三角形有戊角度己角度及庚己邉而求庚戊邉法以庚己邉為戊角正弦之底定尺而取己角正弦之底得數即為庚戊邉如所求餘詳三角法舉要用法六作平儀求太陽二至日離赤道緯度如圖以十字分大圓直者為兩極橫者為赤道橫直交於圓心即地心也赤道即春秋分日行之道也地心至兩極半徑為正弦線九十度之底定尺取二十三度半之底于地心上下各作㸃于直線于此㸃作橫線與赤道平行為二至日道近北極者夏至近南極者冬至也又求作各節氣日道法先求黃道線法于夏至之一端作斜線過地心至冬至之又一端即成黃道日行其上一嵗一周天者也以黃道半徑為九十度之底定尺每十五度正弦取底移至黃道半徑上並從地心起度於地心上下各識之即各節氣日躔黃道上度也或三十度取底則所得皆中氣乃自黃道上各㸃作直線並與赤道平行即各節氣日行之道此與分至日道皆東升西沒一日一周者也其各線兩端抵大圓處即各節氣赤道緯度也春分以後在赤道北秋分以後在赤道南試法于二至日道兩端作橫線聫之如甲乙次以此橫線之半為度如丙乙過赤道處如丙為心作半圈于大圓之上如乙戊甲半圓亦如法作半圈于下兩半圈各勻分十二分作識若但求中氣可分六分上下相向作直線聫之即必與先所作日行道合為一線又以甲丙為正弦九十度之底定尺而于其各正弦取底亦即與原定日道緯度線合如丙辛三十度之正弦也與赤道旁第一緯線合丙丁六十度之正弦也與第二緯線合左右上下考之並同用法七定時刻仍用平儀法以平儀上赤道半徑為正弦線九十度之底定尺而於各時刻距卯酉之度取其正弦于赤道作識過兩極軸線處即卯正酉正也距此而上三十度午前為辰正午後為申正距此而下三十度子前為戌正子後為寅正距此而上六十度午前為巳正午後為未正距此而下六十度子前為亥正子後為丑正至圓周處上為午正下為子正即春秋分之時刻也欲作各時初正及刻凖此求之並以正弦為用每時分初正各加距十五度初正又各分四刻每刻加距三度又四分之三並取正弦如前法又以二至日道之半徑為正弦九十度之底定尺如法取各正弦作識即二至之時刻也末以分至線上時刻作弧線聫之即得各節氣之時刻凖此論之平儀作時刻亦用正弦比例規解以正弦名節氣線切線名時刻線區而别之非是第八切線舊名時刻線今按平儀時刻原用正弦惟以日景取髙度定時刻斯用切線耳又如渾蓋通憲等法亦皆切線其用甚多故不如直名切線切線不平分先小漸大至九十度竟平行無界故只用八十度或只作六十度亦可分法簡切線本表八十度之切線五六七即于尺上作五六七平分次簡各度數分之逢十加識用法一三角形求角假如乙甲丁三角形求乙角任截角旁線于丙得乙丙十寸自丙作垂線戊丙量得七寸次用十數為切線四十五度之底定尺而以戊丙七數為底進退求等度得三十五度為乙角用法二求太陽地平上髙度用直表法曰凡地平上直立之物皆可當表以表高數為切線四十五度之底定尺而取表影數為底進退求等度得日髙度之餘切線假如表髙一丈影長一丈五尺法以丈尺變為數用一十數當表髙為切線四十五度之底定尺次以一十五數當影長為底進退求等度得五十六度十九分為日髙之餘度以減九十度得日髙三十三度四十一分癸丙地平上日高度與壬辛等其餘度癸丁為日距天頂與戊辛等甲戊為表長其影戊已乃日距天頂之切線在日高癸丙為餘切線也用法三求太陽髙度用橫表植橫木于牆以候日影即得倒影為正切線之度假如橫表長一尺倒影在墻壁者長一尺五寸法用十數當橫表為四十五度之底定尺次以十五數當影長進退求等度得五十六度十九分即命為日高之度凡亭臺之內日影可到者量其簷際之深可當橫表卯寅牆子甲為橫表太陽光從丁過表端甲射丑成子丑倒影丁丙為日在地平上髙度與午子度等故以子丑倒影為日髙度之正切線也按直表之影低度則影長髙度則漸短日度益髙則影極短故以餘切線當直影前圖是也橫表之影低度則影短髙度則漸長日度益髙則影極長故以正切線當倒影後圖是也比例規解乃俱倒說今正之用法四求北極出地度分假如江寧府立夏後九日午正立表一丈測得影長為二尺四寸法以一百數當表髙為切線四十五度之底定尺而以二十四數為底進退求等數得一十三度半如法以減九十度得七十六度半為日出地平上髙度簡黃赤距度表是日太陽北緯一十九度以減日髙度得赤道髙五十七度半轉減九十度得北極髙三十二度半捷法以直表所得一十三度半加太陽北緯十九度即得三十二度半為北極髙度解曰直表所得太陽距天頂度也加北緯即赤道距天頂度亦即北極出地度又如順天府立春後四日如法用橫表三尺得倒影二尺一寸依切線法求得日髙三十五度簡表得本日太陽南緯一十五度以加日髙度得赤道髙五十度以減九十度得北極髙四十度第九割線舊名表心線今按割線非表心又割線之用甚多非只作日晷一事故直名割線為是割線不平分先小後大並與切線略同故亦只作八十度或只作六十度亦可分法用割線本表八十度之割線五七五平分之其初㸃與切線四十五度等次依表作度加識用法一三角形以割線求角假如有甲乙丙三角形求甲角法任于甲角旁之一邉截戊甲十寸作垂線如戊丁截又一邉于丁得丁甲十九寸次以十數為割線初㸃之底定尺而以十九數為底進退求等數得五十八度一十七分為甲角之度用法二作平面日晷兼用割切二線法曰先作子午直線卯酉橫線十字相交于甲以甲為正午時從甲左右儘橫線盡處為度于切線八十二度半為底定尺次于本線七度半取底向卯酉橫線上識之自甲㸃起為第一時如甲丙甲乙次每加七度半取底如前作識為各時分如七度半加之成十五度即第二時又遞加如二十二度半三十度三十七度半四十五度五十二度半六十度六十七度半七十五度至八八十二度半合線末元定之㸃若遞加三度四十五分而取底作識即每時四刻全矣按每七度半加㸃乃二刻也今每三度四十五分則一刻加㸃訂定法曰橫線上定時刻訖次取甲交㸃左右各十二刻之度即元定四十五度之切線亦即半徑全數為割線上北極髙度之底定尺而取割線初㸃之底為表長如壬庚次以表長當半徑為切線四十五之底定尺而檢北極髙度之正切取底自甲㸃向南截之如甲壬以壬為表位又于北極髙度之餘切線取底自表位壬向南截之如壬辛以辛為晷心末自晷心辛向橫線上原定時刻作斜直線引長之得時刻時刻在子午線西者乙為午初丁為巳正癸為巳初又加之即辰正又加之即辰初在子午線東者丙為未初戊為未正巳為申初又加之即申正又加之即酉初並遞加四刻謹按卯酉線即赤道線也二分之日日躔赤道日影終日行其上庚甲割線正對赤道正午時日影從庚射甲成庚甲影弦若已末午初則庚㸃之影不射甲而射乙而庚甲影弦如半徑乙甲如切線矣以庚甲為切線上半徑而遞取各七度半之切線以定左右各時刻之㸃並日影從庚所射也然此時庚甲之度無所取故即用赤道線四十五度之切線代之用切線實用庚甲也庚甲既為切線之半徑則必與四十五度之切線同長以四十五度當半徑而取切線以定時刻此天下所同也然赤道髙度隨各方北極之髙而變庚甲割線何以能常指赤道則必于表之長短及表位之逺近别之故以庚甲當北極髙度之割線而取其初㸃為表長初㸃者半徑也本宜以半徑求割線今先有割線故轉以割線求半徑也既以庚壬表長為半徑庚甲為割線則自有壬甲切線而表位亦定矣表位既定則庚甲影弦能指赤道矣何以言之表端壬庚甲角既為極髙度則庚角必赤道髙度而庚甲能指赤道也故北極度髙則庚角大甲角小而庚壬表短壬甲之距逺北極度低則赤道髙甲角大而庚壬表長壬甲之距近比例規解乃以表位定于甲㸃失其理矣遂復誤以割線為表長餘割線為晷心而强以割線名為表心線名實盡乖貽誤來學此皆習其業者原未深諳强為作解而即有毫釐千里之差立法者之精意亡矣故特為闡明之庚壬表上指天頂下指地心為半徑壬表位壬甲為正切線辛晷心辛壬為餘切線甲角即赤道髙度壬庚甲角即北極髙度與辛角等用法三先有表求作日晷借用前圖可解法先作子午直線任于線中定一㸃為表位如壬乃以表長數壬庚為切線四十五度之底定尺而取本方北極出地度之底得壬甲正切度于表位北作㸃如甲次於甲㸃作卯酉橫線與子午線十字相交即赤道線春秋分日影所到也又取極髙餘度之底得壬辛餘切線于表位南作㸃如辛即晷心也若自表端庚作直線至晷心辛即為兩極軸線辛指南極庚指北極也次以表長庚壬與壬甲正切相連作正方角則庚壬如句壬甲如股而取其弦線庚甲即極出地正割線也次以庚甲為切線四十五度之底定尺而各取七度半之底纍加之于甲㸃左右作識于卯酉橫線上末自晷心辛作線向所識㸃即得午前後時刻並如前法用法四有立面向正南作日晷並同平面法但以北極髙度之餘切線定表位以正切線定晷心則自晷心作線至表端能上指北極為兩極軸線又立晷書時刻並逆旋與平面反然以立晷正立于北與平晷相連成垂線則其時刻一一相符用法五用橫表作向東向西日晷假如立面向正東法于近南作直線上指天頂下指地心近上作橫線與地平相應兩線相交于甲以甲為心于兩線間作象限弧自下起數至本方北極出地度止自此向甲心作斜直線以分弧度此線即為赤道次以甲為表位用橫表乙甲之長取數為切線四十五度之底定尺遞取十五度切線從心向赤道線纍加之作識定時即春秋分日影所到也若分二刻則遞取七度半細分每刻則遞取三度四十五分次于甲心作橫斜線如丁戊為赤道之垂線其餘時刻㸃各作線與丁戊平行亦並與赤道十字相交次于元定尺上即以表長為四十五度所定取二十三度半之切線為度于甲左右截之為界如丁甲如戊甲即二至卯正時日影所到也二分日卯正則乙甲表正對日光無影分前後則有緯度而影亦漸生日日不同然不離丁戊線至二至而極冬至影在北如丁夏至影在南如戊以此為界向西酉正時亦然仍用元尺取每十五度之黃赤距緯切線作于丁戊線內從甲㸃左右作識得各節氣卯正日影或取三十度切線則所得每月中氣酉正亦然次以乙甲表長為割線初㸃之底定尺而取十五度之割線為二分日在辰初刻之影弦如乙辛即天元赤道上日離午線十五度其光過乙至辛所成也就以乙辛割線為切線四十五度之底而取二十三度半之底自辛㸃左右截橫線並如辛壬為冬夏至辰初刻日影所到之界辛壬在南為夏至其在北為冬至亦然又遞取每三十度之黃赤距緯切線從辛至壬作㸃為各中氣界此向南日影界乃赤道北半周節氣其辛㸃向北作界為南半周亦然自此而辰正而巳初而巳正以至午初並同乃于節氣界作線聫之即成正東日晷其面正西立晷作法並同但其時刻逆書自下而上最下為未初次未正次申初次申正次酉初而至酉正則橫表正對日光而無影矣此亦二分日酉正也其餘節氣亦有短影而不出本線與卯正同新增時刻線以切線分時刻本亦非誤但切線無半度取度難清今另作一線得數既易時刻尤真分法依尺長短作直線如後圖乙丙於線端作橫垂線如乙甲為乙丙垂線又作直線略短與設線平行交橫線如十字如甲巳線交橫線于甲以甲為心作象限弧六平分之為時限各一分內四平之為刻限次于甲心出直線過各時限至直線成六時過各刻限者成刻乃作識紀之並如後圖尺短移直線近甲心取之移進線並與原直線平行以遇第六時第二刻為度如已戊虛線遇丁戊線于戊即戊為第六時之二刻用法凡作日晷並以所設半徑置第三時為底定尺而取各時刻之底移于赤道線上午前午後並起午正左右為第一時依次加識即各得午正前後時刻並如前法第十五金線即輕重之學物有輕重以此權之獨言五金者以其有定質也五金之性情有與七政相類者因以為識金太陽水銀水星鉛土星銀太隂銅太白鐵火星錫木星分法用各分率及立方線比例率先取諸色金造成立方體其大小一般無二乃權其輕重以為比例黃金一水銀一又七十五分之三十八儀象志作九十五分之三十八鉛一又二十三分之一十五銀一又三十一分之二十六銅二又九分之一鐵二又八分之三錫二又三十七分之二十一比例規解原作三十七分之一則錫率反小于銅鐵而輕重之序乖今依儀象志金體最重故以為凖自尺心向外任定一度為金之根率自此依各率增之並以金度為立方線上十分之底定尺次依各率為底進退求等數取以為各色五金之根率自心向金率㸃外作識解曰此同重異積之率也于立方線上求得方根作識于尺則同重異根之率也金體重則其積最少謂立方體積各色之金謂銀鉛等體並輕于金故必體積多而後能與之同重然立積雖有多少非開方不得其根之大小故必于立方線求之也又解曰先以同大之立方權之得各率者同根異重之率也而即列之為同重異根之率何也蓋以根求重則金最重而他色輕以重求根則金最小而他色大其事相反然其比例則皆等假如金與銅之比例為一與二强若體同大則金倍重于銅矣若其重同者則銅之體必倍大于金其理一也又法用立方根比例率黃金一六六弱水銀一九一弱鉛二二銀二四銅二一三鐵二二二錫二二八用法一有某色金之立方體求作他色金之立方體與之同重或立圓及各種等面體並同假如有金球之徑又有其重今作銀球與之等重求徑若干法以金球徑數置本線太陽號為底定尺而取太隂號之底數作銀球之徑即其重與金球等用法二若同類之體其根同大求其重假如有金銀兩印章體俱正方而其大等既知銀重而求金重法以銀圖章之根數置太隂號為底定尺而取太陽號底數次于分體線上以銀章重數為兩弦太陽號底定尺而轉以太隂底數即銀章根數進退求等弦得數即金章之重輕重比例三線法附重學為西法一種其起重運重諸法以人巧補天工實宇宙有用之學五金輕重又重學中一種蓋他物難為定率可定者獨五金耳然比例規解雖載其術而數多抵牾未可全據愚參以靈臺儀象志其義始確因廣之為三線曰重比例曰重之容比例曰重之根比例既列之矩算復為之表若論以發其凡康熙壬戌長夏勿葊梅文鼎謹述重比例異色之物體積同輕重異解曰重比例者同積也積同而求其重則重者數多輕者數少若反其率則為容積比例矣用法假如有金一件不知重法以水盛器中令滿權其重乃入金其中則水溢溢定出金乃復權之則水之重必減于原數矣乃以所减之重變為線于比例尺置于水㸃為底乃于金㸃取大底即金重也又如有玉刻辟邪今欲作銅者與之同大問用銅幾何法如前以玉器入水取水減重之數置水㸃為底取銅㸃大底即得所求若作諸器用蠟為模亦同或以蠟輕難入水者竟以蠟重于蠟㸃為底而取銅㸃大底更妙也重之容比例輕重同則容積異亦謂異色之物解曰容比例者同重也同重而求其積則重者積數少輕者積數多反其率亦即為輕重之比例矣又解曰容積比例以立方求其根則為根比例矣故輕重當為三線也用法假如有水若干重盛器中滿十分有澒與水同重盛此器中問幾何滿法以水滿十分之數作水㸃之底而取澒㸃小底則知澒在器中得幾分用法二有同重之兩色物欲知其立方根法以容比例求其同重之積再于分體線求其根用法三有金或銅錫等不知重法如前入水求得水溢所減之重變為線乃以水重置金㸃為底若銅錫亦置銅錫㸃于水㸃取大底此借容比例求重故反用其率若用蠟模鑄銅器亦以蠟重置銅㸃為底而于蠟㸃取大底即得合用銅斤解曰有二法三法則只須容比例一線足矣蓋反用之可以求重既得容可以求根用三線者取其便用一線者取其簡可任意為之也又容比例附又客比例解曰容比例有三率也其實一率而已第一率以水為主取其便用也第二率以金為主取其便擕也第三率平列乃立方之積數也其作線於尺則皆一率而已矣此外仍有通分之法亦愚所演然其理皆具原表中故仍載表而附之故後輕重原表右表靈臺儀象志所引重學一則也其法同重者以直推見容積同積者以橫推見重重比例容比例皆在其中矣既得容可以求根則根之比例亦在其中矣比例規解五金線蓋原于此原書金與蠟之比例訛草一為廾九今改定通分法亦容比例之率分母澒九五鉛廾三乘得二一八五銀卅一又乘得六七七三五銅九又乘得六九六一五鐵八又乘得四八七六九二錫卅七又乘得一八四四六四為金率以澒分母九十五除金率得一八九九四三二以乘分子卅八得七二一七八四一六加金率得二五二六二四四五六為澒率以鉛母草三除金率得七八四五四八以乘子十五得一一七六八二二加金率得二九八一二八二四為鉛率以銀母卅一除金率得五八二八四以乘子廾六得一五一三四一八四加金率得三三一七八七八八為銀率以銅母九除金率得二四九五六以乘子一得如原數加金率二得三八九四一六四為銅率以鐵母八除金率得二二五五五七五五以乘子三得六七六六七二六五加金率二得四二八五五九三四五為鐵率以錫母卅七除金率得四八七六九二以乘子廾一得一二四一五三二加金率二得四六三三七四為錫率按自古厯算諸家于尾數不能盡者多不入算故曰半已上收為秒巳下棄之其有不欲棄者則以大半少强弱收之假如一百分則成一整數九十為一弱一十為一强百二十五為少即四分之一也若二十為少弱三十為少强五十為半四十為半弱六十為半强七十五為太即四分之三也七十為太弱八十為太强重之根比例異色同重之立方附求重心法乙甲癸子形求重心先作乙甲線分為乙子甲乙癸甲兩三角形次用三角形求心術求乙子甲乙癸甲之形心在丙丁作丙丁線聫之又作子癸線分為癸乙子癸甲子兩三角形求癸乙子癸甲子形之心在庚辛作庚辛線聫之此二線相交於壬則壬為本形心即重心也試作乙巳正角線至子癸線上又作甲戊線至子癸線上此兩線之比例即兩形大小之比例也法為癸乙子形與癸甲子形之比例若乙巳與甲戊也以此比例於庚辛兩心距線上求得壬㸃為全形之重心法為乙巳線與甲戊若辛壬與庚壬如圖子巳與癸戊之比例若丁壬與丙壬也餘並同前圖一率子巳與癸戊二線并二率子巳三率丁丙四率丁壬歷算全書卷三十九
