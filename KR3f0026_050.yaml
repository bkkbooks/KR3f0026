body:
  text: 餘論數學有九要之則二支一者算術一者量法量法者長短逺近以求其距西法謂之測線方圓弧矢冪積周徑以相求西法謂之測面立方渾圓堆垜之形以求容積西法之測體在古九章則為方田為少廣為商功為句股算術者消息盈虛乘除進退以差多寡驗往以測來西法謂之比例通分子母整齊畫一不盡者以法命之西法謂之畸零若夫隱雜重復參錯難稽即顯驗幽探賾窮深無例可比故西法别立借衰互徴以為用亦比例也在古九章則為粟布為衰分為均輸為盈朒為方程此二者相需不可偏廢雖然算術可以濟量法之窮而量法不可以盡算術之變何也可量者其可見也天下之不可見者多矣非算術何以御之故量法有窮而算術不窮也夫既量之而得其率矣所量者一欲知者百西法之用比例亦以算術佐量法也然以例相比非量法而有量法之理吾友桐城方位伯謂九章出于句股蓋以此也然吾觀方程正負同異減併之用非句股所能御而能生比例愚故以算術必不可廢也言數學者亦有二家一古法一泰西泰西之説詳明曉暢古人之法徑捷簡易可互明也然古書僅存算術而略于測量泰西詳于測量而或遺在算術吾觀泰西家言矩度三角八線割圓幾何原本備矣謂其善用句股能有新意出于古率之外未為過也若所譯同文算指者大約用三率以變古法至于盈朒方程則其術不復可行于是取古人之法以傳之非利氏之所傳也算術之妙莫盈朒方程若而泰西皆無之是九章闕其二也尚謂之賢于古法乎且泰西家欲以其説易天下故必宛轉箋疏以達其意以取信于學者若盈朒方程立法之意殊不能言也不能言盈朒故别立借衰之法以代之自謂超妙可廢古法矣而終不能廢盈朒若方程一章不但不能言之亦不能用之不過取古人之僅存者具數而已不能别立術以代之也諸書之謬誤皆沿之而不能察其必非知之而不用能言之而不悉亦可見矣夫古人之略于量法者非不能言也言之略耳言之詳者别有専書而人不能習不傳于世耳學士大夫既苦其難竟又無與進取弋獲之利遂一切棄置不道淺獵焉者率得少以自多無所發明遂使古人之精意若存若亡不復可見今諸書所載方程法殘缺錯亂視盈朒尤甚其所僅存又多為後之不得其説者參以臆解而其旨益晦非古人舊也使古之方程僅僅如此何必别立一章列于盈朒之後乎然以好變古率如泰西而不能變方程勤于言算如泰西而不能言方程不能盡其用不能正其沿誤可見古人立法之深逺而決不可易向使習古法者盡見古人之書又能如泰西家羣萃州處窮年纍月研精覃思以為之引伸而推廣又豈止如斯而已乎言之三歎
