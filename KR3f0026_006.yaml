body:
  text: 厯算全書卷六宣城梅文鼎撰厯學答問答祠部李古愚先生厯算之學散見經史固儒者所當知然其事既不易明而又不切於日用故學者置焉博覽之士稍涉大端自謂已足欲如絳縣老人能自言其生之四百四十四甲子者固已鮮矣况能探討其義類乎明公夙夜在公日懋勤於職業而心閒若水孜孜好學用其心於人所不用之處真不易得鼎雖疏淺無似敢不勉竭鄙思以仰答下問之勤乎謹條於左問授時大統二厯厯元並嵗實積日日法諸數按厯元云者厯家起算之端也然授時厯元之法與古不同請先言古法古人治厯必先立元元正然後定日法法立然後度周天其法皆據當時實測以驗諸前史所傳又推而上之至於初古之時取其嵗月日時皆㑹甲子又在朔旦而日月五星皆同一度以此為起算之端是謂厯元自厯元順數至今造厯之時凡厯幾何嵗月是為積年既有積年即有積日而此積日若用整數則遇﨑零難以入算而不能使厯元無餘分故必析此一日為若干分使七曜可以通行而上可以合厯元下不違於實測是為日法即一日之細分也用此細分自一日積之至於二百六十五日又四分日之一弱使一嵗之日盡化為分是為嵗實古厯太陽每日行一度則日法即度法於是仍用此細分自一度積之至於三百六十五度又四分度之一弱使其度亦盡化為分是為周天數者相因乃作厯之根本自漢太初厯以後厯晉唐五代宋遼金諸家厯法代有改憲然其規模次第皆大同而小異耳右古法厯元等項惟元授時厯不然其說以為作厯當憑實測而必逆推上古虛立積年必將遷就其畸零之數以求密合既有遷就久則易差故不用積年之法而斷自至元十七年辛巳嵗前天正冬至為元上考往古下驗將來皆自此起算棄虛立之元用實測之度順天求合一無遷就可謂開拓萬古之心胸者矣至於大統則以洪武十七年甲子為元然特易其名而已一切步算皆本授時名雖洪武甲子實用至元辛巳也右授時大統厯元惟授時不用積年故日法亦可不立而徑以萬分為日萬分者日有百刻刻有百分故一萬也古諸家厯法雖皆百刻而刻非百分其日法皆有畸零授時以萬分為日竟是整數故曰不用日法然即此是其日法矣右授時日法大統同授時既以萬分為日故其嵗實三百六十五萬二千四百二十五分其數自辛巳嵗前天正冬至即庚辰年十一月中氣積至次年壬午嵗前天正冬至即辛巳本年十一月中氣共得三百六十五日二十四刻二十五分也若逆推前一年亦是如此如是庚辰年十一月冬至逆推至巳卯年十一月冬至亦是三百六十五日二十四刻二十五分此嵗實之數大統與授時並同然授時原有消長之法是其新意其法自辛巳元順推至一百年則嵗實當消一分依法推至洪武十四年辛酉滿一百年其嵗實消一分為三百六十五日二十四刻二十四分若自辛巳元逆推至一百年則嵗實當長一分依法推至宋孝宗淳熙八年辛丑滿一百年嵗實長一分為三百六十五日二十四刻二十六分每相距增一百年則嵗實消長各增一分以是為上考下求之準大統諸法悉遵授時獨不用消長之法上考下求總定為三百六十五日二十四刻二十五分此其異也右授時大統嵗實嵗實即一年之日數也自一年以至十年百年共積若干是為積日亦謂之中積分上考下求皆距至元辛巳立算假如今康熙庚午嵗相距四百零九算自辛巳元順推至今康熙庚午四百一十年法以積年減一得實距四百零九年依授時法推得積日一十四萬九千三百八十四日零一刻八十九分因距算四百以上嵗實當消四分為三百六十五日二十四刻二十一分以乘距算四百零九得如上數是為庚午嵗前天正冬至上距辛巳嵗前天正冬至之積日若以日為萬分則所得化為一十四億九千三百八十四萬零一百八十九分謂之中積分大統法不用消長則積日為一十四萬九千三百八十四日一十八刻二十五分中積分一十四億九千三百八十四萬一千八百二十五分兩法相差一十六刻三十六分以命冬至日辰授時得癸卯日丑初三刻大統得癸卯日卯初三刻兩法皆加氣應右授時大統積日以上數端並在步氣朔章是太陽項下事也其厯元七曜同用乃根數所立之處也問授時大統二厯月法轉周交周諸數按月法者即朔䇿也亦曰朔實其法自太陽太隂同度之刻算至第二次同度為兩朔相距之中積分平分之則為望䇿四分之則為弦䇿望者日月相望距半周天弦者近一逺三上弦月在日東下弦月在日西皆相距天周四之一授時朔䇿二十九萬五千三百零五分九十三秒即二十九日五十三刻零六分弱也大統同右月法月平行每日十三度有竒然有時而疾則每日十四度竒有時而遲則每日只十二度竒是為月轉初入轉則極疾疾極而平平而遲遲極又平平而又疾以此遂有疾初疾末遲初遲未四限滿此一周謂之轉終授時轉終二十七日五十五刻四十六分大統同右轉法月不正行黃道而出入其內外故謂之交交者言其道交於黃道也月行天一周其交於黃道只有二處其始從黃道內而出於其外此時月道自北而南在黃道上斜穿而過謂之正交自正交行九十一度就整數離黃道南六度自此再行九十一度又自黃道外而入於其內此時月道自南而北亦斜穿黃道而過謂之中交中交行至九十一度時離黃道北亦六度自此再九十一度又自黃道內而出於其外復為正交矣其法以正交後半周為陽厯中交後半周為隂厯滿此一周謂之交終授時交終二十七日二十一刻二十二分二十四秒大統同右交道以上三端朔䇿在步氣朔章轉終在步月離章交終在步交㑹章並太隂項下事也問授時厯有氣應何義按氣應為授時四應數之一其法創立古厯所無也古厯立元皆起初古故但有積年而無根數即應數授時既不立積年而用截算不得不有四應數以紀當時實測之數為上考下求之根而氣應居一焉氣即中氣節氣二十四中節皆始冬至故氣應者即冬至相應之真時刻也當時實測辛巳嵗前天正冬至是己未日丑初一刻故曰氣應五十五萬零六百分即五十五日零六刻也其法自甲子日為一數起挨算至戊午日得滿五十五日又加子正後六刻則為己未日丑初一刻矣氣應之外又有閏應以紀經朔轉應以紀月之遲疾厯交應以紀月之隂陽厯亦是截算皆實測辛巳年天正冬至氣應己未日丑初一刻所得上距經朔及距入轉距正交各相應之數也依法推到辛巳年天正經朔三十四日八十五刻半為戊戌日戍正二刻在氣應冬至前二十日二十刻五十分及己未冬至氣應則為經朔之二十一日凡此皆厯經所未明言兹特著之問推步交食之法按厯家之法莫難於交食其理甚精其法甚備故另為一章若知交食則諸法盡知矣然必能推步而加以講究然後能由其當然以知其所以然是謂真知茍未能然則所知或未全耳請言其槩蓋厯法代更由疏漸密其驗在於交食約略言之有宜知者二端其一古者只用平朔平朔者一大一小相間故漢晉史志往往有日食不在朔而在朔之二日或晦日者自唐李淳風麟德厯始用定朔至一行大衍厯又發明之始有四大三小之月而蝕必在朔此是一層道理其一自北齊張子信積候合蝕加時立入氣加減唐宣明厯本之立氣刻時三差至今遵用即授時厯之時差及東西南北差也此又是一層道理前一說由平朔改為定朔其根在天蓋以日躔有盈縮月離有遲疾天上行度應有之差天下所同也後一說於定朔之外又立三差其根在地蓋以日髙月卑正相掩時中間尚有空隙人所居地靣不同而所見虧復之時刻與食分之淺深隨處各異謂之視差非天上行度有殊而生於人目一方所獨也知此兩端而交食之理思已過半即厯法古疏今密之故亦大槩可見矣至於入算須看假如諸書中具有成式然但能依法推步者亦未必盡知其理故謹以拙見略疏大意不知於來諭所謂已明其理者同異何如統容晤悉問發斂加時之法發斂加時之法按此即九章中通分法也授時厯以一日為一萬分整數今欲均分為十二時每時各得八百三十三分三三不盡故依古法以十二通之每一分通為十二小分則日周一萬通為一十二萬而每時各得一萬故每遇一萬為一時也然滿五千亦進一時者時分初正各四刻竒厯家以子正四刻為今日子初四刻為昨日今滿五千即是半時以當子正之四刻輳完昨夜子初之四刻而成一時故命起子初算外即丑初乃借算也遇有五千進一時者一時算外是丑初二時算外是寅初餘倣此若以一萬為一時者命起子正算外即丑正乃本算也無五千進一時者一時算外是丑正二時算外是寅正餘倣此其取刻數又仍以十二除之何也曰此通分還原也時下零分是以十二乘過之小分今仍以十二除之十二小分收為一大分復還原數則所存者即日周一萬之分而每百分命為一刻矣一法加二為時減二為刻即是前法但以加減代乘除非有二也何以言之乘法是兩位俱動而數升者位反降加法則本位不動而但加二數於下位也減二亦然凡珠算十二除當一歸二除今用減二則本位不動但於下位減二即定身除也臺官不明算理往往於此處有誤但知以加減代乘除則了然矣是故算數者治厯之本也又按發斂二字乃日道發南斂北之謂蓋主乎北極為言則夏至近極為斂冬至逺極為發而自冬至以至夏至則由逺而近自夏至以至冬至則由近而逺總謂之發斂古諸家厯法皆以發斂另為一章其中所列為二十四氣七十二候之類而加時之法附焉故曰發斂加時言發斂章各節候加時法也元統作通軌誤以十二通分為發十二除收刻為斂則以發斂為算法之名失其㫖矣而律厯考因之以訛不可不知也問以授時法上推春秋魯隱公三年辛酉嵗距至元辛巳二千年中積七十三萬零四百八十九日天正冬至六百零六刻閏餘二十九日四十八刻經朔三十六日五十七刻今依法以滿甲子除中積而求冬至則合以月䇿除中積而求經朔則不合有一日三刻之差其經朔應在冬至前耶抑冬至在經朔前耶按此以百年長一之法上推往古中積諸數原自不錯惟求經朔閏餘則誤加為減故有一日三刻之差而所以差者由於未深明經朔閏餘立法之源也今具論之經朔者日月合朔之常日也冬至者日軌南至而影長之日也日南至而影長是日與天㑹也日月合朔是月與日㑹也月㑹日謂之一月日㑹天謂之一年二者常不齊此厯法所由起也古厯十九年七閏謂之一章章首之年至朔同日其餘則皆不同日矣故天正經朔常在冬至前冬至常在經朔後自經朔至冬至其間所歷日時謂之閏餘以閏餘減冬至得經朔以閏餘加經朔得冬至理數之自然也今自至元辛巳逆推隱公辛酉法當以所得中積七十三萬零四百八十九日在位用至元閏應二十日二十刻半減之餘七十三萬零四百六十八日七十九刻半為閏積以朔䇿二十九日五十三刻五分九十三秒為法除之得二萬四千七百三十六個月仍有不滿之數四刻六十五分五十二秒用以轉減朔策餘二十九日四十八刻四十分四十一秒為其年之閏餘分即是其年冬至在經朔後之日數也凡求經朔之法當於冬至內減閏餘今推得其年冬至是六日零六刻不及減閏餘故以紀法六十日加冬至而減之得三十六日五十七刻五十九分五十九秒為其年天正經朔是庚子日子正後五十七刻半强也復置經朔三十六日五十七刻五九五九以閏餘二十九日四十八刻四零四一加之得六十六日零六刻除滿紀法去之仍得六日零六刻即是其年冬至為庚午日子正後六刻也庚午距庚子整三十日即知其年冬至在次月朔為至朔同日之年而年前閏十二月矣今誤以閏餘去減經朔為冬至所以差一日三刻也經朔二十六日五十七刻內減去閏餘二十九日四十八刻餘七日零九刻以校先得冬至六日零六刻實多一日三刻問閏月宜閏嵗前十二月乎或閏正月乎先儒辨之今不得其解按閏月之議紛紛聚訟大㫖不出兩端其一謂無中氣為閏月此據左氏舉正於中為說乃厯家之法也其一謂古閏月俱在嵗終此據左氏歸餘於終為論乃經學家之詁也若如前推隱公辛酉冬至在經朔後三十日宜閏嵗前十二月即兩說齊同可無疑議然有不同者何以斷之曰古今厯法原自不同推步之理踵事加密故自今日言厯則以無中氣置閏為安而論春秋閏月則以歸餘之說為長何則治春秋者當主經文今考本經書閏月俱在年終此其據矣問至元辛巳至隱公辛酉二千年中閏月幾何按此易知也前以朔䇿除閏積得二萬四千七百三十六月內除二萬四千月為二千年應有之數其七百三十六即閏月也此與古法十九年七閏之法亦所差不多問二千年中交泛若干次入食限若干次及交泛字義何解經朔合朔何所分别按月與日㑹謂之合朔然有平朔有定朔三代以上書籍散軼不可深考所可知者自漢以來祗用平朔唐以後乃用定朔定朔與平朔有差至一日之時然必先求平朔然後可求定朔今曰經朔即平朔也以其為合朔之常數故謂之經得此常數再以盈縮遲疾加減之即定朔矣是故合朔者總名也因有定朔故别之為經朔耳交者月道出入於黃道也授時之法二十七日二十一刻二十二分二十四秒而月道之出入於黃道一周謂之交終以此為法而除中積則得其入交次數矣今依本法求到魯隱公辛酉正月經朔入交十七日三十八刻九六七自此下距至元辛巳凡滿交終二萬六千八百四十三其出入於黃道也各二萬六千八百四十四至於食限則不可以預定何也入交雖有常數而其食與否又當以加減差及氣刻時三差諸法定之又按入交亦有平日有定日此云泛者亦平義也因先求平日次求定日故命之曰泛泛者以别於定也然厯經本文謂之入交泛日或省文曰入交或曰泛交未有稱交泛者其稱交泛則臺官之語以四字節去首尾而中撮兩字為言文理不安所當改正者也問周髀算經牽牛去極樞共積九百九十二億七千四百九十五萬分以一度積八億五千六百八十萬為法除之復原度一百一十五度一千六百九十五里二十一步又一千四百六十一分步之八百一十九用何算法還原按此乃通分法也凡算家通分之法所以齊不齊之分便乘除也若如郭太史以一萬分為度則分有百秒秒有百微皆以十百為等自然齊同通分之法可以不用而古厯不然各有所立之法其法又不同母此通分之法所由立也即如周髀所立度法是一千九百五十四里二百四十七步又一千四百六十一分步之九百三十三度下有里里下有步步下有分其法不同故必以里通為步乃以零步納入步又通為分乃又以零分納入此所謂通分納子也然後總計其分以為度法即度積法曰置一千九百五十四里在位以每里三百步為法乘之得五十八萬六千二百步如是則里通為步可以納子矣於是以零步二百四十七加入共得五十八萬六千四百四十七步復置在位以步之分法一千四百六十一為法乘之得八億五千六百七十九萬九千零六十七分則步又通為分可以納子於是再以零分九百三十三加入共得八億五千六百八十萬分是為度法言滿此分為一度也其外衡去璿璣即牽牛去極數二十二萬六千五百里亦以每里三百步乘之得六千七百九十五萬步是里通為步也又置為實以每步一千四百六十一分乘之得九百九十二億七千四百九十五萬分是步又通為分也以為實於是以法除實得滿法之數一百一十五命之為度其不滿法之數仍餘七億四千二百九十五萬分不能成一度當以里法收之為里法曰置每里三百步以每步一千四百六十一分乘之得四十三萬八千三百分是為里法以里法為法餘分七億四千二百九十五萬分為實實如法而一得一千六百九十五命為里仍有餘分三萬一千五百不能成一里當以步法收之為步法曰置餘分三萬一千五百為實以每步一千四百六十一分為法除之得二十一步仍有餘分八百一十九不能成一步即命為分用上法求得一百一十五度一千六百九十五里二十一步又一千四百六十一分步之八百一十九適合原數緣實數是里數牽牛去極二十二萬六千五百里是里數也法數有里有步有分不便乘除故必以里通為步步又通為分乃可乘除故曰齊同法實乘以散之也其不滿法者以里法收之為里又不滿里法者以步法收之為步再不滿步法命為零分故曰不滿法者以法命之又曰位盡於一步故以其法命餘為殘分也通分之法不過如此乃正法也今周髀所載之法其初通法實並為分末以法命殘分並同惟中間收餘分微異則古人截算之法也具如後凡算有除兩次者則以兩次除之之法相乘為法以除之謂之異除同除如以三除又以四除則以三乘四得十二為法除之變兩次除為一次除也若算有法數太多者則變為簡法兩次除之謂之截法如以七十二除之者則以八除之又以九除之即與七十二除同此兩者正相對而其理相通也如餘分七億四千二百九十五萬不滿一度宜收為里法當以每里三百步乘每步一千四百六十一共化為四十三萬八千三百分此即異除同除之法也周髀經則先以每里三百步除之得二百四十七萬六千五百為里實再以周天分即步法為法除之得一千六百九十五里不盡一百五此即截法變一次除為兩次除也古所得里數與前法不異所異者前法餘分三萬一千五百而今用截法只一百五此何以故因前法所餘是實分今用截法則餘分是用每里三百步除過者則此餘分一數內各藏有三百之數也是以三百分為一分餘分內既各𢃄有三百之數則當以三百乘之復還原分之數然後可以收為步此亦正法也何以言之蓋餘分有二頭一次是不滿一度之分則當收為里此餘分又是不滿一里之餘分故當收為步然而步之法是周天一千四百六十一分乃實數也此所餘一百五是三百分為一分非實數也若仍以三百乘之則亦為實數而可以乘除矣故曰正法也周髀之法則又不然雖亦以三乘之而不言百以三百乘一百零五該三萬一千五百今以單三數乘之只三百一十五則每餘分內仍𢃄有一百之數餘分為實者既以百分為一分則其滿法而成一步者即是百步既是以百分為一分則其滿一千四百六十一之法而成一步者即是滿了一百箇一千四百六十一而成百步也故曰不滿法者三之言以單三數乘不滿法之餘分也又曰如法得百步言此餘分既以三乘則其滿法者為百步也又自疏其義曰上以三百約之為里之實此當以三百乘之為步之實而言三之者不欲轉法更以一位為一百之實故從一位命為百也此蓋自明其不以三百乘而以三乘之故是欲以得數為百步也得數為百步則其實亦百步之實也故曰省算也刻本三百乘之句遺百字而言三之句遺三字既言如法得百步而今之餘實只三百一十五在一千四百六十一之下是不能滿法也不能滿法者即不能成百步也於是以餘分進位三百一十五變為三千一百五十為實而以滿法為十步何也原一分內有百分今雖進位以一分為十分然仍未復原數仍是十分為一分故得數即為十步也法曰置三百一十五進位為實變三千一百五十以法一千四百六十一除得二數命為二十步不盡二百二十八經曰不滿法者又上十之如法得十步亦省算也上之即進位也此餘分既各𢃄有十分故復以十乘之即得本數法曰置二百二十八又進位為實變為二千二百八十以法一千四百六十一除得一數命為一步不盡八百一十九經曰不滿法者又上十之得數為一步又自疏之曰又復上之者便以一位為一實故從一實為一言末次進位則適得本數為實而得數亦為本數也凡看厯書與别項文字不同須胸中想一渾圓天體併七政旋行之道了了在吾目前則左右逢源有條不紊故圖與器皆足為看書之助右所疏數條言雖淺近然由淺入深庶幾有序天下最深微之理亦即在最粗淺中舍粗淺無深微矣謹復答嘉興髙念祖先生律厯天官具載二十一史南北國學並有雕版國家試士發䇿多有及此者本學者所當知也然或者以其不切於辭章之用又其義難驟知讀史者至此則置而不觀先生獨能縷舉其異同分合之端以為問可見其留心之有素不愧家學之淵源請陳其管蠡之愚以求正定問史記八書三曰律四曰厯分律與厯言之也前漢書合稱律厯改書為志而後漢書晉書北魏書隋書宋史並因之宋書新唐書遼金元三史則皆有厯志而不及律何歟按律厯本為二事其理相通而其用各别觀於唐虞命官羲和治厯䕫典樂各有専司太史公本重黎之後深知其理故分為二書班書合之非也獨是厯書所載非當時所用之法乃殷厯也非漢厯也其四年而增一日即四分厯之所祖又謬以太初元年丁丑為甲寅干支相差二十三年蓋禇先生輩所續余於厯法通考中已詳辨之兹不具悉而漢太初厯八十一分日法反載於班志意者孟堅以其起數鍾律遂從而合之歟後世言厯者率祖班志故史亦因之厥後漸覺其非而不能改直至元許衡郭守敬乃始斷然以測驗為慿不復以鍾律卦氣言厯一洗諸家之傅㑹故其法特精此律厯分合之由也人有恆言漢厯莫善於太初唐厯莫善於大衍殊不知漢厯至劉洪乾象厯始精若太初則最踈獨其創始之功不可沒耳若大衍本為名厯測算諸法至此大備後世不能出其範圍特以易數言厯反多牽附其失與太初之起數鍾律同也明水公云以律配厯可也而以生厯則不可又云僧一行頗稱知厯而竄入於易以眩衆此誠千古定論而經生家所不能知也至於稱書稱志之不同蓋太史公合記古事故名史記班孟堅専述本朝故踵虞書夏書之日而稱漢書全部既稱書不得不别其類為志無深意也問厯書之次曰天官書前漢書改為天文志後漢書晉書宋書南齊書隋書唐書宋金元史並仍之而晉書宋史天文在律厯之前金元二史亦在厯前北魏則改為天象遼史則合厯與天象稱厯象有以異乎按言天道者原有二家其一為厯家主於測算推步日月五星之行度以授民事而成嵗功即周禮之馮相氏也其一為天文家主於占驗吉凶福禍觀察祲祥災異以知趨避而修救備即周禮之保章氏也班史析之甚明故雖合律厯為一志而别出天文也易天官為天文者星象在野象物在朝象官故星在赤道以內近紫微垣者古謂之中官在赤道外者古謂之外官天官之說蓋取諸此也易曰觀乎天文以察時變其改稱天文本諸易也易又曰天垂象見吉凶北魏改名天象亦本易也占與測雖分科亦互相為用故遼史合之也至于晉天文志在律厯之前以日月交食五星凌犯皆厯家所據以為推測之用故先之又晉志出李淳風之手其星名占法視古加詳而亦有同異爾後言占者悉本淳風故其次序亦因之也問史書中有一代總無律厯天文志者果盡出於史闕文之意乎按史之有志具一代之典章事事徴實不可一字鑿空而談較之紀傳頗難故三國無志誠為闕事而范氏後漢書本亦無志今志乃劉昭續補也至於天文厯法尤非専家不能故晉隋兩志並出淳風新唐書厯志五代史司天考並出劉羲叟其餘則既無其人又無其書雖欲不闕而不可得此亦史臣之不得已也五代則五十餘年而六易姓紀載無徴故僅有司天職方二考他皆闕如而司天又止有王朴欽天厯法其交蝕凌犯並無可稽故不復稱志而名之曰考也問五行志創始班書乃史記所未有而後漢晉宋南齊隋唐宋金元九史並仍之其義何居按虞書惟言六府洪範始言五行其以五事配五行又以雜占祥異皆件係之而以時事言其應其說蓋濫觴于夏侯氏之治尚書而詳於劉向父子太史公時其說未著故始見班書而諸史因之要其說亦有應不應當其應也固足以為警戒及其不應反足以啓人不信之心唐書以後但紀災祥不言事應有合於春秋之義此可以為法者也答滄州劉介錫茂才問左右轄距軫宜平今左近右逺又狼星之邉有弧矢錯亂不齊不其經星亦常移位耶按自古以列宿為不動故曰經星又謂之恆星乃占書中往往有動移之說愚竊疑其未然蓋既曰動移則必先知其不移之位然後可以斷其實移而古本圖象大約傳久失真人所目擊不過數十年之內何以知今日之星座必與古異而謂之動移哉又必暫見其移未幾即復本位始謂之變若數十年中所見盡同則常也而非變也查崇禎厯書右轄距軫南右星凡二度竒左轄距軫北左星只半度竒一逺一近誠如尊諭又弧矢天狼不甚整齊皆如所測夫厯書成於前戊辰距今六十四年而星座之經緯如故亦足以徴其非動矣至於厯法中亦自有經星東行之法其理與嵗差相應非如占書之言動移也弧破矢折之論似宜更詳問本年閏七月初八夜太隂食心前星不知何應第三日初十夜大風雨雷電是有解散否查閏七月太隂犯心前星當是初七日戍亥二時月加丁未坤之地非初八也此時月正上弦行至心宿三四度間值月半交在黃道南五度竒與心宿東星逼近理得相為掩犯然皆月道當行之道非失行也又按古人云三日內得雨則解此蓋為暈珥虹霓之屬多為風雨之氣所結故應在本方若七政之凌犯多方共覩殆難一例問十數年前親見太白過午者纍日是經天耶晝見耶主何休祥按太白星繞日為輪離太陽前後不得過五十度故夕見西方仍沒於西晨出東方仍沒於東非不過午也其過午必與日偕為日光所掩故也若日光微而星光盛在晝漏明是為晝見晝見不必盡在午地也若在午地則為經天矣然亦有非晝見而能經天者此又别自有說不知所見過午者是晝乎是晨夕乎嘗考前史所載經天之事不一而足占書之說未免過于張皇非其質也愚不敢輒信占書亦正謂此等處耳問來年元旦日食五分十七秒一曰五榖貴一曰主大水孰為實應抑别有徴也又十數年前長星見久應在何時按日食元旦古亦多有然其數可以預推與凌犯同理若長星之見自是災變然聖人遇災而懼實有修省轉移之道故古人言占必兼人事若執定占書一兩言以斷其休咎將修德彌災語為虛設而天亦可量矣是固不敢妄談問厯法最難解者未宫鬼金羊為主今未宫全係井度而鬼反在午室火猪只十度在亥而餘皆入戍不知天運何年西下諸宿移而天盤動按列宿移而天盤動即嵗差之法也周天列宿分十二宫古今厯法各各迥異要其大端之改易有三自隋以前未用嵗差故天之十二宫皆隨節氣而定如冬至日躔度即為丑初之類一也唐一行始定用嵗差分天自為天嵗自為嵗故冬至漸移而宫度不變以後厯家遵用之所以明季言太陽過宫以雨水三朝過亥二也若今西厯則未嘗不用嵗差而十二宫又復隨節氣而移三也三者之法未敢斷其孰優然以平心論之則一行似勝何以言之蓋既用嵗差則節氣之躔度年年不同故帝堯冬至日在虛而今在箕已差五十餘度若再積其差冬至必且在尾在心在氐房在角亢顧猶以冬至之故而名之曰丑宫則東方七宿不得為蒼龍而皆變𤣥武北方宿反為白虎西方宿反為朱鳥而南方朱鳥為蒼龍名實盡乖即西法之金牛白羊諸宫皆將易位非命名取象之初㫖即不如天自為天嵗自為嵗之為無弊矣故新厯之推步實精而此等尚在可酌不無俟於後來之論定耳先生於此深疑實與鄙意相同至若十二生肖及演禽之法别有本末與厯家無涉亦無與於星占可無深論以星推命不知始於何時然吕才之闢祿命只及干支至韓潮州始有我生之時月宿南斗之說由是徴之亦在九執以後耳每見推五星者率用溪口厯則於七政躔度疏逺若依新法則宫度之遷改不常二者已如枘鑿之不相入又安望其術之能驗乎夫欲求至當則宜有變通然其故多端實難輕議或姑以古法分宫而取今算之七政布之則既不違其本術亦不謬乎懸象雖未知驗否何如而於理庶幾可通矣請以質之髙明問冬夏致日以土圭求日至之景是也而春秋又以致月其說何如按日行黃道有南至北至月亦有之月之北至則隂厯是也月之南至則陽厯是也夫月之隂陽厯隨時變遷而必於春秋測之何耶凡言至者皆要其數之所極則必有中數以為之衷如日道有南至有北至相差四十七度竒而其中數則赤道也月有隂厯有陽厯出入於黃道各六度弱而其中數則黃道也夫黃道之在冬夏既自相差四十七度竒則已無定度又何以為月道之中數乎惟春秋二分之黃道與赤道同度則其東出西沒及過午之度並與赤道無殊於此測月可得隂陽厯出入黃道之真度矣假如二分之望月在其衝春分之望月必在秋分之宿度秋分之望月必在春分之宿度則日沒於酉正而月出於卯正日出於卯正而月沒於酉正其出沒方位必居卯酉正中與日相等然而或等焉或不等焉或有時而出沒於酉正卯正之南則知其在陽厯也有時而在卯正酉正之北則知其在隂厯也又此時日之過午也必與本處之赤道同髙即冬夏二至日軌髙度折中之處則月亦宜然然而月之過午或有時而髙於日度則知其在隂厯也有時而卑於日度則知其在陽厯也若月之出沒在卯酉之正而不偏南北月之過午一如日軌之度而略無髙卑則為正當交道而有虧食故曰惟春秋可以測月也康成注曰冬至日在牽牛景丈三尺夏至日在東井景尺五寸此長短之極此言冬夏致日也又曰春分日在婁秋分日在角而月弦於牽牛東井亦以其景知氣至此言春秋致月也賈疏云春分日在婁其月上弦在東井圓於角下弦於牽牛秋分日在角上弦於牽牛圓於婁下弦於東井鄭并言月弦於牽牛東井不言圓望義可知也按此賈疏增成鄭義足與愚說相為發明蓋但以日軌為主則春秋致月亦致日之餘事即於兩弦立說亦足以明若正言致月之理則必將詳考其交道出入之端與夫隂陽厯逺近之距則兼望言之其理益著也問隂陽厯之法於兩弦亦可用乎曰可凡冬夏至表景既有土圭之定度夏至尺五寸即土圭之定度也冬至景丈三尺蓋亦以土圭之度度之而知則月亦宜然而今測月景每有不齊則交道可知假如春分日在婁而月上弦於東井秋分日在角而月下弦於東井則是月所行者夏至日道也其午景宜與土圭等又如春分日在婁而月下弦於牽牛秋分日在角而月上弦於牽牛則是月行冬至日道也其午景宜與土圭所度冬至長景等而徴之所測或等焉或不等焉其等於定度者必月交黃道之度也其短於定度者必月在日道之北而為隂厯也其長於定度者必月在日道之南而為陽厯也是故兩弦亦可以測隂陽厯也然則隂陽厯之變動若此又何以正四時之叙曰日道之出入赤道也距逺至二十四度月道之出入黃道最逺止六度距二十四度故景之進退也大夏至尺五寸冬至一丈三尺相去懸絶距止六度故景之進退也小隂厯陽厯之月景所差於日景者不過尺許而已假如月上下弦在東井而景更短於土圭其為夏至之隂厯更無可疑即使是陽厯而景長於土圭其長不過尺許無害其為夏至之黃道也又如月上下弦在牽牛景加長於土圭所定之度其為冬至之陽厯已成確據即使是隂厯而景短於土圭所定之度其短亦不過尺許無損其為冬至之日道也夫兩弦之月道既在二至之度則日躔必在二分而四叙不忒故曰舉兩弦立說亦足以明也或疑洛下閎製渾儀止知黃道至東漢永元銅儀始知月道至隂陽交道之說後代始密周禮所言致月或未及此曰洪範言日月之行則有冬有夏是古有黃道也十月之交見于詩是古知交道也洛下閎等草創于祖龍煨燼之餘故制未備而以此疑周禮乎夫謂厯術屢變益精者如嵗差之類必數十年始差一度故久而後覺若月之隂陽厯月必一周視黃道之變尤為易見而謂古人全不之知吾不信也或又疑土圭只尺有五寸則惟北至時可用餘三時何以定之曰經固言日北景長日南景短矣其長其短亦必有數則皆以土圭之尺寸度之耳然則夏日至景如土圭者冬日至景必數倍於土圭而以土圭度之無難得其丈尺故冬夏並言致日也問嘗考春秋厯法訛舛甚多不知左氏之誤抑古厯不如此也夫驗於古然後可施於今今以最踈之古厯尚不可考則太初以下其疑難當更何如按厯法古踈今密乃古今之通論蓋謂天體無窮天道幽逺踵事漸增斯臻其善非謂古人之智不及後人也夫考古厯之踈密必須得其立算之根今自秦火以來並無一書能言三代以上之厯法所謂殷周六厯率皆僞撰不足為據春秋左氏之不合又何疑焉若夫三代以下太初厯始創規模洛下閎等之功自不可沒自是以後屢代加詳由後之密厯觀之遂覺其前之為最踈耳厯家之言曰驗天以求合無為合以驗天是故治厯者必當求之天驗求之天驗則當以近代之密測者為憑而詳徴算術以得其當然之理又知其所以然之故然後備考古術徐求其改憲源流博稽經史以考其徴信合者存之疑者闕焉斯不為用心於無益矣尊著以春秋二百四十年月日列序以考其得失用功甚勤與氏族官制地名等考皆有功於經傳其書自可孤行若但以厯法言仍當從事於郭太史授時法與今西法庶可以得其門户矣余初學厯原從授時入手後復求之二十一史始知古人立法改憲各有根源見史志僅載算法而無一語注釋因稍稍以所能知者解之遂以成帙最後始得西術此事益明然卷帙既多又竄改無定亦欲俟稍暇再加繕寫以請正髙明耳問日食古無其法漢日食每多先天終漢四百年無人修改則洛下閎張衡皆夢夢歟按古日食每不在朔者以古用平朔耳古所以用平朔者以日月並紀平度也東漢劉洪作乾象厯始知月有遲疾北齊張子信積候二十年始知日有盈縮有此二端以生定朔然而人猶不敢用也至唐李淳風僧一行始用之至今遵用乃驗厯之要然非有洛下閎之渾儀張衡之靈憲則測驗且無其器又何以能加密測愚故曰古人之功不可沒也問五星遲疾逆留按五星之遲疾逆留漢以前無言之者漢以後語焉而不詳雖授時厯號為至精而於此未有精測至西厯乃能言之此今厯勝古之一大端也問月食地景按月食地影之說肇於泰西驟言之若可駭細審之確有實據然必於厯學深究其根乃知其說為不誣耳問平差立差按平差立差定差之法古無其術乃郭太史所創為以求七政盈縮之度所以造立成之根本也其法日月五星並有之亦非如平朔定朔之用厯家用字偶同如此者多徴實言之乃知其故耳據云依立招差又云依垜疊立招差則似古算術中原有其法而今採用之然不可考矣愚嘗因李世兄之問而為之衍算頗覺其用法之巧焉與錫山友人楊學山書厯算之學弟生平癖嗜聞有同此者即不憚褰裳相從然如先生之實用其力於幾何三角以溯其根者未多見也前年奉晤吳門不勝喜慰以為可得留連旬日以深領誨益塵事之相牽失於交臂至今悵惘兹年已八三神明消蝕啓處艱難不知仍能續晤否也承借書五本當即抄付但未經重校故僅以抄本奉􅌳而留其原稿寶藏之以代靣誨前曽以此意告之吕令親屬為轉致厥後吕返錫山弟鄉居不知遂遲至今幸勿深罪書五種驗收是望承賜問數端皆弟所積疑內日差一事向因日躔表說甚是䝉混嘗為之論辨纍紙謂既有二根當定二表以相加減友人皆以為然既而熟思覺其非確宜只用月離交食二表為是大抵厯書表說多是後來所增故往往與表不應若日差表則又不然蓋西厯之傳亦各有師授之不同日躔表之兼用二根或是初說其平時定時乃測驗之實用必是後來之說日躔表中日差誤用初說而强為之辭故愈解而愈支拙見如此不知髙識以為何如也月二三均數不與厯指之說相應惟王寅旭嘗論及之餘人但知用表未有求其根者今先生以次均之外設又次均數既合表理復精當誠為創見敬服敬服火星半徑與視學相反真是難解然彼皆得之積候非鑿空之論五星中分亦然皆不敢輕為置論嘗謂厯學至今益密其理亦愈推明若集中土之賢才以専心致志而為之必更有可觀而無如其不能羣萃州處何也火星借象之圖世人多泥舊說先生輒深信之不疑古所謂一人之知非耶然此圖是與袁惠子先生論辨而作亦頗承其虛懷今惠兄久不得音問心甚念之若先生之知我蓋尤深於惠兄安得拏舟溯洄一遂鄙懷乎此學甚孤而學者多執成見或得少為足而遂欲自立門庭惟薛儀甫王寅旭兩先生能兼中西之長而且自有發明然生雖同時而並未得相見庚寅奉過始得一見令祖坤翁先生少伸企懷而鮑燕翌先生又已先歸道山殊為憾事弟又景逼桑榆故圖晤之心甚切非同泛泛也鴻便往來勿吝郵致乙未三月十九日擬璿璣玉衡賦有序易言治厯䇿數當期典重授時中星紀嵗蓋七政璇璣之制類先天卦畫之圖原道必本乎天儒者根宗之學制器以尚其象帝王欽若之心理至難言以象顯之則理盡意所未悉以器示之則意明故揚雄覃思渾天用成𤣥草平子精探靈憲聿闡元樞覆矩仰規一行以之衍䇿天根月窟堯夫於焉弄丸此聖學之攸先匪術家之私尚也况姬公之法受於商髙而神禹之疇肇諸河洛平成永賴實資句股圜方才藝碩膚爰有南車記里髙深廣逺寸矩以御幾何律度量衡萬事斯為根本既圜頂而方趾敢忘髙而負深茍俯察而仰觀必徴理而稽數家傳大易竊慕韋編世際清寧恭􅑮巨製竭歐邏之巧力紹蒲坂之芳型洵心理之胥同中西吻合亶後來之居上今古無雙雖株守山陬遲睹靈臺之美而心儀法象遙欣神器之成僭擬短章臆窺鴻典無禆采聽聊當衢歌云爾至哉渾儀之為器也體天地之撰類經緯之情微顯闡幽窮髙極深殆更僕莫殫其藴纍牘難悉其能者矣粵自道生宇宙肇為大圜健運無息東西斡旋七政錯行宿離糾紛交光羅絡終始相嬗雖有離朱孰窺其端聖哲挺生仰俯觀察積候成悟賾探隱索諗六虛之曠邈詎目營兮可獲乃範金兮為儀縱若衡兮八尺厯以之治兮象以之核堯命羲和四隅分宅制閏成歲釐工熙績匪有器以御之孰所憑而推䇿虞帝受之璣衡以設敬天勤民兩聖一轍嗣三統兮迭更兹重器兮罔䙝陳東序兮天球羌大訓兮為列河之圖兮莫先况琬琰與𢎞璧嬴秦力政罔畏天常遷周九鼎焚燬舊章球圖湮沒莫知其鄉厯紀乖次伏隂愆陽及夫漢造太初渾天初置唯意匠兮經營未詳徴乎昔制曽黃赤兮未分矧歲差兮能治厯唐逾宋代有討論小異大同踵事而增說存掌故約略可陳外周六合子午為經卯酉交加日月之門三輪八觚象地者衡是立郛郭以挈三辰黃倚赤而相結剖二至與二分判發斂兮南北距紫極兮為言小環四游又居其內左右周窺兩簫更代低昻斜側折旋唯意儀三重兮共樞亶推步兮精義亦有銅球實惟渾象列星綴離三家殊狀或附益之兩曜類蟻行兮磨上遲速行兮一機或水轉兮磨蕩非不研精覃思窮神盡智象重大兮易膠每機關兮弗利儀重環兮掩映頗未宜乎窺視加以代異人湮乍成旋廢作之也何難壞之也何易若乃元祖初服廣徴碩儒有美魯齊王郭之徒既作授時備器與書髙表四丈承以景符簡儀候極離立扶踈二線代管分秒乘除度百刻兮天腹旋立運兮四虛窺几兮測月蓮花兮挈壺正方有案兮定南北懸正座正兮九服之須仰儀兮虛而似釡度斜絡兮南極攸居可謂酌古凖今洵美且都者矣厯年未百有明膺命雖大統兮殊稱實授時兮為政屬作都兮石城旋京邑兮北定既觀臺兮屢遷地更置兮乖應豈儀器兮多忤抑疇人兮弗敬轉測之或未嫺兮址漸傾兮蔑正寧不善厥初兮歲薦更兮滋釁經生既非所習兮又申之以厲禁専科不相通兮有憤悱兮誰問遂使靈臺徒為文具交食或乖誰知其故帝謂兮草澤疇明理兮習數爾乃理難終隱道有必開天相其衷西儒朅來如禮失兮求野似問郯兮識官此珍祕兮勿泄彼菽粟兮非難於是吳淞太史仁和水部夜譯晨鈔心追手步亦得請而開局集歐邏與儒素擷西土兮精英入中算兮罏鑄屢清臺兮雜候良占測兮可据怵巧拙兮相形新術精兮羣妒慨萬里兮作賔兼十年兮發覆厯成兮弗用良書兮徒著何人事兮多違或蒼穹兮有待唯我盛朝度越千代正朔初頒適逢斯㑹唯欽若以為懷奚畛域乎中外洞新法之密合命遵行為定制哂豎儒兮固陋謬執古兮非今若肓不杖兮聾别竽笙斯術之無弊兮經指摘兮益明乃詔太史乃咨禮臣謂新厯兮允臧顧儀器兮未成式采銅兮名山鳩哲匠兮上京備製兮六儀各錫兮嘉名赤道兮法動天之西轉黃道兮儷七曜之東征古二道為一器兮景交羅而莫分今别其用兮法以簡而倍精黃既麗赤而左旋兮復自轉而右奔緯度之各異兮亦異其經黃自有極以運兮誠振古之未聞游表所指兮太陽之心時時可驗節候兮若影於鐙地平之儀辨方正位轉線參直三光所至出沒之度漸升之意秒忽微茫具可别識象限平轉兮測髙與庳割圓八線兮於是焉施合四為一兮周天在兹度唯九十兮厥數已全紀限六十兮於以參焉正反隅角兮靡幽弗宣用稽距度兮兩星之間弧三角之法兮推其所然五者相資多人分測片晷之餘各盡目力假變行之迅速無須臾之或失别有渾球全賦星躔循黃之極碁罫珠聯列曜逺近南北八度小輪之限凖斯無捂亦依赤極出地有恆或正升兮斜降或正降兮斜升晰伏見之先後諳里差之所因黃緯之列兮百世無改宫分迤差兮恆星東滙以度計年兮六十六載下設旋輪兮水激自動刻漏罔僭兮機發於踵爰有髙弧繫之天頂地平經緯兹焉互審或象限兮平觀或紀限兮斜距或黃赤儀之所窺潔之球而參遇爛若軒轅之寶鏡兮縮圜形而周布衆儀得其散兮球徴其聚正求兮反映宛轉兮回互測量有書兮或不能句摩娑斯器兮曠如揭霧更旋宫兮十二隨道里兮攸殊際地之極南北兮以為之樞子午及平環兮以限四隅隅各三宫兮東方為初次第右環兮大權以區三合六合之照兮凶吉分途惟斯球而可暏兮考步笇之密疏致用萬端未克枚舉洵天府之竒珍永作則乎來者若其鎔金有法棄滓取精磨礲砥礪光輝熒熒旋之中規直之中繩擘劃勻細度萬其分置儀衡重測重求心力相扶兮罔偏積歲年兮弗傾趺交之以銅龍兮或海獸以相承為水凖與螺柱兮常消息焉取平天矯兮騰踔攫拏兮猙獰詎美觀兮一時永奠定兮千春乃至崇臺百步迥出闤闠周以儲胥纎埃攸避上列六臺方圓式異相依兮交讓旋觀兮罔閡施窺筒之竒巧眄千里兮如對晝候兮日靣之星夜占兮句已之態折照浮光兮氣水水氣清濛厚薄兮地心相配交食淺深兮起虧進退地景厚薄兮青緑明昧視差有多少兮命天九重月有弦望兮太白攸同抱日為輪兮互入相容超西法之舊兮信天能之弗窮登斯臺也軒豁洞逹耳目開通揮斥兮八極廣攬兮無終意氣兮飛揚凌虛兮御風習其器也陸離瀟灑繽紛磊砢燦爛兮朝霞孔明兮朱火照曜兮焜煌周流兮軒翥戄對越兮於穆遊吾心兮太古帝載之虛無兮陟降其所垓埏之遼絶兮斂之一黍匪重黎之誕降兮曷其臻乎要眇邈祈姚之不作兮疇則探斯奧窔伊崇效而卑法兮協至德於太灝定百代之猶豫兮踵危微於帝道畢逺臣之精思兮備前王之所少璿璣玉衡之不傳兮乃今而獲聖人之大寶亂曰巍巍穹窿帝所則兮父乾母坤不敢不及兮寫以良金如塑像兮朝斯夕斯期勿忘兮子之於父視無形兮瞻兹肖貌曷敢以寧兮兢兢業業承天休兮奉若不違升大猷兮祈天永命從兹始兮億萬斯年昊天其子兮學厯說或有問於梅子曰厯學固儒者事乎曰然吾聞之通天地人斯曰儒而戴焉不知其髙可乎曰儒者知天知其理而已矣安用厯曰厯也者數也數外無理理外無數數也者理之分限節次也數不可以臆說理或可以影談於是有牽合傅㑹以惑民聽而亂天常皆以不得理數之真蔑由徴實耳且夫能知其理莫堯舜若矣堯典一書命羲和居半舜格文祖首在璇璣玉衡以齊七政豈非以敬天授時固帝王之大經大法而精一之理即於此寓哉曰然則律何以禁私習曰律所禁者天文也非厯也曰二者異乎曰以日月暈抱珥虹霓彗孛飛流芒角動搖預斷未來之吉凶者天文家也本躔離之行度中星之次以察發斂進退敬授民事者厯家也漢藝文志天文二十一家四百四十五卷厯譜十八家六百六卷固判然二矣且夫私習之禁亦禁夫妄言禍福惑世誣民耳若夫日月星辰有目者所共睹古者率作興事皆用為候又何禁焉楚邱之詩曰定之方中作于楚宫夏令曰修而場功偫而畚挶營室之中土功其始火之初見期于司里春秋傳曰凡土功龍見而戒事火見而致用水昏正而栽日至而畢此版築之候也豳風之詩曰七月流火九月授衣此裘褐之候也申豐曰古者日北陸而藏氷西陸朝覿而出之火出而畢賦則藏氷用氷之候也龍見而雩則雩候也農祥晨正則耕候也三星在天則㛰候也單襄公曰辰角見而雨畢天根見而水涸本見而草木節解駟見而隕霜火見而清風戒寒雨畢除道水涸成梁草木節解而備藏隕霜而冬裘具清風至而修城郭宫室是故有一候則有一候之星有一候之星則有一候之政令田夫紅女皆知之矣又何禁焉自梓慎禆竈之徒以星氣言事應乃始有灾祥之占而其說亦有驗有不驗有星孛於大辰禆竈曰宋衛陳鄭將同日火若我用瓘斝玉瓚則不火子産弗與已而火作竈曰不用吾言鄭又將火子産曰天道逺人道邇竈焉知天道是亦多言矣豈不或信卒不與鄭亦不火梓慎以日食占水昭子曰旱也已而果旱慎言不效是故唯子産昭子深明乎理數之實乃有以折服矯誣之論雖挾術如慎竈而不為所動故厯學大著則禨祥小數無所依托而自不得行其於政教不無小補與律禁私習之指固殊塗而同歸矣曰世皆謂天文厯數能前事而知以豫為趨避而子謂厯學明則占家無所容其欺妄言之徒不待禁而戢其說可得聞乎曰有說也蓋古之為厯也疏久而漸密其勢然也唯其踈也厯所步或多不效於是乎求其說焉不得而占家得以附㑹於其間是故日月之遇交則食以實㑹視㑹為斷有常度也而古厯未精於是有當食不食不當食而食之占日之食必於朔也而古用平朔於是有食在晦二之占月之行有遲疾日之行有盈縮皆有一定之數故可以小輪為法也而古唯平度於是占家曰晦而月見西方謂之朓朓則候王其舒朔而月見東方謂之仄慝仄慝則侯王其肅月行隂陽厯以不足二十年而周其交也則於黃道其交之半也則出入於黃道之南北五度有竒皆有常也而古厯未知於是占家曰天有三門猶房四表房中央曰天街南間曰陽環北間曰隂環月由天街則天下和平由陽道則主喪由隂道則主水夫黃道且有歲差而况月道出入於黃道時時不同而欲定之於房中央不已謬乎月出入黃道既有南北而其與黃道同升也又有正升斜降斜升正降之不同唯其然也故月之始生有平有偃而古厯未知也則為之占曰月始生正西仰天下有兵又曰月初生而偃有兵兵罷無兵兵起月於黃道有南北一因也正升斜降二因也盈縮遲疾三因也人所居南北有里差則見月有蚤晚四因也是故月之初見有初二日初三日之殊極其變則有在朔日初四日之異而古厯未知則為之占曰當見不見又曰不當見而見魄質成蚤也食日者月也不關雲氣而占者之說曰未食之前數日日已有謫日大月小日髙月卑卑則近髙則逺逺者見小近者見大故人所見之日月大小略等者乃其逺近為之而非其本形也然日月之行各有最髙卑而影徑為之異故有時月正掩日而四靣露光如金環也此皆有可考之數而占者則以金環食為陽德盛五星有遲疾留逆而古法唯知順行於是占者以逆行為灾而又為之例曰未當居而居當去不去當居不居未當去而去皆變行也以占其國之灾福五星之出入黃道亦如日月故所犯星座可以預求也而古法無緯度於是占者以為失行而為之例曰凌曰犯曰鬬曰食曰掩曰合曰句已曰圍繞夫句已凌犯占可也以為失行非也五星離黃道不過八度則中官紫微及外官距逺之星必無犯理而占書皆有之近世有著賢相通占者刪去古占黃道極逺之星亦既知其非是矣至於恆星有定數亦有定距終古不變而世之占者既無儀器以知其度又不知星座之出入地平有濛氣之差或以橫斜之勢而目視偶乖遂妄謂其移動於是為占曰王良䇿馬車騎滿野天鉤直則地維坼泰階平人主有福中州以北去北極度近則老人星逺而近濁不常見也於是古占曰老人星見王者多夀以二分日候之若江以南則老人星甚髙三時盡見而疇人子弟猶歲以二分占老人星密疏貢諛此其仍訛習欺尤大彰明者矣故厯學不明而徒為之禁以嚴之終不能禁也或以禁之故而私相傳習矜為祕授以售其詐若厯學既明則人人曉然於其故雖有異說而自無所容余所以數十年從事於斯而且欲與天下共明之也且子不徴之功令乎經史語孟士之本業也而魯論言辰居星拱行夏之時孟子言千歲日至可坐而致易言治厯明時大傳言五歲再閏三百有六十當期之日堯典中星分測驗之地璣衡之製為萬世法辰弗集房載于夏書詩稱十月之交朔日辛卯春秋紀日食三十六禮載月令大戴禮述夏小正皆詳日所在宿及恆星伏見昏旦之中與其方向低昻之狀用為月節以布政教而成百事又自漢太初以來造厯者數十家皆具其說於史若是者既刋布其書使學者誦習之矣三年而試之程式發䇿往往有及於律厯者其於律之禁寧相背乎是故律禁私習妄言而未嘗禁士之習經史也而顧諉之為星翁卜師之事而漫不加察反令術士者流得挾其不經之說以相炫誘而不能斷其惑是亦儒者之過也故人之言天以占驗為竒吾之言厯以能辨惑為正曰然則占驗可廢乎將天變不足畏邪曰惡是何言也吾所謂辨惑者辨其誣也若夫王者遇灾而懼側身修省以答天戒固欽若之精意也又可廢乎古者日食修德月食修刑夫德與刑固不以日月之食而始修也遇其變加警惕焉此則理之當然未敢以數之有常而或懈也此又學厯者所當知厯學源流論梅子殫心厯學數十年而嘆心之神明無有窮盡雖以天之髙星辰之逺有遲之數千百年始見端緒而人輒知之輒有新法以追其變故世愈降厯愈以密而要其大法則定於唐虞之時今夫厯所步有四曰恆星曰日曰月曰五星治厯之具有三曰算數曰圖象曰測驗之器由是三者以得前四者躔離朓朒盈縮交蝕遲留伏逆掩犯之度古今作厯者七十餘家踈密代殊制作各異其法具在可考而知然大約三者盡之矣堯命羲和厯象日月星辰舜在璇璣玉衡以齊七政厯者算數也象者圖也渾象也璿璣玉衡測驗之器也故曰定於唐虞之世也然厯之最難知者有二其一里差其一歲差是二差者有微有著非積差而至於著雖聖人不能知而非其距之甚逺則所差甚微非目力可至不能入算故古未有知歲差者自晉虞喜宋何承天祖冲之隋劉焯唐一行始覺之或以百年差一度或以五十年或以七十五年或以八十三年未有定說元郭守敬定為六十六年有八月回回泰西差法略似而守敬又有上考下求增減歲餘天周之法則古之差遲而今之差速是謂歲差之差可謂精到若夫日月星辰之行度不變而人所居有東南西北正視側視之殊則所見各異謂之里差亦曰視差自漢及晉未有知之者也北齊張子信始測交道有表裏此方不見食者人在月外必反見食宣明厯本之為氣刻時三差而大衍厯有九服測食定晷漏法元人四海測驗二十七所而近世歐邏巴航海數萬里以身所經山海之程測北極為南北差測月食為東西差里差之說至是而確是蓋合數千年之積測以定歲差合數萬里之實驗以定里差距數逾逺差積逾多而曉然易辨且其為法既推之數千年數萬里而凖則施之近用可以無惑厯至今日屢變益精以此然余亦謂定於唐虞之時何也不能預知者差之數萬世不易者求差之法古之聖人以日之所在不可以目視而器窺也故為之中星以紀之鳥火虛昴此萬世求歲差之根數也又以日之出入發斂不可以一方之所見為定也故為之嵎夷昧谷南交朔方之宅以分候之此萬世求里差之定法也嗚呼至矣學者知合數千年數萬里之心思耳目以治厯而後能精密又知合數千年數萬里之心思耳目以為之精密者適以成古聖人未竟之緒則當思羲和以後凡有能出一新智立一捷法垂之至今者皆有其所以立法之故及其久而必變也又皆有所以變之說於是焉反覆推論必使理解氷釋無纎毫疑似於吾之心則吾之心即古聖人之心亦即天之心而古今中外之見可以不設而要於至是夫如是則古人之精意可使常存不致湮沒於專已守殘之士而過此以往或有差變之微出於今法之外亦可本其常然以深求其變而徐為之修改以衷於無弊則是善於治厯者也厯算全書卷六
