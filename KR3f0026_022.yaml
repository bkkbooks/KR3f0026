  text: 釋凡四則
  hash: sha256:29fe6f84142254eb77fe9716c331e599c74d628f4a6de131c9e9e94bbfc1c605
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3f0026_WYG_022-1a, image: WYG0794/WYG0794-0462a.png}
body:
  text: 一印心厯生於數數生於理理與氣偕其中有神賾焉而不亂也變焉而有常也於是聖人以數紀之堯命羲和舜在璣衡皆是物也中遭秦炬先憲略亡自太初以後作者數十家人各效才王郭肇興大成斯集夫天不變理亦不變故厯代賢者往往驗天以立法要皆積有其畢生之精力始得其一法之合於理有聖人雖起不能易者而後垂之不刋以至今鼎何人也敢與於斯夫創起者難為功觀成者易為力昔人緣理以立數今兹因數以知理期以信吾心焉耳矣所不能信者不敢知也其或章句繁復往復諄然夫必如是而後自信以信於古人僭越獲罪既無所逃拘滯固陋詒誚通方幸有以教一存疑大統厯法所以仍元法不變者謂其法之善可以永久也夫既仍辛巳之元合用授時之數乃以今所傳較之厯經參伍多違豈别有説愚故不能無疑也按厯經上考往古則歲實百年長一周天百年消一下驗將來則歲實百年消一周天百年長一此其據往以知來自堯典胤征降而諸史所載可以數求者當時則既一一驗之矣而今所傳歲實一無消長此其可疑一也又按厯經諸應等數隨時推測不用為元固也今則氣應仍是五十五日六百分周應仍是箕十度至於閏原是二十萬一千八百五十分今改為二十萬二千五十分較授時後二百分轉應原是一十三萬一千九百四分今改為一十三萬千二百五分較授時先一千六百九十九分交應原是二十六萬千一百八十七分八十六秒今改為二十六萬千三百八十八分較授時後二百分一十四秒或差而先或差而後以之上考辛巳必與元算不諧若據厯經以步今茲亦與今算不合然則定朔置閏月離交會之期又安所取𠂻也豈當時定大統厯有所測驗而改之與夫改憲則必另立元今氣應周應俱同而獨於數者有更此其可疑二也又按厯經盈縮遲疾皆有二術其一術不用立成其一術用立成然只有用之之法而無其圖其遲疾圖則又仍如古式只二十八日母數而無逐限細率意者當時修史者之遺忽與抑有所禁祕也今據此所載立成以求盈縮二術俱諧以求遲疾則自八十三限以至八十六限與前術有所不合意其所謂立成者有異歟據元史王恂先卒其立成之藁俱未成書郭公守敬為之整齊意者厯經前術為王公未定之藁與此其可疑三也又如日月食開方數乃所求食分橫過半徑之數據厯經皆五千七百四十乘之今改月食者為四千九百二十乘是所測暗虛小於原所測者二十分也則其所測月輪圓徑亦小於原測一十分也茍非實有測驗於天又何敢據此以非彼與茍非於交食之際立渾比量周徑縱橫之數何從而定與茍非於虧復之際下漏刻以驗之定用分之多少何自而知與此其可疑四也又有自相背馳如立成所載日出入半晝分是自冬至夏至後順數只問盈縮不言初末而通軌求日出入法又似有初末二圖此言不可意斷者至於晝夜永短與元史所載大都刻數不同則以北極高下黃道因之所在而殊理固然也然篇首既不言郡省撰名復載王恂豈當時九服晷漏之永短皆推有圖而元史止載其一歟然畢竟此所列者據何地為則也此其可疑五也凡此數端同異出入未敢偏據姑即所傳略附箋疏去取是非俟之君子一刋誤大抵一書傳經數手多非其舊或謄寫魯魚或簡編蠧蝕故君子慎闕疑也乃若專守殘文習焉不察有所未解強入以己意參之遂使斫輪不傳糟粕并失金根輒改燕郢何憑今于其尤謬亂者是正數條或據厯經或據本書非敢逞私憑臆以重獲戾於古今也一者日月食限乃算家所憑以定食不食者也而今所載或失而出或失而入失而入不過虛費籌策而已失而出則將據此以斷不食其有不合將以疑立法之不詳今皆據隂陽食限極之諸差所變以為常準即準本書以定似為稍密脫有不合其必非本算所能御矣其日食夜刻月食晝刻亦據本書及厯經所載時差并定用分得之其月帶食若據厯經定用分尚有微差亦不多也一者月食時差分據厯經為定蓋厯考古厯皆與此所載不合故斷從􅔦經一者黃道定積度原以歲差推變自大衍以後為法略同今若定鈐何異膠柱今斷從厯經仍以天啓辛酉一年步定為式一者月食既內分據厯經原以既內分與一十分相減相乘平方開之也今則訛為一十五分夫月食十分而既其既內五分倍之為十分而止矣安得有所謂既內十五分乎今以弦較求句股法求得既內小平圓積數皆與所求相應一如厯經原法故斷從之别有圖説以證其理一者日月帶食凡日出入分在初虧已上復圓已下是為帶食而出入也今則訛為初虧已上食甚已下是得其半而失其半求之厯經亦復仍訛故愚亦不敢全據歷經者謂有此等處也今據後已復光未復光條改為復圓分已下厥數實諧於理亦暢又月食通軌前所録數定望并晨分下注誤又月食分秒定子法誤又月食定用分并既內分定子俱誤又月食更點歸除法并定數法俱誤又徑求次年天正交泛分條誤多有閏無閏每月加數今皆刋正一補遺算有所必不可略句與字有所必不可無而或無之或略之則非作法者之故為祕惜也如日食交前後條正交交定度在七度已下數雖在正交度下而實則陽厯交後度也法宜加交終度減之此算之所必不可略者也乃此書既不之載至元歷經亦復闕焉何也夫此亦數之易知當必非所甚祕豈非梨棗鉛槧者之責乎將謂精於算者自能知之而無所用書歟今輒斷之以理重為補定古人而得見我何以幸教之也續讀學厯小辨所載大統交食法有在七度以下食在正交語足與愚説相證又如定子法為乘除後進退而設甚便於初學其立法立意不可謂不至也乃多有遺去言十定一不滿法去一二語者夫定子所以御乘除之變而此二語又所以通定子之窮若無此二語則何如不定子之為愈乎又如求天正赤道黃道度二條皆不用定子夫赤道不定子知其所減者為度位乎為分位乎黃道乘除不用定子固也然何以處夫除不滿法與夫減過積度只剩秒微者乎又如食甚入盈縮條遺食甚甚字卯酉前後條遺定望望字凡此皆字與句之所必不可無者也今皆補定
