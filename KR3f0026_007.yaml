body:
  text: 序厯家所憑全恃測驗昔者蔡雍上書願匍匐渾儀之下按度考數著於篇章以成一代盛典古人之用心蓋可想見然則儒者端居斗室足不履觀臺目不睹渾象安所得測驗之事而親之而安從學之曰所恃者有測驗之法之理在則句股是也遭秦之厄天官書器散亡漢落下閎鮮于妄人等追尋墜緒厯代相承考訂加詳至于今日厥理大著則句股之用于渾圓是也今夫測量之法方易而圓難古用徑一圍三聊舉成數非有所不知也自劉徽祖沖之各為圓率逮元趙友欽定為徑一則圍三一四一五九二與今西術略同皆割圓以得之非句股奚藉焉西法割圓比例以直角三邊形為主即句股也但異其名不異其實然用句股測平圓猶易用句股測渾圓更難厯家所測皆渾圓也非平圓也古有黃赤道相準之率大約於渾器比量僅得梗槩未能彰諸笇術近代諸家以相減相乘推變其差損益有序稍為近之而未親也惟元郭太史守敬始以弧矢命笇有平視側視諸圖推步立成諸數黃赤相求斯有定率視古為密由今觀之皆句股也但其立法必先求矢又用三乘方取數不易故但能列其一象限中度率不復能求其細分之數厯書之法則先求角既因弧以知角復因角以知弧而句股之形能預定其比例又佐之八線互用以通其窮其法以三弧度相交輒成三角則此三弧度者各有其相應之弦弧與弧相割即弦與弦相遇而句股生焉茍熟其法則正反斜側八線犁然各相得而成句股八線比例以半徑全數為弦正弦餘弦為句為股又以割線為弦切線與半徑全數為其句股表中所列句股形凡五千四百於是乎黃可變赤赤可變黃可以經度知緯可以緯度知經羅絡鉤連旁通曲暢分秒忽微臚陳笇位求諸中心可無纎芥之疑告諸同學亦如指掌之晰即不必匍匐渾儀之下可以不窺牖而見天道賴有此具也全部厯書皆弧三角之理即皆句股之理顧未嘗正言其為句股使人望洋無際彼云直角三邊形此云句股乃西國方言譯書時不知此理遂生分别又譯書者識有偏全筆有工拙語有淺深詳略所載圖説不無滲漏之端影似之談與臆參之見學者病之兹稍為摘其肯綮從而疏剔訂補以直截發明其所以然竊為一言以蔽之曰析渾圓尋句股而已蓋于是而知古聖人立法之精雖弧三角之巧豈能出句股範圍然句股之用亦必至是而庶無餘藴爾厯法之深微奧衍不啻五花八門其章句之詰曲離竒不啻羊腸絙度而由是以啓其扃鑰庶將掉臂遊行若揭日月而騁康莊矣文雖不多實為此道中開闢塗徑蓋積數十年之探索而後能會通簡易故亟欲與同志者共之余老矣禹服九州之大厯代聖人教澤所漸被必有好學深思其人所冀大為闡發俾古人之意晦而復昭一線之傳引而弗替則生平之志願畢矣豈必身擅其名然後為得哉余拭目俟之康熙二十三年上元甲子長至之吉勿菴梅文鼎書於柏梘山中欽定四庫全書厯算全書卷七宣城梅文鼎撰弧三角舉要卷一弧三角體勢弧三角與平異理故先體勢知體勢然後可以用算而算莫先於正弧猶平三角之有句股形也故以為弧度之宗正弧形之之角取法于黃赤交角則有定度而餘角取法于過極圈交黃道之角則隨度而移互用之其理益顯故有求餘角法弧三角以一角對一邊而比例等與平三角同而其理回别故有弧角比例法斜弧無相對之弧角則比例之法窮故有垂弧法三角求邊則垂弧之法又窮故有次形法垂弧與次形合用則有捷法弧與角各有八線而可以互視故有相當法餘詳環中秦尺及塹堵測量弧度與天相應弧三角之法以測渾員渾員之大者莫如天員之至者亦莫如天故弧三角之度皆天度也以平測員其難百倍以員測員其簡百倍而得數且真是故測天者必以弧度而論弧度者必以天為法測弧度必以大圈渾球上弧度有極大之圈乃腰圍之一線也如赤道帶天之紘原止一線如黃道如子午規如地平規盡然又如測得兩星相距之逺近亦為大圈之分若以此兩星之距弧引而長之必匝於渾員之體而成大圈不論從衡斜側皆同一法球上大圈必相等所以必用大圈者以其相等也渾球上從衡斜側皆可為大圈而其大必相等者以俱在腰圍之一線也如黃道赤道及子午規地平規俱係大圈必皆相等不相等即非大圈故惟大圈可相為比例任測兩星之距不必當黃赤道而能與二道相比例者以其皆大圈也球上兩大圈無平行者大圈在渾球既為腰圍之一線則必無兩圈平行之法若平行即非大圈如黃赤道並止一線而無廣即無地可容平行線也子午規地平規亦然球上圈能與大圈平行者皆小圈謂之距等圈離大圈左右作平行圈皆曰距等圈謂其四圍與大圈相距皆等如于黃道內外作緯圈其與黃道相距或近則四靣皆近或逺則四面亦皆逺無毫忽之不同平行故也赤道緯圈地平髙度並同而其自相距亦等故曰距等也如黃道內外或近或逺處處可作距等圈而皆與黃道平行即其圈亦自相平行故並為等距距等圈皆小于大圈如黃道內外緯圈但離數分其圍即小于黃道其距益逺其圈益小小之極至一點而止諸緯圈並然不能與大圈為比例大圈惟一距等圈無數無一同者無法可為比例故為比例者必大圈也如圖甲乙為大圈大圈只一丙丁及戊庚等皆小圈小圈無數漸近圎頂己即其圈愈小而成一點大小懸殊故不可以相為比例大圈之比例以度不拘丈尺凡圈皆可分三百六十度每圈平分之成半周四平分之成象限象限又各平分之為九十度成三百六十度而球大者其大圈大球小者其大圈小皆以本球之圍徑自為比例不拘丈尺儘本球之圍分為全周之度其球上之度即皆以此為準但在本球上為最大故謂之大圈非以丈尺言其大小古人以八尺渾儀準周天蓋以此也又如古渾儀原有三重其在內之環周必小于外而其度皆能相應者在內環周雖小而在內之渾員以此為大圈即在內之各度並以此為準故也大圈之度為公度凡球上距等圈亦可平公三百六十度而其圈皆小于本球之大圈又大小不倫則其所分之細度亦皆小于大圈而大小不倫矣惟本球腰圍大圈上所分之度得為公度故凡言度者必大圈也如圖甲乙為大圈一象限丙丁及戊庚各為距等小圈一象限象限雖同而大小迥異又如甲辛為大圈三十度丙壬及戊癸亦各為小圈之三十度其為三十度雖同而大小亦異再細考之至一度或至一分亦大小異也故惟大圈之度為公度大圈即本球外周其度即外周之度而橫直皆相等平員有徑有周渾員亦有徑有周立渾員于前則外周可見即腰圍之大圈也旋而視之皆可為外周故大圈之橫直皆等皆以外周度為其度故等如圖子午規為渾儀外周其度三百六十乃橫度也地平為腰圍度亦三百六十乃橫度也橫度直度皆得為外周故其度相等若依北極論之則赤道又為腰圍而亦即外周也推是言之渾球上大圈從衡斜側皆相等何則旋而視之皆得為腰圍即皆得為外周故也大圈上相遇有相割無相切大圈相割各成兩半分球上從衡斜側既皆成大圈則能相割矣而皆為渾員之外周則必無相切之理若相切者必在外周之內為距等小圈如圖甲丙乙為大圈半周能割大圈于甲于乙而不能相切丙丁成小圈則能切大圈于丙于丁如圖甲庚辛乙為大圈半周割外圈于甲于乙則甲己乙乙子甲亦各成半周若壬癸距等圈割大圈于庚于辛而庚辛非半周球上兩大圈相割必有二處此二處必相距一百八十度而各成兩平分如黃赤二道相交於春分必復相交於秋分即二分之距必皆半周一百八十度而黃道成兩半分赤道亦兩平分也若距等圈與大圈相割必不能成兩平方兩大圈相遇則成角球上大圈既不平行則其相遇必相交相割而成角弧三角之法所由以立也角有正有斜斜角又有鋭鈍共三種而角兩旁皆弧線與直線角異如圖己午戊子為子午規辛午乙子為地平規兩大圈正相交于南地平之午北地平之子則皆正角而四角皆等並九十度角也正角一名直角一名十字角一名正方角如圖午辛子為地平規丁辛癸為赤道規兩大圈斜相交于辛則丁辛子鈍角大于九十度丁辛午鋭角小于九十度兩角相並一百八十度減鋭角其外角必鈍若減鈍角亦得鋭角也故有內角即知外角又兩鋭角相對兩鈍角相對其度分必等故有此角即知對角凡此數端並與平三角同然而實有不同者以角兩旁之為弧線也弧線之作角必兩直線剖平員作角形如分餅角旁兩線皆半徑至周而止弧線剖渾冪作角形如剖瓜角旁兩弧線皆半周必復相交作角而等如黃赤道交于二分其角相等角有大小量之以對角之弧其角旁兩弧必皆九十度弧線角既如瓜瓣則其相距必兩端狹而中濶其最濶處必離角九十度此處離兩角各均即球上腰圍大圈也故其度即為角度如黃赤道之二分交角二十三度半即二至時距度此時黃赤道離二分各九十度乃腰圍最濶處也大圈有極大圈能分渾員之面冪為兩則各有最中之處而相對是為兩極兩極距大圈四靣各九十度如圖甲辛乙為赤道大圈己為北極己為南極甲己丁己等弧線距北極各九十度距南極亦然若己為天頂甲辛乙為地平大圈亦同如甲正北辛正東乙正南丁東北丙東南所在不同而甲乙等髙弧距天頂各九十度皆等大圈上作十字弧線引長之必過兩極兩極出弧線至大圈必皆十字正交如赤道上經圈皆與赤道正交為十字角則其圈必上過北極下過南極也然則從兩極出弧線過赤道必十字正交矣大圈之極為衆角所輳如赤道上逐度經圈皆過兩極則極心一點為衆角之宗經圈之弧在赤道上成十字者本皆平行漸逺漸狹至兩極則成角形之鋭尖角無論大小皆輳于極而合成一點離此一點外即成鋭鈍之形而皆與赤道度相應所謂量角以對弧度而角兩旁皆九十度以此如圖己為北極即衆角之頂鋭其所當赤道之度如乙丙等則己角為鋭角如丙庚等則己角為鈍角若己為天頂外圈為地平亦然角度與角旁兩弧之度並用本球之大圈度故量角度者以角為極有弧線角不知其度亦不知角旁弧之度法當先求本球之九十度其法以角旁二弧各引長之使復作角乃中分其弧即成本弧之九十度而角旁弧之度可知以角為心九十度為界作大圈與角旁兩弧並本球大圈而其分度等乃視角所當之弧即角旁兩九十度弧所界於大圈上得若干度分即角度也故曰以角為極三大圈相遇則成三角三邊此所謂弧三角形也如黃道赤道既相交於二分又有赤道經圈截兩道而過之則成乙丙甲弧三角形知圖己為北極戊辛為赤道丁庚為黃道二道相交於春分成乙角又己壬為過極經圈自北極己出弧線截黃道於丙得丙乙邊為黃道之一弧亦截赤道於甲成甲乙邊為赤道之一弧而過極經圈為二道所截成丙甲邊為經圈之一弧是為三邊即又成丙角甲角合乙角為三角弧三角不同於平三角之理弧三角形有三角三邊共六件以先有之三件求餘三件與平三角同所不同者平三角形之三角并之皆一百八十度弧三角不然其三角最小者比一百八十度必盈三邊在一度以下可借平三角立算因其差甚微然其角度視半周必有微盈但不得滿五百四十度角之極大者合之以比三半周必不能及平三角之邊小僅咫尺大則千百萬里弧三角邊必在半周以下不得滿一百八十度合三邊不得滿三百六十度如滿全周即成全員而不得成三角平三角有兩角即知餘角弧三角非算不知平三角有一正角餘二角必鋭弧三角則否有三正角兩正角者其餘角有鈍有鋭或兩鋭兩鈍或一鋭一鈍不等平三角有一鈍角餘二角必鋭弧三角則否其餘角或鋭或正或鈍甚有三鈍角者平三角以不同邊而同角為相似形同邊又同角為相等形弧三角則但有相等之形而無相似之形以同角者必同邊也平三角但可以三邊求角不可以三角求邊弧三角則可以三角求邊弧三角之邊皆員度也初無丈尺可言故三角可以求邊若干三角邊各有丈尺則必有先得之邊以為之例所以不同相前條言有相等之形無相似之形亦謂其所得之度等非謂其丈尺等也弧三角用八線之理平三角用八線惟用於角弧三角用八線并用於邊平三角以角之八線與邊相比弧三角是以角之八線與邊之八線相比平三角有正角即為句股若正弧三角形實非句股而以其八線輳成句股平三角以角求邊是用弧線求直線也有角即有弧以邊求角是用直線求弧線也然角以八線為用仍是以直線求直線也句股法也弧三角以邊求角以角求邊並是以弧線求弧線也而角與邊並用八線仍是以直線求直線也亦句股法也蓋惟直線可成句股所不同者平三角所成句股形即在平靣而弧三角所成句股不在弧靣而在其內外弧三角之點線面體測量家有點線面體弧三角備有之其所測之角即點也但其點俱在弧靣如于渾球任指一星為所測之點即角度從兹起如太陽太陰角度並從其中心一點論之弧三角之邊即線也但其線皆弧線如渾球上任指兩星即有距線或于一星出兩弧線與他星相距即成角而角旁兩線皆弧線也弧三角之形即靣也但其靣皆渾球上面冪之分形弧三角之所麗即渾體也剖渾員至心即成錐體而並以弧三角之形為底詳塹堵測量渾員內點線面體與弧三角相應前條點線面體俱在球面可以目視器測但皆弧線難相比例比例必用句股句股必直線故也賴有相應之點線面惟在渾體內厯員可指雖不可以目視而可以算得弧三角之法所以的確不易也如渾球中剖則成平員即靣也于是以球面之各點即弧三角之各角依視法移于平員面即渾員內相應之點也又以弧與角之八線移至平面成句股以相比例是渾員內相應之線也又如弧三角之三邊各引長之成大圈各依大圈以剖渾員即各成平員面是亦渾員內相應之面也二平員面相割成瓜瓣之體三平員面相割成三楞錐體若又依八線橫割之即成塹堵諸體是渾員體內相應之分體也此皆與弧面相離在渾員之內非剖渾員即不可見而可以算得即不啻目視而器測矣大圈與渾員同心球上大圈之心即渾員之心若依各大圈剖渾員成平員面其平員心即渾員之心若距等小圈則但以渾員之軸為心而不能以渾員心為心同心者亦同徑大圈以渾貟徑為徑若距等圈則但以通弦為徑渾體內諸線能與弧三角相應者以此渾員體內諸線皆宗其徑弧三角既以大圈相割而成必宗大圈之徑徑同故內外相應弧三角之邊不用小圈亦以此也距等圈既與大圈異徑則其度不齊不能成邊而所作之角必非真角無從考其度分也弧三角視法弧三角非圖不明然圖弧線於平面必用視法變渾為平平置渾儀從北極下視則惟赤道為外周不變而黃道斜立即成撱形其分至各經圈本穹然半員今以正視皆成員徑是變弧線為直線也立置渾儀使北極居上而從二分平視之則惟極至交圈為外周不變其赤道黃道俱變直線為員徑而成輳心之角即大距度平面角是變弧線角為直線角也又距等圈亦變橫線而成各度正弦與員徑平行其赤道上逐度經圈之過黃赤道者雖變撱形而其正弦不變且厯算可見如在平面而與平面上之大距度正弦同角成大小句股比例是弧面各線皆可移于平面也故視法不但作圖之用即步算之法已在其中以上謂之正視以黃赤道為式若于六合儀取天頂地平諸線亦同他可類推以上謂之旁視渾員上有垜疊諸線從旁側視之庶幾可見雖不能按度肖形而大意不失以顯弧三角之理為用亦多角之矢如圖甲丙乙丁半渾員以甲戊乙弧界之則其弧面分兩角為一鋭一鈍以視法移此弧度于相應之平面亦一鋭一鈍即分員徑為大小二矢而戊丙正矢為戊甲丙鋭角之度戊乙丙亦同戊丁大矢為戊甲丁鈍角之度戊乙丁亦同故得矢即得角角之八線如前圖丙戊弧為甲鋭角之度與丙庚等則丙戊之在平面者變為直線即為甲鋭角之矢而戊巳為角之餘弦戊庚為角之正弦丙辛為角之切線己辛為角之割線皆與平面丙庚弧之八線等丁巳戊過弧為甲鈍角之度與丁乙庚過弧等則丁戊在平面者變為鈍角之大矢而戊巳餘弦戊庚正弦丙辛切線己辛割線並與鋭角同平面鈍角之八線與外角同用弧三角亦然正弧斜弧之角與邊分為各類凡三角內有一正角謂之正弧三角形三角內並無正角謂之斜弧三角形正弧三角形之角有三正角者有二正角一鋭角者有二正角一鈍角者以上種種不須用算又有一正角兩鋭角者內分二種一種兩鋭角同度一種兩鋭角不同度有一正角兩鈍角者內分二種一種兩鈍角同度一種兩鈍角不同度有一正角一鋭角一鈍角者內分二種一種鋭鈍角角合之成半周一種合鋭鈍兩角不能成半周計正弧之角九種而用算者六也正弧三角形之邊有三邊並足者足謂足九十度有二邊足一邊小者在象限以下為小有二邊足一邊大者過象限以上為大以上三種可不用算有三邊並小者內分二種一種二邊等一種二邊不等有二邊大而一小者內分三種一種二大邊等一種二大邊不等一種小邊為一大邊減半周之餘計正弧之邊八種而用算者五也二邊俱小則餘邊必不能大故無二小一大之形二邊俱大則餘邊亦不能大故無三邊並大之形一邊若足則餘邊亦有一足故無一邊足之形正弧三角形圖一計三種正弧三角形圖二訃三種以上正弧形三種有同度之邊與角謂之二等邊形內有己形雖無同等之邉角而有共為半周之邉角度雖不同而所用之正弦則同即同度也凡邉等者角亦等後倣此正弧三角形圖三計三種以上正弧形三種邊角與丁戊巳三種無異但無同度之邊凡正弧三角形共九種斜弧三角形之角有三角並鋭者內分三種一種有二角相等一種三角不相等一種三角俱等有二角鋭而一鈍者內分四種一種二鋭角相等一種二鋭角不相等一種鈍角為一鋭角減半周之餘一種二鋭角相等而又並為鈍角減半周之餘有二角鈍而一鋭者內分四種一種二鈍角相等一種二鈍角不相等一種鋭角為一鈍角減半周之餘一種二鈍角相等而又並為鋭角減半周之餘有三角並鈍者內分三種一種有二角相等一種三角不相等一種三角相等計斜弧之角十有四種斜弧三角形之邊有一邊足二邊小者內分二種一種二小邊相等一種二小邊不等有一邊足二邊大者內分二種一種二大邊等一種二大邊不等有一邊足一邊小一邊大者內分二種一種大小二邊合之成半周一種合二邊不能成半周有三邊並小者內分三種一種三邊不等一種二邊等一種三邊俱等有二邊大而一小者內分四種一種二大邊等一種二大邊不等一種小邊為一大邊減半周之餘一種二大邊等而又並為小邊減半周之餘有二邊小而一大者內分四種一種二小邊等一種二小邊不等一種大邊為一小邊減半周之餘一種二小邊等而又並為大邊減半周之餘有三邊並大者內分三種一種三邊不等一種二邊等一種三邊俱等計斜弧之邊二十種斜弧三角形圖一計四種以上斜弧形四種並三角三邊同度謂之三等邊形內有二等邊者其一邊為等邊減半周之餘與三等邊同法以同用正弦故斜弧三角形圖二計十二種以上斜弧三角形十二種並二等邊形內有四種以大小二邊度成半周與二等邊同法小邊為大邊減半周之餘則同用一正弦斜弧三角形圖三計十種鋭厯書只九種遺一二鈍形以上斜弧三角形十種並三邊不等用算只四種凡斜弧三角形共二十六種通共弧三角形三十五種內除正弧三種不須用算實三十二種乙丁寅為赤道乙丙癸為黃道乙與寅為春秋分癸為夏至午癸丁辰為極至交圈午與辰為南北極午丙甲為過極經圈丙乙為黃道距二分之度甲乙為赤道距二分之度卯同升度丙甲為黃赤距緯成丙乙甲三角弧形甲為正角乙春秋分角與渾員心卯角相應癸丁弧為黃赤大距即乙角之弧亦為卯角之弧癸巳為乙角正弦卯巳其餘弦戊丁為乙角切線戊卯其割線卯癸及卯丁皆半徑成癸巳卯及戊丁卯兩句股形又午卯半徑庚午為乙角餘切庚卯為乙角餘割成午卯庚倒句股形丙辛為丙甲距度正弦丙壬為丙乙黃道正弦作辛壬線與丁卯平行成丙辛壬句股形子甲為丙甲距度切線甲丑為甲乙赤道正弦作子丑線與丙壬平行成子甲丑句股形酉乙為丙乙黃道切線未乙為甲乙赤道切線作酉未線與子甲平行成酉未乙句股形前二句股形在癸丁大距弧內外癸巳邜用正餘弦在弧內戊丁卯用割切線出弧外後三句股形在丙乙甲三角內外丙辛壬在丙角用兩正弦在渾員內子甲丑在甲角兼用正弦切線半在內半在外酉未乙用兩切線在渾員外論曰此五句股形皆相似故其比例等何也赤道平安從乙視之則丁乙象限與丁卯半徑視之成一線而辛壬聨線甲丑正弦未乙切線皆在此線之上矣以其線皆平安皆在赤道平面與赤道半徑平行故也是為句線赤道平安則黃道之斜倚亦平其癸乙象限與癸卯半徑從乙視之亦成一線而丙壬正弦子丑聨線酉乙切線皆在此線之上矣以其線皆斜倚皆在黃道平面與黃道半徑平行故也是為弦線黃赤道相交成乙角而赤道既平安則從乙窺卯卯乙半徑竟成一點而乙丑壬卯角合成一角矣諸句股形既同角而其句線皆同赤道之平安其弦線皆同黃道之斜倚則其股線皆與赤道半徑為十字正角而平行矣是故形相似而比例皆等也其卯午庚倒句股形為相當之用與諸句股形亦相似而比例等又論曰丙辛壬形兩正弦丙辛丙壬俱在渾體之內其理易明子甲丑形甲丑正弦在渾體內子甲切線在渾體之外已足詫矣酉未乙形兩切線酉乙未乙俱在渾體之外雖習其術者未免自疑厯書置而不言蓋以此耶今為補説詳明欲令學者了然心目庶以用之不疑用法假如有丙乙黃道距春分之度求其距緯丙甲法為半徑癸卯與乙角之正弦癸巳若丙乙黃道之正弦丙壬與丙甲距緯之正弦丙辛也一半徑全數癸卯弦二乙角正弦癸巳股三黃道正弦丙壬弦四距緯正弦丙辛股若先有丙甲距度而求丙乙黃道距二分之度則反用之為乙角之正弦癸巳與半徑癸卯若欲用半徑為一率以省除則為半徑午卯與乙角之餘割庚卯其比例亦同若丙甲距緯之正弦丙辛與丙乙黃道之正弦丙壬也一乙角正弦癸巳半徑全數午卯股二半徑全數癸卯乙角餘割庚卯弦三距緯正弦丙辛股四黃道正弦丙壬弦右丙辛壬形用法假如有甲乙赤道同升度求距緯丙甲法為半徑卯丁與乙角之切線丁戊若甲乙赤道之正弦甲丑與丙甲距緯之切線子甲也一半徑全數卯丁句二乙角正切丁戊股三赤道正弦甲丑句四距緯正切子甲股若先有丙甲距緯而求甲乙赤道則反用之為乙角之切線戊丁與半徑丁卯或用半徑為一率則為半徑卯午與乙角之餘切午庚若丙甲距緯之切線子甲與甲乙赤道之正弦甲丑也一乙角正切戊丁半徑全數卯午股二半徑全數丁卯乙角餘切午庚句三距緯正切子甲股四赤道正弦甲丑句右子甲丑形用法論曰以上四法厯書所有但于圖增一卯午庚句股形則互視之理更明假如有丙乙黃道距二分之度徑求甲乙赤道同升度法為半徑卯癸與乙角之餘弦卯巳若丙乙黃道之切線酉乙與甲乙赤道之切線未乙也一半徑全數卯癸弦二乙角餘弦卯巳句三黃道正切酉乙弦四赤道正切未乙句若先有甲乙赤道而求其所當黃道丙乙法為半徑丁卯與乙角之割線戊卯若甲乙赤道之切線未乙與丙乙黃道之切線酉乙也一半徑全數丁卯句二乙角正割戊卯弦三赤道正切未乙句四黃道正切酉乙弦論曰以上兩條酉未乙形用法豫所補也有此二法黃赤道可以自相求而正角弧形之用始備矣外此仍有三弧割線餘弦之用具如别紙十餘年前曽作弧三角所成句股書一册稿存兒輩行笈中覓之不可得也庚辰年乃復作此至辛己夏復得舊稿為之惘然然其理固先後一揆而説有詳略可以互明不妨並存以徵豫學之進退因思古人畢生平之力而成一事良自不易世有子雲或不以覆瓿置之乎康熙辛己七夕前兩日勿菴梅文鼎識是日也為立秋之辰好雨生涼炎歊頓失稍簡殘帙殊散人懷甲乙丙正弧三角形即測量全義第七卷原圖稍為酌定又增一酉未乙形測員之用甚博非止黃赤也然黃道赤道南北極二分二至諸名皆人所習聞故仍借用其號以便識别案圖中句股形凡五皆形相似其一癸巳卯形以癸卯半徑為弦即黃道半徑癸巳正弦為股即黃赤大距弧之正弦巳卯餘弦為句即黃赤大距弧之餘弦其二戊丁卯形以戊卯割線為弦即黃赤大距弧之正割線戊丁切線為股即黃赤大距弧之正切線丁卯半徑為句即赤道半徑以上二句股形生於黃赤道之大距度乃總法也兩句股形一在渾體之內一出其外同用卯角即黃道心亦即春分角其三丙辛壬形以丙壬正弦為弦即黃經乙丙弧之正弦以丙卯黃道半徑為其全數而卯壬其餘弦丙辛正弦為股即黃赤距緯丙甲弧之正弦亦以丙卯黃道半徑為其全數而辛卯其餘弦辛壬橫線為句法於赤道平面上作橫線聨兩餘弦成卯壬辛平句股形此形以距緯餘弦卯辛為弦黃經餘弦卯壬為股而辛壬其句也此辛壬線既為兩餘弦平句股形之句亦即能為兩正弦立句股形之句矣厯書以辛壬為丙辛之餘弦誤也然則當命為何線曰此非八線中所有乃立三角體之楞線也其四子甲丑形以子丑斜線為弦此亦立三角體之楞線也非八線中之線子甲切線為股即黃赤距緯弧之正切線以赤道半徑甲卯為其全數而子卯其割線也甲丑正弦為句即赤經乙甲弧之正弦亦以赤道半徑甲卯為其全數而丑卯其餘弦也其五酉未乙形以酉乙切線為弦即黃經丙乙弧之正切線以黃赤半徑卯乙為其全數而酉卯其割線也酉未立線為股此亦立三角之楞線非八線中之線未乙切線為句即赤經乙甲弧之正切線亦以黃赤半徑卯乙為其全數而未卯其割線也以上三句股形生於設弧之度第三形在渾體之內第四形半在渾體之內而出其外第五形全在渾體之外問既在體外其狀何如曰設渾圓在立方之內而以兩極居立方底蓋之心以乙春分居立方立面之心則黃赤兩經之切線酉乙未乙皆在方體之立面而未乙必為句酉乙必為弦于是作立線聨之即成酉未乙句股形矣此一形厯書遺之豫所補也詳塹堵測量論曰此五句股形皆同角故其比例等然與弧三角真同者乙角也第一癸巳卯形第二戊丁卯形兩形皆乙角原有之八線即春秋分角也其度則兩至之大距也或先有角以求邊則以此兩形中線例他形中線得線則得邊矣或先有邊以求角則以他形中線例此兩形中線得線則亦得角矣蓋卯角即乙角也若欲求丙角則以丙角當乙角如法求之第三形丙辛壬形以黃經之正弦丙壬黃赤距度之正弦丙辛為弦與股是以黃經與距緯相求或先有乙角有黃經以求距緯用乙角實用壬角下同或先有乙角有距緯以求黃經或先有黃經距緯可求乙角亦可求丙角第四形子甲丑形以黃赤距緯之切線子甲赤經之正弦甲丑為股與句是以距緯與赤經相求或先有乙角有赤經以求距緯用乙角實用丑角下同或先有乙角有距緯以求赤經或先有赤經距緯可求乙角亦可丙角第五形酉未乙形以赤經之正切未乙黃經之正切酉乙為句與弦是黃赤經度相求或先有乙角有黃經以求赤道同升度或先有乙角有赤道同升以求黃經或先有黃赤二經度可求乙角亦可求丙角又論曰諸句股形所用之卯壬丑乙四角實皆乙角何也側望則弧度皆變正弦而體心卯作直線至乙為卯壬丑乙線即半徑也今以側望之故此半徑直線化為一點則乙角即卯角亦即壬角亦即丑角矣癸丁為乙角之度即黃赤大距二至緯度癸乙為黃道半徑丁乙為赤道半徑戊丁為乙角切線癸巳為乙角正弦戊乙為乙角割線已乙為乙角餘弦癸巳乙戊丁乙皆句股形其乙角即卯角丙甲為設弧距度其正弦丙辛其切線子甲丙乙為所設黃道度其正弦丙壬因側望弧度正弦成一線偕距度正弦丙辛成句股形其乙角即壬角甲乙為所設赤道同升度其正弦甲丑因側望弧度正弦成一線偕距度切線子甲成句股形其乙角即丑角酉乙為所設黃經切線未乙為赤道同升度切線此兩線成一酉未乙句股形在體外真用乙角正弧三角形求餘角法凡弧三角有三邊三角先得三件可知餘件與平三角同理前論正弧形以黃赤道為例而但詳乙角者因春分角有一定之度人所易知故先詳之或疑求乙角之法不可施於丙角兹復為之條析如左仍以黃道上過極經圈之交角為例假如有乙丙黃道度有乙甲赤道同升度而求丙交角則為乙丙之正弦與乙甲之正弦若半徑與丙角之正弦也假如有丙甲距度及乙甲同升度而求丙交角則為丙甲之正弦與乙甲之切線若半徑與丙角之切線假如有丙甲距度及乙丙黃道度而求丙交角則為乙丙之切線與丙甲之切線若半徑與丙角之餘弦又如有丙交角有乙丙交道度而求乙甲同升度則為半徑與丙角之正弦若乙丙之正弦與乙甲之正弦或先有乙甲同升度而求乙丙黃道度則以前率更之為丙角之正弦與半徑若乙甲之正弦與乙丙之正弦又如有丙交角有乙甲同升度而求丙甲距度則為丙角之切線與半徑若乙甲之切線與丙甲之正弦或先有丙甲距度而求乙甲同升度則以前率更之為半徑與丙角切線若丙甲正弦與乙甲切線又如有丙交角有乙丙黃道度求丙甲距度則為半徑與丙角餘弦若乙丙切線與丙甲切線或先有丙甲距度而求乙丙黃道則以前率更之為丙角餘弦與半徑若丙甲切線與乙丙切線論曰求丙角之法一一皆同乙角更之而用丙角求餘邊亦如其用乙角也所異者乙角定為春分角則其度不變丙角為過極經圈交黃道之角隨度而移交角近大距則甚大類十字角近春分只六十六度半弱中間交角度度不同他形亦然皆逐度變丙角有時大於乙角有時小於乙角乙角不及半象限則丙角大乙角過半象限則丙角有時小故必求而得之又論曰丙交角既隨度移而甲角常為正角何也凡球上大圈相交成十字者必過其極今過極經圈乃赤道之經線惟二至時則此圈能過黃赤兩極其餘則但過赤道極而不能過黃道極故其交黃道也常為斜角即丙角交赤道則常為正角即甲角又論曰丙角與乙角共此三邊一乙丙黃道一乙甲赤道一丙甲距度其所用比例者亦共此三邊之八線三邊各有正弦亦各有切線而所成句股形遂分兩種可互觀也乙角所成諸句股皆以戊丁卯為例內角所成諸句股皆以亥辰卯為例並如後圖如圖丙角第一層句股兊乙心形即乙角之壬丙辛也在乙角兩正弦交于丙在丙角兩正弦交于乙皆弦與股之比例而同弦不同股乙角丙角並以乙丙黃道正弦為弦而乙角所用之股為丙甲正弦丙角所用則乙甲正弦皆正弦也而弦同股别丙角第二層句股女甲亢形即乙角之子甲丑也乙角丙角並以一正弦一切線交于甲為句與股之比例而所用相反乙角于乙甲用正弦于丙甲用切線丙角則于乙甲用切線于丙甲用正弦皆乙甲丙甲兩弧之正弦切線而所用逈别丙角第三層句股艮丙氐形即乙角之酉乙未也在乙角以兩切線聨于乙在丙角以兩切線交于丙皆弦與句之比例而同弦不同句乙丙兩角並以乙丙切線為弦而乙角以乙甲切線為句丙角以丙甲切線為句皆切線也而弦同句别球面弧三角形弧角同比例解第一題正弧三角形以一角對一邊則各角正弦與對邊之正弦皆為同理之比例如圖乙甲丙弧三角形甲為正角法為半徑與乙角之正弦若乙丙之正弦與丙甲之正弦更之則乙角之正角與對邊丙甲之正弦若半徑與乙丙之正弦也又丙角之正弦與其對邊乙甲之正弦亦若半徑與乙丙之正弦也合之則乙角之正弦與其對邊丙甲之正弦亦若丙角之正弦與其對邊乙甲之正弦論曰乙丙兩角與其對邊之正弦既並以半徑與乙丙為比例則其比例亦自相等而兩角與兩對邊其正弦皆為同比例又論曰甲為正角其度九十而乙丙者甲正角所對之邊也半徑者即九十度之正弦也以半徑比乙丙之正弦即是以甲角之正弦比對邊之正弦故以三角對三邊皆為同比例第二題凡四率比例二宗內有二率三率之數相同則兩理之首末二率為互視之同比例即斜弧比例之所以然故先論之假如有甲乙丙丁四率甲四與乙八若丙六與丁十二皆加倍之比例也又有戊乙丙辛四率戊二與乙八若丙六與辛二十四皆四倍之比例也此兩比例原不同理特以兩理之第二第三同為乙八丙六故兩理之第一第四能互用為同理之比例先理之第一甲四與次理之第四辛二十四若次理之第一戊二與先理之四丁十二皆六倍之比例也論曰凡二率三率相乘為實首率為法得四率今兩理所用之實皆乙八丙六相乘四十八之實惟甲四為法則得十二若戊二為法則得二十四矣法大者得數小法小者得數大而所用之實本同故互用之即為同理之比例也試以先理之四率更為首率其理亦同丁與辛若戊與甲皆加倍比例若反之令兩四率並為首率亦同甲與戊若辛與丁皆折半比例並如後圖第三題斜弧三角形以各角對各邊其正弦皆為同比例乙丙丁斜弧三角形任從乙角作乙甲垂弧至對邊分元形為兩正角形甲為正角依前正角形論各對邊之正弦與所對角之正弦比例皆等乙甲丁形丁角正弦與乙角正弦若半徑即甲角正弦與丁乙正弦是一理也乙甲丙形丙角正弦與乙甲正弦若半徑與乙丙正弦是又一理也兩理之第二同為乙甲第三同為半徑則兩理之首末二率為互視之同比例故丁角之正弦與乙丙之正弦若丙角之正弦與丁乙之正弦也又如法從丁角作丁戊垂弧至對邊分兩形而戊為正角則乙角正弦與丁丙正弦亦若丙角正弦與乙丁正弦又從丙作垂弧分兩形而壬為正角則乙角與丁丙亦若丁角與乙丙一丁角正弦丙角正弦乙丙丁斜弧三角形丁為鈍角法從乙角作乙甲垂弧於形外亦引丙丁弧會於甲成乙甲丁虛形亦湊成乙甲丙虛實合形甲為正角乙甲丁形丁角之正弦與乙甲邊若半徑與乙丁邊正弦一理也乙甲丙形丙角之正弦與乙甲邊若半徑與乙丙正弦又一理也準前論兩理之第二第三既同則丁角正弦與乙丙正弦若丙角正弦與乙丁正弦也論曰丁角在虛形是本形之外角也何以用為內角曰凡鈍角之正弦與外角之正弦同數故用外角如本形角也若用乙角與丁丙邊則作丙庚弧於形外取庚正角其理同上或作丁戊垂弧於形內取戊正角分兩形則如前法並同用法凡弧三角形不論正角斜角但有一角及其對角之一弧則其餘有一角者可以知對角之弧而有一弧者亦可以知對弧之角皆以其正弦用三率比例求之假如乙丁丙三角形先有丁角及相對之乙丙弧則其餘但有丙角可以知乙丁弧有乙角可以知丁丙弧此為角求弧也若有乙丁弧亦可求丙角有丁丙弧亦可求乙角此為弧求角也一丁角正弦一乙丙正弦二乙丙正弦二丁角正弦三丙角正弦乙角正弦三乙丁正弦丁丙正弦四乙丁正弦丁丙正弦四丙角正弦乙角正弦厯算全書卷七
