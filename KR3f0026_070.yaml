body:
  text: 厯算全書卷五十七宣城梅文鼎撰㡬何補編卷一四等面形算法先算平三角形平三角形三邊同者求中得中長線乙甲其三之一即内容平圓半徑心甲其三之二即外切圓之半徑乙心或心丙又法以邊半之丙甲自乘得數丙庚方取其三之一開方甲壬小方得容圓之半徑壬癸或甲癸俱與心甲等又取自乘數丙庚方三分加一丙庚方加壬甲小方并而開方得外切圓之半徑丙心論曰三邊角等則半邊之角六十度丙心甲角其餘角三十度心丙甲角内容圓半徑為三十度之正弦心甲外切圓半徑如全數丙心其比例為一與二故内容圓半徑心甲正得外切圓半徑丙心之半也此論可解前一條形内丙心甲與乙心丁兩小句股形相等又並與乙甲丙大句股形相似何則乙角丙角並分原等角之半丁甲等為正角則三角皆等而邊之比例等而大形之句丙甲旣為其弦乙丙之半則小形之句心丁亦即心甲自必各為其弦心乙亦即心丙之半故知心甲原同心丁為乙甲之半也心甲旣為心丙之半則心甲一心丙必二而丙戊必三矣乙甲同何也以乙心與丙心同為二心甲與心戊同為一也聯心乙二與心甲一豈不成三今以内圓半徑為股心甲外圓半徑為弦心丙三邊之半為句丙甲成心甲丙句股形則心丙自乘内弦幂有心甲股幂及甲丙句幂兩自乘之積也而心甲股與心丙弦旣為一與二之比例則心甲之幂一心丙之幂必四也以心甲股幂一減心丙弦幂四其餘積三即丙甲句幂矣故心甲之幂一則丙甲之幂三心丙之幂四今先得邊故以丙甲三為主而取其三之一為心甲股幂又於丙甲三加三之一為四即成心丙弦幂也此論可解後一條以上俱明三等邊平面之比例今作四面等體求其心法自乙頂向子向甲剖切之成乙子甲三角面心者面之心中者體之心前圖所謂心者面之心也今所求者體之心即後圖所謂中也故必以剖而後見次求甲丑線乙子邊平分于丑從丑向甲得垂線此丑甲垂線在體中必小於乙甲在外之垂線故乙甲如弦丑甲如股乙丑如句也法以甲乙弦自乘内減乙丑句幂餘為股幂開方得丑甲又法凖前論乙丑之幂三即丙甲皆半邊故則乙甲之幂九乙甲三倍大于心甲故心甲幂一則乙甲幂九以三減九餘六亦即甲丑股幂矣以開方得甲丑捷法倍原半邊甲丙自乘數以開方得甲乙中垂線或半原邊丙己自乘之數開方亦得甲丑丙甲之幂三乙丑同則甲丑之幂六而丙己之幂十二也甲丑與丙己幂積之比例為一與二次求心中線捷法但半心甲自乘即心中幂論曰心甲與心中猶甲丑與乙丑也甲丑幂與乙丑幂為六與三則心甲與心中之幂亦如二與一又捷法心中之幂一心甲之幂二則乙丑之幂六即丙甲而心丙之幂八亦即乙心俱倍數但以半邊乙丑或丙甲之幂取六之一即心中幂開方得心中即四等面形内容小渾圓之半徑也心中線者即各面之心至體心也故為内容小渾圓半徑以心中之幂一句加乙心之幂八股并之為弦幂九開方得中乙或中子或用前總圖則為甲丙為甲己並同是即四等面形外切渾圓之半徑也外切圓之冪九中乙内切圓之冪一心中得其根之比例為三與一故四等面形内容渾圓之徑一則其外切渾圓之徑三又捷法但以乙丑半邊之幂加五即二之一為中乙或中子等幂開方得外切圓之半徑葢乙丑之幂六中乙之幂九其比例為一有半也此四邊不等形又為三角立錐形為四等面形四之一各自中切至邊線成此形其底三邊等即四等面形之一面其髙為中心即内容小渾圓之半徑其中乙等三楞線三倍大於中心之髙即外切渾圓之半徑取四等面形全積捷法先取面幂即前圖乙己丙平面依前比例求其幂以内容圓半徑心中乘之得數四因三歸見積法曰丙甲半邊之幂三則甲乙中長之幂九開方得中長乙甲以乘丙甲得乙己丙三等邊之幂積即四等面形之一面也次求本積四之一即各面輳心剖裂之形如右圖丙申半邊之冪六則中心之冪一開方得中心髙以乗所得面冪而三分取其一即為四等面形四之一於是四乗之即為全積也又㨗法以丙甲乗心甲又以中心乗之即得本形四之一即同三除以心甲為乙甲三之一故也此帶縱小立方形與右圖四等面形四之一等積又㨗法以丙己全邊亦即丙乙乗乙心再以中心乗即得本形全積乙心為心甲之倍數丙己為丙甲之倍數用以相乗則得丙甲乗心甲之四倍數也邊設一百依上法求容丙己邊一百其冪一萬丙甲半邊五十其冪二千五百三因之得七千五百為乙甲中垂之幂丙甲股幂減丙己弦冪得句幂也丙己亦即丙乙平方開之得八十六六二五為乙甲其三之一得二十八八六七五為心甲其三之二得五十七七三五為心乙又置丙甲幂二千五百取六之一為心中幂得四百一十六六六不盡開方得心中之髙二十零四一二四亦即内容渾圓之半徑依上法以丙己全邊一百乘乙心五十七七三五得五千七百七十三半又以心中二十零四一二四乘之得全積一十一萬七千八百五十一弱與厯書微不同四等面體求心捷法准前論心中幂一則心甲幂二中乙幂九乙丑幂六以句股法考之則中甲與中丑之幂俱三也何也心中甲句股形以中甲為弦故心中句幂一心甲股幂二并之為中甲弦幂三也而乙中丑句股形以中丑為句故乙中弦幂九内減乙丑股幂六其餘為中丑句幂亦三也由是徴之則中丑與中甲正相等但如法求得甲丑線折半得中㸃即為體心又捷法取乙丑幂即原設邊折半自乗半之為中丑幂開方得中丑亦得甲中或乙子全邊自乘取八之一為甲中幂亦同中丑即原邊乙子距體心之度甲中即原邊丙己距體心之度而中為體心想甲㸃在丙己邊折半之處今從側立觀之則線化為㸃而丙己與甲成一㸃故從丙己原邊依楞直剖至乙子對邊即成甲丑線其線即所剖面之側立形此圖即前圖甲丑線所切之面葢面側視則成線矣原設四等面全形今依子丑乙楞剖至甲則成縱剖圖故甲㸃内有丙己線若依丙甲己楞剖至丑則成横剖圖故丑㸃内有子乙也縱剖有三依子乙楞剖至甲而平分丙己邊於甲一也依丙乙楞剖而平分子巳邊二也依己乙楞剖而平分子丙邊三也横剖亦三依丙己楞剖至丑而平分子乙邊于丑一也依子丙邊剖而平分乙己邊二也依子巳楞邊剖而平分丙乙邊三也其所剖之面並相似皆以中㸃為三對角垂線相交之心一率一一七八五一例容二率一例邊之立方積三率一設容四率八四八五二九設邊之立方積開方得根二百四弱為公積一百萬之四等面體楞與比例規解合若商四數則其平廉積四十八萬長廉積九千六百其隅積六十四共得四十八萬九千六百六十四不足四千三百七十四為少百分之一弱故比例規解竟取整數也計開四等面諸數邊一百積一十一萬七八五一積一百萬邊二百三九六内容渾圓半徑二十四一二四内容渾圓全徑四十八二四八外切渾圓半徑六十一二一外切渾圓全徑一百念二四二互剖求心之圖設邊一百其幂一萬丙己乙子乙丙乙己子丙子己並同為外切渾圓徑幂三之二半邊五十其幂二千五百丙甲甲己乙丑丑子等並同為邊幂四之一斜垂線之幂七千五百乙心甲子角甲丙亢丑己氐丑並同為邊幂四之三其根八十六六二五斜垂線三之一二十八八六七五其幂八百三十三三三即外切渾圓徑幂十八之一為邊幂十二之一即各面内容平圓半徑心甲角甲亢丑氐丑並同斜垂線三之二五十七七三五其幂三千三百三十三三三乙心子角丙亢己氐並同内容渾圓半徑二十四一二四其幂四百一十六六六不盡為邊幂二十四之一即外切渾圓三十六之一即分體中髙心中角中亢中氐中並同若内圓全徑之幂則一千六百六十六六六為邊幂六之一外切渾圓徑幂九之一外切渾圓半徑六十一二三七二其幂三千七百五十即分體之立面楞乙中子中丙中己中並同四因之為渾圓全徑幂一萬五千其徑一百二十二四七四四又外切正相容之立方其幂五千為四等面邊幂之半即斜方之比例又為外切渾圓徑幂三之一一率外切渾圓徑一百二十二四七四四二率四等面之邊一百三率渾圓徑一百四率内容四等面邊八十一六四九六又捷法渾圓徑幂一萬五千則内容四等面邊幂一萬或内容立方面之斜亦同為渾圓徑幂三之二若設渾圓徑一百其幂一萬則内容四等面邊之幂六千六百六十六六六亦三之二也平方開之得八十一六四九六為四等面邊即内容立方之斜内容立方面幂三千三百三十三三三為渾圓徑幂三之一即方斜之半幂亦即四等面邊幂之半平方開之得五十七七三五是為渾圓徑一百内容立方之邊亦即渾圓内容立方立方又容小圓之徑若於四等面内又容渾圓則其徑幂一千一百一十一一一為渾圓徑幂九之一為四等面幂六之一立方面幂三之一開得平方根三十三三三不盡幂九之一則其根必三之一也為内容小渾圓之徑以徑乗幂得三萬七千三十七為徑上立方積以十一乗十四除得二萬九千一百半為圓柱積柱積取三之二得一萬九千四百為小渾圓積得大渾圓二十七之一以小渾圓積二十七因之得五十二萬三千九百為四等面外切大渾圓積即徑一百之渾圓積也互剖求心法凡四等面體任以一尖為頂則其垂線為自尖至相對之平面心亦即平面容圓之心而以餘三尖為底其垂線至底之㸃旁距三尖皆等即乙心丙心己心三線之距心皆等而以子尖為頂其垂線為子中心其底為乙丙己平三角面餘倣此此為正形各尖皆可為頂其法並同若以子中心垂線為軸而旋之則成圓角體凡四等面體任平分一邊而平分之㸃為頂以作垂線則其垂線自此㸃至對邊之平分㸃而以對邊為底底無面但有邊底邊與頂邊相午直正如十字形假如以子乙邊平分於丑以線綴而懸之則其垂線至所對丙己邊之平分正中為甲㸃其線為丑中甲而子乙邊衡扵上則丙己邊縱於下正如十字無左右之欹亦無髙下之微差也若以丑中甲垂線為軸旋之則成圓柱體凡四等面體以其邊為斜線而求其方以作立方則此立方能容四等面體何以知之曰准前論以一邊衡於上而為立方上一面之斜則其相對之一邊必縱於下而為立方底面之斜矣又此二邊之勢旣如十字相午直而又分於上下為立方上下兩面之斜線然則自上面之各一端向底面之各一端聯為直線即為四等面之餘四邊亦即立方餘四面之斜如此則四等面之六邊各為立方形六面之斜線而為正相容之體如前所論圓角體圓柱體雖亦能容四等面形而垂線皆小於圓徑故不得為正相容捷法四等面之邊自乘折半開方即正相容之立方根即弦倍句股意設邊一百其幂一萬折半五千即為立方一面之積求其立方根得七十七一六即丑中甲垂線之髙若以此作容四等面之圓柱則其髙七十七一六同立方之方根而其圓徑一百同立方面之斜此圓柱内可函立方其乙中子中等為自四等面體心至各角之線又為立方心至各角之線又為外切渾圓之半徑又為四等面分為四體之楞線又為立方分為六方錐之楞線又捷法以四等面之邊幂加二分之一開方即外切正相容之渾圓徑亦即立方體内對角線如自乙至震折半為自心至角線四等面設邊一百其幂一萬用捷法二分加一得一萬五千為外切正相容之渾圓全徑幂開方得一百二十二四七四四為渾圓全徑折半得六十一二三七二為渾圓半徑立方内容四等面圖設立方邊一百其積百萬内容四等面邊一百四十一四二一三其積三十三萬三千三百三十三三三三三為立方積三之一乾坤震㢲立方乾丙坤己乙㢲子震與中心之丑甲同髙内容子乙丙己四等面為立方積三之一何以明之凡錐體為同底同髙之柱體三之一今自立方之乙角依斜線剖至丙巳成乙丙巳㢲三角錐以丙巳㢲立方之半底為底又自子角斜剖至丙巳成子丙巳震錐以丙巳震立方之半底為底合丙半底則與立方同底矣而子震與乙㢲之髙即立方髙也是此二錐得立方三之一矣又自子乙斜線斜剖至巳角成倒錐以子乙坤立方之半頂為底以坤巳立方髙為髙又自子乙斜剖至丙角亦成倒卓之錐以子乙乾立方之半頂為底以乾丙立方髙為髙與前二錐同亦三之一也合此二錐共得立方三之二則其餘為子乙丙巳四等面體者必立方三之一矣准此論之凡同邊之八等面積四倍大於四等面積何以知之以此所剖之四錐體合之則為八等面之半體皆以剖處為面而其邊其面皆與四等面等是同邊之體也而八等面之半體旣倍大於四等面則其全體必四倍之矣設八等面邊一百四十一四二一三與四等面同邊則八等面之積一百三十三萬三千三百三十三三三不盡為四等面之四倍若設四等面邊一百則其外切之立方面幂五十立方根七十七一六以根乘幂得立方積三十五萬三千五百五十三四等面積一十一萬七千八百五十一為立方積三之一推得八等面邊一百其積四十七萬一千四百四此同邊之比例若立方内容之八等面則其積為立方内容之四等面二之一何以知之八等面與立方同髙則其積為立方六之一故也設立方邊一百内容八等面邊七十七一六其積一十六萬六千六百六十六為四等面之半若設立方邊七十七一六則内容八等面積五萬八千九百二十五半其邊五十四等面體又容小立方小立方内又容小四等面體則内容小立方徑為外切立方三之一内小四等面在小立方内其徑亦為四等面三之一而其積皆二十七之一何以知之凡三等邊平面之心皆居垂線三之一假如子巳丙為四等面之一面其平面之心必在癸而子甲垂線分三之一為癸甲其餘三面盡同而内容之小立方必以其下方之兩角縱切子巳丙之癸心及乙己丙之壬心其上方之兩㸃必横切於子乙己之卯心及子乙丙之申心而立方内容之小四等面亦必以其四角同切此四㸃也今壬癸兩㸃旣下距丙己線為其各斜垂線三之一而卯申兩㸃又上距子乙線之斜垂線亦三之一則其中所餘三之一必為立方所居也而内小立方不得不為子乙與丙己相距線三之一矣問癸㸃為三之一者斜面之垂線也小立方者直立線也何以得同為三之一乎答曰癸㸃所居三之一雖在斜面而子乙縱線與丙己横線上下相距必有垂線直立於其心此直立垂線即前圖之甲丑與外切立方線同髙者也丑甲中垂線以上停三之一之上㸃與卯申平對以下停三之一之下㸃與壬癸平對依句股法弦與股比例同也然則丑甲線之中停即小立方之所居矣又丑甲者即外切立方之髙也故知小立方徑為外切立方徑三之一又小四等面在小立方内以其邊為小立方之斜而縱横邊相午對如十字其中心亦以丑甲線之中停為其軸其斜面之勢一切皆與大四等面同而丑甲者亦大四等面之軸也小四等面之中軸旣為丑甲三之一其餘一切皆三之一矣夫體積生於邊者也邊為三之一者面必為九之一體必為二十七之一無疑也准此論之渾圓在四等面内者亦必為外切渾圓二十七之一其徑亦三之一也何也渾圓之切㸃與小立方小四等面之切㸃並同也以此推知小立方與小四等面在大四等面内或居小渾圓内以居大四等面内其徑積並同求體積渾圓徑一百其徑上立方一百萬依立圓法以十一乘十四除得七十八萬五千七百一十四為圓柱積仍三分取二得五十二萬三千八百九為渾圓積内容立方面幂三千三百三十三三三其邊五十七七三五以邊為髙乘面得一十九萬二千四百五十為内容立方積内容四等面體邊幂六千六百六十六六六其邊八十一六四九六依前論四等面體為立方三之一得六萬四千一百五十為四等面積立方内容小渾圓以立方之邊為徑五十七七三五依立圓法以立方積十一乘十四除得一十五萬一千二百一十為圓柱積取三之二得一十萬八百六十六為小立圓積四等面内容小渾圓徑幂一千一百一十一一一其徑三十三三三以徑乘幂得徑上立方積三萬七千三十七以十一乘十四除得二萬九千一百半為圓柱積又三分取一得一萬九千四百為立方内之四等面内容小渾圓積為大渾圓積二十七之一若先有内小渾圓積但以二十七因之得大渾圓積依此論之凡渾圓内容立方立方内又容四等面體四等面内又容小渾圓其内外相似之大小二體皆二十七之比例也又捷法用方斜比例立方面之斜設一百其冪一萬則其方冪五千用三因之得一萬五千開方得立方對角斜線即為外切渾圓全徑立方面之斜一百即立方内容四等面之邊立方體對角斜線一百二十二四七四四即立方外切渾圓之全徑亦即四等面外切渾圓全徑半之得六十一二三七三即立方外切渾圓半徑亦即立方體心至各角之線亦即四等面體心至各角之線八等面形圖註第一合形甲丁甲丙甲己甲戊丁丙丙己己戊戊丁戊乙己乙丁乙丙乙以上形外之楞凡十有二即根數也其長皆等或設一百為一楞之數則十二楞皆一百也甲丁戊甲戊己甲己丙甲丙丁丙丁乙己丙乙戊己乙丁戊乙以上形周之分面凡八皆等邊平三角形也其容積其邊皆等或設一百為邊數則三邊皆一百而形周之分面八皆三邊邊皆一百也第二横切形二甲丁丙己戊為上半俯形丁丙己戊乙為下半仰形右二形各得合形之半皆從丁戊楞横剖至己丙一俯一仰皆方錐扁形丁丙己戊為方錐之底其邊皆等其從四角凑至頂之楞皆與底之邊等第三直切形四從甲尖依前後楞直剖過丁己至乙尖成左右兩形從甲尖依左右楞直剖過丙戊至乙尖成前後兩形此四形者一切皆與仰俯二形同但彼為眠坐之體故為方錐仰者即倒卓方錐而此則立體即如打倒方錐之形也第四横切之面一直切之面二因横剖得正方平面在立方錐以此為底倒方錐以此為面在合形則為腰圍其己丁及丙戊兩對角斜線相交於心即兩直切之界也心即合形中心因直剖得斜立方面二其己丁及戊丙横對角線即横切之界其從甲至乙垂線即直剖之界如立面在前後互剖之形則此線為左右直剖之界彼此互為之也亦即為全形之中髙徑線以此知八等面之中髙線為方斜之比例第五分形因横剖及兩直剖分總形為八皆三角錐形也皆以等邊平三角形面為錐形之底而以横直剖線相交處之點為其銳頂即合形之中心也其自頂心至角之楞皆等皆邊線之方斜比例也底線為方則此線為其斜之半而此楞線又即為八等面形之外切圓之半徑設己戊邊一百其幂一萬則心戊楞之幂五千倍戊庚半邊之幂為半斜幂也戊心之幂五千内減戊庚幂二千五百則其餘二千五百為心庚之幂故心庚必與戊庚等從心頂對己庚楞直剖至庚分形為兩則其中剖處成三角平面己庚者乙己戊等邊三角平面之中垂線也其幂為邊四之三設邊一百之幂一萬則己庚之幂七千五百庚辛者平面三角容圓之半徑也得己庚三之一其幂則九之一也己庚之幂七千五百則庚辛之幂八百三十三三三辛㸃即各三角平面之中心以庚辛幂八百三十三三三減心庚幂二千五百得心辛幂一千六百六十六開方為心辛即分形之中髙也求得分形中髙四十八二四七依平面三等邊法設邊一百其中長線八十六六二五其幂積得四千三百三十一二五取平幂三之一得一千四百四十三三七五以乘中髙得分形積五萬八千九百二十五三五一三再以八因之得總積四十七萬一千四百二八一四與總算合設八等面之邊一百其幂一即横剖中腰之正方半之為每角輳心之線之幂得五此線即分形自底角輳頂心之楞如心戊心己心乙又為八等面形外切渾圓之半徑又半之為分形每面自頂至邊斜垂線之幂即心庚得二五此線即設邊之半其幂為設邊四之一設半邊之幂取其三之二為分形中髙線之幂即心辛得一六六六不盡又為八等面形内容渾圓之半徑㨗法取八等面設邊之幂六而一為八分體中髙之幂開方得中髙假如設邊一百其幂一萬則分體中髙之幂一千六百六十六不盡求其根得四十八二四八以中髙乘三角平面幂三除之得分體八因之得全積又捷法八等面設邊之幂取三之二為體内容渾圓之徑幂開方得内容渾圓徑折半為八分體中髙假如設邊一百其幂一萬則内容渾圓之徑幂六千六百六十六不盡求其根得八十一六四九六折半為分體中髙或竟以内容渾圓全徑乘設面三角平幂四因三除之得全積又捷法此方斜之比例八等面設邊之幂倍之為體外切圓徑幂開方得徑以乘設邊之幂即腰廣平方得數三歸見積假如設邊一百其幂一萬其斜如弦弦之幂倍方幂得二萬求其根得一百四十一四二一三以乘腰廣一萬得一百四十一萬四千二百一十三三除之得總積四十七萬一千四百四一系八等面體之邊上幂與其外切渾圓之徑上幂其比例為一與二方斜比例一系八等面體之邊上幂與其内容渾圓之徑上幂其比例為三與二一系八等面體外切渾圓之徑上幂與其内容渾圓之徑上幂其比例為三與一准此而知八等面内容渾圓渾圓内又容八等面其渾圓外切之八等面邊或徑上幂與内容之八等面邊或徑上幂其比例亦必為三與一也計開八等面形諸數設邊一百其積四十七萬一四四與厯書所差甚微其體外切渾圓之徑一百四十一内外兩渾圓之徑幂為三與一其根約為四與七而强體内容渾圓之八十一八等面外切立方徑一百四十一方斜比例也與外切渾圓同八等面内容立方徑四十七内外切大小立方之徑之比例為三與一内外兩立方之積之比例為二十七與一若渾圓内容立方立方内容八等面體八等面體内又容渾圓則大小兩渾圓之徑亦若三與一其積亦若二十七與一一率四七一四四例容二率一例邊之立方三率一設積四率二一二一三二二設邊之立積開立方得根一百二十八為公積一百萬之八等面根與比例規解合㡬何補編卷二二十等面形自腰切之成十等邊平面先求甲丁乃十等邊平面從心對角之線亦即二十分形各三角立體一面之中垂斜線法為甲乙即切形十等邊之半在原設二十等面形邊為四之一與甲丁若十八度之正弦與全數也十等邊各三十六度其半十八度設邊一百所切十等邊平面之邊五十其半甲乙二十五一率十八度正弦三九二率全數一三率甲乙二五四率甲丁八九六一用等邊三角求容圓法設邊一百其内容圓半徑二十八八六七五為心甲以心甲為句二十八八六七五其幂八百三十三三三二五以甲丁為弦八十九六一其幂六千五百四十五七九七句幂減弦幂餘五千七百一十二四六四五為心丁股幂開方得心丁七十五五八八此即各面切形自各面之心至切體尖之髙也其切體之尖即原設二十等面總形之體心為丁點用後法得乙己丙平面幂積四千三百三十一二五又依三等邊角形設邊一百丙己其半五十丙甲求到乙甲中長八十六六二五用其三之一即心甲二十八八六七五以與丙甲五十相乘得一千四百四十三三七五為各等面平積三之一三因之得平面幂又以丁心七十五五八八乘之得一十萬九千九十一四三七二為二十等面形分切每面至心之積又以二十乘之得全積依上法求到二十等面全積設邊一百其積二百一十八萬一千八百二十八查比例規解差不多惟測量全義差逺按此法以本形分為二十各成三角立錐形而各以分形之髙乘底取三之一以為分形積然後以等面二十為法乘而并之得總積可謂的確不易矣然與厯書中比例規解及測量全義俱不合何耶計開二十等面形設邊一百其每面中長線八十六六二五其每面幂積四千三百三十一二五其每面容平圓之心作線至形心之丁七十五五八八即心丁心丁即内容渾圓之半徑其分形各以每面之幂積為底心丁為髙各得三角立錐積一十萬九千九十一四三七二其立錐積凡二十合之得總積二百一十八萬一千八百二十八用上法求形内容渾圓其心丁七十五五八八即内容渾圓半徑以心丁線與各平面作垂線而丁㸃即體心故倍之得一百五十一一六一六為内容渾圓全徑置小渾圓徑一百五十一零自乘得二萬二千八百一以十一乘十四除得一萬七千九百一十五為圓幂置内容渾圓之平圓幂一七九一五以圓徑一百五十一取三之二得一百强以乘平圓幂得一百八十萬二千二百四十九為二十等面内容渾圓之積置内容圓徑一百五十一自乘得二萬二千八百一再乘三百四十四萬二千九百五十一以立員捷法五二三五九八七七乘之得渾圓積一百八十萬二千七百二十五先用宻率十四除十一乘得渾圓一百八十萬二千二百四十九以較立圓捷法所得少尾數四百七十六約為一萬八千之五弱不足為差也依立圓法以圓率三一四一五九二乘立圓法六而一得五十二萬三五九八為徑一百之渾圓積依法求得立方邊五十七七三五立方積一十九萬二四五四等面積六萬四千一百五十並合前算小渾積一七六六若用捷法以渾圓率五二三五九八乘立方積得數後去末六位亦得一十萬七六六内容渾圓尚且如此之大况二十等面之形又大於内圓乎然則厯書之率其非確數明矣二十等面一率二一八一八二八例容二率一例根一百之體積三率一設容四率四五八三三二所求根立積如法算得二十等面之容一百萬其根七十七比例規解作七十六尚差不多測量全義云二十等邊設一百其容五二三八九則大相懸絶矣乆知其誤今乃得其確算己未年所定之率以兩書酌而為之究竟不是今乃得之可見學問必欲求根也二十等面分體之圖亥子戌為二十等面之一面亦即各分體之底亥子子戍戍亥皆其邊即根也半之為亥甲甲乙丙為横邊切處即横切成十等邊形之一邊丁為體心亦即切十等邊平面之中心甲乙丙丁即横切十等邊平面之分形心為二十等面每面之正中心丁為體周各平面至體心之垂線亦即分體之中髙亦即體内容渾圓之半徑丁亥丁子丁戌皆分體之楞線乃自各分面角輳體心之稜也亦即為外切渾圓之半徑丁甲丁丙皆横切平面各角輳心之線亦即分體各斜面之中垂斜線也求法以丁甲為股亥甲為句即根之半兩幂相并開方得弦即丁亥也丁子丁戌同求二十等面外切渾圓之半徑依句股法以丁甲股八十九六一自乘幂六千五百四十五七九七亥甲句五十自乘幂二千五百相并為亥丁弦幂九千四十五七九七平方開之得亥丁九十五一五二為外切渾圓半徑亦即二十分形自其各角輳心之稜倍之得一百九十二一四即外切渾圓全徑計開二十等面體諸數設邊一百其容二百一十八萬一千八百二十八其内容渾圓徑一百五十一其外切渾圓一百九十其每面中心至體心七十五半即内容渾圓之半徑其每面各角至體心九十五即外切渾圓之半徑計開二十等面體諸用數設邊一百外切立方之半徑八十九一七為體心至邊之半徑即寅中卯中辰中等倍之為邊至邊一百六十一八三四即外切立方全徑外切渾圓之半徑九十五一五六為體心至各角尖之半徑即甲中戊中心中等倍之為角尖至角尖一百九十二一一二即外切渾圓全徑内容渾圓及内容十二等面之半徑七十五五七六一為體心至各面之半徑即己中庚中等倍之為内容渾圓全徑一百五十一一五二二為面至面内容十二等面之邊五十三九三四四每面之幂四千三百三十一二五二十等面之幂共八萬六千六百二半分體積一十萬九千八十四六五為二十等面體積二十之一合之得全積二百一十八萬一千六百九十三内容小立方之邊八十七二六七七以内容立圓徑自乘乏幂取三之一開方得之内容燈體邊五十即原邊之半立方内容二十等邊算法亢卯寅房為立方全徑一百中寅中卯為半徑五十寅卯二點為二十等面邊折半之界寅卯線為二十等面邊之半中為體之中心寅中卯角為三十六度中寅半徑當理分中末之全數寅卯即理分中末之大分甲戊戊心心甲皆寅卯之倍數即二十等面之邊其數六十一八三三九八甲辰半邊三十九一六六九與寅卯同心辰垂線五十三五二三三半垂線心箕二十六七六一六甲辰幂九百五十四九一五三因甲辰幂為心辰幂二千八百六十四七四五不盡計開立方徑設一百半徑五十理分中末線大分六十一八三三九八即二十等面之邊論曰以中寅半徑五十求寅卯正得理分中末大分之半而甲戊邊原倍於寅卯寅房全徑亦倍於寅中是全數與大分皆倍也故徑以全數當寅房全徑以理分中末之大分當甲戊等二十等邊之全邊也又立方邊設一百即寅房徑半之五十即中寅内容二十等面之邊六十一八三三九八即甲戊等面之中垂線五十三五二三三即心辰中垂線之半二十六七六一六即心箕面之幂一千六百五十三九五七八甲戊心面中垂線三之一得一十七八四一一即心己内容立圓半徑四十六七八六即己中全徑九十三四一七二二十等面全積五十一萬五千二十六九五九七約法立方根與所容二十等面之邊若全數與理分中末之大分面幂三之一以乘容圓全徑得數十之為全積中垂線三之一心己為句即平面容員半徑自乘得句幂三百一十八三四八四九以減中寅弦幂二千五百餘己中股幂二千一百八十一六九五一五一開方得己中根四十六七八六二十等面邊設一百用理分中末線求其外切之立方一率二十等面邊六十一八三三九八二率外切立方一百三率二十等面邊一百四率外切立方一百六十一八三四依法求得二十等面邊一百其外切立方一百六十一八三四與先所細算合半圓内容正方法以圓徑為三率丙丁理分中末之小分為二率庚辛理分中末全線加小分為首率丁辛為全線再加庚辛為小分共得為丁庚總線也二三相乘一率除之得四率丙乙即甲丁為全徑之小分以減全徑餘乙丁乃于乙作正十字線至圓界如己乙即以此線自乘作正方己甲如所求論曰己乙即丙乙與乙丁之中率而丙乙旣為乙丁全徑之小分則己乙即大分也而甲乙亦為大分甲丁亦為小分矣若自甲作甲戊必與己乙甲乙等而其形正方半渾圓内容立方法以乙甲圓徑自乘之幂取其六之一開方得容方根丙丁方丙戊邊論曰試倍甲丙乙庚半渾圓為全渾圓體亦倍丙丁正方形作丙己長立方形亦必能容矣然則丙己線在長立方形之内為斜線者亦即渾圓之徑也與甲乙徑等試於長立方面作戊己斜弦則己壬為之句戊壬為之股而戊己弦幂内有己壬幂與戊壬幂矣而丙己線為弦則戊己又為股丙戊又為句而丙己自幂内又兼有戊己幂及丙戊幂矣丙戊亦即己壬又戊壬為己壬即丙戊亦即戊癸之四倍則戊壬股幂内有己壬句幂四合之為戊己弦幂則戊己幂内有己壬幂五矣而丙己弦幂内復兼有戊己股幂及丙戊句幂是丙己幂内有丙戊幂六也丙己旣同圓徑則取其幂六之一開方必丙戊容方邊矣立方内容十二等面其内又容立方此相容比例立圓内容十二等面其内又容立方此立方之面幂為外圓徑上面幂三之一而立方之各角即同十二等面角以切於立圓之面法以外切渾圓徑上幂取三之一為十二等面内小立方幂平方開之得小立方根根乘幂見積又簡法以十二等面之面幂求其横剖之大線此線即十二等面内容小方之邊如圖作甲乙線剖一面為二此線在面中最大即為内小立方根以此自乘而三之即小立方外切渾圓徑幂凡立方内容二十等面二十等面内又容渾圓圓内又容小立方此小立方之各角能同渾圓之切點以切於二十等面之平面心法以内容渾圓徑之幂取三之一為内小立方之幂平方開之得切點相距即小立方根以根乘幂見積簡法取内容渾圓之内小立方邊求其理分中末之大分為内容十二等面邊又簡法如前求得二十等面内容十二等面之一面乃求其横剖之大線即二十等面内容小立方之根以根自乘而三之即二十等面内容渾圓之徑幂開方得根即内容渾圓徑折半為分體之中髙此二十等面之面作三分之一横剖此十二等面之面在二十等面内此五等面邊即前横線所成凡五等邊平面其邊即七十二度之通弦横剖大線即一百四十四度之通弦各折半為正弦可以徑求一率三十六度正弦二率七十二度正弦三率五等邊之一邊四率横剖之大線凡十二等面體與二十等面體可互相容而不窮十二等面體有二十尖二十等面體有十二尖其各尖之相距必均其互相容也皆能以其在内之尖切在外各面之中心而徧凡二十等面内容立圓仍可以容二十等面二十等面内容立圓仍可以容十二等面甲心乙乙心丙丙心丁丁心戊戊心甲皆二十等面之一面其各三邊皆等各以庚辛壬癸己為其面之心若内容十二等面體則十二等面之各尖必切於庚辛壬癸己等心點今求内容十二等面之邊則必以庚辛等心點聮為直線即成五等邊面之邊而與十二等面之形相似而可以相容矣法當以邊如甲戊半之如甲辰作對心垂線如辰心成心辰甲句股形既得己卯倍之為己庚即内容十二等面之一邊二十等面體内容十二等面之圖第一圖原形如五面扁錐心尖鋭起甲心戊等三等邊平面凡五共輳而成一心尖乃二十等面四之一其己庚辛壬癸五點皆三等邊平面之中心亦即内容十二等面之稜尖所切故必先求此點簡法曰以甲戊邊半之於辰作辰心對角斜垂線又以心甲心戊各取三分之二為心子心丑乃聮子丑為線與甲戊邊平行與辰心垂線十字交於己點則己點即甲心戊平面之心再從子至午作與邊平行線線之半即庚點餘三面盡如此作平行線則辛點在午未線壬點在未酉線癸點在酉丑線但半之皆得心矣第二圖剖形是五等邊平面因前圖所作子丑等平行線横剖之去其中髙之尖成子午未酉丑五等邉平面此平面之心點在前圖心頂之内惟子丑等邉線是原形所作平行線在體外可見餘皆以剖而成乃從各角作線至心如子心等分形為五皆平面三角形而心子等線皆小於子丑邉因子己原邉及子心丑角求得心己垂線及子心對角線第三圖正用之形即内容十二等面之一面因前第二圖各平分其邉得己庚辛壬癸五點即原形之平面心又聮此點作己庚等直線則成此形以此形為内容十二等面之一面則己庚等五點為十二等面之鋭角而皆切二十等靣之平面心矣求己庚線法因心子對角線及心己垂線子己原半邊得己卯倍之為己庚第一圖設二十等面邊一百甲戊等五邊甲心等五輳頂線並同則子心六十六六六子丑平行線同皆為原邊三之二心己斜垂線五十七七三五為心辰斜垂線三之二以上用第一圖乃斜立面也第二圖子己半邊三十三三三子心對角線五十六七九九己心垂線四十五八七九二法為全數與五十四度之割線一七一三若子己邊與子心也子己乘割線以全數十萬而一得子心又全數與五十四之切線一三七六三八若子己邊與己心也子己乘切線以全數十萬而一得己心凡全數除降五位第三圖仍從第二圖生己庚等兩平面心相距線五十三五八一六其半己卯二十六七九八法為子心對角線與己子半邊若己垂線與己卯也倍己卯得己庚求得二十等面邊一百内容十二等面其邊五十三五八一六㨗法但用法聮兩平面之中心點即為内容十二等面之邊兩平面心相聮為直線之圖乙心甲及戊心甲兩等邊平三角面以甲心邊為同用之邊而甲心隆起如屋之山脊兩平面之中心為己為庚聮為己庚線與甲心為十字然不𦂳相切何也甲心既隆起則甲心折半之卯在己庚折半之栁點上其距為卯栁試側視之則甲心戊面變為戊卯線甲心乙面變為卯乙線而甲卯心線變為卯點己庚點在平面原近甲心點為卯戊卯乙三之一則卯栁之距亦為垂線三之一矣二十等面從腰横剖之圖凡二十等面體其面之邊皆等而皆斜交故邊皆髙於面面之中心如己如庚是距體心最近之處故為内容渾圓及十二等面所切之點也邊之兩端又髙於其折半之處邊所輳為尖如甲如戊如乙如心等是距體心最逺之處故為外切渾圓及外切十二等面之尖也其各邊折半之點如寅如卯其距體心在近逺酌中為外切立方之半徑其内切之己庚外切之甲戊乙心等頼寅卯距心之線為用然後可知故其用最要横剖所成之面十二等面從腰横剖其根亦同問各邊既髙於面而又斜交何以能横切成平面乎曰從右圖觀之甲戊尖最髙則其所對之乙心等邊似平矣而乙心等尖亦髙則其所對之甲戊等邊又平一髙一平彼此相制而成相等之距故寅卯等折半之處其距體心皆等聯之為線即成相等之線而皆平行也然則何以知其為十等邊平面曰准右圖上下各五面其腰圍亦上下各五面而尖牙相錯成十面今各從其半邊剖之則必為十邊平面無疑也如圖奎卯寅十等邊平面以中為心中寅中卯皆原體心與其邉折中處相距之半徑亦即為外切立方之半徑也於前圖作外切之奎角卯寅平圖則寅卯等即為分圓線乃全圈十分之一當三十六度理分中末線圖奎中為全徑井中為半徑以半徑設五十為句全徑設一百為股求其弦得一百一十一八三三九八為井奎以井為心中為界作圓分如中斗截井奎線於斗則井斗亦半徑也以井斗減井奎其餘斗奎即為理分中末線之大分亦即奎牛以奎牛為度作點于倍徑之圈周而徧即成十平分圈周之點聮其點為線即成寅卯等十等邊故十等邊之寅卯等即木圈半徑之理分中末大分也若奎中為半徑則井中為半半徑亦同奎中全數半徑設一百寅卯必六十一八三三九八即半徑理分中末之大分奎牛即奎斗理分中末線法以全數一百之幂一萬為股幂其半五十之幂二千五百為句幂并得一萬二千五百為弦幂開方求其根得一百一十一八三三九八以半數五十減之得六十一八三三九八為理分中末之大分即三十六度之分圓線也半之為十八度之正弦三九一六九九八線表作二三九二十等面分體之圖甲戊心為二十等面之一面其三邊等中為體心甲中戊中心中皆各面之鋭角距體心之線又為體外切渾圓及外切十二等面之半徑以甲戊心面為底依甲中戊中心中三線剖至體心中成三角錐體為二十等面體二十之一錐體之底各以其三邊半之於寅於辰於卯從此三點作線而體心之中點皆為錐體各立面之斜垂線如辰中即為甲中戊立面之斜垂線寅中為甲中心立面之斜垂線卯中為戊中心立面之斜垂線並同又聮寅卯辰三點為寅卯卯辰辰寅三線成寅卯辰小等邊平三角面以此為底依寅中卯中辰中三斜垂線剖至體心之中點成小三角錐體其積為大三角錐四之一其寅卯等邊為原邊二之一原設邊一百則寅卯五十其己點為三角面之中心大小並同己中即分體之中髙大小錐體同是即内容渾圓之半徑亦即内容十二等面體各尖距其體中心之半徑其辰中卯寅中卯卯中辰皆立三角面皆為横剖成十等邊平面之分形故寅卯與寅中之比例若理分中末線之大分與其全數也今求寅中線即外切立方半徑卯中亦同一率理分中末之大分六十一八三三九八二率全數一百三率寅卯剖形十等邊之一即原邊之半五十四率寅中八十九一七按寅中線為量體之主線既得此線即可以知餘線而此線實生於理分中末線幾何原本謂分中末線為用最廣盖謂此也次求己中即内容渾圓及十二等面之半徑甲戊原邊設一百半之於寅作寅己垂線至己心乃平靣心己寅二十八八六七五為句其幂八百三十三三三三三用㨗法以邊幂一萬取十二之一得之寅中八十九一七為弦其幂六千五百四十五八五句幂減弦幂餘五千七百一十一七五一七開方得股為己中七十五五七六一訂定寅中線一率理分中未線大分六十一八三三九八二率全數一百三率寅卯剖形十等邊之一即原邊之半五十四率寅中即外切立方之半徑八十九一七訂定己中線甲戊邊原設一百半之於寅作寅己線己寅句二十八八六七五幂八百三十三三三三三寅中弦八十九一七幂六千五百四十五八五己中股幂五千七百一十一七五一七根七十五五七六一末求己庚線兩平面心相聮即内容十二等面之邊一率寅中八十九一七為大弦二率己中七十五五七六一為大股三率寅己二十八八六七五為小弦四率己星二十六九六七二為小股倍己星得五十三九三四四為己庚解曰中寅己大句股形與己寅星小句股形同用寅角則其比例等而為相似之形故也己庚等線相聮成五等邊平靣圖准前論甲心戊等三角平面合二十面為二十等面體則甲心等邊線皆髙於平面而邊線之端五相輳即為尖角如心點依此推知甲乙丙丁戊點皆必與他線五相輳而成尖角矣其己庚辛壬癸各點為各平面之最中央在體為最平之處故内容之渾圓及内容之十二等面各尖必切此點今依前法求得己庚等點相聯為直線則凡五平面相輳為尖必有各中央之點相聯為線而皆成五等邊平面形矣此平面形正與心尖相應依此推知甲乙丙丁戊各點皆能為尖則其周圍相輳之五平面亦必各以其中央之點相聯為線而皆成五等邊平面形二十等面體以五邊線相輳之尖凡十有二每一尖之周圍皆有五平面即皆有中央之點相聯而成五等邊平面亦十有二如此而内容十二等平面體己成故曰但聯己庚二點為線即内容十二等面之邊也求甲中線即外切渾圓及十二等面之半徑心中戊中並同寅甲為原邊之半設五十其冪二千五百為句冪寅中為外切立方半徑八十九一七其幂六千五百四十五八五為股冪并句股冪九千四十五八五平方開之得甲中弦依法求得甲中九十五一六五求體積設邊一百其半五十斜垂線八十六六二五相乗得面冪四千三百三十一二五又以己中髙七十五五七六一乗面冪得柱積三十二萬七千二百五十三九六三除之得分體積一十萬九千八十四六五以二十乗之得全積二百一十八萬一千六百九十三十二等面分體之圖戊辛庚己壬五等邊形即十二等面立體之一面亦即分體形之底乃五面立錐形之底丙為平面心丙丁為平面心至體心之垂線亦即分體形之中髙又為體内切渾圓之半徑亦即為内切二十等面之半徑丁為全體之中心又為十二分體之上鋭即五等面立錐形之頂戊辛壬庚等皆各面之外周線即邊也為體之稜亦名之為根自分面之心丙作垂線至邊如癸丙甲丙分各邊為兩其分處為癸為甲即各邊折半處乃自癸至甲聮為癸乙甲線又自此線向丁心平剖之成甲丁癸三角形面各分形俱如此切之成十等邊平面形故丁癸丁甲皆分體形自頂鋭至各邊之斜垂線在所切之十等邊平面形即為自丁心至平面角之線甲癸等點在各邊為折中在切形之平面則對角又自丁至體周各角之線如丁辛丁庚丁戊等在分體即為自底角至頂鋭之稜又為外切渾圓之半徑又為外切二十等面之半徑先算十二等面之面即戊辛庚己壬法為全數與五十四度之切線若甲辛與甲丙也以甲丙乘甲辛又五乘之得戊辛庚己壬五角面積甲丙辛角為五等邊之半角三十六度其餘角甲辛丙必五十四度次算面上大横線即甲癸又全數三十六度之正弦若甲丙與甲乙也倍甲乙得甲癸次算中髙線丙丁法為全數與七十二度之割線若甲乙與甲丁也因平切十等邊為三十六度半之為十八度其餘角七十二度即乙甲丁角乃以甲丁為弦甲丙為句兩幂相減開方得股即丙丁也次算分體之積法以中髙丙丁乘戊辛庚己壬底而取其三之一為分形積末以十二為法乘分形積得總積簡法以分形中髙乘底又四乘之即得總積三歸三因對過省用算甲丙一率全數一二率五十四度切線一三七六三八相乗得六八三率設根之半甲辛五八一九四率甲丙六八以全數除之減五位為畸零算甲乙法為全數與三十六度之正弦若甲丙與甲乙也一率全數一二率三十六度正弦五八七七九三率甲丙六八八一九四率甲乙四四五一一甲癸為横切十等邊平面之一其半為甲乙丁即總形之心亦横切平面之心算甲丁法為全數與十八度之餘割若甲乙與甲丁也一率全數一二率七十二度割線三二三六七三率甲乙四四五一一四率甲丁一三九二五算丙丁中髙線法以甲丁為弦甲丙為句求得股為丙丁算得丙丁一百一十一三五二六為中髙線亦即十二等面形内渾圓之半徑算五等邉面幂法以甲丙乘甲辛五十得三千四百四十九半又五乘之得一萬七千二百四七五為五等邊邊各一百之平幂亦即十二等面分形之底積算總積用簡法以底積一七二四七五四因之得六八九九以乘中髙得七百六十八萬二千二百一十五八七四為十二等面之積計開十二等面一率七六八二二一五例容二率一例邊上立積三率一設容四率一三一七求得設邊上立積立方法開之得其根五十與比例規解合與測量全義差四千一百七十四為二百分之一算辛丁庚丁戊丁並用又即為外切渾圓半徑法以甲丁股幂一七一三五甲辛句幂二五并為弦幂一九六三五求得弦數一百四十為辛丁即外切圓半徑計開十二等面之數設邊一百其容積七百六十八萬二二一五内容渾圓徑一百二十二外切渾圓徑二百八十㨗法十二等面邊求外切内容之立方及外切之立圓置十二等面邊為理分中末之小分求其大分為内容立方邊内容立方邊自乘而三之開方得外切立圓全徑又置十二等面邊為理分中末之小分求其全線為外切立方邊一率理分中末之小分三十八一九六六一理分中末之大分二率理分中末之大分六十一八三三九八理分中末之全分三率十二等面之邊四率内容小立方邊即大横線又一率理分中末之小分二率理分中末之全分三率十二等面之邊四率外切立方邊以十二等面邊減外切立方邊餘為内容立方邊以内容立方邊加十二等面邊即外切立方邊又㨗法但以十二等面邊加大横線即小立方邊即外切立方邊立方内容十二等面算法用理分中末線此五等邊面為十二等面之一巳為平面心中為體心寅卯為戌亥大横線之半三十九一六九九卯中寅中為外切立方半徑五十戌亥為面之大横線六十一八三三九八為理分中末之大分亦即内容小立方之根巳寅巳卯俱平面容圓半徑巳中為内容立圓半徑即分體中髙丑中為外切立圓半徑亥中戌中並同設立方根一百為徑半徑五十為寅中卯中理分中未大分之半為寅卯三十九一六九九又半之為寅子一十五四五八四九五為理分中末大分四之一一率全數一二率五十四度之割線一七一三三率寅子一十五四五八四九五四率寅巳即卯巳二六二八六五求得卯巳為平面中垂線一率全數一二率三十六度之切線七二六五四三率卯巳二十六二八六五四率卯丑即半邊一十九九八二倍卯丑得丑亥邊三十八一九六四即十二等面邊乃理分中末大分之大分也以此知大横線與五等邊為理分中末之全分與其大分之比例也卯巳句幂六九九八卯中弦幂二五相減為股幂一八九二開方得巳中四十二五三二五為内容渾圓半徑卯丑句幂三六四七四一二四三卯中股幂二五相併為弦幂二八六四七四一二四三開方得丑中五十三五二三二為外切渾圓半徑丑亥巳卯相乘五因二除為面幂以乘巳中而四因之得十二等面積簡法十二等面内容小立方六十一八三三九八即理分中末之大分葢戌亥大横線倍大於寅卯故也大横線即小立方之邊以大横線之幂三因之開方得亥中為外切渾圓半徑丑中同又立方根與所容十二等面邊若全數與理分中末之小分約法立方根與其所容十二等面體内小立方之根若全數與理分中末之大分凡立方外切渾圓則徑上幂三倍於方幂計開立方設徑一百内容十二等面邊三十八一九六六一内容小立方邊六十一八三三九八外切渾圓徑一百七四六六二五即丑中亥中倍數外切渾圓半徑五十三五二三三即丑中亥中内容渾圓半徑四十二五三二五即已中為分體中髙内容渾圓全徑八十三六五一内容二十等面邊四十四七二一一幾何補編卷三十二等面體分圖用理分中末線辛戌亥五等邊形為十二等面之一寅卯㸃為邊折半處中為體心卯中為外切立方半徑設五十卯亢為外切立方全徑設一百寅卯線與卯中半徑若理分中末之大分與其全數也在圓内為三十六度之分圓辛癸辛戌等俱七十二度之分圓乙巳為半徑己丑同乙癸為三十六度之通弦乙已半徑與乙癸亦若理分中末一之全數與其大分也故乙已癸三角形與卯中寅相似若取乙丙切線如乙癸之度則丙巳必同亥癸邊即七十二度通弦折半於甲則甲乙為十八度正弦再於寅卯線取子壬如乙甲取壬癸如乙己半徑引已子至癸中末乃自卯作線至中與壬癸平行因得寅中與卯中等則寅中卯即為横切之半面一率全數一二率三十六度割線一二三六七三率子寅一十五四五八四九五四率丑寅半邊一十九九八三倍丑寅得丑戌三十八一九六六與簡法合論曰凡十二等面從其半邊之㸃如寅如卯聮為線以剖至體之心中㸃則所剖成寅中卯三角形平面必為全圓十之一即寅中卯角必三十六度而中寅或中卯兩弦與寅卯底若理分中末之全分與其大分矣又十二等面在立方形内必以卯中或寅中自心至邊之線當立方之半徑是立方半徑與十二等面之寅卯線亦若理分中末之全與其大分也若設立方半徑一百則寅卯必六十一八三三九八如理分中末之大分也今設立方全徑一百其半徑五十則寅卯亦必三十九一六九九如大分之半矣寅卯二㸃既在丑戌丑亥兩邊之折半則戌亥大横線必倍大於寅卯而與理分中末大分之全相應為六十一八三三九八此皆設立方半徑五十之數也而半徑五十其全徑必一百故知設徑一百則十二等面之大横線必六十一八三三九八而竟同理分中末大分之數也既得此大横線則諸線可以互知試先求邊法為酉戌半大横線與丑戌等邊若全數與三十六度之餘割線也一率全數一二率三十六度割線一二三六七三率酉戌半大横線三十九一六九九四率丑戌全邊三十八一九六六論曰五等邊各自其角作線至心分形為五則各得七十二度角如丑巳戌等其巳角皆七十二度其半必三十六度如寅已丑之巳角得戊已丑之半正三十六度而丑戌酉與丑巳寅皆句股又同用丑角則戌角與巳角等為三十六度十二等面求積平面中垂線卯己二十六二八六五邊即丑亥丑戌等三十八一九六六半邊即丑卯丑寅一十九九八三一面之平幂二千五百一十一三七内容渾圓半徑四十二四三二五即分體五面立錐之中髙已中中髙三之一一十四一四四一分積三萬五千四百九十五八四七三其形為五面立錐其體積為十二之一全積四十二萬五千九百五十一六七六外切立方根一百其積一百萬外切渾圓徑一百七四六六内容立方根六十一八三三九八外切立方與體内容立方徑之比例若理分中末之全分與其大分又若外切立方之外又切十二等面體體外又切大立方則大立方之徑與今所算外切立方徑亦若理分中末之全分與其大分而外切之十二等面與其内十二等面徑亦必若理分中末之全分與其大分也孔林宗云外立方與内立方之徑為理分中末線全分與大分之比例是矣若内立方之内又容立圓則小立圓之徑與小立方之徑同而外渾圓與外立方之徑不似未可以前比例齊之若十二等面外切大立方大立方之外又切大立圓大立圓外又切十二等面則大立圓與内容小立圓亦必若理分中末之全分與其大分而外切十二等面與十二等面亦必若理分中末之全分與其大分何則皆外切立方與内容立方之比例也十二等面容二十等面圖第一圖割十二等面之三平面一尖成此形癸丑丙丑戊丑俱五等邊平面皆十二等面之一已庚辛各為其中心一㸃丑為三平面稜所聚之尖亥丑戌丑乙丑俱平面邊各為兩平面所同用之稜中為體心巳中辛中庚中皆内切渾圓半徑亦内容二十等面自尖至體心半徑巳卯庚卯巳寅辛寅辛壬俱平面中垂線寅卯壬皆平面邊折半之㸃第二圖内容二十等面體各自其邊剖至心成此分體為内容體二十分之一辛庚巳三角尖即十二等面之中心原㸃此㸃以外俱剖而得甲㸃與卯㸃同在卯中線而甲在卯之下丁在寅下辰在壬下俱同第三圖自卯㸃起依卯己卯庚二線剖至體心中成此平面形卯即原邊折半處卯中即原體外切立方之半徑中即體心已庚即原兩平面之中心㸃今聯為已庚線即内容二十等面之一邊已中庚即内切二十等面分體之立面乃三角錐體之一面甲中為内切二十等面分體之斜垂線觀第二圖可明第二圖角㸃居剖内三角之中心正對原體之丑尖而在其下故角中為内容分體之正髙而甲中為斜垂線也今求已庚線即内容二十等面之邊法於卯中外切立方半徑内求甲中以相減得卯甲為股用與卯已弦原體之面上中垂線兩冪相減開方得句為已甲倍之得巳庚卯已中三角形卯中即外切立方半徑設五十為底卯已即原體之平面中垂線二十六二八六五巳中即内容渾圓半徑亦即内容二十等面分體之斜稜四十二五三二五以卯巳巳中兩弦相減為較相并為總以總乘較為實卯中底五十為法除之得亢中二十二三六六以減卯中餘二十七六三九四為亢卯折半得一十三八一九七為卯甲計開立方根設一百其半五十即卯中亦為十二等面自體心至邊十二等面之平面中垂線即卯巳二十六二八六五十二等面内容渾圓半徑即已中四十二五三二五亦為内容二十等面自尖角至體心分體以為錐體之稜卯巳已中之較一十六二四六總六十八八一九較總相乘一千一百一十八三三四為實卯中五十為法除之得中亢二十二三六六以中亢減卯中五十餘二十七六三九四為亢卯折半得一十三八一九七為卯甲以卯甲減卯中餘三十六一八三為甲中即内容二十等面分體之斜垂線卯巳自乘得六百九十九八為弦幂卯甲自乘得一百九十九八四一為股幂相減餘四百九十九九九五九為勾幂開方得巳甲二十二三六五倍之得巳庚四十四七二一一即為内容二十等面邊此法甚確亦且甚㨗無可疑者偶於枕上又思得一法借燈體分形之三角錐以求十二等面内容二十等面分體之三角錐是以錐體相截而知其所截之邊即為内容二十等面之邊第一圖丑為三平面所聚之尖丑戌丑亥丑乙皆兩平面同用之稜巳庚辛皆五等邊平面之心己寅己卯等皆平面心至邊垂線已牛丑為平面心對角線寅卯壬皆平面邊折半之㸃寅中卯中壬中為體心至邊線即外切立方半徑中為心第二圖聮寅卯卯壬壬寅三線為平三角面横剖之又各依寅中卯中壬中線剖至體心中則成三角錐體二其一為丑寅卯壬體是三角錐而稍扁者也其一為寅卯壬中體是三角錐而稍長者也其寅卯壬三角平面為扁形之底又為長形之面其寅卯等線與寅中卯中之比例皆若理分中末之大分與其全分也其扁形錐既剖而去則成圓燈所存長錐即燈形分體之一平面心之㸃為斗在丑尖下與牛㸃平故丑牛為弦則斗牛如勾而丑牛之距如股也第三圖又於圓燈分體剖去辰甲丁之一截則成甲丁辰中三角錐乃十二等面内容二十等面分體中之分體其辰甲丁面與巳庚辛脗合為一葢巳庚辛者内容二十等面之一面各於邊折半為甲丁辰而聮之為線則成小三角於中故辰丁等線皆居巳庚線之半而甲中原為二十等面分體之斜垂線者今則為三角錐之楞第四圖己牛丑即原平面從心至角尖之線丑斗角中即原體自尖至中心之線又為外切渾圓半徑依第二圖截丑巳於牛而横剖之亦截丑中於斗成丑斗牛勾股形又依第三圖截斗中於角成丑角巳勾股形此兩勾股相似而比例等法為丑牛與丑斗若丑巳與丑角也第五圖寅中卯三角形為圓燈分體之立面截為甲丁中三角形此兩形相似而比例等法為卯中與卯寅若甲中與甲丁也又斗中為圓燈分體之中髙其平面為寅卯壬角中為截體之中髙其平面為丁甲辰此兩體相似而線之比例等法為斗中髙與寅卯濶若角中髙與甲丁濶先求丑斗髙用截去扁三角錐以牛卯即寅卯之半自乗幂三分加一以減丑卯幂為丑斗幂開方得丑斗高次求丑角髙用巳丑對角線乗丑斗以丑牛除之得丑角髙其丑牛線以牛卯幂減丑卯幂開方得丑牛巳寅丑寅兩幂并開方為己丑末求巳庚線用丑角減丑中得角中又用丑斗減丑中得斗中以角中乘寅卯以斗中除之得甲丁倍甲丁得己庚為内容二十等面之邊理分中末線以量代算先以巳為心作圖而匀分其邊為五作甲庚乙丙丁五等邊平面即十二等面之一面乙丁為大横線設一百甲庚等邊必六十一八三三九八為大横線理分中末之大分若乙丁大横線設六十一八三三九八則甲庚等邊必三十八一九六六亦為大横線理分中末之大分設立方一百内容十二等面邊三十八一九六六為理分中末之小分亦即大分之大分十二等面内又容小立方其邊與十二等面之大横線等六十一八三三九八為大立方邊一百與十二等面邊三十八一九六六之中率何也大立方一百乘十二等面邊三十八一九六六開方得根即小立方及大横線六十一八三三九八若大横線自乗之幂以十二等面邊除之即仍得外立方根而以外立方根除大横線幂必仍得十二等面之邊矣求理分中末線㨗法用前圖作五等邊平面求其大横線乙丁聮兩角為線即得之次以大横線之一端如乙為心其又一端如丁為界作丁戊圓分乃引五等邊與圓分相遇如引乙丙至戊與圓分遇于戊則相遇處如戊至圓心如乙為全分即乙戊亦即乙丁大横線原邊為大分即乙丙引出餘邊為小分即丙戊又法作平三角使兩角如戊如丁俱倍大於一角如乙末乃破一倍角平分之作線至一邊如平分丁角為兩作丁丙線至乙戊邊則其斜線即為理分中末之大分即丁丙也解曰倍破角則與小角等如破丁角為兩皆與乙角等而乙丙丁形之乙丁兩角同大則乙丙丁丙兩弦亦同大而乙丙既為大分丁丙亦為大分矣准此又破丙角可以遞求於無窮諸體比例凡諸體之比例有三一曰同邊之比例可以求積一曰同積之比例可以求邊一曰相容之比例可以互知内相容之比例亦有三一曰立圓内容諸體之比例所容體又容立圓一曰立方内容諸體之比例所容體又容立方一曰諸體自相容之比例即同徑同髙之比例或或兩體互相容或數體遞相容等積之比例比例規解所用今攷定立方積一其邊一百四等面積一其邊二百四八等面積一其邊一百二十八十二等面積一其邊五十二十等面積一其邊七十七方燈圓燈凡方燈依楞剖之縱横斜側皆六等邊平面凡圓燈依楞剖之縱横斜側皆十等邊平面故皆有法形體等邊之比例測量全義所用今攷定立方邊一積一方燈體邊七七一六積八三三三三三邊一積二三五七二一八等面邊七七一六積一六六六六六邊一積四七一四四四等面邊一積一一七八五一十二等面邊一積七六八二二一五二十等面邊一積二一八一八二二圓燈體邊三九一七積二九九二九邊一積九八五九一六等徑之比例皆立方所容立方徑一積一邊一内容方燈徑一積八三三三三三邊七七一六内容四等面徑一積三三三三三三邊一四一四二一三内容八等面徑一積一六六六六六邊七七一六内容立圓徑一積五二三八九内容二十等面徑一積五一五二二六邊六一八三四内容十二等面徑一積四二五九五邊三八一九六六内容圓燈徑一積二九九二九邊三九一七右以立方為主而求諸體内立方及燈體之徑為自面至面四等面十二等面二十等面之徑皆自邊至邊以邊折半處作垂線至對邊折半處形如工字四等面則上下邊遥相午錯如十字八等面之徑為自尖至尖然皆以其徑之兩端正切於立方方面之中心一㸃立方面其相切亦必六㸃求積約法凡立方内容諸體皆與立方之六面同髙同濶則燈形積為立方積六之五四等面積為立方積三之一八等面積為立方積六之一以上三者皆方斜比例燈形及八等面皆以方求斜法以邊自乘倍之開方得外切立方徑以徑再自乘得立方積取六之五為燈六之一為八等面積四等面則以方求其半斜法以邊自乘半之開方得外切立方徑以徑再自乘為立方積取三之一為四等面積立圓在立方内則其積為立方積二十一之十一謹按方圓比例祖率圓徑一百一十三圓周三百五十五見鄭世子律學新説較徑七周二十二之率為宻又今推平圓居平方四百五十二分之三百五十五較十四分之十一為宻又推得立圓居立方六百七十八分之三百五十五較二十一分之十一為宻准立方比例以求各體自相比皆以同髙同闊同為立方所容者較其積燈内容同髙之八等面為八等面得燈積五之一又立圓内容同髙之八等面為八等面得圓積六十六之二十一即二十二之七二者皆同髙而又能相容用課分法母互乘子得之准此而知立圓内容八等面其積之比例若圍與徑也又立方内容十二等面其内又容八等面又立方内容二十等面其内又容八等面二者亦同髙而能相容同髙之四等面積為燈積五之二即十之四四以燈面四因退位得等面積同髙之八等面積為四等面積二之一同髙之四等面積為立圓積十一之七此三者但以同髙同為立方所容而不能自相容若相容則不同髙凡立方之燈形内又容立方則内小立方邊與徑得外立方三之二體積為二十七之八面幂為九之四凡燈容立方以其邊為方而求其斜為外切之立方邊取方斜三之二為内立方邊立方邊一面幂一體積一燈邊七七一六面幂五體積八三三三三三小立方邊六六六六六六面幂四四四四四四體積二九六二九六凡方内容圓圓内又容方則内小方之幂得大方三之一㨗法以小方根倍之為等邊三角形之邊而求其中垂線即外切立圓之徑亦即為外大方之邊如圖三邊既等則乙丙得甲丙之半若乙丙一其幂亦一而甲丙二其幂則四以乙丙句幂一減甲丙弦幂四所餘為甲乙股幂三内方之幂一而外切渾圓之幂三故其根亦如乙丙與甲乙也或以小立方之根為句倍根為弦求其股為外切渾圓徑亦同渾圓徑即外方邊若以量代算則三角形便如以大方求小方者則以大方為中垂線而作等邊三角形其半邊即小方根也或用大方為股而作句股形使其句為弦之半即得之㨗法句股形使甲角半於丙角則弦倍於句而句與股如小立方根與大方根或以甲角作三十度而自乙作垂線引之與甲丙弦線遇于丙則乙丙即圓所容方之根又按先有大方求小方者取大方根倍之為等邊三角形之邊而求其中垂線以三歸之即得凡立方内容方燈燈内又容立圓圓内又容圓燈燈内又容八等面凡四重在内其外切於立方也皆同㸃切立方有六處所同者皆在其方面之最中一㸃若從此一㸃刺一針則五層悉透内惟方燈以面切面不可言㸃若言㸃則有十二皆切在立方邊折半處凡立方内容方燈燈内又容十二等面體體内又容圓燈燈内又容八等面凡四重在内其切于立方也皆同處凡六處皆在立方面内方燈體以面切面十二等面以邊切餘皆以尖切尖切者皆每面之最中㸃凡立方内容方燈燈内又容二十等面體體内又容圓燈燈内又容八等面同上凡立方方燈立圓十二等面二十等面圓燈内所容之八等面皆同大凡立方内容四等面體體内又容八等面其切立方皆同處四等面以邊切為立方六面之斜八等面以尖切居立方各面中心即四等面邊折半處准此而知立方内所容之八等面與四等面所容之八等面亦同大且同髙各體中所容八等面皆同大因此可知凡立圓内容十二等面體又容立方其立方之角同十二等面之尖而切於立圓故立圓内所容之立方與十二等面内所容之立方同大凡二十等面體内容立圓内又容立方立方之角切立圓以切二十等面之面故立圓所容之立方與二十等面内所容之立方必同大凡二十等面體内容立圓内又容十二等面體體内又容立方此立方之角切十二等面之角以切立圓而切于二十等面之面皆同處凡諸體能相容者其相容之中間皆可容立圓此立圓為外體之内切圓亦為内體之外切圓惟八等面外切二十等面十二等面四等面及圓燈其中間難著立圓何也八等面之切圓燈以尖切尖而其切四等面十二等面二十等面則以尖切邊故其中間不能容立圓其他相切之中間能容立圓者皆以内之尖切外之面凡諸體在立方内即不能外切他體惟四等面在立方内能以其角同立方之角切他體故諸體所容四等面之邊皆與其所容立方之面為斜線凡諸體相容其在内之體為所容其在外之體為能容能容與所容兩體之相切必皆有一定之處凡相容兩體之相切或以尖或以邊即體之稜或以面渾圓在立方内為以面切面其相切處只一㸃皆在立方每面之中央立方六面相切凡六㸃立方在渾圓内為以尖切面立方之角有八故相切有八㸃有一㸃不相切者即非正相容也渾圓在諸種體内皆與在立方内同謂其皆以面切諸體之面而切處亦皆一㸃也然其數不同如四等面則切㸃有四方燈則切㸃有六八等面則切㸃有八十二等面及圓燈則切㸃有十二二十等面則切㸃有二十其切㸃之數皆如其面之數而皆在其面之中央也方燈則以其方面為數圓燈則以其五等邊之面為數而不論三角之面者何也三角之面距體心逺故不能内切立圓也諸體在渾圓内皆與立方在渾圓内同謂其皆以各體之尖切渾圓之面也其數亦各不同如四等面則切㸃亦四方燈則切㸃十二八等面則切㸃六十二等面則切㸃二十二十等面則切㸃十二圓燈則切㸃三十皆如其尖之數也四等面在立方内以邊稜切立方之面四等面有六稜以切立方之六面皆徧其四尖又皆切於立方之角十二等面二十等面在立方内皆以其邊稜切立方之面兩種各有三十稜其切立方只有其六以立方只有六面也此三者為以楞切面八等面在立方内以尖切面凡六㸃圓燈在立方内亦以尖切面有六㸃皆在立方面中尖與八等面同方燈在立方内則以面切面皆方面也方燈之方面六亦與立方等也其十二尖又皆切於立方之十二邊楞皆在其折半處為㸃十二等面與二十等面逓相容皆以内體之尖切外體之面十二等面在八等面内以其尖切八等面之面體有二十尖只用其八也方燈在八等面内亦以面切面而皆三角面方燈之三角面有八數相等也又其尖皆切於八等面各稜之中央折半處稜有十二與燈之尖正等也圓燈在十二等面内以面切面皆五等邊平面也圓燈體之五等邊平面原有十二故也又皆以其尖切十二等面之邊楞而皆在其中半圓燈在二十等面内亦以面切面皆三角平面也圓燈體之三角平面原有二十故也又皆以其尖切二十等面之邊楞而皆在其中半問十二等面與二十等面體勢不同而圓燈之尖皆能切其楞邊何也曰圓燈有三十尖而兩等面體皆有三十楞故也凡能容之體皆可改為所容之體遞相容者亦可遞改如立方容圓即可刓方為圓渾圓容方即可削圓為方遞相容者如立方内容渾圓圓内又容十二等面體體内又容二十等面即可遞改凡所容之體皆可補為能容之體皆以數求之如立方外切立圓以其尖角則求立方心至角之線為立圓半徑凡以面切面者其情相通如方燈以其方面切立方面又能以其三角切八等邊面則此三者皆方斜之比例也又如圓燈以其五等邊面切十二等面又能以其三角面切二十等面則此三者皆理分中末之比例也若反用之而令立方在方燈之内則立方之尖所切者必三角面若八等面在方燈之内則其尖所切又必方面也若令十二等面在圓燈内則所切者必三角面而二十等面居圓燈内所切者又必五等邊面也故曰其情相通諸體相容凡立圓立方皆可以容諸體凡立圓内容立方立方内又可容立圓兩者不雜他體可以相生而不窮凡立圓内容立方此立方内又可容四等面四等面又可容立圓三者以序進亦可以不窮凡立圓内容立方又容四等面四等面在立方内以其尖切立圓與立方尖所切必同㸃凡立圓容四等面在立圓所容立方内必以其楞為立方面之斜依此斜線衡轉成圓柱形必為立圓之所容而此柱形又能含立方外圓者柱之底若面内方者立方之底若面直而斜者四等面之邊凡四等面體在立圓内任以一尖為頂以所對之面為㡳旋而作圓錐此錐體必為立圓之所容而不能為立方之容此兩體雖非正相容體然皆有法之體凡立方内可容八等面八等面又可容立方而相與為不窮凡立方有六等面八尖八等面有八等面六尖故二者相容則所容體之尖皆切於為所容大體之面之中央而等凡立方内容立圓此立圓内仍容八等面其八等面尖切立圓之㸃即可為切立方之㸃八等面内容立圓此立圓内仍容立方則立方尖切立圓之㸃亦即可為其切八等面之㸃凡立圓可為諸等面體所容其在諸體内必以圓面一㸃切諸體之各面此一㸃皆在其各等面之中心而等而徧凡八等面内容立圓仍容立方立方内仍容四等面而四等面以其角切立方角即可同立方角切立圓以切八等面叠串四體皆一㸃相切必在八等面各面之中心立方設一百内容二十等面邊六十一八三三九八内又容立圓也十三四一七二簡法取内容立圓徑幂三之一開方得内容小立方再以小立方為理分中末之全分而求其大分得内容十二等面邊凡十二等面二十等面皆能為立圓之所容皆以其尖切渾圓凡十二等面二十等面皆能容立圓皆以各面之中心一㸃正與渾圓相切凡十二等面與二十等面可以互相容皆以内體之尖切外體之各面中心一㸃凡十二等面内容渾圓渾圓内又容二十等面與無渾圓者同徑二十等面内容渾圓渾圓内又容十二等面亦與無渾圓同徑何也渾圓在各體内皆以其體切於外體各面之中心㸃而此㸃即各内體切渾圓之㸃故也以上皆可以迭串相生而不窮凡十二等面内容渾圓渾圓内又容十二等面亦可以相生不窮二十等面與渾圓遞相容亦同凡立方内容十二等面皆以十二等面之邊正切於立方各面之正中凡六皆遥相對如十字假如上下兩面所切十二等面之邊横則前後兩面所切之邊必縱而左右兩面所切之邊又横若引其邊為周線則六處相交皆成十字立方内容二十等面邊亦同凡各體相容皆以内之尖切外之面惟立方内容四等面則以角而切角立方内容十二等面二十等面則以邊而切面厯算全書卷五十七
