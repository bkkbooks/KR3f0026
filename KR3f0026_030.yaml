body:
  text: 歷算全書卷二十七宣城梅文鼎撰交食蒙求卷二日食附説第一求恆年表以首朔為根何也曰首朔者年前冬至後第一朔也因算交會必於朔望故以此為根也根有五種曰干支也太陽太隂各平引也太隂交周太陽經度各平行也太陽太隂各二而干支者所以紀之也西厯於七政皆起子正而此處首朔日食有小餘者交會無一定之時故也紀日者年前冬至次日之干支也首朔日時者年前十二月朔距冬至之日時也以此相加得首朔之干支及其小餘矣於是再以逐月之朔實加之得各月平朔干支及其小餘矣太陽平引與其經度不同何也曰太陽引數從最髙衝起算而經度從冬至起算也冬至定於宫初度最髙衝在冬至後六七度且每年有行分此西厯與古法異者也第二求日定均者即古法之盈縮差也月定均者遲疾差也距弧者平朔與實朔進退之度也距時者平朔實朔進退之日時也因兩定均生距弧因距弧生距時即古法之加減差也第三求第四求五求平朔既有進退矣則此進退之時刻內亦必有平行之數故各以加減平行而為實引也實引既不同平引則其均數亦異故又有實均以生實距弧及實距時也夫然後以之加減平朔而為實朔也平朔古云經朔實朔古云定朔然古法定朔即定於第二求之加減差其三求四求之法古亦有之謂之定盈縮定遲疾則惟於算交食用之而西厯用於定朔此其微異者也第六求原為第九朔有進退則交周亦有進退故有實交周按古法亦有定交周其法相同然必先求次平行者以實朔原有兩次加減也只用月實均者其事在月也其序原居第九今移此者以辨食限也第七求原為第六經度有次平行者以實朔有兩次加減故經行亦有兩次加減乃得日實度也只用日實均者其事在日也第八求問平朔者古經朔也實朔者古定朔也何以又有視朔曰此測驗之理因加減時得之古法所無也何以謂之加減時曰所以求實朔時太陽加時之位也蓋厯家之時刻有二其一為時刻之數其一為時刻之位凡布算者稱太陽右移一度稍弱為一日又或動天左旋行三百六十一度稍弱為一日此則天行之健依赤道而平轉其數有常於是自子正厯丑寅復至子正因其運行之一周而均截之為時為刻以紀節候以求中積所謂時刻之數也凡測候者稱太陽行至某方位為某時為某刻此則太虛之體依赤道以平分其位一定於是亦自子正歷丑寅復至子正因其定位之一周而均分之為時為刻以測加時以候凌犯所謂時刻之位也之二者並宗赤道宜其同矣然推二分之日黃赤同點經緯並同二至之日黃赤同經緯異經同則數與位合所算時刻之數太陽即居本位與所測加時之位一一相符不用加減時其過此以往則二分後有加分加分者太陽所到之位在實時西二至後有減分減分者太陽所到之位在實時東也然則所算實朔尚非實時乎曰實時也實時何以復有此加減曰正惟實時故有此加減若無此加減非實時矣蓋此加減時分不因里差而異九州萬國加減悉同非同南北東西差之隨地而變亦不因地平上髙弧而改髙弧雖有髙下加減時並同非若地半徑及濛氣等差之以近地平多近天頂少而獨與實時相應但問所得實時入某節氣或在分至以後或在分至以前其距分至若同即其加減時亦同是與實時相應也故求加減時者本之實時而欲辨實時之真者亦即徴諸加減時矣其以二分後加二至後減何也曰升度之理也凡二分以後黃道斜而赤道直故赤道升度少升度少則時刻加矣二至以後黃道以腰圍大度行赤道殺狹之度故赤道升度多升度多則時刻減矣假如所算實朔巳定於某日午正時而以在二分後若干日當有加分則太陽加時之位必在午正稍西從而測之果在午正之西與加分數合即知實朔之在午正者真也又如所算實朔是未正而在二至後當有減分太陽加時之位必在未正稍東從而測之果在未正之東與減分數合即知實朔之在未正者確也加減時即視時也一曰用時其實朔時一曰平時加減時之用有二其一加減實時為視時則施之測驗可以得其正位如交食表之加減是其正用也其一反用加減以變視時為實時則施諸推步可以得其正算如月離表之加減是其反用也然其理無二故其數亦同也月離表改用時為平時即是據所測視時求其實時以便入算古今測驗而得者並以太陽所到之位為時故曰加時言太陽加臨其地也然則皆視時而已視時實時之分自厯書始發之然有至理厯家所不可廢也第九求原為十求月距地者何即月天之半徑也月天半徑而謂之距地者地處天中故也地恆處天中則半徑宜有恆距而時時不同者生於小輪也月行小輪在其髙度則距地逺矣在其卑度則距地近矣每度之髙卑各異故其距地亦時時不同也日半徑月半徑者言其體之視徑也論其真體日必大於月論其視徑日月略相等所以能然者日去人逺月去人近也然細測之則其兩視徑亦時時不等此其故亦以小輪也日月在小輪髙處則以逺目而損其視徑在其卑處則以近日而增其視徑矣檢表法不同者視半徑表並起最髙而加減表太陽引數起最卑太隂引數起最髙故月實引只用本數而日實引加減六宫也并徑者日月兩半徑之總數也兩半徑時時不同故其并徑亦時時不同而時分之深淺因之虧復之距分因之矣月實行者一小時之實行也其法以月距日之平行每日分為二十四限即一小時平行也各以其應有之加減分加減之即一小時之實行也雖虧復距甚未必皆為一小時而以此為法所差不逺此與授時用遲疾行度內減八百二十分者同法第十求原為十一總時者何也以求合朔時午正黃道度分也何以不言度而言時以便與視朔相加也然則何不以視朔變為度曰日實度者黃道度也時分者赤道度也若以視朔時變赤道度亦必以日實度變赤道度然後可以相加今以日實度變為時即如預變赤道矣此巧算之法也其必欲求午正黃道何也曰以求黃平象限也即表中九十度限何以為黃平象限曰以大圈相交必互相均剖為兩平分故黃赤二道之交地平也必皆有半周百八十度在地平之上黃道赤道地平並為渾圓上大圈故其相交必皆中剖其勢如虹若中剖虹腰則為半周最髙之處而兩旁各九十度故謂之九十度限也此九十度限黃赤道並有之然在赤道則其度常居正午以其兩端交地平常在卯正酉正也黃道則不然其九十度限或在午正之東或在午正之西時時不等惟二至度在午正則九十度限亦在午正與赤道同法此外則無在午正者而且時時不同矣其兩端交地平亦必不常在卯正酉正亦惟二至度在午正為九十度限則其交地平之處即二分點而黃道與赤道同居卯酉此外則惟赤道常居卯酉而黃道之交於地平必一端在赤道之外而居卯酉南一端在赤道之內而居卯酉北而時時不等故也黃道東交地平在卯正南其西交必酉正北而九十度限偏於午規之西若東交地平在卯正北其西交地平必酉正南而九十度限偏於午正之東則半周如虹者時時轉動勢使然也蓋黃道在地平上半周之度自此中分則兩皆象限若從天頂作線過此以至地平必成三角而其勢平過如十字故又曰黃平象限也地平圈為黃道所分亦成兩半周若從天頂作弧線過黃平象限而引長之成地平經度半周必分地平之兩半周為四象限而此經線必北過黃極與黃經合而為一問黃平象限在午正必二至日有之乎曰否每日有之也凡太陽東升西沒成一晝夜則周天三百六十度皆過午正而西故每日必有夏至冬至度在午正時此時此刻即黃平象限與子午規合而為一每日只有二次也自此二次之外二至必不在午正而黃平象限亦必不在二至矣觀渾儀當自知之黃平象限表以極出地分何也曰凖前論地平上黃道半周中折之為黃平象限其兩端距地平不等而自非二至在午正則黃道之交地平必一端近北一端近南亦前論所明極出地漸以髙則近北之黃道漸以出近南之黃道漸以沒而黃平象限亦漸以移此所以隨地立表也求黃平象限何以必用總時曰黃平象限時時不同即午規之地亦時時不同是午正黃道與黃平象限同移也則其度必相應是故得午正即得黃平黃平限為某度其午正必為某度謂之相應然則午正為某度即黃平限必某度矣故得此可以知彼而總時者午正之度也此必用總時之理也日距限分東西何也曰所以定時差之加減也凡用時差日在限西則加日在限柬則減日距地髙何也曰所以求黃道之交角也時差氣差並生於交角又生於限距地及限距日二者交食之關鍵而非黃平象限無以知之矣日距地髙何也謂合朔時太陽之地平緯度也亦曰髙弧髙弧之度隨節氣而殊故論赤緯之南北赤緯之南北同矣又因里差而異故論極出地極出地同矣又以加時而變故又論距午刻分極出地者南北里差距午刻分者東西里差也合是數者而日距地平之高可見矣日赤緯加減宫數者何也緯表宫起春分而日實度宫起冬至故三宫以下加九宫三宫以上減去三宫以宫數變從緯表也視朔時加減十二時者何也求太陽距午刻分也日在地平上之弧度惟正午為髙其餘則漸以下或在午前或在午後皆以距午為斷其距午同者髙弧之度亦同也視朔滿十二小時是朔在午後也故內減十二時用其餘為自午正順數若不滿十二時是朔在午前則置十二時以視朔減之而用其餘為自午正逆推即各得其距午之刻分矣其必求髙弧者何也所以求月髙下差也髙下差在月而求日距地髙者日食時經緯必同度故日在地平之髙即月髙也何以為月髙下差曰合朔時太隂之視髙必下於真髙其故何也月天在日天之內其間尚有空際故地心與地面各殊地面所見謂之視髙以較地心所見之真髙往往變髙為下以人在地靣傍視而見其空際也故謂之月髙下差地心見食謂之真食地靣見食謂之視食真食有時反不見食見視食時反非地心之真食縱使地心地靣同得見食而食分深淺亦必不同凡此皆月髙下差所為也月髙下差時時不同其緣有二其一為月小輪髙卑即第九求之月距地數也在小輪卑處月去人近則距日逺而空際多髙下差因之而大矣在小輪髙處月去人逺則距日近而空際少髙下差因之而小矣其一為髙弧即本求之日距地髙也髙弧近地平從旁視而所見空際多則髙下差大矣髙弧近天頂即同正視而所見空際少則髙下差小矣若髙弧竟在天頂即與地心所見無殊無髙下差小輪髙卑天下所同髙弧損益隨地各異故當兼論也兩圈交角何也曰日所行為黃道圈以黃極為宗者也人在地平上所見太陽之髙下為地平經圈以天頂為宗者也此兩圈者各宗其極則其相遇也必成交角矣因此交角遂生三差日食必求三差故先論交角也何以謂之三差曰髙下差也東西差也南北差也是謂三差三差之內其一為地平緯差即髙下差前條所論近地平而差多者也其一為黃道經差即東西差其一為黃道緯差即南北差此三差者惟日食在九十度限則黃道經圈與地平經圈即髙弧相合為一而無經差故但有一差無經差則但有緯差是無東西差而有南北差也而兩經緯既合為一則地平之髙下差又即為黃道之南北差而成一差若日食不在九十度而或在其東或在其西則兩經圈不能相合為一遂有三差月髙下差恆為地平髙弧之緯差而黃道經圈自與黃道為十字正角不與地平經合以生經度之差角是為東西差又黃道上緯度自與黃道為平行不與地平緯度合以生緯度之差角是為南北差東西南北並主黃道為言與地平之髙下差相得而成句股形則東西差如句南北差如股而髙下差常為之弦合之則成三差也因此三差有此方見日食彼方不見或此見食分深彼見食分淺之殊故交食重之而其源皆出於交角得數減象限何也以表所列為餘角也表何以列餘角曰三差既為句股形則有兩圈之交角即有其餘角而交角所對者為氣差即南北差餘角所對者為時差即東西差作表者蓋欲先求時差故列餘角然與兩圈交角之名不相應故減象限而用其餘以歸交角本數也定交角何也所以求三差之真數也何以為三差真數曰日食三差皆人所見太隂之視差而其根生於交角則黃道之交角也殊不知太隂自行白道與黃道斜交其交於地平經圈也必與黃道之交不同角則所得之差容有未真今以隂陽厯交黃道之角加減之為定交角以比兩圈交角之用為親切耳詳補遺時差古云東西差其法日食在東則差而東為減差減差者時刻差早也日食在西則差而西為加差加差者時刻差遲也其故何也太陽之天在外太隂之天在內並東升而西降而人在地靣所見之月度既低於真度則其視差之變髙為下者必順於黃道之勢故合朔在東升之九十度必未食而先見限東一象限東下西髙故月之真度尚在太陽之西未能追及於日而以視差之變髙為下亦遂能順黃道之勢變西為東見其掩日矣若合朔在西降之九十度必先食而後見限西一象限黃道西下東髙故月之真度雖已侵及太陽之體宜得相掩而以視差之故變髙為下遂順黃道之勢變東而西但見其在太陽之西尚逺而不能掩日矣而東西之界並自黃道九十度限而分此黃平象限之實用也問日月以午前東升午後西降何不以午正為限而用黃平象限乎曰此西法之合理處也何以言之日月之東升西降自午正而分者赤道之位終古常然者也日月之視差東減西加自九十度限而分者黃道之勢頃刻不同者也若但從午正而分則加減或至於相反授時古法之交食有時而踈此其一端也問加減何以相反曰黃平限既與午正不同度則在限為西者或反為午正之東在限為東者或反為午正之西日食遇之則加減相違矣假如北極出地四十度設午正黃道即總時為寶瓶十七度其黃平限為雙魚十一度在午正東二十四度而日食午初日實度躔二宫二度在限西九度宜有加差若但依午正而分則食在午前反當有減差是誤加為減算必先天矣又設午正為天蝎二度其黃平象限為天稱八度在午正西二十四度而日食午正後二刻日實度躔九宫二十四度距限東十六度宜有減差若但依午正而分則食在午後反有加差是又誤減為加算必後天矣時差表有倒用之説何也曰此亦因交角表誤列餘角也今既以交角表之數減九十度為用則交角已歸原度而此表不須倒用矣近時距分者何也即視朔時或加或減之時刻分也所以有此加減者時差所為也然何以不徑用時差曰時差者度分也以此度分求月之所行則為時分矣查厯指所謂時差即近時距分而東西差即時差表皆易之今姑從表以便查數也近時何也所推視朔時與真朔相近之時也食在限東此近時必在視朔時以前故減食在限西近時必在視朔時以後故加十一求原為十二近總時何也近時之午正黃道度也朔有進退午正之黃道亦因之進退故仍以近時距分加減十求之視朔午正度為本求之近時午正度既有近時又有近時之午正度則近時下之日距限及距限地髙日距地髙以及月髙下差兩圈交角凡在近時應有之數一一可推因以得近時之時差矣內除月距地數在九求日赤緯在十求並用原數其餘並改用近時之數故皆復求然求法並同十求既得時差可求視行視行者何也即近時距分內人目所見月行之度也何以有此視行曰時差所為也蓋視朔既有時差則此時差所到之度即視朔時人所見月行所到差於實行之較也視朔既改為近時則近時亦有時差而又即為人所見近時月行所到差於實行之較矣此二者必有不同則此不同之較即近時距分內人所見月行差於月實行之較矣故以此較分加減時差為視行也本宜用前後兩小時之時差較加減月實行為視行如用距分減視朔者則取視朔前一小時之時差若距分加視朔者則取視朔後一小時之時差各取視朔時差相減得較以加減月實行即為一小時之視行再用三率比例得真時距分法為月視行與一小時若時差度與真時距分也今以近時內之視行取之其所得真時距分等何以明其然也曰先得時差即近時距分之實行也實行之比例等則視行之比例亦等一一小時實行一小時視行法為一小時之實行與二一小時一小時一小時若時差度與近三時差近時距分之實行視行即近時距分之視行時距分則一小時之視四近時距分近時距分行與一小時亦若視行度與近時距分也一一小時視行視行今一小時視行與一小二一小時近時距分時既若時差與真時距三時差時差分則視行與近時距分四真時距分真時距分亦必若時差與真時距分矣問視行之較一也而或以加或以減其理云何曰凡距分之時刻變大則所行之度分變少故減實行為視行若距分之時刻變小則所行之度分變多故加實行為視行假如視朔在黃平限之東時差為減差而近時必更在其東其時差亦為減差乃近時之時差所減大於視朔所減是為先小後大其距分必大於近時距分而視行小於實行其較為減又如視朔在黃平限之西時差為加差而近時必更在其西時差亦為加差乃近時之時差所加大於視朔所加是亦為先小後大其距分亦大於近時距分而視行亦小於實行故其較亦減二者東西一理也若視朔在黃平限東其時差為減而近時時差之所減反小於視朔所減又若視朔在黃平限西其時差為加而近時時差之所加反小於視朔所加此二者並先大後小則其距分之時刻變小矣時刻變小則視行大於實行而其較應加東西一理也如圖戊為黃平象限甲為視朔甲乙為視朔時差甲丙甲丁並近時時差其甲乙時差為視朔時順黃道而差低之度變為時即為近時距分此分在限東為減差若在限西即為加差其理一也若以甲丙為近時差則大於甲乙其較度乙丙依實行比例求其較時則距分變而大矣距分變大者行分變小法當於甲乙差度內減去乙丙較度即乙庚其餘如甲庚則是先定甲乙距分行行甲乙度者為實行而今定甲乙距分只行甲庚度者為視行也故在東在西皆減也又若以甲丁為近時差則小於甲乙其較乙丁依實行比例求其較時則距分變而小矣距分變小者行分變大法當於甲乙差度外加入乙丁較度亦即乙庚成甲庚則是先定甲乙距分行甲乙度者為實行而今定甲乙距分能行甲庚度者為視行也故在東在西皆加也捷法用倍時差減近時差何也曰即加減也何以知之曰凡時差先小後大者宜減今於倍小中減一大是於先得時差內加一小時差減一大時差也即如以較數減先時差矣先大後小者宜加今於倍大內減一小是於先得時差內加一大時差減一小時差也即如以較數加先時差矣數既相合而取用不煩法之善者也真時距分者何也即視朔時或加或減之真時刻也其數有時而大於近時距分亦有時而小於近時距分皆視行所生也視行小於實行則真時距分大於近時距分矣視行大於實行則真時距分小於近時距分矣其比例為視行度於近時距分若時差度與真時距分也真時何也所推視朔之真時刻也真時在限東則必早於視朔之時真時在限西則必遲於視朔之時此其於視朔並以東減西加與近時同惟是真時之加減有時而大於近時有時而小於近時則惟以真時距分為斷不論東西皆一法也若真時距分大於近時距分而在限東則真時更先於近時在限西則真時更後於近時是東減西加皆比近時為大也若真時距分小於近時距分而在限東則真時後於近時在限西則真時先於近時是東減西加皆比近時為小也十二求原為十三真總時何也真時之午正黃道也故仍以真時距分加減視朔之總時為總時即是改視朔午正度為真時午正度近時既改為真時即食甚時也然容有未真故復考之考之則必於真時復求其時差而所以求之之具並無異於近時所異者皆真時數耳謂日距限限距地髙日距地髙月髙下差兩圈交角等項並從真時立算是之謂真時差既得真時差乃别求真距度以相恭考則食甚定矣考定真時全在此處何以為真距度曰即真時距分內應有之月實行也蓋真時差是從真時逆推至視朔之度真時距分內實行是從視朔順推至真時之度此二者必相等故以此考之考之而等則真時無誤故即命為食甚定時也其或有不等之較分則以法變為時分而損益之於是乎不等者亦歸於相等是以有距較度分考定之法也距較度分者距度之較也損益分者距時之較也其比例亦如先得時差度與真時距分故可以三率求也真時差大者其距時亦大故以益真時距分益之則減者益其減原在限東而真時早者今乃益早若加者亦益其加原在限西而真時遲者今則益遲矣真時差小者其距時亦小故以損真時距分損之則減者損其減原在限東而真時早者今改而稍遲若加者亦損其加原在限西而真時遲者今改而稍早矣如是考定真時距分以加減視朔為真時即知無誤可謂之考定食甚時也氣差古云南北差凖前論月在日內人在地靣得見其間空際故月緯降髙為下夫降髙為下則亦降北為南矣此所以有南北差也南北差生於地勢中國所居在赤道之北北髙南下故也然又與髙下差異者自天頂言之曰髙下自黃道言之曰南北惟在正午則兩者合而為一髙下差即為南北差其餘則否氣差與時差同根故有時差即有氣差而前此諸求但用時差者以食甚之時未定重在求時也今則既有真時矣當求食分故遂取氣差也時差氣差並至真時始確十三求原為十四距時交周何也即實朔距真時之交周行分也故以實朔與真時相減之較查表數然何以不用視朔曰原算實交周是實朔故也定交周者何也真時之月距交度也食甚既定於真時則一切視差皆以食甚起算故必以實朔交周改為食甚之交周斯之謂定交周也月食黃緯者食甚時月行隂陽厯實距黃道南北之緯度也月視黃緯者食甚時人所見月距黃道南北緯度則氣差之所生也月行白道日行黃道帷正交中交二點月穿黃道而過正在黃道上而無距緯其距交前後並有距緯而每度不同然有一定之距是為實緯實緯因南北差之故變為視緯即無一定之距隨地隨時而異但其變也皆變北為南假如月行隂厯實緯在黃道北則與黃道實逺者視之若近焉故以氣差減也若月行陽厯實緯在黃道南則與黃道實近者視之若逺焉故以氣差加也至若氣差反大於實緯則月雖隂厯其實在黃道北而視之若在南故其氣差內減去在北之實緯而用其餘數為在南之視緯也并徑減距者何也并徑所以定食分減距所以定不食之分也距者何也即視緯也并徑則日月兩半徑之合數也假令月行陰厯其北緯與南北差同則無視緯可減而并徑全為食分其食必既其餘則皆有距緯之減而距大者所減多其食必淺距小者所減少其食必深是故并徑減餘之大小即食分之所由深淺也若距緯大於并徑則日月不相及或距緯等於并徑則日月之體相摩而過不能相掩必無食分矣并徑內又先減一分何也曰太陽之光極大故人所見之食分必小於真食之分故預減一分也然則食一分者即不入算乎曰非也并徑之分度下分也每六十分為一度食分之分太陽全徑之分也以太陽全徑十平分之假令太陽全徑三十分則以三分為一分是故并徑所減之一分於食分只二十餘秒問日月兩半徑既時時不同則食分何以定曰半徑雖無定而比例則有定但以并徑減餘與太陽全徑相比則分數覩矣分太陽全徑為十分即用為法以分并徑減距之餘分定其所食為十分中幾分有時太陰徑小於太陽則雖兩心正相掩而四面露光厯家謂之金環是其并徑亦小於太陽全徑雖無距緯可減而不得有十分之食故也細草原用表今改用三率其理較明法亦簡易十四求日食月行分者何也乃自虧至甚之月行度分也自甚至復同用其法以并徑減一分常為弦視緯常為句句弦求股即得自食甚距虧與復之月行度分矣按此即授時厯開方求定用分之法所異者并徑時時增減與舊法日月視徑常定不變者殊耳前總時何也即食甚前一小時之午正度也得此午正度即可得諸數以求前一小時之時差謂之前時差前時差與真時差之差分即視行與實行之差分故以差分加減實行得視行也假如日在限西而前時差大於真時差是初虧所加多而食甚所加反少也以此求虧至甚之時刻則變而小矣時刻小則行分大故以差分加實行為視行若日在限西而前時差小於真時差是初虧所加少而食甚所加漸多也以此求虧至甚之時刻則變而大矣時刻大則行分必小故以差分減實行為視行若日在限東而前時差大於真時差是初虧所減多而食甚所減漸少也以此求虧至甚之時刻則變而大矣時刻大者行分小故以差分減實行為視行若日在限東而前時差小於真時差是初虧所減少而食甚所減反多也以此求虧至甚之時刻則變而小矣時刻小者行分大故以差分加實行為視行食甚定交角滿象限不用差分何也無差分也何以無差分曰差分者時差之較也食甚在限度即無食甚時差無可相較故初虧徑用前時差復圓徑用後時差又食甚在限度則初虧距限東而前時差恆減復圓距限西而後時差恆加減時差則初虧差而早加時差則復圓差而遲其距食甚之時刻並變而大也時刻大者行分小故皆減實行為視行又若初虧復圓時定交角滿象限亦無差分而徑用食甚之時差減實行為視行與此同法其初虧復圓距食甚之刻分亦皆變大而行分變小也視行之理此為較著初虧距時分者初虧距食甚之時刻也用上法得視行為食甚前一小時之數而初虧原在食甚前則其比例為視行之於一小時猶日食月行之於初虧距時故可以三率取之也日食月行減一義見前條既得此初虧距分則以減食甚而得初虧時刻也十五求後總時者即食甚後一小時之午正度分也用此午正度得諸數以求後一小時之時差為後時差又以後時差與真時差相較得差分以加減實行為視行並同初虧但加減之法並與初虧相反假如日在限西而後時差大於真時差是食甚所加少而復圓所加多則甚至復之時刻亦變而大矣時刻大者行分小故以差分減實行為視行若日在限西而後時差小於真時差是食甚所加多而復圓所加反少則甚至復之時刻亦變而小矣時刻小者行分大故以差分加實行為視行假如日在限東而後時差大於真時差是食甚所減少而復圓所減反多則甚至復之時刻變而小矣時刻小者行分大故以差分加實行為視行若日在限東而後時差小於真時差是食甚所減多而復圓所減少則甚至復之時刻變而大矣時刻大者行分小故以差分減實行為視行食甚在限度求視行之理已詳十四求復圓距時分三率之理並與初虧同惟復圓原在食甚後故加食甚時刻為復圓時刻十六求黃道宫度內減宿鈐何也黃道宫度起冬至各宿黃道起距星也凡距星所入宫度必小於日實度宫度故以相減之較為食甚時所入本宿度分也其每年加五十一秒者恆星東行之度即古嵗差法也因嵗差所加故有宿鈐在日實度以下而變為日實度以上則食甚時所入非其宿矣故退一宿用之也其以嵗差五十一秒乘距算本年距歷元戊辰之數各宿並同雖退一宿所加不異也赤道宫度可以升度取者黃道上升度一定也若赤道宿度則不可以升度取何也各宿距星多不能正當黃道而在其南北各有緯度故必以弧三角求之為正法也此後原有十七求以算東西異號今省不用何也曰東西異號之算厯書語焉不詳故細草補作之亦有思致但所求者仍為黃平象限之東西故必復求定交角今於十四求十五求即得定交角為白道限度之東西簡易直捷可不必更多葛藤矣故省之也附説補遺求總時條加減十二時問求總時與求日距地髙二條並以視朔與十二時相加減然後用之而用法不同何也曰求總時條是欲得午正黃道距春分之升度故並從午正後順推如視朔過十二時則內減十二時而用其餘數是從午正後數其距視朔之時刻也若視朔不及十二時則以十二時加之是從先日午正後數其距今視朔之時刻也故其法皆為順數日距地髙條是欲得視朔距午正之度故各從午正前後順推逆數如視朔為十二時去之而用其餘數是從視朔時逆推其己過午正之刻也若視朔不滿十二時則置十二時以視朔時減之而用其餘數是從視朔順數其未及午正之刻也二其視朔滿十二時減去之兩法並同惟視朔不滿十時用法則異附又法問視朔在午前若用減十二時法亦可以得總時乎曰可其法亦如求日距地髙置十二時以視朔時減之求到視朔未至午之刻去減日實度距春分時刻即九十度表第二行對日實度之時刻亦即得總時與上法同此法可免加滿二十四時去之然遇日實度距春分時刻不及減又當加二十四時然後可減矣假如日實度是春分後相距只一時而視朔在午正前三時是為日實度小不及減法當以日實度加二十四時作二十五時減去三時餘二十二時為總時定交角或問問定交角滿象限以上反其加減何也曰此變例也西厯西加東減並以黃道九十度限為宗今用定交角則是以白道九十度限為宗而加減因之變矣問白道亦有九十度限乎歷書何以未言曰歷書雖未言然以大圈相交割之理徵之則宜有之矣何則月行白道亦分十二宮視月緯表可見則亦為大圈其交於地平也亦半周在地平上則其折半之處必為白道最高之處而亦可名之為九十度限矣或可名白道限度若從天頂作高弧過此度以至地平則成十字正角而其圈必上過白道之極成白道經圈與黃平象限同黃平象限上十字經圈串天頂與黃道極故亦成黃道經圈與此同理月在此度即無東西差而南北差最大與高下差等前論月在黃平象限無東西差而即以高下差為南北差其理正是如此但月行白道當以白道為主而論其東西南北始為親切若月在此度以東則差而早宜有減差在此度以西則差而遲宜有加差但其加減有時而與黃平象限同有時而與黃平限異故有反其加減之用也問如是則白道亦有極矣極在何所曰白道有經有緯凡東西差皆白道經度南北差皆白道緯度則亦有南北二極為其經緯之所宗但其極與黃極恆相距五度以為定緯雖亦有小小增減而大致不變其經度則嵗嵗遷動至滿二百四十九交而遍於黃道之十二宫則又復其始約其數十九年有竒法當以黃極為心左右各以五緯度為半徑作一小圓以為載白道極之圈再以正交中交所在宫度折半取中即於此度作十字經圈必串白道極與黃道極矣則此圈之割小圓點即白道極也問何以知此圈能過黃白兩極也曰此圈於黃道白道並作十字正角故也凡大圈上作十字圈必過其極問此圈能串兩極則限度常在此度乎曰不然也此度能串黃白兩極而未必其串天頂如黃道上極至交圈也若限度則必串天頂以過白極而未必其過黃極如黃道上之黃平限也是故白道上度處處可為限度亦如黃道上度處處可為黃平限但今在地平上之白道半周某度最髙即其兩邉距地平各一象限從此度作十字經圈必過天頂而串白道之兩極何也此圈過地平處亦皆十字角即與地平經圈合而為一所謂月髙下差即在此圈之上矣惟白道半交為限度能與黃平限同度此外則否况近交乎故必用定交角也以定交角推白道限度白道限度大約在黃道交角之八十五度定交角三此滿象限過此則有異號若太隂定交周是宫十一宫而黃平限在午正之東乃白道限度則更在其東而原以限東宜減者今或以定交角大而變為限西宜加矣若定交周是五宫六宫而黃平限在午正西白道限度必更在其西而原以限西宜加者今或以定交角大而變為限東宜減矣以上二宗並離午正益逺交食遇此則古法益踈而新法猶近若定交周是宫十一宫而黃平限在午正西乃白道限度或尚在其東而原以限東宜減者今以定交角大而變為限西宜加矣若定交周是五宫六宫而黃平限在午正東乃白道限度或尚在其西而原以限西宜加者今以定交角大而變為限東宜減矣以上二宗並離黃平限而近午正交食遇此則有時古法反親而新法反踈若白道限度徑在午正則古法密合矣由是觀之加減東西差宜論白道明甚厯書略不言及豈非缺陷之一大端問定交角者所以變黃道交角為白道交角也然何以不先求白道限度曰交角者生於限度者也交角變則限度移矣故先得限度可以知交角交角之向指以距限東西而異交角之大小以距限逺近而殊而既得交角亦可以知限度故不必復求限度也其加減以五度何也曰取整數也古厯測黃白大距為六度以西度通之得五度五十四分竒西厯所測只五度竒而至於朔望又只四度五十八分半今論交角故祗用整數也若用弧三角法求白道限度所在及其距地之髙並可得交角細數然所差不多蓋算交食必在朔望又必在交前交後故也問五度加減後何以有異號不異號之殊曰近交時白道與黃道低昻異勢者也惟月在半交能與黃道平行亦如二至黃道之與赤道平行也若交前交後斜穿黃道而過不能與黃道平行亦如二分黃道之斜過赤道也故低昻異勢然又有順逆之分而加減殊焉其白道斜行之勢與黃道相順者則恆減減惟一法減者角損而小也雖改其度不變其向若白道與黃道相逆者則恆加加者多變遂有異號之用矣加者角增而大也增之極或滿象限或象限以上遂至改向是故限西黃道皆西下而東髙限東黃道皆西髙而東下此黃道低昻之勢因黃平象限而異者也而白道正交宫十一宫也即古法之中交自黃道南而出於其北亦為西下而東髙黃道半周在地平上者偏於天頂之南以南為下北為上正交白道自南而北如先在黃道之下而出於其上故比之黃道為西下而東髙也白道中交五宫六宫也即古法之正交自黃道北而出於其南亦為西髙而東下白道自北而南如先在黃道之上而出於其下故比之黃道為西髙而東下也假如日食正交而在限西日食中交而在限東是為相順相順者率於交角減五度為定交角是角變而小矣角愈小者東西差愈大故低昻之勢增甚而其向不易也限西黃道本西下東髙而正交白道又比黃道為西下東髙則向西之角度變小而差西度增大其時刻遲者益遲矣限東黃道本西髙東下而中交白道又比黃道為西髙東下則向東之角度變小而差東之度增大其時刻早者益早矣是東西之向不易而且增其勢也假如日食正交而在限東日食中交而在限西是為相逆相逆者率於交角加五度為定交角是角變而大矣角愈大者東西差愈小故低昻之勢漸平而甚或至於異向也限東黃道本西髙東下而正交白道比黃道為西下東髙則向東之角漸大而差東度改小時刻差早者亦漸平若加滿象限則無時差乃至滿象限以上則向東者改而向西時刻宜早者反差遲矣限西黃道本西下東髙而中交白道為西髙東下則向西之角漸大而差西度改小時刻差遲者亦漸平若加滿象限則無時差乃至滿象限以上則向西者改而向東而時刻宜遲者反差而早矣凡東西差為見食甚早晚之根如上所論定交角所生之差與黃道交角無一同者則欲定真時刻非定交角不可也若但論黃道交角時刻不真矣凡東西差與南北差互相為消長而南北差即食分多少之根如上所論則欲定食分非定交角不能也但論黃道交角食分亦誤矣差分有用併之理問差分本以兩時差相較而得十四求已有備論今乃有用併之法何也曰異號故也此其白道限度必在兩食限之間或限度在甚與復兩限之間則食甚在限東而復圓限而或限度在虧與甚之間則食甚在限西而初虧限東兩食限一距限東一距限西其兩時差必一為減號一為加號是為東西異號無可相較故惟有相併之用也乃若定交角大於象限則先為同號而變為異號其食甚必在黃平限及白道限度之間食甚在黃平限西白道限度東則先推食甚復圓同號者變為異號矣食甚在黃平限東白道限度西則先推食甚初虧同號者變為異號矣兩食限既變為東西異號則其兩時差亦一加一減變為相併矣問異號恆相併固也乃復有定交角過九十度而仍用相較為差分者何也曰此異號變為同號也其黃平限必在兩食限之間而白道限度或反在食限之外則能變異號為同號假令黃平限在復與甚之間甚距限東復距限西本異號也而復圓之定交角過象限則白道限度必又在復圓之西而先推黃平限復圓在西者今推白道限度復圓在限東即復圓食甚變為同號矣又加黃平限在虧與甚之間虧距限東甚距限西本異號也而初虧之定交角過象限則白道限度必又在初虧之東而先推黃平限初虧在東者今推白道限度初虧在限西即初虧食甚變為同號矣又如前論食甚在黃平限及白道限度之間能變同號為異號即亦能變異號為同號凖前論食甚在黃平限西白道限度東能變食甚與復圓異號則先推食甚與初虧異號者今反同號矣若食甚在黃平限東白道限度西能變食甚與初虧異號則先推食甚與復圓異號者今反同號矣凡此之類變態非一皆於定交角取之故可以不用十七求也相併為差分者並減實行為視行之理問用差分取視行有減實行加實行之異而相併為差分者一例用減何也曰凡相較為差分者有前小後大前大後小之殊故其於實行有減有加解見前條減者常法加者變例也凡減實行為視行者在限東者益差而東在限西者益差而西食限中如此者多故為常法若加實行為視行者限東者反損其差東之度在西者反損其差西之度乃偶一有之故為變例若相減為差分者不論前後之大小總成一差故於實行有減無加只用常法也十四求附説論食甚初虧復圓三限定交角滿象限並用時差減實行與此同理蓋彼以無可相較故徑用一時差此則雖有兩時差不以相較而且以相益故其時刻並變大而行分變小故皆減實行為視行也己為天頂庚為黃道極丑寅癸為地平子為黃平象限度子辛丙癸為地平上黃道之一象限甲乙丁壬為黃道北緯己乙丙寅為地平經圈乙為天上太隂實緯在黃道北丙為人所見太隂視度正當黃道乙丙為髙下差是地平上髙弧差乙丁為東西差是黃道經度差丙丁為南北差是黃道緯度差蓋髙卑差以天頂為宗下至地平為直角南北差以黃極為宗下至黃道為直角東西差以中限為宗下至黃極為直角而其根皆生於地靣與地心不同視之故也設太隂實髙在乙視髙在庚髙弧上乙庚之距為髙下差從黃極出經線至太隂實度乙又從黃極出經線至視度庚必過丁黃道上乙丁之距為東西差實度乙正當黃道視度庚在黃道南其距丁庚緯度與乙丙等是為南北差設太隂實髙在庚視髙在乙髙弧上庚乙之距為髙下差從黃極出經線二一過實髙庚指黃道度丁一過丙至視度乙黃道丁乙之距為東西差與丙庚等實度庚在黃道北其緯度庚丁與丙乙等視度乙正當黃道無緯度丙乙為南北差與丁庚等設太隂實髙在辛視髙在庚髙弧上辛庚之距為髙下差從黃極出經線二一過太隂實髙度辛至黃道乙乙為實度一過北緯甲及黃道丁至太隂視髙度庚丁為視度黃道上乙丁之距為東西差與甲辛丙庚等月實緯辛在黃道北其距辛乙與甲丁等視緯庚在黃道南其距丁庚與乙丙等甲庚為南北差與辛丙等厯算全書卷二十七
