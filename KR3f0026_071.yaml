body:
  text: 厯算全書卷五十八宣城梅文鼎撰幾何補編卷四方燈凡燈形內可容立方立方在燈體內必以其尖角各切於八三角面之心如圖燈體者立方去其八角也平分立方面之邊為㸃而聯為斜線則各正方面內成斜線正方依此斜線斜剖而去其角則成燈體矣此體有正方面六三角面八而邊線等故亦為有法之體凡燈體內可容八等面八等面在燈體內又以其尖角各切於六方面之心凡燈體內可容立圓此立圓內仍可容八等面此八等面在立圓內可以各角切立圓之㸃同㑹於燈體之六方面而成一㸃凡燈體容立圓其內仍可容諸體然惟八等面在立圓內仍能切燈體餘不能也按圓燈在立圓內亦能切燈體與八等面同凡諸體相容皆有一定比例以其外可知其內燈體之邊設一百其幂一萬倍之二萬開方得一百四十一四二一三為燈之高及其腰廣邊如方面高廣如斜故倍幂求之以高一百四十一四二一三乘方斜之面幂二萬得二百八十二萬八千四百二十六為方斜之立方積立方積五因六除得二百三十五萬七千二十一為燈積燈積為立方六之五以燈積減立積餘四十七萬一千四百五為內容八等面積此八等面在立積內亦在燈積內皆同腰廣同高其積之比例為立積六之一為燈積五之一此相容比例八等面與燈積不惟同高廣亦且同邊故五之一亦即為八等面與燈積同邊之比例也燈形內容立方其邊為燈體高廣三之二設燈體邊一百其高廣一百四十一四二一三則內容立方邊九十四二八八立方積八十三萬八千五十一燈高廣自乘之幂二萬如左圖甲乙方去其左右各六之一餘三之二如丙丁矩又去其兩端六之一餘三之二如戊正方丙丁矩一萬三千三百三十三三三戊正方八千八百八十八八八為內容正方之一面幂其根九十四二八八以根乘面得八十三萬八千五十一凡等邊平三角之心依邊剖之皆近大邊三之一燈內容立方之八角皆切於平三角之心燈改立方則所去者皆四圍斜面三之一於前形為六之一四圍皆六之一合之為三之一而所存必三之二矣凡立方體各自其邊之中半斜剖之得三角錐八此八者合之即同八等面體依前算八等面體其邊如方其中高如方之斜若以斜徑為立方則中含八等面體而其體積之比例為六與一何以言之如己心辛為八等面之中高庚心戊為八等面之腰廣己庚己戊戊辛辛庚則八等面之邊也若以庚心戊腰廣自乘為甲乙丙丁平面又以己辛心中高乘之為甲乙丙丁立方立方一面之形與平面等則八等面之角俱正切於立方各面之正中而為立方內容八等面體矣夫己心辛庚心戊皆八等面己庚等面為方之斜也故曰以其斜徑為立方則中含八等面體也又用前圖甲乙丙丁為立方之上下平面從己庚庚辛辛戊戊己四線剖至底則所存為立方之半而其所剖三角柱體四合之亦為立方之半也此方柱也其高之度如其方之斜立方之四隅各去一立三角柱則成此體其積為立方之半為八等面之三倍其中仍容一八等面體八等面體在方柱體內柱形從對角斜線如己辛戊庚剖至底又從對邊十字線如丑尾卯箕剖至底又從腰線角申亢橫截則剖為三角柱一十六即皆如心辛申未丑之體三角柱眠視之則塹堵也塹堵從一尖即心尖斜剖至對底未申則鱉臑也鱉臑居塹堵三之一塹堵立則為三角柱鱉臑立則為三角錐八等面體從尖心剖至對角亦剖至對邊而皆至底子又從腰角申亢橫剖之則成三角錐十六夫方柱為塹堵十六而八等面為鱉臑亦十六則塹堵鱉臑之比例即方柱八等面之比例矣鱉臑為塹堵三之一則八等面亦方柱三之一矣方柱者立方之半也八等面既為方柱三之一不得不為立方六之一矣立方內容燈體甲庚立方體六面各平分其邊如壬丑癸卯及子未酉午辰諸㸃而斜剖其八角如從丑癸剖至子從從癸卯剖至酉從酉剖至午未則立方去其八角成燈體燈體立方六之五何以知之立方所去之八角合之即成八等面八等面既為立方六之一則所存燈體不得不為立方六之五矣凡立方內容燈體皆以燈之邊線為立方之半斜立方內之燈體又容八等面則以內八等面之邊線為立方之半斜與立方竟容八等面無異推此燈內容八等面其邊線必等其中徑亦等剖立方之角成此以剖處為底則三邊等以立方之角丁為頂成三角扁錐扁錐立起則成偏頂錐為八等面分體凡八等面容燈體皆以燈體之邊線得八等面之半八等面內之燈體又容立方則亦方斜比例與八等面竟容立方無異也甲丙丁丙丁乙甲丁戊戊丁乙皆八等面之一己子卯等小三角在甲丁丙等大三角面內即燈體之八斜面正切於八等面者也其中央心㸃即內容立方角所切等徑之比例立方徑一其邊一其積一一內容燈徑一其邊七其積六之五八三三三內容八等面徑一其邊七其積六之一一六六六凡立方內容燈體燈內又容立圓圓內又容八等面其切於立方之面之中央凡六處皆同一㸃若立圓內容燈體燈內又容立方方內又容八等面其相切俱隔逺不能同在一㸃凡燈體皆可依楞橫剖如方燈橫剖成六等邊面故其外切立圓之半徑與邊等如圓燈橫剖成十等邊面故其外切立圓之半徑與其邊若理分中末之全分與其大分凡諸體改為燈皆半其邊作斜線剖之凡燈體可補為諸體皆依其同類之面之邊引之而㑹於不同類之面之中央成不同類之錐體乃虛錐也虛者盈之即成原體所以化異類為同體也如方燈依四等邊引之補其八隅成八尖即成立方若依三等邊引之補其六隅成六尖即成八等面如圓燈依五等邊引之補其二十隅成二十尖即成十二等面若依三等邊引之補其十二隅成十二尖即成二十等面增異類之面成錐則改為同類之面而異類之面隱此化異為同之道也凡燈體之尖皆以兩線交加而成故稜之數皆倍於尖方燈十二尖二十四稜圓燈三十尖六十稜凡燈體之稜即邊皆可以聯為等邊平面圈如方燈二十四稜聯之則成四圈每圈皆六等邊如六十度分圓線圓燈六十楞聯之則成六圈每圈皆十等邊如三十六度分圓線此外惟八等邊聯之成三圈每圈四楞成四等面而十二稜成六尖有三稜八觚之正法其餘四等面十二等面二十等面皆不能以邊正相聯為圈燈體亦有二其一為立方及八等面所變其體有正方之面六三角之面八有邊稜二十四而皆同長稜尖凡十有二其一為十二等面二十等面所變其體有五等邊之面十二有三角等邊之面二十有邊楞六十而皆同長稜尖凡三十立方及八等面所變是刓方就圓終𢃄方勢謂之方燈十二等面及二十等面所變是削圓就方終帶圓體謂之圓燈方燈為立方及八等面所變其狀並同而比例同甲乙立方體丙丁戊己庚辛壬癸子皆其邊折半處各於折半㸃聯為斜線如丙戊丙己等依此燈體斜線剖而去其角則成燈形矣燈形之丁辛高丙丁濶皆與立方同徑其邊得立方之半斜假如立方邊丁辛一百則燈體邊丁壬七十有竒其積得立方六之五假如立方邊一百其積百萬則燈體邊七十有竒其積八十三萬三千三百三十三三三此為立方內容燈體之比例也若燈與立方同邊必反小于燈假如燈體邊亦一百則其積二百三十五萬七千二十一而立方一百之積只一百萬是反小於燈也解曰燈體邊一百如前圖之丁壬其外切立方必徑一百四十一四二一三如前圖之丁辛其自乘之幂二萬以徑乘幂得二百八十二萬八四二六為立方積再五因六除得燈積二百三十五萬七千二十一又法以燈邊自乘倍之開方得根仍以根乘倍幂再五因六除見積亦同甲乙為八等面體甲乙丙丁戊皆其邊稜所輳之尖甲丙丁面三邊皆等其三邊折半於辛於庚於己甲丁戊面其邊折半於辛於壬於癸乙丙丁面其邊折半於寅於己於丑乙丁戊面其邊折半於丑於癸於子各以折半㸃聯為斜線則各成小三等面如甲丙丁面內又成庚辛己三等邊面其邊皆半於原邊如庚辛得丁丙之半餘三邊同各自其小三角之面之邊剖之而去其錐角則成燈形矣如依辛巳己丑丑癸癸辛四邊平剖之而去其丁角以丁角為尖辛巳丑癸為底成扁方錐甲丙乙戊尖並同則所剖處成辛巳丑癸平方面去甲壬辛庚錐成卯壬辛庚面去丙庚己寅錐成庚酉寅己面並同一法餘可類推八等面體有六角皆依法剖之成平方面六而剖之後各存原八等面中小三角等邊面八與立方剖其八角者正同燈形之高濶皆得八等面之半如辛丑高得甲乙之半己癸濶得丙戊之半其邊亦為八等面原邊之半其積得八等面八之五何以知之曰同類之體積以其邊上立方積為比例故邊得二之一其積必八之一也今所剖去之各尖俱以平方為底而成方錐兩方錐合為一八等面體皆等面等邊與原體為同類而其邊正得原邊二之一則其積為八之一也原體六尖各有所成之錐體皆相等合之成同類八等面之體凡三其積共為原積八之三以為剖去之數則所存燈體得八之五也如上圖甲乙二錐合為八等面體一丙戊二錐合為八等面體一丁尖及所對之尖其二錐合為八等面體一通共剖去同類之形三假如八等面之邊一百則其積四十七萬一千四百四其所容燈體邊五十其積必二十九萬四千六百二十七五以八等面積五因八歸之見積或用捷法竟以十六歸進位所得燈積亦同右法乃八等面內容燈體比例也若燈體之邊與八等面同大則其積五倍大於八等面假如燈體邊一百則其積二百三十五萬七千二十以八等面邊一百之積四十七萬一千四百四加五倍得之此法則燈體與八等面同為立方所容之比例亦即為燈內容八等面之比例准此而知燈內容八等面八等面又容燈則內燈體為外燈體八之一燈體內容八等面五之一用畸零乘法化大分為小分以八等面母數八乘五之一八等面內容燈體八之五得八乘母數五得四十外燈體四十八等面體八內燈體五合之為內體得外體四十之五約為八之一又八等面容燈燈又容八等面內八等面亦為外八等面八之一其體之比例既同則其所容之比例亦同也立方內容燈體燈內又容立方則內立方邊得外立方邊三之二內立方積得外立方積二十七之八以三之二自乘再乘為三加之比例也六之五一百三十五二十七之八四十八准此而知燈內容立方則內立方積得燈積一百三十五之四十八若燈容立方立方又容燈則內燈積亦為外燈積二十七之八其為所容者之比例即能容者之比例故也求方燈所去錐體三角錐稜皆五十即原邊之半甲乙甲丙甲丁底之邊皆七十七一七即燈體之邊丙乙乙丁丁丙其半三十五三五五三乙戊戊丁求甲戊斜垂線法曰乙丁為甲乙之方斜線則甲戊為半斜與乙戊戊丁等皆三十五三五五三其幂皆一千二百五十求丙戊中長線以戊丁幂三因之為丙戊幂平方開之得六十一二三七二為丙丁乙等邊三角形中長線求甲己中高線法以戊丁幂一千二百五十取三之一為己戊幂四百一十六六六六六與甲戊幂即丁戊幂相減餘八百三十三三三三三為甲己中高幂開方得甲己中高二十八八六七五又以己戊幂開方得己戊二十四一二四以己戊二十四一二四乘戌丁三十五三五五三得七百二十一六八六五又三因之得二千一百六十四五七五為乙丙丁三等邊幂又以中高甲己二十八八六七五乘之得數三除之得三角錐積二萬八百二十三六六三五又八乘之得一十六萬六千五百八十七三為所去八三角錐共積即立方一百萬六之一與前所推合本該一十六萬六千六百六十六六六不盡因積算尾數有缺然不過萬分之一耳圓燈為十二等面二十等面所變體勢並同而比例亦别公法皆於原邊之半作斜線相聯則各平面之中成小平面此小平面與原體之平面皆相似即為內容燈體之面依此小平面之邊平剖之去原體之鋭角此所去之鋭角皆成錐體錐體之底平割錐體則原體挫鋭為平亦成平面於燈體原有若干鋭亦成若干面而與先所成之小平面不同類然其邊則同如圖十二等面每面五邊等今自其各邊之半聯為斜線則成小平面於內亦五等邊為同類依此斜線剖之而去其角所去者皆成三角錐錐體既去即成三等面為異類原有十二面故所存小平面同類者亦有十二原有二十尖故所剖錐體而成異類之面者亦二十求燈體邊法以十二等面邊為理分中末之大分求其全分而半之即為內容燈體之邊一率理分中末之大分六十一八三三九八二率理分中末全分之半五十三率十二等面之邊一百四率內容燈體之邊八十九一七燈體邊原為大橫線之半十二等面邊與其大橫線若小分與大分則亦若大分與全分也而十二等面邊與燈邊亦必若大分與全分之半矣總乘較為實戊丙底為法法除實得丙辛以丙辛減戊丙得戊辛折半為戊己法當以所得戊己自乘為句幂用減甲戊幂餘為甲己幂開方得一十七八四一一為中高今改用捷法省求丙辛取戊丙幂九之一為戊己幂戊己為戊內三之一故其幂為九之一得五百四十五四二三七或徑用戊丁幂三之一亦同又捷法不求甲戊斜垂線但以戊丁幂三分加一以減甲丁即甲丙或甲乙幂為甲己幂開方即得甲己中高比前法省數倍之力戊丁幂一千六百三十六二七一二三之一五百四十五四二三七併得二千一百八十七六九四九甲丁即甲丙幂二千五百相減餘甲乙幂三百一十八三五一與前所得同解曰原以戊丁幂減甲丁幂得甲戊幂復以戊丁幂三之一減甲戊幂得甲己幂今以戊丁三分加一而減甲丁幂即徑得甲己幂其理正同前之捷法有求丙辛及較總相乘後用底除諸法可謂捷矣今法徑不求甲戊斜垂線捷之捷矣凡三角錐底濶等者當以為式訂定三角錐法圓燈所去用捷法以戊丁幂三分加一減甲丁幂為甲己幂甲丁甲乙甲丙皆設五十丙丁丁乙乙丙皆八十九一七其半戊丁戊乙四十四五八半丙戊七十六二九為底之垂線甲己一十七八四一一為中高丙乙丁底幂二千八百三十四一三八法以半邊戊丁乘中長丙戊得底幂丙乙丁以中高甲己乘底幂丙乙丁得三角柱積五萬五百六十三五二九三三除之得錐積一萬六千八百五十四五九七又以二十乘之為燈體所去之積三十三萬七千九十一九四十二等面邊設一百前推其積為七百六十八萬三千二百一十五今減去積三十三萬七千九十存燈積七百三十四萬五千一百二十五內容燈體邊八十九一七依測量全義凡同類之體皆以其邊上立方為比例可以推知二十等面所變之燈體二十等面邊設一百則燈體之邊五十捷法求得一百七十三萬三千九百四十八為設邊五十之燈積一燈體邊八十九一七之立方五十二萬九千百八五二燈體積七百三十四萬五千一百二十五三燈體邊五十之立方一十二萬五千四燈體五十之積一百七十三萬三千九百四十八圓燈邊設三十九一七即理分中末之大分乙丁外切立圓半徑五十即理分中末之全分丁中乙中外切立圓全徑一百即外切立方體積四十萬三千三百四十九內有三角錐計二十共計一十二萬八千七百五十二五稜錐計十二共積二十七萬四千五百九十六丁中丙乙三角錐為圓燈分體之一乙丁丙三等邊面巳為平面心中為體心中巳為分體之中高戊丁為半邊丁中自體心至角線為分體之稜戊中為斜垂線乙癸中辛五稜錐亦圓燈分體之一乙丁癸壬辛五等邊面庚為平面心中庚為分體中高其戊丁半邊丁中分體稜戊中斜垂線與前三角錐皆同一線何以知兩種錐形得同諸線乎曰乙戊丁邊兩種分體所同用而兩種錐體皆以體心中為其頂尖故諸線不得不同觀上圖自明先算三角錐共二十半邊一十五四五八五戊丁幂二百三十八七二八七平面容圓半徑即戊巳八九一五其幂七十九五七六二用捷法取戊丁幂以三除得之平面積乙丙丁面四百一十三四八七九中高即己中四十六七七五本法以戊丁幂減丁中幂為戊中幂又以戊丁幂三之一當戊己幂減之為巳中幂今徑以戊丁幂加三之一減丁中幂為己中是捷法也三角錐積六千四百三十七六六二二十錐共積一十二萬八千七百五十三三四次算五稜錐共十二半邊一十五四五八五戊丁半周七十七二五四二五用半邊五因得之平面容圓半徑二十一二六六三戊庚五等邊平積一千六百四十二九一二中高四十一七八五三庚中五稜錐積二萬一千九百六十二六六十二錐共積二十七萬四千五百九十六求戊庚半徑一率三十六度切線七二六五四二率全數一三率半邊戊丁一十五四五八五四率平面容圓半徑戊庚二十一二六六二戊丁句幂二百三十八七二八七丁中弦幂二千五百戊中股幂二千二百六十一二七一三戊庚句幂四百五十二二五五五戊中弦幂二千二百六十一二七一三庚中股幂一千八百九一五八戊丁半邊幂四因之為全邊三十九一七之幂一燈體邊五十之立方一十二萬五千二燈體邊五十之體積一百七十三萬三千九百四十八三燈體邊三十九一七之立方二萬九千五百八四九八七四燈體邊三十九一七之體積四十萬九千三百二十九與細推者只差五千九百八十為八十分之一柱積六萬八千六百四十九錐積二萬二千八百八十三十二錐共積二十七萬四千五百九十六孔林宗附記方燈可名為二十四等邊體圓燈可名為六十等邊體四等面體又可變為十八等邊體為六邊之面四為三邊之面四凡十二角又可變為二十四等面體面皆三邊凸邊二十四凹邊十二十字之交六凡八角如蒺藜形六等面體又可變三十六等邊體為八邊之面六為三邊之面八凡二十四角八等面體亦可變三十六等邊體為六邊之面八為四邊之面六凡二十四角又可變四十八等邊體為四邊之面十八為三邊之面八凡二十四角大圓容小圓法平渾甲大圓內容乙戊丙三小圓法以小圓徑如乙戊戊丙為邊作等邊三角形而求其心如丁乃於丁戊三角形自心至角線加戊甲小圖半徑為大圓半徑丁甲凡平圓內容三平圓四平圓五平圓六平圓皆以小圓自相扶立若平圓內容七平圓以上皆中有稍大圓夾之甲大渾圓內容丙戊乙己四小渾圓法以小渾圓徑如乙戊戊巳等為邊作四等面體而求其體心如丁次求體心至角線如丁戊丁己丁乙丁丙又為外切立圓半徑加小渾圓半徑即戊甲為大圓半徑如丁甲凡渾圓內容四渾圓或容六渾圓或容八渾圓十二渾圓皆直以小渾圓自相扶若渾圓內二十渾圓則中多餘空必內有稍大渾圓夾之甲大平圓內容乙戊丙己四小平圓法以小圓徑如乙戊等為邊作平方如乙戊丙己方而求其斜如丁乙即方心至小圓心線加小圓半徑如乙甲為大圓半徑如丁甲若先有大圓甲而求所容小圓則以三率之比例求之一率方斜併數二四一四二率方根一三率所設之渾圓半徑丁甲四率所容之小圓半徑乙甲推此而知五等邊形於其鋭角為心半其邊為界作小圓而以五等邊之心至角如半邊以為半徑而作大圓則大圓容五小圓俱如上法若六等邊於其鋭作小圓仍可於其心作圓共七小圓何也六等面之邊與半徑等也其法只以小圓徑即六等邊二分加一為大圓半徑甲大渾圓內容乙丙等六小渾圓法以小渾圓之徑為邊作八等面虛體如乙己丙辛戊皆小立圓之心聯為線則成八觚乃求八等面心丁至角之度如丁乙等加小圓半徑如甲乙為大渾圓半徑如甲丁捷法以小渾圓徑為方即乙己丙辛平方求其斜如丁乙加小圓半徑如甲乙為大圓半徑或以小渾圓徑自乘而倍之開方得根加小圓半徑為大圓半徑亦同或先得大圓而求小圓徑則用比例一率方斜并二四一四二率方根一三率所設大渾圓之徑四率內容六小渾圓之徑甲渾圓內容乙丙戊已庚壬辛及癸丑子寅卯十二小圓法以小立圓徑如乙丙等作二十等面虛體之稜如乙丙等俱小圓之心聯為線則成二十等面之稜次求體心丁至角即小圓心之線如乙丁加小圓半徑如甲乙為大圓半徑如甲丁按體心至角線即二十等面外切圓半徑二十等面之例邊一百即小渾圓例徑外切渾圓例徑二百八十八一三五五二十等面邊一百者其外切渾圓徑一百八十八奇又加小渾例徑得此數若先有大渾圓而求所容之十二小渾圓則以二率為一率四率為三率一外切渾圓之例徑二百八十八一三五五二二十等面之例邊一百即小渾圓例徑三設渾圓之全徑一百四內容十二小渾圓之徑三十八六九四八其比例如全分與小分甲庚大平圓內容七小圓法以甲庚圓徑取三之一如丁乙庚辛等為小圓徑若容八圓以上則其數變矣假如以七小圓均布於大圓周之內而切於邊則中心一小圓必大於七小圓而後能相切以上倣此甲大渾圓內容八小立圓法以小圓徑作立方如乙庚方求其立方心至角數即外切渾圓半徑如乙丁再加小圓半徑如甲乙為大渾圓半徑如甲丁按八小員半徑十甲乙則其全徑二十內斜線乙丁十七加甲乙共二十七內減小圓徑二十餘七倍之得十四是比小圓半徑為小其比例為十之七安得復容一稍大小圓在內乎又二十等面有十二尖可作十二小圓以居大渾圓之內而為所容又八等面有六尖可作六小圓為大渾圓所容四等面有四尖可作四小圓又方燈亦有十二尖可作十二小圓為大渾圓所容其中容空處仍容一小圓為十三小圓皆等徑也十二等面有二十尖用為小渾圓之心可作二十小立圓以切大渾圓內有稍大渾圓夾之圓燈尖三十可作三十小球亦皆以內稍大渾圓夾之公法皆以心至尖為小渾圓心距體心之度皆以小渾圓徑為所作虛體邊如作內容二十小渾圓聯其心成十二等面虛體虛體之各邊皆如小渾圓徑也虛體之各尖距心皆等此距心度以小渾圓半徑加之為外切之大渾圓半徑以小渾圓半徑減之為內夾稍大渾圓半徑渾圓內容各種有法之體以查曲線弧面之細分公法凡有法之體在渾圓體內其各尖必皆切於渾圓之面凡渾圓面與內容有法體之尖相切成㸃皆可以八線知其弧度所當內惟八等面皆以弧線十字相交為正角餘皆鋭角其十二等面則鈍角十二等面每面五邊等析之從每面之角至心成平三角形五則輳心之角皆七十二度半之三十六度即甲心乙角其餘心乙甲角必五十四度倍之為甲乙丁角則百八度故為鈍角凡渾圓面切㸃依內切各面之界聯為曲線以得所分渾體之弧面皆如其內切體等面之數之形如四等面則其分為弧面者亦四而皆為三角弧面十二等面則亦分弧面為十二而皆成五邊弧形八等面則弧面亦分為八二十等面弧面亦分二十而皆為三角弧形內惟六等面為立方體所分弧面共六皆為四邊弧形凡渾圓面上以內切兩㸃聯為線皆可以八線知其幾何長其法以各體心到角之線命為渾圓半徑以此半徑求其周作圈線即為圓渾體過極大圈以八線求兩㸃所當之度即知兩㸃間曲線之長凡渾圓面以曲線為界分為若干相等之弧面即可以知所分弧面之幂積假如四等面外切渾圓依切㸃聨為曲線分渾圓面為四則此四相等三角形弧面各與渾圓中剖之平圓面等幂何也渾圓全幂得渾體中剖平圓面之四倍今以渾幂分為四即與渾圓中剖之平圓等幂矣推此而知六等面分外切渾圓幂為六即各得中剖平圓三之二八等面分渾圓幂為八即各得中剖平圓之半幂十二等面分渾圓幂為十二即各得中剖平圓三之一二十等面分渾圓幂為二十即各得中剖平圓五之一凡依等面切渾所剖之圓幂又細剖之皆可以知其分幂假如四等面所分為渾圓幂四之一而作三角弧面若中分其邊而㑹於中心則一又剖為三為渾圓幂十二之一與十二等面所分正等但十二等面所剖為三邊弧線等此所分為四邊弧線形如方勝而邊不等若自各角中㑹於心成三邊形其幂亦不等也再剖則一剖為六為渾圓面幂二十四之一皆得十二等面所剖之半而邊不等若但一剖為二則得渾圓幂八之一與八等面所剖正等但八等面三邊等又三皆直角此則邊不等又非直角假如八等面所剖為渾幂八之一若一剖為二則十六之一剖為四則三十二之一可以剖為六十四至四千九十六若以三剖則渾幂二十四之一如十二等面之均剖亦如四等面之六剖也再細剖之可以剖為九十是依度剖也可以剖為五千四百則依分剖也再以秒微剖之可至無窮惟八等面可以細細剖之者以腰圍為底而兩弦㑹於極其形皆相似故剖之可以不窮又以此知曲面之容倍於平面何也八等面所剖之渾體腰圍即平圓周也以平圓周之九十度為底兩端皆以平徑為兩弦以㑹於平圓之心則其幂為平圓四之一若渾體四面以腰圍九十度為底兩端各以曲線為兩弦以㑹於渾圓之極則其幂為平圓二之一矣假如六等面即立方在渾圓內剖渾幂為六得渾幂六之一若一剖為二則與十二等面所剖等剖為四則二十四之一再剖則一為八而得四十八之一假如十二等面剖渾幂為十二各得渾幂十二之一若剖一為五則得六十之一再剖一為十則得百二十之一而與八等面所剖為十五之一假如二十等面剖渾幂為二十各得渾幂二十之一若一剖二則四十之一若一剖三則六十之一若一剖六則百二十之一皆與十二等面所剖之幂等而邊不必等也凡球上所剖諸幂以為底直剖至球之中心成錐形即分球體為若干分如四等面之幂得球幂四之一依其邊直剖至球心成三角錐其錐積亦為球體四之一推之盡然幾何補編補遺平三角六邊形之比例平三角等邊形甲丁丙三邊等形其邊丁甲折半丁乙自乘而三之即為對角中長線幂開方得中長線丙乙既得中長線丙乙以乘丁乙半邊即等邊三角形積若以丙乙幂丁乙幂相乘得數平方開之得三等邊形之幂積捷法不求中長線但以丁乙幂三因之與丁乙幂相乘開方得根即三等邊幂積或用原邊丁甲自乘得數乃四分之取四之一與四之三相乘得數開方得三等邊積亦同論曰邊與邊橫直相乘得積若邊之幂乘邊之幂亦必得積之幂矣故開方得積法曰以原邊之幂三因四除之又以原邊之半乘之兩次為實平方為法開之得三等邊形幂積解曰原邊幂四之三即中長幂也半邊乘二次以幂乘也又法以原邊與半邊幂相減相乘開方見積平三角等邊形幂積自乘之幂與平方形幂積自乘之幂若三與十六理同前條解曰甲戊庚丁為平方形丁丙甲為等邊三角形其邊同為甲丁題言丁甲線上所作三等邊形與所作正方形其積之比例若平積三與十六之平方根也即一七竒與四捷法於分面線上取三點為等邊三角形積其十六點即正方積若以邊問積則以邊之方幂數於分面線之十六點為句置尺取三點之句即得三等邊積其設數得數並於平分線取之此用比例尺算又法作癸卯辰半員辰癸為徑於徑上勻分十七分而儘一端取其四分如丑癸丑癸為辰癸十七分之四則丑子為辰子十六分之三折半於丁以丁為心丁癸為半徑作癸壬丑小半員又以丁癸折半於子作卯子直線與辰癸徑為十字埀線割小員於壬則壬子與卯子之比例即三等邊幂與正方幂積比例用法有三等邊形求積法以甲丁邊上方形即庚甲積作卯子直線如句四倍之作橫線如辰子為股次引橫線取子癸為卯子四之一又取丁子如癸子次以丁癸為半徑丁為心作半員截卯子於壬即得壬子為三等邊積捷法不作辰子線但於子作半十字線如癸丁次於子點左右取癸取丁各為卯子四之一乃任以丁為心癸為界作割員分即割卯子於壬而為三等邊形之積論曰此借用開平方法也平方求根有算法有量法此所用者量法也量法有二其一以兩方之邊當句當股而求其弦是為并方法也其一用半員取中比例此所用者中比例也詳比例規解附三等邊求容圓法曰以原邊之幂十二除之為實平方開之得容圓半徑解曰原邊幂十二之一即半邊三之一也附三等邊形求外切圓法曰以原邊之幂三除之為實平方開之得外切圓半徑一法倍容圓半徑即外切圓半徑新增求六等邊法法曰六等邊形者三等邊之六倍也以同邊者言用前法得三等邊積六因之即六等邊積依前法邊上方幂與三等邊形幂若四與一七竒因顯邊上方幂與六等邊形幂若四與十二竒亦若一與二五五今有六等邊形問積法以六等邊形之一邊自乘得數再以二五五乘之降兩位見積解曰置四與一二各以四除之則為一與二五五之比例也若問員內容六等邊形者即用員半徑上方幂為實以二五五為法乘之得數降二位見積亦同降二位者一除也依顯平員積與其內容六等邊形積之比例若三一四與二五五論曰六等邊形之邊與外切員形之半徑同大故以半徑代邊其比例等半徑上方與六等邊形亦若一與二五五然則員全徑上方形與內容六等邊形必若四與二五五全徑上方原為半徑上方之四倍而員面幂積與六等邊形積亦必若三一四與二五五矣員徑上方與員幂原若四與三一四故也用尺算用平分線求同根之幂平方幂四八十皆倍而退位之數平員冪三一四約為六十三弱實六二八六等邊冪二五五五十一三等邊冪一七三十四右皆方內容員員內又容六角之比例其六等邊與員同徑乃對角之徑也於六等邊之邊則為倍數三等邊則只用邊若六等邊形亦即用邊與平方平員之全徑相比則如後法平方四平方一平員三一四平員七八五四六角一二六角二五五三角一七三角四二五論曰以平方平員之徑六角三角之邊並設二則為平方四之比例若設一則如下方平方一之比例也量體細法四等面體求積法曰以原邊之幂三除之得數以乘邊幂得數副置之又置邊幂二十四除之得數以乘副平方開之即四等面積也又法置半邊冪三除之得數以乘半邊幂得數副置之又以六為法除半邊幂得數為實平方開之即四等面積四分之一也即三角扁錐算二十等面二十等面之稜線甲丁設一百七十八原設一百一十因欲使外切立方與十二等面同故改此數心乙一百四十四即原切十等邊之半徑又為外切立方之半徑外切立方徑二百八十八求中心為分體之高法先求乙中乃各棱折半處至三角面中央一點之距依幾何補編半甲丁得八十九為甲乙自乘七千九百二十一取三之一得二千六百四十又三之一為乙中句幂又以心乙一四四自乘二七三六為弦幂相減餘一萬八千九十五又三之二為股幂開方得心中一百三十四半強為分體鋭尖之高倍之得二百七十九半弱為內容立員徑求甲心為分體斜棱法以甲乙為句其幂七九二一以乙心為股其幂二七三六併之二八六五七為弦幂開方得甲心一百六十九二為分體自角至鋭之斜棱倍之三百三十八半弱為外切渾員之徑或取理分中末線之大分如心乙為股小分如甲乙或丁乙為句取其弦甲心或丁心為二十等面自角至心之楞線合之成甲心丁形即二十等面分形之斜立面也甲丁則原形之楞也如甲心丁之面三皆以心角為宗以甲心等弦合之三面皆有此弦則甲丁等底三底並同甲丁以尖相遇而成三等邊之面即二十等面之一面也以此為底則成三角尖錐矣尖錐之立三角面皆等皆稍小於底解曰乙戊與甲乙等而甲心與戊心即乙心不等如弦與股乙戊即十等邊之一邊乃二十等面橫切之面之邊今欲求心中正立線中即二十等面一面之中自此至心成心中線則其正高也法先求甲中為句取其幂以減甲心弦幂即心中股幂開方得心中簡法取乙甲即原楞之半又即小分自幂三之一以減乙心即大分又即原楞均半處至形心即斜立面中線之幂即心中幂又解曰原以甲乙半楞又即二十等面中剖所成之楞即十等邊之一邊故為小分為句在形內為小分乃乙戊也今形外之甲乙與甲乙同大故亦為小分乙心即二十等面中切成十等邊自角至心之弦故為大分又即為二十尖錐各立面三角形之中長線為股則甲心為弦自各角至體心之線而甲心弦幂內有乙心股甲乙句兩幂今求心中之高則又以甲中為句自各角至各面心也而仍以甲心為弦弦幂內減甲中句幂則其餘心中股幂也依幾何補編甲乙幂三分加一為甲中幂故但於乙心幂內減去甲乙幂三分之一即成心中股幂又解曰若以乙心為弦則中乙為句而心中為股依補編中乙幂為甲乙幂三分之一故直取去甲乙幂三之一為句幂以減心乙弦幂即得心中股幂開方得心中此法尤捷作法以二十等面之楞如甲丁折半如甲乙或丁乙亦即甲戊為理分中末之小分求其大分如乙心即二十等面各楞線當中一點至心之線亦即外切立方之半徑再以大分為股乙心小分為句甲乙亦即甲戊亦即戊乙取其弦甲心即二十等面自各角至心之線謂之角半徑亦即切員半徑再以原楞甲丁為底切員半徑為兩弦甲心及丁心成兩等邊之三角形即二十等面體自各角依各楞線切至體心而成立錐體之一面三面盡如是則成三角立錐矣如是作立錐形二十聚之成二十等面體立錐體之中高線心中以乘三體面之幂而三除之得各錐積二十乘錐積得立積其中高線心中即內容立員之半徑立方內容二十等面體其根之比例若全分與大分立方內容十二等面體其根之比例若全分與小分二十等面體之分體並三楞錐以元體之面為底原體之楞甲丁折半甲乙為小分為句取其大分心乙為股句股求弦得自角至心為外切員之半徑心甲假如甲丁原楞一百一十半之得甲乙半楞五十五自乘三千二十五為句幂其大分乙心即外切立方半徑八十九自乘七千九百二十一為股幂并二幂一萬九百四十六平方開之得弦一四又六二不盡約為一四半强為角至體心之線心甲即外切立員之半徑算二十等面之楞於渾天度得幾何分法以心甲為渾天半徑甲乙為正弦法為心甲與甲乙若半徑與甲心乙角之正弦查正弦表得度倍之為丁甲通弦所當之度算十二等面五等邊面為十二等面之一面有五邊在體之面則為五楞錐其一楞設一百一十甲丙半之五十五乙丙以甲丙為小分求其大分得一百七十八丙戊也即丙丁壬丁壬戊丁角為丙中甲角之半與平圓十等邊之一面等半之八十九已丙也即乙辛以丙巳乙為兩腰等形辛巳乙亦兩腰等形故辛乙與巳丙等丙巳分乙乙形與元形丙戊甲形相似巳角即戊角而乙丙為小巳或辛乙為大分為內作小五等邊之一邊乙辛亦即十二等面從腰圍平切之十等邊面也又以乙辛為小分求得大分一百四十四心乙也分圖辛心乙形即前圖辛心乙形乙辛為心壬之小分心乙為大分乙心線即五等面一邊折半處至體心之距丙㸃即五等面邊兩楞相凑之角丙辛形乙丙辛虛線形即前圖乙為甲丙半楞乙丙之全分何則前圖之丙巳乙形乙丙為小分丙巳為大分試於辛乙心形內分圖作庚辛乙形與丙巳乙形等庚乙即乙丙五等面一邊之半乙辛庚辛即丙巳乙巳為小五邊形之一邊則乙庚為小分乙辛為大分心庚同今又以乙辛為小分求其大分壬癸而壬癸即心乙也乙癸同夫心乙乃庚乙小分辛乙大分即心庚之并則乙心為庚乙之全分矣其比例心乙與心庚若心庚與庚乙而乙心即外切立圓半徑也右法楊作枚補今求心中線為五等邊最中一㸃中至體心心之距亦即內容渾員半徑先求乙中線為五等邊各楞折半處至最中之距法為甲乙比乙中若半徑與五十四度之切線一半徑一二乙甲中角五十四度切線一三七六三八三半楞甲乙五十五四中乙七十五七用句股法以心乙一百四十四為弦中乙七十五七為句句弦各自乘相減得心中股幂平方開之得中高線心中為容員半徑求得容員半徑一百二十二半弱心中又求甲心線為各角至體心之距即外切渾員半徑用句股法以甲乙五五為句心乙一四四為股并句股幂求甲心弦求得外切圓半徑一百五十四强甲心十二等面根一一甲丙外切立員半徑一四四心乙全徑二八八內容渾員半徑一二二半心中全徑二四五弱外切渾員半徑一五四甲心全徑三八强十二等面之分體並五楞錐並以五等邊面為底原體之楞甲丙設一百一十半之乙甲五十五為小分求其全分乙心一百四十四即外切立方半徑乙甲五十五自乘三千二十五為句幂心乙一百四十四自乘二萬七百三十六為股幂并之得二萬三千七百六十一平方開之得弦一百五十四强為自角至心之線甲心即外切員半徑作法以五等面之一邊為底楞甲丙以外切員半徑角至心之線為兩弦之楞甲心及丙心而㑹於心五邊悉同則為十二分體之一如是十二枚則成十二等面體變體數求渾圓積設渾圓徑一自乘得一又十一古法乘之得一一為實十四除之得七八五七一四為平圓面幂或用舊徑七圍念二之比例亦得圓面七八五七一四以四因之得渾圓之幂三一四二八五六置渾圓之幂以半徑五因之得一五七一四二八是為以渾圓面幂為底半徑為高之圓柱形積置圓柱形積以三為法除之得五二三八九三三三是為以渾圓面幂為底半徑為高之圓角形積亦即渾圓之積渾圓根一體積五二三八九三三三用為公積立方置公積即渾圓積五二三八九三三三立方開之得立方根八六二二七一七是為與渾圓等積之立方方錐置公積五二三八九三三三以三因之得數立方開之得高濶相等之方錐形根一一六二二四四四四七是為與渾圓等積之方錐方錐圓柱置公積同上十四因之十一除之為實立方開之得高濶相等之圓柱形根八七四二三九四二是為與渾圓之積之圓柱圓柱圓錐置公積同前以三因之變圓錐形積為圓柱積再以十四因之十一除之為實變圓柱積為立方積立方開之得高濶相等之圓錐形根一二五九四七五九是為與渾圓等積之圓錐或置積以四十二因之十一除之立方開之亦同圓錐按變體線本法有四等面八等面十二等面二十等面諸數表皆未及其同者惟有渾圓立方二形其餘三形皆比例規解及測量全義之所未備今以法求之則皆長濶相等而不為渾圓立方者耳夫不為渾圖立方而仍可以法求者以其長濶相等則仍為有法之形也然而與今西書所載合者二不合者一意者其傳之有誤耶或其所用非徑七圍二十二之率耶俟考渾圓以徑求積置徑自乘又以半徑乘之又四因之又以十一乘之以十四除之又以三除之見積解曰平圓與平方之比例知其周與周假如七則方周二十八圓周二十二兩率各折半為十四與十一徑自乘則為平方形以十一乘十四除則平方變為平圓矣以平圓為底半徑乘之成圓柱形再以三歸之成圓角形即圓錐渾圓面幂為底半徑為髙之角形四倍大於此圓角形故又四因之即成渾積也捷法徑自乘以乘半徑乃以四十四因四十二除見積或徑上立方形二十二因四十二除或用半數十一因二十二除見積並同渾圓以積求徑置積以三因之四除之又以十四因之十一除之再加一倍立方開之得圓徑解曰圓積是圓角形四今三因之變為圓柱形四矣故用四除則成一圓柱此圓柱形是半徑為髙全徑之平圓為底今以十四乘十一除則變為全徑之平方為底半徑為髙矣故加一倍即成全徑之立方捷法積倍之以四十二因四十四除立方開之得圓徑或用本積以八十四乘四十四除立方開之或用半數以四十二乘二十二除立方開之或又折半以二十一乘乘十一除立方開之得積並同按徑七圍二十二者乃祖冲之古法至今西人用之可見其立法之善雖異城有同情也雖其於真圓之數似尚有盈朒然所差在微忽之間而已吾及錫山楊崑生柘城孔林宗另有法其所得之周俱小於徑七圍二十二之率則其所得圓積亦必小於古率矣楊法立圓徑一積五二三八九二五六四孔法立圓徑一積五二三五九八七七五約法立方與立圓之比例若二十一與十一平圓與外方若十一與十四平圓與內方若十一與七圓內容方之餘即四小弧矢形若七與四圓外餘方即四角減弧矢若十一與三准此則餘圓即小弧矢與餘方若四與三而小弧矢與其所減之餘方角若一與七五亦若四與三也厯算全書卷五十八
