body:
  text: 厯算全書卷五十二宣城梅文鼎撰三角法舉要卷三内容外切三角測量之用在邉與角而其内容外切亦所當明故次于算例之後内容有二曰本形曰他形一三角求積積謂之冪亦謂之面乃本形所有一三角容員一三角容方以上皆形内所容之他形外切惟一一三角形外切之員三角求積第一術底與髙相乗折半見積内分二支一句股形即以句股為底為髙一銳角鈍角形任以一邉為底而求其垂線為髙假如句股形甲乙股一百二十尺乙丙句三十五尺求積術以甲乙股乙丙句相乗四千二百尺折半得積凡求得句股形積二千一百尺如圖甲乙股與乙丙句相乗成甲乙丙丁長方形其形半實半虚故折半見積或以句折半十七尺半乗股亦得積二千一百尺如圖乙丙句折半於戊以乙戊乗甲乙成甲乙戊丁形是移丙戊己補甲丁己也或以股折半六十尺乗句亦得積二千一百尺如圖甲乙股折半於己以己乙乗乙丙成己乙丙丁形是移甲己戊補戊丁丙也右句股形以句為底以股為髙若以股為底則句又為髙可互用也句股形有立有平若平地句股以句為濶以股為長其理無二論曰凡求平積皆謂之冪其形如網目又似窓櫺之空皆以横直相交如十字亦如機杼之有經緯而成布帛故句股是其正法何也句股者方形斜剖之半也折半則成正剖之半方形矣其他銳角鈍角或有直無横有横無直必以法求之使成句股然後可算故句股者三角法所依以立也假如銳角形甲乙邉二百三十二尺甲丙邉三百四十尺乙丙邉四百六十八尺求積術先求垂線用銳角第三術任以乙丙邉為底以甲丙甲乙為兩弦兩弦之較數一百零八尺總數五百七十二尺相乗六萬一千七百七十六尺為實以乙丙底為法除之得數一百三十二尺轉減乙丙餘數三百三十六尺半之得乙丁一百六十八尺依句股法以乙丁自乗二萬八千二百二十四尺與甲乙自乗五萬三千八百二十四尺相減餘數二萬五千六百尺平方開之得甲丁垂線一百六十尺以甲丁垂線折半乗乙丙底得積凡求得銳角形積三萬七千四百四十尺如圖移辛補壬移庚補癸則成長方形即垂線折半乗底之積右銳角形任以乙丙邉為底取垂線求積若改用甲乙或甲丙邉為底則所得垂線不同而得積無異故可以任用為底假如鈍角形甲乙邉五十八步甲丙邉八十五步乙丙邉三十三步求積術求垂線立於形外用鈍角第三術以乙丙為底甲乙甲丙為兩弦總數一百四十三步較數二十七步相乗三千八百六十一步為實乙丙底為法除之得數一百一十七步内減乙丙餘數八十四步折半四十二步為乙丁即乙丙引長邉依句股法乙丁自乗一千七百六十四步甲乙自乗三千三百六十四步相減餘數一千六百步平方開之得甲丁四十步為形外垂線以乙丙底折半十六步半乗之得積凡求得鈍角形積六百六十步如圖甲乙丙鈍角形移戊補庚移庚己補壬癸又移壬子補辛成辛癸丑長方即乙丙底折半乗中長甲丁之積右鈍角形以乙丙為底故從甲角作垂線若以甲乙為底則自丙角作垂線亦立形外而垂線不同然以之求積並同若以甲丙為底從乙角作垂線則在形内如銳角矣其垂線必又不同而其得積無有不同故亦可任用一邉為底凡用垂線之髙乗底見積必其線上指天頂底線之横下應地平兩線相交正如十字故其所乗之冪積皆成小平方可以虚實相補而求其積數鈍角形引長底線以作垂線立於形外則兩線相遇亦成十字正方之角矣總論曰三角形作垂線於内則分兩句股鈍角形作垂線於外則補成句股皆句股法也三角求積第二術以中垂線乗半周得積謂之以量代算假如鈍角形乙丙邉五十八步甲乙邉一百一十七步甲丙邉八十五步求積術平分甲乙兩角各作線㑹于心從心作十字垂線至乙甲邉如心庚即中垂線也乃量取中垂線心庚得數一十八步合計三邉而半之一百三十步為半周以半周乗中垂線得積凡求得鈍角形積二千三百四十步又術如前取中垂線心庚為濶半周為長如乙癸及丁壬别作一長方形如乙壬丁癸即與甲乙丙鈍角形等積解曰凡自形心作垂線至各邉皆等故中垂線乗半周為一切有法之形所公用方員及五等面六等面至十等面以上並同故以中垂線為濶半周為長其所作長方形即與三角形等積又解曰中垂線至邉皆十字正方角即分各邉成句股形以乗半周得積即句股相乗折半之理附分角術有甲角欲平分之術以甲角為心作虚半規截角旁兩線得辛壬二㸃乃自辛自壬各用為心作弧線相遇于癸作癸甲線即分此角為兩平分三角求心術如上分角術於甲角平分之于乙角又平分之兩平分之線必相遇成一㸃此一㸃即三角形之心解曰試再於丙角如上法分之則亦必相遇於原㸃三角求積第三術以三較連乗又乗半總開方見積假如鈍角形甲乙邉一百一十六尺甲丙邉一百七十尺乙丙邉二百三十四尺求積術合計三邉而半之二百六十尺為半總以與甲乙邉相減得較一百四十四尺與甲丙邉相減得較九十尺與乙丙邉相減得較二十六尺三較連乗以兩較相乗得數又以餘一較乗之也得數三十三萬六千九百六十尺又以半總較之得數八千七百六十萬零九千六百尺平方開之得積凡求得鈍角形積九千三百六十尺若係銳角同法解曰此亦中垂線乗半周之理但所得為冪乗冪之數故開方見積詳或問三角容員第一術以弦與句股求容員徑此術惟句股形有之凡句股相併為和以和與弦併為弦和和以和與弦相减為弦和較假如甲乙丙句股形甲丙句二十步乙甲股二十一步乙丙弦二十九步求容員徑術以句股和四十一步與弦相減得數為容員徑凡求得内容員徑一十二步解曰此以弦和較為容員徑如圖從容員心作半徑至邉又作分角線至角成六小句股形則各角旁之兩線相等如丙戊丙庚兩線在丙角旁則相等乙庚乙己在乙角旁甲戊甲己在甲角旁並兩線相等其在正方角旁者甲戊甲己乃弦和較也于乙丙弦内分丙庚以對丙戊又分乙庚以對乙己則其餘為甲戊及甲己此即句股和與乙丙弦相較之數也然即為内容員徑何也各角旁兩線並自相等而正方角旁之兩線又皆與容員半徑等正方角旁兩小形之角皆平分方角之半則句股自相等而甲戊等心戊甲己等心己然則弦和較者正方角旁兩線甲戊甲己之合即容員兩半徑心戊心己之合也故弦和較即容員徑也試以甲戊為半徑作員則戊心亦半徑而其全徑癸戊甲與容員徑丁心己等以甲己為半徑作員則己心亦半徑而其全徑辛己甲與容員徑戊心壬亦等三角容員第二術以周與積求容員徑内分二支一句股形以弦和和為用亦可用半一銳角鈍角形以全周半周為用假如甲乙丙句股形甲丙句一十六步甲乙股三十步乙丙弦三十四步求容員徑術以句股相乗得數四百八十步為實併句股弦數共八十歩為法除之得數倍之為容員徑凡求得容員徑一十二步解曰此以弦和和除句股倍積得容員半徑也如圖從容員心作對角線分其形為三一甲心丙一甲心乙一丙心乙乃於甲丙句線兩端各引長之截子甲如乙甲股截丙丑如丙乙弦則子丑線即弦和和也乃自員心作癸壬直線與丑子平行兩端各聫之成長方又作辛丙線分為三長方形其濶並如員半徑其長各如句如股如弦而各為所分三小形之倍積甲辛長方如甲丙句之長而以心戊半徑為濶即為甲心丙分形之倍甲癸長方如乙甲股之長而以同心己之半徑為濶即為乙心甲形之倍丙壬長方如丙乙弦之長而以同心庚之半徑為濶即為乙心丙形之倍合之即為本形倍積與句股相乗同也句股相乗為倍積見求積條故以弦和和除句股相乗積得容員半徑假如甲乙丙句股形甲丙句八十八尺甲乙股一百零五尺乙丙弦一百三十七尺求容員徑術以句股相乗而半之得積四千六百二十尺為實併句股弦數而半之一百六十五尺為法除之得數倍之為容員徑凡求得内容員徑五十六尺解曰此以半周除句股形積而得容員半徑也半周即弦和和之半如圖從容員心分本形為六小句股則同角之句股各相等可以合之而各成小方形同甲角之兩句股成丁己小方形同丙角之兩句股可合之成丁辛長方形以心辛丙形等丙戊心也同乙角之兩句股可合之成己庚長方形以乙庚心形等心戊乙也乃移己庚長方為辛癸長方則癸甲即同半周而癸己大長方即為半周乗半徑而與句股積等也六小形之句皆原形之周變為長方則兩兩相得而各用其半是半周也癸甲及壬己之長並半周壬癸及己甲辛丙之間並同心丁是半周乗半徑也辛癸長方與己庚等積即與乙角旁兩句股等積又丁辛長方與丙角旁兩句股等積再加丁己形即與原設乙甲丙句股形等積矣然則以句股相乗而半之者句股形積也故以半周除之即容員半徑矣或以弦和和除四倍積得容員全徑並同前論論曰句股形古法以弦和較為容員徑與弦和和互相乗除乃至精之理測員海鏡引伸其例以為測望之用其變甚多三角容員盖從此出故為第一支假如甲乙丙銳角形乙丙邉五十六尺甲丙邉七十五尺甲乙邉六十一尺求容員徑術以乙丙邉為底求得甲丁中長線六十尺法見求積以乗底得數三千三百六十尺倍之六千七百二十尺為實合計三邉共一百九十二尺為法除之得容員徑凡求得内容員徑三十五尺解曰此以全周除四倍積得容員徑也如圖自容員心作對角線分為小三角形三各以員半徑為髙各邉為底若於各邉作長方而各以邉為長半徑為濶必倍大於各小三角形如壬丙長方倍大于丙心乙形丙丑長方倍大于丙心甲形甲丁長方倍大于甲心乙形又作加一倍之長方則四倍大於各小三角如未乙長方倍大于丙壬長方必四倍于丙心乙三角則夘甲亦四倍于丙心甲而甲酉亦四倍于甲心乙於是而通為一大長方移夘甲長方為亥丙移甲酉為乙辰則成亥午大長方形矣必四倍原形之冪而以三邉合數為長以容員之徑為濶然則以中長線乗底而倍之者正為積之四倍也以三邉除之豈不即得員徑乎或以全周除倍積得容員半徑或以半周除積得容員半徑並同若鈍角形亦同上法論曰銳角鈍角並以周為法此與句股形用弦和和同但必先求中長線故為第二支三角容員第三術以中垂線為員半徑曰以量代算假如甲乙丙三角形求容員徑既不用算故不言邉角之數如求積術均分甲乙二角之度各作虚線交於己即己為容員之心次以己為心儘一邉為界運規作員此員界必切三邉於是從己心向三邉各作十字垂線必俱在切員之㸃而等為員半徑知半徑知全徑矣半徑各如己庚線論曰此容員心即三角形之心故以容員半徑乗半總即得積也又案此術亦句股及銳鈍兩角通用三角容員第四術用三較連乗假如甲乙丙鈍角形乙丙邉四百三十二尺甲丙邉五百尺甲乙邉一百四十八尺求容員徑術以半總五百四十尺求得乙丙邉較一百八尺甲丙邉較四十尺乙甲邉較三百九十二尺三較連乗得數一百六十九萬三千四百四十尺以半總除之得數三千一百三十六尺四因之一萬二千五百四十四尺為實平方開之得容員徑凡求得内容員徑一百一十二尺銳角同法解曰此所得者為容員徑上之自乗方冪故開方得徑三角容方第一術合底與髙除倍積得容方徑内分二支一句股形即以句股為底為髙即句股和也其容方依正方角一三角形以一邉為底求其垂線為髙句股形以弦為底銳角形三邉皆可為底鈍角形以大邉為底其容方並依為底之邉假如甲乙丙句股形甲丙股三十六尺乙丙句一十八尺求容方依正方角而以容方之一角切於弦術以句股相乗得數六百四十八尺為實以句股和五十四尺為法除之得所求求到内容方徑一十二尺如圖作寅乙線與股平行作寅甲線與句平行成寅丙長方為句股形倍積次引寅甲線横出截之於癸引乙丙句横出截之於夘使引出兩線甲癸及丙夘皆如甲丙股仍作夘癸線聫之乃從癸作斜線至乙割甲丙股於戊則戊丙為所求容方之邉又從戊作申未横線與上下兩線平行割甲乙弦於己則己戊為所求容方之又一邉末從己作午辛立線割丙乙句於辛則己辛及辛丙又為兩對邉而四邉相等為句股形内所容之方解曰寅夘大長方以癸乙斜線分兩句股則相等而寅戊與戊夘兩長方等則寅丙長方與申夘長方亦等寅丙内减寅戊而加相等之戊夘即成申夘夫寅丙者句股倍積而申夘者句股和乗容方徑也乙丙句丙夘股合之為申夘形之長申乙及未夘並同方徑為濶故以句股和除倍積得容方徑又解曰寅丙長方分兩句股而等則寅戊與午丙兩長方等寅己與己丙既等則于寅戊内减寅己而加相等之己丙即成午丙而寅戊原等戊夘則午丙亦與戊夘等夫午丙形之丙甲與戊夘形之丙夘皆股也則兩形等積又等邉矣其長等其濶亦等甲丙與丙夘既等則辛丙與戊丙亦等而對邉悉等即成正方形論曰此以句為底股為髙也若以股為底句為髙所得亦同其容方依正方角乃古法也三角以底濶合中長除積盖生於此是為第一術之第一支假如甲乙丙句股形乙丙弦二十八尺其積一百六十八尺求容方依弦線而以容方之兩角切於句股術以弦除倍積三百三十六尺得對角線一十二尺與弦相併四十尺為法倍積為實法除實得所求求到容方徑八尺四寸如圖作寅丑線與乙丙弦平行又作寅丙及丑乙與甲丁對角線平行成丑丙長方為句股形倍積次引乙丙弦至夘引寅丑線至癸使癸丑及夘乙並同甲丁仍作癸夘線聫之次從癸向丙作斜線割丑乙線於子遂從子作申未線與乙丙弦平行割甲乙股於庚割甲丙句於己則庚己為容方之一邉末從庚作辰壬線從己作午辛線並與甲丁平行而割乙丙弦於壬於辛則辛壬及庚壬及己辛三線並與庚己等而成正方解曰寅子長方與子夘長方等積癸丙線分寅夘形為兩句股而等則兩句股内所作之方必等午壬長方又與寅子等寅丁形以甲丙線分為兩句股則寅己與己丁等又丑丁形以甲乙線分為兩句股則丑庚與丁庚等若移寅己作己丁移丑庚作丁庚則午丁等寅戊而辰丁等丑戊合之而午壬等寅子則午壬亦與子夘等而午壬之邉午辛及辰壬子夘之邉夘乙及未子並等甲丁對角線則兩形午壬子夘等積又等邉矣其長等其濶亦等辰壬既等夘乙則辛壬亦等子乙而庚壬及己辛亦不得不等故四線必俱等也又解曰寅子既與子夘等則寅乙必與申夘等于寅乙内移寅子居子夘之位即成申夘而寅乙者倍積也申夘者底偕中長乗容方徑也乙丙弦也夘乙即甲丁對角中長線也合之為丙夘之長其兩端之濶申丙及未夘並同方徑故合弦與對角線為法以除倍積得容方徑論曰此以一邉為底中長線為髙也既以一邉為底其容方即依此一邉而以兩方角切餘二邉也句股形故以弦為底若銳角形則任以一邉為底但依大邉則容方轉小亦如句股形依方角之容方必大於依弦線之容方也鈍角形但可以大邉為底其求之則皆一法也是為第一術之第二支三角容方第二術以圖算内分二支一以法截中長線得容方徑句股形即截其邉一以法截兩斜邉得容方邊句股形即截其弦假如銳角形求容方任以一邉為底如圖以乙丙最小邉為底先從對角甲作中長垂線至丁又從乙角作丑乙立線與甲丁平行而等乃從甲角作横線過丑至癸截丑癸亦如甲丁乃從癸向丙角作斜線割丑乙立線於子末以子乙之度截中長線甲丁垂線於戊即戊丁為容方之徑從戊作己庚又從己作線至辛從庚作線至壬成庚己辛壬即所求容方解曰甲戊與戊丁若甲丁與乙丙子丑癸句股與子乙丙形有子交角必相似則丑子句與子乙句若丑癸股與乙丙股而丑子原與甲戊等子乙與戊丁等丑癸與甲丁等則甲戊與戊丁亦若甲丁與乙丙又甲戊與己庚若甲丁與乙丙甲己庚三角為甲丙乙之截形必相似則甲戊與己庚若甲丁與乙丙合兩比例觀之則甲戊與戊丁若甲戊與己庚而己庚即戊丁以上並銳角形凡銳角三邉並可為底而皆一法假如句股形求容方以股為底則於句端甲作横線與股平行而截之於癸使癸甲如甲乙句乃自癸向丙作斜線割甲乙句於戊則戊乙即容方之一邉末作己戊與股平行作己辛與句平行即成容方或以句為底則從股端丙作丙癸横線與股等亦作癸甲斜線割丙乙股於戊其所得容方亦同圖如左論曰銳角鈍角皆截中長線為容方徑句股形以弦為底亦然惟句股形以句為底即截其股為容方徑用股為底即截句不另求中長而與截中長之法並同是為第二術之第一支假如乙丙丁三角求容方依乙丙邉為底如圖以乙丙底作正方形即甲乙丙戊方又作丁辛對角線次作甲辛及戊辛兩斜線割原形之兩斜線於己於庚乃作己庚線為所求容方之一邉末作己壬及庚癸兩線成小方形於形内即所求解曰甲戊與己庚若子辛與午辛也己庚辛三角形為甲戊辛之切形則其横與直之比例相等而甲戊與子辛同為方徑而等則己庚與午辛亦同為小方徑而等若底上方形大則其徑亦大於對角線則如第二圖引丁辛線至子其理亦同有此二法則三邉並可為底鈍角形用大邉為底句股形用弦為底並同第二圖若句股形以句為底求容方如圖即用乙丙句作丙辛庚乙方形從方角庚向丙作斜線割丁乙弦於壬從壬作癸壬及甲壬二線即所容方或用股上方則引出句邉如股解曰庚丙線分丙角為兩平分則其横直線自相等壬癸與癸丙相等壬甲與甲丙相等則四線皆等而成正方嘉禾陳䃤菴用分角法求容方與此同理論曰此皆以底上方形為法而得所求小方也故不論頂之偏正其所得容方並同惟句股容方依正方角則中長線與原邉合而為一法雖小異其用不殊是為第二術之第二支三角形外切平員第一術句股形以弦為徑假如甲乙丙句股形乙丙弦長四尺五寸二分求外切員術以弦折半取心得半徑二尺二寸六分其弦長四尺五寸二分即外切平員全徑以平員周率三五五乗之徑率一一三除之得員周一十四尺二寸如圖乙丙員徑即句股形之弦折半於丁即員心也以乙丁半徑為度從丁心運規作員必過甲而句股形之角皆切員周矣論曰凡平員徑上從兩端各作直線至員周相㑹則成正方角如乙丙徑之兩端于丙于乙各作直線㑹于甲則甲角必為正角而為句股形假令兩線相遇于庚即成庚乙丙句股形于辛亦然以其皆正角故也故不問句股長短而並以其弦為外切員之徑又論曰徑一百一十三而周三百五十五此鄭端清世子所述祖冲之術也見律吕精義按古率周三徑一李淳風等釋古九章以為術從簡易舉大綱而言之誠為通論諸家所傳徑五十周一百五十七則魏劉徽所改謂之徽率徑七周二十二則祖冲之所定謂之宻率由今以觀冲之自有兩率一為七與二十二一為一一三與三五五盖以其捷者為恒用之須而存其精者明測算之理亦可以觀古人之用心矣三角形外切平員第二術分邉取員心内分二支並以圖算一句股形但分一邉即得員心其心在弦一銳角形鈍角形並分二邉可得員心銳角形員心在形内鈍角形員心在形外假如甲乙丙句股形求外切員術任於句或股平分之作十字正線此線過弦線之㸃即為員心如圖甲乙丙形以甲乙股平分於戊從戊作庚丁正十字線至乙丙弦即分弦為兩平分而丁即員心從丁運規作外切員則甲乙丙三㸃並切員周而乙丁丙丁庚丁皆半徑論曰若平分甲丙句於辛從辛作十字正線亦必至丁故但任分其一邉即可得心又論曰若依第一術先得丁心從丁心作直線與句平行即此線能分股線為兩平分如丁庚線與甲丙句平行過甲乙股即平分股線于戊若與股平行而分句線亦然如丁辛線與甲乙股平行即分句線于辛右句股形外切平員之心在弦線中央假如銳角形求形外切員術任以兩邉各平分之作十字線引長之必相遇於一㸃即為員心如圖甲乙丙銳角形任以甲丙邉平分之于戊作庚戊丁十字線又任以乙丙邉平分之於壬作癸壬丁十字線兩直線稍引長之相遇於丁以丁為心作員則甲乙丙三角並切員周而丁癸丁庚皆半徑論曰試於餘一邉再平分之作十字正線亦必㑹於此㸃故此㸃必員心如甲乙邉再平分之于辛作子辛丁十字線亦必相遇于丁㸃右銳角形外切平員之心在形之内假如鈍角形求形外切員術同銳角如圖甲乙丙形甲為鈍角任分甲丙於戊分甲乙於辛各作十字線㑹於丁心從丁作員則丁庚丁癸皆半徑而三角並切員周若用大邉平分于壬作壬丁子線亦同論曰試於丁心作線至丙至乙至甲必皆成員半徑與丁庚丁癸同故丁為員心也右鈍角形外切平員之心在形之外總論曰此與容員之法不同何也内容員之心即三角形之心故其半徑皆與各邉為垂線而不能平分其邉然從心作線至角即能分各角為兩平分此分角求心之法所由以立也外切員之心非三角形之心其心或在形内或在形外距邉不等而能以十字線剖各邉為兩平分此分邉求心之法所由以立盖即三㸃串員之法也附三㸃串員有甲乙丙三㸃欲使之並在員周術任以甲為心作虚員分用元度以丙為心亦作虚員分兩員分相交於戊於辛作戊辛直線又任以乙為心以丙為心各作同度之虚員分相交於庚於壬作庚壬直線兩直線相遇於丁以丁為心作員則三㸃並在員周員周有三㸃不知其心亦用此法厯算全書卷五十二
