body:
  text: 歴算全書卷三十六宣城梅文鼎撰筆算卷三異乘同除法以先有之數知今有之數兩兩相得是生比例莫善於異乘同除乃古九章之樞要也先有者二今有者一是已知者三而未知者一用三求一故西法謂之三率今先明同異名之説以著古法次詳三率之用以顯通理異者何也言異名也同者何也言同名也假如以粟易布則粟與粟為同名布與粟為異名也何以為異乗同除也主乎今有之物以為言也假如先有粟若干易布若干今復有粟若干將以易布則當以先所易之數例之是先易之布與今有之粟異名也則用以乗是謂異乗若先有之粟與今有之粟同名也則用以除是謂同除皆用以乘除今粟故曰主乎今有以為言也置今有粟以異名之布乘之為實再以同名之粟為法除之是皆以今粟為主而以先有之二件乘除之也問何以不先除後乗曰以原總物除原物總價則得每物之價以乗今有總物亦可得今有之總價然除有不盡則不可以乗故變為先乗後除其理一也假如原有豆一百八石價銀三十六兩今有豆一百三十五石問價若干答曰四十五兩法曰置今豆一百三十五石以原豆價三十六兩乗之得四千八百六十兩為實以原豆一百八石為法除之得四十五兩為今豆應有之價見以物求價也若還原則以價求物假如原有銀四十五兩買豆一百三十五石今有銀三十六兩問豆若干答曰一百八石法以豆一百三十五石乘價三十六兩得四千八百六十石為實以價四十五兩為法除之得一百八石合問西人三率法其法以先有之二件為一率二率今有之二件為三率四率則前兩率之比例與後兩率之比例等故其數可以互求今冇之二率先只有其一合前有之二率共為三率以求之而得今有之餘一率是以三求一故曰三率法實四率也假如一率是三二率是四三率是九則四率必為十二何也三與四之比例若九與十二也故以四二率九三率相乘卅六為實以三一率為法除之必得十二四率若互用之以四率為一率則十二與九之比例若四與三故曰可以互求此即還原之理解曰以三比四以九比十二並三分加一之比例以十二比九以四比三並四分減一之比例凡言比例等者皆如是此以上圖之四率為一率也故其序皆倒而所得四率即上圖之一又更而互之凡二三相乘與一四相乘等積此立法之根觀右圖可明四九相乘三十六而十二與三相乘亦三十六故以三除三十六得十二以十二除三十六亦復得三此前兩圖互求之理若更一四為二三其實同為三十六故以四除之得九以九除之亦復得四此後兩圖互求之理又錯綜之此又以前圖之二與三更之則前兩率之第二變為後兩率之第一而其比例亦等凡一率二率為前兩率乃先有之二件也三率四率為後兩率乃今有之兩件也今以二率三率相易則是先有之次率變為今有之首率也然以比例言之在前圖為三與四若九與十二者在此圖則三與九亦若四與十二也若以一率除二率得數以乗三率亦得四率如以一率三除二率九得三以乘三率四亦必得四率十二以一率四除二率十二得三以乗三率三亦得四率九但先除後乗多有不盡之分故異乗同除為算家大法乃中西兩術所同也試仍以古圖明之原有小麥十二石換食鹽九石俱四分之三比例若以上左今有小麥四石換食鹽三石右更置即成三率之前四圖更之以縱為横原有粱米三石換棉布九疋俱三倍之比例若以上下左右今有粱米四石換棉布十二疋更置即成三率之錯綜四圖辨法實凡三率之用皆以二率乘三率為實首率為法除之以得所求為四率然何以定其孰為一率孰為二率三率也曰此則古人同異名之法不可易也訣曰凡今有之已知者常定為三率其未知者待算而知則常為四率視先有之物與三率之今有同名者定為首率其與今有異名必為二率矣又訣曰凡三率之法以三件求一件其所求之一件未知而三件則巳知也此已知之三件中必有兩件同名如價與價物與物之類就以此同名之兩件審其孰為先有定為首率其今有者則為三率而其餘異名之一件亦必先有也恒為二率假如有句股形田長一百三十五步闊四十五步今截相似形長一百八步問闊若干答曰截闊三十六步定法實訣以今截長一百八步定為三率長與長同名以原長一百三十五步定為首率濶與長異名以原濶四十五步定為二率又訣此巳知之三件是原長原闊截長内長與長同名以原長是先有之數定為首率截長是今有之數為三率原濶與長異名為次率按原長與原濶即大句大股截長截濶即小句小股也四者皆可以遞互相求三率中更互錯綜之理尤為易見以比例言之大股與大句若小股與小句也更之則小股與小句亦若大股與大句也此為以股求句反之而以句求股則大句與大股亦若小句與小股也又更之則小句與小股亦若大句與大股也又錯綜之則大股與小股若大句與小句也而大句與小句亦必若大股與小股矣又小句與大句若小股與大股也而小股與大股亦必若小句與大句矣是為三率之八變異乘同除定位法三率定位與乗法除法無異乗法以實單位為根定所對得數為法尾數除法以法首上一位作識定所對得數為所求單數並詳前巻但所用之實以二率三率相乗而得握算者或疑其數之驟陞而不能守其定法則定位必訛而其理益晦矣故復論之諸家算術往往有定位不確者皆由見乘後數多未免驚怖而輙為酌改故也假如六箇時辰馬行二百一十里今行五箇時辰當有若干里答曰一百七十五里論曰試以六時除馬行二百一十里得每時行三十五里以乘五時亦得一百七十五里原無可疑今先乗後除故以一千五十里為實驟觀之似乎太多究竟除後適得其本數而已假如銀三十二兩換錢三萬六千文今有銀二十八兩問錢若干答曰三萬一千五百文若以三十二兩除三萬六千得毎兩錢一千一百二十五文以乗二十八兩亦得三萬一千五百文知得數之同則知一百萬零八千之非誤異乗同除約分法三率内有兩率相凖可用約分者即改用所約之數易繁為簡如法乘除所得無誤而用加㨗矣兩率者其一首率其一次率或三率也凡以法約之必兩率相準次率三率祗則用其一皆取其與首率相凖也或兩率並為偶數俱折半或兩率並可均剖為四則折半兩次或兩率並可均分為三則各取三之一或兩數互減而得等數則以等數約之並如約分法論其比例為十八比半之則九與八以三約之則六與十以九約之則二與十再約之則為一十六若九十九與八之比例亦若九六之比例若三十三六之比例若十一與與八若十一與十八也十九與八十八與八十八八十八八十八假如賃房九箇月銀七十八兩問住二年該若干答曰二百零八兩法以二年成二十四个月依式列之四二百零八八乗廿六即得此數假如八色金六十兩換銀二百八十八兩今有九色金五十兩該若干答曰二百七十兩此以金折成足色六十兩作四十八兩五十兩作四十五兩算之四二百七十十八乘十五得此數右皆約得一數為首率故不須除但以二率乗三率即得所求為四率重測法三率有疊用兩次者謂之重測即兩箇異乘同除假如有夏布四十五丈欲換棉布但云毎夏布三丈價二錢棉布七丈價七錢五分問換棉布若干答曰二十八丈一夏布三丈先用為法四價三兩法除實得此數重列一價七錢五分又用為法四棉布二十八丈法除實得此數此因兩布各有其價故先用法求得第四率以夏布變為銀就以此定為重列之第三率即今價也而以棉布價七錢五分為首率以與今價同名也棉布七丈為次率以與今價異名也如法乘除得所換棉布為四率併乗除法以兩次乘除併而為一是合兩三率為一三率也即古法之同乘同除古以併乘為異乗同乗以併除為異除同除今乘除俱用併法故謂之同乘同除也假如今有芝麻五十四石欲換黄米但云芝麻三石換緑豆五石換黄米三石問該換黄米若干答曰六十七石五斗本法重列一麻三石豆四石二豆五石米三石三今麻五十四石今豆九十石此重列之第三即先得之第四乃本法也四該豆九十石米六十七石五斗簡法即併法今以兩首率相乘為首率亦以兩次率相乘為次率以兩九十石對去不用故三率省乗是為併法實簡法也論曰本用兩次乘除今以豆四石乘麻三石得十二石以除是併兩次除為一次除也以米三石乘豆五石得十五石以乗是併兩次乘為一次乗也依法求之即得所換米六十七石五斗與兩次求者數同又因一率二率可用約分約之為四與五而法益簡然則第三率何以獨異第三率徑用今麻不以豆九十石乗之是與併兩首率為首率併兩次率為次率者逈别曰重列之第三即先得之第四故可以對去不用不惟不用亦可不求重列之第三率既無乗併之用則原列之第四率不必更求其數而乗除之用已偹今麻原係第三率今仍用為第三是三率之用本無所缺即所求之得數已清矣若第三率用豆九十石乗過之則所得第四率亦必為豆九十石乘過之米得數後必以九十石除之始能清出米數反多曲折今對去豆九十石不用則所得四率即米數直截了當故為簡法又式假如有戰兵七百名毎年額餉一萬二千六百兩内有新着伍兵三百名已經應役七个月問該餉銀若干答曰三千一百五十兩依重測併乘除法當以十二月乘七百名得八四為法以七箇月乗一萬二千六百得八八二又以三百名乘之得二六四六為實法除實得三千一百五十兩為兵三百名七箇月之餉今用約分以七百與三百約為七與三皆百約之則首率次率各有七對去不用可省併乘重列之時徑以十二為首率餉銀一二六為次率三為三率依法乘除而得四率又以首率十二三率三約為四與一則徑以餉一二六為實以四為法除之得三千一百五十合問變測法古謂之同乗異除在三率謂之變測即幾何原本之互視法也凡異乘同除皆以先有之一率為法即首率以先有之又一率乘今有之一率為實即二率三率相乗若同乘異除則反以今有之一率為法同文算指列於第三今依法實之序定為首率以先有之兩率自相乘為實同文算指列於第一第二今定為第二第三雖亦以法除實得今所求之又一率即四率與諸三率同而法實相反故曰變測假如用秤稱物物重秤不能稱外加一錘稱得八十四斤本錘一斤五兩加錘一斤三兩問其物實重若干答曰一百六十斤一錘重二十一兩為法四實重一百六十斤法除實得數法以錘一斤五兩作二十一兩加錘一斤三兩作十九兩共重四十兩為先有之一率稱重八十四斤為先有之又一率相乘三三六為實以本錘重二十一兩為今有之一率為法法除實得實重一百六十斤為所求今有之又一率合問假如秤失去錘有所稱物重一百六十斤今以他物代錘重四十兩稱得重八十四斤問錘重若干答曰一斤五兩一物重一百六十斤二稱得重八十四斤三他物代錘重四十兩四錘重二十一兩假如布幔一具用布十六丈五尺布濶二尺今有布濶一尺五寸如式作幔該用若干答曰二十二丈一今濶一尺五寸二原濶二尺三原長十六丈五尺四今長二十二丈假如儲粟方窖長一丈二尺濶九尺深一丈今欲别穿一窖藏粟與之等長亦一丈二尺但深加二尺五寸該濶若干答曰濶七尺二寸一今深十二尺五寸二原深十尺三原濶九尺四今濶七尺二寸此原長不動而加深減濶也長今深今濶相乘得九十尺與原深乘原濶等以乘一十二尺得一千零八十尺亦等則其藏粟等又問若依原窖之濶九尺但加長三尺該深若干答曰深八尺一今長十五尺二原長十二尺三原深十尺四今深八尺此原濶不動而加長減深也今長乘今深得一百二十尺與原長乘原深等以乘濶九尺並得一千零八十尺假如有方倉高一丈八尺濶二丈深二丈一尺今更造一倉亦深二丈一尺但高減三尺問闊若干答曰濶加四尺共濶二十四尺所儲米石即同原倉之容一今高十五尺二原高十八尺三原濶二十尺四今濶二十四尺此原深不動而減高増濶也當與右二條叅㸔倉之高即窖之深倉之深即窖之長今高乘今濶得三百六十尺與原高乗原濶等再以深二丈一尺乘之得七千五百六十尺與原倉之容積等假如原借八五色銀四十八兩今還九六色銀問該若干答曰四十二兩五錢一今銀色九六為法四今還四十二兩五錢法除實得數解曰原銀八五色是毎兩實折八錢五分故以乘原銀得四十兩零八錢乃折實紋銀之數也還銀九六色是毎九錢六分成一兩故以除折實紋銀得四十二兩五錢為應還之數凡零乘數反損零除數反增詳别巻假如有田一區用三十二人耕治五日而畢今用四十人問該幾日答曰四日一今用四十人二原用三十二人三原耕五日四今耕四日假如決水修池水竇濶三尺十二日涸出今開濶八尺問水涸幾日答曰四日有半一今濶八尺二原濶三尺三原十二日四今四日半假如額兵五千六百設有一年之餉今祗留兵三千三百六十名問其餉可支幾時答曰一年零八箇月一今兵三千三百六十二原兵五千六百三原設餉十二箇月四今可支二十箇月歴算全書巻三十六
