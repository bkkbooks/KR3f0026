body:
  text: 厯算全書巻二十二宣城梅文鼎撰厯學駢枝卷二大統厯交食通軌用數目録周天三百六十五度二十五分七十五秒按此即歩氣朔章用數但彼以萬分為度法此以百分為度法故百分為分而分為秒名異而實同也半周天一百八十二度六十二分八十七秒半周天象限九十一度三十一分四十三秒七十五㣲平分周天度為半周天又平分之則為象限乃四分周天之一如兩儀之分四象也半嵗周一百八十二度六十二分一十二秒半此太陽行天半嵗之度也亦以度為百分與氣朔章異而以日命度則同以較半周天不及七十五秒乃嵗差所自生嵗差一分五十秒若以萬分命度則為一百五十分交終度三百六十三度七十九分三十四秒一十九㣲六此以月平行度乘交終之數月入交一轉凡行天度有此數也交中度一百八十一度八十九分六十七秒九八此以月平行乘半交之數月入交一半凡行天度有此數也正交度三百五十七度六十四分此于交終度内減去六度一五有竒也中交度一百八十八度五分此于交中度内加入六度一五有竒也日食入交度有加減者日既髙于月黄道在天亦髙于月道故當其初入隂厯六度時月之行天雖在日北而人之見月尚在日南中交度所以有加也及其將入陽厯尚差六度時月之行天雖在日内而人之見月已出日外正交度所以有減也此皆由測驗而得也其所以然則亦中國地勢為之前凖一百六十六度三十九分六十八秒前者交前也入隂厯滿此是在正交前也入陽厯滿此是在中交前也以後凖減交中即得後凖一十五度五十分後者交後也入陽厯在此數以下是正交後也入隂厯在此數以下是中交後也凖者定也凡月食在交前後以此為定盖無論交前交後皆以十五度五十分為定過此則不食也前凖數雖多以減交中度則以十五度五十分也月平行分一十三度三十六分八十七秒半置月行極遲極疾度數一轉之積以月行一轉之日平分之得此數日行分八分二十秒此乃一限之日行分也月行一限在日周一萬内􅀢八百二十分也盖萬分日之百即百分度之一分也日食分二十分此置日食十分倍之倂日體月影各十分即二十分月食分三十分此置月食一十五分倍之倂月體十分闇虚二十分共三十分隂食限八度定法八十分隂者月入隂厯是在黄道北在日内也在日内則易為揜故八度食也隂食八度故隂定法亦八十分以八十分除八度即得隂食十分也陽食限六度定法六十分陽者月入陽厯是在黄道南在日外也在日外則難為揜故六度食較隂食近也陽食六度故陽定法亦六十分以六十分除六度即得陽食十分也月食限一十三度五分定法八十七分以定法八十七除一十三度五分即得月食一十五分也月既小于闇虚闇虚所至即月所至無髙下故不論隂陽厯皆十三度即食也闇虚者日之影倍大于月故月食十有五分所謂既内既外也日月食限數凡數滿萬為日千為十刻百為單刻陽食入交在日五十刻已下日月不食在二十六日二刻已上日月皆食在一十三日刻已上日月皆食在一十四日七十五刻已下上日月皆食在日五千四百五五已下上日月皆食在二十五日六一五一已上日月不食在一十二日八九已上日月不食在一十四日一五一六已下日月皆食隂食入交在一日二十五刻已下不食在一十二日四十二刻已上下月食在一日一八七二已下日食在二十六日二四九已上日月皆食在一十二日四一八九已上在一十四日七九三三已下又在交朢一十四日七六五二九六五已下日月皆食又在交終二十七日二一二二二四已下日月皆食又在交中一十三日六六一一二已下日月皆食右各日月食限如日食視其定朔小餘在夜刻者如月食視其定朢小餘在晝刻者即同不食亦不必推算也又與各交泛者數同則食也不同者不食其已上已下皆指小餘而言凡數自萬已上為大餘自千已下為小餘凡日食視其定朔小餘在一千二四九以下八千八百以上皆在夜刻也起亥初初刻止丑正四刻凡月食視其定朢小餘在三千一六已上七千八三已下皆在晝刻也起辰初初刻止申正四刻晝夜刻仍宜以日出八分與定朔朢小餘相較而定之按自定朔之法行而日食必在朔厯家以是騐其疎密者千有餘年矣厯至授時法益密數益簡雖然月有交也逐逐歩算雖簡亦繁許學士之譏世醫謂獵不知兎廣絡原埜術已疎矣今通軌所載食限顛倒繆亂殆不可以數求其誤後學將何已乎今為訂定如左今考定日月入交食限朔汎交入陽厯在日五一六已下為入食限已上者日不食在一十三日一四五已上為入食限已下者日不食朔汎交入隂厯在一十四日不問小餘皆入食限其小餘在一五一六已下一三七已上者的食在一十五日一七七九已下為入食限已上者日不食在二十五日六四四已上為入食限已下者日不食在二十六日不問小餘皆入食限其小餘在六六六七已上六八七六已下者的食又在交終二十七日二一二二二四已下為入食限又在交中一十三日六六一一二已上為入食限朢汎交不問隂陽厯在日不問小餘皆入食限其小餘在七九六六已下者月的食在一日一五五六已下為入食限已上者不食在一十二日四五五已上為入食限已下者不食其小餘在八九五已上者月的食在一十四日七六一七已下為入食限已上者不食其小餘在四二七已下者月的食在二十六日五六六已上為入食限已下者不食其小餘在四一五六已上者月的食又在交終二十七日二一二二二四已下月的食又在交中一十三日不問小餘皆的食右日月食限皆視其朔朢入交泛日其不入食限者即不必布算也其入的食限者必食也其入食限不言的者或食或不食也是皆以算御之也凡言已上已下者皆指小餘有不問小餘者則只以大餘命之也又視其定朔小餘如在日入分後及日出分前十分以上者夜刻也定朢小餘如在日入分前及日出分後七百三十分以上者晝刻也日食在夜刻月食在晝刻即不得見初虧復圓同不食限不必布算也按日食隂厯距交前後二十一度而止以月平行除之得一日五七一八日食陽厯距交前後六度七十一分而止以月平行除之得日五一六即各食限也其隂厯距交前後七度一三四至七度二九三四為日的食限月平行除之得日五千二百四六至日五千四百五五也其陽厯則無的食何也盖日食雖有陽食限六度隂食限八度其實總在隂厯陽厯本無蝕法也今所定陽厯食限以諸差得之皆或限也諸差者何一曰盈縮差加減之極至二度四十分一曰南北東西差加減之極至四度四十六分幷二數六度八十六分内除未交陽厯前原空有一十五分餘六度七十一分是為陽厯食限也其隂厯的食起七度一至七度二九止者正交中交限距交皆六度一十五分而陽食限只六度是原空一十五分也如入盈縮差幷南北東西差六度八十六分共七度一而差變極矣故的限以比起置正交中交距交數加隂食限八度共一十四度一十五分内減去盈縮差幷減去南北東西差餘七度二九而差變極矣故的限以此終不入此限度皆或限也置正交中交距交數加隂食限共一十四度一十五分又加入盈縮差又加入南北東西差共二十一度是為隂厯食限也盖極其變可以得其常執其常可以追其變今所訂定食限皆要其變之極者言之而其常可知也又按月食不問隂陽厯只距交前後一十五度四十五分而止在月平行得一日一五五六為食限也其距交前後一十度六十五分在月平行得日七九六六為的食限也夫月食何以不問隂陽厯也月之掩日以形形則有所不周日之掩月以氣氣則無所不及故日必以隂厯食月不問隂陽厯皆食陽全隂半之理也又月雖掩日尚不能直至于日之所也故有東西南北差日以闇虚掩月則直至于日之所也故亦無東西南北差惟其不用東西南北差也故只以盈縮差二度四十分加其食限一十三度五分而得食限一十五度四十五分或食之數止此而差變極也只以盈縮差二度四十分減其食限一十三度五分而得的食限一十度六十五度或不食之數亦至此而差變極也又按夜刻不見日食以時差分與定用分相較知之大約日出入夘正酉正合朔當之時差之多至六百五十分若當二至日出入其差乃極亦不下六百三十分故定朔分若與日出入同者其食甚皆在日出前日入後六百三十分以上也假如日食十分當月行極遲之限定用分極多至六百三十五分止矣故知定朔在日出分前一十分以下者即不得見未復光定朔在日入分後一十分以上者即不得見初虧斷為夜刻無疑也其晝刻不見月食亦以時差分與定用分相較知之依授時時差法朢在卯酉正時差之多至一百三十分若當二至日出入其差為極亦不下八十九分故定朢若與日出入分同者其食甚皆在日入前日出後八十九分已上也假如月食十五分當月行極遲之限定用分多至八百十六分止矣故知定朢在日出分後七百三十分已上者即不得見初虧定朢在日入分前七百三十分已上者即不得見未復光斷為晝刻無疑也授時算月食時差法見後時差條又按大衍厯有九服交食法庚午元厯有里差自宋以前厯法皆有晷漏所在差數今所定只據授時厯經所載大都食法其日出入據立成所載盖是應天漏刻也元統作通軌是洪武中故用南都漏刻授時立法時宜有諸方漏刻及里差推歩之術今皆失傳故只據通軌日食通軌録各有食之朔下數經朔全分盈縮厯全分盈縮差全分遲疾厯全分遲疾限數遲疾差全分加減差全分定朔全分入交泛日全分按有食之朔即所推其朔入交汎日入食限者也故其下所有數皆全錄之盖數以倚數叅伍相求此所錄皆母數原定朔時俱已推定故也月食倣此推定入遲疾厯法置所推或遲厯或疾厯全分以本日下加減差加者加之減者減之得為定入遲疾厯分也按原推遲疾是經朔今以差加減之則是定朔下遲疾也推定入遲疾厯限數法置所推定入遲疾厯全分依朔下限數法推之即得按定朔遲疾既不同經朔則其入轉限數亦異故復定之推定限行度法視所推定入遲疾限與太隂立成相同限下遲疾行度遲用遲行度疾用疾行度内減日行分八分二十秒于度下二位減即為定限行度也定限行度内減去八分二十秒者月行一限日行八百二十分于百分度法為八分二十秒也盖右旋之度月速于日立成中遲疾行度月行于天之數此所推定限行度乃月行距日之數即日月兩行之較也假如一限内月行一度日亦行八分二十秒則月行之多于日行為九十一分八十秒推日出入半晝分法視有食之朔下是盈厯者大餘若干用立成内冬至後相同積日下日出入半晝分全錄之是縮厯者大餘若干用立成内夏至後相同積日下日出入半晝分全錄之按日出入者所以定帶食也以全晝之分半之為半晝分所以定午也只用經朔盈縮厯不加減者所差半日而極無甚差數也推嵗前冬至天正赤道宿次度分法置嵗差一分五十秒定二子為實以所距積年減一算十定一百定二為法乘之言十定一得數定有四子為度置箕宿十度相減餘為赤道箕宿度分也按嵗差者日行黄道之度所毎嵗遷徙不常者也堯時冬至在虚一度至元冬至在箕十度漸差而西也嵗差一分五十秒者凡六十六年有八月而差一度也原至元冬至在箕十度至今所求年又差幾度故以距算乘嵗差而得所差之數以減箕宿十度便知退在箕宿幾度也嵗差之度自東而西其數為退故用減也推嵗前冬至天正黄道宿次度分法置所推赤道度分内減去黄道立成相同積度下第三格積度全分餘有十定三子有分定二子十秒定一子為實以同度下第四格度率為法除之不去子只不滿法去一子得數定有三子為十分二子為單分一子為十秒于十分前一位加積度加入同度第一格積度得為天正黄道箕宿度分也按此以箕宿赤道度變黄道也欲明其交變之理當先知渾天之形盖天體渾員而赤道紘帶天腰其南北極皆等赤道度匀分如𤓰瓣離赤道逺則其度漸斂漸狹以會於兩極若黄道之度雖亦匀分然半出赤道之外半在赤道之内與赤道有平斜之别若自兩極作經度縱剖赤道必過黄道則有時赤道一度當黄道一度有竒以黄道度斜也二分黄道斜穿赤道而過故赤道平而黄道斜有時赤道一度當黄道則不及一度以赤道度小也二至黄道所經離赤道二十四度弱在赤道度則已為𤓰瓣漸斂之時其度瘦小故不能當黄道之一度古諸家厯法各有黄赤變率惟授時依割員句股之法剖渾度為之于古為密也黄赤立成起二至畢二分起二分畢二至並于一象限内互相乘除各有定率詳第三卷箕宿近冬至故用至後立成立成第四格赤道度率也第二格所變黄道度率也凡至後赤道一度零若干分始可當黄道一度也以赤道小度當黄道之平度則一度不能當一度必加零分始可相當第三格赤道積度也第一格所變黄道積度也凡至後赤道幾度幾十幾分始可當黄道幾度也嵗差之法毎年冬至西移則冬至所在宿毎年之距度不同如至元辛巳冬至在箕十度則箕初距冬至亦十度今康熙壬寅冬至退至四度竒則箕初距冬至亦只四度竒故必毎年變之始為凖的如康熙壬寅箕宿赤道距冬至四度竒以變黄道則不足四度冬至愈退則距度愈近而毎度之加率愈多今以所推箕宿赤道度分是從本年天正冬至逆數至箕宿初度與第二格積度相減其滿積度數即變成黄道積度第三格赤道積度俱帶零分第一格黄道積度並為整度以此相變是以帶零分之赤道幾度變為無零分之黄道幾度也其減不盡者以第四格赤道度率為法除之則此赤道零分亦變為黄道零分所變零分必少于赤道零分乃以所變零分倂入所變積度為箕宿初度距冬至之黄道度即知天正黄道實躔箕宿若干度分也以異乘同除之理言之赤道一度零幾分於黄道為一度今有赤道零分若干於黄道亦當為零分若干法當置赤道零分以黄道度率乘之為實赤道度率為法除之得數為所變黄道零分今因黄道率是一度乘訖數不動故省不乘而只用除是㨗法也惟其省乘故除亦不去子惟不滿法去一子盖不去子則實位暗陞與乘過之得數無兩黄道立成黄積度加此度率此乘黄道赤積度減此度率此除黄道初度一度初度一度八六五一度一度一度八六五一度八六五二度一度二度一七二八一度八六三度一度三度二五八八一度八七五四度一度四度二四四五一度八四九五度一度五度四二九四一度八四三六度一度六度五一三七一度八三三七度一度七度五九七一度八二三八度一度八度六七九三一度八一二九度一度九度七六五一度八一十度一度十度八四六一度七八六按黄赤道交變立成原有九十一度今只用十度者以箕宿只十度也若再過二三百年嵗差於箕度退完交入㞑度則立成數宜用二十度箕宿度在冬至前而今用至後立成者赤道變黄道之率至前與至後本同一法故可通用也至後是從冬至順數至前是從冬至逆溯其距冬至度同則赤黄之變卛不異大致與縮末盈初二限共一加分積度者同理近乃有名家撰述輒譏此條為錯用立成是未嘗深思而得其意也推交常度法置有交食之入交汎日全分十日定五子單日定四子空日定三子空千定二子空百定一子空十不定子以月平行一十三度三六八七五定一為法乘之言十定一乘過定有四子為單度五子為十度六子為百度即得所推交常度分也按交常度者經朔太陽躔度距黄道白道相交之度也推交定度法置所推交常度全分内盈加縮減其朔下盈縮差度分為交定度分如遇交常度數少不及減縮差者加交終度三百六十三度七九三四一九減之餘為交定度分也遇滿交終度去之按交定度者定朔太陽所在距黄道白道相交之度也闇虛為日對度故只用太陽盈縮差加減之也如遇交常度數少不及減縮差者是以常數言之雖已在交後計日行盈縮則仍在交前故加入交終度減之即仍作交前算也推日食在正交中交度視交定度分如在七度已下三百四十二度已上者為食在正交如在一百七十五度已上二百二度已下者為食在中交按正交者月自隂厯入陽厯交之始也中交者月自陽厯復入隂厯交之中也交終之度于此始即于此終故為正交也交中之度于此適半故為中交也七度已下三百四十二度已上者正交食限陽厯距交初七度隂厯距交終二十一度而止也一百七十五度者陽厯距交中亦七度而止為食限二百二度者隂厯距交中亦二十一度而止為食限也推中前中後分法視定朔小餘如在半日周五千分已下者就置五千分内減去定朔小餘而餘為中前分也如在半日周已上者就于定朔小餘内減去半日周餘為中後分也按中前是從午逆推前所距分也故以小餘減半日周中後是從午順求後所距分也故以半日周減小餘順數逆推皆自午正起算也推時差分法置半日周内減去所推或中前或中後分餘千定三百定二為實復以中前或中後千三百二定之為法乘之言十定一得數又以九十六分去三子子按九十六分宜去一子今去三者經所謂退二位也為法除之不滿法去一子除過定有二子為百分一子為十分得為時差分也中前為減差中後為加差按時差分者食甚之時刻有進退于定朔者也盖經朔本有一定之期既以月遲疾日盈縮加減之為定朔矣而猶有差者則以合朔加時有中前中後之不同也其所以不同者何也大約日在外月在内故能掩之人又在月内故見其掩而有食當其正相當一度謂之食甚如其合朔午正則以人當月以月當日相當繩直故無所差若在午前以至于夘則漸差而早假如定朔夘正一刻日月合在一度是日月合朔本等時刻也人自地上觀之則不待其月之至於此度也當其夘初初刻月未及日一度時已見其合於日是差而早六刻有竒也若在午後以至于酉則漸差而遲假如定朔酉正一刻日月合在一度是日月合朔本等時刻也人自地上觀之則月雖已至此度尚未見其合也直至戌初一刻月行過於日將一度時始見其合于日是差而遲六刻有竒也其自夘而辰而已所差漸少至午正則復于無差也其自午而未而申積差以漸而多至酉則差而極於六刻有竒也盖天體至圓其行至徤運乎四虛地在其中為氣所團結而不散若卵之有黄夫卵既圓矣黄安得獨方故地之方者其徳其體則必不正方如碁局也夫日月並附天行而月在日下當其合時去日尚不知有幾許人自地上左右窺之與天心所見不同故日月平合在夘酉皆不能見所見食甚日稍在下月稍在上斜弦所當差近一度在月平行為六百餘分惟午則自下仰觀所見正當繩直與在左右旁視者異故無差也昔人常云人能凌倒景以瞰日月則晦月之表光應如望吾亦云使人能逐景而行與日相偕則舉頭所見常如在午又使地如琉璃光人居其最中央旋而觀日八面皆平時差之法可以不設矣是其所差不問盈縮遲疾而只在本日之加時故曰時差推食甚定分法視時差分如是中前分推得者置定朔小餘内減去時差分餘為食甚定分也如是中後分推得者置定朔小餘内加入時差分共得為食甚定分也滿日周去之至入盈縮度再加之按食甚食而甚也食甚分是自虧至復之中日月正相當于一度之時刻也中前減小餘者差而早也中後加小餘者差而遲也若夜刻不算者恐無滿日周去之之理末二句疑有誤推距午定分法置所推中前或中後分内加入時差分共得為距午定分也按距午定分是食甚時刻距午正之數也食甚以時差加減距午則不減只加者盖食甚原是順故有加減距午分則一自午順推一自午逆溯總是差而漸逺于午正故也推食甚入盈縮定度法置前推或盈厯或縮厯初末全分加入定朔大餘及食甚定分内減去經朔全分餘為食甚入盈縮厯定度分也按原推盈縮厯是經朔下者故以定朔大餘及食甚分加之減去經朔全分如以經朔大小餘加減作食甚大小餘故即得食甚所入盈縮厯數也推食甚入盈縮差度法置所推食甚盈厯或縮厯全分減去大餘依朔下盈縮差法推入得食甚入盈縮差度分也如遇末限亦用反減半嵗周之數數止秒按食甚盈縮厯既異經朔則其所積盈縮之差亦不同故復求也推食甚入盈縮厯行定度法置食甚入盈縮厯全分以萬為度内盈加縮減其所推食甚入盈縮差得為食甚入盈縮厯行定度分也末限不用數止秒按凡盈厯若干日即是常數日行距冬至宿之度數也凡縮厯若干日即是常數日行距夏至宿之度數也以其差加減之即得所推食甚日躔距二至宿之度數也凡用末限者所以紀其差是逆從二至推至二分其差整齊易知也今不用末限者所以積其度是順從冬至數至夏至從夏至數至冬至也推南北泛差度法視所推食甚入盈縮厯行定度如在周天象限九十一度三一四三七五已下者為初限也如在已上者置半嵗周内減去行定度餘為末限也或得初限或得末限俱自相乘之初末限者十度上下各定三子單度各定二子言十各定一子得數以一千八百七十度去三子為法除之不滿法去一子除過定有四子為度三子為十分四按上下各定二子則子矣故四子為度復置四度四十六分按四度四十六分者即周天象限自乘復以一千八百七十度除之者内減去得數餘為南北汎差度分也推南北定差度法置所推南北泛差全分度定四子十分定三以所推距午定分千定三子百定二子為法乘之言十定一得數復以其所錄半晝分去二子為法除之不滿法去一子除過定有四子為度三子為十分仍置泛差減其得數餘為南北定差也若遇泛差數少不及減者反減之而得也又視其盈縮厯及所推正交中交限度如是盈初縮末者食在正交為減差中交為加差也如是縮初盈末者食在正交為加差中交為減差也若遇反減泛差者應加作減應減作加不可忽畧也按南北差者古人所謂氣差也易之曰南北所以著其差之理也盖日行盈初縮末限則在赤道南其逺於赤道也至二十三度九十分日行縮初盈末限則在赤道北其逺于赤道也亦二十三度九十分日之行天在月之上而髙故月道與黄道相交之度有此差數以南北而殊也假如盈初縮末限一日空日間日行赤道外極南去人極逺去地益近日道所髙於月道之中間人皆从南觀之易得而見故月道之出黄道而南也較常期所謂常期皆南北東西差折中之數即所定大都正交度中交度也早四度有竒其入黄道而北也較常期遲四度有竒由是以漸而至于盈初縮末八十八日行天漸滿一象限之時黄道之在赤道南者去赤道以漸而近去地之數以漸而逺其日髙月下相去之數人所从旁見者以漸而少故其所差四度有竒以漸而殺也又如縮初盈末限一日空日間日行赤道内極北去人益近去地極逺日道所髙於月道之中間人仰面視之難得而見故月道之出黄道南而為正交也較常期遲四度有竒其入黄道北而為中交也較常期早四度有竒由是以漸而至于縮初盈末九十三日行天漸滿一象限之時黄道之在赤道北者去赤道以漸而近去地之數亦以漸而近其日髙月下相懸之數人所從旁見者又以漸而多故其所差四度有竒亦以漸而殺也四度四十六分者據其極差者言也以得數減之便是今所有差也然此皆據午地而言故以距午分乘之以半晝分除之便知今距午之地應分得差數凡幾許而今已距午幾許則此所有之差已不可用故以減原得汎差數而知其尚餘幾許之差為定差也盖于天則冬至夏至之黄道為南北于地則加時在正子午為南北今汎差之數近二至則多近二分則少是以天之南北而差也定差之數近午正則多近日出沒時刻則少是以加時之南北而差也故曰南北差月自黄道北出黄道南謂之正交即經所謂交前隂厯交後陽厯也月自黄道南入黄道北謂之中交即經所謂交後隂厯交前陽厯也其南北泛差不及減反減者此帶食出入方有之何也此必是食甚定分在日入分已上或日出分已下則其距午定分多于半晝分故乘除後得數亦多於泛差也不則以多除以少乘其數且不能泛差相等况能多于泛差乎愚故斷其為帶食也泛差數少不及減是距午定分已過于半晝是在夜刻故反算其距子之數夫距子與距午其盈縮南北逺近幷旁視仰視之理正相反故加者減之減者加之以為定差也推東西泛差度法置所推食甚入盈縮厯行定度就為初限也去減半嵗周餘為末限也以初末二限互相乘之百度定四子十度定三子言十定一是也得數復以一千八百七十度去三子為法除之不滿法去一子除過定有四子為度三子為十分即得所推東西泛差也推東西定差度法置所推東西泛差全分度定四子千定三子以所推距午定分千定三子百定二子為法乘之言十定一得數以二千五百度去三子為法除之不滿法去一子除過定有四子為度三子為十分視所推如在東西泛差已下者就為東西定差度分也如在已上者倍其泛差内減去得數餘為東西定差度分也又視其盈縮厯及中前中後分與正交中交限度若是盈厯中前縮厯中後者正交為減差中交為加差也若是盈厯中後縮厯中前者正交為加差中交為減差也按東西差即古所謂刻差也易其名曰東西者其差只在東西也于天則近二分之黄道為東西于地則近卯酉之時刻為東西盖日行在二至前後其勢平直日行在二分前後則其黄道與赤道縱横相交其勢斜徑當其斜徑加時又在卯酉則有差也假如春分日在盈厯九十餘度其黄道之交于赤道自南而北勢甚斜徑若加時中前則是赤道倚而黄道横也加時中後則是赤道倚而黄道縱也又如秋分日在縮厯九十餘度其黄道之交於赤道自北而南勢甚斜徑若加時中前則是赤道倚而黄道縱與盈厯中後仝也加時中後則是赤道倚而黄道横與盈厯中前仝也黄道縱立於夘酉月道之出入亦從而縱正面視之繩直相當其日内月外相去之中間人所見者少意與南北差縮初盈末正在人頂者同也故月道之出黄道南而為正交也較常期遲四度有竒其入黄道北而為中交也較常期早四度有竒此盈厯中後縮厯中前皆于正交以差加中交以差減也黄道横偃于夘酉月道之出入亦從而横人在赤道之北斜而望之其日内月外相去之中間皆得而見意與南北差盈初縮末横偃南上漸近于地者同也故月道之出黄道南而為正交也較常期早四度有竒其入黄道北而為中交也較常期遲四度有竒此盈厯中前縮厯中後皆于正交以差減中交以差加也若盈縮厯當二分加時又在卯酉則其差之極四度有竒迨至二分前後黄道之斜徑以漸而平故其差亦以漸而少由是而至于二至黄道之斜徑依平而差亦復于平故曰二至無刻差也若加時不在夘酉則雖二分之黄道其差却與他氣不殊盖其斜徑之勢亦以漸而平故也假如二分加時辰巳之間其定差則正與四立泛差等漸而至于午中則其差亦漸而復于平是其所差只在東西故曰東西差凡東西泛差近二分多是以天之東西而差也其定差以加時夘酉而多是以地之東西而差也以距午分乘之者距夘酉之數也以二千五百除之者日周四分之一乃夘酉距午之數也盖此所為泛差乃距午二千五百分時所有之差也乘除後得數若多于泛差是食甚距午分其數亦多于日周四分之一其加時乃在夘前酉後也夘前酉後之差于正夘酉者其數正與夘後酉前等故倍泛差減得數即為定差也凡差于南北者復于東西差于東西者復于南北幷二差加減數總無過四度四十六分以是為交度進退之極也盖原所謂正交中交限各損隂厯六度餘為陽厯者乃是據中國地勢所差於南戴赤道之下者言人在北道之北故所見黄道交處皆差而近北六度餘此常數也若黄道在冬至横于南上去人益逺故其交處差而北者又四度餘而極是共差十度餘矣若黄道在夏至去人反近正在中國人頂故其交處原差而北者乃復而南亦四度餘而極是只差一度餘矣此南北差之理據午上言也若移而至日出入時則其横于南上者已斜縱于夘酉其正當人頂者已横斜于夘酉所見差度以漸而平如常數故南北差近午多近日出沒則少也若黄道在春分而加時夘黄道在秋分而加時酉其勢皆横偃于東西而與地相依故其交處益差而北又四度餘而極是亦共差十度餘矣若黄道在春分而加時酉黄道在秋分而加時夘其勢皆縱立于東西而與人相當故其交處原差而北者亦皆復而南四度餘而極是亦只差一度餘矣此東西泛差之理據夘酉而言也若移而至午則其横偃于夘酉者反斜縱于午上其縱立于夘酉者反横斜于午上所見差度自以漸而平如常數故東西差近夘酉多近午則少也假使人能正當赤道之下則兩極平見相望子正赤道平分界乎夘酉則凡正交只在交終中交則在交中其氣刻之差減正交加中交者則差而北其加正交減中交者則差而南當亦各四度有竒也今中國地勢則正在赤道之北故所見赤道皆斜倚于人之南其所見正交中交度常數亦皆因其赤道之斜倚者而斷惟其黄道交在四立之宿加時在巽坤之維則黄道之勢正自斜倚適如赤道之理而南北東西之差皆少與常數相依若黄道横則其勢赤道加偃故正交中交之度益差而北若黄道縱則其勢視赤道反直幾有類于南戴日下之赤道故正交中交之度雖曰復差而南其實乃復于無差也凡縮初盈末而加時午盈厯而加時中後縮厯而加時中前皆黄道縱之類也其縮初盈末當午雖横在天心然東西視之則亦縱也凡盈初縮末而加時午盈厯而加時中前縮厯而加時中後皆黄道横之類也其冬夏至黄道當日出入其二分黄道當午皆黄道斜倚之類也推日食在正交中交定限度視所推日食在正交中交限度如食在正交者置正交度三百五十七度六十四分在中交者置中交度一百八十八度五分俱以所推南北東西定差是加者加之減者減之即為所推正交中交定限度分也按正交本在交終三百六十三度七十九分今曰三百五十七度六十四分者于隂厯本數内損六度餘為陽厯也中交本在交中一百八十一度八十九分今曰一百八十八度五分者于陽厯本數外増六度餘侵入隂厯也盖黄道于月道如大環包小環月在日内中間相去空隙猶多人在月内稍北日月交其南人自北斜望得見其間空隙故其交處皆差而北也惟其交處差而北故其交而南也早六度其交而北也遲六度此據地勢為言在授時立法原在大都若迤而漸南至于戴日之下所差漸平迤而向北差當益大當亦必有各方差數而不可攷矣又按此正交中交度増損六度者只是地勢使然已為常數其因時而差者又有南北東西二差于是復以加之減之而後乃今所推正交中交之度可得而定而後乃今交前交後隂陽厯可得而定矣推日食入隂陽厯去交前交後度法視所推交定度若在正交定限度已下者就于定限度内減去交定度餘為隂厯交前度也若在正交定限度已上者于交定度内減去正交定限度餘為陽厯交後度也又視其交定度若在中交定限度已下者就于定限度内減去交定度餘爲陽厯交前度也若在中交定限度已上者於交定度内減去中交定限度餘爲陰厯交後度也按若交定度在七度以下者數雖在正交定限度下而實則爲陽厯交後度也法當置交定度加入交終度復減去正交定限度餘爲陽厯交後度也勿庵補按凡交定度在正交後中交前者陽厯也其在正交前中交後者陰厯也若以東西南北差定之而正交度有加中交度有減者是陽厯變爲陰厯也其正交度有減中交度有加者是陰厯變爲陽歷也正交陽變陰中交陰變陽是交後變爲交前也正交陰變陽中交陽變陰是交前變爲交後也故必以所推正交中交定限度爲則與交定度相較而得合朔日躔距交前後的數也凡以交定度去減正交中交定限度者爲交前是逆從交處數來也其于交定度内減去正交中交定限度者爲交後是順從交處數去也又按交定度在七度以下食在正交也若以減正交定限度其所餘當在三百五十度内外爲陰厯交前度也勿菴曰非也若然則凡正交七度已下者永不入食限不必布算矣况所謂隂陽厯者自正交中交而斷正交後為陽中交後為隂所謂交前後者皆附近正交中交前後而斷正交後為陽厯交後正交前為隂厯交前中交後為隂厯交後中交前為陽厯交前交終度分為隂陽厯隂陽厯又各分前後安得有隂厯交前度乃多至三百五十餘度者乎此必無之理亦必不可通之數也然則何以通之曰有法焉凡交定度在七度已下是其數不特在正交度下幷在中交度下也然而又與中交數逺幷亦不得減中交為交前也夫在中交數下是陽厯非隂厯也不在交前是交後也夫陽厯交後度法當置交定度内減去正交定限度而此交定度數少不及減故必加入交終度而後可以減之也如入交終度減之則陽厯交後之度復其本位也則凡距交七度已下者皆得入陽食之限也然則厯經何以不云通軌何以闕載也曰是偶爾之遺也或姑略之以俟人之變通也或傳之乆而失其真原有闕文也夫夏五𫝊疑三豕徴信各行其是而已為其恐誤後學也故訂之推日食分秒法視日食入隂陽厯交前交後度是隂者置隂食限八度是陽者置陽食限六度皆減去隂厯或陽厯交前交後度餘度定四十定三為實各以其定法是隂者置八十分陽者置六十分去一為法約之不滿法去一子所定有二子為單分一子為十秒即得所推日食分秒也如隂陽食限不及減交前交後度者皆為不食也按隂食限八度者隂厯距交八度内有食也陽食限六度者陽厯距交六度内有食也凡合朔若正當交度其食十分漸離其處食分漸少假如陽厯距交一度二十分則于食十分内減二分只食八分也又如隂厯初交二度四十分則于食十分内減三分只食七分也故各置隂陽食限以距交前後度減之即是于食十分内減去若干分秒也其減不盡者則正是今所推合食之數故各以定法除之而得也凡隂陽定法皆十分食限之一也如食限不及減為不食者是距交前後之度多于隂陽食限其去交甚逺不能相掩斷為不食也推日食定用分法置日食分二十分内減去推得日食分秒餘十分定三單分定二為實即以日食分秒單分定二為法乘之言十定一所定有六子為百分五子為十分即為所推開方積也立天元一于單微之下依平方法開之得為開方數有十定一復以五千七百四十分定五為法乘開方數言十定一得數又以所推定限行度去四子空度去三子為法除之不滿法去一子所定有二子為百分一子為十分即為所推定用分也按定用分者日食虧初復末中距食甚所定用之時刻也凡日食若干分則其所經厯凡有若干刻食分深者厯時乆以月所行之白道長也食分淺者厯時暫以月所行之白道短也今所求開方之數即自虧至甚或自甚至復月行白道之率也日食只十分今用二十分者何也日月各徑十分其半徑五分凡兩員相切則兩半徑聮為一直線正得十分為兩心之距以此兩心之距為半徑從太陽心為心運規作大圓其外周各距日之邊五分為日月相切時太隂心所到之界其大圓全徑正得二十分也以日食分秒相減相乘何也此句股術中弦較求股法也依前所論初虧時兩圓相切其兩心之距十分此大圓之半徑常為句股之弦食甚時兩心之距如句而太隂心侵入大圓邊之數如句弦較自虧至甚太隂心所行白道如股而太隂心侵入大圓邊之數與食分正同盖月邊掩日一分則月心亦移進一分也故即以日食分秒為句弦較與大圓全徑二十分相減其餘即為句弦和和較相乘為開方積即股實也其開方數即股亦即自虧至甚月心所行之白道矣其自食甚至復光理同五千七百四十分乘者何也先求日食分秒及句股開方等率皆就日體分為十分其實日體不滿一度大約為十之七耳五千七百四十者七因八百二十也月行一限得八百二十分其十之七則五百七十四分矣故以五百七十四分乘開方為實以定限行度除之為定用分之時刻也以異乘同除之理言之月行定限行度厯時八百二十分則月行虧至甚之白道即開方數該厯時有若干分然此所得開方數於度分為十之七法當置開方數七因退位如有十分只作七分然後乘除今開方數不動而七因八百二十為五千七百四十得數亦同即算術中異乘同乘之用開方數之分是度下一位宜定三子七因八百二十而退位實為五百七十四宜定二子今開方數不定子故於五千七百四十加交三子為五子其乘除後定數同也初虧時兩心之距為弦即大員二十分半徑食甚時兩心之距為句食甚時月心侵入限内三分為句弦較自虧至甚月心所行白道為股甚至復亦同此以月在陽厯日食三分為例餘可倣推推初虧復圓分法置所推食甚定分内減去定用分為初虧分不及減加日周一萬減之復置食甚定分如入定用分為復圓分滿日周去之時刻依合朔法推之按食甚者食之甚食之中也日月正相當于一度也初虧者虧之初食之始也月始進而掩日也復圓者復于圓食之終也月已掩日而退畢也凡言分者皆時刻也盖初虧在食甚前幾刻故減小餘復圓在食甚後幾刻故加小餘初虧距食甚時刻正與食甚距復圓數等故皆以定用分加減之也月食倣此又按據加日周減滿日周去二語定用分當不止此數也推日食起復方位法視所推日食入隂陽厯如是陽厯者初起西南甚于正南復圓於東南也如是隂厯者初起西北甚于正北復圓于東北也若食在八分以上者無論隂陽厯皆初起正西復圓于正東也按日食起復方位主日體言之即人所見日之左右上下也以午位言則左為東右為西上為北下為南也日食入隂陽厯者主月道言之月在日道南為陽厯月在日道北為隂厯也如是陽厯食是月在日南掩而過故食起西南甚于正南復于東南也如是隂厯食是月在日北掩而過故食起西北甚于正北復于東北也其食在八分已上者是月與日相當一度正相掩而過故食起正西復于正東其食甚時正相掩覆而無南北不言可知也凡日月行天並自西而東日速月遲其有食也皆日先在東月自西追而及之既相及矣則又行而過于日出于日東故日食虧初皆在西復末皆在東也又按厯經云此所定起復方位皆自午地言之其餘處則更當臨時消息也推帶食分法視朔下盈縮厯與太陽立成同日之日出入分如在初虧分已上食甚分按食甚當作復圓已下為帶食之分也若是食在晨刻者置日出分昏刻者置日入分皆與食甚分相減餘為帶食差也置帶食差百定六十定五以所推日食分秒十定五單定四為法乘之言十定一得數復以所推定用分百去六子為法除之不滿法去一子所定有五子為十分四子為單分三子為十秒得數去減所推日食分秒餘上下兩處皆為帶食已見未見之分也按帶食分者日出入時所見食分進退之數也假如日出分在初虧分已上是初虧在日未出前但見食甚不見虧初也日入分在初虧已上是食甚在日入後但見虧初不見食甚也又如日出分在復圓分已下是食甚在日未出前不見食甚但見復末也日入分在復圓分已下是復圓在日入後不見復末但見食甚也見食甚不見虧初是食在未出已有若干尚有見食若干帶之而出其食為進也見初虧不見食甚是食在未入見有若干尚有不見食若干帶之而入其食亦為進也不見食甚但見復末是食在未出前已復若干尚有見復光若干帶之而出甚食為退也不見復末但見食甚是食在未入前見復若干尚有未復光若干帶之而入其食亦為退也凡此日出入所帶進退分秒何以知之則視其帶食而出為晨刻者置日出分其帶食而入為昏刻者置日入分皆以食甚分與之相減而得帶食之差也假如日出分在初虧分已上其食甚分又在日出分已上則以日岀分減其食甚分其減不盡者則是日出已後距食甚之時刻也若日入分在初虧分已上其食甚分又在日入分已上則以日入分減其食甚分其減不盡者則是日入已後距食甚之時刻也又如日出分在復圓分已下其食甚分又在日出分已下則于日出分内減去食甚分其減不盡者則是日出已前距食甚之時刻也若日入分在復圓分已下其食甚分又在日入分已下則于日入分内減去食甚分其減不盡者則是日入已前距食甚之時刻也凡此帶食差分用乘日食分秒又以定用分除之便知日出入時所距食甚時刻在定用分全數内占得幾許即知日出入時所帶食分于日食分秒全數内占得幾許也以其數減食分所餘分秒即是日出入前距虧初已過食分或日出入後距復末未見食分也上下兩處者得數與減餘兩處之數已見未見之分即已復未復已食未食如後二條所列也日有帶食例置日出入分内減去食甚分謂之已復光未復光將所推帶食分錄于前晨日未出已復光若干日已出見復光若干昏日未入見復光若干日已入未復光若干置食甚分内減去日出入分謂之見食不見食將所推帶食分錄于後晨日未出已食若干日已出見食若干昏日未入見食若干干日已入不見食若按置日出入分内減去食甚分者其日出入分皆在復圓分已下也故謂之已復光未復光假如日食甚五分在日出入前其帶食三分以之相減尚餘二分若在晨刻是日未出前已復光三分日已出後見復光二分也若在昏刻是日未入前見復光三分日已入後未復光二分也此二端帶食分皆是已復光數故錄于前也其以帶食分減之而餘者則是未復光數故錄于帶食之後也置食甚分内減去日出入分者其日出入分皆在初虧分已上也故謂之見食不見食假如日食甚五分在日出入後其帶食三分以之相減尚餘二分若在晨刻是日未出前已食二分日已出後見食三分也若在昏刻是日未入前見食二分日已入後不見食三分也此二端帶食分皆是未食數故錄于後也其以帶食分減之而餘者則是已食數故錄于帶食之前也月食倣此但以日之昏為月之晨以日之晨為月之昏盖日出于晨入于昏月出于昏入于晨也其餘並同推黄道定積度法置所推食甚入盈縮厯行定度如是盈厯者内加入天正黄道箕宿度共得為黄道定積度也如是縮厯者内加入半嵗周及天正箕宿黄道度共得為黄道定積度也按黄道定積度者逆計食甚日躔度距天正冬至日躔宿度積數也盈厯加入天正黄道箕度者是逆從天正冬至所躔宿初度積算起也縮厯復加半嵗周者縮厯本數是從夏至度起算今加入半嵗周又加入天正箕宿度是變而如盈厯亦從天正冬至箕宿初度起算也所得定積度即是今所躔宿度與箕宿初度相距逺近之數也推食甚日距黄道宿次度法置所推黄道定積度無論盈縮厯皆以黄道各宿次積度鈐挨及減之餘為食甚日躔黄道某宿次度分也按所推黄道定積度無問盈縮皆是今食甚躔度前距箕宿初度之積數也然尚未知其為黄道何宿度也故以黄道各宿積度鈐取其相挨及者減之其減去者是今積度内已滿其宿之度日躔已過此宿斷為前宿也其不及減而餘者則是前宿算外所餘度分也是日躔正在此宿中未過故其積度亦未滿當即以所減算外之度分斷為食甚日躔某宿幾度幾分也假如食甚定積十度則以箕宿積度九度五九減之餘度四十一分為箕宿算外餘數斷為食甚日躔黄道斗宿初度四十一分也餘倣此黄道各宿次積度鈐箕九度五九斗三十三度六牛三十九度九六女五十一度八虛六十度八太危七十六度三太室九十四度三五太壁一百三度六九太奎一百廿一度五六太婁一百三十三度九二太胃一百四九度七三太昴一百六十度八一太畢一百七七度三一太觜一百七七度三六太參一百八七度六四太井二百十八度六七太鬼二百廿度七八太栁二百三十三度七八太星二百四十度九太張二百五七度八八太翼二百七七度九七太軫二百九六度七二太角三百九度五九太亢三百十九度一五太氐三百三十五度五五太房三百四一度三太心三百四七度三太尾三百六五度二五太按黄道積度鈐皆自箕初度積至其宿垜積之數也假如日躔斗二十三度四七加入箕宿九度五九則已共積得三十三度六也又如日躔牛六度九十分如入斗二十三度四七又如入箕九度五九共積得三十九度九六也餘倣此又按凡言鈐者皆豫將所算之數幷其已前之數垜積而成以便臨算取用意同立成也雖然黄道不可以立鈐算者當知黄道度之所由生則可以斷其是非矣盖黄道積度生于其宿黄道度各宿黄道度皆生于赤道赤道三百六十五度二五七五黄道亦三百六十五度二五七五而其各宿度數不同者則以二至二分所躔不同也赤道近二至則其變黄道度也損而少赤道近二分則其變黄道度也益而多盖赤道平分天腹適當二極之中所紀之度終古不易黄道不然其冬至則近南極在赤道外二十三度九十分其夏至則近北極在赤道内亦二十三度九十分其自南而北自赤道外而入于其内也則交于春分之宿其自北而南自赤道内而出于其外也則交于秋分之宿交則斜以斜較平視赤道之度必多此處既多則二至黄道視赤道之數必少理勢然也二至赤道以斂小之度當黄道大度已詳天正箕宿註黄道之損益既係于分至分至既以嵗而差黄道積度是必毎嵗不同古人則既言之矣此所載者猶據授時厯經所測黄道之度乃至元辛巳一年之數也上考下求數十年間則皆有所不合况距今三百八十餘算積差尤多安得海制此鈐以盡古今之無窮乎今仍以授時厯經黄赤道差法求得天啟辛酉年黄道積度如左依授時厯經求得天啟辛酉年黄道積度天正冬至赤道箕宿四度九赤道四象積度箕五度五斗三十度七牛三十七度九女四十九度二五虛五十八度二太危七十三度六太室九十度七太壁九十一度三一四三太右冬至後一象之度壁七度九九三一少奎二十四度五九三一少婁三十六度三九三一少胃五十一度九九三一少昴六十三度二九三一少畢八十度六九三一少觜八十度七四三一少參九十一度三一四三太右春分後一象之度參初度五二八太井三十三度八