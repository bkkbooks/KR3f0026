front:
  text: 交會管見小引交食為驗厯大端其事之著者有三一曰食分深淺一曰加時早晚一曰起復方位古法至授時立法已詳新法有西洋所測更密幾於無可復議獨其所謂起復方位並以東西南北為言如日食八分以上初虧正西復圓正東八分以下陽厯初虧西南食甚正南復員東南隂厯初虧西北食甚正北復員東北月食八分以上初虧正東復員正西八分以下陽厯初虧東北食甚正北復員西北隂厯初虧東南食甚正南復員西南之類而東西南北並以日月光體中心為主故其邊向北極處斯謂之北向南極處斯謂之南而東西從之亦以日月之邊向東升處即謂之東向西沒處即謂之西此中西厯法所同也然天既北倚赤道之勢與北極出地相應皆南高而東西下黃道斜交赤道又因節氣而殊初虧食甚復圓各限加時又别是故人所見日月光體之東西南北非日體之東西南北也故於仰觀不能盡合密測者以日月體勻為細分而求其虧甚所當之處於理為盡然必測器精良用法取影庶幾可知終不能若食分深淺加時早晚之可以萬目同觀衆著無疑也愚今别立新術凡虧復各限並於日月光體之上下左右直指其蝕損所在而不用更雜以東西南北之名欲令測候之時舉目共見即步算之疏密纎毫莫遁或於測學不無小補猶冀髙賢深明理數有以進而教之也康熙四十有四年嵗在旃蒙作噩勿菴梅文鼎謹識時
