body:
  text: 厯算全書卷四十宣城梅文鼎撰方程論卷一正名名不正則言不順諸本方程皆以二色三色四色等分欵立法而不分和較宜其端緒紛糾而説之滋謬也故先正其名正名有四一和數二較數三和較雜四和較交變和者無正負如只云某物如干某物如干共價如干以問每物各價者是也較者有正負如云以某物如干與某物如干相較多價如干或少價如干或相當適足者是也雜者半有正負半無正負如一行云某物某物各如干共價如干而其一行則又云以某物如干較某物如干差價如干或價相當適足者是也變者或先無正負而變為有正負或先有正負變而無正負三色以往重列減餘兼用兩行者是也總論曰萬算皆生于和較和較可以御萬算分合之義也萬物之未形一而已矣一且未有况萬乎及其有也有一則有二有二則有三自此以至于無窮而數生焉矣和者諸數之合也較者諸數之分也分則有差故謂之較較與和相求而法立焉矣故一與一和則二也一與二和則三也一與二之較一也一與三之較二也萬算雖多凖此矣故和較者萬算之綱也算之用至于句股方程至矣盡矣窺髙致逺探賾窮幽無所不備然其用不出于和較且以方程言之凡方程列位皆以下位為之端如所列下一位為上中兩位之總價則和也若下一位為上中兩位相差之價則較也較故分正負和故不分正負雖不立正負然必以兩和互乘對減以得其差然後其數可得而知矣故三色以往先無正負者有時而正負立焉故方程之法以和求較而已矣較者易知和者難知和之中有較較之中又有較此萬數之所由生萬法之所由起和數方程例方程用互乘對減與差分章貴賤相和法同但貴賤相和有總物總價又有每物每價不過以帶分之故難用匿價分身而變為換影之術耳方程則有總物總價而無每數又有三色四色以至多色頭緒紛然自非遞減何取之此古人别立一章之意也用法曰二色者任以一色列于上以一色列于中以總價列于下于是以列上者為乘法左右互乘又互遍乘中下得數左右對減其上一色必兩相若而減盡其中一色對減必有相差之數下價對減亦必有相差之數數相差則減不能盡于是取其餘數以為用一為法一為實以法除實而得中一色每價乃以中價乘原列中物得中物總價以中物總價減原列兩色之總價得上物總價以原列上物除之得上一色每價若更以中一色列于上依法求之亦先得上一色價矣故上中之位可以互更也詳見後假如有山田三畝場地六畝共折輸糧實田五畝七分又有山田五畝場地三畝共折實田五畝五分問田地每畝折實科則各如干畣曰每山田一畝折實田九分每地一畝折實田三分畝之一法各列位上中下先以右上田三畝為法遍乘左行得數次以左上田五畝為法遍乘右行得數上位各得田十五畝對減盡中位左得地九畝去減右行三十畝餘地二十一畝為法下位左折田得十六畝五分去減右行二十三畝五分餘折田七畝為實以法除實不滿法約為三之一為地每畝折實田之數地一畝折田三分三釐三毫不盡即地三畝折田一畝也就以右行折實田共四畝七分內除原地六畝折實田二畝餘二畝七分以右上田三畝除之得九分為田每畝折實之數或以左行折田內減左原地三畝該折實田一畝餘四畝五分以左上田五畝除之亦得九分為田每畝折實之數論曰以右上田三畝遍乘左行得數是各三之也為五畝田者三畝三畝地者三則為田地共折實五畝五分者亦三也以左上田五畝遍乘右行得數是各五之也為三畝田者五為六畝地者五則為田地折實共四畝七分者亦五也于以對減而上位田各十五畝減而盡則其數同也惟中位地餘二十一畝在右行則是右行之地多于左行之地二十一畝也而下位折實數亦餘七畝在右行則是右行折實之數亦多于左行折實之數七畝也合而觀之此所餘折實七畝者正是餘地二十一畝之所折也此以田地問折數故以地二十一畝為法折七畝為實也若以折數問原田地則以折七畝為法地二十一畝為實法除實得每折一畝原地三畝于是以右地六畝折二畝減折四畝七分餘二畝七分為法除右田三畝得每折一畝原田一畝又九分畝之一即一分一釐一毫一一不盡也若更置以地列于上則先得田折數如後圖上中下先以左上地三畝遍乘右行得數次以右上地六畝遍乘左行得數上位各得地十八畝對減盡中位左得田三十畝內減去右得九畝餘二十一畝為法下位折田左得三十三畝內減去右得十四畝一分餘十八畝九分為實以法除實得九分為田每畝折實數就以右田三畝折二畝七分減右折實共四畝七分餘二畝以右上地六畝除之不滿法命為三分畝之一為地每畝折實數或于左行折實五畝五分內減去左田五畝該折四畝五分餘一畝以左地三畝除之亦得地折實每畝三之一論曰以右上地六畝遍乘左行是各六之也為三畝地者六為五畝田者六為地三畝田五畝之折實田共五畝五分者亦六也以左上地三畝遍乘右行是各三之也為地六畝者三為田三畝者三為地六畝田三畝之折實共四畝七分者亦三也以之對減而地在上位者各十八畝既對減而盡則其各十八畝之折實在折實共數中者亦必對減而盡也田在中位者既對減去九畝而僅餘左行之二十一畝則其各九畝之折實在共數中者亦必對減而盡也由是以觀則其所餘之左下折田十八畝九分正是左中餘田二十一畝之所折也故以餘田二十一畝為法而以餘折田十八畝九分為實即田之折數可知知田數知地畝矣若以折問田畝則一十八畝九分折為法二十一畝田為實實如法而一得每折一畝原田一畝又九分之一于是以分母九通右行田三畝得二十七分而以一畝又九分之一共一十分為法除之得二畝七分以減共折四畝七分餘折二畝以除右地六畝得每折一畝原地三畝以上二色例也三色四色以至多色凡和數者皆同但須重例減餘以求之今不悉具于後諸條中詳之較數方程例凡較數方程分正負之價與盈朒略同但盈朒章有盈朒又有出率方程則但有總物與盈朒而無每出之率又兼數色所以不同又盈朒者是有每率而不知總所言盈朒適足是總計所出以與原立總價相較之數也方程正負則是兩總物自相較之數若不立正負則下價之與上物不知其孰為同異矣此正負之法異于盈朒也負與正對所以分别同異蓋對數之所餘即正數之所欠故謂之負與負責之負略相似老子言萬物負陰而抱陽蓋正即正面負即反面也開方法有負隅言隅之空隙也郭太史厯經三差法有負減言反減也本于平差內減去立差今立差反多于平差故于立差內反減平差是為負減兼此數端而正負之義可見矣法曰任以一色為正則以相當之一色為負此據二色者言之三色以上或以一色與多色相當或以多色與多色相當其法皆同二色正物之價多為正價負物之價多為負價正與負為異名異名相併正與正負與負為同名同名相減首位同名者仍其正負不變首位同數同名即可減去此正法也首位異名變其一一以相從首位亦同數但不同名故變而同之則亦同數同名而可減盡矣首位既變則其行內皆從而變此通法也蓋必如是則同減異加始歸畫一而于和較交變之用尤便也其法皆于互乘時以得數變之蓋減併只用得數也只變一行其相對之行不必再變二色三色以至多色並同何也三色以上行數雖多而乘併之用皆以各相對之一行論同異即同二色之理論曰和數方程有減無併皆同名故也較數方程有減有併或同名或異名也減併者方程之綱要正負淆則同異之名混而併減皆失矣今諸本所言正負同異誃離舛錯雖加減得數皆偶合耳西人論句股三角八線割圜幾何原本可謂詳矣矣至方程增立諸率亦復草草未窮其故也用法曰以一色列于上以相當之一色列于中任以一色為主而分正負此亦以二色為例三色以上皆以兩相當者主其一以分正負皆與二色法同以兩色相較之價列于下以正物為主而分同異或正物所多之價命之為正或正物所少之價命之為負正物之所少即負物之所多或正物負物之價兩相若命之適足則空位列之亦以列上位者為乘法左右互乘遍乘中下以首位為主而變正負得數對減其上一色必數相若且又同名而減盡中一色與下價或同名或異名異名者併之同名者對減取其減併之數以為用一為法一為實以法除實得中一色每價以原列中物乘之得中物總價以與原列下價同名相減異名相併得數以原列上物除之得上一色每價其上中亦可互求假如以研七枚換筆三矢研多價四百八十文若以筆九矢換研三枚筆多價一百八十文問筆研價各如干畣曰筆每矢價五十文研每枚價九十文法各列位上中下先以左行研負三遍乘右行得數首位異名須變一行以相從故研正變為負筆負變為正價正變為負皆于得數變之次以右行研正七遍乘左行得數右行既變則左行不必再變故研負筆正價正皆仍舊于是以上研各負二十一同名相減盡次以中筆兩正同名相減餘五十四為法再以下價左正右負異名相併得二千七百為實以法除實得五十文為筆價以左行筆正九乘筆價得四百五十內減同名價一百八十餘二百七十以左研負三除之得九十為研價或以右筆負三共價一百五十加異名價正四百八十共六百三十以右研七除之亦得研價九十論曰左行原是九筆多于三研一百八十文乘後得數則是六十三筆多于二十一研共一千二百六十文也右行原是七研多于三筆四百八十文乘後得數則是九筆少于二十一研一千四百四十文也于是以兩行得數較之上位研負二十一兩行盡同研之數同則其價亦同惟中位筆數左行多五十四枝則是左行筆多價一千二百六十文者以多此五十四筆而右行筆少價一千四百四十文者以少此五十四筆也夫右行筆價原少于二十一研者一千四百四十文以左行多五十四筆而反多于二十一研者一千二百六十文是此五十四筆既補却右行之所少而仍多此數也故併右行之所多共此二千七百以為五十四筆之價知筆價知研價矣若先求研價者以研列中為除法以筆列上為乘法如後圖問者或云筆三矢換研七枚少價四百八十文又有研三枚以換筆九矢少價一百八十文則其下價為兩負四百八十是筆少于研之價一百八十是研少于筆之價先以左行筆負九遍乘右行得數首位異名宜變一行故其正負皆更之次以右行筆正三遍乘左得數右變則左不變故正負皆仍之于是以得數較其同異而為之減併筆各負二十七同名減盡研正同名相減餘五十四為法價正負異名併得四千八百六十為實實如法而一得九十為研價以研價乘左正研三得二百七十異加價負一百八十共四百五十以左負筆九除之得五十為筆價或以右研七價六百三十與價四百八十同減餘一百五十以筆三除之亦得筆價五十論曰左行原是研三少于筆九者一百八十文乘後得數則是九研少于二十七筆者五百四十文也右行原是三筆少于七研者四百八十文乘後得數則是六十三研多于二十七筆者四千三百二十文也夫兩行筆皆二十七則其價同也而右行研價多于筆四千三百二十文左行研價反少于筆五百四十文是兩行研價相差者共四千八百六十文也推求其説則只是兩行中相差五十四研之故也故減去相同之筆用此相差之研以除此相差之研價而每研之價可知矣若如難題所列以研為正筆為負問者當云以七研換三筆研多價四百八十以三研換九筆研少價一百八十文則價右正左負難題係書名左右研正遍乘得數首位本同名故其正負皆不變研減盡筆餘五十四為法價異併二千七百為實法除實得筆價以次得研價如前若以筆為正研為負則其價右負左正依法先得研價如第一圖以前四圖或以筆為正或以筆為負或以研為正或以研為負或以價為兩正或以價為兩負或以價為一正一負其所呼正負之名無一同者要其為同異加減之用則一也試以一行中同異言之其左行之價必與筆同名何也左行之價乃筆多于研之數也故與筆同名而與研異名也其右行之價必與研同名何也右行之價乃研多于筆之數也故與研同名而與筆異名也試以兩行中同異言之其上位皆減盡其中位皆相減為法其下價皆相併為實其減也皆以同名其研也皆以異名此下價異併例也假如有大小餘句不知數但云倍小餘句以當三大餘句則不及一丈五尺三寸若倍大餘句則如七小餘句畣曰大餘句六尺三寸小餘句一尺八寸法以正負列位先以左小餘句負七遍乘右得數首位異名宜變以相從故小句變負大句下負數皆變正次以右小餘句正二遍乘左得數右行既變則此行不變下適足無乘亦無正負乘訖乃較之小餘句各十四同減盡大餘句同減餘一十七為法下正數十丈零七尺一分無對不減就為實以法除實得六尺三寸為大餘句乃置左行二大句該一丈二尺六寸以左行相當適足之七小句除之得一尺八寸為小餘句或用右行三大句該一丈八尺九寸以同名負一丈五尺三寸減之餘三尺六寸以右行二小句除之亦得一尺八寸合問論曰以左小句遍乘右是各七之也為小句二大句三者七其相較之數亦七也以右小句遍乘左是各二之也為小句七大句二者二其相當適足者亦二也但以首位必同名然後可減故以右小句正變而為負以從左名也小句變為負則所與相較之大句不得不變而正矣于是小句同減盡大句同名減去四餘右行正十七下較數無減仍餘十丈七尺一寸然則此所餘者正是減餘大句之數矣何也小句十四左右皆同若只如左行四大句則與小句相當適足矣而今右行獨餘此較數者非以右多十七大句之故乎試以大句列于上則先得小句如後圖如法左乘右更其正負右乘左仍其正負大句同減盡小句同減餘正一十七在左行為法下較數負三丈六寸在右行無對不減就用為實以法除實得一尺八寸為小句就以左行小句七該一丈二尺六寸以左相當適足之大句二除之得六尺三寸為大句或于右行正一丈五尺三寸加異名小句負二該三尺六寸共一丈八尺九寸以右大句三除之亦得六尺三寸論曰左行原是小句七以當大句二適足今以右大句乘而各三之則是小句二十一以當大句六而亦適足也右行原是大句三以當小句二而大句多一丈五尺三寸今以左大句乘而各二之則是大句六以當小句四而多三丈六寸也以兩行之得數較之大句既減盡惟左行之小句餘一十七則是左行得數所以相當適足者以多此十七小句之故而右行小句得數小于大句三丈六寸者以少此十七小句之故也然則此三丈六寸者正是十七小句之數也依此論可見左行之所多即右行之所少故左行名正者用于右行即為負而隔行之異名即為同名此下較無減例也假如有大小方積不知數但云一大方積以當二小方積多數八十九若以三大方積當七小方積仍多二百五十一畣曰大方積一百二十一小方積一十六法以正負列位上中下先以右大積一遍乘左行皆如原數次以左大積三遍乘右行得數首位同名故兩行正負皆不變大積同減盡小積同減餘一為法較數同減餘一十六為實法除實仍得一十六為小積以右行小積負二該三十二加異名正八十九共一百二十一為大積或以左行小積負七該一百一十二加異名正二百五十一共三百六十三以左大積三除之亦得一百二十一為大積論曰左行原是大積三多于七小積者二百五十一乘後得數亦同右行原是大積一多于二小積者八十九乘後得數則是大積三多于六小積者二百六十七也于是以兩行對勘其大積既減盡惟小積左行餘負一其下較數則右行餘正十六夫此十六數者與大積同名是右行大積之數也右行少一小積而大積之盈數多十六左行多一小積而大積之盈數少十六然則此十六數者正是此一小積之數矣若以小方積為正則其下較數為兩負皆小積所少之數也故皆為負上中下依法遍乘對減餘大積一為法餘負一百二十一為實法除實不動就以一百二十一為大積右大積一該一百二十一同名減負八十九餘三十二以小積二除之得一十六為小積此是右行多一大方積故多一同名之數一百二十一同在一行易知不須重論以上二圖正負所呼迥異然所同者兩行之較數皆與大方積同名何也皆大方積多于小方積之數故與大方積同名而與小方積異名也此下較同減例也總論曰凡較數方程原列較數是本行中正與負之較也其乘後得數同減異加而得者則是兩行中正與正之較或負與負之較也故本行中以異名相較而兩行對減或加是以兩行之同名相較假如原列較數與正物同名是正多于負之較也若列較與負同名是負多于正之較也故曰本行中異名相較也假如乘後得數而兩行之較數皆與正物同名則兩較亦自同名乃以之對減而餘在一行則知此一行正物必多于對行之正物而其所多之數即如此所餘之較數矣假如兩行較數皆與負物同名則兩較亦自同名以之對減而餘在一行則知此一行負物必多于對行之負物而其所多之數正是此所餘之較數矣此同名相減之理也假如右行較數與正同名而左行較數却與負同名則一是正多于負之數而一是負多于正之數也夫正與負原相待負多于正之數即正少于負之數也于是用異名相加法以左行負多于正之數變為正少于負之數以相併則知右行之正數必多于左行之正物而其所多幾何正是此兩較之併數矣此異名相加之理也合同減異併而觀之總是兩行中同名相較也又論曰較數方程以兩相較而為用雖有三色四色乃至多色其相較也必兩此正負所由立也立正負以别同異猶彼我也夫彼我者豈有一定之稱哉以此為正則以彼為負若以彼為正則此反為負矣正負之相呼猶彼我之相視也故曰無定雖然無定者正負有定者同異其無定者在未立正負之先其有定者在既立正負之後既以一為主則同乎此者皆同名異乎此者皆異名矣是故無定而實有定也今試以所列方程最下位觀之其言正負者必上物之較數也不言正負者必上物之和數也較數有盈有朒有適足和則否假如下價盈則為正正與正同名試於正物價之中減去下同名正價之盈則所餘之價必與負物之價相當矣正與負異名試又取上負物之價以加下異名正價則又必與正物之價相當矣假如下價朒則為負正物之朒負物之盈也負與負同名試於負物價之中減去下同名負價則所餘之價必與正物之價相當矣負與正異名試又取上正物之何以加下異名負價又必與負物之價相當矣假如下價適足空位無盈朒則其上正負物價必自相當又論曰正負之術分别同異全在有交變之法以通其窮要其為用惟在使兩行之首位同名而已何也方程以互乘遞減立法每乘一次即減去一色然惟和數則一乘之後即可對減若較數則有同數而不同名之時若不減首位即不成方程若徑以異名而減勢必以同名而併法不畫一而于後條和較交變之時益混淆而難用故以法變之使首位之同數者無不同名而仍為同名利減焉首位既以同名減則凡減者皆同名凡併者皆異名而其法畫一矣故首位既變則行內之正負皆變何也從首位也行內之正負既皆從首位而變由是而原與首位同名者皆與隔行之首位同名也原與首位異名者即與隔行之首位異名也如此則隔行之同減異併亦清矣正負猶陰陽也牝牡也各行中各有正負猶兩儀之生四象也乘而交變猶剛柔相推而生變化也隔行之正本行以為負隔行之負本行以為正真陰真陽互居其宅也同名相減者陰陽之偏不得其配也異名相併者陰陽得類雌雄相食也是皆有自然之理焉可以思古人立法之原矣以上亦以二色者舉例三色以上乃至多色正負之用尤顯詳具諸卷中兹不贅列然其理著矣和較相雜方程例方程之用以御隱雜妙在雜與變知其雜則雜而不用矣知其變則變而不失其常矣諸書所論胥未及此故求之甚詳去之愈逺也用法曰凡方程和較雜者和較從和法列之不立正負較數從較法列之明立正負其偏乘得數後在較數行中者仍其正負之名在和較行中者皆變從乘法之名和數原無正負則無可變但乘後得數取其與較數之首位同名而已首位既同名下不得不同名矣凡兩較者下價或有減有併而中物只同減若一和一較者下價亦有減有併而中物皆異併此以兩色言之三色以上隨數通變皆以同異名御之假如有大小句不知數但云三其大句倍其小句共三丈三尺若倍大句則如六小句問若干畣曰大句九尺小句三尺法以一和一變列位適足者以相較而得名即同較義右行和數也不立正負左行較數也明立正負右乘左而三之和乘較也故其正負皆如故左乘右而二之較乘和也故得數皆為正從乘法之名也如法遍乘訖以兩行對勘大句同名相減盡小句異名相併得二十二為法正數六丈六尺無減就為實法除實得三尺為小句以左行小句六共一丈八尺為實以大句二為法除之得九尺為大句或于右行共三丈三尺內同減小句二共六尺餘二丈七尺以大句三除之亦得九尺論曰右行大句三小句二共三丈三尺乘後得數則是六大句四小句共六丈六尺也左行大句二小句六其數相當乘後得數則是六大句十八小句亦相當適足也于以對減而兩大句同減盡則其數同也而右行正數猶有六丈六尺左則無有其故何也右行正數中有小句四而左則無且不惟無之而已其相對之負數反有十八小句焉是左行正數又自除却十八小句之數也右行正數多四小句左行正數又自除却十八小句則是右行正數之多于左行正數者二十二小句也故併此二十二小句為右行所多之正物其六丈六尺則右行之正數也以正物除正數而小句可知知小句知大句矣又細考之六大句合四小句共六丈六尺則以與六大句相當之十八小句合四小句亦必六丈六尺也此亦西儒比例之理而以同異名盡之可見古人用法之簡快試更列之以小句居上則先得大句亦同上中下先以右小句二遍乘左行得數和乘較也故仍其正負次以左小句六遍乘右行得數較乘和也故皆命為負與乘法同名兩小句同減盡兩大句異併二十二為法負數十九丈八尺無減就為實法除實得大句九尺以右行大句三該二丈七尺減共三丈三尺餘六尺以小二句除之得小句三尺論曰小句互乘之後則其數同也小句數同則負數亦同而右行之負數獨有十九丈八尺左則無有者以右之負數中有大句十八而左則無不惟無也其所對之正數中反有大句四是左行負數中又原少四大句也右負數多十八大句左負數少四大句是右之負數多于左之負數者共二十二大句也然則右之負數獨有此十九丈八尺者正是此二十二大句之數也此和數與適足偕也假如有江湖兩色船載物不知數但云江船五以較湖船一則江多二千八百石江船三湖船五則共載二千八百石問船力若干畣曰江船六百石湖船二百石法以一和一較列位如法左右遍乘得數江船同減盡湖船異併二十八為法載物同減餘五千六百石為實法除實得二百石為湖船數以湖船數加右行異名正二千八百共三千石以右江船五除之得江船數六百石或以湖船五共一千石同減左行二千八百石餘一千八百石以左江船三除之亦得六百石論曰遍乘後江船數同則其載數亦同今以兩正數相減而左多五千六百者以左正數中有湖船二十五而右則無不惟無也其所對之負數中反有湖船三是右行正數中又自少三湖船也左多二十五右少三是左正數多于右數者共二十八湖船也然則左之正數獨多五千六百者正此二十八湖船之數也此和數偕一正也負亦同和變交變方程例凡方程三色以上以減餘重列則有和變較較變和者不可不察也若非和較之雜則二色方程之中物有減無併矣若非和較之變則三色四色方程和數者有減無並矣夫和數較數非自我命之名也其下價之為和為較不可誣也用法曰和變較者但和數減餘有分在兩行者兼而用之即變較數也和既變較即以較數法列之其法以一行之餘數命為正以一行之餘數命為負其下餘價以與中位餘物同在一行者即為同名從其正負而命之若下價減盡無餘者命為適足若減餘只在一行者無變也只用和數法較變和者但視較數減餘或有一行內皆正或皆負者即變和數也即如和數法列之不立正負其較數異併者以一行為主而以隔行之之異名從本行為同名若減餘行內有正負者無變也只用較數法若有兩異併而一位左正右負一位右正左負亦仍為較數不變雖減餘分在兩行而一行餘正物一行餘負物亦和數也何也隔行之異名乃同名也若減餘同名而分餘于兩行即仍為較數不變何也隔行之同名乃異名也若兩異併皆左正右負或皆左負右正亦和數也和較重列有俱變為較者有只變一行為較而餘行如故者較數重列有俱變為和者有只變一行為和而其餘如故者皆如上法以和較雜列之若四色以上有和變較較復變和者有較變和和復變較者皆以前法御之假如以衡校弓弩之力但云大神臂弓二弩九小弓二共重七百一十斤又有神臂弓三弩二小弓八共五百二十五斤又有神臂弓五弩三小弓二共五百一十五斤問各力畣曰大神臂弓力五十五斤弩力六十斤小弓力三十斤法先以和較列位凡三色者可任以一行為主與餘二行數相乘而減併之故前後之行可互更也詳見第三卷先以中行神臂弓二為法遍乘左右得數此以中行為主與左右互乘取其行間易為減併之用也次以右行神臂三遍乘中行得數與中行對減神臂弓中右各六對減盡中弩二十七內減去右弩四餘二十三中行餘也中小弓六去減右小弓十六餘十右行餘也中力二千一百三十內減去右一千五十餘一千八十斤中行餘也以上減餘分在兩行已變較數矣即用較數之法分正負列之而以弩與力命為同名弩與力同在中行故也次以左行神臂五遍乘中行得數而以中左兩行對減神臂弓各十減而盡中弩得四十五內減去左行弩六餘三十九中行小弓得十內減去左小弓四餘六中力得三千五百五十內減去左一千三十餘二千五百二十斤以上減餘俱在中行仍為和數也不分正負論曰此和數方程變為一和一較也何也中右得數兩大弓減盡則其力相若也弩數相減而餘在中行是中行之弩力多于右行也小弓相減而餘在右行是右行小弓之力多于中行也弩力中多于右小弓力右多于中而今共力相減惟中多一千八十斤則是此一千八十斤者非餘弩餘弓之共數而餘弩所多于餘弓之較數也雖欲不分正負不可得也如中左對減而餘弩餘小弓俱在中行則中行之餘力二千五百二十斤者仍為餘弩餘小弓共數無正負之可分也故以此兩減餘者依和較雜法重列而求之如前對減既于共力中清出首一色大神臂弓不與弩小弓雜矣然所餘之力尚為弩小弓共數與其較數而未能分别此二色之每數也故必重測依和較雜法以左右餘弩互遍乘得數左乘右和乘較也故仍其正負右乘左較乘和也故變從乘法之名皆曰正弩同減盡小弓異併五百二十八為法力同減餘一萬五千八百四十為實法除實得三十斤為小弓力以小弓力乘右行餘小弓十得三百斤異如力正一千八十斤共一千三百八十斤以餘弩二十三除之得六十斤為弩力或于左行共力二千五百二十斤內同減小弓六該一百八十斤餘二千三百四十斤以餘弩三千九除之得六十斤亦同即此可見兩減餘之為一和一較乃于原列任取右行八小弓力二百四十斤二弩力一百二十斤以減共力五百二十五斤餘一百六十五斤以大神臂弓三除之得五十五斤為大神臂弓力論曰兩弩正數同而其力不同者小弓之故也左行和數也是弩偕小弓之力也右行較數也是弩力中減去小弓之力而餘者也合而觀之則是左行之弩力有小弓一百三十八以為之益而右行之弩力反減去小弓三百九十然則左行正數之多于右行者凡共差小弓五百二十八而左行正數所以多于右行一萬五千八百四十斤者正是此小弓五百二十八之力也凡此減餘之數亦可互求若更置之以小弓列上則先得弩力如後圖上中下依法右左遍乘得數左乘右和乘較也故仍其正負右乘左較乘和也故變從乘法之名皆名之曰負小弓同減盡弩異併得五百二十八為法力異併得三萬一千六百八十為實法除實得六十斤為弩力以弩力乘右行弩二十三得一千三百八十斤同減正一千八十斤餘三百斤以小弓十除之得小弓力論曰兩小弓同名負其數既同而左行負數之力有若干右則無之而且反小于正數之力若干者何也以左行負數中有弩三百九十右則無之而其所對之正數反有弩一百三十八以為之除算則是左負數之多于右者共五百二十八弩也右負數少此五百二十八弩而正數力遂多六千四百八十斤左負數多此五百二十八弩則不但補却右行之所少而又自有力二萬五千二百斤然則左行共多于右三萬一千六百八十斤者正是此五百二十八弩之力也此三色和變較例也四色以上雜見諸卷中問有甲乙丙三數甲加七十三得為乙丙數者倍乙加七十三得為甲丙數者三丙加七十三得為甲乙數者四其本數各幾何畣曰甲七乙十七丙草三法先以較數列位先以中行甲正一遍乘右左得數皆如故只變中行故兩行之正負俱不變又是一數為乘法故數亦不變次以右行甲負三遍乘中行次以左行甲負四遍乘中行各得數左右既省不變故變中行以從之首位變負下三位俱變正次以中右得數相減併甲同減盡中乙得正六同減左得正一餘正五中丙得正六異併右得負三共得正九中較數得正二百一十九異併右負七十三共得正二百九十二次以中左得數相減併甲同減盡中乙得正八異併左得負四共得正十二中丙得正八同減左得正一餘七正中較數得正二百九十二異併左負七十三共得正三百六十五以上減併之數皆同名又皆在一行知已變為和數重列之不分正負依此顯雖同名而或乙正在中丙正在左即不得變和數也何也左行之正中行之負也論曰此較數變為和數也以中右之得數言之中行六個乙六個丙共多于三個甲者二百一十九右行一個乙少于三個甲三個丙者七十三于是兩相對較則兩行之甲皆三個其數本同而中行之乙丙多于甲二百一十九者因中行之乙多于右行之乙者五個又有同名之丙六個以益之而中行之甲又非若右行之甲與三個丙同名是又少三個丙也夫甲股內少則乙丙股內多合而觀之則是中行之乙丙股內共多五個乙九個丙而右行之乙股內共少此五個乙九個丙也夫中行之乙丙股內多五個乙九個丙便多于三個甲者二百一十九右行之乙股內少五個乙九個丙則不惟不多而反少于三個甲者七十三然則併此多二百一十九少七十三共二百九十二者正是此五個乙九個丙之共數而非其較數也故不分正負又以中左之得數言之中行正數是八個乙八個丙負數是四個甲而正數多者二百九十二左行正數是一個丙負數是四個甲四個乙而正數少者七十三于是兩相對勘則兩行負數之甲皆四個其數本同惟中行之正數內比左正數多七個丙又加八個乙而中行之負數又比左負數少四個乙合而觀之是中行之正數比左行共多十二個乙與七個丙而左行之正數比中行共少十二個乙七個丙也然則中行正數之多于負數二百九十二者以多此十二個乙七個丙而左行正數之反少于負數七十三者以少此十二個乙七個丙也則是併此多二百九十二少七十三之數共三百六十五者正是此十二個乙七個丙之共數而非其較數也故亦不分正負如法以乙數左右互遍乘得數相減無正負故有減無併乙減盡丙減餘七十三為法下位餘一千六百七十九為實法除實得二十三為丙數以丙數乘左行丙七得一百六十一以減共三百六十五餘二百四以左乙十二除之得一十七為乙數又以乙數異加原列右行負七十三共九十內減原右行丙三該六十九餘二十一以原右行甲三除之得七為甲數論曰此同文算指所立疊借互徵設問之一也原法繁重今改用方程簡易如此此所設問三色方程耳以西術求之已不勝其難况四色以往乃至多色乎此亦足見方程之不可廢而古人别立一章之誠有實用也此三色較變和例也四色以往至于多色則其變益多要不出于和較例具後諸卷中兹不詳列厯算全書卷四十
