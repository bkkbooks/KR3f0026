body:
  text: 厯算全書卷四十四宣城梅文鼎撰方程論卷五測量測量非方程事也方程者算術算術恃計測量恃目實惟兩途測量之不能兼算術猶算術之不能兼測量雖曰能兼非其粹矣今略具其所兼其不能兼者有句股諸法在測量在方程有二一曰隂雲測量隂雲者不見宿度而雲影微薄之處猶能見五緯若見二星則有其相距之度而可以方程取之矣一曰宿度測量宿度者雖無隂翳而無儀器故借宿距一定之度以取之必有二星同見或星與太隂同見則成方程之算矣隂雲測法假如隂雲不見宿次但於雲隙測得辰星在太白後一度又二日熒惑與二星同在一度又二日太白在熒惑前三度而辰星雲翳又一日辰星在房初度餘不可見又十二日熒惑始至房初問各行率若干畣曰辰星每日行二度太白每日行一度有半熒惑每日行半度解曰此辰星行二日太白亦二日而辰星多一度熒惑與太白同行三日而太白多三度辰星行四日熒惑十六日而行度相當也法曰以較數列位依省算以左行半之與右相減辰星同減盡太白二日右負熒惑八日左負皆無減分正負同名在隔行即異名也正一度亦無減與熒惑同名重列減餘與中行依省算以左行減三之一乃對減太白同減盡熒惑同減餘六日為法行度異併三度為實法除實得半度為熒惑每日行率以右減餘八日乗之得四度同減負一度餘三度以太白二日除之得一度半為太白日行率以右行太白二日行三度異加正一度共四度以辰星二日除之得二度為辰星每日行率假如測得辰星在金星後二度隂雲不知宿次但於四日後見二星同行在一度亦未知宿次又三日辰星行至房初度而金星雲翳至第四日金星亦至房初而水星未見問兩星每日行率若干解曰此兩星各行四日而辰星多二度辰星行三日金星行四日而其度相當法以較數列位二色者有一色偶同依省算徑以對減金星同減盡辰星同減餘一日為法正二度無減為實法一省除徑以二度為辰星每日行率以辰星三日行六度金星四日除之得每日行一度半若欲知前兩測某宿度者以金星四日行六度為二星同度距房初之數又加金星同行四日六度共十二度為前測金星距房之度又加辰星在金星後二度為辰星前測距房之度各以距度與房初度相求得前兩測星躔宿度如順行者前所測之宿在房後也氐宿亢宿也各置距度以氐宿亢宿度迭減之不盡者以轉減前宿之度得星所在宿度如逆行者前所測之度在房前也心宿尾宿也各置距度以房度心度逓減之減不及者即命為後宿星所在之度假如甲子日金星夕見乙丑日水星夕見至丁卯日水星行及金星但不及半度至戊辰日二星同度皆以陰晦不能細知宿次問各率若干解曰此金星行四日水星三日相當金星行三日水星二日則水星不及半度法以較數列位依省算左行二分加一水同減盡金同減餘半日為法空度七分半為實法除實得金星日行一度半金三日行四度半同減負半度餘四度以水星二日除之得日行二度假如廣福二船哨海福船先發行五日廣船行三日遇於中途其汎地相距二千五百里遂又同往一島廣船行四日先至候六日福船始至問各船每日行率解曰此廣船疾福船遲也廣船三日福船五日共行水面二千五百里廣船四日福船十日而水程相當畣曰廣船日行五百里福船日行二百里法以一和一較列位如法遍乗廣船同減盡福船異併五十日為法正一萬里無減為實法除實得二百里為福船毎日行率福船十日行二千里以廣船四日除之得五百里為廣船每日行率又如自東徂西共二千里先乗車行五日換舟行八日至其國其舟與車復同往一處車先行六日舟乃發行四日逐及問舟車行率畣曰舟每日二百里車每日八十里解曰舟疾車遲舟八日車五日共行二千里舟四日車十日行適相當依省算半右行數舟同減盡車異併十二日半為法正一千里無減為實法除實得八十里為車率以舟四日除車十日所行八百里得二百里為舟行率假如甲乙二船哨海同泊一山同用正卯酉字風東行但甲船先發解䌫七日乙船後行解䌫五日追及於一島又自此島用正子午字風南行但甲又先發解䌫九日泊於南洋乙後發解䌫七日泊於又南洋其二洋相距二百里問道里各數法以較數列位甲船同減盡乙船餘四日為法負一千四百里為實法除實得三百五十里為乙船每日率以甲船七日除乙船五日所行一千七百五十里得二百五十里為甲船率其一千七百五十里即山島相去之程以甲船九日行二千二百五十里為島去南洋之程又加二百里為又南洋之程合問計開甲船每日行二百五十里乙船毎日行三百五十里山島之距一千七百五十里島距南洋二千二百五十里距又南洋二千四百五十里自山至又南洋共水程四千二百里又假如二人同往西番公幹一人車一人騎車自某山西行九日騎自某河西行十日及之於一城其河在山之東相距三百里又自此城西行八日騎先至一國駐劄候一日車至問道里各如干法以較數列位如法徑減餘騎二日為法三百里為實法除實得一百五十里為騎行率併騎前後共十八日行二千七百里為所駐西國距河之程騎所行也減河距山三百里餘二千四百里為西國距山之程車所行也併前後車行十八日除之得一百三十三里又三分里之一即一百二十步也為車行每日里率用車行里率乗九日得一千二百為城距山之程以減總距餘亦一千二百里為西國距城之程計開騎日行一百五十里前後共行二千七百里車日行一百三十三里又三分里之一前後共行一千四百里城距山一千二百里距河一千五百里國距城一千二百里距山二千四百里距河二千七百里此上數則近事易知用明測量之理宿度測法凡測量之法有測器又有水漏則雖陰雲可以所見者得其度若但有測器而無水漏可以所見兩星之距度取之如前所列隂雲不知宿度之法是也乃又無測器而但據目見則當以宿度取之盖宿有一定之度借以為兩星之和度較度因所知以求不知此則方程之法可為測量者助也至於諸星行率古今厯術不同學者通其意無拘其數焉其可若一星單行非儀器比量莫知其遲疾之度然晴雨難期則亦有因所見以測所不見之時故算術不可廢也五星錯行多有相遇則和度較度可施若太隂毎月經行廿八宿一次與五星相遇亦每月有之精於推步者雖非假此定星然用與厯術相參有不藉儀器而知遲疾使看者引騐見効亦算家之樂也其五星各有遲疾留逆故測量比例當於相近日數内求之則所差亦不多也其遲疾變行湏查七政厯以約其日則一星單行亦自可考其進退之數兩星相較例假如兩宿原有定距如房距心若干度有一緯星在其間如金在房心間以旁星記之越若干日緯星行至東宿如心又别一緯星如火星在西宿如房越若干日行至先所記旁星之處此因無儀細測故借宿度用之如上所舉乃以宿距為二星和度也一緯星若干日如金一緯星若干日如火共行天若干度如房度故曰和度又如以一宿為主如心有緯星在其西如木以旁星記之越若干日緯星行過宿東至後一宿如尾又或異日别一緯星如土亦在前記緯星處所越若干日行至所借為主之宿如心此則以宿距為二星較度也一緯星若干日如木一緯星若干日如土相差若干度也如心度故曰較度凡此皆可以方程御之若得兩較度或兩和度或一和一較即二色方程術也若三星四星以上各得三兩宗測數以三色四色等方程求之無不可見如木星在一宿之西如井鬼之間越若干日行至其宿如鬼火星原在木星之西越若干日行至木星原處金星又在火星之西而恰當西宿如井越若干日行至火星原處又若干日亦至木星原處此亦借宿度為用而中有二和一較如云金星若干日火星若干日木星若干日共行若干度也如井度又金星若干日木星若干日共行若干亦用井度此二者和度也又金星若干日火星若干日而其行適等用火星至木星元處之日及金星自火星元處至木星元處之日此則較度也適足即較數也度無較其日則有較又如火星在房宿之西越若干日行過房抵心宿而木星自火星元處越若干日至房宿又有金星或先或後亦自火星元處越若干日行至房又若干日逐及木星於房心之間此以宿距為較度者三如云以火星若干日較木星若干日而火星之行多一房度也以火星若干日較金星若干日而火星亦多一房度以金星若干日較木星若干日而行度相等用兩星逐及於房心之間日數此上二則以三色取之凡所測不必兩星同在一度但欲有旁星可記異日有他星復至所記旁星之處即成同度之算右皆順行星例又如一星順行自房行幾日一星逆行自心行幾日相遇同度於房心間自此分行又幾日其逆行星至氐此用一較度一和度也順行星幾日逆行星幾日共行房宿度此為和度順行星幾日逆行星幾日而逆行星多一氐宿度此為較度用逆行星相遇後至氐宿之日數又如一星自建星順行至幾日遇逆行星又幾日至牛宿其逆行星自相遇處行幾日至建星又幾日至斗宿距星此亦一和一較順行星幾日逆行星幾日而行度相當用二星兩相遇處至建星之日數此較度也順行星幾日逆行星幾日而共行斗宿度用兩相遇後順行星至牛逆行星至斗之日數此和度也右逆行星例問金火二星在房宿之西同度越九日金星行過房東至一處有星可記又一日金星行至心宿又八日火星始至房又九日火星始至前所記金星之處其二星行度各若干解曰此金星行九日火星廿七日而行度相等金星行十日火星十八日而金星多六度房宿六度故也法以較數列位依省算以右行加九之一乃對減餘火星一十二日為法六度無減為實法除實得半度為火星率以金九日除火廿七日行十三度半得一度有半為金星率假如太隂自尾宿初度行三日遇木星於斗牛間又三十日木星行至牛此太隂三日木星三十日共行四十五度借尾至牛之度約略其數後倣此木星自牛初行三十日與羅㬋遇於牛女間又一百二十日羅㬋退至牛此木星行三十日羅㬋一百二十日而度等羅㬋計都月孛有數無形借顯逆行之用羅㬋自牛初退行一百日遇土星於箕斗間又五十日土星行至牛此羅㬋一百日土星五十日行度等土星自牛初行三十日火星逐及遇於牛女間又三十日火星行至虚此土星三十日水星三十日而共行十八度火星自虚初行五十日水星逐及遇於危室間又十日水星行至奎此火星行五十日水星十日共行四十五度水星自奎初行十五日逐及金星遇於昴畢間又十七日金星行至畢此水星十五日金星十七日共行五十五度半金星自畢初行二十日遇計都於井鬼間又四十日計都退至井此金星二十日計都四十日而金星多二十八日借畢至井之距為兩星之較計都自井初逆行二十日遇月孛於參井間又十日月孛行至井此計都二十日月孛十日而行度等月孛自井初行八十日太陰逐及遇於井鬼間又二日太陰行至栁此月孛八十日太隂二日共行三十四度問各行率若干凡此所設不必其同日在一度謂之相遇但與宿值或有星可記即如同度之理如法列位九色和較之雜因九色行中擠廹既多空位取出其行次相對者列而先乗此捷法也先以甲壬太隂對減兩行相對只三色餘俱兩空省不書俟重列時以次添入用省算法以甲行三之一壬行二之一列之因甲行可三除壬行可二除而除之則太隂皆一日故除而列之徑對減太隂盡餘木星十日右月孛四十日左減餘二度左分正負太隂減去尋原列中乙行有木星徑與減餘對列用前法以左乙行三之一與減餘列之木星徑同減羅四十日左負孛四十日右負負二度右負皆無減以隔行同名仍分正負木星減盡尋丙行有羅㬋徑與減餘重列用前法以減餘二之一丙行五之一列之羅㬋同名徑減餘三位無減以隔行皆負分正負而孛與較同名羅㬋減盡尋丁行有土星徑對餘數和較列位用前法以丁行三之一列之而命之為正土同減盡餘無減度異併七度皆左正右負復變和數土星減去尋戊行有火星徑對餘數用前法以戊行五之一列之火徑減水左孛右無減分正負復為較餘二度左與水星同名火星減盡尋已行有水星以對餘數又因巳行不便省算改用辛行月孛相對用前法以減餘半而列之孛同減餘俱無減隔行同名仍為較月孛減盡尋庚行有計都以對餘數水與較度皆右行負同名用前法以庚行半而列之計同減水右負金左負無減仍為較餘十三度左負與金同名計都減盡尋巳行恰皆二色以相對如法乗水同減盡金餘異倂一百六十七日為法度異併二百五十半度為實法除實得每日一度半為金星率以巳行金星十七日行二十五度半減共五十五度半餘三十度以水星十五日除之得每日二度為水星率以戊行水星十日行二十度減共四十五度餘二十五度以火星五十日除之得毎日半度為火星率以丁行火星三十日行十五度減共十八度餘三度以土星三十日除之得每日十分度之一為土星率以丙行土星五十日行五度以羅㬋一百日除之得每日二十分度之一為羅㬋率以乙行羅㬋一百二十日行六度以木星三十日除之得每日五分度之一為木星率以甲行木星三十日行六度以減共四十五度餘三十九度以太隂三日除之得每日十三度為太陰率再以庚行金星二十日行三十度同減去正二十八度餘二度以計都四十日除之得每日二十分度之一為計都率與羅㬋同以辛行計都二十日行一度以月孛十日除之得每日十分度之一為月孛率以壬行月孛八十日行八度減共三十四度餘二十六度太陰二日除之仍得毎日十三度為太陰率論曰各星遲疾留逆每叚不同然其各叚中行率大約相等故可以方程立算亦湏稍查時厯以知其變若太近留叚行率甚微難見其在合伏左右行甚疾毎日不同難與他星相較則以一星遲疾之較取之具如後例一星遲疾相較例凡木火土三星雖有遲疾之行大約皆在一度以下而土木之變尤緩其數十日中行率僅差秒忽兩星相較之法頗可施用惟金水二星遲疾之差懸逺其疾也有在一度以上而水星有二度其遲也不及一度遲之甚則留故可以其遲疾而自相較也假如金星疾叚測得甲乙丙三日共行四度二十九分己庚兩日共行二度有半問各日行率此因前測以隂雲用儀得其度分而不知宿次故雖後測能知宿次而中數日不可知是惟方程能御之也法以和數列所測以較數列中日因挨日進退故倍中日為前後兩日而命之適足盖已知測日同在一叚故也如法互乗逓減餘庚廿七日為法三十三度廿一分為實法除實得一度廿三分為末日行率庚以庚日行率減共二度五十分餘一度廿七分為第六日行率己倍己日行率減去庚日行率餘一度三十一分為第五日行率戊倍戊日行率減去己日行率餘一度三十五分為第四日行率丁倍丁日行率減去戊日行率餘一度三十九分為第三日行率丙倍丙日行率減去丁日行率餘一度四十三分為次日行率乙倍乙日行率減去丙日行率餘一度四十七分為初日行率甲累計甲乙丙日共四度廿九分己庚日共二度半合問或倍庚日行率共二度四十六分以減共二度半餘度四分為日差以日差累加庚日得各日行率總論曰凡步五星既得其叚日以為日率則以其盈縮之厯加減星行而得其叚所行之宿次以為度率以日率除度率而得其平行則又以初末日率相求使之陞降有等以為日差而加減之故日差者步五星之要事也右例不拘日數但在遲疾本叚則可用此法亦不拘定是宿次所見或儀器所測但有兩宗宿度則其餘日皆可倍中日以較其前後兩日命為正負適足而求之何則其加減皆相挨而有序故知倍中日即同前後兩日也假如金星晨疾測得甲日之寅距地平一度至丙日之卯距地平三十度七十五分至己日之卯距地平三十度問各日行率解曰此是甲乙兩日共行二度二十五分丙丁戊三日共行三度七十五分也法以丙日距三十度七十五分減寅至卯差三十度餘度七十五分與甲日距一度相減餘度二十五分為金星疾行過平行一度之數加甲乙兩日太陽行二度是為兩日内金星行二度二十五分又以己日距三十度與丙日距度相減餘度七十五分為金星疾於平行之度加丙丁戊三日太陽行三度是為三日金星行三度七十五分論曰此因隂雲不能細測每日之度故五日中僅有三測也或雖無隂雲而儀器不具惟此三日有所當宿次可借以為行度之據則所得者皆為前兩日後三日之和度也如法以兩和三較列位因逓差補作三適足而列之如法乗減得丁三日為法共三度七十五分為實法除實得一度二十五分為丁日行率此因末兩行減餘三色減去二色只一法一實故徑用以求也以丁減餘七日行八度七十五分同減負二度二十五分餘六度五十分以戊減餘五日除之得一度三十分為戊日行率此用三四兩行減餘以丁戊兩日行率相減餘度五分為日差以日差減丁日行率得丙日行率累減之得甲乙日行率計開甲日行一度十分乙日行一度十五分兩日共行二度二十五分丙日行一度二十分丁日行一度二十五分戊日行一度三十分三日共行三度七十五分合計之五日共行六度此六度者乃金星行於黄道之度寔數也寔數者以宿度徴之如甲日之晨在某宿某度至己日之晨已進六度也其距太陽之數則五日共差一度此一度者乃金星漸近太陽之距亦即漸近於地平之距也目所見也謂之視差則以儀器度而知之如甲日之卯距地平三十一度至己日之晨卯刻則距地平三十度為較前相近一度也今所測為甲日之寅寅與卯相差三十度故寅之星距地平一度者至卯則距三十一度也其時刻以水漏或中星得之若寅正與卯初則只差十五度每刻則差三度太此以儀測星者所當知論曰凡加減日差湏明進退之理如戊日之行率多於丁日則其疾為進也而先得末日則以日差累減之而得初日若先得初日則當以日差累加之而得末日如前一例庚日之率少於己日則其疾為退也而先得庚日則以日差累加之而得初日若先得甲日則當以日差減之而得末日其遲叚則皆反之如末日多於初日其遲為退也則減末加初若初日多於末日其遲為進也則減初加末論曰凡七政盈縮古今厯術綦詳所設立差平差之術尤宻至於太隂遲疾時刻逈異授時立法以三百三十六限更非逓加挨減所能定惟五星既得叚日定星其日差可以循次加減而方程測量之法可施也又方程測量為草澤不能具儀器而偶有所見設此御之使獨見者可以共曉若從事推步則有厯學諸書幸勿以管窺為誚厯算全書卷四十四
