body:
  text: 少廣拾遺序少廣爲九章之一其開平方法爲薄海内外測量家所需非隸首不能作也平方而外有立方以爲鑿築土方之用課工作者猶能言之若三乗方以上知之者葢已尠矣嘗見九章比類厯宗算會算法統宗俱載有開方作法本原之圖而僅及五乗竝無算例同文算指稍變其圖具七乗方算法而不適於用詮釋不無譌誤西鏡録演其圖爲十乗方而舉數僅詳平立三乗一式而已餘皆未及康熙壬申余在都門有友人傳逺問屬詢四乗方十乗方法葢諸乗方法獨此二端不可以借用他法而問者及之竊喜朋儕中固自有留心學問之人遂稍取古圖紬繹發其指趣爲作十二乗方算例頗覺詳明然後知今日所用開平方法廼算數家徑捷之用而不及古圖之簡括精深也宣城梅文鼎
