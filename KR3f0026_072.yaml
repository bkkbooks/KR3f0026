body:
  text: 少廣拾遺序少廣為九章之一其開平方法為薄海內外測量家所需非隸首不能作也平方而外有立方以為鑿築土方之用課工作者猶能言之若三乘方以上知之者蓋已鮮矣嘗見九章比類厯宗算會算法統宗俱載有開方作法本原之圖而僅及五乘並無算例同文算指稍變其圖具七乘方算法而不適於用詮釋不無訛誤西鏡録演其圖為十乘方而舉數僅詳平立三乘一式而已餘皆未及康熙壬申余在都門有友人傳逺問屬詢四乘方十乘方法蓋諸乘方法獨此二端不可以借用他法而問者及之竊喜朋儕中固自有留心學問之人遂稍取古圖紬繹發其指趣為作十二乘方算例頗覺詳明然後知今日所用開平方法乃算數家徑捷之用而不及古圖之簡括精深也宣城梅文鼎
