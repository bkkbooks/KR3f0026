body:
  text: 比例規用法假如原序康熙癸未季弟爾素有比例規用法假如之作又五年丁亥重加挍録示豫屬為序序曰形而上者不可得而數有數可數即有象可見故算法量法理本相通而尺可為算器也厯書中有書一卷專明尺算謂之比例規解比例云者謂以尺中原有之兩數求今所問之兩數以例相比如古者異乘同除及西人三率之法而有尺以著其象則不煩言説乃作者之意也規云者謂以銅鐵為規器兩髀翕張用其末鋭分指兩尺上同數以得橫距而命得數則用尺之法也規本畫圓之器于尺算為借用故仍其名曰規本解有作法用法惜無設例罕能用者攜李陳獻可藎謨補作例祗平分一線而已龍舒方位白中通作數度衍以橫尺取數而不用規亦惟平分一線夫平分用止乘除聊足以明異乘同除之理而尺算之善不盡于是若乃平方立方分圓輕重諸術其求法多不以異乘同除為用而數變為線爰生比例即盡歸于異乘同除此其所長也又規端取數毫氂可辨而遊移進退簡快靈妙橫距雖無數而取諸本尺其則不逺固勝橫尺矣吾弟此書仍其用規本法自平分以下十線一一為之用例以明之原書謬誤稍為刋正然後其書可得而用為功于度數之學不小也憶嵗乙卯余始購得厯書抄本于吳門姚氏偶缺是解至戊午秋介亡友黃俞邰太史虞稷借到皖江劉潛柱先生本抄補之蓋逾時而後能通其條貫以是正其訛闕又次年己未始為山隂友人何奕美作尺亦稍以己意增損推廣之而未暇為立假如今得爾素是書可以無作矣勿菴兄文鼎序方爾素撰此書時安溪相國以冢宰開府上谷公子世得鍾倫鋭意厯算之學余兄弟及兒以燕下榻芝軒與諸同學晨夕問難甚相得也無何爾素挈兒燕南歸相國入參密勿而世得亡兒相繼化去余亦大病濱死然猶能偷視息至今日為爾素序此書不可謂非不幸中幸也憶爾素六十時余有句云如稼觀登場如行將百里何以收桑榆無為所生恥今當相與念兹弗替爾勿菴又識
