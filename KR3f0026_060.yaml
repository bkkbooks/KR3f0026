body:
  text: 厯算全書卷四十七宣城梅文鼎撰句股闡微卷二句股積求句股弦句股積與弦較較求諸數第一法假如句股積一百二十弦較較十二法以積四之得四百八十弦較較自之一百四十四兩數相減餘三百三十六折半一百六十八為實弦較較十二為法除之得句股較十四以加弦較較十二共得二十六為弦有弦有句股較即諸數可求論曰甲乙丙丁合形為弦自乗大方幂甲小方為句股較幂弦幂内減句股較幂所餘丙乙丁磬折形原與四句股積等於中又減去乙小方為弦較較自乗幂仍餘丁丙二長方並以句股較為其長以弦較較為其濶故折半而用其一為實以弦較較為法除之得句股較矣是以濶求長第二法置四句股積四百八十與弦較較自幂一百四十四相加得共六百二十四折半三百十二為實弦較較十二為法除之得二十六為弦弦内減去弦較十二得餘十四為句股較論曰乙丙丁磬折形原與四句股積等今加一小方形如己為弦較自乗幂與乙等又丁丙二長方原相等於是合丁己為一長方合乙丙為一長方必亦相等矣並以弦較較為濶以弦為長故折半而用其一為實以弦較較為法除之即得弦矣亦是以濶求長第三法置四句股積四百八十為實弦較較十二為法除之得四十為弦較和以弦較較十二加弦較和四十得五十二折半二十六為弦以弦較較十二減弦較和四十得二十八折半十四為句股較於前圖乙丙丁磬折形即四句股積移丁長方置于戊為乙丙戊長方其長如弦較和其闊如弦較較故以弦較較除之得弦較和若以弦較和除之亦得弦較較又簡法置句股積一百二十為實以弦較較十二半之得六為法除之得二十為半弦較和以半弦較較六加半弦較和二十得二十六為弦又以半較六減半和二十得十四為句股較論曰長方形濶十二如弦較較長四十如弦較和其積如四句股今只用一句股積是四之一也積四之一者其邊必半觀圖自明句股積與弦較和求諸數第一法假如句股積一百二十弦較和四十法以積四之得四百八十弦較和自之得一千六百兩數相減餘一千一百二十折半得五百六十為實弦較和四十為法除之得十四為句股較以減弦較和得二十六為弦弦自乗六百七十六加四句股積四百八十得一千一百五十六平方開之得三十四為句股和以與句股較十四相加得四十八折半二十四為股又相減得二十折半得一十為句句一十股二十四弦二十六句股和三十四句股較十四弦較和四十弦較較十二論曰總方為弦較和四十自乗之幂内分甲戊己方為弦自乗幂乙小方為句股較自乗幂於弦幂内減去戊己磬折形即四句股積則所餘者甲小方即句股較幂與乙方等以甲小方合丁長方即與乙丙長方等以丁丙小長方原相等故此二長方並以句股較十四為濶以弦較和為長四十故折半而用其一為實弦較和四十為法除之即得句股較是為以長求濶第二法弦較和自乗一千六百與四句股積四百八十兩數相加二千八十折半一千四十為實弦較和四十為法除之得二十六為弦以減弦較和得十四為句股較餘如前觀後圖自明第三法置四句股積四百八十為實弦較和四十為法除之得十二為弦較較餘同弦較較第三法又簡法句股積一百二十為實弦較和四十半之得二十為法除之得六為弦較較之半餘並同弦較較簡法論曰乙丁丙甲戊己合形為弦較和四十自乗之大方外加一庚辛長方為四句股積與戊己磬折形等於是中分之為兩長方乙丁庚辛合為左長方丙甲己戊合為右長方並以弦為濶二十六弦較和四十為長故折半為實以弦較和除之得弦亦為以長求濶借此圖可解第三法之理何則庚辛長方形既為四句股積而其濶十二如弦較較其長四十如弦較和是十二與四十相乗之積也故以弦較較除之得弦較和若以弦較和除之即復得弦較較若庚辛長方横直皆均剖之成四小長方則其濶皆六加半較其長二十如半和而其積皆一百二十為一句股積矣此又簡法之理也句股積與弦和較求諸數第一法假如句股積六千七百五十弦和較六十法以弦和較自之得三千六百與四句股積二萬七千相減餘二萬三千四百折半一萬一千七百為實弦和較六十為法除之得一百九十五為弦加較六十得句股和二百五十五弦幂内減四句股積開方得句股較以加句股和折半得股以減句股和折半得句句七十五股一百八十弦一百九十五句股和二百五十五句股較百五弦和和四百五十弦較和三百弦和較六十弦較較九十第二法以弦和較自乗三千六百與四句股積二萬七千相加得三萬六百折半一萬五千三百為實弦和較六十為法除之得二百五十五為句股和内減弦和較六十得一百九十五為弦論曰丁丙方為句股和自乗方幂内減甲戊方為弦自乗幂其餘丁戊丙磬折形四句股積也内減戊乙小方為弦和較自乗積則所餘丁戊長方與戊丙長方等而並以弦為長弦和較為濶故以弦和較除之得弦此第一法減四句股積之理也若於丁戊丙乙磬折形外加一己丙小方與戊乙等乃併之為庚戊長方與辛乙等並以句股和為長弦和較為濶此第二法加四積之理也兩法並以濶求長第三法置四句股積二萬七千為實弦和較六十除之得四百五十為弦和和以與弦和較相加折半為句股和又相減折半為弦此如有句股積有容圓徑而求句股弦乃還元之法也論曰前圖中辛乙長方并戊丙長方是四句股積聯之為辛丙長方則其濶丁辛弦和較也其長丁丙弦和和也又簡法置句股積六千七百五十為實半弦和較三十除之得二百二十五為半弦和和以與半弦和較相加得二百五十五為句股和又相減得一百九十五為弦此如有容圓半徑以除句股積而得半弦和和句股積與弦和和求諸數第一法假如句股積六千七百五十弦和和四百五十法以積四之得二萬七千弦和和自之得二十萬二千五百兩數相減餘十七萬五千五百折半八萬七千七百五十為實弦和和四百五十為法除之得一百九十五為弦以減弦和和得二百五十五為句股和第二法以四句股積與弦和和幂兩數相加得二十二萬九千五百折半得十一萬四千七百五十為實弦和和四百五十為法除之得二百五十五為句股和以減弦和和得一百九十五為弦論曰甲乙大方弦和和自乗也内分甲丁方弦自乗也與丁丙方等丁乙方句股和自乗也於丁乙内減去丁丙弦幂則所餘者四句股積即壬乙丙戊二小長方也而己辛小長方與丙戊等則己乙長方亦四句股積也今於甲乙大方内減去己乙則所餘者甲戊己戊二長方並以弦為濶弦和和為長故以弦和和除之而得弦此第一法減四句股積之理也是為以長求濶又論曰若於甲乙大方外増一甲庚長方與己乙等而中分之於癸戊則癸乙與癸庚兩長方等並以句股和為濶弦和和為長故以弦和和除之而先得句股和此苐二法加四句股積之理也亦是以長求濶第三法置四句股積二萬七千為實弦和和四百五十除之得弦和較六十此如併句股弦除四倍積而得容員徑又簡法置句股積六千七百五十為實半弦和和二百二十五除之得半弦和較三十此如合半句半股半弦除積得容員半徑欲明加減用四句股之理當觀古圖甲乙丙句股形甲丙句六甲乙股八乙丙弦十甲丁句股和十四壬辛句股較二甲己大方句股和自乗冪也其積一百九十六丙戊次方弦自乗冪也其積一百壬庚小方句股較自乗冪也其積四甲己和冪内減弦冪所餘者四句股也弦冪内減較冪所餘者亦四句股也句股之積並二十四甲丁句股和十四癸丁弦十子丁句股較二甲丙方爲句股和自乗冪一百九十六内減癸辛弦冪一百餘九十六爲甲己丙磬折形亦卽四句股積内分甲己直形移置於丙戊成乙戊長方卽爲弦和較乗弦和和又壬丁小方爲句股較自乗其冪四以減弦冪一百餘九十六爲癸壬辛巳磬折形亦卽四句股積内分癸壬直形移置於辛庚成己庚長方卽爲弦較較乗弦較和假如方環田有積有田之濶問内外方各若干法以積四之一爲實田濶除之得數爲内外二方半和與田濶相加得外方又相減得内方葢田濶卽如半較若但知外方及内小方及環田積法即并大小方邊為和以除積得數為較較與和相加折半為外周大方又相減折半為小方以兩方之較折半為環田濶若方田内有方墩法同或方墩不居正中其法亦同但只可求大小方邊不能知濶總論曰弦較較乗弦較和之積與弦和較乗弦和和之積等為四句股乃立法之根也而其理皆具古圖中學者所宜深玩又如有辛庚壬圓池不知其徑法於乙作甲乙直線切員池於庚又乙丙横線切圓池於壬乙為正方角又自丙望甲作斜線切員池於辛乃自丙取乙丙之度截斜線於丁又自甲取甲乙之度截斜線於戊末但量丁戊有若干尺即圓池徑解曰此即句股容員法也丙乙句截甲丙弦於丁則丁甲為句弦較甲乙股截弦於戊則戊丙為股弦較而丁戊為弦和較故即為圓徑其句股弦不必問其丈尺但取三直線並切員而乙為方角足矣故為測員簡法凡城堢墩臺錐塔員柱之類形正員者並同一法也句股容方係鮑燕翌法句股形引股線法即依正角作方形於形外又即引小形成大形甲乙丙句股形今欲引甲乙股至丁甲丙弦至戊而令乙丁與戊丁等法曰以乙丙分甲乙得數減一餘用歸甲乙得之解曰乙丙與甲乙原若丁戊與甲丁故以乙丙分甲乙與以丁戊分甲丁所得之分數等然則減一者雖似于甲乙分數内減乙丙之一分實于甲丁分數内減丁戊之一分也即乙丁之一分故以減餘分甲乙而得勿菴又法句股相乗為實句股較為法除之亦即得所引乙丁與乙戊同數句股形截股法即依正角作方形於形内又即截大形成小形甲丁戊句股形内今欲截甲丁股於乙甲戊弦于丙而令乙丁與乙丙等法曰以丁戊分甲丁得數加一共用歸甲丁得之勿菴又法句股相乗為實句股和為法除之亦即得所截乙丁與丁丙同數即句股容方法解曰丁戊與甲丁原若乙丙與甲乙故以丁戊分甲丁與以乙丙分甲乙所得之分數等然則加一者雖似于甲丁分數外加丁戊之一分實于甲乙分數外加乙丙之一分也即乙丁之一分故以加共分甲丁而得若欲令丙戊與丁戊等或欲令乙丙與丙戊等依法推之按後一法即句股容方也原法簡易今鮑燕翼先生所設殊新要其理亦相通耳勿菴補例設甲乙股十六乙丙句八今引甲乙股長出至丁而令引出之乙丁股分與所當之丁戊句等問若干答曰乙丁十六法以乙丙句八甲乙股十六相乗得一百廿八為實句股相減得較八為法除之得乙丁引出一十六與丁戊句相等若如鮑法以句八除股十六得二内減去一仍餘一用為法以除股十六仍得十六為乙丁又設甲乙股四十八乙丙句十二依法引出乙丁股十六與丁戊句等法以句十二乗股四十八得積五百七十六為實句減股得較三十六為法除之得十六為乙丁或以句十二除股四十八得數四内減一餘三為法以除股四十八亦得十六為乙丁又設甲乙股六乙丙句四依法引出乙丁股十二與丁戊句等法以句乗股得二十四為實句股較二為法除之得十二為乙丁或以句四除股六得一半内減一餘半為法以除股六亦得十二為乙丁解曰半為除法則得倍數此畸零除法也詳别卷又設甲乙股三十乙丙句十二依法引出乙丁股二十與丁戊句等法以句乗股得三百六十為實句股較十八為法除之得乙丁二十或以句十二除股三十得二半内減一餘一半為法以除股三十亦得乙丁二十解兩法相同所以然之故葢此是依句股正角即乙角作正方形於形之外也本法以句弦較為法除句股形倍積即句股相乗今不用句股較之本數而用其除過之句股較為法以句除股則股内所原帶句數及句股較數並為句所除而減去其一即減去除過之句也用減餘為法即是用其除過之句股較為法也故亦不用句股形之倍積而用其除過之倍積為實倍即是句股相乗之數若以句除之必仍得股今徑以股數受除即是用其除過之倍積為實也法實並為除過之數則其理相同而得數亦同矣以上補第一條之例設甲丁戊形甲丁股廿八丁戊句廿一甲戊弦三十五欲截甲丁股于乙截甲戊弦于丙而令所截之乙丁與乙丙等問其數若干答曰乙丁一十二法以甲丁股二十八丁戊句二十一相乗得五百八十八為實併句股得和四十九為法除之得一十二為所截乙丁與乙丙截句等如鮑法以句二十一除股二十八得一又三之一又外加一數共二又三之一為法通作七用以除股二十八通作八十四亦得十二為乙丁截股設甲丁股三百四十五丁戊句一百八十四弦甲戊三百九十一欲截乙丁與乙丙等該若干答曰一百二十法以句一百八十四股三百四十五相乗得六萬三千四百八十為實句股和五百二十九為法除之得所截乙丁一百二十與截句乙丙等或以句一百八十四除股三百四十五得一又八之七又外加一共二又八之七通作二十三為法以股三百四十五通作二千七百六十為實法除實亦得一百二十為乙丁截股解兩法相同所以然之故葢此是依句股形正角作方形於内即句股容方也本法以句股和為法除句股形倍積即句股相乗今不用句股和本數而用其除過之句股和為法股被句除既變為除過之股而得數中之一其本數皆與句同今於得數又加一是又加一除過之句合之則共為除過之句股和矣故即用股為實以當除過之倍積法與實並為除過之數則其理相同而得數亦同矣以上補第二條之例按數度衍有在逺測正方形之算立破句名色不穏圖亦不真今于此第一例中生二法補之分角線至對邊亦係鮑法甲乙丙句股形今平分乙方角作乙丁線至對邊弦欲知丁㸃之所在法曰先依句股求方求得己丁戊乙正方形次用丁戊丙形或丁己甲形求得丁丙弦或甲丁弦即得甲乙丙句股形今平分乙鋭角作線至甲丙股欲知丁㸃所在法以甲丙股乙丙句相乗得丙庚長方亦即乙辛長斜方其辛戊小長斜方又即戊壬長斜方取甲子癸小句股形補壬寅丑虚句股形成甲寅長方此即句股相乗實以句弦和除之也甲乙為弦乙壬即句得壬寅邊丙甲辛句股形中即甲乙丙原設形作甲卯垂線至丙辛弦法另具于是一率甲卯二率甲辛三率甲子四率甲癸即丁己成丁己乙戊四斜方形次用丁戊丙形或丁己甲形依句弦求股求得丁丙或丁甲即得按上鮑法此寅甲長方為句弦和除句股形倍積所得壬寅邊必小于句股容方之邊其内容丁己乙戊四斜方形之丁己邊又必大于句股容方之邊二者之間可以得容方邊矣容方邉除倍積得句股和以減句弦和得股弦較即其他可知求丁己線法一率甲丙股二率甲乙弦三率壬寅四率丁己即壬丑甲乙丙鋭角形求分乙角作線至甲丙邊之丁㸃法於形中求得辰丙垂線丙辛甲形即甲乙丙形故其垂線等用丙長線乗乙丙所得即辛乙長斜方形自此以下至成丁己乙戊四斜方並同前法次用比例法一率甲乙二率甲丙三率丁戊四率得丁丙或一率甲乙二率甲丙三率甲己四率甲丁甲乙丙鈍角形法先從形外求得甲辰外垂線引乙丙線與之相遇次以甲辰垂線乗乙丙得乙辛長斜方形餘同前法甲乙丙鈍角形甲辰垂線在形外與右圖同法鼎按若依幾何六卷三題法甚㨗句股容員甲乙丙句股形求容員徑卯戌即丁辛法於甲丙弦上截丁丙如句乙丙又截甲辛如股乙甲因得丁辛即容員之徑試依所截丁丙為句作戊丁丙句股形自丁作弦之垂綫至戊又引乙丙句遇于戊即成此形又依所截甲辛為股作甲辛氐句股形自辛作弦之垂線長出至氐引甲乙股遇于氐又作戊戌房句股形引戊丁股至房如弦之度自房作垂線至戌即成乃自甲自戊各為分角綫遇於己成十字則己即容員心也又引十字綫透出而以甲己為度截之於癸于女乃自癸作線與丙戊平行至辰又自女作辛氐及房戊之垂線穿而過之與癸辰線遇於辰又引氐辛線至癸引房戌線至女得女辰女房癸辰癸氐四線皆如甲丙弦女卯女亢癸丑癸未四線皆如甲乙股卯辰房亢丑氐辰未四線皆如乙丙句又成女卯辰女亢房癸未辰癸丑氐四句股形共八句股形縱横相叠並以容員心己㸃為心此同心八句股形各線相交成正方形二其一卯戌丑乙形依原形之句股而立其乙方角即原形之所有也其一丁辛亢未形依原形之弦而立即所謂弦和較也此兩形者皆相等而其方邊並與容員徑等即容員徑上之方幂也然則何以又為弦和較試即以原弦論之甲丙弦上所截之丁丙即句也甲辛即股也句股相併即重叠此丁辛一邊是句股和多於弦之數古人以弦和較為容員徑葢謂此也八句股形即有相等之八弦每一弦上各有此重叠之線以成兩四方形相等之八邊可以觀矣因鮑圖改作之彼原有八角形外小句股形輳成一等面八角形之論但圖欠明顯相似兩句股并求簡法假如癸辛己大形癸壬乙小形其癸角等則為相似之兩句股形今欲求兩形之兩句合線兩句者一為己辛大句一為壬乙小句即辛甲也則己甲為兩句合線法以兩弦一癸己大弦一癸乙小弦并之為三率以癸角之正弦兩癸角等只用其一為二率二三相乗為實半徑全數為法實如法而一得四率己甲即己辛壬乙兩句之合數何以知之曰試引癸己弦至丁截己丁弦如癸乙則丁癸即兩弦合數也乃以癸角之正弦乗之半徑全除之即得丁丙而丁戊即壬乙以己丁即癸乙也亦即甲辛戊丙即己辛同在直線限内也則所得丁丙亦即己甲矣有句股和有弦求句求股量法乙甲句股和丙甲弦原法以甲為心作乙己卯象限又以丙甲弦半之於丁以丁為心作甲戊丙半圓次于丙戊半員上任以辛為心丙為界作丙己小員屢試之令小員正切象限如己乃作己辛甲及辛丙二綫則辛丙為句辛甲為股如所求按此法不誤但己㸃正切處難真今别立法求己㸃法曰自丁㸃作垂線分半圓于戊以戊為心用丙為界作丙己庚丑甲全員全員與象限相割于己從己向甲作直線割半員于辛乃作辛丙為句即辛甲為股合問如此則徑得辛㸃不用屢試得數既易且真確矣論曰凡平員内作兩通弦至員徑兩端必為句股而員徑常為弦今既以丙甲弦為半員徑則其辛丙與辛甲兩通弦必句與股也而己辛甲線與乙甲等即句股和也今以辛為心作小員而其邊正切己則己辛與丙辛等為小員之半徑即等為句線矣於己甲句股和内截己辛為句則辛甲必為股故此法不誤也又論曰半員内所容句股形以半方形為最大即甲戊丙也其餘皆半長方形之句股故小其句股和亦最大丙戊句甲戊股相等其和甲戊庚為最大其餘股長者句反甚小故其和皆小于甲戊庚即弦上方幂之斜徑也甲未庚丙為弦上平方幂甲戊庚為其斜徑以此為象限之半徑如辰庚亥象限其半徑辰甲及亥甲並與庚戊甲等則能容弦上平方如甲未庚丙平方必在辰庚亥象限内又戊心所作平方外切之平圓亦能容弦上平方此員以戊為心以平方四角為界其全徑甲戊庚即平方之斜徑也三者相切于庚㸃惟相切不相割其餘句股和並小如乙甲和必小于辰丙不能包平方之角即不能外切平員而與之相割矣如乙甲和為半徑作乙己卯象限不能包庚㸃即與平員相割如己其自庚至丙並可為相割之己㸃而四十五度之句股具焉八線表所列之句股只四十五度互相為正餘句為正弦股即餘弦也分言正弦則初度小而九十度最大也若合正弦餘弦為和數則初度與九十度皆最小惟四十五度最大己足以盡句股之變態矣若過庚向末亦四十五度己㸃至此餘其和數反小而與前四十五度為正句股和之最大者以略小於弦上斜線而止凡句股有和有較皆長方形之半非正半方也若半方形則有和無較可無用算非句股所設其最小者以稍大于弦線而止若同弦線即無句股無有不割平圓故可以己㸃取之也又論曰以方斜為半徑作象限則能容平方以方斜為半徑作半圓則能容方斜上平圓如庚己丙甲未平圓其徑甲戊庚方斜是即方斜上之平圓也若以甲戊庚半徑作大半圓即能容之凡半圓内所容之圓度每以兩度當外周半圓之一度何則論度必以角惟在心之角一度為一度若在邊之角則兩度為一度如辰庚亥半圓從甲心出兩線一至庚一至辰作辰甲庚角其度辰庚四十五度是一度為一度也若庚己丙甲未圓從甲邊出兩線一遇戊至庚一至丙作庚甲丙角其度庚己丙象限只作四十五度是兩度當一度以同用甲角故也凖此論之則弦上半圓所作之戊甲丙角亦必四十五度矣既同用甲角則戊辛丙象限亦兩度當一度若是則庚己丙之度與戊辛丙等並同用甲角以庚辰為度故也而己㸃所割之己丙弧及辛丙弧亦必等度矣己丙為方外切員之度辛丙為方内切員之度大小不同而同用甲角以己乙為其度角等者度亦等又引辛丙至寅則寅丑甲與辛戊甲兩弧亦必等度以同用丙角故也而同為甲角之餘丙角原為甲角之餘乃甲角減象限是以己甲乙減象限得己甲卯角與辛丙甲角等也其度則兩度為一度乃甲角之倍度減半周是以寅庚減半周得寅丑甲以丙辛弧減半周得辛戊甲也又己庚丑未弧原為己丙減半周之餘即與寅丑甲等於此兩弧内各減寅丑未則己庚寅與未癸甲亦等於是作己寅線與未甲等亦即與丙甲等而寅己丙與甲丙己又等于寅己及甲己各加一己丙則丙辛寅及己辛甲兩直線亦等皆句股和也兩和線相交於辛則交角等皆十字正角又作己丙線成己辛丙三角形而己角丙角等己甲丙三角形與己寅丙等則對丙甲之己角對己寅之丙角亦等則角所對己辛邊丙辛邊亦等矣凖上論己辛與丙辛必等故用己㸃以求辛㸃而和數中句股可分也又論曰凡句股和所作象限與斜方上平員相割有二㸃其一為己其一為丑自丑作直線至甲心象限心也割半員於壬作丙壬線即成丙壬甲句股形與甲辛丙等丑甲丙角為丙甲壬角之餘與壬丙甲角等而其度丑卯與己乙等是丙甲辛角與壬丙甲等也辛壬又皆正角又同以丙甲為弦是兩句股形等也凖此論之凡半員内所作句股皆兩兩相似句股之正角必負員周亦兩兩相對如辛㸃在戊丙象限内即有壬㸃在戊甲象限與之相對皆與象限上己㸃丑㸃相應其所作句股形亦兩相似故四十五度能盡句股之變也戊丙與戊甲兩象限並兩度當一度其真度在庚辰及庚亥兩半象限中故皆四十五度試以壬為心丑為界作員界必過丙是丙壬股即丑壬而丑甲為和也丑壬股大于戊丙而丑甲和小于庚甲以是知和數之大至庚甲而極也凖上論又足以證己庚丑癸員能盡割員句股之理句股和較弦與句股較相和即弦較和加句即股弦和减股即句弦較内减弦存句股較相較即弦較較减句即股弦較加股即句弦和用减弦存句股較弦與句股和相和即弦和和减弦即句股和减股即句弦和减句即股弦和相較即弦和較加句弦較即股加股弦較即句加句弦較股弦較即弦弦與句弦較相和加句即兩弦减句即兩句弦較减弦即句弦較相較即句句與