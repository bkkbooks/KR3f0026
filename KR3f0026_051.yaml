front:
  text: 方程論發凡一方程立法之始
  hash: sha256:b54e8061adb770499f72d7fac42e7acb0fda12897d811ed3c3d8293f5b38e4d1
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3f0026_WYG_051-1a, image: WYG0794/WYG0794-0868a.png}
body:
  text: 按周禮九數一曰方田以御田疇界域一曰粟米一作粟布以御交質變易一曰差分一名衰分以御貴賤廩稅一曰少廣以御羃積方程一曰商功以御功程積實一曰均輸以御逺近勞費一曰盈朒一云贏不足以御隱雜互見一曰方程以御錯糅正負一曰句股一云旁要以御髙深廣逺是則方程者九數之一乃九章中之第八章也通雅以九數為周公之法蓋自隸首作算數以來有九章即有方程淵源逺矣一方程命名之義方者比方也程者法程也程課也數有難知者据現在之數以比方而程課者則不可知而可知即互乘減併之用一方程殘缺之故按七十子身通六藝則九數在其中自漢以後史稱卓茂劉歆馬融鄭𤣥何休張衡皆明算術唐宋取士有明算科六典算學十經博士弟子五年而學成宋大儒若邵康節司馬文正朱文公蔡西山元則許文正王文肅莫不精算然則算學之疏乃近代耳夫數學一也分之則有度有數度者量法數者算術是兩者皆由淺入深是故量法最淺者方田稍進為少廣為商功而極于句股算術最淺者粟布稍進為衰分為均輸為盈朒而極于方程詳見末卷方程能御雜法方程于算術猶句股之于量法皆其最精之事不易明也而算學無關進取皆視為賈人胥史之事而不屑從事又其用近小但于方田粟布取之亦無不足故近代諸刻多不具九章其列九章者不過寥寥備數學者雖欲推明古法孰從而求之此方程殘缺之由也一方程謬誤之故方程句股皆不為近用所需然句股測望自昔恆有専書近者西學驟興其言句股尤備故九章所載雖簡而不至大謬至若方程别無専書可證所存諸例又為俗本所亂妄增歌訣立為膠固之法印定後賢耳目而方程不復可用竟如贅疣周官九數幾缺其一愚不自揆輒以管窺之見反覆推論以明之務求其理衆曉而不疑于用庶不致謬種流傳以亂古法云爾詳第四卷刋誤一方程條件與舊不同之故舊傳方程分二色為一法三色為一法四色五色以上為一法頭緒紛然而和較之分疑未清法無畫一所立假如僅可施之本例不可移之他處然如此則為無用之法而方程一章為徒設矣竊以古人立法决不如此今按方程有和有較有兼用和較有和較交變約法四端巳盡方程之用不論二色三色四色五色乃至多色其法盡同正不必每色立法反滋紛擾也然惟如此則有定法而方程為有用且其用甚多竊以古人立法必當如此夫古人往矣愚生千載之下蓬户山居耳目局隘不能盡見古人之書亦何以斷其然哉夫亦惟是反之心而無疑措之事而可用則此心此理之同庶可共信非敢好為新奇以自炫也天下大矣鄴架藏書豈無足考尚冀博雅好古君子惠示古本庶有以證明其說而廣其所未知則所深望巳詳見第一卷及第四卷刋誤一方程以論名篇之故算學書有例無論則不知作法根原一再傳而多誤蓋由于此本書欲明算理故論多于例每卷之首皆有總論以為之提網然後舉例以實其說即假如也而例中或有疑似之端仍各有說以反覆申明之令覽者徹底澄清無纎毫之凝滯凡為論者十之七而例居其三以論名篇著其實也一方程例有詳略可以互明既欲推明其理則無取夸多故首卷和較雜變四端不過數例意在假此例以發吾論但求大義曉暢更不繁引多例以亂人思其後數卷舉例稍繁然每設一例即明一義務求委曲盡變庶令用者不疑前詳者後必略前略者後乃詳更無重復細觀自見一方程著論校刻緣起鼎性耽苦思書之難讀者恆廢寢食以求之必得其解乃巳有未能通則耿耿胸中雖厯嵗時未敢忘也算數諸書尤性所嗜雖隻字片言亦不敢忽必一一求其所以然了然于心而後快竊以方程算術古人既特立一章于諸章之後必有精理而中西各書所載皆未能慊然于懷疑之殆將二紀嵗壬子拙荆見背閍户養痾子以燕偶有所問忽觸胸中之意連類旁通若干門之乍啓亟取楮墨次第録之得書六卷于是二十年之疑渙然冰釋然後知古人立法之精深必非後世所能易書雖殘缺全理具存苟能精思必將我告管敬仲之言不余欺也論成後冀得古書為徵而不可得不敢出以示人惟亡友溫陵黃俞邰太史桐城方位伯廣文豫章王若先明府金陵蔡璣先上舍曾鈔副墨而崑山徐揚貢明府檇李曹秋嶽侍郎姚江黃黎洲徵君頗加鍳賞厥後吳江潘稼堂太史尤深擊節嵗丁卯薄逰錢塘同里阮于嶽鴻臚付資授梓屬以理裝北上未遂殺青續遇無錫顧景范北直劉繼莊二隱君嘉禾徐敬可先輩朱竹垞供奉淮南閻百詩寧波萬季野兩徵士于京師並蒙印可又得中州孔林宗學博杜端甫孝亷錢塘袁惠子文學共相質正乃重加繕録以為定本謬辱安溪李大中丞厚菴先生下詢厯算命之論撰以質同人獲與介弟安卿孝亷晨夕酬對承其謬賞兹編録副以歸手挍欹劂視余稿本倍覺清明嚮使湖上匆劇雕版反不能如是之精良矣感書成之非偶驚嵗月之易流而良朋好我之殷受益宏多更僕難數爰兹略紀以志不忘
