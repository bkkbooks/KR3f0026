body:
  text: 厯算全書卷三十四宣城梅文鼎撰筆算卷一列位法數始於一究於九畢於十十則又復為一矣等而上之為百為千為萬乃至兆億皆得名之為一即皆得名之為二三四五六七八九故必先稽其位而列之併減乘除以此為基非是則算無可施矣法具如後以一位言之有自一至九之名此如同輩之有長幼合上下之位言之有單十百千萬之等此如己身而上有高曽祖父己身而下又有子孫雲仍故單以下復有畸零之位也列位式萬千百十零此姑以五位為式位有多寡皆以零數為根零亦曰單假如有數二萬四千七百五十九依法列之二四七五九凡列數以最下小數為單單上有一位共二位即是十數有三位是百有四位是千有五位是萬不必更書十百千萬等字但稽其有若干位即得之矣又如有數四千九十六依法列之四九六凡數大小相乘中有空者必作以存其位如此式有千有十有單而無百故於百作以存其位又如有數一萬八百一八凡數以單位為根今此數無千無十而並無單故必補作三以成五位則知首位是一萬矣又如有數一十二萬九千六百一二九六原數四位無空然無十無單故必補作兩空以成六位則知首位為十萬畸零列位式凡整數自單而升若畸零數則自單而析故單位者數之根也然整數之升以十為等自單而十而百而千而萬皆一法也萬以上有以十萬為億十億為兆十兆為京自此而垓而秭壤溝澗正載皆以十而變謂之小數有以萬萬為億億億為兆兆兆為京以上盡然皆以自乘而變謂之大數今所用者以萬萬為億萬億為兆萬兆為京以上盡然皆以萬而變謂之中數三者不同然其列位皆以十為等故曰一法也若畸零之式其故多端約而言之亦只二法其一以十為等其一不以十為等而各以其所立之率為等是二法者又各分二類列之各有其法詳後其一以十為等分二類假如錢糧料則每田一畝該五分九釐八毫六絲七忽九微三纎四沙八塵九埃二渺一漠依法列之五九八六七九三四八九二一兩錢分釐毫絲忽微纎沙塵埃渺漠右式今所通用自兩而下以十之一為錢又以錢十之一為分分十之一為釐如是遞析為毫為絲忽以至渺漠皆以十為等原科則自分起以至渺漠計十二位今加兩為十四位者乃列位之法也何也分之上有錢錢之上有兩兩為單數凡列畸零之數必以單數為根始便合總故兩數雖空必存其位也凡度法以丈為單數則其十之一為尺又十析之為寸為分為釐毫絲忽之屬亦有以尺為單以寸為單者皆如所設凡量法以石為單數則其十之一為斗又十析之為升為合為勺之屬亦有以斗為單數者皆如所設命之法並同上右法以十為等即以一位為一名如上位是兩下一位即是錢此為一類假如授時厯法每一平朔二十九日五十三刻零五分九十三秒依法列之右式日為單數而以日百析之為刻又百析之為分又百析之為秒故列位時必作點以志之使知日下二位始為單刻由是而分而秒皆隔兩位而變其名然仍是以十為等凡作點必單位如日為單位下又有單刻單分單秒之屬凡開平方尺有百寸寸有百分其法同上凡開立方尺有千寸寸有千分則三位而變即隔三位作點以志之法亦同上右法雖亦皆以十為等而不以一位為一名或隔兩位或隔三位前法只尋單位即知其餘此法單位之下仍須各尋單位蓋前法之分秒只有單而此法分秒各有十有百故必以作點之處知其為單分單秒是與前法微别又為一類也其一不以十為等而各以其所設之率為等亦分二類假如回回厯法以六十分為一度六十秒為一分太陽三十日平行二十九度三十四分一十秒作何排列右以度為單數下兩位為分又下兩位為秒故作點志之略同授時然皆以六十而進非以百也其自秒以下為微纎等數凡在授時以百為數者回回之法皆以六十為之是雖不以十為等而所設六十之率巨細同法西洋法亦然又如古量有以四升為豆四豆為區四區為釜皆以四為率又如楊子雲太玄以三方統九州二十七部八十一家其遞析也皆以三又如測量家以矩度分十二度每一度又分十二分是又以十二為率也右諸率皆不用十而所用之率屢析不易是為一類假如物重十六兩為一斤二十四銖為一兩今有物二斤四兩半作何排列此以斤為單數斤下二位為兩又下二位為銖銖與兩皆斤之分秒也故作點志之亦同前法但銖以二十四為率兩以十六為率二率不同又如厯家以甲子六十為旬周每日十二時又分初正西厯謂之二十四小時每各四刻每刻有十五分今依新法算得辛未年冬至為旬周之第五十日二十二時二刻七分依法列之此以日為單數下二位析日為時又下一位析時為刻又下兩位析刻為分皆日下之畸零也然時之率二十時刻之率四分之率十五各率不同所當細玩右法既不以十為等而所用之率又不齊同是又一類也此二類不以十分為率而各有其率即通分子母之法也但通分以子母並列又是一法别卷詳之併法凡數合總法當用併有諸數於此併而合之為一總數又名垜積即珠盤之上法也數相併則相益而多故亦名加法在錢穀之用則所以稽總撒法曰置所有散數幾宗各依列位法自上而下對位列之萬千百十單各以類從列訖仍併之自上而下如畫卦之法數滿十者進位作號而本位紀其零紀號式丨丅此古算位也用以别原數便稽核也假如有絲八百九十二斤又一千八十八斤又三百五十斤若合之干如上式散數三宗依法列位併之得總數二千三百三十斤假如有絹四丈五尺六寸又五丈三寸又八丈五尺合之若干九減試法凡九減之法不論單十百千之位亦不計位只摢現有之數而合計之先減減數首行八九二合得十九減去二九餘一以合次行一八八共得十八減去二九恰盡只餘三行三五合成八數紀於右八紀於左次減總數二三三合得左右相同知其不誤第二圖先減散數首行四五成九減去餘六合次行三成九減去餘五合三行八五共十八成二九減盡紀於右同次以總數一八九成二九減盡紀於左也左右相知其無誤或問九減不計上下之位何曰此捷法也凡九減者數不變假如以九減一十則仍餘一減二十則仍餘二推之百千萬亦然故不論位七減試法凡七減與九減不同須論位減實數十第一圖先減散數自上而下頭一排只有一作一算合第二排八三得十一共二十一以七減之盡第三排九八五合得二十二以七減之餘一作一十合第四排八二得十共得二十以七減之餘六紀於右二次減總數亦自上起首位無七有二合第二位作十三以七減之餘二又合第三位作二十三以七減之餘二合誤末位作二十減二七餘六紀於左左右相同不第二圖先減散數頭一排四五八合十七以七減之餘三作三十合第一排兩個五成十共四十以七減之餘五作五十合下六三成九共五十九以七減之餘三紀右次減總數首兩位十八以七減之餘四合第三位作四十以七減之餘五作五十合下位九共五十九以七減之餘三紀左左右相同不誤畸零併法假如有物十斤四兩十二銖又九斤十一兩十二銖共若干答曰二十斤銖數併得草四成一兩進位併原數共十六兩成斤進位併原數十九斤共草斤四兩率十六不同故以點隔銖率草之率不同難用九減七減只以減法凡還原其法於總數內減原散數一宗其餘一宗必合減餘是為無誤減法見後詳通分假如品官計俸原厯任過三年九個月今又歷任一年十一個月共若干答曰共歷任五年八個月先併月得二十再以十二個月成一年進位紀號餘八個月次併一年三年加所進一年共五年併得五年八個月此因月法十二非以滿十而進故以點隔之非滿十而進不用九減七減只以此亦減法還原遞加法假如授時厯歲實三百六十五日二十四刻二十五分兩次加氣策一十五日二十一刻八十四分三十七秒五十微共若干答曰三百九十五日六十七刻九十三分七十五秒此遞併法借前總數當散數用之如此則可以層纍而加前條三百八十日四十六刻竒是從嵗前冬至算至本年小寒此條三百九十五日六十八刻弱是又算至本年大寒截小總法凡併法頭項太多者截分小總則易清乃垜積之捷法假如河工一十二宗一工五千十四工又三千三百工又八百九十一工又二千九十工又九百九工又一千八十工又二千二十工又九十一工又六百六十七工又四千七百工又七百三十工又八十二工問共數答曰二萬一千五百七十四工法曰先以河工十二宗任分為三段依法併之各成小總再合各小總依法併之為一大總合問或有極多至百十宗者宜多分小總小總又併為小總末乃併為一大總變繁為簡最便覆核減法凡數相較法當用減有兩數於此以相減則得其大小之較也有全數於此減其所去則得其留餘之數也在錢穀之用則減為開除減餘為實在若收受則所減為已完減餘為未完其法與併法正相對其用亦相需也法曰置原數於右置減數於左依列位法自上而下對位列之若兩數相較則以大數列右以當原數小數列左為減數乃以兩數相較以少減多原數必多減數必少若原數反少則有轉減減訖列減餘之數於左行凡減自下小數起本位無可減借上位一數化十而減之則於上位作點以為志還原時即用此點為進位之志或不用點用短直亦同假如有庫銀十萬兩支放過五萬九千五百三兩問存庫若干答曰四萬四百九十七兩此因數萬以下俱空故皆用借十作點之法自最下兩位起兩位空作點於上位借十兩減三存七支數原無十兩因借減之點宜減十兩而十兩亦空復作點於上位借一百內減一十存九十支數五百加借點共六百亦作點借一千減六百存四百萬支數九千湊借點成一萬作點於萬位湊原支五共六萬又作點於首位借十萬減六萬存四萬還原用併法即借用本圖從兩位起以支放三兩併存留七兩得十兩作點於十兩位湊存留九十兩成一百兩又作點於百位湊支放五百存留四百併得一千作點於千位湊支放九千成一萬作點於萬位湊支放五萬存留四萬共成十萬作點於首位至此存留支放俱無可輳淨十萬兩作一十萬字於原銀位合總無差遞減法假如有應進貢貂皮一千五百張收過九百五張次年補收四百九十五張仍欠若干答曰一百張以頭一次九百五張依法減原額一千五百張得減餘五百九十五張為欠數十五張減欠次以補收四百九數五百九十五張得減餘一百張為仍欠數因兩次遞減亦減兩次試之九減六七減二先以原額減餘數列右合收欠減餘數列左試法一試法次以欠數取減餘列右合續收仍欠減餘列左還原倒用前圖以仍欠一百併續收四百九十五得五百九十五合前欠數又以欠五百九十五併先收九百五得一千五百合原額凡遞減者亦以遞併還原透支轉減法假如有錢一萬五千三十文陸續支用過一萬六千五十文該有透支若干答曰淨多支一千二十文此因支數多於原數故以原數轉減支數而得透支之數凡兩數相較多寡皆倣此還原以多支一千二十併原錢一萬五千三十得一萬六千五十合支用數畸零減法假如有地丁銀三千五百零三兩徴完三千二百一十兩零三錢五分仍未完若干答曰二百九十二兩六錢五分還原以已完未完相併得數合額編之數此原數至兩而止因減而有錢與分之數蓋以兩為單數其錢為兩十之一分又為錢十之一皆畸零也假如授時厯每月二節氣共三十日四十三刻六十八分七十五秒經朔二十九日五十三刻五分九十三秒兩數不同是生月閏該若干答曰月閏九十刻六十二分八十二秒太陽節氣此經朔減節氣也太陰經朔經朔小節氣大相減月閏之較是為月閏還原以月閏併經朔得總即仍合節氣之數假如品官計俸以三年為滿今厯任過一年零七箇月該補若干答曰該補一年零五箇月此以十二個月為一年故減法不同先減七個月月位無可減作點於年位借一年為十二月減七存五次減一年併所借一點共二年以減三年餘一年還原以己厯一年七箇月補俸一年五箇月相併得三年合總假如有海濵田一百三十一頃四十畝被潮坍損二頃八十五畝一百五十九步仍餘若干答曰仍存田一百二十八頃五十四畝八十一步解曰此以百畝成頃二百四十步為畝故列位時須作點别之而減法亦同先減一百五十九步原數無步作點於畝位借一畝為二百四十步紀號於原位乃如法減之仍存一二五八還原以坍損田及仍存田相併得原田數合總右二式畸零之率不同難用九減七減只以併法還原餘詳通分錢糧四柱法四柱者舊管新收開除實在也各衙門造册必歸四柱則收放可稽在筆算為減併合用蓋舊管新收用併法開除用減法其實在則減餘也亦有減盡無餘者則無實在即於實在項下直注曰無其事件創立前無所承者則無舊管亦有存留不動之項則有舊管而無新收其法並同如無舊管則注曰舊管無或無新收則亦曰新收無若所出浮於所入則為透支當用轉減之法也開除本用以減今反將併舊管新收以減開除故曰轉減凡轉減者亦當於實在項下注明如云實在無外多支若干是也式如後假如藩庫原存地丁銀一十二萬三百三兩今於康熙三十年徵收一百四十一萬五十五兩六錢節次支放過一百二十二萬二千五兩六錢問該存留若干答曰三十萬八千三百五十三兩先用併法得舊管新收共一百五十三萬三百五十八兩六錢再用減法於共數內減去開除一百草二萬二千五兩六錢得實在存留三十萬八千三百五十三兩四以舊管新收共數與開除實在併數各依試法四左右列減餘相同知其不誤九減七減並餘四可省一圖假如倉內原存米四千四百石新收某處解到米五百三石麥三千六百石奉文支放兵米五千石問實在若干答曰米支放訖仍缺額九十七石麥實在三千六百石存倉麥法以舊管新收共米舊管無四千九百三石轉新收三六減開除五千石得缺開除無項九十七石實在三六試法合舊管新收加入缺項而九減七減之紀餘於右又單用開除一項九減七減紀餘於左以左右相同知其無誤凡轉減者倣此試之假如某鎮軍餉原存二千一百三兩支放過正月分口糧折銀一千八百九兩續於二月有某處解到協濟銀三千五百兩於四月內發過草料銀八百九十二兩又製造盔甲銀用過九百九十九兩五錢續準某軍門公文發到餉銀一千九十兩問今庫內現存若干答曰仍存二千九百九十二兩五錢以上先用併法變六宗為兩宗然後相減若依四柱法則當以協濟三千五百兩院發一千九十兩另併為新收四千五百九十兩九六七三試試並試舊新收併為右法以管一宗而九減之紀餘於右以開除實在併為一宗而九減之紀餘於左不同者開除實七減亦然所在減至錢數則舊管新收亦必減至錢位止然後左右相較可以無誤此七減之要訣所當熟玩淮倉銷算邸抄附録為式户部題為差委司屬官員事查得淮倉監督將任內自康熙草九年九月初六日起至三十年八月初七日止收放錢糧數目造册具題前來查册開舊管銀三萬八千一百一兩五錢三分零米麥四萬五千一百六十九石九斗三升零新收銀一萬二千一百四十八兩九錢九分零米麥一萬七千三百六十九石二斗六升零又收過商稅等銀三萬一千六十四兩八錢六分零內相符準銷銀一萬八千三百一十五兩一錢五分零米麥一千一百一十九石八斗四升零行查催解銀三萬五百五十四兩八錢零米麥一萬三千二百五十石八斗二升零存剩銀三萬二千四百四十五兩四錢三分零米麥四萬八千一百六十八石五斗三升零將解支欵項開後一解部銀一萬七千六百二兩三錢五分零米一百三石每石九錢折銀九十二兩七錢麥一千一十六石八斗四升零每石五錢折銀五百八兩四錢二分零等語查前項銀兩已經解到收訖無庸議一給門軍口糧銀七百一十二兩八錢等語查係應給之項無庸議一解河工銀五千八百一十三兩二錢六分零查未開解交年月日期應令開明報部之日查核一給淮安等衛草九年分行糧銀五千三百兩三錢二分零米麥一萬三千二百五十石八斗二升零月糧銀一萬四千七百三十二兩九錢查總漕未奏銷應俟奏銷到日查核一解淮安府銀四千七百八兩三錢二分零查草八九兩年解府銀兩尚未動支今何得又行起解應令作速解部一存剩銀三萬二千四百四十五兩四錢三分零米麥四萬八千一百六十八石五斗三升零應將此解部米麥存倉備用又收過房田稅契銀四百二兩六分六釐零查前項銀兩已經解到收訖無庸議者奉旨依議今以四柱法核之如後桉此即原題四柱册也舊管者即四柱之舊管也新收及商稅皆新收也準銷即開除存剩即實在其行查催解銀則四柱中原作開作而部不準銷改入實在之數也法以準銷查催共數與舊管新收共數相減即得存剩細帳仍原數不動以上並依法合總無訛外有房田稅契銀另項附銷不在四柱之內厯算全書卷三十四
