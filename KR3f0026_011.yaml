body:
  text: 厯算全書卷十一宣城梅文鼎撰環中黍尺卷五之六加減捷法用加減則乘除省矣今惟用初數則次數亦省又專求矢度省餘弦則角之鋭鈍得矢自知邊之大小加較即顯無諸擬議之煩故稱捷法如法角旁兩弧度相加為總相減為存視總弧過象限以總存兩餘弦相加不過象限則相減並折半為初數若總弧過兩象限與過象限法同其餘弦仍相加過三象限與在象限內同其餘弦仍相減若存弧亦過象限則反其加減總弧過象限或過半周宜相加今反以相減若總弧過于三象限宜相減今反以相加並以兩餘弦同在一半徑相減不然則加也總存兩餘弦同在一半徑當相減折半圖乙丁丙三角形丁為鈍角丙卯為總弧其正弦卯戊餘弦戊己庚丙為存弧其正弦庚壬餘弦壬巳兩餘弦同在丙已半徑宜相減壬巳餘弦內減戊巳成戊壬折半為初數丑壬即甲庚亦即未酉總存兩餘弦分在兩半徑當相加折半圖乙丁丙形丁為鋭角庚丙為總弧其正弧庚壬餘弦壬巳卯丙為存弧其正弦卯戊餘弦戊已徑兩餘弦分在丙巳子巳兩半徑宜相加以戊巳加壬巳成壬戊折半為初數丑戊即甲酉亦即未卯三邊求角初數恆為法以兩矢較乘半徑為實法為初數與兩矢較若半徑與角之矢也一初數即角旁兩正弦相乘半徑除之之數今以加減得之二兩矢較或兩俱正矢或兩俱大矢或存弧用正矢對弧用大矢三半徑四角之矢正矢角鋭大矢角鈍角求對邊則以初數乘角之矢為實半徑為法法為半徑與角之矢若初數與兩矢較也一半徑二角之矢或正矢或大矢三初數四兩矢較並以較加存弧矢為對弧矢加滿半徑以上為大矢其對弧大不滿半徑為正矢其對弧小乙丁丙形三邊求丁角小邊乙丁正弦卯辛大邊丙丁正弦壬丙初數卯癸兩正弦相乘半徑除之也今改用加減兩餘弦相減餘房戊折半得丑戊即初數卯癸與先所得同一系總弧過半周而存弧亦過象限則餘弦相減法為卯癸初數與兩矢較牛乙若卯辛正弦距等半徑與乙庚距等大矢亦即若寅巳半徑與角之大矢酉子一初數卯癸即丑戊二兩矢較牛乙即房甲三半徑寅巳四角之大矢酉子若先有丁鈍角而求乙丙對邊則反用其率一半徑寅巳二角之大矢酉子三初數卯癸四兩矢較牛乙以所得兩矢較加存弧大矢房丙得大矢甲丙乙丁丙形三邊求丁角小邊乙丁正弦乙辛大邊丙丁正弦戊壬初數戊癸今用加減兩餘弦相減餘辰甲折半得辰丑即初數戊癸對弧乙丙大矢斗乙存弧大矢甲乙兩矢較斗甲法為初數戊癸與兩矢較斗甲若戊壬正弦距等半徑與丙庚距等大矢亦即若寅巳半徑與角之大矢酉子一初數戊癸即丑甲二兩矢較斗甲三半徑寅巳四角之大矢酉子論曰此移小邊于外周如法求之所得並同其故何也先有之角及角旁二邊並同則諸數悉同矣然則句股之形不同何也曰前圖是用乙丁小弧之正弦為徑分大矢之比例則所用句股是丁丙大弧之正弦此圖是用丁丙大弧正弦為徑分大矢比例則所用句股是乙丁小弧正弦故句股形異也然句股形既異而所得初數何以復同曰此三率之精意也初數原為兩正弦相乘半徑除之之數前圖用大弧正弦偕半徑為句與弦而小弧正弦用為大矢分徑之比例是以大弧正弦為二率而小弧正弦為三率也今改用小弧弦為二率大弧弦為三率而首率之半徑不變則四率所得之初數亦不變也又何疑焉一系角旁二弧可任以一弧之正弦為全徑上分大小矢之比例其餘一弧之正弦即用為句股比例不拘大小同異其所得初數並同又論曰以句股比例言之則戊庚通弦為弦即距等圈全徑戊女倍初數為句即總存兩餘弦相加減之數一也戊壬正弦為弦則戊癸初數為句二也丙庚為弦通弦之大分即距等大矢則斗甲兩矢較為句即丙房三也丙壬為弦正弦之分線即距等餘弦則斗丑為句對弧餘弦內減次數丑巳得斗丑亦即丙牛四也戊丙為弦正弦之分線即距等小矢則午戊為句五也以全與分之比例言之則戊庚為距等全徑與寅子全徑相當一也戊壬正弦為距等半徑當寅巳半徑二也丙庚如距等大矢當酉子大矢三也丙壬如距等餘弦當酉巳餘弦四也戊丙如距等小矢當寅酉正矢五也一系初數恆與角旁一弧之正弦為句股比例其正弦恆為弦初數恆為句而其全與分之比例俱等又即與員半徑上全與分之比例俱等若倍初數即與全員徑上大小矢之比例等一系角旁兩弧任以一弧之正弦為徑上全與分之比例初數皆能與之等若先有丁鈍角求對邊乙丙則更其率一半徑巳子二丁角大矢酉子三初數丑甲四兩矢較斗甲以四率斗甲加存弧大矢乙甲成斗乙為對弧大矢內減巳乙半徑得斗巳為對弧餘弦撿表得未丙弧度以減半周得對弧丙乙度乙丁丙形三邊求丁角乙丁邊九十五度丁丙邊一百一十二度乙丙對弧一百一十九度總弧丙未二百七度餘弦辛巳八九一一存弧丙戊一十七度餘弦壬巳九五六三兩餘弦相加辛壬一八四七三一初數卯亥即半辛壬丑辛九二三六五對弧大矢癸丙一四八四八一存弧正矢壬丙四三七兩矢較癸壬一四四一一一法曰卯亥即丑辛與癸壬若未亥與乙戊亦必若庚巳與甲子一初數卯亥九二三六五二兩矢較癸壬一四四一一一三半徑庚巳一四角之矢申子一五六二二四率大于半徑為大矢其角鈍法當以半徑一減之餘五六二二為鈍角餘弦撿表得餘弦度五十五度五十六分以減半周為丁角度依法求到丁鈍角一百二十四度四分論曰試作辰戊線與倍初數辛壬平行而等又引未辛總弧正弦至辰成未辰戊句股形又引牛乙癸對弧正弦至寅作亥丑線引至斗各成句股形而相似則其比例等一未辰戊大句股以辰戊倍初數為句未戊通弦為弦一乙寅戊次句股以寅戊兩矢較為句乙戊距等大矢為弦一未卯亥亥斗戊兩小句股並以卯亥斗戊初數為句未亥亥戊正弦為弦辰戊倍初數與寅戊兩矢較若未戊通弦與乙戊距等大矢是以大句股比小句股也卯亥初數與癸壬兩矢較若未亥正弦與乙戊距等大矢是以小句股比大句股也用亥斗戊形比乙寅戊其理更著又未戊通弦上全與分之比例原與全員徑上全與分之比例等故三者之比例可通為一也一大句股截數種小句股故又為全與分之比例仍用全圖取乙丁女形求丁鋭角乙丁邊九十五度女丁邊六十八度女乙對弧六十一度總弧女戊一百六十三度餘弦壬巳九五六三存弧女未二十七度餘弦辛巳八九一一兩餘弦并辛壬一八四七三一初數卯亥九二三五六一初數卯亥九二三六五二兩矢較癸辛四六二三半徑巳庚一四角之矢申庚四三九七七以減半徑得丁角餘弦入表得丁角度依法求得丁鋭角五十五度五十六分辛丁乙形三邊求丁角辛丁邊五十度一十分乙丁邊六十總弧卯辛一百一十度一十分餘弦庚丙二四四七五存弧戊辛九度五十分餘弦子丙九八五三一餘弦并子庚一三三六初數子午即戊癸六六五三辛乙對弧八十度對弧矢辛酉八二六三五存弧矢辛子一四六九兩矢較子酉八一一六六一初數子午六六五三二兩矢較子酉八一一六六三半徑壬丙一四丁角大矢壬甲一二二五用餘弦入表得丁外角減半周得丁角度依法求到丁鈍角一百二度四十四分論曰此如以日髙度求其地平上所加方位也乙為太陽乙甲其髙度其餘度丁乙日距天頂也亥乙赤道北緯辛乙為距緯之餘即去極緯度也辛壬為極出地度其餘辛丁極距天頂也所求丁鈍角百二度太距正北壬之度外角七十七度少距正南巳之度也算得太陽在正東方過正卯位一十二度太乙丙辛形有辛丙三十三度辛乙百卅二度對弧乙丙百度八求辛角總弧丙壬一百六十五度餘弦己戊九六五九三存弧丙庚九十九度餘弦己甲一五六四三兩餘弦相減餘戊甲八九五初數甲丑四四七五對弧大矢酉丙一三九二存弧大矢甲丙一一五六四三兩矢較甲酉一五二五九一初數甲丑四四七五二兩矢較甲酉一五二五九三半徑申巳一四角之矢未申三五三五二得辛鋭角四十九度二十八分恆星歲差算例老人星黃道鶉首宫九度三十五分二十七秒為庚角康熙甲申年距厯元戊辰七十七算每年星行五十一秒訃行一度五分二十七秒以加戊辰年經度鶉首八度三十分得今數黃道南緯七十五度距黃極一百六十五度為庚辛邊用巳庚乙三角形一角二邊求對弧巳乙赤緯餘弦較丁甲二六六一初數甲戊一三三庚角正矢申酉一三九八一半徑申丙一大矢內減半徑二庚角矢申酉一三九八取餘弦檢表得三初數甲戊一三三三十八度草三四兩矢較甲丑一四四分半以減半周加存弧大矢巳甲一七八二三四得星距北極一百得對弧大矢巳丑一七八三七八四十一度三十六分半為對弧巳乙求到甲申年老人星赤緯在赤道南五十一度三十六分半以校厯元戊辰年緯五十一度三十三分及儀象志康熙壬子年緯五十一度三十五分可以略見恆星赤緯歲差之理求巳角赤經巳庚角旁弧二十三度三十一分半巳乙角旁弧一百四十一度三十六分半庚乙對弧一百六十五度三邊求角餘弦較子斗四九五七七初數午斗二四七八八對弧大矢庚亥一九六五九三存弧大矢庚斗一四七七六兩矢較亥斗四九五一七一初數午斗二四七八八大矢內減半徑得二兩矢較亥斗四九五一七餘弦檢表得度以三半徑丙氐一減半周得已角度四角大矢亢氐一九九七六一一百七十六度二分置三象限以已角度減之得星距春分九十三度五十八分求到甲申年老人星赤道經度在鶉首宮三度五十八分以校戊辰年赤經九十三度三十九分及儀象志壬子年赤經九十三度五十一分可以見恆星赤經東移之理加減捷法補遺捷法以兩餘弦相加減以兩矢較偹四率其用巳簡然有闕餘弦無可加減闕矢度無可較者雖非恆用而時或遇之亦布算者所當知也一加減變例凡餘弦必小於半徑常法也然或捴弧適足半周則餘弦極大即用半徑為捴弧餘弦法以存弧餘弦加減半徑折半為初數視存弧不過象限則相加存弧過象限則相減又若角旁兩弧同數則無存弧而餘弦反大即用半徑為存弧餘弦法以捴弧餘弦加減半徑折半為初數視捴弦過象限或過半周則相加捴弧在象限內或過三象限則相減以上用半徑為餘弦者六凡加減取初數必用兩餘弦常法也然或總弧適足一象限或三象限或存弧適足一象限皆無餘弦法即用一餘弦折半為初數不須加減總弧無餘弦即單用存弧餘弦存弧無餘弦即單用總弧餘弦又或捴弧適足象限或三象限無餘弦而兩弧又同數準前論即以半徑為存弧餘弦或存弧適足象限無餘弦而總弧又適足半周即以半徑為總弧餘弦二者並以半徑之半為初數不須加減以上無加減者六一兩矢較變例凡兩矢相較常法也然或其弧滿象限則即以半徑為矢對弧滿象限則以半徑為對弧矢與存弧矢相較存弧滿象限亦然亦即以半徑與對弧矢相較捷法視對弧存弧但有一弧滿象限即命其又一弧之餘弦為兩矢較不更求矢對弧滿象限即用存弧餘弦存弧滿象限即用對弧餘弦並即命為兩矢較與上法同凡以矢較加存弧矢成對弧矢正矢則對弧小大矢則對弧大常法也然或有相加後適足半徑者其對弧必適足象限又有四率中無兩矢較者以無存弧矢故也凖前論角旁兩弧同度無存弧則亦無存弧矢之可較法即以對弧矢為用不必更求矢較若角求對邊其所得第四率即對弧矢若三邊求角其所用苐三率亦對弧矢餘詳後例設角旁兩弧同度總弧在象限以內求對角之邊丙乙丁形乙角一百一十度餘弦三四二二乙丙乙丁並三十度兩餘弦相減五丙庚半之為初數二五丙癸一半徑寅已一二初數丙癸二五三乙角大矢寅午一三四二二四對弧矢丙甲三三五五四率本為兩矢較因無存弧矢故即為對弧之矢對弧餘弦甲巳六六四五求到對弧丁丙四十八度二十二分論曰以半徑為存弧餘弦何也弧大者餘弦小弧小者餘弦大今存弧既相減而至于無則小之至也故其餘弦亦大之至而成半徑也四率即為對弧矢何也弧大矢亦大弧小矢亦小既無存弧則亦無矢矣無矢則無可較故四率即對弧矢也然則其比例奈何曰半徑寅已與大矢寅午若正弦子丙與距等大矢丁丙亦即若初數丙癸與對弧矢丙甲若三邊求角則反其率一初數二半徑三對弧矢四乙角矢若捴弧過三象限其法亦同前圖丁丑丙形丑角同乙角其所用四率以得對弧丁丙並同上法若三邊求角則反其率一初數二半徑三對弧矢四丑角矢一系兩邊同度無存弧矢則徑以對弧矢當兩矢較之用設總弧滿半周而較弧亦過象限求對角之邊前圖卯丑丁形丑角七十度餘弦三四二二午已丑丁一百五十度丑卯三十度相減五庚丙初數二五庚癸存弧大矢一五庚卯丑角矢六五七九八午酉一半徑酉巳一二初數丙癸即庚癸二五三丑角矢午酉六五七九八四兩矢較庚甲一六四四九加存弧大矢庚卯一五得對弧大矢甲卯一六六四四九求到對弧卯丁一百三十一度三十八分設三小邊同數求角丙乙丁形三邊並三十度求乙角相減五丙庚初數二五丙癸對弧丁丙三十度餘弦八六六三甲巳矢一三三九七丙甲一初數丙癸二五二半徑寅己一三對弧矢丙甲一三三九七四乙角矢寅午五三五八八餘弦午巳四六四一二求到乙角六十二度二十分丁丙二角同論曰此亦因存弧無矢故以對弧矢為三率也其比例為初數丙癸與對弧矢丙甲若乙丙正弦丙辰與丙丁距等矢則亦若寅巳半徑與乙角矢寅午一系凡三邊等者三角亦等前圖丁丑丙形二大邊同度一小邊為大邊減半周之餘三邊求角其對弧丁丙亦三十度所用四率並同上法所得丑角六十二度二十分亦同乙角惟餘兩角丁丙並一百一十七度四十分皆為丑角減半周之餘若先有角求對邊則反其率又于前圖取丁丑戊形丑丁一百五十度丑戊三十度其對弧戊丁一百五十度為丑戊三十度減半周之餘故所用四率亦同但所得矢度為丑外角之矢當以其度減半周得丑角一百一十七度四十分戊角同丑角丁角六十二度二十分即丑外角一系凡二邊同度其餘一邊又為減半周之餘與三邊同度者同法但知一角即知餘角其一角不同者亦為相同兩角之外角設角旁兩弧同數而捴弧適足一象限求對角之邊子乙丙形乙角一百度餘弦一七三六五初數五丙辛即半徑之半一半徑壬巳一二初數丙辛五三乙角大矢壬丑一一七三六五四對弧矢丙癸五八六八二餘弦癸巳四一三一八求到對弧子丙六十五度三十六分論曰半半徑為初數何也凖前論半徑即存弧餘弦而捴弧無餘弦無可相減故即半之為初數問捴弧何以無餘弦曰弧大者餘弦小捴弧滿象限則大之極也故無餘弦其比例可得言乎曰壬巳與壬丑若丙甲與丙子則亦若丙辛與丙癸若所設為子戊丙形戊角同乙角一百度戊子戊丙同為一百三十五度捴二百七十度滿三象限亦無餘弦亦如上法以半半徑為初數依上四率求到對戊角之子丙弧六十五度三十六分若三邊求角則反其率一初數二半徑三對弧矢四角之矢設角旁兩弧之捴滿半周而存弧亦滿象限求對角之弧用前圖子戊卯形戊角八十度餘弦一七三六五子戊一百三十五度卯戊四十五度餘弦無減半半徑為初數五己辛即庚甲存弧滿象限半徑為正矢一即卯巳半徑一半徑辰巳一二初數己辛五三戊角矢辰丑八二六三五四兩矢較己癸四一三一七即對弧卯子餘弦對弧大矢卯癸一四一三一七以兩矢較加存弧矢得對弧大矢求到對弧卯子一百一十四度二十四分論曰捴弧以半徑為餘弦何也凡過弧大者餘弦大過弧滿半周則大之至也故其餘弦亦最大而即為半徑也然則存弧又能以半徑為矢何也弧大者矢大存弧既滿象限故其矢亦滿半徑矣問兩矢較巳癸即對弧之餘弦也何以又得為兩矢較曰他存弧之矢有大小而不得正為半徑故其與對弧矢相較亦有大小而不得正為餘弦今矢既為半徑較必餘弦矣若三邊求角則反其率一初數巳辛其比例為巳辛與巳癸若丁甲二半徑辰巳與丁子則亦若辰巳與辰丑三兩矢較己癸四戊角矢辰丑設對弧滿象限三邊求角乙丙甲形對弧乙甲九十度無餘弦求丙角相加辰癸一三五六二一初數午癸六七八一對弧滿象限矢即半徑已甲一用捷法即以存弧餘弦癸已為矢較一初數午癸六七八一二半徑巳戊一三矢較巳癸四二二六二即存弧餘弦四丙角矢庚戊六二九四求到丙角六十八度一十四分其比例為初數午癸與餘弦巳癸若正弦壬辛與距等矢乙辛也亦必若半徑己戊與角之矢庚戊若先有丙角求對弧則反其率一半徑戊巳二初數午癸三丙角矢戊庚四兩矢較巳癸以所得四率與存弧矢甲癸五七七三八相加適足半徑成巳甲命對弧乙甲適足九十度捷法視所得四率矢較與存弧餘弦同數即知對弧為象限不必更問存弧之矢設角旁兩弧同數捴弧過象限求對角之弧辛乙丙形乙角七十三度餘弦二九二三七相加折半為初數八二一三九癸丙一半徑己戊一二初數癸丙八二一三九三乙角矢甲戊七七六三四對弧矢丁丙五八一二四餘弦丁巳四一八七六求到對弧辛丙六十五度一十五分若三邊求角則反其率一初數癸丙二半徑巳戊三對弧矢丁丙四乙角矢甲戊設角旁弧同數捴弧過半周其算並同前圖辛丑丙形辛丑丙丑並一百十五度捴弧丙丑壬二百三十度餘弦六四二七九庚巳丑角同乙角其所用四率求對弧及三邊求角並如上法設捴弧滿半周而存弧不過象限求對弧前圖辛乙卯形乙角一百七度餘弦二九二三七甲巳乙卯一百十五度乙辛六十五度相加半之為初數八二一三九癸庚即子辰一半徑寅巳一二初數庚癸八二三一九三乙角大矢寅甲一二九二三七四兩矢較庚丁一六一五三即辛未加存弧正矢庚卯三五七二一得對弧大矢丁卯一四一八七四求到對弧卯辛一百一十四度四十五分加減又法解恆星曆指第四題三率法與加減捷法同理弧三角有一角及角旁二邊求對角之弧法曰以角旁大弧之餘度與小弧相加求其止弦為先得弦次以角旁兩弧相加視其度若適足九十度即半先得弦為次得弦此大弧之餘弧與小弧等若角旁兩弧捴大于象限此大弧之餘弧小于小弧則以大弧之餘弧減小弧而求其弦以加先得弦然後半之為次得弦若兩弧捴不及象限此大弧之餘弧大于小弧則以小弧減大弧之餘弧而求其弦以減先得弦然後半之為次得弦又以角之矢為後得弦以後得弦乘次得弦為實半徑為法除之得數為他弦一率全數二率次得弦即初數三率後得弦即角之矢四率他弦即兩矢較並以他弦與先得弦相減為所求對角弧之餘弦若他弦大于先得弦即以先得弦減他弦不問何弦但以小減大右法不載測量全義而附見厯指人自江南來得小兒以燕家信以此為問謂與環中黍尺有合也乃為摘録以疏其義論曰此亦加減代乘除之一種也加減法以捴弧存弧之餘弦相加減以取初數此則不用存弧而用存弧之餘度以餘度取正弦即存弧之餘弦故也又不正用存弧之餘度而用大弧之餘度以大弧之餘度加小弧即存弧之餘度故也至其加減又不用捴弧而用大弧餘度與小弧相減之較弧以此較弧之正弦即捴弧之餘弦故也取徑迂回而理數吻合非兩法相提並論不足以明其立法之意也舉例如後乙丙丁形有乙角及角旁二邊求對弧丁丙以加減捷法求得諸數與恆星厯指法相參論之乙丙小弧乙丁大弧正弦甲丙辰庚捴存弧戊丙庚丙餘弦壬巳癸巳餘弦并癸壬初數癸甲即辰寅丁丙對弦庚丙存弧正矢卯丙癸丙一半兩矢較卯癸徑酉巳二三角之矢初數酉午即辰寅甲癸四末兩矢較加癸卯癸卯即丁子以卯癸丙得丙為對弧矢乃查其度得對弧丁丙右加減法也今改用恆星厯指之法先以酉庚為角旁大弧乙丁之餘弧乙庚同乙丁大弧度也乙酉同乙午皆象限也乙酉象限內減乙庚猶之乙午內減乙丁也故庚酉即乙丁之餘又以牛酉當角旁小弧乙丙乙酉與牛丙皆象限內減同用之丙酉同乙丙二者相加成牛庚取其正弦戊庚是為先得弦次視角旁兩弧乙丙乙丁之捴丙戊大于象限丙辛法當以大弧餘度去減小弧得較于同小弧之午酉內減同大弧餘度之氐酉其較牛氐與牛房等而取其弦牛氐較與牛房等則氐井弦與房井等而即與危戍等是危戌即牛氐較之弦也以加先得弦以危戍加戌庚成危庚然後半之危庚半之于未成未庚為次得弦又以乙角之矢午酉為後得弦與次得弦未庚相乘為實半徑為法除之得他弦亥庚未以他弦亥庚減先得弦戌庚其餘亥戌為對弧丁丙之餘弦查表得對弧論曰牛庚之正弦戍庚與癸巳平行而等即存弧之餘弦也牛庚為小弧與大弧餘度之并實即存弧丙庚之餘度故戌庚即同癸巳次得弦未庚與甲癸平行而等即初數也以危戍加戌庚而成危庚猶捴存兩餘弦相加成癸壬也危庚既同癸壬則其半未庚亦同甲癸他弦庚亥與卯癸平行而等即兩矢較也末以他弦與先得弦相減而得對弧餘弦猶以兩矢較與存弧之矢相加而得對弧之矢也兩矢較即兩餘弦較也故加之得矢者減之即得餘弦然則此兩法者固異名而同實矣又論曰加減本法用大弧小弧之捴與較取其餘弦以相加減今此法則用大弧餘度與小弧之捴與較而取其正弦以相加減如牛庚是大弧餘度與小弧之捴牛氐是大弧餘度與小弧之較用若相反而得數並同者何也曰餘弧與正弧互為消長其數相待是故大弧之餘度大于小弧則捴弧不及象限矣大弧之餘度小于小弧則捴弧過象限矣捴弧過象限宜相加此條是也捴弧不及象限宜相減後條是也宜加宜減之數無一不同得數安得而不同得數謂初數也在此法則為次得弦又論曰此法之于加減法猶甲數乙數之于初數次數也初數次數用餘弦甲數乙數用正弦加減法用餘弦此法用正弦所以然者皆以角旁之弧半用餘度也甲數乙數法內一弧用本度一弧用餘度此法小弧用本度大弧用餘度一加減法乃有四用其省乘除並同而繁簡殊矣乙丙丁形有乙角及角旁二邊求對弧丁丙乙丙小弧乙丁大弧正弦申丙辰庚捴存弧戊丙庚丙餘弦壬巳癸巳餘弦較壬癸初數癸甲丁丙對弧庚丙存弧正矢卯丙癸丙一兩矢較卯癸半徑酉巳二三角大矢初數酉午甲癸四兩矢較卯癸末以卯癸加癸丙成卯丙為對弧矢查其餘弦得對弧丁丙右加減法也今依恆星法改用大弧之餘度庚酉即午丁與小弧牛酉即乙丙相加成牛庚即存弧丙庚之餘度求其正弦為先得弦戍庚同巳癸即存弧之餘弦次視兩弧之捴戊丙不及象限法當以小弧減大弧餘度取氐酉如酉庚以牛酉減之得較氐牛與牛房等取其正弦女房即女氐亦即戍危以減先得弦戍危減戌庚餘危庚與癸壬等然後半之危庚半之于虛成庚虛與甲癸等為次得弦又以乙鈍角大矢午酉為後得弦與次得弦相乘為實半徑為法除之得他弦亢庚與卯癸等末以他弦亢庚減先得弦戍庚其餘戍亢即卯巳為對弧餘弦查表得對弧丁丙一率半徑酉巳二率次得弦庚虛即初數甲癸三率後得弦午酉即角大矢四率他弦亢庚即兩矢較卯癸乙丙丁形有丙角及角旁二邊求對弧丁乙法以丁丙大弧之餘午丁即酉甲與小弧乙丙即戊酉相加成甲戊求其正弦庚甲為先得弦次視兩弧之總丑乙適足象限即半先得弦為次得弦癸甲或癸庚又以角之大矢午酉為後得弦乘之午酉乘癸甲半徑酉巳除之得他弦卯甲即壬未以減先得弦甲庚得對弧餘弦卯庚即壬巳查表度得對弧丁乙解曰此因大弧之餘酉甲與小弧戊酉同數則無加減故即半先得弦為次得弦也在加減法則為總弧無餘弦而即半存弧餘弦為初數丙戊丁形有戊角及角旁二邊求對弧丁丙如法以大邊丙戊之餘卯丙即癸庚與小弧丁戊即癸辛相加成辛庚取其正弦庚乙為先得弦次視角旁兩弧之捴辰丁大于象限法當以癸庚減癸辛得較子辛即辛井而取其正弦子斗即井斗亦即乙甲以加先得弦乙庚而半之甲庚之半為甲丑為次得弦又以角之大矢卯癸為後得弦以乘次得弦為實半徑為法除之得他弦牛庚末以他弦牛庚與先得弦庚乙相減得牛乙即壬巳為對弧之餘弦查餘弦度以減半周得對弧丁丙解曰此為他弦大于先得弦故反減也在加減法則所得為對弧大矢與存弧小矢之較而兩矢較即兩餘弦并也故減存弧餘弦得對弧餘弦補求經度法法用角旁兩弧大弧用餘度小弧用本度相加得數取正弦為先得弦又相減得較取正弦以與先得弦相加減角旁兩弧大于象限則相加若小于象限則相減而半之為次得弦若角旁兩弧并之適足一象限則徑以先得弦半之為次得弦不須加減用為首率次以對角弧之餘弦與先得弦相加減得他弦為次率對弧大于象限相加小于象限則相減半徑為三率求得角之矢為四率正矢為鋭角大矢為鈍角假如丙戊丁形有三邊求戊角借用前圖一次得弦甲丑乃先得弦甲庚之半即庚丑二他弦壬酉即牛庚乃對弧餘弦加先得弦因對弧大故相加三半徑巳癸四鈍角大矢卯癸卯癸大矢內減巳癸半徑為餘弦查表得度以減半同為戊鈍角之度論曰角求對邊者求緯度也三邊求角者求經度也二者之分祗在四率中互換無他繆巧厯指注云求緯用正弦求經用切線殊不可曉及查其後條用例亦無用切線之法殆有缺誤厯書中如此者甚多故在善讀耳加減通法加減代乘除之法以算三邊求角及二邊一角求對角之邊皆斜弧三角之難者也其算最難而其法益簡故凡算例中兩正弦相乘者即可以加減代之則雖正弧諸法實多所通故謂之通法法曰凡四率中有以兩正弦相乘為實半徑為法者皆可以初數取之有以兩餘弦相乘為實半徑為法者皆可以次數取之有以餘弦與正弦相乘為實半徑為法者皆可以甲乙數取之假如正弧形有角有角旁弧而求對角之弧此如有春分角有黃道而求距度本法當以角之正弦與角旁弧之正弦相乘為實半徑為法除之也今以初數取之即命為所求度正弦設黃道三十度求黃赤距度春分角二十三度三十一分半黃道三十度捴弧存弧五十三度三十一分半六度二十八分半餘弦五九四四七九九三六二用初數為正弦檢表得度相減三九九一五即初數折半一九九五七求到黃赤距度一十一度三十分四十二秒又設黃道七十五度求黃赤距度春分角二十三度三十一分半黃道七十五度捴存弧九十八度三十一分半五十一度二十八分半餘弦一四八二四六二二八五用初數為正弦檢表得度相加七七一九折半三八五五四求到黃赤距度二十二度四十分三十九秒又如句股方錐法有大距有黃道而求距緯本以大距正弦黃道餘弦相乘半徑除之也今以甲數取之設黃道六十度求距緯句股方錐黃道以距二至起算下同黃赤大距二十三度三十一分半黃道六十度捴弧存弧八十三度三十一分半三十六度二十八分半正弦九九三六二五五四四七用甲數為正弦檢表得度相減三九九一五為甲數半之一九九五七求到距緯一十一度三十分四十二秒設黃道一十五度求距緯黃赤大距二十三度三十一分半黃道一十五度捴存弧三十八度三十一分半八度三十一分半正弦六二二八五一四八二四用甲數為正弦查表得度相加七七一九為甲數半之三八五五四求得距緯二十二度四十分三十九秒又如次形法本以一正弦與一餘弦相乘半徑除之得所求之餘弦今以初數取之設甲丙乙形有甲正角有丙角及甲丙邊而求乙角本法為半徑與丙角正弦若甲丙餘弦與乙角餘弦今以初數即命為乙角餘弦丙角度度甲丙餘相并減為捴存弧各取其餘弦如法相加減而半之成初數即命為乙角餘弦本法用正弦與餘弦相乘而亦以初數取之何也曰甲丙餘弦實次形丁丙正弦也故仍用初數假如斜弧形作垂弧法本為半徑與角之正弦若角旁弧之正弦與垂弧之正弦也今以初數即命為垂弧正弦設丁乙丙形有乙鋭角有丁乙邊求作丁甲垂弧乙角度乙丁弧相并減為捴存弧而取其餘弦如法相加減而半之成初數即命為丁甲垂弧正弦設丁乙丙形乙為鈍角而先有丁乙邊其法亦同乙外角丁乙邊相并減為捴存弧而各取其餘弦如上法取初數命為甲丁垂弧正弦又如弧角比例法本為角之正弦與對角邊之正弦若又一角之正弦與其對邊之正弦今以初數進五位即為兩正弦相乘之實可以省乘設乙甲丙形有丙角甲角有乙甲邊求乙丙邊本以甲角正弦與乙甲正弦相乘為實丙角正弦為法除之得乙丙正弦今以甲角度與乙甲弧相并減為捴存弧如法取初數進五位為實以丙角正弦除之亦得乙丙正弦若有乙丙邊求丙角則以乙丙邊正弦為法除之即得丙角之正弦又如垂弧捷法本以兩餘弦相乘為實又以餘弦為法除之而得所求之餘弦今以次數進五位為兩餘弦相乘之實即可省乘設甲丁亥鈍角形有亥甲邊有亥丁邊有引長之丁巳邊而求甲丁邊本法為亥巳邊之餘弦與亥甲邊之餘弦若丁巳邊之餘弦與甲丁邊之餘弦也今以次數代乘亥甲丁巳二弧相并為捴弧相減為存弧而各取其餘弦如法相加減而半之為次數下加五即同亥甲與丁巳兩餘弦相乘之實但以亥巳邊之餘弦為法除之即得甲丁邊之餘弦進五何也曰初數者兩正弦相乘半徑除之之數故必進五位即同兩正弦相乘之實矣次數進位之理倣此論之補加減捷法設壬丙甲弧三角形甲壬邊適足九十度丙甲邊八十三度對弧壬丙五十九度求甲角法曰角旁有一邊適足九十度則總存兩餘弦同數當以餘弦即命為初數依法求得五十八度四十四分為甲角存矢申丙七四五矢較戊申四七七五一一初數九九二五五已申二矢較四七七五一戊申三半徑一己癸查表得五十八度四十四分四角之矢四八一九壬癸餘弦五一八九一壬巳論曰此即算帶食法也凡算帶食其差角必在地平壬甲九十度即髙弧全數丙甲八十三度月距北極也癸丙七度黃赤距度也壬丙對弧極距天頂也其餘弦己戊即極出地正弦所求甲角月出地平時地經赤道差也捷法以黃赤距度餘弦與極出地正弦相減餘進五位為實仍以距度餘弦除之得差角矢解捷法曰極出地正弦即對弧餘弦黃赤距度餘弦即存弧餘弦兩餘弦之較即矢較也又解曰巳乙即己申亦即未丙並小弧甲丙正弦也即存弧癸丙之餘弦未丙與戌丙若己癸與壬癸全與分之比例也又解曰初數是兩正弦相乘半徑除之之數今甲壬邊之正弦即半徑故省乘除竟以甲丙正弦為初數又設壬甲辛鈍角形即用前圖壬甲邉適足九十度辛甲邉九十七度對邉辛壬一百二十一度求甲角依法求得甲鈍角一百二十一度一十六分對弧辛壬一百草一度餘弦巳戊五一五四對弧大矢戊辛一五一五四存弧矢癸乙同酉辛七四五亦同丁庚兩矢較戊酉同辰辛一五七五九亦同丁壬一初數丁巳同午辛九九二五五二矢較丁壬同辰辛一五七五九三半徑己庚一四角大矢壬庚一五一八九餘弦己壬五一八九查表得五十八度四十四分以去減半周得甲角一百二十一度一十六分論曰總弧過象限及過半周宜以餘弦相加折半成初數今兩餘弦相同而徑用為初數亦折半之理也嚮作加減法補遺自謂巳盡其變不知仍有此法故特記之因算帶食得此其用捷法更竒甚矣學問之無窮也壬甲丙鋭角形壬甲邉適足九十度丙甲邉六十七度對弧壬丙五十度求甲角依法求得甲角四十五度四十二分五即為初數壬丙對弧五十度餘弦六四二七九巳戊對弧矢三五七二一戊丙存弧矢七九五乙癸即申丙矢較二七七七一申戊一初數九二五申巳二矢較二七七一申戊三半徑一己癸四角之矢三一六九壬癸餘弦六九八三一壬巳查表得四十五度四十二分因前圖丙癸度小故復作此以明之算甲餘角又於本圖取辛甲壬鈍角形壬甲九十度辛甲一百一十三度壬丙五十度求甲鈍角依法求到甲鈍角度一百三十四度一十八分壬辛對弧一百三十度餘弦巳戊六四二七九大矢辛戊一六四二七九存弧矢申丙即乙癸七九五亦即酉辛矢較酉戊一五六三二九一初數九二五酉巳即丁巳二矢較一五六三二九酉戊三半徑一庚巳四角大矢一六九八三庚壬餘弦六九八三查表得四十五度四十二分以減半周得甲鈍角一百三十四度一十八分論曰試作庚亥線與辛丙徑平行又引對弧坎戊正弦至亥成庚亥壬句股形即庚乾巳亦同角之小句股形而庚亥同酉戊兩矢較也庚乾同酉巳初數也則初數庚乾小股與兩矢較庚亥大股若半徑庚巳小弦與角之大矢庚壬大弦凡角旁弧適足九十度則總存兩餘弧同數法即以餘弦命為初數日月食帶食出入地平用此算其地經赤道差甚捷補甲數乙數法丁辛乙斜弧三角形辛丁弧五十度一十分辛乙弧八十度丁乙對弧六十度又若辛乙弧八十度求辛角辛丁餘弧三十九度五十分辛乙餘弧一十度總弧一百十九度五十分辛丁弧五十度一十分較弧四十度一十分兩正弦總一五一二四九半之為甲數七五六二四兩正弦較二二二四七半之為乙數一一一二三丁乙對弧餘弦五內減乙數餘三八八七七為二率一甲數七五六二四二三八八七七三半徑一四辛角餘弦五一四八查表得五十九度四分為辛角若前形有辛角而求丁乙對弧一半徑一二辛角餘弦五一四八三甲數七五六二四四三八八七七以加乙數一一一二三成對弧餘弦五查表得六十度此因角旁餘弧小於正弧故乙數亦小於甲數而以所得四率加乙數為對弧餘弦丙乙丁形乙鈍角一百一十度乙丙乙丁二弧並三十度求丁丙對弧乙丙餘弧六十度乙丁弧三十度總弧九十度正弦一較弧三十度正弦五相加一五半之為乙數七五相減五半之為甲數二五一半徑一二乙角餘弦三四二二三甲數二五四八五五以減乙數七五得對弧餘弦六六四五查表得四十八度二十一分此因角旁乙丙餘弧大於乙丁正弧故乙數大於甲數而以所得四率反減乙數為對弧餘弦前例轉求乙鈍角乙丙乙丁二弧並三十度丁丙對弧四十八度二十一分求乙角一甲數二五二對弧餘弦減乙數之餘八五五三半徑一四鈍角餘弦三四二二查表得七十度以減半周得一百一十度為乙角總論曰甲數乙數原以角旁兩弧之正弦錯乘而得今改用加減故角旁兩弧一用正一用餘然有時餘弧大於正弧者角旁兩弧之合數必過象限也有時餘弧小於正弧者角旁兩弧之合必不及象限也若角旁兩弧之合適足象限則餘弧必與正弧等而無較弧又設子乙丙形乙鈍角一百度乙丙乙子二弧並四十五度求對角乙丙餘弧四十五度乙子弧四十五度半之為甲數五則無可加亦亦為乙數五無可減故皆用總弧正弦折半為甲數亦為乙數一半徑一二鈍角餘弦一七三六五三甲數五四八六八二加乙數共五八六八二命為對弧矢得對弧餘弦四一三一八查表得對弧子丙六十五度三十六分若前例三邉求乙角乃置對弧六十五度三十六分之餘弦四一三一八求其矢得五八六八二丙減乙數五仍餘八六八二為二率一甲數五二八六八二三半徑一四鈍角餘弦一七三六四查表得八十度以減半周得一百度為乙角之度補先數後數法前式丙乙丁形乙角一百一十度乙丙乙丁並三十度求丁丙對弧一半徑方一二正弦方二五三乙角大矢一三四二二四兩矢較三三五五對弧餘弦六六四五查表亦得四十八度二十一分此因角旁兩弧同度則無較弧之矢故徑以所得矢較命為對弧之矢前式子乙丙形乙角一百度乙丙乙子二弧並四十五度求對弧一半徑方一二正弦方五三角大矢一一七三六五四矢較五八六八二因無較弧矢故即為對弧矢對弧餘弦四一三一八查表亦得對弧子丙六十五度三十六分若先有對弧子丙而求乙角一正弦方五二半徑方一三對弧矢五八六八二因無較弧矢故即以對弧矢為矢較四角大矢一一七三六五餘弦一七三六五查表得八十度以減半周得乙鈍角一百度又設乙角六十度角旁乙丙乙子二弧並四十五度求子丙對弧一半徑方一二正弦方五三鋭角矢五四矢較二五無較弧即用為對弧矢對弧餘弦七五查表得對弧五十三度八分厯算全書卷十一
