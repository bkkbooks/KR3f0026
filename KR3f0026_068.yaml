body:
  text: 厯算全書卷五十五宣城梅文鼎撰解八線割圓之根八線割圓説天體至圓最中一點為心過心直線為徑圓面諸圈為弧弧與徑古用徑一圍三之比例有密術徽術各家不同然終非弧度之真蓋圓為曲線徑為直線兩者為異類亘古無相通之率夫日月星辰之道皆弧線也人目測視之線皆直線也苟非由直線以得曲線縱推算極精皆非確數於推步測量諸用所關甚巨其可略歟西儒幾何等書别立數法求得弧與徑相凖之率更以逐度之弧準逐度之線內用弦矢外用割切于是始則因弧而求線繼則因線而知弧交互推求雖分秒之弧度盡得其準立法之善即𨽻首商髙復生無以易也苐割圓八線表雖久傳于世而立法之根未得専書剖晰大測中如十邊五邊形之理皆缺焉弗講薛青州作正弦解亦僅依式推衍未能有所發明豫於厯算生平癖嗜凡有奧義必欲直窮其所以然而後快竊思割圓八線乃厯算之本源豈可習焉不察因反覆抽繹耿耿於心者數年積思之久乃得漸次會通遂著其圖衍其算理之隱賾者明之法之缺略者補之會而成帙以備好學者之採擇云爾立表之根有七一大圓中止有徑線初無邊角可尋乃作者慿空結撰求得七弧之通弦而全割圓表即從此推出又絶無假借紐合之病割圓之巧孰有加於是焉表根一圓內作六等邉切形求得六十度之通弦法曰六十度之通弦與圈之半徑等作表時命為十萬亦曰全數解曰如圖辛為心作甲丙丁圈甲丁為全徑辛丁為半徑次取丁為心辛為界作戊庚辛圈與原圈相交於丙于戊次引長丁辛線至庚必平分丙戊弧於丁亦平分戊丙弧于辛以丁為戊庚圈心故次作辛丙丙丁丁戊戊辛四線成丁辛丙丁辛戊二形必皆三邉等三角形何則丁為心辛為界則丁辛與丁丙皆為戊庚圈之半徑仍用辛丁為度辛為心丁為界則辛丁又為甲己圈之半徑辛丙亦同則辛丁丁丙辛丙三線俱等而辛丁丙為三邉等形丁辛丙三角俱自相等每角六十度夫辛角在心者也則丙丁弧為六十度丙丁即六十度之通弦與辛丁半徑等矣丁戊辛形倣此次以丙辛引至己戊辛引至乙其甲辛己乙辛甲交角俱與丙辛丁戊辛丁角等角等弧亦等即平分大圈為六分次作丙丁等六線相連成六等邉內切形等邉等角蓋乙辛己丙辛戊兩交角之弧既當六分圈之四則中間己戊乙丙二弧亦必各為六分圈之一故成六等邉形皆以半徑為邉此天地自然之數也表根二圈內作四等邉切形求得九十度之通弦法曰半徑上方形倍之開方得九十度之通弦解曰圈內四等邉切形即內切直角方形也如圖甲癸丁圈庚為心作丁癸全徑又作甲己全徑與丁癸十字相交為湊心四直角即平分大圓為四分每分九十度次作甲癸己癸己丁甲丁四線相連成四邉等形其切圈之甲丁己癸四角俱為直角以各角俱乘半圈故所容之癸甲丁己為正方形甲癸等為九十度之通弦用甲庚癸直角形甲庚半徑上方與庚癸半徑上方并開方得甲癸弦句股求弦術也巳上二根並仍厯書之舊表根三圈內作十等邉切形用理分中末線求得三十六度之通弦法曰圈徑上作理分中末線其大分為十邉等形之一邉即三十六度之通弦今欲明十邉形之理先解理分中末線欲明理分中末線先解方形及矩形一解曰凡正方形內如乙庚戊丙方依一角復作正方形如丁庚方以小方之各邉引長之如甲午辛壬即分元方戊庚為四分小方之各邉與大方之各邉俱兩兩平行其與小方丁庚相對之丁戊形亦必正方形左右所截之午壬甲辛二形必皆矩形而恆自相等一解曰任設一線如甲戊兩平分之于乙又任引長之為戊庚長短不論其全線甲庚偕引長線戊庚即子庚矩內形甲子矩及半元線甲乙癸丑等上方形癸辛方并成子丑壬甲磬折形此形與半元線乙戊偕引長線乙庚上之乙丙方形等何則乙庚上方乙丙與磬折形子丑壬甲共用乙子矩形今試以此兩率各試去乙子矩形兩所餘為乙壬矩及丑丙矩夫此兩矩形邉各相等辛丙與乙辛等辛丑與壬辛亦等以壬丑為正方故其冪亦必等則於乙子形加丑丙得乙丙方于乙子形加乙壬得子甲壬磬折形亦無不等矣又己辛亦正方形以相對之己庚為正方故己辛方與壬丑方亦等以同在甲庚癸子兩平行線內又甲乙乙戊相等故也分中末線解理分中末線明上二圖可論理分中末線矣法曰如圖任作甲戊線兩平分於乙以甲戊線自之作戊卯方從乙平分處向丁作乙丁線次以甲戊引至庚令乙庚與乙丁等于乙庚上作乙丙方又取庚子與戊庚等作癸子線分戊丁于己則戊己為戊丁元線之大分己丁為小分戊己丁己戊丁三線成連比例戊丁與戊己若戊己與己丁而戊己為中解曰依上二圖之論甲庚線偕戊庚矩形及乙戊即甲乙上方形并與乙庚上方等今乙庚線既令與乙丁等則乙丁上方亦與乙庚上方等是甲庚偕戊庚矩形及乙戊上方并與乙丁上方等而乙丁上方與乙戊丁戊上兩方之并等此二率者共用乙戊上方試以此二率各減去乙戊上方則所存之戊卯方與甲子矩形必等矣夫戊卯方既與甲子矩等又共用甲己矩形試各減去甲己矩形則所存戊子方與卯巳矩形必等矣卯巳與戊子兩矩形既等又以巳直角相連則兩形之邉為互相似之比例癸己與巳子若戊己與己丁夫癸己即戊丁也則戊丁與戊己若戊己與己丁為連比例而戊己為中率戊己上方二三率與戊丁一率偕己丁四率矩形等戊丁全線為首率戊己大分為中率減戊丁甲戊同存己丁小分為末率蓋理分中末線云者於一直線上作連比例之謂也求之法以所設甲戊半于乙為句甲戊為股即戊丁求乙丁弦即乙庚也減乙戊句存戊庚即戊己大分減戊丁元線存己丁小分又甲戊引長線止於庚者欲令乙庚等乙丁也若不為連比例戊庚可任意引長之如前二圖之論然理分中末線法實從二圖之理推出其關鍵全在乙庚乙丁二線等也解理分中末線大分為三十六度之通弦觀上諸論可明理分中末線之法然何以知其大分能為十等邉形之一邊如圖任作甲乙線用上法分之於內為理分中末線甲乙與甲丙若甲丙與丙乙甲丙其大分丙乙其小分次用甲乙全線為半徑甲為心乙為界作圈又從乙作乙丁合圈線令與甲丙等末從圈心作甲丁線相連其甲乙甲丁兩半徑等即甲丙丁為兩腰等三角形夫此三角形其腰間之甲乙丁甲丁乙二角必各倍大於底上甲角何則試從丙作丙丁線于甲丙丁角形外作甲丙丁外切圈其甲乙偕乙丙矩內直角形與甲丙上方形等因連比例等亦即與至規外之乙丁上方等而乙丁切小圈于丁為切線即乙丁切線偕丁丙線所作乙丁丙角與負丁甲丙圈分之甲角交互相等見幾何三卷三十二此二率者每加一丙丁甲角即甲丁乙全角與丙甲丁丙丁甲兩角並等夫乙丙丁外角與丁甲相對之內兩角并等即乙丙丁角與甲丁乙全角等而與相等之甲乙丁亦等丙丁與乙丁兩線亦等夫乙丁原與甲丙等即丙丁與丙甲亦等因丙甲丁丙丁甲兩角亦等又甲角既與乙丁丙角等即乙丁丙甲丁丙兩角亦相等是甲丁乙倍大於丙丁甲亦即倍大於相等之丙甲丁角也而甲乙邉與甲丁等則甲乙丁角亦倍大於甲角也次解曰丙丁乙角何以知其與丙甲丁角交互相等試作未丁全徑與乙丁為直角又作未丙線成未丙丁直角夫丙未丁丙丁未二角並與一直角等乙丁未亦一直角此二率者各減去未丁丙角所存丙丁乙丙未丁二角必等夫丙未丁負圈角也丙甲丁亦負圈角也同負丙丁弧則丙甲丁角與丙未丁角等夫未角與丙丁乙角等也今既與丙甲丁等則丙甲丁角亦必與丙丁乙角等依上論顯甲乙丁形之乙丁二角俱倍大於底上甲角形內之丙丁乙形與甲乙丁原形相似其丙乙二角亦倍大於乙丁丙角乙丁丙丁甲丙三線俱等夫甲丁乙形之甲乙丁三角并等兩直角今乙丁二角既倍大於甲角是合乙甲丁角而為五分兩直角矣則乙甲丁角該五分兩直角之一為三十六度夫五分兩直角之一與十分四直角全周之一等則乙甲丁角或乙丁弧即十分圈之一分乙甲丁甲又各為半徑則乙丁即十等邊形之一邊夫乙丁與丙丁等丙丁與甲丙等則甲丙與乙丁亦等而甲丙即理分中末線之大分故圈徑上作理分中末線其大分為三十六度之通弦圈內作十等邊切形法先依上作甲丁乙兩腰等三角形以甲乙甲丁各引至圈界為乙己丁戊其己戊弧與乙丁等次以戊乙弧半于庚作乙庚戊庚二線各半之於辛於壬又作癸丑子寅卯庚諸線俱過甲心各抵圈界即平分大圓為十分末作戊己等十線相連即所求十邊形之理據厯書見幾何十三卷九題而幾何六卷巳後之書未經翻譯不可得見考之他書未有發明其義者余特作此解之表根四圈內作五等邉內切形求得七十二度之通弦法曰六邉形上方形及十邉形上方形并開方得七十二度通弦解內切五等邉形法法曰甲乙丁圈於圈內作甲丙丁兩腰等乘圈角形令腰間丙丁二角各倍大於甲角即甲角所乘之丙丁弧為全圈五分之一何則甲丙丁形之三角并等兩直角今丙丁二角既各倍大於甲角則甲角為五分兩直角之一又甲為乘圈角所乘之丙丁弧必更倍大於甲角之度為全圈五之一矣七十二度夫丙于二角又倍大于甲角則其所乘甲丙甲丁二弧亦必倍大於丙丁為全圈五分之二即作丙戊丁乙二線平分丙丁二角亦平分甲丁甲丙二弧分大圈為五平分丙丁線即五等邉之一末作丁戊等四線相連成五等邉內切形等邉等角此係歷書原法新增作五等邉形法甲庚壬平圓內作五邉等形法任作切圓直線如子丑切平圓於甲乃以切點甲為心任作半圈如子寅丑次勻分半圓周為五平分如子辰等次從半圓上取五平分之各點作直線至切點甲此直線必過半圓周如甲辰線必過庚寅甲線必過戊餘倣此末於平圓內聯各點作通弦即成五等邉形庚甲乙甲本為通弦補作戊庚丁戊乙丁三線並與庚甲乙甲等皆七十二度通弦也解曰卯甲寅負圈角正得丁心戊分圓角之半卯甲寅既為十等面湊心之角必三十六度也則丁心戊角必七十二度而為五等邉角矣或作半圓于外如下圖亦同前論解六邉十邉兩方并等五邉上方形法曰依前理分中末線法作己丁丁丙二邉為十分圈之一乙己乙丙甲乙三線俱為中末線之大分與十邊形之一等乙丁其小分次取己丁弧之倍至丙作甲丙線得己丙七十二度為五分圈之一己丁丙為十分圈之二即五分圈之一矣作丙己線即五等形之一邊也己甲丙為七十二度之角次取己為心己丁大分為界作丁未庚圈又以丙為心丙甲半徑為界作子甲丑圖兩圈相交於辛末從丙心向交點辛作丙辛線從己心向交點辛作己辛線成丙己辛三角形此形辛為直角丙辛六邊形之邊即子丙為股己辛十邊形之邊即己丁為句己丙五邊形之邊為弦用句股術得己丙七十二度之通弦解曰丙辛己形何以知辛點必為直角試觀乙己丁乙丙丁俱為兩腰等形又自相等合之成己乙丙丁四等邉斜方形則丙己線必平分乙丁小分于壬甲丁線因己丙弧為己丁之倍亦平分丙己弦于壬壬點為直角又形內所分之乙壬己乙壬丙丁壬己丁壬丙四句股形俱自相等夫丙己邉上方形為壬己上方形之四倍幾何言全線上方形為半元線上方形之四倍而壬己上方乃乙己上方減去乙壬上方之數句弦求股是以乙己上方四倍之即己乙己丁丙丁丙乙四線上方之并減去乙丁小分上方乙丁上方為乙壬上方之四倍以乙壬為乙丁之半故也即乙壬等四小句方之并所餘即與丙己上方等矣而此四乙己方減乙丁上方之餘又與全數上方及中末線大分之方并等即十邉形之一何則試觀二圖即理分中末線圖甲丁為全數甲戊為全數上方丁乙為大分丁子為大分上方兩方之并成甲壬子戊磬折形此形內容丁子大分方形之四則重一庚己小分之方取丙丁與乙丁等則己丁壬乙俱為大分之方而庚壬矩與丁子方等甲壬矩又與庚壬矩等是共有大分上方形之四倍而庚己小方則重疊在內庚己乃辛己小分之方也今試於磬折形內減去重疊之方癸辛方是即於四個大分方內減一小分上方亦猶之前圖四乙己方內減去乙丁上方而所餘必等矣夫此磬折形既與前四乙己方內減乙丁上方之餘冪等而此餘冪又與丙己上方等則此磬折形亦與五等邊之一丙己上方等而磬折形乃甲戊丁子兩方之并也甲戊方之根甲丁即前丙辛己形之丙辛邊丁子方形之根丁己即前丙己辛形之己辛邊今丙辛己辛上兩方并既等於丙己上方是丙辛己為句股形而辛為直角矣丙辛半徑股也己辛大分句也丙子弧六十度之邊子丙即丙辛股己丁弧三十六度之邊丁己即己辛句而丙辛己辛丙己三邊適湊成句股形故厯書言六邊上方并十邊上方與五邊上方等蓋以此也若作戊乙線成戊丁乙句股形與前丙辛己形等戊乙即五邊形之一益可見辛之必為直角矣求七十二度通弦法取徑甚竒大測止具算術未著其理據云見幾何十三卷十題薛書及孔林宗説殊多牽附余此圖與原算吻合乃知古人立法之簡奧也因更推衍四法如下如圖午丁大圈依理分中末線法作十邉等內切形丁午等俱大分次從癸昴諸點癸甲昴甲俱為大分作癸昴昴壁等線俱為小分各連之則中末線之大小兩分成內外兩十邉等形俱各兩兩平行一切于周一切于徑次任取戊為心甲為界作圈亦依上法用其大分小分作內外兩十邉等形末作乙丙乙丑等五線為五邉形之各邉諸線交錯得求乙丙邉之法有五一丁乙丙形有丁丙全徑有丁卯全數及卯乙大分并為丁乙丁乙與午戊必平行乙為直角用股弦求句法得乙丙邉二乙丙寅形有乙寅小分為句有丙戊戌寅兩大分并得丙寅為弦求得乙丙股三乙甲丙形用其半甲壬丙形有甲丙全數有甲辛大分有辛壬為辛戊小分之半并為甲壬求壬丙勾倍之得丙乙邉四乙壬戊形有乙戊大分為弦有壬戊小分之半為句求乙壬股倍之得乙丙邉又形中兩圈相交內有甲卯乙戊未為小五邉形其各邉即大分甲辰戊丙庚形同又有甲卯乙戊丙庚為小六邉形其各邉亦即大分又小五邉形與午丑乙丙氐大五邉形相似而體勢等則其各邉俱成比例乙甲全數與甲卯大分若乙午與午丑則以甲卯與午乙相乘全數除之亦得五邉形之一其午乙線以乙亢午直角形用句弦求股術取之表根五圈內作三等邉內切形求得一百二十度通弦半之為六十度正弦法曰全徑上方形內減六邊形上方形開方得一百二十度之通弦解曰甲為圈心甲乙為半徑作圈次乙為心仍用乙甲為半徑作弧與大圈相交於丁於戊其所截之丁乙戊弧即三分圈之一何則依前六邊形之論丁乙戊乙二弧俱為六分圈之一今丁乙戊弧乃倍大於丁乙必三分圈之一矣一百二十度即作丁戊線為三等邊形之邊次以乙甲引至丙必平分丁丙戊大半圈於丙以丙乙為過心線既平分丁戊弧於乙亦必平分丁丙戊弧於丙也從丙作丙戊丙丁二線成丁丙戊三邊等內切形求之用乙丁丙三角形丁為直角以丁角乘丙戊乙半圈故丁乙為六邊形之一丙乙全徑上方減去丁乙半徑上方丁乙即乙甲餘開方得丙丁邊句弦求股術也表根六圈內作十五等邊內切形求得二十四度之通弦法曰三邊等形與五邉等形之較即十五分圈之一可求二十四度通弦解曰戊丙大圈丑為心作丙子全徑取丙點為宗依前法作丙甲辛三邉等形又作丙戊乙己庚五邊等形丙甲弧為三分圈之一一百二十度丙戊乙弧為五分圈之二七十二度相較得甲乙弧二十四度即十五分圈之一也其求甲乙之邉以五邉形之邉乙己半於癸三邉形之邉甲辛半於壬得乙癸與甲壬相減丁壬即乙癸存甲丁為股次作乙丑甲丑兩半徑成乙丑癸甲丑壬二直角形以乙丑半徑上方減乙癸半弦上方餘開方得癸丑邉又以甲丑半徑上方減甲壬半弦上方餘開方得丑壬邉次以丑癸與丑壬相減得壬癸即乙丁為句末用甲丁乙直角形甲丁上方與丁乙上方并開方得甲乙為十五等邉內切形之邊又解曰甲乙弧何以知為十五分圈之一凡一圈內作三邊等形又作五邊等形以其邊數三與五相乘得十五即知可為十五等邊切形其兩弧之較必有十五分圈之一如甲乙也餘倣此推此亦厯書原法表根七圈內作九等邊內切形求得四十度之通弦新增求內切九等邊形法曰甲為圓心于圓內先作庚子辛三邊等形法見前平分大圓為三分次用甲庚為度作庚己線與庚辛為直角庚為心己為界作己壬弧為全圈六之一六十度次於己壬弧上任取癸點向甲心作癸甲直線與庚辛交於戊其自癸至戊之度令與甲乙半徑等次癸為心戊為界作圈與大圈相交於丙於庚庚點為己壬弧圈心又癸戊半徑與庚己等必相交于庚從癸又作癸庚癸丙二線得庚戊丙圈所割之庚乙丙弧必為庚辛弧三之二辛丙為三之一即全圈九分之一也末作丙辛線為內切九等形之邉依此作丙乙乙庚諸線成九等邉內切形等邉等角解曰癸戊線既等甲乙半徑則兩圈相交之庚戊丙庚乙丙兩弧必等又癸甲線既過兩心甲大圓心癸庚戊丙圈心試作庚丙通弦必平分通弦於丁亦平分庚丙弧於乙與丙庚弧於戊而庚乙與丙乙等庚戊與丙戊等又兩弧庚乙丙庚戊丙共用庚丙通弦則丙戊與丙乙庚戊與庚乙亦各相等其丙戊丙乙庚戊庚乙四線亦等又癸丙癸戊癸庚三線俱即半徑癸為庚戊丙圈心故則癸庚戊癸丙戊為兩腰等三角形而兩癸角又等庚戊丙戊二弧等故則兩形之邉角俱自相等又丙戊辛形其戊辛二角亦等何則戊角之餘為丙戊庚角而丙戊庚乃庚戊癸丙戊癸兩角之并亦即癸丙戊癸戊丙兩角之并癸戊庚角與癸戊丙等因兩形為等形亦與癸丙戊角等是丙戊辛角必與戊癸丙角等其丙辛戊角乘庚丙弧則辛角必得庚丙之半與乙丙弧等亦與丙戊等是丙辛戊角亦與戊癸兩角等而辛丙戊為兩腰等形因得戊丙與辛丙兩邉亦等夫丙戊邊本與戊庚等則丑丙與戊庚亦等而丙戊即丙乙庚戊即庚乙是辛丙丙乙乙庚三線等也而辛丙丙乙乙庚三圈分亦等矣前庚乙辛弧乃全圈三之一今庚乙又為庚辛三之一即全圈九之一為四十度而庚乙即四十度通弦按癸丙線必與庚甲平行其交己壬弧之丑點必居癸壬弧之中而壬丑丑癸癸己為三平分各得十二度求九邊形之邊法曰取十邊形相較可得九分圈之邊如圖乙辛戊圓甲為心取辛丙弧為十邊形之一三十六度戊乙弧為九邉形之一四十度辛丙為十邉形之邉乙戊為九邊形之邊二線令平行則其較弧辛乙與丙戊相等各二度次作辛乙丙乙諸線成辛乙戊丙四邉形此形有丙辛邊前第五根所得有辛乙邊一度正弦之倍用後法所得先求丙乙線用丙辛乙鈍角形作辛丁垂線以辛丙半之因乙辛得辛丁次以辛丁上方減辛乙上方開方得乙丁又以減辛丙上方開方得丁丙并之得乙丙線與辛戊等次以乙丙自乘方內減去辛乙自乘方餘以辛丙除之得乙戍為九邊形之邊即四十度通弦也上圖之庚乙線解曰丙辛線既與戊乙平行則丙乙辛戊兩線相等辛乙與丙戊亦等從辛從丙作辛己丙午二垂線所截戊乙線之戊午己乙為丙辛戊乙二線相較之半亦必等夫丙乙自乘得丙乙上方形辛乙自乘得丙戊上方形辛乙與丙戊等故而丙乙上方乃丙午乙午上兩方之并丙戊上方又丙午戊午上兩方之并則試於丙乙上方減去丙午上方所餘為乙亥方丙戊上方減去丙午上方所餘為午未方而午未方即己子方也今于丙乙上方形減丙戊上方形是減去丙午上一方又減去巳子一方即戊午上方形所餘為午卯丑亥磬折形夫午乙與己戊二線相等則午丑與巳酉兩方形亦等因得卯午矩與申酉矩等移卯午補申酉則丑未矩形與午卯丑亥磬折形等矣故以子丑除之子丑即丙辛以卯亥為正方故得子未邊即乙戊四十度通弦也按九邊形法諸書所無然缺此則九十度之正弦不備壬寅秋客潤州魏副憲官署時魏公鋭意厯學因作此圖補之附求一度之通弦一度為全圓三百六十之一亦可名三百六十等邉內切形法曰一度之通弦取相近之數用中比例法得之如圖庚乙弧為一度先設甲庚一度三十分依前法表根六及表法一求其正弦甲癸度二六一七六八九又求其通弦得度二六一七九二半之得度一三八九六為己庚四十五分弧正弦己辛也三分之得己寅度四三六三三為十五分弧略大線加己辛即未丑得壬丑度一七四五二八為一度弧略大之正弦次於甲癸線內減己辛即戊癸餘戊甲亦三分之得丙戊度四三六二四為十五分弧略小線加戊癸得丙癸度一七四五二即丁午也為丁庚一度略小弧之正弦夫大小兩弦其差八數為壬亥半之得四壬申也申亥同加小減大得乙子度一七四五二四為乙庚一度之正弦若求其通弦用正弦與正矢為句股求之此薛儀甫歷學會通法再細求一度正弦係作枚法前四十五分弧之正弦度一三八九六法以四十五分半之為草二分三十秒求其正弦得六五四四九又半之為十一分十五秒求得正弦三二七二四五夫草二分三十秒之弧倍於十一分十五秒而其弦亦倍則知二十分以內之弧正弦若平分數縱有參差非算所及法以草二分三十秒為一率正弦六五四四九為二率十五分為三率得四率十五分正弦度四三六三二六次以十五分正弦與四十五分餘弦度九九九九一四三相乘得度四三六二八八六六八六為先數以十五分餘弦度九九九九九四八與四十五分正弦度一三八九六相乘得度一三八九四七五三八為後數相乘之理見表法六兩數相併得度一七四五二三六一四五為一度正弦與薛書略同但此法似密論曰弧與弦非平分數然一度以內弧弦相切曲直之分所差極微故可以中比例法求也按上七根所求者皆各弧之通弦表中所列俱正弦蓋論割圓必以通弦便算則惟正弦然正弦即通弦之半全與分之比例等其理一也作表之法有七用上根數於大圓中求七弧之通弦以為造端之始而各度之弦尚無從可得爰立六種公法或折半或加倍或相總或相較轉輾推求以得象限內各度之正弦蓋上諸法乃其體此則其用也二者相資表以成焉表法一有一弧之正弦求其餘弦及半本弧之正弦與餘弦解曰如圖甲為圈心乙丙戊弧為全圈四之一九十乙甲戊甲俱半徑設有戊丁丙弧其正弦為丙庚即從丙作丙甲線成丙庚甲直角形法甲丙全數上方減丙庚正弦上方餘開之得甲庚與丙辛等即丙戊弧之餘弦也又用甲庚減甲戊半徑得庚戊矢又作丙戊線成丙庚戊直角形法庚戊矢上方與丙庚上方并開方得丙戊為戊丁丙弧通弦半之得丙己或戊己即半本弧丙丁或丁戊之正弦又以丙甲己形戊甲己形同用句弦求股術求己甲得半本弧之餘弦癸丙等若再以丙己丁己二邊求丙丁弦半之又得半丙丁弧之正弦餘倣此遞求之論曰丙戊弧既平分于丁其丙戊弦亦必平分於巳故半丙戊為半本弧之正弦試作丁甲壬象限則丙己正弦己甲餘弦尤了然矣表法二有一弧之正餘弦求其倍本弧之正弦與餘弦解曰甲丙象限內設有甲戊弧其正弦戊己餘弦己乙今求倍甲戊之甲丁弧正弦丁癸與餘弦癸乙法先作丁甲線為丁戊甲倍弧之通弦此線必為乙戊線平分於壬則壬甲亦為甲戊弧正弦與戊己等丁壬亦等夫壬甲既等戊己則其餘弦壬乙亦必等己乙法用己戊乙庚壬乙兩形乙戊全數與戊巳正弦若乙壬餘弦即乙己與壬庚而壬庚即辛癸倍之得丁癸為倍弧甲丁之正弦論曰乙戊己乙壬甲兩形相等戊乙等甲乙戊己等甲壬己乙等壬乙故壬乙得為餘弦又乙戊己乙壬庚兩形相似故第四率可求壬庚即辛癸而壬庚必為丁癸之半以丁癸甲直角形丁甲弦既平分於壬從壬作壬辛垂線亦必平分其股于辛也故倍癸辛得丁癸為倍弧甲戊丁正弦又壬庚線亦平分甲癸句於庚用甲壬庚形依句股術求甲庚倍之以減甲乙存癸乙或丁子即倍弧之餘弦也表法三求象限內六十度左右距等弧之正弦解曰六十度左右距等弧之正弦與其前後弧兩正弦之較等如圖乙丙象限內設丙戊為六十度不動有丙己小弧須在三十度以上丙巳丁大弧其大弧與丙戊六十度之較戊丁令與丙己小弧與戊丙六十度之較戊己等其大小兩弧正弦一為己辛一為丁庚相較為丁癸此丁癸與己壬丁壬等則丁癸為戊丁戊己距等弧之正弦壬甲為餘弦論曰試從巳向子作巳子線則丁巳子為三邊等形何則形中壬子丁壬子己兩形相等丁子壬己子壬兩角本等又同用壬子邊則兩形自等而丁子壬角與乙甲戊角等以丁庚與乙甲平行故為三十度乙甲戊為丙戊甲角六十度之餘則丁子巳角為丁子壬之倍必六十度又丁子壬巳子壬兩角等則其餘壬丁子壬巳子二角亦必各六十度而與丁子巳角等則丁子巳為平邊三角形夫丁子巳既為平邊三角形其巳癸垂線必平分丁子於癸子壬垂線必平分丁巳於壬兩分之丁癸與丁壬必等而丁癸乃己丙丁丙大小二弧兩正弦一巳辛一丁庚之較按此須先求得象限內六十率之正弦依上法可求左右三十率之正弦外此即不可用以六十度之餘止三十度故也表法四任設兩弧之正餘弦求兩弧并及較弧折半之正弦解曰戊壬象限內任設不齊之兩弧一置在上如戊丙一置在下如丁壬中間所容丙丁弧即戊丙丁壬兩弧并之餘今求半丙丁弧丙乙丁乙同之正弦法作丁壬弧正弦丁辛餘弦丁癸戊丙弧正弦丙壬即癸己餘弦丙子又作丙丁線為較弧之通弦成丙己丁直角形次以丁壬弧正弦丁辛巳子同減戊丙弧餘弦丙子得丙己為股丁壬弧餘弦丁癸減戊丙弧正弦癸己得丁己為句句股求弦得丙丁邉半於庚得丙庚或庚丁為丙丁半弧丙乙之正弦巳上俱係厯書原法表法五有一弧之正弦求倍本弧之矢因得餘弦解曰設戊乙弧其正弦乙丁戊丙為戊乙弧之倍其正弦丙己正矢戊己丙戊為倍弧通弦半于辛其辛戊與乙丁等法用戊丙己戊辛甲兩直角相似形二形同用戊角故相似甲戊與戊辛若丙戊與戊己倍弧矢夫四率之理二三相乘之矩內形與一四相乘之矩等則丙戊乘辛戊即甲戊乘戊己而丙戊乘辛戊所得矩形為辛戊上方形之倍戊辛自乘得辛庚方倍之為丙庚矩即丙戊與戊庚相乘之幂也戊庚即戊辛而全數甲戊也又省一除故以乙丁正弦即辛戊自乘倍之退位即得戊己倍弧矢用減半徑得倍弧餘弦己甲若反之以戊己矢折半進位開方即得半本弧之正弦丁乙此孔林宗術勿菴稱為正弦簡法余作此圖以著其理表法六任設不齊之兩弧求兩弧相并之正弦及相較之正弦解曰寅巳未圈甲為心寅巳為一象限設寅已弧內有己辛弧若干度為前弧又有己戊弧小于己辛為後弧戊子為後弧正弦子甲其餘弦午辛為前弧正弦午甲其餘弦次取辛丑弧與己戊後弧等則己戊丑為前後兩弧之并弧丑亥即并弧之正弦次作丑壬線為丑辛弧正弦與戊子等其餘弦壬甲亦與子甲等辛壬亦與子巳等法用甲午辛甲壬丁二相似形以後弧之餘弦壬甲因前弧之正弦辛午全數甲辛除之得壬丁為初數卯亥等寄位次用甲辛午丑壬卯二相似形甲辛午形之辛角與丑乙辛角等因丑壬乙為直角其丑壬卯角亦與丑乙壬角等則亦與甲辛午角等又二形之卯午俱為直角則兩形相似甲辛與甲午若丑壬與丑卯則以前弧之餘弦甲午因後弧之正弦丑壬全數辛甲除之得丑卯為次數末以五卯與初數卯亥相并得丑亥為已戊丑兩弧相并之正弦若求兩弧相較之正弦法以後弧丑壬正弦引長之抵圈界於癸則丑癸為丑辛癸弧之通弦因壬點為直角其癸壬與丑壬必等因得丑辛癸辛兩弧亦等夫丑辛弧原與戊巳後弧等則辛癸與戊己弧亦等即以辛癸減辛己前弧得癸己為兩弧之較癸庚即較弧之正弦癸酉其餘弦法用丑辰癸形此形內之癸申壬丑卯壬二直角形相等丑癸辰句股形丑癸弦既平分于壬則從壬作壬卯壬申二垂線亦必平分丑辰句于卯癸辰股于申而癸申壬丑卯壬兩形必等因得壬申即丑卯次數壬申等卯辰卯辰即丑卯用以減初數壬丁存申丁即癸庚也為較弧癸巳之正弦亦與戊辛弧正弦等若兩弧相并在象限外如次圖巳寅丑弧理亦同鈐記同前有不齊之兩弧求相并相較弧正弦又法法曰兩弧小甲丙大甲戊相并曰總弧甲癸相減曰多弧戊丙置大小兩弧以大弧正弦戊辛因小弧較弦子庚曰先數庚乙以大弧較弦辛庚因小弧正弦庚午曰後數午未視兩弧在象限內者以後數亥壬減先數亥丙也以午亥丙形與庚乙子形等故為多弧正弦壬丙以後數卯丑加先數丑已以庚巳丑形與庚乙子形等故為總弧正弦卯巳也以卯午巳形與庚酉癸形等故卯己即酉癸若兩弧過象限者加減各異又或置大小兩弧同上以大弧正弦戊辛因小弧正弦午庚曰先數庚未以大弧較弦庚辛因小弧較弦庚子曰後數子乙視兩弧在象限下以後數午亥加先數得多弧較弦壬庚以後數庚丑減先數庚未得總弧較弦丑未即午卯亦即庚酉若兩弧象限內外不等加減亦異此法詳三角會編五卷梅勿菴先生環中黍尺亦著其法然彼所論者弧三角形此則平圓中求正弦也表法七圓內有五通弦錯互成四不等邊形求不知一弧之通弦解曰甲為圓心戊庚為圓徑戊丙丙丁丁庚俱為通弦成戊庚丁丙四不等形丁戊丙庚為對角線法丁戊偕丙庚相乘之矩形內減丁庚偕丙戊相乘之矩形餘為戊庚與丙丁相乘之矩形蓋丁庚丙戊相乘之矩與戊庚丁丙相乘之矩并與丁戊丙庚兩對角線相乘之矩等也若有丙戊丁庚戊庚丙庚丁戊五通弦用此可得丙丁弧之通弦論曰庚戊丁形與庚丙丁形其戊丙兩角等同乘丁庚弧故若以丙丁弦引至己作庚己丙直角形則庚戊丁庚己丙兩直角形相似庚戊與戊丁若庚丙與丙己夫四率之理二三相乘矩形與一四相乘之矩等則庚丙與丁戊相乘所得即庚丙與丙己相乘之己壬矩也取己癸與庚戊徑等次作丁辛線與己癸平行割圈於子其子庚弧與丙戊弧等何則戊丁庚為直角丙丁子亦為直角同用戊丁子角子戊弧則丙丁戊庚丁子兩角必等其所乘之丙戊庚子兩弧亦等矣因得庚子邊即丙戊通弦又庚子丁角與庚戊丁角等同乘丁庚弧故於庚作庚乙垂線與己丙平行成子庚乙直角形與庚戊丁直角形相似戊庚與庚丁若子庚與庚乙依四率之理庚子即丙戊與丁庚相乘所得即庚戊與庚乙相乘之己辛矩也丁辛即庚戊己丁即庚乙用以減己壬矩形餘丁壬矩形乃庚戊與丁丙相乘之幂故以庚戊除之得丁丙為丁丙弧之通弦若戊丙丁庚非半圈或大或小不論則庚戊為戊丙庚弧之通弦理亦同但己壬為斜方形如上圖戊丁庚為小半圈成己壬斜方其庚乙線不與丁己平行法作己庚乙角令與丁己庚角等則腰間相對丁乙二角亦等因得庚乙丁己為等邊而庚乙子鈍角為丁乙庚之餘與丁己庚角自等亦即與圓內戊丁庚角等而庚乙子庚戊丁為相似形庚乙即丁己此上古多羅某法諸書未有能言其故者得余此圖庶不昧古人精意已上二法係余所增用上七法交互推求可得象限內各度之正弦細推之又可每隔十五分四分度之一得一正弦十五分以下用中比例法以十五分正弦為實十五為法而一得一分之正弦遞加之得每度內各分之正弦立割圓表又此正弦算一象限巳足以適滿一直角故也求切線角線矢線割圓正弦而外又有切割矢三線并正弦為四線合其餘為八線蓋以八線凖一弧弧之曲度得其真矣切線止切圈以一點全在圈外割線從圈心過規半在內半在外正弦與矢全在圈內如圖甲為圈心庚丁為象限庚甲丁甲俱半徑設有庚乙正弧即戊乙為正弦乙辛戊甲同為餘弦次於圈外作庚己線與戊乙平行切圈于庚又從甲心過所截弧乙點作甲己線與庚己交於己成甲己庚直角形此己庚為乙庚弧正切線己甲其正割線也而甲己庚直角形與圓內戊甲乙形相似甲戊與戊乙若甲庚與庚己故以餘弦除正弦半徑因之得本弧正切又戊甲與甲乙若庚甲與甲己故以餘弦除半徑全數因之得本弧正割以戊甲餘弦減甲庚半徑得庚戊本弦正矢此皆庚乙弧相當之線也夫庚乙既為正弧則乙丁為餘弧作乙辛線為餘弧之弦作丙丁線切圈於丙為餘弧之切甲乙引出之遇于丙甲丙為餘弧之割成甲丙丁直角形與圓內甲乙辛形相似甲辛與辛乙若甲丁與丁丙得餘切甲辛與甲乙若甲丁與甲丙得餘割乙戊即甲辛正弦減甲丁半徑得辛丁餘矢此又丁乙餘弧相當之線也一正一餘共有八線若或以丁乙為正弧即庚乙反為餘弧其八線正餘之名亦互易蓋此為正彼自為餘耳論曰庚乙正弧之各線為甲庚己甲戊乙兩句股形所成乙丁餘弧之各線為甲丁丙甲辛乙兩句股形所成而甲庚己形與甲丁丙形相似一為順句股一為倒句股又圓內之乙甲辛甲戊乙二句股形俱自相似亦與甲丁丙甲庚己二形相似是庚乙弧相當之線成相似之直角形四設算可以用正亦可以用餘是一弧而能兼用八線此八線表所由名也按表中不列矢線者以矢線用正餘弦減半徑即得且不常用故省之又按割圓之難全在求正弦若切割線俱以比例得之附求割線省法用加減算如乙己弧為二十度其切線乙戊求割線甲戊法先以餘弦己丙七十度半于丁得丁己三十五度丁丙等次以戊乙切線引長之令與戊甲等作甲戊辛兩腰等三角形而乙庚弧必與丁丙等即查乙庚弧之切乙辛并乙戊得戊辛即甲戊割也解曰乙庚弧何以與丁己弧等蓋甲辛戊既為兩腰等三角形則甲角之己庚弧必為丙己餘弧己壬也之半壬庚與己庚等而庚點居己壬弧之中夫丙己與己壬并等兩直角則己庚弧之不滿直角者必為丙己之半今丙己既半於丁則以丁己益己庚丁甲庚必為直角而乙甲丙亦直角也共用乙甲丁角或丁乙弧則丙己與乙庚等求矢線餘弦減半徑得正矢正弦減半徑得餘矢求切線餘弦除正弦半徑因之得正切正弦除餘弦半徑因之得餘切求割線餘弦除半徑半徑因之得正割正弦除半徑半徑因之得餘割按圓內弦矢二線當正弧初度則無九十度極大即半徑圈外切割二線切線當正弧初度亦無割線即半徑至九十度俱極大且切與割平行不能相遇名曰無窮之度然至此亦無切割之可言矣惟將近九十度點有極大之切割線定八線正餘之界庚戊丙半圓甲為心戊丙為象限設丙乙正弧在九十度內則乙壬為正弦壬丙為正矢甲丁為正割丙丁為正切其戊乙餘弧乙己為餘弦己戊為餘矢甲辛為餘割戊辛為餘切若設庚戊乙為正弧在九十度外亦以乙壬為正弦丁丙為正切甲丁為正割壬丙為正矢而庚壬亦為正矢又名大矢其餘弧仍用戊乙非乙丙在庚戊象限之外乙己為餘弦戊己為餘矢戊辛為餘切甲辛為餘割蓋乙壬正弦為丙乙庚乙兩弧共用故總以戊乙為餘弧也凡算三角形取用正餘諸線以此為凖厯算全書卷五十五
