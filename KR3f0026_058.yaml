body:
  text: 厯算全書卷四十五宣城梅文鼎撰方程論卷六方程御雜法算術之有方程猶量法之有句股必深知諸算術而後能言方程猶之必深知諸量法而後能治句股故以是終諸方田少廣凡屬量法者往往有可以句股立算而諸法不能治句股方程之於粟布差分也亦然故雜法不能御方程而方程能御雜法例如後假如有糧一萬九千石𣲖與甲乙丙三縣各以其人戶多少米價貴賤僦值逺近舟車險易而均輸之甲縣戶三萬米價每石一兩四錢逺輸二百里用車載二十石行一里僦值一錢三分乙縣戶二萬米價一兩二錢逺輸五百里用舟載二十五石行一里僦值三分丙縣戶一萬米價一兩二錢逺輸二百里道險可用負擔每負六斗行五十里顧值一錢八分法曰各以其縣米價併僦值之數命其户以方程較數列之以甲縣車載二十石除其僦值一錢三分得六釐五毫每載一石行一里數也以乘二百里得一兩三錢併米價一兩四錢共二兩七錢以乙縣舟運二十五石除其僦值三分得一釐二毫以乘五百里得六錢並米價一兩二錢共一兩八錢以丙縣負擔六斗除其顧值一錢八分以乘一石得三錢又以五十里除之二百里乘之得一兩二錢併米價共二兩四錢原法以各縣米價并僦值之數以除其戶為衰列而併之併衰為法各衰乘總米為實法除實得各縣米今用方程則不須爾竟以二兩七錢命甲縣之衰為二十七戶以一兩八錢命乙縣之衰為一十八户以二兩四錢命丙縣之衰為二十四户以三縣衰命為適足而列之如三色有空法乘餘丙縣異並一百一十四戶為法正三十四石二斗為實法除實得丙縣每戶糧三斗以丙一戶三斗減共一石九斗餘一石六斗乙縣四戶除之得每戶糧四斗以乙二戶八斗甲縣三戶除之得每戶二斗又三分斗之二各以每户率乘其縣之戶總得各縣轉計開甲縣三萬户共糧八千石共僦車值一萬四百兩每户糧二斗六升六合又三之二每三户糧八斗每戶僦值三錢四分又三之二每三户僦值一兩四分總計米價與其僦值每戶共銀七錢二分乙縣二萬户共糧八十石其僦船值四千八百兩每户糧四斗僦值二錢四分總計米價僦值每户亦七錢二分丙縣一萬户共糧三千石共顧擔夫銀三千六百兩每户糧三斗僦值三錢六分總計米價僦值每户亦七錢二分以米言之論曰此因米價不等加以僦值不同故以法均之糧雖不均而每户所出之銀數則均若但均其米乃不均矣是故均之以不均斯謂能均問官米二百六十五石令三等人户出之甲上等二十户每户多中等七斗乙中等五十戶每戶多下等五斗丙下等一百一十戶其則例各若干法以和較列位依省算以和數十之一列之如法乘減得丙戶十八為法二十一石六斗為實法除實得一石二斗為下等每戶則例加正五斗為中等則又加七斗為上等則計開甲上等每戶二石四斗二十戶共四十八石乙中等每戶一石七斗五十戶共八十五石丙下等每戶一石二斗一百一十戶共一百三十二石合計之共二百六十五石問有米六百七十四石以四等里甲輸納乙為甲十之八丙為乙十之七丁為丙十之六其甲乙各八十戶丙丁各七十户問各若干解曰十之八即非二八差分十之七十之六即非三七四六差分故與帶分條所設不同合而觀之可也法以和較列位如法乘減而重列其餘與三行對又以餘數與四行平列數益多用省算法四除減餘然後列之如法乘減餘丁六百七十四為法五萬六千六百一十六石無減為實法除實得八十四石為丁共數十因丁數六除之為丙共數十因丙數七除之為乙共數十因乙數八除之為甲共數計開甲共數二百五十石以八十户除之得每户三石一斗二升五合乙共數二百石為甲十之八以八十户除之得每户二石五斗丙共數一百四十石為乙十之七以七十戶除之得每户二石丁共數八十四石為丙十之六以七十户除之得每户一石二斗總計之共六百七十四石論曰此所問是總數相差非每户相差也故原列者總户而得亦總户之米若云問每户之差則當以每户列之而所得者亦每户米也如後例假如共米六百七十四石以四色人户出之甲八十户乙亦八十户乙每户如甲十之八丙丁各七十户丙每户如乙十之七丁每户如丙十之六問各户則例法以戶細數列位依省算以首行退位十而一與次行對減而重列之又半其減餘然後列之與三行對又列減餘以對末行如法乘減異併一千二百九十二為法一千四百一十五石四斗無減為實法除實得一石九升又三百二十三之一百七十八為丁每戶則例法實皆四約之十因丁則六除之得一石八斗二升又三百二十三之一百八十九為丙每户則例十因丙則七除之得二石六斗又三百二十三之二百七十為乙每户則例十因乙則八除之得三石二斗六升又三百二十三之十四半為甲每戶則例計開甲每户三石二斗六升又三百二十三之十四半八十户共二百六十石八斗三升又三百二十三之一百九十一乙每户二石六斗又三百二十三之二百七十為甲每户十之八八十户共二百八石六斗六升又三百二十三之二百八十二丙每户一石八斗二升又三百二十三之一百八十九為乙每户十之七七十戶共一百二十七石八斗又三百二十三之三百一十丁每户一石九升又三百二十三之一百七十八為丙每户十之六七十户共七十六石六斗八升又三百二十三之一百八十六合計共六百七十四石凡六百七十三石九斗七升又九百六十九分以三百二十三收之為升得此數問有均分兩銀庚以其五之二與甲則甲之數多於庚一百六十八兩若以甲二十一之九與庚則庚之數多於甲一百八十兩原數幾何法以所用益彼之分與此所存之餘分相減而列之庚與甲五之二庚自存五之三相減餘五之一是為以庚五之一較甲全分而甲多一百六十八兩也甲與庚草一之九二甲自存草一之十相減餘二十一之三是為以甲二十一之三較庚全分而庚多一百八十兩也庚雖自存五之三而甲股內有庚所與之二故以相減而餘之一分與甲相較甲雖自存二十一之一十二而庚股內有甲所與之九故以相減而餘之三分與庚相較甲一百二分為法除實一千二十兩得十兩為甲之一分二十一分共二百一十兩減負一百六十八兩餘四十二兩為庚之一分五分亦共二百一十兩計開庚甲各原銀二百一十兩庚五之二計八十四兩其五之三仍一百二十六兩甲二十一之九計九十兩其二十一之十二仍一百二十兩庚以八十四與甲甲共有二百九十四庚仍餘一百二十六相較甲多一百六十八甲以九十與庚庚共有三百二十甲仍餘一百相較庚多一百八十此設問之意也以庚之一分四十二甲全分二百一十相較甲亦多一百六十八以甲之三分計三十庚全分二百一十相較庚亦多一百八十此列位之理也論曰右例以此之分益彼而轉與此之餘分相較與帶分條所設不同帶分條此之分較彼全分其全分即是原數今則一損一增以相較非原數也故曰不同及其相減而列為較數也則亦是此之分較彼原數矣是之謂尾同而首異相減列位亦有變為和數者如後所設問有兩銀庚以其五之三與甲則甲之數多於庚二百五十二兩若以甲草一之十三與庚則庚之數多於甲二百六十兩法亦以所與彼之分與其餘分相減列之庚與甲五之三自存五之二相減餘五之一此為所用之分多於存分是變和數也庚五之一偕甲全分共二百五十二兩也甲與庚二十一之十三自存二十一之八相減餘二十一之五此亦用分多存分少是變和數也百甲二十一之五偕庚全分共二六十兩也甲所以多如許者不惟其全數之故其所得於庚之分又多於庚之餘分者一也故甲所多之數乃是甲全數偕庚之一分所共也庚所以多如許者亦不惟其全數之故其所得甲之分又多於甲之存分者五也故庚所多數亦是庚全數偕甲之五分所共也甲一百分為法除實一千而得十兩為一分以甲五分計五十兩減共二百六十兩餘二百一十兩為庚原銀五除之得四十二兩為一分以減共二百五十二兩亦得二百一十兩為甲原銀庚五之三計一百二十六兩以加甲銀共三百三十六兩內減去庚自存五之二計八十四兩仍多二百五十二兩即是甲全數偕庚一分之數也甲二十一之十三計一百三十兩以加庚銀共三百四十兩內減去甲自存二十一之八計八十兩仍多二百六十兩即是庚全數偕甲五分之數也論曰右例以此之分偕彼全分而為和數亦與帶分和數同然以相減而得之亦是尾同首異帶分條和數較數據問而分今則設問只是較數相減列位乃有和較之分依例推之亦有變為一和一較者皆以所用之分與所存分相減而得之列位時巳變不待其重列減餘也故又與尋常較變和者異總論曰此二條者皆一損一益例也問金九錠銀十一錠其重適等若交易其一則銀多十三兩其原重若干法以相差十三兩半之得六兩五錢為一錠之較解曰交易一錠而差是一多一少故半之為一錠之較銀得較而增重故與金同名銀二錠除實得銀每錠重二十九兩二錢半加正六兩五錢得金每錠三十五兩七錢半計開金每錠三十五兩七錢五分金九錠得三百二十一兩七錢五分銀每錠二十九兩二錢五分銀十一錠亦得三百二十一兩七錢五分金八錠二百八十六兩加銀一錠共三百一十五兩二錢半銀十錠二百九十二兩半加金一錠共三百二十八兩二錢半共多一十三兩若交易二錠而差二十六兩則以二錠倍作四錠除之亦得六兩五錢為一錠之較餘可類推或半相差二十六兩為一十三兩命為金二錠銀二錠之較尤為平穩論曰此條舊列差分同文算指改立借衰互徴之法皆不知宜入方程也凡以兩家之數相交易而差若干皆半其所差而列之為所交易之較何也一增一減而差若干則原所差者其半也問甲有硃砂銀七錠壬有礦銀九錠相較甲原多十五兩今以甲二錠易壬三錠則甲多二十七兩法以原多十五兩今多二十七兩相減餘十二兩半之得六兩為甲二錠壬三錠之較甲得較而增重故與壬同名壬三錠除七十二兩得壬每錠二十四兩以九錠乘得二百一十六兩加正一十五兩共二百三十一兩甲七錠除之得每錠三十三兩計開甲以二錠與壬餘五錠一百六十五兩加易得壬三錠七十二兩共二百三十七兩壬以三錠與甲餘六錠一百四十四兩加易得甲二錠六十六兩共二百一十兩相較甲多二十七兩此問意也問甲銀七錠壬九錠相較壬原少十五兩今以一錠相交易壬多三兩法以原少十五兩今多三兩併得十八兩而半之得九兩為一錠之較壬得之而變輕為重故與甲同名壬二錠除四十八兩得每錠二十四兩加九兩得甲每錠三十三兩計開甲六錠一百九十八兩加壬一錠二十四兩共二百二十二兩壬八錠一百九十二兩加甲一錠三十三兩共二百二十五兩相較壬多三兩此交易一定之數餘同前問論曰此三問皆同法第一問盈偕適足故即用原數第二問兩盈故相減第三問盈偕不足故相併然皆半之為較故三法一法也又按於七錠中取一即七之一同帶分之理故又作問明之問有金不知總任意分為二而較之則庚多八兩須令辛以金還庚如庚存數三之二庚亦以金還辛如辛存數四之三則其數適均法以庚自存三分今添二分共五以辛自存四分今添三分共七通為兩家適足數之分又以多八兩半之四兩命為庚所添二分辛所添三分之較辛失之而減重故與辛同名解曰合而觀之庚以五之二辛以七之三相交易則庚多八兩若還其原數庚仍為五分辛仍為七分則適足也辛一分得二十兩七分共一百四十兩五除之得庚之一分二十八兩計開其相易庚二分五十六兩辛三分六十兩較之辛多四兩即相易幾錠之理總論曰此皆兩相交易也又與庚甲損一益一者不同凡損一益一者損庚之幾分與甲則甲有增數而轉以甲之既增者與庚之餘數相較也損庚益甲以相較是明有增損今兩相交易則損庚之分與辛亦損辛之分與庚然後以既損且增之庚與亦增之辛相較也兩相交易則末嘗明有增損但以相易之數不同而增損隱寓於其中以上四條皆同此論問兩數不知總但云取甲之九加乙則乙與甲等若取乙之九加甲則甲倍於乙其原數各若干畣曰甲六十三乙四十五解曰云取甲之九加乙是損甲之九而益乙以九也取乙之九加甲是損乙之九而益甲以九也與刋誤條所舉甲乙二倉法不同彼是取甲倉幾何以益乙而共得幾何不言與甲倉較取乙倉幾何以益甲而共得幾何亦不言與乙倉較是所益者有增數而所取者無損數如云以此之全數偕彼之幾分而共得幾何乃和數也今所列者乃較數也益此損彼則相較幾何故不同也然又與帶分條較數不同彼是取彼幾分與此全數較今所列者是取彼幾數加此而轉與彼之餘數較當細辨之又此是以數相增損而得其相較之分前數條則是以分相損增而得其相較之數二者大異不但與帶分條别也法以所加之九數命甲乙所相當之數乘之為較數列位甲倍乙是甲二乙一合之則三以乘九得二十七為較甲得此而當倍乙故與乙同名甲乙等是各一也合之則二以乘九得十八為較乙得此而與甲等故與甲同名餘乙一為法併四十五為實法一即以四十五命為乙數異加十八得六十三為甲數試更列之同減餘甲一為法異併六十三為實法一即以六十三為甲原數異加正二十七共九十乙二除之得四十五為乙原數論曰此難題設問也算法統宗收入均輸另有求法算海說詳推論借銀相當加半倍者不可通用因别立術然復未確不如用方程之為無弊又論曰甲與乙九而相等是甲多於乙者二九也乙與甲九而甲倍於乙是倍乙多於甲者三九也何也甲得乙九數而後當倍乙則倍乙中各除九數共二九而甲又添九數豈非三九乎問甲乙銀不知數但云甲借乙六錢五分則比乙一有半乙借甲六錢五分則乙與甲等各原銀若干法以甲一乙一有半併之共二半以乘六錢五分得一兩六錢二分半為乙一有半多於甲之較以甲乙相等各一併之共二以乘六錢五分得一兩三錢為甲多於乙之較乃列之同減餘半乙為法異併二兩九錢二分半為實法除實得五兩八錢五分為乙銀異加正一兩三錢共七兩一錢五分為甲銀計開甲原銀七兩一錢五分乙原銀五兩八錢五分相差一兩三錢若損甲之六錢五分以加乙則各得六兩五錢是相等也若損乙六錢五分餘五兩二錢益甲六錢五分得七兩八錢是甲之數如乙一有半也若以乙原銀加半得八兩七錢七分半以與甲原甲原銀相較則多一兩六錢二分半論曰甲以六錢五分借與乙而相等是甲原多乙兩個六錢五分也乙以六錢五分借與甲而甲如乙一有半是一個半乙原多於甲兩個半六錢五分也何也甲取乙六錢五分而後能當乙有半則此一個半乙共減去一個半六錢五分甲又加一個六錢五分豈非共差兩個半六錢五分乎又論曰此即算海說詳所設之問以駁統宗者彼自立術以為當矣不知其宜用方程也試更設問以明之今有二數不知總但云丙與丁二數則相等若丁與丙二數則丙如三丁問原數各若于依前術列位合丙丁各一共二以乘二得四為丙多於丁之較合丙一丁三共四以乘二得八為三丁多於一丙之較同減餘丙二為法異併二十為實法除實得一十為丙數同減負四餘六為丁數計開丙原數十原多於丁者四丁原數六三之則十八多於丙者八若損丙之二以益丁則各得八故相等若損丁之二以益丙則丙得十二丁得四故丙如三丁論曰丙以二與丁而等是丙多於丁者兩個二也丁以二與丙而丙如三丁是三丁之數共多於丙者四個二也何也丙增一個二其三個丁各少一個二共四個二也又論曰因算海說詳立術未確故復設此以相考用方程能合彼問而彼所立術殊不能通之此問問戊己銀不知數但戊以五十兩與己則己如戊之倍己以五十兩與戊如三己依前術列位併戊二己一共三以乘五十得一百五十為二戊多於一己之較併戊一己三共四以乘五十得二百為三己多於一戊之較同減餘己五為法異併五百五十兩為實法除實得一百一十兩為己銀異加正一百五十兩共二百六十兩戊二除之得一百三十兩為戊銀計開戊原銀一百三十兩倍之二百六十兩多於己一百五十兩己原銀一百一十兩三之得三百三十兩多於戊二百兩此列位之理戊加五十兩得一百八十兩己損五十兩得六十兩則戊如三己己加五十兩得一百六十兩戊損五十兩得八十兩則己如戊之倍此則問意問香爐二座不知重有一蓋重百兩以加甲爐則甲多於乙兩倍以加乙爐則乙多於甲一倍其爐各重若干解曰多乙兩倍是三倍也甲得蓋如三乙也多甲一倍是兩倍也乙得蓋如兩甲也法以蓋重為較而列之甲得蓋如三乙是三乙之重於甲者如蓋也故與乙同名乙得蓋如倍甲是兩甲之重於乙者如蓋也故與甲同名爐同減餘乙爐五為法較異併三百兩為實法除實得六十兩為乙爐重異加一百兩共一百六十兩甲二除之得八十兩為甲爐重計開甲爐八十兩加蓋共一百八十兩則如乙爐重者三乙爐六十兩加蓋共一百六十兩則如甲爐重者倍論曰此與前所設戊己銀數以五十兩損戊益己而己倍於戊以五十兩損己益戊而戊如二己異何也以五十兩損彼益此雖亦相差一百兩然非真有一百兩之益乃因彼之所損而合成其數耳此之加蓋則實增一百兩矣而於彼又無所損因爐蓋乃兩家公物非若戊己之銀必取諸彼以與此也故其法不同若改問各鑄爐而均鑄蓋則必於爐重各加半蓋乃合原金得數與戊己銀同矣問調兵征倭內有南北西三處兵馬南兵已知四萬其北兵為南兵與西兵二之一西兵為南兵與北兵三之一各若干法以南兵為西北之較而列之西兵得南兵而數倍於北是倍北數而多於西兵者數如南兵也北兵得南兵而數如三西兵是三其西兵而多於北者亦如南兵也餘北兵五為法並十六萬為實法除實得三萬二千為北兵數異加正四萬共七萬二千西兵三除之得二萬四千為西兵數計開南兵四萬西兵二萬四千偕南兵則六萬四千其二之一則如北兵也北兵三萬二千偕南兵則七萬二千其二之一則如西兵也論曰此與香爐借蓋為較同其所用較乃是南兵而非取於西北兵故得之有增而不得無損與借物於彼而轉與其所借之餘物相較者不同問二人擕銀不知數但減乙六兩與甲則甲倍於乙減甲三兩與乙則相等其原數若干解曰此所損益又是不同之數然其理則一故亦依前術乘其較數而列之合甲一乙二共三以乘六兩得十八兩為倍乙多於一甲之較合甲乙各一共二以乘三兩得六兩為甲多於乙之較列位同減餘乙一為法異併二十四兩為實法一即以實為乙數異加六兩為甲數計開乙二十四兩倍之得四十八兩多於甲一十八兩甲三十兩原多於乙六兩若損乙六兩得十八兩加甲六兩得三十六兩是甲如乙之倍若損甲三兩加乙三兩各得二十七兩則相等問二商各攜母銀但云取乙十二兩與甲則乙有甲六之一取甲十五兩與乙則甲有乙十之一依前術列位併六與一共七以乘十二兩得八十四兩為六乙多於一甲之較併十與一共十一以乘十五兩得一百六十五兩為十甲多于一乙之較同減餘甲五十九為法異併一千七十四兩為實法除實得一十八兩又五十九之一十二為甲數異加正八十四兩共一百二兩又五十九之一十二乙六除之得一十七兩又五十九之二為乙數計開甲銀一十八兩又五十九之一十二十之則一百八十二兩又五十九之二多於乙者一百六十五兩乙銀一十七兩又五十九之二六之則一百二兩又五十九之一十二多於甲者八十四兩若損乙一十二兩與甲則甲有三十兩又五十九之一十二乙僅有五兩又五十九之二而乙於甲為六之一若損甲一十五兩與乙則乙有三十二兩又五十九之二甲僅三兩又五十九之一十二而甲於乙為十之一以五十九通二兩得一百一十八加子二從之共一百二十是三十兩又五十九之一百二十豈非十倍於甲乎論曰乙得甲六之一是六乙當一甲也然必損乙之十二兩與甲而後成此數是於一甲中添十二兩而於六乙中各減十二兩也一添一減共七個十二兩是為八十四兩也甲得乙十之一是十甲當一乙也然必損甲之十五兩與乙而後成此數是於一乙中添十五兩而其十甲中皆各減十五兩也一添一減共十一個十五兩是為一百六十五兩也損乙之十二兩與甲而乙為甲六之一若其原數則以六乙當一甲而乙多八十四兩矣損甲之十五兩與乙而甲為乙十之一若其原數則以十甲當一乙而甲多一百六十五兩矣問有兩數不知總但損甲六數與己則甲如己四之三而多二數若以己之二十損與甲則己如甲四之三而少五數其原數各幾何法以四甲三己共七乘六得四十二又以四甲乘多二數得八而益之共五十為四甲多於三己之數損甲六益己故較與甲同名其二數甲所多也故以之益數以四己三甲共七乘二十得一百四十又以四己乘少五數得二十以相減餘一百二十為四己多於三甲之較損己二十益甲故較與己同名其五數巳所少也故以之減較己同減餘七為法異併六百三十為實法除實得九十為己原數四因己數同減一百二十餘二百四十甲三除之得八十為甲原數計開甲八十己九十以列位之理言之甲四共三百二十己三共二百七十是甲多五十甲三共二百四十己四共三百六十是己多一百二十以問之意言之甲損六數餘七十四己加六數共九十六以九十六四分之而取其三得七十二是為甲如己四之三而多二數己損二十餘七十甲加二十共一百以一百四分之而取其三得七十五是為己如甲四之三而少五數論曰以甲當己四之三是四甲當三己也然必以六數減甲增己而成則是四甲中各減六而三己中各增六共四十二也以甲當己四之三而多二數則以四甲當三己而共多八數也合而觀之此四十二者四甲多於三己之數也此八數者亦四甲多於三己之數也故皆與甲同名而列其較為五十也以己當甲四之三是四己可當三甲也然必以二十減己增甲而成則是四己中各減二十而三甲中各增二十共一百四十也以己當甲四之三而少五數則以四己當三甲而共少二十也合而觀之此一百四十者四己多於三甲之數也與己同名也而其二十者則四己少於三甲之數也與己異名也故以相減而餘者列為己同名之較也損甲六數與己而甲如己四之三仍多二數若其原數則以四甲當三己而共多五十矣損己二十與甲而己如甲四之三却少五數若其原數則以四己當三甲而共多一百二十矣問有三數損甲一百益乙則甲如乙六之二若損乙五十益丙則乙如丙十五之九若損丙三十益甲則甲如丙二之一而少五數各若干法以甲六乙二共八以乘一百共八百為六甲當二乙之較損甲益乙故與甲同名以乙十五丙九共二十四乘五十得一千二百為十五乙當九丙之較損乙益丙故與乙同名以丙一甲二共三乘三十得九十又以甲二乘少五數共十而加之共一百為一丙當二甲之較損丙益甲故與丙同名其甲所少五數即丙所多也故亦與丙同名如法遞減餘丙五十四為法異併三萬七千八百為實法除實得七百為丙數丙數同減一百餘六百甲二除之得三百為甲數六因甲數一千八百同減八百餘一千乙二除之得五百為乙數十五乘乙數得七千五百同減一千二百餘六千三百丙九除之仍得七百為丙數反覆相求列位之理著矣計開甲三百乙五百丙七百甲損一百餘二百乙增一百得六百是甲為乙六之二乙損五十餘四百五十丙增五十得七百五十是乙為丙十五之九丙損三十餘六百七十其二之一則三百三十五甲增十得三百三十是甲為丙二之一而少五數問二人共數一百原所得之數不均今以甲三之一與乙五之一相易則適均其原所得若干法以三分通甲數損一與乙而存其二分又以五分通乙數損一與甲而存其四分乃以和數列之乙七為法餘五十為實法除實得七又七之一為乙之一分以乙分母五乘之得三十五又七之五為乙數以減一百得六十四又七之二為甲數計開甲六十四又七之二其三之一為二十一又七之三其三之二為四十二又七之六乙三十五又七之五其五之四為二十八又七之四其五之一為七又七之一以甲三之一加乙五之四五十也以乙五之一加甲三之二亦五十也論曰此以分相增損而為和數亦與刋誤條甲乙二倉異彼是以其全數偕彼幾分此則以所存之餘數偕彼幾分也既云相易則實有增損非如甲乙倉虛借增率而無損也問二人物數不均若於甲取三之一於乙取四之一以和合而平分之以湊原存數則各五十而適均其原數各若干法以三分通甲數而倍之為六分損其一與乙餘五分以四分通乙數而倍之為八分損其一與甲餘七分以和數列位解曰以四之一與三之一和合而平分之是各取其數之半也於三之一取其半是六之一以與乙而甲餘其五也於四之一取其半是八之一以與甲而乙餘其七也偏乘對減以得法實法除實得五又十七分之十五為乙八之一以乙分母八乘之得四十七又十七分之一為乙原數以兩五十共一百減乙原數餘五十二又十七分之一十六為甲原數計開甲原數五十二又十七分之十六三除之得十七又十七分之十一為甲三之一以三之一轉減甲餘三十五又十七分之五為甲所存三之二乙原數四十七又十七分之一四除之得十一又十七分之十三為乙四之一以四之一轉減乙餘三十五又十七分之五為乙所存四之三以甲三之一乙四之一和合之共二十九又十七分之七半之得十四又十七分之十二為和合平分之數以加甲乙存數各得五十論曰甲去三之一乙去四之一所存之數已均矣故以平分之數加之而適均又法以甲分母三通甲為三分以乙分母四通乙為四分又總計各得五十六共一百為和數以甲取三之一餘三之二乙取四之一餘四之三命為適足甲取三之一乙取四之一以和合平分而等則其所存者亦等也故命之適足乃以和較雜列位如法乘甲同減盡乙異併一十七分為法正二百無減就為實法除實得一十一又十七之十三為乙之一分以分母四乘之得四十七又十七分之一為乙原數以乙原數減共數一百餘五十二又十七分之十六按此所得與前無異而較捷故並存之問甲乙丙三人共博甲贏乙金二之一乙贏丙金三之一丙又贏甲金四之一事畢各剩金七百其原携金若干法以各分母通其原數又各減其贏去之一而列之以七百為和數和數列位如法減併丙七分為法二千一百為實法除實得三百為丙之一分以丙分母三乘之得九百為丙原金以丙之一分減乙剩七百餘四百為乙所餘二之一二因之得八百為乙原金以乙二之一減甲剩金七百餘三百為甲自剩四之三三除之得一百為甲三之一四乘之得四百為甲原金計開甲原金四百加贏乙四百二之一也共八百除丙又贏去甲一百四之一也仍餘七百乙原金八百加贏丙三百三之一也共一千一百甲贏去四百乙二之一也仍餘七百丙原金九百贏甲一百四之一也共一千乙贏去三百丙三之一也亦仍餘七百論曰此與刋誤條騾馬遞借一匹同但馬一騾二驢三即是原物偕所借之一而為和數今乙一丙二甲三却是各所存之餘分偕所贏之一分而為和數也得數大異者馬騾即是全數今則用分故丙之全數轉多於乙若以一分計則乙之分自多於丙如馬力之於騾矣又論曰此三條皆是兩相交易而又是和數與前數條金銀交易幾錠不同難題歌曰一條竿子一條索索比竿子長一托雙折索子去量竿却比竿子短一托解曰一托者五尺也法以零整雜列位因雙折是二之一故以二通索法一即以實一丈命為繩之一分分母二因之得繩長二丈減負五尺餘得竿長一丈五尺假如有繩長不知數但云比竿長六尺若三折其繩則短於竿八尺法二除實三丈得竿長一丈五尺加正六尺得繩長二丈一尺論曰原法别有求法然不如方程穩捷故作此問以明之若用難題法不能通矣故方程能御雜法而雜法不能御方程此條統宗原入均輸今改正問井不知深先將繩折作三條入井汲永繩長四尺復將繩折作四條入井亦長一尺其井深繩長各若干法以兩母三四相乘得十二分為繩母數以母三四互乘其子之一之一得四三是為以繩十二分之四汲水而長四尺以繩十二分之三汲水而長一尺也餘一分為法即以實三尺命為繩十二分之一以十二分乘一分得三十六尺為繩長以繩之三分計九尺同減負一尺得八尺為井深計開井深八尺繩長三十六尺三折之得一十二尺比井多四尺四折之得九尺比井多一尺論曰此條原屬盈朒今以方程御之尤簡易故曰方程能御雜法也試更之則先得井深法一省除即以八尺命為井深加正四尺共十二尺繩之四分除之得三尺為一分一十二分母乘之得繩長三十六尺論曰此餘八尺者即物實也前以餘三尺為繩長實者即人實即此可悟盈朒章作法之原要之是二色方程法耳人實物實不同而除法則同故皆可以互求今有絹一匹欲作帳幅先摺成六幅比舊帳長六寸改折作七幅却又短四寸其絹併舊帳幅各長若干折作六幅以較長即六之一七幅即七之一法如前以六七幅相乘得四十二分為總母以六七互乘其之一之一得之七分之六分為所用之分而列之以絹四十二之七則長於帳六寸短以絹四十二之六則於帳四寸為較數法一實一尺即為絹之一分以分母四十二乘之得絹長四丈二尺以絹之七分計七尺減負六寸餘六尺四寸為舊帳之長計開舊帳幅六尺四寸絹長四丈二尺均作六幅得七尺比帳長六寸均作七幅得六尺比帳短四寸論曰此與井不知深皆是以一物之細分與一整物較皆零整雜用之法也又以上三條盈朒章舊有求法然皆因所較之井深與舊帳幅皆為一數而不變故可用盈朒之法若亦有分數不同則非盈朒所能御此方程之用能包盈朒諸法而諸法不能御方程今有臺不知髙從上以繩縋而度之及臺三之二而餘六尺雙折其繩度之及臺之半而不足三尺問臺之髙及繩之長若何法以臺三二之二一用母相乘為母之法通臺為六分又用母互乘子為子之法變臺三之二為六之四臺之半為六之三又以雙折通繩為二皆以化整為零而列之餘繩二分為法併三十尺為實因二為分母與法同省除與乘徑以實三十尺為繩長減負六尺餘二十四尺以臺之四分除之母六乘之得三十六尺為臺髙計開臺髙三十六尺繩長三十尺臺三之二髙二十四尺以繩度之餘六尺臺之半髙一十八尺以半繩一十五尺比之短三尺今有井不知深以乙繩汲之餘繩二尺以庚繩汲之亦餘繩四尺雙折庚繩三折乙繩以相續而汲之適足問井深及二繩各長若何法以乙繩通為三庚繩通為二以三色列之井整數乙庚用分以隔行之同名仍為較數列之餘較皆與庚同名餘庚一分為法即以實一丈命為庚二之一倍之得庚繩二丈減負二尺得乙繩一丈八尺用減餘之右行蓋乙正三即全數也又減負二尺得井深一丈六尺用原列之右行亦以乙負三即全數故計開井深一丈六尺乙繩一丈八尺比井多二尺庚繩二丈比井多四尺三折乙繩六尺加雙折庚繩一丈共一丈六尺即同井深論曰此二條與前井深絹帳同理然即非盈朒所能御又按田之橫直亦可以繩折比量水面亦然今有直田欲截一段之積只云截長六步不足積七步截長八步又多積九步問所截之積及原濶法以較數列之其原濶即截長每一步之積上中下長二步除積十六步得原濶八步以截長六步乘濶得四十八步加不足七步得截積五十五步論曰此盈朒中方田也然無關於方田之實用故入盈朒然不知宜入方程也試更作問今有方田欲截橫頭之積改為直田但云截濶五步則不足十二步截濶九步則如所截之積一有半問所截直田積并原田之方如法列位濶一步半為法積十八步為實法除實得原方一十二步以濶五步乘方得六十步加不足十二步得截直田七十二步計開原方田方十二步積一百四十四步截直田七十二步宜截濶六步若此條則盈朒不能御今有米換布七匹多四斗換九匹適足問原米若干及布價法列位上中下布二匹為法四斗為實法除實得布價每匹二斗以九匹適足乘布價得原米一石八斗論曰此盈朒中粟布法也試更設問今有榖換絹十匹餘三石以榖之半換絹六匹不足五斗問原榖若干及絹價法列位法一免除得絹每匹價二石以十匹乘價加餘三石得原穀二十三石若此條則非盈朒所能御論曰直田截積及米換布盈朒本法也愚所設方田截積及穀換絹非盈朒本法也乃帶分盈朒之變例也如舊法芝麻糶銀是其例也雖盈胸亦有求法頗多轉折非其質矣不如用方程之省約今有芝麻不知總但云取麻八分之三糶銀十兩不足二石取麻三分之一糶銀八兩適足問原麻總數及每銀一兩之麻法先以麻八三之三之一用母相乘得二十四為母母互乘子得之九之八為所用之分而列之依省算左加九之一而徑減法一兩省除即以麻二石命為銀每兩之麻以銀八兩麻八分適足省乘除徑以二石為麻之一分以二十四分乘得原麻四十八石計開原麻四十八石銀每兩麻二石其八之三計一十八石銀十兩該二十石故不足二石其三之一計一十六石銀八兩恰該一十六石故適足若問麻每石之銀則以二石為法轉除一兩得每石價五錢按此條宜入方程舊列帶分盈胸之末問者若云有銀買麻以麻八之三與之則餘二石以麻三之一與之適足問原麻及銀所買依法求得二石為麻之一分以總母草四分乘之得原麻四十八石以九分乘二石減負二石得銀所買麻十六石論曰此所設問則盈朒帶分本法也然不能知每價以方程法求之亦同觀此益見前條之宜入方程也今有黃連木香不知數但云取連三之一換木香七之二則連多二斤取連四之三換木香五之四則連少一斤若於五之四內減去木香三斤則連多一斤法先以通分齊其分乃列位如法乘減餘木香二十二分為法異併黃連二十二斤為實法除實得每木香一分即三十五分之一換黃連一斤以木香十分換黃連十斤異加正二斤共十二斤以黃連正四分除之得黃連每三斤為一分以分母十二乘之得總黃連三十六斤另併黃連多一斤少一斤共二斤為法除減木香三斤得每黃連一斤換木香一斤半原少連一斤減木香三斤而轉多連一斤故知其數此連所換之木香一斤半即其三十五分之一分也以三十五分乘之得木香五十二斤半計開黃連三十六斤木香五十二斤半每黃連一斤換木香一斤半三分三十六斤而取其一得一十二斤為黃連三之一七分五十二斤半而取其二得十五斤為木香七之二該換連十斤今連有十二斤是連多二斤也四分三十六斤而取其三得二十七斤為黃連四之三五分五十二斤半而取其四得四十二斤為木香五之四該換連二十八斤今連只二十七斤是連少一斤也若於木香五之四減三斤餘三十九斤該換連二十六斤今連有二十七斤是連多一斤也論曰凡較數方程有若干物共幾色又有其所較之價銀若錢之類今所用較數即用其物之斤兩而無銀若錢微有不同乃古者貿遷有無交易之術也專用銀若錢以權物價後世事耳問綾每尺多羅價三十六文今買綾六尺羅八尺其共價綾比羅少三十六文畣曰綾每尺一百六十二文羅每尺一百二十六文羅二尺除二百五十六尺得羅價每尺一百二十六文加多三十六文得綾價每尺一百六十二文問銀二千九百二十八兩買綾一百五十匹羅三百匹絹四百五十匹只云綾每匹比羅多四錢七分羅每匹多絹一兩三錢五分畣曰綾每匹四兩三錢二分羅每匹三兩八錢五分絹每匹二兩半絹九百匹為法除實二千二百五十兩得絹價二兩五錢加多一兩三錢半得羅價三兩八錢半又加多四錢七分得綾價四兩三錢二分今有兄弟三人不知年小弟謂長兄曰我年比汝四之三次兄比汝六之五比我多八歲法以帶分别之皆變零從整季弟二除一百四十四歲得年七十二歲加八歲得仲兄年八十六因仲年五除之得伯年九十六歲計開伯九十六歲仲八十歲為伯年六之五季七十二歲為伯年四之三今有四人分錢但云乙得甲六之五丙得甲四之三丁得甲二十四之十七其丁與丙差四文甲正五乙負六空空適足此行不用乙無對故也丁四除二百七十二得丁錢六十八文加四文得丙錢七十二文四乘丙錢三除之得甲錢九十六文五乘甲錢六除之得乙錢八十文計開甲九十六文乙八十文丙七十二文丁六十八文甲六之一得一十六以五因得八十文為六之五乙數也甲四之一得二十四以三因得七十二為四之三丙數也甲二十四之一得四以一十七因得六十八為二十四之一十七丁數也論曰此雖四色實三色也故徑以三色取之今有七人遞差分錢但知首二人共七十七文次二人共六十五文不知各數亦不知餘人數法以遞差故知倍乙當甲丙倍丙當乙丁而列之重列減餘與三行減餘變較重列減餘與四行丁八為法除實二百四十八文得三十一文為丁數倍丁數與六十五文相減得遞差三文以差遞加得甲乙丙數以差遞減得戊己庚數皆加減丁數得之計開甲四十文乙三十七文丙三十四文丁三十一文戊二十八文己二十五文庚二十二文今有銀二百四十兩以四人遞差分之只云甲多丁一十八兩如前法以倍乙當甲丙倍丙當乙丁又依省算移甲於丁位和較列位重列兩減餘又重列減餘與末行甲四除二百七十六兩得甲數六十九兩甲數內減十八兩得丁數五十一兩以甲數減二百四十兩餘一百七十一兩丙三除之得丙數五十七兩併丙數甲數一百草六兩半之得乙數六十三兩計開甲六十九兩乙六十三兩丙五十七兩丁五十一兩遞差六兩今有米二百四十石五人遞差分之其甲乙二人與戊丁丙三人共數等如前法列位依省算倒甲位自下而上重列減餘與三行又重列減餘與四行又重列減餘與末行甲十五除九百六十得甲數六十四石倍甲數減一百草石餘得遞差八石以差遞減各數得乙丙丁戊數計開細分之遞差八石論曰凡差分章竹筒七節盛米之類皆可以此法求之兹不煩列厯算全書卷四十五
