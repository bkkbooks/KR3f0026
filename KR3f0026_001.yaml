body:
  text: 厯算全書巻一宣城梅文鼎撰厯學疑問一論厯學古疏今密問三代典制厄於秦火故儒者之論謂古厯宜有一定不變之法而不可復考後之人因屢變其法以求之葢至於今日之宻合而庶幾克復古聖人之舊非古疏而今密也曰聖人言治厯明時盖取於革故治厯者當順天以求合不當為合以驗天若預為一定之法而不隨時修改以求無弊是為合以驗天矣又何以取於革乎且吾嘗徴之天道矣日有朝有禺有中有昃有夜有晨此厯一日而可知者也月有朔有生明有弦有望有生魄有下弦有晦此厯一月而可知者也時有春夏秋冬晝夜有永短中星有推移此歴一嵗而可知者也乃若熒惑之周天則厯二年嵗星則十二年土星則二十九年皆約整數夫至于十二年二十九年而一周已不若前數者之易見矣又其毎周之間必有過不及之餘分所差甚㣲非厯多周豈能灼見乃若嵗差之行六七十年始差一度厯二萬五千餘年而始得一周雖有期頤上夀所見之差不過一二度亦安從辨之迨其厯年既乆差數愈多然後共見而差法立焉此非前人之智不若後人也前人不能預見後来之差數而後人則能盡考前代之度分理愈乆而愈明法愈修而愈密勢則然耳問者曰若是則聖人之智有所窮歟曰使聖人為一定之法則窮矣惟聖人深知天載之無窮而不為一定之法必使隨時修改以求合天是則合天下萬世之聰明以為其耳目聖人之所以不窮也然則厯至今日而愈密者皆聖人之法之所該矣論中西二法之同問者曰天道以乆而明厯法以修而密今新厯入而盡變其法以從之則前此之積候舉不足用乎曰今之用新厯也乃兼用其長以補舊法之未備非盡廢古法而従新術也夫西厯之同乎中法者不止一端其言日五星之最髙加減也即中法之盈縮厯也在太隂則遲疾厯也其言五星之嵗輪也即中法之段目也遲留逆伏其言恒星東行也即中法之嵗差也其言節氣之以日躔過宫也即中法之定氣也其言各省直節氣不同也即中法之里差也但中法言盈縮遲疾而西説以最髙最卑明其故中法言段目而西説以嵗輪明其故中法言嵗差而西説以恒星東行明其故是則中厯所著者當然之運而西厯所推者其所以然之源此其可取者也若夫定氣里差中厯原有其法但不以註厯耳非古無而今始有也西厯始有者則五星之緯度是也中厯言緯度惟太陽太隂有之太陽出入于赤道其緯二十四度太隂出入于黄道其緯六度而五星則未有及之者今西厯之五星有交㸃有緯行亦如太陽太隂之詳明是則中厯缺陷之大端得西法以補其未備矣夫於中法之同者既有以明其所以然之故而于中法之未備者又有以補其缺于是吾之積候者得彼説而益信而彼説之若難信者亦因吾之積候而有以知其不誣雖聖人復起亦在所兼收而亟取矣論中西之異問今純用西法矣若子之言但兼用其長耳豈西法亦有大異于中而不可全用抑吾之用之者猶有未盡歟曰西法亦有必不可用者則正朔是也中法以夏正為嵗首此萬世通行而無弊者也西之正朔則以太陽㑹恒星為嵗其正月一日定于太陽躔斗四度之日而恒星既東行以生嵗差則其正月一日亦屢變無定故在今時之正月一日定于冬至後十一日溯而上之可七百年則其正月一日在冬至日矣又溯而上之七百年又在冬至前十日矣由今日順推至後七百年則又在冬至後二十日矣如是不定安可以通行乎此徐文定公造厯書之時棄之不用而亦畧不言及也然則自正朔外其餘盡同乎曰正朔其大者也餘不同者尚多試畧舉之中法歩月離始于朔而西法始于望一也中法論日始子半而西法始午中二也中法立閏月而西法不立閏月惟立閏日三也黄道十二象與二十八舍不同四也餘星四十八象與中法星名無一同者五也中法紀日以甲子六十日而周西法紀日以七曜凡七日而周六也中法紀嵗以甲子六十年而周西法紀年以以總積六千餘年為數七也中法節氣起冬至而西法起春分八也以上數端皆今厯所未用徐文定公所謂鎔西算以入大綂之型模葢謂此也就中推閏日用之於恒表積數而不廢閏月猶弗用也其總積之年厯指中偶一舉之而不以紀嵗論今法于西厯有去取之故問者曰皆西法也而有所棄取何也曰凡所以必用西法者以其測算之精而己非好其異也故凡最高卑加減黄道經緯之屬皆其測算之根而不得不用者也若夫測算之而既合矣則紀日于午何若紀于子之善也紀月于朢何若紀于朔之善也四十八象十二象之星名與三垣二十八宿雖離合不同而其星之大小逺近在天無異也又安用此紛紛乎此則無闗于測算之用者也乃若正朔之頒為國家禮樂刑政之所出聖人之所定萬世之所遵行此則其必不可用而不用者也又何惑焉論囘囘厯與西洋同異問囘囘亦西域也何以不用其厯而用西洋之厯曰囘囘厯與歐羅巴即西洋厯同源異派而踈宻殊故囘囘厯亦有七政之最髙以為加減之根又皆以小輪心為平行其命度也亦起春分其命日也亦起午正其算太隂亦有第一加減第二加減算交食三差亦有九十度限亦有影徑分之大小亦以三百六十整度為周天亦以九十六刻為日亦以六十分為度六十秒為分而逓析之以至於㣲亦有閏日而無閏月亦有五星緯度及交道亦以七矅紀日而不用干支其立象也亦以東方地平為命宫其黄道上星亦有白羊金牛等十二象而無二十八宿是種種者無一不與西洋同故曰同源也然七政有加減之小輪而無均輪太隂有倍離之經差加減而無交均之緯差故愚嘗謂西厯之於囘囘猶授時之於紀元統天其踈密固較然也然在洪武間未嘗不密其西域大師馬哈麻馬沙亦黒頗能精于其術但深自秘惜又不著立表之根後之學者失其本法之用反借大統春分前定氣之日以為立算之基何怪其乆而不效耶然其法之善者種種與西法同今用西法即用囘囘矣豈有所取舎於其間哉按囘囘古稱西域自明鄭和奉使入洋以其非一國槩稱之曰西洋厥後歐羅巴入中國自稱大西洋謂又在囘囘西也今厯書題曰西洋新法盖囘囘厯即西洋舊法耳論中舉新法皆曰歐羅巴不敢混稱西洋所以别之也論回回厯厯元用截法與授時同問論者謂回回厯元在千餘年之前故乆而不可用其説然歟曰回回厯書以隋開皇己未為元謂之阿刺必年然以法求之實用洪武甲子為元而托之于開皇己未耳何以知之盖回回厯有太陽年太隂年自洪武甲子逆溯開皇己未距算七百八十六此太陽年也而回囘厯立成所用者太隂年也回回厯太隂年至第一月一日與春分同日之年則加一嵗約為三十二三年而積閏月十二所謂應加次數也然則洪武甲子以前距算七百八十六年當有應加閏月之年二十四次而今不然即用距算查表至八百一十七算之時始加頭一次然則此二十四个閏年之月日將何所歸乎故知其即以洪武甲子為元也惟其然也故其總年立成皆截從距開皇六百年起其前皆缺盖皆不用之數也然則何以不竟用七百八十算為立成起處而用六百年曰所以塗人之耳目也又最髙行分自六百六十算而變以前則漸減以後則漸増其減也自十度以至初度其増也又自初度而漸加此法中厯所無故存此以見意也初度者盖指巨蠏初㸃惟六百六十算之年最髙與此㸃合以嵗計之當在洪武甲子年前一百二十六算其前漸減者盖是未到巨蠏之度故漸減也由是言之其算宫分雖以開皇己未為元而其查立成之根則在己未元後二十四年即立成所謂一年既退下二十四年故此二十四次應加之數可以不加自此以後則皆以春分所入月日挨求亦可不必細論惟至閏滿十二個月之年乃加一次此其巧㨗之法也然則其不用積年而截取現在為元者固與授時同法矣論天地人三元非回回本法問治回回厯者謂其有天地人三元之法天元謂之大元地元謂之中元人元謂之小元而以己未為元其簡法耳以子言觀之其説非歟曰天地人三元分算乃吳郡人陳壤所立之率非回回法也陳星川名壤袁了凡師也嘉靖間曽上疏改厯而格不行其説謂天地人三元各二千四百一十九萬二千年今嘉靖甲子在人元己厯四百五十六萬六千八百四十算所以為此迂逺之數者欲以求太乙數之周紀也按太史王肯堂筆廛云太乙多不能算厯故以厯法求太乙多不合惟陳星川之太乙與厯法合然其立法皆截去萬以上數不用故各種立成皆止于千其為虚立無用之數可知矣夫三式之有太乙不過占家一種之書初無闗于厯算乂其立法以六十年為紀七十二年為元五元則三百六十年謂之周紀純以干支為主而西域之法不用干支安得有三元之法乎今天地人三元之數現在厯法新書初未嘗言其出於回回也盖明之知回回厯者莫精于唐荆川順之陳星川壤兩公而取唐之説以成書者為周雲淵述學述陳之學以為書者為袁了凡黄然雲淵厯宗通議中所述荆川精語外别無發眀有厯宗中經余未見而荆川亦不知最髙為何物唐荆川曰要求盈縮何故減那最髙行度只為嵗差積乆年年欠下盈縮分數以此補之云云是未明厥故也若雲淵則直以毎日日中之晷景當最髙尤為臆説矣了凡新書通回回之立成于大統可謂苦心然竟削去最髙之算又直用大統之嵗餘而棄授時之消長將逆推數百年亦已不效况數千萬年之乆乎人惟見了凡之書多用回回法遂誤以為西域土盤本法耳又若薛儀甫鳳祚亦近日西學名家也其言囘囘厯乃謂以己未前五年甲寅為元此皆求其説不得而強為之解也總之回回厯以太隂年列立成而又以太陽年查距算巧藏其根故雖其專門之裔且不能知無論他人矣查開皇甲寅乃回教中所𫝊彼國聖人辭世之年故用以紀嵗非厯元也薛儀甫盖以此而誤論回回厯正朔之異問回回厯有太陽年又有太隂年其國之紀年以何為定乎曰回回國太隂年謂之動的月其法三十年閏十一日而無閏月惟以十二个月為一年無閏則三百五十四日有閏則三百五十五日故遇中國有閏月之年則其正月移早一月如首年春分在第一月遇閏則春分在第二月而移其春分之前月為第一月故曰動的月其太陽年則謂之不動的月其法以一百二十八年而閏三十一日皆以太陽行三十度為一月即中厯之定氣其白羊初即為第一月一日嵗嵗為常故曰不動的月也然其紀嵗則以太隂年而不用太陽年此其異于中厯而并異于歐羅巴之一大端也然又有異者其毎嵗齋月又不在第一月而在第九月滿此齋月至第十月一日則相賀如正旦焉不特此也其所謂月一日者又不在朔不在朢而在哉生明之後一日其附近各國皆然瀛涯勝覽諸書可考而知也馬歡瀛涯勝覽曰占城國無閏月但十二月為一年晝夜分為十更用鼓打記又曰阿丹國無閏月氣候温和常如八九月惟以十二個月為一年月之大小若頭夜見新月明日即月一也又曰榜葛刺國亦無閏月以十二個月為一年按馬歡自稱㑹稽山樵曽従鄭和下西洋故書其所見如此盖其國俱近天方故風俗並同其言月一者即月之第一日在朔後故不言朔厥後張昇改其文曰以月出定月之大小夜見月明日又為一月也文句亦通然非月一字義也又按一統志天方國古筠冲之地舊名天堂又名西域有回回厯與中國前後差三日葢以見新月之明日為月之一日故差三日又按素問云一晝一夜五分之隋志云晝有朝有禺有中有晡有夕夜有甲乙丙丁戊則晝夜十更之法中法舊有之又熊䃪石島夷志曰舶舟視旁羅之針羅羅處甚幽密惟開小扄直舵門燈長燃不分晝夜夜五更晝五更合晝夜十二辰為十更其針路悉有譜按此以十更記程而百刻匀分不論冬夏長短與記里鼓之意略同若素問隋志所云則以日出入為斷而晝夜有長短更法因之而變兩法㣲别占城用鼔打記不知若何要不出此二法論夏時為堯舜之道問古有三正而三王迭用之則正朔原無定也安在用太隂年用恒星年之為非是乎曰古聖人之作厯也以敬授民時而已天之氣始於春盛於夏斂於秋伏藏於冬而萬物之生長收藏因之民事之耕耘收穫因之故聖人作厯以授民時而一切政務皆順時以出令凡郊社禘嘗之禮五祀之祭蒐苗獮狩之節行慶施惠决獄治兵之典朝聘之期飲射讀法勸耕省斂土功之事洪纎具舉皆於是乎在故天子以頒諸侯諸侯受而藏諸祖廟以毎月告朔而行之厯之重葢如是也而顧使其游移無定何以示人遵守乎如回回厯則毎二三年而其月不同是春可為夏夏可為冬也如歐羅巴則毎七十年而差一日積之至乆四時亦可互為矣是故惟行夏之時斯為堯舜之道大中至正而不可易也然則又何以有三正曰三正雖殊而以春為民事之始則一也故建丑者二陽之月也建子者一陽之月也先王之於民事也必先時而戒事猶之日出而作而又曰鷄鳴而起中夜以興云爾豈若毎嵗遷徙如是其紛紛者哉雖其各國之風俗相沿而不自覺然以數者相較而孰為正大孰為煩碎則必有辨矣論語行夏之時古註云據見萬物之生以為四時之始取其易知論西厯亦古疏今宻問中厯古疏今密實由積候固己西厯則謂自古及今一無改作意者其有神授歟曰殆非也西法亦由積候而漸至精密耳隋以前西厯未入中國其見於史者在唐為九執厯在元為萬年厯在明為回回厯在本朝為西洋厯新法然九執厯課既疏逺唐大衍厯既成而一行卒瞿曇怨不得與改厯事訟於朝謂大衍寫九執厯未盡其法詔厯官比驗則九執厯課最䟽萬年厯用亦不乆元太祖庚辰西征西域厯人奏五月朢月當蝕耶律楚材曰否卒不蝕明年十月楚材言月當蝕西域人曰不蝕至期果蝕八分世祖至元四年西域札瑪魯丹撰進萬年厯世祖稍頒行之至十八年改用授時厯回回厯明用之三百年後亦漸䟽明洪武初設回回司天臺于雨花臺尋罷回回司天監設回回科𨽻欽天監毎年西域官生依其本法奏進日月交蝕及五星凌犯等厯歐羅巴最後出而稱最精豈非後勝於前之明驗歟諸如厯書所述多禄某之法至歌白泥而有所改訂歌白泥之法至地谷而大有變更至於地谷法畧備矣而逺鏡之製又出其後則其為累測益精大畧亦如中法安有所謂神授之法而一成不易者哉是故天有層數西法也而其説或以為九重或以為十二重今則以金水太陽共為一重矣又且以火星冲日之時比日更近而在太陽天之下則九重相裹如葱頭之説不復可用矣太陽大於地西説也而其初説日徑大於地徑一百六十五倍竒今只筭為五倍竒兩數相懸不啻霄壤矣太陽最髙卑嵗嵗東移西法也然先定二至後九度後改定為六度今復移進半度為七度竒矣又何一非後来居上而謂有神授不由積驗乎渾盖通憲定奥日在巨蠏九度即最髙也其時為萬厯丁未在戊辰厯元前二十年是利西泰所定厥後厯書定戊辰年最髙衝度在冬至後五度五十九分五十九秒以較萬厯丁未所定之奥日凡改退三度有竒是徐文定公及湯羅諸西士所定今康熙永年厯法重定康熙戊午髙衝在冬至後七度四分四秒以較厯書二百恒年表原定戊午髙衝六度三十七分二十九秒凡移進二十六分三十五秒其書成於厯書戊辰元後五十年是治理厯法南懐仁所定論地圎可信問西人言水地合一圓球而四面居人其地度經緯正對者兩處之人以足版相抵而立其説可信歟曰以渾天之理徴之則地之正圓無疑也是故南行二百五十里則南星多見一度而北極低一度北行二百五十里則北極髙一度而南星少見一度若地非正圎何以能然至於水之為物其性就下四面皆天則地居中央為最下水以海為壑而海以地為根水之附地又何疑焉所疑者地既渾圎則人居地上不能平立也然吾以近事徴之江南北極髙三十二度浙江髙三十度相去二度則其所戴之天頂即差二度江南天頂去北極五十八度浙江天頂去北極六十度各以所居之方為正則遥㸔異地皆成斜立又况京師極髙四十度瓊海極髙二十度京師以去北極五十度之星為天頂瓊海以去北極七十度之星為天頂若自京師而觀瓊海其人立處皆當傾跌瓊海望京師亦復相同而今不然豈非首戴皆天足履皆地初無欹側不憂環立歟然則南行而過赤道之表北逰而至戴極之下亦若是已矣是故大戴禮則有曽子之説大戴禮單居離問於曽子曰天圓而地方誠有之乎曽子曰如誠天圓而地方則是四角之不揜也參嘗聞之夫子曰天道曰圓地道曰方内經則有岐伯之説内經黄帝曰地之為下否乎岐伯曰地為人之下太虚之中也曰憑乎曰大氣舉之也素問又曰立于子而面午立于午而面子皆曰北面立于午而負子立于子而負午皆曰南靣釋之者曰常以天中為北故對之者皆南也宋則有邵子之説邵子觀物篇曰天何依曰依地地何附曰附天曰天地何所依附曰自相依附程子之説程明道語録曰天地之中理必相直則四邊當有空闕處地之下豈無天今所謂地者特於天中一物爾又曰極須為天下之中天地之中理必相直今人所定天體只是且以眼定視所極處不見遂以為盡然向曽有于海上見南極下有大星數十則今所見天體葢未定以土圭之法騐之日月升降不過三萬里中然而中國只到鄯善莎車已是一萬五千里就彼觀日尚只是三萬里中也地圓之説固不自歐邏西域始也元西域札瑪魯丹造西域儀像有所謂庫哩葉阿喇斯漢言地里志也其製以木為圓毬七分為水其色緑三分為土地其色白畫江河湖海貫串於其中畫作小方井以計幅員之廣袤道里之逺近此即西説之祖論葢天周髀問有圓地之説則里差益明而渾天之理益著矣古乃有葢天之説殆不知而作者歟曰自揚子雲諸人主渾天排葢天而葢説遂詘由今以觀固可並存且其説實相成而不相悖也何也渾天雖立兩極以言天體之圓而不言地圎直謂其正平焉耳若葢天之説具於周髀其説以天象盖笠地法覆槃極下地髙滂沲四隤而下則地非正平而有圓象明矣故其言晝夜也曰日行極北北方日中南方夜半日行極東東方日中西方夜半日行極南南方日中北方夜半日行極西西方日中東方夜半凡此四方者晝夜易處加四時相及此即西厯地有經度以論時刻早晚之法也其言七衡也曰北極之下不生萬物北極左右夏有不釋之冰中衡左右冬有不死之草五榖一嵗再熟凡北極之左右物有朝生暮穫趙君卿注曰北極之下從春分至秋分為晝從秋分至春分為夜即西厯以地緯度分寒煖五帶晝夜長短各處不同之法也使非天地同為渾圎何以能成此算周髀本文謂周公受于商髙雖其詳莫攷而其説固有所本矣然則何以不言南極曰古人著書皆詳於其可見而略於所不見即如中高四下之説既以北極為中矣而又曰天如倚盖是亦即中國之所見擬諸形容耳安得以辭害意哉故寫天地以圓器則葢之度不違於渾圖星象于平楮則渾之形可存於葢唐一行善言渾天者也而有作葢天圗法元郭太史有異方渾蓋圗今西厯有平渾儀皆深得其意者也故渾蓋之用至今日而合渾蓋之説亦至今日而合渾蓋之説亦至今日而益明元札馬魯丁西域儀象有兀速都兒刺不定漢言晝夜時刻之器其製以銅如圓鏡而可掛面刻十二辰位晝夜時刻上加銅條綴其中可以圓轉銅條兩端各屈其首為二竅以對望晝則視日影夜則窺星辰以定時刻以則休咎背嵌鏡片二面刻其圗凡七以辨東西南北日影長短之不同星辰向背之有異故各異其圖以盡天地之變焉按此即今渾盖通憲之製也以平詮渾此為最著論周髀儀器問若是則渾盖通憲即盖天之遺製歟抑僅平度均布如唐一行之所云耶曰皆不可考矣周髀但言笠以寫天天青黒地黄赤天數之為笠也赤黒為表丹黄為裏以象天地之位此盖寫天之器也今雖不𫝊以意度之當是圓形如笠而圖度數星象于内其勢與仰觀不殊以視平圗渾象轉為親切何也星圗強渾為平則距度之䟽密改觀渾象圖星於外則星形之左右易位若寫天於笠則其圓勢屈而向内星之經緯距皆成弧度與測筭脗合勝平圗矣又其星形必在内面則星之上下左右各正其位勝渾象矣論厯元問造厯者必先立元元正然後定日法法立然後度周天古厯數十家皆同此術至授時獨不用積年日法何歟曰造厯者必有起算之端是謂厯元然厯元之法有二其一逺溯初古為七曜齊元之元自漢太初至金重修大明厯各所用之積年是也其一為截算之元自元授時不用積年日法直以至元辛巳為元而今西法亦以崇禎戊辰為元是也二者不同然以是為起算之端一而已矣則二者無優劣乎曰授時優夫所謂七曜齊元者謂上古之時嵗月日時皆㑹甲子而又日月如合璧五星如連珠故取以為造厯之根數也使其果然雖萬世遵用可矣乃今卄一史中所載諸家厯元無一同者是其積年之乆近皆非有所受之於前直以巧算取之而已然謂其一無所據而出于胸臆則又非也當其立法之初亦皆有所驗于近事然後本其時之所實測以旁證於書𫝊之所𫝊約其合者既有數端遂援之以立術于是溯而上之至於數千萬年之逺庶幾各率可以齊同積年之法所由立也然既欲其上合厯元又欲其不違近測畸零分秒之數必不能齊勢不能不稍為整頓以求巧合其始也據近測以求積年其既也且將因積年而改近測矣又安得以為定法乎授時厯知其然故一以實測為憑而不用積年虛率上考下求即以至元十八年辛巳嵗前天正冬至為元其見卓矣按唐建中時術者曺士蔿始變古法以顯慶五年為上元雨水為嵗首號符天厯行於民間謂之小厯又五代石晉髙祖時司天監馬重績造調元厯以唐天寳十四載乙未為上元用正月雨水為氣首此二者亦皆截筭之法授時厯葢采用之耳然曺馬二厯未嘗密測逺徴不過因時厯之率截取近用若郭太史則製器極精四海測驗者二十七所又上考春秋以来至于近代然後立術非舍難而就易也又按孟子千嵗日至趙注只云日至可知其日孫奭疏則直云千嵗以後之日至可坐而定初不言立元論西法積年問厯元之難定以嵗月日時皆㑹甲子也若西厯者初不知有甲子何難溯古上元而亦截自戊辰歟曰西人言開闢至今止六千餘年是即其所用積年也然厯書不用為元者何也既無干支則不能合於中法一也又其法起春分與中法起冬至不同以求上古積年畢世不能相合二也且西書所𫝊不一其積年之説先有參差三也故截自戊辰為元亦鎔西算入中法之一事葢立法之善雖巧算不能違矣天地儀書自開闢至崇禎庚辰凡五千六百三十餘年聖經直解開闢至崇禎庚辰凡六千八百三十六年通雅按諸太西云自開闢至崇禎甲申六千八百四十年依所製稽古定儀推之止五千七百三十四年月離厯指曰崇禎戊辰為總期之六千三百四十一年天文實用云開闢初時適當春分又云中西皆以角為宿首因開闢首日昬時角為中星也今以恒星本行逆推約角宿退九十度必為中星計年則七千矣與聖經紀年合開闢至洪水天地儀書云一千六百五十餘年聖經直解則云二千二百四十二年相差五百九十二年洪水至漢哀帝元夀二年庚申天主降生天地儀書云二千三百四十餘年聖經直解則云二千九百五十四年相差六百一十四年遺詮又云二千九百四十六年比聖經直解又少八年論日法問上古積年荒忽無憑去之誠是也至于日法則現在入用之數也而古厯皆有日法授時何以獨無曰日法與厯元相因而立者也不用積年自可不用日法矣盖古厯氣朔皆定大小餘大餘者日也小餘者時刻也凡七曜之行度不能正當時刻之初而或在其中半難分之處非以時刻剖析為若干分秒則不能命筭此日法所由立也自日法而析之則有辰法刻法分法秒法自日法而積之則有氣䇿法朔實法嵗實法旬周法與日日法同用者則有度法宿次法周天法又有章法蔀法紀法元法一切諸法莫不以日法為之綱古厯首定日法而皆有畸零葢以此也惟日法有畸零故諸率從之而各有畸零之數矣夫古厯豈故為此繁難以自困哉欲以上合於所立之厯元而為七曜之通率有不得不然者也如古法以九百四十分為日法其四分之一則為二百三十五所以然者以十九年一章有二百三十五月也又古法月行十九分度之七是以十九分為度法亦以十九年一章有七閏也他皆類此今授時既不用積年即章蔀紀元悉置不用而一以天驗為徴故可不用畸零之日法而竟以萬分為日日有百刻刻有百分故一萬也自此再析則分有百秒秒有百微皆以十百為等而遞進退焉數簡而明易於布算法之極善者也是故授時非無日法也但不用畸零之日法耳用畸零之日法乘除既繁而其勢又有所阻故分以下復用秒母焉用萬分之日可以析之屢析至于無窮日躔之用有秒則日為百萬月離之用有㣲則日為億萬而乘除之間轉覺其易是小餘之細未有過於授時者也而又便於用豈非法之無弊可以萬世遵行者哉按宋蔡季通欲以十二萬九千六百為日法而當時厯家不以為然畏其細也然以較授時猶未及其秒數而不便于用者有畸零也有畸零而又於七曜之行率無闗何怪厯家之不用乎若回回泰西則皆以六十遞析雖未嘗别立日法而秒㣲以下必用通分頗多紆折若非逐項立表則其繁難不啻數倍授時矣薛儀甫著天學㑹通以六十分改為百分誠有見也厯算全書巻一
