body:
  text: 方程論自敘方程于數九之一也何獨于方程乎論曰方程猶句股也數學之極致故二以殿乎九今之為數學往往覃思勾股而略方程不寧惟略抑多沿誤佹于闕矣數九而闕其一可以無論乎議者謂勾股測量用以知道里之修城邑之廣山之髙水之深天地日月之行度若方程算術多取近用米鹽凌雜非其精且大是不然精粗小大人則分之而自一至九之數無分也且數何兆歟當其未始有物之初混沌鴻濛杳冥恍惚無始無終無聲無形無理可名無數可紀乃數之根也是謂真一真一者無一也一且非一而况其分及其自無之有無一而忽然有一有一則有萬萬者一之萬也萬各其一一各其萬即萬即一環應無端又孰從而精粗之小大之乎故果蓏之有理而星度齊觀理實同源數亦冥會苟未達此而侈言髙逺遺乎目睫將日用之酬酢有外乎理數以自立者哉而二之也古者數學大司徒以備鄉之三物教萬民而賔興之其屬保氏掌之以教國子具曰九數未嘗右勾股于方程也雖然古之人以其進乎數者治數故用之簡易而言之約今欲于古學既湮之日出獨是以信衆疑使方程之沿誤皆正而九數闕而復全則意取共明固不敢謬託簡古以自文其疏愚之論乃不覺其復矣凡六卷論成于壬子之冬寫而成帙則甲寅之夏勿菴梅文鼎自識
