body:
  text: 厯算全書巻八宣城梅文鼎撰弧三角舉要巻三斜弧三角形作垂弧説正弧形有正角如平三角之有句股形也斜弧形無正角如平三角之有銳鈍形也平三角銳鈍二形並以虚線成句股故斜弧形亦以垂弧成正角也正弧形以正弦等線立算句股法也斜弧形仍以正角立算亦句股法也斜弧三角用垂弧法垂弧之法有三其一作垂弧于形内則分本形為兩正角形其二作垂弧于形外則補成正角形其三作垂弧于次形總法曰三角俱銳垂弧在形内一鈍二鋭或在形内或在形外自鈍角作垂弧則在形内自銳角作垂弧則在形外兩鈍一銳或三角俱鈍則用次形其所作垂弧在次形之内之外次形無鈍角垂弧在其内有鈍角垂弧在其外若破鈍角亦可在内第一法垂弧在形内成兩正角内分五支設甲乙丙形有丙鋭角有角旁相連之乙丙甲丙二邊求對邊及餘兩角法于乙角在先有乙丙邊之端乃不知之角作垂弧如乙丁至甲丙邊分甲丙邊為兩即分本形為兩而皆正角凡垂弧之所到必正角也角不正即非垂弧故所分兩角皆正後倣此一乙丁丙形此形有丁正角丙角乙丙邊為兩角一邊可求丁丙邊乃丙甲之分乙丁邊即垂弧及丁乙丙角即乙分角次乙丁甲形有丁正角甲丁邊甲丙内減丁丙其餘丁甲乙丁邊為一角兩邊可求乙甲邊甲角及丁乙甲分角末以兩乙角并之成乙角或如上圖丁甲角端作垂弧至乙丙邊分乙丙為兩亦同右一角二邊而先有者皆角旁之邊為形内垂弧之第一支此所得分形丁丙邊必小於元設邊即垂弧在形内而甲為鋭角設甲乙丙形有丙銳角有角旁相連之丙乙邊及與角相對之乙甲邊求餘兩角一邊法于不知之乙角在先有二邊之中作乙丁垂弧分兩正角形一乙丙丁形此形有丁正角有丙角有乙邊邊可求乙丁分線及所分丁丙邊及丁乙丙分角次乙甲丁形此形有丁正角有乙丁邊有乙甲邊可求甲角及丁乙甲分角丁甲邊末以兩分角丁乙丙及丁乙甲并之成乙角以兩分邊丁丙及丁甲并之成甲丙邊右一角二邊而先有對角之邊為形内垂弧之第二支設甲乙丙形有乙丙二角有乙丙邊在兩角之間求甲角及餘邊法于乙角作垂弧分兩形並如前但欲用乙丙邊故破乙角存丙角一乙丙丁形有丁正角丙角乙丙邊可求乙丁邊丁丙邊丁乙丙分角次乙丁甲形有乙丁邊丁正角丁乙甲分角原設乙角内減丁乙丙得丁乙甲可求乙甲邊甲角及甲丁邊末以甲丁并丁丙得甲丙邊或於丙角作垂弧亦同若角一鈍一鋭即破鈍角作垂線其法並同右二角一邊而邊在兩角之間不與角對為形内垂弧之第三支此必未知之角為銳角則垂弧在形内設甲乙丙形有丙甲二角有乙甲邊與丙角相對與甲角相連求乙角及餘二邊法于乙角為未知之角作垂弧分為兩形而皆正角一乙丁甲形有丁正角甲角乙甲邊可求甲丁邊乙丁邊丁乙甲分角次丁乙丙形有丁正角乙丁邊丙角可求乙丙邊丁丙邊丁乙丙分角末以甲丁丁丙并之成甲丙邊以兩分角丁乙甲丁乙丙并之成乙角右二角一邊而先有對角之邊為形内垂弧之第四支此先有二角必俱銳則垂弧在内設乙甲丙形有三邊而内有乙甲乙丙二邊相同求三角法從乙角在相同二邊之間作垂弧至丙甲邊乃不同之一邊分兩正角形其形必相等而甲丙線必兩平分乙丙丁形有丁正角乙丙邊丁丙邊即甲丙之半可求丙角乙分角乃乙角之半倍之成乙角而甲角即同丙角不須再求右三邊求角而内有相同之邊故可平分是為形内垂弧之第五支此必乙丙乙甲二邊並小在九十度内若九十度外甲丙二角必俱鈍當用次形詳第三又法第二法垂弧在形外補成正角内分七支設甲乙丙形有丙銳角有夾角之兩邊乙丙甲丙求乙甲邊及餘兩角法自乙角在先有邊之一端作垂弧乙丁于形外引丙甲邊至丁補成正角形二一丙乙丁半虛半實形二甲乙丁虚形先算丙乙丁形此形有乙丙邊丙角有丁正角可求丙乙丁角半虛半實乙丁邊形外垂弧丁丙邊丙甲引長邊次甲乙丁虚形有丁正角有乙丁邊甲丁邊丁丙内減内甲得甲丁可求乙甲邊甲角及甲乙丁虚角末以甲角減半周得原設甲角以甲乙丁虚角減丙乙丁角得原設丙乙甲角右一角二邊角在二邊之中而為銳角是為形外垂弧之第一支此所得丁丙必大于原設邊即垂弧在形外而甲為鈍角設乙甲丙形有甲鈍角有角旁之丙甲乙甲二邊求乙丙邊及餘二角法於乙角作垂弧乙丁引丙甲至丁補成正角先算乙丁甲虚形此形有丁正角甲角即原設甲角減半周之餘亦曰外角有乙甲邊可求甲丁邊乙丁邊丁乙甲虚角次丁乙丙形有乙丁邊丁丙邊甲丙加丁甲得之丁正角可求乙丙邊丙角丙乙丁角末于丙乙丁内減丁乙甲虛角得原設乙角或從丙作垂弧至戊引乙甲邊至戊補成正角亦同右一角二邊角在二邊之中而為鈍角乃形外垂弧之第二支設乙甲丙形有丙銳角有角旁之乙丙邊有對角之乙甲邊求丙甲邊及餘二角法從乙角作垂弧至丁成正角亦引丙甲至丁先算丙乙丁形有丁正角丙角乙丙邊可求諸數乙丁邊丁丙邊丙乙丁角次丁乙甲虚形有丁正角乙丁乙甲二邊可求諸數乙甲丁角甲乙丁角甲丁邊末以所得虚形甲角減半周得原設甲鈍角于丙乙丁内減虛乙角得原設乙角於丁丙内減甲丁得原設丙甲右一角二邊角有所對之邊而為銳角乃形外垂弧之第三支此必甲為鈍角故垂弧在外設乙甲丙形有甲鈍角有角旁之甲丙邊及對角之乙丙邊求乙甲邊及餘二角法于丙角作垂弧至戊補成正角先算虚形甲丙戊有戊正角甲角甲鈍角減半周之餘甲丙邊可求諸數丙戊邊甲戊邊丙虚角次虚實合形乙丙戊有戊正角丙戊邊乙丙邊可求原設乙角及諸數乙丙戊角乙戊邊末以先得虚形數減之得原設數丙角内減丙虛角得原設丙角乙戊内減甲戊虚引邊得原設乙甲邊右一角二邊角有所對之邊而為鈍角乃形外垂弧之第四支此先得鈍角垂線必在外設乙甲丙形有丙甲二角一銳一鈍有丙甲邊在兩角之中法於丙銳角作垂弧至丁在甲鈍角外補成正角丁丙甲虛形有丁正角甲外角丙甲邊可求諸數丙丁邊甲丁邊丙虚角次乙丙丁形半虛實有丁正角丙丁邊丙角以丙虛角補原設丙角得丁丙乙角可求原設乙丙邊乙角及乙甲邊求得乙丁邊内減虛形之甲丁邊得原設甲乙邊右二角一邊邊在兩角間為形外垂弧之第五支此亦可于甲鈍角作垂弧則在形内法在第一法之第三支設乙甲丙形有乙甲二角乙銳甲鈍有丙甲邊與乙銳角相對鈍角相連法于丙銳角作垂弧至戊在丙甲邊外補成正角甲戊丙虛形有戊正角有丙甲邊甲角原設形之外角可求諸數丙戊甲戊二邊丙虛角次乙丙戊形有戊正角乙角丙戊邊可求丙角求得乙丙戊角内減丙虛角得元設丙角乙丙邊乙甲邊求到乙戊邊内減甲戊得乙甲右二角一邊而邊對鋭角為形外垂弧之第六支設乙甲丙形有乙銳角甲鈍角有丙乙邊與甲鈍角相對銳角相連法于丙銳角作垂弧至戊在甲鈍角外補成正角乙丙戊形有戊正角乙角乙丙邊可求諸數丙戊乙戊二邊乙丙戊角次甲丙戊虚形有戊正角甲外角丙戊邊可求原設丙甲邊甲乙邊求到戊甲虚邊以減乙戊得原設乙甲丙角求到丙虚角以減乙丙戊角得原設丙角右兩角一邊而邊對鈍角為形外垂弧之第七支第三垂弧又法用次形内分九支設乙甲丙形有乙丙二角有乙丙邊在兩角間而兩角並鈍求餘二邊及甲角法引丙甲至己引乙甲至戊各滿半周作戊己邊與乙丙等而己與戊並乙丙之外角成甲戊己次形依法作垂弧于次形之内如己丁分為兩形一己丁戊一己丁甲可求乙甲邊以己丁戊分形求到丁戊以己丁甲形求到甲丁合之成甲戊以減半周即得乙甲丙甲邊以己丁甲分形求到己甲以減半周即得丙甲甲角以己丁甲分形求到甲交角右二角一邊邊在角間而用次形為垂弧又法之第一支論曰舊説弧三角形以大邊為底底旁兩角同類垂弧在形内異類垂弧在形外由今考之殆不盡然蓋形内垂弧分底弧為兩成兩正角形所用者銳角也底旁原有兩銳角分兩正角形則各有兩銳角形外垂弧補成正角形所用者亦銳角也底旁原有一銳角補成正角形則虚實兩形各有兩銳角故惟三銳角形作垂弧于形内一鈍兩銳則垂弧或在形内或在形外若兩鈍一鋭則形内形外俱不可以作垂弧垂弧雖有内外而其用算時並為一正角兩銳角之比例若形有兩鈍角則雖作垂弧只能成一正一鈍一銳之形無比例可求則垂弧為徒設矣故必以次形通之而所作垂弧即在次形不得謂之形内然則同類之説止可施于兩銳若兩鈍雖亦同類而不可于形内作垂弧異類之説止可施于一鈍兩銳若兩鈍一銳而底弧之旁一鈍一銳雖亦異類然不可于形外作垂弧非通法矣兩鈍角不用次形垂弧之法己窮况三鈍角乎又論曰以垂弧之法徵之則大邊為底之說理亦未盡蓋鈍角所對邊必大既有形外立垂線垂弧之法則鈍角有時在下而所對之邊在上矣不知何術能常令大邊為㡳乎此尤易見設乙甲丙形有丙甲二角有乙甲邊與丙角相對而兩角俱鈍求乙角及餘邊如法引甲乙丙乙俱滿半周㑹于己成丙甲己次形作己丁垂弧于次形内分次形為兩可求乙角依法求到分形兩己角合之為次形己角與乙對角等甲丙邊求到分形甲丁及丁丙并之即甲丙乙丙邊求到次形己丙以減半周得之右二角一邊邊與角對而用次形為垂弧又法之第二支此三角俱鈍也或乙為鋭角亦同設乙甲丙形有乙丙乙甲兩邊有乙角在兩邊之中法用甲乙戊次形有乙甲邊有乙戊邊為乙丙減半周之餘有乙外角作甲丁垂弧分為兩形可求丙甲邊及餘兩角以乙甲丁分形求到丁乙及甲分角人以甲戊丁形求到甲戊以減半周為丙甲又得甲分角并先所得成甲角即甲外角又得戊角即丙對角右二邊一角角在二邊之中而用次形為垂弧又法之第三支或丙為鈍角則于次形戊角作垂弧法同上條設乙甲丙形有丙角有甲丙邊與角連有乙甲邊與角對法用甲己戊次形甲己為甲乙減半周之餘甲戊為甲丙減半周之餘戊角為丙之外角作垂弧甲丁于内分為兩形可求丙乙邊及餘兩角以甲丁戊分形求丁戊及甲分角又以甲丁己形求得丁己以并丁戊成己戊即丙乙也又得分角以并先得分角即甲交角也又得己角即乙外角也右二邊一角角與邊對而用次形為垂弧又法之第四支若甲為鈍角亦同論曰先得丙鈍角宜作垂弧於外而乙亦鈍角不可作垂弧故用次形設乙甲丙形有三邊内有乙甲丙甲二邊相同而皆為過弧求三角法引相同之二邊各滿半周作弧線聨之成戊甲己次形如法作甲丁垂弧分次形為兩其形相等可求相同之二角任以甲丁戊分形求到戊角以減半周得乙角亦即丙角及甲角求到甲半角倍之成甲角右三邊求角内有相同兩大邊為垂弧又法之第五支若甲為鋭角亦同以上垂弧並作於次形之内設乙甲丙形有丙甲二鈍角有甲丙邊在兩角間法引乙丙乙甲滿半周㑹於戊成甲戊丙次形自甲作垂弧與丙戊引長弧㑹于丁補成正角可求乙甲邊乙丙邊乙角先求丙甲丁形諸數次求甲戊丁得甲戊以減半周為甲乙又以丁戊減先得丁丙得丙戊以減半周為乙丙又求得戊虚角減半周為戊角即乙對角右兩鈍角一邊邊在角間而於次形外作垂弧為又法之第六支或自丙角作垂弧亦同設乙甲丙形有乙甲二鈍角有甲丙邊與角對法引設邊成丙戊甲次形有甲外角有戊鈍角為乙對角