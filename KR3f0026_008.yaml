角即戊鈍角甲己兩銳角並元形之外角右三邊不等形易大爲小為斜弧次形第一用之第二支第四斜弧三角形弧角互易用次形内分三支一乙甲丙形三角俱鈍易為丑癸寅形一鈍二銳法曰引乙甲作圜次引乙丙至酉引甲丙至未並半周次以甲為心作丁辛癸寅弧乙為心作戊丑癸壬弧丙為心作丑子午寅弧三弧交處别成一丑癸寅形與元形相當而元形之角盡易為邊邊盡易為角論曰甲角之弧丁辛與次形癸寅等則甲角易為癸寅邊丁癸及辛寅皆象限減同用之辛癸則癸寅同丁辛乙角之弧己壬與次形丑癸等則乙角易為丑癸邊癸己及丑壬皆象限減同用之癸壬即丑癸同壬己丙外角之弧午申引丑午寅至申取亥申與庚子等成午申與次形寅丑等則丙外角易為寅丑弧丑午及寅申皆象限各加同用之午寅即午申等丑寅是元形有三角即次形有三邊也又甲乙邊之度易為癸外角乙己及甲辰皆象限内減同用之甲己則乙甲同己辰為癸外角弧甲丙邊易為寅角甲辛及丙子皆象限内減同用之丙辛則甲丙等辛子而同為寅角之弧乙丙邊易為丑角乙壬及午丙皆象限内減同用之丙壬則乙丙等午壬而同為丑角之弧是元形有三邊即次形有三角也又論曰有此法則三角可以求邊既以三角易為次形之三邊再用三邊求角法求得次形三角即反為元形之三邊三邊求角法詳别卷又論曰引丙甲出圜外至申亦引庚亥弧出圜外㑹于申則庚亥與子申並半周内各減子亥即子庚同亥申而子寅既象弧則寅申亦象弧矣以寅申象弧加午寅與以丑午象限午壬為丑角之弧故丑午亦象限加午寅必等而申午者丙外角之度丑寅者次形之邊也故丙角能為次形之邊也又論曰凡引弧線出圜外者其弧線不離渾圜面幂因平視故為周線所掩稍轉其渾形即見之矣但所引出之線原為半周之餘見此餘線時即當别用一圈為外周而先見者反有所掩如見亥申即不能見子庚故其度分恒必相當亦自然之理也又論曰依第三用法之第二支丙未酉形及丙未乙形丙酉甲形並可易為甲乙丙則又皆以癸丑寅為又次形矣右三角俱銳形弧角相易為斜弧次形第二用之第一支二未丙酉形三角俱鈍易為丑癸寅形一鈍二銳法曰引酉未弧作圜又引兩邊至圜周如乙如甲乃以未為心作丁辛癸寅辰弧以酉為心作戊丑癸壬己弧以丙為心作庚子丑寅午申弧亦引丙甲出圜外㑹於申三弧相交成丑癸寅形此形與元形相當而角盡易為弧弧盡易為角論曰未外角之弧丁辛成次形癸寅弧癸丁及寅辛皆象限内減同用之癸辛則癸寅即丁辛酉外角之弧壬己成次形丑癸弧壬丑及癸己皆象限各減癸壬則丑癸即壬己丙外角之弧申午成次形寅丑弧準前論庚亥及子申並半周則申亥等子庚而申寅為象限與午丑象限各減午寅即寅丑同申午是三角盡易為邊也酉未邊成癸外角酉戊及未丁皆象限各減未戊則丁戊即酉未而為癸外角之弧若以丁戊減戊乙己半周其餘丁乙己過弧亦即為癸交角之弧未丙邊減半周其餘甲丙成寅角甲辛及子丙皆象限各減辛丙則辛子即甲丙而為寅角之弧酉丙邊減半周其餘乙丙成丑角午丙及壬乙皆象限各減丙壬則壬午即乙丙而為丑角之弧是三邊盡易為角也寅角丑角並原邊減半周則原邊即兩外角弧與酉未成癸外角等故三角減半周得次形三邊算得次形三角減半周得原設三邊右三角俱鈍形弧角相易為斜弧次形第二用之第二支論曰若所設為乙未丙形則未角易為次形癸寅邊徑用丁辛子形内以當癸寅不須言外角乙外角為丑癸邊亦以己壬當丑癸與用酉外角同理丙角為丑寅邊徑以丙交角之弧甲午當丑寅不言外角若所設為甲酉丙形則酉角易為丑癸邊己壬徑當丑癸不言外角甲外角為寅癸邊用丁辛當癸寅即甲外角丙角為丑寅邊亦申午當丑寅不言外角又論曰此皆大邊徑易次形不必復言又次三甲乙丙形一鈍角兩銳角易為丑癸寅形如法引甲乙邊作全圜引餘二邊各滿半周又以甲為心作丁壬癸丑辰半周以乙爲心作戊庚辛癸寅亥弧以丙為心作己午子丑寅夘弧三弧線相交成丑癸寅次形與元形相當而角為弧弧爲角論曰易甲角為次形丑癸邊於癸丁象限減壬癸成丁壬為甲角之弧於丑壬象限亦減壬癸即成癸丑邊其數相等乙外角為次形癸寅邊於癸戊象限減癸辛成辛戊為乙外角之弧于寅辛象限亦減癸辛即成癸寅邊其數相等丙角為次形丑寅邊于丑午象限減丑子成午子為丙角之弧于寅子象限亦減丑子即成丑寅邊其數相等則角盡為邊又甲乙邊為癸角于甲丁象限乙戊象限各減乙丁則戊丁等甲乙而癸角角之弧乙丙邊成寅角于乙辛及子丙兩象限各減丙辛則辛子等乙丙而為寅角之弧甲丙邊為丑外角于甲壬及午丙兩象限各減丙壬則午壬等甲丙而為丑外角之弧則邊盡為角右一鈍角兩銳角形弧角相易為斜弧次形第二用之第三支論曰若所設為甲丙酉形三角俱鈍而有兩大邊則以甲外角為次形丑癸邊酉外角為癸寅邊丙外角為丑寅邊又以三邊為次形三外角並與第二支未丙酉形三鈍角同理若所設為丙未酉形乙未丙形並一鈍二銳而有兩大邊皆依上法可徑易為丑癸寅次形觀圖自明甲乙丙形三邊並大三角並鈍易為次形法以本形三外角之度為次形三邊午己為乙外角之度而與癸壬等丑辛為甲外角之度而與癸寅等申亥為丙外角之度而與寅壬等以本形三邊減半周之餘為次形三角甲乙減半周其餘戊乙或子甲而並與辰丁等即癸角之度甲丙減半周其餘戊丙而與丑庚等即寅角之度乙丙減半周其餘子丙而與午亥等即壬角之度並同前術論曰此即厯學㑹通所謂别算一三角其邊為此角一百八十度之餘者也然惟三鈍角或兩鈍角則然其餘則兼用本角之度不皆外角右三角俱鈍形弧角相易同第二支惟三邊俱大子戊丙形一大邊二小邊一鈍角二銳角其法亦以次形癸壬癸寅二邊為本形子戊二角之度寅壬邊為丙外角之度次形寅壬二角為本形二小邊之度癸角為大邊減半周之度論曰此所用次形與前同而用外角度者惟丙角其子角戊角只用本度為次形之邊非一百八十度之減餘也若設戊丙乙形子丙甲形並同戊丙乙形惟次形癸寅邊為戊外角其餘癸壬邊之度為乙角寅壬邊之度為丙角則皆本度子丙甲形惟次形癸壬邊為子外角其餘寅壬邊之度為丙角癸寅邊之度為甲角則皆本度右一鈍角二銳角與第三支同惟為邊一大一小第五斜弧正弧以弧角互易内分二支一甲乙丙形甲乙邊適足九十度餘二邊一大一小角一鈍二銳易為丑癸寅正弧形癸正角餘銳三邊並小法曰引乙丙小邊成半周於乙引至夘補成丙乙夘象限又于丙引至午成丙辛午象限即成半周作夘亥庚丑寅午以丙為心之半周截丙甲大邊于庚使丙庚與丙乙夘等乃作庚夘弧為丙角之度即庚與夘皆正角依此引至午亦得正角而成半周以丙為心作甲丑癸辛戊以乙為心之半周引甲乙象限至戊成半周于甲于戊各作正角聨之即又成半周而截乙辛成象限與乙戊等即辛戊為乙外角度而此半周以乙為心作乙壬癸寅弧以甲為心甲戊半周折半于癸成兩象限從癸作十字正角弧一端至寅一端至乙成癸乙象限其所截甲壬亦象限即乙壬為甲角之弧而甲為其心三弧線相交成一丑癸寅次形與本形弧角相易而有正角論曰次形丑寅邊即本形丙角之度丑夘及寅庚皆象限各減丑庚則丑寅即庚夘而為丙角之弧癸寅邊即甲角之度寅壬及癸乙皆象限各減癸壬則癸寅即壬乙而為甲角之弧癸丑邊即乙外角之度丑辛及癸戊皆象限各減癸辛則丑癸即辛戊而為乙外角之弧是角盡易邊也又寅角為甲丙邊所成庚丙及壬戊皆象限各減丙壬則寅角之弧庚壬與甲丙減半周之丙戊等丑角為乙丙邊所成午丙及辛乙皆象限各減辛丙則丑角之弧午辛與乙丙邊等癸正角為甲乙邊所成癸正角内外並九十度而甲乙象限為癸外角弧若減半周則乙戊象限為癸交角弧是邊盡為角而有正角也又辰戊丙形辰戊邊象限餘並同前易為正弧形並同前法觀圖自明乙丙戊形乙戊邊足一象限餘並小易為正角形則丑寅度即丙外角丑癸度即乙角寅癸度即戊角是角為邊也又寅角生于丙戊丑角生于乙丙癸正角生于乙戊是邊為角辰甲丙形辰甲象弧餘二邊大三角並鈍易為正角形則丑寅邊為丙外角丑癸邊為辰外角寅癸邊為甲外角角為邊也又寅角生于甲丙丑角生于辰丙而癸正角生于辰甲並準前條諸論推變是邊為角而且有正角也右本形有象限弧即次形有正角而斜弧變正弧為弧角互易之第一支丙乙甲形丙正角餘兩銳角相等邊三小相等者二易為己癸壬次形角一鈍二銳銳相等法以甲為心作寅己丑半周則甲角之度子寅弧成次形一邊己壬以乙為心作夘己午半周則乙角之度夘辰弧成次形又一邊己癸此所成二邊相等以丙為心作亥癸壬未半周則丙角之度癸壬象限即為次形第三邊依法平分次形以己壬酉形求壬角得原設甲丙邊壬角之度癸子與甲丙等乙丙邊壬癸兩銳角原同度而癸角之度辰壬與乙丙等故一得兼得也求半己角倍之成己角以減半周得原設乙甲邊己外角之度午寅或丑夘並與乙甲等論曰本形有正角次形無正角而有象限弧得次形之象限弧得本形之正角矣若設丙戊丁形丙正角兩鈍角同度二大邊同度一邊小易為己癸壬次形與上同法惟丁戊用外角若設甲丙戊形丙正角餘一銳一鈍而銳角鈍角合成半周邊二大一小而小邊與一大邊合成一半周易為己癸壬次形亦同上法惟甲用外角戊用本角而同度所得次形之邊亦同度甲外角之度子寅成次形巳壬邊戊本角乏度辰夘成次形己癸邊而四者皆同度其轉求本形也用次形之壬角得甲丙以減半周即得丙戊或乙丙丁形亦同右本形有正角而次形無正角爲弧角互易之第二支或三角形無相同之邊角而有正角其次形必有象限邊或無正角而有相同之邊角其次形亦有等邊等角準此論之次形法補遺角一銳一鈍邊二大一小附算例三角求邊三邊求角甲乙丙形甲角一百二十度乙角一百一十度丙角八十五度為一銳二鈍三角求邊如法易為丑寅癸次形癸寅邊六十度當甲角丑癸邊七十度當乙角寅丑邊當丙角並以角度減半周得之求甲乙邊即次形癸外角法以甲乙兩角正弦相乗半徑除之得數八一三八為一率半徑一為二率甲乙兩角相較十度之矢與丙角減半周九十五度大矢相較得數一七一九七為三率求得四率一三一七二四爲次形癸角大矢内減半徑成餘弦三一七二四撿表得癸外角七十一度三十分為甲乙邊本宜求癸角以減半周得甲乙今用省法亦同論曰三角求邊而用次形實即三邊求角也故其求甲乙邊實求次形癸角得癸角得甲乙邊矣然則兩角正弦仍用本度者何也凡減半周之餘度與其本度同一正弦也甲角一百二十度之正弦八六六三即次形癸寅邊六十度之正弦乙角一百一十度之正弦九三九六九即次形丑癸邊七十度正弦獨丙角用餘度大矢何也正弦可同用而矢不可以同用也丙以外角易為次形丑寅邊九十五度其大矢一八七一六而丙角本八十五度是銳角當用正矢故不可以通用然則兩角較矢又何以仍用本度曰兩餘度之較與本度同故也甲角乙角之較十度所易次形之癸寅邊丑癸邊其較亦十度所得四率為大矢而甲乙邊小何也曰餘度故也甲乙邊易為癸外角而四率所得者癸内角也故為甲乙減半周之餘度用餘度宜減半周命度矣今何以不減曰省算也雖不減猶之減矣四率係大矢必先得癸外角七十一度半以減半周得癸内角一百八度半再以癸内角減半周仍得七十一度半為甲乙邊今徑以先得癸外角之度為甲乙邊其理無二求甲丙邊如上法以邊左右兩角正弦甲八六六三丙九九六一九相乘半徑除之得數八六二七三為一率半徑一為二率甲丙兩角相較三十五度矢一八八五與乙外角七十度矢六五七九八相較得數四七七一三為三率求得甲丙邊半周餘度之矢五五三四為四率撿表得六十三度二十七分以減半周得甲丙邊一百一十六度三十三分論曰此亦用次形三邊求寅角也以甲角所易癸寅邊丙角所易寅丑邊為角旁二邊以乙角所易丑癸邊為對角之邊求得寅角之度辛子與酉丙等即甲丙減半周餘度求乙丙邊如法以邊左右兩角正弦丙九九六一九乙九三九六九相乘半徑除之得數九三六一二爲一率半徑一為二率丙乙兩角較二十五度矢九三六九與甲外角六十度矢相較四六三一爲三率求得餘度矢四三四三為四率撿表得五十分五度三十二以減半周得乙丙邊一百廿四度廿八分論曰此用次形三邊求丑角也丙角易寅丑邊乙角易丑癸邊為角旁二邊甲角易癸寅為對邊求得丑角度午壬與未丙等即乙丙邊減半周餘度又論曰此所用次形之三邊三角皆本形減半周之餘度甲乙同己辰即癸外角度則次形癸角為甲乙邊之半周餘度也寅角之度子辛與酉丙等甲丙邊之餘度也丑角之度午壬與未丙等乙丙邊之餘度也是次形三角皆本形三邊減半周之餘度矣其次形三邊爲本形三角減半周之餘己詳前註故所得四率為角之大小矢者皆必減半周然後可以命度若他形則不盡然必須詳審如甲未丙形甲角六十度丙角九十五未角一百一十易丑寅癸次形則其角易為邊用本度者二甲角弧丁辛六十度易次形癸寅邊丙角弧申午九十五度易次形寅丑邊用餘度者一未角弧壬戊一百一十度其半周餘度己壬七十度易次形丑癸邊而其邊易為角用本度者二未丙邊五十五度三十二分與午壬等成次形丑角甲未邊餘度未酉七十一度三十分與丁戊等成癸外角則次形癸角一百八度三十分為甲未邊本度用餘者者一甲丙邊一百十六度三十三分其餘度酉丙六十三度二十七分與辛子等成次形寅角若一槩用餘度算次豈不大謬又如乙丙酉形乙角七丙角九五酉角一二用癸寅丑次形前圖求丙酉邊如法以邊左右兩角正弦丙九九六一九酉八六六三相乗去末五位得數八六二七三為一率半徑一為二率以酉外角丙角相差三十五度矢一八八五與乙角矢六五七九八相較四七七一三爲三率求得正矢五五三四為四率次形寅角之矢撿表得六十三度二十七分為丙酉邊論曰此所用四率與前條求甲丙邊之數同而邊之大小迥異一為餘度一為本度也前條為餘度之矢故甲丙邊大此條為本度之矢故丙酉邊小又所用矢較亦以不同而成其同前條以兩角相差此則以酉外角與丙角相差不同也而相差三十五度則同前條用乙外角之矢此條用乙本角又不同也而矢數六五七九八則同其理皆出次形也求酉乙邊如法以兩角正弦乙九三九六九酉八六六三相乗去末五位得八一三八為一率半徑為二率酉外角乙角相差十度之矢與丙角九十五度之矢相較得一六一九七為三率求得大矢次形癸角之矢為四率一三一七二四撿表得一百八度三十分為酉乙邊此與前條求甲乙邊參㸔即見次形用法不同之理如前所論求乙丙邊與前條同法因丙乙兩内角之正弦及差度並與兩外角同而酉角又同甲角故也論曰三角求邊必用次形而次形之用數得數並有用求度餘度之異即此數條可知其槩又論曰在本形為三角求邊者在次形為三邊求角故此數條即三邊求角之例也餘詳環中黍尺垂弧捷法作垂弧而不用其數故稱捷法亦為次形雙法用兩次形故稱雙法設亥甲丁形有甲亥邊亥丁邊亥角在二邊之中求甲丁邊對角之邊本法作垂弧分兩形先求甲已邊次求亥已邊分丁巳邊再用甲巳丁巳二邊求甲丁邊今捷法不求甲已邊但求亥已邊分丁已邊即用兩分形之兩次形以徑得甲丁一亥已餘弦即次形亥戊正弦二亥甲餘弦即次形亥丙正弦三已丁餘弦即次形辛丁正弦四甲丁餘弦即次形庚丁正弦法引甲亥邊至丙引甲丁邊至庚引甲已垂弧至乙皆滿象限又引分形邊亥已至戊引丁已至辛亦滿象限末作辛庚乙丙戊半周與亥已遇于戊與丁已遇于辛成亥丙戊次形與甲已亥分形相當丁亥辛次形與甲已丁分形相當而此兩次形又自相當戊角辛角同以己乙為其度則兩角等丙與庚又同為正角則其正弦之比例皆等論曰半徑與戊角之正弦若戊亥之正弦與亥丙之正弦又半徑與辛角即戊角之正弦若辛丁之正弦與丁庚之正弦合之則戊亥正弦與亥丙正弦亦若辛丁正弦與丁庚正弦又論曰辛丁已亥戊如黄道半周辛庚乙丙戊如赤道半周甲如北極辛如春分戊如秋分已乙如黄赤大距即夏至之緯乃二分同用之角度即戊角辛角之度亥丙及丁庚皆赤緯甲亥及甲丁皆距北極之度即赤緯之度一戊亥正弦黄經戊亥為未到秋分之度辛二亥丙正弦赤緯丁為已過春分之度似有三辛丁正弦黄經不同而二分之角度既同四丁庚正弦赤緯故其比例等一亥已餘弦即亥戊正弦二亥甲餘弦即亥丙正弦三已丁餘弦即戊丁正弦四甲丁餘弦即庚丁正弦論曰此理在前論中蓋以同用戊角故比例同也又論曰乙庚丙戊如赤道已丁亥戊如黄道皆象弧戊角如秋分其弧己乙如夏至距緯此兩黄經並在夏至後秋分前其理易見或先有者是丁鈍角甲丁丁亥二邊則先求丁巳線亦用前圖一丁已餘弦即戊丁正弦二甲丁餘弦即丁庚正弦三亥已餘弦即亥戊正弦四亥甲餘弦即亥丙正弦又論曰假如星在甲求其黄赤經緯則亥丁如兩極之距亥角若為黄經則丁角為赤經而亥甲黄緯丁甲赤緯也若丁角為黄經則亥角為赤經而丁甲黄緯亥甲赤緯也弧三角之理隨處可施故舉此以發其例弧三角舉要卷五八線相當法引弧三角有以相當立法者何也以四率皆八線也弧三角四率何以皆八線而不用他線八線但論度他線則有丈尺渾體故也弧三角皆在渾員之面渾體異平而御渾者必以平是故八線之數生于平員而八線之用專于渾員也曷言乎專為渾員曰平三角之角之邊皆直線也同在一平面而可以相為比例故雖用八線而四率中必兼他線焉以八線例他線則用角可以求邊以他線例八線則用邊可以求角皆兼用兩種線弧三角之角之邊皆弧度曲線也不同在平面故非八線不能為比例而四率中無他線焉既皆以八線相比例則同宗半徑有角之八線有邊之八線各角各邊俱非平面而可以相求者同一半徑也相當互視之法所由以立也錯舉似紛實則有條不紊故爲論列使有倫次云八線相當法詳衍總曰相當分之則有二曰相當曰互視互視又分為二曰本弧曰兩弧但曰相當者皆本弧也又分為二曰三率連比例者以全數為中率也其目有三曰四率斷比例者中有全數也其目有六凡相當之目九互視者亦相當也皆爲斷比例而不用全數若以四率之一與四相乗二與三相乗則皆與全數之自乗等也本弧之互視其目有三兩弧之互視其目有九凡互視之目十二總名之皆曰相當其目共二十一内三率連比例三更之則六四率斷比例十有八更之反之錯而綜之則百四十有四共百有五十相當共九一曰正弦與全數若全數與餘割二曰餘弦與全數若全數與正割三曰正切與全數若全數與餘切以上三法皆本弧皆三率連比例而以全數為中率四曰正弦與餘弦若全數與餘切五曰餘弦與正弦若全數與正切六曰正割與正切若全數與正弦七曰餘割與餘切若全數與餘弦八曰正割與餘割若全數與餘切九曰餘割與正割若全數與正切以上六法亦皆本法而皆四率斷比例四率之内有一率為全數互視共十二一曰正弦與正切若餘切與餘割二曰餘弦與餘切若正切與正割三曰正弦與餘弦若正割與餘割以上三法亦皆本弧皆四率斷比例而不用全數然以四率之一與四二與三相乗則其兩矩内形皆各與全數自乗之方形等四曰此弧之正弦與他弧正弦若他弧之餘割與此弧餘割五曰此弧之正弦與他弧餘弦若他弧之正割與此弧餘割六曰此弧之正弦與他弧正切若他弧之餘切與此弧餘割七曰此弧之餘弦與他弧餘弦若他弧之正割與此弧正割八曰此弧之餘弦與他弧正弦若他弧之餘割與此弧正割九曰此弧之餘弦與他弧餘切若他弧之正切與此弧正割十曰此弧之正切與他弧正切若他弧之餘切與此弧餘切十一曰此弧之正切與他弧正弦若他弧之餘割與此弧餘切十二曰此弧之正切與他弧餘弦若他弧之正割與此弧餘切以上九法皆兩弧相當率也其爲四率斷比例而不用全數則同若以四率之一與四二與三相乗其矩内形亦各與全數自乗之方形等相當法錯綜之理此三率連比例也首率與中率之比例若中率與末率故以首率末率相乗即與中率自乗之積等假如三十度之正弦五與全數一之比例若全數一與三十度之餘割二其比例皆為加例也更之則餘割二與全數一若全數一與正弦五其比例為折半也又如三十度之餘弦八六六三與全數一若全數一與三十度之正割一一五四七更之則正割一一五四七與全數一若全數一與餘弦八六六三也又如三十度之正切五七七三五與全數一若全數一與三十度之餘切一七三二五更之則餘切一七三二五與全數一若全數一與正切五七七三五也用法凡三率連比例有當用首率與中率者改為中率與末率假如有四率其一三十度正弦其二全數改用全數為一率三十度餘割為二率其比例同凡四率之前後兩率矩内形與中兩率矩形等故一與四二與三可互居也右四率斷比例也一率與二率之比例若三率與四率假如三十度之正弦五與其餘弦八六六三若全數一與其餘切一七三二五更之則餘切一七三二五與全數一若餘弦八六六三與正弦五也第四法又如三十度之正割一一五四七與其正切五七七三若全數一與其正弦五更之則全數一與正割一一五四七若正弦五與正切五七七三五也第六法又如三十度之餘割二與其正割一一五四七若全數一與其正切五七七三五更之則正切五七七三五與正割一一五四七若全數一與餘割二也第九法餘倣此用法凡四率斷比例當用前兩率者可以後兩率代之假如有四率其一正弦其二餘弦改用全數為一率餘切為二率其比例同互視此本弧中互相視之率也其第一與第四相乗矩第二與第三相乗矩皆與全數自乗方等故其邊為互相視之邊而相與爲比例皆等假如三十度之正弦五與其餘割二相乗一其餘弦八六六三與其正割一一五四七相乗一弱皆與全數自乗之方等故以正弦為一率餘弦為二率正割為三率餘割為四率則正弦五與餘弦八六六三若正割一一五四七與餘割二也第三法又如三十度之正切五七七三五與其餘切一七三二五相乗一弱亦與全數之方等故以正弦為一率餘切為二率正切為三率餘割為四率則正弦五與正切五七七三五若餘切一七三二五與餘割二也第一法或以餘弦為一率餘切爲二率正切為三率正割為四率則餘弦八六六三與餘切一七三二五若正切五七七三五與正割一一五四七也第二法用法此亦四法斷比例故當用前兩率者可以後兩率代之假如有四率當以正弦與正切為一率二率者改用餘切為一率餘割為二率以乗除之其比例亦同餘倣此本弧諸線相當約法其一為弦與股之比例反之則如股與弦全正割餘切餘割全餘弦正切正弦正弦正切餘弦全餘割餘切正割全其二為弦與句之比例反之則如句與弦全餘割正切正割全正弦餘切餘弦餘弦餘切正弦全正割正切餘割全其三為句與股之比例反之則如股與句全餘弦餘割餘切全正割正弦正切正切正弦正割全餘切餘割餘弦全右括本弧七十八法如圖甲丙甲乙甲丁皆半徑全數乙丙為正弧乙丁為餘弧乙戊為正弦庚丙為正切線庚甲為正割線乙己為餘弦辛丁為餘切線辛甲為餘割線此皆一定比例觀圖自明外有餘切餘弦非弦與股之比例則借第二比例更之一甲乙全數即甲丁辛丁餘切四辛丁餘切甲丁全數全數與餘弦若餘割與餘切更之而餘切與餘弦若餘割與全數也餘割與全數既為弦與股則餘切與餘弦亦如弦與股矣正切正弦非弦與句之比例則借第一比例更之一甲乙全數即甲丙庚丙正切四庚丙正切甲丙全數全數與正弦若正割與正切更之而正切與正弦若正割與全數也正割與全數既為弦與句則正切與正弦亦如弦與句矣餘割正割非句與股之比例則仍借第一比例更之一餘割辛甲餘割辛甲二全數甲丁即甲丙正割庚甲三正割庚甲全數甲丙四正切庚丙正切庚丙餘割與全數若正割與正切更之而餘割與正割若全數與正切也全數與正切既爲句與股則餘割與正割亦如句與股矣互視自此而分以前為本弧所用共大法三更之則二十有四合相當法則七十有八而總以三率連比例三大法為根以後為兩弧所用共大法九更之七十有二而仍以本弧之三率連比例為根九法十二法以上大法三更之二十有四是以本弧之正切餘切與他弧互視此皆兩弧中互相視之率也本弧有兩率相乗矩與全數之方等他弧亦有兩率相乗矩與前數之方等則此四率為互相視之邊互相視者此有一率贏于彼之一率若干倍則此之又一率必朒于彼之又一率亦若干倍而其比例皆相等故以此弧之兩率為一與四則以他弧之兩率為二與三假如有角三十度邊四十度此兩弧也角之正弦五與其餘割二相乗一與全數自乗等邊之正弦六四二七九與其餘割一五五五七二相乗一弱亦與全數自乗等則此四率為互相視之邊互相視者言角之正弦五與邊之正弦六四二七九若邊之餘割一五五五七二與角之餘割二也第四法又如有二邊大邊五十度小邊三十度大邊之正弦七六六四餘割一三五四一相乗與全數自乗等小邊之正切五七七三五餘切一七三二五相乗亦與全數自乗等則此四者互相視互相視者言大邊之正弦七六六四與小邊之正切五七七三五若小邊之餘切一七三二五與大邊之餘割一三五四一也第六法又如有兩角甲角三十度乙角五十度此亦兩弧也甲角之正切五七七三五餘切一七三二五相乗與全數自乗等乙角之正切一一九一七五餘切八三九一相乗亦與全數自乘等則此率為互相視之邊互相視者言甲角之正切五七七三五與乙角之正切一一九一七五若乙角之餘切八三九一與甲角之餘切一七三二五也第十法用法假如别有四率以五十度正弦為第一三十度正切為第二今改用三十度餘切第一五十度餘割第二其比例同如圖壬丙爲本弧乙丙為他弧他弧小於本弧而並在半象限以内本弧正弦壬癸餘割未甲餘弦壬丑正割庚甲正切庚丙餘切未丁他弧正弦乙戊餘割酉申餘弦乙巳正割辛甲正切辛丙餘切酉丁論曰甲丙甲丁皆半徑乃本弧他弧所共也半徑自乗之方冪為甲丙夘丁而本弧中以正弦乗餘割以餘弦乗正割以正切乗餘切所作矩形既各與半徑方冪等則他弧亦然故可以互相視而成相當之率如上圖壬丙本弧在半象限内巳丙他弧在半象限外亦同如上圖壬丙本弧小于乙丙他弧而並在半象限外並同厯算全書卷八
