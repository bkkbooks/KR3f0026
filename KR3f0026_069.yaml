body:
  text: 歷算全書卷五十六宣城梅文鼎撰方圓冪積一卷方圓冪積說歷書周徑率至二十位然其入算仍用古率十一與十四之比例本祖冲之徑七周二十二之密率豈非以乘除之際難用多位歟今以表列之取數殊易乃為之約法則徑與周之比例即方圓二冪之比例徑一則方周四圓周三一四一五九二六五而徑上方冪與員冪亦若四與三一四一五九二六五尾數八位並以表為用亦即為立方立圓之比例同徑之立方與圓柱若四與二一四有竒則同徑之立方與立員若六與三一四有竒殊為簡易直截癸未歲匡山隱者毛心易乾乾偕其壻中州謝野臣惠訪山居共論周徑之理因反覆推論方員相容相變諸率庚寅在吳門又得錫山友人楊崑生定三方員訂注圗說益覺精明甚矣學問貴相長也方圎相容新法厯書曰割圓亦屬古法蓋人用圭表等測天天圎而圭表直與圎為異類詎能合歟此所以有割圎之法也新法名為八線表云又云徑一圍三絶非相凖之率然徑七圍二十二則盈徑五十圍百五十七則朒或詳繹之則徑一萬圍三萬一四五九雖亦小有竒零不盡然用之頗為相近今算得平方與同徑之平圓其比例若四與三一四五九平方內容平員平員內復容平方則內方與外方內員與外員之冪皆加倍之比例假如戊己庚辛平方內容甲乙丙丁員員內又容甲乙丙丁小平方小方內又容壬丑癸子小平員如此遞互相容則其冪積皆如二與一也假外大平方戊己庚辛之積一百則內小平方之積甲丁乙丙必五十平員亦然若求其徑則成方斜之比例大徑如斜小徑如方假如內小平方積一百以甲丁或丙乙為徑甲丙或丁乙並同開方求一百之根得徑一十其外大平方積二百以甲乙或丁丙為徑或用戊庚或己辛或己戊或辛庚為徑並同開方求二百之根得徑一十四一四有竒甲乙為甲丁方之斜故斜徑自乘之冪與其方冪若二與一而其徑與斜徑若一十與一十四一四竒也折半則為五與七七竒故曰方五則斜七有竒也三邉形內容平員平員內又容三邉則其冪之比例為四與一甲乙丙三邉形內容丁戊己平員平員內又容丁戊己小三邉則內小三邉形為外大三邉形四之一內外兩平員之冪其比例亦為四與一若有多層皆以此比例遞加渾員內容立方立方內又容渾員如此遞互相容則外員徑上冪與內員徑上冪為三倍之比例外立方與內立方之徑冪亦然丙庚丁渾員內容丙甲丁乙立方丙戊及戊甲皆立方邊丙辛及甲辛並同丙乙及甲丁等亦同丙戊甲辛為立方面餘六面並同丙甲為方面斜線丙丁為立方體內對角線即渾員徑乙甲同其辛壬及己戊皆亦對角若作線亦同丙乙及甲丁等又皆為立楞戊壬及辛己同解曰立方面上斜徑之冪為方冪之倍句股法也斜為弦方為句又為股併句股實成弦實故倍方冪即成斜徑之冪又以斜徑為股立方之立楞為句求得立方體內兩對角之斜徑為弦此弦實內有股實即面上斜徑之冪為方冪者二有句實即立楞之冪立楞原即方邉故其冪即立方面冪共得方冪三而此丙對角斜徑即渾員之徑內小員徑又在立方體內即以方徑為徑其徑之冪即立方面也故曰三倍比例也立方內又容立員則內員徑即立方之徑若求其徑則外徑大于內徑若一十七有竒與一十內徑之冪百開方得一十為徑則外徑之冪三百開方得一十七又三十五之一十一為徑若有幾層互容皆以此比例遞加即得若求其體積則為五倍有竒之比例若有多層亦以此比例遞加假如內容立方積一千則外大立方積五千一百九十四有竒解曰立積一千則其徑冪一百而外大立積之徑冪三百又以徑一十七又三十五之一十一乘之得五千一百九十四又七之二此言大方積又在圗上渾員之外積之比例立方同徑之立員其比例為六與三一四立方同徑之員柱其比例為四與三一四員柱與同徑之立員其比例為三與二方圎周徑相求同積較徑為方變員員變方之用凡方圎同積則員徑大方徑小其比例若一一二八三七九與一解曰員徑一一二八三七九則方徑一也法曰有員徑求其同積之方徑當以一乘以一一二八三七九除有方徑求其同積之員徑當以一一二八三七九乘以一除凡方員同積則員徑上平方與方徑上平方其比例若四與三一四一五九二六五解曰員徑自乘四則方徑自乘三一四一五九二六五法曰有員徑求其同積之方徑當以三一四一五九二六五乘之四除之得數平方開之得方徑有方徑求其同積之員徑當以四乘三一四一五九二六五除得數平方開之得員徑凡方員同積則員徑與方徑若一與八八六二二六解曰員徑一則方徑八八六二二六也法曰有員徑求同積之方徑以八八六二二六乘員徑一除之即得方徑有方徑求同積之員徑以一乘方徑八八六二二六除之即得員徑約法以一一二八二七九乘方徑去末六位得同積之員徑以八八六二二六乘員徑去末六位得同積之方徑同積較周凡方員同積則員周小方周大其比例若一與一一二八三七九亦若八八六二二六與一解曰員周一則方周一一二八三七九也方周一則員周八八六二二六也約法以一一二八三七九乘員周去末六位得同積之方周以八八六二二六乘方周去末六位得同積之員周凡方員同積則其徑與徑周與周為互相視之比例解曰方周與員周之比例若員徑與方徑也論曰凡同積之周方大而員小同積之徑則又方小而員大所以能互相為比例約法以方周乘方徑為實員周除之得員徑若以員徑除實亦得員周以員周乘員徑為實方周除之得方徑若以方徑除實亦得方周皆用異乘同除例如左一員周一一方周一二方周一一二八三七九二員周八八六二二六三方徑二八二九四七五三員徑二八二九四七五四員徑三一八三九八八四方徑二五積七九五七七四四八積六二五一員徑一一方徑一二方徑八八六二二六二員徑一一二八三七九三方周三五四四九四三員周三五四四九四四員周三一四一五九二四方周四積七八五三九八一六積一第四率並與一率乘得四倍積四除之得本積論曰以上皆方員周徑互相求乃同積之比例方員交變用之即比例規變面線之理同徑較積較周即方內容員員外切方凡方員同徑則方積大員積小周亦如之其比例若四與三一四一五九二六五方徑一周四積一員徑一周三一四一五竒積七八五三九八一六方徑二周四積四員徑二周六二八三一竒積三一四一五九二六五凡徑倍者周亦倍而其積為倍數之自乘亦謂之再加比例授時厯謂之平差徑二倍周亦二倍而其積則四倍徑三倍周亦三倍而其積九倍乃至徑十倍周亦十倍而積百倍徑百倍周亦百倍而積萬倍皆所加倍數之自乘數亦若平方謂之再加也同周較積較徑凡方員同周則員積大方積小徑亦如之其比例若四與三一四一五九二六五方周一徑二五積六二五員周一徑三一八三九八八積七九五七七四七方周四徑一積一員周四徑一二七三二三九五四積一二七三二三九五四論曰周四則徑與積同數但其位皆升皆視周數之位今用百萬為周則積升六位成萬億矣故雖同而實不同不惟不同而且懸絶定位之法所以當明也問位既大升而數不變何耶曰周徑相乘得積之四倍於是四除其積即得所求平積此平冪之公法也兹方員之周既為四則以乘其徑而復四除之即還本數矣惟周數之四或十或百或千萬億無定而除法之四定為單數故無改數而有進位也又論曰周四倍之徑與周一之徑為四倍其積則十六倍所謂再加之比例渾圎內容立方徑一萬寸求圎徑法以方斜一萬四千一百四十二寸為股自乘得二億為股實以方徑一萬寸為句自乘得一億為勾實併勾股實為三億為弦實開方得弦一萬七千三百二十半寸命為渾圎之徑又以渾圎徑求圍得五萬四千四百十四寸弱周徑相乘得九億四千二百四十七萬六九九四寸為渾冪以四除渾冪得二億三千五百六十一萬九千二百四十八寸竒為大平圎冪即立方一萬寸外切渾圎之腰圍平冪也圎柱積四萬千八百十億四三一八四九八四寸以渾圎徑乘平圎冪得之倍圎柱積以三除之得渾圎積二萬七千二百六九五四五六六五六寸約法立方徑一千尺其積一十尺外切之渾圎徑一十七尺三二五渾圎積二千七百二十尺六九五四約為二千七百二十一尺弱試再用徑上立方求渾圎積法即立方內求所容渾圎以渾圎徑自乘再乘得渾圎徑上立方以圎率三一四竒乘之得數六除之得渾積並同立方與員柱若四與三一四竒同徑之員柱也立方為六方角所成員柱為六員角所成其所容角體並六而方與員異故其比例如同徑之周此條為積之比例員周上自乘之方與渾員面冪若三一四竒與一渾員面冪與員徑上平方形亦若三一四竒與一皆員周與徑之比例渾員面冪與員徑上平員若四與一員柱面冪與員徑上平員若六與一六員角之底皆外向合成此數平員並為一而員柱冪為其六倍渾員冪為其四倍渾員為員柱三之二即此可徴積之比例如其面也以上四條並面冪之比例渾員體與員角體若四與一渾員面既為平員之四倍從面至心皆成角體故體之比例亦四倍立方面與徑上平方若六與一六面故也立方體與渾員體若六與三一四竒渾員面與徑上平方既若三一四竒與一而立方面與徑上平方若六與一平方同為一而立方面為其六倍渾員面為其三倍一四竒故立方之面與渾員之面亦若六與三一四竒也而體之比例同面故亦為六與三一四竒立員得員柱三之二論曰凡員柱之面及底皆立員徑上平員也旁周似員筒亦如截竹周圍並以員徑為髙即員徑乘員周冪也為徑上平員之四倍與渾員面冪同積半徑乘半周得平員則全徑乘全周必平員之四倍合面與底共得平員之六倍而渾員面冪原係平員之四倍是員柱冪六而渾員冪四也而體積之比例凖此可知亦必為三之二矣三之二即六之四之半問體積之比例何以得如面冪曰試於員柱心作員角體至面至底成員角體二皆以半徑為髙平員為底其餘則外如截竹而內則上下並成虛員角于是縱剖其一邉而令員筒伸直以其冪為底以半徑為髙成長方錐底濶如全徑直如員周髙如半徑錐只一㸃此體即同四員角或縱剖為四方錐亦同皆以周四分之一為底濶以全徑為底長以半徑為髙其體並同員角何也以周四之一乘全徑與半徑乘半周同故方底同員底而其髙又同則方角同員角合面底二員用共六員角矣而渾員體原同四員角渾員面為底半徑為髙作員錐即同四員角是員柱渾員二體之比例亦三與二也員角體得員柱三之一凡角體並同凖前論員柱有六員角試從中腰平截為兩則有三員角而員筒體原當四員角今截其半仍為二員角或面或底原係一員角合之成三員角以為一扁員柱然則員角非員柱三之一乎若立方形各從方楞切至心則成六方角皆以方面為底半徑為髙從半徑平切之為扁立方則四周之四方角皆得一半成兩方角而或底或面原有一方角亦是三方角合成一扁立方而方角體亦三之一矣渾員體分為四則所分角體各所乘之渾冪皆與員徑上平員冪等甲戊丙丁渾員體從丑乙辰乙癸乙子乙卯乙寅乙等各半徑各自其渾冪透至乙心而以半徑旋行而割切之則成上下兩員角體一甲卯辰丑乙以甲丑卯辰割渾員之面為底乙為其鋭此割員曲徑自丑而甲而辰居員周三之一一丙癸寅子乙以子丙寅癸渾員之割面為底乙為其鋭此割員曲徑亦三之一如三百六十之一百二十此上下兩角體相等皆居全渾體四之一中腰成鼓形而上下兩面並穵空各成虛員角其外則周遭皆凸面如丑戊子及辰丁癸之割員狀此割員曲徑自辰而丁而癸居員周六之一為三百六十之六十此鼓形體倍大于上下兩角體居渾員全體之半若從戊乙丁腰橫截之為二則一如仰盂一如覆碗而其體亦渾員四之一也如此四分渾體而其割員之面冪即各與員徑上之平員冪等故曰渾員面冪與徑上平員若四與一也問何以知中腰鼓體能倍大于上下兩角體曰試于子丙乙癸角體從子寅癸橫切之則成子未癸午小員面為所切乙子寅癸小員角體之底乃子寅小半徑乘子未癸小半周所成也然則以子寅小半徑乘子未癸小半周又以乙寅半半徑為髙乘之而取其三之一即小角體矣試又于中腰鼓體從丑子及卯寅及辰癸諸立線周遭直切之脫去其外鼓凸形即成員柱體之外周截竹形又從酉乙申橫切之為兩一仰盂一覆碗則此覆碗體舉一式為例可直切斷而伸之亦可成方角體此體以乙寅半半徑乘子未癸午小員全周為底其形長方又以小半徑子寅子寅即乙申為髙而乘之取三之一為長方角體此長方角體必倍大于小員角體何也兩法並以小半徑及半半徑兩次連乘取三之一成角體而所乘者一為小員全周一為小員半周故倍大無疑也又丙癸寅子亦可成角體與乙子寅癸等覆碗體既倍大則兼此兩角體矣凖此而論仰盂體必能兼甲丑卯辰及乙辰卯丑兩角體亦無疑也又角體內既切去一小角體又穵去一相同之小角體則所餘者為丙癸寅子員底仰盂體鼓體內既穵去如截竹之體則所餘者為內平如丑子及辰癸外凸如子戊丑及辰丁癸之空圈體而此體必倍大于員底仰盂體何以知之蓋兩體並以半徑為平面丑子與癸丙並同並以員周六之一為凸面而腰鼓之平面以半徑循員周行員底仰盂之平面則以半徑自心旋轉周行者兩頭全用旋轉者在心之一頭不動而只用一頭則只得其半矣故决其為倍大也凖此而甲丑卯辰亦為穵空之員覆碗體而只得鼓體之半矣由是言之則上下角體各得中腰鼓體之半而鼓體倍大于角形渾體平分為四夫復何疑曰渾體四分如此真無纎芥之疑體既均分為四則其渾體外冪亦勻分為四亦無可復疑但何以知此所分四分之一必與徑上平員相等耶曰此易明也凡割渾員一分而求其冪法皆從其所切平面員心作立線至凸面心而以其髙為股員面心至邉之半徑為勾勾股求其斜弦用為半徑以作平員即與所割圎體之凸面等冪假如前圗所論上下兩角體從丑卯辰橫線切之則以甲卯為股卯丑為句求得甲丑弦與半徑同以作平員與丑卯辰甲凸面等然則此角體之凸面豈不與徑上平員等冪乎甲亢半徑與甲丑同以作丑亢平員與甲丑卯辰凸面等冪試又作甲戊線為半徑之斜線甲乙與戊乙皆半徑為句為股故也以為半徑而作平員必倍大于半徑所作之平員而渾員半冪與之等則渾員半冪不又為平員之倍乎如圖甲丑為半徑作乙庚房平員與丙戊甲平員等亦與甲辰卯丑割員凸面等為渾冪四之一也甲戊為半徑作戊心亥平員與甲丁乙戊半渾冪等而倍大于乙庚房亦倍大于丙戊甲平員則平員居渾冪四之一如是宛轉相求無不吻合則平員為渾員冪四之一信矣取渾冪四之一法當以半徑為通弦以一端抵圎徑之端為心旋而規之則所割渾冪為四之一而其渾冪與圎徑上平員冪等甲辰即丁乙之自冪一百辰卯之自乘冪七十五如四與三則辰丑通弦為徑以作平員亦丁戊全徑上平員四分之三也大小兩平員各為底以半徑為髙而作員角體其比例亦四與三也今渾員徑上平員即下戊徑上平員所作之員角體既為渾積四之一則辰丑通弦徑所作之員角體即渾體十六之三矣即甲丑卯辰角體及乙丑卯辰角體之合若以丑辰通弦上平員為底半半徑為髙而作角體即渾體三十二之三分渾體為四又法甲乙丙渾員體從員周分為三一丑甲辰一辰癸丙一丙子丑各得周三之一又從辰從丙從丑依各半徑辰乙丙乙丑乙皆是至乙心旋而切之則成三角體者三各得渾體四之一一辰甲丑乙一丑子丙乙一丙癸辰乙說見前則其所餘亦渾體四之一也此餘形有三平員面以辰丑丑丙辰丙為員徑而並穵空至乙心如員錐之冪有兩凸面以辰丑丑丙辰丙之員周為界以乙為頂皆弧三角形三角並鋭兩凸面各得渾員冪八之一按辰丑即一百二十度通弦也凖前論以此通弦為圎徑作平員為底半半徑為髙而成員角體此員角體積即為渾員體積三十二分之三即先所論員角體八之三若依此切渾員體成半平半凸之體其積為渾積三十二之五即員角體八之五環堵形面冪錐形面冪有正方正員面欲於周作立圍之堵牆而冪積與之倍法於方面取半徑為髙即得甲乙丙平方於其周作立起之方圍形如環堵取平方乙丙半徑為髙則方圍面冪倍大於平方論曰從平方心乙對角分平方為四成四三角形並以方根為底半徑為髙于是以此四三角形立起令乙鋭上指則皆以乙丙半徑為髙而各面皆半冪故求平方以半徑乘周得冪也然則依方周作方牆而以半徑為髙豈不倍大於平方冪乎凖此論之凡六等邉八等邉以至六十四等邉雖至多邉之面而從其各周作牆各以其半徑為髙則其冪皆倍于各平冪矣然則平員者多邉之極也若於其周作立圈如環而以其半徑為髙則環形冪積亦必倍大於平員有方錐員錐於其周作圍牆而冪積與之倍法於錐形之各斜面取其至鋭之中線如乙丙以為環牆之髙即得方牆如環堵底用方周髙如乙丙即斜面自鋭至底之斜立中線解曰此以錐體之斜面較冪也論曰凡方錐皆有稜兩稜交于鋭各成三角面而斜立從此斜立之三角面自鋭至根濶處平分之得中線乙丙于是自稜剖之成四三角面而植之則中線直指天頂而各面皆圭形為半冪故凡錐體亦可以中線乘半周得冪也然則于底周作方牆而以中線為髙四面補成全冪豈不倍大乎凖此論之凡五稜六稜以上至多稜多面之錐體盡然矣而員錐者多稜多面之極也則以其斜立線為髙而自其根作員環則其員環之冪亦必倍大于員錐之冪前條所論切渾員之算得此益明蓋員仰盂員覆碗及穵空之鼓形其體皆一凸面一平面相合而成其凸面弧徑皆割渾員圈六之一其平面之濶皆半徑然而不同者其內面穵空之平冪一為錐形仰盂覆碗之內空如笠一為環形也鼓體之內空如截竹准前論穵空之環冪必倍大於錐形之冪則其所負之割渾員體亦必環形所負倍大於錐形而穵空之鼓體必能兼員覆碗員仰盂之二體撱圎算法訂厯書之誤偶查撱圎求體法見其截小分之法有誤今以數考之假如撱圎形長徑為一千四百尺短徑七百尺大分截長徑一千五十尺甲己三百五十戊乙七百相并得一千五十以此乘己乙一千五十尺以此除兩數相同右依厯書先求得庚壬甲圎角形為苐三率再用截大分軸己乙為法為苐一率以截小分軸甲己并戊乙半長徑為苐二率求得小分之容與圎角形等夫小分之容形外為弧線圎角之容形外為直線小分必大于圎角而今等是不合也况自此而截小分漸小則乙己大分軸反大于甲己小軸及戊乙并之數而求小分之容反將更小于圎角矣有是理哉小分漸小如辛癸甲則其甲己小于己戊而己乙者己戊與戊乙并也則其數亦大于甲己與戊乙并矣又如截大分長七百二十分己乙為其軸甲己為其小分軸六百八十分依厯書法甲己小分軸六百八十為一率甲乙長徑一千四百并戊乙短徑七百共二十一百為二率求到庚壬乙圎角體為三率則所得四率為大分之容者比圎角容大三倍有竒亦恐無是理也何也圎角在圎柱形為三分之一而撱形必小于柱形不宜有三倍之比例也雖壬庚略小于丙丁在中腰相近可以不論今試求之用苐一圗依勿庵改法假如截己乙大分軸一千五十尺求庚己壬平圎面法先求庚己依勿庵補法以己戊三百五十尺自乘一十二萬二千五百尺與甲戊七百尺自乘四十九萬尺相減餘三十六萬七千五百尺開方得己庚相當之原數再以丙戊三百五十尺乘之甲戊七百尺除之為己庚實數倍之為庚壬線再以壬庚線上方變為平員今用簡法因長徑甲乙與短徑丙丁原是折半之比例故也竟以減餘三十六萬七千五百尺命為庚壬線上方以十一乘之得四百四萬二千五百尺又以十四除之得二十八萬八千七百五十尺為庚壬線上所截撱體之平圎面法以平圎面各乘其大分小分之軸一千五十尺三百五十尺皆成圎柱形乃三除之為大小分內所容之大小圎角形再以長徑一千四百尺乘大圎角為實小軸三百五十尺除之為所截撱形之大分以長徑一千四百尺乘小圎角為實大軸一千五十尺除之為所截撱形之小分今用簡法置平圎面三除之得九萬六千二百五十尺以小分軸三百五十乘之得庚甲壬小圎角形三千三百六十八萬七千五百尺置小圎角四因三除之得四千四百九十一萬六千六百六十六又三之二為所截小圎分又置圎面三除之積九六二五以大分軸一千五十尺乘之得庚子乙大圎角形一億一百六萬二千五百尺置圎角形一一六二五用四因之得四億四百二十五萬尺為所截大圎分小圎分大圎分兩形并之共四億四千九百一十六萬六六六六為撱形全積另求撱形全積置短徑七百自乘得四十九萬以長徑一千四百乘之得六億八千六百萬以十一因之二十一除之得三億五千九百三十三萬三三三為真撱圎全積以真撱圎積與兩截形并相較其差為九十分之一而弱若用厯書法求得截小分二千三百六十八萬七千五百尺與小圎角同截大分六億六百三十七萬五千為大圎角之六倍相并得六億四千六萬二千五百尺為撱圎全積與撱圎真積相較其差更甚如是輾轉推求則知撱體大截分不可算今别立法凡撱體皆先如法求其全積再如法求其小分截積以小分截積減全積餘為大分截積此法無弊可存厯算全書卷五十六
