body:
  text: 厯算全書卷三十一宣城梅文鼎撰籌算二之三開平方法勿菴氏曰自周髀算經特著開平方法其說謂周公受于商髙矩地規天為用甚大然有實無法故少廣之在九數別自為章今以籌御之簡易直截亦數學之一樂也解曰平方者長濶相等之形也其中所容古謂之冪積亦曰面冪西法謂之面面有方有圓此所求者方面也其法有方有亷有隅總曰平方也冪音覔覆物中也開亦除也以所有散數整齊而布列之為正方形故不曰除而曰開平方四邊相等今所求者其一邊之數西法謂之方根如後圖方者初商也初商不盡則倍初商之根為亷法除之得兩亷又以次商為隅法自乘得隅隅者以補兩廉之空合一方兩亷一隅成一正方形如圖一方兩廉一隅除積仍不盡則合初商次商倍之為廉法除之以得次兩廉又以三商為隅法自乘得隅合一方四廉兩隅成一正方形商四次以上倣此加之解曰上兩位者自乘之積也假如方一十則其積一百方二十則其積四百以至方九十則其積八千一百也下一位者方根也假如積一百則其根一十積四百則其根二十乃至積八千一百則其根九十也平方籌式列左開平方籌只用兩位積數何也曰開方難得者初商耳平方積數雖多而初商所用者只兩位次商以後皆亷積也亷積可用小籌除之開方大籌専為初商故積止兩位籌下一位單數也而實有百也萬也百萬也億也百億也萬億也百萬億也皆與單同理故獨商首位者用下位之積數焉其積自一至九其方根為一二三籌上一位十數也而實有千也十萬也千萬也十億也千億也十萬億也干萬億也皆與十同理故合商兩位者用上下兩位之積數焉其積自一六至八一其方根自四至九用法曰先以實列位列至單位止實有空位作圈以存其位次乃作㸃凡作㸃之法皆從實單位實單位起作一㸃每隔位則㸃之而視其最上一㸃以為用首位有㸃者以實首一位獨商之乃補作一圈于原實之上亦成兩位之形首位無㸃㸃在次位者以實首位合商之皆視平方大籌積數有與相同或差小于實者用之以減原數而得方數即初商也定位法曰既得初商則約實以定其位知其所得為何等或單或十或百之類以求次商其法依前隔位所作之㸃總計之視有若干㸃假如只一㸃者初商所得必單數也自方一至方九則初商已盡無次商矣有二㸃者初商所得必十數也自方一十至方九十初商十數者有次商有三㸃者初商所得必百數也自方一百至方九百初商百數者有次商又有三商有四㸃者初商千也有商四次焉有五㸃者初商萬也有商五次焉次商法曰依前術定位則知其宜有次商與否若已開得單數雖減積不盡不必更求次商也雖未開得單數而初商減盡亦不必更求次商也惟初商未是單數而減積又有不盡是有次商矣次商者倍初商為亷法用小籌以除之初商一則用第二籌初商七則用第一第四兩籌皆取倍數視籌積數有小于餘實者用之為亷積視亷積在小籌某行命為次商數既得次商減去亷積即用次商數為隅法以求隅積隅積小平方也即隅法自乘之數也可借開方籌取之若隅積大于餘實不及減者轉改次商及減而止以數明之假如積一百其方根十即除實盡此獨用方法無亷隅矣若積一百四十四初商十除實百餘四十四則倍初商之根得草為亷法在初商之兩旁故曰亷亷有二故倍之也次商二以乘亷得四十為亷積又次商二為隅法自乘得四為隅積共四十四除實盡開其根得一十二也商三次以上法曰次商所得尚非單數而減積又有不盡是有第三次商矣商第三次者合初商次商數皆倍之為次亷法如前用籌以除餘實求得第三商以减亷積又即以第三商之數為隅法以求隅積皆如次商商四次五次以上並同第三商命分法曰但開至單數而有餘實者是不盡也不盡者以法命之法以所開得數倍之又加隅一為命分不盡之數為得分凡得分必小于命分亦有開未至單宜有續商而其餘實甚少不能除作單一者亦如法命之而于其開得平方數下作圈紀其位如云平方每面幾十又幾十幾分之幾或平方每面幾百又幾百幾十幾分之幾若欲知其小分別有開除分秒法見第七卷列商數法曰凡初商得數而書之有二法其法依前隔位所作㸃以最上一㸃為主凡得數皆書于此㸃之上一位五以上者又進一位故有二法也其故何也五以上之亷倍之則十故豫進一位以居次商四以下雖倍之猶單數也所以不同凡歸除開平方須明此理不則皆誤矣大約所商單數必在亷法之上一位乃法上得零之理也平方有實無法亷法者乃其法也凡次商列位亦有二法次商用歸除除法者皆書于籌之第一位故次商以之看次商所減之數其籌行內第一位是空與否若不空即以次商數對而書之對餘實首一位是也若第一位是圈即以次商數進位書之以暗對其圈餘實上一位是也知此則知空位矣次商有一定之位故空位亦一定也如次商與初商隔位則作圈隔兩位作兩圈是也商三次以上書法並同隅積定位法曰凡減隅積皆視其隅數為何等隅數即次商之數也或單或十或百千等以求其積隅數是單其減隅積亦盡于單位隅數是十其減隅積必盡于百位隅數是百其減隅積必盡于萬位隅數千其隅積必百萬隅數萬其隅積必億每隅數進退一位則隅積差兩位隅積小平方也故皆與初商同理還原法曰凡開方還原皆以所開得數為法又為實而自相乘之有不盡者以不盡之數加入即得原數假如有積三百六十平方開之列位單位作圈作㸃從單位起視首位有㸃以首位三百獨商之乃視平方籌積數有小于三者是一也一之方一故商一十有二㸃故初商是十于原實內減去方積一百餘二百六十初商是十知有次商以上一㸃為主凡得數皆書于此㸃之上一位此常法也四以下用常法次倍初商一十作二十用第二籌為亷法視籌第九行積一八小于二六次商九于初商一十之下去亷積一百八十餘八十所減數在籌上一位不空故以商數九對餘實首位書之次以次商九為隅法其隅積八十一大于餘實不及減應轉改次商為八視籌之第八行積數一六減亷積一百六十餘一百所減第一位下空故對位書之乃以次商八為隅法減隅自乘積六十四餘三十六不盡隅數單故減隅積亦盡于單位初商一十次商八共一十八是已開至單位也而有單位也以法命之以平方一十八倍之又加隅一共三十七為命分命為平方一十八又三十七分之三十六還原法以平方一十八用籌為法即以平方一十八為實而自相乘之得三百二十四加入不盡之數三十六共得三百六十如原數命分還原論詳別卷假如有積一十二萬九千六百平方開之列位作㸃視首位無㸃㸃在次位以兩位一十二萬合商之乃視平方籌積有小于一二者是九其方三也于是商三百三㸃故初商百減去方積九萬餘三萬九千六百初商百故知有次商次倍初商三百作六百用第六籌為亷法視籌第六行積數三六小于三九次商六十于初商三百之下減去亷積三萬六千餘三千六百所減首位不空故對書之次以次商六十為隅法減隅積三千六百恰盡隅數十故減隅積必盡于百位凡開得平方三百六十開方雖未至單減積已盡是方面無單數也後倣此還原法以所得平方三百六十為法為實而自相乘之得一十二萬九千六百如原數假如有積一千平方開之列位作㸃視㸃在次位以首二位一千百合商之乃視平方籌小于一者九也九之方三商作三十二㸃故初商十減方積九百餘一百次以初商三十倍作六十用第六籌為亷法視第六籌第一行是六小于一百次商一千初商三十之下減亷積六十餘四十所減是六首位空也故書于進位以對其今雖對于餘實以所減六十言之猶進位也列位之理明矣次以次商一為隅法減隅積一餘三十九不盡隅積盡單位所開已至單位而有不盡以法命之倍所商三十一又加隅一共六十三為命分命為平方三十一又六十三分之三十九此以上皆初商四以下列位之例皆以最上之一㸃為主而書其初商所得數于㸃之上一位乃常法也假如有積四千九十六平方開之列位作㸃視㸃在次位以四千百合商之乃視平方籌積數有三六小于四其方六也商作六十二㸃故初商十減方積三千六百餘四百九十六初商十故知有次商以最上一㸃為主而書其得數于㸃之上兩位乃進法五以上用進法次倍初商六十作一百二十為亷法用第一第二兩籌視籌第四行積數四八小于餘實次商四於初商六十之下減亷積四百八十餘一十六所減是四八首位空也故次商四進位書之若初商不進則次商同位矣次以次商四為隅法減隅積一十六恰盡隅數單故隅積盡單位凡開得平方六十四假如有積八千九十九以平方開之列位作㸃視㸃在次位以八千百合商之乃視平方籌有六四小于八其方八也于是商八十二㸃故初商十除實六千四百餘一千六百九十九初商是十宜有次商次以初商八十倍作一百六十為亷法用第一第六兩籌合視兩籌第一行積一六與餘實同宜商一十因無隅積改用第九行一四四次商九于初商八十之下減亷積一千四百四十餘二百五十九所減第一位不空故對位書之次以次商九為隅法減隅積八十一仍餘一百七十八不盡隅數單隅積盡單位已開至單位而有不盡以法命之應倍所商八十九又加隅一共一百七十九為命分命為平方八十九又一百七十九分之一百七十八因少一數故不能成九十之方假如有積二千五百四十八萬二千三百四平方開之列位作㸃視㸃在次位以二千五百萬合商之乃視平方籌積有二五與實相同其方五也商五千四㸃故初商千除方積二千五百萬餘四十八萬二千三百四初商千有次商又法既以四㸃知所得為五千倍之則為一萬即亷法也法上一位便是單逆上三倍則五千位矣次倍初商五千作一萬為亷法用第一籌視籌第四行積四與餘實同次商四十于初商五千之隔位減亷積四十萬餘八萬二千三百四所减是四故進位書之以對其然與初商五千猶隔一位故知所得為四十此定位之法之妙也次以次商四十為隅法減隅積一千六百餘八萬七百四隅數十故減隅積盡于百位商至十有末商次合初商次商倍之得一萬八十為亷用第一第八并二空位共四籌大凡商五數以上則其亷法視所商方數必進一位不論初商次商皆然若四以下則其亷法視方數必同位亦初次商盡然合視籌內第八行積數八六四小于餘實又次商八于先商五千四十之下減亷積八萬六百四十餘六十四此所減第一位亦是故商數八亦進位書之以對其次以末商八為隅法用減隅積六十四恰盡隅數是單故減隅積亦必盡于單位凡開得平方五千四十八以上皆商五以上進書例也常法中有初商得二或四者進法中有初商得七或九者並雜見開方分秒法并開方捷法中開立方法籌算三勿菴氏曰物可以長短度者泰西家謂之線線之原度一橫一縮而自相乘之以得其羃積者平方也西法謂之方面方面與線再相乘而得其容積則立方也西法謂之體解曰平方長濶相等形如碁局立方長濶髙皆相等形如骰子細分之有方有平亷有長亷有小隅總曰立方立方亦有實無法以所有散數整齊之成一立方形故亦曰開立方長濶髙皆等今所求者其一邊之數故西法亦曰立方根如圖方者初商也初商不盡則再商之于是有三平亷三長亷一小隅共七并初商方形而八合之成一立方形如圖方形者長濶髙皆如初商之數方形只一如圖平亷形者長濶相同皆如初商數其厚則如次商數平亷形凡三以輔于方形之三面長亷者長如初商數其兩頭髙與濶等皆如次商數長亷形亦三以補三平亷之隙小隅者長濶髙皆等皆如次商數其形只一以補三長亷之隙商三位圖如後圖一方三平亷三長亷一小隅除實仍不盡則更商又得次平廉次長廉各三次小隅一合之共十五形凑成一大立方形次平亷之長濶相等皆如初商并次商之數厚如三商數其形三以輔初商并次商合形之外次長亷之長如初商并次商之數其濶與厚相等皆如三商數其形亦三以補次平亷之隙次小隅之長濶髙皆等皆如三商數其形只一以補次長亷之隙立方籌式列後解曰上三位者自乘再乘之積也假如根一十則其積一千根二十則其積八千乃至根九十則其積七十二萬九千也次兩位者自乘之積即平方也置于立方籌者以為亷法之用假如初商一百則其平亷亦方一百其積一萬乃至商九百則其平亷方九百而積八十一萬也又如次商一十則其長亷之兩頭亦必方一十而積一百乃至次商九十則其長亷之兩頭必方九十而積八千一百也下一位者方根也假如立積一千則其根一十立積八千則其根二十乃至積七十二萬九千則其根九十也立方籌三位何也自乘再乘之數止于三位也且以為初商之用故只須三位其餘實雖多位皆亷積耳用法曰先以積列位至單位止無單者作圈以存其位次作㸃從單位㸃起每隔兩位作一㸃即滿三位去之之法也㸃訖視最上一㸃以為用㸃在首位者獨商之以首位為初商之實單數商法也若千若百萬若十億若萬億若千萬億凡以三位去之餘一位者皆與單法同㸃在次位者合首兩位為初商之實十數商法也若萬若千萬若百億若十萬億若兆凡以三位去之餘二位者皆與十同法㸃在第三位者合首三位為初商之實百數商法也若十萬若億若千億若百萬億若十兆凡以三位去之餘三位者皆與百同法又法視其㸃在首位則于原實之上加兩圈㸃在次位者上加一圈皆合三位而商之次以初商之實與立方籌相比勘視立方籌積數有與實相同或差小于實者用之以減原實而得其立方之數即初商也定位法曰既得初商則約實以定位知所得立方為何等或單或十百等以知有續商與否皆以前所作㸃而合計之視有若干㸃之命之假如只有一㸃則商數是單初商已得單數無次商有二㸃者商數十初商十數者有商兩次焉有三㸃者商數百初商百數者有三三次焉四㸃商千五㸃商萬每多一㸃則得數進一位而其商數亦多一次皆以商得單數乃盡也减積法曰凡初商减積皆止于最上㸃之位次商法曰依前定位若初商末是單而减積未盡是有次商也次商者有平亷法有長亷法有隅法解曰平亷古曰方法長亷法古曰亷法以後或曰平亷長長亷從質也或省曰方法亷法從古也先以所得初商數三之為亷法又以初商數自乘而三之為三法以方法用籌除積以得次商以列位之法定之其法見後既得次商用其數以乘方法為三平亷積又以次商自乘以乘亷法為三長亷積其次商即為隅法以隅法自乘再乘得小立方積為隅積乃併三平亷三長亷一小隅積為次商亷隅共積若此亷隅共積與餘積適等或小于餘積則減而去之視其仍餘若干以為用或續商或以法命之若共積反大于餘實不及減轉改次商及減而止若次商單一而無減以法命之商三次法曰次商尚未是單而減積未盡是有第三次商也第三次商者合初商次商得數而三之為亷法又合初商次商得數自乘而三之為方法如前以方法用籌除餘實求得第三商亦以列位法詳其所得既得第三商如前求得三平亷三長亷一小隅積以減餘實其法並同次商四次以上皆同法命分法曰但商得單數而有不盡則以法命之未商得單數而餘實甚少不能商單一者亦以法命之其法以所商立方數自乘而三之如平亷又以立方數三之如長亷又加單一如小隅併三數為命分不盡之數為得分其命分必大于得分列商數法曰依前隔位作㸃以最上一㸃為主而論之有三法凡商得立方一數者于此㸃之上一位書之或單一或一十或一百或一千並同此常法也若商得立方二三四五者于此㸃之上兩位書之單十百千其法並同乃進法也若商得立方六七八九者于此㸃之上三位書之單十百千其法並同乃超進法也平方只有進法而立方有三法何也平方以亷法為法而平方只二亷故其亷法之積數只有進一位故止立進法與常法為二也立方以方法為法而立方有三平廉故其方法之積數有進一位進兩位故立進法超進法而與常法為三也其預為續商之地使所得單數居于法之上一位則同假如立方單一其方法單三若立方單二則方法一十二變為十數進一位矣故單一用常法而單二即用進法也又如立方單五其方法七十五若立方單六則方法一百八又變百數進兩位矣故單五只用進法而單六以上必用超進之法也假如立方一十其方法三百若立方二十則方法一千二百變千數進一位矣故一十只用常法而二十即用進法也又如立方五十其方法七千五百若立方六十則方法一萬八百又變萬數進兩位矣故五十仍用進法而六十以上必用超進之法也若宜進而不進宜超進而不超進則初商次商同位矣不宜進而進則初商次商理不相接矣此歸除開立方之大法也其次商列位理本歸除以所減積數首一位是空不是空定其進退皆同平方商三次以上並同隅積法曰隅法單隅積盡單位隅法是十隅積盡于千位隅法百隅積盡百萬之位以上倣求大約隅法大一位則隅積大三位還原法曰置開得立方數為實以立方數為法乘之得數再以立方數乘之有不盡者加入不盡之數即得原實假如有積一千三百三十一立方開之列位作㸃從單位起視首位有㸃以一千為初商之實乃視立方籌有一其立方一于是商一十有二㸃故商十減去立方積一千餘三百三十一初商十者有次商也以最上㸃為主商一數者書于㸃之上一位常法也次以初商一十而三之得三十為亷法又以初商一十自乘而三之得三百為方法用第三視籌第一行積數三與餘實同次商一於初商一十之下減積首位是故進位書于一十之下以暗對其于是以次商一乘方法仍得三百為平亷積又以次商一自乘仍得一用乘亷法仍得三十為長亷積又以次商一自乘再乘皆仍得一為隅積併三積共三百三十一除餘實恰盡凡開得立方一十一還法以立方一十一自乘得一百二十一又以一十一再乘合原積假如有積一十二億五千九百七十一萬二千立方開之列位作㸃視首位有㸃以一十億為初商之實乃視立方籌有一其方亦一于是商一千減立方積一十億餘二億五千九百七十一萬二千次以初商一千而三因之得三千為亷法又以初商一千自乘得一百萬而三之得三百萬為方法用第三籌視第三籌之第八行積數二四小于餘實次商八十于初商一千之下一位所減首位不空故次商八書本位而上一位作因與次商隔位故知其是十就以次商八十乘方法三百萬得二億四千萬為平亷積又以次商八十自乘得六千四百用乘廉法三千得二千九百二十萬為長亷積又次商八十自乘再乘得五十一萬二千為隅積併三積共二億五千九百七十一萬二千除實盡凡開得立方一千八十初商千次商八是十而除實已盡是所商單位亦也此列位之妙以上皆商得一數例也皆以最上一㸃為主而以初商得數書于㸃之上一位乃常法也惟商得一數者可用常法一十一百一千一萬並同假如有積九千二百六十一立方開之列位作㸃視㸃在首位以九千命為初商之實乃視立方籌積有小于九者八也其立方二于是商二十二㸃故初商十減立方積八千餘一千二百六十一以最上一㸃為主而以得數書于㸃之上兩位乃進法也商二至五之法也次以初商二十用三因之得六十為亷法又以初商二十自乘得四百而三因之得一千二百為方法用第一第二兩籌合兩籌第一行積一二與餘實相同次商單一于初商二十之下所減首位空宜進書也若初商不先用進法則無以處次商矣故進法自商二始就以次商一乘方法仍得一千二百為三平亷積又以次商一自乘得一用乘亷法仍得六十為三長亷積又以次商一自乘再乘皆仍得一為隅積併三積共一千二百六十一除實盡凡開得立方二十一假如有立方積三萬二千七百六十八立方開之問得若干列位作㸃視㸃在次位以三萬二千為初商之實乃視立方籌積小于三二者是二七其立方三也于是商三十二㸃故初商十減商三十二㸃故初商十減立方積二萬七千餘五千七百六十八次以初商三十用三因得九十為亷法又以初商三十自乘得九百而三之得二千七百為方法用第二第七兩籌合視兩籌第二行積五四小于餘實次商單二于初商三十之下所减首位宜進書以對其就以次商單二乘方法得五千四百為平亷積又以次商自乘得四用乘廉法得三百六十為長廉積又以次商自乘再乘得八為隅積併三積共五千七百六十八除實盡凡開得立方三十二假如有立方積一十一萬七千六百四十九立方開得若干列位作㸃視㸃在第三位以一十一萬七千為初商之實乃視立方籌積有小于一一七者六四也其立方四于是商四十二㸃故初商十減立方積六萬四千餘五萬三千六百四十九次以初商四十用三因之得一百二十為亷法又以初商四十自乘得一千六百而三之得四千八百為方法用第四第八兩籌合視兩籌第九行積數四三二小于餘實次商九于初商四十之下所減首位不空故本位書之就以次商九乘方法得四萬三千二百為平亷積又以次商九自乘得八十一用乘亷法得九千七百二十為長亷積又以次商九自乘再乘得七百二十九為隅積合計亷隅三積共五萬三千六百四十九除實盡凡開得立方四十九假如有積一千六百六十三億七千五百萬立方開得若干列位作㸃視㸃在第三位以一千六百六十億為初商之實乃視立方籌有小于一六六者是一二五其立方五也商作五千四㸃商千除立方積一千二百五十億餘四百一十三億七千五百萬次以初商五千用三因之得一萬五千為亷法又以初商五千自乘得二千五百萬三因之得七千五百萬為方法用第七第五兩籌合視兩籌第五行積三七五小于餘實次商五百于初商五千之下所減首位不空故書本位就以次商五百乘方法得三百七十五億為平亷積又以次商五百自乘得二十五萬用乘亷法得三十七億五千萬為長亷積又以次商五百自乘再乘得一億二千五百萬為隅積併三積共四百一十三億七千五百萬除實盡凡開得立方五千五百以上乃商得二三四五之例也皆以最上一㸃為主而以初商所得進書㸃之上兩位進法也初商得二三四五者用進法單十百千並同假如有積二十六萬二千一百四十四立方開之列位作㸃視㸃在第三位以二十六萬二千為初商之實乃視立方籌有小于二六二者二一六也其立方是六商六十二㸃商十減立方積二十一萬六千餘四萬六千一百四十四以最上一㸃為主而以得數書于㸃之上三位超進法也乃商六至九之法也次以初商六十用三因之得一百八十為亷法又以初商六十自乘得三千六百而三因之得一萬八百為方法用第一空位第八三籌合視籌第四行積四三二小于餘實次商四于初商六十之下所減首位是故進位書之以對其就以次商四乘方法得四萬三千二百為平亷積又以次商四自乘得一十六用乘亷法得二千八百八十為長亷積又以四自乘再乘得六十四為隅積併三積共四萬六千一百四十四除實盡凡開得立方六十四假如有積三十七萬三千二百四十八立方開之列位作㸃視㸃在第三位以三十七萬三千為初商之實乃視立方籌積有小于三七三者是三四三其立方七也商七十二㸃商十減立方積三十四萬三千餘三萬二百四十八次以初商七十用三因之得二百一十為亷法又以初商七十自乘得四千九百三之得一萬四千七百為方法用第一第四第七三籌合視籌第二行積二九四小于餘實次商二于初商七十之下所減首位空故進位書之以對其就以次商二乘方法得二萬九千四百為平亷積又以二自之得四用乘亷法得八百四十為長亷積又以二自乘再乘得八為隅積併三積共三萬二百四十八除實盡凡開得立方七十二假如有積五十三萬一千四百四十一立方開之列位作㸃視㸃在第三位以五十三萬一千為初商之實乃視立方籌積有五一二小于五三一其方八也商八十二㸃商十減立方積五十一萬二千餘一萬九千四百四十一次以初商八十用三因之得二百四十為亷法又以八十自乘得六千四百三之得一萬九千二百為方法用第一第九第二三籌合視籌第一行是一九二小于實次商一于初商之下就以次商一乘方法為平亷積又以一自乘用乘亷法為長亷積又以一自乘再乘為隅積併三積共一萬九千四百四十一除實盡凡開得立方八十一假如有積九十七萬二百九十九立方開之列位作㸃視㸃在第三位以九十七萬為初商之實乃視立方籌有七二九小于九七其方九也商九十二㸃商十減積七十二萬九千餘二十四萬一千二百九十九次以初商九十三之得二百七十為亷法又以九十自之得八千一百而三之得二萬四千三百為方法用第二第四第三三籌合視籌第九行是二一八七小于餘實次商九于初商九十之下所減首位不空故本位書之就以次商九乘方法得二十一萬八千七百為平亷積又以九自乘得八十一以乘亷法得二萬一千八百七十為長亷積又以九自乘再乘得七百二十九為隅積併三積共二十四萬一千二百九十九除實盡凡開得立方九十九此以上皆初商六七八九之例也皆以最上一㸃為主而以得數書于㸃之上三位乃超進法也初商六七八九用超進之法單十百千並同命分例假如有立方八百一十尺問立方每面各若干列位作㸃㸃在第三位以八百一十尺為初商之實視立方籌有小于實者為七二九其立方九商九尺減積七百二十九尺餘八十一尺此商數已至單尺而有不盡當以法命之法以商數九自乘八十一而三之得二百四十三如平亷又置商數九而三之得二十七如長亷加小隅一共二百七十一為命分命為立方每面九尺又二百七十一分尺之八十一此商得單數而有不盡以法命之例也又如有立方積一億二千五百七十五萬尺問立方若干列位作㸃㸃在第三位以一億二千五百萬尺為初商實視立方籌有一二五恰與實合商五百尺減實一億二千五百萬尺餘七十五萬尺有三㸃故知所商是五百尺宜有第二商第三商也乃以初商五百尺自乘二十五萬尺而三之得七十五萬尺為平亷法又以初商五百尺三之得一千五百尺為長亷法視餘實七十五萬尺僅足平亷之數而無長亷知第二商第三商皆空也補作兩圈而以法命之法以平亷法長亷法合數加小隅一共七十五萬一千五百一尺為命分命為立方每面五百尺又七十五萬一千五百一分尺之七十五萬此商數雖未至單而餘實甚少不能成一整數亦以法命之例也厯算全書卷三十一
