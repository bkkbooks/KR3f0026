body:
  text: 厯算全書卷四十二宣城梅文鼎撰方程論卷三致用笇之用惟捷其説惟詳詳説之斯能捷用省笇列位諸法由是以生也故致用次之致用有二一者省笇一者列位例雜見諸卷中故不具列而備論其理省算法亦有二一者行有空則省算一者數偶同則省乘凡方程之法去繁就簡同者去之異者存之歸于一法一實而已矣故三色以上有空位則可徑求若三色方程無空位者必須乘減得數變為二色以求之此常法也若內有一行中空一位則以所空之位列于首而先以其餘兩行不空者如法乘減得數即重列之與原有空位者相對如二色方程也以兩行無空者相乘對減則減去一色惟餘二色其有空者原只二色故可相對如二色也則省一笇原法乘減三次今只兩次故曰省一笇凡三色方程不論一行有空或兩行各有空或三行各有空皆只省一算何也其各行中雖有空位而不相對故也何以知其不相對若兩行有空而又相對則徑可以二色算之矣即不成三色方程三色有空例雜見前卷凡四色五色以至多色有幾行空位者如上省算徑求最為簡捷若中行無空則必如法乘減以五色變四色四色變三色三色又變二色漸次求之不可徑求而省算也今諸書所載皆其各位之有空者耳非通法也而欲以此盡方程可乎凡四色方程有乘減六次者常也若有一位空則省一算一行中空兩位或兩行各空一位而相對則省二算若一行空兩位又一行空一位則省三算止矣或有四行中各空一位而不相對亦只省一算而已何也惟首位空乃能省算若首位不空而空在下數位則乘減之後自然補實不能省矣亦有兩行各空兩位而只省二算者亦以空位相左乘後補實耳故雖四行中各空兩位亦只省三算也假如四色中有一行空兩位則將此無空之三行如法乘減變為兩行又將此兩行如法乘併變為一行此減餘一行却有二位恰興空兩位之行相對矣便以重列如二色方程取之此最方程中要法而諸書未及也故詳論之若四色方程有兩行各空一位而又相對則將其無空之兩行如法互乘而減去此不空之位變為一行與空位之兩行同列如三色法而之尤為易見其四色各行空兩位而省三算即今諸書中所載是也可無更贅然但欲知其為省算方程而非常法耳其四色無空乘減六次者竟無其式故誤以省算為常然既明其理亦不必一一為式矣凡五色方程無空則有乘減十次者常法也五色變四色則有四算四色又變三色則有三算三色又變二色則有二算二色又一算乃得法實合之為十算故五色而為四圖者亦常法也原列一圖以減餘重列為四色而三色而二色又各一圖合之為四圖若有空一位則省一算或空兩位而省二算須兩位空在一行或兩行俱空首位乃可空三位而省三算須空在一行或三行同空首位或一行首位空一行首次兩空則可空四位而省四算須一行空三位而一行又空一位恰與空三位者同或二行俱空首位而一行又空首次兩位乃可或兩行俱空首次亦可空五位而省五算須兩行空首位而一行空首次三位或兩行空首次而一行空首位或一行空首次而一行空首次三之位乃可空六位而省六算須一行空首位一行空首次一行空首次三行位乃可省至六算止矣六算以上雖多空位無關省算也今諸書有載五色方程者皆其各行空三位者耳總計之有空十五位而其為法亦必用四算然後得數則所省者亦只六算而竟不知其為省算之法則習而不察也假如五色方程內只有行空三位法當以有空之三色列于上而先以其無空之四行如法乘減變為四色者三行又以乘減變為三色者二行又以乘減變為二色者一行則恰與空位之行相對矣再乘減一次得所求矣故曰省三算也變四色時省一算變三色時省一算變二色時省一算共省三算假如五色方程內有兩行各空二位而相對法當以有空之二色列于首次而先以其無空之三行如法乘減變為四色者二行又以乘減變為三色者一行則恰與空位之兩行相對矣于是以三色法取之得所求矣故曰省四算也變四色時省二算變三色時亦省二算假如五色方程內有兩行空首位又一行空首次三之三位法當以無空之兩行如法乘減變為四色者一行則恰與空首位之兩行相對矣乃以原數兩行減餘一行相並列之用相乘減變為三色者兩行又相乘減變為二色者一行則又恰與空三位者相對矣乃以原空三位者與減餘列而求之即得之矣故曰省五算也變四色時省三算變三色與二色又各省一算若五色方程內有兩行各空三位者即如一行空兩位一行空三位也法以無空之三行先用乘減變為四色者兩行又以乘減變為三色者一行則恰與空首位次位者對矣取出原空兩位者與減餘列而求之變為二色者一行又恰與空三位者相對矣又取出與減餘列而求之即得所問故亦省五算也變四色三色時各省二算變二色時又省一算共五其兩行雖各空三位而不相對故也若各空三位而相對即成二色方程矣若五色方程各行俱有空位不等要之省六算止矣省六算者必一行空首位而省一算一行空首次而省二算一行空首次三之位而省三算其餘空位必不相對不能省算與無空同也其法先以不空之兩行乘減得數變為四色與空首位者相對又乘減變為三色與空首次者相對又乘減變為二色與空三位者相對再乘減即得所求諸列不能悉具智者反隅可也論曰常與變相待而成告方方程省算而特詳其不省之算者欲窮其變先得其常也以上所論雖止五色引而伸之若六色七色八色九色乃至多色其理一也以常言之二色者一算三色者三算四色者六算五色者十算六色者十五算七色者二十一算八色者二十八算九色者三十六算十色者四十五算十一色五十五算十二色者六十六算以空位言之三色者有省一算四色者有省一算至三算五色者有省至六算六色者有省至十算七色者省十五算八色有省二十一算九色有省二十八算十色有省三十六算十一色有省四十五算十二色有省五十五算以省算所用而言之三色者有只用二算四色者有只用三算五色有只用四算六色有只五算七色有只六算八色有只七算九色有只八算十色有只用九算十一色有只十算十二色有只十一算總而言之二色則只一算三色則有二算或三算四色則有三算以至六算五色則有四算以至于十算六色則有五算至十五算七色則自六算至二十一算八算則自七算至二十八算九色則自八算至三十六算十色則自九算至四十五算十一色自十算至五十五算十二色則自十一算至六十六算擴而充之猶舉一隅耳然其法不外于和較與和較之雜與變愚故不欲以四色五色等分為之目也必如此則方程之法乃為通法若諸書所列四色者必各行空二位五色必各空三位非通法也方程者所以御雜糅正負也而必遞空相等乃可用算是法有所不及而窮于問也豈古人立法之意哉此以上論空位省算省算者乘減併俱省之也非若省乘者但省互乘而不省減乘凡方程互遍乘者取其首位齊同耳故乘減一次則少一色以首位之齊同必減而盡也然亦有其首位之數偶爾相同者法當徑以對減而省其互乘此雖省其乘而不省其減併故與前論省算同而微異也假如和數方程首位同則徑減矣若較數者又須論其正負之名同數矣而又同名徑對減矣同數而不同名則更其一行之正負以相較而後減併焉此要訣也不則首位雖減去而其下之同異淆則加減皆誤矣若和較雜者首位之數同亦必以較數首位之名名其和數之一行而後減併之但省其互乘可也以上論同數省乘亦有首位數雖不同而可以分數相命者則以其分數改其一行之數以從一行則首位齊同而可以對減省其互乘焉可矣若較數或和較雜皆如前法齊同其首位之名斯減併無誤耳較數首位同名則仍之異名者改一行以相從和較雜者以較首位之名名其和數之一行假如兩首位為五與十是倍數也則半之蓋五與十互乘各得五十而其下諸數從之而溢矣今但以首位十半之為五而其下諸數皆半之以相減併則五之之行可無乘而數亦簡明殊散人懷也若兩首位為二十與二是十之一也則以退位之法乘之使二十之一行皆為十之一若為八為四亦倍數也若為八與二是四之一也四除其八之行則得矣若九與三則三之一也以三除九則亦三而其一行皆三除之則可減並矣然三除多有不盡不如只以三因其三之行也若為五與三則六因其五之行而退位五與二則四因退位五與四則八因退位皆同若六十四與八則八之一也八除其六十四之行猶互乘也若此類者不可枚舉得其意者酌而用之可也尤要在首位之必同名亦有不可強齊者如七與二九與四之類只用互乘為無弊也省乘者為省事而設也強齊之反多事矣此以上論分數省乘此外又有不拘首位者但數同則徑以對減施之二色為宜蓋二色方程只須減去一色其所餘即一法一實矣然亦須同名方可減去若異名者改而齊之可也假如較數方程其中一色同名而又同數徑減去矣若但同數而不同名則更其一行之正負乃減去之假如和較雜其中一色同數則以之為主使和數一行皆與此一色同名乃減去之若和較則不須爾但同數者即減去之此二色捷法合此三者省算之理備矣問田糧七則起科甲有上田一畝上次田一畝輸糧七斗乙有上田一畝上次四畝上中一畝糧一石八斗丙有上次上中田各一畝糧五斗丁有上中田中田各二畝糧五斗戊有中田三畝中次五畝中下五畝已有中下八畝下田十三畝庚有中下田下田各十畝皆糧五斗問各則若何法曰此方程斷續法也以甲乙丙借作三色己庚借作二色各如法求得田則則其中兩色自知先以甲乙兩行遍互乘減去上田餘上次田三畝上中田一畝糧一石一斗用與丙行乘減上次田減盡餘上中田二畝為法糧四斗為實法除實得二斗為上中田則例就以上中田則減丙糧五斗餘三斗為上次田則例以上次田則減甲糧七斗餘四斗為上田則例以上三色法也又以上中田則例乘丁田二畝得四斗以減丁糧五斗餘一斗以二畝除之得五升為中田則例又以戊中田三畝乘其則例得一斗五升以減戊糧五斗餘三斗五升為戊田中次中下各五畝之共數因此處斷而不屬故又先求末兩行再以二色法用己庚兩行如法遍乘減去中下田餘下田五畝為法糧一斗為實法除實得二升為下田則例以八因庚行而退位省乘法也以庚下田十畝乘其則例得二斗以減庚糧五斗餘三斗以中下田十畝除之得三升為中下田則例以上二色法也乃以戊中下田五畝乘其則例得一斗五升以減戊中下中次共三斗五升餘二斗以戊中次五畝除之得四升為中次田則例計開上田每畝糧四斗上次田每畝糧三斗上中田每畝糧二斗中田每畝糧五升中次田每畝糧四升中下田每畝糧三升下田每畝糧二升論曰此雖七色因行中斷續即非七色借三色二色之法知其首尾而中行亦見焉所省良多然非省乘其勢則然也以其疑于省算也故附之其末又有數偶相同不論三色四色但一減之後即得一法一實者非省算也然亦省算之類故亦附録一條以見其例假如縀紗絹不知價但云以縀一匹紗五匹易絹九匹餘價二兩六錢又以縀二匹絹八匹易紗四匹餘價六兩八錢又以縀三匹易紗六匹絹七匹少價一兩二錢畣曰縀每匹價銀三兩紗每匹一兩絹每匹六錢法列位因中左紗減盡只餘一色即以絹十九為法除十一兩四錢得絹價每匹六錢以絹餘二十六匹乘價得十五兩六錢同減負一兩六錢餘十四兩紗價也以紗餘十四匹除之得紗價每匹一兩用中右減餘得之以原左行紗六匹價六兩絹七匹價四兩二錢共價十兩二錢同減負一兩二錢餘九兩縀三匹價也三除之得縀價每匹三兩論曰此方程之變例也一減之後即得其數若多色方程除首位外有減盡者先雖無空而減餘重列即成有空方程矣例見本卷齊軍列陳條若三色俱減盡則不能成算或三色方程中左三色俱減盡中右只減一色則所餘者二色而無相較乘減無因不能别其二色亦不能成算也假有問水銀三斤硃砂二斤共價四兩四錢又水銀九斤硃砂六斤共價十三兩二錢問各價若干畣曰此不可以方程算何也彼雖兩宗而其後一宗之物價皆三倍于先一宗互乘之後必須減盡故也凡左行之物俱倍于右行或俱半俱四之一等互乘之後得數齊同不能分核具如前論方程立法正以諸物雜糅多寡錯居同異參伍而得其端倪也又或三色方程而問只二宗則減餘仍有二色不能分别故問三色必有三宗問四色必有四宗五色六色以上悉同何也方乘立法乘減一次始能分去一色若少一行則少一次乘減而不能得其一法一實矣故行中可有空位而不可有空行行中有空者分一行言之也若總列為圖則位皆無空凡此皆治方程者所當知知其有不可算斯無疑于算知其有必不可省斯善為省矣列位之法亦有二一者更其上下之位以互求也或為省算之計凡方程立法務須首位齊同以便減去故每遍乘一次則減去一色遞減之則一法一實矣今行中有空則是不待遍乘而其一色已先減去也故取而列之于上位則能省算不則上位不空而下反空則對位無減補成不空而不能省算矣其法于列位時覆視之有橫列中空位多者取作首位首位空一行則省一算矣若首位原有空位而欲更定次位者不必改列但于重列減餘時檢點更定之可也又橫列中有數偶相同或可以分相命者取作首位亦省遍乘或橫列中有單一數多者取作首位省乘單一數則不須乘故也以上論上下之位一者更其前後之行也凡首位多空而其不空者隔逺則更而聨之便乘減也其各行空位不等者不必更列但以與減餘相對者取出對列而乘減之例見前諸卷若各行首位有可以分相命或數偶相同而為他行所隔亦可更置使之相接又多色方程有各行中對位總空者取出另列而先乘其他行之不空者乃于重列之時漸次添入可免細書局蹐例見後卷以上論前後之行法曰凡多色方程先任意列位竟乃覆視之若首位有空而下則無之此不必更置也或首位多空而下則少亦不必更置也惟首位不空而下反有或首位空少而下反多則更而置之故上下可以互居前後亦可易位或云以末行為主者非也問古今厯術屢更其所用日法無一同者如以漢太初厯日法十有一外加四十九則如殷厯日法也若以太初日法二殷厯日法三再加五十八則如唐大衍厯日法也若太初日法十有四大衍日法二相並以比宋紀元厯日法仍少七十六若太初日法九十倍之即紀元日法其各數若干法以正負列位甲太初十一正殷七一負負四十九乙太初二正殷六三正大衍一負負五十八丙太初十四正大衍二正紀元一負負七十六丁太初九十正紀元一負適足如右圖太初厯橫列皆滿須用遍乘對減者三而後能減去太初之一色其餘雖多空位自然有無減之對位相補不能省算如法改列以最多不空之太初列下為第四位則殷厯居上而成有空位之方程矣先如法以甲乙兩行互乘減併殷厯各正十五對減盡大衍負一無減太初異併負三十五下數異併正二百五因異併故併從甲行之名而大衍在乙行與下數同名亦改負為正乃重列之取出丙行與減餘相對如法互乘減並大衍各正二對減盡紀元負一無減太初異並得正八十四下數異併得負四百八十六又重列之以減餘與丁行相對首位同名同數省互乘紀元各負一對減盡太初同減餘六為法負四百八十六無減為實法除實得八十一分為太初日法以丁行太初九十乘其日法八十一分得七千二百九十分為紀元日法以甲行太初十一乘其日法八十一分得八百九十一異加負四十九得九百四十分為殷厯日法以乙行殷厯三乘日法九百四十得二千八百二十又太初二乘日法得一百六十二又異加負五十八共得三千四十分為大衍日法計開殷厯日法九百四十分漢太初厯日法八十一分唐大衍厯日法三千四十分宋紀元厯日法七千二百九十分又按列位之法原與省乘省算之法相生故共為一卷合觀之可也今以六色無空者為例如後問齊軍千乘其陳有先驅申驅為前軍有啓與胠為兩翼有戎車二廣為中軍有大殿為後軍各不知數但以前軍居餘陳七之三合兩翼二廣與殿多餘陳四十乘合前軍兩翼與中後較則多二十乘前軍合殿與翼中軍較則少二十乘先驅大殿居與陳二之一而少五乘各若干畣曰前軍共三乘內先驅一百四十乘申驅一百六十乘兩翼共二百一十乘內啓與胠各一百五乘中軍共三百乘內戎車一百八十乘帥二廣一百二十乘副後軍一百九十乘是為大殿法以和較雜列位有七之三二之一依變零為整以分母各乘而後列之如法互乘減並變為五色有空而重列之空者偶也若不空亦儼然變為五色矣前三行減餘首位申驅皆空故不須乘減但以末二行乘而減之減去申驅即變四色矣又以申驅數本同故不須乘而竟以對減乃以四色法重列之四色無空法也雖有空而非首位不能省算與無空同因首末兩行之翼數皆倍于中兩行故省互乘但以首末兩行皆半之使其翼數齊同乃原數對減而變為三色又重列之因次行末行戎車同但首行多于次行二之一故省互乘但以次行二分加一與首行對減其次行與末行竟以原數對減變為二色而重列之二廣同故省互乘竟以對減盡大殿異名併得五為法車同名減餘九百五十乘為實法除實得一百九十乘為大殿車數以大殿車數異加正五十乘共二百四十乘以二廣二除之得一百二十乘為二廣車數用末次右行數二乘大殿車數同減負二十乘戎車二除之得一百八十乘為戎車公卒數用第四次三色中行數也二乘戎車異加正六十乘兩翼二除之得二百一十乘為兩翼共數用第三次所列四色之次行又半之即啓與胠數合計兩翼二百一十戎車一百八十二廣一百二十共數五百一十同減負三十乘餘四百八十以申驅三除之得一百六十乘為申驅數用第二次所列五色之第四行合計申驅一百六十兩翼二百一十戎車一百八十二廣一百二十共六百七十同減負十乘餘六百六十又減去大殿二計三百八十餘二百八十以先驅二除之得一百四十乘為先驅之數用原列六色之第五行數試細考之合計兩翼二百一十戎路一百八十二廣一百二十大殿一百九十共七百乘合計先驅一百四十申驅一百六十共三百乘三七差分也故曰前軍為餘陳七之三合計兩翼二百一十二廣一百二十大殿一百九十共五百二十乘其餘前軍共三百戎路一百八十共四百八十乘故曰翼廣殿多餘陳四十乘合計前軍共三百兩翼二百一十共五百一十乘以較中軍共三百後殿一百九十共四百九十乘則多二十乘故正二十乘與前軍翼同名合計前軍三百大殿一百九十共四百九十乘以較兩翼二百一十中軍三百共五百一十乘則少二十乘故負二十乘與前軍殿異名合計先驅一百四十後殿一百九十共三百三十乘又合計申驅一百六十中軍三百兩翼二百一十共六百七十乘其二之一為三百三十五乘故曰先驅大殿居餘陳二之一而少五乘以全當其半而少五乘則以倍當其全而少十乘矣此與第一行皆變零為整詳見帶分條總計之則千乘矣故以和數參焉論曰此一例中能兼數法皆省算之捷訣也其第二圖五色變四色當有互乘減併者四次今以申驅空位省其三次此空位徑求省算之法也其申驅偶爾數同徑以對減與第五圖二色之二廣數同徑以對減皆省乘定法也但皆和較之雜故雖不乘必以較行首位之正負補于和數之行不然則減併誤矣此要訣也其第三圖四色之首位偶有倍數故半其倍者以相從此亦省乘法也其第四圖三色之首位為三與二故加二為三是二加一也故其下皆二分加一則如遍乘矣然亦首位正負偶同也若不同者須更其一行以同之首位雖同數又必同名然後可減而去之尤省乘之要訣又論曰方程無空者常法也如第一圖六色是也若不減併五次何以求之亦偶而多有首位相同者故亦能省乘然雖省乘不能省減併矣其有空位者偶然也如第二圖五色有空是也空位多若更置列之所省尤多雖不更置而減並之餘自然能補其空亦可見方程之有常法矣若更置之則自五色起如後圖因五色始有空也如此圖則省六算戎翼不空故更之下位後行不空者更之前行以先乘正負列位甲乙行如法減去申驅以其餘四位重列之與丙行相對一和一較也重列如法減去二廣又重列之與丁行相對皆較數也如後如法半減餘數以從丁行乃對減而重列之與戊行相對又以翼同故更置之上中下如法徑以對減餘戎路五為法並得正負九百乘為實法除實得戎路數既得戎路數以次得餘重之數合問又術以一圖而為減併如後所列依法先得戎路亦同但其間和較交變錯然雜陳非深知猝不能了不如前術之為安穩明白也歷算全書卷四十二
