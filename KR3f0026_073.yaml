body:
  text: 厯算全書卷五十九宣城梅文鼎撰少廣拾遺開方求亷率作法本原圖自開平方至開八乗方古圖附説圖最上書一者本數也本數者即大方也大方無隅無乘除之可言而數從此起也次並列一一者方邉也西法謂之根數即一十一也左一即本數因有次商而進位成一十為初商之根右單一為次商之根既有根數即有平冪故第三層者幂積也西法謂之面即一百二十一也左一百為初商自乗之幂即大方積也右單一為次商自乗之幂即隅積也小平方也中二十則兩亷積也並長方也如圖大小兩方幂以一角相聫必得兩亷以輔之而其方始全故平方亷積二也第四層者立方積也西法謂之體積即一千三百三十一也左一千初商再乗之積大立方也右單一為次商再乗之積隅積也小立方也中三百三十皆亷積也三百為三平亷積扁立方也三十為三長亷積長立方也如圖析觀之則初商大立方體與次商隅積小立方體相連於一角必得三平亷之扁立方體補於大立方之三面又有三長亷之長立方體補於小立方之三面及三平亷之隙而方體始全故立方之亷積有二等而其數各三也第五層者三乘方也即一萬四千六百四十一也左一萬者大三乗方也初商方積也右單一者小三乗方也次商隅積也大方積既以三乗之故而積陞至萬小隅雖三乘仍單一也其相隔已三位故必有第一亷舊名方法為千數第二亷舊名上亷為百數第三亷舊名下亷為十數以補之其數始足其理亦如平方立方也三乘方以上不可為圖諸書有强為之圖者非也然其理則有可言者焉以其相生之序言之則皆加一筭法也初商次商如十與一而其幂則如百與一故于一一之下各加一一即成如十一之自乘也此平方率也又以十一乗之成即立方率也又以一十乗之成即三乗方率四乗以上凖此加之皆加一法也曰若是則諸乗方皆以十一逓乗而得非十一者何以處之曰根非十一而其理皆如十與一何則凡増一乗積陞一等而亦増一亷亷與亷之積亦皆如十與一也冪音覓周禮冪人掌共巾冪説文覆也開平方四邉俱等中函縱横之積亦如覆物之巾有經緯縷文故謂之冪亦謂之面幂同上省文也見張参五經文字算書或小寫作亷率立成附説凡開方一位除盡者無亷隅也亷隅皆生於次商次商之根必小于初商一等而其小隅之體𫝑必與初商之大方同狀如再乗之隅即小立方三乘方之隅即小三乘方此可借初商表而降等求之不必更立隅法也亷法則不然每増一乗則亷増一等如平方但有亷立方則有平亷長亷三乗方則有三種亷四乘方則有四種亷其亷之等並與其乘數同増而亷亦加多如平方只二亷立方則平亷長亷各三三乗方則三種亷共有十四乗以上則更増而多如圖所列此亷率所由立也問亷既有等如平方亷為十立方亷為十為百之類而今亷率只作單數用何也曰此亷之數也非亷之積也亷積有等則既於其次序分之矣挨次乗之其等自見如第一亷必小于初商大方一等第二亷又小一等其最末之亷必大于小隅一等各乗方皆如是若同一等中應各有若干亷必先知之而後可用故立成中所列皆單數問古圖以右為隅法其序自左而右今亷率之序自右而左何也曰既皆作單數用則左右一也今依筆算自右而左便於取用故也亷法相生之序左右同數如立方平亷三長亷亦三也三乗方第一亷四第三亷亦四也其近大方有若干亷則其近小隅亦有若干亷故左右並同可以左為初商大方右為小隅亦可以右為大方而左為小隅此亦見古圖之妙也問舊有方法亷法之目今㮣曰亷法何也曰開方法有方有亷有隅其初商自乗即方也次商自乗即隅也方與隅之間次商初商相乗而得者皆亷也舊以立方之平亷有似扁方故名之方法而三乗方因之遂又有上亷下亷之目故不如一切去之但以一二三四為序較畫一耳問平方之亷皆平幂也立方之平亷長亷皆體積也不知三乗方以上之亷積亦能與方隅並狀乎曰凡諸乗方之亷積無不與方隅之乗數等也試以三乗方言之其第一亷有四皆初商之再乗積而又以次商根乗之是三乗也其第二亷有六皆初商自乗之平幂也而又以次商之平幂乗之第三亷有四皆初商之根數而又以次商之立積乗之皆三乗也又以四乗方言之其第一亷有五皆初商三乗積也又乗次商根是四乗也其第二亷有十皆初商再乗積也又以乗次商幂亦四乗也其第三亷亦十皆初商幂積也又以乗次商再乗積其第四㢘有五皆初商根也又以乗次商之三乗積皆四乗也五乗方以上俱如是觀後算例自明諸乗方根同而積不同本易知也惟根之一者積同為一似乎無别矣然有幂積之一有體積之一有三乗以上諸乗方之一雖曰積同為一其實不同也今以方根之為单一為一十為一百者為例如右因有續商故方根以十數見例方積以尾定位無次商者去尾用之則方根只為單數多如第一亷用初商立積二亷則初商幂逓減以至三亷則初商只用根近小隅者次商乗之遍數多如第一亷只用次商根第二亷則次商亦用幂三亷則逓加而用次商立積各乗方皆如是開諸乗方大法諸乗方法惟平方為用最多因有専法今自平方立方推之三乗以上至於多乗而通為一法是為大法諸乗方大法可以開平方而平方専法不可以開諸乗方總法凡諸乗方皆先列實次作㸃分段次查表以定初商次求亷隅以定續商列實之法依勿菴筆算作平行兩直線以設積紀于右直線之右皆自上而下至單數止無單數者作存其位作㸃分段之法皆于原積末位單數作一㸃起凡減隅積必至單位故分段之法以此為宗同文算指但言起末位殊混依各乗方宜以若干位為一段即隔若干位㸃之或作實㸃丶或作虚㸃俱可然虚㸃尤便以減商積時有借上位之㸃免凌雜也如平方以每兩位為一段則隔一位㸃之立方以三位為一段則隔兩位㸃之乃至十二乗方以十三位為一段則隔十二位㸃之並同一法謹案作㸃分段其用有二一以定開方有若干次也如有一㸃則只開一次有兩㸃則開二次三㸃則開三次之類一以定開方所得為何等數也如只有一㸃則初商即單數二㸃則初商是十數三㸃則初商是百數之類是故初商減積必至於最上㸃而止也次商減積必至于次㸃而止也每開一次必減積一次而所減之數必各盡于其作㸃之位亦可以驗開方之無誤也又最上㸃以上初商實也次㸃以上次商實也每商皆以㸃位截實此法於初商尤為扼要又案開方分段古人舊法之精錢塘吴信民九章比類山隂周述學厯宗算㑹悉著其説而同文算指西鏡錄本其意以作㸃定之施於筆算為極善也鼎于三十年前見同文算指作㸃之法驚嘆其竒後讀諸書始知其有所祖述非西人創也初商之法皆以最上一㸃截原積若干位為初商實乃查初商表視本乗方下數有與實相同或較小於實者錄之紀于左線之左皆以表數末位對右線上原實最上㸃紀之是為初商應減之積即于本表旁行查方根紀于左線之右皆對所紀表數首位進一位紀之是為初商數以初商應減之積左行所紀與初商實右行最上㸃所截原實對位相減皆以左減右須依筆算從小數減起如左行減數大右行實數反小而不及減則作㸃于上一位借十數減之減不盡者為餘實以待續商凡原實有二㸃則初商為十數而有次商有三㸃初商為百數而有次商及三商以上倣論如實只一㸃則初商即是單數無續商次商之法皆以第二㸃截餘實為次商實凡初商皆為方積次商以後則有亷積隅積先求亷率查亷率立成本乗方亷率有若干等等有若干數平列之為若干行謂之定率如平方只一種亷其定率二立方有二種亷曰平亷曰長亷其定率並三若三乗方則有三種亷曰一亷曰二亷曰三亷其定率曰四四六曰四詳後式每増一乗即亷増一等而定率増一行有亷之等有亷之數如平方有二亷立方有三平亷三長亷此亷之數也平方之兩亷同積共為一等立方之三平亷同積為一等三長亷同積為一等共為二等此亷之等也亷率中兼此二義求亷汎積以各亷定率乗初商應有各數各依本乗方減小一等用之亷多者又遞減挨次乗之至根數止是為汎積有初商數即各帶有自乗冪積二乗立積乃至三乗以上各積是為應有各數也今求汎積當依本乗方減小一等用之如平方只用根數立方用初商冪積乃至十二乗方用初商十一乗此為減小一等也至第二亷則立方用初商根三乗方用初商再乗乃至十二乗方用初商十乗此為亷多者二亷以上又逓減挨次乗之也逓減至初商根則為末後一亷矣故曰至根數止求㳄商數以汎積約餘實得之求亷定積以各亷汎積乗次商數亷多者逓増一等挨次乗之至本乗方減小一等止是為定積凡第一亷汎積皆乗次商根而得定積有第二亷則以次商自乗積乗之有三亷則以次商立方積乗之是為逓増一等也然增不得至本乗方但增至本乗方減小一等數即為末後一亷矣求隅積以次商數查初商表各依本乗方取之以次商對横行根數以本乗方對直行縱横相遇得之列于亷積之後一行是為隅積小隅體勢並同初商大方如平方則隅即小平方立方則隅即小立方三乗方之隅亦為小三乗方四乗以上並同故可借初商表用之求亷隅共積以所得各亷定積及隅積用併法併之即得求次商定數以所得亷隅共積紀左線之左又在表數之左以末位對第二㸃紀之為次商應減之數與次商實右行第二㸃所截對位相減以左減右減不盡者又為餘實以待三商遂紀次商數于初商之下為次商定數如亷隅共積大于次商實不及減則改次商至及減而止乃為次商定數三商以後並同上法不論三商四商乃至多商其亷定率不變但求汎積時三商則並初商次商兩位商數合而用之四商則併前三次商數皆取其應有各數以乗定率而得汎積亦如上法之用初商其求定積則三商即用三商之數四商即用四商之數以乗汎積而得定積亦如上法之用次商餘法並同次商審位之法凡亷汎積大於餘實或僅相等而無隅不能商一數是次商為位也即紀位於先商之次而併下一㸃餘實為續商餘實次商單一之法凡汎積與實僅同而有隅一是商得一數也即以汎積為定積不必更乗次商惟單一則然若商得一十一百一千仍須如法乗之開平方即一乗方設平方積三千三百四十四萬三千八十九問方根若干答曰五千七百八十三列實法先作兩直綫次以方積三三四四三八九列右綫之右作㸃法於實末位單數作一㸃起逆上每隔一位㸃之有四㸃宜商四次初商是千初商法曰用最上一㸃截原實兩位三三為初商實查表有小於實三三者是二五其方根五即以五為初商對實首上一位書于左綫之右却以表數二五對實三三書左綫之左與原實對減先於實次位減五實係三不足減作㸃借上一數為十三減去五餘八改書八于實三之右次於實首減二原實是三因借下去一只得二減盡乃作綫抹去三三存八以待次商亦于左作綫抹去減數二五求次商用第二㸃上餘實八四四為次商實隅次商自乗四九亷隅共積併得七四九次商法曰置亷率立成内定率二乗初商五千得一萬為汎積乃約實作七百定為次商即以汎積乗之得定積七百萬再用次商自乗為隅其積四十九萬併定積成七百四十九萬即亷隅共積也俱如式列之于是將次商七續書初商五之下又將共積七四九對實八四四書左綫之左以減實餘九五乃作綫抹去八四四亦于左作綫抹去七四九求三商用第三㸃上餘實