body:
  text: 厯算全書卷五十九宣城梅文鼎撰少廣拾遺開方求亷率作法本原圖自開平方至開八乘方古圖附說圖最上書一者本數也本數者即大方也大方無隅無乘除之可言而數從此起也次並列一一者方邉也西法謂之根數即一十一也左一即本數因有次商而進位成一十為初商之根右單一為次商之根既有根數即有平冪故第三層者幂積也西法謂之面即一百二十一也左一百為初商自乘之幂即大方積也右單一為次商自乘之幂即隅積也小平方也中二十則兩亷積也並長方也如圖大小兩方幂以一角相聫必得兩亷以輔之而其方始全故平方亷積二也第四層者立方積也西法謂之體積即一千三百三十一也左一千初商再乘之積大立方也右單一為次商再乘之積隅積也小立方也中三百三十皆亷積也三百為三平亷積扁立方也三十為三長亷積長立方也如圖析觀之則初商大立方體與次商隅積小立方體相連於一角必得三平亷之扁立方體補於大立方之三面又有三長亷之長立方體補於小立方之三面及三平亷之隙而方體始全故立方之亷積有二等而其數各三也第五層者三乘方也即一萬四千六百四十一也左一萬者大三乘方也初商方積也右單一者小三乘方也次商隅積也大方積既以三乘之故而積升至萬小隅雖三乘仍單一也其相隔已三位故必有第一亷舊名方法為千數第二亷舊名上亷為百數第三亷舊名下亷為十數以補之其數始足其理亦如平方立方也三乘方以上不可為圖諸書有强為之圖者非也然其理則有可言者焉以其相生之序言之則皆加一算法也初商次商如十與一而其幂則如百與一故于一一之下各加一一即成如十一之自乘也此平方率也又以十一乘之成即立方率也又以一十乘之成即三乘方率四乘以上凖此加之皆加一法也曰若是則諸乘方皆以十一遞乘而得非十一者何以處之曰根非十一而其理皆如十與一何則凡增一乘積升一等而亦增一亷亷與亷之積亦皆如十與一也冪音覓周禮冪人掌共巾冪說文覆也開平方四邉俱等中函縱橫之積亦如覆物之巾有經緯縷文故謂之冪亦謂之面幂同上省文也見張參五經文字算書或小寫作亷率立成附說凡開方一位除盡者無亷隅也亷隅皆生於次商次商之根必小于初商一等而其小隅之體𫝑必與初商之大方同狀如再乘之隅即小立方三乘方之隅即小三乘方此可借初商表而降等求之不必更立隅法也亷法則不然每增一乘則亷增一等如平方但有亷立方則有平亷長亷三乘方則有三種亷四乘方則有四種亷其亷之等並與其乘數同增而亷亦加多如平方只二亷立方則平亷長亷各三三乘方則三種亷共有十四乘以上則更增而多如圖所列此亷率所由立也問亷既有等如平方亷為十立方亷為十為百之類而今亷率只作單數用何也曰此亷之數也非亷之積也亷積有等則既於其次序分之矣挨次乘之其等自見如第一亷必小于初商大方一等第二亷又小一等其最末之亷必大于小隅一等各乘方皆如是若同一等中應各有若干亷必先知之而後可用故立成中所列皆單數問古圖以右為隅法其序自左而右今亷率之序自右而左何也曰既皆作單數用則左右一也今依筆算自右而左便於取用故也亷法相生之序左右同數如立方平亷三長亷亦三也三乘方第一亷四第三亷亦四也其近大方有若干亷則其近小隅亦有若干亷故左右並同可以左為初商大方右為小隅亦可以右為大方而左為小隅此亦見古圖之妙也問舊有方法亷法之目今概曰亷法何也曰開方法有方有亷有隅其初商自乘即方也次商自乘即隅也方與隅之間次商初商相乘而得者皆亷也舊以立方之平亷有似扁方故名之方法而三乘方因之遂又有上亷下亷之目故不如一切去之但以一二三四為序較畫一耳問平方之亷皆平幂也立方之平亷長亷皆體積也不知三乘方以上之亷積亦能與方隅並狀乎曰凡諸乘方之亷積無不與方隅之乘數等也試以三乘方言之其第一亷有四皆初商之再乘積而又以次商根乘之是三乘也其第二亷有六皆初商自乘之平幂也而又以次商之平幂乘之第三亷有四皆初商之根數而又以次商之立積乘之皆三乘也又以四乘方言之其第一亷有五皆初商三乘積也又乘次商根是四乘也其第二亷有十皆初商再乘積也又以乘次商幂亦四乘也其第三亷亦十皆初商幂積也又以乘次商再乘積其第四廉有五皆初商根也又以乘次商之三乘積皆四乘也五乘方以上俱如是觀後算例自明諸乘方根同而積不同本易知也惟根之一者積同為一似乎無别矣然有幂積之一有體積之一有三乘以上諸乘方之一雖曰積同為一其實不同也今以方根之為單一為一十為一百者為例如右因有續商故方根以十數見例方積以尾定位無次商者去尾用之則方根只為單數多如第一亷用初商立積二亷則初商幂遞減以至三亷則初商只用根近小隅者次商乘之遍數多如第一亷只用次商根第二亷則次商亦用幂三亷則遞加而用次商立積各乘方皆如是開諸乘方大法諸乘方法惟平方為用最多因有専法今自平方立方推之三乘以上至於多乘而通為一法是為大法諸乘方大法可以開平方而平方専法不可以開諸乘方總法凡諸乘方皆先列實次作㸃分段次查表以定初商次求亷隅以定續商列實之法依勿菴筆算作平行兩直線以設積紀于右直線之右皆自上而下至單數止無單數者作存其位作㸃分段之法皆于原積末位單數作一㸃起凡減隅積必至單位故分段之法以此為宗同文算指但言起末位殊混依各乘方宜以若干位為一段即隔若干位㸃之或作實㸃丶或作虛㸃俱可然虛㸃尤便以減商積時有借上位之㸃免凌雜也如平方以每兩位為一段則隔一位㸃之立方以三位為一段則隔兩位㸃之乃至十二乘方以十三位為一段則隔十二位㸃之並同一法謹案作㸃分段其用有二一以定開方有若干次也如有一㸃則只開一次有兩㸃則開二次三㸃則開三次之類一以定開方所得為何等數也如只有一㸃則初商即單數二㸃則初商是十數三㸃則初商是百數之類是故初商減積必至於最上㸃而止也次商減積必至于次㸃而止也每開一次必減積一次而所減之數必各盡于其作㸃之位亦可以驗開方之無誤也又最上㸃以上初商實也次㸃以上次商實也每商皆以㸃位截實此法於初商尤為扼要又案開方分段古人舊法之精錢塘吳信民九章比類山隂周述學厯宗算㑹悉著其說而同文算指西鏡録本其意以作㸃定之施於筆算為極善也鼎于三十年前見同文算指作㸃之法驚嘆其竒後讀諸書始知其有所祖述非西人創也初商之法皆以最上一㸃截原積若干位為初商實乃查初商表視本乘方下數有與實相同或較小於實者録之紀于左線之左皆以表數末位對右線上原實最上㸃紀之是為初商應減之積即于本表旁行查方根紀于左線之右皆對所紀表數首位進一位紀之是為初商數以初商應減之積左行所紀與初商實右行最上㸃所截原實對位相減皆以左減右須依筆算從小數減起如左行減數大右行實數反小而不及減則作㸃于上一位借十數減之減不盡者為餘實以待續商凡原實有二㸃則初商為十數而有次商有三㸃初商為百數而有次商及三商以上倣論如實只一㸃則初商即是單數無續商次商之法皆以第二㸃截餘實為次商實凡初商皆為方積次商以後則有亷積隅積先求亷率查亷率立成本乘方亷率有若干等等有若干數平列之為若干行謂之定率如平方只一種亷其定率二立方有二種亷曰平亷曰長亷其定率並三若三乘方則有三種亷曰一亷曰二亷曰三亷其定率曰四四六曰四詳後式每增一乘即亷增一等而定率增一行有亷之等有亷之數如平方有二亷立方有三平亷三長亷此亷之數也平方之兩亷同積共為一等立方之三平亷同積為一等三長亷同積為一等共為二等此亷之等也亷率中兼此二義求亷泛積以各亷定率乘初商應有各數各依本乘方減小一等用之亷多者又遞減挨次乘之至根數止是為泛積有初商數即各帶有自乘冪積二乘立積乃至三乘以上各積是為應有各數也今求泛積當依本乘方減小一等用之如平方只用根數立方用初商冪積乃至十二乘方用初商十一乘此為減小一等也至第二亷則立方用初商根三乘方用初商再乘乃至十二乘方用初商十乘此為亷多者二亷以上又遞減挨次乘之也遞減至初商根則為末後一亷矣故曰至根數止求涎商數以泛積約餘實得之求亷定積以各亷泛積乘次商數亷多者遞增一等挨次乘之至本乘方減小一等止是為定積凡第一亷泛積皆乘次商根而得定積有第二亷則以次商自乘積乘之有三亷則以次商立方積乘之是為遞增一等也然增不得至本乘方但增至本乘方減小一等數即為末後一亷矣求隅積以次商數查初商表各依本乘方取之以次商對橫行根數以本乘方對直行縱橫相遇得之列于亷積之後一行是為隅積小隅體勢並同初商大方如平方則隅即小平方立方則隅即小立方三乘方之隅亦為小三乘方四乘以上並同故可借初商表用之求亷隅共積以所得各亷定積及隅積用併法併之即得求次商定數以所得亷隅共積紀左線之左又在表數之左以末位對第二㸃紀之為次商應減之數與次商實右行第二㸃所截對位相減以左減右減不盡者又為餘實以待三商遂紀次商數于初商之下為次商定數如亷隅共積大于次商實不及減則改次商至及減而止乃為次商定數三商以後並同上法不論三商四商乃至多商其亷定率不變但求泛積時三商則並初商次商兩位商數合而用之四商則併前三次商數皆取其應有各數以乘定率而得泛積亦如上法之用初商其求定積則三商即用三商之數四商即用四商之數以乘泛積而得定積亦如上法之用次商餘法並同次商審位之法凡亷泛積大於餘實或僅相等而無隅不能商一數是次商為位也即紀位於先商之次而併下一㸃餘實為續商餘實次商單一之法凡泛積與實僅同而有隅一是商得一數也即以泛積為定積不必更乘次商惟單一則然若商得一十一百一千仍須如法乘之開平方即一乘方設平方積三千三百四十四萬三千八十九問方根若干答曰五千七百八十三列實法先作兩直線次以方積三三四四三八九列右線之右作㸃法於實末位單數作一㸃起逆上每隔一位㸃之有四㸃宜商四次初商是千初商法曰用最上一㸃截原實兩位三三為初商實查表有小於實三三者是二五其方根五即以五為初商對實首上一位書于左線之右却以表數二五對實三三書左線之左與原實對減先於實次位減五實係三不足減作㸃借上一數為十三減去五餘八改書八于實三之右次於實首減二原實是三因借下去一只得二減盡乃作線抹去三三存八以待次商亦于左作線抹去減數二五求次商用第二㸃上餘實八四四為次商實隅次商自乘四九亷隅共積併得七四九次商法曰置亷率立成內定率二乘初商五千得一萬為泛積乃約實作七百定為次商即以泛積乘之得定積七百萬再用次商自乘為隅其積四十九萬併定積成七百四十九萬即亷隅共積也俱如式列之于是將次商七續書初商五之下又將共積七四九對實八四四書左線之左以減實餘九五乃作線抹去八四四亦于左作線抹去七四九求三商用第三㸃上餘實