body:
  text: 歴算全書卷四十九宣城梅文鼎撰句股闡微卷四幾何増解方斜較求原方幾何約論線第十四條有用法今解其理甲乙丙丁正方形甲乙其對角線戊乙為方斜之較於戊乙上作庚癸乙戊小方則丙庚與庚戊等論曰法於方之一角甲作員而以丙甲方徑為員之半徑則乙丙為切員線乙辛為自員外割員之全線乙戊較為割員在外之餘線而兩線皆出一㸃則乙戊乗乙辛之矩形與乙丙切線方形等夫乙丙即原設方也今以同乙戊之癸乙為横乙辛為直作乙已長方即乙戊乗乙辛之矩又移切甲己長方為子甲長方又移卯補午移辰補酉移丑補寅則復成乙丙甲丁方形矣而丑卯午酉等斜剖半方形皆以乙戊較為半方形之邊是庚戊及丙庚皆與乙戊等而亦自相等又何疑焉用法有方斜之較乙戊求原方形之一邊法以乙戊較作小方形取其斜乙庚再引長之截丙庚如乙戊得乙丙如所求從此圖生一測員之法假有員城八面開門正西門如戊門外有塔如乙其距如乙戊西南門如丙距塔若干歩如乙丙問城徑法以乙丙之距自乗得數為實以乙戊之距為法法除實得乙辛於乙辛内減去乙戊即員城之徑㨗法但倍乙丙即得城徑有員城正西之門如戊西南之門如丙人立於庚可兩見之而庚丙與庚戊皆等問城徑法以庚戊自乗成戊癸小方以方斜之法求其斜距為乙庚以乙庚加庚丙為乙丙即城半徑按此即幾何約之用法也又以句股法解之又論曰試於庚丙上作丙子較線上方引庚戊至丁則丁庚又為丙子方之斜而丁戊與乙丙等從丁戊作丁壬甲戊為元方如所求又論曰此即句弦和較相乗開方得股也乙甲丁甲皆如弦戊甲甲辛甲丙甲壬皆如句乙戊如句弦較丁丙同乙辛如句弦和和較相乗成癸辛長方開方得丁戊股乙丙同切線角與員周角交互相應幾何三卷三十二三十三増題乙丙丁三角形在員内有甲乙切員線則所作丙乙甲角與丙丁乙角同大又丁乙戊角與丁丙乙角同大所謂交互相應也論曰丁角以乙丙弧分論度而丙乙甲角亦以乙丙弧分之度為度故丙乙甲角即丁角也丙角以丁乙弧分為度而丁乙戊角亦以丁乙弧分為度故丁乙戊角即丙角也凡用員周度為角度皆以兩度為一度詳後第三増題若丁為鈍角則丙乙甲亦鈍角兩鈍角同以丙辛乙弧為度故也其丙銳角與丁乙戊銳角則同以丁乙弧為度又増題員内三角形一角移動則餘二角變而本角度分不變交互相應之角度亦不變如上圖三圖丁角移至辛則丙角加大而相應之辛乙戊角亦從之而大以辛丁乙弧大於丁乙弧也辛乙戊大則辛乙丙小矣其較皆為丁辛弧若丁角雖移至辛而其度不變相應之丙乙甲角亦不變以所用之丙乙弧不變也又丙角移至壬則丁角加大相應之壬乙甲亦從之而大以壬丙乙弧大於丙乙弧也壬乙甲大則壬乙丁小矣其較皆為丙壬弧若丙角雖移至壬其度不變相應之丁乙戊亦不變以所用之丁乙弧不變也此圖同論但丁角移則丙角變小丙角移亦然又増題切員線作角與員周弧度相應圖有子甲戊員有乾艮線相切於子從子㸃出線與切線作角必割員周之度其大小皆相應但皆以員周兩度當角之一度如用子午正線則所作兩㫄子角皆正角百八十度分兩正角各皆九十度而亦剖員為半周兩半員並百八十度是兩度當一度又如用子辛線作辛子艮鈍角四十五度而本線割員周於辛為九十度象限亦兩度當一度又如用子辛線作辛子乾鈍角形百三十五度而線割辛午乾員分為二百七十度三象限亦兩度當一度又如於員内任作辛子乙角形乙辛子角所乗之子甲乙弧六十度乾子乙角同用子甲乙弧亦六十度然其實度是坎寅弧實只三十度亦兩當一也又子乙辛角乗子癸壬辛弧一象限艮子辛角亦割子癸壬辛弧一象限然其實度為震酉弧只四十五度亦兩當一也所以者何曰試作辛乙線移角於辛則所乗弧子甲乙六十度皆實度也今也角在心是員周也非員心也凡員周之角小於員心一倍故也論曰員周至員心正得員徑之半故所作角為折半比例試作乙丙線成辛乙丙句股形又從心作心周線與辛乙平行則所作周心丙角與乙辛丙等而此心周線平剖乙丙句亦平分乙周丙於周而正得其半矣系句股形平分弦線作點從此作線與股平行即平分句線為兩又論曰查角度之法皆以切點為心作半員即見真度此不論半員大小或作於員内或作於員外並同作於員外其度開明易於簡查又論曰試於所切圈心作横徑線與切線平行如辛丙線引長之出員外而以查角度之線割員周而過之則皆成大小句股形而所過横線上㸃皆即八線中之切線為句股形之股角度斜線為横線所截處即八線中割線常為弦而切點至員心之半徑常為句如子辛角度線割横線於辛成辛心子句股形其所當角度為酉中四十五度則辛心即四十五度之切線辛子即四十五度之割線餘並同其子心即半徑也又論曰角度半員有大小而子心半徑常為句者以所作横線在員心欲用員度相較也若於半員之端如中如外作横線與切線平行其所作切線割線亦同比例而即以各半員之半徑為句矣不但此也即任於子心外直線上任作一横線其所作句股並同但皆以十字交處距子㸃之度命為半徑此八線割員之法所由以立也量無法四邊形㨗法甲乙丙丁形求其容先作乙丁對角線分為兩三角形次自丙作丙戊横線與乙丁線相交於丑為十字正角而取戊㸃與甲齊平則戊丑即甲庚也次以丙戊㸃折半於己次作壬癸線與乙丁平行而等又作壬辛癸子二線皆與己丙平行而等得辛癸長方即原形之容取平行線簡法法曰乙丙線欲於甲㸃作線與之平行法於線外任取巳㸃為心甲㸃為界作辛甲丁庚圈分次以庚為心取甲辛之度為界截員分得丁㸃末自丁作戊丁甲線此線必與乙丙平行矣論曰凡圈内兩直線相距之度等則其線必平行如丁甲與庚辛兩線俱在一圈之内而所距之甲辛圈分與庚丁圈分等是相距之度等而其線平行也因讀數度衍得此法似較他處為㨗補測量全義斜坡用切線法係勿菴補斜三角形有一角兩邊求餘邊法用切線分外角求得餘角即以得邊可不用垂線如甲乙己斜角形有乙甲及己甲二邊有甲角求乙己邊法以己甲線引長之成乙甲丙角為原有甲角之外角以元有甲角减半周得次分外角之度而半之為半外角而求其切線為三率併乙甲己甲二邊為首率又以二邊相較為次率次率乗三率為實首率為法除之得半較角之切線以查表得半較角之度以減半外角得己角末用正弦法得己乙邊法為己角正弦與乙甲若甲角正弦與乙己三率法一兩線之和己丙二兩線之較己丁三半外角之切線戊癸四半較角之切線壬戊用外角者乙己兩角之和度而較角者乙己兩角之較度以用切線故半之也論曰又如後圖己甲引至丙而乙甲亦引至辛則乙甲丙及丁甲寅兩角皆原有甲角之外角再作甲戊線平分外角則丁甲戊及寅甲戊皆半外角又作甲壬線與乙已平行則壬甲癸角即同己角壬甲辛角即同乙角再於甲戊半徑之端作癸戊辛十字線切員於戊則戊癸及戊辛皆半外角之切線也再以壬甲癸角减壬甲辛角其較為壬甲子角則壬甲戊即半較角而壬戊其切線也其比例為己丙二邊和與己丁二邊較若癸辛外角全切線即乙己丁角和度之全切與壬子較角度之全切線則亦若癸戊半外角切線與壬戊即半較角之切線何也全與全若半與半也理分中末線甲乙線求作理分中末線法以甲乙全線折半於庚乃作垂線於甲端為丙甲如半線甲庚之度為句全線為股次作丙乙線為弦次以丙為心乙為界作乙丁圈界次引丙甲句至丁則丙丁即丙乙也末以甲為心丁為界作丁戊己圈分則甲己為理分中末之大分己乙為小分其比例為甲乙與甲己若甲己與己乙也逓加法借右圖以乙為心甲為界運規截丁已圈分於戊自戊作線向甲成甲戊線與甲丁等乃自戊作戊乙線與乙甲等成甲乙戊三角形此形甲戊兩角悉倍於乙角乃平分戊角作戊辛線此線與甲戊並大亦與乙辛同大成辛戊甲相似三角形則甲乙與乙辛即戊辛若乙辛與辛甲也又平分辛角作辛壬線與壬戊與辛甲皆同大則成甲辛壬三角形與辛戊甲相似則乙辛即戊辛亦即戊甲與辛甲即辛壬戊壬若辛甲與壬甲也如此逓半則其角比例並同一乙甲二乙戊即戊辛戊甲三辛甲即辛壬戊壬四辛癸即壬癸壬甲五癸甲即癸子壬子六癸丑即丑子子甲七丑甲即丑寅寅子八丑卯即卯寅寅甲九卯甲若能知其數則以大分逓乗全數除之得細數先得甲乙為大分而求乙己全分及乙庚小分用此圖亦為半圓内求容方法則以乙巳全分加乙庚小分折半於戊得戊己為半徑若先得戊己則以戊己即戊丁為弦作丁甲戊句股使戊甲句半於丁甲股則丁甲即為戊己理分中末之大分解曰甲庚即乙己全數與丁甲大分若丁甲大分即甲乙與甲己小分即乙庚也以量分甲乙線十數求作理分中末線先依甲乙線作甲乙丁丙正方形四面皆十數次任用一面平分之如甲丙平分於壬甲壬及壬丙皆五數甲乙之半數也甲丙與甲乙等其分亦等次自壬向乙角作乙壬斜線其數一十一一八三三九次自壬量甲壬或丙壬之度即甲乙之一半移置於乙壬線上截壬癸如甲壬則其餘癸乙即理分中末之大分其數六一八三三九末以癸乙之度移置於甲乙線上如乙戊則乙戊為大分戊甲為小分其數三八一九六六簡法作句股形令甲壬句如甲乙股之半乃以壬為心甲為界作虚線圓分截乙壬弦於癸末以乙為心癸為界作圓分截甲乙線於戊則乙戊為大分甲戊為小分又簡法以甲乙全線為半徑作半圓形則乙庚乙辛皆與甲乙等次平分乙辛於己次以己為心庚為界運規割甲乙線於戊戊己之度即同己庚則乙戊為大分甲戊為小分又簡法作子寅丑卯十字線相交於乙次以乙為心甲為界運規截十字線於甲於庚於辛則乙庚乙辛皆與設線甲乙等乃折半乙辛於己以己為心庚為界運規截甲乙於戊則乙戊大分甲戊小分皆得矣此法可於平面圓器上求之附長方變正方法甲乙丙丁長方形欲變正方以長方形之横邊乙丙直邊丙丁二線取其中比例即所求取中比例法以丙丁乙丙即戊丙聯為一直線丁戊而折半於己以己為心丁若戊為界作半圓次引乙丙横線至圓界截圓界於庚成丙庚線即乙丙及丙丁二線之中比例線次於丙庚線上作小方形其容與甲乙丙丁長方形等如右圖丙庚線上方形為丙壬乃子壬癸句股形内之容方也而甲丙長方形則子壬癸句股外之餘方也餘方與容方等積簡法先引丁丙邊至午引乙丙邊至未次以丙角為心乙為界作小員界虚線截引長線於戊次以丁戊線折半於己次引乙丙至未次以己為心戊為界運規作小圓界截引長線於庚則丙庚即所變方形之一邊末依丙庚線作方形與甲乙丙丁長方形等積其法以丙為心庚為界運規截丙辛與丙庚等理分中末線用法一用以分平圓為十平分法為半徑與三十六度之分圓若全分與理分中末之大分也一用以分平圓為五平分歴書言以全分為股理分中末之大分為句求其弦即半徑全數為股三十六度之分圓為句求得七十二度之分圓為弦一用以量十二等面體法為立方邊與所容十二等面邊若理分中末之全分與其小分也又十二等面體之邊與内容立方邊若理分中末之大分與其全分也又立方内容十二等面體其内又容小立方則外立方與内立方若理分中末之全與其大分也一用以量二十等面體法為立方邊與所容二十等面邊若理分中末之全與其大分也一用以量圓燈法為圓燈邊與其自心至角線若理分中末之大分與其全分也此自心至角之線即為外切立方立圓及十二等面二十等面之半徑又為内切八等面之半徑圓燈為有法之形即此可見用理分中末線説言西學者以幾何為第一義而傳只六卷其有所秘耶抑為義理淵深翻譯不易而姑有所待耶測量全義言有法之體五其面其積皆等其大小相容相抱與球相似幾何十一十二十三十四卷諸題極論此理又幾何六卷言理分中末線為用甚廣量體所必需幾何十三卷諸題全頼之古人目為神分線又言理分中末線求法見本卷三十題而與二卷十一題同理至二卷十一題則但云無數可解詳見九卷其義皆引而未發故雖有此線莫適所用疑之者十餘年辛未嵗養病山阿遊心算學於量體諸法稍得窺其奧爰証厯書之誤數端於十二等面二十等面得理分中末之用及諸體相容之確數故以立方為主其内容十二等面邊得理分線之末二十等面邊得理分線之中反覆推求了無凝滯始信幾何諸法可以理解而彼之秘為神授及吾之屏為異學皆非得其平也其理與法詳幾何補編遥量平面法甲乙庚辛為所欲量之平面而不能到如仰視殿上承塵而人在殿外又如峭壁懸崖之上有碑若碣凡平面之物人從地面斜視灼然可見而不能到或平面在下如田池之類人從臺上俯視可見或臨深崖瞰谷底其理不異但倒用其圖即是欲量甲乙庚辛平面而不能到可到者丙丁則先知丙丁之距及丙丁所作各角即可以知之先求甲乙線法于丙于丁各安平圓儀各以指尺向甲向乙又自相向各作角成甲丙丁甲丁乙乙丁丙凡三角形者三依第一法用甲丙丁形此形有丙丁線兩測之距有丙角有丁角自有甲角可求甲丁線法為甲角之正弦與丙丁若丙角之正弦與甲丁也次仍依第一法用乙丁丙形此形亦有丙丁線兩測之距有丙角有丁角自有乙角可求乙丁線法為乙角之正弦與丙丁若丙角之正弦與乙丁也此丙角與前形之丙角不同次仍依第一法用甲丁乙形此形有甲丁乙丁兩線及兩線間所作之丁角與前形丁角不同可求甲乙線為所測之一邊法自甲角作甲戊垂線至戊分乙丁線為兩而甲丁乙三角形分為兩句股形其一甲戊丁句股形有丁角有甲丁線為弦可求甲戊句戊丁股法為全數與甲丁弦若丁角之正弦與甲戊句又全數與甲丁弦亦若丁角之餘弦與戊丁股也其一甲戊乙句股形有甲戊句有乙戊股戊丁减乙丁得之可求甲乙弦法以甲戊句乙戊股各自乗而并之開方得甲乙即所測平面之一邊第二求庚辛線法亦于丙于丁各安平員儀即先所安之元處各以指尺向庚向辛又自相向各作角成庚丙丁庚丁辛辛丙丁凡三角形亦三依第一法用庚丙丁形此形有丙丁線兩測之距有丙角有丁角自有庚角可求庚丁線法為庚角之正弦與丙丁若丙角之正弦與庚丁也此丙角與前兩丙角不同依上法用辛丙丁形此形有丙角此丙角又與上不同有丁角自有辛角可求辛丁線丁角與前不同法為辛角之正弦與丙丁若丙角之正弦與辛丁也仍依上法用庚丁辛形此形有庚丁辛丁兩線及兩線間所作丁角此丁角又不同可求庚辛線為所測之又一邊法自庚角作庚己垂線至己分辛丁線為兩而庚丁辛三角形分為兩句股形其一庚己丁句股形有丁角有庚丁線為弦可求庚己句己丁股法為全數與庚丁弦若丁角之正弦與庚己句亦若丁角之餘弦與己丁股也其一庚己辛句股形有庚己句有辛己股己丁减辛丁得之可求庚辛弦法以庚己句辛己股各自乗而并之開方得庚辛為所測平面之又一邊即甲乙之對邉第三求甲庚線法于丁㸃側安平儀以指尺向甲向庚作甲丁庚角成甲丁庚形此形有甲丁庚丁兩線及兩線所作之丁角此丁角在甲丁庚丁兩線間可求甲庚線為所測形之側邊法自庚角作甲丁之垂線至壬分甲丁線為兩而甲丁庚三角形分為兩句股形其一庚壬丁句股形有庚丁線為弦有丁角可求庚壬句壬丁股法同前用丁角之正弦餘弦其一庚壬甲句股形有庚壬句甲壬股丁壬减甲丁得甲壬依句股法可求甲庚弦線為所測平面之側邊第四求乙辛線法亦于丁㸃側安平儀指尺向乙向辛作乙丁辛角成乙丁辛形此形有乙丁辛丁兩線及兩線所作之丁角此丁角在辛丁乙丁兩線間可求乙辛線為所測形之又一側邊法自辛角作乙丁之垂線至癸分乙丁線為兩而乙丁辛三角形分為兩句股形其一辛癸丁句股形有辛丁線為弦有丁角可求辛癸句癸丁股法亦同前用丁角之正弦餘弦其一辛癸乙句股形有辛癸句乙癸股癸丁减乙丁得乙癸依句股法可求乙辛弦線為所測平面之又一側邊如此則所測形之四邊皆具乃用後法求其幂第五求乙庚線法仍于丁㸃斜立平儀以指尺向乙向庚作乙丁庚角成乙丁庚形此形有庚丁乙丁兩線及兩線所作之丁角此丁角又在乙丁庚丁兩線間可求乙庚線為所測形内之對角斜線乙庚丁角形内自庚角作乙丁之垂線至卯分乙丁線為兩而乙庚丁三角形亦分為兩句股形其一庚卯丁句股形有庚丁線為弦有丁角可求庚卯句卯丁股依上法用丁角之正弦餘弦其一庚卯乙句股形有庚卯句有卯乙股卯丁减乙丁得卯乙依句股法可求乙庚弦線為所測平面形内對角之斜線既有乙庚線則所測甲乙辛庚平面形分為兩三角形可以求其幂積其一乙甲庚形有乙庚底有甲庚甲乙兩腰法以兩腰相減為較相併為和和乗較為實乙庚底為法除之得乙午以減乙庚得午庚半之得子庚乃用句股法以甲庚子庚各自乗相減為實開方得甲子垂線垂線半之以乗乙庚底得乙甲庚形平積其乙辛庚形有乙庚底有乙辛辛庚兩腰如上法以乙辛辛庚相減為較又相併為和和乗較為實乙庚底為法除之得乙辰為底較以減乙庚得辰庚半之得丑庚乃用句股法以丑庚庚辛各自乗相減為實開方得丑辛垂線垂線半之以乗乙庚底得乙辛庚形平積末以兩三角形積併之為所測甲乙辛庚平面四不等形之總積右法可以不用丈量而遥知畝歩即有種種異態以三角御之足矣新法厯書言測量詳矣然未著斯法意者其在幾何後數卷中為未譯之書歟庚午蜡月既望晤逺西安先生談及算數云量田可以不用履畝初聞之甚不以為然歸而思之得此法然未知其所用者即此與否而此法固己足用矣若用有縱衡細分之測器指尺一量即得無煩布算矣測量用影差義疏凡方形内從角剖成兩句股形必相似而等正方或長方並同方形内作對角斜線分為兩句股又於斜線上任取一㸃作直線縱横相交如十字而悉與方邊平行分方形為大小四句股形此四句股形各兩兩相似而等大形丙與丁等小形庚與辛等則其四句股旁之兩餘方形雖不相似而其容必等解曰於原斜線所分相等句股内各減去相等之大小兩句股則其餘亦等丙戊庚形内減去大形丙小形庚餘戊又於丁己辛形内減去大形丁小形辛餘己原形既等所減又等則其餘必等故戊己兩長方雖不相似而其容必等也句股測逺有甲乙之距人在戊立表又立表於丁使戊丁乙為一直線再於丙立表使丙丁與乙戊如十字之半而與甲乙平行則丁戊小股與丙丁小句若丙庚大股與甲庚大句也法以丙丁小句為二率乙丁大股為三率即丙庚相乗為實戊丁小股為一率為法法除實得大句甲庚再以庚乙加之得甲乙假如丙丁兩表相距三歩人在戊窺丁到乙逺戊丁十二歩丁乙十八歩欲求甲乙之距法以丙丁三歩乗乙丁十八歩得五十四歩為實戊丁十二歩為法除之得四十五歩為甲庚加丙丁三歩即乙庚共四十八歩為甲乙解曰此以乙丙長方形變為丙癸也依前論乙丙實形丙癸虚形不相似而容積等故也重測法有巽乙甲井方池欲遥望測其甲乙之一面方并乙丁之距法立表於丁望測方池之東北角乙至東南角巽使丁乙巽為一直線再於丁横過立一表於丙使丙丁為乙丁之横立正線丙丁横六歩四分次從丁退而北行至戊量得十二歩從戊斜望池西北隅甲不能當丙表而出其間如戌又於戌立表戌丁之距四歩再退而北行至己從己窺甲正過丙表己丙甲為一直線量得己丁之距三十六歩法以丙丁六歩四分為一率丁己三十六歩為二率戊丁四歩為三率二三相乗得一百四十四歩為實一率六歩四分為法除之得二十二歩半為辛己於辛己内減丁戊十二歩餘十歩半為壬己是為景差次以戌丁四歩減丙丁六歩四分餘丙戌二歩四分以戊丁十二歩乗之得二十八歩八分為句實景差十歩半為法除句實得二歩八分弱為甲申大句之距加丙丁六歩四分即申乙得共九歩二分弱為甲乙即方池一面之濶次以辛己二十二歩半減丁己三十六歩餘十三歩半辛丁為二率丁戊十二歩為三率相乗得一百六十二歩為股實景差十歩半為法除之得十五歩八分半弱為乙丁大股之距解曰此以四表重測改為三表乃巧算也若測髙則重測本為前後二表者亦改用一表故當先知本法然後明其所以然下文詳之試先明四表本法有甲乙之濶先立丁表從戊測之戊人目丁表乙逺物之末端三者參相直次於丁表横過與甲乙平行作戊丁乙直線之横直線此線上取戊立表人目從戊過戌表窺甲逺物之西端亦參相直但於戊丁乙線為斜弦成句股形量得戌丁兩表横距四歩丁戊人目距東表直距十二歩次於丁戊直線退而北行至己又於西表戌作戌乾癸直線與丁戊平行此平行線内取癸立西後表人目從己過癸至甲參相直成己甲癸斜弦亦從癸横行至丁己線尋辛立東後表此後兩表癸辛之距為前表戌丁等四歩又量得辛己為東後表距人目之數辛丁二十二歩半次以丁戊十二減辛己二十二半得十歩半為壬己景差末以己辛二十二半減己丁三十六餘十三歩半為前後表間之距以表横距四歩乗之得五十四歩為表間積即丁癸長方置表間積為實以景差十歩半為法除之得五歩一半弱加表横距四歩得共九歩二分弱為所測逺物甲乙之濶解曰前表測得成戊乙甲句股形内有戌乙餘方與形外戌坤餘方等積後表測得己乙甲句股形内有癸乙餘方與形外酉癸餘方等積於癸乙内減戌乙於酉癸内減寅癸即丑戌則所餘之癸丁及酉辰兩餘方亦必等積也故以丁癸變辰酉而得辰寅亦即甲庚也次明改用三表之理用三表者於丙丁兩表間増一戌表其實則於戌丁兩表外増一丙表也前増一表而無後表則無從而得景差故以三率法求而得之其實癸辛即後表也其理與四表同然不用癸子形而用戌子形何也曰准前論辰酉形與丁癸形等積而午癸形與丁癸形亦等積兩餘方在己丙丁句股形内外故等則酉辰與午癸亦等積矣各減同用之卯未則所餘之酉卯與卯癸二形亦自相等積而卯癸原與戌子等故用戌子變為卯酉而得卯寅即得甲申矣是故戌子可名句實也其以辛丁乗戊丁為股實何也曰此三率法也丁乙外加丁辛前後兩測之表距故辛壬即戊丁外亦加壬己兩測之景差法為壬己與辛丁若戊丁與丁乙也凖此測髙可用一表而成兩測即借前測逺之圖而以横為直假如有甲乙髙立丙丁表人目在戊測之則表之端不相值而參相直於表之若干度如戊退若干歩至己測之正對表端丙其法並同因看數度衍中破勾測逺條疑其圖不真因作此以證明其説測量圖説一測股六十四尺八寸壬丁二測句四十三尺二寸丙丁三大股三千六百八十五尺二寸乙丁即丙午四大句二千四百五十六尺八寸甲午加午乙得二千五百尺為甲乙之髙解曰癸丁長方形即古人所謂表間積也以景差壬辛即丑子除之變為寅子形是寅子與癸丁同積也而申癸形原與癸丁同積則寅子與申癸亦同積也於内各減同用之申子而寅未與未癸亦同積矣夫未癸即氐己也是戊丁即亥己乗丙己之積也故可命為句實而以景差壬辛即申未除之得甲午句也甲午即戌酉其取股實何也曰三率法也表在丁其景丁戊後表在庚則其景庚壬後表之逺於前表者為庚丁故後景之大於前景者為辛壬則其比例為辛壬與庚丁若丁戊即庚辛與丁乙也試引癸庚至箕截庚箕如庚壬又截尾箕如壬辛於尾於箕各作與庚乙平行線而於乙作垂弧為乙牛聯之作長方形又作丁心線截之作箕乙線斜分之則其理著矣三角形求外切圓法設如銳角形有甲丙邊七十五尺甲乙邊六十一尺乙丙邊五十六尺問外切圓徑若干畣曰外切圓半徑三十八尺一寸二分五氂法先求得甲丁中長線六十尺為一率甲乙邊六十一尺為三率甲丙邊折半得戊甲三十七尺五寸為三率二率與三率相乗一率除之得四率三八一二五為甲乙圓半徑解曰此甲丁乙三角形與甲己戊三角形同式故其線為相比例率也若甲為鈍角其理亦同以甲丙折半為三率故四率亦為半徑若以甲丙全線為三率則四率必得甲辛為全徑矣葢甲辛丙形與甲乙丁形同式也何以見甲乙丁形與甲辛丙形同式葢兩形之乙角辛角同當甲庚丙弧分則二角必相等而丁丙又同為直角則兩甲角亦必等而為同式無疑矣又界角比心角所當之弧大一倍今己心角所當甲庚弧適當乙界角所對甲庚丙之一半則兩角為等可知而戊為直角與丁角等則兩甲角必等故甲己戊與甲乙丁亦為同式形也三角舉要有量法未著算例因作此補之又如甲乙丙鈍角形求外切員徑甲辛半徑甲己法先求得中長線乙丁得乙丁丙句股形次作乙辛線成甲乙辛大句股形又甲乙半之於戊從員心己作直線過戊至庚又成甲戊己句股形一率乙丁股形内垂線三率甲戊股即甲乙之半四率甲辛弦即外切員徑四率甲己弦即切員半徑解曰三句股形皆相似故可以三率比例求之問何以知其為相似形也曰原設形之丙角與甲乙辛形之辛角所當者同為甲庚乙員分則兩角等而乙丁丙形之丁角與甲乙辛大形之乙角又皆正角則餘角亦等而為相似形又甲己為甲辛之半甲戊為甲乙之半戊正角與大形乙正角等又同用甲角則己戊亦乙辛之半而為相似形一系凡三角形求得形内垂線為法垂線左右兩原邊相乗為實法除實得外切員徑銳鈍同法假如甲乙丙鈍角形求得中垂線乙丁六分為法左右兩斜邊甲乙十八分乙丙十分相乗一百八十分為實法除實得外切員徑甲辛三十分即可借用前圖分寸畸零稍為整頓歴算全書卷四十九
