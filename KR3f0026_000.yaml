  text: 欽定四庫全書子部六
  hash: sha256:e521b19b98c66f823ee87bbea51ca642449b8543c55a824c23637d49bb62d81e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3f0026_WYG_000-1a, image: WYG0794/WYG0794-0001a.png}
body:
  text: 厯算全書天文算法類一推步之屬提要臣等謹厯算全書六十卷國朝梅文鼎撰文鼎字定九宣城人篤志嗜古尤精厯算之學康熙四十一年大學士李光地嘗以其厯學疑問進呈會聖祖仁皇帝南巡於德州召見御書積學參微四字賜之以年老遣歸嗣詔修樂律厯算書下江南總督徵其孫玨成入侍直律吕正義書成復驛致命校勘後年九十餘終於家特命織造曹俯為經紀其喪至今傳為稽古之至榮所著厯算諸書李光地嘗刻其七種餘多晚年纂述或已訂成帙或略具草稿魏荔彤求得其本以屬無錫楊作枚校正作枚遂附以已説並為補所未備而刋行之凡二十九種名之曰厯算全書然序次錯雜未得要領謹重加編次以立厯者居前而以言算者列于後首曰厯學疑問論厯學古今疏密及中西二法與回回厯之異同即嘗蒙聖祖仁皇帝親加點定者謹以冠之簡編次曰厯學疑問補亦雜論厯法綱領次曰厯學答問乃與一時公卿大夫以厯法往來問答之辭次曰弧三角舉要乃用渾象表弧三角之形式次曰環中黍尺乃弧三角以角代算之法次曰歲周地度合考乃考髙卑嵗實及西國年月地度弧角里差次曰平立定三差説推七政贏縮之故次曰冬至考用統天大明授時三法考春秋以來冬至次曰諸方日軌乃以北極髙二十度至四十二度各地日軌按時節為立成表次曰五星紀要總論五星行度次曰火星本法専論火星遲疾次曰七政細草載推步日月五星法及恆星交宫過度之術次曰揆日候星紀要列直𨽻江南河南陜西四省表景並三垣列宿經緯定為立成表次曰二銘補注解仰儀銘簡儀銘次曰厯學駢枝乃所注大統厯法次曰交會管見乃以交食方位向稱南北東西者改為上下左右次曰交食蒙求乃推算法數次曰古算衍略次曰籌算次曰茟算次曰度算釋例俱為步算之根源次曰方程論次曰勾股闡微次曰三角法舉要次曰解割圜之根次曰方圓幕積次曰幾何補編次曰少廣拾遺次曰塹堵測量皆以推闡算法或衍九章之未備或著今法之面形或論中西形體之變化或釋弧矢勾股八線之比例蓋厯算之術至是而大備矣我國家修明律數探賾索隱集千古之大成文鼎以草野書生乃能覃思切究洞悉源流其所論著皆足以通中西之旨而折今古之中自郭守敬以來罕見其比其受聖天子特逹之知固非偶然矣乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀壬午十月扈駕南巡駐蹕德州有旨取所刻書集回奏匆遽未曽携帶且多係經書制舉時文應孰校之需不足塵覽有宣城處士梅文鼎厯學疑問三卷臣所訂刻謹呈求聖誨奉旨朕留心厯算多年此事朕能決其是非將書留覽再發二日後承召面見上云昨所呈書甚細心且議論亦公平此人用力深矣朕帶回宫中仔細看閲臣因求皇上親加御筆批駮改定庶草野之士有所取裁臣亦得以預聞一二不勝幸甚上肯之越明年春駕復南巡遂於行在發回原書面諭朕已細細看過中間圈點塗抹及簽貼批語皆上手筆也臣復請此書疵繆所在上云無疵繆但算法未備蓋梅書原未完成聖諭遂及之竊惟自古懷抱道業之士承詔有所述作者無論已若乃私家藏録率多塵埋瓿覆至厯象天官之奧尤世儒所謂專門絶學者蓋自好事耽奇之徒往往不能竟篇而罷曷能上煩乙夜之觀句談字議相酬酢如師弟子梅子之遇可謂千載一時方今宸翰流行天下獨未有裁自聖手之書蓄於人間者豈特若洛下之是非堅定而子雲遺編所謂遭遇時君度越諸子者亦無待乎桓談之屢歎矣既以書歸之梅子而為敘其時月因起俾梅寶奉焉甲申五月壬戌臣李光地恭記序厯學疑問梅子定九之所著也先生於是學覃思博考四十年餘凡所撰述滿家自專門者不能殫覽也余謂先生宜撮其指要束文伸義章縫之士得措心焉夫列代史志掀及律厯則几而不視况一家之書哉先生肯余言以受館之暇為之論百十篇而託之疑者或曰子之強梅子以成書也於學者信乎當務歟曰疇人星官之所專司不急可也夫梅子之作辨於理也理可不知乎乾坤父母也繼志述事者不離乎動靜居息色笑之間故書始厯象詩詠時物禮分方設官春秋以時紀事易觀於隂陽而立卦合乎嵗閏以生蓍其所謂秩敘命討好惡美刺治教兵刑朝會摟伐建侯遷國之大涉川畜牝之細根而本之則始於太乙而殽於隂陽日星以為紀月以為量四時以為柄鬼神以為徒故曰思知人不可以不知天仰則觀於天文窮理之事也此則儒者所宜盡心也聖之多才藝而精創作必稱周公自大司徒土圭之法周髀蓋天之制後世少有知者漢唐而下最著者數家率推一時一處以為定論其有四出測候踰數千里則已度越古今而未能包八極以立説海外之士乘之真謂吾書之所未有微言既逺泯泯棼棼可勝詰哉梅子閔焉稽近不遺矣而源之務索其言之成則援熙朝之厯以合於軒姬虞夏洙泗閩洛泯然也此固我皇上膺厯在躬妙極道數故草野之下亦篤生異士見知而與聞之而梅子用心之勤不憚探賾表微以歸於至當一書之中述聖尊王兼而有焉昔劉歆三統文具漢志子雲太玄平子以為漢家得嵗二百年之書也彼劉揚烏知天皆據洛下一家法而傅會以經義云爾今先生之論羅罔千載明皇厯之得天即象見理綜數歸道異日蘭臺編次必有取焉七政三統殆不足擬而書體簡實平易不為枝離佶屈吾知其説亦大行於經生家非如太玄之覆醬瓿者而終不顯矣先生之歸也謂余敘之余不足以知厯姑敘其大意以質知先生者先生續且為之圖表數術以繼斯卷余猶得竟學而觀厥成焉淸溪李光地書序厯元起冬至其來舊矣易復卦傳曰先王以至日閉關商旅不行后不省方孟子曰天之高也星辰之逺也茍求其故千嵗之日至可坐而致故古來治厯者其立算並起冬至夫有所受之也欲驗將來必推已往所謂求其故也秦炬以前古術難徵惟春秋左氏傳僖公五年春王正月辛亥朔日南至公既視朔遂登觀臺以望而書此冬至之有日名灼然可據者自漢以後漸講於測景之法然測景最難真確載在史書可信者不過數十條故元時許衡王恂郭守敬等造授時厯據之以考厯法之疏密也古今厯法七十餘家皆由疏以至密必取其最密者以相參考而其説始定是故唐厯莫善於大衍其次莫善於宣明宋厯莫善於紀元尤莫善於統天金厯莫善於趙知微而授時厯集其大成故以此六家互相稽考也今依其本法求之則合於當時者或戾於古合於古者又不效於今惟授時統天能上考下求而多所合由是觀之厯學之古疏今密約略可見而嵗起冬至則嵗實之古大今小較然不誣即統天授時上考下求百年消長之法亦自有據並可以深思而得其故矣按百年消長之法統天厯術中已暗藏其數至授時乃發明之郭太史自言創法五端原未及此元史厯議已具録六厯所得日名離合之端然未詳算法茲特各依其本法詳衍使學厯者考焉宣城梅文鼎
