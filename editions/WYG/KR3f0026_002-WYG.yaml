body:
  text: 厯算全書巻二宣城梅文鼎撰厯學疑問二論嵗實閏餘問歲實有一定之數而何以有閏餘曰惟歲實有一定之數所以生閏餘也凡紀歲之㳒有二自今年冬至至來年冬至凡三百六十五日二十四刻二十五分而太陽行天一周是為一嵗二十四莭氣之日據授時大統之數或自今年立春至來年立春亦同周禮太史註中數曰歲朔數曰年自今年冬至至明年冬至歲也自今年正月朔至明年正月朔年也古有此語要之歲與年固無大别而中數朔數之不齊則氣盈朔虚之所由生自正月元旦至臘月除夕凡三百五十四日三十六刻七十一分一十六秒而太陰㑹太陽於十二次一周是為一歲十二月之日亦據授時平朔言之兩數相較則莭氣之日多於十二月者一十日八十七刻五十三分八十四秒是為一歲之通閏積至三年共多三十二日六十二刻六十一分五十二秒而成一閏月仍多三日零九刻五十五分五十九秒積至五年有半共多五十九日八十一刻四十六分一十二秒而成兩閏月仍多七十五刻三十四分二十六秒古云三歲一閏五歲再閏者此也然則何以不竟用莭氣紀歳則閏月可免矣曰晦朔弦望易見者也莭氣過宫難見者也敬授人時則莫如用其易見之事而但為之閏月以通之則四時可以不忒堯命羲和以閏月定四時成歳此堯舜之道萬世不可易也若囘囘厯有太陰年為動的月有太陽年為不動的月夫既謂之月安得不用晦朔弦望而反用莭氣乎故囘囘厯雖有太陽年之算而天方諸國不以紀歳也沈存中欲以莭氣紀歳而天經或問亦有是言此未明古聖人之意者矣論歳餘消長問歳實既有一定之數授時何以有消長之法曰此非授時新法而宋綂天之法然亦非綂天億創之法而合古今累代之法而為之者也盖古厯周天三百六十五度四分度之一一歳之日亦如之故四年而增一日今西厯永年表亦同其後漸覺後天皆以為斗分太强因稍損之古厯起斗終斗故四分之一皆寄斗度謂之斗分自漢而晉而唐而宋毎次改厯必有所減以合當時實測之數故用前代之厯以順推後代必至後天以斗分强也斗分即嵗餘若用後代之厯據近測以逆溯往代亦必後天以斗分弱也前推後而歳餘强則所推者過於後之實測矣後推前而嵗餘弱則所推者不及於前之實測矣故皆後天綂天厯見其然故為之法以通之于歳實平行之中加一古多今少之率則於前代諸厯不相􅆾戾而又不違於今之實測此其用法之巧也然綂天厯蔵其數于法之中而未嘗明言消長授時則明言之今遂以為授時之法耳郭太史自述創法五端初未及此也然則大綂厯何以不用消長曰此則元綂之失也當時李徳芳固巳上疏争之矣然在洪武時去授時立法不過百年所減不過一分積之不過一刻故雖不用消長無甚差殊也崇禎厯書謂元綂得之測驗竊不謂然何也元綂與徳芳辨但自言未變舊法不言測騐有差又其所著通軌雖便初學殊昧根宗間有更張輒違經㫖如月食時差既内分等俱妄改背理豈能於冬至加時後先一刻之間而測得真數乎然則消長必不可廢乎曰上古則不可知矣若春秋之日南至固可考據而唐宋諸家之實測有據者史册亦具存也今以消長之法求之其數皆合若以大綂法求之則皆後天而於春秋且差三日矣安可廢乎然則綂天授時之法同乎曰亦不同也綂天厯逐年逓差而授時消長之分以百年為限則授時之法又不如綂天矣夫必百年而消長一分未嘗不是乃以乗距算其數驟變殊覺不倫鄭世子黄鍾厯法所以有所酌改也假如康熙辛酉年距元四百算該消四分而其先一年庚申距算三百九十九只消三分是庚申年嵗餘二十四刻二十二分而辛酉年歳餘二十四刻二十一分也以此所消之一分乗距算得四百分則辛酉嵗前冬至忽早四刻而次年又只平運以實數計之庚申年反只三百六十五日二十刻二十二分辛酉年則又是三百六十五日二十四刻二十一分其法舛矣論嵗實消長之所以然問嵗實消長之法既通於古亦宜合於今乃今實測之家又以為消極而長其説安在豈亦有所以然之故歟曰授時雖承統天之法而用消長但以推之舊厯而合耳初未嘗深言其故也惟厯書則為之説曰嵗實漸消者由日輪之轂漸近地心也余嘗竊疑其説今具論之夫西法以日天與地不同心疏盈縮加減之理其所謂加減皆加減於周天三百六十度之中非有所増損於其外也如最髙則視行見小而有所減最卑則視行見大而有所加加度則減時矣減度則加時矣然皆以最卑之所減補最髙之所加及其加減既周則其總數適合平行畧無餘欠也若果日輪之轂漸近地心不過其加減之數漸平耳加之數漸平則減之數亦漸平其為遲速相補而歸於平行一也豈有日輪心逺地心之時則加之數多而減之數少日輪心近地心時則減之數少而加之數多乎必不然矣又考日躔永表彼固原未有消長之説日躔厯指言平嵗用授時消分定嵗則用最髙差及查恒年表之用則又只用平率是其説未有所决也又厯書言日輪漸近地心數千年後將合為一㸃若前之漸消由於兩心之漸近則今之消極而長兩心亦將由近極而逺數千年後又安能合為一㸃乎彼盖見授時消分有據而姑為此説非能極論夫消長之故者也然則將何以求其故曰授時以前之漸消既徴之經史而信矣而今現行厯之嵗實又稍大於授時其為復長亦似有據竊考西厯􅆟髙卑今定於二至後七度依永年厯毎年行一分有竒則授時立法之時最髙卑正與二至同度而前此則在至前過此則在至後豈非髙衝漸近冬至而嵗餘漸消及其過冬至而東又復漸長乎余觀七政厯於康熙庚申年移改最髙半度弱而其年歳實驟増一刻半强此亦一徴也存此以竢後之知厯者巳未年最髙在夏至後六度三十九分庚申年最髙在夏至後七度七分除本行外計新移二十七分己未年冬至庚戌日亥正一刻四分庚申年冬至丙辰日寅正二刻二分實計三百六十五日二十四刻十三分前後各年俱三百六十五日二十三刻四分或五分以較庚申年嵗實驟増一刻九分王寅旭曰嵗實消長其説不一謂由日輪之轂漸近地心其數寖消者非也日輪漸近則兩心差及所生均數亦異以論定嵗誠有損益若平嵗嵗實尚未及均數則消長之源與兩心差何與乎識者欲以黄赤極相距逺近求嵗差朓朒與星嵗相較為節嵗消長終始循環之法夫距度既殊則分至諸限亦宜隨易用求差數其理始全然必有平嵗之嵗差而後有朓朒之嵗差有一定之嵗實而後有消長之嵗實以有定者紀其常以無定者通其變始可以永乆而無弊按寅旭此論是欲據黄赤之漸近以為嵗實漸消之根盖見西測黄赤之緯古大今小今又覺稍贏故斷以為消極復長之故然黄赤逺近其差在緯嵗實消長其差在經似非一根又西測距緯復贏者彼固自疑其前測最小數之末真則亦難為確據愚則以中厯嵗實起冬至而消極之時髙衝與冬至同度髙衝離至而嵗實亦増以經度求經差似較親切愚與寅旭生同時而不相聞及其卒也乃稍稍見其書今安得起斯人於九原而相與極論以質所疑乎論恒星東移有據問古以恒星即一日一周之天而七曜行其上今則以恒星與七曜同法而别立宗動是一日一周者與恒星又分兩重求之古厯亦可通歟曰天一日一周自東而西七曜在天遲速不同皆自西而東此中西所同也然西法謂恒星東行比於七曜今考其度盖即古厯嵗差之法耳嵗差法昉於虞喜而暢於何承天祖冲之劉焯唐一行厯代因之講求加密然皆謂恒星不動而黄道西移故曰天漸差而東嵗漸差而西所謂天即恒星所謂嵗即黄道分至也西法則以黄道終古不動而恒星東行假如至元十八年冬至在箕十度至康熙辛未厯四百十一年而冬至在箕三度半在古法謂是冬至之度自箕十度西移六度半而箕宿如故也在西法則是箕星十度東行過冬至限六度半而冬至如故也其差數本同所以致差者則不同耳然則何以知其必為星行乎曰西法以經緯度候恒星則普天星度俱有嵗差不止冬至一處此盖得之實測非臆斷也然則普天之星度差古之測星者何以皆不知耶曰亦嘗求之於古矣盖有三事可以相證其一唐一行以銅渾儀候二十八舍其去極之度皆與舊經異今以歳差考之一行銅儀成於開元七年其時冬至在斗十度而自牽牛至東井十四宿去極之度皆小於舊經是在冬至以後厯春分而夏至之半周其星自南而北南緯増則北緯減故去北極之度漸差而少也自輿鬼至南斗十四宿去極之度皆大於舊經是在夏至以後厯秋分而冬至之半周其星自北而南南緯減則北緯増故去北極之度漸差而多也星度詳後嚮使非恒星移動何以在冬至後者漸北在夏至後漸南乎恒星循黄道行實只東移無所謂南北之行也而自赤緯觀之則有南北之差盖横斜之勢使然其一古測極星即不動處齊梁間測得離不動處一度强祖暅所測至宋熈寧測得離三度强沈存中測詳夢溪筆談至元世祖至元中測得離三度有半郭太史候極儀徑七度終夜見極星循行環内切邊而行是也嚮使恒星不動則極星何以離次乎其一二十八宿之距度古今六測不同詳元史故郭太史疑其動移此盖星既循黄道東行而古測皆依赤道黄赤斜交勾弦異視所以度有伸縮正由距有横斜耳不則豈其前人所測皆不足慿哉故僅以冬至言差則中西之理本同而合普天之星以求經緯則恒星之東移有據何以言之近兩至處恒星之差在經度故可言星東移者亦可言嵗西遷近二分處恒星之差竟在緯度故惟星實東移始得有差若只兩至西移諸星經緯不應有變也如此則恒星之東移信矣恒星既東移不得不與七曜同法矣恒星東移既與七曜同法即不得不更有天挈之西行此宗動所由立也唐一行所測去極度與舊不同者列後舊經唐測牽牛去極百六度牽牛去極百四度須女百度有脫字須女百一度虚百四度虚百一度危九十七度有誤字危九十七度營室八十五度營室八十三度東壁八十六度東壁八十四度奎七十六度奎七十三度婁八十度婁七十七度胃昴七十四度胃昴七十二度畢七十八度畢七十六度觜觹八十四度觜觹八十二度參九十四度參九十三度東井七十度東井六十八度以上十四宿去極之度皆古測大而唐測小是所測去極之度少于古測為其星自南而北也又按唐開元冬至在斗十度則此十四宿為自冬至後厯春分而夏至之半周舊經唐測輿鬼六十八度輿鬼六十八度栁七十七度栁八十度半七星九十一度七星九十三度半張九十七度張百度翼九十七度翼百三度軫九十八度軫百度角九十一度正當赤道角九十三度半在赤道南二度半亢八十九度亢九十一度半氐九十四度氐九十八度房百八度房百一十度半心百八度心百一十度尾百二十度尾百二十四度箕百一十八度箕百二十度南斗百一十六度南斗百一十九度以上十四宿去極之度皆古測小而唐測大是所測去極之度多於古測為其星自北而南也以冬至斗十度言之則此十四宿為自夏至後厯秋分而冬至之半周論七政髙下問𫝊言日月星辰繫焉而今謂七政各有一天何据曰屈子天問圜則九重孰營度之則古有其語矣七政運行各一其法此其説不始西人也但古以天如棊局不動而七政錯行如碁子之推移西人之説則謂日月五星各麗一天而有髙下其天動故日月五星動非七政之自動也其所麗之天表裏通徹故但見七政之動耳不然則將如彗孛之類旁行斜出安得有一定之運行而可以施吾籌䇿乎且既各麗一天則皆天也雖有髙下而總一渾灝之體於中庸所謂擊焉者初無牴牾也然則何以知其有髙下曰此亦古所有但言之未詳耳古今厯家皆言月在太陽之下故月體能蔽日光而日為之食是日髙月下日逺月近之證也又歩日食者以交道表裏而論其食分隨地所見深淺各異故此方見食既者越數千里而僅虧其半古人立法謂之東西南北差是則日之下月之上相距甚逺之證也又月與五星皆能掩食恒星是恒星最在上而於地最逺也月又能掩食五星是月最在下而於地最近也五星又能互相掩是五星在恒星之下月之上而其所居又各有髙下於地各有逺近也嚮使七政同在一規而無髙下之距則相遇之時必相觸擊何以能相掩食而過乎是故居七政之上最近大圜最逺於地者為恒星恒星之下次為土星又次為木星次為火星次為太陽為金為水最近於地者為月以視差言之與人目逺者視差㣲近則視差大故恒星之視差最㣲以次漸増至月而差極大也以行度言之近大圜者為動天所掣故左旋速而右移之度遲漸近地心則與動天漸逺而左旋漸遲即右移之度反速故左旋之勢恒星最速以次漸遲至月而為最遲也右移之度恒星最遲以次漸速至月而反最速也是二者宛轉相求其數巧合髙下之理可無復疑夢溪筆談以月盈虧明日月之形如丸可謂明悉而又以問者之疑其如丸則相遇而相礙故輙漫應之曰日月氣也有形無質故相值而無礙此則未明視差之理為智者千慮之失論無星之天問古以恒星不動七曜常移故有蟻行磨上之喻今恒星東移既與七曜同法則恒星亦是蟻而非磨故雖宗動無星可信其有也然西法又謂動天之外有静天何以知之曰此亦可以理信者也凡物之動者必有不動者以為之根動而不息者莫如天則必有常不動者以為之根矣天之有兩極也亦如磑之有臍戸之有樞也樞不動故户能開闔臍不動故磑能運旋若樞與臍動則開闔運旋之用息矣然樞能制户臍能運磑而此二者又誰制之而能不動哉則以其所麗者常静也如户之樞附於屋而屋仍有基基即地也臍植於磑之下半而磑安於架架仍在地也人但知樞之於戸臍之於磑能以至小為至大之君而不知此至小者之根又實連於大地之體唯天亦然動天之周繫於兩極而此兩極者必有所麗其所麗者又必常静故能終古凝然而為動天之樞也使其不然極且自動而何以為動天之所宗乎或曰天不可以戸磑擬也戸磑物也天則一氣旋轉而已豈必有所附著而後其樞不動哉曰天之異於物者大小也若以不動為動之根無異理也且試以實測徴之自古言北極出地三十六度而陽城之測至今未改也元史測大都北極之髙四十度半今以西測徴之亦無分寸之移故言嵗差者不及焉如黄赤古逺今近日輪轂漸近地心之類皆有今昔之差惟北極出地之度不變使天惟兀然浮空而又常為動而不息之物北極髙下亦將改易而何以髙度常有定測乎朱子嘗欲先論太虚之度然後次及天行太虚者静天之謂也朱子曰而今若就天裏看時只是行得三百六十五度四分度之一若把天外来説則是一日過了一度蔡季通嘗言論日月則在天裏論天則在太虚空裏若在太虚空裏觀那天自是日日裏得不在舊時處又曰厯法蔡季通説當先論天行次及七政此亦未善要當先論太虚以見三百六十五度四分度之一一一定位然後論天行以見天度加損虚度之嵗分嵗分既定然後七政乃可齊耳臨川吳氏曰天與七政八者皆動今人只將天做硬盤却以七政之動在天盤上行今當以太虚中作一空盤却以八者之行較其遲速論無星之天其二問静天為兩極所麗即朱子所言太虛是已然西法又設東西嵗差南北嵗差二重之天其説何居曰西人象數之學各有授受師説故其法亦多不同此兩嵗差之天利西泰言之徐文定公作厯書時湯羅諸西士棄不復用厥後穆氏著天歩真原北海薛氏本之著天學㑹通則又用之故知其授受非一家也今即其説推之則穆與利又似不同何也西人測驗謂黄赤之距漸近此亦可名南北差若東西嵗差則恒星之東移是已而恒星既為一重天不應復有東西嵗差之天則西泰所言不知何指也至于穆薛之説則又不正言南北東西兩嵗差而别有加算謂之黄道差春分差其法皆作小圏於心而大圏之心循之而轉若干年在前若干年在後其年皆以千計有圖有數有法且謂作厯書時棄之非是也然於西泰初説亦不知同異何如耳然則何以斷其有無曰天動物也但動而有常耳常則乆乆則不能無秒忽之差差在秒忽固無損於有常之大較而要之其差亦自有常也善歩者以數合差而得其衰序則儼然有形可説有象可圖焉如小輪之類皆是物也要之為圖為説總以得其差數而止其數既明其差既得又何必執其形象以生聚訟哉論天重數問七政既有髙下恒星又復東移動天一日一周静天萬古常定則天之重數豈不截然可數歟曰此亦據可見之度可推之數而知其必有重數耳若以此盡天體之無窮則有所不能即以西説言之有以天為九重者則以七曜各居其天并恒星宗動而九也有以天為十二重者則以宗動之外復有南北嵗差東西嵗差并永静之天十二也有以天為層層相裹如葱頭之皮密密相切畧無虚隙者利氏之初説也又有以天雖各重而其行度能相割能相入以是為天能之無盡者則以火星有時在日天之下金星有時在日天之上而為此言厯書之説也又有以金水二星遶日旋轉為太陽之輪故二星獨不經天是金水太陽合為一重而九重之數又減二重共為七重也然又謂五星皆以太陽為本天之心葢如是則可以免火星之下割日天是又將以五星與太陽并為一天而只成四重也一月天二太陽五星共為一天三恒星天四宗動天其説之不同如此而莫不持之有故其可以為定議乎嘗試論之天一而已以言其渾淪之體則雖不動之地可指為大圜之心而地以上即天地之中亦天不容有二若由其蒼蒼之無所至極以徴其體勢之髙厚則雖恒星同在一天而或亦有髙下之殊儒者之言天也當取其明確可徴之辭而畧其荒𣺌無稽之事是故有可見之象則可以知其有附麗之天有可求之差則可以知其有髙下之等如恒星七政皆有象有差有一種之行度知其有一樞紐如動天無象可見而有行度此皆實測之而有據者也而有常動者以為之運行知其必有常静者以為之根柢静天與地相應故地亦天根此則以理斷之而不疑者也若夫七政恒星相距之間天宇遼闊或空澄而精湛或絪緼而彌綸無星可測無數可稽固思議之所窮亦敬授之所緩矣論天重數二問重數既難為定則無重數之説長矣曰重數雖難定而必以有重數為長何也以七政之行非赤道也臨川掲氏曰天無層數七政皆能動轉試以水注圓噐而急旋之則見其中沙土諸物近心者凝而不動近邊者隨水而旋又且遲速洄漩以成㽞逆諸行矣又試以丸置於圜盤而輙轉其盤則其丸既為圜盤所掣與盤並行而丸之體圎亦能自轉而與盤相逆以成小輪之象矣此兩踰明切諸家所未及然以七政能自動而廢重數之説猶未能無滯碍也何也謂天如盤七政如丸盤之與丸同在一平面故丸無附麗而能與盤同行又能自動也若天則渾圓而非平圓又天體自行赤道而七政皆行黄道平斜之勢甚相差違若無本天以帶之而但如丸之在盤則七政之行必總㑹於動天之腰圍闊處皆行赤道而不能斜交赤道之内外以行黄道故曰以有重數為長也曰天既有重數則當如西人初説七政在天如木節在板而不能自動矣曰七政各居其天原非如木節之在板也各有小輪皆能自動但其動只在本所畧如人之目睛未嘗不左右頋盼而不離睂睫之間也若如板之有節則小輪之法又將安施即西説不能自通矣故惟七政各有本天以為之帶動斯能常行於黄道而不失其恒惟七政之在本天又能自動於本所斯可以施諸小輪而不礙掲説與西説固可並存而不廢者也論左旋問天左旋日月五星右旋中西兩家所同也自横渠張子有俱左旋之説而朱子蔡氏因之近者臨川掲氏建寕游氏又以槽丸盆水譬之此孰是而孰非曰皆是也七曜右旋自是實測而所以成此右旋之度則因其左旋而有動移耳何以言之七曜在天每日皆有相差之度厯家累計其每日差度積成周天中西新舊之法莫不皆然夫此相差之度實自西而東故可以名之右旋然七曜每日皆東升西降故又可以名之左旋西厯謂七曜皆有東西兩動而並出於一時盖以此也夫既云動矣動必有所向而一時兩動其勢不能古人所以有蟻行磨上之喻而近代諸家又有人行舟中之比也七曜如人天如舟舟揚帆而西人在舟中向舟尾而東行岸上望之則見人與舟並西行矣又天之東升西没自是赤道七曜之東移於天自是黄道兩道相差南北四十七度自短規至長規合之得此數雖欲為槽丸盆水之喻而平面之行與斜轉之勢終成疑義安可以遽廢右旋之實測而從左轉之虚理哉然吾終謂朱子之言不易者則以天有重數耳曰天有重數何以能㫁其為左旋曰天雖有層次以居七曜而合之總一渾體故同為西行也同為西行矣而仍有層次以生微差層次之髙下各殊則所差之多寡亦異故七曜各有東移之率也然使七曜所差只在東西順逆遲速之間則槽丸盆水之譬亦已足矣無如七曜東移皆循黄道而不由赤道則其與動天異行者不徒有東西之相違而且有南北之異向以此推知七曜在各重之天皆有定所而其各天又皆順黄道之勢以黄道為其腰圍中廣而與赤道為斜交非僅如丸之在槽沙之在水皆與其噐平行而但生退逆也丸在槽與其盤為平面沙在水與其噐為平面故丸與盤同運而生退逆水與沙並旋而生退逆其順逆兩象皆在一平面盖惟其天有重數故能動移惟其天之動移皆順黄道斯七曜東移皆在黄道矣是故左旋之理得重數之說而益明曰謂右旋之度因左旋而成何也曰天既有重數矣而惟恒星天􅆟近動天故西行最速㡬與動天相若六七十年始東移一度自土星以内其動漸殺以及於地球是為不動之處則是制動之權全在動天而恒星以内皆随行也使非動天西行則且無動無動即無差又何以成此右旋之筭哉其勢如陶家之有鈞盤運其邊則全盤皆轉又如運重者之用飛輪其運動也亦以邊制中假令有小盤小輪附於大鈞盤大飛輪之上而别為之樞則雖同為左旋而因其制動者在大輪其小者附而隨行必相差而成動移以生逆度又因其樞之不同也雖有動移必與本樞相應而成斜轉之象焉此之斜轉亦在平面非正喻其平斜但聊以明制動之勢夫其退逆而右也因其兩輪相疊其退轉而斜行也因於各有本樞而其所以能退逆而斜轉者則以其随大輪之行而生此動移也若使大者停而不行則小者之逆行亦止而斜轉之勢亦不可見矣朱子既因舊説釋詩又極取張子左旋之説盖右旋者已然之故而左旋者則所以然之理也西人知此則不必言一時兩動矣故掲氏以丸喻七曜只可施於平面而朱子以輪載日月之喻兼可施諸黄赤與西説之言層次者實相通貫理至者數不能違此心此理之同洵不以東海西海而異也朱子語類問經星左旋緯星與日月右旋是否曰今諸家是如此説横渠説天左旋日月亦左旋看来横渠之説極是只恐人不曉所以詩𫝊只載舊説或曰此亦易見如以一大輪在外一小輪載日月在内大輪轉急小輪轉慢雖都是左轉只有急冇慢便覺日月是右轉了曰然但如此則厯家逆字皆著改做順字退字皆著改做進字論黄道有極問古者但言北辰渾天家則因北極而推其有南極今西法乃復立黄道之南北極一天而有四極何也曰求經緯之度不得不然也盖古人治厯以赤道為主而黄道從之故周天三百六十五度皆從赤道分其度一一與赤道十字相交引而長之以㑹於兩極若黄道之度雖亦匀分周天三百六十五而有經度無緯度則所分者只黄道之一線初不據以分宫故授時十二宫惟赤道勻分各得三十度竒黄道則近二至者一宫或只二十八度近二分者一宫多至三十二度皆約整數若是其濶狹懸殊者何哉過宫雖在黄道而分宫仍依赤道赤道之匀度抵黄道而成斜交勢有横斜遂生濶狹故曰以赤道為主而黄道從之也向使厯家只歩日躔此法已足無如月五星皆依黄道行而又有出入其行度之舒亟轉變為法多端皆以所當黄道及其距黄之逺近内外為根故必先求黄道之經緯西厯之法一切以黄道為主其法匀分黄道周天度為十二宫其分宫分度之經度線皆一一與黄道十字相交自此引之各成經度大圏以周於天體則其各圏相交以為各度輳心之處者不在赤道南北極而别有其心是為黄道之南北極自黄道兩極出線至黄道即黄道上分宫分度之線引而成大圏以輳心者也心即黄極故亦可云從極出線其緯各得九十度而均極距黄道四面皆均故分宫分度線上之緯度皆均以此各線之緯聮為圏線皆與黄道平行自黄道上相離一度起逐度作圏但其圏漸小以至九十度則成一㸃而㑹於黄極是為緯圏一名距等圈曰黄道既有經緯則必有所宗之極測筭所需固巳然則為測筭家所立歟抑真有是以為運轉之樞耶曰以恒星東移言之則真有是矣何則古法嵗差亦只在黄道之一線今以恒星移則普天星斗盡有古今之差惟黄道極終古不動豈非真有黄極以為運轉之樞哉曰然則北辰非黄極也今曰惟黄極不動豈北辰亦動與曰以毎日之周轉言則周天星度皆東升西没惟北辰不動以恒星東移之差言則雖北辰亦有動移而惟黄極不動盖動天西旋以赤道之極為樞而恒星東移以黄道之極為樞皆本實測各有至理也古今測極星離不動處漸逺具見前篇論厯以日躔為主中西同法問天方等國以太隂年紀嵗即囬回法歐邏巴國以恒星年紀嵗即西洋本法若是其殊意者起筭之端亦將與中土大異而何以皆用日躔為主歟曰其紀嵗之不同者人也其起筭之必首日躔者天也夫天有日如國有君史以紀國事厯以紀天行而史之綱在帝紀厯之綱在日躔其義一也是故太隂之行度多端無以凖之凖於日也太隂有周天有㑹望有遲疾入轉有交道表裏皆以所厯若干日而知其行度之率五星之行度多端無以凖之凖於日也五星亦有周天有㑹望有盈縮入厯有交道表裏畧同太隂亦皆以日數為率恒星之行度甚遲無以凖之亦凖於日也恒星東移是生嵗差亦以日度知之而得其行率不先求日躔且不能知其何年何日而又何以施其測騐推歩哉且夫天下之事必先得其著而後可以察其㣲必先得其易而後可以及其難必先得其常而後可以盡其變故以測騐言之日最著也以推歩言之日最易也以經緯之度言之日最有常也懸象常明而無伏見是為最著若月與星則有晦伏立術歩筭道簡不繁是為最易歩月五星之法皆繁於日恒星東移而分至不易是為經度之有常月五星出入黄道而日行黄道中線是為緯度之有常古之聖人以賓餞永短定治厯之大法萬世遵行所謂易簡而天下之理得也愚故曰今日之厯愈宻皆聖人之法所該此其一徴矣論黄道問黄道斜交赤道而差至四十七度何以徴之曰此中西之公論要亦以日軌之髙下知之也今以表測日景則夏至之景短以其日近天頂而光從直下也冬至之景長以其日不近天頂而光從横過也夫日近天頂則離地逺而地上之度髙日不近天頂則離地近而地上之度低測筭家以法求之則夏至之日度髙與冬至之日度髙相較四十七度半之則二十三度半為日在赤道南北相距之度也然此相較四十七度者非倐然而髙頓然而下也逐日測之則自冬至而春而夏其景由長漸短日度由低漸髙至夏至乃極自夏至而秋而冬其景由短漸長日度由髙漸低至冬至乃極其進退也有序其舒亟也有恒而又非平差之率故知其另有一圏與赤道相交出其内外也曰日行黄道固無可疑月與五星樊然不齊未嘗正由黄道也今曰七曜皆由黄道何也曰黄道者光道也古字从炗从日炗字即古光字日為三光之主故獨行黄道而月五星從之雖不得正由黄道而不能逺離故皆出入於黄道左右要不過數度止耳古厯言月入隂陽厯離黄道逺處六度西厯測止五度竒又測五星出入黄道惟金星最逺能至八度其餘緯度乃更少於太隂是皆以黄道為宗故也故月離黄道五度竒合計内外之差共只十度竒若其離赤道也則有逺至二十八度半以黄道距赤道二十三度半加月道五度竒得之合計内外之差則有相差五十七度竒以月在赤道内二十八度半在外亦如之併之得此數金星離黄道八度竒合計内外之差共只十六度竒若其離赤道也則有逺至三十一度竒以黄赤之距加星距黄道合計内外之差則有相差六十二度竒以星距赤道内外各三十一度得之是月五星之出入黄道最逺者於赤道能為更逺豈非不宗赤道而皆宗黄道哉論經緯度黄赤問黄道有極以分經緯然則經緯之度惟黄道有之乎曰天地之間盖無在無經緯耳約畧言之則有有形之經緯有無形之經緯而又各分兩條曷言乎無形之經緯凡經緯之與地相應者其位置雖在地而實在無形之天朱子所謂先論太虚一一定位者此也曷言乎有形之經緯凡經緯之在天者雖去人甚逺而有象可徴即黄赤道也是故黄道有經緯赤道亦有經緯兩道之經度皆與本道十字相交引而成大圏經度皆三百六十兩度相對者連而成大圏故大圏皆一百八十其圏相㑹交必皆㑹於其極兩道之緯圏皆與本道平行而逐度漸小以至於本極而成一㸃此經緯之度兩道同法也然而兩道之相差二十三度半故其極亦相差二十三度半而兩道緯圏之差數如之矣以黄緯為主則赤緯之斜二十三度半以赤緯為主而觀黄緯則其差亦然若其經度則兩道之相同者惟有一圈惟磨羯巨蟹之初度初分聫而為一圏此圏能過黄赤兩極其餘則皆有相差之度而其差又不等惟一圏能過兩極則黄赤兩經圏合而為一圏以黄赤兩極同居磨羯巨蟹之初也此外則黄道經圏只能過黄極而不過赤極赤道經圏亦只過赤極而不過黄極離磨羯巨蟹初度益逺其勢益斜其差益多故逐度不等此其勢如以兩重罾􅃠冒于圎球則網目交加縱横錯午而各循其頂以求之條理井然至􅄨而不可亂故曰在天之經緯有形而又分黄赤兩條也論經緯度二地平問經緯之與地相應者一而已矣何以亦分兩條曰黄赤之分兩條者有斜有正也地度之分兩條者有横有立也今以地平分三百六十經度三十度為一宫共十二宫再剖之則二十四向四面八方皆與地平圏為十字而引長之成曲線以輳于天頂皆相遇成一㸃故天頂者地平經度之極也其經度下逹而輳于地心亦然又將此曲線各勻分九十緯度即地平上高度又謂之漸升度而逐度聮之作横圏與地面平行而漸髙則漸小㑹于天頂則成一㸃即地平緯圏也其地平下作緯圏至地心亦然如太陽朦影十八度而盡太隂十二度而見之類皆用此度也此地平經緯之度為測驗所首重其實與太虚之定位相應者也然此特直立之經緯耳其經緯以天頂地心為兩極是直立也其地平即腰圍廣處而緯圏與地平平行漸小而至天頂亦成直上之形矣又有横偃之經緯焉其法以卯酉圏匀分三百六十度亦三十度為一宫此圏上過天頂下過地心而正交地平于卯酉之中即地平經圈之一也其三百六十度亦即經圈上所分緯度但今所用只圈上分度之一㸃而不更作與地平平行之緯圈從此度分作十字相交之線引而成大圏其圏一百八十半在地平之上半在其下其地平上半圏皆具半周天度勢皆自正北趨正南穹隆之勢與天相際度間所容中闊而兩末鋭畧如剖𤓰其兩鋭在南北其中濶在卯酉大圏相遇相交皆㑹于正子午而正切地平即子午規與地平規相交之一㸃在地平直立經緯原用子午規卯酉規為經圏地平規為􅆎圍之緯圏今則以卯酉規為􅆎圍而子午規與地平規則同為經度圈此一㸃即為經度之極而經度宗焉立象學安十二宫用此度也又自卯酉規向南向北逐度各作半圈如虹橋狀而皆與卯酉規平行地平下半圏亦然合之則各成全圏但離卯酉規漸逺亦即漸小以㑹于其極即地平規之正子午一㸃是其緯圏也測算家以立晷取倒影定時用此度也此一種經緯則為横偃之度其經度以地平之子午為兩極而以卯酉規為其􅆎圍是横偃之勢一直立一横偃其度皆與太虛之定位相應故曰無形之經緯亦分兩條也不但此也凡此無形之經緯皆以人所居之地平起算所居相距不過二百五十里即差一度此以南北之里数言也若東西則有不二百五十里而差一度者矣何也地圎故也而所當之天頂地平俱變矣地平移則髙天頂易則方向殊跬歩違離輾轉異視殆千變而未有所窮故曰天地之間無在無經緯也地平經緯有適與天度合者如人正居兩極之下則以一極為天頂一極為地心而地平直立之經緯即赤道之經緯矣若正居赤道之下則平視兩極一切地平之子一切地平之午而地平横偃之經緯亦即赤道之經緯矣論經緯相連之用及十二宫問經緯度之交錯如此得無益増測算之難乎曰凡事求之詳斯用之易惟經緯之詳此厯學所以易明也何也凡經緯度之法其數皆相待而成如鱗之相次網之在綱衰序秩然而不相凌越根株合散交互旁通有全則有分有正則有對即顯見隠舉二知三故可以經度求緯亦可以緯度求經有地平之經緯即可以求黄赤有黄赤之經緯亦可以知地平而且以黄之經求赤之經亦可以黄之緯求赤之經以黄之緯求赤之緯亦可以黄之經求赤之緯用赤求黄亦復皆然宛轉相求莫不脗合施於用從衡變化而不失其常求其源渾行無窮而莫得其隙夫是以布之於算而能窮差變筆之於圖而能肖星躔制之於噐而不違懸象此其道如棊方罫之間固善奕者之所當盡也曰經緯之度既然以為十二宫則何如曰十二宫者經緯中之一法耳渾圓之體析之則為周天經緯之度周天之度合之成一渾圜而十二分之則十二宫矣然有直十二宫焉有衡十二宫焉有斜十二宫焉又有百游之十二宫焉以天頂為極依地平經度而分者直十二宫也其位自子至卯左旋周十二辰辨方正位于是焉用之以子午之在地平者為極而以地平子午二規為界界各三宫者衡十二宫也其位自東地平為第一宫起右旋至地心又至西地平而厯午規以復於東立象安命于是乎取之赤道十二宫從赤道極而分極出地有髙下而成斜立是斜十二宫也加時之法于是乎取之則其定也西行之度于是乎紀之則其游也黄道十二宫從黄道極而分黄道極繞赤道之極而左旋而黄道之在地上者從之轉側不惟日異而且時移晷刻之間周流遷轉正邪升降之度于是乎取之故曰百游十二宫也然亦有定有游定者分至之限游者恒星嵗差之行也知此數種十二宫而俯仰之間縷如掌紋矣然猶經度也未及其緯故曰經緯中之一法也論周天度問古厯三百六十五度四分之一而今定為三百六十何也豈天度亦可增損歟曰天度何可增減盖亦人所命耳有布帛于此以周尺度之則于度有餘以漢尺度之則適足尺有長短耳于布帛豈有増損哉曰天無度以日所行為度毎嵗之日既三百六十五日又四之一矣古法據此以紀天度宜為不易奈何改之曰古法以太陽一日所行命之為度然所謂四之一者訖無定率故古今公論以四分厯最為疎闊而厯代斗分諸家互異至授時而有減嵗餘增天周之法則日行與天度較然分矣又况有冬盈夏縮之異終嵗之間固未有數日平行者哉故與其為畸零之度而初不能合于日行即不如以天為整度而用為起數之宗固推歩之善法矣周天者數所從起而先有畸零故析之而為半周天有象限為十二宫為二十四氣七十二候莫不先有畸零而日行之盈縮不與焉故推歩稍難今以周天為整數而但求盈縮是以整御零為法倍易且所謂度生於日者經度耳而厯家所難尤在緯度今以三百六十命度則經緯通為一法若以嵗周命度則經度既有畸零凖之以為緯度畸零之算愈多若為兩種度法則將變率相從益多糾葛故黄赤雖有正斜而度分可以互求七曜之天雖有内外大小而比例可以相較以其為三百六十者同也半之則一百八十四分之則九十而八線之法緣之以生故以製測噐則度數易分以測七曜則度分易得以算三角則理法易明吾取其適於用而已矣可以其出於囘囘泰西而棄之哉三百六十立算實本囘囘至歐羅巴乃發眀之耳况七曜之順逆諸行進退損益全在小輪為推歩之要眇然而小輪之與大輪比例懸殊若鎰與銖而黍累不失者以其度皆三百六十也以至太隂之㑹望轉交五星之嵗輪無一不以三百六十為法而地球亦然故以日躔紀度但可施于黄道之經而整度之用該括萬殊斜側縱横周通環應可謂執簡御棼法之最善者矣厯算全書巻二
