body:
  text: 厯算全書卷十宣城梅文鼎撰環中黍尺卷三之四初數次數法加減代乗除之法從初數次數而生故先論之上卷之法用角旁兩正弦相乗今則兼用兩餘弦故别之為初數次數其法有二其一次數與對弧餘弦相加其一相減也相加又有二一鋭角一鈍角也相減有四或餘弦内減次數或次數内減餘弦而又各分銳角鈍角也約法三邊求角角求對邊餘弦次數相加例銳角法鈍角法各一丁乙丙形有三邊求乙銳角角旁大弧丁巳正弦辛戊餘弦巳戊小弧丙乙正弦丙癸餘弦巳癸兩正弦相乗全數除之成初得數戊庚又以兩餘弦相乗全數除之成次得數戊丑即卯巳乃以次得數卯巳加對弧之餘弦已戌成卯戌即申戊一初得數戊庚二次得數與對弧餘弦相并申戊三半徑亥已四角之餘弦已乾以餘弦檢表得乙銳角之度若先有角求對邊則反之一半徑亥巳二角之餘弦巳乾三初得數戊庚四次得數與對弧餘弦相并申戊以次得數戊丑減之得對弧餘弦丑申即巳戌論曰辛戊正弦與亥巳半徑同為乙丁弧所分則辛戊全與丁戊分若亥巳全與乾巳分也而辛戊弦與丁戊小弦又若戊庚句與申戊小句也故戊庚與申戊必若亥巳與乾巳若用丁甲丙形其算並同何以明之甲丁者乙丁半周之餘甲丙者乙丙半周之餘其所用正弦並同又同用丁丙為對角之弧甲角又同乙角皆以乾已為餘弦故也右係對邊小于象限角旁弧異類故其法用加而為銳角仍用前圖取丁甲寅三角形有三邊求甲鈍角角兩旁弧同類對角邊大為寅丁其正弦酉戌餘弦戌已旁弧丁甲其正弦辛戊餘弦已戊又旁弧寅甲其正弦寅壬餘弦壬已初得數戊庚半徑除兩正弦矩次得數卯巳半徑除兩餘弦矩所用三率與前銳角形並同亦以卯已加已戌成申戊為三率所得四率乾已亦為甲角之餘弦末以餘弦檢表得度以減半周餘為甲鈍角之度若先有甲鈍角求對邊丁寅則反用其率一半徑亥已二甲角餘弦乾已三初數戊庚四申庚末以次數戊丑去減得數甲戊餘丑申為對弧餘弦論曰對弧寅丁係過弧與銳角形對弧丁丙相與為半周之正餘度同用酉戌為正弦戌已為餘弦角旁弧丁甲即乙丁半周之餘度同用辛戊為正弦戊已為餘弦甲寅弧又與乙丙弧等度其正弦壬寅同癸丙餘弦壬巳同癸巳故加減數並同所異者對弧大而兩旁弧又同類故為鈍角若用寅乙丁形其算並同以同用丁寅對弧而兩弧在角旁者寅乙為寅甲半周之餘丁乙為丁甲半周之餘所用之正弦餘弦並同故也甲角同乙角皆以乾已餘弦度轉減半周為其度右係對邊大于象限而角旁兩弧同類故其法用加而為鈍角正餘交變例若角旁兩邊以象限相加減而用其餘弧則正弦餘弦之名互易而所得初數次數不變三率之用亦不變解曰弧小以減象限得餘弧弧大以象限減之而用其餘亦餘弧也其故何也凡過弧與其減半周之餘度同用一正弦故過弧内減象限之餘即反為過弧之餘弧亦曰剰弧而此剰弧之正弦即過弧之餘弦也若兩弧内一用餘度則其初數次數皆為正弦乘餘弦半徑除之之數然其數不變何也一弧既用餘度則本弧之正弦變為餘弧之餘弦而其又一弧仍係本度則正弦不變然則先所用兩正弦相乗為初數者今不變而為餘乘正乎次數倣此試仍以前圖明之丁乙丙形任以乙角旁之乙丁弧即辛乙内減去亥乙象弧其剰弧亥辛之正弦戊已即乙辛過弧之餘弦也又亥辛之餘弦辛戊即過弧乙辛之正弦也然則先以辛戊正弦乗丙癸正弦者今不變為辛戊餘弦乘丙癸正弦乎然但變其名為餘乘正而辛戊之數不變則其所得之初數戊庚亦不變也次數倣論按此法即測星時第二法所用若角旁兩弧俱改用餘弧則初數變為兩餘弦相乘次數變為兩正弦相乗盖以正變餘餘變正而所得之初數次數不變試仍以前圖明之丁乙丙形乙角旁兩弧乙丁改用辛亥義見前乙丙改用丙亥皆餘弧也則丙癸辛戊兩正弦皆變餘弦丙癸為丙亥弧餘弦辛戊為辛亥弧餘弦癸已戊已兩餘弦皆變正弦癸已為丙亥弧正弦戊巳為辛亥弧正弦然則先以兩正相乘者今為兩餘然雖變兩餘而其為丙癸與辛戊者不變故其所得之初數戊庚亦不變也次數倣論總例凡弧度與半周相減之餘則所用之正弦同餘弦亦同凡弧度與象限相減之餘則所用之正弦變餘餘弦變正餘弦内減次數例鈍角法銳角法各一丁乙丙弧三角形有三邊求乙鈍角丙乙小弧其正弦丙辰餘弦辰巳丁乙大弧其正弦癸甲餘弦甲已是為角旁之兩弧不同類癸乾初得數兩正弦乗半徑除之數午已次得數兩餘弦乗半徑除之數丁丙對邊大其正弦壬卯餘弦卯已對邊大于象限而角旁弧不同類宜相減對弧餘弦大于次數法當于餘弦卯巳内減去次得數午已餘午卯即艮丁為二率一初得數癸乾二次得數減餘弦艮丁三半徑辛已四角餘弦寅已對邊大角旁弧異類而次數小減對弧餘弦其角為鈍宜以四率寅已撿餘弦表得度以減半周度其餘即為乙鈍角之度即寅酉大矢之度若先有乙鈍角求對弧則反用其率一半徑辛巳二角餘弦寅已三初得數癸乾四次得數減餘弦艮丁既得艮丁乃以次數加之成卯已餘弦檢表得度以減半周得丁丙對邊之度凡過弧與其減半周之餘度同用一餘弦故以餘弦檢表得度以減半周即得過弧仍用前圖取銳角丁戊庚三角形係銳角此形有三銳角有三邊求戊角戊庚小邊其正弦庚丑餘弦丑巳丁戊次小邊其正弦癸甲餘弦甲巳是為角旁弧同類初得數癸乾半徑除兩正弦矩次得數午已半徑除兩餘弦矩丁庚對邊小其正弦壬卯餘弦卯巳對邊小于象限而角旁弧同類宜相減次數午已小于對弧餘弦卯已以午已去減卯已餘卯午即艮丁一初得數癸乾二次得數減餘弦艮丁三半徑辛已四角餘弦寅已對邊小角旁弧同類而次數小去減餘弦其角為銳宜以四率寅已檢餘弦表得戊銳角之度若先有戊銳角度求對邊丁度則反用其度一半徑辛巳二角餘弦寅已三初得數癸乾四次得數減餘弦艮丁以所得艮丁加次數午已檢餘弦表得丁庚對邊之度因銳角角旁弧同類次數小于餘弦得數後宜加次數為對邊餘弦論曰丁戊庚形與丁乙丙形為相易之形故丁戊為丁乙減半周之餘戊庚等乙丙此兩弧所用之正弦餘弦並同則初數次數亦同矣而丁庚對弧亦丁丙對弧減半周之餘則所用餘邊又同加減安得不同次數内轉減餘弦例銳角法鈍角法各一丁乙丙形三邊求乙角係銳角丙乙小邊正弦辰丙餘弦辰已丁乙大邊正弦癸甲餘弦甲已是為角旁之兩邊不同類初得數甲乾半徑除兩正弦矩次得數午已半徑除兩餘弦矩丁丙對邊大正弦壬卯餘弦卯已對邊大而角旁弧不同類宜相減次數午已大于對弧餘弦卯已法當于午己内減卯巳餘午卯即甲艮為二率一初得數甲乾二餘弦減次數之餘甲艮三半徑辛巳四角餘弦寅已對邊大角旁弧異類而次數大受對弧餘弦之減其角為銳宜以四率寅已檢餘弦表得乙鋭角之度即寅辛矢度若先有乙角而求對邊丁丙則反用其率一半徑辛巳二角餘弦寅己三初得數甲乾四餘弦減次數之餘甲艮末以所得甲艮轉減次數午已得對弧餘弦卯巳檢表得度以減半周為對弧丁丙度前圖取鈍角丁戊庚形三邊求戊角係銳角戊庚小邊正弦丑庚餘弦丑巳丁戊次小邊正弦癸甲餘弦甲巳是為角旁兩弧同類初數甲乾半徑除兩正弦矩次數午已半徑除兩餘弦矩丁庚對邊小正弦壬卯餘弦卯巳對邊小而角旁兩弧同類宜相減次數午巳大於對邊餘弦卯巳當于午巳内減卯已餘午卯即甲艮一初得數甲乾二餘弦減次數之餘甲艮三半徑辛巳四角餘弦寅已對邊小角旁弧同類而次數大内減去餘弦其角為鈍宜以四率寅巳檢餘弦表得度以減半周得戊鈍角之度若先有戊鈍角而求對邊丁庚則反用其率一半徑辛已二角餘弦寅巳三初得數甲乾四餘弦減次數之餘甲艮末以所得甲艮轉減次數午巳得對弧餘弦卯已檢表得對弧丁庚之度一係半渾員面所成斜三角形左右皆相對如左銳角者右必鈍也對邊左小者右必大也角旁之邊左為同類者右必異類也角旁兩弧一居員周一居圓面此員面弧線左右所同用也而員周之弧左右有大小故同于左者不同于右加減法以代乗除初數次數並以乘除而得今以總弧存弧之餘弦相加減而半之即與乗除之所得脗合法簡而妙而甲數乙數之用亦從此生矣總法曰凡兩弧相并為總弧相減為存弧存弧一曰較弧總弧存弧各取其餘弦以相加減成初數次數法曰視總弧過弧限則總存兩餘弦相加總弧不過象限則相減皆折半為初數即原設兩弧之正弦相乗半徑除之之數以初數轉減存弧餘弦即為次數即原設兩弧之餘弦相乗半徑除之之數又法總弧過象限兩餘弦相減不過象限則相加並折半為次數又法初數以相加成者以總弧餘弦減初數以相減成者以總弧餘弦加並加減初數為次數亦同又取總弧存弧之正弦相加減成甲數乙數法曰以總存兩正弦相加折半為甲數即原設大弧正弦乗小弧餘弦半徑除之之數總存兩正弦相減折半為乙數即原設小弧正弦乘大弧餘弦半徑除之之數又法以存弧正弦減甲數其餘為乙數亦同又法以甲數減總弧正弦即得乙數總弧在象限内兩餘弦相減大弧丙寅小弧辰丙即丑丙二弧相加為總弧辰寅相減得存弧丑寅丑寅存弧之餘弦丑癸亦即丁乙辰寅總弧之餘弦卯辰即癸子亦即乙午兩餘弦相減丑癸内減子癸存丑子或乙丁内減乙午存午丁其餘半之丑子半之于壬成壬丑即亥丁為丙寅辰丙二弧兩正弦相乗半徑除之之數即初得數也以初得數轉減存弧之餘弦以壬丑減丑癸其餘癸壬亦即亥乙其餘為大小二弧兩餘弦相乗半徑除之之數即次得數也論曰丙辛大弧之正弦也丑戊小弦之正弦也以句股形相似之故乙丙半徑弦與丙辛正弦股若丑戊正弦小弦與丑壬初得數也小股其半而得者何也曰辰戊同丑戊則戊巳亦同丑壬而壬子即已戊則子丑者初得數壬丑之倍數故半之即得辛乙大弧之餘弦也戊乙小弧之餘弦也乙丙半徑弦與辛乙餘弦句若戊乙餘弦小弦與亥乙次得數也小句又以存弧餘弦内兼有初得次得兩數故減初得次也丑癸餘弦内有丑壬初數癸壬次數故減丑壬即得癸壬也或于乙丁内減亥丁得亥乙並同以上用總存兩餘弦加減又丑寅存弧之正弦丑丁即午子或癸乙辰寅總弧之正弦辰午即卯乙兩正弦相加半之為大弧正弦乗小弧餘弦半徑除之之數即甲數也以甲數轉減總弧之正弦以午已減辰午其餘巳辰亦即卯未是為大弧餘弦乗小弧正弦半徑除之之數即乙數也論曰乙辛大弧之餘弦也辰戊小弧之正弦也以兩句股形同比例之故丙乙半徑弦與乙辛餘弦句若辰戊正弦小弦與辰已乙數也小句又丙辛大弧之正弦也戊乙小弧之餘弦也而丙乙半徑弦與丙辛正弦股若戊乙餘弦小弦與戊亥甲數小句也又以總弧正弦内兼有甲乙兩數故減乙得甲減甲亦得乙矣辰午正弦内有辰巳乙數巳午甲數故減辰巳得巳午若減巳午亦必得辰巳以上用總存兩正弦加減若以酉丙為大弧丙丑為小弧則其總弧酉丑正弦丑丁餘弦丑癸其存弧辰酉正弦辰午餘弦卯辰但互易存總之名其他並同論曰凡過象限之弧與其減半周之餘弧同用一正弦如丙酉過弧以減半周得丙寅所用正弦丙辛餘弦辛乙皆丙酉弧與丙寅弧之所同也故但易總存之名而正餘加減之用不變又法凡過象限之弧即截去象限用其餘度如法加減但以總弧為存弧存弧為總弧而總存之餘弦為正弦正弦為餘弦如酉丙過弧截去酉甲象限只用丙甲為大弧與丙丑小弧相加減則丑甲為總弧其正弦丑癸餘弦丑丁而辰甲為存弧其正弦卯辰餘弦辰午是總存正餘名皆互易也法以總存兩正弦相減而其餘折半為甲數丑癸内減卯辰餘丑子半之得丑壬為甲數仍以甲數轉減總弧正弦甲數丑壬轉減丑癸其餘癸壬即乙數是其名雖易而其實不易也但横易為直論曰去過弧之象限而用之則過弧之正弦為餘餘弦為正矣故加減而得之數皆兩弧之正弦乘餘餘弦乘正之數而非復正乗正餘乘餘之數也何也過弧之正餘互易而小弧之正餘如故也如丙酉過弧去象限為丙甲則其正弦丙庚即過弧之餘弦也丙庚即辛乙故其餘弦庚乙即過弧之正弦也庚乙即丙辛故而小弧丙丑之正弦丑戊餘弦戊乙皆如舊故先得之丑壬為大弧餘弦丙辛乘小弧正弦丑戊而丙乙半徑除之也非兩正弦相乘也乙數轉減正弦而得之亥乙即癸壬亦即戊未為大弧正弦辛乙乘小弧餘弦戊乙而半徑除之也非兩餘弦相乘也又論曰又法即測夜時篇中測星距午之第二法也加減代乗除只此一例而絶不與七卷八卷之乘除求初數次數者相蒙雖有學者何從悟入乎愚故為之詳説以發其覆又論曰元法依圖直看直者正弦横者餘弦又法正餘互易則圖當横看變立體為眠體本以總存兩餘弦加減者變為兩正弦加減然其數並同又論曰又法是用大弦之餘度而小弧則用元度何以言之測星條用星之赤緯即去極之餘度也其用赤道髙則極去天頂之元度也然而赤緯在南者則是于星去極度截去象限之數也何以亦為餘度曰過弧既與其減半周之餘度同一正弦則此減半周之餘度亦即正弧也然則此截去象限而餘者非即正弧之餘度乎大弧過象限若干度與不及象限若干度其正弦並同故加減可通為一法此又測星條用法之意約法兩弧俱用本度或俱用餘度相加減以取總存二弧是兩正或兩餘也則用總存兩餘弦加減法取初得數惟視總存二弧俱在一象限則相減或分跨兩象限則相加皆以初數減存弧之餘弦為次得數若兩弧内有一過弧則總弧之正弦小于存弧而餘弦反大當以初數減總弧之餘弦為次數若一弧用本度一弧用餘度相加減以取總存之弧是一正一餘也則用總存兩正弦加減法其加減皆眎兩正弦原法或加或減取甲數即以甲數減總弧正弦餘為乙數若過弧節去象限而用其剰度與餘度同法凡餘度是以本度減象限而得名今反以象限減過弧故别之曰剰若兩俱剰弧與兩餘弧同法若只一剰弧與一正一餘同法論曰過弧用剰度為餘弧其法甚簡快凡過弧皆當用之可不用本度矣算普天星經緯歲差宜此又按凡存弧之餘弦内兼有兩正弦相乗兩餘弦相乗兩數即初次兩得數也凡總弧之正弦内兼有此正弦乗彼餘弦彼正弦乗此餘弦之數即甲乙兩數也故易其名以别之也大弧寅丙正弦丙辛餘弦辛乙小弧辰丙即丑丙正弦辰戊即丑戊餘弦戊乙二弧相加為總弧辰寅正弦辰午餘弦午乙相減為存弧丑寅正弦丑丁餘弦丁乙存總兩餘弦午乙丁乙相并成午丁半之于亥成亥丁即初得數大小二弧兩正弦丙辛辰戊相乗半徑除之之數也以初得數亥丁轉減存弧之餘弦丁乙餘亥乙即次得數大小二弧兩餘弦辛乙戊乙相乗半徑除之之數也論曰以句股形相似之故丙乙半徑與丙辛正弦若戊丑正弦與初數丑壬即亥丁也皆弦比股也又丙乙半徑與辛乙餘弦若戊乙餘弦與次數亥乙也皆弦比句也以上用總存兩餘弦加減因總弧跨過象限故相加又存弧正弦丑丁與總弧正弦辰午相加成辰乾以午乾等丁艮亦即丑丁也折半得巳午即戊亥為辰子折半為巳子子乾折半午子合之成巳午為甲數大弧正弦丙辛乗小弧餘弦戊乙半徑丙乙除之也以甲數已午轉減總弧正弦辰午餘辰巳為乙數大弧餘弦辛乙乗小弧正弦辰戊半徑丙乙除之也以上用總存兩正弦加減若用酉丙過弧為大弧丙丑為小弧則其總弧酉丑存弧酉辰但互易存總之名其它並同以過弧酉丙所用之正弦丙辛餘弦辛乙即丙寅弧所同用故也又法于酉丙過弧内截去象限酉甲只用其剰弧甲丙則甲丙反為小弧丙丑反為大弧説見前條圖式三總弧在象限内兩餘弦相減乙丙小弧其正弦丙辰餘弦辰已丁乙稍大弧其正弦丁甲餘弦甲巳戊壬初得數兩正弦相乗半徑除也即庚甲或戊卯午戊次得數兩餘弦相乗半徑除也即巳癸今改用加減以省乗除以二弧相加成總弧丁丙其正弦子丁餘弦子巳又二弧相較成存弧壬丙其正弦壬辛卽午巳餘弦辛巳卽壬午于存弧之餘弦辛巳内減去總弦之餘弦巳子存子辛半之于癸得子癸及辛癸皆初得數也亦卽戊壬也或于壬午丙減午卯半之于戊得卯戊及戊壬亦同亦即庚甲也又于存弧餘弦辛已内仍減去初得數辛癸存癸已即次得數也壬午内減戊壬存午戊亦同此因總弧在象限内故以總弧餘弦減存弧餘弦求初數是初數小于次數解曰以句股形相似之故己丙半徑弦與丙辰正弦句若丁甲正弦弦與甲庚初數也又壬甲等甲丁故庚甲亦等戊壬而戊卯即庚甲故可以半而得之也又已丙半徑弦與辰已餘弦股若甲已餘弦弦與巳癸次數股也右係總存兩餘弦用法又丁庚為甲數丁甲大弧正弦乗辰巳小弧餘弦半徑除之也亦即庚卯即甲戊子庚為乙數辰丙小弧正弦乗甲巳大弧餘弦半徑除之也即癸甲今改用加減法以存弧正弦子卯即辛壬加總弧正弦子丁成卯丁而半之于庚得丁庚為甲數亦即庚卯即戊甲仍于總弧正弦丁子内減去甲數丁庚存子庚即癸甲為乙數此亦總弧在象限内亦總存兩正弦相加求甲數是甲數大于乙數解曰以句股形相似之故已丙半徑與辰巳小弧餘弦若丁甲大弧正弦與甲數丁庚皆弦與股之比例也又丁甲等壬甲故戊甲亦等丁庚而戊甲即庚卯故可以半而得之也又巳丙半徑與丙辰小弧正弦若甲已大弧餘弦與乙數甲癸即子庚皆弦與句之比例也右係總存兩正弦用法一係凡兩弧内無過弧則存弧之餘弦大故其中有初次兩數而總弧則正弦大故其中有甲乙兩數雖兩數相加能令總弧跨過象限此理不變餘弦仍係存弧大正弦仍係總弧大總弧過象限兩餘弦相加乙丙小弧正弦辰丙餘弦辰已乙丁過弧正弦丁甲餘弦甲已初得數戊丁半徑除兩正弦矩即子癸亦即癸辛亦即庚甲次得數癸巳半徑除兩餘弦矩今用加減代乗除以二弧相加成總弧丁丙正弦丁子餘弦子已又二弧相較成存弧壬丙正弦壬辛餘弦辛巳乃以總存兩餘弦相加成子辛子巳加辛巳而半之于癸得子癸及癸辛亦即丁戊即庚甲初得數也又以初數子癸轉減總弧之餘弦子已餘癸巳次得數也此因總弧跨過象限故兩餘弦相加求初數是初數大于次數解曰以句股形相似故半徑已丙與正弦丙辰若正弦丁甲與初數丁戊皆弦與股之比例也又半徑丙已與餘弦辰已若餘弦甲巳與次數癸已皆弦與句之比例也又壬甲等丁甲則庚甲亦等戊丁而辛癸亦等子癸故半而得右用總存兩餘弦加減又甲數丑甲小弧餘弦辰已乗過弧正弦丁甲半徑除之也乙數癸甲小弧正弦辰丙乗過弧餘弦甲巳半徑除之也今用加減搃存兩正弦相加成丑戊癸戊與正弦丁子等丑癸與正弦辛壬等故以相加即成丑戊半之于甲得丑甲亦即甲戊為甲數仍以甲數丑甲轉減存弧正弦丑癸餘癸甲為乙數或以總弧正弦癸戊減甲數甲戊亦即得乙數癸甲此亦總弧跨象限外仍係總存兩正弦相加求甲數甲數仍大于乙數解曰半徑丙已與小弧餘弦辰已若大弧正弦丁甲與甲數丑甲皆以弦比句也又半徑丙已與小弧正弦辰丙若大弧餘弦甲巳與乙數癸甲皆以弦比股也又壬甲等丁甲則甲戊亦等壬庚而壬庚即丑甲故半之而得右用總存兩正弦加減一係凡兩弧内有過弧者總弧之餘弦反大故初次兩數皆在總弧餘弦内而總弧之正弦反小故甲乙兩數皆在存弧正弦内也此必原有一過弧始用此例非謂總弧過象限也觀圖自明甲數乙數用法黄赤道經緯相求黄赤二道經緯相求用斜弧三角形以星距黄極為一邊星距北極為一邊并兩極之距為三邊此本法也今不用距極度而用其餘度距極度本為緯度之餘今用三角形以距極度為邊故緯度皆為餘度徑取黄緯為一邊此先有黄緯而求赤緯也若先有赤道而求黄道即用赤緯為邊二至之黄赤大距為一邊黄赤大距原與兩極之距等而取二邊之總存兩正弦為用以加減省乘除故在本法為初數次數者别之為甲乙數焉甲數乙數不止為求黄赤而舉此為式其理特著故命之曰甲數乙數用法實黄赤相求簡法矣第一圖黄緯小于黄赤大距甲數大乙數小甲丙亢危大圈為過兩極之經圈即二至經圈心乙亢軸即黄道二分經綫丙乙室為黄道心為黄極寅乙危為赤道甲為北極辰胃婁為黄道北緯即丙辰之度丑尾奎為黄道南緯即丙丑之度星在箕箕心為星距黄極緯度箕女為星距黄道緯即丙辰之度甲心箕銳角為黄道經度其餘弦女乙甲心為兩極相距二十三度三十一分半寅丙為夏至距緯同甲心之度今求甲箕為星距北極緯度其餘弧箕翌為星距赤道緯即氐危之度用甲心箕三角形有心角黄道經有心箕弧星距黄極緯有甲心弧為兩極之距而求對角弧甲箕星赤道北極緯依加減代乗除改用寅丙夏至距即心甲辰丙黄道緯即心箕之餘箕女又即丙丑度寅丙辰丙相加為總弧辰寅其正弦辰午又相減為較弧丑寅其正弦丑丁亦即丁井亦即午昴亦即子午以丑丁正弦即午昴加辰午正弦成辰昴折半得巳午甲數巳子為辰子之半子午為子昴之半合之成巳午甲數巳午轉減正弦辰午餘巳辰為乙數或以丑丁正弦即子午減辰午正弦餘辰子折半得辰巳為乙數以乙數轉減總弧正弦辰午得已午為甲數亦同法為黄道半徑丙乙與心角之餘弦女乙若甲數巳午與四率斗未也一黄道半徑丙乙二心角餘弦女乙三甲數巳午即戊酉四減過乙數之赤緯正弦斗未即虚栁論曰丙乙半徑與女乙餘弦原若辰胃與箕胃辰胃者箕心黄緯之正弦即距等圏半徑因箕心角線過箕至女分辰胃正弦于箕亦分丙乙半徑于女故丙乙與女乙若辰胃與箕胃皆全與分比例而辰胃同戊乙箕胃同斗乙皆弦也戊酉乙大句股以戊乙為弦戊酉為句斗未乙小句股以斗乙為弦斗未為句戊酉同巳午斗未皆句也則其比例等故丙乙與女乙能若戊乙與斗乙亦即若已午與斗未以乙數辰巳即箕虚加四率斗未即虚栁成箕栁即所求赤道緯度正弦檢表得赤緯在北即箕翌亦即氐危若先有赤緯黄緯而求黄經則互用其率以三四為一二法為甲數戊酉與赤緯正弦内減乙數之斗未若黄道半徑丙乙與心角黄經度之餘弦女乙也一甲數戊酉即午巳二乙數箕虚減赤緯正弦半未即虚栁三黄道半徑丙乙四心角餘弦女乙檢餘弦表得心角之度假如前圖星在尾為黄道南緯則所用之甲數乙數並同所得之四率亦無不同而赤緯逈異何以言之曰心不在箕而在尾則心甲弧兩極距度心角黄道經度皆不變唯尾心弧大于箕心故甲心箕三角形變為甲心尾三角而所求對角之甲尾弧亦大于甲箕故赤緯異也然則所用之甲數乙數又同何也曰尾心為過弧則用在女尾尾心内減去女心象限女尾為黄道南緯與箕女北緯同度亦即同正弦則相加為總弧相減為較弧亦同而甲乙數不得不同矣而三率算法亦必同矣但所得四率在北緯則用加在南緯則用減緯度迥異理勢自然也一黄道半徑丙乙二心角餘弦女乙以乙數辰巳減四率斗未減盡三甲數已午無餘為星在赤道無緯度四加過乙數之赤緯正弦斗未論曰此因乙數與四率同大故減盡也減盡則甲尾正九十度而星在赤道無緯也亦有四率小于乙數者則當以四率轉減乙數用其餘為緯度正弦在赤道南又論曰星在箕為黄道北在尾為黄道南然所得赤緯皆在北者以箕尾經度皆在夏至前後兩象限中也故所得四率在赤道北而加乙數則北緯大減乙數則北緯小皆北緯也惟四率轉減乙數則變為南緯此亦惟黄南緯星又近二分則雖在夏至前後象限中而有南緯亦有無四率者心角必九十度其星必在黄道二分經度無角度餘弦為次率故亦無第四率可求但以乙數為用視星在南北即以乙數命為南北緯度之正弦假如前圖中有星在胃是在北也即以乙數胃張即辰巳命為赤道北緯之正弦若星在房是在南也即以乙數乙癸亦即辰巳命為赤道南緯之正弦又有所得四率北反用減南反用加者心角必為鈍角其星必在冬至前後兩象限其角度餘弦必為大矢内減儀象限之餘則所得第四率在赤道之外外即南也而加減後所得皆赤道之南緯也故加減皆反求北緯以加而南緯必減者星在北也求北緯以減而南緯必加者星在南也盖所得第四率原係在北在南兩星緯度之中數星在北在南皆主黄道言假如前圖中有星在兑為黄道北而甲心兑三角形心為鈍角其餘弦艮乙為艮丙大矢内減象限之餘故所得第四率未斗在赤道之外為赤道南緯此南緯是黄道軸距赤道軸而兌星在黄道之北則其南緯正弦小于未斗故必以乙數牛斗即辰己亦即奎巳減之其餘牛未同兌庚即兌星赤道南緯之正弦若星在巽亦同用心鈍角為甲心巽三角形艮乙餘弦四率未斗在赤道外並同但巽星又在黄道之南則其南緯大于未斗四率故必以乙數虚巽即辰巳亦即牛斗加之成巽栁即巽星南緯之正弦亦有四率小于乙數者則以四率轉減乙數用其餘為緯度在赤道北又論曰星在兌為黄道北在巽為黄道南然所得赤緯皆在南者以兌巽經度皆在冬至前後兩象限中也故所得四率在赤道南而以乙數減則南緯小以乙數加則南緯大皆南緯也惟四率轉減乙數者則變為北緯此亦必黄北緯星又近二分故雖在冬至前後象限中而仍有北緯凡以乙數及四率相加減成緯度者並主緯度之正弦而言後倣此總論曰凡乙數皆南北兩赤緯度相減折半之數甲數則兩緯度之中數也如箕女與女尾兩黄緯同度而不能以女庚為兩赤緯弦之中數者弧度有斜正故也而所得四率即所求星南北兩緯正弦中數故與甲數為比例凡所得四率星在夏至前後兩象限四率在赤道北星在冬至前後兩象限四率在赤道南凡總弧正弦内兼有甲數乙數不論黄南黄北並同一法但視黄緯之大小若黄緯小于黄赤大距則以總存兩正弦相併而半之為甲數若黄緯大于黄赤大距則以總存兩正弦相減而半之為甲數並以甲數轉減總弧正弦為乙數又法黄緯小于黄赤大距以總存兩正弦相減而半之則先得乙數黄緯大于黄赤大距以總存兩正弦相併而半之亦先得乙數並以乙數轉減總弧正弦為甲數求赤緯約法凡星有黄緯之南北有黄經之南北黄經南北即南六宫北六宫星在夏至前後先得之黄經為鋭角是經在北也也星在冬至前後先得之黄經為鈍角是經在南若星之黄緯南北與黄經同者其赤緯南北亦與黄緯同法用四率乙數相加為緯度正弦加惟一法星在黄道北又係夏至前後兩象限先得黄經鋭角是經緯同在北則赤緯亦在北星在黄道南又係冬至前後兩象限先得黄經鈍角是經緯同在南則赤緯亦在南若星之黄緯南北與黄經異者赤緯有同有異皆四率乙數相減為赤緯正弦減有二法但視乙數大受四率轉減者赤緯之南北與黄緯同如星在黄道北而在冬至前後兩象限黄經角鈍是緯北而經南也而乙數大受四率轉減則赤緯仍在北星在黄道南而在夏至前後兩象限黄經角鋭是緯南而經北也而乙數大受四率轉減則赤緯仍在南若乙數小去減四率者赤緯之南北與黄緯異如星在黄道北而在冬至前後黄經角鈍為緯北經南而乙數又小去減四率則赤緯變而南星在黄道南而在夏至前後黄經角鋭為緯南經北而乙數又小去減四率則赤緯變而北若星在黄道軸線是正當二分經度也其角必九十度無餘弦亦無四率但以乙數為用星在北即以乙數命為赤道北緯之正弦星在南即以乙數命為南緯之正弦若遇乙數四率相減至盡者其星正當赤道無緯度第二圖黄緯大于黄赤大距甲數小乙數反大有黃道經緯求赤緯甲北極心黄極甲心為兩極之距丙室黄道寅危赤道寅丙為夏至大距同甲心乙為二分以上並與前圖無二所異者黄緯丙丑即丙辰大于寅丙故乙數亦大于甲數寅丙之正弦丙辛餘弦辛乙丙丑之正弦辰戊或戊丑餘弦戊乙甲數戊酉乃寅丙正弦乗丙丑餘弦半徑除之也法為丙乙半徑與正弦丙辛若戊乙餘弦與甲數戊酉乙數辰巳或巳子或戊壬乃辛乙餘弦乗辰戊正弦半徑除之也法為丙乙半徑與餘弦辛乙若辰戊正弦與乙數辰巳假如星在箕為在黄道北箕心為距黄極之度其餘箕女黄道北緯也有箕心甲心兩極距二邊有心銳角黄經用甲心箕三銳角弧形求赤緯甲箕為對角之弧依加減代乗除改用寅丙辰丙二弧相加為總弧辰寅其正弦辰午又相減成較弧寅丑其正弦丑丁即午子以丑丁正弦加辰午正弦成辰子折半于巳為乙數辰巳及巳子乙數辰已轉減總弧正弦辰午得已午為甲數即戊酉本法以丑丁減辰午折半得已午為甲數甲數巳午轉減辰午得辰巳為乙數法為黄道半徑丙乙與餘弦女乙若甲數戊