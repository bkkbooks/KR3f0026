極對角邊也其餘箕翼即黄緯有甲箕邊距北極即辰危之餘有心甲邊兩極距寅丙及危室並同求甲鈍角赤道經兩極距危室之正弦危辛餘弦辛乙赤緯危辰之正弦辰戊餘弦戊乙甲數戊酉為半徑危乙與二極距之正弦危辛若赤緯餘弦戊乙與甲數戊酉也乙數辰巳或戊壬赤為半徑危乙與二極距之餘弦辛乙若緯正弦辰戊與乙數辰巳也依加減代乗除以辰危危室兩弧相加為總弧辰室其正弦辰午又相減為較弧婁室其正弦婁丁或丁井即午昴以總弧正弦辰午加較弧正弦午昴成辰昴而半之為甲數巳午巳坤為辰坤之半坤午為坤昴之半合之為巳午即戊酉又以甲數己午轉減正弦辰午得辰巳為乙數亦即戊壬星在箕為赤緯北而黄緯亦在北兩緯同向宜相減而成次率而乙數大當以黄緯轉減之成斗未牛未乙數内減牛斗黄緯餘斗未乙數大受黄緯反減而緯在北赤經在北六宫為鈍角一甲數酉戊以艮乙餘弦查度春分後二乙數内減黄緯正弦斗未用減象限夏至後加象限三赤道半徑寅乙命為距春分經度四甲角餘弦艮乙若星在尾用心甲尾三角形則為南緯而黄緯亦南兩緯同向宜相減成次率而乙數小于黄緯故以乙數減黄緯成斗未虚尾黄緯内減乙數氐尾餘虚氐即斗未其甲數乙數等算並同乙數小去減黄緯而緯在南赤經必在北六宫為鈍角一甲數酉戊二黄緯正弦内減乙數斗未三赤道半徑寅乙四甲角餘弦艮乙若星在兑用心甲兑三角形兑為北緯而黄緯亦北兩緯同向宜相減成次率而乙數小于黄緯故以乙數減黄緯成未斗兊乾黄緯内減乙數兊離餘餘離乾即未斗甲數乙數並同乙數小去減黄緯而緯在北赤經反在南六宫為銳角一甲數戊酉以女乙餘弦度秋分後減二黄緯正弦内減乙數未斗三象限冬至後加三象限三赤道半徑危乙命為距春分赤經下同四甲角餘弦女乙若星在巽用心甲巽三角形赤緯南黄緯亦南兩緯同向宜相減成次率而乙數大以黄緯轉減之成未斗未牛乙數内減黄緯斗牛即栁巽其餘即未斗乙數大受黄緯轉減而緯在南赤經即在南六宫為銳角一甲數戊酉二乙數内減黄緯正弦未斗三赤道半徑危乙四甲角餘弦女乙第五圖赤緯小于二極距甲數大乙數小黄緯乙數相加成次率黄緯在南角鋭鈍黄緯在北角星在巽用心甲巽三角形有心甲邊二極距有巽甲邊距北極度為過弧其赤緯女巽在南有巽心邊距黄極度其餘巽為黄緯在北求對巽心弧之甲角心甲兩極距即危室或寅丙其正弦危辛餘弦辛乙女巽赤緯即危婁或辰危即丑寅其正弦辰戊餘弦戊乙甲數戊酉兩極距正弦危辛乗赤緯餘弦戊乙半徑危乙除之之數也法為危乙與危辛若戊乙與戊酉乙數辰巳兩極距餘弦辛乙乗赤緯正弦辰戊半徑危乙除之之數也法為危乙與辛乙若辰戊與辰巳依加減代乗除改用辰危危室相加為總弧辰室其正弦辰午又相減為較弧婁室其正弦婁丁即午昴及丁井以總較兩正弦相加成辰昴折半得巳午為甲數即戊酉巳坤為辰坤之半坤午為坤昴之半合之成己午甲數巳午轉減總弧正弦辰午得辰巳為乙數即戊壬黄緯巽氐在北赤緯女巽在南兩緯異向宜以乙數與黄緯正弦相加成次率以同黄緯正弦巽栁之牛斗加同乙數戊壬之未牛成未斗乙數黄緯正弦相加而黄緯在北其赤經必在南六宫為銳角法為甲數戊酉與未斗若戊乙與未乙亦即若危乙與女乙一甲數戊酉以女乙查餘弦表得度二乙數加黄緯正弦未斗秋分後減冬至後加皆與三赤道半徑危乙三象限相加減命為其星四甲角餘弦女乙距春分赤道經度又如星在箕用心甲箕三角形有心甲邊二極距有箕甲邊距北極度其餘箕艮赤緯在北有箕心邊距黄極度為過弧其黄緯翼箕在南求對箕心弧之甲角甲數乙數同上惟黄緯翼箕在南赤緯箕艮在北兩緯異向宜以乙數與黄緯正弦相加成次率以黄緯正弦箕張相同之牛斗加乙數辰巳相同之牛未成斗未乙數與黄緯弦相加而黄緯在南其赤經必在北六宫為鈍角法為甲數酉戊與斗未若戊乙與未乙亦即若寅乙與艮乙一甲數戊酉以艮乙查餘弦表得度春二乙數加黄緯正弦斗未分後減夏至後加皆加減三赤道半徑寅乙象限命為其星距春分赤四甲角餘弦艮乙赤道經度求赤道經度約法用三邊求角兩極距為一邊距北極為一邊此二邊為角兩旁之弧距黄極為一邊此為對角之弧以求到鈍角赤道經度在北六宫銳角赤道經度在南六宫法為甲數與次率若赤道半徑與所求角之餘弦其樞紐在次率也凡黄緯南北與赤緯同向者並以乙數與黄緯相減而成次率減有二法凡黄緯南北與赤緯異向者並以乙數與黄緯相加而成次率加惟一法厯算全書卷十
