body:
  text: 厯算全書卷四十八宣城梅文鼎撰句股闡微卷三句股法解幾何原本之根句股羃與弦羃相等圖甲乙丙句股形乙辛大方為弦羃弦羃内兼有句股二羃論曰試於弦羃作對角之乙子線與甲丙股平行而等又作丙丁對角線與甲乙句平行與乙子線遇於子成十字正角則丙子與甲乙句相等成乙子丙句股形與甲乙丙句股形等又作辛癸及庚戊兩線皆與丙丁等亦與乙子等而皆與甲丙股等又辛丁及癸庚及戊乙皆與丙子等即皆與甲乙句等則弦冪内所作四句股形皆與原設句股形等於是以丙丁辛形移作乙壬庚以癸庚辛形移作甲乙丙成甲丙丁癸庚壬磬折形末引丁癸至巳截成大小二方形則丙巳方形即股幂癸壬小方即句幂也若先有丙巳股幂癸壬句幂則聯為磬折形而移乙壬庚句股補於丙丁辛之位移甲乙丙句股補於癸庚辛之位即復成乙辛大方而為弦幂又法甲乙丙句股形乙丙弦其幂乙戊丁丙甲丙股其幂甲壬辛丙甲乙句其幂乙庚癸甲法於原形之甲正角作十字線分弦幂為兩長方一為丑子丁丙凖股幂一為丑子戊乙凖句幂又引之至己又自庚癸自壬辛並引之至巳而成方角次移甲丑丙句股補巳子丁虚形又移巳壬甲句股補丁辛丙虚形即成股冪而與丑子丁丙長方等積又移甲丑乙句股補己子戊虚形再移己卯戊句股補戊癸寅虚形又移戊卯甲癸形補癸寅乙庚虚形即成句幂而與丑子戊乙等積解幾何二卷第五題第六題甲丙為弦丁丙為句丁甲句弦和乙丁句弦較丁甲同丁壬甲癸並同庚辛戊己弦幂也己句幂也戊庚辛較乗和之長方幂也移戊補戊移庚辛補庚辛而弦幂内净多一己形即句幂也故弦幂内有和較相乗之長方又有句幂也論曰凡大小方形相減則其餘必為兩形邊和較相乗之長方是故己形者句自乗之小方也戊庚辛句弦較乗句弦和之長方也合之成戊庚辛巳形即弦自乗之大方矣幾何二卷第五題以倍弦為甲乙原線以甲丙弦為平分之線以甲丁和乙丁較為任分之兩線以丁丙句為分内線其理一也第六題以子丁倍句為原線以丁丙句為平分線以句弦較乙丁即子甲為引増線以丁甲句弦和為全線其理亦同以數明之甲丙弦八丁丙句五乙丁較三丁甲和十三和較相乗三十九句自乗二十五以句幂加和較長方共六十四與甲丙弦幂等又論曰用股弦和較亦同解幾何二卷第七題甲丁股幂即甲乙元線上方子戊句幂即甲乙方内所作已辛方乃任分線甲丙上方也併之成癸寅弦幂即所謂兩直角方形併也弦幂内有戊甲股即甲乙原線戊癸句即任分之甲丙線相乗長方形二即己甲長方及丁辛長方亦即甲乙偕甲丙矩形二也及句股較乙丙上方一即壬丙小方亦即所謂分餘線上方也何以明之曰試於戊癸線引長至丑令丑癸如已丁較即乙丙遂作子丑小長方與丁庚等以益亥癸成亥丑長方與丁辛等亦與已甲等次於癸寅内作甲酉寅辰午未癸卯四線皆與甲乙股等自然有甲卯寅酉午辰癸未四線皆與戊癸句等又自有未卯卯酉等句股較與乙丙較等即顯弦幂内有句股形四較幂一也試於弦鼏内移午辰寅句股補癸戊甲之位成戊卯長方與己甲等又移癸未午句股補甲戌寅之位成戌酉長方與亥丑等而較幂未酉小方元與壬丙等又子丑小長方元與丁庚等合而觀之豈非丁甲股幂及子戊句幂併即與己甲亥丑兩長方及壬丙小方等積乎解幾何二卷第八題庚甲乙句股形取丁乙如庚甲句則丁甲為句股和和之幂為丁己大方即元線甲乙偕初分線上直角方也於大方周線取戊丑己子皆與庚甲句等即丑丁戊子己庚皆與甲乙股等即甲乙元線也句線則初分線次作丑癸庚辛乙壬子卯四線皆與外周四股線平行而等自有丑壬子癸庚卯乙辛四線皆與外周四句線平行而等又有壬癸癸卯卯辛辛壬四句股較線自相等即分餘線也丁已和幂内有長方形四皆句乗股之積即元線偕初分線矩内形四也又有句股較自乗幂一即分餘線上方形也解幾何二卷第九題甲丙為股丁丙為句丁甲句股和乙丁句股較壬庚為句幂辛丙為股幂丑丁較幂丁癸和幂戊巳線上方為句幂之倍戊甲上方為斜線上方倍於元方圖股幂之倍併和較幂倍大於句幂股幂之併古法倍弦幂内減句股和幂開方得較若減較幂亦開方得和即其理也論曰己丁較上方與丁甲和上方併之即己甲上方也戊巳線上方與戊甲線上方併亦即巳甲上方也而戊巳為句幂斜線戊甲為股幂斜線凡斜線上方形倍於原方故較幂併和幂亦倍大於句幂股幂之併也而句幂股幂併之即弦幂古人所以用倍弦幂也此第十題與前題同法甲丙即句丁丙即股丁甲全線即和丁乙引増線即較准前論丁庚即丁乙較上方幂與丁甲和上方幂併成庚甲線上幂而庚甲幂内原兼有丙丁股即巳戊亦即己庚及丙甲句二幂己壬為股幂辛丙為句幂之倍數庚戊為股斜線其幂必倍於股幂戊甲為句斜線其幂必倍於句幂故庚甲幂内能兼戊庚及戊甲二幂丙丙線皆弦也丙丙方弦幂也甲丙之長者皆股也亦即丙丁丁甲丙之短者皆句也亦即丙丁丁丁線句股較也丁丁小方較幂也甲丙甲句股和也甲甲大方和幂也丁甲長方皆句股相乗即倍句股形積也合而觀之則弦幂内有句股積四及較冪一也和幂内有句股積八及較幂一也若倍弦幂則有句股積八及較幂二也故以和幂減倍弦幂得較幂若以較幂減之亦得和幂矣以句股法解理分中末線之根即幾何二卷第十一題六卷第三十題四卷第十第十一題古法句弦較癸庚弦其鼏庚乙丙癸乘句弦和開句其鼏丙戊方得股之圖引庚甲弦至壬使甲壬如丙癸句則庚壬為句弦和丙庚原為句弦較以較乗和成丙壬長方長方内截甲丁小長方與戊辛等其餘庚辛合而觀之是弦鼏内兼有句弦較乗和之積及句鼏也夫弦鼏内原有句股二鼏而今以句弦較乗和之積可代股鼏是句弦較乗和即同股鼏也句弦和及股用法及句弦較為有句弦和有句弦較連比例圖求股法以較乗和開方得股或有股有句弦和求句求弦法以股自乗為實以句弦和除之得較以較減和半之得句句加較得弦若先有較以除股鼏亦得和矣如圖丙戊丁句股形丙丁弦與丁乙等亦與丁庚等丁戊句亥戊為倍句乙戊為句弦較與庚亥等戊庚為句弦和與亥乙等亥巳為句股和乗句弦較之積與戊癸等丙戊股其方鼏甲丙准前論甲丙方與亥巳長方等積戊癸亦同則庚戊和與丙戊股若丙戊股與戊乙較也一句弦和庚戊二股丙戊三股丙戊四句弦較戊乙以戊乙較減亥乙和餘亥戊倍句折半為句丁戊或丁亥或戊乙較與丙戊股若丙戊股與庚戊和也一句股較戊乙二股丙戊三股丙戊四句股和庚戊又論曰以二圖合觀之凡倍句加句弦較即句弦和以倍句減句弦和餘即句弦較此不論句小股大如前圖或句大股小如後圖並同此可以明倍句與句弦較必為句弦和之兩分線故以句弦和為全線則其内兼有倍句及句弦較之兩線矣但倍句有時而大於較有時而小於較故不能自為連比例而必藉股以通之今於句弦和全線内取倍句如股則先以股線為和較之中率者今以如股之倍句當之而倍句原係句弦和全線之大分於是和與倍句之比例若倍句與較亦即為全與大分若大分與小分此理分中末線所由出也下文詳之丙戊線上取理分中末線先以丙戊線命為股以丙戊折半成丁戊命為句取丙丁弦與丁乙等則戊乙為句弦較變股為倍句成亥戊倍句與丙戊股等以理分中末線圖加較成亥乙即句弦和亥巳為和較相乗積與丙亥股鼏等丙亥為丙戊股之方即為亥戊倍句之方准前論亥乙和與丙戊股若丙戊股與戊乙較今亥戊即丙戊則又為亥乙和與亥戊倍句若亥戊倍句與戊乙較也夫亥乙者全線也亥戊其大分戊乙其小分也合之則是全線與其大分若大分與其小分論曰此以丙戊股線為理分中末之大分而求得其全線亥乙與其小分戊乙也而大分與小分之比例原若理分中末線全線與大分故即可以丙戊比例圖大分為全線而以小分戊子即戊乙也為大分則子丙自為小分矣以亥乙為全線亥戊大分即丙戊亦即乙甲即戊乙小分戊子亥乙與乙甲即亥戊大分若亥戊與子戊也即亥戊與戊乙理分中末線此用亥乙甲大句股比亥戊相生不窮圖子小句股若丙戊為全線則又戊子為大分亦即子巳子丙為小分亦即巳甲為亥戊與戊子即丙戊與戊子若子巳與巳甲也即子戊與子丙此用亥戊子大句股比子巳甲小句股亥戊與戊乙若戊子與子丙又相視之理也又若子巳為全線則子庚又為大分庚巳又為小分其法但於大分子巳内截取子庚如小分丙子作丙庚小方則戊子即子巳與子丙若子庚與庚巳似此推之可至無窮解幾何三卷第二十七題甲乙丙句股形以乙丙句折半於巳作已戊線與股平行平分甲丙弦於戊又作戊庚線與句平行平分甲乙股於庚成巳庚長方此即半句乗半股為句股積之半也凡句股形内依正角作長方惟此為大若於形内别作長方皆小皆不及句股半積也今仍作卯丁形則小於巳庚何以知之曰試作丑戊線與丙巳半句平行而等又作丑丙線與戊巳半股平行而等又引壬辰至寅引壬卯至午即顯壬丑形與壬巳形等又乙辰原與巳寅等則以巳寅加壬丑而成丑午壬辰巳之磬折形即亦與卯丁形等矣夫磬折形在丑巳方形内而缺午辰之一角即相同磬折之卯丁形以較已庚半積方形亦缺戊未之一角也葢丑巳等巳庚而所缺之午辰小方亦等戊未也准此言之即凡作長方於丙戊界内者皆小於巳庚半積形也又作子癸形則亦小於巳庚何以知之曰試作戊乙對角線引之至酉即顯癸未形與卯未形等即卯丁形與子癸形亦等而其小於巳庚形為所缺之戊未小方亦等矣准此言之即凡作長方於甲戊界内者皆小於巳庚半積形也又知句股内容方之積亦皆小於半積惟句股相等如半方者容方即為半積論曰此磬折形依弦線而成葢即幾何所謂有闕依形也所闕之小方午辰及戊未皆與丑巳形相似而體勢等以有弦線為之對角也然以句股解之殊簡又論曰若壬角在弦線上去戊角更逺則所缺之午辰小方亦更大而其形皆相似而體勢等辛角亦然解幾何三卷三十五題甲丙乙句股形以甲乙弦為半徑作員則甲丙股為正弦丙乙句為餘弦己丙矢為句弦較丁丙大矢為句弦和依句股法較乗和開方得甲丙股而丙戊亦甲丙也故甲丙乗丙戊與巳丙乗丁丙等積也幾何三卷第三十五題言員内兩線相交則其各分之線相乗等積即此理也巳丁過員心線有庚壬斜線相交於丙分丙巳及丙丁又丙庚及丙壬皆分為兩法自員心乙作十字線至辛平分庚壬為兩辛庚辛壬皆斜線之半辛庚半線内又分辛丙為小線以辛丙減辛庚餘庚丙為較以辛丙加辛壬成丙壬為和以大小二方相較之理言之庚辛方内有庚丙較乗丙壬和之積及辛丙方乙辛庚句股形以乙庚為弦弦幂内兼有庚辛及乙辛句股二幂即兼有庚丙乗丙壬之積及辛丙乙辛二方也又乙辛丙小句股形以乙丙為弦則乙丙方内兼有辛乙辛丙二方而甲丙乙句股形以同庚乙之甲乙為弦弦幂内兼有甲丙及乙丙二方此兩弦者既等其幂必等而其所兼之辛丙乙辛二方又與乙丙方等則各減等率而其所餘之庚丙乗丙壬積亦必與甲丙方等矣而已丙乗丙丁原與甲丙方等則巳丙乗丙丁亦必與庚丙乗丙壬等矣辛戊線庚壬線相交於丙則戊丙乗丙辛與庚丙乗丙壬亦等何以知之曰試作一丁巳過心線與兩線交於丙凖前論戊丙乗丙辛之積及庚丙乗丙壬之積皆能與丁丙乗乙丙之積等則亦必自相等矣丁巳員徑有庚壬斜線相交於丙則庚丙乗丙壬與巳丙乗丙丁等如法作乙辛及乙庚線成乙辛庚句股又成乙辛丙小句股以丙辛句減庚辛句餘庚丙為較以同丙辛句之辛戊加庚辛句成庚戊為和即丙壬又以乙丙弦即乙子亦即乙癸減庚乙弦餘子庚為較又兩弦相加成庚癸為和即子丑以庚子較乗庚癸和與庚丙較乗丙壬和之積必等詳後條而巳丙即庚子丙丁即子丑亦即庚癸故巳丙乗丙丁與庚丙乗丙壬亦等又大小方相減之理庚乙方内兼有庚子乗庚癸之積及乙子方即如兼有庚丙乗丙壬之積及乙丙方也乙丙即乙子而同庚乙之甲乙弦幂内原兼有甲丙方及乙丙方此庚乙甲乙兩積内各減去乙丙方則所存者一為庚丙乗丙壬之積一為甲丙自乗積此所餘兩積亦必相同可知矣又巳丙乗丙丁之積原與甲丙方等則亦與庚丙乗丙壬等矣先解兩方相減寅辛大方内減子巳小方寅辰為兩方邊之較卯辰為兩方之和即子辛法以小方邊乙子為度于大方邊截取乙長乙戊作辰午線及戊未線成辰戊小方與巳子等為減去之積其餘為寅午長方即二方較線寅長乗大方邉之積及未辛長方即較線午未乗小方邉之積末取未辛長方移補丑卯之位成卯寅長方即較乗和之積又庚甲大方内減己癸小方丁辛為兩方較已辛為兩方和亦即辛丙如法作丁壬癸戌二線減去丁癸小方與已癸等其餘辛壬壬癸兩長方又移癸壬為丙壬成丁丙長方即較乗和之積也凖此論之凡大小二方相減其所餘者必皆為較乗和之積次解兩句股形相減凡兩句股同髙即可相加減謂股數同也乙庚辛句股内減乙庚丁句股則以丁庚句減辛庚句餘辛丁為兩句之較又以同丁庚之巳庚句加辛庚句成辛已為兩句之和和乗較成丁丙長方又以乙丁弦減辛乙弦餘辛戊為兩弦之較又兩弦相加成辛子為兩弦之和戊乙子乙並同丁乙和乗較成卯寅長方此兩長方者其積必等無論乙為正角或鈍角或鋭角並同何以明其然也曰依句股法乙辛弦上方兼有乙庚庚辛上二方又乙巳弦上方兼有乙庚庚巳上一方今既以乙巳上方減乙辛上方則各所兼之乙庚方巳相同而減盡故乙辛上方之多於乙巳上方者即是庚辛上方多於庚巳上方之數也又所用者是兩分之乙庚辛句股及乙庚已句股即乙庚丁故不論乙角銳鈍其法悉同也解幾何三卷三十六三十七題甲乙丙句股形以丙乙句為半徑作員則甲丙股為切線甲乙弦為割線甲乙割線内減丁乙半徑則甲丁為句弦較甲乙割線加戊乙半徑成甲戊為句弦和和較相乗平方開之得甲丙股幾何三卷第三十六題三十七題之理葢出於此若割員線不過乙心如甲庚則以他句股明之法自乙心向割員線作乙巳為十字正交線則割線之在員内者平分為兩子巳巳庚並為員内線子庚之半又作乙子半徑成子巳乙小句股則子乙小弦上方幂兼有子巳小股乙巳小句兩幂又甲庚總線既分於巳則甲巳大線内減子巳小線其餘甲子在員外者為較以小線巳庚加大線甲巳成甲庚總為和凡大小二方相較則大方内兼有較乗和及小方之積則是甲巳幂内必兼有甲子乗甲庚之長方及子巳方也又甲巳乙亦句股形其甲乙弦内原兼有甲巳及乙已句股二幂即是兼有甲子乗甲庚之長方及子巳方與乙巳方也而子巳及巳乙二方原合之成一子乙方子乙即丙乙也是合丙乙方與甲子成甲寅之長方而成甲乙方也又甲丙乙句股形同以甲乙為弦原合丙乙方與甲丙方而成甲乙方兩形之甲乙方内各去其相等之丙乙方則其餘積一為甲子乗甲寅之長方一為甲丙自乗方是二者不得不等矣用法凡測平員形既得甲丙切線自乗為實以甲丁之距為法除之得甲戊之距以甲丁距減之得丁戊員徑若欲測庚物之在員周者亦以甲丙切線自乗為實以甲子為法除之即得甲庚之距又法用兩句股相加減甲乙丙句股形以乙丙句為半徑作員又以甲乙弦為半徑作外員自外員任取甲㸃作過心員徑至戊又任作一不過心斜線入内員至庚則以兩員間距線乗其全線皆與股幂等而亦自相等如以甲丁乗甲戊或甲壬乗甲庚其積皆等又皆與甲丙切線上方幂等法以兩句股相加減先自乙心作乙辛十字正線平分壬庚線於辛成乙辛甲句股又作乙壬乙庚二線成乙辛壬小句股與乙辛庚等法以辛壬與甲辛相減餘甲壬為兩句之較又相加成甲庚全線為兩句之和則以甲壬乗甲庚為句之較乗和也又以乙壬與甲乙相減餘甲丁為兩弦之較亦相加成甲戊全線為兩弦之和則以甲丁乗甲戊為弦之較乗和也此句與弦之和較相乗兩積必等而甲丁乗甲戊原與甲丙自乗等以甲丙乙句股言之也故三積俱等凖此論之凡自甲㸃任作多線入内員其法並同不但此也但於外員周任作線入内員亦同如於丑作丑戊線則丑卯乗丑戊亦與甲丙幂等何以知之曰試於丑作丑寅過心線即諸數並同甲戊矣而丑卯戊之於丑辰寅猶甲壬寅之於甲丁戊故也簡法庚壬斜線交丁巳員徑於丙如法作乙辛線成乙辛庚句股形及乙辛丙小句股形又以丙辛小句與辛庚大句相減得庚戊較又相加成庚丙和再以乙丙小弦即乙癸亦即乙子與庚乙大弦相減得子庚較又相加成癸庚和依大小兩句股相加減法庚戊較乗庚丙和與子庚較乗庚癸和同積而壬丙原同庚戊又巳丙原同子庚而丁丙亦同癸庚則壬丙乗庚丙亦必與巳丙乗丁丙同積矣又簡法壬庚線斜交已丁員徑於丙依法作乙辛又作乙壬線成乙辛壬句股及乙辛丙小句股皆如前今自庚别作一過乙心線如庚戊則乙辛庚與乙辛壬成相同之兩句股即顯壬丙為大小兩句之較而丙庚為其和又顯戊癸為兩弦之較而與巳丙等則巳丙亦較也又癸庚為兩弦之和而與丙丁等則丙丁亦和也是故壬丙乗丙庚較乗和也已丙乗丙丁亦較乗和也而其積必等厯算全書卷四十八
