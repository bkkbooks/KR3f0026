body:
  text: 厯算全書巻三十二宣城梅文鼎撰籌算四之五開帶縱平方法勿菴氏曰算有九極于勾股勾股出于圓方故少廣旁要相資為用也然開平方以御勾股而縱法以御和較古有益積減積翻積諸術參伍錯綜盡神通變要之皆帶縱一法而已平方者長濶相等如碁局也平方帶縱者直田也長多于濶之數謂之縱縱之濶如平方之數其長則如縱之數縱與方相乘得縱積以加方積成一直田形積也平方與方縱兩形初商之積也兩亷一隅一亷縱者次商之積也亷有二故倍之亷之縱只一故不倍也如前圖除積不盡則有第三商如此圖雖三商亦只倍亷而不倍縱四商以上倣此詳之用法曰先以積列位如法作㸃從單位起隔位㸃之視㸃在首位獨商之㸃在次位合兩位商之皆命為實次以帶縱數用籌與平方籌並列之各為法視平方籌積數有小于實者用其方數為初商用其積數為方積初商自乘之數也即視縱籌與初商同行之積數用之為縱積初商乘縱之數也如初商一則用縱籌第一行兼方積縱積兩數以減原實而定初商必原實中兼此兩積之數則初商無悮矣故曰定若原實不及減改而商之如前求得兩積以減之為初商定數不及減又改商之及減而止若應商十數因無縱積改商單九是初商空也則于初商之位作而紀其改商之數于下若次商者然初商應是百而改九十應是千而改九百並同定位法曰既得初商視所作原實之㸃共有幾何以定其得數之位以知其有次商與否如一㸃則得數是單而無次商二㸃則得數是十而有次商之類皆如平方法取之次商法曰依前定位知初商未是單數而減積又有未盡是有次商也次商之法倍初商加入縱為亷法用籌除之視亷法籌行内之積數有小于餘實者用為亷積以減餘實用其行數為次商就以次商自乘為隅積以減餘實以定次商必餘實内有亷隅兩積則次商無誤不及减者改商之及減而止皆如平方法商三次以上並同次商命分法曰若得數已是單而有不盡則以法命之法以所商數倍之加入縱為亷又加隅一為命分不盡之數為得分亦有得數非單而餘實少在亷法以下不能商作單一者亦以法命之法即以亷法加隅一為命分列商數法曰依平方法視所作㸃而以最上一㸃為主若初商五以上不論單五或五十或五千或五百並同皆用進法書其其得數于㸃之上兩位則不論縱之多少也若初商四以下亦不論單十百千則以縱之多少而為之進退法以縱折半加入初商單從單十從十百千各以類加若滿五以上者變從進法書于㸃之上兩位如初商四而縱有二初商三而縱有四之類若縱數少雖加之而仍不滿五數者仍用常法書其得數于㸃之上一位如初商四而縱只有一初商三而縱只有二只有二之類總而言之所商單數皆書于亷法之上一位故初商得數有進退之法乃豫為亷法之地以居次商也初商五以上倍之則十雖無縱加亷法已進位矣初商雖四以下而以半縱加之滿五則其倍之加縱而為亷法也亦滿十而進位矣亷法進位故初商必進兩位書也若加半縱仍不滿五則其亷法無進位矣故初商只進一位而書之葢豫算所商單數已在亷法之上也又初商若得單數其亷法即為命分凡商得單數必在命分之上一位以此考之庶無謬誤假如有直田積六十三步但云濶不及長二步列位依平方法作㸃從單位起視㸃在次位合六十三步商之為實次以平方籌與縱二籌平列之各為法視平方籌積有四九小于六三其方七也商作單七用進法書于㸃之上兩位一㸃知所商是單即視帶縱籌第七行積數一四用為縱積併方積四十九縱積一十四共六十三除實盡此亦偶除盡耳設不盡其命分必是十數故前商七之數必進書之以存其位定為濶七步加縱二步得長九步凡得數在五以上用進法書于㸃之上兩位此其例也假如有直田六百三十步但云長多濶二步列位無單位補作圈作㸃視㸃在首位獨商之以六百步為實以平方帶縱二各用籌為法視平方籌積數有四小于六其方二商二十步二㸃故初商十自乘得方積四百步隨視縱籌第二行是四得縱積四十步併兩積共四百四十步以減原實餘一百九十步再商之初商十故有次商也商數二十以縱折半得單一加之共二十一仍不滿五數故只用常法書于㸃之上一位次以初商二十步倍之四十步加縱二步共四十二步為亷法用第四第二兩籌合視兩籌第四行積數一六八小于一九次商四減亷積一百六十八步餘二十二步所減首位不空次商故書本位次以次商四步為隅法自乘得一十六步為隅積用減餘實不盡六步以法命之初商雖不進位所得次商單數已在命分之上一位矣列商數法妙在于此倍所商二十四步為四十八步加縱二步又加隅一步共五十一步為命分命為濶二十四步又五十一分步之六加縱二步得長二十六步又五十一分歩之六凡得數在四以下以半縱加之仍不滿五則只用常法書于㸃之上一位此其例也假如有直田五畝但云長多濶八十八步列位以畝法二百四十通之得一千二百步十步單步空補作兩圈作㸃視㸃在次位合商之以一千二百步為實縱有兩位用兩籌與平方籌並列各為法先視平方籌有九小于一二宜商三十二㸃商十因有縱改商二十其方積四百步縱積一千七百六十步初商十與縱相乘故縱單數皆成十數兼兩積共二千一百六十步大于實不及減所商有誤抹去之改商一十步其方積一百步其縱積八百八十步併兩積共除實九百八十步餘二百二十步再為實以求次商初商十故有次商也縱折半四十四步加初商一十步共五十四步故變用進法次以初商一十步倍之二十步加縱八十八步共一百八步為亷法用第一空位第八三籌合視籌第二行積二一六小于二二次商二步于初商一十步之下減亷積一百一十六餘四步所减首位故進書之初商豫進正為此也次以次商二步自乘得四步為隅積除實盡定為濶一十二步加縱八十八步得長一百步假如有直田一十二畝半但云長多濶七十步列位以畝法二百四十通之得三千步百十單皆作圈作㸃視㸃在次位以三千百步為實以平方帶縱七十各用籌為法先視平方籌積有二五小于三宜商五十因縱改商四十步其方積一千六百步其縱積二千八百步共四千四百步大于實不及减抹去之改商三十步其方積九百步其縱積二千一百步共三千步除實盡縱七十折半三十五加初商三十共六十五是五以上也故用進法書商三于㸃上兩位假有餘實則當再商或命之以分今雖商盡當存其位命分者亷法加隅一也倍初商加縱共一百三十是原實百者亷法之位也進一位乃單位初商不進兩位何以容單數凡開得平方三十步為田濶加縱七十步共一百步為長假如有直田七畝但云長多濶六十步列位以畝法二百四十通之得一千六百八十步單位空作圈作㸃視㸃在次位合商之以一千六百步為實以平方帶縱六十步用籌各為法先視平方籌有一六與實同宜商四十二㸃初商是十因帶縱改商三十步其方積九百步縱積一千八百步共二千七百步大于實不及減抹去之改商二十步其方積四百步縱積一千二百步共減一千六百步餘八十步再商之縱折半三十加初商共五十故進書之假餘實滿命分一百一步即當商一步故初商豫進以居次商今次商雖空當存位故也次以初商二十步倍之四十步加入縱六十步共一百步為亷法亷法大于餘實不及減次商作其餘實以法命之法以亷法加隅一為命分命為濶二十步又一百一分步之八十加縱為長八十步又一百一分步之八十假如有直田四畝但云長多濶九十步列位以畝法通之得九百六十步作㸃視㸃在首位獨商之以九百為實以平方帶縱九十步各用籌為法先視平方籌積有九與實同宜商三十步二㸃故初商十因帶縱改商二十步其方積四百步縱積一千八百步不及減又改商一十歩其方積一百步縱積九百步共一千步仍不及減此有二㸃宜商十步今改商一十仍不及減是初商十位空也縱九十折半四十五加初商十步滿五十以上故商一進書㸃之上兩位改商單九步其方積八十一步縱積八百一十步共八百九十一步以減實餘六十九步不盡此宜商十數者變商單步故初商之位作而以改商之九步書于位下如次商然也蓋必如此書之所商單數乃在命分之上一位也商數已得單步而有不盡以法命之以商九步倍之加縱九十步共一百八步更加隅一步共一百九步為命分命為濶九步又一百九分步之六十九加縱為長九十九步又一百九分步之六十九以上四則乃縱多進位之法也凡得數雖四以下以半縱加之滿五即用進法書于㸃之上兩位此其例也開帶縱立方法籌算五勿菴氏曰泰西家説勾股開方甚詳然未有帶縱之術同文算指取中算補之其論帶縱平方有十一種而于立方帶縱終缺然也程汝思統宗所載又皆兩縱之相同者惟難題堆垜還原有二例祇一可用其一强合而已非立術本意又不附少廣而雜見于均輸雖有善學何從而辨之兹因籌算稍以鄙意完其缺義取曉暢不厭煩複使得其意者可施之他率不窮云爾凡立方帶縱有三一只帶一縱如云長多方若干或髙多方若干是也􅀷即同髙一帶兩縱而縱數相同如云長不及方若干髙不及方若干是也此方多數為縱一帶兩縱而縱數又不相同如云長多濶若干濶又多髙若干是也大約帶一縱者只有縱數而已帶兩縱者有縱亷又有縱方故其術不同帶一縱圖三此長多于方此髙多于方也為横縱横也為直縱直縱之形濶與縱之形長濶髙等如其方相等如其方其厚也如其其髙也如其縱所設縱所設俱立方一縱形一合為長立方形如圖立方形方縱形合者初商也平亷三内帶縱者二長亷三内帶縱者一小隅一此七者次商也平亷所帶之縱長與立方等厚與次商等其髙也則如縱所設長亷所帶之縱兩頭横直等皆如次商其髙也如縱所設用法曰以積列位乃作㸃從單位起隔兩位㸃之㸃畢視積首位有㸃獨商之以首位為初商之實首位無㸃以首位合有㸃之位商之㸃在次位以首兩位為初商之實㸃在第三位以首三位為初商之實皆同立方法先視立方籌積數有小于初商之實者用其方數為初商定位法合計所作㸃共有若干一㸃者商單數二㸃則商十數每一㸃進一位皆如立方用其積數為初商立方積定位法視初商方數若初商單數其積亦盡于單位若初商十數其積乃盡于千位每初商進一位其積進三位亦可以㸃計之皆如立方次以初商自乘以乘縱數為縱積合計立方積縱積共數以減原積而定初商若初商無誤者原實中必兼此兩積命初商為方數加縱數為髙數或長數皆依先所設不及減者改商之及減而止次商法曰依前定位知初商是何等或單十百千等若初商未是單數而減積又有不盡是有次商也法以初商自乘而三之又以縱與初商相乘而兩之共為平亷法又法以初商三之縱倍之併其數與初商相乘得數為平亷法或以初商加縱而倍之併初商數以乘初商為平亷法並同又以初商三之加縱為長亷法乃置餘實列位以平亷法除之得數為次商用籌為法除而得之依除法定其位于是以次商乘平亷法為三平亷積又以次商自乘以乘長亷法為三長亷積就以次商自乘再乘為隅積合計平亷長亷隅積共若干數以減原實原實中兼此併積知次商無誤矣乃併初商次商所得數為方數加縱命為髙數或長數皆如先所設合問不及減者改商之及減而止商三次者以初商次商所得數加縱而倍之併商得數為法仍與商得數相乘為平亷法又以商得數三之加縱為長亷法餘並同次商命分法曰己商至單數而有不盡則以法命之其法以所商得數加縱倍之加所商得數以乘所商得數如平亷又以所商得數三之加縱如長亷併兩數又加單一如隅為命分不盡之數為得分或商數尚未是單而餘實甚少在所用平亷長亷兩法併數之下或僅同其數僅同者無隅積是無可續商也亦以法命之法即以所用平亷長亷兩法併之又加隅一為命分列商數法曰依立方法以初商之實有㸃者為主即原實内最上之一㸃凡初商得數必書于㸃之上一位乃常法也惟初商一數者用常法有以初商得數書于㸃之上兩位者進法也初商二三四五者用進法有以初商得數書于㸃之上三位者超進法也初商六七八九者用超進之法若縱數多亷法有進位則宜用常法者改用進法宜用進法者用超進之法宜超進者更超一位書之其法于次商時酌而定之葢次商時有三平亷法三長亷法再加隅一為命分法于原實尋命分之位為主命分上一位單數位也從此單數逆尋而上自單而十而百而千至初商位止有不合者改而進書之若與初商恰合者不必强改此法甚妙平方帶縱亦可用之若宜商一十而改單九或宜商一百而改九十凡得數退改小一等數者皆不用最上一㸃而以第二㸃論之此尤要訣或于初商位作圈而以所商小一等數書于圈之下即可以上一㸃論也細考其數則同此商數列位立法之妙宜詳翫之假如浚井計立方積七百五十四萬九千八百八十八尺但云深多方八百尺法以立方帶縱為法除之列位作㸃視㸃在首位獨商之以七百萬尺為初商之實以立方籌為法視立方籌積有一小于七商一百尺三㸃故初商百商一百故用常法書于㸃之上一位得立方積一百萬尺三㸃者方積盡百萬之位一初商之方積皆盡于最上之㸃次以初商一百尺自乘一萬尺乘縱八百尺得八百萬尺為縱積併兩積九百萬積大于原實不及減抹去之不用改商如後圖視立方籌第九行積七二九改商九十尺得立方積七十二萬九千尺百改十故亦改用第二㸃第二㸃是十位故方積亦盡於千位次以初商九十尺自乘八千一百尺乘縱八百尺得六百四十八萬尺為縱積併兩積共七百二十萬九千尺以減原實餘三十四萬八百八十八尺再商除之初商一百今改商九十故上一㸃不用用第二㸃論之商九者書于第二㸃之上三位超進法也次用次商又法以縱八百尺加初商九十尺而倍之得一千七百八十尺併初商九十尺共一千八百七十尺用與初商九十尺相乘得一十六萬八千三百尺為平亷法又以初商九十尺三因之得二百七十尺加縱八百尺共得一千七十尺為長亷法乃列餘實以平亷為法除之用第一第六第八第三共四等商九十用超進法書于第二㸃之上三位今以縱多致亷法進為十萬故次商時應更為酌定又超一位書之然後次商單數在亷法上一位矣改如後圖亷法十萬上一位單數位也今商九十不合在此位故改之合視籌第二行積三三六六小于餘實次商二尺于初商九十之下所減首位是法宜進書也初商不改而更超之何以居次商就以次商二尺乘平亷法得三十三萬六千六百尺為平亷積又以次商二尺自乘四尺用乘長亷法得四千二百八十尺為長亷積又以次商二尺自乘再乘得八尺為隅積併三積共三十四萬八百八十八尺除實盡乃以商數命為井方加縱為井深計開井方九十二尺深八百九十二尺此超進法改而更超一位也帶兩縱縱數相同圖二此髙不及方也方之横與直俱多于髙是為兩縱兩縱者縱廉二縱方一并立方而四立方形長濶髙皆相等縱亷形髙與濶相等如其方之數其厚也如所設縱之數縱方形兩頭等皆如縱數其髙也如立方之數兩縱亷輔立方兩面而縱方補其隅合為一短立方形不及之數有在立方旁者觀後圖可互見其意如圖初商有立方有縱廉二縱方一共四形今只圖其二餘為平廉所掩意㑹之可也此横頭不及方也即前圖之眠體次商平廉三内帶一縱者二帶兩縱者一長廉三内帶縱者二小隅一共七平廉帶一縱者濶如初商加縱為長厚如次商其帶兩縱者髙濶皆等皆如初商加縱之數厚如次啇長廉帶縱者長如初商加縱之數其兩頭横直皆等皆如次商無縱長廉長如初商兩頭横直等如次商小隅横直髙皆等皆如次商用法曰先以縱倍之為縱廉兩縱併也以縱自乘為縱方兩縱相乘此因兩縱數同故其法如此也若兩縱不同徑用乘法併法矣乃如法列位作㸃求初商之實以立方籌為法求得初商方數及初商立方積皆如立方法皆依定位法命之次以初商乘縱方得數為縱方積又以初商自乘數乘縱亷得數為縱亷積合計縱方縱亷立方之積共若干數以減原實而定初商皆如一縱法命初商為髙數或深數皆如所設加縱為方數不及減改商之若初商未是單數則以餘實求次商次商法曰以初商加縱倍之以乘初商髙數得數又以初商加縱自乘得數併之共為平亷法又法初商三之加縱以初商加縱乘之得數為平亷法亦同次以初商加縱倍之併初商數共為長亷法又法初商三之縱倍之併為長亷法亦同乃置餘實列位以亷法位酌定初商列法而進退之以平亷為法而除餘實得數為次商皆以所減首位是與否而為之進若退又法合平亷長亷兩法以求次商于是以次商乘平亷法為平亷積又以次商自乘數乘長亷法為長亷積又以次商自乘再乘為隅積合計平亷長亷隅積共若干數以減餘實而定初商皆如一縱法又法以次商乘長亷法為長亷法又以次商自乘為隅法併平亷長亷隅法以與次商相乘為次商亷隅共積以減餘實亦同乃命所商數為髙或深之類如所設加縱數命為方合問不盡者以方倍之乘髙又以方自乘如平亷又以方倍之併髙如長亷又加單一如隅為命分假如有方臺積五百八十六萬六千一百八十一尺但云髙不及方一百四十尺以帶兩縱立方為法除之方者長濶等每面各多髙一百四十尺先以縱一百四十尺倍之得二百八十尺為縱積又縱自乘之得一萬九千六百尺為縱方列位加㸃視㸃在首位獨商之以五百萬尺為初商之實視立方積有一小于五商一百尺三㸃故商百尺得立方積一百萬尺商一數宜用常法書于㸃之上一位今因縱多致亷法昇為十萬法上一位為單單上一位為十今初商是百尺故改用進法書之亷法之昇見後就以初商一百尺乘縱方得一百九十六萬尺為縱方積又以初商一百自乘一萬乘縱亷得二百八十萬尺為縱亷積合計立方縱方縱亷積共五百七十六萬尺以減原實餘一十萬六千一百八十一尺初商百尺宜有續商初商一百尺髙也加縱共二百四十尺方也次以方倍之四百八十尺用乘髙數得四萬八千尺又以方自乘之得五萬七千六百尺併之得一十萬五千六百尺為平亷法又以方倍之併髙得五百八十尺為長亷法乃列餘實以亷法酌定初商改進一位書之以平亷法用籌除餘實視籌第一行一五六小于餘實次商一尺于初商一百尺之隔位所減是一五六首位宜進書然猶與初商隔位故知為單一尺就以次商一尺乘平亷法如故又以次商一尺自乘以乘長亷法亦如故就命為平亷長亷積又以次商自乘再乘仍得一尺如故合計三積共一十萬六千一百八十一尺除實盡乃以所商數命為臺髙加縱為方計開臺髙一百一尺方二百四十一尺此常法改用進法也假如有方池積五十萬丈但云深不及方五十尺先以縱五十尺倍之一百為縱亷又縱自乘之得二千五百尺為縱方列位加㸃視㸃在第三位合商之以五十萬尺為初商之實視立方籌有三四三小于五宜商七十尺二㸃商十尺因縱改商六十尺得立方積二十一萬六千尺次以初商六十尺自乘三千六百尺用乘縱亷一百尺得三十六萬尺已大于實不及減不必求縱方積矣改商五十尺用籌求得立方積一十二萬五千尺就以初商五十尺乘縱方得縱方積亦一十二萬五千尺又以初商五十尺自乘二千五百尺用乘縱亷得縱亷積二十五萬尺併三積共五十萬尺除實盡以商數命為池深加縱為方計開池深五十尺方一百尺此進法改為超進也假有次商則其平亷法二萬尺矣假有命分則其命分二萬二百五十一矣亦有髙與長同而濶不及數者準此求之但以初商命為濶而加縱為髙與長帶兩縱縱數不相同圖二此長多于濶而髙又多于長也是為兩縱而又不相同凡為大縱亷小縱亷各一縱方一并立方形而四立方形長濶髙相等大縱亷横直等如其方而髙如大縱小縱亷髙濶等如其方而厚如小縱縱方形之兩頭髙如大縱厚如小縱其長也則如立方大縱小縱以輔立方之兩面而縱方補其闕合為一長立方形如圖初商有立方有大縱廉小縱廉縱方各一共四只圖其二餘為平廉所掩也次商平廉三内帶小縱者一帶大縱者一在初商大縱立方之背面帶兩縱者一長廉三内帶小縱者一帶大縱者一小隅一共七帶小縱平亷濶如初商長如初商加小縱之數髙如次商帶大縱平亷濶如初商髙如初商加大縱之數厚如次商帶兩縱平亷濶如初商加小縱之數髙如初商加大縱之數厚如次商帶小縱長亷長如初商加小縱之數帶大縱長亷髙如初商加大縱之數無縱長亷長如初商數其兩頭横直皆如次商之數小隅横直髙皆如次商之數用法曰以兩縱相併為縱亷以兩縱相乘為縱方列位作㸃求初商之實以立方籌求得初商立方積以初商求得縱方縱亷兩積皆如前法乃以初商命為濶各加縱命為長為髙求次商者以初商長濶髙維乘得數而併之為平亷法又以初商長濶髙併之為長亷法乃置餘實列位以平亷酌定初商之位以平亷為法求次商及平亷積長亷積隅積以減餘實乃命所商為濶各以縱加之為髙為長如所設皆如前法不盡者以所商長濶髙維乘併之如平亷又以長濶髙併之如長亷又加單一如隅為命分假如有長立方形積九十尺但云髙多濶三尺長多濶二尺先以兩縱相併五尺為縱亷以兩縱相乘六尺為縱方列位作㸃視㸃在第二位合商之以九十尺為初商之實乃視立方籌有六四小于九宜商四八因有縱改商三尺得二十七尺為立方積原實只一㸃故初商是單商三故書于㸃之上兩位用進法也次以初商三尺自乘九尺乘縱亷得四十五尺為縱亷積又以初商三尺乘縱方得一十八尺為縱方積併三積共九十尺除實盡乃以初商命為濶各加縱為髙為長計開濶三尺長五尺髙六尺假如有立方積一千六百二十尺但云長多濶六尺髙多濶三尺先以兩縱相併九尺為縱亷以兩縱相乘一十八尺為縱方列位作㸃視㸃在首位獨商之以一千尺為初商之實乃視立方籌有一與實同商一十尺二㸃商十得立方積一千尺次以初商一十尺自乘一百尺乘縱亷得九百尺為縱亷積又以初商一十尺乘縱方得一百八十尺為縱方積合計之共二千八十尺大于實不及減商一十故用常法書于㸃之上一位改商九尺得七百二十九尺為立方積十變為單則上一㸃不用用第二㸃故商九書于第二㸃之上兩位用超進法也次以初商九尺自乘八十一乘縱亷亦得七百二十九尺為縱亷積次以初商九尺乘縱方得一百六十二尺為縱方積併三積共一千六百二十尺除實盡乃以商數命為濶各加縱為長為髙計開濶九尺長一十五尺髙一十二尺假如有長立方積六萬四千尺但云長多濶五尺髙又多長一尺先以長多五尺髙多六尺併之得十十為縱亷又以五尺六尺相乘三十為縱方解曰長多濶五尺髙又多長一尺是髙多濶六尺也列位作㸃視㸃在第二位合商之以六萬四千尺為初商之實視立方籌有六四與實同宜商四十尺因有縱改商三十尺二㸃故商十尺得二萬七千尺為立方積商三十故書于㸃之上兩位用進法也次以初商三十尺自乘九百尺乘縱亷得九千九百尺為縱亷積次以初商三十尺乘縱方得九百尺為縱方積併三積共三萬七千八百尺以減原實餘二萬六千二百尺再商之初商十宜有次商初商三十尺濶也加縱五尺共三十五尺長也又加一尺共三十六尺髙也乃以初商長濶髙維乘之濶乘長得一千五十尺髙乘濶得一千八十尺長乘高得一千二百六十尺併三維乘數共三千三百九十尺為平亷法又法併長與髙乘濶又以髙乘長併之亦同次以初商長濶髙併之共一百一尺為長亷法又法初商三之加兩縱亦同乃以平亷用籌為法以餘實列位除之如後圖合視籌第六行是二三四小于餘實次商六尺所減首位不空故書本位得二萬三百四十尺為平亷積次商乘平亷法也次以次商六尺自乘三十六尺乘長亷法得三千六百三十六尺為長亷積又以次商六尺自乘再乘得二百一十六尺為隅積併三積共二萬四千一百九十二尺以減餘實餘二千八不盡以法命之法以初商濶髙長各加次商為濶髙長而維乘之濶乘長得一千四百七十六尺髙乘濶得一千五百一十二尺長乘髙得一千七百二十二尺併得四千七百一十尺如平亷又併濶髙長得一百一十九尺如長亷又加一尺如隅共得四千八百三十尺為命分不盡之數為得分命為四千八百三十分尺之二千八即竒數也計開濶三十六尺有竒音基長四十一尺有竒髙四十二尺有竒假如有長立方形積一十萬一千尺但云長多濶五尺髙多濶六尺先以兩縱併得一十一尺為縱亷以兩縱乘得三十尺為縱方列位作㸃視㸃在第三位合三位商之以一十萬一千為初商之實乃視立方籌有六四小于一一商四十尺二㸃商十得六萬四千尺為立方積商四十故書于㸃之上兩位進法也次以初商自乘一千六百尺乘縱亷得一萬七千六百尺為縱亷積次以初商乘縱方得一千二百尺為縱方積併三積共八萬二千八百尺以減原實餘一萬八千二百尺再商之初商四十尺濶也加縱五尺得四十五尺長也加縱六尺得四十六尺髙也乃以初商濶長髙而維乘之長乘濶得一千八百尺濶乘髙得一千八百四十尺又法併髙與長九十一尺以濶四十尺乘之共三千六百四十尺省兩維乘其數亦同髙乘長得二千七十尺併維乘數共五千七百一十尺為平亷法又以濶長髙併之共一百三十一尺為長亷法乃列餘實以平亷用籌為法除之合視籌第三行是一七一三小于餘實次商三尺所減首位不空故本位書之就以次商三尺乘平亷法得一萬七千一百三十尺為平亷積又以次商三尺自乘九尺乘長亷法得一千一百七十九尺為長亷積又以次商三尺自乘再乘得二十七尺為隅積併之得一萬八千三百三十六尺大于餘實不及減改商二尺就以次商二尺乘平亷法得一萬一千四百二十尺為平亷積即用籌第二行取之次以次商自乘四尺乘長亷法得五百二十四尺為長亷積又以次商自乘再乘得八尺為隅積併之共一萬一千九百五十二尺以減餘實仍餘六千二百四十八不盡以法命之法以濶長髙各加次商二尺為濶長髙而維乘之併髙四十八尺長四十七尺共九十五尺以濶四十二尺乘之得三千九百九十尺代兩維乘又以長乘髙得二千二百五十六尺併得六千二百四十六尺又以長濶髙併之得一百三十七尺又加一尺共六千三百八十四為命分命為六千三百八十四之六千二百四十八即竒數計開濶四十二尺有竒長四十七尺有竒髙四十八尺有竒厯算全書卷三十二
