body:
  text: 厯算全書卷十九宣城梅文鼎撰揆日候星紀要求日影法謹按測日之法要先知太陽緯度其次要知里差其次要知句股算法其次又要知割圓八線太陽緯度有半年在赤道南有半年在赤道北此以節氣定之假如冬至日太陽在赤道南二十三度半為緯度之極南其影極長自此以後太陽漸漸自南而北其南邊緯度漸減則影之長者亦漸減至春分日太陽行到赤道上即無緯度既過春分太陽行過赤道之北於是漸生北緯緯既漸北其影漸短至夏至之日而影短極矣夏至日太陽在赤道北二十三度半為緯度之極北其影極短自此以後太陽漸漸自北而南則北邊緯度漸減而影之短者復漸長至秋分日太陽行到赤道上亦無緯度既過秋分太陽行過赤道之南於是漸生南緯緯既漸南影亦漸増至於冬至之度而復為影長之極矣長極則短短極則長總由太陽南北緯度之所生其緯日日不同故影之長短亦日日不同也凡㸔表上層節氣順數而下自初日至十五日止下層節氣逆數而上亦自初日至十五日止或論日或論度㣲有不同然所差不逺查表法第一表是太陽在赤道南所紀度分是南緯日日不同之數管冬至小寒大寒立春雨水驚蟄其日期自上而下順推又管秋分寒露霜降立冬小雪大雪其日期自下而上逆推凡順推日期者看右行順下之數逆推日期者看左行逆上之數第二表是太陽在赤道北所紀度分是北緯日日不同之數管春分清明穀雨立夏小滿芒種日期順推看右行又管夏至小暑大暑立秋處暑白露日期逆推看左行凡查緯度看本日是何節氣則知太陽在赤道南或在其北又看是節氣之第幾日依表順逆查之即知太陽在赤道南北相離幾何度分假如辛未年四月初一日是在穀雨節内檢表便知在赤道北又查交過穀雨已有八日便於穀雨節之下從上順數而下對右行八字之格内係第九格尋其緯度是十四度十三分便是此日太陽距赤道北緯之數也又法不用算日期只於本年七政厯尋本日太陽所到宫度加三十分即是假如四月初一日七政厯内太陽是酉宫七度三十六分此是夜半子時度數加三十分得八度六分便是本日午正太陽躔度也以午正太陽入酉宫八度六分從本表中穀雨節一行内從上順數而下到横對右行順下第八號之格是十四度一十三分便是此日此時太陽離赤道北之緯度也以上論太陽緯度既知緯度則日影長短之縁已得之矣然又要知里差何也緯度不同是天上事乃萬國九州所同然而人所居有南北故所見太陽之髙下各異則其影亦異前所論緯度髙下是毎日不同今論里差則雖同此一日而北方日影與南方不同若不知此則誤矣里差南北論本地北極出地即如四月初一日午正推得太陽在地平上髙六十四度此據京師地勢言之若在别省則其度不同何也北極之出地不同也後圖明之右圖舉浙江為例其他處各各不同可以類推北極出地度開後京師四十度山東三十七度陜西三十六度盛京四十二度山西三十八度河南三十五度江南三十二度浙江三十度福建二十六度湖廣三十一度江西四川俱廿九度廣西二十五度貴州二十四度廣東二十三度雲南二十二度求赤道髙法各以其地北極出地度減九十度餘為赤道髙度觀前圖自明以上論里差既知太陽緯度又知本地里差則任舉一日可知太陽午正之髙度而測影不難矣然又要知句股算法及割圓八線凡測影有二法一是用直表而取平地之影又名直影一是用横表而取壁上之影又名倒影此兩者皆是句股形直表取影是一个正句股形古人用八尺表取影只用直表直影故前所論者亦直影也凡此句股之法生於割圎八線何以謂之割圓周天三百六十度今取其若干度而算之是將渾淪圓形剖開算之故曰割圓也割圓有八種線俱是算句股之法今取日影則所用者切線也切線有正有餘此因直表取影故所用者又是餘切線也凡測影者先以緯度及里差得太陽髙度即用所得髙度入八線中查本度之餘切即得所求直影假如前推四月初一日太陽髙六十四度一十四分即於八線表中尋六十四度十四分之餘切線便是所得直影八線表在厯書中其查法毎度六十分自四十五度以前自上而下四十五度以後至九十度自下而上其順下逆上俱自一分起至六十分止俱要看表旁之分號對而取之甲乙為半徑為股以當表丙乙為餘切線為句以當影甲丙為日光斜弦太陽在已光射於表端之甲直至於丙成甲乙丙句股形其己庚髙度與戊丁相對之度等用戊丁即如用己庚也以戊丁為主則丁乙為餘度而丙乙者即戊丁髙度之餘切線也查八線表法先查某度再查某線再查某分以横直相遇處取之其度數有寫在髙處者自度起至四十四度止有寫在下面者自四十五度起至九十度止其八線之號有寫在上一層者有寫在下一層者其分數有自上而下者有自下而上者此無他故也只看度數寫在髙處者其八線之號如正切等亦即寫在上一層而其分數亦自上而下也若度數寫在下面者其八線之號亦即寫在下一層而其分數亦自下而上也凡一度俱有兩張一張自分至三十分一張自三十分至六十分假如前推太陽髙六十四度便知此度數寫在下靣即於表中尋下面左角上寫有六四字樣者此則六十四度之表也度既寫在下便從下一層横看八線之號至餘切字樣處認定此即六十四度餘切之行也又因度下有一十四分便向表中原寫六四字樣處接了便是分自此逆上一分二分以至十四分止是所用之横格也依此十四分之號横看至餘切之行其中所書便是六十四度十四分之餘切線數矣他倣此若依前加太陽十五分便尋三十分之號如法求之又式康熈辛未七月初四日丁亥測正午時日影京師立表前月二十八日壬午夘時交大暑節本日子正太陽度鬼宿三度七分為六宫四度三十三分午正太陽度鬼宿三度三十六分為六宫五度二分黄緯十九度五分在北京師赤道髙五十度午正太陽髙度六十九度五分餘切線三八三八六立八尺表正午日影該三尺七分凡立表須正取影之地須平又須正對子午又按此直表也故當以太陽半徑加髙度而取直影用餘切若横表即當以太陽半徑減髙度而取倒影用正切此測影中最精之理不可不知皖城北極髙三十一度赤道髙五十九度立表八尺冬至日在赤道外二十三度三十一分半午正太陽髙三十五度二十八分半餘切線一四六五直影宜加太陽半徑十五分竒共髙三十五度四十四分其餘切線一三八九九四以表數八尺乘餘切線得影長一丈一尺一寸二分若求倒影宜減太陽半徑十五分竒得髙三十五度一十三分四省表影立成四省表影立成者為友人馬德稱氏作也徳稱系本西域逺祖瑪沙伊克瑪哈齊兩編修公以善治厯見知洪武朝受敕譯西書其文御製稱為不朽之智人欽天監特寘專科肄習子孫世其官皆精其業西域之言厯者宗焉西域之厯有二一曰動的月以弦望晦朔為序乃太陰厯也故齋期以見月為滿一曰不動的月以二十四定氣為端乃太陽厯也故禮拜以晷景為憑然此二者皆有里差而今回回家所傳二十四節氣表景尺度共祗一術故徳稱氏疑焉謂其不足以盡諸省直之用而欲有以是正之以屬余余既稔知西域之以天為教以厯為學經數百年能守其舊俗不變可謂有恒而徳稱氏又能不牽於習見踵事加詳以致其恪恭鄭重之意深為可敬遂力疾為之布算以歸之夫厯學至今日明且確矣而泰西氏之法大綱多出於回回竊意如各省直里差之説必西域所自有或當時存而未譯或譯之而未傳或傳之久而殘缺皆未可知吾願德稱氏與其西域之耆舊尚為之詳徵焉而出以告世庶有以證吾之説而釋夫傳者之疑以正其疎也四省直節氣定日表影考定立表十尺若表短則用折算假如用表一尺則以尺為寸寸為分分為釐皆折取十分之一若表八尺則尺取八寸為十之八右表影皆以直省城内為準附近二百里内外可用其餘州縣各各不同須以彼處北極髙度定之一凡立表須直不得稍偏於東西南北則影為之變須以線垂而準之古所謂八綫附臬者是也一植表取影之地須極平如砥若㣲有髙下陂陀坑坎􅉾垤則影不應矣當以水準之一量表量影之尺度須極勻極細一取正午之影須在正南然天上正南非羅針所指之正南也須於羅針正午之西稍偏取之或曰丙午之間縫針與臬影合亦非也蓋針所指在在不同如金陵則偏三度此非正方案則不能定或以厯書法用北極附近星取之以上四事皆求表影者所當知此外又有節氣加時在午前午後之不同則影亦為之加減假如冬至影極長而冬至不在正午或午前或午後則其午影必㣲差而短又如夏至影極短而夏至不在正午或午前或午後則其午影必微長又如小寒至芒種十一氣影自長而短若其加時在午前則午影必㣲短加時在午後則午影必微長又如小暑至大雪十一氣影自短而長若其加時在午前則午影必㣲長加時在午後則午影必㣲短按以上加減只在分釐若所用徑尺之表初無損益可無深論也惟春秋分及前後兩節晷差頗速若其加時又在亥子之間則距午甚逺為差益大不可不知午正太陽髙九十度已至天頂則日中無影其過此者皆在天頂之北而生南影法當以所帶零度轉減九十度而用其餘命為太陽在天頂北之髙度北極出地二十度則赤道在天頂南二十度而夏至日躔在赤道北二十三度半故其日午時已過天頂北三度而影在表南芒種日午正亦過天頂北二度竒影亦在南凡午影芒種必髙於小滿夏至又髙於芒種今皆反之亦此故也自北極髙二十三度以前倣此論之宜邑謝野臣至中州尋古測景之臺所立石表尚存其形似墖上小下大夏至日中無影蓋其根盤半徑即日景所到如句髙尖距地之數為表如股亦表八尺土圭尺有五寸之比例也以此推之則向南州邑並可作夏至無影之石表論恒星中星定時中星之法肇於堯典羲和分職測日之後繼以中星蓋中星所以覘四時騐寒暑定昏旦考節氣察日度辨里差其用甚鉅故與測日均為治厯之大端也第星之麗天左旋之勢則依赤道自行之度則向黃道因此星之經緯度自二道望之叅差不齊法以黄赤二道之極為宗出弧線過星體用弧三角法可推各星之經緯度在古厯未覺有恒星之行中法謂之歳差不言星行西用大儀累年密測知恒星亦依黄道毎嵗東行五十一秒其距黄道有定度若赤道因黄道斜絡之勢度分多變動不居因普測周天有名位之星算其二道之經緯度列表今推中星祗用赤道度以時刻憑赤道為主故也法以星赤道度與本日太陽赤道度相離之數變時得星昏旦中之時刻取用星座除二十八舎外止用三等以上之星餘光體茫昧者可勿論也推中星求時法先查本年七政厯太陽宫度分至儀象志八卷内變為赤道度分次查所出之星在十二三卷内係若干度分將星之度分減去太陽所變之度分如不足減數加三百六十度減之所餘之度分移至儀象志第五卷之變時表内變為時刻分從未初起算至所得時刻即所求之時也推時求中星法先查本年七政厯太陽宫度分至第八卷儀象志内變為赤道度分次查所出之時刻從未初起算得幾時刻移至第五卷變時表内變為赤道經度分時之度分加於太陽之度分若滿過三百六十度則去之所餘之度分至十二三卷内比例相近度分之大星宿即所求之星宿也星宿之度分不及則偏西有餘則偏東諸名星赤道經緯度加減表二十八宿距星黄赤二道經緯度二十八宿距星赤道經緯度自春分起算壬子年度二十八宿距星黄道經緯度壬子年度二十八宿黄道積度康熈戊辰年各宿距星所入各宫度分黄道經度以上戊辰年經度視儀象志又各加一十四分惟斗牛二宿加十五分紀星數大西儒測算凡可見可狀之星一千二十二若㣲小者或不常見者或朦黒者不與焉其大小分為六等又因其難以識認盡假取人物之像以别其名星非真有象也但人借名之耳毎合數星以成一像凡四十八像其多寡大小不等在黄道北者二十一像第一曰小熊内有七星外有一星二曰大熊内二十七外八三曰龍凡三十一星四曰黄帝内十一外二五曰守熊人内二十二外一六曰北冕旒凡八星七曰熊人内二十九外一八曰琵琶凡十星九曰鴈鵞内二十二外一其十曰岳母凡十三星十一曰大將内二十六外三十二曰御車凡十四星十三曰醫生又曰逐蛇一醫常取蛇合藥以救世其星如人逐蛇狀内二十四外五十四曰毒蛇凡十八星十五曰箭凡五星十六曰日鳥性喜視日内九外六十七曰魚將軍性好人聞人歌樂即來聽呼其名漸來就人溺水則載之岸邊人取魚彼即領衆魚至呼之彼先躍過􅃠衆魚則罹網矣凡十星十八曰駒凡四星十九曰飛馬凡二十星二十曰公主凡二十四星二十一曰三角形凡四星共在北者三百六十星一等三二等十八三等八十四四等一百七十四五等五十八六等十三昏者十在黄道中者按節氣十二象即十二宫一曰白羊即春分清明内十三外五二曰金牛即穀雨立夏内三十三外十一三曰雙兄即小滿芒種内十八外七四曰巨蟹即夏至小暑内九外四五曰獅子即大暑立秋内二十七外八六曰室女即處暑白露内二十六外六七曰天秤即秋分寒露内八外九八曰天蝎即霜降立冬内十一外三九曰人馬即小雪大雪凡三十一星十曰磨羯羊頭魚尾即冬至小寒凡二十八星十一曰寳瓶即大寒立春内四十二外三十二曰雙魚即雨水驚蟄内三十四外四共在中者三百四十六星一等五二等九三等六十四四等一百三十四五等一百六六等二十九昏者三在黃道南者十五像一曰海獸凡二十二星二曰獵戶凡三十八星三曰天河凡三十四星四曰天兔凡十二星五曰大犬内十八外十一六曰小犬凡二星七曰船凡四十五星八曰水蛇内二十五外二九曰酒缾凡七星十曰烏雅凡七星十一曰半人牛凡三十七星十二曰豺狼凡十九星十三曰大臺凡七星十四曰南冕凡十三星十五曰南魚内十二外六共在南者三百十六星一等七二等十八三等六十四等一百六十八五等五十三六等九昏者一三方共一千二十二星分其大小一等共十五二等共四十五三等共二百八四等共四百七十四五等共二百十七六等共四十九昏者共十四新増一十二像係近南極之星火鳥十水委三蛇首蛇腹蛇尾十五小斗七飛魚七南船五海山六十字架四馬尾三馬腹三蜜蜂四三角形三海石五金魚四夾白二附白一異雀十孔雀十波斯十一鳥喙六鶴十二共一百三十四星據西書言彼地天文家原載可見之星分為四十八像後自𢎞治十年丁巳有精於天文呉黙哥者行至極南見有無名多星復有西士安徳肋者亦見諸星之旁尚有白氣二塊如天漢者嗣於萬厯十八年庚寅有西士胡本篤始測定南極各星經緯度數新増一十二像至萬厯四十八年庚申湯羅兩公航海過赤道南三月有竒見南極已髙三十餘度將前星一一對測經緯皆符但據云一十二像今又有二十一名何耶地谷測定經緯之星數厯法西傳曰地谷著書第四卷取六星之距度以經度相併適合週天之全度求角宿經緯度以起周天之度再求近赤道十二星經緯度証星之黄道緯度今古不同求星之經度并解其時八百餘星之真經緯度五十三年前復加百餘星赤道經緯度説按地谷實測過者只有八百星則其餘非地谷測也新法厯書星數厯引曰恒星為數甚多莫能窮盡其間有光渺體㣲非目可及非儀可推者則略而不録其在等第之内已經新法所測定者南北兩極共得一千七百二十五星又曰星以大小分為六等第一等大星如五帝座織女類者一十七次二等如帝星開陽類者五十七次三等如太子少衞類者一百八十五次四等如上將柱史類者三百八十九次五等如上相虎賁類者三百二十三次六等如天皇大帝后宫類者二百九十五是皆有名之星共為一千二百六十六餘則皆為無名之星矣西又分為六十二像各命之以名以期便於識别又曰西古厯亦有二十八舎義與中古相侔其所定二十八距星亦皆脗合第觜宿距星西用天闗耳此二十八宿者各以一字命名分註毎日之下内以房虚星昴為屬太陽之日心尾畢張為屬太陰之日是外五緯各屬四宿毎以七日為期毎日各屬一宿西厯亦然義理皆符西經相傳上古有大師名諾厄者所通于天下萬國云按天經或問恒星多寡條與此同但總數作一千一百六十六則總撒符矣湯道未刪定厯引數同但總數百字上缺畫不明今查經緯表三等星有二百七除海石等七星仍有二百則云八十五者非矣恒星厯指曰自古掌天星者大都以可見可測之星求其形似聨合而為象命之名以為識别是有三垣二十八宿三百座一千四百六十一有名之星世所傳巫咸石申甘德之書是也西厯依黄道分十二宫其南北又三十七像亦以能見能測之星聨合成之共得一千七百二十五其第一等大星一十七次二等五十七次三等一百八十五次四等三百八十九次五等三百二十三次六等二百九十五蓋有名者一千二百六十六按此星數與厯引同惟三等星多一百然以總數合之此為是星屏赤道南北兩總星圖説曰舊傳三垣二十八宿共三百座一千四百六十一有名之星如世傳巫咸丹元子之書之類然細測有在疑似者今則非實測不圖舊圖未載而測有經緯亦増入焉南極旁星向來無象無名因以原名翻譯共得星一千八百一十二第一等一十六第二等六十七第三等二百一十六第四等五百二十二第五等四百一十九第六等七十二按此星數細數少五百總數多五百恒星經緯表舊本一等星十七二等六十八三等二百九四等五百一十二五等三百四十六等二百一十六共一千三百六十二外有傅説積尸氣等不入等之星共七然今刻表又有不同天學㑹通星數論各星大小一等十五星二等四十五星三等二百八十星四等四百七十四星五等二百一十六星六等五十星共一千二十九星按此數合總該一千八十總撒不符必有誤也薛書若此類頗多查表一等大星畢參二五車狼老人星軒轅五帝座角大角心南門織女北落師門共十五與此合其水委不在此内又查表三等并新増海石等共二百七則十字衍可知又查表二等星五十又新増海石等十七共六十七與此及厯引厯指俱不同天文實用星數恒星總像例條曰中厯分垣分宿計二百八十座見界諸星盡矣西國於此見界諸星約以四十八像别如近南極諸星都爲六十像騐時依像推效各異古厯家詳察星之形星之性與某物合因以毎物像之白羊宫起降婁二十八度止大梁一十八度金牛宫起大梁一十九度止實沈二十五度雙兄宫起實沈二十六度止鶉首二十四度巨蟹宫起鶉首二十四度止鶉火一十二度獅子宫起鶉火一十三度止鶉尾一十六度室女宫起鶉尾一十六度止大火六度天秤宫起大火六度止大火二十六度天蝎宫起大火二十七度止析木二十五度人馬宫起析木二十六度止星紀二十八度磨羯宫起星紀二十八度止𤣥枵二十二度寳瓶宫起𤣥枵二十三度止娵訾一十五度雙魚宫起娵訾一十五度止降婁二十七度漢志星數漢書天文志曰凡天文在圖籍昭昭可知者經星常宿中外官凡百一十八名積數七百八十三晉志星數晉書天文志曰馬績云天文在圖籍昭昭可知者經星常宿中外官凡一百一十八名積數七百八十三皆有州國官宫物類之象張衡云文曜麗乎天其動者有七日月五星是也日者陽精之宗月者隂精之宗五星五行之精衆星列布體生於地精成於天列居錯峙各有攸屬在野象物在朝象官在人象神其以神差有五列焉是為三十五名一居中央謂之北斗四布於方各七為二十八舍日月運行厯示吉凶五緯躔次用告禍福中外之官常明者百有二十四可名者三百二十為星二千五百微星之數蓋萬有一千五百二十庶物蠢蠢咸得係命不然何得總而理諸後武帝時太史令陳卓總甘石巫咸三家所著星圖大凡二百八十三官一千四百六十四星以為定紀隋志星數隋天文志又列目曰經星中官乃另起敘星自北極五星起北斗輔星三公止又另起自文昌六星起至少微長垣止太㣲天市二垣俱雜敘其中是為天文上卷次卷天文中列目曰二十八舍乃另起敘星自東方角二星起又北方南斗六星西方奎十六星南方東井八星各另起而於後低三字總結之曰右四方二十八宿并輔官一百八十二星又列目曰星官在列宿之外者乃另起敘星自庫樓十星起青丘土司空軍門止仍低三字總結之曰自攝提至此大凡二百五十四官一千二百八十三星并二十八宿輔官名曰經星常宿逺近有度大小有差茍或失常實表災異隋天文志曰後漢張衡為太史令鑄渾天儀總序經星謂之靈憲其大畧曰中外之官常明者百有二十可名者三百二十為星二千五百微星之數萬有一千五百二十庶物蠢動咸得係命而衡所鑄之圖遭亂湮滅星官名數今亦不存三國時呉太史令陳卓始列甘氏石氏巫咸三家星官著於圖録并注占贊總有二百五十四官一千二百八十三星并二十八宿及輔官附坐一百八十二星總二百八十三官一千五百六十五星宋元嘉中太史令錢樂之所鑄渾天銅儀以朱黒白三色用殊三家而合陳卓之數髙祖平陳得善天官者周墳并宋氏渾儀之器乃命庾季才等叅挍周齊梁陳及祖暅孫僧化官私舊圖刋其大小正彼踈密依準三家星位以為蓋圖以墳為太史令自此太史觀生始能識天官客星説附厯法西傳曰地谷書第五卷解其時新見大客星計十二章一詳初起及漸大至與金星等并漸減二取某宫星以定其經緯度三解測新星所用諸器四取新星與他星距度五解其更度幾何六用各法以求新星經緯度七求新星赤道經緯度八証新星不麗空際而麗列宿天九攷新星之大小十取新星之似徑得三分三十秒十一証新星大倍於日大於地三百六十倍十二攷衆星參差彗星解附厯法西傳又載地谷彗星十卷測彗星之髙度尾之長短光之隱顯及其方向攷十二星在黄道上度以求彗星之眞所在設彗星離兩星之度求黄赤道經緯度求彗星毎日赤道經緯度求彗星所行之道及其道交黄赤之角處依毎日彗星行黃赤二道作立成表証彗星在月上較月更逺於地為三百地半徑故知彗星在日月二天之中証其尾恒向日與金星作彗星行度圖徴彗星之大爲月二之一尾長為九十六地半徑因攷前人彗星之論當否極星攷隋書紐星去不動處一度餘隋天文志曰北極五星皆在紫宫中北極辰也其紐星天之樞也天運無窮三光迭耀而極星不移故曰居其所而衆星共之賈逵張衡蔡邕王蕃陸績皆以北極紐星為樞是不動處也祖暅以儀準候不動處在紐星之末猶一度有餘宋時極星去不動處三度餘宋時天文志載沈括於熙寧七年七月上渾儀浮漏景表三議其渾儀議内一則云前世皆以極星為天中自祖衡以璣衡窺攷天極不動處乃相極星之末猶一度有餘今銅儀天樞内徑一度有半乃謬以衡端之度為率若璣衡端平則極星常游天樞之外璣衡小偏則極星乍出乍入令瓚舊法天樞乃徑二度有半葢欲使極星遊於樞中也臣攷騐極星更三月而後知天中不動處逺極星乃三度有餘則祖恒窺攷猶未為審今當為天樞徑七度使人目切南樞望之星正循北極樞裏周常見不隱天體方正按祖衡祖恒並誤當作祖暅乃冲之子按古法自渾儀之南窺渾儀之北皆用衡管則必過心所得之度數亦真惟此候極之樞似有未確何以言之南樞既亦徑七度則人目可中可邊致有遊移若南樞窄小令目常在樞心則目光射星不過儀心而悉成斜望矣且以圓理徵之人目窺處即圓心為起度之根而北極之度變七度為三度有半矣故不如元候極儀之確元候極儀亦徑七度然設於簡儀是從心窺周其度真確又嘗疑西術言極星亦東行而祖暅時離不動處一度沈括時遽離三度竒可謂速矣而至郭太史時仍三度竒何以又遲今以其儀器攷之則宋時離不動處正在二度左右耳祖氏所用儀器恐亦是自南周用目以窺北周則雖云離一度有餘若其真度恐未及一度宋史志極度條又言北極為天之正中而自唐以來厯家以儀象攷測則中國南北極之正實去極星之北一度有半此蓋中原地勢之度數也中興更造渾儀而太史令丁師仁乃言臨安府地勢向南於北極髙下當量行移易局官吕璨言渾天無量行移易之制若用於臨安與天參合移之他往必有差忒遂罷議後十餘年邵諤鑄儀果用臨安北極髙下為之以清臺儀挍之實去極星四度有竒也又敘中外官星言北極五星在紫㣲宫中北辰最尊者也其紐星為天樞天樞在天心四方去極各九十一度賈逵張衡蔡邕王蕃陸績皆以北極紐星之樞是不動處在紐星末猶一度有餘今清臺則去極四度半按此兩條誤以北極出地之髙下差為極星去不動處之距度作史者之疎乃如此愚前一條言用目自心窺周為測圓正法足証郭太史簡儀之妙然自昔無人見及其理甚微無恠其然也若後兩條之辨茍稍知厯法者宜知之奈何史家瞶瞶也王良閣道攷隋天文志曰天良五星在奎北居河中天子奉車御官也其四星曰天駟旁一星曰王良亦曰天馬其星動為策馬車騎滿野亦曰王梁梁為天橋主御風雨水道故或占津梁其星移有兵亦曰馬病客星守之橋不通前一星曰策王良之御策也主天子僕在王良旁若移在馬後是為策馬則車騎滿野閣道六星在王良前飛道也從紫宫至河神所乗也一曰閣道主道里天子遊别宫之道也亦曰閣道所以扞難滅咎也一曰王良旗一曰紫宫旗亦所以為旌表而不欲其動揺旗星者兵所用也傅路一星在閣道南旁别道也備閣道之敗復而乘之也一曰太僕主禦風雨亦遊從之義也晉志並同隋但亦曰王良作亦曰梁若移在馬後作若移在王良前居馬後前漢天文志曰紫宫左右星曰天槍右四星曰天棓後十七星絶漢抵營室曰閣道又曰營室為清廟曰離宫閣道漢中四星曰天駟旁一星曰王梁王梁策馬車騎滿野旁有八星絶漢曰天横天横旁江星江星動則人涉水史記天官書曰紫宫左三星曰天槍右五星曰天棓後六星絶漢抵營室曰閣道又曰營室為清廟曰離宫閣道漢中四星曰天駟旁一星曰王良王良策馬車騎滿野旁有八星絶漢曰天潢天潢旁江星江星動人涉水又宋均云天潢天津也津湊也主計度也正義曰天江四星在尾北主太陰也不欲明明而動水暴出其星明大水不禁也宋史天文志並同鼎按史記本云閣道六星而漢書更其文曰十七星不知何據今厯書圖閣道為十餘星其本諸此歟三十雜星攷回回厯書有三十雜星錢塘袁惠子攷其經緯係以中法星名但所攷尚缺第三第四第五第十三第十四第廿四第廿五第廿九壬申秋晤於京師則皆補完余問其何本則皆自揣摩而得非三和授也又以余言改定巨蟹為積尸氣缺碗為貫索薛儀甫厯學㑹通亦有三十雜星之攷亦有缺星名者今余所攷則以囘厯星名同者為証似比兩公為有根本也又查恒星出没表四十五大星内星名同者二十一人坐椅子諸像非西洋六十像之像如貫索在回回厯為缺椀在西洋則為冕旒即此見西占之本出回囘也第五作觜宿南星性情既合又與參宿同象而厯書言逺鏡測之有三十六星則為氣類宜為雜星所收今從袁説查囘回凌犯表有天關及昴宿性情雖同星名不合若如袁説則兩星性情皆係金土亦未可為確據不如缺之攷定三十雜星戊午年距厯元戊辰五十一年加星行四十三分二十秒今將原書所載列後西星名譯書時所述宫度距道黄等性原書云以上數星是三百九十二年之前度數如此其星皆往東行一年行五十四秒十年行九分六十六年行一度觀者依此推之厯算全書卷十九
