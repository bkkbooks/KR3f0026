body:
  text: 厯算全書巻三十七宣城梅文鼎撰筆算巻四通分法併減乘除並有子母通分之用故别自為巻其畸零以十百千萬為等者不用此法凡整數下有零分而不以十分成整當用通分其法以一整數剖為若干分是為母數其所𢃄零分在母數中得幾分之幾是為子數通分子母列位法通分列位其法有三曰化整為零曰以整𢃄零曰收零為整假如有物一斤四兩則以一斤通為十六兩加入所𢃄四兩共二十兩而列之二斤以十六兩為母其所𢃄四兩是子今化斤為兩則可乘除謂之以母從子也若欲通為銖則以毎兩二十四銖為母通二十兩為四百八十銖四八此以斤通為兩兩又通為銖是兩次用通分也若畸零累析有用通分三次四次以上者准此論之如皇極經世一元有十二㑹一㑹有三十運兩次通之則一元有三百六十運一運有十二世一世有三十年兩次通之則一運有三百六十年若以元通為年則用四次元通為㑹㑹又通為運運又通為世世又通為年是四次用通分也通得十二萬九千六百為一元年數假如古歴十九年七閏謂之一章其月謂之章月二三五此以毎年十二月通十九得二百二十八月加入閏七月共得二百三十五月為一章之月右化整為零古通分法曰通以分母納以分子盖言以分母通其整數而以所𢃄零分加入也然亦有不納子而但通其整之時既以分母通之則整數不用全化為分故西學謂之化法别有變零為整之法與此化整為零之法似同而實不同所以為零乘之用盖化整則全化為零而不用整變零則全變為整而不用零其數則同謂自一至九之數其等則異謂如零陞為單單陞為十之類詳見零除條凡通分化整為零以便乘除不必更書其母若列位本法以整𢃄零當以母數子數並而書之曰幾分之幾若分下𢃄有小分則曰幾分之幾又幾分分之幾假如有整數二十五𢃄有零分為整數十二分之七又仍𢃄零秒為分數三十分之十四此如歴􅄸法一週十二宫一宫三十度今􅄸得星行二十五週又七宫十四度也假如有整數十六又𢃄零數為整數七分之五此以一整數剖為七分而所𢃄零分適得其五也七為分母五為分子假如有零數為整數三十分之十四又𢃄有小分為分數六之五此原無整數但有分又有小分其分以三十為母十四為子是一整數剖為三十而得其十四也小分以六為母五為子是一大分又剖為六而得其五也小分母古謂之秒母右以整𢃄零凡母數必大於子數其常也乗除之後有子數反多者法當以母數收之為整而𢃄其零假如有零分十六其分母九此以子數反大當以母數收為整九之十六收得一九之七十六分内除九分收為整餘七分是為整一又九分之七也假如方田之法以方五尺為步其積二十五尺今有積七十尺步法二十五尺而積有七十尺子數反多法當收整七十尺内除五十尺收為二步剩二十尺不能成步是為整二步又二十五分步之二十假如古厯法以十九年為一章四章為一蔀今距􅔦元中積一百年問在第幾蔀第幾章畣曰第二蔀第二章之第六年法先以章法十九收九十五年成五章剰五年次以蔀法四收四章成一蔀剩一章通列之成一蔀一章零五年是為已過之數今正在交第二蔀第二章之第六年也右收零為整凡欲乗除必化整為零既乘除矣仍必收零為整此二者相須為用也此外仍有除零附整之法其法以分母為法分子為實實如法而一得零數為整數十分之幾或百分千分萬分之幾所謂退除為分秒也見除法命分通分併子法通分併子其類有三曰母同者曰母不同者曰大分又𢃄小分者而所以併之之法有七曰徑併法曰變分母法曰互乗法曰連乘法曰維乘法曰截并法曰通母納子法徑併法凡分母數同者徑并其子併滿母數收為整數在三宗以上而母同者皆可徑并其子或大分之下𢃄有小分而分母同者並用此法假如有絲五分斤之四又五分斤之三併之若干畣曰整一斤又五分斤之二此因兩母同為五故徑併其子且子數七母數五是子滿母數而有餘也當以母數收之得整一零五之二以上分母同者徑併其子為通分併法之一類變分母法凡分母不同而有比例可求者變而同之可省互乘假如有數六之三又加四之一共若干畣曰共四之三法以六之三母子各損三之一變為四之二則兩母同為四而其子可併矣所以然者四與六是倍半比例故去三分之一即相同也假如有金八分兩之五又四分兩之三併之若干答曰一兩又八分兩之三八與四為折半比例然不以八折半者其子奇數不可半也故以四之三加倍即母數齊同可相併矣互乘法凡分母不同而無比例可求者先互乘以同其母再以母互乘其子而併之數在三宗以上而母不同者皆可用此法假如有物四分石之三又七分石之四共若干答曰整一石又卄八分石之九先以右母四互乘左母七得卄八又互乘子四得十六變七之四為卄八之十六三次以左母七互乘右母四及子變四之二為卄八之卄一之兩母既同遂併其子為二十八三十七以滿共母二十八収為整一仍餘九凡三母内有兩母相乘與餘一母同者祇用一互乘即可相併假如有甲乙丙丁四數乙得甲七之六丙得甲五之四丁得甲卅五之二十三若合乙丙丁三數得甲數若干答曰得甲數二又三十五之十一法以乙丙兩母相乘三十五與丁母同數即用乙母七互乘丙五之四得三十五之卄八丙母五互乘乙七之六得三十五之三十以併丁三十五之二十三共得卅五之八十一以滿母卅五成整數合問歸整得甲數二又卅五之十一連乘法凡數三宗以上者用母連乘為共母又以各母除之得數以乘其子為子而併之併滿共母收為整假如有數六之四又加三之一又加五之四併之若干答曰整一又九十之七十二法以六乘三得一十八又以五乘之得九十為連乘之共母即六除共母得數以乘之四之數即三乘共母得數以乘之一之數即五除共母得數以乘之四之數歸整得一又九十之七十二觧曰此即互乘也試以五互乘六之四得三十之二十一又以三互乗之即成九十之六十以六互乗三之得十八之六又以五互乘之即成九十之三十九以六互乗五之四得三十之二十四又以三互乗之即成十之七十二維乘法此古維乘法也與母除共母以乘子之法所得同假如錢糧一次完過九分之一又完四分之一又完六分之一又完六分之一又完七分之一問共完若干答曰五百四之四百零一約為十分之八稍弱法以八乘六得四十八再以七乘之得三百卅六又以九乘之得三千卄四又以四乘之即得一萬二千九十六約為五百四之四百一卄四約之解曰此即連乘法也但因分子皆為之一故即以母除共母之數為子相併而省一乗試用維乘所得亦同截併法凡數件中有分母同者先取出併之然後與各件並列則五件可作四件用六件以上倣論而共母亦簡如前圖有八之一四之一為加倍比例可先取併之用變分母法乃重列之原數五宗今作四宗入􅄸餘並同前解曰共母原係一萬二千九十六今只三千二十四簡四之三故所得之子皆於前式為四之一凡宗數繁多而分母又各不同者可分作幾次併之假如有物四宗甲數五分斤之三乙數六分斤之一丙數三分斤之二丁數七分斤之四併之若干答曰整二斤又六百三十分斤之三如上圖依法互乘以四宗併作兩宗乃重列之以上分母不同者為通分併子之又一類大分𢃄小分併法凡大分之下𢃄有小分而母相同者如法併之自小分起滿小分之母進為大分滿大分之母進為整若大分之母同而小分母不同者用互乘法使其同餘如上法若大分母不同者即通大分為小分再用互乘以同之假如西厯以一日分二十四小時一時又析為六十分今􅄸得中㑹二十九日十七時三十六分實㑹該加七時四十分依法併之得三十日零一時一十六分原二九卄四之一七六十之三六時為大分大分之母二十四時下為小分小分之母六十加丨丨卄四之六十之四十先併小分得七十六以滿六十進為一時仍餘十六分併得三日一時十六分次併大分得二十五時以滿二十四進為一日仍餘一時假如修築河堤新修七里六十六歩一尺舊堤原存一十二里二百九十三步四尺問堤長若干答曰長二十里新修七六六一里法三百六十步法五先併尺一四共五進一步次併步原存四共三百六十進一里次併里二七及所進之一共十里併共長二里步尺原十里是為堤長二十里合問假如有硃砂八斤十兩九銖又有三斤五兩十八銖共若干答曰十二斤三銖八一九銖滿二十四進一兩餘三兩滿十六進一八斤斤共十二是為一十二斤三銖合問共一二斤兩三銖右大小分母俱同故徑以子併假如甲數九之四又小分五之四乙數九之八又小分八之三併之若干答曰整一又九之四又小分四十之七先同其小分之母先以小分母相乘得四十為共母又互乘其子變五之四為四十之三十二變八之三為四十之十五小分母既同乃重列而併之餘同上併之得九之十二又四十之四十七歸整一又九之四又小分四十之七小分滿四卜收為大分一大分滿九收為整一右係大分母同而小分之母不同故互乘之使其同假如有田二坵甲坵二畝又四分畝之三又小分五之一丙坵一畝又三分畝之二又小分四之三併之若干答曰整四畝又六十分畝之四十三先以甲小分母五通大分四之三為小分二十之十五加入原𢃄小分一共二十之一十六為甲數又以丙小分四通大分三之二為小分十二之八加入原𢃄小分三共十二之十一為丙數解曰此即古通分納子之法也以大分盡通為小分而納小分焉實則以小分陞為大分也併得三又二百四十之四百一十二歸整四又二百四十之一百七十二約為六十之四十三右係大分母不同故盡通為小分而併之以上大分𢃄小分法為通分併子之又一類凡通分併法以通分減法還原互見後除通分子母減法通分減法亦有三類曰母同者曰母不同者曰大分𢃄小分者而其減之之法有五曰徑減法曰變分母法曰互乘法曰子乘母除法曰通母納子法併之與減猶乘之與除可以互相還原相反而適相成也故所用之法皆同徑減法數在三宗以上而母同者並用此法凡分母同者徑以相減不足減者以分母通整數減之假如有紵絲一疋零五分疋之三用過五分疋之三問仍存若干答曰五分疋之四原一五之二此以之三減之二則減數反大於原數不足減以借法作減五之三㸃於疋位借原數一疋通作五分併之二共成五之七内存五之四減去五之三仍存五之四合問以上分母同者徑以對減為通分減法之一類變分母法凡分母有可以比例言者以比例同之可省互乘假如有數六之三又有數四之三其較若干答曰四之一較四之一假如有整數一零八之三減去四之三該存若干答曰八之五整數一八之三通為八之十一減數四之三變八之六存數八之五互乘法凡分母不同者先互乘以同其母冄以母互乗其子而減之假如有兩數甲五之三乙七之四不知誰多法以兩分母五七相乘得三十五為共母又互乘其子變甲數為三十五之二十一變乙數為三十五之二十以相減則乙不及甲者其較為三十五分之一甲多三十五之一凡分母同者視其子為大小子數大者即大小者即小若子同而母不同者反是母數大者子數反小亦以互乘見之如後圖甲六之四乙五之四互得三十之二十之卄四丙四之三丁五之三互得二十之十五十二乙多三十分之四丙多二十分之三右二則以分相較而辨其多寡即古課分之法也凡三母内有兩母相乘與餘一母同者只用一互乘即可相減假如有甲數二又三十五之十一乙得甲七之六丙得甲五之四餘為丁數該若干答曰丁得甲三十五之二十三先以分母通整數為分而納入分子次以減數分母相乘為共母又互乘其子而併之是為三十五之五十八丁存三十五之卄三以減甲數仍餘三十五之卄三合問子乘母除法凡分母有可以相除者以分母除其分母得數轉以乘子而減之其餘數仍以分母除之即得約分之數若原係兩分母互乘而併者用此法可知原母數在三宗以上而母不同者並用此法可代維乘假如有沉香一石零二十八分石之九用去七分石之四該餘若干存卄八之二十一約為四之三法以分母通共數一為二十八併子之九共三十七變共數為二十八之三十七又以減分母七除共數之分母二十八得存數原母四以乘減分子四得十六變減數為二十八之十六兩相減得所存數為二十一於是仍以減分母七除之得存數原子三變存數為四之三論曰此亦變分母法也其數與互乘所得無異但用互乘則數益煩故用子乘母除之法變七之四為二十八之十六母既相同即可以相減矣若互用異乘同除則成三率之比例如後圖一率分母七法以子之四乘所變分母二十八得一百二率分子四十二為實分母七為法除之得所變分子三率分母卄八為十六其比例為七與四若二十八與十四率分子十六六也又論曰存數不用約分法而竟以分母七除何也曰約分之法以對減而得紐數今分母七既可以除其母二十八又可以除其子二十一即紐數也又何事於對減之煩乎况用之互乘還原尤為親切盖互乘之共母既以原母相乘而得即無不可以原母除之而盡也假如有整數一又九十之七十二甲得六之四乙得三之一餘為丙數該若干答曰丙得五之四丙存五之四九十之七十二法曰先以分母通整一為九十併分子七十二是為九十之一百六十二次以甲分母六除原母九十得十五以甲分子四乘之得六十為甲數三又以乙分母三除原母九十得三十以乙分子一乘之仍十為乙數合甲乙兩數得九十以減原數一百六十二仍餘七十二為丙數以法約之為五之四約分法詳後條約分㨗法置丙存數九十之七十二為實以甲乙分母六三相乘得數十八為法除之得五之四為丙存數以十八除九十得五十八除七十二得四約分本法用子數七十二減母數九十得十八以轉減子數得五十四再遞減之亦餘十八是為紐數乃用為法以除子母數得約分五之四今改用甲乙兩母相乘亦得十八為法何也以原數九十可以六除亦可以三除知其為三數維乘而得者也故於還原最切論曰此有分母三宜用維乘然其數益繁故改用子乘母除之法則三母齊同可用相減而法與數俱簡矣試先減乙丙數則所存者即甲數法同上甲存約為六之四即九十之六十若先減甲丙數則所存者必乙數其法並同兹不悉具按如此互求即知無誤可無假他法還原矣假如有數五百四之四百一甲得八之一乙得六之一丙得七之一丁得九之一餘者為戊數該若干答曰戊得四之一原數五百四之四百一甲減八之一六十三乙減六之一以各減母除原母得八十四丙減七之一七十二丁減九之一五十六共減二百七十五戊存五百四之一百二十六約為四之一以所存之數除原母即得解曰此因分子俱係之一故即以除數為得數也以上分母不同者為通分減法之又一類大分𢃄小分減法凡大小分母並同者謂原數之大小分母與減數之大小分母也下倣此竟以對減不足減者借整數以分母通為分小分不足減亦以小分之母通大分為小分其借上位皆作㸃誌之若大分母本同而小分母不同者用互乘以同之餘如上法若大小分母俱不同者用通分法盡通大分為小分而納小分焉餘如上法假如西厯􅄸得某月平朔三十日一時一十六分其實距時七時四十分為減號問實朔在某甲子某時刻答曰壬辰日酉初二刻六分以二十九日命為壬辰日以十七時命為酉初其小餘三十六分以三十分收為二刻尚餘六分命為壬辰日酉初二刻六分日時分時為大分大分以二十四為母時下為小分小分之母六十平朔三一先減小分四十原數只十六不足減作直號於大分位借一分通為小分實距時七四六十并原小分共七十六減四十餘三十六次減大分七原數一已借實朔二一三去亦借整一通為二十四減七餘十七原數三十因借減一餘二十九凡大小分母不同者謂大分之母與小分之母不同也須作㸃以别之故借整化零之㸃改為直號右係大小分母並同故竟以對減假如有整數一又九之四又小分四十之七甲得九之四又小分五之四餘為乙數該若干答曰乙得九之八又八之三乃重列之小分既同即可相減乙存九之八二百之七十五約為八之三法曰先減小分減數大原數小不足減乃作直號於大分位借一分通為小分納原數共二百三十五減一百六十餘七十五為次減大分原數四因借減一變三亦借整數一通九共十二減四餘八整數借減盡試先減乙用變分母法以代互乘餘並同上原數一九之又四十之七減乙九之八又八之三變四十之一十五存甲九之四又五之四即四十之三十二解曰四十與八是五倍比例故以乙小分八之三母子各五倍之即變為四十之一十五則兩母齊同可以對減矣右係大分母同而小分母不同故用互乘以同之假如甲丙兩坵田共四畝又六十分畝之四十三甲坵二畝又四分畝之三又小分五之一餘為丙坵該若干答曰一畝又十二分畝之十一即六十之五十五母子各五約之為十二之十一法先以甲小分母五通大分四之三為二十之十五加入原𢃄小分一共二十之十六乃列而減之如此則大分小分合而為一與原數無小分者類矣存丙一又六十之五十五用變分母法以甲子母各加三倍變二十之十六為六十之四十八以減原數四十三不及減乃作直號於整數位借一數通為六十分納原數共一百三減甲數四十八餘五十五次減整數整數四因借減一成三減甲二仍餘一是為整數一又六十之五十五即丙存數也右係大分母不同故通為小分而減之以上大分𢃄小分法為通分減法之又一類通分子母乘法假如有田三十六畝六分毎畝徵銀三分錢之二問該銀若干答曰二兩四錢四分法以分子之二乘田三十六畝六分得七十三分二以分母三收之得二兩四錢四分合問何以知其為七十三分也曰原問毎畝徴銀三分錢之二分故於右行實數内尋毎畝之位為定位之根以横對左行得數即命為分則上下俱定矣假如有銀六十四兩毎兩買銅八斤十二兩該銅若干答曰五百六十斤先以斤法十六收十二兩為斤下之七分五釐加八斤共八七五為法以乘銀六十四兩得五六即於右行實數内尋毎兩位以横對左行得數命法尾釐推而上之定為五百六十斤假如有米五石又三分石之二毎石價銀九分兩之八該銀若干答曰五兩又二十七分兩之一法以分母三通五石為十五分納子二共十七分以價之八乘之得一百三十六又以兩分母三九相乘得二十七收之合問通分子母除法假如毎田一畝徴銀三分錢之二今完編銀二兩四錢四分該田若干答曰三十六畝六分法以分母三通二兩四錢四分為七十三分二為實以分子之二為法除之即得三十六畝六分合問原所設三分之二以錢為主故四分所通為小分假如有米五石又三分石之二共價銀五兩又二十七分兩之一問毎石該價若干答曰九分兩之八法先以米分母三通五石為十五分納子二共十七分為法又以價分母卄七通五兩為一百三十五納子一共一百三十六分為實法除實得八為毎石三分一之價以分母三乘之得二十四分為毎石價命為二十七分兩之二十四約為九之八又㨗法以米分母三除銀分母二十七得九為毎石價之母即以除出之數為子即九之八假如有絲一斤又六分斤之四共價一兩又四十二分兩之二十問毎斤價若干答曰七分兩之六又十之二法先通絲一斤為六分納子四共一十為法又通銀一兩為四十二分納子二十共六十二退一位即一十除也命為單六又小分二即毎斤六分一之絲價也於是以分母六乘之得三十六又小分十二為毎斤價是為四十二分兩之三十六又小分十二也子母並六約之為七分兩之六又小分十之二㨗法以絲分母六除價分母四十二得七為毎斤絲價之母即命為七分兩之六又十之七通分子母三率法即異乘同除假如西厯太陽毎日平行五十九分零八秒二十微今有二刻半該行若干分答曰一分三十二秒卄四微又九十六分微之卄六法先通五十九分為三千五百四十秒加原帯八秒共三千五百四十八秒又通為二十一萬二千八百八十微加原𢃄二十微共二十一萬二千九百微在位以二刻半乘之得五十三萬二千二百五十微為實以一日化九十六刻為法除之得五千五百四十四微不盡除滿三千六百微收為一分又一千九百二十微收為三十二秒仍餘二十四微不盡者以法命之是為一分三十二秒二十四微又九十六分微之二十六論曰此小數法也何則二十一萬二千九百者是每日九十六刻之數今以二刻半乘之於刻下多一位故截去得數尾一位命為百假如以粟易布毎粟六分石之二易布五分疋之三今有粟一石又三分石之二該布若干答曰三疋一粟六分石之二母子各減一倍變為三之一四布五分疋之十五收為整三疋兩粟母同為三省不用只以布分母收之用變分母法變一率六之二為三之一則兩粟母相同可省互乘而子變為之一又可省除只以三率一石用分母通為三納子二共五以乘二率布分子之三得十五再以布分母五收之即得三疋合問假如以銀換金毎銀二兩又三分兩之二換金九分兩之二今有銀六分兩之四該金若干答曰十八分兩之一四金十八分兩之一法以一率分母三互乘三率六之四為十八之十二與二率之二相乘得二十四為實又用一率分母三通二兩為六分納子二共八是為三之八復以三率分母六互乘之為十八之四十八以乘金母九得四百三十二為法法大實小以法命之為四百三十二之二十四母子各二十四約之即十八分兩之一合問若用變分母法則如後式一銀二兩又三之二通為三之八乘得七十二為法以金母九乘之八也四金七十二分兩之四約為十八之一子母各四約之解曰十八分兩之一即五分五氂五五不盡畸零𢃄分子母乘法假如以八之五乗四之三該若干答曰三十二之十五法以母乘母得三十二子乘子得十五即三十二之十五為乗得數也又法以除代乗則倒位互除之法以五除四得八為母數以八除三得三七五為子數是為八之三七五與乗得之數同解曰四除三十二得八四除十五得三七五若四因八得三十二四因三七五亦得十五用法假如穀一石價二十七分兩之十六今有穀四分石之三價若干答曰九分兩之四一穀一石四價九分兩之四因首率是一故省除即以九之四為得數解曰二十七分兩之十六即五錢九分二氂六毫弱也穀四分石之三即七斗五升也價九分兩之四即四錢四分四四不盡也若用倒位除以代乘則徑得九之四法用母四除十六得四為子用子三除二十七得九為母是為九之四也畸零𢃄分子母除法假如以五之四除四之三該若干答曰八之七五法以母除母得八子除子得七五是為八之七半即除得數也又法以乘代除則倒位互乗之法以母五乘子三得十五為子以子四乗母四得十六為母是十六之十五與除得之數同解曰十六即八之倍數十五即七五之倍數故其數同用法假如以絹易縀絹五分丈之四換縀七分丈之四問絹毎丈該縀若干答曰該換縀七分丈之五一絹五分丈之四法以母除母得一四子除子得一是二縀七分丈之四為一十四之一十子母各半之為七分三絹一丈之五三率是一省乘即用縀七之四為實四縀七分丈之五解曰五分丈之四者八尺也七分丈之四者五尺七寸一分强也七分丈之五者七尺一寸四分强也若用倒位乘以代除所得亦同法用子四乘母七得卄八為母用母互乘子四得卄為子子母各取四之一即七之五也論曰同文筭指有畸零乘除之法甚為簡妙然莫適所用今以三率列之則實數可稽而用法亦明矣畸零乘除定位凡乘法得數必大於原問之數若畸零乗則其數反降凡除法得數必降若畸零除則其數反陞盖即異乘同除之理諸家􅄸術皆未經說破故定位多訛兹以三率明之如左假如換珠每珠一兩值銀二十四兩今有珠三分五釐該若干答曰八錢四分此首率是單兩而三率有分釐是單下有三位零也故截去得數尾三位命法尾兩兩位空定所得為八錢四分論曰此即以乘出之數為四率者以首率是單一兩故省除耳試即以三率實尾位釐為單而定所得為八百四十兩為實亦陞首率單兩為千釐為法除實即以實數降三位亦仍得八錢四分合問此條已詳二巻乘法中兹以三率列之於定位之理益明又論曰乘除之難在於定位而畸零為尤難所以者何凡定位以單數為根而畸零無單位可言故也前於乘法中立本數大數小數三法以尋每位可以御畸零矣於除法猶未有以處也今皆歸之三率惟視三率中所有之數即命為單數如金銀之類本以兩為單今視三率中有分即以分為單而兩則為其百數又如米穀之類本以石為單今三率中有斗即以斗為單而石則為其十數他倣此則雖畸零皆可作整數筭無論乗除一以貫之矣是為以零變整而乗除之後得數無異此所以别於通分化整為零之法也假如有珠三分五釐價銀八錢四分問每兩珠價若干答曰二十四兩此一率首位是分即以分為單數以二率陞兩位作八十四兩為實以法三分五釐對實分位列之位命除畢於法上一為單分推而上之定得數為二十四兩合問解曰二率陞二位為實者即百分乘也分原在單兩下二位今既陞為單則單兩亦陞二位成百分也假如銀二錢四分買稻九十六斤毎兩該若干答曰四百斤此以錢為單數則三率單兩成十錢而二率亦陞一位成九百六十斤為實於是以法二錢對實位列之以單錢對單斤也單除畢於法上一位命為斤即得數為四百斤合問假如以豆換油豆四斗八升換油十二斤今豆十石該油若干答曰二百五十斤此以斗為單數則三率十石成百斗故二率亦陞兩位作一千二百斤為實以法四斗對實斤位列之亦以單斗對單斤也餘亦同假如芝麻六斗四升四合換豆一石今芝麻四石八斗三升該豆若干答曰七石五斗若以斗為單則命實為四十八石三斗以二率十斗乘之也而以法首六斗對實三斗列之除畢於法上位定為斗亦得七石五斗或以升為單以合為單得數亦無不同也以升為單法上即命為升以合為單法上即命為合假如錢六百五十文價四錢八分七釐半每千該價若干此問毎千錢價是以千為單也今法首只有百即以百為單而陞單千為十百則二率亦陞一位作四兩八錢七分五釐為實四兩列之以單百對單兩也除畢於法上位命為單兩兩位空定得數為七錢五分歴筭全書卷三十七
