body:
  text: 厯算全書卷十八宣城梅文鼎撰七政細草補註推日躔法先查年根冬至後一日子正距冬至隨錄本年髙衝年根子正髙沖後查日數本日子正距冬至後一日子正之平行隨錄髙行亦本日子正距冬至後一日子正之髙行高行加入高衝書於高衝格内即本日高沖所在年根日數相加得平行即本日距冬至之平行平行内減去髙衝為引數即得本日子正距高沖以引數查加減表相較用中比例得均數隨記加減號均數依號加減於平行即得細行人目所見視度細行内按宫度減宿次即得本日宿也鼎按年根者冬至後一日子正之平行也日數者毎日之平行也故相加即為本日之平行邵本云凡算宿鈐以戊辰年為主毎年加五十一秒所積之秒以六歸之加於宿鈐之内再與細行相減髙衝者太陽最卑㸃距冬至之度毎年東行一分推月離法先查四年根獨正交行加六宫後查四日數俱年日相加得三平行而正交年日相減為正交平行書本日太陽細行即按細行宫度查日差表得數記書加減號按數至時刻平行表内查得日差兩書之依號加減於平行總平行引以平行引查加減表相較中比例得均數記加減號均數依號加減於平行總平行引即為實行實行引實行内減去太陽度為月距日次引以月距日次引同實行引宫度查表二三均數表相較得次均次均依號加減於實行即白道經度邵本云即白經恒減以月距日次引查交均記加減號隨查大距數交均依號加減於正交平行即正交經度正交經度加六宫即中交置白道經度内減去正交經度即月距正交以月距正交查白道同升差表得同升差記加減號白道經度與同升差依號相加減為黃道視行以月距正交與大距數查緯表即黃白距度表得視緯減宿照日躔減法同邵本云錄本日太陽細行而太陽恒減以太陽恒減查日差表記得數於旁加減號記於月離日差之旁次將所得之數查時刻平行表如查出之數只分秒耳即日差以兩平行與日差照號加減得平行總平引又云以月距日次引查二三均表直行以實行查橫行所遇之處即得如月距日次引過六宫減去然後查表内行宫度順查外行宫度逆查而粗格所在即加減所分按楊學山云月之二三均數以距日而生與五星嵗輪同理但其行法却異於五星兼有又次輪附於次輪之上與次均相消相長表乃二均三均之總數故與五星次均表絶殊其加減之句亦不以六宫而分月之交均距限亦以距日而生地谷以前無之也推土木星法先查兩年根冬至後一日子正星距冬至及引數後查正交行再查日數年根距冬至及引數之下各書日數兩書之年日相加得平行平引年根距冬至引數各加日數為平行與平引即所求本日子正以平引查加減表相較中比例得均數隨錄中分加減表中分記書加減號均數依號加減於平行得實經嵗輪心所到即書本日太陽細行日躔條求得數於格太陽内減去實經即次引本日星在嵗輪距合伏以次引查次均隨得較分亦相較中比例記書加減號中較相乗六十歸之得三均三均與次均恒加即定均將定均依次均號加減於實經即視經遲留逆伏之度減宿照日躔減法同置實經於交行下内減交行即得距交所求日星距正交以距交查中分緯表内之中分以次引即前所得嵗輪上星距合伏查緯限中緯相乗六十歸之得視緯定南北以距交宫度定之前六宫一二三四五號北後六宫六七八九十十一號南按學山云五星三均恒用加者以嵗輪心自最髙至最卑次均皆漸大而表所列次均數乃置輪心在最高時算也五星加減表中分是從高卑立算緯度中分是從交㸃至半交立算乃厯家簡括之法若依三角形算則不用中分矣推火星法先查兩年根距冬至引數隨錄正交行後查日數兩年根之下各書日數兩書之年日相加為平行平引以平引查加減表相較中比例得均數即書加減號均數依號加減於平行得實行實引隨錄本日太陽細行太陽内減去實行得相距若相距過六宫則於實行内減去太陽得距餘減距餘之半即得距餘半此係後六宫者若前六宫即將相距減去一半為半距無距餘半太陽内減去髙衝改作對衝宫為日引加六宫即是從最髙起以實引查距日及半徑以日引查日差半徑日差相加得星數星數即歳輪半徑星數與距日距日即嵗輪心距地相加為總相減為較以距餘半查八線表即得半距切線數與較相乗又以總數除之得數再查八線表取相近切線用之即得減弧半距或距餘半内恒減去減弧得次均即看相距在前六宫者加嵗輪上從合至沖後六宫者減從沖至合依號加減於實行即視行宿次照日躔減法同實行内減去正交即距交以距交查中分以相距日星相距查緯限先定南北緯有加減分距交在北者依號加減為定緯限中分緯限相乗六十歸之得緯以距交定南北前六宫是北後六宫是南按距日半徑俱以實引取之查各式並同天學㑹通亦同按前六宫是自合伏至沖日後六宫是自沖日復至合伏皆以嵗輪言邵本於半距切線下注云從距日至再查切線俱逢十進之按楊學山云火星半距總較切線等用是斜三角形有一角二邊求餘角之法也五星皆可用惟日差星數火星所獨耳推金水星法先查三年根引數伏見距冬至後查太陽日數兩書之即用為星平行日數兩書於引數及距冬至下陽金水距冬至平行即日躔表數也金水以太為平行之心再查本星表内日數此則伏見平行之日數書於伏見行下年日相加得各平行以引數平行查加減表相較中比例得前均即書加減號隨得中分加減表中分前均依號加減於各平行得實經實引獨伏見行下前均加減號反用得伏見實行反用均數加減伏見平行為伏見實行以伏見實行查二均亦相較中比例書加減號隨得較分中較相乘六十歸之得三均二均三均恒加即定均并均依號加減於實經即視經減宿與日躔法同實引内恒加十六度金星正交在最髙前十六度即得次實引即星距正交以次實引查前中分前緯表中分以伏見實行查前緯限中緯相乗六十歸之記書南北號其後中分後緯表中分後緯限亦以距交查後中分亦照前緯查法同以伏見實行查後緯限亦書南北號如前後緯號同者兩緯相加俱南緯俱北緯則相加如號異者兩緯相減一南一北則相減即得視緯其南北以數大者定之若異號相減則以南緯大者命其減餘為南北大者則命為北水星照此推法同獨無次實引水星正交與最高同度即以實引為距交金水伏見行即土木之次引也土木以星行嵗輪心與太陽相減得次引者是星距日度即嵗輪上距合伏之度金水則伏見輪心即太陽無可相減故另有伏見之行金水次實引即土木之距交也因水星即用實引數為距交故金星别之為次實引然殊亂人目不若直名之距交邵本查後中分後緯下有云必中緯同在一篇者方可用以便定南北學山云金水緯行獨有前後二表者以二星之緯皆由伏見輪而生而伏見輪小於黃道斜交側立旋居於本天之周作表須前後兩表以該之非星緯實有前後之分也學山云金水伏見實行與初均加減號相反者以伏見輪心之角斜線錯列適與初均成相反之勢故反加減之得星合伏真度非伏見之行與本輪相反勿誤認袁説推火星諸行假如甲申年距根一百三十五日距冬至平行查本星二百恒年表本年下距冬至橫行一十一宫六度五十三分五十九秒隨查日數二宫十度四十五分日數與年根并之得一宫十七度三十九分引數平行查恒年表本年下引數橫行三宫七度五分二十七秒日數與距冬至同年根日數并之得五宫十七度五十分初均數以引數平行查本星加減表得二度三十分四十二秒其號順減書減號於均數之旁隨錄距日數距冬至實行以本星平行内減去初均數得一宫一十五度八分以均數之號為加減引數實行以本平行内減去均數之全數得五宫十五度十九分以均數之號為加減太陽即錄本日日躔細行相距以太陽内恒減去距冬至實行得二宫二十九度三十五分半距即以相距半之若相距過半周則借全周内減去相距全分即為距餘再將其較半之即距餘半也日引以本日太陽加六宫減去日躔表内本年下最髙衝得十宫八度三十一分距日以引數實行查加減表得八九三七四勿菴按距日半徑俱宜用實行半徑以引數實行查加減表得六三七一七日差以日引查之得一九一四四星數以半徑恒加日差得六四九八六一總數以距日内加星數得一五四三六一較距日内減去星數得二四三八七九半距切線以半距全分查八線表正切線得九九二四七減弧以較數與半距切線相乗得二四二四二五九一一三又以總數除之得一五六八以此查正切線得八度五十五分次均半距内恒減去減弧得一宫五度五十二分視行以實行内加次均全分得二宫二十一度正交查本星恒年表本年下正交橫行得四宫十七度十三分距交以實行内恒減去正交得八宫二十七度五十五分中分以距交查首卷本星緯度得六十分緯限以相距查緯表得一度二十九分視緯以緯限數化作八十九分與中分六十分相乘得五千三百四十分為實以六十為法除之得八十九分以六十分成度得一度二十九分推凌犯法月犯恒星以本年七政厯與恒星鈐表恒星經度及南北緯度月在上相距二度内取月在下相距一度内取之又以本日與次日之月視行相較化分為一率日法一千四百四十分為二率恒星經度内減月經度之較化分為三率二三相乘一率除之得凌犯時刻月犯五星以本年七政查月與五星經度及南北緯度月在上相距二度内取月在下一度内取之次以本日之月視行内減次日之月視行取其較又以五星本日經度内減次日經度取其較視星順行者兩較相減逆行者兩較相加化分為一率日法一千四百四十分為二率以本日五星經度内減月經度為月未及星之距化分為三率求得四率為凌犯時刻五星犯五星以本年七政五星經度及南北緯度相距一度内取用五星各以本日經度與次日經度相減得較如俱順俱逆者兩較相減一順一逆者兩較相加化分為一率日法一千四百四十為二率又以本日五星經度兩相減之較化分為三率如法求得四率為凌犯時刻五星犯恒星以本年七政與恒星鈐表經度及南北緯度相距一度内取用次以五星本日經度内減次日經度得較度化分為一率日法一千四百四十為二率又置恒星經度内減本日五星經度得較度化分為三率如法求得凌犯時刻為四率若五星退行者以五星經度内減恒星經度為三率月與星一度為犯十七分以内為凌同緯為掩五星與星一度為犯三分以内為凌同緯為掩視凌犯時刻在地平上者取之若在地平下可勿推算定上下以北為上南為下月緯星緯同在北以月緯多者在上少者在下月緯星緯同在南則以月緯多為在下少為在上其兩緯相減若星月一南一北則以月南為在下月北為在上兩緯相加推月星凌犯密法依本年七政厯並恒星鈐視恒星經度及南北緯度月在上二度内取之月在下一度内取之又以恒星經度内減本日之月視行得度化分為二率以一千四百四十分為三率本日之月視行相減其較數度分為一率二三率相乘以一率除之即得時刻一求太陽細行以一千四百四十分為一率次日細行與本日細行相減得較為二率凌犯時化分為三率二三率相乘一率除之得四率以四率加於本日細行得太陽細行二求時分以太陽細行查交食四卷内九十度表得時分太陽度過三十分進一度查表得數即是三求總時以時分及凌犯時刻午後減十二小時午前加十二小時滿二十四時去之餘為總時即應時四求九十度限以總時查交食四卷表與時分相對者錄之得九十度限五求恒星經度置恒星經度六求限髙度以九十度減距天頂之度分得限髙度七求月實引置月離内月實引八求月距地半徑以月實引查交食二卷表内得月距地半徑邵本作查交食表二卷内視半徑九求月實行以月實引查交食二卷表内得月實行十求星距限九十度限之宫度分内減星之經度宫度分為限大則星在西若不及減置星經度内減九十度限之宫度分為限小則星在東十一求置正交經度置月離内正交經度十二求較數以正交經度内減九十度限宫度若九十度限不足減則加十二宫減之即得較數十三求真髙度以較數查交食二卷太隂距度表得月實緯分北加南減於限髙度得真髙度六宫以上定北加以下定南減十四求地平差以真髙度並月距地半徑求地平差見交食九卷表十五求時差以地平差變為髙下差查交食表九卷及星距限度求時差十六求較數以真高度置九十度減之餘為較數十七求氣差以較數及月距地半徑求氣差交食九卷表内月距地半徑查上橫行以較數查右直行十八求月實緯以凌犯時刻化分為三率本日之月緯度與次日緯度相較得數化分為二率與凌犯化分相乘以二十四小時化分為一率除之得數加減於本日緯度視南北號順加逆減即月實緯若南北異號以兩數相加為二率後除得之數用減本日緯度以次日之號定南北十九求視緯以月實緯度南加北減於氣差得視緯二十求恒星緯置恒星緯度分廿一求月距星月視緯北多定上月視緯南多定下以大減小一度以外不用得月距星如一南一北兩數相加廿二求凌犯時刻置凌犯時刻廿三求定時差以月實行分為一率時差分為二率六十分為三率二三率相乘一率除之得四率有六十分進一時十五分進一刻得定時差廿四求視時以定時差加減於凌犯時刻即得凌犯視時視星距限度西加東減南北異號月南在下月北在上兩數相加南北同號同北南月緯大在上下月緯小在下上兩數相減按凡推月與五星及恒星凌犯用此式較密攷節氣法用變時表依法查之更密凡半月一節氣遇細行一十四度與二十九度即是交節氣之日次日細行與本日細行相減減餘化秒為一率置六十分以本日細行分秒減之減餘化秒為二率化二十四小時為一千四百四十為三率二三率相乘以一率除之得數即四率其分秒用六歸之收作時刻分查節氣日差加減表在日躔二卷内凡六十分為一小時若過半分作一分用一百二十分為一大時十五分為一刻如不滿一刻作分算時自子正起算二十九度與次宫度相較為氣十四度與十五度相較為節查二至限法以二至度為主加以本日太陽經度未滿宫度之餘分即是二至限如冬至日經度為二十九度二十五分即此廿五分為未滿之餘分也而本至宿為箕三度三十五分加二十五分則為冬至限在箕四度假如五月初十日太陽在申宫二十九度二十三分宿在觜十度十二分問曰夏至限係何宿度分答曰觜宿十度四十九分假如十一月二十日太陽在寅宫二十九度十五分宿在箕二度五十六分問曰冬至限係何宿度分答曰箕宿三度四十一分假如正月十四日太陽在子宫十四度二十一分八秒十五日太陽在子宫十五度二十二分三秒問曰立春係何時刻答曰申初初刻十分假如二十九日太陽在子宫二十九度三十一分二十五秒三十日太陽在亥宫初度三十一分十四秒問曰雨水係何時刻答曰午初一刻六分定合朔弦望法合朔以月距日次引滿十一宫二十餘度此日即合朔也滿十二宫即宫是合朔之次日也求合朔時刻凡星同度法同以本日太陽與次日太陽相減得較數另記又以本日之月視行與次日之月視行相減得較仍以兩較數相減得數化分為一率以一千四百四十為二率又置本日太陽減去本日之月視行得數即月不及日之度為三率二三相乘一率除之得數再以六十分收之為時餘以十五分收為刻即得時刻及分假如正月初一日太陽隂在子宫十四度十五分二十秒十度二十三分十二秒初二日太陽隂在子宫十五度十四分六秒十一秒二十三度三十分三問曰合朔係何時刻答曰辰初二刻八分相望亦以次引滿五宫二十度之上將近六宫即是望也到六宫即望之次日也求弦望時刻以本日與次日太陽之較及月視行之較相減化分為一率以一千四百四十為二率又置本日之月視行内減去本日太陽其餘宫度分上弦輳滿三宫望輳滿六宫下弦輳滿九宫將輳滿之數化分為三率二三相乘一率除之得數再以六十收之為時刻分假如十六日太陽隂在戌辰宫十五度十六分九秒秒六度三十分二十一十七日太陽隂在戌辰宫十六度十五分十六秒五秒十八度二十九分三十問曰望係何時刻答曰戌初初刻七分上弦以次引二宫二十餘度將近三宫即上弦也若滿三宫即為上弦之次日也假如初八日太陽隂在亥申宫八度三十四分八秒秒七度五十八分四十初九日太陽隂在亥申宫七度三十四分二十秒秒二十度五十五分十六問曰上弦係何時刻答曰丑初初刻十分下弦以次引八宫二十餘度將近九宫即是下弦也若九宫一二度即下弦之次日也假如二十三日太陽隂在酉子宫二十一度十一分二十秒十一度三十三分六秒二十四日太陽隂在酉子宫二十二度八分十六秒十秒二十五度二十八分三問曰下弦係何時刻答曰酉初三刻四分求月入宫法以次日宫度分内減去本日宫度分餘度分化分為一率本日未滿整宫之餘度分亦化分為二率一千四百四十為三率二三率相乗一率除之即得時刻假如正月初七日太陰在戌宫十八度三十一分初八日太陰在酉宫一度二十四分問曰月入宫係何時刻答曰亥初一刻八分入酉宫求月升法以朔日之月離宫度定之子宫十五度至酉宫十五度為正升酉宫十五度至未宫初度為斜升未宫初度至寅宫十五度為橫升寅宫十五度至子宫十五度為斜升假如正月初一日月在丑宫十八度四十六分問曰月係何升答曰係斜升求月孛羅計法以本年所推月離稿内毎月初一十一二十一三日月孛實行正交經度中交經度内減本年宿餘減宿即得三宿分假如正月初一日月孛實行在己宫八度四十四分本年宿鈐在己宫一度八分為張宿問曰月孛係何宿度分答曰張宿七度三十六分求五星伏見土木火三星與太陽合伏後為晨見合伏前俱稱夕與太陽衝後為夕見衝前為晨葢星行遲太陽行速故也金水二星順行與太陽合伏曰夕逆行合伏曰晨假如土星四月十九日合伏問曰土星合伏前後應晨應夕見與不見答曰合伏前係夕不見合伏後係晨見假如水星五月十二日與太陽衝問曰太陽衝前衝後應晨夕見與不見答曰衝前係夕不見衝後即晨見按水星不沖日今云爾者葢退合亦沖之屬也退當云退合伏前係夕不見合伏後即晨見求五星衝伏同度時刻法兩星各以次日行與本日行相減得較兩較相加減為一率同順同逆兩較相減一順一逆兩較相加一千四百四十為三率二三率相乘以一率除之得時刻假如正月十八日土水星在子宫二十六度四十九分二十六度三十三分十九日土水星在子宫二十六度五十六分二十八度一十七分問曰土水二星係何時同度答曰寅初三刻十二分假如正月二十五日太陽水星在亥宫二十八度三十分分二十八度四十二二十六日太陽水星在亥宫二十九度三十分分二十七度四十二問曰水星係何時與太陽合退伏答曰丑正一刻九分假如二十日太陽土星在丑未宫三度二十六分四度十分二十一日太陽土星在丑未宫四度二十四分四度六分問曰土星係何時與太陽衝答曰酉初初刻一分假如二十八日太陽木星在子宫二十七度三十分分二十七度五十五二十九日太陽木星在子宫二十八度三十分二十八度二分問曰木星係何時與太陽合伏答曰午初一刻四分求五星退入宫法本日度分内減去次日度分其較為一率本日餘分為二率度以上不算止用餘分一千四百四十為三率二三率相乘以一率除之得時刻假如二十六日金星在戌宫初度三十二分二十七日金星在亥宫二十九度三十八分問曰金星係何時退入某宫答曰未正初刻十三分退入亥宫求五星順入宫法以次日宫度分内減去本日宫度分餘度分化分為一率諸法俱與月入宫法同如退入宫者則於本日宫度分内減去次日宫度分得數化分為一率以日法為二率即以本日初度分為三率依法求之假如正月初三日水星在丑宫二十九度四十六分初四日水星在子宫一度三十五分問曰水星係何時刻入某宫答曰寅初初刻四分入子宫求五星最髙卑中距法凡三宫九宫為中距宫為最卑六宫為最高火金水三星以實引次實引查土木星以平引查假如土星平引在四宫八度二十分問曰從何限之上下行答曰中距下行求五星留逆法凡五星經度自一度二度而行者為順如從十五度十四度而行者為逆本日係十度五分次日仍十度五分者為留第三日係十度六分為留順初如係十度四分三分為留退初求五星伏見法以天球安定北極出地如四十度求晨在東地平上用本日太陽距星之數求夕在西地平上用次日太陽距星之數以太陽所在之宫𦂳挨地平又看此日之星宫度相距太陽之逺近又用缺規矩較星距太陽之定限如土星定限距太陽十一度木星定限距太陽十度火星定限距太陽十一度半金星定限距太陽五度水星定限距太陽十一度半以缺規矩較定之限挨地平視星所在之宫度及緯南緯北之度視厯算全書卷十八
