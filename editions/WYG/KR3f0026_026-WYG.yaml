body:
  text: 厯算全書卷二十四宣城梅文鼎撰厯學駢枝卷四盈縮厯立成太陽冬至前後二象盈初縮末限太陽夏至前後二象縮初盈末限布立成法厯經盈縮招差法太隂遲疾立成布立成法求每限月平行度法厯經遲疾厯三差法日出入晨昏半晝分立成冬至後半嵗周夏至後半嵗周考立成法太陽冬至前後二象盈初縮末限置本限八十八度九九二二五加入盈積度二度四一四即合周嵗一象限九十一度三一六二五之數太陽夏至前後二象縮初盈末限置本限九十三度七一二二五減去縮積度二度四一四即合周嵗一象限九十一度三一六二五之數布立成法先依厯經盈縮招差各以其日平差立差求到每日盈縮積次以相挨兩日盈縮積相減餘為每日盈縮加分以其日加分盈加縮減一度即每日日行度又以兩日加分相減餘為每日平立合差再置末日平立合差以初日平立合差減之餘為實末日日數為法法除實即得每日平立合差之差數也如盈初置八十七日下平立合差六分五五六八内減初日四分九三八六餘一分六一八二為實八十七日為法除之得一八六為每日之差分縮初置九十二日下平立合差五分九二六六内減初日四四三六二餘一分四九四為實九十二日為法除之得一六二為每日之差又法盈初置立差三十一縮初置立差二十七各六因之即得每日平立合差之差數厯經盈縮招差法凡求盈縮積皆以入厯初末日乘立差得數用加平差再以初末日乘之得數以減定差餘數復以初末日乘之得數萬約為分即各得其日盈縮積太隂遲疾厯立成布立成法依厯經垜叠招差各以平差立差求到各限遲疾度次以相挨兩限遲疾度相減餘為各限損益分次以各限損益分加減每限月平行度得為各限遲疾行度也數止秒秒以下不用其加減法在疾厯益加損減遲厯反之求每限月平行度法置小轉中十三日七七七三以每日月平行度十三度三六八七五乘之得一百八十四度一八五二七九三七五為實以一百六十八限除之得一度九六三四九四是為每限月平行度也厯經遲疾厯三差法立差三百二十五平差二萬八千一百定差一千一百一十一萬凡推遲疾在八十四限以下者為初限以上者去減一百六十八限餘為末限置立差以初末限乘之得數用加平差再以初末限乘之以減定差餘數再以初末限乘之得數滿億為度即得各限遲疾積度凡初限是從初順數至後末限是從未盡日逆溯至前故其數並同也月與日立法同但太陽以定氣立限故盈縮異數太隂以平行立限故遲疾同原日出入晨昏半晝分立成冬至後半嵗周夏至後半嵗周考立成法以半晝分轉減五千分半日周餘為日出分日出分減去二百五十分為晨分以晨分減日周一萬分餘為昏分昏分減去二百五十分為日入分又㨗法晨分與昏分相並成日周一萬又日出分與日入分相並亦成日周一萬厯算全書卷二十四
