body:
  text: 厯算全書卷四十一宣城梅文鼎撰方程論卷二極數吾論方程至和較之雜之變盡矣雖然不知帶分疊脚重審之法無以窮其致故極數次之極數有三一帶分二疊脚三重審皆不離乎和較之四術帶分方程例法曰視原問中有云㡬分之㡬者則以分母通其全數而列之或云有物㡬數又㡬分之㡬者以分母通其全數而納其子如法列位遍乗減併以求一法一實既得法以除實而得者即所求物之一分也以所得一分之數分母乗之則為物之全數矣或云㡬分之㡬又㡬分之㡬者以兩分母相乗為全數而列之又以兩分母互乗其子為所用之分而列之所用之分同在一行者併而列之分用于兩行者不併也併之而所用之分反大於全數者以全數除之命為幾全數又幾分之幾其入算乗除仍用所併之分得數後則只以全數之分乗之為全數以上兩法皆化整為零乗除竟用零分故先得一分之數又法凡較數有以此之全數當彼之㡬分之㡬者則通其一行之内皆以分母乗之而後列焉則其所得即為全數而非其一分也如云乙得甲三分之二則以分母三乗乙全數得全乙者三乗甲之二分得六分是為全甲者二則以三乙當二甲而列之驟視之如倒列其子母其實皆全數耳若有正負之數亦以分母乗而列之亦全數非零分也是為以零變整與化整為零之法不同故徑得其全數所用乗除皆整數非分故也得即為整其所用分母只在本一行中如一物有兩分母又分用于各行則各以其行中分母為用凡和數中有一位帶分而餘只全數者亦可以分母通乗而列之其所得亦為全數而非分如甲三乙二又三之一共十六則以分母三乗甲得九乗一二得六乗乙之一得三亦整一也併得整七乗共十六得四十八是為甲九乙七共四十八變零為整徑以整數乗除所得即為整數又法凡帶分之法或化整為零或變零為整取其畫一也此外又有雜用零整之法亦所當知如行中有幾位或原帶有零分者以化整為零法列之其原未帶分者只以整數列之但乗除得數後整列者所得即為整數零分列者所得只為零分之數仍須以分母乗之為全數又法視所帶之分有可以分母除之而盡者則以所除分秒附于整數而列之則其乗除後得數亦為所求之全數若分母除其子不能盡者則不用此法今有甲字庫貯金丁字庫貯銀各不知總但云取甲四之三加丁五之二則一百一十萬若以甲加丁之倍數則四百四十萬問各若干畣曰甲庫金四十萬丁庫銀二百萬法以分子甲之三分丁之二分列右以分母四通甲整一得四分以分母五通丁整二得十分列左依和數法互乗對減餘丁之分二十二為法餘八百八十萬為實法除實得四十萬為丁之一分以丁之分母五乗丁之一分得二百萬為丁庫銀數乃以丁庫數倍之得四百萬減四百四十萬餘四十萬為甲庫金數此化整從零法也原列零分故得亦零分之數又法以丁分母五互甲之三得十五以甲分母四互丁之二得八列右乂以兩分母五四相乗得二十為甲丁共母以乗一甲得二十乗倍丁得四十列左乃以甲丁共母乗一百一十萬得二千二百萬列右乗四百四十萬得八千八百萬列左分母相乗為母母互乗子只是通分之法妙在以分共母乗其和數而零數皆為整用矣此用法之妙上中下依法乗減餘丁四百四十為法八億八千萬為實以法除實得二百萬為丁數以丁四十計八千萬減八千八百萬餘八百萬以甲二十除之得四十萬為甲數此變零為整法也原列整數故所得即為整數又法以甲分母四除之三得七分五秒以丁分母五除之二得四分列之則其餘數皆不變左甲一乗右行皆如原數右甲七分五秒乗左行各得四分之三甲各七分五秒盡減丁餘一一上一整數下一一分乃十分之一為法共數減餘二百二十萬為實法除實得二百萬為丁數以丁數倍之減共數餘四十萬即為甲數此除零附整法也零分既除為分秒則乗除之際皆以整數為主故所得亦即為整數今有甲乙二數不知總但云取乙五之三又取乙四之一以益甲則甲之數倍取甲三之二又取甲七之二以與乙較則乙多數二百四十問甲乙本數各㡬何畣曰甲本數一千七十一乙本數一千二百六十法以較數帶分取之本二色也却有三位以分母通之仍二位也先以乙分母五四相乗得二十以當乙之全數又以分母五互乗分子一得五以分母四互乗分子三得十二併之得十七以當乙所益甲之分是為乙二十分之十七以益甲也次以甲分母三七相乗得二十一以當甲之全數又以分母三互乗分子二得六以分母七互乗分子二得十四併之共二十以當甲所與乙較之分是為甲二十一分之二十以與乙較也于是分正負列位依較數法乗減乙餘八十分為法負數無減就以五千四十為實法除實得六十三為乙之一分以乙全分二十乗之得一千二百六十為乙本數乙本數同減負二百四十餘一千二十即甲與乙較之分也以左行甲之二十分除之得五十一為甲之一分以甲全分二十一乗之得一千七十一為甲本數乃細攷之置乙本數三因五除之得七百五十六為五之三又置一本數四除之得三百一十五為四之一併兩數共一千七十一則與甲數同故以此益甲而甲倍也置甲本數二因三除之得七百一十四為三之二又置甲本數二因七除之得三百六為七之二併兩數共一千二十以此較乙則不及二百四十此只是以乙之分與甲較又以甲之分與乙較也末卷所列諸率則是以乙之分益甲而轉與乙所存之分相較又以甲之分益乙而轉與甲所存之數相較故自不同合而觀之則見今有寳泉寳源二局鑄錢不知總但云取寳源五之四又四之三以益寳泉則寳泉之數倍若取寳泉三之二以與寳源較則多于寳源四十二貫畣曰寳泉原數一千九百五十三貫寳源原數一千二百六十貫法先以寳源分母五四相乗得二十分為全數又以分母五互乗分子三得十五分母四互乗分子四得十六併之共三十一分為寳源所以益寳泉之分全數二十分所用以益寳泉者反有三十一分是為以寳源全數又二十分之十一以益寳泉也其寳泉只一分母故不用乗併乃列位如法乗減中位餘二分為法下位餘一百二十六貫為實法除實得六十三貫為寳源局二十分之一分以分母二十乗之得一千二百六十貫為寳源數以寳源數異加正四十二貫共一千三百二貫即寳泉局三分之二也于是以分子之二除以分母三乗得一千九百五十三貫為寶泉數置寳源數四因五除之得一千八為五分之四又置寶源數三因四除之得九百四十五為四之三併兩數亦恰得一千九百五十三貫如寳泉數以加寳泉是為寶泉者倍也論曰乗得數後寶泉分數同惟右行之寳源多于左行者二分而遂能與寳泉等若左行之寳源少此二分而其少于寳泉者遂一百二十六貫然則此一百二十六貫者正是寳源之二分矣知分數即知全數知寳源即知寳泉此二則皆化整為零而分母不同也今有貨泉刀貝四種之幣各不知數但云泉八之一兼刀布七之二則如貨數也若刀布七之三兼貝六之四則其數如泉也若貝六之五又外加數八千九百七十則如刀布也若貨數自加九之一則其數如貝也問本數各㡬何畣曰貨五千一百三十泉九千六百八十刀布一萬三千七百二十貝五千七百法以各分母通其原數然後以正負列之貨分母九泉分母八刀布分母七貝分母六丁行貨合數一又九分之一共十是為九分之十凡全數帯分者準此先以甲行貨正九分為法徧乗丁行得數又以丁行貨負十分為法徧乗甲行得數因首位異名故變一行以相從而以丁從甲乃以甲丁兩行得數相減貨同減盡甲行泉負十分刀布負二十分皆無對不減丁行貝負五十四分亦無對不減下適足無乗無減仍為適足乃以泉刀同名在甲行者為一類貝同名在丁行者為一類分正負重列而求之丁行之負甲行之正也因餘行已無貨位當以泉為乗法尋乙行中有泉徑用與減餘相對如法徧乗得數乃相減併泉同減盡刀布異併得正一百九十分貝同減餘負三百九十二分以減餘為主命其正負而重列之因餘行又已無泉當以刀布為乗法尋丙行有刀布徑用與減餘相對上中下如法徧乗得數刀布同減盡貝同減餘一千七百九十四分為法正一百七十萬四千三百無減就為實法除實得九百五十為負之一分以丙行貝之五分該四千七百五十異加正八千九百七十共一萬三千七百二十為刀布原數以刀布分母七除原數得一千九百六十為刀布之一分以刀布之三分該五千八百八十貝之四分該三千八百併之得九千六百八十為泉數用乙行也以泉分母八除泉數得一千二百一十為泉之一分以泉之一分加刀布之二分三千九百二十共五千一百三十為貨數用甲行也以貨分母九除貨數得五百七十為貨之一分以貨數加一分共五千七百為貝數用丁行也甲丁兩行乗減論曰既互乗則甲丁之貨等而甲行之泉若刀布及丁行之貝又各與其首位之貨等則甲之泉若刀布必與丁之貝等也故對減去貨而徑以甲之泉若刀布與丁之貝分正負而命之適足也此即西學中比例之理然方程中自有之且簡快如此乙行減併論曰左右兩行之正負皆適足若于右正數内減左正右負數内減左負其所餘者亦必適足也今右正内既減去同名之泉右負内又減去同名之貝而左負内有刀布不與右同名不能相減故反用以加加則正數多正數多則負數少而其數亦必適足矣又論曰隔行之異名乃同名也今兩行之正與負既皆適足若以左之正泉益右之負貝而共為負以左之負刀布貝益右之正泉刀布而共為正則亦適足也于是以兩者右泉刀布左刀布貝為一類左泉右貝為一類對減其相同之物泉各減八十分貝各減四十分則其所餘之物必亦適足也左右刀布為正右貝減餘為負又論曰右行刀布正數也正多于負之數也左行刀布負數也正少于負之數也合此二數則是右正之多于左正者此兩行之刀布也然刀布之數右正雖多于左正而貝之數右負亦多于左負故兩行皆適足也然則右正之所多與右負之所多亦必相當適足矣丙行乗減論曰刀布本同惟右之貝多于左右之貝多則左之貝少左之貝少則刀布多矣然則左之刀布布獨有盈數者正是此相差之貝也此亦化整為零而又有整帯零四色有空之例也問品官月俸六品為五品八之五七品為六品四之三八品為七品十五之十三九品為七品十五之十一倍九品加八品六品七品各一則如五品之倍數而多三石各若干法以分母各通其原數而正負列之五品通為八六品通為四七品通為十五八品九品以全數原無分母故也五品倍則為十六先以甲行五品十六分遍乗乙行五品六品得數餘空位無乗次以乙行五品五分遍乗甲行得數乃對減五品各八十分同名對減盡六品同名對減餘四十四分乙行之負物也為乙類七品八品九品并禄米較數皆無對不減皆甲行之負物負數也為一類分正負列之與丙行相對如法以減餘六品分遍乗丙行六品七品分得數餘空無乗又以丙行六品分遍乗減餘得數乃以對減六品得數各一百三十二分同名減盡七品同名減餘四百三十五分丙行之負物也自為一類其餘三位無減皆減餘之負物負數也共為一類分正負列之與丁行相對又因丁戊兩行皆有七品是多一算也乃更置之以八品列首位上中下如法以丁行八品負一遍乗減餘皆如故首行同名故兩行之正負亦皆不變又以減餘八品負十五分遍乗丁行八品七品得數乃對減八品同減盡七品同減餘二百四十分右行之正物也為一類九品三十無減禄米四十五石亦無減皆右行之負物負數也同名共為一類乃分正負重列之與戊行相對如法以左右七品分互遍乗得數首行同名故兩行之正負皆不變七品同減盡九品同減餘九十為法祿米四百九十五石無減就為實法除實得五石五斗為九品月俸置九品俸以相當之七品之十一分除之得五斗為七品月俸十五分之一而以與八品相當之十三乗之得六石五斗為八品月俸又以七品之分母十五乗其一分得七石五斗為七品月俸又置七品俸以相當之六品之三分除之得二石五斗為六品四之一而以其分母四乗之得十石為六品月俸置六品俸以相當之五品之五分除之得二石為五品八之一而以其分母八乗之得十六石為五品月俸計開五品毎月十六石六品毎月十石七品毎月七石五斗八品毎月六石五斗九品毎月五石五斗論曰此所列有二種六品通為四分者問原云四之三是可以四分者也七品通為十五分者原云十五之十三之十一是可以十五分者也五品通為十六分者原云八之五是可以八分者也又倍之而十六則為八分者二矣此皆以分立算化整從零之法也八品則只是原數九品亦是原數而又有倍數然只是原數之倍非如五品倍其分也此兩者皆不用分只用整合而言之乃零整雜用之法也零與整雜似不倫矣然乗除得數則同但用分者所得數亦為一分之數故必以分母乗之乃合原數而其原不用分者得即原數更不湏乗能知此理則用分無誤矣甲乙兩行論曰兩行正數内五品本同而甲有負多于正之較乙則無有是此較數乃甲負多于乙負之較也于是以兩負相減以去其同之分而觀其所不同之處則甲有諸品而乙惟六品之減餘然則甲負之獨多此較者乃甲諸品多于乙六品減餘之較矣丙行乗減論曰兩得數對減而六品減盡是其數同也其與六品為正負者又減去相同之七品分而左仍餘七品之餘分右仍餘諸品之全分則是兩行諸數皆同而惟此二者有差也然則右之獨有盈于六品之較者正此二者之差數也丁行論曰兩行對減而于負數内減去相同之八品惟餘九品于正數内減去相同之七品分惟餘七品之餘分然則右行負數獨有盈于正數者正是右行九品與其七品餘分之較也何也與之對減者乃左行適足之數故于較數無闗也重列三次皆然戊行論曰右行内減去左行適足數惟餘九品數則其下盈數必所餘九品之數也此條逓減歸一其理較明學者翫之此零整雜列也亦五色方程有空例也有減無併可悟偶加竒減之非問有物一百七十四以三人分之乙所分如甲七之三仍不足單六丙所分如乙七之三而多二數各幾何畣曰甲數一百一十二乙數四十二丙數二十甲數三因七除得四十八多于乙數六乙數三因七除之得十八少于丙數二法列位以甲乙分母七化整為零丙無分仍用整乙之三分正丙一負負二此行無甲數存與減餘重列此三色有空先以和較雜法用兩行甲互遍乗之和數甲全分七乗較行得數依其正負以較數甲正三分乗和行得數從乗法皆命為正甲各二十一分同減盡乙異併七十分正丙三無減正下數同減餘四百八十正皆同名不分正負以和數重列與第三行較數求之上中下如法互乗減併乙同減盡丙異併七十九為法下數異併一千五百八十為實法除實得二十為丙數丙數同減負二得一十八為乙七之三乃以三分除之得六為乙七之一以分母七乗之得四十二為乙數乙數異加正六共四十八當甲七之三乃以三分除之得十六為甲七之一以甲分母七乗之得一百一十二為甲數此亦零整雜用之法也若依變零從整法則以分子母倒位列之其正負以分母乗之乃與和數列而求之論曰倒位何也非倒位也分母遍乗則然也以分母七乗子三而皆七之則為三分者七為三分七是為全全數者三矣而其所當者全數也七之則為全數者七矣是乙以全數當甲七之三者七乗之則七乙當三甲也故如倒位然皆全數也非分也故非倒位正負亦分母乗何也乙一當甲七之三而少六則七乙當三甲而共少七个六為四十二也丙一當乙七之三而多二則七丙當三乙而共多七个二為十四也如法以前兩行遍乗減併又重列之與第三行遍乗減併乙減盡丙異併七十九為法下數異併一千五百八十為實法除實得二十為丙數七因丙數得一百四十同減負十四餘一百二十六以乙三除之得四十二為乙數七因乙數得二百九十四異加正四十二共三百三十六以甲三除之得一百一十二為甲數此變零從整而分母同者也亦有分母不同但取其本一行中所用之分母遍乗本行以為用不必齊同如後條問有數不知總以三人分之亦不知各所分之數但云甲如乙丙共數二之一乙如甲丙三之二丙如甲乙四之三而不足四又四分之一總數分數各幾何畣曰總數十五甲五乙六丙四乙丙共十其二之一則五如甲甲丙共九其三之二則六如乙甲乙共十一其四之三則八义四之一以丙相較不足四又四之一也法曰此各行分母不同如甲有三之二又有四之三乙有二之一又有四之三丙有二之一又有三之二皆有兩分母宜用變零從整之法以不同同之用分則不同變而用整則不同而同矣以分母各遍乗其本行而列之右行分母二中行三左行四如法互乗減併以三色較數變為二色而重列之雖減併不同皆仍為較數不變宜翫如法互乗乙同減盡丙同減餘負三十四為法正一百三十六無減就為實法除實得四為丙數六乗丙數得二十四以相當適足之四乙除之得六為乙數以原列右行乙丙各一共十以相當適足之甲二除之得五為甲數論曰甲為乙丙二之一則是二甲當一乙一丙也皆二因之也乙為甲丙三之二則是三乙當二甲二丙也皆三因之也丙為甲乙四之三而不足四又四之一則是四丙以當三甲三乙而不足十七也皆四因之也甲乙丙各有兩分母若化整為零當以分母矣相乗為原數母互乗子為所用之分殊多事二因甲得二二因乙丙二之一得乙丙各一三因乙得三三因甲丙三之二得甲丙各二四因丙得四四因甲乙四之三得甲乙各三四因正四又四之一得正十七以一丙與甲乙四之三較不足四又四之一若以四丙與四个甲乙四之三較亦不足四个四又四个四之一是為十七問有數九百六十以四人差等分之乙與甲如二與八丙與乙如三與七丁與丙如四與六各幾何畣曰甲六百七十二乙一百六十八丙七十二丁四十八法以共數命為和相當數命為較依和較襍法列之乙二而甲八是乙得甲八之二故八乙可當二甲也丙三而乙七是丙得乙七之三故七丙可當三乙也丁四而丙六是丁得丙六之四故六丁可當四丙也推此知二八三七四六各種差分皆可以方程御之首次兩行如法互乗減併訖重列之取出第三行與之為耦如法減併訖又重列之兩次減餘皆和數可見立負之非又取末行與之為耦而列之如法乗丙減盡丁併得四百八十為法正二萬三千四十無減就為實法除實得四十八為丁數六因丁數得二百八十八以相當之四丙除之得七十二為丙數七因丙數得五百四以相當之三乙除之得一百六十八為乙數八因乙數得一千三百四十四以相當之二甲除之得六百七十二為甲數試以甲併乙共八百四十以八因之得甲數若二因亦得乙數是乙數甲二八差分也試以丙併乙共二百四十以七因之得乙數若三因亦得丙數是丙與乙三七差分也併丙丁共一百二十以六因之得丙數若四因亦得丁數是丁與丙四六差分也又試以八除甲數得八十四以二除乙數亦得八十四若以八十四除甲數必得八以八十四除乙數必得二也又試以七除乙數以三除丙數皆得二十四若以二十四除乙數必得七除丙數必得三也以六除丙數以四除丁數皆得十二若以十二除丙數必得六除丁數必得四也問有數七百四十一以四人分之乙于甲為三之二丙于乙為五之三丁于丙為七之五各㡬何畣曰甲三百一十五乙二百一十丙一百二十六丁九十法曰乙得甲三之二是三乙當二甲也丙得乙五之三是五丙當三乙也丁得丙七之五是七丁當五丙也故皆命以適足而列之先以孟仲兩行如法互乗減併訖列其餘數取出叔行相對如法減併又列其餘與季行相較如法減併丁二百四十七為法正二萬二千二百三十為實法除實得九十為丁數七因丁數五除之得一百二十六為丙數五因丙數三除之得二百一十為乙數三因乙數二除之得三百一十五為甲數問有數七百四十一以四人分之乙如甲三之二丙如甲五之二丁如甲七之二各幾何因前問中有疉數故作此問以互明之乙三當甲二而丙五又當乙三是丙五亦當甲二也丙五當甲二而丁七又當丙五是丁七亦當甲二也又丁七亦當乙三今云兩者以甲為主也在西法謂之連比例上中下首行互乗次行如故次行乗首行皆二之甲減盡乙異併得五正丙二正丁二正正一千四百八十二皆無減皆仍為和同名在一行故也次行乗三行因兩首位同不用乗竟以對減甲減盡乙三次行負也丙五三行負也皆無減命為正負適足同名在兩行故為較數三行末行首位亦同亦徑減甲減盡乙空丙五三行負也丁七末行負也皆亦無減命為正負適足亦同名在兩行乃以減餘重列之如三色有空之法如法減併得二百四十七為法二萬二千二百三十為實法除實得丁數以次求得甲乙丙數皆如前問之數問有米三百八十五石五斗二升令二等人户以四六差分出之甲上等二十六户乙下等四十户下户出率則如上户六之四畣曰上户各七百三斗二升二十六户共一百九十石三斗二升下户各四石八斗八升四十户共一百九十五石二斗法以和較列位如法互乗得四甲同減盡乙異併三百一十六户為法米一千五百四十二石八升無減就為實法除實得四石八斗八升為下等戸則例以下等六户乗其則例得二十九石二斗八升以相當之上等四户除之得七石三斗二升為上等户則例問有米三百一十七石給與四色人户甲二十户乙三十户丙四十户丁五十户丁每户如丙户七之三丙每户如乙户六之四乙毎户如甲户八之二各幾何畣曰甲每户八石四斗二十户共一百六十八石乙每户二石一斗三十户共六十三石丙每户一石四斗四十户共五十六石丁每户六斗五十户共三十石法列位首行甲二十户十倍於次行甲正二但以首行甲退一位作二則齊同矣甲退十為單其下各位皆退十為單即如互遍乗而可以對減矣乃以減併之餘重與第三行列之又以減併之餘重與第四行列之依法求得六百三十四為法三百八十石四斗為實法除實得六斗為丁户則例七因丁則得四石二斗丙三除之得一石四斗為丙則六因丙則四除之得二石一斗為乙則四因乙則得八石四斗為甲則此條有省算法說見後卷此上數條皆變零從整法也有兩數相較而為十之八十之七者即非二八三七差分也有二例見末卷瓔珞方程例瓔珞者言其聨綴而垂象瓔珞也謂之疉脚凡算方程皆以多色逓減至一法一實以先知一色之數然此所先求之一色却原帶有不同之數則法一而實非一故以一總法而除多實非疉脚之法不可也亦有以下為法上為實者則實一而法有多名在合問者之所求而定之詳刋誤條今有大江南北兩處糧艘載米不同因氷程逺近給耗米亦不等但云南船三隻北船兩隻共運米一千九百七十石外給耗米共六百六十八石又南船一隻北船四隻共運米一千九百九十石外給耗米五百五十六石問各船正耗米數以便稽核畣曰北船每隻正運米四百石給耗米一百石共正耗米五百石每正米一石耗米二斗五升南船每隻正運米三百九十石給耗米一百五十六石共正耗米五百四十六石每正米一石給耗米四斗法各列位先以左行南船一遍乗右行各得原數次以右行南船三遍乗左行得數南船三與右減盡北船十二減去右二餘十隻為總法正運米五千九百七十石減去右一千九百七十石餘四千石為運米實耗米一千六百六十八石減去六百六十八石餘一千石為耗米實以總法除正運米實得四百石為北船每隻運數以總法除耗米實得一百石為北船每隻耗米數總計正耗得北船毎隻米五百石任于左行總運米一千九百九十石内減北船四隻該運米一千六百石餘三百九十石為南船一隻運數一故不除運或于右行運一千九百七十石内減北船二隻八百石餘一千一百七十石以南船三隻除之亦得三百九十石于左行總耗米五百五十六名内減北船四隻該耗四百石餘一百五十六石為南船一隻運數或于右行耗六百六十八石内減北船二隻耗二百石餘四百六十八石以南船三隻除之亦得一百五十六石總計正耗得南船每隻米五百四十六石以北船四百石除其耗米一百石得每石給耗米二斗五升以南船三百九十石除其耗米一百五十六石得每石給耗四斗此問每船米數故以船為法米為實若問每米一萬石該用幾船則以減餘船十隻用異乗同除以一萬乗得十萬為總船實以運米減餘四千石為法法除實得二十五為每運米一萬石用北船之數于是任以右行北船二隻亦用異乗同除以一萬石乗之二十五船除之得八百石以減共米一千九百七十石餘一千一百七十石又用為法以右行原列南船三乗一萬石得三萬石為實法除實得二十五隻又三十九分之二十五為每米一萬石用南船之數若問耗米給過五千石該得幾船者則亦用異乘同除以五千石乘減餘十隻為北船實以減餘耗米一千石為法除實得五十隻為每耗米五千石給北船之數任以右行北船二隻五千石乘之五十隻除之得二百石以減共耗六百六十八石餘四百六十八石又用為法以原列南船三乘五千石為實法除實得三十二隻又三十九分之二為每耗米五千石給南船之數假如有南運艘二隻以比北三隻則南船運米不及北四百二十石其南船帶耗米反多于北一十二石若以南船三當北船五則南船運米不及北八百三十石其耗米亦不及北三十二石問各幾何法以正負列位上中下如法乗減餘北船一隻為總法運米同減餘四百石為運米實即為北船每隻運數總法一故不除下同耗米異併得一百石為耗米實即為北船每隻耗數任以右行北船三乗其運數得一千二百石同減負四百二十石餘七百八十石以南船二除之得三百九十石為南船運數以右行北船三乗其耗數得三百石異加正十二石共三百一十二石以南船二除之得一百五十六石為南船耗數若問毎米一萬石須幾船運者則以減餘北船一以一萬石乘之為船實以減餘四百石為運米法法除實得二十五隻為北船每運一萬石之數又以一萬石任乗右行北船三以二十五隻除之得一千二百石同減負四百二十石餘七百八十石又為法以一萬石乘南船二為實法除實得二十五隻又三十九分船之二十五為南船毎運一萬石之數若問耗米五千石該給幾船者則亦以五千石乘減餘北船一隻為船實以減餘一百石為耗米法法除實得五十隻為北船耗米五千石之船數又以五千石乗右行北船三以五十隻除之得三百石異加正十二石共三百一十二石又為法以五千石乗南船二為實實如法而一得三十二隻又三十九分船之二為南船耗米五千石之船數此因耗米與正運不同故也若耗米亦以一萬石為問則北船之實皆同今有墨一百二十七錠研六十六枚給與修史局六十人校書局六十三人又有墨五十八錠研三十二枚給與修史局二十四人校書局四十二人問各㡬何畣曰史局每人墨一錠又六分之四六人十錠也研四分之三四人共三研校書局毎人墨七分之三七人共三錠研三分之一三人共一研法各列位如法乗減餘校書一千八人為總法墨餘四百三十二為墨實研餘三百三十六為研實以總法除墨實得七分之三為校書局給墨數七人得墨三錠就以七人除右行校書六十三人以墨三錠乘之得二十七錠以減總給一百二十七錠餘一百錠以史局六十人除之得一錠又六分之四六人得四錠并整數為六人十錠為史局給墨數又以總法除研實得三分之一為校書局給研數三人共一就以三除校書六十三人得二十一研以減總給研六十六餘四十五研以史局六十人除之得四分之三四人三研為史局給研數問修艌船隻内有舊船二隻新船一隻共用桐油二百六十斤麻一百三十斤釘十七斤石灰二百一十斤計工兩月有半又舊船一隻新船三隻共用桐油二百八十斤麻一百四十斤釘十六斤灰二百三十斤工兩月有半其新舊船各㡬何畣曰每新船一隻用桐油六十斤麻三十斤釘三斤灰五十斤每工一月修兩隻每舊船一隻用桐油一百斤麻五十斤釘七斤灰八十斤每工一月修一隻法各列位先以左舊船一遍乗右行如故次以右舊船二遍乗左行得數乃相減上位舊船對減盡中位新船減餘五為總法下位油相減餘三百斤為新船油實以總法除之得六十斤為新船油數麻相減餘一百五十斤為新船麻實以總法除之得三十斤為新船麻數釘相減餘一十五斤為新船釘實以總法除之得三斤為新船釘數灰相減餘二百五十斤為新船灰實以總法除之得五十斤為新船灰數任以左行新船三隻乗其油數得一百八十斤以減總油二百八十斤餘一百斤為舊船一隻油數以新船三隻乗其麻數得九十斤以減總麻一百四十斤餘五十斤為舊船一隻麻數以新船三隻乘其釘數得九斤以減總釘一十六斤餘七斤為舊船一隻釘數以新船三隻乘灰數得一百五十斤以減總灰二百三十斤餘八十斤為舊船一隻灰數此為以船求油麻等故以船為法以麻油等為實乃以減餘新船五隻為總實以減餘工兩月半為法法除實得二隻為每工一月修新船之數就以二隻除左行新船三隻得一月有半以減總工兩月半餘一月以除舊船一隻如故得每工一月修舊船一隻此以工求船故以工為法船為實與前相反重審方程例凡算方程皆以有總數無各數故逓減以求之然有并其總數亦隠者此當用兩次求之故曰重審假如品官祿米不知數但云甲支三品俸四个月又帶支四品俸五个月乙支三品俸六个月又帶支四品俸五个月亦不知甲乙各得數但云以甲十三分之一益乙則三百五十石若以乙十一分之三益甲亦三百五十石問兩品禄米各幾何荅曰三品毎月俸三十五石四品每月俸二十四石法曰此當先求出甲乙兩家支過禄米再求各品月俸謂之重審先以帶分法列位上中下左甲之一分遍乗右行如故右甲之十三分遍乗左行得數甲減盡乙減餘一百四十分為法餘俸四千二百石為實法除實得三十石為乙之一分以乙分母十一乗其一分得三百三十石為乙支過米數以乙支過米數減總三百五十石餘二十石為甲之一分以甲分母十三乗其一分得二百六十石為甲支過米數既得兩家支過米數乃重列之以求品俸如法左右乗減餘四品十月為法餘俸米二百四十石為實法除實得二十四石為四品每月俸以四品五月計一百二十石減甲支二百六十石餘一百四十石以甲支三品四月除之得三十五石為三品每月俸假如品官支俸本折兼支不知數但云甲支一品俸四个月又帶支二品俸五个月乙支一品俸六个月又帶支二品俸十个月亦不知甲乙支過數但云取乙本色三分之一以益甲共五百六十六石若取甲本色三分之二以益乙則八百六十五石取乙折色五分之二以益甲共四百九十八石若取甲四分之一以益乙則五百七十九石問各幾何畣曰一品月俸八十七石内實支本色一半四十三石五斗折色鈔一半數同二品月俸六十一石内實支本色六分三十六石六斗折鈔四分二十四石四斗法當重審先求本色依帶分法列位上中下如法乗減餘乙之七分為法餘本色一千四百六十三石為實實如法而一得二百九石為乙本色之一分以減右行共本色五百六十六石餘三百五十七石為甲支過本色數又以乙分母三乗其一分得六百二十七石為乙支過本色數計開甲支過本色三百五十七石内一品俸四个月二品俸五个月乙支過本色六百二十七石内一品俸六个月二品俸十个月次求折色亦依帶分列位如法左右乗減乙餘十八分為法餘折色一千八百一十八石為實法除實得一百一石為乙折色之一分以乙分母五乗之得五百五石為乙支過折色數以乙之二分乗其一分得二百二石以減共折色四百九十八石餘二百九十六石為甲支過折色數計開甲支過折色二百九十六石内亦一品俸四个月二品俸五个月乙支過折色五百五石内亦一品俸六个月二品俸十个月既得甲乙兩家支過本折然後乃求各品月俸依疊脚法列其所得本折而重測之如法遍乗得數上位一品減盡中位二品餘十个月為總法下位本色餘三百六十六石為本色實折色餘二百四十四石為折色實乃以總法除本色實得三十六石六斗為二品毎月俸本色數以乙二品十个月計三百六十六石減乙共本色六百二十七石餘二百六十一石以乙一品六个月除之得四十三石五斗為一品月俸本色又以總法除折色實得二十四石四斗為二品月俸折色以乙二品十个月計二百四十四石減乙共折色五百五石餘二百六十一石以乙一品六个月除之亦得四十三石五斗為一品月俸折色其右行亦可互求則先得甲數也于是以一品本色折色併之得每月俸八十七石本折各半支以二品本折併之得毎月俸六十一石四六支本色六分折色四分厯算全書卷四十一
