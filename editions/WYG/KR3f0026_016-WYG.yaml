body:
  text: 厯算全書卷十六宣城梅文鼎撰五星紀要論五星嵗輪五星與日皆東岀而西沒宗動天之所運也土木火三星在太陽上而近宗動故其左旋速于日毎日有所差之分即嵗輪心之平行也五星與太陽有定距嵗輪心旣為宗動所掣漸離太陽而西則星不得不自嵗輪之中線即平行度漸移而東以就日而星旣在日之上亦即不得不自嵗輪之頂漸移而下以就日也旣漸移而東又漸移而下則不能平轉而成環行嵗輪之圓象成矣嵗輪心正在太陽之上星又在嵗輪之頂作直線過嵗輪心以過太陽之心而指地心是為合伏合伏以後星在嵗輪上東移有類平轉故其東移速古謂之疾段嵗輪心離日漸逺星在嵗輪離合伏之度亦漸逺而向下行則東移之度漸遲古謂之遲段嵗輪心離日至一象限星在嵗輪直向下行人自地觀之不見其動古為留段過此留段輪心距太陽益逺將至半周星行嵗輪之底轉成向西行是為退叚輪心與日冲星正居輪底自輪心作線過星以過地心而直射太陽之心亦為一直線是為退冲未至日冲皆為晨見冲日以後則為夕見夕見者西與日近東與日逺輪心反在日後而西行追日日在西星在東星不得不自輪底西移而就日故仍為退段輪心西距日益近則星漸西而亦漸上行以就其距日之定距星旣在輪邊與輪心亦有定距則其西移過半象限不得不轉而上行矣至于西距日一象限上行之勢又直人自地觀之亦不見動古亦謂留段過此而輪心距日益近則星亦在輪上漸向東行以就合伏之度以就其距日之常度於是又見其東移之速而至于合伏古亦謂疾段是為嵗輪之周論上三星圍日之行左旋問古以七政右旋宋儒以七政周天左旋今以七政恒星皆為一日一周之天所掣而西發明宋説謂右旋之度因左旋而成可謂無疑義矣兹論七政新圖以太陽為心而復謂上三星左旋與金水異何居曰左旋有二前所論七政左旋以地為心者也今上三星左旋以太陽為心者也五星旣為動天所轉而成左旋一日繞地一周之行又依嵗輪而右旋以本輪上定度為心此五緯之所同也然嵗輪上實行之度與太陽相直有定距則仍以太陽為心又成圍繞太陽之行矣金水二星即以太陽為嵗輪或伏見輪之心故嵗輪即圍日之行嵗輪右旋故其圍日之行亦右旋也上三星則嵗輪不以太陽為心但其距日有定度而又成圍日之形以嵗輪上度言之仍是右旋與金水同以圍日之形言之則是左旋與金水異矣五星與日皆為動天所轉繞地左旋但上三星之左旋速於日故合伏之後即在日西以右旋言為星不及日以左旋言為星過于日冲日之後乃在日東以右旋言為日逐星以左旋言則為星逐日是不特其平行繞地者為左旋而其距日有常以成圍日之形者亦左旋也金水之左旋與日等故合伏之後在日東退合之後在日西則是平行繞地者均為左旋而其圍日之行則右旋也故曰上三星左旋與金水異者主乎圍日以為言者也然則嵗輪之度又何以同為右旋乎曰視行之法逺則見遲近則見疾上三星之左旋雖速于日而在嵗輪上半則見過日之度稍遲下半則見過日之度加速矣金水之左旋雖與日等而在嵗輪上半較日距地為逺則見左旋遲于日下半距地近則見右旋速于日夫上半左旋遲則右移反速下半左旋速則右移反遲而成留退此所以嵗輪上度五星皆為右旋也然五星嵗輪所以有在上在下之分者則以與太陽有定距也因其與日有定距所以能成嵗輪上周轉之行因其在嵗輪上周轉而行所以與日有定距楊學山曰上金水左旋右旋之論猶仍厯書之説以伏見輪同嵗輪後言伏見輪乃繞日圓象金水另有其嵗輪乃勿庵晚年新説耳論五星以日為心之圖法曰上三星其圍日之圏左旋下二星其輪右旋皆以從宗動而西運之行為主論左旋則星之退行乃其行速假如上三星合伏時在太陽之上及其毎日左旋一周則星行過日若干分而在日西然其旋也距地則漸近其所以低者以就太陽也自此左旋之周益多則其離日而西之度亦漸逺而益旋益低比至在日西滿半周而冲日則其旋益近地所以然者因在日冲故必下行嵗輪之底以就日也冲日以後其左旋之行轉在日東隨日之後而向日行其旋亦自冲日卑處漸向于髙離冲日若干分則其旋漸髙亦若干分自此在日後左旋追日而益近之以復至合伏則其旋益髙而復在太陽之上矣是故上三星之能為圍日之圏者以左旋言也惟以左旋言之則無論冲合之在恒星何度亦無問各星之冲合各有周率經厯之時日幾何而其以日為心悉同一法也其下二星以嵗輪圍日其理易明然亦是與太陽同為一日一周之左旋而星之左旋遲于日故合伏時在太陽上毎左旋一周則星不及日若干分度而在日東其行亦漸降至於夕留之後又復漸速而追日其度益降至退合伏而極乃復離日而西度亦漸升而復于合伏矣地谷曰日之攝五星若磁石之引鐵故其距日有定距也惟其然也故日在本天行一周而星之升降之跡亦成一圓相厯家因取而名之曰嵗輪也是故上三星嵗輪約畧皆與太陽天同大而今其徑有大小者各以其本天半徑為十萬之比例也地谷新圖其理如此不知者遂以圍日為本天則是嵗輪心而非星體失之逺矣宗動天左旋星與太陽皆從之左旋而有遲速以其所居有髙下離動天有逺近也上三星在日天之上近於動天故其毎日左旋比日為速雖不能與恒星同復故處而所差甚㣲土星只二分竒木星只五六分火星只半度不能若太陽之毎差一度也論五星本天以地為心問五星之法至西厯而詳明然其舊説五星各一重天大小相函而皆以地為心其新説五星天雖亦大小相函而以日為心若是其不同何也曰無不同也西人九重天之説第一重宗動天次則恒星又次土星次木星次火星次太陽次金次水次太隂是皆以其行度之遲速而知其距地有逺近因以知其天周有大小理之可信者也星之天有大小既皆以距地之逺近而知則皆以地心為心矣是故土木火三星距地心甚逺故其天皆大於太陽之天而包于外金水二星距地心漸近故其天皆小於太陽之天而在其内為太陽天所包是其本天皆以地為心無可疑者惟是五星之行各有嵗輪嵗輪亦圓象五星各以其本天載嵗輪嵗輪心行於本天之周星之體則行於嵗輪之周以成遲疾留逆嵗輪心行于本天周皆平行也星行于嵗輪之周亦平行也人自地測之則有合有冲有疾有遲有留有逆自然之理也若以嵗輪上星行之度聨之亦成圓象而以太陽為心西洋新説謂五星皆以日為心盖以此耳然此圍日圓象原是嵗輪周行度所成而嵗輪之心又行于本天之周本天原以地為心三者相待而成原非兩法故曰無不同也上三星在嵗輪上右旋金水在嵗輪上左旋皆挨度平行夫圍日圓象既為嵗輪周星行之跡則遲留逆伏之度兩輪皆有之故以嵗輪立算可以得其遲留逆伏之度以圍日圓輪立算所得不殊立法者溯本窮源用法者從簡便算如厯書上三星用嵗輪金水二星用伏見輪皆可以求次均立算雖殊其歸一也或者不察遂謂五星之天真以日為心失其指矣夫太陽去地亦甚逺矣五星本天旣以地為心而又能以日為心將日與地竟合為一乎必不然矣厯指又嘗言火星天獨以日為心不與四星同予嘗斷其非是作圖以推明地谷立法之根原以地為本天之心其説甚明其金水二星厯指之説多淆亦乆疑其非今得門人劉允恭悟得金水二星之有嵗輪其理的確而不可易可謂發前人之未發矣論伏見輪非嵗輪問金水二星之求次均也即遲疾留逆用伏見輪厯指謂其即嵗輪其説非歟曰非也伏見輪之法起于回厯而歐邏因之若果即嵗輪何為别立此名乎由今以觀盖即嵗輪上星行繞日之圓象耳王寅旭書亦云伏見輪非嵗輪然則伏見輪旣為圍日之跡上三星宜皆有之何以不用而獨用之金水曰以其便用也盖五星行于嵗輪起合伏終合伏皆從距日而生故五星之嵗輪並與日天同大而嵗輪之心原在本天周故其圍日象又並與本天同大上三星之本天包太陽外其大無倫又其行皆左旋所以左旋之故詳其後論頗費觧説故只用嵗輪也至于金水本天在太陽天内伏見輪既與之同大又其度順行故用伏見輪亦即繞日圎象若用嵗輪則金水之嵗輪反大于本天以嵗輪與日天同大故皆大于本天故不用嵗輪非無嵗輪也承用者未能深考立法之根輙謂伏見輪即嵗輪其説似是而非不可不知也伏見亦起合伏終合伏有似嵗輪然嵗輪之心行于本天之周而伏見輪以太陽為心故遂以太陽之平行為平行皆相因而誤者也論五星平行然則金水既非以太陽之平行為平行又何以求其平行曰嵗輪之心行于本天是為平行乃實度也實度者周度也以本天分三百六十度而以各星周率平分之則得其毎日平行如土星二十九年竒而行本天一周則二十九日而行一度毎日平行二十九分度之一是為最遲木星十二年周天毎日平行約為十二分度之一火星二年周天約為毎日平行半度金星二百二十餘日周天約毎日平行一度半强水星八十八日竒而周天約毎日平行四度皆平行實度若嵗輪及伏見輪雖亦各分三百六十度亦各有其平行然而非實度也既非本天上平行之度又非從地心實測之平行度乃各星之離度耳因此離度下文詳之用三角法從地心測之則得其遲留伏逆之狀亦為實度矣此實度不平行與本天之平行實度不同本天之度平行實度也嵗輪及伏見乃離度也離度為虚數故皆以半徑之大小為大小伏見輪上行度與嵗輪同所不同者半徑也伏見之半徑皆同本天嵗輪之半徑皆同日天論離度有順有逆問何以謂之離度曰於星平行内減去太陽之平行故曰離度乃離日之行也以太隂譬之其毎日平行十三度竒者太隂平行實度毎日十二度竒者太隂之離度也於太隂平行内减太陽平行是故金星毎日行大半度竒水星毎日約行三度皆于星平行内減太陽之平行因金水行速其離度在太陽之前乃星離于日之度故其度右旋順行與太隂同法也若上三星則當於太陽平行内減去星行是為離度盖以上三星行遲在太陽之後乃星不及于日之度其度左旋而成逆行與太隂相反然其為離日之行度一而已矣王寅旭五星行度觧謂上三星左旋盖謂此也然竟以此為本天則終非了義論平行有二用而必以本天之度為宗平行者對實行而言也然實行有二一是本天最髙卑之行亦曰實行一是黄道上遲留逆伏實測亦曰視行是二者皆必以本天之平行為宗若金水獨以太陽之平行為平行是廢本天之平行矣又何以求最髙卑乎圍日之輪即伏見輪起合伏終合伏是即古法之合率也本天之行則古法之周率也最髙卑則古法之厯率也又有正交中交以定緯度即如古法之太隂交率也此一法是西法勝中法之一大端是數者皆必以本天取之故不得以圍日之輪為本天厯指言金星正交定於最髙前十六度水星正交與最髙同度其所指皆本天之度非伏見行之度則伏見輪不得為本天明矣今以七政厯徵之不惟最髙卑之盈縮有定度即其交南北亦有定度故金星恒以二百二十餘日而南北之交一終水星則八十八日竒而交終此皆論本天實度原不論伏見行是尤其較著者矣論金水交行非徧交黄道問周雲淵言金水遍交黄道不論何宫今日交有定度何也曰雲淵之説盖因回回厯緯表而誤者也何以言之回回厯以自行度小輪心度立表而定其交黄道之度非以黄道度為主而求其交處也故其所謂宫度者皆小輪之宫度也非黄道之宫度也若謂黄道之宫度而可以徧交將正交之度亦無定在矣又安得謂金星正交在最髙前十六度及水星正交定于最髙同度乎必不然矣正交定度雖出厯書然與回厯原是大同小異今以七政厯攷之金星水星之交周皆有定期金星以二百二十餘日水星以八十八日竒但嵗輪心行至正交即無緯度不論其為合伏為冲退為疾為遲或留也以此而斷其必有本天有嵗輪可以勿疑論金水伏見輪伏見輪即繞日圓象也其半徑與本天等本天上嵗輪心所行之周半在黄道北半在黄道南其勢斜立如太隂之出入黄道為隂陽厯也而星體行伏見輪周其勢亦斜立與之相應故其交角等嵗輪心在正交或中交則星無緯度故伏見輪上亦有正交中交嵗輪心行過正交漸生北緯至離正交九十度則北緯極大如太隂之隂厯半交也古法正交後陽厯中交後隂厯西法則反用其號然其用不殊嵗輪心行過北大距離正交九十度至一百七十九度北緯漸小至中交而復無緯此如太隂之隂厯半周也嵗輪心行本天隂厯半周即星在伏見輪上亦行北半周而其緯在北緯有大小無不與之相似嵗輪心行過中交漸生南緯至離中交九十度南緯極大如太隂之陽厯半交也嵗輪心行過南大距南緯漸小復至正交而無緯如太隂之陽厯半周也即星在伏見輪亦行南半周而南緯之大小一一與本天相似聨正交中交成一線此線在本天必過地心以本天圓面與黄道面斜交相割而成也而在伏見輪亦必過日心以伏見輪之繞日圓象亦與黄道面斜交而半在黄南半在黄北圓面相割成線也以此線為横線而均剖之作十字横線則上下兩端所指並半交大距度矣此伏見輪上十字線之理也伏見輪心即太陽太陽行黄道三百六十度伏見輪亦隨之行一百六十度而十字之形不變此正視之形也又正視圖不能見交角故必以旁視明之伏見輪事事與本天等故以本天明之如圖甲丙乙壬為本天渾員之體因旁視即為本天渾體甲心乙即本天之星道因旁視故前平視之外周躋縮成一直線也心即地心在伏見輪即為太陽又即為正交中交因旁視正交中交過心横線竟㸔成一點丁心癸即本天上黄道圈本天小于黄道然其度一一與黄道相應而成一圈亦因旁視㸔成一直線兩直線相交于心即成緯度角兩直線相交即兩圈相交也亦即為兩圓靣相切兩圓面者一為星道一為黄道在渾體皆成面甲心丁角在黄道北其弧甲丁其正弦甲庚北大距之緯度也甲丁弧雖在本天然即外應黄道緯乙心癸角在黄道南其弧乙癸其正弦乙辛南大距之緯度也乙癸弧在本天外應黄道與甲丁同問何以分南北也曰甲丁與乙癸兩大距弧各引長之成一全圈在本天渾體即外與黄道上過極經圈相應而北心南直線為之軸北即北極南即南極亦與黄道之南北極相應矣甲心線在黄道北即生北緯乙心線在黄道南即生南緯又何疑哉甲心半徑也以旁視故正交後北半周一百八十弧度並躋縮成直線與半徑等乙心之在南亦然然何以謂之大距曰甲丁緯弧與甲心丁角相應為北大緯乙癸弧與乙心癸角相應為南大緯甲㸃乙㸃並居半交故其緯最大其未及半交及已過半交其緯並小南北並同也問緯度即角度也角同而緯有大小何也曰角雖同而邊不同也大距度以半徑為全數其餘各度並皆以正弦當全數假如任舉一度如過正交三十度為戊㸃未至中交三十度亦同其正弦戊心法為甲心全數與甲丁大距之正弦甲庚若戊心正弦與戊子弧之正弦戊巳也戊心巳句股形與甲心庚形相似同用心角而戊心邊正得甲心之半則戊巳亦甲庚之半而戊子弧亦必為甲丁之半矣他皆倣此以上所論皆本天之事然伏見輪之理並無有二故此一圖即可作伏見輪觀其旁視之交角甚明也論伏見輪十字線伏見輪既為繞日員象而生於本天之嵗輪故其面與本天等徑而其斜交黄道之勢亦與本天等夫本天之斜交黄道也半在北半在南惟正交中交二㸃與黄道合聨此二㸃過心是為交線即兩員面相切所成也從交線上中分之作過心十字直線至本天周即大距線也何則黄道面上原有十字線正視之兩線合為一直旁視之則本天直線斜穿而成交角故此直線在本天即為大距線也此直線所指本天之度正在二交折半之中其距最大故即為大距線然則此十字線者固本天所原有而伏見輪之斜交黄道既與本天等則其十字線亦無不等矣伏見輪即為繞日之員象則太陽即輪心太陽行于黄道故伏見心釘于黄道也然其心雖釘于黄道而其面則半在北半在南一定不易任輪心在黄道之何度而其斜交之面總與本天為平行故其交線皆不變其十字大距線亦不變也由是觀之伏見輪亦有二面何則伏見輪之面既斜交黄道與本天之面為平行則其相當之黄道亦即有與伏見輪相應之一圏與黄道面平行而與伏見輪斜交亦如本天之與黄道斜交矣如是則伏見輪之交線常與本天之交線平行不論在黄道上何度分也而伏見輪上之從心所出之十字大距線及所相當黄道上從太陽心即輪心所出之十字線亦與本天心黄道之十字線平行而兩十字線正視之成一直線旁視之一直一斜而成大距之交角亦一一與本天交黄道之角分寸不爽故用伏見即如本天也論伏見輪之所以然伏見輪半在日天外半在日天内其半徑與本天等即星體所行也黄道半徑與金星本天之比例約為十與七二有竒伏見輪以日為心繞日環行與本天周上嵗輪心行度相應故其大相等本天半在黄道北半在其南伏見輪亦然門人劉著云譬如人放紙鳶人在下環行而紙鳶亦在空際環行盖以紙鳶為風所舉不能下而又為線所引不能不環行可謂善於形容故惟本天之度為實度不惟伏見輪為星繞日行之虛跡即嵗輪周上星行之度亦虛設之員周非硬圏有形質也譬如浮屠髙尖有珠如日人持長竿竿上端有微小之珠如金星浮屠之中腰有圓圏梯道斜繞之如金星本天之斜立人行其上如嵗輪心之行于本天周其珠竿直立指天其長也如浮屠尖至其腰圍之心如星在嵗輪周至嵗輪心之徑與日天半徑等兩珠相望有繩繫之其繩常引直而有定距與腰圍斜繞之磴道等如金星繞日有定距與本天半徑相等持竿者循斜梯繞浮屠旋轉平行之則竿上珠自然亦繞尖上大珠旋轉成員象矣此如伏見輪為繞日之員象由是言之可以免嵗輪大小之疑何則嵗輪之心行于本天之周而本天既有髙卑嵗輪心行于髙度則金星在伏見輪者離地逺矣嵗輪心行低度則星在伏見輪者離地近矣近則覺嵗輪之半徑小矣逺則覺嵗輪之半徑大矣若嵗輪為堅靭之物何以能伸屈如此乎更以視法徴之何以在最髙反大在最卑反小乎必不然矣嵗輪之大小又因于太陽髙卑伏見輪既以日為心則太陽行最髙時伏見輪從之亦髙而星去地逺太陽行最卑則伏見輪從之卑而去地近亦遂疑嵗輪之有大小而與視法反若知嵗輪亦非真有輪則羣疑盡釋矣求伏見輪交角伏見輪斜交黄道旣一一與本天等則伏見輪交角與本天交角亦必相等假如本天大距緯度之正弦欲變為伏見輪上大距之正弦法為黄道半徑與本天大距之正弦即本天交角若伏見輪半徑亦即本天半徑與伏見輪之大距正弦也金星本天交角定為三度二十九分水星六度分一黄道半徑全數一二本天交角正弦六七六二伏見輪半徑七二二五一四伏見輪大距緯正弦四三八九王寅旭中緯准分是四三九葢以得數九九七收作一數故也其餘各度並先以全數為一率交角正弦為二率各度正弦為三率得四率為各度緯再以全數為一率各度緯為二率伏見半徑為三率求得四率為各度變率之本緯簡法置交角正弦以各度正弦乘之去末五位又以伏見輪半徑乘之去末五位即徑得各度變率本緯又㨗法黄道半徑為一率大距正弦變率為二率各度正弦為三率得各度本緯為四率假如伏見輪上距交三十度求其本緯一黄半徑全數一二大距正弦變率四三九乘得二一九五三三十度正弦五四三十度本緯二一九五解曰此以變率求變率故徑得本緯不須再變寅旭用中緯准分即此理也求各度正餘弦變率法置各度正餘弦以伏見輪半徑乘之得數去末五位即得變率之正餘弦求金星視緯法水星倣此一求合伏距交法以本日太陽實行在正交後宫度即伏見輪心距交宮度命為合伏距交度解曰凡星合伏必與太陽同度太陽行一度小輪上合伏㸃亦隨之移一度故太陽實行度即輪心而輪心距交必與輪周之合伏距交等角二求星距交法以用日距合伏後日數在位用星離日度三十七分弱為法乘之得離日平行以加合伏距交度為星距交平行度再簡本度盈縮差加減之即加減差從最髙卑起算為星實行距交度分解曰金星之行速于太陽太陽行一度金星行一度三十七分弱有竒故雖與太陽同行而常在前謂之離日度厯書以太陽之行為星平行非真平行故必併此離日度始為真平行星平行在伏見輪周而根本在本天嵗輪心行於本天有髙卑加減古厯謂之盈縮差伏見輪上行旣與本天上嵗輪心行相應則亦必有盈縮加減矣三求兩距交度入隂陽厯及初末限法以兩距交度一伏見輪心距交是黄道上度一星體距交是伏見輪周度並視其在半周以下為入隂厯一二三四五宮滿半周以上内減去半周為入陽厯六七八九十十一宮各視其度在象限以下為初限一二宮為隂厯初限六七八宮為陽厯初限滿象限以上用以減半周餘為末限三四五宮為隂厯末限九十十一為為陽厯末限四求視緯正弦法以星距交正弦用變率及各度本緯變率各自乘實相減得數開方得根以加減黄道正弦即輪心距交度正弦用本數為黄道正弦又自乘之得數以與本緯自乘實相併本緯實即上所求為視緯股實開方得視緯正弦㨗法不必開方只用股實加減例視黄道上輪心伏見輪上星兩距交度同在隂厯或同在陽厯則相加或一在隂厯一在陽厯則相减解曰星距地心線如句股之弦即全數也故亦有其正弦為股餘弦為句五求視緯餘弦法以星距交度餘弦變率加減黄道餘弦用本數與正弦同為視緯餘弦加減例視兩距交度仝在正交邊或仝在中交邊則相加若一在正交邊一在中交邊則相减解曰在正交邊者隂厯初限陽厯末限也隂厯初限為已過正交在正交前一象限也陽厯末限為未到正交在正交後一象限也此兩象限共一百八十度在十字直線之右並于正交為近也在中交邊者隂厯末限為未到中交之度在中交後一象限陽厯初限為已過中交之度在中交前此一百八十度在十字直線之左並于中交為近也又總解曰正弦之加減論隂陽厯以十字横線為斷也餘弦之加減論正中交以十字直線為斷也横線者交線也直線者大距線也正弦線並與大距線平行是各度距交線之數餘弦線並與交線平行是各度距大距線之數于此而知十字綫之為用大也六求星距地心線法以視緯正弦餘弦各自之併而開方得星距地心線七求視緯法以各度本緯變率加五位為實星距地心為法除之得視緯論曰必如此下算則事事有著落視緯得數始真若前緯後緯之表以中分取數加減法雖巧便得數亦恐不真耳假如金星伏見輪心距正交三十度星距合伏三十五度求視緯如圖大圈為黄道小圈為伏見輪輪心在日距正交為井日弧三十度合伏距正交為合正亦三十度星在戊過合伏三十五度距正交為戊正弧六十五度法先用日乙丙丁戊巳兩三角形依變率法日乙與乙丙大緯正弦若丁戊星距交正弦與戊巳緯次用丁戊巳直角形巳為直角戊丁為弦戊巳為勾求得巳丁股次用戊巳癸直角形巳為直角以巳丁股加丁癸丁癸即日壬為輪心距交井日弧正弦共己癸為股戊巳為勾求得戊癸為視緯正弦次以星距交正戊弧餘弦丁日即壬癸也與壬心相加壬心為輪心距交井日弧之餘弦共癸心為視緯餘弦次用戊癸心形癸為直角戊癸為股癸心為勾求得戊心星距地心線末用心戊巳直角形巳為直角心戊與戊巳緯若全數與戊心巳角之正弦求弧得心角視緯度圖内諸三角形俱是立三角須以渾體觀之便明按右法未加髙卑之算盖前緯後緯表原亦未用髙卑也若求宻率仍當以髙卑入算為穏説具後條又按依右法用三角形推算可不必立前後緯表亦不用中分厯書盖以作表故用約法以該之也論大距緯之變率又以髙卑而變大距緯者即黄道交角之正弦金水本天半徑皆小于黄道半徑黄道常為十萬而金星本天半徑得其十之七有竒水星得其十之三有竒故其大距緯亦小于黄道之大距緯而各度從之皆有變率矣然星本天既有髙卑則其半徑亦時有大小而其距緯亦從之有大小變率之法又當以此為準的也準前論在本天最髙則半徑大而伏見輪半徑亦大即距緯亦大矣在最卑則半徑小本天與伏見輪並仝距緯亦小矣皆變率之距緯説者遂謂其與視法之理相反殊不然也何則本緯之變率與視緯之變率不同也本緯在最髙則半徑大本緯亦大在最卑則半徑小本緯亦小乃本天自有之數非闗視法伏見輪上緯仍是本天視緯星距地逺則大緯變小星距地近則小緯變大全係視法從地上看伏見輪上星論黄道亦有半徑之大小黄道半徑常為十萬分全數然黄道旣有髙卑則其半徑必有大小最髙時半徑必十萬有竒最卑時半徑必十萬不足日躔章原有太陽距地髙卑表所當取用者也太陽距地為黄道半徑亦即伏見輪心距地也在上三星用嵗輪即為嵗輪半徑王寅旭曰因黄道之髙卑而嵗輪有大小盖謂此也今按嵗輪與黄道同大厯家筭髙卑或用不同心圏則其距地之數有大小乃是半徑有大小非以此半徑另作一圏也以嵗輪立算乃是數中之象因天運有常故可以輪法測之此可為達者告也論伏見輪半徑亦有大小而本緯因之有大小本天旣有髙卑則半徑有大小而伏見輪並與之等伏見輪半徑旣有大小則其正弦餘弦之變率及大距度之變率與各度之本緯並因之而有大小法以本天髙卑求得各度半徑為伏見輪各度半徑最髙距正交十六度起算就以半徑為法乘各度正弦餘弦去末五位為正弦餘弦變率又以半徑為法乘大距正弦金星大距三度二十九分去末五位為大距變率就以大距變率為法乘各度正弦去末五位為各度本緯以上數端並以最髙變大最卑變小論視緯當兼用兩種髙卑立算準上論黄道半徑有大小伏見輪半徑及正餘弦及本緯並有大小必兼論之則視緯始為宻率法以伏見輪各度正弦變率自乘本緯亦自乘兩得數相減開方求根以加減黄道正弦髙卑所求為正弦又自乘之以併本緯自乘為視緯自乘實即視緯股實又法不用加減但以伏見輪正弦變率為一邊黄道正弦髙卑所算為一邊大距度外角以大距角减半周為一角用切線分外角法求得視緯正弦自乘為股實亦同又以伏見輪餘弦黄道餘弦相加減俱用變率為視緯餘弦又自乘之為句實併視緯股實句實開方得弦即星距地心逺近線也末以星距地心為法本緯變率加五位為實實如法而一得視緯宻率黄道髙卑於太陽實行度取輪心距最髙宫度在正交後若干度起算本天髙卑於伏見輪上星實行度取距最髙宫度距正交十六度起算又按用此宻率當設兩表一伏見輪上各度半徑表以金星髙卑算得其大小一伏見輪上各度大距表即以各度半徑乘大距變率正弦全數除之即得其黄道中各度半徑即用日躔髙卑表不必另作有各度半徑即可求逐度正弦餘弦變率黄道仝有各度大距變率即可求各度正緯以上俱用乘法按金星之最髙不與正交同度相差十六度當於伏見輪上安兩種十字線水星之最髙則與正交同度論金星前後緯表南北之向金星前緯自小輪初宫向北其緯極大為一度二十八分自此漸減至二宫三十度而減盡無緯度即三宫初度自三宫初向南漸有南緯至五宫三十度南緯極大為九度二分即六宫初度自六宫初以後南緯漸減至八宫三十度南緯減盡無緯即九宫初度自九宫初度復向北漸有北緯至十一宫三十度復為一度二十八分即初宫初度據此則金星前緯南緯大北緯小南大緯至九度二北大緯只一度二八而分為四限自合伏至留際乃嵗輪上距合伏九十度亦可名為留際北緯減盡為初限自留際向南至退合南緯至九度二分為南緯極大為次限自退合以後南緯漸減至留際距退合亦九十度南緯減盡為三限自留際復向北至合伏北緯至一度二十八分北緯極大為末限此盖以嵗輪上合伏之時星距地逺故緯度見小退合之時星距地近故緯度見大此前緯是置輪心在正交後大距處而算伏見輪上一周之緯故其南北之向如此金星後緯自小輪初宫初度無緯度自此向北而生北緯北緯之大為二度三十三分在四宫十五度自此漸減至五宫三十度北緯減盡即六宫初度自六宫初度以後向南而生南緯南緯之大亦二度二十三分在七宫十五度又自此漸減至十一宫三十度南緯減盡復至初宫初度據此則金星後緯向南向北分為兩限其增減之分南北相同但有順逆而無大小自合伏始向北而生北緯至距合伏一百三十五度北緯甚大至二度三十三分至距合伏一百八十度北緯減盡而無緯度即退合時其距大緯度相距四十五度是為北緯限自退合後始向南而生南緯至距退合四十五度南緯甚大亦二度三十三分從此漸減至退合一百八十度南緯減盡而無緯度即復至合伏其距南大緯度一百三十五度是為南緯限此後緯是置輪心在正交㸃而算伏見輪上一周之緯故其南北之向若此若水星南北之向俱與金星相反然伏見輪之理則同合前後二緯表觀之距合伏後一象限前後緯宜相加以其同為向北也距退合前一象限前後緯宜相減以前緯已改向南而後緯仍向北也過退合後一象限前後緯又宜相加以前緯仍向南而後緯亦向南也過退合後第二象限即距合伏前一象限前後緯又宜相減以前緯已改向北而後緯仍向南也論金星前後緯加減之法前緯起大距凡言起者即合伏㸃所在自初宫至二宫共九十度為隂厯末限後緯起正交自初宫至二宫共九十度一二宫為隂厯初限雖分初末皆隂厯也故相加前緯過九十度三宫四宫五宫為陽厯初限後緯過九十度三宫四宫五宫為隂厯末限一隂厯一陽厯南北相反故相減前緯過一百八十度復行九十度六宫七宫八宫為陽厯末限後緯過半周復行九十度六宫七宫八宫為陽厯初限並陽厯俱在南故亦相加前緯過二百七十度行一象限復至合伏九宫十宫十一宫為隂厯初限後緯過二百七十度行一象限九宫十宫十一宫復至正交為陽厯末限一隂厯一陽厯故又相減此置輪心即太陽於正交後緯及正交後大距前緯立表若置輪心於中交為後緯及中交後大距為前緯則隂陽之名相易然加減之法並同並以合伏後一象限相加一二宫第二象限相減三四五宫退合後一象限六七八宫又相加第二象限又相減九十十一宫又按厯書樞線之説盖是謂交㸃移則南北變恐非有翕張之形也假如交在合伏則合伏線與交線合而無緯度若合伏過正交若干度則正交上之合伏後若干度即合伏㸃距樞線之度此處無緯度而合伏反有緯度矣是緯度之變動全係乎樞線之移也即輪心所到論五星以髙卑變緯度本天髙卑能變緯度理宜有之然按圖詳審其法有三其一於本天之斜交徑上作嵗輪三徑線與黄道面平行逺近不同緯度自異其二于本天斜徑上只作一嵗輪徑線而最髙卑之嵗輪心有時而移即其周之長短隨之逺近其三亦只作一徑線而行最髙時嵗輪圏大行最卑時嵗輪圏小三者雖同用最髙卑立算而加減各異此必徴之實測乃可定之第一法用三線則交角雖不變而嵗輪面與黄道面之逺近頓殊角既同矣緯何得異曰所用之本天徑線不同也假如中距時交角為三度其所得正弦乃中距時徑線為全數也若最髙時則其全數大矣雖亦三度角之正弦而其實數則大矣故緯亦大最卑時全數小而正弦亦小彷此論之其留際上下角不同者又在其外也又有異者若用三線則交㸃亦當有變何也中距面線至正交時與黄道面徑合為一線其餘兩嵗輪面線必一在北一在南按至交㸃則三線合一此一節可以勿論第二法嵗輪只用一線其面之距緯本無不同而最髙卑時輪心有動移最髙時輪心在上則正弦線如故而角變小矣謂小于中距之角最卑時輪心近下則正弦如故而角變大矣大于中距角何則正弦雖同謂嵗輪面與黄道面平行之緯而輪心在上則逺于地心而見小矣輪心在下則近于地心而見大矣又法用不同心於黄道則不但正弦不變角亦不變但人在地心視之則有大小與上法二而一者也第三法只作一嵗輪徑線凡言徑線皆因旁視而面變為線而其兩端並作三層線折半為嵗輪心而兩端無参差儘其輪邊即徑線兩銳尖盡處為最大圏之徑乃最髙時所用兩端各縮進為界則中距時徑也兩端又縮進為界則最卑時圏徑也西厯論火星嵗輪有大小之故解之以髙卑而王寅旭亦取之用此法也以上三法不知誰為定法故曰必徴諸實測又按三法在上三星其用皆同至金水則又大異何則金水嵗輪大于本天以其徑同太陽天故則包過地心退合時輪心在人之背而星在輪周跨過地心在人之上星之下星在輪周與其輪心如月之望而人居其間故最髙時輪心逺于地而星在輪周反近于地緯反變大矣若最卑時輪心近地而星在輪周反逺于地緯反變小矣此自然之勢不得不然者也此在第一法第二法並同若用第三法則雖有髙卑而兩端之逺近不變與前二法相反故必徴之實測乃取其合者用之楊學山曰西法歩五星土木火有嵗輪金水有伏見輪雖兩輪行度求角之法皆同然嵗輪上為星離日之虛度輪心在本天伏見輪則自有行度輪心即太陽細按厯書之説盖謂上三星本天包太陽天外星離日而又與日有定距是生嵗輪其半徑恒與太陽天等若金水之本天即太陽天其平行與太陽同距地亦與太陽等俱一千一百四十二地半徑而此伏見一輪以日為心繞日環轉而為伏見使非此輪則星無所為伏見以平行同太陽故也故名伏見輪之半徑皆有定度金星七千二百竒水星三千八百竒是其意原非以伏見輪當嵗輪若果即為嵗輪則半徑宜有大小何則火星因與太陽天近尚有日躔本天二差以變次均角豈金水在太陽天下而反無之今測不然是伏見輪另為一種行動為金水之所獨故昔人别立伏見輪之名也其所云即嵗輪者盖因行法相同而混言之耳今勿庵之説又異是謂五星皆同一法皆有嵗輪上三星因本天大故用嵗輪金水因嵗輪大難用故用繞日圓象即伏見輪如上三星圍日之圏如此可明金水自有本天因得自有髙卑亦自有平行度因在日天下速於太陽本天斜倚黄道因有正交中交之名諸根底俱有著落且五星一貫但依此立算凡星平行自行之根數初均次均之度分南緯北緯之大小皆與厯書數迥異騐之于天末識合否余嘗疑厯指論五星緯説多混淆金水尤略因作五星緯行解一巻明之勿庵之説不敢遽定其是非存之以待參攷焉厯算全書卷十六
