body:
  text: 厯算全書卷四宣城梅文鼎撰厯學疑問補上論西厯源流本出中土即周髀之學問自漢太初以來厯法七十餘家屢改益精本朝時憲厯集其大成兼采西術而斟酌盡善昭示來兹為萬世不刋之典顧經生家或猶有中西同異之見何以徴信而使之勿疑曰厯以稽天有晝夜永短表景中星可攷有日月薄􅝚五星留逆伏見凌犯可騐乃實測有慿之事既有合於天即當采用又何擇乎中西且吾嘗徴諸古籍矣周髀算經漢趙君卿所注也其時未有言西法者唐開元始有九執厯直至元明始有回回厯今攷西洋厯所言寒暖五帶之說與周髀七衡脗合豈非舊有其法歟且夫北極之下以半年為晝半年為夜赤道之下五穀一嵗再熟必非慿臆鑿空而能為此言夫有所受之矣然而習者既希所𫝊又略讀周髀者亦祗與山海經穆天子傳十洲記諸書同類並觀聊備竒聞存而不論已耳今有歐邏巴實測之算與之相應然後知所述周公受學商髙其說亦非無本而惜其殘缺不詳然猶幸存梗槩足為今日之徴信豈非古聖人制作之精神有嘿為呵䕶者哉論盖天與渾天同異問西術既同周髀是盖天之學也然古厯皆用渾天渾天與盖天原為兩家豈得同歟曰盖天即渾天也其云兩家者傳聞誤耳天體渾圓故惟渾天儀為能惟肖然欲詳求其測算之事必寫記於平面是為盖天故渾天如塑像盖天如繪像總一天也總一周天之度也豈得有二法哉然而渾天之器渾員其度匀分其理易見而造之亦易盖天寫渾度於平面則正視與斜望殊觀仰測與旁闚異法度有踈宻形有垤坳非深思造微者不能明其理亦不能製其器不能盡其用是則盖天之學原即渾天而微有精麄難易無二法也夫盖天理既精深傳者遂尠而或者不察但泥倚盖覆槃之語妄擬盖天之形竟非渾體天有北極無南極倚地斜轉出没水中而其周不合荒誕違理宜乎揚雄蔡邕輩之辭而闢之矣盖漢承秦後書器散亡惟洛下閎始為渾天儀而他無攷据然世猶𫝊盖天之名說者承訛遂區分之為兩而不知其非也載攷容成作盖天𨽻首作算數在黄帝時顓頊作渾天在後夫黄帝神靈首出又得良相如容城𨽻首皆神聖之人測天之法宜莫不備極精微顓頊盖本其意而製為渾員之器以發明之使天下共知非謂黄帝容成但知盖天不知渾天而作此以釐正之也知盖天與渾天原非兩家則知西厯與古厯同出一源矣元史載仰儀銘以盖天與安訢宣夜等並稱六天而殊渾於盖猶沿舊說續讀姚牧菴集有所改定則已知渾盖之非二法實為先得我心詳見鼎所著二儀銘註論中土厯法得傳入西國之由問歐羅巴在數萬里外古厯法何以得流通至彼曰太史公言幽厲之時疇人子弟分散或在諸夏或在四裔盖避亂逃咎不憚逺涉殊方固有挾其書器而長征者矣如魯論載少師陽撃磬襄入於海鼔方叔入於河播鼗武入於漢故外域亦有律呂音樂之𫝊厯官遐遁而厯術逺𫝊亦如此爾又如𫝊言夏衰不窋失官而自竄於戎翟之間厥後公劉遷邠太王遷岐文王遷豐漸徙内地而孟子猶稱文王為西夷之人夫不窋為后稷乃農官也夏之衰而遂失官竄於戎翟然則羲和之苖裔屢經夏商之喪亂而流離播遷當亦有之太史公獨舉幽厲盖言其甚者耳然逺國之能言厯術者多在西域則亦有故堯典言乃命羲和欽若昊天厯象日月星辰敬授人時此天子日官在都城者盖其伯也又命其仲叔分宅四方以測二分二至之日景即測里差之法也羲仲宅嵎夷曰暘谷即今登萊海隅之地羲叔宅南交則交趾國也此東南二處皆濵大海故以為限又和叔宅朔方曰幽都今口外朔方地也地極冷冬至於此測日短之景不可更北故即以為限獨和仲宅西曰昩谷但言西而不限以地者其地既無大海之阻又自東而西氣候略同内地無極北嚴凝之畏當是時唐虞之聲教四訖和仲既奉帝命測驗可以西則更西逺人慕德景從或有得其一言之指授一事之留傳亦即有以開其知覺之路而彼中頴出之人從而擬議之以成其變化固宜有之考史志唐開元中有九執厯元世祖時有札瑪魯丹測器有西域萬年厯明洪武初有瑪沙伊克瑪哈齊譯回回厯皆西國人也而東南北諸國無聞焉可以想見其涯略矣論周髀中即有地圓之理問西厯以地心地面為測算根本則地形渾圓可信而周髀不言地圓恐古人猶未知也曰周髀算經雖未明言地圓而其理其算已具其中矣試略舉之周髀言北極之下以春分至秋分為晝秋分至春分為夜盖惟地體渾圓故近赤道則晝夜之長短漸平近北極則晝夜長短之差漸大推而至北極之下遂能以半年為晝半年為夜矣若地為平面則南北晝夜皆同安得有長短之差隨北極髙下而異乎一也周髀又言日行極北北方日中南方夜半日行極東東方日中西方夜半日行極南南方日中北方夜半日行極西西方日中東方夜半盖惟地體渾圓與天體相似太陽隨天左旋繞地環行各以其所到之方正照而為日中正午其對冲之方在地影最深之處而即為夜半子時矣假令地為平面東西一望皆平則日一出地而萬國皆曉日一入地而八表同昏安得有時刻先後之差而且有此方日中彼為夜半者乎二也周髀又言北極之下不生萬物北極左右夏有不釋之氷物有朝耕暮穫中衡左右冬有不死之草五穀一嵗再熟盖惟地與天同為渾圓故易地殊觀而寒暑迥别北極下地即以北極為天頂而太陽周轉近於地平陽光希微不能解凍萬物不生矣其左右猶能生物而以春分至秋分為晝故朝耕而暮穫也若中衡左右在赤道下以赤道為天頂春分時日在赤道其出正夘入正酉並同赤道正午時日在天頂其熱如火即其方之夏春分以後日軌漸離赤道而北至夏至而極其出入並在正夘酉之北二十三度半有竒正午時亦離天頂北二十三度半竒其熱稍减而凉氣以生為此方之秋冬矣自此以後又漸向赤道行至秋分日復在赤道出入正夘酉而正過天頂一如春分熱之甚亦如之則又為其方之夏矣秋分後漸離赤道而南直至冬至又離赤道南二十三度半竒而出入在正夘酉南正午亦離天頂南並二十三度半竒氣候復得稍凉又為秋冬是故冬有不死之草而五穀一嵗再熱也又其方日軌每日左旋之圏度並與赤道平行而終嵗晝夜皆平上條言地近赤道而晝夜之差漸平以此故也赤道既在天頂則北極南極俱在地平可見然但言北極不言南極者中土九州在赤道北聖人治厯祗據所見之北極出地而精其測算即南極可以類推然又言北極下地髙旁陀四隤而下即地圓之大致可見非不知地之圓也即如日月交􅝚常在朔望則日食時日月同度為月所掩赤易知之事而春秋小雅但云日有食之古聖人祗舉其可見者為言皆如是也論渾盖通憲即古盖天遺法問盖天必自有儀器今西洋厯仍用渾儀渾象何以斷其為盖天曰盖天以平寫渾其器雖平其度則渾非不用渾天儀之測驗也是故用渾儀以測天星疇人子弟多能之而用平儀以稽渾度非精於其理者不能也今為西學者多能製小渾儀小渾象至所𫝊渾盖通憲者則能製者尠以此故也夫渾盖平儀置北極於中心其度最宻次晝長規又次赤道規以漸而踈此其事易知又次為晝短規在赤道規外其距赤道度與晝長規等理宜収小而今為平儀所限不得不反展而大其經緯視赤道更濶以踈然以稽天度則七政之躔離可知以攷時刻則方位之加臨不爽若是者何哉其立法之意置身南極以望北極故近人目者其度加寛逺人目者其度加窄視法之理宜然而分秒忽微一一與勾股割圜之切線相應非深思造微者必不能知也至於長規以外度必更寛更濶而平儀中不能容不得不割而棄之淺見者或遂疑葢天之形其周不合矣是故渾盖通憲即古盖天之遺製無疑也論渾盖通憲即盖天遺法二問利氏始傳渾盖儀而前此如回回厯並未言及何以明其為古盖天之器曰渾盖雖利氏所𫝊然非利氏所創吾嘗徴之於史矣元史載札瑪魯丹西域儀象有所謂烏蘓都尔喇卜垣者其製以銅如圓鏡而可掛面刻十二辰位晝夜時刻此即渾盖之型模也又云上加銅條綴其中可以圓轉銅條兩端各屈其首為二竅以對望晝則視日影夜則窺星辰以定時刻以占休咎此即渾盖上所用之闚筩指尺也又言皆嵌鏡片二面刻其圖凡七以辨東西南北日影長短之不同星辰向背之有異故各異其圖以盡天地之變此即渾盖上所嵌圓片依北極出地之圖而各一其圖凖天頂地平以知各方辰刻之不同與夫日出入地晝夜之長短及七政躔離所到之方位及其髙度也其圓片有七而兩面刻之則十四矣西洋雖不言占法然有其立象之學隨地隨時分十二宫與推命星家立命宮之法略同故又曰以占休咎也雖作史者未能深悉厥故而語焉不詳今以渾盖徴之而一一脗合故曰渾盖雖利氏所傳而非其所創也且利氏𫝊此器初不别立佳稱而名之曰渾盖通憲固已明示其指矣然則何以不直言盖天曰盖天之學人屏絶之久矣驟舉之必駭而不信且夫殊盖於渾乃治渾天者之沿謬而精於盖天者原視為一事未嘗區而别之也夫渾天儀必設於觀臺必如法安置而始可用渾盖則懸而可掛輕便利於行逺為行測之所需所以逺國得存其製而流𫝊至今也論渾盖之器與周髀同異問渾盖通憲豈即周髀所用歟曰周髀書殘缺不完不可得攷據所言天象盖笠地法覆槃又云笠以寫天而其製弗詳今以理揆之既地如覆槃即有圓突隆起之形則天如盖笠必為圓坳曲抱之象其製或當為半渾圓而空其中略如仰儀之製則於髙明下覆之形體相似矣乃於其中按經緯度數以寫周天星宿皆宛轉而曲肖矣是則必以北極為中心赤道為邊際其赤道以外漸斂漸窄必别有法以相佐或亦是半渾圓内空之形而仍以赤道為邊其赤道以南星宿並取其距赤道逺近求其經緯度數而圖之至於南距赤道甚逺不可見星之處亦遂可空之不用於是兩器相合即周天可見之星象俱全備而無遺矣以故不知者因其極南無星遂妄謂其周不合而無南極也又或寫天之笠竟展而平而以北極為心赤道為邊用割圓切線之法以攷其經緯度數則周天之星象可一一寫其形容其赤道南之星亦展而平而以赤道為邊查星距赤道起數亦用切線度定其經緯則近赤道者距踈離赤道向南者漸宻而一一惟肖其不見之星亦遂可空之是雖不言南極而南極已在其中今西洋所作星圖自赤道中分為兩即此製也所異者西洋人浮海來賔行赤道以南之海道得見南極左右之星而補成南極星圖與古人但圖可見之星者不同然其理則一是故西洋分畫星圖亦即古盖天之遺法也周髀云笠以寫天當不出坳平二製至若渾盖之器乃能於赤道外展濶平邊以得其經緯遂能依各方之北極出地度而求其天頂所在及地平邊際即晝夜長短之極差可見於是地平之經緯與天度之經緯相與錯綜參伍而如指諸掌非容成𨽻首諸聖人不能作也而於周髀之所言一一相應然則即斷其為周髀盖天之器亦無不可矣夫法傳而久豈無微有損益要皆踵事而增其根本固不殊也利氏名之曰渾盖通憲盖其人强記博聞故有以得其源流而不敢没其實亦足以徴其人之賢矣論簡平儀亦盖天法而八線割圓亦古所有問西法有簡平儀亦以平測渾之器豈亦與周髀相應歟曰凡測天之器圓者必為渾平者即為盖唐一行以平圖寫星象亦謂之盖天所異者只用平度不曽以切線分渾球上之經緯踈宻耳簡平儀以平圓測渾圓是亦盖天中之一器也今攷其法亦可以知一嵗中日道發南斂北之行可以知寒暑進退之節可以知晝夜永短之故可以用太陽髙度測各地北極之出地即可用北極出地求各地逐日太陽之髙度推極其變而置赤道為天頂即知其地方之一年兩度寒暑而三百六旬中晝夜皆平若北極為天頂即知其地之能以半年為晝半年為夜而物有朝生暮穫凡周髀中所言皆可知之故曰亦盖天中一器也但周髀云笠以寫天似與渾盖較為親切耳夫盖天以平寫渾必將以渾圓之度按而平之渾盖之器如剖渾球而空其中乃仰置几案以通明如玻瓈之片平掩其口則圓球内面之經緯度分映浮平面一一可數而變􅉾為平矣然其度必中宻而外踈故用切線此如人在天中則渾天之内面乃正視也故寘北極於中心簡平之器則如渾球嵌於立屏之内僅可見其半球而以玻瓈片懸於屏風前正切其球四面距屏風皆如球半徑而無欹側則球面之經緯度分皆可寫記而抑突為平矣然其度必中濶而旁促故用正弦此如置身天外以測渾天之外面故以極至交圏為邊兩極皆安於外周以考其出入地之度乃旁視也由是言之渾盖與簡平異製而並得為盖天遺製審矣而一則用切線一則用正弦非是則不能成器矣因是而知三角八線之法並皆古人所有而西人能用之非其所創也伏讀御製三角形論謂衆角輳心以算弧度必古厯所有而流傳西土此反失傳彼則守之不失且踵事加詳至哉聖人之言可以為治厯之金科玉律矣論周髀所𫝊之說必在唐虞以前問周髀言周公受學於商髙商髙之學何所受之曰必在唐虞以前何以知之盖周髀所言東方日中西方夜半云云者皆相距六時其相去之地皆一百八十度地與天應其周度皆三百六十則其相對必一百八十此東西差之極大者也細攷之則日在極東而東方為日中午時則其地在極南者必見日初出地而為卯時在極北者必見日初入地而為酉時故又云此四方者晝夜易處加四時相及自南方卯至東方午為四時自東方日中午至北方酉亦四時故每加四時則相及矣若以度計之實相距九十又細分之則東西相距三十度必早晚差一時如日在極南為午時其西距三十度之地必見其為已時而其東距三十度之地必見為未時其餘地准此推之並同相距十五度必相差四刻堯分命羲仲寅賔出日和仲寅餞内日者測此東西里差也寅賔寅餞互文見意非羲仲但朝測和仲但暮測也又周髀所言北極下半年為晝中衡下五穀一嵗再熟云云者其距緯皆相去九十度乃南北差之極大者也細考之北極髙一度則地面差數百十里屢代所測微有不同今定為二百五十里而寒暑宻移晝夜之長短各異和叔羲叔分處南北以測此南北里差也故曰此法之傳必在唐虞以前也夫東西差測之稍難若南北之永短因太陽之髙下而變日軌髙下又依北極之髙下而殊經商逺遊之輩稍知厯象即能覺之羲和二叔奉帝堯之命考測日景一往極北一往極南相距七八千里之逺其逐地之極星髙下晝夜永短身所經厯乃瞢然不知何以為羲和也哉是知地面之非平而永短以南北而差早晚以東西而異必皆羲和所悉知而敬授人時祗據内地幅員立為常法其推測歩算必有專書而亡於秦焰周髀其千百中之十一耳又何疑焉論地實圓體而有背面問地體渾圓既無可疑然豈無背面曰中土聖人所産即其面也何以言之五倫之教天所叙也自黄帝堯舜以來世有升降而司徒之五教人人與知若西方之佛教及天教雖其所言心性之理極其精微救度之願極其廣大而於君臣父子之大倫反輕此一徴也語言惟中土為順若佛經語皆倒如云到彼岸則必云彼岸到之類歐邏巴雖與五印度等國不同語言而其字之倒用亦同日本國賣酒招牌必云酒賣彼人亦讀中土書則皆於句中用筆挑剔作記而倒讀之北邊塞外及南徼諸國大略皆倒用其字此又一徴也往聞西士之言謂行數萬里來賔所厯之國多矣其土地幅員亦有大於中土者若其衣冠文物則未有過焉此又一徴也是知地體渾圓而中土為其面故篤生神聖帝王以繼天建極垂世立教亦如人身之有面為一身之精神所聚五藏之精並開竅於五官此亦自然之理也論盖天之學流𫝊西土不止歐邏巴問佛經亦有四大州之說與周髀同乎曰佛書言須彌山為天地之中日月星辰繞之環轉西牛賀州南瞻部州東勝神州北具盧州居其四面此則亦以日所到之方為正中而日環行不入地下與周髀所言略同然佛經所言則其下為華藏海而世界生其中須彌之頂為諸天而通明故夜能見星此則不知有南北二極而謂地起海中上連天頂始如圓墖圓柱之形其說難通而彼且謂天外有天令人莫可窮詰故婆羅門等婆羅門即回回皆為所籠絡事之唯謹唐書載回紇諸國多事佛回紇即回回也然回回國人能從事厯法漸以知其說之不足慿故遂自立門庭别立清真之教西洋人初亦同回回事佛唐有波斯國人在此立大秦寺今所𫝊景教碑者其人皆自署曰僧回回既與佛教分而西洋人精於算復從回厯加精故又别立耶蘇之教以别於回回觀今天教中七日一齋等事並略同回教其厯法中小輪心等算法亦出於回厯要皆盖天周髀之學流傳西土而得之有全有缺治之者有精有粗然其根則一也論逺國所用正朔不同之故問回厯及西洋厯既皆本於盖天何以二教所頒齋日其每年正朔如是不同曰天方國以十二個月為年即回回國歐邏巴以太陽過宮為年月依嵗差而變此皆自信其厯法之善有以接古盖天之道又見秦人蔑棄古三正而以己意立十月為嵗首今西南諸國猶有用秦朔者故遂亦别立法程以新人耳目誇示四隣今海外諸國多有以十二個月為年遵回厯也盖回國以厯法測驗疑佛說之非故謂天有主宰無影無形不宜以降生之人為主其說近正所異於古聖人者其所立拜念之規耳厥後歐邏巴又於回厯研精故又自立教典奉耶蘇為天主以别於回回然所稱一體三身降生諸靈怪反又近於佛教而大聲闢佛動則云中國人錯了夫中土人倫之教本於帝王雖間有事佛者不過千百中之一二又何錯之云今但攷其厯法則回回泰西大同小異而皆本於盖天然惟利氏初入欲人之從其說故多方闡明其立法之意而於渾盖通憲直露渾盖之名為今日所徴信盖彼中之英賢也厥後厯書全部又得徐文定及此地諸文人為之廣其畨譯為厯家所取資實有功於厯學其他可以勿論若回回厯雖亦有所持之圓地球及平面似渾盖之器而若露若藏不宣其義洪武時吳伯宗李翀奉詔翻譯亦但紀其數不詳厥㫖至數𫝊之後雖其本科亦莫稽測算之根所云烏蘓都尔喇卜垣之器竟無言及之者盖失𫝊已久殊可惜耳尤可深惜者回回泰西之厯既皆本於盖天而其所用正朔乃各自翻新出竒欲以自異其實皆非夫古者帝王欽若昊天順春夏秋冬之序以敬授人時出於自然何其正大何其易簡萬世所不能易也顧乃恃其巧算私立正朔以變亂之亦見其惑矣徐文定公之譯厯書也云鎔西洋之巧算入大統之型模非獨以尊大統也揆之事理固有不得不然者爾測算以求天驗不難兼西術之長以資推歩頒朔以授人時自當遵古聖之規以經久逺虛心以折其衷博考以求其當有志厯學者尚其念諸餘詳後論厯算全書卷四
