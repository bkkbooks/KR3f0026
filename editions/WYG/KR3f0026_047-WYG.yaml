body:
  text: 厯算全書卷三十九宣城梅文鼎撰目録第一平分線第二平方線原名分面第三更面線原名變面第四立方線原名分體第五更體線原名變體第六割圓線第七正弦線舊名節氣第八切線舊名時刻第九割線舊名表心第十五金線附三線比例以上十線並如舊式惟平方立方改從古名取其易曉又正弦改附割圓切線分為時刻取其便用割線去表心之目以正其名免悮用也説見各條之下又按羅序言此器百種技藝無不賴之功倍用㨗為造瑪得瑪第嘉之津梁然則彼中藉此製器如工師之用矩尺則日晷等製並其恒業迺書中圖説反有參錯非故為靳祕也良由倣造者衆未必深知法意爰致承訛抑或譯書時語言不能盡解而强以意通遂多筆誤耳今於其似是而非之處徹底釐清以合測量正理起立法之人于九京必當莫逆
  hash: sha256:4274db7439f8475f7edf312697a1e602e8fcd20a23849d54ab76e5000a921616
