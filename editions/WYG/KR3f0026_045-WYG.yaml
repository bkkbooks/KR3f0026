body:
  text: 方爾素撰此書時安溪相國以冢宰開府上谷公子世得鍾倫鋭意厯算之學余兄弟及兒以燕下榻芝軒與諸同學晨夕問難甚相得也無何爾素挈兒燕南歸相國入參密勿而世得亡兒相繼化去余亦大病濱死然猶能偷視息至今日為爾素序此書不可謂非不幸中幸也憶爾素六十時余有句云如稼觀登塲如行将百里何以収桑榆無為所生恥今當相與念兹弗替爾勿菴又識
  hash: sha256:4e7684f8a17f181bfb5c6e9d55471917a80a31097c3caed0cea3696540a6fbc9
