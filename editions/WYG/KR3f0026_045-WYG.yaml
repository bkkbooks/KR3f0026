front:
  text: 比例規用法假如原序康熙癸未季弟爾素有比例規用法假如之作又五年丁亥重加挍録示予屬為序序曰形而上者不可得而數有數可數即有象可見故算法量法理本相通而尺可為算器也厯書中有書一卷耑明尺算謂之比例規觧比例云者謂以尺中原有之兩數求今所問之兩數以例相比如古者異乗同除及西人三率之法而有尺以著其象則不煩言説乃作者之意也規云者謂以銅鐵為規器兩髀翕張用其末鋭分指兩尺上同數以得横距而命得數則用尺之法也規本畫圓之器于尺􅈫為借用故仍其名曰規本觧有作法用法惜無設例罕能用者攜李陳獻可藎謨補作例祗平分一線而已龍舒方位白中通作數度衍以横尺取數而不用規亦惟平分一線夫平分用止乘除聊足以明異乗同除之理而尺算之善不盡于是若乃平方立方分圓輕重諸術其求法多不以異乗同除為用而數變為線爰生比例即盡歸于異乗同除此其所長也又規端取數毫氂可辨而㳺移進退簡快靈妙横距雖無數而取諸本尺其則不逺固勝横尺矣吾弟此書仍其用規本法自平分以下十線一一為之用例以明之原書謬誤稍為刋正然後其書可得而用為功于度數之學不小也憶嵗乙夘余始購得厯書抄本于吳門姚氏偶缺是觧至戊午秋介亡友黄俞邰太史虞稷借到皖江劉潛柱先生本抄補之葢逾時而後能通其條貫以是正其訛闕又次年己未始為山隂友人何奕美作尺亦稍以己意増損推廣之而未暇為立假如今得爾素是書可以無作矣勿菴兄文鼎序
