body:
  text: 按西士羅雅谷自序謂譯書草創潤色之増補之必有其時今之釋例不嫌小有同異所以相成當亦作書者之所欲得也比例規觧原列十線為十種比例之法今仍之比例既有十種可各為一尺今總歸一尺者便攜也一尺中列十線則一尺而有十尺之用恐其不清故各線之端書某線以别之各線並從心起數惟立方線初㸃最大割線亦然又五金線之用近尺末故俱不到心以便他線之書字然其實並從心起算用者詳之尺心即尺端也兩尺端聫于樞心成一㸃故從兹起算
  hash: sha256:eec792db062b41d60ef94f5279704ec6345a31a8482f9e6618c27c1e8ea94af0
