body:
  text: 厯算全書卷五十三宣城梅文鼎撰三角法舉要卷四或問三角大意畧具首卷中而入算取用仍有疑端喜同學之好問事事必求其所以然故不憚為之詳複以暢厥㫖一三角形用正弦為比例之理一和較相求之理一用切線分外角之理一三較連乗之理附三較求角問各角正弦與各邉皆不平行何以能相為比例曰凡三角形一邉必對一角其角大者正弦大而所對之邉亦大角小者正弦小而所對之邉亦小故邉與邉之比例如正弦與正弦也兩正弦為兩邉比例圖乙丙丁三角形丁乙邉大對丙角丁丙邉小對乙角術為以丁乙邉比丁丙邉若丙角之正弦與乙角之正弦解曰試以丁丙為半徑作丁甲線為丙角正弦又截戊乙如丁丙半徑作戊己線為乙角正弦丁甲正弦大於戊己故丁乙邉亦大於丁丙問丁甲何以獨為丙角正弦也曰此以丁丙為半徑故也若以丁乙為半徑則丁甲即為乙角之正弦如圖用丁乙為半徑作丁甲線為乙角正弦又引丙丁至戊令戊丙如丁乙半徑作戊己線為丙角正弦即見乙角之正弦丁甲小於戊己故丁丙邉亦小於丁乙解曰正弦者半徑所生也故必兩半徑齊同始可以較其大小前圖截戊乙如丁丙此圖引丁丙如丁乙所以同之也三正弦逓相為三邉比例圖乙丁丙鈍角形丁鈍角對乙丙大邉丙次大角對乙丁次大邉乙小角對丁丙小邉其各邉比例皆各角正弦之比例試以乙丁為半徑作丁甲線為乙小角之正弦又引丙丁邉至戊使戊丙如乙丁作戊己線為丙角之正弦又展戊丙線至庚使庚丙如乙丙作庚辛線為丁鈍角之正弦如此則三邉皆若弦三正弦皆若股其比例為以乙丙大邉同庚丙比乙丁次邉同戊丙若丁鈍角之正弦庚辛與丙角之正弦戊己又以乙丁次大邉同戊丙比丁丙小邉若丙角之正弦戊己與乙角之正弦丁甲又以丁丙小邉比乙丙大邉同庚丙若乙小角之正弦丁甲與丁鈍角之正弦庚辛問庚辛何以為丁角正弦曰凡鈍角以外角之正弦為正弦試作乙癸線為丁角正弦乙丁癸角外角也故其正弦即為丁鈍角正弦必與庚辛等何也庚丙辛句股形與乙丙癸形等庚丙弦既同乙丙又同用丙角辛與癸又同為方角故其形必等則庚辛必等乙癸而乙癸既丁角正弦矣等乙癸之庚辛又安得不為丁角正弦乎凡取正弦必齊其半徑此以丁甲為乙角正弦是用乙丁為半徑也而取丙角正弦戊己必引戊丙如乙丁其丁角正弦庚也辛又即外角之正弦乙癸是三半徑皆乙丁試取壬丙如丁丙作庚壬線即同乙丁半徑則壬角同丁角壬外角即丁外角而庚辛正弦之半徑仍為乙丁庚壬同乙丁故此以庚壬當乙丁易乙丁丙形為庚壬丙則庚辛正弦亦歸本位與前圖互明試以各角正弦同居一象限較其弧度如圖甲乙丙形丙角最大其正弦乙丁亦最大所對甲乙邉亦最大甲角次大其正弦丑壬亦次大所對乙丙邉亦次大乙角最小其正弦丙夘亦小所對丙甲邉亦最小丙乙二角正弦並乙丙為半徑甲角取正弦截丑甲如乙丙亦以乙丙為半徑乃别作一象弧如戊己仍用乙丙為半徑取戊庚如乙丙而以先所得各角之餘弦取度於丁作乙丁為丙角之正弦於壬作丑壬為甲角之正弦於夘作丙夘為乙角之正弦即如元度而各角之差數覩矣戊庚半徑既同乙丙則丁庚即丁丙而為丙角餘弦又壬庚即甲壬為甲角餘弦夘庚即夘乙為乙角餘弦解曰角無大小以弧而知其大小今乙丁正弦其弧乙己是丙角最大也丑壬正弦其弧丑己是甲角次大也丙夘正弦其弧丙己是乙角最小也而對邉之大小亦如之故皆以正弦為比例也或疑鈍角之度益大其正弦反漸小而其所對之邉則漸大何以能相為比例乎曰此易知也凡鈍角正弦即外角之正弦而外角度原兼有餘兩角之度故鈍角之正弦必大于餘兩角而得為大邉之比例也如乙丙甲鈍角形丙鈍角最大其正弦乙丁亦最大而所對乙甲邉亦最大乙角次大其正弦丙夘亦次大而所對甲丙邉亦次大甲角最小其正弦丑壬亦小而所對乙丙邉亦最小截甲丑如乙丙從丑作丑壬即甲角正弦乃從乙作乙庚弧以丙為心乙丙為半徑為丙外角之度又作辛丙半徑與甲乙平行分乙庚弧度為兩則辛庚即甲角之弧度其餘辛乙亦即乙角之弧度從辛作辛未正弦與丑壬等又自庚截癸庚度如辛乙則癸庚亦乙角之弧作癸子正弦與丙夘等此顯丙外角之度兼有乙甲兩角之度其正弦必大於兩角正弦也雖丙鈍角加大而外角加小則乙甲兩角必又小於外角又何疑於鈍角正弦必為大邉比例乎試更以各角切員觀之則各角之對邊皆為其對弧之通弦如圖三角形以各角切員則乙丙邉為丙戊乙弧之通弦而對甲角甲丙邉為丙己甲弧之通弦而對乙角甲乙邉為乙庚甲弧之通弦而對丙角則是各角之對邉即各角對弧之通弦也夫通弦者正弦之倍數則三邉比例即三正弦之比例矣又試以各邉平分之則皆成各角之正弦於前圖内更以各邉所當之弧皆平分之丙戊乙弧平分于戊㸃丙己甲弧平分于己㸃乙庚甲弧平分于庚㸃自員心丁各作半徑至其㸃即分各邊為兩平分以丁壬戊半徑分乙丙邊于壬以丁辛己半徑分甲丙邊于辛以丁癸庚半徑分甲乙邊于癸則所分之邊皆為兩平分則弧之平分者即原設各角之度而邊之平分者即皆各角之正弦丙丁戊角以丙戊為弧丙壬為正弦而丙丁戊角原為丙丁乙角之半必與甲角同大故丙戊半弧即甲角之本度丙壬半邊即甲角之正弦乙丁戊角亦然凖此論之則甲丁己角原為甲丁丙角之半必與乙角同大故甲己半弧即乙角之本度甲辛半邊即乙角之正弦己丁丙角亦然又乙丁庚角原為乙丁甲角之半必與丙角同大故乙庚半弧即丙角之本度乙癸半邊即丙角之正弦庚丁甲角亦然夫分其邊之半即皆成正弦則邊與邊之比例亦必如正弦與正弦矣全與全若半與半也問三角之本度皆用半弧何也曰量角度必以角為員心真度乃見今三角皆切員邊則所作通弦之弧皆倍度也故半之乃為角之本度如圖以甲角爲心甲丁爲半徑作員則其弧丑丁子乃甲角之本度也而平分之丙戊及戊乙兩弧並與丑丁子弧等試作戊丙及乙戊兩弦必相等又並與丑子弦等凡弦等者弧亦等故乙戊丙弧必爲甲角之倍度餘角類推問三邉求角何以用和較相乗也曰欲明和較之用當先知和較之根凡大小兩方以其邉相併謂之和相減謂之較和較相乗者兩方相減之餘積也如圖甲癸小方丁癸大方於大方内依小方邉作己庚横線又取己辛如小方邉作辛壬線成己壬小方與甲癸等大方内減己壬小方則所餘者為乙庚及庚壬兩長方形夫乙己及丁庚及庚辛並兩邉之較也甲己庚則和也若移庚壬長方為乙甲長方即成丁甲大長方而為較乗和之積故凡兩方相減之餘積為實以和除之得較以較除之亦得和矣依此論之若有兩方形相減又别有兩方相減而其餘積等則為公積故以此兩方之和較相乗為實而以彼兩方之和為法除之得彼兩方之較或以彼兩方之較為法除之亦必得和如圖有方二十九之冪八百四十一與方二十七之冪七百二十九相减成較二乗和五十六之積又有方十六之冪二百五十六與方十二之冪一百四十四相减成較四乗和二十八之積兩積同為一百一十二故以先有之較二和五十六相乗為實以今有之和二十八為法除之即得較四為今所求数是故三角形以兩弦之和乗較為實以兩分底之和為法除之得較者為兩和較相乗同積也兩和較相乗同積者各兩方相减同積也何以明之曰凡三角形以中長線分為兩句股則兩形同以中長線為股而各以分底線為句是股同而句不同也句不同者弦不同也弦大者句亦大弦小者句亦小故兩弦上方相減必與兩句上方相減之餘積等而兩和較相乗亦等如圖甲乙丙三角形以甲丁中長線分為兩句股形則丙乙為兩句之和未寅及子夘並同丙戊為兩句之較未子及寅夘並同未夘長方為兩句之較乗和也又丙己為兩弦之和辰壬同酉丙為兩弦之較辰癸及辛庚壬午並同癸壬長方為兩弦之較乗和也此兩長方必等積問兩弦上方大於兩句上方何以知其等積曰依句股法弦上方冪必兼有句股上方冪是故甲丙弦冪内即癸甲大方必兼有甲丁股丙丁句兩冪乙甲弦冪内即辛己小方亦兼有甲丁股乙丁句兩冪則是甲丁股冪者兩弦冪所同也其不同者句冪耳股冪既同則弦冪相减時股冪俱對减而盡使非句冪不同巳無餘積然則兩弦冪相減之餘積于癸甲大方内减己辛相同之申甲小方所餘者癸辛申丙兩長方成磬折形豈不即為兩句冪相減之餘積乎于丁子方内减丁寅相同之戊丑小方所形所餘者丑子及戊未兩長方成磬折由是言之兩和較相乗之等積信矣于弦冪相减之癸辛申丙磬折形内移申丙補庚壬即成和較相乗之癸壬長方又于句冪相减之丑子未戊磬折形内移戊未補丑夘即成和較相乗之未夘長方兩磬折形既等積則兩長方亦等積問和較之列四率與諸例不同何也曰此互視法也同文算指謂之變測古九章謂之同乗異除乃三率之别調也何則凡異乗同除皆以原有兩率之比例為今兩率之比例其首率為法必在原有兩率之中互視之術則反以原有之兩率為二為三以自相乗為實其首率為法者反係今有之率與異乗同除之序相反故曰别調也然則又何以仍列四率曰以相乗同實也三率之術二三相乗與一四相乗同實故可以三率求一率二三相乗以一除之得四以四除之即仍得一若一四相乗以二除之亦可得三以三除之亦仍得二互視之術以原有之兩率自相乗與今有之兩率自相乗同實故亦以三率求一率原兩率自相乗以今有之率除之得今有之餘一率若今兩率自相乗以原有之率除之亦即得原有之餘一率但三率之術以比例成其同實互視之術則以同實而成其比例既成比例即有四率故可以列而求之也如圖長方形對角斜剖成兩句股則相等而其中所成小句股亦相等甲壬戊與甲己戊等則甲乙丙與甲辛丙等丙丁戊與丙庚戊等並長方均剖故也即所成長方之積亦必相等于甲壬戊句股形内减去相等之甲乙丙及丙丁戊兩小句股存乙丙丁壬長方又于甲己戊句股形内减去相等之甲辛丙及丙庚戊兩小句股存辛己庚丙長方所减之数等則所存之数亦等故兩長方雖長濶不同而知其必為等積今以甲乙為首率乙丙為次率丙丁為三率丁戊為四率則乙丁長方即乙丙丁壬形為二三相乗之積此形以乙丙二率為濶丙丁三率為長是二率三率相乗也辛庚長方即辛己庚丙形為一四相乗之積此形以辛丙為長丙庚為濶而辛丙原同甲乙乃一率也丙庚原同丁戊乃四率也是一率四率相乗也既兩長方相等則二三相乗與一四相乗等實矣此列率之理也一甲乙二丙乙三丙丁四戊丁在異乗同除本術則甲乙及丙乙為原有之數丙丁為今有之數戊丁為今求之數其術為以原有之甲乙股比原有之丙乙句若今有之丙丁股與戊丁句也故于原有中取丙乙句與今有之丙丁股以異名相乗為實又于原有中取同名之甲乙股為法除之即得今所求之丁戊句是先知四率之比例而以乗除之故成兩長方二率乗三率成乙丁長方以首率除之必變為辛庚長方故曰以比例成其同實也互視之術則乙丙與丙丁為原有之數甲乙為今有之數丁戊為今求之數術為以乙丙較乗丙丁和之積若丙庚較即丁戊乗丙辛和即甲乙之積故以原有之乙丙較丙丁和自相乗為實以今有之甲乙和即辛丙為法除之即得今所求之丁戊較即丙庚是先知兩長方同積而以四率取之故曰以同實成其比例也然則又何以謂之互視曰三率之用以原有兩件自相比之例為今有兩件自相比之例是視此之差等為彼之差等如相慕效故大句比大股若小句比小股大句小于大股幾倍小句亦小于小股幾倍又大句大于小句幾倍大股亦大于小股幾倍互視之用以原有一件與今一件相比之例為今又一件與原又一件相比之例是此視彼之所來以往彼亦視此之所往以來如互相酬報故弦之較比句之較反若句之和比弦之和弦之和大于句故句之較反大于弦若和之數弦大于句幾倍則較之數句大于弦亦幾倍是以别之為互視也如圖以甲乙為一率丙乙為二率丙丁為三率丁戊為四率作甲戊弦成兩句股次引甲乙及丁戊㑹于壬成乙丁長方為二三相乗之積亦引乙丙至庚引丁丙至辛作甲辛及戊庚線並引長之㑹于己成辛庚長方為一四相乗之積是先有比例而成同實之長方如圖乙丙乗丙丁為乙丁長方辛丙乗丙庚為辛庚長方兩長方以角相連于丙次引己辛及乙壬㑹于甲引己庚及壬丁㑹于戊乃作甲戊線則辛丙與丙丁若乙丙與丙庚是先知同實而成其比例也問三角形兩又術用外角切線何也曰此分角法也一角在兩邉之中則角無所對之邉邉無所對之角不可以正弦為比例今欲求未知之兩角故借外角分之也然則何以用半較角曰較角者本形中未知兩角之較也此兩角之度合之即為外角之度必求其較角然後可分而較角不可求故求其半知半較知全較矣此用半較角之理也如圖甲丙乙形先有丙角則甲丙丁為外角外角内作丙辛線與乙甲平行則辛丙丁角與乙角等辛丙甲角與甲角等其辛丙庚角為兩角之較而辛丙己角其半較也己丙丁及己丙甲皆半外角也以半較角與半外角相減成乙角于丁丙己内减辛丙己其餘丁丙辛即乙角度若相加亦成甲角于己丙甲加辛丙己成辛丙甲即甲角度半較角用切線何也曰此比例法也角與所對之邉並以正弦為比例今既無正弦可論而有其所對之邉故即以邉為比例角之正弦可以例邉則邉之大小亦可以例角是故乙丁者兩邉之總也乙癸者兩邉之較也而戊己者半外角之切線也壬己者半較角之切線也以乙丁比乙癸若戊己與壬己故以切線為比例也然則何以不徑用正弦曰凡一角分為兩角則正弦因度離立不同在一線不可以求其比例其在一線者惟切線耳而邉之比例與切線相應切線比例又原與正弦相應故用切線實用正弦也如圖甲丙丁外角其弧甲己丁於辛作辛丙線分其角為兩則小角之弧丁辛其正弦夘丁大角之弧辛甲其正弦甲丑小角正弦當乙角之對邉甲丙大角正弦當甲角之對邉乙丙今欲移正弦之比例於一線先作甲丁通弦割分角線於子則子甲與子丁若甲丑與夘丁甲丑子與丁夘子兩句股形有子交角等丑夘皆正角即兩形相似而比例等然則子甲者大形之弦子丁者小形之弦而甲丑者大形之股夘丁者小形之股也弦與弦若股與股故子甲比子丁若丑甲與夘丁而甲丁即兩正弦之總甲丁為子甲子丁之總亦即為甲丑夘丁之總辰子即兩正弦之較以子丁减子甲其較辰子是辰子為子甲子丁之較亦即為甲丑夘丁之較平分甲丁半之於酉則酉丁為半總酉子為半較其比例同也全與全若半與半故甲丁與辰子為兩正弦之總與較則半之而為酉丁與酉子亦必若兩正弦之總與較於是作午戊切員線引平分線丙酉至己分甲己丁弧于己自己作午戊線與己丙為十字垂線即此線為切員線與甲丁平行引諸線至其上引丙甲至午引丙丁至戊引丙辰割庚㸃至未引丙夘割辛㸃至壬則午戊切線上比例與甲丁通弦等而正弦之比例在切線矣先以甲丁與辰子當兩正弦之總與較今午戊與未壬亦可當兩正弦之總與較則先以酉丁與酉子為半總半較者今亦以己戊與己壬為半總半較矣故曰用切線實用正弦也切線與正弦所以能同比例者以有通弦作之合也問三較連乗之理曰亦句股術也以句股為比例而以三率之理轉換之則用法最精之處也故三較連乗即得容員半徑上方乗半總之積假如甲乙丙三角形甲丙邉一百五十甲乙邉一百二十二乙丙邉一百一十二術以半總一百九十二較各邉得甲丙之較四十二甲乙之較七十乙丙之較八十三較連乗得數二十三萬五千二百即容員半徑自乗又乗半總之積也置三較連乗數以半總除之得數一千二百二十五平方開之得容員半徑三十五倍之得容員徑七十置三較連乗數以半總乗之得數四千五百一十五萬八千四百平方開之得三角形積六千七百二十若如常法求得中長線一百二十以乗乙丙底而半之所得積數亦同然則何以見其為句股比例曰試從形心如法作線分為六句股形形心即容員心又引甲丙邉至夘使夘丙如乙戊引甲乙邉至辰使乙辰如己丙則甲夘甲辰並半總六小句股形之句各于其兩相同者而取其一即成半總而丙夘為甲丙邉之較即乙戊或乙辛乙辰為甲乙邉之較即己丙或辛丙甲己為乙丙邉之較己丙同辛丙又丙夘同乙辛則夘己同乙丙而甲己為其較若用辰戊以當乙丙則甲戊為較亦同又從夘作夘壬十字垂線至壬此線與丁己員半徑平行引甲丁分角線出形外遇於壬成甲夘壬大句股形與甲己丁小句股之比例等從辰作辰壬線成甲辰壬大句股與甲戊丁小句股為比例亦同術為以丁己比壬夘若甲己與甲夘也次以丁己自乗方為一率以丁己乗壬夘之長方為次率則其比例仍若甲己三率與甲夘四率也乗之者並丁己故所乗之丁己與壬夘比例不變也以數明之甲己八十甲夘一百九十二為二倍四分比例丁己三十五壬夘八十四亦二倍四分比例丁己自乗一千二百二十五丁己乗壬夘二千九百四十亦二倍四分比例故曰比例等又移辛㸃至癸截丙癸如丙夘則乙癸亦如乙辰引丙夘至午使夘午同乙辰亦同乙癸引乙辰至未使辰未同丙夘亦同丙癸則午丙及未乙並同乙丙又作丙壬乙壬午壬未壬四線成午丙壬及乙未壬及乙丙壬各三角形皆相等丙夘壬句股形與未辰壬等則丙壬必等未壬又午夘壬句股形與乙辰壬等則午壬等乙壬而午丙壬及乙未壬兩三角形必等矣其乙丙壬三角形既以乙丙與兩三角形同底又同用丙壬乙壬兩弦亦不得不等於是自癸作癸壬垂線夘壬辰壬並垂線故癸壬亦必垂線成丙癸壬句股形與丙夘壬形等即成癸丙夘壬四邉形與丁己丙辛小四邉形為相似形夘與癸俱方角而方小形之己與辛亦角則大形之丙角與壬角合之亦兩方角也而小形之丙角原為大形丙角之外角合之亦兩方角也則小形之丙角與大形之壬角等而小形之丁角亦與大形之丙角等是大小兩形之四角俱等而為相似形則丁己丙句股形與丙夘壬形亦相似而比例等大小兩四邉形各均剖其半以成句股則其相似之比例不變全與全若半與半也術為以丁己比己丙若丙夘與夘壬也一丁己二己丙三丙卯即甲丙之較戊乙四卯壬凡三率法中二三相乗一四相乗其積皆等則己丙乗丙卯之積即丁己乗卯壬之積可通用也先定以丁己自乗比丁己乗卯壬若甲己與甲卯今以三率之理通之為以丁己自乗比己丙乗丙卯亦若甲己與甲卯一丁己自乗方即容員半徑自乗二己丙乗丙卯長方即甲乙之較乗甲丙之數三甲己即乙丙之較四甲卯即半總復以三率之理轉換用之則三較連乗之積以己丙較乗戊乙較為二率又以甲己較為三率乗之是二三相乗即三較連乗即容員半徑自乗方乗半總之積也以丁己半徑自乗為首率以甲卯半總為四率乗之是一四相乗也凡一四相乗必與二三相乗之積等以數明之丁己三十五卯壬八十四相乗得二千九百四十己丙七十丙卯四十二相乗亦二千九百四十故可通用己丙乗丙卯二千九百四十又以甲己八十乗之得二十三萬五千二百丁己自乗一千二百二十五又以甲卯一百九十二乗之亦二十三萬五千二百故可通用問三較之術可以求角乎曰可其所求角皆先得半角即銳鈍通為一術矣術曰以三邊各減半總得較各以所求角對邊之較乗半總為法以餘兩較各與半徑全數相乗又自相乗為實法除實得數平方開之為半角切線撿表得度倍之為所求角假如甲乙丙三角形甲丙邊七十五甲乙邊五十六乙丙邊六十一與半總九十六各相減得甲丙之較二十一甲乙之較四十乙丙之較三十五今求乙角術以乙角所對邊甲丙之較二一乗半總九六得數二一六為法以餘兩較甲乙較四乙丙較三五各乗半徑全數又自相乗得數一四為實法除實得數六九四四四四四四四四平方開之得數八三三三三為半角切線撿表三十九度四十八分一十九秒倍之得乙角七十九度三十六分三十八秒次求丙角術以丙角所對邊甲乙之較四乗半總得數三八四為法餘兩較甲丙二一乙丙三五各乗半徑全數又自相乗得數七三五為實法除實得數一九一四六二五平方開之得半角切線四三七五撿表二十三度三十七分五十二秒半倍之得丙角四十七度一十五分四十五秒次求甲角術以甲角所對邉乙丙之較三五乗半總得數三三六為法餘兩較甲丙二一甲乙四各乗半徑全數又自相乗得數八四為實法除實得數二五平方開之得半角切線五撿表二十六度三十三分五十三秒倍之得甲角五十三度七分四十六秒問前條用三較連乗今只用一較為除法何也曰前條求總積故三較連乗今有専求之角故以對邉之較為法也然則用對邉何也曰對邉之較在所求角之兩旁為所分小句股形之句今求半角切線故以此小句為法也如求乙半角則所用者角旁小句股心戊乙或心丁乙其句乙戊或乙丁並二十一即對邉甲丙之較也術為以乙戊比心戊若半徑與乙角小形之角即半角也之切線其與半總相乗何也曰將以半總除之又以小形句即對邉之較除之今以兩除法一半總一對邉之較即小形句相乗然後除之變兩次除為一次除也古謂之異除同除用兩次除亦有說乎曰前條三較連乗必以半總除之而得容員半徑之方冪今欲以方冪為用故亦以半總除也然則又何以對邉之較除曰非但以較除也乃以較之冪除也何以言之曰原法三較連乗為實今只以兩較乗是省一乗也既省一對邉之較乗又以對邉之較除之是以較除兩次也即如以較自乗之冪除之矣餘兩較相乗先又各乗半徑何也曰此三率之精理也凡線與線相乗除所得者線也冪與冪相乗除所得者冪也先既定乙戊句為首率心戊股即容員半徑為次率半徑為三率乙角切線為四率而今無心戊之數惟三較連乗中有心戊即容員半徑自乗之冪即三較連乗半總除之之數故變四率並為冪以乙戊句冪為首率即對邉之較除兩次心戊股冪為次率即半總除連乗數半徑之冪為三率即半徑自乗得半角切線之冪為四率即分形之乙角一乙戊今用乙戊自乗二心戊心戊自乗三半徑半徑自乗四乙角切線切線自乗故得數開方即成切線又術以三較連乗半總除之開方為中垂線即容員半徑以半徑全數乗之為實各以所求角對邊之較除之即得半角切線一乙戊乙角對邊之較丙戊丙角對邊之較甲己甲角對邊之較二心戊中垂線心戊中垂線心己中垂線亦即心戊三半徑全數半徑全數半徑全數四乙半角切線丙半角切縁甲半角切線此即用前圖可解乃本法也論曰常法三邊求角倘遇鈍角必于得角之後又加審焉以鈍角與外角同一八線也今所得者既為半角則無此疑實為求角之㨗法補遺問以邉求角句股第二術因和較乗除而知正角乃定其為句股形何也曰古法句弦較乗句弦和開方得股今大邉壬丁與小邉癸丁以和較相乗為實癸壬邉為法除之而仍得癸壬是適合開方之積也則大邉小邉之和較即句弦之和較而癸為正角成句股形矣凡句股形弦為大邉而對正角今丁壬邉最大即弦也故所對之癸角為正角試再以丁壬與壬癸之和較求之如法用丁壬壬癸相加得和一百九十六丈相減得較一十六丈較乗和三千一百三十六丈為實丁癸五十六丈為法除之亦仍得五十六丈何則股弦較乗和亦開方得句故也然則句股弦和較之法又安從生曰生於割圜試以丁壬弦為半徑作戊丁丙己圜全徑二百一十二半徑一百六乙丁正弦九十即癸壬股乙壬餘弦五十六即癸丁句丙乙正矢五十即句弦較乙庚大矢一百六十二即句弦和正矢乗大矢得數八千一百開方得正弦即句弦和乗較開方得股然則此八千一百者既為正矢大矢相乗之積又為正弦自乗之積故以正弦自乗為實而正矢除之可以得大矢大矢除之亦得正矢即乙丁股自乗為實而以句弦較丙乙除之得乙庚為句弦和若以句弦和除之亦得句弦較更之則正矢乗大矢為實以正弦除之仍得正弦矣即句弦較丙乙乗句弦和乙庚為實以乙丁股為法除之而仍復得股論曰句股形在平圜内其半徑恒為弦若正弦餘弦則為句為股可以互用故其理亦可互明以丁壬及丁癸二邉取和較求壬癸邉為句弦求股以丁壬及壬癸二邉取和較求丁癸邉為股弦求句一而已矣問數則合矣其理云何曰仍句股術也如上圖於圜徑兩端如丙如庚各作通弦線至正弦丁乙之銳如庚乙丙乙成丙乙庚大句股形又因中有正弦成大小兩句股形乙丁庚為大形乙丙丁為小形而相似以乙丁線分正角為兩則小形乙角為大形乙角之餘而與庚角等即大形乙角亦與小形丙角等故兩形相似則乙丁正弦既為小形之股又為大形之句其比例為丙丁小形句與乙丁小形股若乙丁大形句與丁庚大形股也故正矢丁丙乗大矢丁庚與正弦乙丁自乗等積丙庚全徑為正弦所分其一丁丙正矢為小形之句而乙丁正弦為其股其一丁庚大矢為大形之股而乙丁正弦為其句一丁丙正矢小形句凡二率三率相乗與一二乙丁正弦小形股四相乗等積故乙丁自三乙丁正弦大形句乗即與丁丙丁庚相乗四丁庚大矢大形股等積也論曰凡割圜算法専恃句股古法西法所同也故論句股者必以割圜而論割圜者仍以句股如根株華實之相須乃本法非旁證也或疑切線分外角以正弦為比例恐不可施於鈍角作此明之甲丙乙鈍角形先有丙角及丙甲丙乙二邉求餘角一率丁乙邉總二率癸乙邉較三率己戊半外角切線四率壬己半較角切線論曰試作壬丙線與乙甲平行分外角為兩則壬丙丁即乙角其正弦卯丁又甲丙壬即甲角其正弦甲丑以兩句股丑子甲卯子丁相似之故能令兩正弦丑甲卯丁之比例移於通弦以成和較丑甲與卯丁既若子甲與子丁則丁甲即兩正弦之和辰子即兩正弦之較而半外角半較角之算以生半外角為和半較角為較並與兩正弦之和較同比例即與兩邉之和較同比例並如銳角又論曰此所分大角為鈍角故甲丑正弦作於形外然雖在形外而引分角線至丑適與之㑹即能成丑子甲句股形與卯子丁相似而生比例丙乙甲形先有丙角求餘角與法為邉總丁乙與邉較乙癸若半外角切線戊己半較角切線未己此亦因所分為鈍角故卯丁正弦在形外餘又大邉為半徑故乙癸較亦在形外而丁乙為和並同前丙甲乙形先有丙角求餘角半法為邉總丁乙與邉較乙癸若半外角切線己戊與較角切線己壬此因先得鈍角故所分之内反無鈍角而正弦所作之小句股並在外角之内同銳角法矣丙甲乙形先得丙角及丙甲句乙丙弦如法作丙壬線與乙甲股平行分外角為兩則句弦和丁乙與句弦較癸乙若半外角切線己戊與半較角切線己壬所此以丙甲為半徑作外角弧而即用丙甲為正弦知得為正角甲乙丙形先得丙角求餘角辛如法作丙庚線與乙甲句平行次截辛丁如庚甲作丙線分外角為兩則小角之正弦卯丁大角之正弦即丙甲而成兩句股相似為切線比例法為句弦和丁乙與句弦較乙癸若半外角切線己戊與半較角切線己壬辛此以丙甲為半徑作外角弧而即用丙甲為正弦知丙甲為正角而丁辛同庚甲即辛丙甲同丁丙庚又即同丙乙甲而乙為正角矣以乙正角减外角餘為甲角論曰右並以先不知其為句股形故求之而得正角凡正角之弧九十度别無正弦而即以半徑全數為正弦得此明之甲乙丙形先有正角求餘角己法為句股和丁乙與句股較癸乙若半外角切線戊與半較角切線己壬論曰此因先得者為正角故其外角亦九十度而半外角四十五度之切線即同半徑全數餘並同前又論曰句股形求角本易不須外角而外角之用得此益明以大邉為半徑作外角弧分角線丙未與次大邉平行邉總乙丁與邉較乙癸若半外角切線戊己與半較角切線壬己以次大邉為半徑作外角弧分角線丙未與小邉乙甲平行大邉總丁癸與邉較乙癸若半外角切線己戊與半較角切線己壬問平三角形以一邉為半徑得三正弦比例不識大邉亦可以為半徑乎小邉次邉為半徑已具前條故云曰可如乙丙丁鈍角形引乙丁至辰如乙丙大邉而用為半徑以丁為心作丑辰亥半弧從辰作辰午為丁鈍角正弦又作丁斗半徑與乙丙平行則斗牛為丙角正弦又截女丑弧如辰斗作女丁半徑則女亢為乙角正弦合而觀之丁角正弦辰午最大故對邉乙丙亦大丙角正弦斗牛居次故對邉乙丁亦居次乙角正弦女亢最小故對邉丁丙亦小又問若此則三邉任用其一皆可為半徑而取正弦是已然此乃同徑異角之比例也若以三邉為弦三正弦為股則同角異邉之比例也兩比例之根不同何以相通曰相通之理自具圖中乃正理非旁證也試於前圖用乙丁次邉為弦其股乙癸與斗牛平行而等則丙角正弦也又截酉丁如丁丙小邉為弦其股酉壬與女亢平行而等則乙角正弦也又辰丁大邉為弦即乙丙其股辰午原為丁大角正弦也於是三邉並為弦三對角之正弦並為股成同角相似之句股形而比例皆等可以相求矣一大邉乙丙即辰丁一丁角正弦辰午二丁角正弦辰午二大邉乙丙三次邉乙丁小邉丁丙即酉丁三丙角正弦乙癸乙角正弦酉壬四丙角正弦乙癸乙角正弦酉壬四次邉乙丁小邉丁丙此如先得大邉乙丙即辰丁與所對大角丁故用辰午丁大句股形為法求餘二句股也乙癸丁酉壬丁皆同用丁角而形相似故法可相求其實三正弦皆大邉為半徑所得故其理相通未有理不相通而法可相求者故曰皆正理非旁證也又試於乙丙丁形或鈍角或鋭角同理以丁丙小邉為半徑作房箕壁象弧以乙為心如上法取三正弦以尾壁弧為丁角度其正弦尾虚又箕壁弧為丙角度其正弦箕危又戍壁弧為乙角度其正弦戍申成同徑異角之比例又如法用三邉為弦三正弦為股乙戍即丁丙小邉配乙角正弦戍申原如弦與股又本形乙丁次邉為弦則丁甲為股與箕危平行而等丙角正弦也又引乙丁至子成子乙即乙丙大邉以為弦則子寅為股與尾虚平行而等丁角正弦也則並為相似之句股形而比例等一小邉丁丙即戍乙二乙角正弦戍申三大邉乙丙即乙子次邉丁乙四丁角正弦子寅即尾虚丙角正弦丁甲即箕危此如先得小邉丁丙與所對小角乙故以戍申乙小句股形為法求兩大句股也丁甲乙子寅乙皆同用乙角而形相似又試以乙丁次邉為半徑作象限如前以丙為心取三正弦張娄為丁角弧度張井其正弦氐娄為丙角弧度氐參其正弦室娄為乙角弧度室奎其正弦成同徑異角之比例又仍用三邉為弦三正弦為股引丁丙至翌與大邉乙丙等成翌丙弦其股翌胃與張井平行而等丁角正弦也又乙丁次邉成氐丙弦其股氐參原為丙角正弦又丁丙小邉為弦其股丁柳與室奎平行而等乙角正弦也即復成相似之句股形而比例等一次邉乙丁即氐丙二丙角正弦氐參三大邉乙丙即翌丙小邉丁丙四丁角正弦張井即翌胃乙角正弦丁柳即室奎此如先得次邉乙丁及所對丙角故以氐參丙句股為法求大小二句股也求翌胃丙為以小求大求丁柳丙為以大求小皆同用丙角而比例等問員内三角形以對弧為角倍度設有鈍角小邉何以取之或問内原設銳角兩邉並大于半徑故云曰法當引小邉截大邉作角之通弦如圖乙甲丙鈍角形在平員内以各角切員而乙甲邉小于半徑則引乙甲出員周之外乃以甲角為心平員心丁為界作子丁丑弧截引長邉于子截大邉于丑則丑甲子甲並半徑與丁甲等而丑子為通弦又平分對邉作兩通弦從員心作丁乙丁丙兩半徑截乙戊丙員周為甲角對邉所乗之弧而半之于戊作乙戊丙戊二線成兩通弦則此兩通弦自相等又並與丑子通弦等夫子丁丑弧甲角之本度也丙戊弧乙戊弧皆對弧之半度也而今乃相等通弦等者弧度亦等是甲角之度適得對弧乙戊丙之半而乙戊丙對弧為甲角之倍度矣厯算全書卷五十三
