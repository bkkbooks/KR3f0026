body:
  text: 厯算全書卷五十宣城梅文鼎撰三角形舉要法卷一測算名義古用句股有割員弧背弦矢諸名今用三角其類稍廣不可以不知爰摘綱要列於首簡㸃㸃如針芒無長短濶狹可論然算從此起譬如算日月行度只論日月中心一點此㸃所到即為躔離真度線線有弧直二種皆有長短而無濶狹自一㸃引而長之至又一㸃止則成線矣如測日月相距度皆自太陽心算至太隂心是為弧線如測日月去人逺近皆自人目中一㸃算至太陽太隂天是為直線凡句股三角之法俱論線線兩端各一㸃故線以㸃為其界面面有方員各種之形皆有長短有濶狹而無厚薄故謂之冪冪者所以冒物如量田疇界域只論土面之大小面之方員各類皆以線限之故面以線為界面之線亦曰邉惟員面是一線所成乃弧線也若直線必三線以上始能成形體體或方或員其形不一皆有長短有濶狹又有厚薄或淺深髙下之類員體如球如柱方體如櫃如㪷或如員塔方塔皆以面為界圖後以上四者謂㸃線面體略盡測量之事矣然其用皆在線如論㸃則有距線論面則有邉線論體則有棱線面與面相得則成棱線凡所謂長短濶狹厚薄淺深髙下皆以線得之三角法者求線之法也長短濶狹厚薄等類皆以量而得而量者必於一線正中若稍偏於兩旁則其度不真矣故凡測量所求者皆線也三角形欲明三角之法必詳三角之形兩直線不能成形成形者必三線以上而三線相遇則有三角故三角形者形之始也多線皆可成形析之皆可成三角至三角則無可析矣故三角能盡諸形之理凡可算者為有法之形不可算者為無法之形三角者有法之形也不論長短斜正皆可以求其數故曰有法若無法之形析之成三角則可量故三角者量法之宗也角三角法異於句股者以用角也故先論角兩線相遇則成角平行兩直線不能作角何也線既平行則雖引而長之至於無窮終無相遇之理角安從生是故作角者必兩線相遇必不平行也角有三類一正方角一銳角一鈍角如右圖以兩線十字縱横相遇皆為正方角亦曰直角亦曰方角如右圖以兩線斜相遇則一為銳角一為鈍角凡銳角必小於正方角凡鈍角必大於正方角正方角止一銳角鈍角則有多種而算法生焉弧角在小形與在大形無以異也故無丈尺可言必量之以對角之弧法以角之端為員心用規作員員周分三百六十度乃視本角所對之弧於全員三百六十度中得幾何度分其弧分所對正得九十度者為正方角九十度者全員四之一謂之象限若所對弧分不滿九十度者為銳角自八十九度以至一度並銳角也所對弧分在九十度以上者為鈍角自九十一度至百七十九度並鈍角也如圖丁為角即用為員心以作員形其庚丁丙角凡論角度並以中一字為所指之角此言庚丁丙即丁為角也所對者庚丙弧在全員為四之一正得象限九十度是為正方角若乙丁丙角所對者乙丙弧在象限庚丙弧之内小於象限九十度是為銳角又乙丁壬角所對乙庚壬弧過於壬庚弧壬庚亦象限九十度弧故庚丁壬亦方角大於象限九十度是為鈍角角之度生於割員割員弧矢有弧則有矢弧矢者古人割員之法也如圖以乙子直線割平員則成弧矢形所割乙丙子員分如弓之曲古謂之弧背以弧背半之則為半弧背如乙丙通弦正弦割員直線如弓之弦謂之通弦如乙子通弦半之古謂之半弧弦今曰正弦如乙甲矢線正弦以十字截半徑成矢如丁丙横半徑為乙甲正弦所截成甲丙矢謂之正矢以上二條俱仍前圖正弧餘弧正角餘角所用之弧度為正弧以正弧減象限為餘弧如庚丙象限内减乙丙正弧則其餘乙庚為餘弧正弧所對為正角如正弧乙丙對乙丁丙角則為正角以正角減正方角為餘角如以乙丁丙正角去减庚丁丙方角則其餘乙丁庚角為餘角正弦餘弦正矢餘矢有正弧正角即有正弦如乙甲有正矢如甲丙亦即有餘弦如乙己有餘矢如己庚正弦正矢餘弦餘矢皆乙丙弧所有亦即乙丁丙角所有自一度至八十九度並得為乙丙並得為正弧即正餘弦矢畢具若用乙庚為正弧則乙丙反為餘弧角之正餘亦同割線切線每一弧一角各有正弦餘弦正矢餘矢己成四線於平員内古人用句股割員即此法也盖此四線己成倒順二句股再引半徑透於平員之外與切員直線相遇為割線切線而各有正餘復成四線正割正切餘割餘切復成倒順二句股共為八線故曰割員八線也如圖庚乙丙平員切戊丙直線於丙又引乙丁半徑透出員周外使兩線相遇於戊則戊丙為乙丙弧之正切線亦即為乙丁丙角之正切線而戊丁為乙丙弧之正割線亦即為乙丁丙角之正割線又以平員切庚辛直線於庚與乙丁透出線相遇於辛則庚辛為乙丙弧之餘切線亦即為乙丁丙角之餘切線而辛丁為乙丙弧之餘割線亦即為乙丁丙角之餘割線割員八線凡用一弧即對一角用一角亦對一弧故可互求凡一弧即有八線正弦正矢正割正切餘弦餘矢餘割餘切角亦然凡一弧之八線即成倒順四句股角亦然如圖庚丙象弧共九十度庚丁丙為九十度十字正方角任分乙丙為正弧乙丁丙為正角則乙庚為餘弧乙丁庚為餘角正弦乙甲己同丁正矢甲丙正切戊丙正割戊丁餘弦乙己甲同丁餘矢庚己餘切辛庚餘割辛丁以上八線為乙丙弧所用亦即為乙丁丙角所用自一度至八十九度並同若用乙庚弧亦同此八線但以餘為正以正為餘乙甲丁句股形乙丁半徑為弦乙甲正弦為股丁甲餘弦為句戊丙丁句股形戊丁正割為弦戊丙正切為股丙丁半徑為句以上兩順句股形同用乙丁甲角故其比例等凡句股形一角等則餘角並等乙己丁倒句股形乙丁半徑為弦己丁正弦為股乙己餘弦為句辛庚丁倒句股形辛丁餘割為弦丁庚半徑為股辛庚餘切為句以上兩倒句股形同用乙丁巳角故其比例亦等乙甲丁句股形乙丁半徑為弦乙甲正弦為股甲丁餘弦為句丁己乙倒句股形乙丁半徑為弦己丁正弦為股乙己餘弦為句此倒順兩句股形等邉又等角倒形之丁角即順形丁角之餘倒形之乙角即順形乙角之餘竟如一句股也凖此論之則倒順四句股之比例亦無不等矣角度凡三角形併三角之度皆成兩象限共一百八十度假如乙甲丁句股形其丁角五十五度當乙丙弧則乙角必三十五度當乙庚餘弧兩角共一象限九十度其甲角正方原係九十度合三角成一百八十度乙角何以必三十五度也試引乙丁弦過心至夘則夘丁丑角與丁乙甲角等夘丁乙同為一線丁丑線又與乙甲平行則所作之角必等而夘丁丑固三十度也則乙角亦三十度矣又假如丙乙丁三角形從乙角作乙甲直線至丁丙邉分為兩句股形乙甲丁乙甲丙凖前論乙甲丁句股形以乙分角與丁角合之成一象限九十度又乙甲丙句股形以乙分角與丙角合之成一象限九十度然則以乙全角即兩分角之合與丁丙兩角合之必兩象限一百八十度矣乙為鈍角並同以此推知三角形有兩角即知餘角併兩角以减半周一百八十度得之句股形有一角即知餘角句股原有正方角九十度則餘兩角共九十度故得一可知其二相似形既知角可以論形有兩三角形其各角之度相等則為相似形而兩形中各邉之比例相等謂此形中各邉自相較之比例亦如彼形中各邉自相較之比例也比例兩數相形則比例生比例者或相等或大若干或小若干乃兩數相比之差數也有兩數於此又有兩數於此數雖不同而其各兩數自相差之比例同謂之比例等或兩小數相等又有兩大數相等是為相等之比例數雖有大小其相等之比例均也或兩小數相差三倍又有兩大數亦相差三倍是為三倍之比例或兩小數相差為一倍有半又有兩大數相差亦一倍有半是為一倍有半之比例數雖有大小其為三倍之比例及一倍有半之比例均也論八線之比例有二一為八線自相生之比例乙甲丁小句股形與戊丙丁大句股形相似見前條故以半徑乙丁比正弦乙甲若割線戊丁與切線戊丙之比例也此為以小弦比小股若大弦與大股股求弦亦同又以半徑丙丁比正切戊丙若餘弦甲丁與正弦乙甲之比例也此為以大句比大股若小句比小股股求句亦同餘倣此以故凡八線中但得一線則餘皆可求觀圖自明一為八線算他形之比例乙丁甲角所有八線為表中原設之數亢丁房句股形為今所算之數或先有丁角有亢丁弦而求房丁句則為以乙丁半徑比甲丁餘弦若亢丁弦與房丁句也以角與句求弦亦同以上是用八線以求他形或先有亢丁弦有亢房股而求丁角則為以亢丁弦比亢房股若乙丁半徑與丁角之正弦乙甲也得乙甲得丁角矣或先有亢房股與房丁句而求丁角則為以亢房股比房丁句若丁庚半徑與庚辛餘切也得庚辛亦得丁角以上二者是用他形轉求八線總而言之皆以先有兩數之比例為後兩數之比例其乗除之法皆依三率也三率三率算術古謂之異乗同除今以句股解之丁戊大股十四尺丙戊大句十一尺二寸截丁乙小股十尺問乙甲截句答曰八尺術以所截小股乗大句得數為實以大股為法除之即得截句若先以原股十四尺除原句十一尺二寸得八寸為每一尺之句再以截股十尺乗之亦得八尺但先除後乗多有不盡之數故改用先乗後除乃古九章中通用之綱要也先乗後除何以又謂之異乗同除曰今但有截股而不知句故以原有之句乗之股與句異名故曰異乗然後以原有之股除之股與股同名故曰同除然則又何以謂之三率曰本是以原有之股與句比今截之股與句共四件也然見有者只三件原有之股與句及今截之股故必以見有之三件相為乗除而得所不知之第四件故曰三率三率乗除圖式一率原有股十四尺為法二率原有句十一尺二寸相乗三率今截股十尺為實四率所求截句八尺法除實得所求術曰以原股比原句若截股與截句也凡言以者為一率言比者為二率言若者為三率言與者為四率二率三率常相乗為實一率常為法法除實得四率四率乃所求之數其三率者所以求之也三率與異乗同除非有二理但以横列為異然數既平列即可以四率為法除二三相乗之實而得一率并可以一率四率相乗為實用二率為法除之而得三率或用三率為法除之亦得二率是故一四二三之位可以互居四可為一二可為三法實可以迭用二與三可居一四之位一與四可居二三之位變動不居惟用所適而各有典常於異乗同除之理尤深切而著明者也三率互用圖反之更之又反之一句八尺一股十尺一句十一尺二寸二股十尺二句八尺二股十四尺三句十一尺二寸三股十四尺三句八尺四股十四尺四句十一尺二寸四股十尺右並以二率三率相乗為實一率為法除之而得四率八線表八線為各弧各角之句股所成故八線表者即句股形之立成數也古人用句股開方巳盡測量之理然句股弦皆邉線耳邉之數無方放之則彌四逺近之則陳几案故所傳算術皆以一端示例而已不能備詳其數也今變而用角則有弧度三百六十以限之而以象限盡全周有合於舉一反三之㫖又析象限之度各六十分凡為句股形二千七百角度五千四百九十度之分五千四百而句股形並有兩角故其形二千七百而角數倍之為正弦為切線為割線共一萬六千二百三項各五千四百正餘互用也而句股之形略備用之殊便也銳角分兩句股鈍角補成句股然惟有八線表中豫定之句股故但得其角度則諸數厯然可於無句股中尋出句股矣半徑全數全數即半徑也不言半徑而言全數者省文也凡八線生於角度而有角有弧則有半徑八線之數皆依半徑而立也半徑常為一或五位則為一萬或六位則為十萬則正弦常為半徑之分正弦必小於半徑而不得為全數惟半徑可稱全數也割切二線皆依正弦而生亦皆有畸零不得為全數用全數為半徑有數善焉一立表時易於求數也一用表時便於乗除也三率中全數為除法則但降位可省一除若全數為乗法則但升位可省一乗厯書中多言全數或但曰全以從省便今算例中直云半徑以欲明比例之理故質言之補遺正弦為八線之主割圜之法皆作句股於圜内以先得正弦故古人祗用正弦亦無不足今用割切諸線而皆生於正弦平圜徑二尺即戊壬半之一尺即戊丙庚丙等為圜裏六孤之一面即乙戊半徑戊丙為弦半面戊丁為句句弦求股得股丁丙轉減半徑庚丙得餘庚丁為小句半面戊丁又為小股句股求弦得小弦戊庚是為割六弧成十二弧之一面如是累析為二十四弧四十八弧至九十六弧以上定為徑一尺周三尺一寸四分有竒論曰九章算經載劉徽割圜術大畧如此其以半徑為六弧之一面與八線理合半徑恒為一即全數半面為股則正弦也平方徑十寸其積百寸内作同徑之平圜平圜内又作平方正得外方之半其積五十寸平方開之得七寸七有竒即離震等四等面之通弦乃自四隅之旁増為八角曲圜為第一次即八等面通弦至第二次則為曲十六即十六等面通弦第三次為曲三十二每次加倍至十二次則為曲一萬六千三百八十四於是方不復方漸變為圜矣其法逐節以大小句股弦冪相求至十二次所得小弦以一萬六千三百八十四乗之得三十一寸四分一􅈊五毫九絲二忽為徑十寸之圜周與祖冲之徑一百一十三周三百五十五合論曰元趙友欽革象新書所撰乾象周髀法大略如此所得周徑與西術同其逐節所求皆通弦所用小股皆正弦也又論曰劉徽祖冲之以割六孤起數趙友欽以四角起數今西術作割圜八線以六宗率則兼用之可見理之至者先後一揆法之精者中西合轍西人謂古人但知徑一圍三未深攷也又論曰中西割圜之法皆以句股法求通弦通弦半之為正弦割圜諸率皆自此出總之為句股之比例而巳鈍角正弦鈍角不立正弦而即以外角之正弦為正弦鈍角之正弦在形外即外角之正弦也故乙丙已鈍角與乙丙甲外角同以乙丁為正弦以鈍角减半周得外角假如鈍角一百二十度其所用者即六十度之正弦乙丁線能為乙丙甲角正弦又能為乙丙已鈍角正弦八線表止於象限以此因鈍角與外角同正弦故表雖一象限而實有半周之用鈍角餘弦鈍角既以外角之正弦為正弦即以外角之餘弦為餘弦如前圖乙庚為外角乙丙甲餘弦而即為鈍角乙丙己餘弦捷法以正角戊丙巳減鈍角乙丙巳得餘角戊丙乙即得餘弦過弧鈍角之弧為過弧巳戊為象限弧而乙戊巳為乙丙巳鈍角之弧是越象限弧而過之也故曰過弧大矢鈍角之矢為大矢如前圖以乙丁辛弦分全圜即全徑亦分為二則丁甲為小半圜乙甲辛之徑謂之正矢丁巳為大半圜乙已辛之徑謂之大矢大矢者鈍角所用也鈍角與外角同用乙丁正弦乙庚餘弦所不同者惟矢乙丙巳角用大矢丁已乙丙甲角用正矢丁甲捷法以乙庚即丁丙餘弦加已丙半徑即得丁巳大矢若以餘弦减半徑亦得正矢正角以半徑全數為正弦八線起度一分至八十九度五十九分並有正弦而九十度無正弦非無正弦也盖即以半徑全數為其正弦故凡算三角有用半徑與正弦相為比例者皆正角也其法與銳角形鈍角形用兩正弦為比例同理並詳後卷八十九度竒之正弦至九九九九九而極迨滿一象限始能成半徑全數是故半徑全數者正角九十度之正弦也其數為一厯算全書卷五十
