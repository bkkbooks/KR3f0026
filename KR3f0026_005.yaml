body:
  text: 厯算全書卷五宣城梅文鼎撰厯學疑問補下論太陽過宫問舊厯太陽過宫與中氣不同今何以復合為一曰新厯之測算精矣然其中不無可商當俟後來詳定者則此其一端也何則天上有十二宫宫各三十度每嵗太陽以一中氣一節氣共行三十度如冬至小寒共行三十度大寒立春又共行三十度其餘並同滿二十四氣則十二宫行一周故厯家恆言太陽一嵗周天也然而實考其度則一嵗日躔所行必稍有不足雖其所欠甚微約其差不過百分度之一有半積至年深遂差多度六七十年差一度六七百年即差十度是為嵗差厯家所以有天周嵗周之名天上星辰勻分十二宫共三百六十度是為天周每嵗太陽十二中氣共行三百六十度微弱是為嵗周漢人未知嵗差誤合為一故即以冬至日交星紀而定之於牽牛逮晉虞喜等始覺之五代宋何承天祖沖之隋劉焯等言之益詳顧治厯者株守成説不敢輒用嵗差也至唐初傅仁均造戊寅元厯始用嵗差而朝論多不以為然亦如今人之不信西法人情狃于習見大扺皆然故李淳風麟德厯復去嵗差不用直至玄宗開元某年僧一行作大衍厯乃始博徴廣證以大暢厥旨於是分天自為天即周天十二次宫度其度終古不變嵗自為嵗即周嵗十二中氣日躔所行天度其度嵗嵗微移厯代遵用所定嵗差年數微有不同而大致無異元世祖時用授時厯郭守敬測定六十六年有八月而差一度回回泰西差法略同今定為七十年差一度數亦非逺故冬至日一嵗日躔之度已周尚不能復於星紀之元度必再行若干日時而至星紀十二中氣皆同一理所以太陽過宮與中氣必不同日其法原無錯誤其理亦甚易知徐李諸公深於厯術豈反不明斯事乃復合為一真不可解推原厥故蓋譯厯書時誤仍回回厯太陽年之十二月名耳問回回厯亦知嵗差何以誤用宮名為月名曰回回厯既以十二個月為太隂年而用之紀嵗不用閏月然如是則四時之寒燠溫涼錯亂無紀因别立太陽年以周嵗日躔勻分三百六十度又勻分為十二月以為耕斂之節而起算春分是亦事勢之不得不然堯典寅賔出日始於仲春即此一事亦足徴西厯之本於羲和但彼以春分為太陽年之第一月第一日遂不得復用古人分至啓閉之法及春夏秋冬正名古者以立春立夏立秋立冬春分秋分冬至夏至為八節其四立並在四孟月之首以為四時之節謂之啓閉二分二至並在四仲月之中居春夏秋冬各九十一日之半皆自然之序不可移易今回厯之太陽年既以春分為嵗首則是以仲春之後半月為正旦而割其前半個月以益孟春共四十五日竒遂一併移之於嵗終而孟春之前半改為十一月之後半孟春之後半合仲春之前半共三十日改為十二月即春夏秋冬之四時及分至啓閉之八節孟仲季之月名無一與之相應名不正則言不順遂不復可得而用矣故遂借白羊等十二宮以名其太陽年之月彼非不知天度有嵗差白羊不能板定於春分然以其時春分正在白羊姑借此名之以紀月數即此而知回厯初起時其年代去今非逺歐邏巴厯法因回厯而加精大致並同回厯故遂亦因之耳徐文定公譯厯書謂鎔西洋之精算入大統之型模則此處宜為改定使天自為天嵗自為嵗則嵗差之理明而天上星辰宮度各正其位矣如晝夜平即為二分晝極長即為夏至不必問其日躔是何宫度是之謂嵗自為嵗也必太陽行至降婁始命為日躔降婁之次大陽行至鶉首始命為日躔鶉首之次不必問其為春分後幾日夏至後幾日是之謂天自為天也顧乃因仍回厯之宮名而以中氣日即為交宮之日則嵗周與天周復混而為一於是嵗差之理不明如星紀之次常有定度而冬至之日度漸移是生嵗差若冬至日即躔星紀嵗嵗相同安得復有嵗差而天上十二次宮度名實俱亂天上十二宮各有定星定度若隨節氣移動則名實俱左後篇詳之是故厯法至今日推步之法已極詳明而不無有待商酌以求盡善者此其一端也問者曰厯所難者推步耳若此等處改之易易但於各中氣後查太陽實躔某宮之度即過宮真日但厯書中所作諸表多用白羊金牛等宮名以為别識今欲通身改換豈不甚難曰否否厯書諸表雖以白羊金牛等為題而其中之進退消長並從節氣起算今但將宮名改為節氣即諸表可用不必改造有何難哉如厯從白羊起者即改白羊初度為春分初度表從磨羯起者即改磨羯初度為冬至初度厯書諸表依舊可用但正其名不改其數更無煩於推算論周天十二宮並以星象得名不可移動問天上十二宫亦人所名今隨中氣而移亦何不可之有曰十二宫名雖人所為然其來久矣今考宮名皆依天上星宿而定非漫説者如南方七宿為朱鳥之象史記天官書栁為鳥注注即咮咮者朱鳥之喙也七星頸為員官頸朱鳥頸也員官嚨喉也張為素素即嗉鳥受食之處也翼為羽翮朱鳥之翼故名其宫曰鶉首鶉火鶉尾鶉即朱鳥乃鳳也東方七宿為蒼龍天官書東宫蒼龍房心心為明堂今按角二星象角故一名龍角氐房心象龍身心即其當心之處故心為明堂尾宿即龍之尾故其宮曰夀星封禪書武帝詔天下尊祀靈星正義靈星即龍星也張晏曰龍星左角曰天田則農祥也見而祀之曰大火心為大火曰析木一名析木之津以尾箕近天河也北方七宿為玄武天官書北宫玄武其宮曰星紀古以斗牛為列宿之首故星自此紀也曰玄枵枵者虛也即虛危也又象龜蛇為玄武也曰娵訾一名娵訾之口以室壁二宿各二星兩兩相對而形正方故象口也西方七宿為白虎天官書奎曰封豕參為白虎三星直者是為衡其外四星左右肩股也小三星隅置曰觜觽為虎首其宫曰降婁以婁宿得名也曰大梁曰實沈由是以觀十二宮名皆依星象而取非漫設也堯典日中星鳥以其時春分昏刻朱鳥七宿正在南方午地也日永星火以其時夏至初昏大火宮在正午也火即心宿宵中星虛以其時秋分昏中者玄枵宫也即虛危也日短星昴以其時冬至昏中者昴宿也即大梁宮也厯家以嵗差考之堯甲辰至今已四千餘嵗嵗差之度已及二宮以西率七十年差一度約之凡差六十餘度然而天上二十八舍之星宿未嘗變動故其十二宮亦終古不變也若夫二十四節氣太陽躔度盡依嵗差之度而移則嵗嵗不同七十年即差一度亦據今西術推之安得以十二中氣即過宮乎試以近事徴之元世祖至元十七年辛巳冬至度在箕十度至今康熙五十八年己亥冬至在箕三度其差蓋已將七度而即以箕三度交星紀宫則是至元辛巳之冬至宿箕十度已改為星紀宮之七度再一二百年則今己亥之冬至宿箕三度為星紀宮之初度者又即為星紀宮之第三度而尾宿且浸入星紀矣積而久之必將析木之宫尾箕盡變為星紀大火之宮氏房心盡變為析木而十二宫之星宿皆差一宮凖上論之角亢必為大火翼軫必為夀星柳星張必為鶉尾井鬼必為鶉火而觜參為鶉首胃昴畢為實沈奎婁為大梁而娵訾為降婁虛危為娵訾斗牛為玄枵二十八宿皆差一宮即十二宮之名與其宿一一相左又安用此名乎再積而久之至數千年後東宮蒼龍七宿悉變玄武嵗差至九十度時角亢氐尾心房箕必盡變為星紀玄枵娵訾並倣此南宮朱鳥七宿反為蒼龍西宮白虎七宿反為朱鳥北宮玄武七宿反為白虎國家頒厯授時以欽若昊天而使天上宿度宮名顛倒錯亂如此其可以不亟為釐定乎又試以西術之十二宮言之夫西洋分黃道上星為十二象雖與羲和之舊不同然亦皆依星象而名非漫設者如彼以積尸氣為巨蟹第一星蓋因鬼宿四星而中央白氣有似蟹筐也所云天蝎者則以尾宿九星卷而曲其末二星相並如蠍尾之有岐也所云人馬者謂其所圖星象類人騎馬上之形也其餘如寶瓶如雙魚如白羊如金牛如隂陽如獅子如雙女如天稱以彼之星圖觀之皆依稀倣佛有相似之象故因象立名今若因節氣而每嵗移其宫度積而久之宮名與星象相離俱非其舊而名實盡淆矣又按西法言嵗差謂是黃道東行未嘗不是如今日鬼宿已全入大暑日躔之東在中法嵗差則是大暑日躔退回鬼宿之西也在西法則是鬼宿隨黃道東行而行過大暑日躔之東其理原非有二尾宿之行入小雪日躔東亦然夫既鬼宿已行過大暑東而猶以大暑日交鶉火之次則不得復為巨蟹之星而變為師子矣尾宿已行過小雪後而猶以小雪日交析木之次則尾宿不得為天蝎而變為人馬宮星矣即詢之西來知厯之人有不啞然失笑者乎論西法恆星嵗即西月日亦即其齋日並以太陽過宫為用而不與中氣同日問西法以太陽會恆星為嵗謂之恆星年恆星既隨黃道東行則其恆星年所分宮度亦必不能常與中氣同日厯書何以不用曰恆星年即其所頒齋日也其法以日躔斗四度為正月朔故曰以太陽會恆星為嵗也其斗四度蓋即其所定磨羯宮之初度也在今時冬至後十二日自此日躔行滿三十度即為第二月交寶瓶宫餘月並同皆以日躔行滿三十度交一宮即又為一月而不論節氣然其十二月之日數各各不同者以黃道上有最髙卑差而日躔之行度有加減也如磨羯宫日躔最卑行速故二十八日而行一宫即成一月若巨蟹宫日躔最髙行遲故三十一日而行一宫始成一月其餘宮度各以其或近最卑或近最髙遲速之行不同故日數皆不拘三十日並以日躔交宫為月不論節氣是則其所用各月之第一日即太陽交宫之日原不與中氣同日而且嵗嵗微差至六七十年恆星東行一度即其各宮並東行一度而各月之初日在各中氣後若干日者又增一日矣如今以冬至後十二日為嵗首至嵗差一度時必在冬至後十三日餘盡然此即授時厯中氣後幾日交宮之法乃嵗差之理本自分曉而厯書中不甚發揮斯事者亦有故焉一則以月之為言本從太隂得名故必晦朔弦望周而後謂之月今反以太陽所躔之宮度為月而置朔望不用是名為月而實非月大駭聽聞一也又其第一月既非夏正孟春亦非周正仲冬又不用冬至日起算非厯學履端於始之義事體難行二也又其所用齋日即彼國所頒行之正朔歐邏巴人私奉本國之正朔宜也中土之從其教者亦皆私奉歐邏之正朔謂國典何故遂隱而不宣三也初造厯書事事闡發以冀人之信從惟此齋日但每嵗傳單伊教不筆於書然厯書所引彼中之舊測每稱西月日者皆恆星年也其法並同齋日皆依恆星東行以日躔交磨羯宮為嵗旦而非與冬至中氣同日也此尤為太陽過宮非中氣之一大證據矣或曰厯書所引舊測多在千餘年以前然則西月日之興所從來久矣曰殆非也唐始有九執厯元始有回回厯歐邏巴又從回厯加精必在回厯之後彼見回回厯之太隂年太陽年能變古法以矜竒創故復變此西月日立恆星年以勝之若其所引舊測蓋皆以新法追改其月日耳論恆氣定氣問舊法節氣之日數皆平分今則有長短何也曰節氣日數平分者古法謂之恆氣以嵗周三百六十五日二十四刻竒平分為二十四氣各得一十五日二十一刻八十四分竒其日數有多寡者謂之定氣冬至前後有十四日竒為一氣夏至前後有十六日為一氣其餘節氣各各不同並以日行盈厯而其日數減行縮厯而其數增二者之算古厯皆有之然各有所用唐一行大衍厯議曰以恆氣注厯以定氣算日月交食是則舊法原知有定氣但不以之注厯耳譯西法者未加詳考輒謂舊法春秋二分並差兩日則厚誣古人矣夫授時厯所注二分日各距二至九十一日竒乃恆氣也厯經厯草皆明言恆氣其所注晝夜各五十刻者必在春分前兩日竒及秋分後兩日竒則定氣也定氣二分與恆氣二分原相差兩日授時既遵大衍厯議以恆氣二分注厯不得復用定氣故但於晝夜平分之日紀其刻數則定氣可以互見非不知也且授時果不知有定氣平分之日又何以能知其日之為晝夜平分乎夫不知定氣是不知太陽之有盈縮也又何以能算交食何以能算定朔乎經朔猶恆氣定朔猶定氣望與上下弦亦然夫西法以最髙卑疏盈縮其理原精初不必為此過當之言良由譯書者並從西法入手遂無暇參稽古厯之原流而其時亦未有能真知授時立法之意者為之援據古義以相與虛公論定故遂有此等偏説以來後人之疑議不可不知也其所以為此説者無非欲以定氣注厯使春秋二分各居晝夜平分之日以見授時古法之差兩日以自顯其長殊不知授時是用恆氣原未嘗不知定氣不得為差而西法之長於授時者亦不在此以定氣注厯不足為竒而徒失古人置閏之法欲以自暴其長反見短矣故此處宜酌改也後條詳之再論恆氣定氣問授時既知有定氣何為不以注厯曰古者注厯只用恆氣為置閏地也春秋傳曰先王之正時也履端於始舉正於中歸邪於終邪與餘同謂餘分也履端於始序則不愆舉正於中民則不惑歸邪於終事則不悖蓋謂推步者必以十一月朔日冬至為起算之端故曰履端於始而序不愆也又十二月之中氣必在其月如月內有冬至斯為仲冬十一月月內有雨水斯為孟春正月月內有春分斯為仲春二月餘月並同皆以本月之中氣正在本月三十日之中而後可名之為此月故曰舉正於中民則不惑也若一月之內只有一節氣而無中氣則不能名之為何月斯則餘分之所積而為閏月矣閏即餘也前此餘分纍積歸於此月而成閏月有此閏月以為餘分之所歸則不致春之月入於夏且不致今冬之月入於明春故曰歸邪於終事則不悖也然惟以恆氣注厯則置閏之理易明何則恆氣之日數皆平分故其每月之內各有一節氣一中氣假如冬至在十一月朔則必有小寒在其月望後若冬至在十一月晦則必冇大雪節氣在其月望前餘月並然此兩氣策之日合之共三十日四十三刻竒以較每月常數三十日多四十三刻竒謂之氣盈又太隂自合朔至第二合朔實止二十九日五十三刻竒以較每月三十日又少四十六刻竒謂之朔虛合氣盈朔虛計之共餘九十刻竒謂之月閏乃每月朔策與兩氣策相較之差也假如十一月經朔與冬至同時刻則大寒中氣必在十二月經朔後九十刻而雨水中氣必在次年正月經朔後一日又八十刻竒其餘月並準此求之積此月閏至三十三個月間即二年零九個月其餘分必滿月策而生閏月矣閏月之法其前月中氣必在其晦後月中氣必在其朔則閏月只有一節氣而無中氣然後名之為閏月假如閏十一月則冬至必在十一月之晦大寒必在十二月之朔而閏月只有小寒節氣更無中氣則不可謂之為十一月亦不可謂之為十二月即不得不名之為閏月矣斯乃自然而然天造地設無可疑惑者也一年十二個月俱有兩節氣惟此一個月只一節氣望而知其為閏月今以定氣注厯則節氣之日數多寡不齊故遂有一月內三節氣之時又或有原非閏月而一月內反只有一中氣之時其所置閏月雖亦以餘分所積而置閏之理不明民乃惑矣然非西法之咎乃譯書者之踈略耳何則西法原只有閏日而無閏月其仍用閏月者遵舊法也亦徐文定公所謂鎔西洋之巧算入大統之型模也按堯典云以閏月定四時成嵗乃帝堯所以命羲和萬世不刋之典也今既遵堯典而用閏月即當遵用其置閏之法而乃不用恆氣用定氣以滋人惑亦昧於先王正時之理矣是故測算雖精而有當酌改者此亦一端也今但依古法以恆氣注厯亦仍用西法最髙卑之差以分晝夜長短進退之序而分注於定氣日之下即置閏之理昭然衆著而定氣之用亦並存而不廢矣又按恆氣在西法為太陽本天之平行定氣在西法為黃道上視行平行度與視行度之積差有二度半弱西法與古法略同所異者最髙衝有行分耳古法恆氣注厯即是用太陽本天平行度數分節氣論七政之行並有周有轉有交問月五星之行並有周天有盈縮遲疾有出入黃道之交點共三事也太陽亦然乎曰並同也太陽終古行黃道則無出入黃道之交點然而黃道出入於赤道亦可名交是故春秋二分即其交點亦如月離之有正交中交也因此而日躔有南陸北陸之行古者謂之發斂行南陸為發行北陸為斂並以其離北極之逺近言之於是而四時之寒燠以分晝夜刻之永短有序皆交道之所生以成嵗周是故嵗周者即太陽之交道也與月離之交終同也然以嵗差之故西法謂之黃道東行故每嵗三百六十五日二十四刻竒此以授時古率言之已滿嵗周矣又必加一刻有半亦依古率約之始能復躔冬至元度假如本年冬至日躔箕宿三度八十分次年冬至必在箕宿三度七十分竒是嵗序已周而元度未復故必於三百六十五日二十四刻竒之外復加一刻有半始能復躔於箕三度八十分是為太陽之周天與月行之周天同也月行周天與交終原非一事是故太陽之周天與嵗周原為兩事也然太陽之行有半年盈厯半年縮厯即恆氣定氣之所由分古法起二至西法起最髙沖尤為親切亦如月離之轉終是又為一事合之前兩者嵗周與周天共為三事乃七政之所同也按月離交終以二十七日二十一刻竒而隂厯陽厯之度一周在月周天前以較周天度為有欠度也轉終以二十七日五十五刻竒而遲厯疾厯之度一周在月周天後以較周天度為有餘度也月周天之日數在二者之間亦二十七日又若干刻而周雖同大餘不同小餘當其起算之初所差不過數度如交終與轉終相差三十四刻竒即其差度為四五度積至一年即差多度太隂每年行天十三周半即相差六十餘度故其差易見日躔嵗周以二十四節氣一周為限因有恆星東行之嵗差故其度在周天前以較周天度為有欠分也約為七十分度之一日躔盈縮以盈初縮末縮初盈末一周為限因最髙有行分故其度在周天後以較周天度為有餘分也亦約為七十分度之一以一嵗言之三者並同大餘即小餘亦不甚逺嵗周三百六十五日二十四刻竒增一刻半即周天又增一刻半即盈縮厯周但差刻不差時積其差至七十年即各差一度嵗周不及周天七十年差一度即恆星東行之嵗差而盈縮厯至七十年又過於周天一度即最髙之行于是嵗周與盈縮厯周共相差二度並至七十年而後知之也故其差難見七十年只差一度故難見也然雖難見其理則同以周天之度為主則嵗周之差度退行亦如太隂交終差度之每交逆退也而盈縮入厯之差度于周天為順行亦如太隂之轉終差度每轉順行也而周天度則常不動但以太隂之交轉周比例之則判然三事不相凌雜矣問厯法中所設交差轉差即此事乎曰亦微有不同蓋交差轉差是以交終轉終與朔策相較或言其日或言其度並同兹所論者是以交終轉終與周天相較故其數不同也其數不同而厯法中未言者何也緣厯家所言在交食故於定朔言之綦詳而月之周天反略惟陳星川壤袁了凡黃所撰厯法新書明立太隂周天日數謂之月周與交終轉終並列為三實有禆於厯學而人或未知故特著之又徴之五星亦皆有周天有厯周即盈縮如月之入轉有正交中交是故此三事者日月五星之所同也知斯三者於厯學思過半矣外此則月有朔望五星有假目並以距日之逺近而生故大陽所與月五星同者惟此三事論月建非專言斗柄問行夏之時謂以斗柄初昏建寅之月為嵗首議者以冬至既有嵗差則斗柄亦從之改度今時正月不當仍為建寅其説然乎曰不然也孟春正月自是建寅非關斗柄其以初昏斗柄建寅者注釋家未深考也何則自大撓作甲子以十日為天干自甲至癸十二子為地支自子至亥天道圓故以甲乙居東丙丁居南庚辛居西壬癸居北戊巳居中參同契所謂青赤白黑各居一方皆稟中央戊巳之功也十干以配五行圓轉周流故曰天干也地道方故以寅卯辰列東巳午未列南申酉戍列西亥子丑列北易大傳所謂帝出乎震齊乎巽相見乎離致役乎坤説言乎兊戰乎乾勞乎坎成言乎艮自東而南而西而北其道左旋周而復始也是十二支以配四時十二月靜而有常故曰地支也天干與地支相加成六十甲子以紀嵗紀日紀時而皆凖於月以嵗有十二月也此乃自然而然之序不可增減不可動移是故孟春自是寅月何嘗以斗柄指寅而後謂之寅月哉如必以斗柄指寅而謂之寅月則亦有寅年寅月寅時豈亦以斗柄指寅而後得以謂之寅乎是故堯典命羲仲宅嵎夷平秩東作以殷仲春次命羲叔宅南交平秩南訛以正仲夏次命和仲宅西平秩西成以殷仲秋次命和叔宅朔方平在朔易以正仲冬此四時分配四方而以春為嵗首之證也夫既有四仲月以居卯午酉子之四正則自各有孟月季月以居四隅仲春既正東為卯月其孟春必在東之北而為寅月何必待斗柄指寅乎故日中星鳥日永星火宵中星虛日短星昴並祗以晝夜刻之永短為慿以昏中之星為斷未嘗一言及於斗柄也又考孔子去堯時已及千五百嵗嵗差之度已二十餘度若堯時斗柄指寅孔子時必在寅前二十度而指丑矣豈待今日而後知乎然孔子但言行夏之時蓋以孟春為嵗首於時為正非以斗柄指寅而謂之寅月也又考嵗差之法古雖未言然而月令昏中之星已不同於堯典則實測當時之星度也然堯典祗舉昏中星而月令兼言旦中又舉其日躔所在又於堯典四仲月之外兼舉十二月而備言之可謂詳矣然未嘗一語言斗杓指寅為孟春又考史記律書以十律配十二月之所建地支而疏其義兼八風二十八舍以為之説而並不言斗建惟天官書略言之其言曰杓擕龍角衡殷南斗魁枕參首用昏建者杓夜半建者衡平旦建者魁是則衡亦可言建魁亦可言建而非僅斗杓夜半亦有建平旦亦有建而非止初昏其言甚圓以是而知正月之為寅二月之為卯皆一定不可移而斗之星直之即謂建固非以初昏斗柄所指而命之為何月也然則謂行夏之時是以斗柄建寅之月為嵗首者蓋注釋家所據一家之説而未詳厥故也今乃遂據其説而欲改正月之建寅可乎不可乎再論斗建問説者又以各月斗柄皆指其辰惟閏月則斗柄指兩辰之間由今以觀其説亦非歟曰非也周天之度以十二分之各得三十度竒在西法為三十度凡各月中氣皆在其三十度之中半各月節氣皆居其三十度之首尾今依其説斗柄所指各在其月之辰則交節氣日斗柄所指必在兩辰之間矣假如立春為正月節則立春前一日斗柄所指在丑立春後一日斗柄指寅而立春本日斗柄所指必在丑與寅之間餘月皆然十二節氣日皆指兩辰之間又何以别其為閏月乎若夫閏月則只有節氣無中氣其節氣之日固指兩辰之間矣然惟此一日而已其前半月後半月並非兩辰之間也假如閏正月則雨水中氣在正月晦春分中氣在二月朔而閏月只有驚蟄節在月望則其前半月必指寅後半月必指卯惟驚蟄日指寅與卯之交界縫中可謂之兩辰間閏在餘月亦然地盤周圍分為十二辰首尾鱗次如環無端又何處設此三十度於兩辰間以為閏月三十日之所指乎凡若此等習説並由未經實測而但知斗杓所指為月建遂岐中生岐成此似是而非之解天下事每壞於一知半解之人往往然也又按斗柄之星距北極只二十餘度必以北極為天頂而後可以定其所指之方今中土所處在斗杓之南仰而觀之斗杓與辰極並在天頂之北其斗杓所指之方位原難清楚故古人祗言中星不言斗杓蓋以此也如淮南子等書言招搖東指而天下皆春不過大槩言之原非以此定月又按傳言營室之中土功其始火之初見期於司里又言水昏正而栽日至而畢詩亦言定之方中作於楚宫又言七月流火九月授衣古之人以星象授人時如此者不一而足也若以嵗差考之則於今日並相差一二旬矣然而當其時各據其時之星象為之著令所以使民易知也而終未有言斗杓指何方而作何事者則以其方位之難定也十二月建之非關斗柄明矣是故斗柄雖因嵗差而所指不同正月之建寅不可易也論古頒朔問論語子貢欲去告朔之餼羊孔子不然其説曰我愛其禮不知周制頒厯其式如何曰頒朔大典也蓋王政在其中矣古者天子常以冬月頒來嵗十二月之朔於諸侯諸侯受而藏諸祖廟月朔則以特羊告廟請而行之如是其隆重者何也蓋既曰請而行之則每月內各有當行之政令頒於天子而諸侯奉行惟謹焉故告朔之後即有視朔聽朔之禮所以申命百官有司以及黎庶相與恪遵以奉一王之大法此之謂奉正朔也是故大之有朝覲會同之期有鄰國聘問之節有天子巡狩朝於方嶽之時此等大禮皆以年計而必冇定期如虞書東巡狩必於仲春南巡狩必於仲夏之類其於宗廟也有禴祠蒸嘗四時之祭有耕籍田夫人親蠶以預備粢盛衣服之需其於羣神也有山川社稷祈榖報嵗八蠟五祀之典其於黌序也有上丁釋菜冬夏詩書春秋羽籥之制其於農事也有田畯勸農播種收穫溝洫隄防築場納稼之務有飲射讀法遒人徇鐸之事其於軍政也有搜苖獮狩振旅治兵之政其於土功也有公旬三日之限其於刑罰也有宥過釋滯折獄致刑之月又如藏氷用氷出火內火仲夏斬陽木仲冬斬隂木獺祭魚然後漁人入澤梁豺祭獸然後田獵之類凡若此者皆順四時之序以為之典章先王之所以奉若天道也而一代之典制既藏之太府恪守無斁矣又每嵗頒示諸侯以申命之諸侯又於每月之朔告於祖廟請而奉行之天子本天以出治無一事敢違天時諸侯奉天子以治其國無一事不遵王命以上順天時唐虞三代所以國無異俗家無異教道德一而風俗同蓋以此也故曰頒朔告朔實為大典而王政因之以行也周既東遷矣王政不行魯不告朔他國可知蓋視為辨髦久矣厥後遂有司厯再失閏之愆而大夫陪臣之僭亂紛紛矣以秉禮之國而蔑棄王朝大典何怪其羣相效尤是故夫子曰我愛其禮蓋庶幾因此羊而念及先王之典也如謂頒朔祗以識月之大小辨朔望生明死魄之干支何取乎每月告廟之繁文也哉由是以觀則三代時所頒之厯可知己矣論厯中宜忌問厯法中宜忌之説古有之乎曰無之也蓋起近代耳堯之命羲和也曰敬授人時曰東作西成曰允釐百工庶績咸熙厯之大用蓋如此也何嘗有選擇之事乎司馬遷曰閲隂陽之書使人拘而多畏其説蓋起於戰國之時夫箕子陳洪範其七曰稽疑古者有大政既斷之於主心又謀及卿士謀及庶人矣然必謀及卜筮古聖人不敢自專自用而必協謀於神人蓋其慎也戰國力爭此義不明太卜筮人之官廢疑事無所決隂陽家言乃紛然以出矣隋唐之季其説愈多故呂才援引古義著論以非之可謂深切著明矣然而教化不行吉凶福禍之説深中於人心黠者乘之各立異説以恫喝聾俗愈出愈攴六十干支而選擇之書乃有九十餘家同此一日而此以為大吉彼以為大凶令人無所適從誣民惑世莫此為甚今官厯宜忌本於選擇厯書不知其為元時所定明初所定然考史志厯代言厯者初無一字及於選擇又如羅計四餘郭守敬厯經所無而大統增入之然則此等不經之説並元統郭伯玉等所為耳原其初意或亦欲假此以定民之趨然官厯雖頒宜忌而民間偏惑通書通書既非一種而術者私書更多雖户説以渺論不能止也今若能一切刪去只載宜行政事及南北耕耘收穫之節則唐虞三代敬天勤民之至意復覩今日豈不快哉洪武中解大紳庖西封事曰治厯明時授民作事但申播植之宜何用建除之謬方向煞神事甚無謂孤虛宜忌亦且不經東行西行之論天德月德之云臣料唐虞之厯必無此等之文所宜著者日月之行星辰之次仰觀俯察事合逆順七政之齊正此類也按此説甚正惜當時不能用然實為定論聖人所不易也論治厯當先正其大其分秒微差可無深論問厯法至今日可謂詳且密矣然徴諸交食亦或有微差之刻何歟曰此可以不必深論者也考漢時不知定朔故日食或不在朔或差而前則食於晦差而後則食於初二日直至唐李淳風麟德厯始用定朔於是蝕必在朔無差日矣然尚有差時厥後大衍厯所推益密宣明厯又立氣刻時三差至宋統天厯紀元厯又加詳焉逮元授時厯遂無差時但有差刻今西厯言東西南北差以黃道九十度限為宗其理益明其法益善然而亦或有時而差刻分者何也今夫盆盎之中可以照物池沼澄清則岸上之人物花鳥山陵樹木畢現其中然而其邊際所域必有所改易兩鏡相照則多鏡層現於一時而六層以上必有所窮况乎以八尺之璣衡測大圓之宮度其大小之比例道里之遼濶不可以億計而因積候之多用算之巧遂致交食應期虧復應候東西南北方向胥符而但有晷刻之後先分秒之同異即謂之不差可矣國家治厯所重者順天出治以敬授人時日食之類所重在於修省至於時刻小差原非所重但當令司厯者細加測候詳紀其所差之數以待後來修厯者使有所據依以益精其推步而已斷不可因小節之微差而輒更成法也漢唐宋厯法屢改而多不效元明三四百年守一授時法而交食不效只數事而已况今新厯又加精於授時何必復加更變乎或謂厯算之差由於尾數豫謂此一端耳尾數有丢收無關大數所難者乃根數耳盈縮遲疾之根雖有離朱無所施其目並由年深日久然後知之又如最髙之行利氏所定與今所用不同皆根之差厯所以取象於革也厯算全書卷五
