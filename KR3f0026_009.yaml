body:
  text: 小引環中黍尺者所以明平儀弧角正形乃天外觀天之法而渾天之畫影也天圜而動無晷刻停而六合以內經緯厯然亘萬古而不變此即常靜之體也人惟囿於其中不惟常動者不能得其端倪即常靜之體所為經緯厯然者亦無能擬諸形容惟置身天外以平觀大圜之立體則周天三百六十經緯之度擘劃分明皆能變渾體為平面而寫諸片楮按度考之若以玻璃水晶通明之質琢成渾象而陳之几案也又若有鏤空玲瓏之渾儀取影於燭而惟肖也故可以算法證儀亦可以量法代算可以獨喻可以衆曉平儀弧角之用斯其妙矣庚辰中秋鼎偶霑寒疾諸務屏絶展轉牀褥間斗室虛明心閒無寄秋光入户秋夜彌長平時測算之緒來我胸臆積思所通引伸觸類乃知厯書中斜弧三角矢線加減之圖特以推明算理故為斜望之形其弧線與平面相離聊足以倣佛意象啓人疑悟而不可以實度比量固不如平儀之經緯皆為實度弧角悉歸正形可以算即可以量為的確而簡易也病間録枕上之所得輒成小帙然思之所引無方而筆之所追未能什一庶存大致俟同志之講求耳此第一卷原序也餘詳目録康熙三十有九年重九前七日勿菴力疾書時年六十有八欽定四庫全書厯算全書卷九宣城梅文鼎撰環中黍尺卷一之二總論有垂弧及次形而斜弧三角可算乃若三邊求角則未有以處也環中黍尺之法則可以三邊求角如有黃赤兩緯度可求其經可以徑求對角之邊如有黃道經緯可徑求赤道之緯立術超妙而取徑遙深非專書備論難諳厥故矣書成於康熙庚辰非一時之筆故與舉要各自為首尾凡測算必有圖而圖弧角者必以正形厥理斯顯于是以測渾圓則衡縮欹邪環應無窮殆不翅纍黍定尺也本書命名蓋取諸此用八線至弧度而竒然理本平實以八線量弧度至用矢而簡然義益多通要亦惟平儀正形與之相應一卷之先數後數所為直探其根以發其藏也平儀以視法變渾為平而可算者亦可量即視度皆實度矣二卷之平儀論所以博其趣而三極通幾其用法也黍尺名書于兹益著矢度之用已詳首卷而餘弦之用亦可參觀故又有三卷之初數次數也初數次數本用乘除亦可以加減代之故有加減法以疏厥義自三卷以後非非一時所撰今以類相附而仍各為之卷四卷之甲乙數即初數次數之變也而彼以乘除此以加減則繁簡殊矣五卷之法亦加減也而特為省徑故稱捷焉用初數不用次數用矢度不用餘弦以視甲乙數又省其半然不可不知其變故又有補遺之術也恆星厯指之法别成規式而以加減法相提而論固異名而同實是以命之又法也以上環中黍尺之法約之有六用乘除者二其一先數後數其一初數次數也用加減者四初數次數也甲乙數也捷法也又法也本書中具此六術然而加減捷法其尤為善之善者歟外有不係三邊求角之正用並可通之以加減之法者是為加減通法蓋術之約者其理必精數之確者為用斯博並附數則于五卷之末以發其例弧三角用平儀正形之理作圖之法有二一為借象一為正形以平寫渾不得已而為側睨遙望之形以曲狀其變然多借象而非正形兹一準平儀法度置二極于上下而從旁平視之如置身大員之表以觀大員則渾球上凸面之經緯弧角一一可寫于平面而悉為正形于是測望之法步算之源皆不煩箋疏而解平儀用實度之理斜視之圖無實度可紀弧角之形聊足相擬其實度非算不知兹者平儀既歸正形則度皆實度循圖可得即量法與算法通為一術以橫徑查角度以距緯查弧度並詳二卷平儀用矢線之理八線中有矢他用甚稀乃若三邊求角則矢線之用為多而又特為簡易信古人以弧矢測渾員其法不易然亦惟平儀正形能著其理下文詳之矢線之用有二一矢線為角度之限鈍角用大矢鋭角用小矢小矢即正矢也從半徑言之為正矢從全徑言之為小矢法曰置角度于平儀之周則平員全徑為角線所分而一為小矢一為大矢平儀橫徑即渾員之腰圍故大矢即鈍角度小矢即鋭角度如圖渾球上甲戊甲丁甲丙三小弧與甲已同度故同用甲已為正矢丁乙戊乙丙乙三過弧與已乙同度故同用已乙為大矢一矢較為弧度之差大弧用大矢弧度過象限為大弧故大矢亦大于半徑小弧用小矢弧度不及象限為小弧故正矢小于半徑較弧與對弧並同法曰置較弧對弧于員周角旁兩弧之較為較弧亦曰存弧對角之弧為對弧亦曰底弧則各有矢線而同軸可得其差謂之兩矢較也較弧對弧並小則為兩正矢之較兩弧俱象限以下故俱用正矢較弧小對弧大為正矢大矢之較較弧在象限以下用正矢對弧過象限用大矢較弧對弧並大為兩大矢之較兩弧俱過象限故俱用大矢凡較弧必小於對弧則較弧矢亦小於對弧矢故無以較弧大矢較對弧正矢之事法所以恆用加也若較弧用大矢則對弧必更大如圖丑乙弧之正矢辛乙庚乙寅乙二弧同用子乙弧之正矢壬乙癸乙卯乙同用則辛壬為兩矢之較即為癸乙寅乙兩弧度之較也或丑乙與子乙或庚乙與癸乙或寅乙與卯乙並同又如戊乙弧之大矢已乙與丑乙弧之正矢辛乙相較得較已辛或子乙弧之正矢壬乙與丙乙弧之大矢已乙相較得較巳壬皆大矢與正矢較也又如甲丑弧之大矢辛甲與甲卯弧之大矢壬甲相較得較辛壬則兩大矢較也約法凡求對角之弧並以角之矢為比例鈍角用大矢鋭角用正矢求得兩矢較半徑方一率正弦矩一率角之矢三率兩矢較四率以加較弧之矢較弧大用大矢較弧小用正矢得對弧矢加滿半徑以上為大矢其對弧小遇象限加不滿半徑為小矢其對弧小不過象限此不論角之鋭鈍邊之同異通為一法凡三邊求角並以兩矢較為比例求角之矢半徑方一率餘割矩二率兩矢較三率角之矢四率得數大于半徑為大矢其角則鈍得數小于半徑為正矢其角則鋭亦不論邊之同異通為一法問用矢用餘弦異乎曰矢餘弦相待而成者也可以矢算者亦可用餘弦立算但加減尚須詳審若矢線則一例用加尤為簡妙先數後數法此以平儀弧角正形解渾球上斜弧三角用矢度矢較為比例之根也先得數者正弦上距等圈矢也與角之矢相比後得數者而矢較也與較弧矢相加設丙乙丁斜三角形有乙鋭角有丙乙弧小于象限丁乙弧大于象限是為角旁之兩弧不同類求丁丙為對角之弧用較弧角旁兩弧相減及對弧兩正矢之較為加差法以大小兩邊各引長之滿半周遇于戊作戊甲乙圜徑又于圜徑折半處巳命為渾圜心又自己心作橫半徑如巳寅辛則寅辛即乙角之弧亦即為乙角之矢平視之為矢度實即角度之弧躋縮而成而寅已即乙角之餘弧亦即為乙角餘弦因視法能令餘弧躋縮成餘弦又自丁作橫半徑巳辛之平行線如壬丁甲此平行線即乙丁大邊之正弦因平視故乙丁小于乙壬其實乙丁弧之度與乙壬同大今壬甲既為戊壬及乙壬之正弦亦即為乙丁之正弦矣而此正弦壬甲又即為距等圈之半徑也想戊巳乙為半渾圜之中剖國面側立形乃自壬丁甲橫切之則壬甲為其橫切之半徑則其丁壬分線亦為距等圈上丁壬弧之矢線矣有距等圈半徑即有其弧而此大小兩矢線各與其半徑之比例皆等己辛大圜之半徑大故寅辛矢亦大甲壬距等圈之半徑小故壬丁矢亦小然其度皆乙角故比例一也距等雖用戊角而戊角即乙角有兩弧線限之故也法為已辛與甲壬若寅辛與壬丁一率半徑已辛二率大弧正弦壬甲卯距等圈之半徑三率乙角矢寅辛四率先得數壬丁即距等圈之正矢次從丙向已心作丙巳半徑此線為加減之主線以較弧對弧俱用為半徑而生矢度又從壬作壬卯為壬丙較弧之正弦壬乙既同丁乙則丁乙弧之大于丙乙其較為壬丙又從丁作癸丁午線為丁丙對弧之正弦因平視故丁丙弧小于癸丙其實丁丙弧與癸丙同大癸午既為癸丙正弦亦即丁丙之正弦矣因兩正弦平行又同抵巳丙半徑為十字正方角故比例生焉此立算之根本又從丁作丁子線與午卯平行而等以有對弧較弧兩正弦為之限也成壬丁子句股形又從丙作丙辰線為乙丙小邊之正弦成已丙辰句股形此大小兩句股形相似巳丙辰與卯已奎小形相似則亦與壬丁子形相似等角等勢故也法為丙已與辰丙若壬丁與丁子一率半徑丙已弦二率小弧正弦辰丙股三率先得數壬丁小弦四率兩矢較丁子小股省算法用合理因上兩宗內各冇先得數而一為三率一為四率故對去不用乃以後得數為矢較加較弧矢以午卯加卯丙也成對弧矢午丙末以對弧矢午丙減半徑巳丙成對弧餘弦午已檢表得對弧丁丙之度又法以後得數減較弧餘弦以午卯減卯已成對弧餘弦午己檢表得對弧丁丙度亦同兩正矢之較即兩餘弦較也故加之得矢者減之即得餘弦若先有三邊而求乙鈍角則反用其率因前四率反之以首率為次率三率為四率以乙角矢寅辛減半徑辛巳得餘弦寅巳檢表得乙角之度右鋭角以二邊求對邊及三邊求角並以兩矢較為加差以差加較弧矢得對弧大三邊求角則為三率亦為兩餘弦較依又法以差減較弧餘弦為對弧餘弦三邊求角則兩餘弧相減為三率角旁弧異類對邊小設亥乙丁斜弧三角形有乙鈍角有亥乙小弧丁乙大弧求亥丁對角弧用較弧正矢與對弧大矢之較為加差戊乙徑為取角度之根亢寅角度及房甲與亥虛兩正弦皆依之以立大矢即鈍角之弧度小矢即鋭角之弧度亥斗徑為加減之根房氐及危心兩正弦依之以立有兩正弦即有兩餘弦及大小矢而加減之用生焉法以大小兩邊各引長之滿半周遇于戊又依小邊半周乙亥戊補其餘半周戊辛乙成全圓又從戊至乙作圓徑又作亢辛橫徑兩徑相交于已即圓心則寅辛為乙角之小矢而寅亢為乙角之大矢寅已亢即乙鈍角之弧度平視之成大矢若自寅點作直線與戊乙平行取距戊乙之度加象限即角度又從丁作房丁壬橫線與亢辛橫徑平行此線即丁乙大邉正弦之倍數房丁壬與亢辛平行則房乙即丁乙也因平視故丁乙小于房乙耳而房甲既為房乙之正弦亦即丁乙正弦也房甲既為正弦房壬則倍正弦矣倍正弦即通弦而此房壬倍正弦又即為距等圈之全徑想全體渾圓從壬丁房橫切之成距等圈而房壬其全徑則房丁分線亦即為距等圈上丁甲房弧之大矢有距等圈全徑即有其全圈而房甲丁其切弧而此兩大矢線各與其全徑之比例皆等亢辛全徑大故寅亢大矢亦大房壬距等圈之全徑小故房丁大矢亦小然其度皆乙角之度在乙丁戊及乙房戊兩弧線之中故各與其全圓之比例等而其大矢亦各與其全徑之比例等即各與其半徑之比例亦等若以甲為心壬為界作半圓于房壬線上則距等之弧度見矣法為亢辛全徑與房壬距等全徑即倍正弦若寅亢鈍角大矢與房丁先得數亦距等大矢而亢已半徑與房甲乙丁正弦亦距等半徑亦若寅亢與房丁一率亢巳半徑二率房甲大邉之正弦亦距等半徑三率寅亢鈍角大矢四率房丁先得數亦距等大矢次從亥過巳心作亥已斗全徑為加減主線較弧對弧之弦俱過此全徑而生大小矢又從房作房氐線為房亥較弧之正弦准前論房乙同丁乙則丁乙之大于亥乙其較房亥又從丁作心丁婁線與房氐正弦平行而交亥斗徑于危如十字則此線為亥丁對弧之倍正弦因視法心亥弧大于亥丁其實即亥丁也亥丁為平視躋縮之形心亥為正形而心危者心亥弧之正弦也是即亥丁弧之正弦而心丁婁其倍弦矣又從丁作丁女線與斗亥徑平行亦引房氐較弧之正弦為通弦而與丁女線遇于女成丁女房句股形又從亥作亥虛線與亢辛橫徑及大邊之正弦房甲俱平行成亥虛已句股形此大小兩句股形相似亥巳即徑線與丁女平行亥虛與房甲丁平行則大形之丁角與小形之亥角等而女與虛並正角則為等角而相似法為已亥半徑與亥虛小邊正弦若房丁先得數而距等大矢與丁女後得數亦即氐危為較弧正矢氐亥及對弧大矢危亥之較一率半徑已亥弦二率小邊正弦亥虛句三率先得數房丁大弦四率後得數丁女大句乃以省算法平之乃以後得數加較弧正矢以氐危加氐亥成危亥為對弧大矢內减半徑得對弧餘弦檢表得度以減半周為對弧之度又法于後得數內減去較弧餘弦成對弧餘弦于氐危內減氐巳其餘危巳即對弧餘弦乃以餘弦檢表得度以減半周為對弧之度大矢與小矢之較即兩餘弦併也內減去一餘弦即得一餘弦矣觀圖自明前用鋭角是于較弦餘弦內減得數為對弧餘弦此用鈍角是于得數內減較弧餘弦為對弧餘弦若有三邊而求角度者則反用其率一半徑上方一兩正弦矩半徑上方二兩正弦矩二半徑上方兩餘割相乘矩三鈍角大矢寅亢三兩餘弦并氐危即較弧正矢與對弧大矢之較四兩餘弦并丁女即氏危四鈍角大矢寅亢乃于所得大矢內減去半徑成餘弦以餘弦檢表得度用減半周為鈍角之度右鈍角求對邊及三邊求鈍角並用兩矢之較為加差以差加較弧正矢得對弧大矢又為三邊求角之三率亦為兩餘弦并依又法減較弧餘弦得對弧餘弦三邊求角即并兩餘弦為三率其鈍角旁兩弧異類對弧大設丁辛乙斜弧三角形有辛丁邊五十度一十分丁乙對角邊六十度辛乙邊八十度三邊並小求辛鋭角法先為戊亢辛全員作戊辛員徑又作亢巳橫員徑兩徑十字相交于巳心此線上有角度次于戊辛徑左右任取自辛數至丁如所設角旁小邊五十度一十分之數截丁辛為小邊又從丁過巳作徑線此線上有加減度為較弧對角弧兩正弦所依仍自辛過丁數至房如所設大邊八十度之數截房丁為大小兩邊之較弧又自丁過房數至心如所設對邊六十度之數截心丁與乙丁等仍自丁過辛截婁丁度如心丁乃作婁心直線聨之為心丁對弧之倍正弦又從房作房甲橫線與亢巳橫徑平行此為乙辛大邊之正弦因視法房辛即乙辛詳後次視婁心倍弦與房甲正弦兩線相遇于乙命為斜弧形之角乃從乙角向辛作乙辛弧此弧亦八十度與房辛同大是所設角旁之大邊理在平儀視法房辛是真度乙辛是視凸為平躋縮之形想平儀原係渾體從房乙甲橫切之則自房至甲為距等圈之九十度從此線上度度作弧至辛極並八十度不惟乙辛與房辛同大即甲辛亦與房心同大也他倣此又從乙向丁作乙丁弧此弧亦六十度與心丁同大是所設對角之邊切渾角以心婁距等圈而以丁為極則危丁亦六十度與心丁同大矣乙丁同大不言可知遂成乙辛丁斜弧三角在球上之形與所設等又從乙引乙辛弧線至戊成心乙戊半周側立形此線截亢巳半徑于寅則亢寅為辛角矢度而寅己其餘弦次從丁作丁虛橫線與房甲正弦平行是為辛丁小邊之正弦又從房作房卯線與心危婁平行則此線為房丁較弧之正弦其心危則乙丁對弧之正弦又從乙作乙女線與卯危平行而等線在兩正弦平行線之中而赤平行不得不等是為較弧與對弧兩正矢之較房卯為較弧正弦則卯已為餘弦而卯丁其矢又心危為對弧正弦則危巳為餘弦而危丁其矢此兩正矢之較為危卯而乙女與之等則乙女亦兩矢之較矣法曰巳丁虛句股形與房乙女句股形相似房乙與丁虛平行乙女與巳丁平行則所作之大形丁角小形乙角必等而大形之虛小形之女並正角則兩形相似故丁虛小邊正弦與丁巳半徑若乙女即卯危較弧餘弦與對弧餘弦之較與乙房先得數又房甲正弦之分為乙房猶亢巳之分為寅亢其全與分之比例皆相似從房甲線切渾員成距等圈而房甲為其半徑猶渾員之有亢巳為半徑也兩半徑同為戊寅辛弧線所分則乙房為距等圈半徑之矢度猶寅亢為大員半徑之矢度也其比例俱相似故房甲大邉正弦即距等圈半徑與亢巳大員之半徑若乙房先得數即距等圈之矢與寅亢後得數即角之矢線以省算法平之即異乘同乘異除同除較弧二十九度五十分餘弦八六七四八正矢一三二五二其較三六七四八對弧六十度五五一半徑方一首率除宜去十尾乃先于二率二餘割矩一三二二三二三四八九去五位故得數只去五位即如三兩矢較三六七四八共去十位也四鋭角矢四八五九二用減半徑得辛角餘弦五一四八檢表得五十九度四分為辛角之度此與厯書所算五十八度五十三分只差十一分又法徑求餘弦法曰房甲之分為乙房而其餘乙甲猶亢已之分為亢寅而其餘寅已也故其全與分餘之比例亦相似法為房甲正弦與亢己半徑若乙甲正弦分線之餘與寅已半徑截矢之餘即角之餘弦准前論小邊之正弦虛丁句與半徑丁巳弦若較弧對弧兩矢之較乙女小句與大邊正弦之分線乙房小弦也先求乙房為先得數以轉減大邊正弦房甲得分餘線乙甲一小邊五十度一正弦丁虛七六七九一二半徑丁巳一三較弧二十九度五對弧六十度兩正矢較乙女三六七四八四先得數大邉正弦之分線乙房四七八五四以先得數減大邉八十度正弦房甲九八四八一得大邊正弦內乙房分線之餘乙甲五六二七未以分餘線為三率一大邊正弦房甲九八四四一二半徑亢已一三分餘線乙甲五六二七四角之餘弦寅已五一四七檢表得五十九度四分與先算合附厯書斜弧三角圖稍為校正丙乙丁弧三角形乙丙角旁小弧壬乙同丁乙角旁大弧壬丙為較弧癸丙同丁丙為對角之弧甲壬為大弧正弦辰丙為小弧正弦壬卯為較弧正弦癸午為對弧正弦寅辛為乙角之弧庚辛為乙角之矢卯丙為較弧之矢午丙為對弧之矢午卯為兩矢較酉壬為先得數酉子同午卯亦兩矢之較法為全數己辛與大弧正弦甲壬若角之矢庚辛與先得數酉壬又全數巳丙與小弧正弦辰丙若先得數酉壬與兩矢較酉子也一率全之方二率兩正弦矩三率角之矢四率得兩矢較以兩矢較加較弧之矢為對弧之矢論曰此因欲顯酉壬為甲壬距等半圈之矢度故特為斜望之形其實丁點原在酉寅點原在庚丁壬弧即酉壬線寅辛弧即庚辛線乙寅丁戊弧原即為乙庚酉戊弧也故以平儀圖之則皆歸正位矣所以者何平儀上惟經度有弧線之形其距等圈緯度皆成直線而寅庚為角度之正弦直立下垂從其頂視之成一點矣丁酉者大弧正弦甲壬上所作距等圈之正弦也從頂視之而成一點與寅庚一也其寅已半徑勢成斜倚從上視之與已庚餘弦同為一線甲丁與甲酉亦然此皆平面正形可以算亦可以量非同斜望比也愚故謂惟平儀為正形也若乙角為鈍角成亥乙丁三角形則當用房亥較弧之正矢牛亥與同丁亥對弧之心亥弧大矢危亥相減成兩矢之較牛危即女酉以較加較弧正矢為對弧大矢法詳前例但前例鈍角旁小弧不同乙丙故此圖以相同者論之更見其理之不易乙為鈍角用大矢之圖此用平儀正形故丁與酉同為一點設角之一邊適足九十度一邊大用鋭角餘角一鈍一鋭法為半徑與大邊之正弦若角之矢與兩矢較也亦若角之餘弦與對弧之餘弦乙丁丙斜三角形丙丁邊適足九十度乙丁邊大于九十度丁鋭角求對邊丙乙法先作平員分十字從丁數丁壬及丁丑並如乙丁度作距等線聫之壬丑又于壬丑線上取乙點法以壬巳為度巳為心作半員分勻度而自壬取角度得乙㸃作庚乙癸直線為對弧之正弦又取壬丙為較弧作壬卯正弦較弧之矢卯丙對弧之矢癸丙其較卯癸與壬乙等壬已正弦又即距等圈半徑而為丁乙戊弧所分則壬乙如矢乙已如餘弦與角之丙子矢子甲餘弦同比例一半徑丙甲一半徑丙甲二大邉正弦壬已二大邉正弦壬已三角之矢子丙三角之餘弦子甲四兩矢較壬乙即卯癸四對弧餘弦乙已即癸甲若丁為鈍角用大矢法為半徑與大邊之正弦若角之大矢與兩矢較也亦若鈍角之餘弦與對弧之餘弦借前圖作乙辛為對角之弧成乙丁辛三角形三角俱鈍作丑午為較弧丑辛正弦以丑丁同乙丁故其庚癸為對弧乙辛之正弦以庚辛即乙辛故較弧之正矢午辛對弧之大矢癸辛其較癸午與丑乙等依前論壬乙為距等圈小矢則乙丑為大矢壬丑為距等圈全徑與其大矢乙丑之比例若丙辛全徑與鈍角之大矢子辛則已丑為距等半徑與其大矢丑乙亦若甲辛半徑與鈍角之大矢子辛也而丑已原為乙丁大邊之正弦丑乙原與癸午等故法為半徑甲辛與鈍角之大矢子辛若大邊之正弦已丑與兩矢較丑乙或癸午也一半徑甲辛一半徑甲辛二大邉正弦丑巳二大邉正弦丑已三鈍角大矢子辛三鈍角餘弦子甲四兩矢較癸午四對邉餘弦乙已用餘弦入表得度以減半周得對邉之度一系距等圈上弧度所分之矢與餘弦與大矢與其半徑或全徑並與大圈上諸數比例俱等又按前法亦可以算一邉小于象限之三角於前圖取乙戊丙斜弧三角形用戊鋭角餘角一鈍一鋭有丙戊大邊足九十度有乙戊邊小于九十度求對戊角之乙丙邊法從乙㸃作壬已線為小邉乙戊之正弦以壬戊即乙戊故又從乙㸃作庚癸為對弧乙丙之正弦以庚丙即乙丙故于是較弧之矢為卯丙對弧之矢為癸丙而得兩矢之較為癸卯則又引戊乙小邉之弧過半徑于子而合大圈于丁分子丙為戊角之矢子甲為角之餘弦法曰丙甲半徑與壬已小邉弦若子丙戊角之矢與乙壬兩矢較也得乙壬即得癸卯捷法不用較弧但作壬已為小弧乙戊之正弦作庚癸為乙丙對弧之正弦其餘弦癸中又引小邉戊乙分半徑於子得子甲為戊角之餘弦法曰丙甲半徑與壬已小邉正弦若子甲戊角餘弦與乙巳對邉餘弦得乙己得癸甲矣又于前圖取辛戊乙三角形用戊鈍角餘角並鋭有戊辛大邉九十度有戊乙邉小于九十度求對戊鈍角之辛乙邉用捷法于乙㸃作壬丑為乙戊小邉之通弦作庚癸為乙辛對弧之正弦其餘弦甲癸又引戊乙小邉割丙辛全徑於子分子辛為鈍角大矢子甲為鈍角餘弦法為甲辛與丑已若子甲與乙巳得乙巳即得癸甲一半徑甲辛即丙辛全徑之半二小邉王弦丑已即壬丑通弦之半三鈍角餘弦子甲四對邉餘弦癸甲即乙巳若先有三邉而求角則反用其率一半徑二小邉餘割三對邉餘弦四角之餘弦一系凡斜弧三角形有一邉足九十度其餘一邉不拘小大通為一法皆以半徑與正弦若角之矢與兩矢較也亦若角之餘弦與對邉之餘弦若置大小邉于員周其算亦同乙丁丙斜弧三角形乙丁邉適足九十度丁丙邉小于九十度有丁鋭角求對邉丙乙法于平員邉取丙丁度作丙已為小邉之正弦又自丙作丙甲過心線又作壬卯線為丙壬較弧之正弦又作庚乙癸線為對弧乙丙之正弦庚丙即乙丙故乙壬為丁角之矢乙甲為丁角之餘弦癸丙為對弧之矢癸甲為餘弦卯丙為較弧之矢卯甲為餘弦對弧較弧兩矢之較卯癸亦即乙辰法曰甲丙已壬乙辰乙甲癸三句股相似故甲丙半徑與丙已小邉正弦若壬乙角之矢與乙辰兩矢較亦若乙甲角之餘弦與甲癸對弧餘弦三邉未角法一半徑壬甲即甲丙二小邉餘割甲甲三對弧餘弦癸甲四角之餘弦乙壬又于前圖取乙戊丙三角形用戊鋭角餘角一鈍一鋭有乙戊邉九十度有戊丙大邉求對戊角之丙乙邉用捷法自丙作丙已為丙戊大邉之正弦即從丙作丙甲半徑乃于乙點作庚癸為丙乙對弧之正弦其餘弦癸甲而戊乙弧原分乙甲為戊角之餘弦法曰甲丙巳句股與乙甲癸相似故甲丙半徑與丙巳若乙甲角之餘弦與甲癸對邊餘弦若丁為鈍角餘角並鋭用大矢借前圖作丑乙為對角之弧成丑丁乙三角丁為鈍角作丑甲寅徑又作辛丑較之正弦辛午以辛丁同丁乙故作丑乙對弧之正弦子酉引過乙至亥成通弦又作辛未線與酉午平行而等較弧之正矢午丑對弧之大矢酉丑相較得酉午亦即未辛乙辛與丁鈍角大矢乙甲為鈍角餘弦法曰甲丑已乙辛未乙甲酉三句股相似故甲丑半徑與丑已小邉正弦若乙辛角大矢與未辛兩矢較亦若乙甲角之餘弦與甲酉對弧餘弦又于前圖取乙戊丑形用戊鈍角三角俱鈍有乙戊邉九十度有丑戊大邉求對鈍角之丑乙邉用捷法自丑作丑已為丑戊大邉之正弦又自丑作丑甲寅全徑又自乙作亥酉為對邉丑乙之正弦以亥丑即乙丑故其餘弦酉甲而乙甲原為戊鈍角之餘弦法曰甲丑己句股形與乙甲酉相似故甲丑半徑與丑已大邉正弦若乙甲鈍角餘弦與甲酉對邉餘弦又設丙乙丁三角形乙為鈍角餘一鈍一鋭乙丙邉小丁乙邉大對邉丁丙大于象限較弧壬丙亦大于象限惟對邉較弧俱大于象限故所得為兩大矢之較其正弦比例仍用小矢以角為鋭角也壬丙較弧之大矢卯丙加後得數午卯為對弧丁丙之大矢丁丙即癸丙故大矢午丙內減半徑已丙得午已為餘弦以檢表得庚癸之度以減半周得癸丙之度即對弧丁丙之度又法以得數午卯加較弧之餘弦卯巳得午已為對弧餘弦以兩大矢較即兩餘弦較也餘同上若于前圖取丁乙庚三角形則角旁兩邉俱大于象限而對邉小於象限較弧亦小于象限乙為鈍角三角俱鈍有庚乙與丁乙兩大邉而較弧丑庚小故所得為兩小矢之較其正弦比例則用大矢以乙為鈍角故也丑庚為較弧其正弦丑亥餘弦亥已對弧庚丁即庚酉其正弦酉午餘弦午已兩矢較亥午即餘弦較又設丙乙丁三角形乙為鋭角餘一鈍一鋭乙丙邉小丁乙邉大對弧丁丙大于象限較弧壬丙小于象限所得為對弧大矢與較弧小矢之較其正弦比例仍用小矢以乙鋭角故兩餘弦并即大矢與小矢之較也法以得數午卯加較弧之正矢卯丙成午丙為對弧之大矢午丙內減去半徑已丙得午巳餘弦乃以餘弦檢表得度以減半周得對弧丁丙之度若于得數內減較弧餘弧卯己亦即得午己餘弦餘如上又于前圖取丁乙庚三角形乙為鈍角三角俱饒角旁兩邉俱大于象限惟對邉小故用兩正矢較其正弦比例仍用大矢以鈍角故乙丁弧之通弦丑壬為乙丁弧所割成丑丁亦割其戌辛全徑于寅成寅戌為鈍角大矢而比例等又丑庚為較弧其正弦丑亥其矢亥庚對弧庚丁之通弦酉癸其矢午庚兩矢之較為亥午以兩矢較亥午加丑庚較弧之矢庚亥成午庚為對弧丁庚之矢以矢減半徑庚已得對弧之餘弦午巳檢表得丁庚度論曰先得數何以能為句股比例也曰先得數即距等圈徑之分線也其勢既與全徑平行又其線為弧線所分其分之一端必與對弧相㑹蓋對弧亦從此分也其又一端必與較弧相㑹是此分線恆在較弧對弧兩正弦平行線之中斜交兩線作角而為弦則兩正弦距線必為此線之句矣而兩矢之較即從兩正弦之距而生故不論大矢小矢其義一也然則正弦上所作句股何以能與先得數之句股相似邪曰兩全徑相交于員心則成角各正弦又皆為各全徑之十字橫線則其相交亦必成角而橫線所作之角必與其徑線輳心之角等角等則比例等矣大邉小邉之正弦皆全徑之十字橫線也較弧對弧之正弦皆又一全徑之十字橫線也此兩十字之各線相交而成種種句股其角皆等仍于前圖取丁戊庚三角形戊鈍角餘並鋭三邊俱小于象限戊丁弧之通弦丑壬正弦甲壬又引戊丁弧過全徑于寅㑹于乙則寅戌為戊鈍角之大矢亦割丑壬通弦于丁則丑丁與通弦若寅戌大矢與全徑也又戊庚弧之正弦庚申為句則已庚半徑為其弦其比例若丑未為句而丑丁為弦也又丑庚為較弧其正弦丑亥其餘弦亥已其矢亥庚對弧庚丁之通弦酉癸正弦癸午餘弦午已其矢午庚兩矢之較為亥午對弧小故用兩小矢之較戊鈍角故以角之大矢為比例並同上條兩法並用鈍角其度同所求之庚丁弧又同故其法並同即此可明三角之理仍于前圖取丁丙戊三角形有丁丙及戊丙二大邊有丙鋭角餘一鈍一鋭求丁戊對邊法引丁丙及戊丙二弧㑹于庚作庚丙徑作已亢及已戊兩半徑作癸午為丁丙邊正弦而丁丙弧割癸午正弦于丁亦割亢已半徑丁心則亢已之分為心亢猶癸午之分癸丁也又作戊井為戊丙弧之正弦成戊已井勾股形又從丁作壬甲為對弧戊丁之正弦其矢甲戊又取癸戊為較弧以癸丙同丁丙故作癸氐為較弧正弦其矢氐戊兩矢之較為氐甲又從丁作斗丁與氐甲平行而等成丁斗癸小句股形與戊已井形相似則已戊弦與井戊句若癸丁弦與斗丁句也此因對弧小故所得為小矢之較而用丙鋭角故只用角之正矢為比例丁又此因用丙角求戊丁邉矣故另為比例若用戊角求丙弧則與第一條之法同以甲氐加較弧之矢氐戊成甲戊為對弧之矢如法取其度得丁戊右例以一圖而成四種三角形皆可以入算而諸線錯綜有條不紊可見理之真者如取影于燈宛折惟肖也又丁丙戊三角形亦可以戊角立算餘三角並然角丁乙丙形可用丙角庚戊丁形庚乙丁形俱可用庚計開一圖中三角形凡四一丁乙丙形一丁戊丙形一丁乙庚形一丁戊庚形全徑凡二一戊乙徑一庚丙徑算例凡八右前四例皆以乙戊徑為主線丙庚徑為加減線後四例皆以丙庚徑為主線乙戊徑為加減線一係凡三角形以一邉就全員則此一邉之兩端皆可作線過心為全員之徑而一為主線一為加減線皆視其所用之角凡所用角在徑線之端則此徑為主線餘一徑為加減線几用鋭角則主線在形外用鈍角則主線在形內凡角旁兩弧線引長之各成半周必復相㑹而作角其角必與原角等凡主線皆連于所用角之鋭端或在形內或在形外並同其引長之對角亦必連于主線之又一端也若主線在形內破鈍角端者其引長之鈍角亦然一係凡兩徑線必與兩弧相應如角旁弧引長成半周其首尾皆至主線之端是主線即為此弧之徑也如對角弧引長成半周首尾皆至加減線之端是加減線即為對弧之徑也主線既為引長角旁一弧之徑又原為全員之徑而角旁又一弧之引長線即全員也故角旁兩弧皆以主線為之徑加減線既為對弧之徑而較弧在員周其端亦與加減線相連又加減線原為全員徑故較弧對弧皆以加減線為徑一係凡全徑必有其十字過心之橫徑而正弦皆與之平行皆以十字交于全徑引之即成通弦主線既為角旁兩弧之徑故角旁兩弧之正弦通弦皆以十字交于主線之上而其餘弦其矢皆在主線加減線既為對弧較弧之徑故對弧較弧之正弦皆以十字交于加減線而其餘弦其矢皆在加減線一係凡角旁之弧引長之必過橫徑分為角之矢角之餘弦若鈍角則分大矢角旁引長之弧過橫徑者亦過正弦通弦故其全與分之比例皆與角之大小矢及餘弦之比例等平儀論論以量代算之理以橫線截弧度以直線取角度並與外周相應如艮已弧距極三十度為申未橫線所截故其度與外周未已相應坎乙應戌乙亦同又乾乙弧距極六十度為丑卯橫線所截故其度與外周丑乙相應巽已應午已亦同又如戊已辛角有未戊辰直線為之限知其為六十度角以與外周未午辛之度相應也癸乙子三十度角應子丑度亦然又庚已子鈍角有午卯庚直線為之限知其為百五十度角以與外周午未已申寅子弧度相應也壬乙辛百二十度角應戌乙辰卯辛弧亦然論曰平儀有實度有視度有直線有弧線直線在平面皆實度也弧線在平面則惟外周為實度其餘皆視度也實度有正形故可以量視度無正形故不可以量然而亦可量者以有外周之實度與之相應也何以言之曰平儀者渾體之晝影也置渾球于案自其頂視之則惟外周三百六十度無改觀也其近內之弧度漸以側立而其線漸縮而短離邉愈逺其側立之勢益髙其躋縮愈甚至于正中且變為直線而與員徑齊觀矣此躋縮之狀隨度之髙下而遷其數無紀故曰不可以量也然而以法量之則有不得而遁者以有距等圈之緯度為之限也試橫置渾球于案任依一緯度直切之則成側立之距等圈矣此距等圈與中腰之大圈平行其相距之緯度等故曰距等也其距既等則其圈踓小于大圈而其為三百六十度者不殊也從此距等圈上逐度作經度之弧其距極亦皆等特以側立之故各度之視度躋縮不同而皆小于邉之真度其實與邉度並同無小大也特外周則眠體而內線立體耳故曰不可量而可量者以有外周之度與之相應也此量弧度之法也弧度者緯度也量法詳後然則其量角度也奈何曰角度者乃經度也經度之數皆在腰圍之夫圈此大圈者在平儀則變為直線不可以量然而亦可以量者亦以外周之度與之相應也試于平儀內任作一弧角如乙已丙平員內作已丙戊角欲知其度則引此弧線過橫徑于戊而㑹于乙則已戊弧即丙鋭角之度戊壬弧即而鈍角之度也然已戊壬兩弧皆以視法變為平線又何以量其度法于戊㸃作庚辛直線與乙丙直徑平行則已庚弧之度即戊巳弧之度亦即丙鋭角之度矣其餘庚乙壬之度即戊丁壬弧之度亦即丙鈍角之度矣故曰不可量而實可量者以有外周之度與之相應也然此法惟角旁弧度適足九十度如戊丙則其數明晣若角旁之弧或不足九十度又何以量之曰凡言弧角者必有三邉如上所疏既以一邉就外周真度其餘二邉必與此一邉之兩端相遇于外周而成角此相遇之兩㸃即餘兩弧起處法即從此起數借外周以求其度而各循其度作距等橫線乃視兩距等線交處而得餘一角之所在遂補作餘兩弧而弧三角之形宛在平面再以法量之則所求之角可得其度矣此量角度之法也今設乙丁丙弧三角形丁丙邉五十度乙丙邉五十五度乙丁邉六十度而未知其角法先作戊巳庚丙平員又作巳丙及戊庚縱橫兩徑任以丁丙邉之度自直線之左從丙量至丁得五十度為丁丙邉又自丙左右各數五十五度如辛丙及子丙皆如乙丙之度乃作辛子線聯之為五十五度之距等圈又自丁作卯丁徑線自丁左右各數六十度為癸丁及丑丁皆如乙丁之數亦作丑癸線聨之為六十度之距等圈此兩距等線相交于乙則乙㸃即為乙丙及乙丁兩邉相遇之處而又為一角也乃自乙角作乙丙及乙丁兩弧則乙丙丁三角弧形宛然平面矣再以法量之則丁丙兩角亦俱可知欲知丙角即用辛子距等線以半線午子為度以午為心作子酉辛半員句分一百八十度此辛子徑上距等圈之真形也乃自乙㸃作直線與午丙徑平行截半員于酉乃從酉數至子得酉子若干度此即乙丙丁鋭角之度以減半周得酉辛若于度亦即乙丙辛鈍角之度也欲知丁角亦即用丑癸距等線以半線辰癸為度辰為心作丑亥癸半員分一百八十度此亦丑癸徑上距等圈之正形也乃自乙㸃作直線與辰卯徑平行截半員于亥即從亥數至癸得亥癸若干度此即乙丁丙鈍角之度以減半周得亥丑若干度又即乙丁丑鈍角之度也計開丙角七十八度稍弱以算考之得七十七度五十五分丁角六十七度三分度之二以算考之得六十七度三十九分右量角度以圖代算欲得零分須再以算法考之即知無誤又設乙丙丁弧三角形有六十度丙角有乙丙邉一百度有丁丙邉一百二十度求丁乙邉對角之邉法先為巳戊丙庚大圈作巳丙及庚戊十字徑乃自丙數至辛如所設丁丙邊一百二十度自丙至子亦知之作辛十子線為一百二十度之距等圈又以距等之半線辛午為度午為心作辛酉子半圈勻分一百八十度乃自辛數至酉如所設丙角六十度而自酉作酉丁直線與已甲徑平行至丁遂如法作丁丙邉又自丙數至乙如所設乙丙邉一百度又從乙過甲心至卯作大圈徑亦作寅壬橫徑乃補作丁乙邉乙丙丁三角弧形宛然在目又自丁作丑丁癸距等線與寅壬平行未自乙數至癸得若干度即乙丁之度計開丁乙線五十九度强以算考之得五十九度七分右量弧度以圖代算若用規尺可免逐圈勻分之度有例在後條又若先有乙丁對角邉丁丙角旁邉有丙角而求乙丙角旁之邉仍借前圈法先作己戊丙員及十字徑線又以丁丙邉之度取丙辛及丙子作辛子距等線又作子酉辛半員取辛酉角度作酉丁直線遂從丁作丁丙邉皆如前次以所設丁乙邉五十九度倍之作一百十八度少于夲員周取其通弦即距等線癸丑之度乃以通弦線就丁㸃遷就游移使合于外周而不離丁㸃成丑丁癸線即有所乘丑乙癸弧乃以弧度折半于乙則乙丙外周之度即所求乙丙邉于是補作乙丁線成三角之象又法以丁乙倍度之通弦丑癸半之于辰乃從辰作卯甲辰過心徑線即割大員周于乙而乙癸及乙丑之弧度以平分而等皆如乙丁度亦遂得乙丙度餘如上又若先有乙丙兩角及乙丙邉在兩角之中亦仍借前圖法先作己戊丙員及十字徑線皆如前乃自丙數至乙截乙丙為所設之邉次作丙角法于戊庚橫徑如前法求庚亥如所設丙角之度遂從亥㸃作弧如丙亥己則丙角成矣次作乙角法于乙㸃作乙甲卯徑亦作壬寅橫徑乃自寅至未如前法求寅未如所設乙角之度遂從未㸃作弧如卯未乙則乙鈍角亦成矣兩弧線交于丁角乃補作丑癸及辛子兩距等線則弧度皆得案此兩弧線必以雞子形作之方凖若丁㸃離兩橫徑不逺則所差亦不多也再論平儀凡平儀上弧線皆經度而直線皆緯度惟外周經度亦可當緯度又最中長徑緯度亦為經度平儀上弧線皆在渾靣而直線皆在平靣試以渾球從兩極中半濶處直切之如用極至交圈為度以剖渾儀則成平靣矣以此平面覆置于案而從中腰橫切之如赤道半圈則成橫徑于平面矣如赤道之徑又以此橫徑為主離其上下作平行線而橫切之則皆成距等圈之徑線于平面矣大橫徑各距極九十度逐度皆可作距等圈即皆有距等徑線在平面故曰皆緯度也此線既為距等圈之徑則其徑上所乘之距等圈距極皆等即任指一㸃作弧度其去極度皆等故以為緯度之限也若又别指一處為極如赤道極外又有黃道極又如天頂亦為極則其對度亦一極也亦可如前橫切作橫徑如黃道之徑于平面其橫徑上下亦皆有九十度之距等圈與其徑線矣如黃道亦有緯度故直線有相交之用也凖此觀之渾球之外圈隨處可指為極即有對度之極兩極相對則皆有直線為之軸軸上作橫徑橫徑上下即皆有九十度之距等徑線而相交相錯其象千變而句股之形成比例之用生加減之法出矣如黃赤兩極外又有天頂地心之極而天頂地心隨北極之髙下而變又此所用外周特渾球上經圈之一耳若凖上法于球上各經圈皆平切之皆為大圈則亦可隨處為極以生諸距等緯線而相交相錯之用乃不可以億計矣如天頂地心既隨極出地度而異其南北亦可因各地經度而異其東西由是推之渾球上無一處不可為極故所求之㸃即極也何以言之凡于球上任指一㸃即能于此㸃之上作十字直線以㑹于所對之㸃而十字所分之角皆九十度即逐度可作線以㑹于對㸃而他線之極此㸃上線皆能與之㑹故曰所求之㸃即極也又論平儀凡平儀上弧線皆經度也而弧有長短者則緯度也是故弧線為經度而即能載緯度蓋載緯度者必以經度也若無經度則亦無緯度矣平儀上直線皆緯度也而線有大小者則經度也是故直線為緯度而即能載經度蓋載經度者必以緯度也若無緯度則亦無經度矣所云直線指橫徑及其上下之距等徑而言弧線能載緯度即又能分緯度之大小直線能載經度即又能分經度之長短假如平面作一弧引長之其兩端皆至外周則分此外周為兩半員而各得百八十度即所作之弧亦百八十度矣此百八十者皆緯度故曰能載緯度也而此平面上所乘之半渾員其經度亦百八十而皆紀于腰圍之緯圈若于腰圍緯圈上任指一經度作弧線必會於兩極而因此弧線割緯圈以成角度故又曰能分緯度也不但此也若從此弧線之百八十度上任取一度作平行距等緯圈其距等圈上所分之緯必小于腰圍之緯圈而其所載距等圈之經度皆與角度等即近極最小之緯圈亦然何以能然曰緯圈小則其度從之而小而為兩弧線所限角度不變也故緯圈之大小弧度分之也然弧線之長短又皆以緯圈截之而成而緯圈必有徑在平面上與圈相應故曰直線能載經度即又能分經度之長短也復論平儀平儀上直線弧線皆正形也問前論直線有正形弧線躋縮無正形兹何以云皆正形曰躋縮者球上度也然其在平靣則亦正形矣有中剖之半渾球于此覆而觀之任于其緯度直切至平面則皆直線也而其切處則皆距等圈之半員即皆載有經度一百八十也從此半員上任指一經度作直線下垂至平面直立如縣針則距等圈度之正弦也若引此經度作弧以㑹于兩極則此弧度上所載之緯度一百八十每度皆可作距等圈即每度皆可作距等圈之正弦矣由是觀之此弧上一百八十緯度既各帶有距等圈之正弦即皆能正立于平面而平面上亦有弧形矣夫以弧之在球面言之别以側立之故而視為躋縮而平面上弧形非躋縮也故曰皆正形也惟其為正形故可以量法御之也又問平儀經緯之度近心濶而近邉狹何也曰渾員之形從其外而觀之則成中凸之形其中心隆起處近目而見大四周逺目而見小此視法一理也又中心之經緯度平鋪而其度舒故見大四周之經緯側立而其度垜壘故見小此又視法一理也若以量法言之則近內之經緯無均平之數數皆紀之于外周外周之度皆以距等線為限而近中線之距等線以兩旁所用之弧度皆直過與橫直線所荖少故其間闊近兩極之距等線則其兩旁之弧度皆斜過與橫直線縣殊故其間窄此量法之理也固不能强而齊一之矣夫惟不能强而齊故正弦之數以生八線由斯以出尺算比例之法由斯可以量代算而測算之用遂可以坐天之內觀天之外巳取角度又法設如巳戊丙庚員有子辛距等緯線有所分丁辛小緯線求其所載經度以命所求之角丙角本法取距等半徑辛午作子酉辛半員從丁作酉丁線乃紀酉辛之度為丁辛之度今用捷法徑于丁㸃作女丁壬線與巳甲徑平行再用距等半徑午辛為度從甲心作虛半員截女壬線于亢即從此引甲亢線至癸則數大圈庚癸之度為丁辛角度即丙角也解曰試作氐亢房半員其亢甲牛徑既與午辛等則氐亢房半員與辛酉子等而氐亢房半員又與大員同甲心則庚癸之度與氐亢等即亦與酉辛等矣又如先有丙角之度及辛子距等線而求丁㸃所在以作丙丁弧法從大圈庚數至癸令庚癸如丙角之度即從癸向甲心作癸甲線半徑次以距等之半徑辛午為度從甲心作半員截癸甲半徑于亢乃自亢作亢丁壬線截辛午於丁即得丁㸃用規尺法設如乙丁辛弧三角形有乙丁邉六十度有丁辛邉五十度一十分有乙辛邉八十度求辛鋭角如法依三邊各作圖法以十字剖平員自主線端辛數所設丁辛五十度竒至丁乃自丁作徑線過已心又依所設丁乙六十度自丁左數至婁右數至丙皆六十度作丙婁線為距等圈之徑又自辛依所設辛乙八十度至房亦左至壬作房壬距等徑線此兩距等線交於乙乃作乙丁及辛乙丙線則三角形宛然在目今以量法求辛角法曰房甲距等半徑與乙甲分線若亢已半徑與辛角之餘弦寅已法以比例尺正弦線用規器取圖中房甲之度于半徑九十度定尺再取乙甲度于本線求正弦等度得角之餘度乃以所得餘度轉減象限命為辛角之度依法得餘弦三十一度弱即得辛角為五十九度强又法以房甲為度甲為心作房癸壬距等半圈又作乙癸正弦與已辛平行如前以房甲度于正弦九十度定尺再以乙癸度取正弦度命為辛角度又法作房癸線用分員線取房甲度于六十度定尺再取房癸線于分員線求等度得數命為辛角之度更捷論曰既以房甲為半徑則乙癸即正弦乙甲即餘弦房癸即分員皆距等圈上比例也其取角度與分半周度而數房癸之度並同然量法較捷又求丁鈍角法以丙危為度危為心作婁丑丙半員又作丑乙線當角之正弦則乙危當餘弦乃取距等半徑丙危度于正弦線九十度定尺再取乙危度求得正弦線等度命為鈍角之餘弦以所得加九十度為丁鈍角度依法得餘弦十二度太即得丁鈍角一百二度太或取丑乙線求正弦線上度命為鈍角之正弦以所得減半周度餘為丁鈍角度兩法互用相考更確又法作婁丑分員線取丙危半徑于分員線六十度定尺而求婁丑分員之度分為丁鈍角亦可與正弦法參考論曰兼用弦兩法分員線一法以相考理明數確然比半周度之工尚為省力是故量捷於算而尺更捷矣若兼作丙丑分員以所得度減半周亦同如此則分員線亦有兩法合之正弦成四法矣又論曰此條三邉求角前條有二邉一角求弧可互明也故用圖亦可以求角用尺亦可以求弧智者通之可也三極通幾平員則有心渾員則有極如赤道以北辰為極而黃道亦有黃極人所居又以天頂為極故曰三極也極云者經緯度之所宗如赤道經緯悉宗北極而黃道經緯自宗黃極地平上經緯又宗天頂亦如屋之有極為楹桷宇梠楶梲之所宗也既有三極即有三種之經緯于是有相交相割而成角度角之鋭端即兩線相交之㸃任指一㸃而皆有三種經緯之度與之相應焉故可以黃道之經緯求赤道之經緯亦可以赤道之經緯求地平上之經緯以地平求赤道以赤道求黃道亦然舉例如後以黃道經緯求赤道經緯已辰庚斜弧三角形巳丁乙丙為極至交圈巳為北極丙甲丁為赤道庚為黃極壬甲寅為黃道星在辰辰庚為黃極距星之緯辰庚酉角為黃道經度今求赤道經緯法自辰作黃道距等緯圈酉辛又自辰作赤道距等緯圈戊午即知此星辰在赤道之北其距緯戊丙或午丁次以赤道距等半徑戊卯為度卯為心作午未戊半員又作未辰直線與已甲平行則未戊弧即為赤道經度即戊巳辰角若先有赤道經緯而求黃道經緯亦同以赤道經緯求地平經緯巳子戊三角形三角皆鋭戊壬庚辛為子午規壬辛為地平戊為天頂巳為北極丁丙為赤道星在子子巳為星距北極巳角為星距午規經度即緯圈上丑子之距求地平上經緯法自子作寅亥線與辛壬地平平行即知地平上星之髙度亥辛或壬寅次作寅酉亥半員以亥寅半線亥午為度午為心又從子作酉子直線與戊甲天頂垂線平行即子寅為星距午方之度為子戊寅角數酉至寅之弧即得星在午左或午右之方位是為地平上之經度按此圖為星在卯酉線之北數酉辰若干度即知其星距卯酉線若干度也若先得地平上經緯髙度為緯方位為經而求赤道經緯星距赤道為緯距午線時刻為經其理亦同以兩緯度求經度巳子戊斜弧三角形假如北極髙三十度巳辛髙戊寅壬為午規太陽在子距赤道北十度其距丑丁或卯丙緯度子丑為太陽距午線加時經度即子巳丑角寅壬為太陽髙度即亥辛求大陽所在之方法以太陽髙度亥辛或寅壬作亥寅地平髙度緯線又以太陽距赤道緯丑丁卯丙作丑卯赤道北緯線兩線相交于子乃以亥午為度午為心作亥酉寅半員分百八十度又自子作酉子直線與戊甲平行截半員于酉則酉至寅之度即太陽所到方位離午正之度即子戊寅外角若求加時以北極赤緯線準此求之用子巳戊角求北極出地簡法可以出洋知其國土所當經緯西北廣野亦然與地度弧角可以參用不拘何日何時刻但有地平真髙度及真方位即可得之法曰先以所測髙度及方位如法作圖取作平儀上太陽所在之㸃即地平經緯交處次查本日太陽在之道南北緯度用作半徑于儀心作一小員末自太陽所在㸃作橫線切小員而過引長之至邊此即赤緯通弦也乃平分通弦作十字全徑過儀心即兩極之軸數其度得出地度假如測得太陽在辰髙三十四度方位在正卯南三度强而不知本地極髙但知本日太陽赤緯十九度今求北極度如法作圖安太陽于辰詳下文先作丙丁線為地平髙度次用法自正東卯數正弦度至辰得近南三度為地平經度或以丙卯為半徑作半規取直應度分亦同次依本日太陽赤緯十九度以員半徑取庚甲十九度正弦為小員半徑作子庚小員末自太陽辰作橫線戊壬切小員于庚乃自庚向甲心作大員徑線已午則已即北極數己丑之度為極出地度依法求得本地極髙四十度論曰此法最簡最真然必得正方案之法以測地平經度始無錯誤厯算全書卷九
