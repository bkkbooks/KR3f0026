body:
  text: 厯算全書卷五十一宣城梅文鼎撰三角法舉要卷二算例三角形有三類一曰句股形即直角三邉形也有正方角一餘並鋭角一曰鋭角形三角並鋭一曰鈍角形三角內有鈍角一餘並鋭角以上三類總謂之三角形其算之各有術句股形第一術有一角一邉求餘角餘邉內分二支一先有之邉為弦一先有之邉為句或先有股亦同假如壬癸丁句股形有丁角五十七度壬丁弦九十一丈八尺求餘角餘邉一求癸丁邉術曰以半徑全數比丁角之餘弦若壬丁弦與癸丁句半徑即丁乙餘弦即甲丁以丁乙比甲丁若壬丁比丁癸一率原設弦半徑一為法二率原設句丁角五十七度餘弦五四四六四相乘三率今有弦壬丁邉九十一丈八尺為實四率今所求句癸丁邉五十丈法除實得所求一求壬癸邉術曰以半徑比丁角之正弦若壬丁弦與壬癸股一率原設股半徑一為法二率原設股丁角五十七度正弦八三八六七相乘三率今有弦壬丁邉九十一丈八尺為實四率今所求股壬癸邉七十七丈法除實得所求一求壬角以丁角五十七度與象限九十度相減得餘三十三度為壬角計開先有之三件癸正方角九十度丁角五十七度壬丁弦九十一丈八尺今求得三件癸丁旬五十丈壬癸股七十七丈壬角三十三度右例先得弦以求句股也是為句股形第一術之第一支假如壬癸丁句股形有丁角六十二度癸丁句二十四丈求餘角餘邉一求壬角以丁角六十二度與象限相減得餘二十八度為壬角戊丙丁句股形以戊丙切線為股丙丁半徑為句戊丁割線為弦是丁角原有之線今壬癸丁句股形既同丁角則其比例等一求壬丁邉術為以半徑比丁角之割線若癸丁句與壬丁弦一原設句半徑一為法二原設弦丁角六十二度割線二一三五相乘三今有句癸丁邉二十四丈為實四所求弦壬丁邉五十一丈二尺法除實得所求一求壬癸邉術為以半徑比丁角之切線若癸丁句與壬癸股一原設句半徑一為法二原設股丁角六十二度切線一八八七三相乘三今有句癸丁邉二十四丈為實四所求股壬癸邉四十五丈一尺法除實得所求計開先有之三件癸正方角丁角六十二度癸丁句二十四丈今求得三件壬角二十八度壬丁弦五十一丈一尺壬癸股四十五丈一尺右例先得句以求弦及股也或先得股以求弦及句亦同是為句股形第一術之第二支句股形第二術有邉求角亦分二支一先有二邉一先不知正方角而有三邉新增假如壬癸丁句股形有壬丁弦一百零二丈二尺癸丁句四十八丈求二角一邉一求丁角術為以壬丁弦比癸丁句若半徑乙丁與丁角之餘弦甲丁一壬丁邉一百二丈二尺今有之弦為法二癸丁邉四十八丈今有之句相乘三半徑一原設之弦為實四丁角餘弦四六九六六法除實得所求原設句依術求得丁角六十二度以所得餘弦撿表即得一求壬角以丁角六十二度與象限相減得餘二十八度為壬角一求壬癸邉術為以半徑比丁角之正弦若壬丁弦與壬癸股一半徑一二丁角六十二度正弦八八二九五三壬丁邉一百二丈二尺四壬癸邉九十丈二尺三寸計開先有之三件壬丁弦一百二丈二尺癸丁句四十八丈癸正方角今求得三件丁角六十二度壬角二十八度壬癸股九十丈二尺三寸右例以邉求角而先知方角故只用二邉也是為句股形第二術之第一支此先有二邉為弦與句故用正餘弦若先有者是句與股則用切線其比例之理一也假如壬癸丁三角形有壬丁邉一百六丈壬癸邉九十丈癸丁邉五十六丈求角一求癸角術以壬丁大邉與丁癸邉相加得一百六十二丈為總又相減得五十丈為較以較乘總得八千一百丈為實以壬癸邉九十丈為法除之仍得九十丈與壬癸邉數等即知癸角為正方角依術求得癸角為正方角定為句股形一求丁角術為以丁癸邉比壬癸邉若半徑與丁角之切線一丁癸句五十六丈二壬癸股九十丈三半徑一四丁角切線一六七一四依術求得丁角五十八度六分以所得切線撿表即得一求壬角以丁角五十八度六分與象限相減得餘三十一度五十四分為壬角計開先有三邉壬丁邉一百零六丈壬癸邉九十丈癸丁邉五十六丈求得三角癸正方角丁角五十八度零六分壬角三十一度五十四分右例亦以邉求角而先不知其為句股形故兼用三邉是為句股形第二術之第二支鋭角形第一術有兩角一邉求餘角餘邉假如乙丙丁鋭角形有丙角六十度丁角五十度丙丁邉一百二十尺先求乙角術以丙角六十度丁角五十度相併得一百一十度以減半周一百八十度餘七十度為乙角次求乙丁邉術為以乙角正弦比丙丁邉若丙角正弦與乙丁邉一乙角七十度正弦九三九六九二丙丁邉即乙角對邉一百二十尺三丙角六十度正弦八六六三四乙丁邉即丙角對邉一百一十尺六寸次求乙丙邉術為以乙角正弦比丙丁邉若丁角正弦與乙丙邉一乙角七十度正弦九三九六九二丙丁乙角對邉一百二十尺三丁角五十度正弦七六六四四乙丙丁角對邉九十七尺八寸計開先有之三件丙角六十度丁角五十度丙丁邉一百二十尺今求得三件乙角七十度乙丁邉一百一十尺零六寸乙丙邉九十七尺八寸右例先有之邉在兩角之間也若先有之邉與一角相對亦同蓋三角形有兩角即有第三角故無兩法鋭角形第二術有一角兩邉求餘角餘邉此分二支一先有之角與一邉相對一先有之角不與邉相對假如甲乙丙鋭角形有丙角六十度甲丙邉八千尺甲乙邉七千零三十四尺先求乙角術為以甲乙邉比甲丙邉若丙角正弦與乙角正弦一甲乙丙角對邉七千三十四尺二甲丙乙角對邉八千尺三丙角六十度正弦八六六三四乙角正弦九八四九六撿正弦表得乙角八十度三分次求甲角以丙角乙角相併得一百四十度三分以減半周餘三十九度五十七分為甲角次求乙丙邉術為以乙角之正弦比甲角之正弦若甲丙邉之與乙丙邉一乙角八十度三分正弦九八四九六二甲角三十九度五十七分正弦六四二一二三甲丙乙角對邉八千尺四乙丙甲角對邉五千二百一十五尺計開先有之三件丙角六十度甲丙邉八千尺乙甲邉七千三十四尺今求得三件乙角八十度三分甲角三十九度五十七分乙丙邉五千二百一十五尺右例有兩邉一角而角與一邉相對是為鋭角形第二術之第一支假如甲乙丙鋭角形有甲丙邉四百尺乙丙邉二百六十一尺八分丙角六十度角在兩邉之中不與邉對求甲乙邉先求中長線分為兩句股形術為以半徑比丙角正弦若甲丙邉與甲丁中長線一半徑一二丙角六十度正弦八六六三三甲丙邉四百尺四甲丁中長線三百四十六尺四寸一分次求丙丁邉即所分甲丁丙形之句而甲丙為之弦術為以半徑比丙角餘弦若甲丙邉與丙丁邉一半徑一二丙角六十度餘弦五三甲丙邉四百尺四丙丁邉二百尺次求乙丁邉即所分甲丁乙形之句而甲丁為之股以丙丁與丙乙相減餘六十一尺八分為乙丁次求丁甲乙分角即分形甲丁乙句股之甲角術為以甲丁中長線比乙丁分邉若半徑與甲分角切線一甲丁中長線三百四十六尺四寸一分二乙丁分邉六十一尺八分三半徑一四甲分角切線一七六三三撿切線表得一十度為甲分角末求甲乙邉術為以半徑比甲分角割線若甲丁中長線與甲乙邉一半徑一二甲分角十度割線一一五四三三甲丁中長線三百四十六尺四寸一分四甲乙邉三百五十一尺七寸五分求甲全角以丙角六十度之餘角三十度即分形甲丁丙之甲分角與求到甲分角一十度相併得四十度為甲全角求乙角以甲分角一十度減象限得八十度為乙角或併丙甲二角減半周亦同計開先有之三件甲丙邉四百尺乙丙邉二百六十一尺八分丙角六十度今求得三件甲乙邉三百五十一尺七寸五分甲角四十度乙角八十度右例有兩邉一角而角在兩邉之中不與邉對故用分形以取句股是為鋭角形第二術之第二支又術新增用切線分外角假如甲乙丙鋭角形有甲丙邉四百尺乙丙邉二百六十一尺八分丙角六十度此即前例但求甲角術以甲丙乙丙兩邉相併為總相減為較又以丙角六十度減半周得外角一百二十度半之得半外角六十度撿其切線依三率法求得半較角以減半外角得甲角一兩邉總六百六十一尺八分二兩邉較一百三十八尺九寸二分三半外角切線一七三二五四半較角切線三六三九七撿切線表得二十度為半較角轉與半外角六十度相減得甲角四十度次求乙角併甲丙二角共一百度以減半周得餘八十度為乙角次求甲乙邉一甲角四十度正弦六四二七九二丙角六十度正弦八六六三三乙丙邉二百六十一尺八分四甲乙邉三百五十一尺七寸五分鋭角形第三術有三邉求角假如甲乙丙鋭角形有乙丙邉二十丈甲丙邉一十七丈五尺八寸五分乙甲邉一十三丈五寸術曰任以乙丙大邉為底從甲角作甲丁虛垂線至底分為兩句股形一甲丁丙形以甲丙邉為弦丁丙為句一甲丁乙形以甲乙邉為弦丁乙為句兩弦相併為總相減為較兩句相併即乙丙邉原數為句總求兩句相減之數為句較術為以句總比弦總若弦較與句較也一兩句之總即乙丙二十丈二兩弦之總三十丈六尺三寸五分三兩弦之較四丈五尺三寸五分四兩句之較即丙戊六丈九尺四寸六分求分形之兩句以句較六丈九尺四寸六分減句總二十丈即乙丙餘乙戊一十三丈五寸四分半之得丁乙即戊丁六丈五尺二寸七分為甲丁乙分形之句又以戊丁六丈五尺二寸七分加句較六丈九尺四寸六分即戊丙得丁丙一十三丈四尺七寸三分為甲丁丙分形之句求丙角術為以甲丙弦比丁丙句若半徑與丙角之餘弦一甲丙邉一十七丈五尺八寸五分二丁丙分邉一十三丈四尺七寸三分三半徑一四丙角餘弦七六六一六撿餘弦表得丙角四十度求甲角術先求分形大半之甲角以丙角四十度減象限餘五十度為丁甲丙分形之甲角次求分形小半之甲角術為以甲乙弦比丁乙句若半徑與分形甲角之正弦一甲乙邉一十三丈五寸二丁乙分邉六丈五尺二寸七分三半徑一四甲分角正弦五一五撿正弦表得三十度為丁甲乙分形之甲角併分形兩甲角先得五十度後得三十度得共八十度為甲全角求乙角並丙甲二角共一百二十度以減半周得餘六十度為乙角計開先有三邉甲丙邉一十七丈五尺八寸五分乙丙邉二十丈乙甲邉一十三丈五寸求得三角丙角四十度甲角八十度乙角六十度鈍角形第一術有兩角一邉求餘角餘邉假如乙丙丁鈍角形有丙角三十六度半乙角二十四度丁乙邉五十四丈先求丁角術以丙乙二角併之共六十度半以減半周得餘一百一十九度半為丁鈍角次求乙丙邉術為以丙角正弦比丁角正弦若乙丁邉與乙丙邉一丙角三十六度二十分正弦五九四八二二丁角一百十九度三十分正弦八七三六三乙丁邉五十四丈四乙丙邉七十九丈一寸右所用丁角正弦即六十度半正弦以鈍角度減半周用之凡鈍角並同求丁丙邉術為以丙角正弦比乙角正弦若乙丁邉與丁丙邉一丙角三十六度三十分正弦五九四八二二乙角二十四度正弦四六七四三乙丁邉五十四丈四丁丙邉三十六丈九尺二寸計開先有之三件丙角三十六度半乙角二十四度丁乙邉五十四丈今求得三件丁鈍角一百一十九度半乙丙邉七十九丈一寸丁丙邉三十六丈九尺二寸鈍角形第二術有一角兩邉求餘角餘邉亦分二支一先有對角之邉一先有二邉皆角旁之邉而不對