seq: 33
front:
  text: 籌算自序唐有九執厯不用布算唯以筆記史謂其繁重其法不傳今西儒筆算或其遺意歟筆算之法詳見同文算指中厯書出乃有籌算其法與舊傳鋪地錦相似而加便㨗又昔但以乘者今兼以除且益之開方諸率可謂盡變矣但本法横書彷彿於珠算之位至於除法則實横而商數縱頗難定位愚謂既用筆書宜一行直下為便輒以鄙意改用横籌直寫而于定位之法尤加詳焉俾用者無復纎疑即不敢謂兼中西兩家之長而於籌算庶幾無憾矣康熙戊午九月已亥朔日躔在角宛陵梅文鼎勿菴撰
  hash: sha256:93cbe24a6f43c7fc702d0401c0adf4f166e55e4089f16588b529c034c2f8aab6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3f0026_WYG_033-1a, image: WYG0794/WYG0794-0670c.png}
body:
  text: 籌算有數便奚囊逺涉便於佩帶一也所用乘除存諸片楮久可覆核二也斗室匡坐㸃筆徐觀諸數厯然人不能測三也布算未終無妨泛應前功可續四也乘除一理不湏歌括五也尤便學習朝得暮能六也原法横書故用直籌籌直則積數横彼中文字實用横書也今直書故用横籌籌横則積數直其理一也亦有數便自上而下乃中土筆墨之宜便寫一也兩半圓合一位便查數二也商數與實平行便定位三也
  hash: sha256:39ee9db8d40d0f9a7bfa0199ccda968f8cbf30de2430c24f1e61e360cfde5370
