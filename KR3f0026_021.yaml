seq: 21
body:
  text: 厯學駢枝自敘厯猶易也易傳象以數猶律也律製器以數數者法所從出而理在其中矣世乃有未習其數而嘐嘐然自謂能知厯理雖有髙言雄辨廣引博稽其不足以折疇人之喙眀矣而株守成法者復不能因數求理以眀其立法之根於是有沿誤傳訛而莫之是正厯所以成絶學也然理可以深思而得數不可鑿空而撰然則茍非有前人之遺緒又安所𠂻乎鼎自童年受易於先大父又側聞先君子餘論謂象數之學儒者當知謹識之不敢忘壬寅之夏獲從竹冠倪先生受臺官通軌大統厯算交食法歸與兩弟依法推步疑信相參乃相與晨夕討論為之句櫛字比不憚往復求詳遇所難通則廢瞑食以助其憤悱夫然後氣朔發斂之由躔離朓朒之序黃赤道差變之率交食起虧復滿之算稍稍窺見藩籬乃知每一法必有一根而數因理立悉本實測為端固不必強援鐘律牽附蓍卦要其損益進退消息往來於易於律亦靡弗通也爰取商確之語録繫本文之下義從淺近俾可共曉辭取眀暢不厭申重庶存一時之臆見以為異時就正之藉雖於厯學未必有禆亦如駢拇枝指不欲以無用摺之云爾康熙元年歲在元黓攝提格相月既望又三日宣城山口梅文鼎書於陵陽之東樓厯學源流夫治厯以明時乃古今之大典而氣朔為之首章以總七政之要當時有載太史令郭公守敬因氣朔之不齊遂考景以驗氣更立四十尺之表測至元十八年辛巳歲前天正冬至恆氣日則己未丑初一而為元曰授時謂授人時而已距來歲之冬至則三百六十五萬二千四百二十五分為一歲之實以二十四氣約之是知每氣一十五萬餘二千一百八十四分三十七秒半為之氣盈一月凡二氣計盈四千三百六十八分七十五秒也其月有遲疾而三十日之間與日會之同度曰合朔然此非交食無以考也今朔距來朔則二十九萬五千三百五分九十三秒為朔實是知一朔之實而少四千六百九十四分七秒不及三十日為之朔虛併一月之氣盈得九千百六十二分八十二秒曰月閏積一年凡一十萬八千七百五十三分八十四秒曰歲閏積三年而過朔實有三萬餘是三年一閏而名曰正閏積五年復成再閏稍未及二朔之實積十九年成七閏為一章之終亦不及七朔實之八百餘分也所以五年之十九年之閏皆曰餘閏稽之於韻閏即餘也餘即閏也故曰閏餘成歲厯之既成在元凡八十七年逮至我朝尤重之敕太史令王公恂撰之立成元公統注諸通軌契厯經不言之奧開來學未遇之疑既而更太史院為欽天監實敬天勤民之盛心授推步官為保章正乃設職從政之美意又何以加於是乎故為序右厯學源流一篇不知誰作味其語意首言氣朔為首章蓋即首章之序也案元史授時厯經本有七章曰氣朔曰發斂曰日躔曰月離曰中星曰交會曰五星而本書合氣朔發斂為一章又取日躔章之盈縮差月離章之遲疾差使相附麗則經朔之後即求定朔頗便於用大致亦本厯草也然不用授時消分則元統氏之為也元統所傳厯法於日躔月離交會五星皆有通軌而此章獨無蓋久為疇人所習簡明易知無煩改作也作此序者又在元統之後其言氣盈朔虛置閏甚有原委字句朴簡猶存古意故仍冠其首
