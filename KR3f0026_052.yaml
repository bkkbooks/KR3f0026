body:
  text: 數學存古序附録六藝古聖人用也所以開物成務垂澤將來雖然器久則毁聲傳而失彼其初非不窮神盡變而後稍湮沒古聖人無如何也今不盡亡者數學耳數之為物不藉器而存稽實待虛其道如易故禮樂代更而方圓不易書契形名世殊方别而竒偶自如數之不亡不能亡也顧不能亡者數僅存者數之學嘗稽漢藝文志許商算術二十六卷杜忠算術十六卷唐博士肄習具有十經今略不一覩又古人製渾儀往往有書說詳徴其故又凡作厯皆有測驗諸書與厯術並垂如史所載晉姜岌劉宋祖冲之隋劉焯唐李淳風一行宋沈括元郭守敬著撰皆富今其存逸皆不可得考自漢趙氏周髀一經外無可廣證他緯書占候傅㑹難信然則今九章者果周官舊邪周官之舊既以不可知近世儒者又略之弗講九數之學益以荒蕪於是泰西氏者乃始孤行其測圜三角諸術以矜奇創學其學者至以大衍填寫九執未盡授時陰用回回法子雲康節之書皆為臆說而隸首之術必有所窮嘻其果然邪夫謂西厯能兼古法之長是也而反謂古人陰用乎西法此其說非也不觀之書御乎御用於騎書用於楷楷與騎日以習而古書御亡或者未考輿輪而輒以古御不如今騎未窺籕篆而謂古書不及今楷遂欲駕王武子於造父尊鍾元常於蒼頡過矣愚生晚不及見古人僻處山陬聞見固陋閒嘗於世傳九章者稍稍論列補葺遺缺而是正其紕繆使讀者曉然知九數之學果不盡於今所傳而其僅存者猶能與泰西氏並行而不得以相廢雖不知於古人萬一有當然天下之大不乏其人尚其共出枕祕以昭明而光大之使古人之緒晦而復顯或由是以發其端歟是愚之所望矣
