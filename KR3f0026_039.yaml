body:
  text: 發凡筆算之便與籌算同然籌仍資筆而筆則無假於籌於文人之用尤便筆算無歌括最便學習又無妨酬應久可覆核皆與籌算同詳籌算書筆算易橫為直以便中土蓋直下而書者中土聖人之舊而吾人所習也與籌算易直為橫其理正同筆乘原法以法實相疊殊混人目今所更定者一縱一橫法實各居其所而縱橫相遇處得數生焉不惟便用而已其所以然之理亦按圖可知筆除原法得數與原實相離定位易淆今所更定者法實與得數兩兩相對算理井然定位尤簡所謂原法者並據同文算指乃西土之舊式利西泰所授而李水部之藻所刻也厥後有西鏡録等書稍稍講明定位之用蓋亦酌取中法而為之然於古人實如法而一之㫖似猶有隔兹以法上得零之訣定之庶令學者一望而知所兾髙賢有以教之幸甚
