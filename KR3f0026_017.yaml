body:
  text: 厯算全書卷十七宣城梅文鼎撰火緯本法圖說熒惑一星最為難算至地谷而其法始密圖表具在可考而知也何嘗云火星天獨以太陽為心不與餘四星同法乎作厯書者突發此語遂令學者沿訛是執圖以觀圖而不以算理觀圖也不知厯算家有實指之圖有借象之圖地谷氏之圖火星所謂借象也非實指也錢唐友人袁惠子士龍受黃三和先生𢎞憲厯學以厯指為金科余故為作此以極論之而徴之切線分角之法以著其理袁子虛懷見從已復質諸睢州友人孔林宗興秦亦以為然而手抄以去又旁證諸穆氏天步真原王氏曉菴厯法大㫖亦多與余合火星本法發厯書之覆據厯指萬厯癸丑年太陽在降婁宫一十四度有半地谷測火星體㑹合於井宿第五星經度為鶉首四度半緯度在黃道北二度十一分火星平行在壬距冬至二百一十七度半強火星最髙在丙引數自丙厯丁至壬三百三十八度半弱圖說乙為地心即為各天平行之心亦黃道心大圈為火星平行之天內圈為太陽平行天皆以地為心其度皆應黃道太陽在本天自春分壁向婁順行火星嵗輪心在本天自丙過丁至壬順行太陽行速而火星行遲今太陽在後火星在前是太陽與星已過相冲之度而從後逐星也火星在嵗輪上亦自戌順行過亢至申合伏時星在戊冲日時星在亢今在申是星己過冲日之限而復向合伏也太陽距星實行為婁張􅋃亦即心氐以減半周為張角􅋃為黃道上星距日冲之度亦即氐未太陽在黃道上自婁仍順行其冲亦自角順行星亦自氐順行而日速星遲故其距漸近而星距日冲漸逺則星在嵗輪上距合伏之度亦漸近距冲日之度亦漸逺其嵗輪上漸逺漸近之度皆與黃道上距度相應然黃道上婁張是日在後追星嵗輪上是星向合伏申戌黃道上日冲度漸離星角張嵗輪上是星離冲日申亢本法以平行壬為心作子癸小輪自最髙子過癸左行為引數之數至丑又以丑為心作卯辰小均輪自辰最近右行過卯歷寅復過辰歷卯至寅為引數之倍減去全周得嵗輪之心到寅先以丑寅壬三角形求得丑壬寅角及壬寅線次以寅壬乙形求得寅乙線為嵗輪心距本天心之數又求得壬乙寅角為平行實行之差即前均也因在後六宫其號為加得寅乙申角為實行視行之差此以上厯書之法並同以下則異次以寅為心作嵗輪戊申亢圈也戊為最逺合伏之度也亢為最近冲日之度也今太陽在降婁火星在鶉首是已過冲日之度而日反在後以逐星也其日星之距為降婁至鶉首之度在嵗輪上則為申戊弧乃星行嵗輪末至合伏之度也厯家謂之距餘蓋順數自戊合伏過亢冲日至申為距合伏行度以􅥈全周得申戊為距餘以申戊減半周得申亢􅋃為巳過冲日之度即申寅亢角或申寅乙角末以申寅乙三角形求申寅半徑此形有先求得寅乙距心線又有申乙寅角為先測火星視行與所算實行之差度有申寅乙角為嵗輪上己過冲日之度有兩角自有寅申乙角法為申角之正弦與乙角之正弦若寅乙線與申寅線也此以測得視差而求半徑若先有申寅半徑而無視差度求乙角者則以切線法求之以申寅邉乙寅邉并之得戊乙為總數一率又以申寅減乙寅得亢乙為較數二率以申戊􅋃度半之為距餘半求其切線為三率法為總數與較數若半距餘角即半總角之切線與半較角之切線也求得四率查切線得其度以減距餘半之度餘為申乙寅視差角乃以視差角減實徑為視徑已過日冲其差為減此本法也厯書所載求法得數並同而其圖迥異蓋巧算耳下文詳之厯書之法亦是用兩角一邉以求餘邉星過日冲弧度是一角測得視行與實行之差是一角算得寅乙距心線是一邊今以法取嵗輪半徑為所求一邊然不正作申乙寅視差角而反作乙寅甲為視差角故亦不正作申寅乙星過冲日角而作寅乙甲為星距冲日角然則用本法者惟寅乙距心一線耳然既有寅乙線為主又有寅乙甲為星距日冲度有乙寅甲角為視差度則乙寅甲三角形與申乙寅三角等而甲乙邉必與申寅半徑同矣此倒算捷法與加減差法不作角於心而作角於邉同一樞軸也其法以先得寅乙線為三角之底其兩端各作角即先得兩角各引其邉遇於甲則甲乙為半徑寅甲亦即為星體距心與申乙之距同矣又大陽心在降婁其冲未在壽星星實行在氐氐末􅋃為氐乙未角即星實行己過日冲之真距也正與嵗輪上申亢􅋃度等故用氐乙未角為黃道上星距日冲之度與用嵗輪上申寅亢同此為借象之一根然又以甲為地心而作圈周分十二宮何也曰此則借象也其法妙在作甲己線與寅乙平行何也先依寅乙線作三角形其寅甲原與申乙平行今己甲又與寅乙平行則寅甲己角與申乙寅角等度而且等勢矣寅甲線斜交於寅乙及甲己兩平行線中則所作寅甲己及甲寅乙兩角等寅乙線斜交於申乙及寅甲兩平行線中則甲寅乙與申乙寅角亦等而寅甲己角與申乙寅不得不等矣角之度既相等而寅乙線即原用之線也今巳甲與寅乙平行故不惟等度而且等勢也由是而自甲心作春秋分橫線井箕直線即與乙心所作大圈上降婁夀星橫線及冬夏至直線悉為平行而等勢橫與橫平行直與直平行則其勢等於是而勻分十二宮即無一不與乙心所作大圈等十二宮既與大圈等勢而寅甲己角又與大圈之申乙寅角等度等勢則己甲線即指星實行度寅甲線即指星視行度而可以命其宮度不爽矣推此而辛甲為星最髙指線及作平行線於己甲實行之內一一皆真度矣又以乙為太陽體何也曰太陽實行降婁宮度原在大圈其離降婁之度為乙角今太陽指線過乙至甲則甲角與乙角等度而乙㸃在次圈上甲心所作之甪距春分之度與大圈等圈有大小而角度等即太陽真度可以命之為日矣乙既命為日則次圈可命為太陽所行之天而乙心所作大圈以太陽之冲處割小圈有火星行嵗圈最近侵入太陽天內之象故遂以大圈命為星行之圈也又寅乙甲角原為星距日冲之度與申寅乙角同而甲己既與寅乙平行甲未即甲乙之截線則己甲未角又與寅乙甲角同而己亥􅋃與嵗輪上申亢同為星距日冲之􅋃此一圖也有嵗輪半徑之數甲乙有火星實行視行差度寅甲己角有周天宮度有太陽度及火星最髙卑度又有火星行最近入太陽天內之象可謂簡而該巧而妙矣非地谷精於測算神明於法不能為也然則何以謂之借象曰以其一圖而備數端故知之也何以言之甲乙者嵗輪之半徑也不得與日距地心同數一也寅乙距心之線從兩小輪求出而兩小輪在火星本天是從乙心起算不從甲心起算二也因寅乙距心之線以得視差之角亦為乙心之角非甲心之角三也若甲真為地心則與乙太陽有距數太陽乙心所見之差角至地心必不同觀四也視行實行之差角為地面實測非乙心之數不得兩處悉同五也又大圈既為本天而侵入太陽天內則將為嵗輪之心若冲日之時嵗輪心既在太陽天內星又在嵗輪最近將越過地心如金水之退伏合而不得冲日矣六也由是觀之此圖但為借象巧算之用而非以是為真象也或者不察遂真以乙為日體則死于古人句下矣或問五星新圖亦以火星天用太陽為心而冲日之處割入太陽天內又何以說焉曰火星之行圍日而能割太陽天者乃嵗輪上周行之跡耳非本天也蓋火星本天在太陽之外能包太陽之天因嵗輪之行合伏時在嵗輪之頂去太陽益髙合伏以後離太陽漸逺則行於嵗輪中半與本天齊及其冲日則行嵗輪之底而在本天之內去地益近其去地益近者為日所攝也此理五星所同故土木火三星皆可為圍日之象今新圖五星不以地為心者是也火星則嵗輪最大冲日時稍侵入太陽之天其實嵗輪之心仍係本天在太陽天外耳七政小輪周行於天遂成不同心之圈嵗輪周行於天成圍日之形一而已矣今以實數考之火星嵗輪半徑約為本天半徑十之六其合伏時則兩半徑相加成十六冲日時兩徑相減只餘十之四其侵入太陽天內約為一二分則太陽天半徑只得火星天半徑十之六有竒而火星合伏時在太陽上約為十分冲日時在太陽下亦約十分而成圍日之形矣是故以日為心者嵗輪上星行之軌迹也非本天也圖見下火星嵗輪上軌跡圍日之圖土木二星因嵗輪之度而成圍日之形與此同理但其天更大而嵗輪小故不致侵入餘里之天丁庚寅辛為太陽天戊癸己壬為火星本天甲丑嵗輪以戊為心丙子嵗輪以己為心丁為日體甲丙皆星體甲癸丙壬為嵗輪上星行軌跡成一大圈而以丁日為心星天日天各有小輪髙卑其本天則皆以地為心星在嵗輪甲為合伏而去地極逺星在丙為冲日冲日之時庚丙辛􅋃割入太陽天庚寅辛之內而去地極近星在嵗輪丙時已割入日天然嵗輪心則在本天已若如衆說以割入日天內者為本天則冲日時當以丙為嵗輪心矣而星在嵗輪之上又當向日豈不越地心乙而過之乎必不然矣切線法解在後火星次均解火星次均用切線求嵗輪上視差角乃三角法也欲明火星次均用切線之法當先明三角形用切線之法甲卯乙三角形有甲鈍角一百五十度有甲乙邉六十有甲卯邉一百整求卯角法曰以甲角減半周得餘三十度為癸甲乙外角半之得十五度為丙甲辛角其切線辛癸二六七九五并甲乙六十甲卯一百共得丙卯一百六十為首率總數以甲乙減甲卯餘得辰卯四十為二率較數半外角之切線辛癸為三率二率乘三率為實首率為法除之得辛卯六六九八為四率即辛甲壬減􅋃之切線也以四率查切線表得三度五十分弱為辛甲壬減􅋃角以所得辛甲壬減􅋃角三度五十分減半外角十五度餘壬甲丙角十一度一十分即卯角也今以火星言之丙乙辰圈則嵗輪也甲為嵗輪之心丙甲辰卯過心線即星實行度分也卯為本天之心甲卯者距心線也即表中距日數甲丙甲乙甲辰皆嵗輪半徑也即表中半徑合日差而成星數也先以前均求到星之實行在甲矣然此嵗輪之心而非星也星則自丙合伏順行過辰冲日而漸近合伏其體在乙則丙辰乙為星在嵗輪上行之度與星距太陽實行之度相等即相距度也乙丙則距餘度半之為辛丙則距餘半也乙辰􅋃為星巳過冲日之度則甲角度也今已知嵗輪心實行之度又已知星在嵗輪上行之度所不知者視差角耳蓋自本天心卯作實行線過甲心至黃道又從卯作視行線過乙星體至黃道其差為卯角是故求次均者求此卯角也用上法以距日即距心為一邉甲卯以星數為一邉甲乙以星行過冲日之度即乙辰􅋃為一角甲角成甲卯乙三角形依上法得卯角即次均也一率距日與星數之總即甲卯并甲乙亦即甲丙二率星數減距日之較即辰卯三率距餘半之切線即半卯角之切線辛癸蓋乙甲丙角為距餘即乙甲卯角之餘度半之為辛甲丙角即距餘半四率減􅋃之正切線即辛壬其角為辛甲壬末於辛甲丙距餘半角內減去辛甲壬减􅋃角餘成壬甲癸角與卯角等得視差之度如所求既知三角形用切線之法尤當進而明其所以用切線之理如後圖乙甲卯三角形甲角一百五十度甲乙邉六十甲卯邉一百兩邉之總一百六十為首率兩邉之較四十為次率甲角之餘角半之求切線為三率即率癸求得四率為半較角之切線辛壬求其度以減半餘角得卯角何以用切線也曰此分角法也凡外角乙甲丙為乙甲卯之餘角亦為外角內兼有形內餘兩角之度乙甲丙外角兼有卯角及甲乙卯角之度試作壬甲線與乙卯平行分外角為兩則壬甲丙角如卯角矣以壬申及乙卯皆平行線而丙甲卯未一直線故其作角必等外總角內減去同卯角之壬甲丙角則其餘壬甲乙角必為甲乙卯角矣今但有外角為總角而不知其分角故以比例分之而切線則其比例也又試作乙丙線為外角之通弦又從乙作正線至丁為乙甲壬大角之正弦從丙作正線至戊為壬甲丙小角之正弦而通弦遇壬甲分角線於子成乙子及子丙兩線此大小兩線之比例與大小兩角之正弦比例等何也乙子丁勾股形與丙子戊勾股形以子為交角則相似而乙子大弦與子丙小弦若乙丁大股與丙戊小股矣又甲卯大邉與甲乙小邉原若所對之大角正弦乙角及小角卯角正弦凡三角形邉之比例與對角正弦之比例皆等即乙丁與丙戊也角同則正弦同則甲卯與甲乙亦若乙子與子丙矣又試作辛甲線分外角為兩平分而各作切線為辛癸為辛己即半外角之切線則兩切線聨為一己癸而與乙丙平行又引壬子線割之則分為二線而己壬與壬癸之比例若乙子與子丙亦若甲卯與甲乙矣又作庚甲線使庚己如壬癸則庚壬為兩線之較己癸為兩線之總而甲乙甲卯兩邉之較為辰卯其總為丙卯甲卯大邉與甲乙小邉之比例既若大線己壬與小線壬癸則兩邉之總與較亦必若兩線之總與較矣一率丙卯即甲乙甲卯兩邊之總二率辰卯即兩邉之較三率己癸即己壬壬癸兩線之總四率庚壬即兩線之較今各半之辛癸半總即半外角辛甲癸之切線辛壬半較即半較角辛甲壬之切線既得辛壬切線查表得其角度即半較角也以半較角減辛甲癸半外角即半角也若以半較角加乙甲辛半外角亦即甲乙卯角矣火星測算本法圖說明厯書之倒算嵗圈半徑六四七三八甲乙查加減表八宫十九度四十分半徑數六四八七三太陽引數星紀二十三度加六宫為六宫二十三度日差一一六相並得六四一八八為星數與所測微差若用實引得半徑六四四二五其數益相近距心數九九六九七寅乙平引八宫一十九度四十二分二十秒加均數一十度三十三分三十秒實引九宮初度一十五分五十秒查加減表八宫一十九度四十分距日九九七一所差不多若用實引則距心一一六七四差稍大然按圖用乙寅線宜用實引圖說本宜用寅㸃為嵗輪之心以寅乙申角為嵗輪上視差角即寅未􅋃也寅申線則嵗輪之半徑也此為本法今厯書所載地谷圖不於寅心作嵗輪圈而以甲為心蓋因戌寅亥角與寅乙申視角同度切線法用此角以代乙角而甲寅乙角者戌寅亥之交角也凡交角皆同大則甲寅乙角亦即寅乙申視角矣既以甲寅乙角為所測視角則乙㸃即可為嵗圈之心而甲乙寅角可代乙寅申角矣故以嵗圈上星過冲日之度冲日即近㸃亢星過日冲即乙寅申角亦即亢申􅋃移作寅乙甲角自乙嵗圈心依角度作乙甲線與寅甲線遇於甲先有乙寅甲角自有寅甲線則甲㸃即嵗輪上星所到度可代申㸃而甲乙即嵗輪半徑可代寅申矣故以甲乙線為半徑者巧法也然則當以乙為嵗輪之心用代寅㸃矣何又以甲為心乎曰甲乙既為半徑則以乙為心甲為界或以甲為心乙為界其半徑等為甲乙也故倒以甲為心其法與諸加減表說作差角於圈界者同也先倒作均角於寅界法同兩術中慣用此倒算之法然則以甲為地心何也曰此則其移人耳目之法也何以言之彼固言甲乙為嵗輪半徑矣又以甲心乙界之輪為嵗輪矣甲既為嵗輪之心又安得為地心乎然則地心安在曰以理論之仍當以乙㸃為地心耳何也星之實經在寅其視經在未寅未之􅋃成寅乙未角此固實測之度也實測差角從地上得之安得不以乙為地心乎若謂乙為日體則日之去地逺矣日體所見之差角與測所見之差角必有分也而今不然故不得以乙心徑為日體也非地心而地心之何也蓋所以使人疑也其使人疑奈何嵗輪心之非地心易見也乙㸃之非日體難知也以其所易見例其所難知疑則思思則得矣地心既非地心則日體亦非日體然則其中機彀固以示之矣又論曰借甲為地心妙在作戊己線與乙寅平行蓋甲己既與乙寅平行則己甲寅角即甲寅乙角亦即寅乙申均角而甲地心所作之十二宫度一切皆與乙心所作之度相應矣此用法之巧也先以乙寅甲角代寅乙申視角而取甲乙線以代寅申半徑是倒算也復以甲為心乙為界作嵗圈以甲心代乙心亦倒算也兩番倒算而倒變為順故甲可代乙為地心即本天心也而甲己線與寅乙平行即地心所指實行之度也己甲寅角即視差角也寅甲線即視行指線與申乙同也故天度皆應可作十二宫分細度也若於乙作嵗圈則但能得半徑而十二宫之向皆反矣故借甲為心法之巧也乂取甲為心影出火星能入太陽天之象其實火星入太陽天者乃其嵗輪上度非嵗輪心也若真以此為嵗輪心則火星體將過地心而與日同度如金水矣又用甲為心作十二宫則細度可不礙書若用本法則有兩小輪各線相雜而不能詳書細數故移乙心於甲移寅乙申角為己甲寅角也嗚呼可謂巧之至矣但未說破故後學遂妄為作解耳論曰既火星初均在寅即當以寅為嵗輪心而今不然何耶曰此巧算也甲寅乙角即寅甲己角也何也甲己與乙寅平行也即均角也又乙寅者嵗輪心距日數也乙甲者半徑也寅乙甲角者先有之角即星日相距之餘數也即己過日冲之度本法以距日數及半徑為兩邉與先有之角求均數角今先測得均角而無半徑故反用其法以求半徑法之巧也蓋先有兩角一邉而求餘邉之法也一率甲角之正弦有乙寅兩角自有甲角二率乙寅邉即距日數實為嵗輪心距本天心三率寅角之正弦即均角乃所測視行與實行之差度四率甲乙邉即嵗輪半徑包有日差在內由是言之甲乃嵗輪心耳非地心也若甲真為地心則甲乙非嵗輪半徑矣火星次均解查火星嵗輪半徑與本天半徑略如六與十宜即用為比例作圖則所得均角亦近後數係初稿存例非火星正用圖說乙甲卯三角形有甲角一百二十度有甲卯邉一百乙甲邉四十一求卯角乙角乙卯邉法曰以乙甲甲卯二邉并得一百四十一為總即丙卯為一率又相減得五十九為較即辰卯為二率丙甲乙外角六十度半之得三十度即辛甲丙角其切線五七七三五即辛癸為三率求得壬辛為四率得二三九八八查表得十三度二十九分四十秒收作三十分即辛甲壬角以辛甲壬角減半外角辛甲丙角得壬甲丙角十六度三十分即卯角也又以辛甲壬角加辛甲丙即辛甲己得壬甲己角四十三度三十分亦即甲乙卯角末以甲乙卯角四十三度三十分之正弦六八八三五為二率乙甲四十一為三率全數為一率法為全數與乙角之正弦若乙甲與甲午也得甲午又甲乙卯角之餘弦七二五三七為二率乙甲四十一為三率全數為一率法為全數與乙角之餘弦若乙甲與乙午也得乙午用勾股以甲午冪減甲卯冪餘數開方得數為午卯乃併乙午午卯共為乙卯邉一系甲卯如火星距心線即表中距日數甲乙即如火星嵗輪半徑即表中半徑加日差為星數之數丙甲乙外角即如火星行嵗輪上離合伏之度即日星相距度丙甲辛角即如火星半距度辛癸其切線壬甲辛角即火星減􅋃壬辛其切線卯角即均角一系丙㸃如嵗輪合伏度甲為嵗輪心卯為本天心丙甲卯線即嵗輪心平行線一系丙卯乙均角在前六宮是平行線東為加一系嵗輪上加減以卯亥切線所到為限自丙㸃以至亥㸃距合伏度漸從小至大其均度漸增過亥㸃至辰冲日距度漸從大至小均度漸減蓋距合伏度大則半距亦大反之則小也一系星行嵗輪過亥㸃則距度大而減􅋃更大故均數漸減如圖星行至未成甲未卯三角丙甲未外角半之於酉而壬甲酉為減􅋃其得均角卯與星行在乙等若欲知未甲辰角法用三率求之一率甲未邉二率卯角正弦三率甲卯邉四率未角正弦既得未角以并卯角而減半周其餘即甲角也星行到乙與星行到未同以卯角為均度一系星之離日有定距一系星之嵗輪與日天略等一系日距星為日離星而東日速故也星距日為星離日而西星遲故也一系日距星為日天之度星距合伏為嵗輪之度一系論右旋則日速星遲若左旋則星反速於日故嵗輪心漸逺於日可稱左旋而嵗輪上圍日之象亦左旋也一系星有遲速皆嵗輪心之行而星行嵗輪邉成圍日之行則五星一理一系星本天右旋星在嵗輪上亦右旋而星圍日之行左旋此外仍有自行之髙卑故土星能至甲木能至乙至丙火能至丁各天故不甚相逺自人所見五星所當宿度則距日有逺近之殊而五星在天以徑線距太陽終古如一以此圖觀之見矣所異者五星各有髙卑本輪則有微差而火星則兼論太陽髙卑要不能改其徑線相距之大致算火星前均及距地心線用簡法依表說用兩小輪圖設平引三十度依表說算得均角四度五十分加減表四度五十分七秒表說差七秒今用簡法得四度五十分十秒只差三秒表說又算距心一十萬九千九百三加減表是一十一萬一十三差十萬分之一百一十數見表首卷第四章稱為火星年嵗圈心距地心數今用簡法得一十一萬一十九只差十萬分之單六又原法用勾股作垂線以求角求邉今用簡法以半外角切線乘兩邉之較為實兩邉之總為法除之即得半較角以減半外角即為均角工力較前省半其小輪上加減之角用小輪半徑四與一之比例乘除工力尤省數倍求邉之法只用對角之正弦比例工亦省半竊意立表時當是用此法凡諸表數或是西人成法翻譯成書或是厯局依法算演俱不可考然是入用之數當以為主火星平引三十度算得均角四度五十分十秒距心線一十一萬一九查表均角四度五十分七秒只差三秒距心十一萬一三只差十萬分之單六可謂密近丙戊甲三角形求甲角及戊甲邉丙甲為一四八四丙戊三七一其比例為四與一簡法其總為五其較為三丙角六十度引數之倍先求甲角法以丙角減半周得餘外角一百二十度半之六十度查其切線一七三二五以較三因之總五除之得一三九二三查切線表得其度為四十六度六分八秒為半較角以半較角減半外角六十度餘一十三度五十三分五十二秒為丙甲戊角表說甲角十三度五十四分是不用秒數也次求戊甲邉法以甲角之正弦二四二為一率丙戊邉三七一為二率丙角之正弦八六六三為三率求得戊甲邉一三三七六為四率次戊甲丁三角形有甲丁邉一有先求到戊甲邉一三三七六有甲角以求到戊甲丙角加引數丙乙三十度共得四十三度五十四分弱為戊甲乙外角餘一百三十六度六分强為甲丙角先求丁角即三十度視差角法并甲丁戊甲兩邉得總一一三三七六為一率又兩邉相減得較八六六二四為二率半外角得二十一度五十七分弱之切線四三為三率求得半較角切線三七九為四率查表得角十七度六分五十秒以減半外角餘四度五十分一十秒即丁角次求戊丁線即表距日數實即嵗輪心距地心之數法以丁角之正弦八四二六為一率戊甲邉一三三七六為二率甲角用餘角四十三度五十四分弱正弦六九三三八為三率求得戊丁邉二一九為四率一系凡兩小輪有比例者俱可用簡法求角七政並同一系凡三角形有一角在兩邉中者遇其邉有比例可用簡法土星自行輪半徑八七二一小均圈半徑二九七其比例為三與一其總為四其較為二總與較之比例為折半簡法但以半外角之切線折半即得半較角木星自行輪半徑七一五五小均圈半徑二八三五其比例亦為三與一法同土星金星自行輪半徑二四六小均半徑八二其比例為三與一法同土木水星地谷密測自行輪半徑六八二二小均輪一一三七其比例為六與一總為七較為五法用五因七除多祿某舊法自行輪九四七九小均輪一五八其比例為六與一而强太隂本輪半徑八千七百三平分之二為新本輪半徑五千八百一為均輪半徑二千九百其比例為二與一其總為三其較為一法用三為法以除半外角切線得半較角朔望次輪半徑二千一百七十舊為二千三百一十此朔望輪地谷轉用於地心之上太隂朔望次輪全徑四千三百四十以全加於本輪半徑則一萬三千四十故兩弦之加減至七度四十分然以比五星嵗輪則太隂最少太陽兩心差三五八四折半一七九二王寅旭法兩心差三八八三八八收作三五八四小均輪半徑為兩心差四之一第一均輪半徑為兩心差四之三兩均輪之比例為三與一其總四其較二亦折半比例也與土木金三星並同加減差圖說以兩心差折半作角蓋謂此也兩均輪比例求七政各小輪半徑法具厯書今只定其大小之比例兩心差火星最大為一萬八千五百竒次土星一萬一千六百竒又次木星萬九千九百九十又次太隂八千七百又次水星七千八百五十太陽數少三千五百八十四金星更少只三千二百六上三星軌跡成繞日圓象五星本天並以地為心與日月同至若嵗輪即古法遲留逆伏之假日則惟金水二星繞太陽左右而行其嵗輪直以日為心土木火三星則不然並以本天上平行度為嵗輪心金水以太陽為嵗輪心亦以二星之平行與太陽同度也然其軌跡所到並於太陽有一定之距故又成繞日左行之圓象西人所立新圖不用九重天而五星並以太陽為心蓋以此也然金水嵗輪繞日其度右移上三星土木火軌跡其度左轉若嵗輪則仍右移耳七政前均簡法訂火緯表說因及七政西法用表如古法之用立成不得其列表之根表或筆誤無從訂改矣故有表說以發明之然或表說所用之數有與表中互異者則是作表者一人作表說者又一人也余因查火星之表而為之推演然後知立表之法甚簡洵乎此心此理不以東海西海而殊厯算全書卷十七
