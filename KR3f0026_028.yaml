body:
  text: 厯算全書卷二十五宣城梅文鼎撰交㑹管見求初虧復員定交角以初虧復員定時分依法求其距午時分午後以加午前以減各加減日實度所對時分入九十度表取之為初虧復員時定總時以定總時各求其日距限限距地髙遂以得其交角加減之得初虧復員時定交角求初虧復員時先闕後盈之㸃在日體上下左右法自天頂作垂弧過日心以至地平分日體員周左右各一百八十度次依定交角度分日在限西初虧為右下之角復員為左上之角其度右旋日在限東初虧為右上之角復員為左下之角其度左轉並自垂弧左右起算數至定交角度分即得太陽員周初虧時先闕復員時後盈之㸃其定交角或為鈍角者上下相易如本為右下者變為右上本為右上者變為右下左亦然是為虧復時交道中徑食十分者用此即中西舊法所謂八分以上初虧正西復員正東者也初虧復員各依其定交角度分取之若食九分以下當先求蝕緯差角法為并徑與月視黃緯若半徑與蝕緯差角之正弦也以月視黃緯化秒乘半徑為實以并徑減一分化秒為法除之得蝕緯差角之正弦查正弦得度分以加減虧復時交道中徑得日體周邊先缺後盈之㸃視緯北者日在限西初虧以加復員以減日在限東初虧以減復員以加視緯南者日在限西初虧以減復員以加日在限東初虧以加復員以減並置交道中徑以蝕緯差角度分加減之得數仍自垂弧左右起算得初虧何處先缺復員何處後盈上下左右皆可預定求食甚在日體上下左右惟食十分者食甚時兩心相掩或全黑或作全環皆無上下左右可論其食九分以下皆以隂陽厯論南北視緯若食甚時正在黃平象限則視緯北者食甚在日體上半缺口正向天頂形如仰瓦即舊法所謂正北視緯南者食甚在日體下半餘光厚處正對天頂缺處正向地平兩角下垂形如覆梳即舊法所謂正南也若此者只有上下可言而無左右偏側之度其餘日在限西則南緯在左下北緯在右下日在限東南緯在右下北緯在左下並以食甚時定交角之餘度或左或右並從天頂垂弧之兩旁起算即得食甚在日體上下左右之度求日體周邊受蝕幾何法用太陽太隂兩半徑相并為和相減為較和較相乘為實月視黃緯為法除之得數以加減月視黃緯訖乃折半以乘半徑又為實以太陽半徑為法除之得餘弦查表得度倍之即食甚時日體受蝕度分以太陽全周分三百六十度內該受蝕者幾何度加減例日半徑大于月以得數加黃緯日半徑小于月置黃緯以得數減之求日食三限在地平上髙度食甚時日距地髙即可徑用初虧復員各以定時求其距午分依日赤緯南北度入髙弧表即各得虧復時地平上髙度如無正表取前後二表數以中比例酌之假如其地極出地三十一度則查三十度表及三十二度表以兩表數并而半之即是本地髙弧之數又算法以限距地髙度與日距限之餘度相加為捴相減為較捴較各取餘弦視捴弧過象限則兩餘弦相并不過象限兩餘弦相減並折半得髙弧正弦撿表得髙度求日食三限地平經度法以地平緯度之餘度分與極出地之餘度分相加為總相減為較總弧較弧之餘弦相減若總弧過象限則相加並折半為法初數又取較弧矢與日距北極度之矢對弧矢也日赤緯在南者以加象限赤緯在北者置象限以赤緯減之即各得距北極度相減得較較乘半徑為實實如法而一得角之矢以矢命度若日食在午前其角度為距正北子正之度食在午後以減半周為距正南午正之度正矢與大矢並同一法三限皆如是求帶食分在日體上下左右以日出入時距緯為法半徑乘月視黃緯為實實如法而一得正弦查表得帶食緯差角度分如求初虧復員之法以帶食緯差角加減白道中徑得帶食分在日體上下左右若帶食在初虧後食甚前其加減用初虧法帶食在食甚後復員前其加減用復員法帶食在初虧後食甚前者隂厯日在限西加日在限東減陽厯日在限西減日在限東加帶食在食甚後復員前者隂厯日在限西減日在限東加陽厯日在限西加日在限東減右並置月道中徑以帶食緯差角度分加減之得數仍自垂弧左右起算即得帶食時食分最深之處在日體上下左右凡帶食出入時或微虧或見蝕半或半以上其餘光皆成兩角外向均折兩角取其中即帶食分最深之處求帶食出入時日邊受蝕幾何以太陽太隂兩半徑相併為和相減為較和較相乘為實日出入時距緯為法除之得數以加減日出入時距緯日半徑大于月以得數加入距緯日半徑小于月置距緯以得數減之乃折半用乘半徑又為實太陽半徑為法除之得餘弦查表得度倍之為帶食出入時太陽周邊受蝕之分以三百六十度分太陽全周內該缺幾何度分作日食分圖法交食之驗非圖莫顯圖必分作其象始真故不憚反覆詳明以著其理一定日食時交道斜正作立線以象垂弧此線上指天頂下指地平即地平經度圈之一象限也線上取一㸃為心規作員形以象太陽其員周為地平經線所分左右各一百八十度依本限定交角作㸃或初虧或復員或食甚各有定交角若日距限在西其度右旋日距限在東其度左旋於太陽員周上下並從垂線分處數至定交角度止得兩㸃聮為一直線必過太陽之心兩端稍引長之橫出是為日食時月道交於垂弧之象若日距限西交道左昂右低日距限東反之其初虧食甚復員三限距限東西有時而異雖其不異亦必有逺近髙下之殊則交道低昂異勢未可以一法齊也今三限各求定交角依度作圖不論東西南北一以太陽邊左右上下言其虧甚之狀即測算可以相符厯法之疏密可以衆睹更無絲毫可容假借如圖甲乙為垂弧甲丁乙丙為日體乙己丙為定交角丁己甲為對角乙至丙甲至丁皆定交角之度因日距限在限西故右旋數其度丙丁為上下兩㸃己為日心聮丙丁為直線則過日心稍引長之至庚則成交道因在限西故月道左昂右低交道即月道也為月視緯所成在食十分時可名月道其食不滿十分者可名月道平行線各號並與前同惟日距限在限東故從乙至丙從甲至丁並左旋數定交角度而庚辛月道右昂左低如圖月道平過與天頂垂弧相交成十字正角而又在午方則上北下南左東右西各如本位矣如舊法食十分初虧正西復圓正東食八分以下者隂厯初虧西北食甚正北復圓東北陽厯初虧西南食甚正南復圓東南惟此時為然此必日食在黃平象限左右因定交角加減而成正角然不常有即有之又未必在正南方則與東西南北之名不相叶應故不如用定交角直以上下左右言其方向黃平象限有離午正二十三四度時又有定交角加減則雖離午正三十餘度之逺而能有此象蓋即月道之九十度限也食既者遇之虧必正右復必正左北緯者虧右上復左上而食甚正向天頂南緯者虧右下復左下而食甚向地平己為日戊為月乙至丙甲至丁皆交角之度丙為初虧丁為復圓戊丙己丁為月道此因日食十分故即用丙丁二㸃為初虧復圓即舊法所云初虧正西復圓正東者也然以日距限西故初虧在日體右下復圓在日體左上此亦日食十分因距限在東故初虧在日體為右上復圓在日體為左下凡日距限西者復圓交角必小於初虧日距限東者復圓交角必大於初虧故必分作其圖始能合算今從簡省以交角相同者合為一圖非謂一食中虧復同角也一圖初虧先以初虧定交角如法作垂弧及交道安太陽於交㸃若食十分者於太陽右方截取交道如月半徑之度以此為心規作月體與太陽邊相切即初虧時先缺之㸃圖己見前若食不滿十分者用緯差角度算太陽邊周之度月視黃緯在北向上數之在南向下數之並從太陽右方交道起算數至緯差角度止即為初虧時先缺之㸃自太陽心向此㸃作直線透出其外稍引長之以并徑為度從心截取引長線作㸃即初虧時兩心之距也以截㸃為心太隂半徑為度作圓形即初虧時太隂來掩太陽相切之象也從太隂心作直線與交道平行則月視行之道也從太陽心作垂線至視行線成十字角即月視黃緯也以上並不論初虧是午前午後亦不論地平方位或在正南或偏東西並同一法食甚復圓倣此乙己丙交角乙丙其度從丙過己心至丁而引長之即月道平行線丙己庚為緯差角丙庚其度因月視黃緯在北故從交道丙向上數其度至庚庚即初虧時先缺之㸃從太陽心己作直線過庚㸃而透出其外為己庚戊線乃併日月兩半徑得己戊為度截己庚戊線于戊戊即太隂心也以戊庚月半徑從戊心作圓為太隂與太陽邊相切于庚初虧象也從月心戊作戊辛癸線與丙己丁平行月視行道也此月視行線乃人所見月心所行故以丙己丁交線為月道平行線從太陽己心作十字垂線至月視行線上如己辛月視黃緯也乙己丙交角以乙丙為度從丙過己心作月道平行線丙己庚緯差角以丙庚為度因月視黃緯在南故從交道丙向下數其度至庚庚即初虧時先缺之㸃此為緯差角大于定交角故易右為左從己心向庚作己庚戊線而以己戊并徑度截之於戊用為月心規作月體與太陽相切於庚象初虧也從戊心作癸戊辛線與丙己丁平行月視行道也從己心作己辛線與戊辛相遇成方角月視黃緯也以上二宗為日距限西日距限西者初虧定交角並為右下之角然惟食十分時則初虧右下與定交角同㸃其餘則北緯者能易右下為右上前條是也南緯者能易右下為左下此條是也甲己丁交角以丁甲為度從丁過己心作丁己丙月道平行線丁己庚緯差角以丁庚為度因月視黃緯在北從交道丁向上數至庚以庚為初虧之㸃此亦緯差角大于定交角故易右為左如前從己心向庚作透出線截之于戊使己戊同并徑則戊為月心從戊心作圓形象初虧時太隂以其邊切太陽于庚從戊作戊辛癸線為月視行之道與丁己丙平行又從己作己辛線為月視黃緯辛為正角諸號同前惟以月視黃緯即己辛在南故緯差角丁己庚角從交道丁向下數其度至庚為初虧之㸃以上二者為日距限東凡初虧在限東者其定交角為右上之角然惟日食十分與定交角同㸃而初虧右上其餘北緯者能易右上為左上南緯者能易右上為右下此二條可以推矣一圖食甚先以食甚定交角作垂弧月道於交㸃安太陽並如初虧法次於太陽周邊數定交角餘度若日距限西其度左旋日距限東其度右旋並於日體上下方從垂線數起至定交角餘度止各作㸃聮為一直線稍引長之此線與月道為正十字能過月道之極即月道之經圈食甚時太陽太隂並在此線之上乃以月視黃緯求其距若視緯在北向上量之視緯在南向下量之並從太陽心截取視緯於月道經線作㸃即食甚時兩心之距也以此為心月半徑為度規作月體即見食甚時月掩太陽在日體上下左右幾何度分此時兩心之距為最近其食分最深於此線上分太陽光體為十平分即所食之分可見若于太陽之邊數其所蝕光界即知太陽周邊受蝕幾何度分若於月心作線與月道經線為十字正角即自虧至復月行之道也兩端稍引長之用并徑為度從太陽心截之左右各得一㸃即初虧復圓之㸃也右為初虧左為復圓如此即為總圖總圖惟食甚為正形初虧復圓亦得大槩仍當于分圖考之若食十分者或全黑或作金環並無視緯更無上下左右可論不用此法又若食甚時定交角滿九十度則北緯正對天頂餘光有如仰盂南緯正對地平餘光有如覆碗其月道左右平衡其南北視緯即於垂弧取距北緯自太陽心向上南緯自太陽心向下並以月視黃緯取其度為兩心之距不須另作月道經線又於月道經線以月視黃緯量其距若隂厯向上量之陽厯向下量之並自太陽心量至視黃緯止從此作線與月道經線為十字角即與虧復月行之道平行南北差之理亦自可見乙己丙為定交角其度自乙右旋至丙丙己丁線過太陽心為月道平行線乙己庚為定交角之餘角其度自乙左旋至庚庚為食甚所向之方從庚過太陽心作午己庚線為太陽全徑分為十分依月視黃緯自太陽心己截至戊以戊為心月半徑壬戊為度作圓以象食甚時掩日之月計所掩徑自庚至壬得蝕六分餘光自壬至午得四分計所掩邊自酉過庚至卯得缺光之邊一百三十分餘光自酉過午至卯得未掩之邊二百三十分約為蝕三之一而强此以太陽邊周為三百六十分也分亦可名度從月心戊作戊癸線與太陽徑為十字角與交線平行是為月視行之道以并徑為度自太陽心己截戊癸月道于辛于子各為心作太隂象即見初虧于酉復圓於卯可當總圖此與前圖皆食在限西故乙己丙定交角同勢惟月視黃緯在北故用甲庚餘角從甲左旋數至庚為食甚所向之方亦作午己庚十分全徑而透出之用月視黃緯截之于戊戊為心戊壬半徑作月體交加于太陽光體之上計所掩自庚至壬得蝕四分有竒其自未過庚至丑為所蝕之邊又如法從戊心作月視行之道以並徑截之于辛于子各作月體即見卯酉為虧復之㸃几食在限西者南緯必食甚左下北緯必食甚右上惟交角大者餘角小交角小者餘角大而大致不改即二圖可槩其餘其初虧交角必大于食甚復員交角必小于食甚全圖聊舉大意仍以分圖為定乙己丙定交角其度自乙左旋至丙丙己丁過太陽心為月道平行線乙己庚餘角度自乙右旋至庚庚己午太陽全徑引長之以月視黃緯度截之于戊戊為食甚時月心所到其邊掩太陽至壬午壬為食甚所向之方分太陽全徑為十分午壬為所掩之分得二分有竒未午丑為所缺之邊約得九之二此與前圖皆食在限東乙己丙交角同勢惟月視黃緯在南故用甲己午餘角即乙己庚右旋從乙至庚庚㸃為食甚所向庚己午太陽全徑十分以月視黃緯截己戊戊為月心作太隂體掩太陽至壬得八分有竒未庚丑為所缺之邊約得九之四凡食甚在限東者北緯必左上南緯必右下雖角有大小其大致不變以上二圖可槩其餘以上食甚四圖或居太陽體之左上左下右上右下並以定交角論其餘角不論地平經度之東西南北並同一理即令食甚正午而距限有東西即交道有低昂必無正北正南如舊法所云者也此月視緯在北日食七分竒甲為食甚在日體上方餘光如仰盂此月視緯在南日食五分戊為食甚在日體下方餘光如覆碗惟此二圖是交角成象限若又居正南方則北緯食甚可稱正北南緯食甚可稱正南一圖復圓以復圓定交角作垂弧月道安太陽並如上法若食十分者于太陽左方截取月道如月半徑之度以此為心規作月體與太陽邊相切即復圓時後盈之㸃圖亦見前若食不滿十分者用緯差角度算太陽邊周之度北緯向上數之南向下數之並從太陽左方交道起數至緯差角度止即為復圓時後盈之㸃自太陽心向此㸃作直線透出其外稍引長之以并徑為度從心截取引長線作㸃即復圓時兩心之距以截㸃為心規作太隂與太陽相切即復圓時太隂行過太陽初離之象也甲己丁交角即乙己丙其度甲丁從丁過己心作丙己丁線引長之即月道平行線丁己庚為緯差角其度丁庚因月視黃緯在南從交道丁向下數其度至庚庚即復圓時後盈之㸃從太陽心己出直線過庚而透出其外為己庚戊線以並徑為度截之于戊以戊為心月半徑為界作太隂圓體切太陽邊于庚即太隂行過太陽初離之象也從月心戊作戊辛直線月視行之道也而己辛者月視黃緯也甲己丁交角即乙己丙其度甲丁從丁作月道平行線過己心至丙而引長之丁己庚緯差角大于交角而月視黃緯在北法當從交道丁向上數丁庚之度跨甲而至庚庚即復圓時復光最後之㸃又法從己心作丙己丁之十字垂線乃以月視黃緯為度截之于辛則己辛即食甚兩心之距也從辛又作十字長垂線與丙己丁交道平行如戊辛癸即月視行之道也次以並徑為度截月視行道于戊以戊為心月半徑為度作復圓時太隂象即其邊切太陽于庚以上二圖皆復圓距限西也凡復圓限西者其定交角為左上之角然惟食十分其㸃不改其餘則有易為正左稍下如前圖者有易為右上如此圖者餘可數推乙己丙交角以乙丙為度從丙作月道平行線過己心至丁而引長之因月視黃緯在北從交道丙向上數緯差角丙己庚之度至庚即庚為復圓之㸃又法以丁午丙半周度折半于午從午作線至太陽心己為丙己丁之十字垂線于此垂線上截取辛己如月視黃緯即于辛㸃作十字交線與交道線即月道平行線平行為月視行之道于此月視行道取戊己斜距如并徑則戊㸃即復圓時太隂之心從心作太隂體即切太陽于庚而正居太陽左方此交角與差角同度也庚己丙交角其度自庚數至丙㸃為月道平行線所過丙己丁過心線為交道即月道平行線丙己庚差角自丙數至庚因南緯向下數庚㸃為復圓時太隂初離太陽邊猶相切之處也差角丙庚之度與交角庚丙等故相減至盡而正居太陽之底也如用又法從己心作己午垂線以月視緯截辛㸃從辛作十字線如辛癸與交線平行為月視行道即可以戊己并徑截戊㸃為太隂心其邊即切太陽于庚亦同凡復圓限東者定交角必居左下然惟食十分者則然其餘則有變為日體正左或日體正下者如以上二條者可類推也甲為九十度限乙為黃道過午規交角乙丙為黃道在午規距天頂之度今用乙甲丙正弧三角形有甲正角乙交角乙丙弧而求甲丙弧為九十度距天頂之度法為半徑與丙乙弧正弦若乙角之正弦與丙甲正弦也一二半徑正弦丙乙三四乙角正弦丙甲正弦增沿厯書乃以丙乙餘弦與乙角餘弦相乘為實半徑除之得丙甲正弦失其㫖矣簡菴曰甲角非正角也何以言之自天頂出線過赤道則為正角其過黃道不能成正角甲角既為天頂線過黃道所作之角則必非正角勿菴曰不然甲㸃者九十度限也若甲非正角則不得為九十度限矣簡菴曰赤道能為正角者以天頂線能過北極也若黃極則不能過天頂天頂線既不串黃極則甲必不能為正角明矣勿菴曰子午線所以能穿天頂與北極者以赤道在平地上半周一百八十度而交子午圈處為其折半最中之處故天頂線交赤道成十字角也天頂線與赤道作正角惟此一處蓋惟此處能使地平經線即天頂出線至地平分方位之線與赤道經線即北極出線至赤道分時刻之線合而為一從地平經線言之為子午規從赤道言為過極圈他處則不能也黃道亦然其在地平上亦一百八十度每度並從黃極出經線至黃道上成正角但不能過天頂而必有一度為黃道半周折半之處則此一經線必過天頂而穿黃極天頂線既穿黃極則其交黃道處必成十字正角矣天頂線與黃道作正角亦惟此一處亦如赤道之有子午規蓋亦惟此處能使地平經線與黃道經圈合而為一而他度不能西法用九十度限其理如此故甲角必正角簡菴聞此欣然首肯焉本法用乙甲丙形求丙甲為九十度距天頂今依簡菴說用丁戊丙形求得戊丙為天頂距黃極之度以減象限即得丙甲距天頂之度法曰以正午黃經之赤道同升度取丁角從冬至數之即得以各地北極出地餘度取丁丙邊以兩極相距二十三度半為丁戊邊是為一角兩邊可求戊丙邊若用垂弧法雖多轉折其理無訛若用加減代乘除法乃捷矣又按此以正弧形為本形改用斜弧為次形亦弧三角中一法往所未及也可見學問相長之無窮既得甲丙邊又原有乙丙邊甲正角可求甲乙邊為九十度距午規丁北極戊黃極丑寅圈徑五度為白道極所行之跡丑為今所求月道心即白道極所到得丑寅邊為丑戊寅角之度亦即為丁戊丑角度先用丁戊丑弧三角形有丁戊邊為兩極距二十三度半有丑戊邊為月道大距五度有戊角即上所論可求丑丁邊為白道極距北極之弧可求丑丁戊角次用丁丑丙弧三角形有丑丁弧為先所求有丙丁丑角以先有之戊丁丙角與今得之丑丁戊角相加減得丙丁丑角有丁丙邊即本地北極出地餘度可求丑丙邊為白道極距天頂之弧亦即為白道九十度距地平之髙度求白道極所在即丑㸃法曰凡白道極隨交㸃而移交㸃逆行故白道極亦逆行也先求正交或中交在黃道度分離此一象限即為半交最逺之所此㸃與白道極相應若係半交是陽厯則白極在黃極南半交是隂厯則白極在黃極北極距黃極五度竒即丑戊也丑戊弧五度循黃極而左旋有時而合於兩極距線為寅戊或戊辛則無丑戊丁角自此以外皆有戊角此算之根也設白道極丑在寅即丑戊寅角法當以戊寅五度白極距黃極與丁戊二十三度半相減餘十八度半為寅丁寅丁丙弧三角形有寅丁邊為白極距北極有丁丙邊北極距天頂有丁角可求寅丙邊為白極距天頂又設丑㸃在辛即以戊辛加戊丁為一邊辛丁如上法可求辛丙弧為白極距天頂以上二者因白極距黃極之線與黃極距北極同一大圈之經度故丁戊線有加減而丁角無加減故只用一弧三角形即可得之此惟月邊半交在二至度然後能如是設正交在秋分之度中交在春分之度則陽厯半交在冬至黃道外隂厯半交在夏至黃道內各五度竒而白道極在兩極距線外亦五度竒如辛如酉法當以白黃大距五度竒辛戊或酉戊加兩極距二十三度半戊丁共得二十八度半竒辛丁或酉丁為一邊丁丙為一邊北極距天頂丁為一角或辛丁丙或酉丁丙可求辛丙邊或酉丙邊即白道極距天頂度以減九十度餘為白道距天頂度捷法即以所得白道極距天頂命為白道九十度距地平此圖丁辛線己用弧線不能作兩白道極圈如圖丙為天頂丁為北極丁戊二十三度半即以丁為心戊為界運規作圓即黃極繞北極之圈再以丁戊引長之至於辛又以戊為心辛為界作圓為白極繞黃極之跡戊辛為黃白距五度竒此圖則戊酉可省今聮丁辛丙成三角形如上論餘觀圖自明更當明者白道限度之不能與黃平象限同在一度即若黃平象限之不能與赤道髙度同在一度同也黃平象限與赤道髙度能在一經度者惟極至圈在子午規之度為然白道限度之能與黃平象限同在一經度者惟兩交在二分之度又極至圈同在午規時也又設正交在春分之度中交在秋分之度則陽厯半交在夏至黃道外隂厯半交在冬至黃道內各五度竒而白道極在兩極距線內亦五度竒如寅如未法當以白黃大距五度竒寅戊或未戊去減兩極距二十三度半戊丁得餘十八度半弱寅丁或未丁為一邊丁丙為一邊丁為一角或寅丁丙或未丁丙可求寅丙邊或未丙邊為白極距天頂即命為白道九十度距地平之髙圖如後以上二者並只用一弧三角形何則以交㸃在二分也交㸃在二分則半交與白極並在極至交圈故丁戊弧自有加減而丁角無加減若交㸃離二分則否何則交㸃逆行即羅計度也交㸃周於天而半交大距亦一周天而白極亦周於黃極左右之小圈故丁角有加減而必用兩三角形也求戊角用兩三角形必先取戊角法曰正交在秋分則白極在辛即在酉從辛左旋過丑至寅而復於辛以生戊角戊角之度或鋭或鈍皆以交㸃距分之度命之白極小圈以羅計一周而復於元度假如正交自秋分向夏至逆行過秋分二十度則白極離辛㸃亦二十度以減半周餘百六十度為戊鈍角求丁角戊丁丙角法曰視極至交圈距午圈若干度分即得戊丁丙角以加時午正黃道度取之白道九十度限用法依前所論以求加時白道九十度限在地平上之髙的確不易用斜弧三角形但如此則交食表所算九十度限俱可不用當另算白道九十度表法曰丑戊丁三角形以丁戊邊兩極距二十三度半丑戊邊白極距黃極五度戊角白極距冬至經圈之度亦即正交離秋分之餘度為二邊一角可求丁丑邊此邊之度天下所同丁角此角亦天下所同其法並以戊角之大小立算只算半周可以立表矣正交在秋分前以過夏至而至春分春分前以過冬至而至秋分之度角在極至圈西東戊丁丙三角形求丁角法曰以應時法求加時午正黃道可借用黃道九十度表取其赤道同升度即得丁角視同升度在冬至後半周其距冬至度即為丁角其角在子午線西若同升度在夏至後半周即以距夏至度去減半周餘為丁角其角在子午線東此丁角亦天下所同丑丁丙三角形先求丁角法曰以先有之兩丁角相減或相併即得丁角兩丁角俱在西或俱在東則相併兩丁角一在西一在東則相減此丁角亦天下所同次求丁丙邊法曰丁丙者各地之北極距天頂也以北極髙度減象限得之次求白道九十度限之髙法曰既有丁角即上所求丁丑邊即先所求丁丙邊即極距天頂為一角兩邊可求丑丙邊為白極距天頂度以減象限得白道九十度限距天頂亦即得其距地平之髙既得白道九十度限距地平之髙再求得月在白道上距九十度限之度分法以月距交前交後度減象餘即得可求其交角白道交天頂經度之角也此交角可借黃道交角表用之但須補作黃道北五度表既得交角則髙下差可知而東西南北差悉定矣康熙四十三年五月十七日乙卯望月食分秒時刻并起復方位京師月食十分三秒初虧子正二刻三分東北食既丑初三刻八分食甚丑正一刻二分生光丑正二刻一分復圓寅正初刻一分正北稍偏西右計食限內凡十三刻十三分按食限內共十三刻十三分折半得六刻十四分故以此減食甚時刻得初虧自初虧子正二刻三分至食甚丑正一刻二分正得六刻十四分加食甚亦得復圓自食甚丑正一刻二分至復圓寅正初刻一分亦得六刻十四分是虧至甚甚至復時刻適均也時刻所以適均者月行天之度均也然則作圖之法自當以食甚月體置於虧復兩限適中之處而不宜偏側矣今監頒蝕圖乃偏置於東若是則虧至甚月行之度分多甚至復月行之度少度既不均則時刻亦宜增減若時刻既無增減則圖之偏者必非正法矣又按食既至食甚食甚至生光時刻亦宜適均與虧至甚甚至復之理無二厯書本法虧復折半之數謂之食甚距分以减食甚得初虧若以加食甚得復圓其食既至生光折半數謂之食既距分以减食甚得食既以加食甚亦得生光並無長短伸縮今圖中所注食既至食甚時刻多食既是丑初三刻八分至食甚丑正一刻二分計一刻九分食甚至生光時刻少食甚丑正一刻至生光丑正二刻一分只十四分相差十分何也豈以食甚圖偏而自疑其法耶不然何以若是又按交食表食甚距分是一時四十四分即監推六刻十四分食既距分是四十二分實計二刻十二分月食只十分三秒食既生光不得有五刻九分之久倍食既距分得八十四分實五刻九分蓋覺其非是而棄表不用也然表之數宜改而其法不宜改表自既至生光五刻九分監推只二刻八分是改數也厯書以距分加减食甚得既與生光而監推相差三分刻之二是改法也今改其數並改其法不知何所見而云然也或疑月行有遲疾自生光至食甚行遲故厯時刻多食甚至生光行疾故厯時刻少此亦說之可通者也然月之遲疾必以漸成決無於二刻八分中頓有十分之差月平行二刻八分只行天三分度之一而弱且食既生光既有遲疾之差初虧復圓何以獨無可謂進退失據矣又按食甚云者以月於此時侵入暗虛獨湥也則其距前後之時刻必為折中均平之處也故月食未既者必於食甚時定其食分以此時所蝕之分最大也假如月食九分則惟食甚時能滿九分前後皆少食八分以下盡然是以謂之食甚若圖有偏側不得謂之食甚矣食未既時有食分以考之食分最多時始為食甚食既矣則食甚無可指惟賴食既生光時刻折半取中而今乃相差若此又何所據而為食甚耶又詳檢之初虧至食既計五刻五分食既至食甚計一刻九分食甚至生光計十四分不滿一刻生光至復圓計六刻無一相同而遲疾皆不倫初限較末限既先疾而後遲初虧至食既五刻五分是初限行疾也生光至復圓整六刻是末限行遲也二限較三限又先遲而後疾食既至食甚一刻九分是次限行遲也食甚至生光只十四分而不滿刻是三限又行疾也是初虧行疾限至食既而忽遲食既行遲限至食甚而頓疾食甚行疾限至生光以後而又遲不識月轉遲疾有如此行度否乎厯算全書卷二十五
