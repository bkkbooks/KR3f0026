body:
  text: 厯算全書卷二十三宣城梅文鼎撰厯學駢枝卷三月食通軌録各有食之望下數經望全分盈縮厯全分盈縮差全分遲疾厯全分遲疾限數遲疾差全分加減差全分定望全分將本日日出分推在卯時何刻望在何刻已下者退一日也只說見定朔望條卯時舉例言也按其定望退一日據小餘在日出分已下斷之并不必求時刻入交泛日全分定入遲疾厯定入遲疾限此限與前同者便不必書出損益分并行度按此處損益分不言何用似總不必書出定限行度晨分月入之時刻也先于復圓有帶食日出分日入分昏分月出之時刻也後于初虧有帶食按晨昏分所以定更㸃也其帶食分只用日出入分不用晨分蓋晨昏日未出月則猶見昏前日已入月則已見也注誤天正赤道度天正黃道度交常度交定度已上諸法皆與日食同推卯酉前後分法視定望小餘如在二千五百分已下者就為卯前分若已上者去減半日周五千分為卯後分又如在七千五百分已下者內減去五千分為酉前分已上者去減日周一萬分為酉後分按凡卯酉前後分皆距子午言之卯前分是距子正後之分故即以小餘定之卯後分是逆數午正前之距分故以小餘減半日周酉前分是順數午正後之距分故以半日周減小餘酉後分是逆數子正前之距分故以小餘減日周推時差分法置日周一萬內減去卯前卯後分或酉前酉後分滿千分者命為十分滿百分者命為單分為時差分推食甚定分法置所推時差分如入定望小餘共得為食甚定分按日食氣刻時三差皆起于唐宣明厯非月食所用後來諸厯或有用月食時差者皆于近卯酉則差多近子午則差少又皆子前減子後加今依通軌所推則近卯酉者差反少近子午者差反多又不問子前子後皆以加定望小餘而無減法種種與厯經相反竊依元史月食時差法定之如左依厯經求月食甚定分法置卯酉前後分有千法實皆定三有百法實皆定二自相乘言十加定一子退二位去二子如四百七十八而一去二子不滿法去一子以所定二子為百分一子為十分為時差子前以減子後以加皆加減定望分為食甚定分依發斂加時求之即食甚時刻按卯酉前後分即前所推卯前卯後分或酉前酉後分自相乘者如求南北差法即以所得卯酉前後分為法與實也凡卯酉前後分皆自子午起算以自相乘則近卯酉差多近子午差少矣退二位法同日食時差以得數後有百萬退作萬有十萬退作千而後除之也如四百七十八而一者是以四百七十八除之如四百七十八分為一分也子前減子後加者凡望時之月在日所衝故日在子前月乃在午前日食午前減故月食亦子前減也日在子後月乃在午後日食午後加故月食亦子後加也其差多者不過一百三十分有竒而止故以四百七十八為法除之也推食甚入盈縮厯及食甚入盈縮差併食甚入盈縮厯行定度三法俱與日食同只換望日推月食入隂陽厯法視所推交定度如在交中度一百八十一度八九六七已下者便為入陽厯也如在已上者內減去交中度餘為入隂厯也按交中度數原生于隂陽厯月入陽厯則在黃道南行一百八十一度有竒畢復入黃道北而行隂厯一百八十一度有竒畢則又復入陽厯矣行陽厯隂厯各一次謂之交終半之為交中今交定度在交中度已下是月在黃道南就為入陽厯度數也其在已上者是月在黃道北故于交定度內減去交中度命其餘為入隂厯度數也陽厯數自交初起算隂厯數自交中起算也推交前交後度法視所推月食入隂陽厯如在後凖一十五度五十分已下者便為交後度也如在前凖一百六十六度三九六八已上者置交中度內減去隂陽厯餘為交前度也按凡言交者皆月出入黃道斜十字相交之際也凡隂厯在後凖已上者是月入隂厯去交未逺尚在十五度內故為隂厯交後度也凡隂厯在前凖已上者是將交陽厯距交已近只在十五度內故為隂厯交前度也陽厯同月食限只一十三度五分而此言十五度五十分者蓋以盈縮差加減之則亦十三度有竒故以十五度五十分為食凖也推月食分秒法置月食限一十三度五分內減去交前或交後度十度定三單度定二得按定子法疑有誤若如所云則月食必無十分者安有既內外之分乎愚意當是十度定五單度定四也以定法八十七分去一為法除之不滿法去一子所定有三子為十分二子為單分為月食分秒不及減者不食十分已下者用三限辰刻法已上者用五限辰刻法按月食限度多于日食者暗虛大而月小也故不問隂陽厯但距交前後一十三度五分內即能相掩而有食也定法八十七即食限十五分之一故定望正當交度其食十五分漸離其處食分漸殺假如距交前後一度七十四分則于食十五分內減二分只十三分又如距交前後九度五十七分則于食十五分內減十一分只食四分也故置食限以距交度減之即于食十五分內減去若干分秒減不盡者如定法而一為所食之分秒也如食限不及減則是距交前後度多于月食限已在十三度五分之外暗虛雖大至此不能相掩斷不食也推月食定用分法置月食分三十分內減去所推月食分秒餘十分定三單分定二為實却以月食分秒十分定三單分定二按十分宜定一今加定三子者以分下有十有秒也故亦以定六子為百分法實共加定四子也為法乘之言十定一定有六子為百分五子為十分得為開方積立天元一於單微之下依平方法開之得為開方數言十定一復以四千九百二十分定五乘按以六分八百二十分得四千九百二十分又按元史數同日食為法乘開方數有十定一得數又以其前推得定限行度去四子空度去三子為法除之不滿法去一子定有二子為百分一子為十分得數為所推定用分也定用分者月食自初虧復滿距食甚之時刻也然日食只十分而月食則有十五分者暗虛大也暗虛之大幾何曰大一倍何以知之以算月食用三十分知之也依日食條論兩員相切法暗虛半徑十分月半徑五分兩邊相切則兩半徑聫為一直線共十五分為兩心之距以此距線用暗虛心為心運作大圓正得全徑三十分也此大圓邊距暗虛邊四周各五分為兩圓相切時月心所到之界其兩心之距十五分即大圓半徑常用為弦而以食甚時兩心之距為句食甚時月心侵入大圓邊之數為句弦較其數與月食分秒同以此與大圓全徑相減餘即句弦和和較相乘為股實開方積也其開方數為股即自虧復至食甚月心所行之白道也四千九百二十乘者何也依日食條論又是十分八百二十而用其六也蓋所得月體又小于日一分也然厯經所用與日食同此不同者蓋改率也或亦改三應數時所定推三限辰刻等法置所推食甚定分內減去定用分餘為初虧分也不及減者加日周減之復置食甚定分內加入定用分共得為復圓分也滿日周去之時刻依合朔推之按三限辰刻同日食理不復贅初虧時兩心之距為弦即大員三十分半徑食甚時兩心之距為句食甚時月心侵入大員界八分為句弦較自虧至甚月心所行之度分為股甚亦復亦同此以月食八分為例餘可倣推又此係陽厯故月在暗虛南若隂厯反此論之推既內分法置月食限一十五分按厯經作月食既一十分今從之內減去所推月食分秒自單以下全分餘十分定三單分定二有句誤按此處無十分當是分定二十秒定一也為實却以月食分秒自單分以下分秒單分定二十秒定一為法乘之言十定一所定有五子為十分四子為單分得為開方積立天元一於單微之下依平方法開之得為開方數就置開方數十分定五單分定四分按十分定五句誤此處開方數必無十分當作十秒定三有定四也分加定四子者以有秒微也復以四千九百二十分定五為法乘之言十定一得數又以所推定限行度去四子空度去三子為法除之不滿法去一子所定有六子為百分五子為十分得為所推既內分也按厯經原是以既內分與一十分相減相乘此則改為一十五分今以大圓掩小圓率求得既內小平圓徑一十分與厯經合故斷從厯經月食十分則既矣此時月體十分全入暗虛而月之邊正切暗虛之心兩心之距正得五分以得五分為半徑自暗虛心作小平圓其全徑十分其邊各距暗虛心五分為食既時月心所到之界過此界則為既內矣假如月食十二分食既時月心正掩小圓之邊食甚時月體則入暗虛內二分而月心亦侵入小平圓二分故即用此二分為句弦較以與小平圓全徑相減餘為句弦和和較相乘得積開方得股即月心從食既至食甚在暗虛內所行小平圓內之白道也於是亦如前法變為度分而計其行率則知月入暗虛以後行至食甚所厯時刻之數而命為既內之分也食甚至復圓同論乙為暗虛心初虧時月心在甲以其邊切暗虛於庚兩心之距為乙甲與壬乙等大員半徑十五分也為大弦食甚時月心行至丁丁甲度分為自虧至甚之行與甚至復丁戊之行等為大股丁乙三分食甚時兩心之距為句壬丁十二分食甚時月心侵入大圓內之數也為句弦較食既時月心在丙兩心之距乙丙與生光時己乙之距等小圓半徑五分也為小弦丙丁為月心自既至甚之行與甚至生光己丁之行等為小股丁乙仍為句午丁二分為食甚時月心侵入小員之數為句弦較丙至丁所厯時刻與己至丁時刻等是為既內分甲至丙所厯時刻與己至戊等是為既外分此以隂厯月食十二分為式餘皆倣論開方數壬丁十二丁癸十八相乘二一六平方開之得丁甲十四六九午丁二分丁辰八分相乘十六平方開之得丁丙四分推既外分法置所推定用分內減去既內分餘為既外分也按既外分者是月食初虧至食既生光至復圓所厯時刻也原所推定用是自虧初復末中距食甚之數乃既內既外總數也故於其中減去既內時刻其餘即既外時刻推五限辰刻等法置食甚定分內減去定用分為初虧分初虧分加既外分為食既分食既分加既內分為食甚分食甚分加既內分為生光分生光分加既外分為復圓分也不及減者加日周減之滿日周去之推時刻同前按月食有五限辰刻異於日食者日食只十分故其食而既也即其食甚也才食而既其光即生則其生光之分亦即其食甚也若月食則十五分自食既以至生光厯時且久為刻皆殊中折二數以知食甚總計虧復故有五限也以定用減小餘者所算定用原是食甚距初虧之數也故以減食甚得初虧以既外加初虧及生光者所算既外原是初虧距食既及生光距復圓數也故以加初虧得食既以加生光得復圓至於所算既內原是食既至生光折半之數即是食既生光中距食甚之數也故以加食既得食甚以加食甚得生光不及減加日周者是食甚在子正後初虧等在子正前也加滿日周去之者是食甚等在子正前復圓等在子正後也凡言時刻同前者皆依發斂加時推法也推月食入更㸃法視望下盈縮厯與太陽立成同日之晨分就加一倍得數用五千分而一句誤按當作五而一下同得為更法分也定數滿法得千分不滿法得百分也將更法又用五千分而一得為㸃法分也定數滿法得百分不滿法得十分也也句誤甚按當作滿法者百已上不滿法者二百已上大約更法有干者則不滿法按更㸃倍晨分者凡日入後二刻半而昏日未出前二刻半而晨晨則辨色未昏則不禁行晨昏啓閉以此為節是益晝五刻損夜五刻聖人扶抑之道無所往而不存也其晨分皆自子正距晨之數夜之有晨分猶日之有半晝分也逆推子正前距昏之數正與相等故倍其晨分即為夜刻也於是以五除之即其夜每更所占時刻之數也假如晨分二千五百倍之五千五除之則知每一更中占有一千分也滿法者是在五千分已上故知得數為千分不滿法者是在五千分已下故知得數為百分於是又置更法以五除之即其夜每㸃所占刻數也假如更法分一千五除之則知每㸃中占有二百分也其㸃法得數無論滿法不滿法總是百分不必定數又除法只是單五每夜五更每更五㸃故以五除之也推初虧等更㸃法視初虧分如在晨分已下者就加入晨分共為初虧更分也如在昏分已上者內減去昏分餘為初虧更分也却以元推更法分為法除之命起一更算外得為初虧更數也其不及更法數者却以元推㸃法分為法除之命起一㸃算外得為初虧㸃數也次四限更㸃倣此而推各得更㸃也若在日入以上昏分以下者命為昏刻若在日出以下晨分以上者命為晨刻皆無更㸃按初虧等分如在晨分已下者是在子後也加入晨分是逆從子前昏刻算起也其在昏分已上是在昏後也故減去昏分是減去晝刻截從初昏算起也二者總是從初更初㸃起算初更初㸃即一更一㸃加減後得數即知今距初更初㸃已若干數於是以本日更法除之其滿過更法有幾數便知已過幾更故算外命為更數也其不滿更法而餘者則正是初入此更以來未滿之數故又以㸃法除之其滿過㸃法有幾數便知在此更中已過幾㸃故算外命為㸃法便知所推初虧等尚在苐幾更苐幾㸃中未滿也其有總不滿更法數者則只是初更其有以㸃法除總不滿法者則只是初㸃也推月食起復方位法視月食入隂陽厯如是陽厯者初起東北食甚正北復圓於西北也如是隂厯者初起東南食甚正南復圓於西南也若食在八分已上者無論隂陽厯皆初起正東復圓於正西也按月食起復方位主月體言之即人所見月之上下左右也以卯位言之則東為下西為上北為左南為右以酉位言之則東為上西為下南為左北為右也月食入隂陽厯亦主月道言之如是陽厯食是月在日道南其入暗虛被掩者在北故食起東北甚於正北復於西北也如是隂厯食是月在日道北其入暗虛被掩者在南故食起東南甚於正南復於西南也其食在八分已上者是月入暗虛正相掩而過故食起正東復於正西也凡暗虛在日所冲太陽每日行一度暗虛隨之而移月之行天既視暗虛為速故其食也皆暗虛先在東月自西來道有必經無所於避遂入其中而為所掩既受掩矣則行而出於暗虛之東却視暗虛又在月西故月食虧初皆在東復末皆在西也又按厯經此亦據午地言之推月有帶食分法同日食推月有帶食例昏月未出已復光若干月已出見復光若干晨月未入見復光若干月已入未復光若干昏月未出已食若干月已出見食若干晨月未入見食若干干月已入不見食若按月帶食法同日食而只互易其晨昏書法者何也蓋月食於望望者日月相望故日出則月入月出則則日入故易日之昏為月之晨易日之晨為月之昏也其所以同者何也假如日入分在復圓分已下是復圓在日入月出後于日為見食甚不見復末者於月則為見復末不見食甚也若日出分在復圓分已下是復圓在日出月入後於日為見復末不見食甚者於月則為見食甚不見復末也之二者總是以食甚分減日出入分其所推帶食則總是日月出入前距食甚之數其以減食分而餘者亦總是日月出入後未復光之數故總謂之已復光未復光而以所推帶食分録於前也又如日入分在初虧分已上是初虧在日入月出前於日為見虧初不見食甚者於月則為見食甚不見虧初也若日出分在初虧分已上是食甚在日出月入後於日為見食甚不見虧初者於月則為見虧初不見食甚也之二者總是以日出入分減食甚分其所推帶食分則總是日月出入後距食甚之數其以減食分而餘者亦總是日月出入前已食之數故總謂之見食不見食而以所推帶食分録於後也餘詳日食又按厯經月食既者以既內分減帶食差餘進一位如既外分而一以減既分即帶食出入所見之分不及減者為帶食既出入蓋凡所推帶食差是食甚所距日出入時刻今以既內分減之而餘者即是日出入後距食既前或日出入前距生光後其間所有時刻也進一位者即是以既分乘之也又以既外分除之則知其食既生光距日出入時于既外全數中分得幾許時刻即知其於食既全數內分得幾許食分也故以減食既十分即為帶食出入之食分也不及減者是帶食差少於既內分其日出入分已在既內分內故為帶食既出入也推食甚月離黃道宿次度法置元推食甚入盈縮厯行定度全分如是盈厯者加半周天一百八十二度六二八七五及天正黃道箕宿度其得為黃道定積度也如是縮厯者止加天正黃道箕宿度內減去七十五秒餘為黃道定積度也無論盈縮厯皆以其黃道各宿次積度鈐挨及減之餘為食甚月離黃道某宿次度分也按月食黃道定積度者逆計月離度前距天正日躔宿度之數也元推食甚入盈縮厯行定度則是所求日躔距天正宿度乃月食所冲也如日在北正月食於南正故盈厯加半周天便是食甚月離宿度又加天正箕宿度便知食甚月離距黃道箕宿初度若干也其縮厯行定度則是日躔距夏至度數故即用其數為月離蓋月食日冲日躔夏至宿後第幾度月食即亦在冬至宿後第幾度故不必加半周天也內減去七十五秒者盈厯縮厯相距半嵗周不及半周天七十五秒減黃道積度鈐法同日食不贅依授時厯經黃赤道法勿庵補定求四正後赤道積度置天正冬至所在宿赤道全度以天正赤道減之餘為距後度以赤道宿度纍加之即各得其宿距冬至後赤道積度加滿象限去之為四正宿距後度亦以赤道宿度纍加之滿象限去之即各得其宿距春分夏至秋分後赤道積度按四正者四仲月中氣即二至二分也凡天正赤道度是天正冬至前距其宿初度之數故以減其宿全度即各得冬至後距其宿末度之數也於是以後宿赤道纍加之即知冬至後各宿距冬至度所積之數也滿象限去之者加滿象限是其宿當四正所躔故減去象限即知四正後距其宿末度之數也於是又以赤道各宿度纍加之即各得四正後各宿所距四正度之數也求赤道變黃道置各宿距四正後赤道積度用黃赤道立成視在至後者以第三格赤道積度相挨者減之餘有十定三有分定二為實以其上第二格黃道率乘之不用乘只加定四子以下第四格黃道率為法除之有度去四有十去三不滿法再去一視定有四子為度三子為十分加入第一格黃道積度即為其宿距至後黃道積度其夏至後再加周半天即各得其宿距天正黃道積度也若在分後者以第一格赤道積度相同者減之只用小餘有十定三有分定二為實以下第四格黃道率為法有度定四度定三乘之言千定一得數以其上第二格赤道率除之不用除只去四子視定有四子為度三子為十分加入第三格黃道積度即得其宿距分後積度其春分後再加一象限秋後分再加三象限即各得其宿距天正黃道積度也於是各置其宿距天正黃道積度以相挨前一宿黃道積度減之即各得其宿黃道本度也秒就近約為分按至後不用乘者其立成黃道率只是一度乘過數不動故只加定四子也分後不用除者其立成赤道率亦是一度除過數亦不動故只虛去四子也夏至後加半周天春分後加一象限秋分後加三象限者此所求黃道積度皆距四正起算故各以四正距天正黃道數加之即其宿前距天正之數也蓋至後黃道雖減于赤道分後黃道雖加于赤道其實至四立之後則加之極而反減減之極而反加總計一象皆得九十一度有竒此天道如環平陂往復間不容髮也減前宿積度為其宿本度者積度即是距天正數原包前宿在內故減之即得本度也秒就近約為分者凡秒五十已上收為分已下棄之就整數也其七十五秒寄虛度求天正冬至黃道度置周天度三百六十五度二五七五內減天正前一宿距天正黃道積度餘命為天正冬至宿黃道度分也若徑求者置象限以其年天正赤道度減之餘為天正前宿距秋分後赤道積度依赤道變黃道法求出其宿距分後黃道積度以減象限餘為天正黃道度按周天度是自天正後積至天正前黃道總數故減去前宿距天正黃道積度即得天正距所在宿初度之數也徑求法置象限者即是自天正前距秋分後赤道總數也內減去天正赤道度其餘即是前宿距秋分後赤道積度也赤道變黃道法即是以立成第一格積度減餘以第四格度率乘以第二格度率除加入第三格積度而命為前宿距秋分後黃道積度也又以減象限者此所為象限即是自天正前距秋分後黃道總數故減去前宿距秋分黃道積度其餘即是天正冬至距其宿初度黃道之數也求黃道宿積度定鈐置天正冬至宿黃道度及分加入其宿距至後黃道積度及分共得為天正冬至宿黃道定積度以各宿黃道度纍加之即各得其宿黃道定積度按分至每嵗有差黃道因之而易即不能每嵗步之當於六十六年嵗差一度時更定度鈐始為無弊也凡冬至所在宿皆有前後距其黃道皆減於赤道今所推其宿至後積度是自冬至日躔後距其宿末度黃道數其天正黃道宿度則是自冬至日躔前距其宿初度黃道數也合二數為其宿初度距其末度總數故即命為天正宿定積度也於是以各宿黃道度纍加之即所得其宿所距天正宿初度之數而命為定積度也求日月食甚宿次黃道度及分秒法同通軌又術置所推食甚盈縮厯縮厯加半周天為黃道定積度月食盈縮厯俱加半周天滿周天分去之為黃道定積度皆徑以距天正黃道積度相挨者減之即各得日月食甚黃道宿度及分秒按此法不用定積度鈐故亦不加天正黃道度然必每年步定黃道積度方可用之也赤道宿度角十一度一亢九度二氐十六度三房五度六心六度五尾十九度一箕一十度四右東方七宿七十九度二十分斗草五度二牛七度二女十一度三五虛八度九五太危十五度四室十七度一壁八度六右北方七宿九十三度八十分太奎十六度六婁十一度八胃十五度六昴十一度三畢十七度四觜度五參十一度一右西方七宿八十三度八十五分井三十三度三鬼二度二栁十三度三星六度三張十七度二五翼十八度七五軫十七度三右南方七宿一百八度四十分黃赤道立成厯算全書卷二十三
