body:
  text: 歷算全書卷四十六宣城梅文鼎撰句股闡微卷一句股正義首題句股弦者橫曰句縱曰股亦可云勾縱股橫斜曰弦三線相聨而成句股弦形也如圖甲乙丙形甲乙為股乙丙為句甲丙為弦亦可云甲乙為句乙丙為股也凡三角形或三角俱鋭或兩鋭一鈍或兩鋭一正鋭鈍正說具三角形算法中句股弦形者兩鋭一正形也其句股兩線縱橫相遇而成者為正角如乙㸃句弦兩線及股弦兩線相遇而成者為鋭角如甲丙兩㸃此三線者或三線俱不等其最大者必弦或兩線等其等者必句股而無三線等何者以句股弦形一角正故也一題句股求弦法曰句股各自乘併之開方得弦如圖甲乙句自乘得乙丁方乙丙股自乘得乙戊方兩方相併即甲巳方開之得甲丙弦論曰試移庚實形補辛虛形移丑實形補卯虛形移壬實形補子虛形移卯午實形補壬辰虛形所移者恰盡所補者恰足得乙丁與乙戊兩方併恰與甲巳方等又論曰更以句與股相等之形觀之夫句與股既等則句股各自乘固方也即句股互相乘亦方也凡句股不等則句股互相乘必是矩形如丁戊大方平分方邊於方形中縱橫作線中分四小方形必等又句與股既等則弦上方邊為句股各自乘兩方之對角線亦為句股互相乘兩方之對角線如於四小方形中作四對角線相聨而成一中方形也此中方形者割小方形四之半即涵小方形二之全就此圖觀之尤為明顯又法曰句與股相乘倍之另以句股差自乘併入倍數開方得弦論曰甲乙股乙丙句相乘得乙丁矩形中分為庚戊兩形夫庚形即辛形也倍之者再加癸卯兩形也乙丙為句丙巳為股乙巳為句股差自乘得乙子方併入倍數共成甲壬方為甲丙弦上方也又法曰句自乘倍股依長濶相差法求之得股弦差加股為弦論曰甲乙丙句股形甲丙弦也丁已亦弦也丁戊弦上方也乙丙股也乙壬亦股也乙子股上方也餘乙戊子磬折形即句自乘之數也而已壬矩與乙丑矩等即丙戊矩亦句自乘之數也此丙戊矩形中乙丙為股加乙壬為倍股曰長濶相差者丙午為長午戊為濶與壬午等即壬丙倍股為長濶之差也依法求之得壬午為股弦差二題句弦求股法曰弦自乘內減句自乘餘開方得股論曰一題句股求弦苐一法句股各自乘併之即弦自乘數則弦自乘數中有句股各自乘之數也今於弦自乘數中減去句自乘所存者即股自乘數矣就一題之圖觀之自見又法曰句弦相併得數相減得數兩數相乘得數開方得股如圖甲乙丙句股形乙丙句甲乙股甲丙與乙丙相併即乙丁線相減即乙巳線乙巳與乙子等兩線乙丁乙子相乘得子丁矩即甲乙股上方論曰己午方者已丙線上方即甲丙弦上方也內减子午形為乙丙句上方所存卯巳未磬折形即甲乙股上方矣而巳未矩又與丁卯矩等則丁子矩形即卯巳未磬折形矣亦即甲乙股上方矣又法曰句自乘倍弦依長濶相和法求之得股弦差用減弦得股論曰甲乙丙句股形甲丙弦也丁己亦弦也丁戊弦上方也乙丙股也乙壬亦股也乙子股上方也餘乙戊子磬折形即甲乙句自乘之數也而己壬矩與乙丑矩等即丙戊矩亦甲乙句自乘之數也此丙戊矩形中乙午為弦乙丙併午戊為倍弦曰長濶相和者丙午為長午戊為濶即丙午午戊併為長濶相和也依法求之得壬午為股弦差三題股弦求句法同二題句弦求股附長濶相和法如圖丁乙矩形積九百七十二尺丁甲為長乙甲為濶兩邊之和共六十三尺求甲丁甲乙二邊各若干法以和數自乘得三千九百六十九尺次以積四倍之得三千八百八十八尺與和自乘相減存八十一尺開方得九尺即丁甲乙甲二邊之較數以與和六十三尺相併折半得三十六尺為甲丁長邊又與和相減折半得二十七尺為甲乙矩邊長濶相差法圖同上丁乙矩形積九百七十二尺甲乙為濶戊乙為長丙戊九尺乙丙即甲乙為長濶相差數甲乙戊乙二邊各若干法以較數九尺自乘得八十一尺次以積四倍之得三千八百八十八尺與較自乘相并得三千九百六十九尺開方得六十三尺即戊乙甲乙二邊之和數以與較九尺相併折半得三十六尺為戊乙長邊又與較九尺相減折半得二十七尺為甲乙短邊解曰甲午矩形作乙丙對角線成甲乙丙句股形甲丙長句也甲乙濶股也丙丑長濶和也甲丑即乙甲自乘得丙子大方四倍矩積也并大方內戊丁庚辛四矩形之積大方內所容四矩俱與元形等如丙壬矩即甲午矩其八句股形亦俱等元形相減存己壬小方開方得巳未邊即甲乙甲丙二邊之較數也卯亥即甲乙股卯壬即甲丙句則壬亥為兩邊較數即長濶相差也既得較數與所有和數相加減得甲乙甲丙二邊矣若長濶相差法是先有巳未較數故以上法反用之求得丙丑和得丙丑亦得甲乙與甲丙矣四題弦與句股較求句股法曰弦自乘倍之較自乘用減倍數餘開方得句股和於是和加較半之得長股和減較半之得短句論曰甲乙丙句股形甲乙句也乙丁句上方也乙丙股也丙戊股上方也兩方併共為弦上方辛壬亦句上方庚已亦股上方兩方併亦共為弦上方此即弦自乘倍之之數也而兩句方兩股方併為丙己大方則中間重叠庚戊方矣此何方乎曰戊子即句股較也庚戊方即較上方也減之而重叠者去矣所存者為句股和上方矣故開之得丙丑為句股和也又法曰弦自乘內減較自乘餘半之以較為長濶相差法求之得短句加較得長股論曰甲乙丙句股形甲丙弦也甲丁弦上方也巳子較也己丑較上方也兩方相減餘壬辛午未四形半之餘午未二形而午形又即戊形則是餘未戊二形也此未戊二形者句股矩內形也故以巳子較用長濶相差法求之得子丙短句句加較得巳丙長股五題股與句弦較求句弦法曰股自乘內減較自乘餘半之以較為法除之得句句加較得弦論曰甲乙丙句股形甲丙弦也甲丁弦上方也甲巳較也甲戊較上方也庚甲辛磬折形股自乘數也內減甲戊較上方所餘丙戊戊壬兩形即為句與句弦較矩內形者二矣取其一如丙戊形以戊己較除之得己丙句或不用折半倍較為法除之亦同又法曰股自乘以較為法除之得句弦和於是加較折半得弦減較折半得句論曰甲乙丙句股形甲丙弦也甲丁弦上方也丙己亦句也丁戊句上方也所餘庚甲辛折形即股自乘數也而壬辛形與戊丙形等即壬己矩形亦股自乘數也以甲巳較除之得甲壬為句弦和也又法曰股自乘較自乘相併倍較為法除之得弦弦減較得句論曰甲乙丙句股形甲丙弦也甲丁弦上方也丁己為句上方即戊甲辛磬折形為股上方矣又己丙矩與庚壬矩等即甲辛子磬折形亦股上方也加甲子較上方共得辛丑矩形其庚辛邊即是倍較六題句與股弦較求股弦法同五題七題弦與句股和求句股法曰弦自乘倍之內減句股和自乘餘開方得句股較於是較加和半之得長股較減和半之得短句論曰甲乙丙句股形丙丁句股和也丁子和上方也丁午未子兩句上方丙丑壬巳兩股上方此即弦自乘倍之之數也以較丁子和上方則其中重叠一壬丑方矣而此方之邊即是句股較又法曰句股和自乘內減弦自乘餘半之以句股和用長濶相和法求之得句股論曰丙丁為句股和丁巳為和上方午乙壬磬折形即弦上方兩方相減餘午丑壬磬折形分為午丑及丑壬兩形形之兩邊即句股八題股與句弦和求句弦法曰句弦和自乘內減股自乘餘半之以句弦和除之得句用減句弦和得弦或不用折半倍句弦和除之亦同論曰甲乙丙句股形甲丁為句弦和甲巳為和上方又甲午為弦上方甲子為句上方即未午壬磬折形為股自乘而子丙矩與午辛矩等即戊辛矩形亦股自乘也於和方中減之所存者為未丁及戊己兩矩形矣形之一邊如甲丁即句弦和其一邉如甲未即句又法曰股自乘得數以句弦和除之得句弦較於是用加句弦和半之得弦用減句弦和半之得句論曰甲乙丙句股形甲丁句弦和也甲戊弦上方也戊己句上方也即午甲未磬折形為股自乘矣而卯巳矩與午丁矩等即甲子矩形亦股自乘矣形之甲丁邊即句弦和丁子邊即句弦較又法曰句弦和自乘股自乘相併倍和為法除之得弦弦減和得句論曰甲丁為句弦和甲戊為和自乘戊丑為句今試依庚戊矩作丁卯矩即卯甲丑磬折形亦和自乘矣又甲巳為弦上方未壬為句上方即未己壬磬折形為股自乘矣而壬子矩與子丑矩等即未丑矩亦股自乘矣然此猶在和自乘數中也今另加一股自乘如丑卯矩併前卯甲丑磬折形共成一庚癸矩形即為兩自乘相併之數形之甲癸邉即句弦和之倍形之甲庚邊即是弦也九題句與股弦和求股弦法同八題十題句弦較股弦較求句股弦法曰先以兩較相減得即為句股較次以兩較各自乘相併內減句股較自乘餘開方得弦和較和句股和也於是加股弦較得句加句弦較得股以句弦較加句或以股弦較加股得弦論曰甲乙丙句股形甲丙弦也甲巳即股也巳丙股弦較也甲壬即句也壬丙句弦較也壬己句股較也今試引甲壬句至丁令甲丁為句股和即丙丁為弦和較也次作甲戊為和上方午未為句弦較上方午子為股弦較上方即庚辰方兩較上方相併共為午未辰磬折形內減未子句股較上方餘辰午癸磬折形即戊午弦和較上方何則試觀丑午已磬折形句上方也子戊形亦句上方也今於丑午已磬折形中減丑申及辛巳兩矩形即是於子戊形中減卯子亥磬折形也然則所餘之辰午癸磬折形非即戊午方乎又法曰兩較相乘倍之開方亦得弦和較以下同前法論曰甲乙丙句股形試引甲丙至丁得甲丁為句股和甲戊為和上方甲未股未丁句丁子己子句也丁辛己壬弦也子辛子壬句弦較也未子亥子股也未申亥卯弦也子申子卯股弦較也然則卯辛與申壬兩矩形即是兩較相乘倍之之數也此兩矩形者即戊午弦和較上方丙丁為弦和較何則未申亥磬折形句實也子戊方形亦句實也今試於未午亥磬折形減辛丙庚亥兩矩形辛未及亥壬皆是弦和較及子午方即是於戊子方中減癸子丑磬折形也然則卯辛與申壬兩矩形非戊午方乎十一題句股較句弦較求句股弦句短股長看此題法曰先以兩較相減得即為股弦較次以兩較各自乘相減餘為實倍股弦較為法用長濶相差法求之得句句加句股較得股句加句弦較得弦論曰甲乙丙句股形丙乙股丙戊句丙巳弦戊乙句股較戊己句弦較乙巳股弦較乙丁亦為句丙丁為句股和丙庚為和上方辛壬為句股較上方辛子為句弦較上方兩較上方相減餘丑子午磬折形夫乙子卯磬折形句實也壬庚方亦句實也今於壬庚方中作未庚未申兩矩形與己丑寅卯兩矩形等即所餘壬申形與丑子午磬折形等矣於是依壬申形作壬亥形此形壬酉為長壬癸為濶與壬辰等即辰未未酉為股弦較之倍為長濶之差按此法句股較句弦較相減得股弦較即三較皆備矣十題第一法句弦較股弦較相減得句股較即三較亦皆備矣既皆備三較則法可互用特以就題立法則法固各有攸屬耳十二題句股較股弦較求句股弦股短句長看此題法同十一題十三題句弦和股弦和求句股弦法曰兩和各自乘相併兩和相減即為句股較自乘用減相併數餘開方為弦和和弦和弦也句股和也弦和和弦與句股和相併也於是內減句弦和得股內減股弦和得句內減句股得弦論曰甲乙丙形甲乙股也丁乙股弦和也乙午股弦和上方也乙丙句也丙子句弦和也丙未句弦和上方也甲丙弦也丙丑股也丑巳句也甲己弦和和也甲壬弦和和上方也乙午丙未兩方併較甲壬方則兩方多一句股較自乘之數何則試觀甲壬方中弦股句三方即乙午丙末兩方中弦句股三方也甲壬方中股弦矩二句弦矩二即乙午丙未兩方中股弦矩二句弦矩二也無或異也所異者惟甲壬方中餘句股矩二與乙午丙未兩方中餘弦方一則弦方一與句股矩二其較為句股較上方何則試觀另圖甲丙弦也甲丁弦上方也甲乙股也乙丙勾也甲乙丙形句股矩形之半也而丙巳丁丁子丑丑午甲三形皆與甲乙丙形等共四形即得句股矩之二也中餘乙巳子午方即句股較上方然則乙午丙未兩方併較甲壬方不多一句股較上方乎故於兩方中減之即得甲壬方也又法曰兩和相乘倍之開方得弦和和以下同前法論曰甲乙丙形乙丁股弦和也丁午句弦和也乙午兩和矩內形也丙子句弦和也丙辛股弦和也丙未兩和矩內形也甲丙弦也丙丑股也丑巳句也甲己弦和和也甲壬弦和和上方也乙午丙未兩矩形與甲壬方形等者兩矩形中有兩弦方甲壬形中有弦方一股方一句方一亦即兩弦方也兩矩形中有股弦矩二句弦矩二句股矩二甲壬形亦有股弦矩二句弦矩二句股矩二也然則乙午丙未兩矩形不與甲壬方形等乎十四題句股和句弦和求句股弦法曰先以兩和相減得即為股弦較次以兩和各自乘相減餘為實倍股弦較為法依長濶相差法求之得句句減句股和得股句減句弦和得弦論曰甲乙丙形甲丁句弦和也甲戊句弦和上方也巳丁句股和也子戊句股和上方也兩和之較為甲巳兩方之較為壬甲丑磬折形此形中午甲未磬折形句實也癸戊方形亦句實也夫癸戊方形與壬甲丑磬折形其餘為辛未午丁兩矩形今試作癸寅寅申兩矩形與之等即戊申矩形與壬甲丑磬折形等矣此戊申矩形戊庚為濶即句與庚癸等癸卯卯申為倍數為長濶之差十五題句股和股弦和求句股弦法同十四題十六題句股弦形中求容方先論曰凡於句股形中依句股兩邊作方形或矩形則作形之外所餘之角形二自相似亦與元形相似如圖甲乙丙元形作壬丁乙子方形則此形之外所餘甲丁壬及壬子丙兩角形自相似何則謂甲丁與壬子相似丁壬與子丙相似也若作壬丁乙子矩形亦然又此兩形之各兩邊與元形之兩邊相似何則謂甲丁壬子兩邊與甲乙邊相似丁壬子丙兩邉與乙丙邊相似也於是遂生求容方之法如左獨不能生求容矩之法者以容方則甲丁丁壬兩邉即甲乙邉壬子子丙兩邉即乙丙邉也若容矩則否法曰句股相乘為實併句股為法除之得方邊論曰甲乙股乙丙句相乘得甲丙矩即未午矩矩之甲午邊甲乙股乙午即句乙子即方邊何則甲丙弦為甲丙矩形之對角線亦為甲壬壬丙矩形之對角線則甲乙丙與甲丑丙甲丁壬與甲未壬壬子丙與壬亥丙各角形自相等今於甲乙丙甲丑丙相等之兩形中各減去相等之角形所餘之乙壬方與壬丑方必等次於兩方各加一同用之子亥矩則乙亥矩與子丑矩亦必等而子午矩與乙亥矩等亦即與子丑矩等然則甲丙矩不與未午矩等乎又法曰句自乘為實併句股為法除之得餘句用減句餘即方邊論曰甲乙丙句股形乙丙句自乘得乙丁方即未已矩形形之戊丙即股丙巳即句丙子即餘句乙子即方邊何則丑丁形即子巳形也壬乙形即壬戊形也然則乙丁方即未巳矩也十七題句股弦形中求容圓法曰句股相乘倍之為實句股弦共為法除之得容圓徑或句股相乘為實句股弦共為法除之得容員之半徑或句股相乘半之為實句股弦併而半之為法除之得容圓之半徑論曰試於形之三邊截取己子未三㸃令乙子與乙巳等甲巳與甲未等丙未與丙子等次於已子未三㸃各作己丁未丁子丁三線為形三邊之垂線必相遇於丁而相等何則試先就己甲未丁四邊形論之甲巳甲未兩邊等己未兩角皆正即巳丁未丁兩線必等依顯未丁與子丁兩線子丁與巳丁兩線亦必各等然則丁即圓心三線即圓之半徑矣果何術以求之乎曰試作甲丁丙丁乙丁三對角線平分甲乙丙三角及丁角因平分三個四邊形為六個三邊形各兩相等次引乙丙至壬令丙壬與甲已等則乙壬線為甲乙丙三邊之半何則乙子者乙子乙巳之半丙子者丙子丙未之半丙壬者甲未甲巳之半然則乙壬者甲乙丙三邊之半矣次引長巳丁線至亥令己亥與乙壬等必相與為平行次作壬亥丙午兩線與子丁線等而相與為平行末作丙亥對角線則乙亥矩形與甲乙丙元形等何則乙巳丁子方形在元形之內丙子丁角形亦在元形之內丁午丙角形雖不全在元形之內然即丙未丁形而倒置之凑合丙子丁形而成子午矩形者也至於壬午矩形全在元形之外然亦即甲巳丁甲未丁兩形顛倒凑合而成者也然則乙亥矩形與甲乙丙元形等矣於是以句股相乘半之得甲乙丙元形即乙亥矩形以乙壬三邊之半分之得子丁為圓半徑或以三邉之全分元形之倍亦得圓之半徑或三邊之全分元形之四倍得全圓徑也又法曰句弦股三邊半之內減弦得圓之半徑或倍弦用減三邉之全得全圓徑論曰甲乙丙元形之乙角既是正角乙子丁乙已丁兩角又是正角即子丁己亦必正角然則子丁己乙形必是正角方形而四邊等矣即乙巳乙子兩邊必與丁己丁子圓之兩半徑等矣此乙已乙子之兩邊果何術以求之乎依前論乙壬線為三邊之半而丙壬即甲未也丙子即丙未也則子壬線即甲丙弦也於是子壬弦減乙壬三邊之半得乙子即圓之半徑若倍弦數用減三邊之全得全圓徑又法曰句股併以弦減之得全圓徑論曰如前圖乙丙句也丙壬與乙巳併即甲乙股也何則以丙壬與甲巳等故也壬子即甲丙弦也何則以丙壬與甲未等丙子與丙未等故也於是以子壬弦減壬己句股併得子巳為圓之全徑何則以乙子與子丁等乙巳又與乙子等故也巳上十七題除求方求圓二題