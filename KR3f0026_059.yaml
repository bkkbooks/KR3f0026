直角夫丁甲偕巳甲矩內形與甲庚線上方形等何則乙庚庚甲兩線上方形與乙甲線上方等而丁甲偕巳甲矩內形及乙已上方併亦與乙甲線上方等一論之圖可見此兩率者每減一相等之乙庚乙巳兩線上方則甲丁偕甲巳矩內形與甲庚線上方形必等三論曰丙甲線不貫圜心於乙庚甲線切圜周於庚乙庚甲直角形乙午甲亦直角形兩形合一乙甲弦則乙庚庚甲兩線上方併與乙午午甲兩線上方併必等又乙午子直角形則乙午午子兩線上方併與乙子線上方等夫午甲上方形中原有一論之圖可見丙甲偕子甲矩內形及午子上方形今於乙甲上方形中減乙庚上方形即減去同乙庚之乙子上方同乙子之乙午午子兩線上方然則所餘之丙甲偕子甲矩形與甲庚上方形必等四論曰前甲丁偕甲巳矩內形與庚甲上方等二論之圖甲丙偕甲子矩內形與庚甲上方亦等三論之圖則兩矩形自相等而等角㫄之各兩邊彼此互相視何則試引戊子壬己兩線相遇於丑而成甲丑形夫甲戊與甲丑兩形同在戊丑丙己兩平行線內等髙則兩形之比例若其底甲丙與甲己之比例依顯甲壬與甲丑兩形之比例亦若其底甲丁與甲子之比例夫甲戊與甲壬兩矩形元等則甲戊形與甲丑形即甲壬形與甲丑形也即甲丙與甲己之比例亦即甲丁與甲子之比例也更之則甲丙與甲丁之比例亦若甲己與甲子之比例於是以甲丙為一率甲丁為二率甲己為三率二三率相乘一率除之得四率甲子也既得甲子用減甲丙餘丙子半之于午得午㸃為弦上作垂線之處何則試作乙子線與乙丙同為圜之半徑即等而成乙丙子兩邊等角形則午點折丙子之半必是直角此法不但可施諸句股形凡鋭角鈍角形俱可用此法求垂線右既得乙午垂線即分甲乙丙原形為甲午乙乙午丙兩句股形此兩形者自相似亦與元形相似又六題句股弦形中求依弦一邊容方法曰先依又五題法求形中垂線次以弦與垂線相乘得數併弦與垂線為法除之得方邊論曰甲乙丙元形乙丁為垂線求依甲乙弦作方邊如子丑而成子午方形夫甲乙丙元形與己乙午分形相似何則以己午與甲丙平行故也次觀己午與未丁等即乙未與己午併是乙丁垂線也然則乙丁偕甲丙併而與甲丙若乙未偕己午併即乙丁垂線而與己午又法曰垂線自乘併弦與垂線為法除之得數用減垂線得方邊論曰乙丁偕甲丙併一率而與乙丁二率若乙未偕己午併三率即乙丁而與乙未四率於是以乙未減乙丁餘未丁即方邊此法不但可施諸句股形凡鋭角鈍角形俱可用又七題句股形中求分作兩邊等三角形二法曰弦半之即是兩邊等之一邊論曰甲乙丙形半弦於丁於是以丁為心甲丙為界作圜必切乙角得乙丁與半弦等因成乙甲丁乙丙丁兩形皆兩邊等三角形也又八題斜三角形中求作中垂線分元形為兩句股形法具又五題又九題斜三角形中求積先分别是鋭角形或是鈍角形若是正角形法以句股相乘半之即得法曰大中小三邊用小中兩邊依句股求弦法求之若求得數小於大邊即是鋭角形大則是鈍角形鋭角形求積法曰任取一角依又五題求中垂線鋭角形求中垂線任取一角皆在形內分元形為兩句股形次以兩分形句與股各相乘半之得積論曰甲乙丙鋭角形先求得乙丁中垂線分為甲丁乙乙丁丙兩句股形次以甲丁與丁乙丁乙與丁丙各相乘得丁戊與丁己兩矩形各半之得甲乙丙形之積或以乙丁因甲丙之半亦得或以甲丙因乙丁之半亦得鈍角形求積法於鈍角至對邊作垂線則垂線在形內法同前於鋭角至對邊作垂線則垂線在形外而引對邊出形外凑之曰大邊上方內減中小兩邊上方餘半之以中邊除之得引凑數與小邊為股弦求句得垂線或以小邉除半數得引凑數與中邉為句弦求股亦得垂線既得垂線則與引凑數凑成一小句股形又以垂線與引凑數偕元形之邊凑成一大句股形大小兩句股形相減得所求論曰甲乙丙鈍角形乙為鈍角求從丙鋭角作丙丁垂線而引乙丁線以凑之從甲角作垂線亦在形外兹不備述夫甲丙上方元包丙丁與甲丁兩邊上方今於甲丙上大方中減乙甲乙丙上兩方即是減丙庚與子午兩方為乙丙上方減甲子方為甲乙上方也而所存者為丁子子辛兩矩形矣半之為子丁一矩形以中邊乙子除之得乙丁為引數也丙丁乙為小句股形丙丁甲為大句股形兩形相減得甲乙丙斜三角形積又法曰三邊數併而半之以每邊數各減之得三較數三較連乘任以二較相乘得數又以一較乘之得數又以半數乘之得數開方得積如後圖甲乙丙元形求其積一圖一論曰壬乙矩形與元形等論同前十七題所論乙亥矩形與甲乙丙元形等二論曰丁心方與乙戊相乘又與乙戊相乘開方與乙二圖壬矩形等如圖子壬二丑壬三相乘得六為子丑矩形今以子壬二自乘得四為子卯方即壬寅邊以丑壬三乘之得十二為丑寅矩形又以三乘之得三十六為辰寅矩形即午丑方形故開方得辰午六與子丑三圖矩形等三論曰丁心偕戊庚矩形與乙丁相乘其所得數與丁心方偕乙戊相乘所得數等何則乙丁心形與乙戊庚形相似之形也戊庚與丁心若乙戊與乙丁則戊庚偕丁心矩形即庚未矩形與丁心方即己戊方形亦若乙戊與乙丁也四論曰丙丁偕丙戊矩形與丁心偕戊庚矩形等就一圖觀之何則心丁丙形與丙戊庚形相似之形也夫庚乙線平分丁乙甲角庚戊為丙戊之垂線則戊為直角次依丙戊線截取丙卯線作卯庚線為丙卯之垂線則卯為直角此庚乙庚戊庚卯三線必相交於庚㸃三線既相交於庚點則丙庚線必平分卯丙戊角而卯丙戊角又即己心丁角因得心丁丙形與丙戊庚形為相似之形也兩形既相似則丁心與丁丙若丙戊與戊庚也解庚乙庚卯庚戊三線必相交於庚點所以然之故庚心乙界作圈次依甲乙丙形作丙丁辛形次引乙丁線至癸引辛甲線至壬乙庚線平分丙乙甲角則庚㸃必是圈心戊㸃折乙癸線之半則戊㸃必直角卯㸃折壬辛線之半則卯㸃必直角乙癸與乙己等乙丙辛丙為大邊甲丙丁丙為中邊甲壬丁癸即小邊總論曰二論丁心方與乙戊相乘又與乙戊相乘所得數開方與乙壬矩形等夫乙戊半數也亦既得之矣次欲求丁心與乙戊相乘而丁心不可得三論丁心戊庚矩形與乙丁相乘所得數與丁心方偕乙戊相乘所得數等夫乙丁三較之一也則又得之矣次欲求丁心與戊庚兩線而兩線又不可得四論丁丙偕丙戊矩形與丁心偕戊庚矩形等夫丁丙丙戊三較之二也則盡得之矣今法於四論用丁丙偕丙戊二較相乘於三論用乙丁一較乘之於二論用乙戊半數乘之開方得數與乙壬矩形等又十題斜三角形中求容圓法曰先依又九題求積次取三邊數併而半之用除積得員之半徑或置二較連乘數以半數除之得開方亦得圓半徑論曰先依又九題求得乙壬矩形為甲乙丙元形積次以乙戊除之即三邊數之半也得丁心即圓之半徑若以三邊之全除元形之倍亦得圓半徑若以三邊之全除元形之四倍得圓全徑又十一題斜三角形中求容方法同又六題又十二題斜三角形有三和數求三邊法曰三和數相減得三較數各置三較數各以非所較之邊加減之各半之其加而半者得大邊或中邊減而半者得小邊或中邊如圖戊己庚為三和數戊為大中兩和數己為大小兩和數庚為小中兩和數甲為戊庚兩和之較乙為己庚兩和之較丙為戊己兩和之較於是置甲較數以己為非所較之邊加而半之得大邊減而半之得小邊置乙較數以戊為非所較之邊加而半之得大邊減而半之得中邊置丙較數以庚為非所較之邊加而半之得中邊減而半之得小邊論曰戊者大中兩和數也加減用乙者乙為己庚兩和之較庚者小中兩和數己者大小兩和數此兩和數中皆有相等之小數而餘為大中兩數矣此乙所以為大中兩數之較也餘倣此又十三題句股測髙測逺測廣測深同法法曰先准地平地平者必令所測地面自所測之處至髙之根如水之平也次立表與地平為垂線退後立望竿令所測髙表尖竿頭參相直末自竿至髙根量得若干逺然後以表竿差與逺相乘而以表竿相去若干除之加竿長若干得所求之髙如圖丙乙髙乙甲逺丁甲竿己戊表己子為表竿差戊甲為表竿相去夫丁子己形與丁辛丙形相似故丁子與己子若丁辛與丙辛也又十四題句股重測髙逺測廣測深同法法曰若無髙根之可量者則用重測法謂一次立表竿令表竿與髙參相直二次立表竿令表竿與髙參相直兩表兩竿要各相等又要或前或後立成一直線然後以表竿之較乘兩表相去而以兩表竿相去之較除之加表髙若干得所求之髙又以前表竿相去乘兩表相去而以兩表竿相去之較除之加前表竿相去得所求之逺如圖甲乙髙乙丙逺各不知數用重表測之丁子為前表己丙為望竿子丙為表竿相去甲丁己三㸃參相直午壬為後表丑辛為望竿壬辛為表竿相去甲午丑三㸃參相直丁亥為表竿之較子壬為兩表相去未辛為兩表竿相去之較己上用以測髙借丁卯元是表竿相去為表竿相差借卯己元是表竿相差為表竿相去辰戊亦借為表竿相差戊癸亦借為表竿相去甲辰癸三㸃亦參相直丁辰亦借為兩表相去與丁午等即庚癸亦為兩表竿相去之較與辛未等以上用以測逺解庚癸線與辛未線必等所以然之故如圖甲乙矩內形甲乙為對角線丙丁及戊己兩線與矩形之邊為平行而交角線於庚次任作辛壬線亦交角線於庚次截甲癸線與甲辛線等作癸子線亦交角線於庚則子乙線與壬乙線必等論曰試作午丑及午未兩線與甲辛及甲癸相線為平行夫庚甲辛及庚午丑兩角形相似之形也則庚甲與庚午若甲辛與午丑依顯庚甲與庚午若甲癸與午未然則甲辛與甲癸亦若午丑與午未夫午丑與午未如是則子乙與乙壬亦如是矣先論甲乙矩形此形甲己為對角線寅卯申亥兩線交於角線上之丁㸃則卯申矩形與亥寅矩形等次論甲丑矩形此形甲丑為對角線寅酉房壬兩線交於角線之午點則房酉矩形與寅心矩形等末總論曰夫房酉矩形與寅心矩形既等而午井形又與卯申形等即亦與亥寅形等然則房酉矩形中所餘之井酉形與寅心矩形中所餘之丁心形必等於是以丁亥表竿相差乘丁午兩表相去得丁心矩形即井酉形而以井女兩表竿相去之較除之得女酉加酉辛表共女辛即甲乙髙先論甲己矩形同前次論甲癸矩形此形甲癸為對角線申氐戊亢兩線交於角線之辰㸃則亢氐矩形與戊申矩形等末總論曰夫亢氐矩形與戊申矩形既等而辰牛形又與亥寅形等即亦與卯申形等然則亢氐矩形中所餘之牛氐形與戊申矩形中所餘之丁戊形必等於是以丁卯表竿相差乘丁辰兩表相去得丁戊矩形即牛氐形而以牛危兩表竿相去之較除之得危氐加氐癸表竿差共危癸即乙丙逺也求髙又法既得危氐線即以亢牛乘之得牛辰形此形即寅亥矩形亦即申卯矩形也故以丁卯除之得丁申髙求逺又法既得女酉線即以房井乘之得井午矩形此形即申卯矩形亦即寅亥矩形也故以丁亥除之得丁寅逺歷算全書卷四十六
