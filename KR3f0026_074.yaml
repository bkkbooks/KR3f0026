氐直形因平視而得正形其壁卯棱綫則成壁氐而斜界於對角分直方形為兩句股形矣又其分截之三方直形亦以平視得正形亦各以棱綫分為兩句股而大小相疉成相似之形而比例等矣如圖亢氐室壁長方以壁氐綫成兩句股而張井辛丙長方即張氐辛丙亦以丙卯綫即丙井亦即丙氐成兩句股並形相似則亢壁與張丙若亢氐與張井張井即張氐又癸己亥斗長方即癸氐亥斗以斗卯綫即斗己又即斗氐成兩句股而房庚甲子長方即房氐甲子亦以子卯綫即子庚又即子氐成兩句股而形相似則癸斗與房子若癸己與房庚癸己與房庚即癸氐與房氐展形展之成四句股面一方直底合形合之則成句股方錐作方直儀法即句股立方錐法以堅楮依黄赤大距二十三度半畫成立面再任設赤道距至度畫成平面再依法畫距緯斜立面及黄道距至度斜平面并方直底然後依棱摺輳即渾員上各綫相為比例之故了然共見任指黄道或赤道之距至一弧為式即各弧可知其所用距至弧或在至前或在至後或冬至或夏至並同一理方塹堵内容員塹堵法先解方塹堵塹堵以正方為底氐卯丁乙形其上有赤道象限氐乾乙弧乙春分氐夏至以長方為斜面亢卯戊乙形其上有黄道象限癸巽乙弧乙春分巽夏至底與而一邉相連卯乙邉為底與斜面所同用故相連乃黄赤道之半徑一邉相離氐丁邉在底與赤道平行亢戊邉在斜面故相離其距為亢氐為戊丁皆大距度癸氐弧之切線其形似斧從斜面作戊卯對角線切至底戊丁卯對角線于底分塹堵為兩則赤道為兩平分赤道平分于乾乾乙距春分乾氐距夏至各得四十五度而黄道為不平分黄道分於巽則巽乙距春分四十七度二十强九分弱而巽癸距夏至四十二度三十一分於是黄道切線戊乙與大距度割線亢卯等而方塹堵之形以成亢卯為大距二十三度三十一分半之割線其數一九六五戊乙為黄道四十七度二十九分之切線其數亦一九六五兩數既同故能作長方斜面而成塹堵乃黄道求赤道用兩切線之所賴也若赤道求黄道則反用其率法曰自黄道四十七度二十九分以前用正切是立面句股比例戊丁乙句股比例即亢氐卯或用癸巳卯皆大句股也其酉未乙則為小句股右黄道求赤道為以弦求句一赤道半徑氐卯大句二大距割線亢卯大弦三赤道切線未乙甲乙赤道小句四黄道切線酉乙丙乙黄道小弦右赤道轉求黄道為以句求弦自黄道四十七度二十九分以後用餘切是斜平面句股比例斜面亢虚卯為大句股癸斗卯為小句股在平面則為氐危卯大句股己心卯小句股一黄道半徑癸卯小股二大距割線亢卯大股三黄道餘切癸斗小句牛乙黄道其餘弧牛癸四赤道餘切亢虚大句女乙赤道其餘弧女氐右黄道求赤道為以股求句一赤道半徑氐卯大股二大距餘弦己卯小股三赤道餘切危氐即亢虚大句女氐即女乙赤道之餘四黄道餘切心己即癸斗小句牛癸即牛乙黄道之餘右以赤道轉求黄道亦為以股求句論曰赤道求黄道用句股于赤道平面即郭太史員容方直之理但郭法起二至則此所謂餘弧乃郭法之正弧又郭法只用正弦而此用切線為差别耳又論曰正切線法亦可用于半象限以上餘切線亦可用于半象限以下此因方塹堵之底正方則所用切線至方角而止故各用其所宜云半象限者主赤道而言若黄道以四十七度二十九分為斷一平一斜故其比例如弦與句又論曰正切線法即句股錐形也餘切線法即句股方錐也以對角斜線分塹堵為兩成此二種錐形遂兼兩法次解員塹堵方塹堵内容割渾員之分體以癸牛丙乙黄道為其斜面之界以氐女甲乙赤道為其底之界而以癸氐大距弧及牛女丙甲等逐度距弧為其髙髙之勢曲抱如渾員之分斜面平面皆為平員四之一其髙自癸氐大距漸殺至春分乙角而合為一㸃員塹堵者雖亦在方塹堵之内然又在所容割渾員分體之外與割渾員體同底亦以赤道為界而不同面其面自乙春分過子過奎至亢其形卯乙短而亢卯長如割平撱員面四之一其撱員邉之距心皆以逐度距緯如丙甲牛女等之割線所至為其界如卯子為丙甲距弧割線卯奎為牛女距弧割線之類而以逐度距緯之切線為其髙如子甲為丙甲距弧切線奎女為牛女距弧切線之類法以赤道為圍作員柱置渾員在員柱之内對赤道横剖之則所剖員柱之平員底即赤道平面也又自夏至依大距二十三度三十分半之切線為髙斜對春秋分剖至心則黄道半周在所剖之斜面矣然黄道半周雖在所剖斜面而黄道自為半平員所剖斜面則為半撱員黄道平員在撱員内兩端同而中廣異兩端是二分如乙為平撱同用之㸃中廣是夏至如黄道癸在撱面亢之内其距為癸亢此員塹堵之全體也於是又從亢癸對卯心直剖到底則成員塹堵之半體即方塹堵所容也此員塹堵斜面之髙俱為其所當距緯弧之切線渾員上弧三角法以距緯切線與赤道平面之正弦相連為句股而生比例是此形體中所具之理此塹堵體與前圖同惟多一亢奎子乙撱弧以此為撱員界立剖至底令各度俱至赤道而去其外方則成員塹堵真體此員塹堵為用子甲丑句股形之所頼子甲為距弧切線甲丑為赤道正弦也又子甲如股甲丑如句法為子甲與甲丑若亢氐與氐卯前圖為從心眎邉此為從邉眎心盖因欲顯圓塹堵内方直形故為右觀之象與前圖一理惟多一己庚辛乙撱弧前圖亢奎子乙撱弧在黄道斜面此圖己庚辛乙撱弧在赤道平面員塹堵有二若自斜面之黄道象限各度直剖至赤道平面亦成員塹堵象限然又在剖渾員體分之内其體以斜面為正象限但斜立耳其底在赤道者轉成撱員此撱員形在赤道象限之内惟乙點相連此即簡平儀之理其撱之法則以卯乙半徑為大徑癸氐距弧之餘弦卯巳為小徑小徑當二至大徑當二分與前法正相反然其比例等何也割線與全數若全數與餘弦也此員塹堵以撱形為底象限為斜面以距度逐度之正弦為其髙乃黄道距緯相求用兩正弦之所頼也此員塹堵内又容小方塹堵乃郭太史所用員容方直也渾員因斜剖作角而生比例成方員塹堵形其角自度一分以至九十度凡五千四百則方員塹堵亦五千四百矣乙角以春分為例則其度二十三度半强其實自一分至九十度並得為乙角合計之則五千四百每一塹堵依度對心剖之成立句股錐及方句股錐之眠體自度一分至大距止亦五千四百以五千四百自乗凡二千九百一十六萬而渾員之體之勢乃盡得其比例烏呼至矣每度分有方塹堵方塹堵内函赤道所生撱體赤道撱體内又函黄道所生撱體黄道撱體内又函小方塹堵每度分有此四者則一象限内為五千四百者四共二萬一千六百以乙角五四乗之則一一六六四每度有正有餘對心斜分則正度成句股錐餘度成方底句股錐之眠體一象限凡四萬三千二百以五四乘之則二三三二八員容方直簡法序古未有預立算數以盡句股之變者有之自西洋八綫表始古未有作為儀器以寫渾員内句股之形者自愚所撰立三角始立三角之儀分之曰句股錐形曰句股方錐形合之則成塹堵形其稱名也小其取類也大徑寸之物以狀渾員而弧三角之理如指諸掌即古法之通於弧三角者亦如指諸掌矣雖然猶無解於古法之不用割切也故復作此簡法以互徵之而授時厯三圖附焉盖理得數而彰數得圖而顯圖得器而真草野無諸儀象藉兹以自釋其疑不敢自私故以公之同好云爾句股錐形是以西法通國法句鈠方錐形是以郭法通西法今此簡法是専解郭法而兩法相同之故自具其中員容方直儀簡法即句股方錐之方直儀而不用割切線祗以各弧正弦矢度相求其用己足亦不須用角立面中有句股形二其一大句股形癸巳乙以黄道半徑癸乙為弦大距度正弦癸巳為股大距度餘弦巳乙為句其一小句股形壬戊乙以黄道餘弦壬乙為弦距緯正弦壬戊為股楞線戊乙為句平面中亦有句股形二其一小句股形庚戊乙以距緯丙甲之餘弦庚乙為弦以黄道正弦戊庚為股楞綫戊乙為句其一大句股形甲辛乙以赤道半徑甲乙為弦以赤道正弦甲辛為股赤道餘弦辛乙為句戊乙線于弧度無取然平立二形並得此補成句股謂之楞線黄道正弦本在斜平面而能移于平面者有相望兩立線丙庚壬戊為之限也距度正弦本在斜立面而能移於立面者有上下兩横線丙壬庚戊為之限也此四線兩立兩横相得成長方其立如堵故又曰弧容直濶也有大距有黄道而求距緯更之可求大距反之可求黄道一半徑癸乙一黄道餘弦一大距正弦二大距正弦癸己二距緯正弦二半徑三黄道餘弦壬乙三半徑三距緯正弦四距緯正弦壬戊四大距正弦四黄道餘弦有赤道有距緯而求黄道更之可求赤道反之可求距緯一半徑甲乙一距緯餘弦一赤道正弦二赤道正弦甲辛二黄道正弦二半徑三距緯餘弦庚乙三半徑三黄道正弦四黄道正弦庚戊四赤道正弦四距緯餘弦郭太史本法弧矢割員圖見授時厯草下並同凡渾員中割成平員任割平員之一分成弧矢形皆有弧背有弧弦有矢割弧背之形而半之則有半弧背有半弧弦有矢因弧矢生句股形以半弧弦為句即正弦矢減半徑之餘為股即餘弦半徑則常為弦句股内又成小句股則有小句小股小弦而大小可以互求或立或平可以互用平視側視二圖皆從此出側視之圖横者為赤道赤道一規因旁視如一直線黄道同斜者為黄道因二至黄赤之距成大句股即外圈因各度黄赤之距成小句股平視之圖外大員為赤道内撱者黄道從兩極平視則黄道在赤道内而成撱形有赤道各度即各其有半弧弦以生大句股又各有其相當之黄道半弧弦以生小句股此二者皆可互求授時厯求黄赤内外度及黄赤道差法置黄道矢本法用帶從三乗方求各度矢去減周天半徑即立面黄道半徑餘為黄赤道小弦即黄道餘弦也半徑為大弦故此為小弦置黄赤道小弦以二至内外半弧弦即二至大距度正弦當時實測為二十三度九十分乘之為實黄赤大弦即周天半徑以其為立面大句股之弦故稱大弦為法除之得黄赤道内外半弧弦即各度黄赤距度正弦也原法以矢度度半背弦差加入半弧弦得内外半弧背今省又置黄赤道小弦以黄赤道大股即二至内外度餘弦也在立面大句股形為大股乗之為實黄赤道大弦為法除之解見前得黄赤道小股即立面平面兩小句股同用之楞線在立面與大股相比故稱小股置黄道半弧弦即黄道正弦也原法以黄道矢求半背弦差減黄道度得之自乗為股冪黄赤小股自乗為句冪即楞綫也先在立面為小句股形之股今又為平面句股形之句故其冪稱句冪兩冪並之為實開平方法除之為赤道小弦即各度黄赤距度餘弦也周天半徑為平面上大句股之弦故稱大弦則此為小句股弦當稱小弦置黄道半弧弦以周天半徑乗之為實赤道小弦為法除之得赤道半弧弦即赤道正弦也原法求半背弦差以加半弧弦得赤道今省論曰弧矢割員者平員法也以測渾員則有四用一曰立弧矢勢如張弓以量黄赤道二至内外度即側立圖也一曰平弧矢形如伏弩以量赤道即平視圖也一曰斜弧矢與平弧矢同法而平面邉髙邉下其庋起處如二至内外之度以量黄道即平視圖中小句股也一曰斜立弧矢與立弧矢同法而其立稍偏以量黄赤道各度之内外度即側立圖中小句股也自離二至一度起至近二分一度止一象限中逐度皆有之但皆小於二至之距邢臺郭太史弧矢平立三圖中具此四法即弧三角之理無不可通言簡而意盡包舉無窮好古者所當珤愛而翫也又論曰割員之算始于魏劉徽至劉宋祖冲之父子尤精其術唐宋以算學設科古書猶未盡亡邢臺葢有所本厥後授時厯承用三百餘年未加修改測箕之講求益稀學士大夫既視為不急之務而臺官株守成法鮮諳厥故驟見西術羣相駭詫而不知舊法中理本相同也疇人子弟多不能自讀其書又忌人之讀而各私其本久之而書亦不可問矣攷元史厯成之後所進之書凡百有餘卷郭守敬傳有修改源流及測騐等書齊履謙傳有經串演撰諸書明厯法之所以然今其存軼並不可攷良可浩嘆然天下之人豈無有能藏弆遺文以待後學者庶幾出以相證予於斯圖之義類多通而深有望於同志矣問元初有回回厯法與今西法大同小異邢臺葢㑹通其説而為之故其法相通若是與曰九章句股作於𨽻首為測量之根本三代以上學有専家大司徒以三物教民而數居六藝之一秦火以後吾中土失之而彼反存之至於流逺𣲖分遂以各名其學而不知其本之同也况東西共戴一天即同此句股測員之法當其心思所極與理相符雖在數萬里不容不合亦其必然者矣攷元初有西域人進萬年厯未經試用迨明洪武年間始命詞臣吴伯宗西域大師馬沙亦黒等譯回回厯書三卷然亦粗具筭法立成並不言立法之原究竟不知其所用何法或即今三角八綫或更有他法俱無可攷雖其子孫莫能言之攷元史所載西域人晷影堂諸製與郭法所用簡儀髙表諸器無一同者或測量之理觸類増智容當有之然未見其有㑹通之處也徐文定公言回回厯緯度凌犯稍為詳宻然無片言隻字言其立法之故使後来入室無因更張無術盖以此也又據厯書言新法之善係近數十年中所造則亦非元初之西法矣而與郭圖之理反有相通豈非論其傳各有本末而精求其理本無異同耶且郭法用員容方直起算冬至西法用三角起算春分郭用三乗方以先得矢西用八綫故先得弦又西専用角而郭只用弧西兼用割切而郭只用弦種種各别而不害其同有所以同者在耳且夫數者所以合理也厯者所以順天也法有可采何論東西理所當明何分新舊在善學者知其所以異又知其所以同去中西之見以平心觀理則弧三角之詳明郭圖之簡括皆足以資探索而啓深思務集衆長以觀其㑹通毋拘名相而取其精粹其於古聖人創法流傳之意庶幾無負而羲和之學無難再見於今日矣角即弧解問古法只用弧而西法用角有以異乎曰角之度在弧故用角實用弧也何以明其然也假如辰庚己三角形有庚鈍角有己庚辰庚二邉欲求諸數依垂弧法于不知之辰角打線線先補求辰辛及辛庚成辰辛庚三角虚形此必用庚角以求之而庚角之度為丙丁是用庚角者實用丙丁也其法庚丙九十度之正弦即半徑與丙丁弧之正弧即庚角正弦若庚辰正弦與辰辛正弦是以大句股之例例小句股也又丙丁弧之割線即庚角割線與庚丁九十度之正弦亦即半徑凡角度所當弧其兩邊並九十度若庚辰之切線與庚辛之切線亦是以大句股之例例小句股也既補成辰辛巳三角形可求巳角而巳角之度為乙甲是求巳角者實求乙甲也其法辛己弧之正弦與辰辛弧之切線若己甲象弧之正弦即半徑與乙甲弧之切線即己角切線是以小句股例大句股也又如己辰庚形庚為鋭角當自不知之辰角打線分為二形以求諸數其一辰辛庚分形先用庚角而庚角之度為丙丁用庚角實用丙丁也法為丙庚象弧之正弦即半徑于丙丁弧之正弦即庚角正弦若辰庚之正弦與辰辛之正弦又丙庚象弧之正弧即半徑與丙丁弧之餘弦即庚角餘弦若辰庚之切線與辛庚之切線是以大句股例小句股也其一辰辛己分形以庚辛減己庚得己辛有辰辛己辛二邉可求己角而己角之度為乙甲求己角實求乙甲也法為己辛之正弦與辰辛之切線若己甲象􅋃之正弦即半徑與乙甲弧之切線即己角切線是以小句股例大句股也一系用角求弧是以大句股比例比小句股用弧求角是以小句股比例比大句股厯算全書卷六十
