body:
  text: 厯算全書卷六十宣城梅文鼎撰壍堵測量二總論塹堵測量者句股法也以西術言之則立三角法也古九章以立方斜剖成塹堵其兩端皆句股再剖之則成錐體而四面皆句股矣任以錐體之一面平寘為底則其鋭上指環而視之皆成立面之句股而各有三角三邊故謂之立三角也立三角之法以測體積方圓斜側靡所不通其測渾圓之弧度則有二理其一用視法如弧三角所詮用三角三弧之正弦切線移於平面謂渾圓立剖之平面即成三層句股相似之比例今謂之渾圓容立三角也其一不用視法而用實數如句股錐形等法用三弧三角之割線餘弦各於其平面自成相似之句股以為比例三弧直剖至渾圓之心即各成句股形之面今謂之塹堵測量也渾圓内容之立三角亦塹堵之分形而塹堵測量所測亦渾圓之度因書匪一時所為而意各有屬其名遂别二而一一而二者也以上通論立三角及塹堵測量命名之意并其同異之處因立三角有塹堵之名因渾圓内三層句股生塹堵之用故存此二者以為塹堵測量基本凡數之可算者皆可作圖以明之故渾圓可變為平圓如古者葢天之圖是也數之可算可圖者皆可製器以象之故渾圓可剖為錐體塹堵測量之儀器是也凡測算之器至今日大備且益精益簡古者渾儀經緯相結為儀三重至郭太史之簡儀立運儀則一環而已足今則更省之為象限儀是益簡益精之效也至於渾象無與於測而有資於算所以證理也西法之簡平渾葢以平寫渾亦可謂工巧之至獨未有器以證八線夫用句股以算渾圓其法莫便於八線然八線之在平圓者可以圖明在渾圓者難以筆顯鼎葢嘗深思其故而見渾圓中諸線犁然有合於古人塹堵之法乃以堅楮肖之為徑寸之儀而三弧三角各線所成之句股了了分明省筆舌之煩以象相告於作圓布算不無小補而又非若渾象之難成因名之曰塹堵測量從其質也塹堵形析渾象之一體亦如象限儀割渾儀之一隅環而測之則象限即渾儀之全周也周徧析之則塹堵即渾象之全體也是故塹堵形可析為兩可合為一其析者一為句股錐亦曰立三角儀則起二分訖二至一為句股方錐亦曰方直儀則起二至訖二分起二分者西率起二至者古率也是兩者九十度中皆可為之自分訖至九十度並可為句股錐自至訖分九十度並可為句股方錐然至半象以上割切三線太長溢出於方塹堵之外故又有互用之法也其合者近分度用句股錐近至度用句股方錐以黄道四十七度赤道四十五度為限過此者互用其餘如是則兩錐形合之成方塹堵矣方塹堵内又成圓塹堵二其一下為赤道圓象限而一為撱形之象限距度之割切二線所成也其一下為撱形象限而上為黄道之圓象限距度正弦黄道半徑所成也兩圓塹堵之用已括於兩錐形内兩圓塹堵内又以黄道正弦距度正弦成小方塹堵之象則郭太史圓容方直本法也於是又有圓容方直儀簡法而立三角之儀遂有三式一句股錐其形四鋭一方直儀其底長方一圓容方直簡法儀其底為渾圓幂之分之三者或兼用割切或專用正弦而並不用角合渾圓内三層句股觀之可以明立法之根以上論塹堵測量儀器句股錐形及句股方錐形二種為塹堵測量正用而圓容方直形專用正弦成小塹堵尤正用中之正用也此小塹堵在兩重圓塹堵内故兼論之又此小塹堵足闡授時弧矢之祕因遂以郭法附焉問八線生於角用八線而不用角何也曰角與弧相應故用角即用弧也用弧即用角也明於斯理而後可以用角渾圓内三層句股是也明於斯理而後可以不用角塹堵三儀是也用角者西法也而用角即用弧則通於古法也不用角者古法也而用弧即用角則通於西法也于是而古法西法可以觀其㑹通息其煩喙矣以上論角即弧解之理立三角法序立三角者量體之法也西學以幾何原本言度數而所譯六卷之書止於測面其測體法則未之及葢難之也余嘗以句股法釋幾何而稍為推廣其用謂之幾何補編亦曰立三角法本為體積而設然其中義類頗有與渾圓弧度之法相通者故摘録之以明塹堵測量之理立三角法摘録總論一立三角為有法之形立三角之面皆平三角也平三角不拘斜正皆為有法之形故立三角亦不拘斜正而皆為有法之形一立三角為量體之宻率凡量體者必析之析之成立三角形則可以知其容積可得而量矣若不可以立三角析者則為無法之形不可以量一立三角即錐體立三角任以一面平安如底則餘三面皆斜立亦有一面正立者而鋭必在上即成三角立錐一各種錐體皆立三角之合形凡錐體必上尖下濶任取其一面觀之皆斜立之平三角也凡錐形自其尖切至底則其中剖之立面亦平三角也錐體之底或四邊五邊以至多邊若以對角綫分其底又即皆成平三角也故四稜錐可分為兩五稜錐可分為三六稜以上無不可分分之皆立三角形故知一切錐體皆立三角之合形也底之邊多至于三百六十又析之為分為秒以此為底皆可成錐體再析之至于無數即成平員底可作員錐要之皆小平三角面無數以成之者也一各種有法之形亦皆立三角之合形如立方體依其稜剖至心成立分體皆扁方錐其斜面輳心皆成立三角長方體亦然四等面體從其稜剖至心成四分體八等面則成八分體二十等面成二十分體皆立三角錐十二等面依稜剖至心成十二分體皆五稜錐其立面五皆立三角渾員形以渾員面冪為底半徑為髙作大員錐而成渾積凖前論皆無數立三角所成然則渾員亦立三角也渾員既為立三角所成則半之而為半渾員一平員面一半渾員面如員𤓰中剖或再分之而為一象限或更小於象限之渾員細分弧面自象限以内至于一度内若干分秒如剖橘瓤並一弧面兩半平員面以渾員之理通之皆立三角所成一無法之形有面有稜即皆為立三角所成凖前論各依其楞線割之至底或依對角線斜剖之即皆成立三角而無法之形皆可為有法之形一立三角體之形不一而皆有三角三邊非四面不能成體故立三角必四面非三角三邊不能成面故立三角體之面皆三角三邊約舉其類有四面相等者即四等面形也其面冪等其稜之長短亦等有三面相等而一面不等者其不等之一面必三邊俱等餘三稜則自相等以上皆形也四等面任以一面為底其雉尖正立居中三等面形以等邊之一面為底錐尖亦正立居中有二面兩兩相等者有二面相等餘二面不等者有四面各不相等者有三面非句股而一面成句股者有兩面成句股者其句股或等或否有四面並句股者句股立錐也以上不皆正形而皆為有法之形一立三角形有實體有虛體實者如臺如墖如堤虛者如井如池又如隔水測物皆自其物之平面角作直線至人目即成虛立錐體以人目為其頂鋭而所測平面則其底也所作直線皆為其稜若所測平面為四邊五邊以上皆可作對角線分為立三角錐形虛體實體並同一法立三角又有三平面一弧面者如自地心作三直線至星宿所居之度則此三星之相距皆弧度也三弧度為邊即成弧三角形以為之底其三直綫皆大員半徑以為之稜而合于地心以為之頂鋭亦立三角之虛形即弧三角錐體若于渾球體作三大圏相交成弧三角形從三角作直線至員心依此析之即成實體與上法並同一理一立三角形有立有眠有倒有倚立者以底平安則其鋭尖上指如人之立眠者以底側立如堵牆而錐形反横如人之眠此惟正形之錐則有之既定一面為底則底在下者為立在旁者為眠如虛形則不拘正斜皆以所測為底又如弧三角錐以渾員面上所成之弧三角為底以三直線輳于渾體之心為其頂鋭則四面八方皆可為底而鋭常在心不特能眠能立亦且能倒能欹亦惟有底有鋭之正形則然若他形底無定名隨人所置眠體倒體以及他形之欹側不同而皆為有法之形者三角故也一古法有壍堵陽馬鱉臑芻甍等法皆可以立三角處之壍堵一作塹堵凡立方體從其面之一稜依對角斜線剖至其底相對之一稜則其積平分而成壍堵形甲乙為頂有袤無廣丙丁戊己為方底或長方則丙丁同巳戊為袤丁己仝丙戊為廣乙丙同甲丁為其髙甲丁乙丙為立面甲乙戊己為斜面皆長方乙丙戊同甲丁巳為兩端立面皆句股形而相對相等壍堵形有如屋者甲乙頂袤如屋脊甲乙丙丁及甲乙戊巳兩長方皆斜面而相等丙丁戊己為底乙丙戊與甲巳丁兩圭形相對而等而以乙辛為其髙其辛丙及辛戊俱平分而等又或甲乙頂袤不居正中而近一邊然甲乙與丁丙及巳戊俱平行而等其甲丁乙丙及甲巳乙戊兩斜面雖有大小而並為長方形乙辛垂線不能分丙辛及辛戊為平分而必與丙戊底為十字正角則乙辛為正髙以上三者皆壍堵之正形並以髙乘底折半見積何也皆立方之半體其兩端皆立三角形也第一形兩端為句股第二第三皆以乙辛中剖成兩句股凡壍堵形亦可立可眠立者以甲乙為頂長丙丁戊己為底眠者以戊己為頂長反以甲乙丙丁為底如隔水測懸崖之類又有斜壍堵形其各綫不必平行底不必正方但俱直線則底與兩斜面皆可作對角綫以分為三角形而諸數可測實體虛體並有之于測量之用尤多斜壍堵本為無法之形而亦能為有法之形者可析之成三角也凡壍堵形從頂上一角依對角線斜剖之為兩則成一立方錐一句股錐塹堵形從乙角作乙巳乙丁两對角線依線剖之則成两形立方錐一句股錐一名陽馬名鱉臑陽馬形以丙丁戊己方形為底以乙為頂鋭而偏居一角故乙丙直立如垂線以為之髙其四立面皆成句股形故又名句股立方錐論曰陽馬形從壍堵第一正形而分故其髙線直立于一隅乃立方之楞線四面句股形因此而成是為句股方錐之正體若斜壍堵等形之分形則但可為斜立方錐而不得為句股方錐亦非陽馬斜立方錐者其頂不居正中然又不能正立一隅故非句股立錐而但為斜立方錐如上二形頂既偏側底亦非方亦斜立錐形也然其立面皆三角故亦為有法之形斜立方錐亦可立可眠皆可以立三角法御之但不如句股立方錐之有一定比例鱉臑形以甲乙為上袤而無廣以丁巳為下廣而無袤故稱鱉臑象形也其各面或句股或不為句股而皆三角故又名三角錐句股立錐形其上有袤而無廣下有廣而無袤並同鱉臑所異者甲角正方故乙甲丁立面乙甲巳斜面並成句股又丁角正方故甲丁已平面乙丁巳斜面並成句股又丁角正方故甲丁巳平面乙丁巳斜面並成句股是四面皆句股也故謂之句股方錐而不得僅名鱉臑論曰鱉臑中有句股立錐猶斜立方錐中之有句股方雉也立三角皆有法之形而此二者尤可以明測量比例之理又論曰立三角所以為有法形者謂其可施八線也而八線原為句股之比例此二者既通體皆句股所成故在有法形中尤為有法矣又論曰若于句股方錐再剖之即又成二句股錐而皆等積故陽馬為立方三之一句股錐則為六之一皆立方之分體也又論曰句股方錐及句股錐皆生于塹堵故塹堵形為測量之綱要芻薨形亦如屋而兩端漸殺故頂窄而底寛其丙丁戊己底或正方或長方甲乙頂小于丙丁或居正中或稍偏然皆與丙丁及戊己平行芻甍葢取草屋之象乃壍堵形之一種亦可分為三鱉臑又有芻童者形如方臺皆立方之變體方臺面與底俱正方蒭童則長方而面小底大則同亦皆可分為立三角凖前論方臺作對角線並可為兩芻甍即可再分為六鱉臑即皆立三角錐也論曰量面者必始于三角量體者必始于鱉臑皆有法之形也量面者析之至三角而止再析之仍三角耳量體者析之至鱉臑而止再析之仍鱉臑耳面之可以析為三角者即為有法之面體之可以析之為鱉臑者即為有法之體葢鱉臑即立三角之異名也量體者必以立三角非是則不可得而量算法凡算立三角體須求其正髙以正髙乘底以三而一見積其法有三其一頂居一角其稜直立即用為正髙其二頂鋭不居一角而在三角之間其三頂斜出底三邊之外並以法求其垂線為正髙假如巳甲乙丙立三角體甲乙丙為底已為頂鋭正居丙角之上巳丙如垂線為髙先以乙丙五十六尺甲乙邊六十一尺甲丙邊七十五尺求其羃積一千六百三十尺以乘已丙髙四十尺得六萬七千二百尺為實以三為法除之得二萬二千四百尺為立三角錐體若欲知已乙甲已兩斜弦依句股求弦即得已丙既直立則恒為股以股自乘冪加乙丙句冪為弦冪開方得已乙弦又以股冪加甲丙句冪為弦冪開方得甲乙弦若已頂不居一角而在三角之中則已丙非正髙乃斜稜也法當分為兩形其法依丙已稜直剖至底以上二形乃中剖為二之象其中剖之立面亦成丁已丙三角形如平三角法求得已戊垂線即為正髙如上法先求甲乙丙羃以乘已戊髙得數為實三除見積又法不必剖形但于形外任依一楞如丙已于庚作垂線至丙以法取庚㸃與已頂平行即庚丙為正髙與己戊等或量得庚已横距為句以己丙為弦求其股即得庚丙正髙亦同立三角之頂有斜出者或在底外則于已頂作垂線至庚與甲乙丙底平行乃任用相近一稜如己乙為弦量庚乙之距為句依法求其股得己庚為其正髙以乘底三除見積問己頂既居形外己庚何以得為正髙也曰此易知也但補作甲庚虛線成四邊形為底則為四稜立錐而己庚為其正髙甲乙丙底乃其底之分也亦必以己庚為正髙矣假如乙庚丙甲為底丙甲與乙庚等丙乙與甲庚等或斜方或正方其己庚一稜正立如垂則即為正髙正髙乘方底三除之即體積也若從甲乙對角線分其底為均半又依甲己甲乙二稜從頂直剖之至底則分為兩三角形而各得其積之半矣底既平分為兩則其積亦平分為兩其己庚乙甲形與己甲乙丙形既皆半積則相等而庚乙甲底與甲乙丙底又等則其髙亦等而己庚乙甲形既以己庚為髙矣則己甲乙丙形之髙非己庚而何又論曰量體積者必先知面猶量面冪者必先知綫也然則量體者亦先知線矣是故量體之法可轉用之以求線也量體者有先知之面冪有求而得之面冪夫求之而得面者必先求其面冪之界界即線也故量體之法可用之以求線也何謂以量體之法求綫曰測量是也前論立三角有虛體為測量之用夫虛體者無體者無體而有線如實體之有稜故可以量體之法求之也如所測之物有三㸃即成三邊三角當以三直線測之則立三角錐形矣所測有四㸃當以四直線測之則四稜立錐形矣兩測則又為塹堵形矣故測量之法可以求線也又論曰用立三角以量體者所用者仍平三角也而用三角以量面者所用者仍句股也吾㠯是而知聖人立法之精深廣大渾圜内容立三角體法全形為塹堵分形為鼈臑即立三角體又為句股立錐西法所用若内切小塹堵則為圜容方直形即郭太史弧矢法先解全形塹堵體亢戊乙夘為塹堵斜面其形長方夘乙為渾圜半徑夘為渾圜之心亢戊為四十五度切線與夘乙同度同為横邊亢夘為乙角割線與戊乙同度同為直邊亢氐戊丁為塹堵立面其形横長方亢氐者乙角切線也與戊丁同度以為之髙亢戊及氐丁皆四十五度切線與半徑同度以為之濶亢氐夘戊丁乙皆塹堵兩和之牆其形皆立句股氐夘同丁乙皆半徑為句亢氐同戊丁皆乙角切線為股亢夘同戊乙皆乙角割線為弦夘乙丁氐為塹堵之底其形正方夘乙及夘氐皆渾圜半徑其對邊悉同法曰先為立方體以容渾球使北極在上南極在下皆正切于立方底葢之中心則赤道平安而赤道之二分二至亦皆在立方四面之中心矣次依赤道横剖方體為均半而用其上半為半立方容半渾圜形則二分二至皆在半立方之底線各中心而赤道全圈居其底次依二分二至從北極十字剖之又成四小立方各得原立方八之一而小立方内各容渾圜分體八之一此小立方有一角之楞直立為北極之軸上為北極下即渾圜心夘角也其立方根皆渾圜半徑次依黄赤道大距取切線為髙作横線于小立方夏至之一邊即亢戊線次依亢戊横線斜剖至對邊之足則成塹堵矣對邊之足即夘乙也本為黄赤道半徑今在小立方體為方底之邊故云足也塹堵體有五面其一斜面亢戊乙夘長方其三立面一亢氐戊丁長方二亢氐夘戊丁乙相等兩句股其一方底夘乙氐丁平方塹堵形面有赤道象弧在方底有黄赤大距弧在立句股邊即兩和之牆底形底形正方其夘角即黄赤道心氐甲乙為赤道一象限乙為春分氐為夏至赤道夘氐及夘乙皆赤道半徑其對邊氐丁及乙丁皆四十五度切線立句股面形一立句股之面有二一亢氐夘一戊丁乙皆同角同邊亢氐夘形内有氐癸弧為夏至黄赤大距二十三度半强氐夘為赤道半徑癸夘為黄道半徑夘角為黄赤大距角氐癸弧之角亢氐者氐癸弧之切線亦即夘角切線亢夘者氐癸弧之割線亦即夘角割線癸弧之割線亦即夘角割線立句股面形二戊乙丁形即前圖亢氐夘形之對面戊丁髙同亢氐切線如股戊乙斜線同亢夘割線如弦丁乙横線同氐夘如句乙角同夘角又有黄道象弧在斜面斜面形斜面形長方其斜立之勢依黄道其夘角為黄道心即赤道心乙丙癸為黄道一象限乙為春分與赤道同用癸為黄道夏至夘癸及夘乙皆黄道半徑内夘乙與赤道同用亢夘為二十三度半强之割線夏至黄赤大距割線其相對戊乙邊與亢夘割線同度亢戊邊與夘乙半徑相