丙甲弧在弦丙壬弦為黄道丙乙弧正弦以當乙角之股與弦問兩弧求一弧非句股錐乎與此所用同耶異耶曰形不異也乃法異耳何言乎法異曰句股錐一也而有用角不用角之殊此用角度其句股在錐形之底以夘心為錐形之鋭則三層句股皆為其底而遙對渾體之心以視法成比例兩弧求一弧不用角度其句股同在錐形之一面無假視法自成比例所以不同然其為句股之比例一而已矣然則兩弧求一弧惟用割線餘弦此所用者惟正弦切線又何不同若是耶曰角之句股在心如夘亢氐等形皆依極至交圏平剖渾圜成平面其象始著是在渾圜之心與為比例之句股在面如酉未乙等形皆以一角連於渾圜之面二者相離以視法相叠如一平面然惟正弦切線能與之平行從凸面平視則設度之正弦切線皆與渾圜中割之平面諸線平行若割線餘弦皆非平行因視法而躋縮失其本象或斜對則長線成短線或對視則直線成一㸃不能為比例無所用之矣若兩弧求一弧則其句股自相垜疊於一平面平立斜三面各具三句股而如相垜疊並以一大句股横截成三皆以本數自相為比例全不闗于視法故無躋縮而其算皆割線餘弦所成于正弦切線反無所取所以不同若以量體之法言之割線餘弦為量立楞斜楞之法正弦切線則量底之法也兩弧求一弧法見二卷如圖以卯為句股立錐之頂卯乙為直立之楞如渾圓半徑夘未夘酉為斜面之楞並如割線酉乙未乙兩底線並如切線若依底線平截之成大小三形則比例見矣剖渾圜用餘度法乙丙黄道弧在四十五度以上求甲乙赤道弧即同升度依前法半徑癸卯亦即庚乙與乙角春分之餘弦乙壬亦即卯己若乙丙黄道之切線尾乙與乙甲赤道之切線箕乙此法無誤但如此則兩切線大于塹堵須引之于形外是以小比例例大比例也若至八十度切線太大不可作圖矣今改用餘度法自卯渾圜心遇黄道設弧丙作線至酉剖至底以乙丙黄道之餘弧癸丙取其切線于斜面如癸斗又以乙甲赤道之餘弧甲氐取其切線于底如氐未即以氐未移至斜面之楞如亢酉變立句股尾箕乙為平斜句股酉亢卯及斗癸卯兩形皆相似法為半徑癸卯與乙角之正割線乙角即卯角其割線戊乙亦即卯亢若乙丙黄道之餘切線癸斗與乙甲赤道之餘切線也亢酉亦即氐未按此法從亢戊邊剖塹堵成句股方錐之眠體其剖形以亢氐酉未長方形為底以卯為錐尖以斜面之卯亢酉句股形及平面之卯氐未句股形為相對之二邊又以卯氐亢之立面句股形及卯未酉之斜立面句股形為相對之二邊其四面皆句股其底長方而以卯為尖故曰眠形不直曰方錐者以面皆句股而卯氐線正立故不得僅云陽馬謂之句股方錐可也亦如句股錐立三角不得僅謂鼈臑塹堵測量二句股錐形序即兩弧求一弧正弧三角之法即郭太史側視圖也郭法以側視取立句股又以平視取平句股故有圓容方直之法而不須用角西法専以側視之圖為用故必用角用角即用弧也惟其用角故所用者皆側立之句股也余此法則兼用平立斜三種句股而其大小句股之比例並在一平面尤為明白易見而不更言角既與授時之法相通其兼用割線起算春分又西厯之理也葢義取適用原無中外之殊笇不違天自有源流之合敬存此稿以質方來其授時厯側視平視之圖詳具别卷正弧三邉形以兩弧求一弧法句股錐形之理用割線餘弦以弧度求弧度而不言角其理與郭法相通丙甲乙三角弧形甲為正角卯為渾員心丙乙為黄道距春分之一弧甲乙為赤道同升之弧丙甲為黄赤距度即過極圈之一弧丙卯為黄道半徑甲卯為赤道半徑卯乙為黄赤兩道之半徑壬卯為丙乙黄道之餘弦以丙壬為其正弦故丑卯為甲乙赤道之餘弦以甲丑為其正弦故辛卯為丙甲距度之餘弦以丙辛為其正弦故子卯為丙甲割線以子甲為切線知之酉卯為丙乙割線以酉乙為切線如之未卯為甲乙割線以未乙為切線知之斜面酉乙卯及子丑卯及丙壬卯皆句股形乙丑壬皆正角又同用卯角角之弧為丙乙黄道平面未乙卯及甲丑卯及辛壬卯皆句股形乙丑壬皆正角又同用卯角角之弧為甲乙赤道立面酉未卯及子甲卯及丙辛卯皆句股形未甲辛皆正角又同用卯角角之弧為丙甲距度其又一立面酉未乙及子甲丑及丙辛壬三句股形為切線正弦所作兹不論論曰因諸線成平面句股形為底兩立面句股形為牆斜面句股形為面則四面皆句股形矣而酉未聯線及子甲切線丙辛正弦皆直立上對天頂下指地心故謂之句股錐形也既成句股則其相等之比例可以相求用法半徑與赤道之餘弦若黄道之割線與距度之割線反之則赤道餘弦與半徑若距度割線與黄道割線一甲乙餘弦丑卯小句二半徑乙卯大句三丙甲割線子卯小弦四丙乙割線酉卯大弦又更之則黄道割線與半徑若距度割線與赤道餘弦一丙乙割線酉卯大弦二半徑乙卯大句三丙甲割線子卯小弦四甲乙餘弦丑卯小句右取斜面酉乙卯子丑卯兩句股形以乙卯半徑為比例偕一餘弦兩割線而成四率半徑與距度之割線若黄道之餘弦與赤道之餘弦一半徑丙卯小弦二丙甲割線子卯大弦三丙乙餘弦壬卯小句四甲乙餘弦丑卯大句反之則距度割線與半徑若赤道餘弦與黄道餘弦一丙甲割線子卯大弦二半徑丙卯小弦三甲乙餘弦丑卯大句四丙乙餘弦壬卯小句又更之則黄道餘弦與半徑若赤道餘弦與距度割線一丙乙餘弦壬卯小句二半徑丙卯小弦三甲乙餘弦丑卯大句四丙甲割線子卯大弦右取斜面丙壬卯子丑卯二句股形以丙卯半徑偕一割線兩餘弦而成四率半徑與赤道割線若距度割線與黄道割線更之則赤道割線與半徑若黄道割線與距度割線一甲乙割線未卯大句二半