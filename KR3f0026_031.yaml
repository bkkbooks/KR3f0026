body:
  text: 厯算全書卷二十八宣城梅文鼎撰交食蒙求卷三訂補月食一求諸平行首朔根查二百恆年表本年下首朔等五種年根并紀日録之朔策望策用十三月表以所求某月五種朔策并望策之數録於各年根之下平望以首朔日時與朔策望策并紀日并之滿二十四時進一日滿六十日去之太陽平引以太陽引根與朔策望策并之滿十二宫去之後並同太隂平引以太隂引根與朔策望策并之交周平行以交周度根與朔策望策并之隨視其宮度以辨食限宮六宮十五度以內五宮十一宮十五度以外以上宮度俱有食太陽經平行以太陽經度根與朔望二策并之二求日月相距日定均以太陽平引宫度查一卷加減表如平引滿三十分進一度查之記加減號月定均以太隂平引宫度查一卷加減表如平引滿二十分進一卷查之記加減號距弧以日月定均同號相減異號相併即得距時以距弧度分於四行時表月距日橫行內查得相當或近小數以減距弧得時視相當近小數本行上頂格所書時數録之即是其餘數再如法查取得時之分秒依上法用相當近小數取之并所查數即為距時隨定其加減號兩均同加者日大則加日小則減兩均同減者日大則減日小則加兩均一加一減者加減從日三求實引日引弧以距時時及分查四行時表太陽平行兩數并之依距時加減號日實引置太陽平引以日引弧加減之即得月引弧查四行時表取距時時分下太隂平行兩數并之依距時加減號月實引置太隂平引以月引弧加減之即得四復求日月相距日實均以日實引宫度查一卷加減表如實引滿三十分進一度查之記加減號月實均以月實引宫度查一卷加減表如實引滿三十分進一度查之記加減號實距弧以日月實均同減異加即得實距時以實距弧度分查四行時表與前距時同加減號亦同前五求實望實望置平望以實距時加減之即得如加滿二十四時則進一日不及減借二十四時減之則實望退一日六求實交周交周距弧查四行時表實距時時分下交周平行兩數并之即得依實距時加減號交周次平行置交周平行以交周距弧加減之即得凡加者滿三十度進一宫滿十二宫去之為宫減者遇所減度數反小則加三十度退一宫減之宫度不及減則加十二宫然後減之實交周置月實均記加減號以加減交周次平行即得七求月距黃緯月距黃緯以實交周查太隂距度表依中比例法求之假如實交周十一宫十九度十四分先以十九度查得五十六分五十三秒又以十九度與二十度之數相減得較五分七秒化作三百七秒與實交周小餘十四分相乘用六十分為法除之得七十一秒收作一分十一秒以減十九度之數得五十五分四十二秒即月距緯其緯在南中比例加減法視表上數前少多後多少者加減又法視表上宫名在上者以所得中比例數加宫六宫是也表上宫名在下者以所得中比例數減五宫十一宫是也辨交食月緯南北法視實交周是六宫五一十宫其緯在北南八求徑距較數月半徑以月實引查二卷視半徑表即得影半徑月半徑下層即景半徑景差以日實引加減六宫查視半徑表即得實景景半徑內減去景差即實景并徑以實景加月半徑即得并徑減距置并徑以月距緯減之即得如距緯大於并徑不及減則不得食矣九求食分食分以月半徑倍之為一率并徑減距為二率月食十分為三率二三相乘一率除之即得食分十求躔離實度日距弧以實距時時分查四行時表太陽平行兩數并之即得依實距時加減號日次平行置太陽經平行以日距弧加減之即得日實度置日實均記加減號以加減日次平行即得月實度以日實度加減六宫即月實度記寫宫名十一求視望加減時以日實度查一卷加減時表即得記加減號視望置實望以加減時加減之即得十二求所食時刻月實行以月實引查二卷太隂實行表得之實行表三度一查假如某宫一度二度俱在度下查若四度五度俱在三度下查餘倣此初虧距弧以距緯加并徑與并徑減距相乘平方開之即得初虧距時分置距弧用三率法化時即得食既距弧實景內減去月半徑餘數與距緯相加為和相減為較和較相乘平方開之即得食既距時分置距弧用三率法化時即得三率法月實行化秒為一率六十分為二率初虧食既距弧化秒為三率求得初虧食既距時分為四率初虧時刻置視望以初虧距時分減之即初虧時刻復圓時刻置視望以初虧距時分加之即復圓時刻食限總時復圓時刻內減去初虧時刻即總時食既時刻置視望以食既距時分減之即食既時刻生光時刻置視望以食既距時分加之即生光時刻既限總時生光時刻內減去食既時刻即得十三求宿度黃道宿以黃道距宿鈐減月實度即得記寫宿名其宿鈐每年加嵗差行五十一秒如實度小於宿鈐不及減改前宿赤道宫度以月實度用弧三角求之即得記寫宮名求赤道經緯弧三角法見日食蒙求下同赤道宿度以所入宿黃道經緯加過嵗差之宫度為經其緯用恆星表取之用弧三角法求到本宿赤道經度以減月赤道度得食甚時赤道宿度如不及減取前一宿如法用之十四求各限地平經緯各限交周置實交周以初虧食既距弧加減之得各限交周以查月距度表得各限月緯黃白差角定為四度五十九分此朔望交角也各限有微差可以不論是宫十一宫上方差角在黃經度西是五宫六宫上方差角在黃經度東用月實度入極圈交角表取其餘度即得是一二三四五宫上方差角在赤經度西是六七八一九十十宫上方差角在赤經度東月赤道差以所推黃白黃赤兩差角東西同號者相併異號者相減即得記東西號其異號以小減大並以度之大者為主命其東西以上所推食甚時差角各限同用各限亦有微差可以勿論距午度分置各限時刻如在子後者即為距午時此從午正順數如食在子前者置二十四時以各限時刻減之餘為距午時此從午正逆推再以時變為度即得各限太隂距午度分時變度法每一時變十五度每時下一分變度下十五分時下四分成一度時下一秒變度下十五秒時下四秒成一分秒滿六十收為分分滿六十收為度各限髙度即地平緯以極距天頂為一邉月實度距北極為一邉以黃赤距度南加北減象限得之二邉相加為總相減為存存總各取餘弦相加減總弧不過象限相減總弧過象限相加若存弧亦過象限則仍相減並折半為初數各限同用乃以各限距午度取其矢距午度過象限則用大矢以乘初數去末五位為矢較用加存弧矢得對弧矢矢減半徑得餘弦命為髙度正弦查表得髙度所得對弧即月距天頂乃髙度之餘故其餘弦即髙度正弦一率半徑二率角之矢三率初數四率兩矢較各限方向即地平經以極距天頂為一邉月距天頂為一邉髙度之餘二邉相加為總相減為存存總各取餘弦相加減並如髙度法如法取初數各限不同乃以月距北極為對弧取其矢月在赤道南用大矢與存弧矢相減為矢較進五位為實初數為法實如法而一得所求矢即地平經度皆子午規所作天頂角度分之大小矢矢與半徑相減得餘弦查其度命為月距正子午方地平經度凡正矢去減半徑得鋭角餘弦其度子後食者逆推子前食者順數並距正子方立算大矢內減半徑得鈍角餘弦其度子後食者順數子前食者逆數並距正午方立算即得各限月在地平上方位一率初數二率兩矢較三率半徑四率角之矢地經方位度分鈐鋭角用本度鈍角用外角度並以餘弦查表取之地經赤道差以月距北極為一邉月距天頂為一邉二邉相加為總相減為存存總各以餘弦相加減如前法取初數各限不同以天頂距北極為對邉取其矢各限同用與存弧矢相減得矢較進五位為實初數為法實如法而一得差角矢從北極作赤道經圈過月心又從天頂作髙弧過月心得此差角矢減半徑得餘弦命度記東西號地經白道差置所推地經赤道差以月赤道差加減之東西同號者相併異號者相減即得各限白道經度差於地經髙弧之數記東西號若月赤道差大於地經赤道差法當反減其號東西互易並以月赤道差之號命其東西月食有初虧子前復圓子後者各依本限論之各限時刻在子前用子前法在子後用子後法此線所指即月行白道之極猶赤經線之指北極訂補月食繪圖法赤經主線總圖先作立線以象赤道經此線上指北極下指南極線左為東線右為西為作圖主線暗虛食限主線上取一點為心地景半徑為度作圓形以象暗虛又以暗虛心為心併徑景半徑月半徑相加為度作大圓於暗虛之外是為食限又徑較為度景半徑月半徑相減作小圓於虛暗之內是為既限黃道交角以月實度入極圈交角表取之命為食甚時黃道與赤經所作之角黃道線依黃道交角度分作角於主線左右皆自主線起算數食限上度分作識向暗虛心作直線令兩端透出即上下各成相對二角並如黃道交赤道之角而此線象黃道凡上方角度右順左逆下方角度左順右逆並自主線起算數食限大圓周度分作識從此作過心直線至對邉則角度皆等白道經度依所推月赤道差角於赤經左右數其度亦借圓邉數之其左右如先所推作識嚮圓心作直線而透出之即食甚時白道經線白道虧復各取月緯於黃道上下作兩平行虛線陽厯用南緯此二平行線作於黃道下方隂厯用北緯作兩平行線於黃道上方虛線兩端必與食限大圓相遇而各成一點依法各取其合用之點聫為一直線即自虧至復所行白道也交前先逺後近以逺點為初虧近點為復圓交後先近後逺以近點為初虧逺點為復圓初虧點在西復圓點在東隂陽厯並同一法白道線與經線相遇成十字角十字中心一點即食甚時月心所到也以月半徑為度從心作圓形以象食甚時月體即見其為暗虛所掩分數與所推月食分秒相符法以月體勻分十分即見此時月入暗虛若干分數或全在其中而為食既或深入其中而食既外尚有餘分一一皆可見又此時月心與暗虛心正對其相距之分即食甚時月緯與所推亦合虧復真象又以白道割外圓之點各為心月半徑為度作小圓二以象初虧復圓時月體即見初虧時月以邉漸入暗虛復圓時月體全出暗虛其先缺後盈之點皆有定在食既生光若食既者白道必橫過內園即既限亦相割成兩點即食既生光時月心所到也兩點各為心月半徑為度作圓形二以象食既生光時月體即見食既時月體全入暗虛而光盡失生光時月體漸出暗虛而光欲吐其欲既未既欲吐未吐之時月體必有一點正切暗虛之邉皆有定處取白道簡法不必求虧復月緯但以月距黃緯於白道經線作識隂厯在北陽厯在南並距暗虛心立算為食甚月心所到從此作橫線與經線十字相交即成白道餘同上右總圖以上為北下為南左為東右為西中西厯法所同也若月食子正即赤道經與午規為一而所測如圖然各限時刻不同假如初虧子正復圓必在子後若復圓子正初虧必在子前相距有十二三刻以上化為度有相距三四十度以上則經線午規相離而南北東西易位食近卯酉變態尤多非精於測算不能明也故有後法新增月食分圖法髙弧主線作立線以象髙弧上指天頂下指地平不論東西南北在何方位並以天頂為宗直指其上下左右是為各限繪圖之主線白道線主線上取一點為心規作月體並以所推月半徑度分為半徑其周分三百六十度月邉上方數所推各限地經白道差之度作識差東者逆數向左差西者順數向右並從主線上方割圓周處起算從此作過心直線即白道經線也於月心作橫線與白道經線十字相交以象白道十分真像白道經線上於月心起算取月距黃緯作識隂厯作識於月心之下方陽厯作識於月心之上方並如月距黃緯度分以月半徑之度凖之即暗虛心也月距黃緯即食甚時兩心之距暗虛心為心實景半徑為度作圓分於月體即見食甚時月入暗虛被掩失光晦明邉際了了分明受蝕處所視月邉所缺若干度分在月全周三百六十度中虧若干其與白道經線相割處必正對暗虛即缺邉度折半取中之點即舊法所謂月食方位也此點或在月體之上或在月體之下與其左右一一可指其餘光若新月或大或小必皆曲抱此點而斜側仰俯皆可豫定其形算缺邉度法别具若食既者不用此條食之深淺又以月體全徑分為十分於白道經線上分之即食甚時虧食深淺或被食若干分數而有餘光或全入暗虛月光全失而為食既即食十分或深入暗虛而食既之外尚有餘分即食十一二分以上至十六七分不等並絲毫不爽初虧復圓如法作主線及月體白道並如食甚乃於白道上自月心取初虧距弧之度作識初虧於月心之左復圓於月心之右即食甚時月心所到從此作垂線截如月距黃緯之度陽厯向上作之隂厯向下作之即食甚時兩心之距垂線末為暗虛心從暗虛心作直線至月心必割月邉此點即初虧復圓時先缺後盈之點在初虧則此處先缺在復圓則此處後盈並可以月體之上下左右命之又捷法於初虧距弧作識處以月距黃緯為度依上下之向作弧分虛線於月心以併徑為度亦作弧分虛線兩虛線交處即閭虛心從暗虛心作虛直線割月邉至月心即於割點作識命為先缺後盈之點可不作垂線直線若以實景半徑為度從暗虛心向月邉作半圓以象暗虛其邉與月邉相切即先缺後盈之像益復分明食既生光立主線繪月體取白道經線作白道並如初虧復圓白道上以食既距弧度作識食既於月心之左生光於月心之右並自月心起算與虧復同從此作垂線尋暗虛心陽厯向上隂厯向下並如月距黃緯之度亦同虧復作直線自暗虛心過月心至邉即食既生光時後入先出之點欲既未既時此處有餘光後沒光欲生時此處有微光先吐於月體之上下左右皆有定處捷法以月距黃緯於食既距弧作識處依隂陽歷之向作虛弧又以徑較為度自月心依左右之向作虛弧兩虛弧交處即暗虛心從暗虛心作直虛線過月心至邉即食既時後沒生光時先見之點若以實景半徑從暗虛心作半圓以包月體即見食既時月體全入暗虛生光時月體將出暗虛而各有二邉相切之一點若暗虛半徑稍縮其度則食既時後沒餘光生光時微光先吐皆了然可見月𢃄食法辨月有𢃄食月食子後者視復圓時刻若在日出後月食子前者視初虧時刻若在日入前是有𢃄食也若日出入時刻與食甚相同者不用布算即以所推食分為𢃄食分諸限時刻有與日出入同者亦然皆不必推𢃄食𢃄食距時𢃄食在朝者以日出時刻在暮者以日入時刻並與食甚時刻相減餘即為𢃄食距時法同日食𢃄食距弧初虧距時化秒為法初虧距弧化秒與𢃄食距時化秒相乘為實實如法而一得數為𢃄食距弧秒滿六十收為分𢃄食距心徑以𢃄食距弧月距黃緯各自乘兩數相併平方開之得數為𢃄食距心徑法實俱化秒得數收分𢃄食分秒月全徑化秒為一率月食十分化秒為二率置併徑內減𢃄食距心徑餘數化秒為三率求得四率即月出入時𢃄食分秒秒滿六十收分凡𢃄食分必小於食分食既者𢃄食必不滿十分若滿十分為𢃄食既出入其減餘必大於月全徑一法置𢃄食距心徑內減徑較月半徑影半徑之較餘數化秒為三率如上法求之得未食餘光分秒以轉減月食十分為𢃄食分秒如𢃄食距心徑小於徑較不及減者為𢃄食既出入其𢃄食距時必小於食既距時辨食分進退凡月出入時刻即日出入時刻在食甚前其所𢃄食分為進𢃄食在朝者為但見初虧不見食甚復圓在暮者為不見初虧但見食甚及復圓若食既者在朝為見初虧不見食既或見食既而必不見生光復圓在暮為不見初虧但見食既或并不見食既而但見生光復圓若月出入時刻在食甚後其所𢃄食分為退在朝為見初虧食甚不見復圓在暮為不見虧與甚但見復圓若食既者在朝為但見初虧食既食甚生光不見復圓或并不見生光在暮為不見初虧食既食甚生光但見復圓或并可見生光𢃄食作圖法總圖以𢃄食距心徑為半徑暗虛心為心作圓周取其與白道橫線相割點為月出入時月心所到用此為心如法作圓以象出入地平時月體即見其時月體有若干分秒在暗虛內與所算𢃄食分相符圓周割白道必有二點當以𢃄食分進退詳其左右如法取之分圖如法先求月出入時地經白道差法曰以黃赤距度用月實度取之取餘弦即存弧餘弦又即總弧餘弦命為初數總存兩餘弦同數故也以極出地度正弦減半徑命為對弧矢即極距天頂之矢以黃赤距度取矢即存弧矢二矢度相減得較數進五位為實初數為法法除實得差角矢矢減半徑得餘弦以餘弦查表得度即月出入時地經赤道差𢃄食在朝者差角在西若在暮者差角在東捷法以黃赤距度之餘弦內減極出地之正弦得餘數進五位為實仍以黃赤距度之餘弦為法除之得差角矢若月實度正與二分同度即以極距天頂度分命為地經赤道差不須布算凡各限時刻有與日出入同者並可依此法求其地經赤道差角置地經赤道差以各限同用之月赤道差加減之東西同號者加異號者減即月出入時地經白道差記東西號次作髙弧主線如各限法規作月體於圓邉數地經白道差之度作識依白道差東西之號並自髙弧上方交月邉處起算差東者逆而向左差西者順而向右從此作過心直線以象白道經線又於月心作十字橫線以象白道其法並同各限白道上以𢃄食距弧為度作識即食甚月心所到也𢃄食分進者此點在月體左方退者在月體右方從此作垂線陽厯作垂線向上隂厯作垂線向下截其長如月距黃緯之度即暗虛心所在從此向月心作直線至對邉此即月出入時月與暗虛兩心相對之徑線乃分月體為十勻分即於徑線上分之末以暗虛心為心實景半徑為度作圓分於月體內即見月體在暗虛內有幾何分與所推𢃄食分秒相符其餘光若新月者偃仰縱橫皆如所見矣康熙五十七年戊戌二月十五甲午日夜子初二刻八分望月食分秒起復時刻方位依厯書本法月食十七分三十一秒初虧亥初二刻十三分食既亥正三刻食甚夜子初二刻八分生光十六日子正二刻一分復圓丑初二刻三分食限內共計十五刻五分既限內七刻八分食甚月離黃道鶉尾宮二十五度五十三分為翼宿六度食甚月離赤道鶉尾宫二十六度一十四分為翼宿十四度三十八分以上諸數並主京師立算江南省月食分秒宿度並同惟各限時刻加八分右圖為黃道上日月躔離右旋之度自西而東乃步算之根也日行遲月行疾暗虛地影居日之衝故暗虛之行即日行也初虧時月在暗虛之西及至復圓遂出其東日月並右旋而有遲速於斯著矣月道之交於黃道也有隂厯焉有陽厯焉有交前交後焉今二月月食交後隂厯也距交逺則黃緯大而受蝕淺距交近則黃緯小而受蝕深今距交未及一度黃緯只四分故入影最深而食分最大自甲至卯共十七分竒厯厯可數也自丙至丁為自虧至復月行之度折半於乙為食甚故虧至甚甚至復時刻俱等與算數相符按圖索之瞭如指掌矣若乙點稍偏即度有參差與算理不合亥初三刻六分月食初起髙四十七度二十四分距正午東五十度零四分在巽方初見微蝕處在月體下方之左亥正三刻九分月食至盡髙五十五度二十九分距正午東三十度零三分在巳方欲既未既些少餘光在月體右上右圖為地平上太隂加臨方向東升西沒其行左旋乃測驗之用也假如欲候初虧法以盤針考定巽方定為月食初虧時地平經度又法擇平地畫以圓圈對子午卯酉作十字線分圓周為四自卯至午勻分九十度自午至酉亦如之乃自午向卯數五十度為初虧方位各限俱如是候至亥時初三刻用星晷香漏或自鳴鐘定之其時太隂巳到巽方在地平上髙四十七度竒用象限儀等器測之即見月體下方偏左處漸有微缺是為月食初虧在月體下方之左也此不論東西南北惟以月體對天頂處為上對地平處為下左右亦然測時須正身直立向月平觀即上下左右絲毫不爽食既等各限並同子正二刻九分月光始生髙五十七度五十分過午正西十八度三十一分在丁方微光初見時在月體左方稍下丑初二刻十一分月光盡復髙五十五度半過午正西二十七度三十九分在未方光欲滿時些少微缺在月體右方略上因五限總圖限於尺幅月影縮小故復作分圖以便測驗內惟食甚月在暗虛地形深處聊可得其地平經緯無上下左右可言故分圖只四限厯算全書卷二十八
