body:
  text: 厯算全書卷二十九宣城梅文鼎撰古算衍略古算器考或有問於梅子曰古者算學亦有器乎曰有曰何器曰古用籌籌何似曰漢書言之矣用竹徑一分長六寸二百七十一而成六觚為一握度長短者不失毫釐量多少者不失圭撮權輕重者不失黍絫又世説言王衍持牙籌會計此用籌之明證也曰若是則籌可用竹亦可用牙矣然則即今之籌笇非歟曰非也今西厯用籌亦起徐李諸公蓋從厯家之立成而成即立成表之活者耳故一籌即備九數若古之用籌用以紀數而無字畫故一籌只當一數乘除之時以籌縱橫列於几案一望了然觀古算字作祘蓋象形也然則起於何時曰是不可考然大易揲蓍亦以一蓍當一數則其來逺矣蓍策所以決疑非常用之物故特隆重其製而加長長則不可以橫故皆縱列惟分二象兩之後挂一䇿以别之使無凌雜餘皆縱列也又其數只四十九故四揲以稽其實數其用専専則誠也布算之法有十百千萬之等以乘除而升降又日用必需之物故其製短使几案可列其言六寸成觚者有度量之用古尺既小於今尺才四寸竒蓋亦取其便於手握耳浦江吳氏中饋録有算條巴子切肉長三寸各如算子樣亦可以想其長短然則其用之若何曰五以下皆縱列六以上則橫置一籌以當五而縱列其餘式詳後然則十百千萬何以列之曰其式皆自左而右略如珠笇之位亦如西域歐邏寫算之位皆順手勢不得不同也曰亦有徵歟曰有之蔡九峯洪範皇極數所紀算位一至五皆縱列六至九皆橫一於上以當五又自一之一至九之九皆並列兩位自左而右此用於宋者也又授時厯草所載乘除法實之式皆縱橫排列自左而右以萬千百十零為序此用於元者也左傳史趙言亥有二首六身下二如身為絳縣老人日數士文伯知其為二萬六千六百六旬而孟康杜預顔師古釋之皆以為亥字二畫在上其下三六為身如笇之六蓋橫一當五又竪一於橫一之下則為六矣與皇極同也又言下亥二畫竪置身傍蓋即竪兩笇為二萬又並三六為六千六百六旬而四位平列與厯草同此又用於三代及漢晉者也曰厯草又有一至五橫紀之處何歟曰此亦非起於厯草也何以知之唐人論書法橫直多者有俯仰向背之法若直如笇子便不是書其言笇子即所列籌也然兼橫直畫言之則唐人用籌為算亦有橫直可知乾鑿度云卧算為年立算為日蓋位數多者恐其相混故三十三二十二之類笇位皆一縱一橫以别之縱即立算橫即卧算也乾鑿度不知作於何人然其在漢魏以前無可疑者則橫直相錯之法古有之矣五以下既可易縱為橫則六以上橫一當五者亦可易之而縱又何疑於厯草哉曰然則今用珠盤起於何時曰古書散亡苦無明據然以愚度之亦起明初耳何以知之曰歸除歌括最為簡妙此珠盤所恃以行也然九章比類所載句長而澀蓋即是時所創後人踵事增華乃更簡快是書為錢塘吳信民作其年月可考而知則珠盤之來則自不逺按欽天監厯科所傳通軌凡乘除皆有定子之法惟珠算則可用然則珠算即起其時又嘗見他書元統造大統厯訪求得郭伯玉善算以佐成之即郭太史之裔也然則珠盤之法蓋即伯玉等所製亦未可定曰南雷畣牧齋流變三疉之問既云長水分别算位本位是竪進一位即是橫本位是橫進一位即是竪又引鑿度卧算立算以證之矣然其所圖算位俱作圓點殊無橫直之形何耶曰南雷固言今之算器數分於珠是指珠算也又云長水之算只用今器其所謂橫竪者分别算位南雷之意蓋謂長水姑借橫竪之語以分算位而實用珠算非實有橫竪也然以鼎觀之疏既以一橫二竪當十二復以一竪二橫當百二十終以一橫二竪當千二百而皆曰進動算位明是用籌非用珠也故當十進百之時則當取去第一疊零位之二竪而加十位之一橫為二橫又添一竪於百位則成百二十矣故曰進動算位為第二疊也百進千則又取去十位之二橫而增一竪於百位為二竪又别增一橫於千位成千二百故亦曰進動算位為第三疊也説本明晰與今珠算何涉乎若如南雷所圖則橫竪字為贅文矣是故布籌可縱可橫此亦一證又按朱子語類云潛虛之數用五只似如今算位一般其直一畫則五也下橫一畫則為六橫二畫則為七此又一證也蔡九峯皇極數以橫畫當五故下竪一畫為六竪二畫為七與此相反然理則相通厯草則兼用之蓋皆本之古法古布算式皇極數圖見性理大全厯草算式立差定平差定平積右式皆因數有雷同故縱橫列之以為别亦自然之理也乘除法實式亦見厯草亥字二首六身考左傳襄公三十年三月癸未絳縣老人曰臣生之嵗正月甲子朔四百有四十五甲子矣其季於今三之一也師曠曰魯叔仲惠伯會郤成子於承匡之嵗也注魯文公十一年乙巳嵗七十三年矣注自乙巳嵗至今年戊午首末七十四年而曰七十三者蓋計其全數而言未滿七十三年也史趙曰亥有二首六身注言亥字上二畫為首六畫為身如算之六者三也春秋時有此字體下二如身是其日數也注如往也言除下亥上二畫往置身旁也便是此老人從初生年起至今癸未日之日數也蓋以亥之二畫為二萬之數以三六之算為六千六百六旬之數也士文伯曰然則二萬六千六百有六旬也按古法每年三百六十五日又四分之一七十三年該二萬六千六百六十三日又四分之一故注以正月甲子為夏正建寅之月而三月癸未杜氏長厯及孔疏皆以為當作二月為夏之十二月也其癸未日長厯以為是二十三日然則春秋所紀者自用周正而晉人所言者自是夏正故魯史紀戊午二月者晉人所言則仍為丁巳之十二月所以士文伯云七十三年也籌有色以分正負沈存中括筆談曰天有黃赤二道月有九道此皆強名非實有也亦由天之有三百六十五度天何嘗有度以日行三百六十五日而一期強謂之度以步日月五星行次而巳日之所由謂之黃道南北極之中間度最均處謂之赤道月行黃道南謂之朱道北謂之黑道東謂之青道西謂之白道黃道內外各四并黃道而九日月之行有遲有速難以一術御故因其合散分為數段每段以一色名之欲以别算位而已如算法用赤籌黑籌以别正負之數厯家不知其意遂以為實有九道甚可嗤也按此又宋算用籌之明證方田通法序學必有原不得其原不可以為學九數之學具列周官而孔子言遊藝在志道據德依仁後唐十經博士期業成以五年可形下視哉客嵗之冬從竹冠先生飲令弟樂翁所得觀先生捷田歌括離竒出沒杯酒間未深領其趣屬他故羈治城且匝月既無攜書可破岑寂乃稍憶所疑演而通之因浩然嘆數學之有源雖至近若方田而易簡中精深爾爾也算具不具仗三寸不聿為之今年春里中有事履畝或見問桐陵法遂出斯編相質命曰方田通法云閼逢執徐日躔在奎勿菴梅文鼎識方田通法太極生生之數數始於天一終於地十十亦一也天地之地始終乎一故曰太一太一者太極也自極而儀而象而卦皆加一倍三加而止萬事託始焉是故制器者尚其象璣衡八尺周於八方尋常則之以度百物蓋取諸此兩地之數一生二二者兩地也兩一則二兩二則四兩四則八兩八則十有六四象相交成十六事卦有內外也庾以命斗秉以命斛斤兩則之以權百物蓋取諸此參天之數一生二二生三三者參天也參一而三參二而六參四而十有二參八而二十有四作厯者以紀中節八節二十四氣八卦二十四爻也是故玉衡之尺八而璣圍二十有四斤之兩十有六而銖二十有四二十有四者權度之所生數之綱也從而十之以為地紀而畝法生焉畝法二百四十步古法步百為畝畝百為夫今二百四十步為畝相傳起於唐太宗步法五合參兩則五猶合四行為土土之生數也倍五則十土之成數也乘者從生故平方五尺為步而用以乘除者從成故積步二百四十為畝而用以除方田原法以所丈田橫步與其縱步相乘得數為實以一畝二百四十步為法除之滿法為畝不滿退除為分釐田之為字衡縮相交矩其外格其內象平方也田不能皆方或圓或直或梯或斜或如牛角或為矢弧不皆方故為之法以方之大約不離橫縱者近是九章之術首列方田君子潔矩之道歟截歸法或八歸三歸各一次或四歸六歸各一次或五因一十二歸邵子曰三八二十四也四六亦二十四也倍十二亦二十四也丈量家用截法可以觀已減法或折半減二或減六減五各一次即定身除也飛歸法進一除二四進二除四八進三除七二進四除九六五除一二一四四作六一六八作七一九二作八二一六作九見一加三隔位四見二加六隔位八不盡者留法喝之又三六作一五六作二五八四作三五一八作四五一三二作五五一五六作六五一八作七五二四作八五二二八作九五留法一留退四一六六二留退八三三三三留一二五四留一六六六六五留二八三三六留二五七留二九一六六八留三三三三三九留三七五其法是除用之似乘以其為除後得數也故謂之留若用以喝稍者言退者本位不則進一位或稍子位多者喝完總移進之更妙凡加留減者如加減法只記原實於各挨身加減之若原用因法者則又下一位挨加減之皆記原實以留法喝之言退者各又退一位以上截留飛減四法皆於乘土之後用以求畝惟留法則有不盡故長於喝稍後有用兩求斤留法附録之一退六二五二一二五三一八七五四二五五三一二五六三七五七四三七五八五九五六二五十六二五十一六八七五十二七五十三八一二五十四八七五十五九三七五新增徑求畝步法其法不用乘土以所得橫縱之步先得者為實後得者為法徑求之可以抵掌而辦原法二十有二竹冠道士衍為百二十有三勿菴氏引而伸之且三百八十有四也倚數之妙乃至斯乎而豈有外於參兩乎又豈有加於所謂一者乎法列如後減二即十二除凡法之可以兩者皆減二是為畝法之半或折半六歸之八除或二十五於下位加之凡法之可以參者皆八除是為畝法三分之一四十八除即折半飛歸也凡法之可以五者皆四十八除是兩其畝法也四除或二十五乘之凡法之可以六者皆四除是為畝法六分之一六除凡法之可以四者皆六除是為畝法四分之一三除凡法之可以八者皆三除是為畝法八分之一下加凡法之上位得一者皆下加上加凡法之下位得一者皆上加凡加畢再用留法或飛歸之折半凡法之十二者皆折半為畝法六分之五減六凡法之可以十五者皆減六即兩求斤留法也為畝法三分之二又為六分之四減五凡法之可以十六者皆減五即十五除也為畝法八分之五加留減留凡法之可借上者皆加留可借下者則減留所以通其窮也隨數喝畝凡二十四則隨數喝之倍法凡四十八五除之即二因也減八即畝法八分之六也凡法之可以八分用六者十八除之又為四分之三九除即畝法八分之三凡法之可以八分用三者九除之二十一除即畝法八分之七凡法之可以八分用七者二十一除因法代除如四十八則二因之如七十二則三因九十六則四因又如十二五因一四四六因一六八七因一九二八因二一六九因又如六用二五因八四用三五因一八用四五因一三二用五五因一五六用六五因一八用七五因二四用八五因二二八用九五因加法代除如三加二五即一二五乘所以代八除也三六加五即十五乘也又如四二徑加七五五四二次加五皆不用除原法歌訣出桐陵量田捷法少人知不乘一數便留之二弓折半六而一三步之中用八歸四步由來六歸是五步還宜六八歸六數四歸無走作八上三歸無改移十二將來折一半十六三而加倍齊二十四中隨數喝草五中分六八歸三十二上尤甚準四因還要用三歸四十八上加一倍八卦宫中誰得知三歸八因尤甚準勝如神見不差池七二倍之加遍五九十六上四因之十五之中逢二八七五之中四八歸三七半時當八八九弓加五四歸竒十八折之加五定三六之中加五施此是明師真口訣千金不度世人知附歸除捷法多上空加一多上者實多於法也空者實首隔一位也凡實多於法則於實前隔一位上一子若法實兩數等亦同依前除莫疑依前者即以前法數除之也少前數上五少前者實少於法也即於實之前位上五子不隔位折半數除之折半除者用法數之半而除之也用五乘代折半甚捷無除隨上一無除者上五之後不及除半數也既不及除隨於實前位上一子化下照前除化下者退下一位也照前除者即依法數降一位而除之也區田圖刋誤按區田古法並以方一尺五寸為區通計每畝可二千七百區空一行種於所種行內隔一區種一區除隔空外可種六百七十五區此亦約略之説後又云每區一斗每畝可收六十六石而詩亦云限將一畝作田規計區六百六十二並大同小異是四分而種其一也今農書之圖黑白相間是二分種一與説相背且如所圖既不便於營治亦不便於澆灌反不如薑田之用濶溝通人行之為便矣謹依古説改作之如左又按四分種一亦是約略之數若細求之則四邉近田塍處可只空半區要以隨方就圓使其易行亦不在拘拘於尺寸之間也孟子曰此其大略也若夫潤澤之則在君與子吾於區田亦云如甲乙為田內每畫方一尺五寸為區如甲子直行每隔一行種一行如甲戊丙巳因得橫行亦然如庚甲辛癸其播種之區四面合之各成小平方如丙辛方中間子丑為種地卯寅方中間午未方為種地皆居小平方之中央又蟬聫而下通計每田一畝為種區者約四之一圖中白者是空地黑者是種區區田説向讀嵇叔夜養生論謂區種之法畝可得粟數十鐘已讀王氏農書詳著其法而農政全書載汜勝之書及務本書謂湯有七年之旱伊尹作為區田教民糞種負水澆田諸山陵傾坂及田邱城上皆可為之王禎田古人每區收榖一斗每畝可收六十六石今人學種可減半計賈思協曰兖州刺史劉仁之昔在洛陽於宅田七十步之地域為區田收粟三十六石然則一畝之收過百石矣古説彰彰如是而或者疑之徐玄扈先生以為古今斗斛之異余以為不必疑也蓋徴之於薑芋矣吾鄉土瘠每畝收稻麥不過數石而芋則每畝二十餘石多者三十餘石薑之下者二十餘石其上者至四十餘石然而種薑一畝有稻田六畝以上之工豈非糞多力勤之效乎考薑田營治之法其耕甚深在一尺以上通水溝雖止數寸而畦土斜殺而上種薑稜背相距空間與稜背略相等是亦空一行種一行也即區種之遺法也薑田惟空直行而區田復空橫行是其功又倍於薑田也多收之數又何疑焉又考遂寧王灼晦叔糖霜譜蔗田亦云區種而其深耕摩勞開渠濶尺深尺五及今年為蔗田明年改種五榖以休地諸法並同薑田又按區田每區方一尺五寸賈氏説又有方深各六寸及方九寸深六寸諸法蓋欲於城上斜坡立區故為此製若平田亦可變通畸零法解乘法假如其處地畝被水所淹今涸出五分之四於中又有髙地居七分之四問若干答曰髙地為三十五之十六法用母乘母子乘子兩母五七相乘三十五為母兩子四四相乘十六為子乘得三十五之十六解曰分總地為五分而涸出居其四四又將此涸出之四分分為七分而髙地居其四若以總地分三十五分則髙地居其十六矣本法置實子五之四以法子七之四乘之得十六為實法母七為法除之得五之二又小分七之二為髙地然七除不盡當用通分法以小分母七通原分母五為三十五得數二通為十四加入之二共十六是三十五之十六也今不用七除其子而以七乘其母得數亦同母既七倍而子不動是七之一也故乘母即同除子以數明之設原數三千五百畝內涸出五之四是二千八百畝也以此二千八百畝分為七分而髙地居其四是一千六百畝也則髙地於原數為三十五之十六矣又假如有米一宗內分七之四於預備倉收貯又於預備倉內取五之四先給賑荒問若干答曰三十五之一十六法見前解曰分總米為七分而預備倉得其四又分預備倉米為五分而先給賑濟者得其四若以總米分為三十五分則先給賑濟者得其十六本法置實七之四以法子之四乘之得一十六為實法母五為法除之得三又五之一如法用通分以小分五通大分七為三十五又通得數三為十五加子一為十六即三十五之十六也今不用五除子而用五乘母即得三十五之十六省通分矣母乘得五倍則子為五之一以數明之設原米四千二百石分為七分而取其四為預備倉是二千四百石也預備倉米又分五分而取其四以給賑是一千九百二十石也若分原米為三十五分每分一百二十石則給賑米得十六分四千二百是三十五個一百二十石一千九百二十是十六個一百二十石故也又法法用倒位互除以代乘法以法子四除實母七得一七五為母以法母五除實子四得八為子乘得一七五之八各進位而倍之即三十五之十十六本法四乘五除今不以四乘其子而反以四除其母即得數同也母既改為四之一而子不動即子為四倍故除母可代乘子也然除法多有不盡不如母乘母子乘子為便還原畸零除法假如營兵奉裁五之一留五之四其所支月餉為某倉米七之四問未裁時月餉幾何答曰該支倉米七之五法用倒位互乘以當除法以法子之四乘實母七得二十八為母以法母五乘實子之四得二十為子除得二十八之二十約為七之五解曰兵奉裁留五之四其原額未裁則五之五也故其原支倉米亦必七之五乃四而增一之比例本法置實七之四以法母五乘之得七之二十為實以法子之四為法除之得七之五今不用四除其子而以四乘其母得數亦同母既四倍於原母而原子不動如四之一故乘母可代除子又法法以法母五除實母七得一四為母又以法子之四除實子之四得一為子除得一四之一約之亦得七之五此不用五乘其子而以五除其母得數亦同母既五除則為原母五之一而原子不動如五倍矣故除母可當乘子論曰以上三法所得並同然倒位乘尤妙蓋以乘代除則無畸零不盡之數故也以數明之設營兵三千其五之四則二千四百也倉米二千五百二十石其七之四則一千四百四十石也七之五則一千八百石也兵二千四百而給米一千四百四十石則兵三千當給一千八百石還原用倒位互除以代乘法法子四除實母二十八得七為母法母五除實子二十得四為子乘得七之四復合原數問倉米七之四可給營兵五之四若倉米全發給兵幾何答曰給兵五之七如法倒位以法子之四乘實母五得二十為母以法母七乘實子之四得二十八為子除得二十之二十八約為五之七子大於母收為一又五之二是可給原額兵而仍多五分之二也解曰原給倉米七之四而今全給七分是四分而增其三也故兵亦四分增三於五之四增五之三即為五之七本法置實之四以法母七乘之得五之二十八為實法子四為法除之得五之七今以四乘母代四除子與前條同以前數明之倉米二千五百二十石分為七分則每分三百六十石營兵三千分為五分則每分六百以倉米四分給兵四分是每米三百六十石給兵六百名也今倉米全給為三百六十石者七則兵為六百者亦七是四千二百名也除三千名滿原額淨多一千二百名之餉為五分之二以七除五不盡故不用又法厯算全書卷二十九
