body:
  text: 厯算全書卷十二宣城梅文鼎撰歲周地度合考考最髙行及歲餘古厯不知太陽有最髙之行郭太史時最髙卑正在二至難於窺測西厯自多祿某以來世有積測定最髙點每年東行四十五秒每太陽平行一度髙行七微半約八十年行天一度康熙庚申又改測每年行一分一秒十微最髙點進移二十八分故辛酉天正冬至最髙在未宫七度七分七秒每太陽平行一度髙行十微一四計五十八年十箇月六日竒行天一度此永年表之新率也但最髙之度既改而又自有行動則每年歲實小餘之數必不均齊夫治厯首務太陽而太陽重在盈縮爰舉歷年髙行及四正相距時日前後互核以驗歲實之消長髙行之遲速列為一卷亦可為後來考測之資云己未年最髙過夏至六度三十九分春分甲戌日申正二刻六分中距九十三日十二刻十二分夏至丁未日戌初三刻三分中距九十三日六十一刻秋分辛巳日午初初刻三分距本年春分一百八十六日七十三刻十二分中積八十九日四十五刻一分冬至庚戌日亥正一刻四分距本年夏至一百八十三日一十刻一分中積八十九日八分按最髙行為盈縮立差之主其行有序今己未最髙在夏至後六度三十九分而次年庚申即行至七度七分一年之內驟行二十八分必另有新測矣庚申年最髙過夏至七度七分按永年表所載者年前冬至之數七政厯所載本年夏至之數度分同春分己卯日亥正一刻十二分距己未秋分百七刻十八日四十五中積九十三日十一刻九分己未春分三刻六分百六十五日草三夏至癸丑日丑初初刻十二分距己未夏至三百六十五日草一刻九分中積九十三日六十一刻七分秋分丙戌日申正三刻四分距本年春分百八十六日七十三刻七分中積八十九日四十六刻十三分己未秋分三百六十五日二十三刻六分冬至丙辰日寅正二刻二分距巳未冬至三百六十五日草四刻十三分本年夏至一百八十三日一十三刻六分按最髙進移則夏至差而早冬至差而遲意者新測之冬至遲于先測耶又按歲餘二十四刻十三分于授時法得二千五百九十分必無是理其為改測無疑據向後數冬至距冬至春分距春分俱合得三百六十五日二十三刻四分或五分三分以較庚申歲實多一刻九分必為改測矣壬戌年最髙過夏至七度九分春分庚寅日巳正初刻六分中距九十三日十刻一十二分夏至癸亥日午正三刻三分距庚申夏至七百三十日四十六刻六分中距九十三日六十二刻九分秋分丁酉日寅正一刻十二分距本年春分一百八十六日七十三刻六分中距八十九日四十七刻冬至丙寅日申正初刻十二分距庚申冬至七百三十日四十六刻十分中距八十八日九十四刻十二分本年夏至一百八十三日十三刻九分癸亥年最髙過夏至七度十分春分乙未日申初三刻九分距壬戌春分三百六十五日二十三刻三分中距九十三日十刻十二分壬戌秋分一百七十分八日四十五刻十二夏至戊辰日酉正二刻六分距壬戌夏至三百六十五日二十三刻三分中距九十三日六十二刻九分壬戌冬至一百八十二日九刻九分秋分壬寅日己正一刻距本年春分一百八十六日七十三刻六分中距八十九日四十七刻一分壬戌秋分三百六十五日二十三刻三分冬至辛未日亥正初刻一分距壬戌冬至三百六十五日二十三刻四分中距八十八日九十四刻十二分本年夏至一百八十三日一十三刻十分甲子年最髙過夏至七度十一分春分庚午日亥初二刻十三分距癸亥秋分一百七十八日四十五刻十三分中距九十三日十刻十一分癸亥春分三百六十五日二十三刻四分夏至甲戌日子正一刻九分距癸亥夏至三百六十五日二十三刻三分中距九十三日六十二刻十分癸亥冬至一百八十二日九刻八分秋分丁未日申正初刻四分距本年春分一百八十六日七十三刻六分中距八十九日四十七刻一分癸亥秋分三百六十五日二十三刻四分冬至丁丑日寅初三刻五分距癸亥冬至三百六十五日二十三刻四分中距八十八日九十四刻十二分本年夏至一百八十三日十三刻十一分乙丑年最髙過夏至七度十二分春分丙午日寅初二刻二分距甲子秋分一百七十八日四十五刻十三分中距九十三日十刻九分甲子春分三百六十五日二十三刻四分夏至己卯日卯正初刻十一分距甲子夏至三百六十五日二十三刻二分中距九十三日六十二刻十二分冬至一百八十二日九刻六分秋分壬子日亥初三刻八分距本年春分一百八十六日七十三刻六分中距八十九日四十七刻二分冬至壬午日巳初二刻十分距甲子冬至三百六十五日二十三刻五分中距八十八日九十四刻十一分本年夏至一百八十三日十三刻十四分丙寅年最髙過夏至七度十三分春分辛亥日巳初一刻六分距乙丑秋分一百七十八日四十五刻十三分中距九十三日十刻八分春分三百六十五日二十三刻四分夏至甲申日午初三刻十四分距乙丑夏至三百六十五日二十三刻三分中距九十三日六十二刻十二分冬至一百八十二日九刻四分秋分戊午日寅初二刻十一分距本年春分一百八十六日七十三刻五分中距八十九日四十七刻四分冬至丁亥日申初二刻距乙丑冬至三百六十五日二十三刻六分中積八十八日九十四刻十分本年夏至一百八十三日十四刻一分按日行盈縮細考之則春分距夏至夏至距秋分雖皆縮厯而其縮亦不同秋分距冬至冬至距春分雖皆盈厯而其盈亦不同又且年年不同細求之則節節不同又細求之且日日不同矣其故何也蓋最髙一點不在夏至而在其後數度又且年年移此太陽盈縮之根而歲實所以有消長也甲子年春分庚子日亥初二刻十三分距癸亥年秋分一百七十八日四十五刻十三分距癸亥年春分三百六十五日二十三刻四分秋分丁未日申正初刻四分距春分一百八十六日七十三刻六分乙丑年春分丙午日寅初二刻二分距甲子年秋分一百七十八日四十五刻十三分距甲子年春分三百六十五日二十三刻四分秋分壬子日亥初三刻八分距本年春分一百八十六日七十三刻六分距甲子年秋分三百六十五日二十三刻四分丙寅年春分辛亥日巳初一刻六分距乙丑年秋分一百七十八日四十五刻十三分距乙丑年春分三百六十五日二十三刻四分秋分戊午日寅初二刻十一分距本年春分一百八十六日七十三刻五分距乙丑年秋分三百六十五日二十三刻三分以上二分定氣之距皆相同其春分至秋分日行最髙為縮厯多八日二十七刻八分惟丙寅年秋分早到一分只多八日二十七刻七分約之為八日二十七刻半按最髙半周多八日竒者非多八日也以較最卑半周故多八日竒若其本數只多四日有竒耳因最卑亦少四日竒故合之為八日竒熊䃪石乃謂本數多八日則所誤多矣假如乙丑秋分至丙寅秋分共三百六十五日草三刻三分半之該一百八十二日五十九刻九分而丙寅春分至秋分得一百八十六日七十三刻五分則多四日一十三刻十一分丙寅春分前距乙丑秋分得一百七十八日四十五刻十三分又少四日一十三刻十一分合計之則為八日二十七刻七分半周均𣲖各一百八十二日竒者謂之恆氣半周有盈縮者謂之定氣相差八日竒者乃兩半周定氣相較之數非一半周定氣與其恆氣自相較之數也甲子年春分庚子日亥初二刻十三分距癸亥春分三百六十五日二十三刻四分冬至丁丑日寅初三刻五分距癸亥冬至三百六十五日二十三刻四分乙丑年春分丙午日寅初二刻二分距前春分三百六十五日二十三刻四分冬至壬午日巳初二刻十分距前冬至三百六十五日二十三刻五分丙寅年春分辛亥日己初一刻六分距前春分三百六十五日二十三刻四分冬至丁亥日申初二刻距前冬至三百六十五日二十三刻五分右冬至之小餘皆草三刻五分或四分春分之小餘皆草三刻四分差一分以冬至論歲餘得授時萬分日法之二千四百三十半分大于消分八分法以小餘五分為實刻十五分為法除之得三之一以從刻共得二十三刻又三之一為實九十六刻為法除之得二四三五進四位得二千四百三十分強進四位者以萬乘也若以春分論歲餘得授時萬分日法之二千四百二十三分六亦大于消分一分六法以草三刻化三百四十五分并入四分得三百四十九分為實日法一千四百四十分為法除之得二四二三六進四位得二千四百二十三分半強按授時消分為不易之法今復有長者何耶西法最髙之點在兩至後數度歲歲東移故雖冬至亦有加減不得以恆為定也此是兩法中一大節目其法自回回厯即有之然了凡先生頗采用回回法而不知此熊䃪石先生親與西儒論厯而亦不言及何耶丁卯年高沖過冬至七度十四分春分丙辰日申初初刻十分距丙寅秋分一百七十八日四十五刻十四分中積九十三日十刻七分春分三百六十五日二十三刻四分夏至己丑日酉初三刻二分距丙寅夏至三百六十五日二十三刻三分中積九十三日六十二刻十三分冬至一百八十二日九刻二分秋分癸亥日己初二刻距本年春分一百八十六日七十三刻五分中積八十九日四十七刻四分丙寅秋分三百六十五日二十三刻四分冬至壬辰日亥初一刻四分距丙寅冬至三百六十五日二十三刻四分中積八十八日九十四刻十分本年夏至一百八十三日十四刻二分戊辰年髙沖過冬至七度十五分春分辛酉日戍正三刻十四分距丁卯秋分一百七十八日四十五刻十四分中積九十三日十刻六分春分三百六十五日二十三刻四分夏至甲午日夜子初二刻五分距丁卯夏至三百六十五日二十三刻三分中積九十三日六十二刻十四分冬至一百八十二日九刻一分秋分戊辰日申初一刻四分距本年春分一百八十六日七十三刻五分中積八十九日四十七刻六分丁卯秋分三百六十五日二十三刻四分冬至戊戌日寅初初刻十分距丁卯冬至三百六十五日二十三刻六分中積八十八日九十四刻七分本年夏至一百八十三日十四刻五分己巳年髙沖過冬至七度十六分春分丁卯日丑正三刻二分距戊辰秋分一百七十八日四十五刻十三分中距九十三日十刻六分春分三百六十五日二十三刻三分夏至庚子日卯初一刻八分距戊辰夏至三百六十五日二十三刻三分中積九十三日六十三刻冬至一百八十二日八刻十三分秋分癸酉日亥初初刻八分距本年春分一百八十六日七十三刻六分中積八十九日四十七刻六分戊辰秋分三百六十五日二十三刻四分冬至癸卯日辰正三刻十四分距戊辰冬至三百六十五日二十三刻四分中積八十八日九十四刻八分本年夏至一百八十三日十四刻六分庚午年髙沖過冬至七度十七分春分壬申日辰正二刻七分距己巳秋分一百七十八日四十五刻十四分中積九十三日十刻四分春分三百六十五日草三刻五分夏至乙巳日午初初刻十一分距己巳夏至三百六十五日二十三刻三分中積九十三日六十三刻冬至一百八十二日八刻十二分秋分己卯日丑正三刻十一分距本年春分一百八十六日七十三刻四分中積八十九日四十七刻七分己巳秋分二百六十五日草三刻三分冬至戊申日未正三刻三分距己巳冬至三百六十五日草三刻四分中積八十八日九十四刻七分本年夏至一百八十三日十四刻七分辛未年髙沖過冬至七度十八分春分丁丑日未正一刻十分距庚午秋分一百七十八日四十五刻十四中積九十三日十刻三分分日春分三百六十五草三刻三分夏至庚戌日申正三刻三十分距庚午夏至三百六十五日二十三刻二分中積九十三日六十三刻二分冬至一百八十二日八刻十分秋分甲申日辰正三刻距本年春分一百八十六日七十三刻五分中積八十九日四十七刻七分庚午秋分二百六十五日草三刻四分冬至癸丑日戌正二刻七分距庚午冬至三百六十五日草三刻四分本年夏至一百八十三日十四刻九分按庚申年夏至至冬至一百八十三日十三刻六分辛未年夏至至冬至一百八十三日十四刻九分十二年中共長一刻三分中積只十一年壬戌年冬至至次年夏至一百八十二日九刻九分庚午年冬至至次年夏至一百八十二日八刻十分九年中共消十四分中積共只八年又合計癸亥夏至前半周一百八十二日九刻九分冬至前半周一百八十三日十三刻十分相較一日四刻一分辛未夏至前半周一百八十二日八刻十分冬至前半周一百八十三日十四刻九分相較一日五刻十四分八年中較數增一刻十三分然二分之相距則無甚差何也蓋最髙移而東則夏至後多占最髙之度而減度加時之數益多故益長髙沖移而東則冬至後多占最卑之度而加度減時之數益多故益消其近二至處皆為加減差最大之處故消長之較已極也乃若二分與中距雖亦歲移而中距皆為平度不係加減其最髙前後視行小之度固全在春分後半周最髙沖前後視行大之度亦全在春分後半周毫無動移故無甚消長也西國月日考考回國聖人辭世年月回國聖人辭世年月據西域齋期江寧至鴻堂刻單以康熙庚午五月初三日起是彼中第九月一日謂之勒墨藏一名阿咱而月也至六月初三日開齋是彼中第十月一日謂之紹哇勒一名答亦月是為大節再過一百日至九月十三日為彼中第一月第十日謂之穆哈蘭一名法而幹而丁月其日為阿叔喇濟貧之期謂之小節鼎嘗以回回厯法推算本年白羊一日入第六月之第八日與此正合又據齋期云本年庚午聖人辭世共計一千九十六年此太陽年考本單開聖人生死二忌在本年十一月十四日在彼為第三月謂之勒必歐勒傲勿勒又名虎而達查西域阿刺必年是開皇己未距今康熙為一千九十二算減一為一千九十一乃開皇己未春分至今康熙庚午春分之積年又查己未年春分在彼中為太陰年之第十二月初五日以距算一千九十一減聖人辭世千九十六相差五年逆推之得開皇十四年甲寅為聖人辭世之年約計甲寅至己未此五年中節氣與月分差閏五十五日甲寅春分當在彼中第十月之初聖人辭世既是第三月則在春分月前七個月為處暑月即今七月也自開皇甲寅七月十四日聖人辭世至今康熙庚午七月十四日正得一千九十六年故曰共計一千九十六年也據此則開皇甲寅是彼中聖人辭世之年薛儀甫謂為回回厯蓋以此而誤又按聖人以第三月辭世而其年春分則在第十月今彼以第十月一日為大節蓋為此也考泰西天主降生年月據天地儀書耶蘇降生至崇禎庚辰一千六百四十年算至康熙庚午一千六百九十年查康熙戊辰年瞻禮單誕辰在冬至後四日日躔箕宿七度逆推漢哀帝庚申約差草四度則是當時冬至在斗宿之末約計耶蘇降生在冬至前二十餘日為小雪後四五日也自哀帝庚申十月算至隋開皇甲寅七月望回回教聖人馬哈木德辭世實計五百九十四年不足兩箇多月考厯書所紀西國年月萬厯十二年甲申西九月十五日日躔夀星二度又十三年乙酉西九月草八日日躔夀星十五度半萬厯十四年丙戌西十月闕日日躔夀星二十九度又十五年丁亥西十月草六日日躔大火十二度太萬厯十六年戊子西十一月初八日日躔大火二十六度太又十七年己丑西十一月草二日日躔析木十一度弱萬厯十八年庚寅西十二月初六日日躔析木草五度又十九年辛卯西十二月草一日日躔星紀九度萬厯二十三年乙未西正月三十日日躔玄枵草一度萬厯三十五年丁未西七月初九日日躔鶉首草六度五三又三十七年己酉西七月草一日日躔鶉火八度半萬厯三十八年庚戍西八月初二日日躔鶉火二十度又三十九年辛亥西八月十五日日躔鶉尾二度按此所紀皆是以日躔星紀二十度為正月初一日析木二十度或十九度為十二月朔大火十九度或二十度為十一月朔夀星十八度為十月朔鶉尾十八度為九月朔鶉火十九度或十八度為八月朔鶉尾十八度為七月朔此亦約略之算細求之尚有太陽盈縮又正德九年甲戌西五月初五日子正前日躔大梁二十二度四十分是以大梁十九度為五月朔所測在子正前西厯紀日月午正故曰十九度正德十五年庚辰西四月三十日日躔大梁十七度四八是以降婁十九度為四月朔又本年七月十三日日躔鶉火初度是以鶉首十八度為七月朔嘉靖二年癸未西十一月草九日日躔析木十五度五四是以大火十八度為十一月朔嘉靖六年丁亥西十月初十日日躔夀星草七度是以夀星十八度為十月朔嘉靖八年己丑西二月初一日日躔玄枵草一度是以玄􅑎草一度為二月朔萬厯十年壬午西二月草六日申初二刻日躔娵訾十七度四十九分四二是以玄枵草二度為二月朔萬厯十一年癸未西九月初六日日躔鶉尾草三度是以鶉尾十八度為九月朔萬厯十四年丙戌西十二月草六日申初二刻太陽在星紀宫十四度五十一分五三是以析木十九度為十二月朔萬厯十六年戊子西十二月十五日巳初刻太陽在星紀三度五十三分是以析本十九度為十二月朔萬厯十八年庚寅西二月初八日午正後三十四刻太陽視行在娵訾初四十秒是以玄枵草三度為二月朔又本年九月初七日子正日躔鶉尾二十四度據此初一日鶉尾十八度萬厯草一年癸巳西八月初十日日躔鶉火草七度是以鶉火十八度為八月朔又漢順帝永建二年丁卯西三月草六日酉正太陽在降婁一度十三分是以娵訾七度為三月朔順帝陽嘉二年癸酉西六月初三日申正太陽在實沈九度四十分是以實沈七度為六月朔順帝永和元年丙子西七月初八日午正太陽在鶉首十四度十四分是以鶉首七度為七月朔又本年西八月三十一日九月初一太陽在鶉尾七度順帝永和二年丁丑西十月初八日太陽在夀星十四度是以夀星七度為十月朔順帝永和三年戊寅西十二月草二日子正前四時日躔析木九度十五分據此初一日是大火八度當是十一月非十二月順帝陽嘉二年癸酉西五月十七十八日太陽在大梁二十三度據此五月朔大梁七度按自漢順帝永建丁卯為總積四千八百四十年至明萬厯十二年甲申為總積六千二百九十七年相距一千四百五十七年相差十二三度即歲差之行也漢時月朔俱在各宫七八度之間萬厯間月朔俱在各宫之十八九度或草一二度據此論之則西厯太陽年用恆星有定度其恆星節氣雖從歲差西行而每月之日次則以太陽到恆星某度為定千古不變也想西古厯法只是候中星每年某星到正中即是某月又按此法于歲差之理甚明但欲敬授民時則不如用節氣為妥天經或問欲以冬至日為第一月第一日可以免閏又可授時謂本于方無可先生然沈氏筆談已先有其説矣今查瞻禮單康熙丁卯年正月十八丁酉日應西厯三月初一日亥宫十度二十六分危十一度二三二月二十戊辰日應西厯四月初一日戌宫十一度十三分壁六度二三二月二十戊戌日應西厯五月初一日酉宫十度二十九分婁十度五三四月草二己巳日應西厯六月初一日申一十度十五分畢六度九分五月草二己亥日應西厯七月初一日未八度四十九分井七度五一六月草四庚午日應西厯八月初一日午八度二十一分柳二度二二七月草五辛丑日應西厯九月初一日巳八度一十分張六度四八八月草五辛未日應西厯十月初一日辰七度三十分軫一度四九月草七壬寅日應西厯十一月初一日卯八度二十二分亢八度一八十月草七壬申日應西厯十二月初一日寅八度四二心五度一八十一月草八癸卯日應西厯正月初一日丑十度二十分斗四度二六十二月三十甲戌日應西厯二月初一日子十一度五十六分女四度三據此則西國厯日是以建子之月為正月也其法不論太隂之晦朔只以太陽為主然又不論節氣但以太陽到斗宿四度為正月一日耳又其數與新法厯書所載不同豈彼國亦有改憲耶按西厯以午正紀日則以上宿度宜各加三十分依此推之歐羅巴之正月一日在斗宿五度新法厯書萬厯二十三年乙未西正月三十日太陽在玄枵草一度于時日行盈厯逆推初一日是星紀草一度以歲差考之萬厯乙未至今丁卯距九十二年計差一度半弱其時星紀草一度是斗十四度二法相較差十度必是改憲抑彼有多國各一其法耶又按今之斗四度是星紀十度逆推前此六百六十餘年則正是冬至日太陽所躔之度也當此北宋之初瞻禮單必是此時所定若厯書所載斗十四度則又在其前六百六十年距今丁卯共有一千三百二十餘年當在漢時蓋其時冬至日躔斗十四度故以為歲首意者厯書所載故是古法而瞻禮單所定乃是新率耶由是觀之則耶蘇新教之起必不大逺又按西法以白羊宫初度為測算之端而紀月又首磨羯何耶曰測算論節氣是以太陽之緯度為主紀月論恆星是以太陽之經度為主故也地度弧角地度求斜距法有兩處北極髙度又有兩處相距之經度而求兩地相距之里數甲乙丙為赤道象弧丁為極丁角之度為甲乙戊甲距四十五度甲乙十度半即經度之距亦即丁角巳乙距四十度求戊巳之距法作戊庚丙象弧斜交于赤先求庚乙距以減巳乙得庚巳邊又求戊庚邊求庚角成戊庚巳小三角弧算戊庚巳小三角先有一角庚兩邊一戊庚邊一已庚邊而求已戊邊法先作已辛垂弧截出戊辛邊并求戊角因得巳戊邊乃以度變成里此所得即大度若距赤同度則但以距赤道餘弦求其比例得里數一率全二率距赤餘弦三率大度里數二百五十里四率緯圈里數如距赤四十五度依法算得離赤道四十五度之地每一度該一百七十六里二百八十步如東西相距二十七度該四千七百七十二里三百五十步弱論曰地有距赤緯度又有東西經度經度如句緯度相減之餘如股兩地斜距如弦既有句有股可以求弦而不可以句股法求者地圓故也又論曰此為一角兩邊而角在兩邊之中法當用斜弧三角法求其對角一邊之度變為里即里數也或用垂線分形法並同補論曰已點或在庚上或在其下其用庚角並同但在下則當于庚乙內減巳乙而得己庚以里數求經度法或先有兩地相距之里數而不知經度法先求兩處北極髙度乃以兩髙度之餘為兩邊及相距里數變成度用二百五十里大度又為一邊成弧三角形乃以三邊求角法求其對里數邊之一角即經度也論曰凡地經度原以月食時取其時刻差以為東西相距然月食歲不數見又必多人兩地同測始能得之况月天最近有氣刻時三差及朦影之改變髙度非精于測者不易得凖今以里數求之較有把握得此法與月食法相參伍庶幾無誤凡以里數論差當取徑直若遇山林水澤峻嶺回谷則以測量法求其折算之數而取直焉不但左右不宜旋繞曲折斯謂之直即髙下若干亦須用法取平若兩地極髙同度則但以距赤道餘弦即極髙度正弦求其比例得經度一率距赤度餘弦二率全數三率里數所變之度用二百五十里為度四率相應之經度緯圈經度也與赤道大圈相應但里數小耳論曰北極髙度雖有凖則然近在數十里內所爭在分秒之間亦無大差今以里數凖之則當以正東西為主如自東至西之路合羅金卯酉中線斯為正度若稍偏側亦當以斜度改平然後算之視極髙度反似的確里差考時憲厯各省太陽出入晝夜時刻京師三十九度五十五分夏至晝五十九刻七分夜三十六刻八分盛京四十二度天問略無六十刻四分三十五刻十一分山西三十八度五十八刻八分三十七刻七分山東朝鮮三十六度五十七刻十三分三十八刻二分河南陜西三十竒四度五十七刻一分三十八刻十四分江南三十二度半五十六刻六分三十九刻九分湖廣三十一度五十六刻二分三十九刻十三分四川三十度五十五刻十一分四十刻四分浙江草九度江西二十九度五十五刻七分四十刻八分福建廣西二十七度五十四刻十二分四十一刻三分貴州二十五度五十四刻四分四十一刻十一分雲南二十四度五十四刻四十二刻廣東二十三度半五十三刻十一分四十二刻四分此據壬申年厯日數也其刻數與天問略同者京師江南湖廣浙江江西雲南廣東也刻分同則極髙確矣山西天問略長五十八刻六分今八分是所差不多或字畫誤也其極髙三十八度應亦無訛山東天問略長五十八刻四分今只五十七刻十三分是極髙原測三十七度後改測三十六度也時憲厯各省節氣時刻以京師為主在東者加在西者減每加減四分為經度一度朝鮮加二刻十分盛京加二刻浙江福建加十二分江南加八分山東加五分以上地在京師之東皆加江西減十分河南湖廣減一刻廣東山西減一刻五分廣西陜西減二刻四分貴州減二刻八分四川減三刻七分雲南減四刻八分以上地皆在京師之西皆減天象同時並見而在東者早見日故其刻分加在西者遲見日故其刻分減假如京師正午時太陽在午線而居東者已見其過午矣故加居西者方見其將午到而猶未正午也故減陜西天問略長五十七刻十三分今只五十七刻一分是極高原測三十六度後改測三十四度奇也河南天問略長五十七刻七分今只五十七刻一分是極高原測三十五度後改測三十四奇也褔建天問略長五十四刻八分今有五十四刻十二分是極高原測二十六度後改測二十七度也廣西天問略長五十四刻四分今亦五十四刻十二分是極髙原測二十五度後改測二十七度也貴州天問略長五十四刻今有五十四刻四分是極髙原測二十四度半後改測二十五度也天問略四川極髙二十九度半江西二十九度南北緯度以北極髙下定東西經度以月食時刻定地在東一度則見食早其差為十五分刻之四節朔同地在北則晝夜差多南則漸平仰規覆矩以里差赤緯為用一查地平經度為日出入方位一查赤道經度為日出入時刻約法求每日出入地平廣度春分至秋分在正卯酉北秋分至春分在正卯酉南一率大員半徑二率極髙度割線三率赤道緯度正弦四率日出入卯酉正弦地平經度求每日晝刻長短春分至秋分加秋分至春分減皆加減半晝二十四刻為半晝刻一率大員半徑二率極髙度切線三率赤道緯度切線四率日出入加減度正弦赤道經度以變時刻為加減之用求二至日出地廣度圖廣者地平經度距正卯酉也即日出入方位舉二至為例餘日皆以赤緯定之已丙極髙度即甲角之弧亦即乙甲丁之餘弧乙丁為夏至日距赤道之緯即壬辛其正弧辰乙即卯甲今求乙甲為夏至日出地平之廣冬至同廣但夏至在卯酉北冬至在正卯酉南逐日赤緯皆可以此法求之得逐日出地之廣用甲乙丁弧三角形法為丙戊正弦與丙甲半徑若乙丁之正弦乙辰與乙甲也乙甲即正弦庚丙戊正弦即北極髙度之餘弦甲也以丙甲戊角即巳甲丙之餘角或用乙甲卯句股形則為庚甲餘弦巳甲丙角之餘弦與巳甲半徑若壬辛之正弦卯甲與乙甲也末皆以乙甲查正弦表得弧為出地之廣壬辛之正弦壬未與乙辰卯甲同大即知乙丁與壬辛亦同大而卯甲之弧亦與壬辛同大而今以直視竟成正弦捷法以比例尺取丙甲半徑於正弦線之九十度定尺乃以乙甲正弦取對度得弧命為出地之廣法曰半徑與北極出地之割線若赤道緯度正弦與地平出入經度距正卯酉之正弦也此圖已為南極甲乙為冬至日出入之廣卯乙為冬至日軌所減於半晝之度與前圖同理量法從乙作直立線與午甲平行至戌得戌午弧即乙星出入地平距正卯酉經度大圈即子午規側望之形故午甲線即正卯酉求時刻法若欲知卯乙在距等圈之度法以卯為心癸若壬為界作半圈次從卯心出半徑直線至乾平分半員成象限末於乙出線與卯乾半徑平行至象限弧止為乙坎則其所分坎乾之弧即卯乙在距等圈之度此度與甲丁赤道度相應可以知所歷時刻矣或用比例尺以癸卯即赤緯餘弦為距等半徑加正弦線九十度定尺乃以卯乙取對度得弧又算法求時刻加減度謂逐日時刻所加減於半晝二十四刻之數春分後加秋分後減皆以度變時用前圖巳甲乙斜弧三角形有甲角極出地度有巳甲邊九十度有巳乙邊赤緯之餘按用斜弧法厯書未有求巳角其弧甲丁赤道經度用查時刻法為半徑丙甲與甲角之切線酉丙若已乙之餘切亥丁乙丁為巳乙之餘弦故也實即赤緯之正切也與已角之正弦甲丁甲丁即弧即正弦以直視故弧線變為直線用法以甲丁查正弦表得角度右即夏至卯酉前後日行地平上之赤道度以距等圈上之卯乙即赤道上之甲丁以甲丁度化時即得本地卯正前酉正後所多之刻冬至日卯後酉前所減之度及其時刻並同逐日求之可列表求乙甲邊地平經度查日出方位此為求出地平之廣與前算法並同但用斜弧形故其名頓易法為半徑丙甲與極出地甲角之割線酉甲若已乙之餘弦乙辰與乙甲邊乙甲亦即邊即正弦末以乙甲邊查正弦表得乙甲邊之度厯算全書卷十二
