body:
  text: 厯算全書卷二十一宣城梅文鼎撰厯學騈枝卷一大統厯歩氣朔用數目錄元世祖至元十七年辛巳嵗前天正冬至為厯元按古厯並溯太古為元各立積年未免牽合故乆而多差惟授時厯不用積年截用至元辛巳為元一慿實測而無假借故自元迄明承用三四百年法無大差以視漢晉唐宋之屢改屢差不啻霄壤故曰授時厯集諸家大成盖自西厯以前未有精於授時者徐文定公厯書亦截崇禎戊辰為元而廢積年用此法也又按大統厯以洪武甲子為元然易其名不易其實故臺官布算仍用至元辛巳也周天三百六十五萬二千五百七十五分半周一百八十二萬六千二百八十七分半天體渾員自角初度順數至軫末度得周天度分均剖之即半周天按天本無度因日躔而有度古厯代更天度異測授時厯用簡儀實測當時度分視古為密度法一萬分按古厯以日法命度並有畸零如太初厯以八十一分為日法大衍厯以三千四百分為日法而度法因之亦有畸零惟授時厯不用日法故一度即為一萬分而周天三百六十五度二五七五分即命為三百六十五萬二千五百七十五分此王郭諸公之卓見超越千古也又按授時厯周天百年長一今大統不用此其與授時㣲異者也嵗周三百六十五萬二千四百二十五分嵗周一名嵗實自今嵗冬至數至來嵗冬至得此日數實不及周天一百五十分而嵗差生焉半嵗周一百八十二萬六千二百一十二分半均剖嵗周也自天正冬至算至本年夏至又自本年夏至數至本年冬至其日數並同氣䇿一十五萬二千一百八十四分三十七秒半置嵗周日數以二十四氣平分之得此日數謂之恒氣日周一萬分自今日子正至來日子正共得此數刻法一百分毎日百刻故也旬周六十分自甲子至癸亥六十日之積分紀法六十日即旬周也按日周一萬分乃整齊之數故旬周亦整六十日也太陽行天每日一度前云度法萬分者亦以此也並以整萬分立算而無畸零故曰不用日法也又按授時厯嵗周上考已往百年長一分下推將來百年消一分大統省不用故不言也通餘五萬二千四百二十五分置嵗周減六旬周得餘此數即五日二十四刻二十五分乃一年三百六十日常數外之餘日餘分氣應五十五萬千六百分此授時厯所用至元辛巳天正冬至為元之日時也是為己未日丑初一刻乃實測當時恒氣之應上考已往下求將來並距此立算以此為根也其數自甲子日子正初刻算至戊午日夜子初四刻得五十五日又自己未日子正初刻算至丑初一刻得六刻合之為五十五萬零六百分嵗䇿三百五十四萬三千六百七十一分一十六秒此十二朔策之積也自今年正月經朔至來年正月經朔得此積分或置嵗實内減嵗閏亦同朔䇿二十九萬五千三百五分九十三秒此太隂與太陽合朔常數乃晦朔弦朢一周也自本月經朔至次月經朔得此積分又謂之朔實乃十二分嵗䇿之一朢䇿一十四萬七千六百五十二分九十六秒半此朔䇿之半乃二十四分嵗䇿之一自經朔至經朢又自經朢至次月經朔並得此數又謂之交朢弦䇿七日三千八百二十六分四十八秒二五此朢策之半乃四分朔策之一自經朔至上弦又自上弦至經朢又自經朢至下弦至次月經朔其數並同月閏九千百六十二分八十二秒此一月兩恒氣與一經朔相差之數置氣䇿倍之得三十萬四千六十八分七十五秒内減朔䇿得之嵗閏一十萬八千七百五十三分八十四秒此十二箇月閏之積也亦名通閏閏應二十萬二千百五十分此至元辛巳為元之天正閏餘也盖即己未冬至去經朔之數當時實測得辛巳嵗前天正經朔是三十四萬八千五百五十分即至元庚辰年十一月經朔為戊戌日八十五刻半為戌正二刻也閏凖一十八萬六千五百五十二分九秒置朔䇿内減嵗閏得之盈初縮末限八十八日九千百九十二分二十五秒此冬至前後日行天一象限之日數盖冬至前後一象限太陽每日之行過於一度故也四分嵗周所行度得九十一度三一六二五為一象限縮初盈末限九十三日七千一百二十分二十五秒此夏至前後日行天一象限之日數也盖夏至前後一象限太陽毎日之行不及一度故也按盈初者定氣冬至距定氣春分之日數縮末者定氣秋分距定氣冬至之日數也此兩限者並以八十八日九十一刻稍弱而行天一象限縮初者定氣夏至距定氣秋分日數盈末者定氣春分距定氣夏至日數也此兩限者並以九十三日七十一刻有奇而行天一象限今現行時憲厯節氣有長短即此法也又按古厯每日行一度原無盈縮言盈縮者自北齊張子信始也厥後隋劉焯唐李淳風僧一行言之綦詳厯宋至元為法益密然不以之註厯者為閏月也大衍厯議曰以恒氣注厯定氣算日月食由今以觀無處不用但每月中節仍用恒氣不似西洋之用定氣耳西洋原無閏月祇有閏日故以定氣註厯為便若中土之法以無中氣為閏月故以恒氣註厯為宜治西法者不諳比氣輒訶古法為不知盈縮固其所矣轉終二十七萬五千五百四十六分此月行遲疾一周之日數也内分四限入轉初日太隂行最疾積至六日八十餘刻而復於平行謂之疾初限厥後行漸遲積至十三日七十七刻奇而其遲乃極謂之疾未限於是太隂又自最遲以復於平行亦六日八十餘刻謂之遲初限厥後行又漸疾亦積至十三日七十七刻奇其疾乃極如初日矣謂之遲末限合而言之共二十七日五十五刻四十六分而遲疾一周謂之轉終也轉中一十三萬七千七百七十三分即轉終之半解見上文轉其數一名小中轉差一萬九千七百五十九分九十三秒置朔策内減轉終得之乃相近兩經朔入轉之相差日數也轉應一十三萬千二百五分此至元辛巳天正冬至日入轉日數也盖實測得冬至己未日丑初一刻太隂之行在疾末限之末日也交終二十七日二千一百二十二分二十四秒此太隂出入黄道陽厯隂厯一周之日數也交差二日三千一百八十三分六十九秒置朔䇿内減交終得之乃相近兩經朔入交之相差日數也交應二十六萬千三百八十八分此至元辛巳天正冬至入交泛日也乃實測冬至己未日丑初一刻月過正交日數氣盈日二千一百八十四分三十七秒半此氣策内減十五整日外餘此數一月兩恒氣共盈四千三百六十八分七十五秒朔虚日四千六百九十四分七秒置三十日内減朔策得之乃一朔䇿少於常數三十日之數沒限日七千八百一十五分六十二秒半置日周一萬内減氣盈得之土王䇿一十二日一千七百四十七分五十秒又土王䇿三日千四百三十六分八十七秒半按土王䇿一名貞䇿置嵗實以五除之得七十三日四八五為一嵗中五行分王之日數又為實以四除之得一十八日二六二一二五為每季中土王日數内減氣䇿得餘三日四三六八七五為土王䇿乃自辰戌丑未四季月中氣日逆推之數土王䇿四因之得十二日一七四七五亦為土王䇿乃自四季月節氣日順數之數二者只須用一今並存者所以相考也宿會二十四萬宿餘分一萬五千三百五分九十三秒日直宿二十八日一周是為宿會以宿會減朔實得宿餘限䇿九十限六八三八六五置弦䇿以十二限二十分乘之得此數故以全加得次限限總一百六十八限八三六一名中限置小轉中以十二限二十分乘之得此數故限䇿加滿則用以全減朔轉限䇿二十四限一七一一四六置轉差以十二限二十分乘之得此數故以全加得次朔限按以上三者為求遲疾限之捷法然可不用盖既有日率相減之法則十二限二十分乘之法已為筌蹄何况限䇿盈䇿六十九萬六千六百九十五分二十八秒置氣盈分為實以氣䇿除之得毎日盈一百四十三分五三四七七五轉用為法以除日周得每六十九日六六九五二八而盈一日是為盈䇿故以加盈日即得次盈虚䇿六十二萬九千一百四分二十二秒置朔虚分以朔䇿除之得毎日虚一百五十八分九五六一七一轉用為法以除日周得六十二日九一四二二而虚一日是為虚䇿故以加虛日即得次虛大統厯歩氣朔法求中積分置嵗實三百六十五萬二千四百二十五分為實以距至元辛巳為元之積年減一為法乘之即得其年中積分定數以嵗實定六子以積年視有十年定一子百年定二子乘法言十加定一子得數後共以八子約之為億也如徑求次年中積分者加一嵗實即可得之中積分者自所求年天正冬至逆推至辛巳為元之天正冬至中間所有之積日積分也積年減一者以嵗前天正冬至為立算之根故也假如康熈元年壬寅距至元十七年辛巳該三百八十二算法祗以三百八十一年入算是為減一用之也盖欲算本年之氣朔必以年前天正冬至為根是所求康熈壬寅年之中積分乃順治辛丑年十一月冬至之數故也定子法者為珠算定位設也其法十定一子百定二子千定三子萬定四子十萬定五子百萬定六子千萬定七子億萬定八子嵗實首位是三百萬故定六子積年有十定一有百定二皆一法也言十加定一子者以乘法首位言之凡法首位與實首位相呼九九數有言十之句則得數進一位故加定一子此條原文缺此句余所補也得數以八子約之為億者謂視原定之子若有八子則乘得數首位是億也未乘之先視法實之數以定子故既乘之後即據所定之子以定得數此法最便初學也附嵗實鈐千百十萬一三六五二四二五凡用鈐自單年起有二七三四八五十年則進一位用之三一九五七二七五有百年又進一位即四一四六九七得所求中積分並以五一八二六二一二五單年無定之位推而六二一九一四五五上之即算位俱定七二五五六六九七五八二九二一九四九三二八七一八二五求通積分置所得其年中積全分加氣應五十五萬千六百分即得所求通積分如徑求次年亦加嵗實前推中積分是從辛巳厯元天正冬至起算今加氣應是又從辛巳厯元冬至前五十五日六刻起即甲子日子正初刻也求天正冬至置通積全分滿紀法六十萬去之餘為所求天正冬至分也萬以上命起甲子算外為冬至日辰欲求時刻依發斂加時條求之見後如逕求次年者不拘有無閏月並加通餘五萬二四二五滿紀法去之即得通積分既從甲子起算故滿紀法去之即知日辰也算外命日辰者以有小餘也凡滿萬分成一日者為大餘九千分以下皆為小餘大餘為日乃先一日之數小餘為時刻乃為本日故取算外也求天正閏餘分置其年中積全分如閏應二十萬二千百五十分為閏積以滿朔實二十九萬五千三百五分九十三秒除之為積月其不滿者即為所求年天正閏餘分也閏餘分滿閏凖一十八萬六五五二九者其年有閏月補法閏餘滿十六萬八四二六四五以上者其年冇閏如用閏凖須加兩月閏如逕求次年天正閏餘者不拘有無閏月並加通閏一十萬八七五三八四滿朔策去之即得如却求前嵗閏者置本年閏餘内減通閏得之閏餘小于通閏不及減加朔實減之即是閏餘分者乃嵗前天正冬至距天正經朔數也法當自辛巳厯元天正經朔起算故以閏應通之也閏凖是朔實内去十二箇月閏之數若閏其年十一二月者此法不能御故有補法也若於所得閏餘分加一萬八千一百二十五分六四兩月閏之數再用閏凖取之亦同附經朔鈐百十萬一二九五三五九三閏積内與經朔鈐數二五九六一一八六同者減去之減至不三八八五九一七七九滿一朔實二十九萬四一一八一二二三七二五三五九三而止五一四七六五二九六五其餘數即閏餘分六一七七一八三五五八七二六七一四一五一八二三六二四四七四四九二六五七七五三三七求天正經朔置其年通積全分内減去其年閏餘全分滿紀法六十萬去之餘為所求天正經朔分又法置冬至内減閏餘即得經朔如冬至小于閏餘不及減加紀法六十萬減之如逕求次年天正經朔者無閏加五十四萬三六七一一六十二朔實去紀法之數有閏加二十三萬八九七七九十三朔實去紀法之數並滿紀法去之即得朔者日月同度之日經者常也經朔者朔之常數所以别于定朔也古人只用平朔故日蝕或在晦二唐以後始用定朔則蝕必於朔然不知經朔則定朔無根故必先求定朔先推通積分自厯元甲子日算至冬至減去閏餘是從甲子日算至經朔故去紀法即得經朔之大小餘也先推冬至分是以紀法減過通積而得乃冬至前甲子日距冬至數内減閏餘即為甲子日距經朔數也如冬至小于閏餘是此甲子日雖在冬至前却在經朔後故加紀法減之是又從經朔前甲子算起也求天正盈縮厯置半嵗周一百八十二日六二一二五内減去其年閏餘全分餘為所求天正縮厯也補法若其年冬至與經朔同日而冬至加時在經朔前則天正經朔入盈厯如逕求次年天正縮厯者内減去通閏一十萬八七五三八四得之減後視在一百五十三日九以下者再加一朔䇿即是按冬至交盈厯夏至交縮厯各得嵗周之半今置半嵗周是減去盈厯半周祇用縮厯半周從夏至日算至冬至日之數也内減閏餘即為從夏至算至十一月經朔日數故恒為縮厯亦有入盈厯者其前必有閏月而至朔同日冬至小餘又小于經朔小餘先交冬至後交經朔其經朔已入盈厯法當於經朔小餘内減去冬至小餘命其餘為天正盈厯也若冬至小餘大於經朔小餘不用此法盖雖至朔同日而朔在至前仍為縮厯此處原本所缺故備著之凡閏餘加通閏即為次年閏餘今所得天正縮厯是半周内減閏餘之數于中又減通閏即如減次年閏餘矣故逕得次年天正縮厯也一百五十三日九以下者半周内減一朔䇿也減後得此必有閏月在次年天正經朔前故必復加朔䇿而得次年天正朔厯也求天正遲疾厯置其年中積全分内加轉應一十三萬二五減去其年閏餘全分為實以轉終二十七萬五五四六為法除之其不滿轉終之數若在小轉中一十三日七七七三以下者就為所求天正疾厯也若在小轉中以上者内減去小轉中則為天正遲厯也如逕求次年天正遲疾厯者加二十三日七一一九一六十二轉差積數經閏再加轉差一日九七五九九三並滿轉終去之遲疾各仍其舊若滿小轉中去之者遲變疾疾變遲也中積分原從厯元冬至起算至所求天正冬至止今加轉應減閏餘是從厯元冬至前十三日初交疾厯時起算至所求年天正經朔止故不滿轉終即為天正疾厯也轉中者轉終之半故疾厯滿此即變遲厯也附轉終鈐百十萬一二七五五四六二五五一九二三八二六六三八四一一二一八四五一三七七七三六一六五三二七六七一九二八八二二八二二四三六八九二四七九九一四求天正入交泛日原本作交泛分今依厯經改定置中積減閏餘加交應二十六萬三八八為實以交終二十七萬二一二二二四為法除之其不滿交終之數即為所求天正入交泛日及分也如逕求次年天正入交日者無閏加六千百八二四十二交差内減去交終之數有閏加二萬九千二百六五七三十三交差内減去交終之數即得中積減閏餘與求遲疾法同加交應是從辛巳厯元前二十六日初入正交時算起也故不滿交終即為天正入交日也泛者對定而言也有經朔有定朔則入交之深淺亦從之而移此所得者經朔下數故别之曰泛附交終鈐百十萬一二七二一二二二四二五四四二四四四八三八一六三六六七二四一八八四八八九六五一三六六一一二六一六三二七三三四四七一九四八五五六八八二一七六九七七九二九二四四九一一六推經朔次氣及弦望法置天正經朔全分加五十九萬六一一八六即二朔䇿滿紀法六十萬去之為所求年正月經朔累加朔䇿二十九萬五千三百五九三為逐月經朔累至次年天正經朔必相同也次年天正經朔在本年為十一月復以朢䇿一十四萬七六五二九六五累加各月經朔得經朢又加之即得次月經朔復以弦䇿七萬三八二六四八二五累加經朔得上弦加上弦即復得經朢又加之得下弦又加之復得次月經朔凡累加時並滿紀法去之其復得數必與原推分秒不異或先加弦䇿次加朢䇿亦同前有逕求次年天正經朔法與此挨次累加之數互相參考即知無誤算法還原之理也以後並同推恒氣次氣法置天正冬至日及分加四十五萬六五五三一二五即三氣䇿滿紀法去之為所求年立春恒氣累加氣策一十五萬二一八四三七五滿紀法去之得各恒氣加至本年冬至即與前逕推次年天正冬至相同也附二十四恒氣鈐立春次年正月節五十萬八九七八一二五右鈐以加天正冬至滿紀法去之即逕得各月恒氣大小餘凡恒氣大餘命起甲子算外得日辰小餘命時刻依發斂加時條取之並同冬至法推盈縮厯次氣法置天正盈縮厯日及分加五十九萬六一一八六滿半嵗周一百八十二日六二一二五去之為所求年正月經朔下盈厯也累加朔䇿二十九萬五三五九三為逐月經朔盈厯也盈厯加滿半嵗周去之交縮厯又累加之滿半嵗周去之復交盈厯也累加至十一月即與次年天正盈縮厯相同復以弦䇿七萬三八二六四八二五累加之各得弦朢乃次朔之盈縮厯也至次朔亦必相同盈厯滿初限八十八日九九二二五為有末之盈縮厯滿初限九十三日七一二二五為有末之縮推初末限法置半嵗周一百八十二日六二一二五内減有末之盈縮厯全分餘為所求各末限日分也復於各盈縮末限日分累減弦䇿七萬三八二六四八二五得各弦朢及次朔下盈縮末限必相同也若不及減弦䇿者末限已盡盈交縮縮交盈也補法置弦䇿以不及減之餘末轉減之即各得所交盈縮初限日分相同也凡盈厯算起冬至縮厯算起夏至並從盈縮初日順推至所求日時若盈末則算起夏至縮末則算起冬至並從盈縮盡日逆推至所求日時故置半嵗周減之而得末限日分也所得末限日分是所求日時距盈縮末盡日逺近之數朔而弦朢入厯益深則其距末盡日益近故在初限累加弦䇿者在末限即用累減而得也推盈縮差法置盈縮厯全分若係末限則置所得末限全分減去大餘不用只用小餘有千分定三有百定二有十定一並以立成相同日數下取其盈縮加分為法乘之加分有百定二有十定一言十加定一子得數以所定八子約之為度位乃於立成取本日下所有盈縮積與得數相倂即得所求盈縮差凡言八子或九子約之為度者乃是於得數上定此虚位以便與盈縮積度相加非言得數有八子九子也假如八子為度位而原所定只有五子即得數為度下三位若盈縮積有度即度得數上第三位加之法於得數首位呼五字逆上數之曰五六七八至八字住於此加積度即無誤也遲疾厯同盈縮加分是本日太陽行度或過或不及于一度之分也或日行過于一度而有餘分是為盈加分或日行不過一度而有欠分是為縮加分盈縮積度則是本日以前加分累積之數也總計逐日盈加分為盈積度總計逐日縮加分為縮積度法當以小餘乘本日加分為實日周一萬分為法除之即得小餘時刻内所有之加分乃以得數倂入本日以前原有之積度則為本日本時之盈縮差矣厯經云萬約為分即是以日周一萬除乃本法也兹以定子法約之故以八子為度所得亦同假如以千乘百共定五子則所得乘數為十萬分就用為實以日周一萬為法除之當去四子剰一子則所得除數成十分是于度下為第三位也何以言之盖度下有千有百故十分為第三位今于所定五子虚進三位至八子位命為度以加積度即得數十分適居度下第三之位而相加無誤矣理前條八子命億而此以八子約為度何也曰無二也八子于乘得數原是億位盖億即一萬萬用萬萬為實以一萬為法除之當去四子剩四子則除後得數為萬而成度位今不去子故以八子為度其實即厯經萬約為分之法非有二也問初限是從盈縮初日順推盈初從冬至起算縮初從夏至起算並數其已過之日其小餘亦順推並自本日子正刻起順下丑寅數至所求時刻若末限則是從盈縮末盡日逆數盈末距夏至立算縮末距冬至立算皆數其未到之日其小餘亦逆數並自本日夜子初刻逆轉亥戌數至所求時刻而加分乘小餘加積度之法並無有異且盈縮互用盈末所用之加分積度即縮初之數縮末所用之加分積度即盈初之數何也曰凡初限所積之盈縮度分並為末限之所消假如盈初限共有積盈度二度四十分一交盈末即每日有所縮以消其積盈直至盈末盡日其盈消盡而交夏至為縮厯矣又如縮初限共有積縮度二度四十分一交縮末即每日有所盈以消其積縮直至縮未盡日其縮消盡而交冬至復為盈厯矣故同一加分也在初限為日增之分在末限則為日消之分假如盈末限未到夏至若干日與縮初限已過夏至之日數等則其日行度之所縮亦等故盈末日即用縮加分又如縮末日與盈初限之日數等則其距冬至等而日行之所盈亦等故縮末日即用盈加分同一積度也在初限為己積之度分若末限則為未消之度分假如盈末毎日内各有縮加分以消其盈而今盈末尚有若干日則其縮加分末用而積盈亦未消累而計之其數必與縮初限相同日數下之積度等故即用縮積度為盈積度也縮末即用盈積度為未消之縮積度其理亦同今末限既有小餘則此時刻内亦必有未消之零分在積度外故以小餘乘加分而萬約之即八子為度之法解已見前倂入積度即知此日此時尚有未經消盡之積度共若干度分而命之為盈縮差矣盈末日雖用縮加分縮積度取數而仍為盈差縮末日雖用盈加分盈積度取數而仍為縮差盖其加分積度為逐日之盈縮而盈縮差分是總計初日以來之盈縮故也推遲疾厯次氣法置天正遲疾厯日及分加三日九五一九八六兩轉差數為所求年正月經朔下遲疾厯也以後累加轉差即得各月經朔下遲疾厯也凡加後如滿小轉中一十三萬七七七三者去之疾變為遲遲變為疾不滿者遲疾不變累加至十一月即與次年天正遲疾厯相同也復以弦䇿七日三八二六四八二五累加之各得弦朢及次朔之遲疾厯亦滿小轉中去之變遲疾也本宜累加朔䇿而去轉終今用轉差是㨗法其得數同也附轉差鈐一一日九七五九九三用鈐加正月經朔下二三日九五一九八六遲疾厯可逕求各月三五日九二七九七九遲疾厯若加滿小轉四七日九三九七二中去之疾變遲遲變五九日八七九九六五疾也六十一日八五五九五八七日五四六五一自七箇月以後為減八二日三六四四過小轉中之後加後九四日六六三七即變遲疾若加滿小十五日九八二六三轉中去之反不變也十一七日九五八六二三十二九日九三四六一六推遲疾厯限數法置遲疾厯日及分十日定五單日定四日有千定三日千有百定二有十定一以十二限二十分定一為法乘之言十定一得數以所定有四子為單限五子為十限六子為百限即得各遲疾厯限數如逕求次弦朢之限數者如自朔求上弦自上弦求朢之類每加限䇿九十限即得加滿中限一百六十八限去之則變遲疾如超次月如以朔求次朔以上弦求次月上弦之類累轉加朔轉限䇿二十四限一即得亦滿中限去之而變遲疾如累加之至十箇月間有多一限乃二十分尾數積成故有退一限減之之法不必致疑皆以日率為定也遲疾分限數何也太隂行天有遲疾其遲疾又有初末與太陽之盈縮同所不同者太陽之盈縮以半嵗周分初末而其盈縮之度止于二度奇太隂之遲疾以十三日七十七刻奇分初末而其遲疾之度至于五度奇疾初只六日八十八刻奇而疾五度遲初只六日八十八刻奇而遲五度厯家以八百二十分為一限即八刻竒一日分十二限二十分而自朝至暮逐限之遲疾細分可得而求矣捷法以所得遲疾厯與立成中遲疾日率相較擇其相近者用之或所得遲疾厯日及分即立成内日率相同或稍强于日率即可取用即可逕得限數此法可免十二限乘亦即無退退一限減之之事余所補也推遲疾差法置遲疾厯日及分以立成内相同限下日率減之如立成日率大不及減即退一限減之用其餘分為實有百分定四子十分定三子單分定二子十秒定一子以其下損益分十分定五子單分定四子十秒定三子單秒定二子為法乘之言十定一得數又為實以八百二十分去二子為法除之不滿法又去一子得數取所定八子為度位視立成是益分即于得數上依位加本限下遲疾積度如盈縮差加積度法若是損分即置遲疾積度内減去得數如八子為度位而所定只五子則于度下第三位減之餘倣此即各得所求遲疾差遲疾日率者毎限八百二十分之積數也如滿八百二十分則為一限滿兩箇八百二十分則為二限乃至滿十箇八百二十分即為十限百箇八百二十分即為百限故曰日率而所得遲疾厯未必能與各限之日率巧合而無零分故以此日率減之即知此日太隂之行度己足過若干限而尚餘若干時刻也毎限八百二十分即八刻奇未滿此數皆為零分損益分者各限内遲疾進退之差也自初限至八十三限為益分其遲疾為進也在疾厯則益其疾在遲厯亦益其遲故並為益分自八十四限至一百六十八限為損分其遲疾為退也在疾厯則損其疾在遲厯亦損其遲故並為損分此損益分皆整限八百二十分之數零分所有之損益必小于八百二十分之損益故以零分乘八百二十分除也遲疾積度者是本限以前所積之遲疾度分也如在八十三限以前則為日益之積數八十四限以後則為日損之餘數於是以所得零分内之損益分損之益之便知此時此刻内太隂之遲疾所不同於平行者共有若干度分而命之為遲疾差也定子之法千三百二則萬四常為度位而此與盈縮差並用八子者盈縮差原是萬約為分宜去四子今省不去故八子即是四子也此求遲疾之損益是以八百二十除原非萬約為分而亦用八子為度者因乘時加定四子餘分百定四子是加定二子也損益分之十分是度下一位宜定千三今定五子是又加二子也合之共加定四子則八子亦是四子其故何也遲疾厯遇八十一限至八十六其損益分多為單秒則定子之法窮故加四數以豫為之地也不滿法又去一子者亦以相除時算位言之假如法是八實亦是八或八以上可以除得一數即為滿法若實在八以下即不能除得一數當退位除之即為不滿法也此不論十百千萬之等惟論自一至九之數假如以八十除六百亦為不滿法若以八百除九十亦為滿法皆以得數有進位不進位而分算中精理也盖除法本是降位如用十為除法是以十為一當降一位故去一子百為除法是以百為一當降兩位故去二子今不能除得一數而退位除之是又降一位故再去一子也按古厯太陽朓朒之行但有各恒氣十五日奇之總率而無毎日細數太隂朓朒之行但有毎一日之總率而無一日内分十二限奇之細數有之皆自授時始皆以平立定三差得之授時之密於古法此一大端也推加減差法視各經朔弦朢下盈縮差與遲疾差如是盈遲縮疾為同名則相倂用之如是盈疾縮遲為異名則兩數相較用其餘分有萬定四子千定三子百定二十定一以八百二十分定二子乘之言十定一得數為實以立成本限下遲疾行度為法遲用遲行度疾用疾行度並以萬去四子千去三子除之不滿法又去一子得數以所定有三子為千分二子為百分即得所求加減差同名者盈遲為加差縮疾為減差異名者盈多疾少為加差疾多盈少為減差遲多縮少為加差縮多遲少為減差加減差者時刻之進退也前論盈縮遲疾二差則行度之進退也因日月之行度各有紓亟而時刻因之進退故前既分求之兹乃論之也以右旋之度言之日每日平行一度月每日平行十三度有竒合朔時日月同度厯弦䇿七日三八二六四八二五而月度超前離日一象限是為上弦又厯弦䇿而月度離日半周天與日對度是為朢自此以後月向日行又厯弦策而距日一象限是為下弦更厯弦䇿而月追日及之又復同度而為合朔矣凡此者皆有常度有常期故謂之經朔經朢經弦也乃若定朔定朢定弦則有時而後於常期故有加差焉有時而先於常期故有減差焉凡加差之因有二一因於日度之盈夫日行既越於常度則月不能及一因於月度之遲夫月行既遲於常度則不能及日二者皆必於常期之外更增時刻而後能及於朔朢弦之度故時刻加也減差之因亦有二一因於日度之縮夫日行既緩於常度則月易及之一因於月度之速夫月行既速於常度則易及於日二者皆不待常期之至而已及於朔弦朢之度故時刻減也乃若以日之盈遇月之遲二者皆宜有加差以日之縮遇月之疾二者皆宜有減差故盈與遲縮與疾並為同名而其度宜倂若以日之盈遇月之疾在日宜加在月則宜減以日之縮遇月之遲在日宜減在月宜加故盈與疾縮與遲並為異名而其度宜相減用其多者為主也如上所論既以盈縮遲疾二差同名相從異名相消則加減差之大致已定然而又有乘除者上所言者度也非時刻也故必以此所得之度分即同名相從異名相消之度分用每限之時刻八百二十分乘之為實每限之月行度為法即遲疾行度除之即變為時刻而命之為加減差矣以異乘同除之理言之月行遲疾行度則所厯時刻為八百二十分今加減之度有㡬箇遲疾行度則月行時刻亦當有㡬箇八百二十分故以此乘除而知加減差之時刻推定朔法各置經朔弦朢大小餘各以其加減差加者加之減者減之即各得所推定朔弦朢大小餘大餘命起甲子算外得定日支干小餘命時刻依發斂加時條求之其定朔朢日小餘若在本日日出分以下者退一日命之惟朔不退定朔日干名與次月同者其月大不同者其月小内無中氣者為閏月弦朢退一日者以候月當用更㸃也假如定朢在乙丑日日未出前則仍是甲子日之更㸃故也按節氣為兩月相交之界故謂之節中氣為一月三十日之正中故謂之中月有中氣然後可正其名曰某月如有冬至則為十一月有大寒則為十二月有雨水則為正月他皆若是若月内無中氣而但有節氣則在兩月交界之間不能名其為何月而謂之閏月矣凡閏月前一月中氣必在晦後一月中氣必在朔則前後兩月各在定名而此月居其間不得復以前後月之名名之不得不為閏月如月内但有立春節而無中氣則大寒中氣在前月之晦定其為十二月雨水中氣則後月之朔定其為正月前後兩月各有本名不可移動而本月無中氣即無月名必為閏月也厯家以無中氣為閏月則各月之中氣必在本月而不可稍移所謂舉正于中民則不惑也然惟以恒氣注厯始能若是唐一行之説所以確不可易而厯代遵守以為常法非不知有定氣而但知恒氣也定氣即日行盈縮若于各恒氣求其盈縮差而以盈差為減差縮差為加差即得各定氣日及分然而不用者為閏月也推入交次氣法置天正入交泛日及分加四日六三六七三八即兩交差即為所求年正月經朔下入交泛日及分也以後累加交差二日三一八三六九滿交終二十七日二一二二二四去之即各月經朔下入交泛日也累加至其年十一月即與次年天正入交泛日相同也復以交朢一十四日七六五二九六五累加之亦滿交終去之即得各月經朢下入交泛日加朔得朢加朢得次朔亦必相同也附交差鈐一二日三一八三六九用鈐加正月經朔下二四日六三六七三八入交泛日可逕得所三六日九五五一七求某月經朔下入交四九日二七三四七六泛日若加正月經朢五十一日五九一八四五下入交泛日亦可逕六十三日九一二一四得所求某月經朢下七十六日二二八五八三入交泛日加滿交終八十八日五四六九五二二十七日二一二二九二十日八六五三二一二四並去之用其餘十二十二日一八三六九數十一二十五日五二五九十二日六八二四推盈日法視各恒氣之小餘在沒限七千八百一五六二五以上者為有盈之氣也置䇿餘分一萬一四五以十五日除氣䇿得一萬一四五六二五止用四位取大數也内減有盈之氣小餘四位用其餘分為實以千三百二定之以六十八分六十秒以氣盈除十五日得六十八分六十六秒九五今亦止用三位定一為法乘之言十定一得數取定四子為日位用加恒氣大餘日滿紀法去之命起甲子算外為所推盈日也又法亦以有盈之恒氣小餘去減䇿餘分餘以一氣十五日乘之為實氣盈二千一百八四三七五為法除之得數以加恒氣大餘滿紀法去之命為盈日亦同若逕求次盈日者置所得盈日毎加盈䇿六十九萬六六九五二八即得第二盈日亦滿紀法去之命干支也盈日即古厯之沒日也凡氣内有盈日者多一日假如甲子日立春則己夘日雨水今盈一日為庚辰日雨水故謂之盈日䇿餘分者十五日除氣䇿之數也盖謂毎大餘一日即帶有盈分千一百四十五分故必足得䇿餘分一萬一四五之數則為十五分氣䇿之一也六十八分六十秒者氣盈除十五日之數也盖謂毎盈一分在恒氣為六十八分六十秒即六十八分六十秒盈一分也今有盈之恒氣小餘尚不及䇿餘分有若干分則必更厯若干六十八分六十秒而其盈分始足命之盈日也又法以十五日乘氣盈除即六十八分六十秒乘也故其得數同捷次盈以盈䇿加者率六十九日奇而有盈日則毎一嵗周只有五盈日或四日也餘詳用數推虚日法視各經朔之小餘在朔虚四千六百九四七以下者為有虚之朔也置有虚之朔小餘四位千定三百定二為實以六十三分九十秒朔虚除三十日得六十三分九十一秒竒此用大數故只三位定一為法乘之言十定一得數取定四子為日位用與經朔大餘相加滿紀法去之命起甲子算外為所推虚日也又法以三十日乘有虛之小餘為實朔虚四千六百九四七為法除之得數以加經朔大餘滿紀法去之為虚日亦同若逕求次虚日者置所得虚日每加虛䇿六十二日九一四二二即得第二虛日其命干支亦滿紀去之也虚日即古厯之滅日也凡月内有虚日者其月小以經朔言之故謂之虛日六十三分九十秒者朔虚除三十日之數也盖謂毎虚一分在月内為六十三分九十秒即毎六十三分九十秒當虛一分也今經朔小餘尚有若干分則必更厯若干六十三分九而其虚分始盡命之虚日也其又法以三十日乘朔虚除即六十三分九乘也故得數亦同捷次虚日以虛䇿加者率六十三日弱而有虚日則每一嵗䇿亦只五虚日也餘亦詳用數推土王用事法置四季月節氣大小餘三月用清明六月小暑九月寒露十二月小寒各加土王䇿一十二萬一七四七五滿紀法去之大餘命起甲子算外各得所推土王用事日辰也又法置四季月中氣大小餘三月用穀而六月大暑九月霜降十二月大寒内各減第二土王䇿三日四三六八七五如不及減加紀法減之所得亦同天有五行而土無專位以體之立者言之則居中以用之行者言之則在隅土者木火金水之所以成終而成始也參同契曰土旺四季羅絡始終青赤白黒各居一方皆禀中宫戊己之功盖謂此也厯家以春木夏火秋金冬水分旺者各得氣策四又十二日一七四七五而土寄旺於四季之末者各得氣䇿一又三日四三六八七五與四行之數適以相等而嵗功成焉前法用加節氣者是於四時之末而要其終後法用減中氣者是據土王用事之初而原其始餘詳用數推發斂加時法各置定朔弦朢及恒氣之小餘為實以十二時為法乘之法實並以千三百二定之言十定一以所定四子為萬取萬為時命起子正有五千起作一時命起子初並以算外命時其不滿五千者取一千二百為刻命起初正初刻算外為某刻又法各置小餘加二為時減二為刻不須定數就以千位為時百位為刻有五百起作一時命起子初初刻不起者命起子正初刻也按古法以日行赤道外去北極逺謂之發日行赤道内去北極近謂之斂發斂字義並主北極為言日道之自近而逺逺而復近皆以漸致故不曰逺近而曰發斂也古諸家厯法並有歩發斂一章其所列者月卦律呂氣候之類而加時之法附焉授時亦然故曰歩發斂加時也授時雖不用律吕月卦惟存七十二候而統以廿四中節盖即其所謂發斂而所謂歩發斂加時者以推各氣候初交之時刻發斂字義䝉上文而為説猶云歩氣候加時云爾大統則省去歩發斂一章故加時之法在氣朔章後而猶云推發斂加時因仍舊名無他義也以十二乘者何也盖以日周一萬分十二時則各得八百三十三分三三不盡故以十二乘之通日周一萬為十二萬則可以匀分乃算術通分法也日周既通為十二萬故以一萬為一時以一千二刻為一刻也有五千起作一時者因時有初正則各得五千其子初四刻為前半箇子時乃先一日之數謂之夜子時子正四刻為後半箇子時乃本日之數本日十二時並從兹起故滿一萬者命起子正也命起子正則算外為丑正矣因所滿一萬數中有子正四刻丑初四刻在内則前半箇丑時已滿而算外為丑正若但滿五千則算外為丑初但滿五千則所滿者是後半箇子時而交前半箇丑時是為丑初非丑正也故起作一時而命起子初此是從先日夜子初刻算起借前半箇子時輳合成整以便入算也其又法加二為時減二為刻者加是就身加二即十二乘但不變千位不定子故即以一千為一時而起子正有五百起作一時而起子初也減二即十二除而挨身減二不動算位所謂定身除法也故即以一百為一刻附十二時鈐千百十分十秒千百十分十秒子正午正五丑初四一六六六未初五四一六六六丑正八三三三三未正五八三三三三寅初一二五申初六二五寅正一六六六六六申正六六六六六六夘初二八三三三酉初七八三三三夘正二五酉正七五辰初二九一六六六戌初七九一六六六辰正三三三三三三戌正八三三三三三巳初三七五亥初八七五巳正四一六六六六亥正九一六六六六午初四五八三三三夜子初九五八三三三凡日下小餘分並以十二時鈐相減命時如滿四一六六者即命其時為丑初滿八三三三者即命其時為丑正減不盡者以一百分為一刻如不滿百分即命初刻滿一百分即命一刻滿二百分命二刻滿三百分命三刻滿四百分命四刻如小餘可減二千五百分命其時為夘正减過餘數有一百分即為夘正一刻有二百分為夘正二刻有三百分為夘正三刻有四百分為夘正四刻若減餘不滿百分只為夘正初刻他皆若是初正並同推朔值宿法置辛巳為元求到其年通積全分内減去其年閏餘全分加三萬六一一八六即兩宿餘滿宿㑹二十八萬去之命起虚宿算外即得所求年正月經朔直宿以後累加宿餘一萬五三五九三滿宿會去之即得各月經朔直宿再以各朔下加減差加者加之減者減之亦滿宿會去之命起虚宿算外即得各月定朔直宿其加減過小餘亦必與定朔小餘相同為凖此盖以辛巳為元之天正冬至前甲子日正直虚宿故逕以通積取之即得直宿按日直宿法乃演禽之用占家之一種也故諸家厯法無之授時厯經亦所未載而大統厯有之盖元統之所増其實無闗厯法推閏月所在置朔實二十九萬五三五九三内減去有閏之天正閏餘全分即所推天正閏餘在閏凖以上者其年有閏是也餘為實以月閏九千百六二八二為法除之滿法為月視所得有㡬月命起嵗前十一月算外得閏在何月此法仍多未的然祇在其月之前後皆以定朔為凖也滿法為月者滿得一箇月閏之數即為一月若滿兩箇月閏即為兩月此只求整月不除分秒故不必定子附六十甲子鈐初日甲子一日乙丑二日丙寅三日丁夘四日戊辰五日己巳六日庚午七日辛未八日壬申九日癸酉十日甲戌十一乙亥十二丙子十三丁丑十四戊寅十五己夘十六庚辰十七辛巳十八壬午十九癸未二十甲申廿一乙酉廿二丙戌廿三丁亥廿四戊子廿五己丑廿六庚寅廿七辛夘廿八壬辰廿九癸巳三十甲午三十一乙未三十二丙申三十三丁酉三十四戊戌三十五己亥三十六庚子三十七辛丑三十八壬寅三十九癸夘四十甲辰四十一乙巳四十二丙午四十三丁未四十四戊申四十五己酉四十六庚戌四十七辛亥四十八壬子四十九癸丑五十甲寅五十一乙夘五十二丙辰五十三丁巳五十四戊午五十五己未五十六庚申五十七辛酉五十八壬戌五十九癸亥二十八宿鈐初日虚一日危二日室三日壁四日奎五日婁六日胃七日昴八日畢九日觜十日參十一井十二鬼十三栁十四星十五張十六翼十七軫十八角十九亢二十氐廿一房廿二心廿三尾廿四箕廿五斗廿六牛廿七女厯算全書卷二十一
