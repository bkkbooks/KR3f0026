body:
  text: 厯算全書卷三十八宣城梅文鼎撰筆算卷五開平方法測量句股全恃開方開方有平有立而平之用博以其有實無法故别為一術以佐乘除之所窮平方者面羃也其形正方故亦為自乘之積開平方者以自乘之積求正方之邉故西法謂之測面其邉謂之方根法先列實依除法作兩直線以所用方積列於右直線之右自上而下至單位止無單作次作點定位自單位作一點起每隔一位點之有一點則商一位如有二點則商數有十有三點則商數有百次定初商皆自原實最上一點截定為初商之實如點在首位即以一位為初商實點在次位即合兩位為初商實以自乘數約而商之皆以點處為本位點上一位為進位本位者單數也如一商一四商二九商三其自乘皆本位不論百與萬以上皆作單數用進位者十數也如一六商四二五商五以至八一商九其自乘皆有進位不論千與萬以上上皆作十數用又法以初商實入表皆視初商實有與表同數或稍大於表數者用之以命初商如一商一四商二此與表數相同也如二三亦商一五六七八皆商二此比表數稍大也若至九則商三又為相同之數矣十至十五皆商三皆比表數稍大至十六商四又為相同之數他皆倣此初商表凡初商三以下減積在本位四以上減積合兩位此表明之用表捷法但視初商實不滿表上自乘積者退一格即商數如不滿四即商一不滿九即商二他倣此既得商數即書於左直線之右皆對初點之進位書之凡商得一二三四書於點之上一位五以上又進一位凡商得五六七八九書於點之上兩位次減實以初商數自乘書於左直線之左皆以本位對初點如初商一二三自乘一四九皆本位即對初點書之如初商四五六七八九其自乘皆有進位則以下一字對初點就以此命為減數以對減右直線所列方積如減積不盡則有次商次商之法倍初商得數為次商亷法對原實位書於右直線之左視實冇二點則初商是十有三點初商是百四點初商是千各取倍數對原列方積千百十零之位書之倍而言十者亦進位對之截原實第二點為次商之實次商減積至此點止以廉法約實為次商數並依除法約之挨書於初商之下即用次商數為隅法亦書於廉法之下為次商廉隅共法省曰次商法以與次商數相乘書其數於左直線之左皆以法首位所乘之進位對次商數書之若言如之數亦以位對之法有幾位遍乘而挨書之點至次點止上又法先以法尾位隅法乘次商數以本位對次書之進位一字書之依乘法例自下而上法有幾位皆遍乘而迭進書之至次商數止亦同命為次商減積數以對減右直線餘積而定次商皆減積至次點止如減數大於餘積則改次商亦改隅法如上乘減及減而止次商減積不盡則有三商三商之法合初商次商數倍之為廉法簡法只以隅法加倍增入次商法內即三商廉法截原實第三點為三商之實三商減積至三點而止餘並同次商如減積不盡則有四商四商以上並同三商法審位之法若次商廉法大於苐二點以上餘積或數適相同是商得位也凡商得一數者其減積必與廉法同而多一數以為隅故僅同者無隅積也即不能商一數而成位則書於初商之下以當次商亦增於亷法之下為三商亷法三商以上有並同若應商幾位而於初商或次商即已減積至盡是末幾位皆商得也俱補作命分之法若已商得單數而仍有餘積當以法命之以商得方根倍之加隅一為分母不盡之數為分子命為幾分之幾雖未商得單數而餘積甚少不能成單一數亦以法命之前審位云亷法大於餘積者但取第二點以上相較不論千百十零其所謂不能商一數者或是一千或是一百不拘定是單一也故商之後仍有所商與此不同還原法以商得方根自之有不盡者以不盡之數加入之即得原實又簡法作直線於左方以應減之積依併法併之必合原實有不盡數亦加入之並同除法還原初商本位式凡初商一二三者減積言如在本位然初商一二三四者書商數於點之上一位以書商數之位言之亦本位也兩本位法此一式中皆可明之假如有方田積二百五十六步問每面方若干答曰每面方十六步列實作兩直線列方積於右直線之右作點定位自單位起每隔一位作一點共兩點宜商兩次初商是十初商點在實首位即以實首位二為初商實以自乘數約之得一為初商初商是一宜對點上一位書於左直線之右有兩點初商是一十自乘一百為減數書左線之左遙對右行初點二百書之就以對減初商實於二百內減一百仍餘餘一百改書之初商減積未盡有次商次商倍初商一十作二十對原列方積十步位書於右線之左為亷法以第二點餘實一五六為次商實用亷法約實可商七步因無隅積只約六步為次商以書於初商之下即用六步為隅法以書於亷法之下合亷隅共二十六步為次商法以乘次商六步得亷積一百二十步隅積三十六步皆對次商位書起每挨一位書之至次點止共得次商減數一百五十六以對減餘實恰盡共開得平方根一十六步合問甲乙丙丁四形合為正方形四面皆一十六步甲分形正方四而皆十步積一百步即初商積丙丁二分形皆長方廣六步長十步積六十步兩形共積一百二十步即次商廉積乙小分形亦正方面皆六步積三十六步即次商隅積自乘還原法置方一十六步為實即以十六步為法乘之得二百五十六步合原數初商進位式凡初商四五六七八九減積言十在進位凡初商五六七八九書商數於點之上兩位書商數以點上一位為本位則此其進位也兩進位法此一式中皆有之假如方積三十五萬八千八百零一尺問方若干答曰方五百九十九步列位同前作點定位有三點宜商三次初商是百初商點在實次位即合兩位三五為初商實入表表中有小於三五者是二五其方根五即以五為初商數對實初點上兩位書左直線之右又即以表中自乘數二五遙對實三五書於左直線之左就以對減初商實餘一改書之以待次商次商倍初商五百作一千百對實千百位書於右直線之左為亷法以第二點上餘實一八八為次商實用亷法約之得九為次商續書於初商之下即以次商九為隅法書亷法之下合亷隅共一九為次商法以乘次商九得亷積九隅積八一對次商位書起至次點止共得減數九萬八千一百以減次商實餘一七改書之以待三商三商以次商隅法九十倍作一百八十於次商法一千之下抹去九改書一八共一一入為亷法以第三點上餘積一七一為三商實用亷法約之得九為三商續書於次商下即以三商九為隅法書於亷法之下合亷隅共一一八九為三商法以乘三商九步得亷積一萬六百二十隅積八十一對三商位書起至第三點止共得減數一萬七百一以對減三商實恰盡凡開得方根五百九十九尺初商甲方五百尺積二十五萬尺次商丁戊二亷各長五百尺濶九十尺共積九萬尺隅乙方九十尺積八千一百尺三商已庚二亷各長五百九十尺濶九尺共積一萬六百二十尺隅丙方九尺積八十一尺七形合成正方共積三十五萬八千八百一商位式假如方積八十二萬六千二百八十一尺問方若干答曰九百九尺列位作點定位並同前條初商點在次位合兩位八二為初商實表入表得八一小於八二其方根九即為初商在五以上對初點上兩位書之亦以表數八一對實八二書於左線之左以減初商實餘一改書之以待次商次商倍初商九百作一千八百對原實位書之為亷法以第三點上餘實一六二為次商實以亷法約之法大實小不能商一數是商得位也紀於初商之下即於實首位銷去一餘俟三商三商因次商是增於廉法之下共一八為亷法以第三點上餘實一六二八一為三商實用亷法約實得九尺為三商書於次商之下即以九為隅法書於亷法之下共亷隅法一八九以乘三商九得亷積一萬六千二百隅積八十一減三商實恰盡凡開得方根九百九尺計開初商方九百尺積八十一萬尺續商亷各濶九尺長九百尺共積一萬六千二百尺隅方九尺積八十一尺通共八十二萬六千二百八十一尺假如方積二十五億七百萬四千九百尺問方若干答曰五萬七十尺列位原積尾位是百補作兩列之作點定位有五點當商五次初商是萬初商以實首兩位二五為初商實入表得五為初商書於點上兩位次以自乘數對實列之相減盡次商倍初商五萬尺得一十萬為亷法對原實位書之以第二點上餘實七為次商實實有三無可商是次商也書於初商五之下亦於實首銷去一以待三商三商因次商增於亷法下得一為亷法以第三點上餘實七為三商實實仍有兩位是三商亦也又書於次商之下於實首復銷去一以待四商四商因三商亦又增於亷法之下得一為亷法以第四點上七四九為四商實用亷法約之得七十尺書於三商之下即以七為隅法增於亷法下共亷隅法一七以乘四商七得亷積七百萬隅積四千九百以對減四商實恰盡五商五點宜有五商而四商已減實盡無可商作於四商凡開得方根五萬七十尺命分式假如方積五百七十六萬四千八百尺問方根若干答曰二千四百尺又四千八百一分尺之四千八百列位實盡於百位如前法補作兩圈列之作點定位有四點宜商四次初商是千初商以實首五為初商實入表得二為初商以自乘數四減實五改書餘一以待次商次商倍初商二千得四千為亷法約以第二點上餘實一七六為次商實用廉法之得四為次商即以為隅法書廉法下共亷隅法四四以乘次商四得亷積一百六十萬隅積一十六萬共減積一百七十六萬次商實減盡三商倍次商隅法四作八增入次商法共四八為三商亷法以第三點上餘實四八為三商實有兩無可商作於三商位消去實首一以待四商四商三商亦增於亷法下共四八為亷法與以第四點上餘實四八為四商實僅亷法相同是無隅積也不能商一數作於四商位其不盡之數以法命之法以亷法四千八百加隅一共四千八百一為命分之母以不盡之數四千八百為分子命為四千八百一分尺之四千八百即一尺弱也共開得平方二千四百尺又四千八百一之四千八百此雖未開至單尺之位而餘實甚少不能成一單尺故即以法命之若餘實是四千八百一尺則商得平方二千四百一尺矣今止四千八百尺是少一尺故不能成一單尺也開方分秒凡開方欲知分秒法於餘實下每增兩位則多開一位為分秒之數平方之積尺有百寸寸有百分皆以百為母故增兩假如有平方積二十四尺平方開之得方四尺不盡八尺問分秒若干答曰方四尺零八寸九分八釐九毫有竒如常列位作點點在次位即以二四兩位合商得方四尺減其自乘一十六尺餘八尺用命分法以商四尺倍作八尺又加隅一得九為命分母不盡為分子命為方四尺又九分尺之八今欲知其寸九分尺之八者是以尺作九分而今有其八言每方四尺之外仍𢃄此畸零是其中有寸法於餘實下加兩化八尺為八百寸每尺縱橫十寸故其積百寸用為次商實以初商四尺倍之得八尺亦化八十寸商數是每邉之數故尺只十寸對餘實十寸位書之即第一位為亷法用廉法約實可商九寸因恐無隅積只商八寸書於初商四尺之下亦即以次商八寸為隅法書於廉法八十寸之下共亷隅八十八寸以乘次商八寸得亷積六百四十寸隅積六十四寸共亷隅積七百四寸自次商位書起至第二位止以對減餘實仍餘九十六寸命為竒數凡商得每方四尺八寸有奇再求其分法於實下又加兩以餘九十六寸化九千六百分解見上為三商實商數四尺八寸亦化四百八十分倍之為九百六十分移對餘實百分十分之位書之為亷法以亷法約實商得九分為三商書次商之下亦即以三商九分為隅法書於亷法九百六十分之下共亷隅九百六十九分以乘三商九分得亷積八千六百四十分隅積八十一分共積八千七百二十一分自三商位書起至第四位止以對減餘實仍餘八百七十九分命為竒數凡商得每方四尺八寸九分有竒再求其釐法於餘實下又加兩以餘八百七十九分化八萬七千九百釐為四商實次倍商數四尺八寸九分作九尺七寸八分化為九千七百八十釐移對餘實依千百十之位書之為亷法用亷法約實得八釐為四商書於三商之下即以四商八為隅法增於亷法末共亷隅法九千七百八十八釐以乘四商八釐得亷積七萬八千二百四十釐隅積六十四釐自四商位書起至第六位止以減餘實仍餘九千五百九十六釐凡商得每方四尺八寸九分八釐有竒再求其毫如法於餘實下又加兩化餘實為九十五萬九千六百毫為五商實次倍商數四八九八作九尺七寸九分六釐化為九萬七千九百六十毫為亷法移對餘實萬千百十之位書之用亷法約實得九毫為五商書四商下亦即以五商九為隅法增入亷法下共亷隅九萬七千九百六十九毫以乘五商九毫得亷積八十八萬一千六百四十毫隅積八十一毫對五商位書起至第八位止以減餘實仍餘七萬七千八百七十九毫凡商得方四尺八寸九分八釐九毫又九萬七千九百七十九之七萬七千八百七十九即竒數也右單數下已開四位尺為單位析為寸分釐毫凡四位其不盡者是不滿一毫之數于單數為十萬分之一如欲再求忽微亦如上法開方𢃄縱𢃄縱者長方形也以方為濶加縱數為長其法與開方無異但須以商得數乘縱數為縱積併入方積以減原積不及減者改商之其次商亦倍初商加縱為亷法但倍方而不倍縱三商以上並同假如有長田積六百二十四步濶不及長二步問長濶各若干答曰長二十六步濶二十四步列位以實列右線之右步以縱二步列右線之左對實位列之如常作點定位初商以六為初商實商得二十步自乘應減方積四百步又以商數乘縱二步得縱積四十步如法列之以減原實仍餘一百八十四步次商倍初商二十步作四十步加縱二步共四十二步為亷法以約餘實得商四步即以為隅法合亷隅縱共四十六用乘次商四得亷積一百六十步隅積十六步縱積八步共減積一百八十四步恰盡命為濶二十四步加縱二步為長二十六步合問以圖明之甲為初商方形長濶各二十步積四十步已初商縱形濶二步四長亦二十步積十步戊丙並次商廉長各二十步十濶四步積八步乙次商隅方四步步積一十六丁次商縱亷長四步八濶二步積步以上五者合之為一長方形步共長二十六步濶二十四積六百二十四步合原數若縱數有比例可求者先以比例分其積平方開之得濶因以知長假如有直田積四百五十步但云長多濶一倍問長濶若干答曰濶十五步長三十步法平分其積得二百二十五步平方開之得濶十五步置濶十五步倍之得長三十步合問假如有長田積二百五十二步但云長比濶多四分之三問長若干答曰濶一十二步長二十一步法以多三分加分母四共七為法以分母四乘積為實法除實得一百四十四步開方得濶一十二步置濶一十二步七因四除之得二十一步為長長比濶多九步於十二步為四分之三開立方法平方者方田之屬也但取面羃之積立方者方倉之屬也必求其內容之積故平方曰面立方曰體有面而後有體有線而後有面故皆以線為根假如長二尺者線數也線有長短而無廣狹若以此線橫展之長亦二尺濶亦二尺則其積四尺為面面者平方形也面有濶狹而無厚薄又以此面層纍而厚之長濶皆二尺高亦二尺則其積八尺為體體者立方形也立方有虛有實如築方臺則實鑿方池作方窖則虛然其立方之積數一也法先立位同平方作點自單位起每隔二位點之以最上一點為初商實定位視有若干點則商幾位如有二點則商數有十有五點則商數有百並同平方初商法以自乘再乘數約而商之如一商一八商二二七商三之類書商數於左線之右凡商得一數者書於點上一位商得二三四五者書於點上兩位商得六七八九者書於點上三位即以自乘再乘數書於左線之左以對減初商實初商減積至初點止次商法以初商自乘而三之為平亷法亦曰方法以初商三之為長亷法亦曰亷法皆對原實千百位書之截第二點上餘實為次商實次商減積至次點止以平亷法約實得次商列初商下即以次商為隅法列長亷次亦按千百位列之乃以次商乘平亷法為平亷積又以次商自乘以乘長亷及隅法為長亷小隅積俱挨書之以減餘積不及減者改商三商法以餘實另列之合初商次商自乘而三之為平亷法合初商次商三之為長亷法截第三點上餘實為三商實三商減積至此點止亦即以三商為隅法餘並同前四商以上並同三商命分法合平亷長亷法再加隅一為命分母不盡之數為命分子並同平方還原法置商數自乘得數再以商數乘之即合原實有不盡者以不盡之數加入之初商表用法與平方表同假如立方積五千八百三十二尺問方若干答曰方一十八尺列實作點定位有兩點初商是十初商以五千為初商實約商一十自乘再乘得一千為應減積減原實餘四千次商以初商自乘而三之得三百為平亷法二又以初商三之得三十為長亷法以平亷法約第點上餘實得八尺為次商即以為隅法並如法列之乃以次商乘平亷法得二千四百為平亷積又以次商自乘得六十四以乘長亷及隅法得長廉一千九百二十隅積五百一十二共減積四千八百三十二恰盡以圖明之甲為初商方形長濶皆十尺積一千尺乙為次商平亷凡三以輔於方之三面長濶皆十尺厚八尺積八百尺共積二千四百尺丙為次商長亷亦三以輔三平亷之隙長十尺濶與厚皆八尺積六百四十尺共積一千九百二十尺丁為次商隅如小立方以補三長亷之隙長濶高皆八尺積五百一十二尺假如立方積二千二百五十九億七千七百八十一萬一千五百七十尺問方根若干答曰方六千零九十尺又一億一千一百二十八萬二千五百七十一之一億一千一百二十八萬二千五百七十列實實尾無單位補作作點定位有四點初商是千初商合實三位約之商六千對初點上三位列之以六千自乘再乘得減積二千一百六十億其餘積改書以待次商次商日乘初商而三之得一億八百萬為平亷法位以初商三之得一萬八千為長亷法各對原實列之次以第二點上餘實為次商實實首有兩無可商是商也作於初商之下即於實首消去兩餘俟三商三商次商即以次商法為三商法尺以第三點上餘實為三商實以平亷法約之商九十即以為隅法對實十位列之乃以九十乘平亷法得平亷積九十七億二千萬又以九十自乘得八千一百以乘長亷及隅法得長亷積一億四千五百八十萬隅積七十二萬九千共減積九十八億六千六百五十二萬九千四商以第四點上餘實另列之二合三次商數六九自乘而三之得一億一千一百十六萬四千三百為平亷法得又以六九三之一萬八千二百七十為長亷法亷以法約實僅與兩法之數相同無隅積不能成一單數以法命之合平廉長亷數加隅一為命分母餘實為命分子命為立方六千九十尺又一億一千一百二十八萬二千五百七十一尺之一億一千一百二十八萬二千五百七十自乘再乘厯算全書卷三十八
