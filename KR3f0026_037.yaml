body:
  text: 厯算全書卷三十三宣城梅文鼎撰籌算六之七開方捷法勿菴氏曰亷隅二形也故有二法今借開方大籌為隅法列于亷法籌之下而合商之則亷隅合為一法而用加捷矣存前法者所以著其理用捷法者所以善其事平方法曰如前列實從單位作㸃每隅位㸃之以求初商初商列位有常法進法俱如前既得初商即倍根數為亷法亦同前法以亷法數用籌亷法幾位用籌幾根列于平方籌之上為亷隅共法或省曰次商法合視亷隅共法籌某行内有次商之實同者或略少者減實以得次商以本行内方根命之三商者合初商次商倍之以其數用籌列平方籌上為亷隅共法或省曰三商法以除三商之實而得三商四商以上倣此求之解曰隅者小平方也故可以平方籌為法亷之數每大于隅一位今以平方籌為隅列于亷之下則隅之進位與亷之本位兩半圓合成一數故亷隅可合為一法何以知亷大于隅一位也曰有次商則初商是十數矣平方亷法是初商倍數其位同初商故大于隅一位凡初商減積盡最上一㸃故最上一㸃者初商之實也次商減積盡第二㸃故第二㸃以上次商之實也三商減積盡第三㸃故第三㸃以上三商之實也推之第四㸃為四商之實第五㸃為五商之實以上並同審空位法曰若次商之實小于亷隅共法之第一行凡籌第一行最小數也則知次商是空位也不能成一數故空即作圈于初商下以為次商乃于亷法籌下平方籌上加一空位籌為亷隅共法以求三商若空位多者另有簡法見後三商實小有空位並同假如有平方積二千四百九十九萬九千九百九十九尺問每面若干列位作㸃如圖㸃在次位以二千四百萬為初商實視平方籌有小于二四者是一六其方四也商四千尺減積一千六百萬尺有四㸃故初商是千而有次商次以初商四千尺倍之得八千尺為亷法用第八籌列平方籌上為亷隅共法以第二㸃餘實八百九十九萬為次商實視籌第九行合數八一小于實次商九百尺減實八百一萬尺此所減首位不空故對位書之次倍初商次商共四千九百尺得九千八百尺用第九第八兩籌列平方籌上為廉隅共法以第三㸃上餘實九八九九為三商之實合視籌第九行是八九一小于實商九十尺減餘實八十九萬一百尺首位不空故亦對位書之次倍三次商共四千九百九十尺得九千九百八十尺用九九八三籌列平方籌上為廉隅共法以第四㸃上餘積九九八九九為四商之實合視籌第九行積八九九一小于實商九尺減餘實八萬九千九百一尺不盡九千九百九十八尺開方已得單尺而有不盡以法命之倍方根加一數得九千九百九十九為命分凡開得平方四千九百九十九尺又九千九百九十九之九千九百九十八右例可明四以上用常法之理葢積所少者不過萬分之一不能成五數之方而其法迥異加空籌式假如有平方積一千六百七十七萬七千二百一十六問每面若干列位作㸃如圖㸃在次位以一千六百萬為初商實視平方籌有一六與實同其方四商四千尺減積一千六百萬尺凡餘實必在商數下一位起倘空位則作圈補之後倣此次以初商四千尺倍得八千尺為亷法用第八籌列平方籌上為亷隅共法籌見前例以第二㸃上餘實七七為次商實籌最小數是八一第一行數大于實不及減是商數無百也乃于初商四千下作一圈以為次商減去實中位次如上圖加一空位籌于次商亷法之下平方籌之上為三商亷隅共法以第三㸃上七七七二為三商實視籌第九行是七二八一小于實商九十尺減積七十二萬八千一百次合初商次商三商共四九倍之得八一八為廉法去空位籌加一八兩籌列于平方籌之上為四商廉隅共法以第四㸃上四九一一六為四商之實合視籌第六行數與實合商六尺減積四萬九千一百一十六尺恰盡凡開得平方四千九十六尺假如有平方積九億一十八萬九步問每面若干列位作㸃如後圖㸃在首位以九億步為初商實視平方籌有九與實同商三萬步五㸃故初商萬減積九億步次以初商三萬步倍之得六萬步用第六籌加平方籌上為次商法即廉隅共法以第二㸃上為次商之實視實三位俱空無減知商數有空位且不止一空位也如前法宜挨次商得一空位則于原實内銷一圈凡續商之實必下于前商之實一位故雖位必減去之以清出續商之實而于共法籌内加一空位籌如此挨商頗覺碎雜故改用又法又法曰凡實有多空位者知商數亦有多空不必挨商當于原實中審定可減之數在何位則此位之上皆連作圈而徑求後商如此餘實有三圈皆無積可減必至一乃有可減而法是第六籌籌最小是六大于一仍不可減必至一八方可減而一是籌之進位當以商數對之則知以上俱是空位乃皆作圏合視之有三圈即次商三商四商也干原實内銷去三圈如後圖此即次商三商四商合圖也次加三空籌于平亷第六籌之下平方之上為五商亷隅共法徑以第五㸃上一八九為五商實視籌第三行數與餘實合商三尺除積一八九恰盡凡開得平方三萬三步又假如積二千五百七萬四十九尺問方若干列位作㸃如圖㸃在次位以二千五百萬尺為初商實視平方籌有二五與實同其方五商五千尺減積二千五百萬尺次倍初商五千尺得一萬千尺用一籌空位籌為廉法凡商得五數則原帶有空位列平方籌上為次商法實多空位以前除又法審之必至七萬尺乃有可減而七之與籌上首位之對當以商數居之則知此以上俱無商數也于是于初商五千下作兩圏如後圖此次商三商合圖也原實上減兩圏商數下加兩圏如上圖加兩空位籌于廉法一萬千之下平方之上為四商法以七四九為四商實次商三商之兩㸃已銷故徑用第四㸃視籌第七行相合商七尺減實恰盡凡開得平方五千七尺又假如積五千六萬三千五百尺問方若干列位作㸃如圖㸃在次位以五十六萬為初商實視平方第七行是四九小于實商七百尺除實四十九萬次倍初商七百得一千四百用第一第四兩籌列平方籌上為次商法以第二㸃上七三五為次商實合視第五行是七二五小于實商五十尺減去餘積七萬二千五百尺次合商數七百五十倍之得一千五百尺應用第一第五空位三籌加于平方籌上為三商法以第三㸃上一千尺為三商實而實小于法不能成一尺乃于商數未作一圏以為三商其不盡之數以法命之凡亷隅共法籌第一行數即命分也葢能滿此數即成一單數矣凡開得平方七百五十尺又一千五百一之一千約為三之二弱立方法曰如前列實隔兩位作㸃以求初商既得初商即以初商數自乘而三之為平亷法即方法以平亷法用籌列于立方籌之上借立方籌為隅法也為平亷小隅共法别以初商數三之而進一位為長亷法即亷法以長亷法用籌列于立方籌之下法于長亷數下加一空籌以合進一位之數先以平隅共法即平亷小隅共法或省曰共法為次商之法即截取初商下一位至第二㸃止為次商之實法除實得次商視共法籌内有小于實者為平亷亷小隅共積用其根數為次商次以次商之自乘數即大籌立積下所帶平方積數與長亷法相乘以平方數尋長亷籌之行取其行内積數用之得數加入平隅共積為次商總積以此總積減次商之實及減則已倘不及減轉改次商及減而止因亷積或大有不及減者三商者合初商次商數自乘而三之為平亷法以其數用籌列方籌上為平亷小隅共法别以初商次商數三而進位以其數用籌加一空位籌列立方籌下為長亷法截取次商下一位至第三㸃為三商之實共法為法除之以得三商其積為共積次以三商自乘數與長亷法相乘得數加入共積為三商總積减實又一法長亷法不必加空位籌得于得數下加一圏即進位也四商以上倣此解曰隅者小立方也故可以立方籌為法平亷之數每大于隅二位今以立方籌為隅列于平亷下則隅之首位與平亷之末位兩半圓合成一數故平亷小隅可合為一法長亷之兩頭皆如次商自乘之數故可以平方乘之又長亷之數每大于隅一位故于下加一空籌以進其位便加積也何以知平亷大于隅二位而長亷只大一位也曰平亷者初商自乘之數也初商于次商為十數十乘十則百數矣隅積者次商本位也故平亷與隅如百與單相去二位也若長亷只是初商之三倍位同初商初商與次商如十與單故長亷與小隅亦如十與單相去一位也凡初商積盡于上一㸃故上一㸃為初商實次商積盡于第二㸃故第二㸃以上為次商實推之三㸃為三商實四㸃為四商實以上並同審空位法曰若次商之實小于平亷小隅共法之第一行或僅如共法之第一行而無長亷積則次商是空位也即作圏于初商下以為次商乃于平亷籌下立方籌上加兩空位籌為三商平亷小隅之共法以求三商其長亷法下又加一空位籌并原有一空位籌共兩空位籌為三商長亷法又法長亷不必加空籌但于得數下加兩圏若商數有兩空位者平亷小隅籌下加四空位籌長亷積下加三圏解曰有空位則所求者三商也初商于三商如百與單而平亷者初商之自乘百乘百成萬故平亷與三商之隅如萬與單大四位也此加兩空籌之理也平亷原大二位加二空籌則大四位矣初商與三商既如百與單則長亷與隅亦如百與單大兩位也此又加一空籌之理也初商列位商一用常法二至五用進法六至九用超法今各存一例于後假如有立方積六百八十五萬九千尺問每面若干列位作㸃如圖㸃在首位以六百萬為初商實視立方籌有小于六者一也其立方一商一百尺三㸃故初商百減積一百萬尺次截取第二㸃上五八五九為次商實以初商一百尺自乘得一萬尺而三因之得三萬尺為平廉法用第三籌列立方籌上為平廉小隅共法别以初商一百尺三而進位得三百十尺為長廉法列立方籌下視平隅共法籌第九行是三四二九小于實商九十尺次以第九行平方八一乘長廉三得二四三以加共積得五百八十五萬九千為次商九十尺之積除實盡次商十宜有三商而除實已盡是方面無單數也凡開得立方每面一百九十尺假如有立方積一千二百八十六億三千四百六十七萬五百九十二尺問方若干列位作㸃如圖㸃在第三位以一千二百八十億為初商實視立方籌内有小于一二八是一二五其方五也商五千尺四㸃故初商千減積一千二百五十億次截取第二㸃上三六三四為次商實以初商五千自乘得二千五百萬而三之得七千五百萬為平廉法用七五兩籌列立方籌上為平廉小隅共法别以初商五千尺三而進位得一萬五千百尺為長亷法用籌列立方籌下視共法籌第一行是七五一大于實不及減知次商百位空也于初商下作一圏為次商原實上減一圏乃截第三㸃三六三四六七為三商實次于平亷籌下立方籌上加兩空位籌為平亷小隅共法于長亷籌下又加一空位籌原有一空位籌共二空位為長亷法視共法籌第四行是三六四小于實用為共積商四十尺以長廉法與四行之平方一六相乘得二四為長廉積加入共積得三二四六四減積三十億二千四百六萬四千尺次以商數五千四十自乘得二千五百四十萬一千六百尺而三之得七千六百二十萬四千八百尺為平廉法列立方籌上為平隅共法别以商數五千四十尺三而進位得一萬五千一百二十尺為長廉法列立方籌下乃截第四㸃六一六六五九二為四商之實視共法籌第八行六九六三八九一二小于實商八尺以長亷法與第八行平方六四相乘得九六七六八為長亷積以加共積得六一六六五九二除實盡凡開得立方每面五千四十八尺右加兩空籌例假如有立方積七千二百九十七億二千九百二十四萬三千二十七尺問每面若干列位作㸃如圖㸃在第三位以七千二百九十億為初商實視立方籌方九之積七二九與實同商九千尺減積七千二百九十億四㸃故初商千次截第二㸃七二九為次商實以初商九千尺自乘八千一百萬尺而三之得二億四千三百萬尺為平亷法列立方籌上為平亷小隅共法别以初商九千尺三而進位得二萬七千百尺為長亷法列立方籌下視共法籌第一行是二四三一大于實不及減知次商百位空也于初商九千尺下作一圏為次商原實上減去一圏乃于平亷籌下立方籌上加兩空籌為平廉小隅共法于長亷籌下又加一空籌得二七為長亷法截取第三㸃七二九二四三為三商實視共法籌第一行是二四三一大于實仍不及減知三商十位亦空也于商得九千百下加一圏為三商原實上又減去一圏又法實多空不必挨商但尋至不空之界如七乃與平亷相應即于七之上初商之下作連圏為次商三商而于原實中銷兩圏此次商三商合圖也乃于平亷籌下立方籌上又加兩空籌共四空籌為平亷小隅共法其長亷籌下又加一空籌共三空籌得二七為長亷法或不必加籌只于得數下加三圏亦同截取第四㸃七二九二四三二七為四商實視共法籌第三行是七二九二七小于實商三尺以長亷法與第三行平方九相乘得二四三為長亷積以加共積得七二九二四三二七除實盡凡開得立方每面九千三尺右加四空籌例開方分秒法籌算七勿菴氏曰命分古法也然但可以存其不盡之數而已若還原則有不合故有分秒法以御之也雖亦終不能盡然最小之分即無關于大數視命分之法不啻加宻矣平方法曰凡開平方有餘實不能成一數不可開矣若必欲開其分秒則于餘實下加二圏原實一化為一百分如法開之所得根數是一十分内之幾分也或加四圏原實一化為一萬分如法開之所得根數是一百分内之幾分也或加六圏原實一化為一百萬分如法開之所得根數是一千分内之幾分也如此遞加兩圏則多開得一位乃至加十圏原實一化為百億分其根數則十萬分内之幾萬幾千幾百幾十幾分也假如平方積八步開得二步除實四步餘四步不盡分秒幾何法于餘實下添兩圏則餘實四步化為四百分為次商之實依捷法以初商二步倍作四步為亷法列平方籌上為亷隅共法簡籌第八行積三八四小于餘實次商八分除實三百八十四分開得平方每面二步八分不盡一十六分再開之又于餘實下加兩圏則餘實一十六分化為一千六百秒為三商之實依捷法以初商次商共二步八分倍之得五步六分為亷法列平方籌上為亷隅共法簡籌第二行積一一二四小于餘實商作二秒除實一千一百二十四秒共開得平方每面二步八分二秒不盡四百七十六秒此單下開兩位式也所不盡之數不過百分之四若欲再開亦可得其忽㣲如後式還原以二步八二用籌為法又以二步八二列為實而自相乘之得七萬九千五百二十四分加不盡之分四百七十六共八萬乃以一萬分為一步之法除之當退四位仍得八步合原數解曰此以一步化為百分故其積萬分何也自乘者横一步直一步也今既以一步化為一百分則是横一百分直一百分而其積一萬分為一步假如平方九十步開得九步除實八十一步餘實九步不盡小分幾何法于餘實九步下加八圏則餘實九步化為九億共作五㸃而以第二㸃九億分為次商之實依捷法以初商九步倍作一十八步為亷法列平方籌上為亷隅共法簡籌第四行七三六略小于餘實商四千分除實七億三千六百萬分餘一億六千四百萬分為第三商之實第三㸃也又依捷法以初商次商九步又十之四倍之得一十八步八為亷法列平方籌上為亷隅共法簡籌第八行一五一四略小于餘實商八除實一億五千一百四萬餘一千二百九十六萬分為第四次商之實第四㸃也又依捷法以三次所商共九步四八倍之得一十八步九六為亷法列平方籌上為亷隅共法簡籌第六行一一三七九六略小于實商六除實一千一百三十七萬九千六百分餘一百五十八萬四百分為第五次商之實第五㸃也又依捷法以所商九步四八六倍之得一十八步九七二為亷法列平方籌上為亷隅共法簡籌第八行一五一七八二四略小于實商八除實一百五十一萬七千八百二十四分餘六萬二千五百七十六分不盡凡開得平方每面九步四千八百六十八分亦可名為四分八秒六忽八㣲不盡一之六二五七六即一萬分之六分有竒雖不盡不過萬分之一不足為損益可棄不用還原以九步四八六八用籌為法又為實自乘得八十九億九千九百九十三萬七千四百二十四分加入不盡之分六萬二千五百七十六共九十億以一億分為一步之法除之當退八位仍得九十步合原數解曰此以一步化為一萬分故其自乘之積一億何也自乘者横一步直一步之積也今既以一萬分為步則是横一萬分直一萬分而其積一億為一步若依命分法則還原不合如前例原實八步開得方二步除實四步不盡四步法當倍每方二步作四步又加隅一步為命分命為二步又五分步之四意若曰若得五步則商三步矣今只四步是五分内止得四分也然還原有不合何也以算明之用通分法以命分五通二步得一十分又加得分四共一十四分自乘得一百九十六為實以命分五自乘得二十五分為法每步通作五分横一步直一步則共得二十五分也除之得七步又二十五分之二十一以較原實少二十五之四以圖明之每步作五分其羃積二十五分方二步積四步共一百分又五之四以乘方二步得四十分倍之為亷積八十分又五之四自乘得隅積一十六分共九十六分以合原餘積四步該一百分少二十五分之四以此觀之實數每縮虛數常盈故命分之法不可以還原其故何也曰隅差也何以謂之隅差曰平方之有竒零其在兩亷者實其在隅者虛何也亷之虛者一面而隅之虛者兩面也即如二步五之四謂五分内虛一分故不能成一歩也然試觀于圖兩亷之四步皆虛一分横四分直五分積二十分以二十五分計之是為于五分之中虛一分而隅之一步虛一分有零横四分直亦四分積一十六分虛九分以二十五分計之是為五分之中虛二分弱則是邊數二步五之數者其積不及五之四也今餘積四步者實數也其邊數常盈于五之四有竒也而命之曰五之四宜其不及矣然則古何以設此法曰古率常寛以為所差者㣲故命之也不但此也古率圓一圍三方五斜七今考之皆有㣲差故曰寛也愚常考定開平方隅差之法法曰如法以命分之毋通其整而納其子即得分為全數以全數自相乘得數為通積另置分毋以分子減之餘數以乘分子而加之為實乃以分毋自乘為法除之即適還原數如上方二步五之四以分毋五通二步得十納子四共十四自乘得方積一百九十六分另以分子四減分毋五餘一以轉乘分子四得四即隅差也以隅差加入方積共二百分為實乃以分毋五自乘得二十五為法以除實得八步合原積又如後例原實九十步開得九步除實八十一步不盡九步法當倍每方九步作十八步又加隅一共十九步為命分命為九步又十九分步之九意若曰若得十九歩則加商一步成十步今只九步是十九分内只得九分也然還原亦不合以算明之用通分法以命分十九通九步得一百七十一步又加得分九共一百八十步自乘得三萬二千四百為實以命分十九自乘得三百六十一為法每步十九分横十九分直十九分共得三百六十一分也除之得八十九步又三百六十一分之二百七十一以較原實之九十步計少三百六十一分之九十分若依隅差之分以得分九減命分十九餘十轉乘得分得九十分為隅差以加自乘通積三萬二千四百共得三萬二千四百九十為實乃以命分自乘三百六十一為法除之恰得九十步合原積以圖明之甲戊丁庚形者方九步九分之總形也通為一百八十分積三萬二千四百分以三百六十一為步除之較原實少九十分内分甲丙乙巳形為初商方九步之形其積八千一歩戊乙形庚乙形次商亷積之形也長九步通為一百七十一分濶九分積一千五百三十九分兩亷共計三千七十八分丁乙者小隅者横直各九分以較亷積中每一步之形如丑乙欠一丁癸形即隅差也以積考之亷九步每步濶九分長一步通為十九分積一百七十一分隅濶九分長亦九分積八十一分少九十分為隅差立方法曰凡立方有餘實不能成一數不可開矣若必欲知其分秒則于餘實下加三圏原實一化為一千分如法開之所得根數是一十分之幾分也若加六圏原實一化為一百萬分所得根數是一百分之幾分也若加九圏原實一化為十億則根數是一千分之幾分也若加十二圏原實一化為萬億則根數是一萬分之幾分也解曰平方籌兩位故兩位作㸃而其化小分亦以兩位為率葢積多兩位則根數可多一位也亷一位隅一位故兩位立方籌三位故三位作㸃而其化小分亦以三位為率葢積多三位則根數可多一位也平亷一位長亷一位隅一位故三位假如立方積一十七步開得立方二步除八步餘實九步不盡法于餘實下加十二圈則餘實九步化為九萬億分増四㸃可加開四位依捷法截第二㸃九為次商之實以初商二自乘四而三之得一十二步為平亷法列立方籌上為平隅共法以初商二三而進位得六為長亷法列立方籌下簡共法籌第五行積六一二五小于實商五分六行七行亦小于實因無長亷積故不用乃以第五行平方二五與長亷法相乘得一五為長亷積以加共積共得七六二五是為次商五分之積以除實餘一三七五以俟三商又截取第三㸃一三七五為三商之實以初商次商共二步五分自乘得六二五而三之得一八七五為平亷法列立方籌上為平隅共法以初商次商二步五分三而進位得七五為長亷法列立方籌第七行一三一二八四三共法八四三小于實商七秒乃以第七行平方四九與長亷法相乘得三六七五為長亷積以加共積共得一三四九五九三為三商七秒之積以除實餘二五四七以候續商又截取第四㸃二五四七為四商之實以商數二五七自乘得六六四九而三之得一九八一四七為平亷法列立方籌上為平隅共法以商數二五七進位而三之得七七一為長亷法列立方籌下簡共法籌第一行一九八一四七一小于實商一忽乃以第一行平方一乘長亷得七七一為長亷積以加共積得一九八二二四一一為商一忽之積以除實餘五五八四五八九以候末商通第五㸃五五八四五八九為末商之實以商數二五七一自乘得六六一四一而三之得一九八三一二三為平亷法列立方籌上為平隅共法以商數二五七一進位而三之得七七一三為長亷法列立方籌下簡共法籌第二行三九六六二四六八小于實商二㣲乃以第二行平方四乘長亷法得三八五二為長亷積以加共積得三九六六三三三一二八為末商二㣲之積以減實餘一六一八二五五八七二不盡凡開得立方每面二步五分七秒一忽二㣲不盡之數不能成一㣲棄不用還原以二步五七一二用籌為法别以二步五七一二列為實以法乘實得六六一一六九四四再乘之得一十六萬九千九百八十三億八千一百七十四萬四千一百二十八分乃以不盡之積一十六億一千八百二十五萬五千八百七十二分加入再乘積共得一十七萬億以一萬億為一步之法以一步為萬分横一萬直一萬商一萬共一萬億除之得一十七步合原數若依命分法則還原不合如前所設立方積一十七步開得立方每面二步除積九步餘九步法當以立方二步自乘得四步而三之得十二步為平亷又以立方二步三之得六步為長亷又加一步為隅共一十九步為命分命為立方二步又十九分步之九意若曰餘積若滿十九步則加商一步矣今只有九步是以十九分為一步而今僅得九分也然還原則有不合以算明之用通分法以命分十九通立方二步得三十八分又加得分九共四十七分此即所云二步又十九分之九乃立方一面之數也以此自乘得二千二百九分再乘得一十萬三千八百二十三乃立方二步又十九分之九所容積數也為實别以命分十九自乘得三百六十一再乘得六千八百五十九乃方一步之積為法以除實得一十五步又六千八百五十九之九百三十八較原實一十七步少一步又六千八百五十九分之五千九百二十一其故何也曰長亷小隅之差也何以言之曰立方之有竒零其在平亷者實其在長亷小隅者虛何也平亷之虛者一面而長亷虛兩面小隅虛三面故也今以十九分為一步其立方積六千八百五十九分為步法以十九分除之得每三百六十一為分法平亷每步横十九分直十九分髙九分積三千二百四十九分法除之得九是為十九分之九適合命分之數也若長亷横九分直十九分髙九分積一千五百三十九分分法除之得四分有竒而已以較平亷九分之積三千二百四十九少一千七百一十分三長亷共六步共少一萬二百六十分步法除之得一步又三千四百一分為長亷差若小隅横直髙各九分積七百二十九分分法除之得二分有竒而已以較平亷九分之積三千二百四十九少二千五百二十分為隅差合亷隅兩差計之共少一步又六千八百五十九分之五千九百二十一以圖明之丑寅為立方一步之形每步通為十九分横直髙各十九分積六千八百五十九分是為步法以十九分除步法得三百六十一分是為分法亷隅總圖見左甲乙丙三平亷也縱横各方二步通為三十八分厚九分積一萬二千九百九十六分三亷共三萬八千九百八十八分丁戊巳三長亷也各長二步通為三十八分厚濶各九分積三千七十八分三亷共九千二百三十四分庚小隅也長濶髙皆九分積七百二十九分三長廉三平廉一小隅共包一正方形在内正方形縱横各二步通為三十八分積五萬四千八百七十二分總形方二步九分通為四十七分髙如之積一十萬三千八百二十三分以步法除之得一十五步有竒不滿原實一步又五千九百二十一分平亷方二步其容四步即辛壬癸子之分形也每步縱横皆一步通為十九分厚皆九分積三千二百四十九辛一形積如此壬癸子者同以分除之適得九分長亷長二步如丑寅合形通為三十八分厚九分皆與平亷同所不同者平亷濶十九分而長亷濶只九分故長亷二步尚不及平亷一步之積以積計之每長亷一步如丑形積一千五百三十九分較平亷每步之積如丑夘合形少一千七百一十分如丑之虛分夘三長亷計六步共少一萬二百六十分是為長亷之差小隅横直髙皆九分如未形于平亷一步之積不及四之一以積計之小隅之積七百二十九較平亷一步之積如未申合形少二千五百二十分如未之虛分申是為小隅之差合二差共一步五千九百二十一分今考定開立方亷隅差法法曰凡立方有命分者如法以分母即命分通其整而納以分子即得分為立方全數以全數自乘再乘得數為立方通積另置命分母數與得分子數各自乘得數以相減用其餘數以乘得分得數為隅差又置命分與得分相減用其餘數轉與得分相乘以乘命分得數是為長亷每步虛數又以長亷法乘之得數為長亷差合二差數以加通積為實以命分自乘再乘得數為法除之即適還原數如所設立方積十七步開得立方二步又十九分之九法以分母十九通立方二步而以分子九分納之共四十七分為立方全數以全數自乘再乘得一十萬三千八百二十三為通積另置命分十九自乘得三百六十一内減分子九自乘八十一餘二百八十分以分子九乘之得二千五百二十分為隅差又置命分一十九内減得分九餘十分轉乘得分九得九十分以乘命分十九得一千七百一十分為長亷每步虛數又以長亷法六步乘之得一萬二百六十分為長亷差合二差共一萬二千七百八十分以加通積共得一十一萬六千六百三分為實以命分一十九自乘再乘得六千八百五十九分為法以除實得一十七步合原積厯算全書卷三十三
